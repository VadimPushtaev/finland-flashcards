[tool.poetry]
name = "homebrew-video-assets"
version = "0.1.0"
description = "Isolated local media production tools for the Homebrew studio"
authors = ["Vadim Pushtaev"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
omnivoice = "0.2.1"
torch = "2.8.0"
torchaudio = "2.8.0"
supertonic = "1.3.1"
piper-tts = "1.8.0"
faster-whisper = "^1.2"
numpy = "^2.2"
soundfile = "^0.13"
scipy = "^1.17"
pillow = "^11.3"
matplotlib = "^3.10"
pyproj = "^3.7"
imageio-ffmpeg = "^0.6"
av = "^19.0"
requests = "^2.32"
pyyaml = "^6.0"
