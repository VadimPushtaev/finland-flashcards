    range_basis: normalized_html_block
    extracted_passage: Meddela bostadsaktiebolaget eller disponenten, i praktiken vanligtvis allra
      först fastighetsskötseln, om det finns ett sådant fel i din bostad vars åtgärdande åligger
      bostadsaktiebolaget.
    normalization: whitespace_only
