    range_basis: normalized_html_block
    extracted_passage: Hyra ut din bostad eller en del av den till en annan person.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0090:
    source_path: data/infofinland/content/housing/rights-and-obligations-of-occupants.html
    sha256: 9638d216cc3231d1cf9a62cfc24b2ced44f064765d0fbe368978c7c7b007f2f5
    source_block: b0038
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > ul:nth-of-type(2) > li:nth-of-type(3)
    source_kind: li
    source_role: content
    heading: Rättigheter och skyldigheter i en ägarbostad
    source_range:
      start: 0
      end: 540
    range_basis: normalized_html_block
    extracted_passage: Delta i stämmor och på dem påverka det som händer i bostadsaktiebolaget. På
      en stämma kan du rösta om olika saker och kräva att ett ärende tas upp för behandling på stämman.
      Bostadsaktiebolaget ska se till att husets konstruktioner, isolering, värmesystem, elledningar,
      vattenledningar och avlopp samt gårdsområden hålls i gott skick. På stämman fattas beslut om
      reparationer gällande dessa. I vissa bostadsaktiebolag har man beslutat att fördela ansvaret
      på ett annat sätt. I detta fall står det i bolagsordningen vem som ansvarar för vad.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0091:
    source_path: data/infofinland/content/housing/housing-in-finland.html
    sha256: 726d000d738867a1e8bf7776e54690ace2c6989fbe6742324b7a0fd7bf7d3c9b
    source_block: b0039
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(15) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Boendekostnader i Finland
    source_range:
      start: 0
      end: 343
    range_basis: normalized_html_block
    extracted_passage: 'För bostaden anges två priser i försäljningsannonsen: försäljningspriset
      och det skuldfria priset. Det verkliga totalpriset för bostaden är det skuldfria priset. Försäljningspriset
      anger för vilket belopp du kan köpa bostaden, men utöver det betalar du bostadsaktiebolagets
      lån med bolagsvederlaget, vilket kan höja boendekostnaderna avsevärt.'
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0092:
    source_path: data/infofinland/content/housing/housing-in-finland.html
    sha256: 726d000d738867a1e8bf7776e54690ace2c6989fbe6742324b7a0fd7bf7d3c9b
    source_block: b0040
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(15) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Boendekostnader i Finland
    source_range:
      start: 0
      end: 293
    range_basis: normalized_html_block
    extracted_passage: I ett bostadsaktiebolag är bolagsvederlaget oftast en stor kostnadspost. Bolagsvederlaget
      påverkas i synnerhet av bostadens storlek, renoveringar och huruvida bostadsaktiebolaget själv
      äger tomten. När du köper en bostad, ska du kontrollera om bolaget äger tomten eller om det
      är en hyrestomt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0093:
    source_path: data/infofinland/content/housing/buying-a-home.html
    sha256: a29f15667fa93eb058b51dcf96556419a9a79dab71e5a83a63985b04220011bc
    source_block: b0025
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(9) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Behöver du tillstånd när du ska köpa en fastighet?
    source_range:
      start: 0
      end: 193
    range_basis: normalized_html_block
    extracted_passage: Om du inte är medborgare i ett EU- eller EES-land och du ska köpa en fastighet
      med tillhörande tomt, behöver du vanligtvis ett tillstånd för detta. Ansök om tillståndet hos
      försvarsministeriet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0094:
    source_path: data/infofinland/content/housing/buying-a-home.html
    sha256: a29f15667fa93eb058b51dcf96556419a9a79dab71e5a83a63985b04220011bc
    source_block: b0026
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(9) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Behöver du tillstånd när du ska köpa en fastighet?
    source_range:
      start: 0
      end: 217
    range_basis: normalized_html_block
    extracted_passage: Om du ska köpa en bostadsaktie behöver du inget tillstånd. Du behöver inte
      heller något tillstånd om du ska köpa en fastighet tillsammans med din make eller maka eller
      sambo som är medborgare i ett EU- eller EES-land.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0095:
    source_path: data/infofinland/content/housing/buying-a-home.html
    sha256: a29f15667fa93eb058b51dcf96556419a9a79dab71e5a83a63985b04220011bc
    source_block: b0034
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(11) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Säljarens och köparens ansvar vid bostadsköp
    source_range:
      start: 0
      end: 267
    range_basis: normalized_html_block
    extracted_passage: Enligt lagen måste den som säljer bostaden berätta om de fel som han/hon känner
      till innan försäljningen av bostaden. Om det står klart att försäljaren har känt till fel i
      bostaden utan att berätta om detta för köparen, kan säljaren tvingas ersätta köparen för felet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0096:
    source_path: data/infofinland/content/housing/buying-a-home.html
    sha256: a29f15667fa93eb058b51dcf96556419a9a79dab71e5a83a63985b04220011bc
    source_block: b0038
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(11) > p:nth-of-type(6)
    source_kind: p
    source_role: content
    heading: Säljarens och köparens ansvar vid bostadsköp
    source_range:
      start: 0
      end: 279
    range_basis: normalized_html_block
    extracted_passage: Det kan också finnas dolda fel i bostaden. De är fel som ingen känner till.
      Dolda fel är ofta till exempel fuktproblem. Säljaren måste betala ut en ersättning till köparen
      ifall det i bostaden finns ett allvarligt fel, som skulle ha påverkat bostadsköpet ifall man
      känt till det.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0097:
    source_path: data/infofinland/content/housing/buying-a-home.html
    sha256: a29f15667fa93eb058b51dcf96556419a9a79dab71e5a83a63985b04220011bc
    source_block: b0059
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(18) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Överlåtelseskatt
    source_range:
      start: 0
      end: 247
    range_basis: normalized_html_block
    extracted_passage: När du köper en bostad måste du också betala överlåtelseskatt (varainsiirtovero).
      Om du köper en bostadsaktie är överlåtelseskatten 1,5 procent av bostadens skuldfria pris.
      Om du köper en fastighet är skatten 3 procent av bostadens skuldfria pris.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0098:
    source_path: data/infofinland/content/housing/buying-a-home.html
    sha256: a29f15667fa93eb058b51dcf96556419a9a79dab71e5a83a63985b04220011bc
    source_block: b0066
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(21) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Bostadsköp
    source_range:
      start: 0
      end: 287
    range_basis: normalized_html_block
    extracted_passage: Köpebrevet är ett kontrakt där t.ex. bostadens pris, bostadens storlek, bostadens
      skick och datumet då köparen får tillgång till bostaden finns inskrivet. Vanligen görs köpebrevet
      upp av banken eller bostadsförmedlaren. Köparen har rätt att läsa köpebrevet före dagen då
      köpet genomförs.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
