    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > ul:nth-of-type(2) > li:nth-of-type(1)
    source_kind: li
    source_role: content
    heading: Rättigheter och skyldigheter i en ägarbostad
    source_range:
      start: 0
      end: 181
    range_basis: normalized_html_block
    extracted_passage: Förvalta den bostad vars aktier du äger. Du får göra ändringar i din bostad.
      Tänk på att renoveringen inte får medföra olägenhet till bostadsaktiebolaget eller de andra
      aktieägarna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0089:
