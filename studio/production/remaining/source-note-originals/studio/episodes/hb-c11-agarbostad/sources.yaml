    source_range:
      start: 0
      end: 293
    range_basis: normalized_html_block
    extracted_passage: I förväg meddela till bostadsaktiebolagets disponent eller styrelse om du
      ska göra en sådan ändring i din bostad som kan påverka husets bärande konstruktioner, vattenledningar,
      fuktisolering, elledningar eller ventilationssystem. Till exempel ska en badrumsrenovering
      alltid meddelas i förväg.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0084:
