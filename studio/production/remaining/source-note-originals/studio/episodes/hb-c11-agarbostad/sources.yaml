    range_basis: normalized_html_block
    extracted_passage: Genomföra renoveringar på ett sådant sätt att bygganden inte tar skada. I
      Finland finns exakta bestämmelser till exempel om hurdant tätskikt ett badrum ska ha.
    normalization: whitespace_only
