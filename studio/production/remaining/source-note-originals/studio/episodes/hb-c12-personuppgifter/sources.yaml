    heading: En permanent adress och hemkommun
    source_range:
      start: 0
      end: 462
    range_basis: normalized_html_block
    extracted_passage: När Myndigheten för digitalisering och befolkningsdata registrerar dig en
      permanent adress, registrerar den dig som invånare på adressen tills vidare. Adressen gäller
      tills du gör en flyttanmälan till en annan adress. Samtidigt sparas för dig även en hemkommun
      i Finland. Hemkommunen kan vara en stor stad eller en liten kommun. Du behöver en hemkommun
      för att kunna använda tjänsterna som välfärdsområdet (hyvinvointialue) staden eller kommunen
      tillhandahåller.
    normalization: whitespace_only
