    heading: En del uppgifter överförs automatiskt mellan myndigheter, men ibland behöver myndigheten
      kundens tillstånd för att få uppgifter
    source_range:
      start: 0
      end: 630
    range_basis: normalized_html_block
    extracted_passage: I annat fall beror det på situationen vilka uppgifter myndigheterna kan få
      om en person från andra myndigheter. Behandlingen av personuppgifter och tillgången till information
      baserar sig alltid på lagstiftningen och myndighetens uppdrag. En myndighet har i allmänhet
      rätt att utan kundens separata samtycke få tillgång till sådana uppgifter som är nödvändiga
      för att fatta ett beslut i kundens ärende. Till exempel FPA kan från sysselsättningstjänsterna
      få information om kundens arbetssökning om hen har ansökt om arbetslöshetsförmåner. I andra
      fall måste myndigheten först be om kundens samtycke till utlämnande av uppgifterna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
