    source_range:
      start: 0
      end: 299
    range_basis: normalized_html_block
    extracted_passage: En myndighet har alltid rätt att få tillgång till endast sådana uppgifter
      om en person som den har laglig grund för att få. Även om en enskild tjänsteman skulle ha tillgång
      till uppgifterna om en person i myndighetens system, kan hen titta på dem endast om uppgifterna
      är nödvändiga för hens arbete.
