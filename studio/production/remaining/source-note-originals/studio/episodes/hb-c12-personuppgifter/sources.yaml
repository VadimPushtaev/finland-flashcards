    range_basis: normalized_html_block
    extracted_passage: Personbeteckningen är en individuell kod som ges till alla människor som registreras
      i Finlands befolkningsdatasystem. Registreringen baserar sig i allmänhet på att man bor i Finland
      eller har finskt medborgarskap.
