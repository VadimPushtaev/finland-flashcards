    heading: Personbeteckningen identifierar en person mer exakt än bara namnet
    source_range:
      start: 0
      end: 426
    range_basis: normalized_html_block
    extracted_passage: Personbeteckningen är mycket viktig i Finland, och en sådan krävs i så gott
      som alla myndighetsärenden. Ofta krävs en personbeteckning också till exempel för att hyra
      en bostad, skaffa ett telefonabonnemang och öppna ett bankkonto. Man ska inte i onödan ge ut
      sin personbeteckning till okända, eftersom det kan vara möjligt för kriminella att till exempel
      ansöka om lån i en annan persons namn med hjälp av personbeteckningen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
