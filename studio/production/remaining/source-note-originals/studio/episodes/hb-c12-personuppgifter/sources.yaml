    heading: En del uppgifter överförs automatiskt mellan myndigheter, men ibland behöver myndigheten
      kundens tillstånd för att få uppgifter
    source_range:
      start: 0
      end: 484
    range_basis: normalized_html_block
    extracted_passage: Befolkningsdatasystemet som upprätthålls av Myndigheten för digitalisering
      och befolkningsdata är ett basregister som används av Finlands myndigheter. Myndigheterna får
      i allmänhet basuppgifter, det vill säga namn, adress och hemkommun, om en person direkt från
      befolkningsdatasystemet. När det gäller barn får myndigheterna i allmänhet uppgifter om vem
      eller vilka som är barnets vårdnadshavare. Också till exempel bankerna får dessa basuppgifter
      direkt från befolkningsdatasystemet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
