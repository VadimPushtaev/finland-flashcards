    heading: Personbeteckningen identifierar en person mer exakt än bara namnet
    source_range:
      start: 0
      end: 685
    range_basis: normalized_html_block
    extracted_passage: Två personer kan aldrig ha samma personbeteckning. Med hjälp av personbeteckningen
      kan människor alltså identifieras, även om de skulle ha exakt samma namn och födelsedatum.
      När man en gång har fått en personbeteckning förblir den för alltid densamma, förutom i vissa
      undantagsfall. Även om man skulle flytta från Finland och bo utomlands i flera år eller årtionden,
      förblir personbeteckningen densamma. Med hjälp av personbeteckningen kan myndigheterna säkerställa
      att uppgifter kopplas till rätt person. Också många privata aktörer såsom banker använder personbeteckningen
      för att identifiera människor. Det underlättar överföringen av uppgifter mellan olika myndigheter
      och aktörer.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
