    heading: Registrering som invånare
    source_range:
      start: 0
      end: 491
    range_basis: normalized_html_block
    extracted_passage: När du får en personbeteckning blir du inte automatiskt registrerad som invånare
      i en viss kommun. Om du har fått personbeteckningen hos Migrationsverket (Maahanmuuttovirasto)
      eller skatteförvaltningen (Vero), måste du vanligtvis också registrera en tillfällig eller
      stadigvarande bostadsadress hos Myndigheten för digitalisering och befolkningsdata (Digi- ja
      väestötietovirasto). När du registrerar en stadigvarande adress och hemkommun, får du till
      exempel använda de kommunala tjänsterna.
    normalization: whitespace_only
