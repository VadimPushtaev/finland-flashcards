    extracted_passage: Man kan spara på miljön och resurserna också genom att ge bort eller sälja
      saker som man inte längre behöver. Till exempel kläder, möbler och fungerande hushållsapparater
      i bra skick kan säljas på fysiska loppmarknader eller loppmarknader på internet. De kan också
      doneras till en återvinningscentral eller en loppmarknad som drivs av en välgörenhetsorganisation.
