    heading: Att sortera och återvinna hushållets sopor är bra för naturen och sparar pengar
    source_range:
      start: 0
      end: 397
    range_basis: normalized_html_block
    extracted_passage: I Finland anser man att det är viktigt att människorna sparar på naturresurser
      och skyddar miljön. Därför sorteras hushållens sopor i olika avfallskärl på gårdarna eller
      vid återvinningsstationer för att sedan transporteras bort. Efter sorteringen kan avfallens
      material användas på nytt, vilket sparar naturresurser och pengar. Samtidigt minskar mängden
      avfall som förs till avstjälpningsplatsen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
