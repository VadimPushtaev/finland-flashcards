    range_basis: normalized_html_block
    extracted_passage: Om människorna sorterar avfallet fel blir avfallshanteringen långsammare,
      vilket orsakar extra avgifter för samhället. Alla människor måste betala dessa avgifter. Också
      husbolaget måste betala extra avgifter till avfallsbolaget om avfallet är dåligt sorterat eller
      avfall har lämnats bredvid sopkärlen. Detta påverkar storleken på vederlagen och hyrorna.
    normalization: whitespace_only
