    range_basis: normalized_html_block
    extracted_passage: De första skriftliga källorna om Finland är från 1100–1200-talen. Då anslöts
      Finlands territorium med hjälp av korståg till påven i Roms maktkrets och det medeltida nätverket
      av hansaköpmän.
    normalization: whitespace_only
