    heading: Under det svenska styret kom kristendomen och det svenska förvaltningssystemet till
      Finland
    source_range:
      start: 0
      end: 364
    range_basis: normalized_html_block
    extracted_passage: Under det svenska styret spred sig den katolska kristendomen till Finland.
      Finland var en del av det svenska riket i över 600 år. De förändringar, till exempel reformationen
      och upplysningen, som skedde i Sverige och övriga Europa under dessa århundraden syntes också
      i Finland. När Sverige låg i krig måste också Finland skicka soldater till de svenska trupperna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0006:
