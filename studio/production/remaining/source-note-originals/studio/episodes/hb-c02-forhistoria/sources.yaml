    range_basis: normalized_html_block
    extracted_passage: Finland har varit bebott sedan istiden, från cirka år 8800 före tideräkningen.
      Bosättningen utvecklades först vid vattendrag och det finländska territoriet har alltid använts
      för livlig handelstrafik. Namnet på Finlands äldsta stad, Åbo (Turku), betyder handelsplats.
    normalization: whitespace_only
