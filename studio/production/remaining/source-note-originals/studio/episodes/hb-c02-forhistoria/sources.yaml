    heading: Under det svenska styret kom kristendomen och det svenska förvaltningssystemet till
      Finland
    source_range:
      start: 0
      end: 305
    range_basis: normalized_html_block
    extracted_passage: Under det svenska styret fanns det på Finlands område människogrupper som
      kommit från olika håll vid olika tidpunkter. De levde i små samhällen och bildade inget enhetligt
      folk eller någon enhetlig stat. Sverige införlivade delar av det område som i dag kallas Finland
      med sitt rike under 1100–1300-talen.
    normalization: whitespace_only
    repairs: []
