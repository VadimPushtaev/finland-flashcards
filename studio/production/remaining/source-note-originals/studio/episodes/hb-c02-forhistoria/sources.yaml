      end: 266
    range_basis: raw_pdf_page
    extracted_passage: "I det medeltida Finland byggdes flera slott för att försvara området mot\
      \ ryssarna. Två av dem var \nTavastehus slott och Viborgs slott. Under medeltiden grundades\
      \ också de första städerna i Finland, \nbland annat Åbo och Borgå. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0007:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 11
    printed_page: 10
    source_range:
      start: 266
      end: 667
    range_basis: raw_pdf_page
    extracted_passage: "Innan kristendomen kom till Finland utövades här hednisk religion. Det var\
      \ en polyteistisk religion, \ndet vill säga människorna trodde på många gudar. Man tillbad\
      \ också avlidna och djur, till exempel \nbjörnen. I samhällena fanns siare, som botade sjuka\
      \ och tryggade en god skörd. I skogarna och på \nkärren fanns heliga platser där människor\
      \ offrade åt gudarna och dit de förde mat åt naturväsendena. \n"
    normalization: whitespace_only
    repairs: []
