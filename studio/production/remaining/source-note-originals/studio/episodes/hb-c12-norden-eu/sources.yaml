    heading: Nordisk medborgare
    source_range:
      start: 0
      end: 250
    range_basis: normalized_html_block
    extracted_passage: Om du är medborgare i ett nordiskt land och flyttar till Finland, behöver
      du inte ansöka om uppehållstillstånd eller motivera din vistelse i Finland. Du kan arbeta,
      driva ett företag eller studera i Finland med lika villkor som finländska medborgare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0128:
    source_path: data/infofinland/content/moving-to-finland/nordic-citizens.html
