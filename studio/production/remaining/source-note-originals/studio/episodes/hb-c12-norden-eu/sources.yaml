    source_kind: p
    source_role: content
    heading: Nordisk medborgare
    source_range:
      start: 0
      end: 199
    range_basis: normalized_html_block
    extracted_passage: De nordiska länderna är Finland, Sverige, Norge, Danmark och Island. Eftersom
      Åland hör till Finland och Färöarna och Grönland till Danmark, är även ålänningarna, färingarna
      och grönländarna nordbor.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0129:
    source_path: data/orientation/sv/laromedel/lag-och-ratt/uppehallstillstand-och-medborgarskap.html
    sha256: edce233ade78cd40cd16b10a0bdc1dafc917b572f5b72e04e4fd51860879fcf1
    source_block: b0013
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: När behövs ett uppehållstillstånd?
    source_range:
      start: 0
      end: 344
    range_basis: normalized_html_block
    extracted_passage: Nordiska medborgare får bo och arbeta i Finland utan uppehållstillstånd. Utöver
      Finland är de nordiska länderna Sverige, Norge, Danmark och Island. Om en nordisk medborgare
      vistas i Finland i över sex månader, ska hen personligen besöka servicestället för Myndigheten
      för digitalisering och befolkningsdata på sin hemort för att registrera sig.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0130:
    source_path: data/infofinland/content/moving-to-finland/nordic-citizens.html
    sha256: 334764efed09cdb84456ad61ec7a4df37c3aa2b99c2531a58c64402fe686b012
    source_block: b0006
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(4) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Nordisk medborgare
    source_range:
      start: 0
      end: 104
    range_basis: normalized_html_block
    extracted_passage: Gör registreringen så fort som möjligt, dock senast inom en månad efter att
      du har flyttat till Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0131:
    source_path: data/infofinland/content/moving-to-finland/nordic-citizens.html
    sha256: 334764efed09cdb84456ad61ec7a4df37c3aa2b99c2531a58c64402fe686b012
    source_block: b0017
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Familjemedlemmar till nordiska medborgare
    source_range:
      start: 0
      end: 210
    range_basis: normalized_html_block
    extracted_passage: Om en av dina familjemedlemmar, som flyttar med dig till Finland, inte är
      medborgare i ett nordiskt land, kan han/hon behöva uppehållstillstånd eller ett registreringsintyg
      över uppehållsrätt för EU-medborgare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0132:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens.html
    sha256: 6968414eaf3a42e672774326fab508ccd36359df93f99459411e80b3d54c6fab
    source_block: b0002
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(4)
    source_kind: div
    source_role: content
    heading: EU-medborgare
    source_range:
      start: 0
      end: 157
    range_basis: normalized_html_block
    extracted_passage: Om du är medborgare i ett EU-land behöver du inget uppehållstillstånd i Finland.
      Om du bor i Finland över tre månader, måste du registrera din uppehållsrätt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0133:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens.html
    sha256: 6968414eaf3a42e672774326fab508ccd36359df93f99459411e80b3d54c6fab
    source_block: b0008
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: EU-medborgare
    source_range:
      start: 0
      end: 275
    range_basis: normalized_html_block
    extracted_passage: Detsamma gäller medborgare i Schweiz och Liechtenstein. Du kan resa till Finland
      om du har ett giltigt ID-kort eller pass. Du har rätt att arbeta, driva ett företag och studera
      i Finland med lika villkor som finska medborgare. Du måste själv trygga din försörjning i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0134:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens.html
    sha256: 6968414eaf3a42e672774326fab508ccd36359df93f99459411e80b3d54c6fab
    source_block: b0009
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: EU-medborgare
    source_range:
      start: 0
      end: 251
    range_basis: normalized_html_block
    extracted_passage: Du kan vistas i Finland högst tre månader i sträck utan att registrera din
      uppehållsrätt. Om du vill stanna i Finland och registrera dig som invånare, måste du ha ett
      jobb eller ett aktivt företag, en studieplats, familjeband eller tillräckliga medel.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0135:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens.html
    sha256: 6968414eaf3a42e672774326fab508ccd36359df93f99459411e80b3d54c6fab
    source_block: b0010
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: EU-medborgare
    source_range:
      start: 0
      end: 410
    range_basis: normalized_html_block
    extracted_passage: Om du avser att bo i Finland i över tre månader, ska du ansöka om registrering
      av uppehållsrätten för EU-medborgare hos Migrationsverket (Maahanmuuttovirasto). Ansökan ska
      ställas senast inom tre månader från datumet för inresa. Om du är medborgare i ett nordiskt
      land (Island, Norge, Sverige och Danmark) räcker det med att du registrerar dina uppgifter
      hos Myndigheten för digitalisering och befolkningsdata.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0136:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens/registration-of-an-eu-citizens-right-of-residence.html
    sha256: 35db4f86b61680b81f9f4e25ca7a21519926fe4101c069f07052b0ccc86c050f
    source_block: b0021
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Hur ansöker jag?
    source_range:
      start: 0
      end: 205
    range_basis: normalized_html_block
    extracted_passage: Om du har en grund för din vistelse i Finland och förutsättningarna för vistelsen
      uppfylls, får du ett intyg över registreringen från Migrationsverket. Registreringen av uppehållsrätten
      gäller tillsvidare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0137:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens/registration-of-an-eu-citizens-right-of-residence.html
    sha256: 35db4f86b61680b81f9f4e25ca7a21519926fe4101c069f07052b0ccc86c050f
    source_block: b0022
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(5)
    source_kind: p
    source_role: content
    heading: Hur ansöker jag?
    source_range:
      start: 0
      end: 200
    range_basis: normalized_html_block
    extracted_passage: När du har bott i Finland lagligt och utan avbrott i fem år, kan du ansöka
      om permanent uppehållsrätt för EU-medborgare. Permanent uppehållsrätt för EU-medborgare ansöks
      separat från Migrationsverket.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0138:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens/registration-of-an-eu-citizens-right-of-residence.html
    sha256: 35db4f86b61680b81f9f4e25ca7a21519926fe4101c069f07052b0ccc86c050f
    source_block: b0064
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(9) > p:nth-of-type(11)
    source_kind: p
    source_role: content
    heading: Familjemedlem till en finsk medborgare
    source_range:
      start: 0
      end: 394
    range_basis: normalized_html_block
    extracted_passage: Om du är familjemedlem till en finsk medborgare ska du fylla i bilagan om
      utnyttjande av en finsk medborgares rätt till fri rörlighet. Utnyttjande av rätten till fri
      rörlighet innebär att din familjemedlem som är finsk medborgare har bott i ett annat EU-land
      eller ett land som jämställs med ett EU-land i minst tre månader utan avbrott. Under denna
      tid ska personen ha levt familjeliv med dig.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0139:
    source_path: data/infofinland/content/moving-to-finland/eu-citizens/registration-of-an-eu-citizens-right-of-residence.html
    sha256: 35db4f86b61680b81f9f4e25ca7a21519926fe4101c069f07052b0ccc86c050f
    source_block: b0066
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(9) > p:nth-of-type(12)
    source_kind: p
    source_role: content
    heading: Uppehållskort för en familjemedlem till en EU-medborgare
    source_range:
      start: 0
      end: 257
    range_basis: normalized_html_block
    extracted_passage: Om du inte själv är medborgare i ett EU-land, Liechtenstein, Schweiz, Norge
      eller Island, men du avser att flytta till Finland för att bo hos en familjemedlem som är EU-medborgare,
      måste du ansöka om uppehållskort för en familjemedlem till en EU-medborgare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
