    source_range:
      start: 0
      end: 412
    range_basis: normalized_html_block
    extracted_passage: Om någon upprepade gånger hotar eller trakasserar dig och du vill ha skydd,
      kan du ansöka om besöksförbud (lähestymiskielto) för denna person. Besöksförbudet innebär att
      personen inte får ta kontakt med dig. Du kan ansöka om besöksförbud hos polisen eller i tingsrätten.
      Du kan fråga om råd vid socialbyrån eller rättshjälpsbyrån i din hemkommun. Om du har bevis
      på hot och trakasserier är det bra att spara dem.
