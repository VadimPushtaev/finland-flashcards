    heading: På ett mödrahem kan man öva på livet med en baby
    source_range:
      start: 0
      end: 366
    range_basis: normalized_html_block
    extracted_passage: Ett mödrahem är en plats dit en mamma kan komma med sin baby om hon är i en
      svår livssituation eller om hon är helt ensam. Ett mödrahem är avsett främst för gravida mammor
      och mammor med små babyer. Också den andra föräldern eller mammans partner kan bo på mödrahemmet.
      På mödrahemmet får man i en trygg miljö öva på att ta hand om babyn och på vardagen med en
      baby.
    normalization: whitespace_only
    repairs: []
