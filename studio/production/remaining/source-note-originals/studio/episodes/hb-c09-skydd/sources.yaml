    heading: Till ett skyddshem kan man gå alltid när det inte är tryggt hemma
    source_range:
      start: 0
      end: 517
    range_basis: normalized_html_block
    extracted_passage: Ett skyddshem är ett ställe där personer som upplevt våld i nära relationer
      eller hot om sådant får hjälp och trygghet. En person kan gå till ett skyddshem om hen inte
      kan gå till sitt eget hem på grund av till exempel våld, hot eller rädsla. Skyddshemmet är
      hemlikt och har anställda på plats dygnet runt. De anställda hjälper till att lösa krisen.
      Ett skyddshem är avsett som ett tillfälligt ställe att bo på, men hur länge en person bor där
      beror på det individuella behovet. Skyddshemmens tjänster är avgiftsfria.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
