    source_kind: p
    source_role: content
    heading: Varför bör man ansluta sig till ett fackförbund?
    source_range:
      start: 0
      end: 348
    range_basis: normalized_html_block
    extracted_passage: På arbetsplatsen representeras fackförbundet och de anställda som är medlemmar
      i det av förtroendemannen. Förtroendemannen väljs av de anställda. Förtroendemannen agerar
      som förhandlare, medlare och informationsförmedlare mellan arbetsgivaren och anställda. Man
      kan också vända sig till förtroendemannen till exempel med frågor om kollektivavtalet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
