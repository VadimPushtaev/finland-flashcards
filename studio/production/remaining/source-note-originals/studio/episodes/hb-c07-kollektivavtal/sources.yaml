    heading: Förtroendemannen stöder och hjälper de anställda på arbetsplatsen
    source_range:
      start: 0
      end: 242
    range_basis: normalized_html_block
    extracted_passage: Alla arbetsplatser har inte en förtroendeman. I sådana fall kan de anställda
      välja en anställd till förtroendeombud eller söka stöd hos fackförbundet. Förtroendeombudet
      har inte lika omfattande uppgifter och befogenheter som en förtroendeman.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0121:
