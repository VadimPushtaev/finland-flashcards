    source_kind: p
    source_role: content
    heading: Medlemmar i fackförbund får hjälp vid problem i arbetet och vid jobbsökning
    source_range:
      start: 0
      end: 374
    range_basis: normalized_html_block
    extracted_passage: Fackförbunden bevakar sina medlemmars intressen. Om det uppstår problem i
      arbetet, ger fackförbundet stöd och hjälp. Fackförbundet kan hjälpa till exempel om en arbetstagare
      inte får den lön som hen har rätt till. Fackförbundet ger stöd också vid jobbsökning och arbetslöshet.
      Fackförbunden hjälper också sina medlemmar med att bilda nätverk och utveckla sin yrkeskompetens.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
