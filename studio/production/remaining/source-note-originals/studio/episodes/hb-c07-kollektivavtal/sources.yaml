    source_kind: p
    source_role: content
    heading: Förtroendemannen stöder och hjälper de anställda på arbetsplatsen
    source_range:
      start: 0
      end: 413
    range_basis: normalized_html_block
    extracted_passage: På stora arbetsplatser representeras fackförbundets medlemmar av en förtroendeman.
      Hen väljs i ett val bland de anställda. Förtroendemannen övervakar att arbetsgivaren följer
      kollektivavtalet och arbetslagstiftningen på arbetsplatsen. Förtroendemannens uppgift är att
      stödja och hjälpa de anställda och ingripa i problem. Förtroendemannen ser till att de anställda
      behandlas rättvist och jämlikt på arbetsplatsen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
