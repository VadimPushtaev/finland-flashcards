    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(55)
    source_kind: p
    source_role: content
    heading: Det är viktigt att arbetsgivaren känner till sina skyldigheter gentemot arbetstagaren
    source_range:
      start: 0
      end: 568
    range_basis: normalized_html_block
    extracted_passage: En arbetsgivare är vem som helst som anställer en annan person som arbetstagare.
      Det är viktigt att arbetsgivaren är medveten om den lagstiftning som gäller arbetet och om
      arbetsgivarens skyldigheter. Arbetsgivaren ska ta reda på om det finns ett allmänt bindande
      kollektivavtal som gäller för branschen. Föreskrifterna i ett allmänt bindande kollektivavtal
      om till exempel minimilöner ska följas, även om arbetsgivaren inte skulle höra till något arbetsgivarförbund.
      Det är också bra om arbetsgivaren berättar för den anställda om dennes skyldigheter och rättigheter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
