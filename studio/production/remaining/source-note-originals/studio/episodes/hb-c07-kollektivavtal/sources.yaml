    source_range:
      start: 0
      end: 312
    range_basis: normalized_html_block
    extracted_passage: Kollektivavtal är nästan alltid tidsbundna och gäller i några år i taget.
      Efter det omförhandlas avtalen. Kollektivavtal upprättas i samarbete mellan representanter
      för arbetsgivarna och arbetstagarna. I förhandlingarna deltar fackförbunden, som representerar
      arbetstagarna, och representanter för arbetsgivarna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
