    heading: I kollektivavtalen avtalas om löner och övriga arbetsvillkor inom olika branscher
    source_range:
      start: 0
      end: 379
    range_basis: normalized_html_block
    extracted_passage: Det är viktigt att den anställda vet vad kollektivavtal är. Kollektivavtal
      är avtal som upprättats i samarbete mellan arbetsgivar- och arbetstagarorganisationer. I dem
      avtalas om lönerna och övriga villkor inom olika branscher. Arbetsvillkor är till exempel arbetstider,
      raster och semestrar. På finska används ofta förkortningen TES för kollektivavtal, och på svenska
      ibland KA.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
