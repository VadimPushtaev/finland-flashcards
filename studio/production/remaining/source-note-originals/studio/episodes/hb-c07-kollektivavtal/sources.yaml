      > div:nth-of-type(5) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Varför bör man ansluta sig till ett fackförbund?
    source_range:
      start: 0
      end: 242
    range_basis: normalized_html_block
    extracted_passage: Fackförbundets medlemmar kan delta i utbildning och fritidsaktiviteter som
      förbundet ordnar. De får också stöd av förbundets förtroendeman vid konflikter på arbetsplatsen.
      Vid behov får man också råd eller förhandlingsstöd från fackförbundet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
