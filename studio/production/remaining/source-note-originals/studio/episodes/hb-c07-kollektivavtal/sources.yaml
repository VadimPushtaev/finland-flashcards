    range_basis: normalized_html_block
    extracted_passage: Syftet med kollektivavtalen är å ena sidan att garantera en miniminivå för
      arbetsvillkoren för arbetstagarna och å andra sidan arbetsfred. Med arbetsfred avses att arbetstagarna
      till exempel inte får gå i strejk för att kräva bättre lön medan ett kollektivavtal gäller.
