    range_basis: normalized_html_block
    extracted_passage: Den anställda kan i sitt eget arbetsavtal avtala om bättre arbetsvillkor än
      de som finns i branschens kollektivavtal. I arbetsavtalet kan man inte avtala om villkor som
      är sämre än i kollektivavtalet.
