    range_basis: normalized_html_block
    extracted_passage: I kollektivavtal avtalas ofta om bättre arbetsvillkor än vad som regleras
      i lag. Nästan alla branscher har ett eget kollektivavtal. Till exempel handeln, byggbranschen
      och restaurangbranschen har ett eget kollektivavtal. Kollektivavtalet måste följas.
    normalization: whitespace_only
