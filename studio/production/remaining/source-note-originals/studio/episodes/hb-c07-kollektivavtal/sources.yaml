    source_kind: p
    source_role: content
    heading: Fackförbund
    source_range:
      start: 0
      end: 334
    range_basis: normalized_html_block
    extracted_passage: Samma fackförbund omfattar vanligtvis personer inom samma bransch (till exempel
      sjuksköterskor) eller personer med samma utbildning (till exempel ingenjörer). Arbetstagarens
      rätt att höra till ett fackförbund kan inte begränsas med avtal. Det är straffbart att diskriminera
      arbetstagare på grund av deras medlemskap i ett fackförbund.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0123:
