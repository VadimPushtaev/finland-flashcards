    heading: Uppehållstillstånd till människohandelns offer
    source_range:
      start: 0
      end: 326
    range_basis: normalized_html_block
    extracted_passage: Om du har blivit offer för människohandel eller om det finns motiverade skäl
      att misstänka det, kan du beviljas uppehållstillstånd i Finland. Du måste vara i Finland för
      att kunna ansöka om uppehållstillstånd som människohandelns offer. Om du är i en speciellt
      sårbar ställning, kan du få ett kontinuerligt uppehållstillstånd.
    normalization: whitespace_only
    repairs: []
