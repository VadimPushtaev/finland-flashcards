    range_basis: normalized_html_block
    extracted_passage: Om du skiljer dig från din make/maka eftersom han/hon varit våldsam mot dig
      eller ditt barn, kan ditt uppehållstillstånd förlängas trots skilsmässan. Du ska lämna in en
      redovisning, exempelvis läkarintyg eller utlåtande från familjerådgivning. Bifoga även till
      ansökan om uppehållstillstånd din egen redovisning av situationen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0213:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/can-i-lose-my-residence-permit.html
    sha256: 0e23ffe8128941778a3b125ac1655cf37ba4ba12f2fcdfb864a0ddfc4937355d
    source_block: b0061
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(11) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Har du blivit utsatt för arbetsgivarens utnyttjande och betydande försummelse?
    source_range:
      start: 0
      end: 583
    range_basis: normalized_html_block
    extracted_passage: Om du redan har uppehållstillstånd i Finland och du har fallit offer för arbetsgivarens
      utnyttjande, kan du ansöka om fortsatt tillstånd eller intyg om utvidgad rätt att arbeta på
      grund av arbetsgivarens utnyttjande. Ansök om fortsatt tillstånd på grund av arbetsgivarens
      utnyttjande, om ditt nuvarande uppehållstillstånd ska utgå och du inte har en ny arbetsgivare.
      Ansök om intyg på grund av arbetsgivarens utnyttjande om du har ett giltigt uppehållstillstånd
      och en ny arbetsgivare. Med hjälp av intyget eller det fortsatta tillståndet kan du arbeta
      inom vilken bransch som helst.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
