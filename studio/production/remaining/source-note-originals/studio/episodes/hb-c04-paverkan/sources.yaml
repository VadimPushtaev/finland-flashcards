    range_basis: normalized_html_block
    extracted_passage: Delaktighet är förknippad med upplevelsen av att man får skapa och dela det
      gemensamma bästa och njuta av det tillsammans med andra. Det gemensamma bästa kan vara till
      exempel gemensamma utrymmen och en trivsam livsmiljö, konst eller i ett större perspektiv samhället
      och tjänsterna det erbjuder. En människa kan bidra till att skapa det gemensamma bästa genom
      att till exempel arbeta och betala skatt. Hen kan också delta i frivilligverksamhet eller till
      exempel ansvara för husbolagets gemensamma blomrabatt, som skänker alla som bor i grannskapet
