    source_range:
      start: 0
      end: 587
    range_basis: normalized_html_block
    extracted_passage: En demonstration är när en skara människor samlas för att offentligt uttrycka
      sin åsikt i en fråga. En demonstration kan till exempel understödja eller motsätta sig ett
      nytt lagförslag. I en demonstration kan endast några människor delta eller så kan det vara
      en massdemonstration med tusentals deltagare. En demonstration kan vara ett tåg eller så kan
