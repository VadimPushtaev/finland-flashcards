    range_basis: normalized_html_block
    extracted_passage: För din utländska arbetstagare gäller samma anställningsvillkor, arbetssäkerhetskrav
      och lagstadgade försäkringar som på dina finländska arbetstagare.
    normalization: whitespace_only
