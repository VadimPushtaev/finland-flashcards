    source_kind: p
    source_role: content
    heading: Anställning av utländsk arbetstagare
    source_range:
      start: 0
      end: 471
    range_basis: normalized_html_block
    extracted_passage: Om en arbetstagare kommer från ett land utanför EU eller EES, måste hen ha
      rätt att arbeta i Finland. När du anställer en utländsk arbetstagare ska du säkerställa att
      hens rätt att arbeta gäller under hela anställningstiden. Förvara grunden för och övriga uppgifter
      om din utländska arbetstagares rätt att arbeta i fyra års tid efter att anställningen har upphört.
      Uppgifterna måste finnas på arbetsplatsen så att arbetarskyddsmyndigheterna vid behov kan kontrollera
      dem.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
