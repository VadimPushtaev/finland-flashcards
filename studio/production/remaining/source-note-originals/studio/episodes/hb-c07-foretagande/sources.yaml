      end: 261
    range_basis: normalized_html_block
    extracted_passage: Storleken av försäkringspremierna och pensionen beror på hur stor förvärvsinkomst
      (työtulo) förtagaren har. Arbetsinkomstens storlek påverkar förutom arbetspensionen också direkt
      din sociala trygghet om du blir sjuk eller arbetslös eller ska vara föräldraledig.
