    source_range:
      start: 0
      end: 497
    range_basis: normalized_html_block
    extracted_passage: Pensionsförsäkringen tryggar företagarens utkomst då företagsverksamheten
      upphör på grund av invaliditet eller ålder och den ger företagarens anhöriga ett familjepensionsskydd
      efter att företagaren har dött. Pensionsförsäkringar fås antingen genom försäkringsbolag eller
      pensionskassor (eläkekassa). Teckna en pensionsförsäkring senast när det har gått sex månader
      sedan du startade företagsverksamheten. En ny företagare får en rabatt på 22 procent på pensionspremierna
      under de fyra första åren.
    normalization: whitespace_only
    repairs: []
