    source_kind: p
    source_role: content
    heading: Inkomstrelaterad dagpenning (ansiopäiväraha)
    source_range:
      start: 0
      end: 286
    range_basis: normalized_html_block
    extracted_passage: Om du vill få inkomstrelaterat utkomstskydd för arbetslösa, ska du ansluta
      dig som medlem i företagarnas arbetslöshetskassa (yrittäjien työttömyyskassa). Om din företagsverksamhet
      upphör, kan du ansöka om inkomstrelaterad dagpenning (ansiosidonnainen päiväraha) vid arbetslöshetskassan.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0275:
    source_path: data/infofinland/content/work-and-enterprise/starting-a-business-in-finland/entrepreneurs-social-security.html
    sha256: f4f86ed80a466874edf7441327f40f512ecc01ae158fc98d478a3017a5fe5e5a
    source_block: b0018
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Inkomstrelaterad dagpenning (ansiopäiväraha)
    source_range:
      start: 0
      end: 408
    range_basis: normalized_html_block
    extracted_passage: Du kan få inkomstrelaterad dagpenning från företagarnas arbetslöshetskassa
      om du har bedrivit företagsverksamhet och varit medlem i kassan tillräckligt länge innan du
      blev arbetslös. Den inkomstrelaterade dagpenningen är större än grunddagpenningen eller arbetsmarknadsstödet.
      Hur stor inkomstrelaterad dagpenning du får beror på hur stora förvärvsinkomster du angett
      som grund för arbetslöshetsförsäkringen.
