    heading: Beskattning
    source_range:
      start: 0
      end: 473
    range_basis: normalized_html_block
    extracted_passage: Skatter betalas på de inkomster som företagaren eller företaget har kvar när
      alla kostnader för företagsverksamheten har dragits av försäljningen. Företagets skatter betalas
      på basis av de beskattningsbara inkomsterna, vars belopp man uppskattar på förhand. Uppskattningen
      baseras på beloppet av de beskattningsbara inkomsterna året innan. I ett nytt företag uppskattar
      företagaren själv storleken av den beskattningsbara inkomsten och meddelar denna till skattmyndigheten.
    normalization: whitespace_only
    repairs: []
