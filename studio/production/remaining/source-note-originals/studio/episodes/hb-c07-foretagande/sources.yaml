    source_kind: p
    source_role: content
    heading: Företagarens utkomstskydd för arbetslösa
    source_range:
      start: 0
      end: 422
    range_basis: normalized_html_block
    extracted_passage: Också en företagare kan ha rätt till arbetslöshetsförmåner, om hen är arbetslös
      och registrerad som arbetssökande. En företagare är arbetslös när hen har lagt ned sin företagsverksamhet
      eller sålt sin andel av företaget. Företagandet kan också upphöra om företaget säljs, avvecklas,
      går i konkurs, försätts i likvidation eller på grund av skilsmässa. Företagandet kan också
      upphöra om du inte längre arbetar för företaget.
    normalization: whitespace_only
    repairs: []
