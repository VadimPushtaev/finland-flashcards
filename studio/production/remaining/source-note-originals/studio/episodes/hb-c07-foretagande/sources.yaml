    source_kind: p
    source_role: content
    heading: Yrkessjukdoms- och arbetsolycksfallsförsäkring
    source_range:
      start: 0
      end: 230
    range_basis: normalized_html_block
    extracted_passage: Som arbetsgivare måste du teckna en yrkessjukdoms- och arbetsolycksfallsförsäkring
      för dina anställda. Detta ska alltid göras när en anställning börjar. Arbetstagaren kan få
      ersättning om hen råkar ut för ett olycksfall i arbetet.
    normalization: whitespace_only
