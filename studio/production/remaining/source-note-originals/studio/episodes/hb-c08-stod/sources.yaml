    heading: Skoldagens längd varierar mellan olika årskurser
    source_range:
      start: 0
      end: 387
    range_basis: normalized_html_block
    extracted_passage: I de lägre årskurserna är skoldagarna kortare än i de högre. I årskurserna
      1–6 får eleverna 20–25 timmar undervisning i veckan. I årskurserna 7–9 är timantalet per vecka
      i genomsnitt 29–30 timmar. Mellan lektionerna tar man pauser, det vill säga raster. En lektion
      är i allmänhet 45 minuter lång. Mellan lektionerna har man 15–30 minuter långa raster, som
      eleverna tillbringar på skolan.
