    heading: Om skolvägen är lång har barnet rätt att få skolskjuts
    source_range:
      start: 0
      end: 518
    range_basis: normalized_html_block
    extracted_passage: När barnet går i grundskolan och har kort skolväg kan hen ända från början
      vanligtvis gå, cykla eller ta bussen på egen hand. Om vägen är längre, har elever inom förskoleundervisningen
      och den grundläggande utbildningen rätt till avgiftsfri skolskjuts, som ordnas av kommunen.
      En elev har rätt till skolskjuts till exempel om den dagliga sträckan mellan skolan och hemmet
      är över fem kilometer. Skolskjutsen är taxi- eller busstransport. Elevens vårdnadshavare ska
      ansöka om rätt till avgiftsfri skolskjuts hos skolan.
