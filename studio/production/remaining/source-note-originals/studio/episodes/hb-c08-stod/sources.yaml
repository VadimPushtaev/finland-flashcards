    heading: Personer med funktionsnedsättning får stöd för skolgång och studier
    source_range:
      start: 0
      end: 657
    range_basis: normalized_html_block
    extracted_passage: Barn med funktionsnedsättning har rätt att gå i en närskola och få de stödåtgärder
      de behöver för sin skolgång. Stödåtgärderna kan vara hjälpmedel, en personlig assistent eller
      en tolk. Undervisningen kan också individualiseras, vilket betyder att man sätter upp egna,
      individuella mål för det handikappade barnets lärande som kan avvika från den allmänna läroplanen.
      Man kan också besluta att ett barn med funktionsnedsättning ska omfattas av förlängd läroplikt.
      Förlängd läroplikt betyder att barnet börjar skolan redan som 6-åring. För barnet fattas vid
      behov ett beslut om särskilt stöd (IP) som beskriver barnets behov av stöd och skolans stödåtgärder.
    normalization: whitespace_only
