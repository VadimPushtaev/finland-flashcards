    range_basis: normalized_html_block
    extracted_passage: I Finland samarbetar hemmen och skolorna på många olika sätt. I skolorna ordnas
      föräldramöten och dagar med öppet hus, då föräldrar och vårdnadshavare har möjlighet att ta
