      eller inlärningssvårighet. Om en elev behöver stöd, utreds hens situation tillsammans med eleven,
      vårdnadshavarna, skolan och sakkunniga. Vårdnadshavarnas samarbete med läraren är viktigt för
      att stödet ska kunna säkerställas.
