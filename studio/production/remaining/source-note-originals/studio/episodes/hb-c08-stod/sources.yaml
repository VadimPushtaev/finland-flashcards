    heading: Förberedande undervisning
    source_range:
      start: 0
      end: 446
    range_basis: normalized_html_block
    extracted_passage: När barnet deltar i undervisning som förbereder för grundläggande utbildning
      får hen ett individuellt studieprogram. I studieprogrammet antecknas vilka läroämnen barnet
      ska studera och i vilket tempo. Studieprogrammet utarbetas av skolans studiehandledare, barnets
      klasslärare, specialklasslärare eller lärare i finska som andra språk. De kan också utarbeta
      studieprogrammet tillsammans. De tar hänsyn till barnets kunskaper och tidigare studier.
    normalization: whitespace_only
    repairs: []
