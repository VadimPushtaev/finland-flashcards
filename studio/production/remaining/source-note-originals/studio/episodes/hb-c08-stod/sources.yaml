    heading: Personer med funktionsnedsättning får stöd för skolgång och studier
    source_range:
      start: 0
      end: 515
    range_basis: normalized_html_block
    extracted_passage: I Finland kan studerande med funktionsnedsättning studera på vanliga läroanstalter
      med andra studerande inom till exempel integrationsutbildning, samhällsorientering eller olika
      utbildningar som leder till en examen. De kan vid behov studera också på specialläroanstalter,
      till exempel specialyrkesläroanstalter. På Dövas folkhögskola ordnas integrationsutbildning
      för hörselskadade. På Tillgänglighetsbiblioteket Celia finns läroböcker i form av talböcker
      för grundskolan, gymnasiet och yrkesstudier samt högskola.
