    range_basis: normalized_html_block
    extracted_passage: I Finland har ett skolår 190 skoldagar. Skolåret, det vill säga läsåret, är
      indelat i två delar, en hösttermin och en vårtermin. Höstterminen börjar omkring mitten av
      augusti och slutar med en julfest före jul. Efter det har eleverna jullov. Vårterminen börjar
      i början av januari och slutar i början av juni. Vårterminen avslutas med skolavslutning, där
      eleverna och lärarna firar att läsåret är slut och sommaren börjar.
    normalization: whitespace_only
    repairs: []
