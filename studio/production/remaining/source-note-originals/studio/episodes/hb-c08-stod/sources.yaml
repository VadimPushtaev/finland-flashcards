    heading: Inom elevhandledningen får eleven stöd för studierna och vägledning i valet av fortsatta
      studier
    source_range:
      start: 0
      end: 504
    range_basis: normalized_html_block
    extracted_passage: I skolan får eleverna elevhandledning. Inom handledningen får eleven stöd
      för studierna och försöker man förebygga att problem uppstår i dem. Syftet med elevhandledningen
      är dessutom att vägleda eleverna i valet av fortsatta studier. Handledning i studiefärdigheter
      och valet av fortsatta studier ges i olika skeden av den grundläggande utbildningen för hela
      klasser eller en enskild elev i taget. Elevhandledaren, som är en lärare specialiserad på handledningsarbete,
      håller lektioner i elevhandledning.
    normalization: whitespace_only
    repairs: []
