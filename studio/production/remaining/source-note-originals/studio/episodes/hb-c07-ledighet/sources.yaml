      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(17)
    source_kind: p
    source_role: content
    heading: I semesterlagen regleras semesterlöner och semesteruttag
    source_range:
      start: 0
      end: 294
    range_basis: normalized_html_block
    extracted_passage: Huvudregeln är att största delen av semestern ska tas ut under sommarsemesterperioden,
      det vill säga mellan maj och september. Ibland upphör ett anställningsförhållande så att den
      anställda inte hinner ta ut alla intjänade semesterdagar. Då får hen ekonomisk ersättning för
      de outtagna dagarna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0152:
    source_path: data/orientation/sv/laromedel/arbete/lagar-och-regler-i-arbetet.html
    sha256: 19003751f0719094eefb25104e459249cfca5e8e3e2ad54ae2b5e5326653e6a5
    source_block: b0074
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(26)
    source_kind: p
    source_role: content
    heading: Sjukfrånvaro ska alltid meddelas till arbetsgivaren
    source_range:
      start: 0
      end: 295
    range_basis: normalized_html_block
    extracted_passage: Man får aldrig vara borta från arbetet utan grundad anledning. Om en anställd
      blir sjuk, ska hen genast informera arbetsgivaren om det genom att ringa eller följa arbetsplatsens
      rutiner. Varje arbetsplats har egna regler för hur många dagar en person kan vara borta från
      arbetet utan läkarintyg.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0153:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
    source_block: b0007
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Semester och ledighet
    source_range:
      start: 0
      end: 199
    range_basis: normalized_html_block
    extracted_passage: När du arbetar i Finland har du laglig rätt till semester. Du får semesterlön
      under din semester. Dessutom kan du få semesterpenning, så kallad semesterpremie, om detta
      föreskrivs i kollektivavtalet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0154:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
    source_block: b0008
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Semester och ledighet
    source_range:
      start: 0
      end: 338
    range_basis: normalized_html_block
    extracted_passage: I olika livssituationer kan du också få ledigt från jobbet enligt lag. Sådana
      situationer är till exempel graviditet, barnets födelse, vård av ett litet barn och sjukdom
      hos ett litet barn. Tanken bakom lagstiftningen om detta har varit att ge människorna möjligheter
      att studera och utveckla sig och säkerställa människornas arbetshälsa.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0155:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
    source_block: b0011
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Semester
    source_range:
      start: 0
      end: 149
    range_basis: normalized_html_block
    extracted_passage: Du tjänar in semester om du arbetar minst 14 dagar eller 35 timmar i månaden.
      Om du arbetar mindre, har du rätt till ledighet och semesterersättning.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0156:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
    source_block: b0012
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Semester
    source_range:
      start: 0
      end: 512
    range_basis: normalized_html_block
    extracted_passage: Antalet semesterdagar beräknas under perioden 1 april–31 mars (t.ex. 1.4.2024–31.3.2025).
      Längden på din anställning påverkar hur många semesterdagar du tjänar in per kalendermånad.
      Om du till exempel börjar på ett nytt jobb den 1 maj och din anställning endast varar sex månader,
      tjänar du in två semesterdagar per arbetsmånad, alltså 12 semesterdagar. Detta förutsätter
      att du har arbetat minst 14 dagar eller 35 timmar per månad. Fråga din arbetsgivare eller fackförbundet
      om det exakta antalet semesterdagar.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0157:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
    source_block: b0014
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Semester
    source_range:
      start: 0
      end: 269
    range_basis: normalized_html_block
    extracted_passage: Semesterperioden är 2 maj–30 september. Normalt måste man ta sommarsemestern
      under den här perioden. De flesta människorna i Finland tar semester i juli. Meddela din arbetsgivare
      när du vill ta din semester. Arbetsgivaren är dock den som bestämmer när semester kan tas.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0158:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
    source_block: b0015
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(5)
    source_kind: p
    source_role: content
    heading: Semester
    source_range:
      start: 0
      end: 228
    range_basis: normalized_html_block
    extracted_passage: Under semestern får du semesterlön. Arbetsgivaren ska samtidigt ge dig en
      lönespecifikation av semesterlönen. Om din anställning upphör, har du rätt att få semesterersättning
      för semester eller ledighet som du inte har tagit ut.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0159:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
