    range_basis: normalized_html_block
    extracted_passage: Den anställda tjänar in en viss mängd ledighet som hen får lön för. Denna
      ledighet kallas semester. I semesterlagen regleras semesterlönen och semesterersättningarna
      och hur semestern får tas ut.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0150:
