    source_kind: p
    source_role: content
    heading: Obetald ledighet
    source_range:
      start: 0
      end: 171
    range_basis: normalized_html_block
    extracted_passage: Om du vill ta ut obetald ledighet (palkaton vapaa) av andra skäl än vård av
      barn eller studier ska du komma överens om detta med din arbetsgivare. Ingå avtalet skriftligt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0160:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/holidays-and-leaves.html
    sha256: 9ee0298cbdadbafe516bf2e2bb1abcab9023515cda6cc4648dc300df5772e80f
    source_block: b0020
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(9) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Obetald ledighet
    source_range:
      start: 0
      end: 132
    range_basis: normalized_html_block
    extracted_passage: Arbetsgivaren har rätt att neka till obetald ledighet. Och vice versa – din
      arbetsgivare kan inte tvinga dig att ta ledigt utan lön.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0294:
    source_path: data/infofinland/content/health/support-during-illness.html
    sha256: 888116d4a45dc03ebb0cea5573368626ed7e4a24eb4a1f9bb7c9f23bc72244c3
