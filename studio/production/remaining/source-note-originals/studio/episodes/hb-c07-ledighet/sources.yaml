    source_kind: p
    source_role: content
    heading: Stöd när du är sjuk
    source_range:
      start: 0
      end: 199
    range_basis: normalized_html_block
    extracted_passage: Självrisktiden är vanligen den dag då du insjuknade och därpå följande nio
      vardagar. Om din anställning har varat över en månad före insjuknandet betalar din arbetsgivare
      full lön för självrisktiden.
    normalization: whitespace_only
    repairs: []
    selection: Keep first two complete sentences establishing nine weekdays and employer sick-pay
      condition; detailed FPA duration/application rules remain in10.
  hb-c07-u0295:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/occupational-health-and-illness.html
    sha256: 3615c56ee8a40794dd2f24306053507954408367e9c3e91fdb8e118dbc7b9b68
    source_block: b0021
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Lön under sjukdomstiden
    source_range:
      start: 146
      end: 380
    range_basis: normalized_html_block
    extracted_passage: Om du inte kan återvända till arbetet efter dessa dagar kan du ansöka om sjukdagpenning
      hos Kela, om du är sjukförsäkrad i Finland. Arbetsgivare kan betala lön också för en längre
      period. Sjukdagpenningens belopp beror på din inkomst.
    normalization: whitespace_only
    repairs: []
    selection: Keep all sentences after the opening sick-pay sentence; its unqualified nine days
      is replaced immediately before this passage by support-during-illness nine weekdays wording.
  hb-c07-u0162:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/occupational-health-and-illness.html
    sha256: 3615c56ee8a40794dd2f24306053507954408367e9c3e91fdb8e118dbc7b9b68
    source_block: b0022
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Lön under sjukdomstiden
    source_range:
      start: 0
      end: 180
    range_basis: normalized_html_block
    extracted_passage: I kollektivavtalet kan det finnas andra bestämmelser om arbetsgivarens skyldighet
      att betala lön för sjukdomstiden. Kontrollera detta i kollektivavtalet eller hos ditt fackförbund.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0163:
    source_path: data/infofinland/content/work-and-enterprise/during-employment/occupational-health-and-illness.html
    sha256: 3615c56ee8a40794dd2f24306053507954408367e9c3e91fdb8e118dbc7b9b68
    source_block: b0027
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(10) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: När ett barn insjuknar
    source_range:
      start: 0
      end: 395
    range_basis: normalized_html_block
    extracted_passage: Om ett barn yngre än tio år insjuknar akut kan en av barnets föräldrar stanna
      hemma för att ta hand om barnet. Om du måste stanna hemma för att ta hand om ett sjukt barn
      ska du utan dröjsmål meddela detta till din chef. Vårdledigheten kan vara högst fyra dagar.
      I kollektivavtalet bestäms om du får lön för denna tid eller inte. Om branschen inte har ett
      kollektivavtal behöver lön inte betalas.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
