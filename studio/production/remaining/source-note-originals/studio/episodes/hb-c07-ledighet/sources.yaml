    source_kind: p
    source_role: content
    heading: I semesterlagen regleras semesterlöner och semesteruttag
    source_range:
      start: 0
      end: 370
    range_basis: normalized_html_block
    extracted_passage: Semesterns längd och lönen för semestertiden beror på hur länge anställningsförhållandet
      har varat och hurdant antal arbetstimmar den anställda har. I heltidsarbete tjänar man in minst
      2,5 dagar semester per månad när anställningsförhållandet har varat i ett år. Om anställningsförhållandet
      har varat i mindre än ett år, tjänar man in minst två dagar semester per månad.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0151:
    source_path: data/orientation/sv/laromedel/arbete/lagar-och-regler-i-arbetet.html
    sha256: 19003751f0719094eefb25104e459249cfca5e8e3e2ad54ae2b5e5326653e6a5
    source_block: b0062
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
