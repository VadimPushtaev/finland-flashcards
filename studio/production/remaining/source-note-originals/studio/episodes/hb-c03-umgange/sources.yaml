    heading: Alla är lika mycket värda i köer
    source_range:
      start: 0
      end: 495
    range_basis: normalized_html_block
    extracted_passage: När man i Finland till exempel besöker en läkare eller en myndighet, eller
      handlar i en affär måste man ofta stå i kö. På många ställen används system med könummer. När
      människorna ställer sig i kö tar de en lapp från en apparat. Allas ärenden sköts i nummerordning.
      Även om inga könummer används, väntar människorna på sin tur i den ordning de ställde sig i
      kö. Ett undantag är sjukhusens jour, där läkaren avgör i vilken ordning patienterna ska få
      vård. De mest akuta fallen får vård snabbast.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
