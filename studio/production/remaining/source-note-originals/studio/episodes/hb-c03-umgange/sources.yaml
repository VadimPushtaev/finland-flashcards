    heading: Att ta i hand vittnar om förtroende och jämställdhet
    source_range:
      start: 0
      end: 461
    range_basis: normalized_html_block
    extracted_passage: Handskakning används inte bara när man presenterar sig, utan också för att
      bekräfta avtal eller som ett tecken på att en tvist är löst. Genom att skaka hand kan man uttrycka
      förtroende och respekt för den andra. Handskakning är i Finland ett så etablerat sätt att hälsa
      och också bekräfta avtal att om någon vägrar att ta i hand kan det göra att den andra blir
      förvånad eller sårad. Att vägra skaka hand med en person av ett annat kön kan betraktas som
      oartigt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
