    range_basis: normalized_html_block
    extracted_passage: Att gå före i kön anses mycket oartigt, eftersom idén är att alla som köar
      är lika mycket värda. Om någon går före höjer hen sig över de andra och anser att de gemensamma
      reglerna inte gäller hen.
    normalization: whitespace_only
