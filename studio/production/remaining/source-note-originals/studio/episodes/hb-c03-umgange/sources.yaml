    range_basis: normalized_html_block
    extracted_passage: Att hälsa med en kram har under de senaste åren blivit vanligare bland vänner
      och bekanta. Kramen är ofta snabb och lätt. Kindpussar brukar man inte ge i Finland.
    normalization: whitespace_only
