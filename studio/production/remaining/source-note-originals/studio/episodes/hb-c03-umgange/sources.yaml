    heading: Punktlighet är att respektera andra
    source_range:
      start: 0
      end: 486
    range_basis: normalized_html_block
    extracted_passage: Punktlighet är viktig i Finland liksom i många andra länder i Nordeuropa.
      Människor förväntas komma i tid till avtalade möten. Möten börjar vanligtvis exakt på den angivna
      tiden. Det anses oartigt att komma för sent. Uppfattningen är att en person är respektlös mot
      den andra och slösar hens tid genom att komma för sent till ett avtalat möte. I Finland är
      man också i övrigt mycket medveten om klockslag och tidens gång. Ibland kan människor skynda
      sig och stressa över tiden i onödan.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
