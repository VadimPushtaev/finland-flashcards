    heading: Att ta i hand vittnar om förtroende och jämställdhet
    source_range:
      start: 0
      end: 336
    range_basis: normalized_html_block
    extracted_passage: När man hälsar i Finland ser man varandra i ögonen och tar ofta varandra i
      hand. Om den andra är obekant kan man samtidigt presentera sig, med andra ord säga sitt namn.
      Att skaka hand hänger också samman med jämställdhet och likabehandling, det vill säga i Finland
      tar alla alla i hand, och det är inte viktigt vem som tar i hand först.
    normalization: whitespace_only
    repairs: []
