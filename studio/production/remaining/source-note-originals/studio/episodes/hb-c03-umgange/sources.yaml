    heading: Anspråkslöshet
    source_range:
      start: 0
      end: 242
    range_basis: normalized_html_block
    extracted_passage: Många finländare uppskattar anspråkslöshet. Människor framhäver sig inte i
      gruppen, de talar inte högljutt och skryter inte. I Finland anses det vara välartat att ta
      hänsyn till och lyssna på andra. Också arbetsamhet och flit värdesätts högt.
    normalization: whitespace_only
    repairs: []
