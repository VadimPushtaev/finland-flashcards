    heading: Alla är lika mycket värda i köer
    source_range:
      start: 0
      end: 329
    range_basis: normalized_html_block
    extracted_passage: Också i övrigt är likvärdighet viktig för människorna i Finland. I sederna
      och bruken tar den sig uttryck i bland annat det faktum att det i Finland inte längre är vanligt
      att säga ni. Människor tilltalas för det mesta med förnamnet, också chefer och lärare. Människor
      i ledande ställning ges ganska lite särbehandling i Finland.
    normalization: whitespace_only
    repairs: []
