    range_basis: normalized_html_block
    extracted_passage: I Finland ska man alltid på förhand komma överens om besök hos andra, även
      hos goda vänner. Finländare lägger speciellt stort värde på sitt privatliv och sitt eget lugn.
    normalization: whitespace_only
