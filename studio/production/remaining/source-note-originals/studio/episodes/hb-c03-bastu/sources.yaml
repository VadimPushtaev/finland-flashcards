    range_basis: normalized_html_block
    extracted_passage: I den kalla Norden var bastun ofta det första man byggde när människorna flyttade
      till nya områden. Förutom för att bada har man också fött barn i bastun och använt den för
      olika slags ritualer. Bastun har varit en helig plats, vilket återspeglas på bastuupplevelsen
      än idag.
