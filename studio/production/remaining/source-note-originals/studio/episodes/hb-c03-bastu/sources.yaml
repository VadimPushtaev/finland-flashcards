    heading: Att bada bastu är avkopplande för kroppen och sinnet
    source_range:
      start: 137
      end: 478
    range_basis: normalized_html_block
    extracted_passage: Många olika traditioner är förknippade med uppvärmningen av bastun och bastubadandet.
      Bastubad är en del av mångas högtidsfirande, till exempel jul eller midsommar. Lika väl är
      bastun någonting vardagligt. Det är vanligt att egnahemshus och bostäder har en egen bastu.
      I höghus kan det finnas en gemensam bastu, där man kan boka en bastutid.
    normalization: whitespace_only
    repairs: []
