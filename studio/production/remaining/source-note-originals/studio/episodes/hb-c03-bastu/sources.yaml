    heading: Att bada bastu är avkopplande för kroppen och sinnet
    source_range:
      start: 0
      end: 435
    range_basis: normalized_html_block
    extracted_passage: Att bada bastu är för många som bor i Finland en viktig del av både vardag
      och fest. Bastutraditionen är en så viktig del av kulturen att den har upptagits på Unescos
      lista över mänsklighetens immateriella kulturarv. I bastun tvättar man sig, kopplar av och
      tillbringar tid med vänner, släktingar eller arbetskamrater. I Finland badar kvinnor och män
      i allmänhet var för sig. Om man badar tillsammans kan man använda baddräkt i bastun.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
