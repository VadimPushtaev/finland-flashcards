    source_range:
      start: 0
      end: 299
    range_basis: normalized_html_block
    extracted_passage: I simhallar och många allmänna bastur finns separata bastur för män och kvinnor.
      I simhallar får man inte gå in i bastun med simbyxorna eller baddräkten på. Om du vill, kan
      du använda en handduk. I många blandbastur använd simbyxor eller baddräkt. I en blandbastu
      bastar män och kvinnor tillsammans.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
