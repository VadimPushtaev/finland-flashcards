    heading: I Finland finns rådgivning, vårdtjänster och hobbyer för att främja hälsa
    source_range:
      start: 0
      end: 550
    range_basis: normalized_html_block
    extracted_passage: I Finland är det lätt att hitta information om hur man främjar sin hälsa och
      sitt välbefinnande till exempel på internet, biblioteken, hos läkaren eller olika hälsoorganisationer.
      Dessutom erbjuder välfärdsområdena och olika organisationer och företag många olika slags vårdtjänster,
      motionsgrenar, välbefinnanderådgivning och kostrådgivning samt olika kulturtjänster. De hjälper
      folk att hålla sig friska och må bra. För barn är skolan en viktig uppväxtmiljö som ger deras
      vardag struktur och där de också lär sig att främja hälsa och välbefinnande.
    normalization: whitespace_only
    repairs: []
