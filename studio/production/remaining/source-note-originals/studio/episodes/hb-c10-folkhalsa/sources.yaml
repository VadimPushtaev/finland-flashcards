    heading: Vaccinationer
    source_range:
      start: 0
      end: 441
    range_basis: normalized_html_block
    extracted_passage: I Finland kan barnen vaccineras (rokotus) mot många smittsamma sjukdomar.
      Vaccinationerna ges på barnrådgivningen (lastenneuvola) och inom skolhälsovården. De vaccinationer
      som ingår i vaccinationsprogrammet är avgiftsfria för familjen. Vaccinationerna är frivilliga.
      De flesta barn i Finland får de vaccinationer som ingår i vaccinationsprogrammet. Berätta för
      hälsovårdaren vilka vaccinationer ditt barn har fått innan ni kom till Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c10-u0049:
