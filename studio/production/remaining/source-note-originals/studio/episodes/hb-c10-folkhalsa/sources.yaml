    heading: Kostnadsfria vaccinationer i Finland
    source_range:
      start: 0
      end: 229
    range_basis: normalized_html_block
    extracted_passage: I Finland finns ett vaccinationsprogram, enligt vilket alla barn erbjuds kostnadsfria
      vaccinationer mot fler livsfarliga sjukdomar. Vaccinationer erbjuds mot bland annat polio,
      stelkramp, difteri, kikhosta, mässling och påssjuka.
