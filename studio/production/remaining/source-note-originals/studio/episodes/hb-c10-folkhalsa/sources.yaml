    range_basis: normalized_html_block
    extracted_passage: En frisk människa klarar av att göra sådant i sitt liv som är meningsfullt
      för hen, till exempel studera, utöva hobbyer, arbeta eller ha ett socialt liv. Om en människa
      blir sjuk eller skadar sig allvarligt kan hen ofta bli tvungen att ge upp sådant som är viktigt
      för hen. En människa kan ändå uppleva att hen är handlingskraftig och välmående, trots att
      hen har en långvarig sjukdom. Om sjukdomen behandlas, kan människan leva ett gott liv trots
      sjukdomen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
