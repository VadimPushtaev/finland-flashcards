    heading: Syftet med screening är att upptäcka sjukdom i ett tidigt skede
    source_range:
      start: 0
      end: 319
    range_basis: normalized_html_block
    extracted_passage: Människornas hälsa observeras också med hjälp av screeningar. En screening
      är en undersökning där man letar efter tecken på allvarlig sjukdom. Exempel på sådana sjukdomar
      kan vara till exempel livmoderhalscancer, bröstcancer eller tarmcancer. Behandlingsresultaten
      blir bättre när sjukdomar upptäcks i ett tidigt skede.
