    range_basis: normalized_html_block
    extracted_passage: En frisk människa mår bra fysiskt, psykiskt och socialt. Hen klarar av uppgifterna
      och utmaningarna i det dagliga livet. Hälsa betyder inte bara att en människa inte har någon
      sjukdom. Det är människans förmåga att fungera i vardagen.
