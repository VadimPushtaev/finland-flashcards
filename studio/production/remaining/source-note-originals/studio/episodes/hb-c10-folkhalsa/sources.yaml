    range_basis: normalized_html_block
    extracted_passage: Det finländska välfärdssamhället ser på många sätt till att människor håller
      sig så friska som möjligt. För det har det stiftats lagar i syfte att främja medborgarnas hälsa.
      Ett exempel är tobakslagen, som begränsar tobaksrökning på offentliga platser. Rökning är ohälsosam
      och orsakar sjukdomar för rökarna själva och för dem som är tvungna att andas in tobaksröken.
