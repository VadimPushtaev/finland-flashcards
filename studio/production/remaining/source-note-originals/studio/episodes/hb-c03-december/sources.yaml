    extracted_passage: Julen är årets viktigaste fest i Finland. Då minns man Jesu födelse i kyrkan.
      Den egentliga dagen för firandet är julafton den 24 december. Många skaffar sig en julgran
      som pyntas. Julklapparna delas oftast ut på julafton. Till den finländska julen hör många slags
      festmat, såsom julskinka, rosoll som är en rödbetssallad, olika slags lådor, julstjärnor och
      pepparkakor. På julen sjunger man julsånger och umgås med familjen och andra nära och kära.
    normalization: whitespace_only
