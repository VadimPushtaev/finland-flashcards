    range_basis: normalized_html_block
    extracted_passage: Svenska språket är släkt med till exempel tyskan och engelskan. Därför kan
      en del som redan kan dessa språk bra uppleva att det är lättare att lära sig svenska än finska.
      På många arbetsplatser behövs kunskaper i både finska och svenska, och ibland kan det vara
      nödvändigt att lära sig båda språken.
    normalization: whitespace_only
