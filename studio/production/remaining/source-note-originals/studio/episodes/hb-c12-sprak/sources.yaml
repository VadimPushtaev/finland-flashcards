    heading: Man kan integrera sig på finska eller svenska
    source_range:
      start: 0
      end: 346
    range_basis: normalized_html_block
    extracted_passage: I Finland är det möjligt att integrera sig på antingen finska eller svenska.
      Valet av språk för integrationen beror på den nyanländas situation. I största delen av Finland
      talar majoriteten av människorna finska och största delen av arbetsplatserna är finskspråkiga.
      En del kommuner är tvåspråkiga och i en del kommuner talar majoriteten svenska.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
