    source_kind: p
    source_role: content
    heading: Integration på svenska
    source_range:
      start: 0
      end: 532
    range_basis: normalized_html_block
    extracted_passage: I en del kommuner kan du delta i integrationsutbildning på svenska. Om du
      inte blir antagen till integrationsutbildning på svenska kan du i vissa fall få stöd för frivilliga
      studier i svenska, om detta har avtalats i din integrationsplan (kotoutumissuunnitelma). Fråga
      om integration på svenska när din bedömning av kompetens och behovet av integrationstjänster
      (kotoutumisen palvelutarpeen ja osaamisen arviointi) och integrationsplan upprättas. Enligt
      lag har du rätt att välja antingen finska eller svenska som integrationsspråk.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
