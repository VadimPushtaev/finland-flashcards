    range_basis: normalized_html_block
    extracted_passage: Att integrera sig på svenska kan vara ett bra alternativ om man bor i en kommun
      med många svensktalande invånare eller där det finns svenskspråkiga arbetsplatser, eller om
      familj och vänner talar svenska. Det kan vara bra att hela familjen väljer samma integrationsspråk,
      så att det till exempel är lättare för föräldrarna att stödja barnens skolgång.
    normalization: whitespace_only
    repairs: []
