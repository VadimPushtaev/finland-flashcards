    source_kind: p
    source_role: content
    heading: I vissa fall kan en myndighet ordna en tolk
    source_range:
      start: 0
      end: 275
    range_basis: normalized_html_block
    extracted_passage: I Finland garanterar språklagen rätt för alla att använda finska eller svenska
      hos nationella myndigheter. Hos lokala myndigheter har man rätt att använda finska eller svenska
      i tvåspråkiga kommuner eller välfärdsområden. Många myndigheter erbjuder service också på engelska.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
