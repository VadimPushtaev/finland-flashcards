    heading: Hatbrott är brott vars motiv är hat mot en människogrupp
    source_range:
      start: 0
      end: 506
    range_basis: normalized_html_block
    extracted_passage: Vilket brott som helst kan vara ett hatbrott. Det väsentliga är av vilken
      orsak brottet har begåtts. Ett hatbrott kan alltså vara till exempel misshandel, ärekränkning
      eller skadegörelse. Till exempel om någon krossar fönstren på en bil för att bilens ägare hör
      till en annan religion än skadegöraren, är det fråga om ett hatbrott. Egendomen behöver inte
      vara verklig, utan skadegörarens antagande om ett offer räcker. Om ett brott är ett hatbrott
      kan man få ett strängare straff än annars för samma brott.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
