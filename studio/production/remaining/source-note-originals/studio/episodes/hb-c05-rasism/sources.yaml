    heading: Hatbrott är brott vars motiv är hat mot en människogrupp
    source_range:
      start: 0
      end: 352
    range_basis: normalized_html_block
    extracted_passage: Vid ett hatbrott blir en människa, en grupp, en egendom, en institution eller
      en representant för dessa utsatt för ett brott på grund av en omständighet som förknippas med
      dem. Omständigheten kan vara till exempel etniskt ursprung, könsidentitet eller funktionsnedsättning.
      Motivet till hatbrottet är ofta en fördom eller hat mot en viss människogrupp.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
