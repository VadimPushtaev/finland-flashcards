    heading: Rasism och mikroaggressioner i interaktion
    source_range:
      start: 0
      end: 571
    range_basis: normalized_html_block
    extracted_passage: Rasism som dyker upp i interaktion kan visa sig i form av till exempel rop,
      öknamn, gester, utestängning, användning av rasistiska begrepp eller uttryck, eller mikroaggressioner.
      Mikroaggressioner är till exempel frågor eller kommentarer om utseende eller beteende som kan
      vara oavsiktliga och välmenande, men som ändå stärker och upprätthåller rasistiska eller diskriminerande
      stereotyper. De upprätthåller idén om att en person avviker från normen, det vill säga från
      hurdan en person som befinner sig i en viss ställning eller som talar ett visst språk förväntas
      vara.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c05-u0072:
