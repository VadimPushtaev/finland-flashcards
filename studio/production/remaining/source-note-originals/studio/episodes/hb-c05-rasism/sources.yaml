    heading: Strukturell rasism
    source_range:
      start: 0
      end: 642
    range_basis: normalized_html_block
    extracted_passage: Strukturell rasism är rasism som uppstår i samhällets och olika institutioners
      praxis, strukturer och regler. Den kan förekomma till exempel i arbetslivet och inom utbildning
      och tjänster. Strukturell rasism kan synas i form av diskriminerande handlingar, men också
      som tillvägagångssätt och processer som antingen direkt eller indirekt diskriminerar vissa
      människogrupper. Strukturell rasism kan visa sig också i till exempel vitsar eller reklaminslag.
      Ofta är det inte lätt att identifiera strukturell rasism, utan den kan vara omedveten. Det
      är inte alltid fråga om enskilda handlingar, utan om ett större fenomen som berör hela samhället.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
