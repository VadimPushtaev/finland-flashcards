    heading: I det finländska samhället förekommer rasism på många olika nivåer
    source_range:
      start: 0
      end: 345
    range_basis: normalized_html_block
    extracted_passage: Rasism är en tankemodell där människogrupper definieras som mindre värda på
      basis av till exempel ursprung, hudfärg, nationalitet, modersmål eller religion. Rasistiska
      attityder kan ta sig uttryck i medvetna handlingar och ord, men de kan också vara omedvetna
      tankemodeller som styr beteendet. Rasism definieras på olika sätt i olika sammanhang.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
