    source_kind: p
    source_role: content
    heading: Internaliserad rasism och minoritetsstress
    source_range:
      start: 0
      end: 385
    range_basis: normalized_html_block
    extracted_passage: Rasism är alltid fel, även om den inte skulle uppfylla kännetecknen för diskriminering
      eller brott. Man kan ta upp beteende eller praxis som skapar ojämlikhet till exempel på arbetsplatsen
      med chefen, på läroanstalten med en lärare eller inom myndighetstjänster med myndigheten i
      fråga. Olika organisationer erbjuder också stödtjänster eller kamratstöd för personer som upplevt
      rasism.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
