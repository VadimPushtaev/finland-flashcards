    range_basis: normalized_html_block
    extracted_passage: Enligt finsk lag måste arbetsgivaren ordna förebyggande företagshälsovård
      för alla arbetstagare. Arbetsgivaren måste informera dig om vilka tjänster du får via företagshälsovården.
      Avtalet om företagshälsovård ska finnas tillgängligt på din arbetsplats. Där kan du kontrollera
      vilka tjänster du får via företagshälsovården. Anställningens längd och form har ingen betydelse.
      Syftet med företagshälsovården är att främja arbetstagarnas hälsa, arbetsförmåga och säkerhet
      på arbetsplatsen. Företagshälsovårdens tjänster är kostnadsfria för arbetstagarna.
