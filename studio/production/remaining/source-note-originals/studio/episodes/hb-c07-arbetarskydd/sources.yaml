    range_basis: normalized_html_block
    extracted_passage: På arbetsplatsen sörjer också arbetarskyddsfullmäktigen för arbetarskyddet.
      Hen väljs i ett val bland de anställda. Arbetarskyddsfullmäktigen har till uppgift att regelbundet
      övervaka faktorer som påverkar de anställdas säkerhet och hälsa på arbetsplatsen, informera
      arbetsgivaren om missförhållanden som hen upptäcker och representera de anställda i frågor
