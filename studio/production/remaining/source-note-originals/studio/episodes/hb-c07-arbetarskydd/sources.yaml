    extracted_passage: Den anställda måste få utbildning i rätt arbetssätt och en genomgång av sådant
      som rör arbetssäkerheten. På arbetsplatsen ska det finnas tydliga anvisningar i händelse av
      olycksfall eller olyckor. Alla anställda måste veta hur de ska agera i sådana situationer.
