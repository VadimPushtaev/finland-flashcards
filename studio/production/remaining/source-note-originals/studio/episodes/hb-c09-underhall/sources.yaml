      start: 0
      end: 338
    range_basis: normalized_html_block
    extracted_passage: Om barnet har två föräldrar, bär båda föräldrarna ansvaret för barnets underhåll,
      även om de inte bor tillsammans. När föräldrarna skiljer sig måste de komma överens om barnets
      underhåll samt om eventuellt underhållsbidrag (elatusapu). Den förälder som inte bor med barnet
      betalar underhållsbidrag till den förälder hos vilken barnet bor.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
