    heading: Underhållsbidrag
    source_range:
      start: 0
      end: 587
    range_basis: normalized_html_block
    extracted_passage: Underhållsbidragets belopp beräknas utifrån barnets underhållsbehov och föräldrarnas
      underhållsförmåga. Med barnets underhållsbehov avses det penningbelopp som försörjningen av
      barnet kostar varje månad. I beloppet ingår till exempel utgifter för mat och kläder samt eventuella
      avgifter för småbarnspedagogik. Barnets underhållsbehov delas mellan föräldrarna enligt deras
      underhållsförmåga. Underhållsförmågan beräknas genom att dra av skatter och övriga obligatoriska
      utgifter av inkomsterna. Du kan be barnatillsyningsmannen (lastenvalvoja) om hjälp med att
      beräkna underhållsbidraget.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
