    heading: Arbetspensionens belopp beräknas utifrån löneinkomsterna
    source_range:
      start: 0
      end: 461
    range_basis: normalized_html_block
    extracted_passage: Största delen av pensionerna är arbetspensioner. Arbetspensionens belopp baserar
      sig på de pensionsförsäkringsavgifter som man betalat på sin lön. En del av försäkringsavgifterna
      betalas av arbetstagaren och en del av arbetsgivaren. Pensionens belopp påverkas av bland annat
      lönens nivå och antalet arbetsår. Arbetspensionen betalas av en arbetspensionsanstalt. Också
      företagare kan få arbetspension, men de måste betala sina pensionsförsäkringsavgifter själva.
    normalization: whitespace_only
