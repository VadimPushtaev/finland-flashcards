    range_basis: normalized_html_block
    extracted_passage: En person kan arbeta även om hen är pensionerad. Arbete som utförs när man
      är pensionär ökar arbetspensionens belopp. Som pensionär kan man arbeta deltid eller heltid.
      Om en person har invalidpension får hen arbeta endast i begränsad utsträckning. Om arbetsinkomsterna
