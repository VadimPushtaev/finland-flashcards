    heading: Invalidpension kan betalas antingen på hel- eller deltid
    source_range:
      start: 0
      end: 354
    range_basis: normalized_html_block
    extracted_passage: Om en person inte längre kan arbeta på grund av en sjukdom eller skada, kan
      hen få invalidpension från en arbetspensionsanstalt. Det kan man få redan före den officiella
      pensionsåldern. Invalidpensionen kan vara full eller partiell. Partiell invalidpension innebär
      att personen arbetar deltid. Hens inkomster består då av dels en lön och dels en pension.
    normalization: whitespace_only
