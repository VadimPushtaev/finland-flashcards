    heading: Det är möjligt att få pension för arbete som utförts utomlands
    source_range:
      start: 0
      end: 390
    range_basis: normalized_html_block
    extracted_passage: En person kan tjäna in pension i alla de länder där hen har bott och arbetat.
      I allmänhet tjänar man in pension genom att arbeta. I en del länder kan man ansöka om pension
      med samma blankett som man ansöker om pension i Finland. En del länders pensioner söks å andra
      sidan direkt hos pensionsanstalterna i länderna i fråga. På skattedeklarationen måste också
      pensioner från utlandet uppges.
    normalization: whitespace_only
