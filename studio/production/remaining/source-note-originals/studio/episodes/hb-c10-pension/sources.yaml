    range_basis: normalized_html_block
    extracted_passage: Om en pensionär flyttar utomlands, måste hen alltid anmäla det till FPA. Finska
      pensioner kan på vissa villkor fås till utlandet. Det är bra att i förväg ta reda på om villkoren
      uppfylls. Likaså kan en person i vissa fall ansöka om pension i Finland när hen går i pension
