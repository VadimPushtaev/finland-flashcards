    source_range:
      start: 0
      end: 383
    range_basis: normalized_html_block
    extracted_passage: När du har pensionerats kan du få pensionärsrabatt till exempel på tåg-, buss-
      och flygresor i Finland. De som fyllt 65 år får reserabatt genom att uppvisa sitt identitetsbevis.
      En pensionär som inte har fyllt 65 år kan få rabatt genom att uppvisa sitt personbevis och
      sitt arbetspensionskort eller folkpensionärskort. Kontrollera villkoren för pensionärsrabatten
      på biljettkontoren.
