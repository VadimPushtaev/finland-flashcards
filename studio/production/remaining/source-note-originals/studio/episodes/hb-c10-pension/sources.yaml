    heading: Partiell förtida ålderspension
    source_range:
      start: 0
      end: 612
    range_basis: normalized_html_block
    extracted_passage: Om du har fyllt 61 eller 62 år kan du få partiell pension redan före din lägsta
      ålderspensionsålder. Åldersgränsen för pension beror på vilket år du är född. Detta kallas
      partiell förtida ålderspension. Du kan själv välja om du vill ta ut 25 procent eller 50 procent
      av beloppet på din månatliga arbetspension. Om du vill kan du samtidigt fortsätta arbeta heltid
      eller komma överens om en kortare arbetstid med arbetsgivaren. Du kan också sluta arbeta. Du
      bör observera att den partiella förtida ålderspensionen permanent minskar beloppet på den slutliga
      ålderspensionen. Du kan fråga mer av din pensionsanstalt.
