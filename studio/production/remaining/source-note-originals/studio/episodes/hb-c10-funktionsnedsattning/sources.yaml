    heading: Hjälpmedel
    source_range:
      start: 0
      end: 501
    range_basis: normalized_html_block
    extracted_passage: Om det måste göras ändringsarbeten eller installeras fasta hjälpmedel i din
      bostad kan du få ersättning för detta. Bostaden kan till exempel byggas om så att du kan röra
      dig med en rullstol i den. Fasta hjälpmedel kan till exempel vara olika typer av lyftanordningar
      samt brandvarnare och dörrklocka för personer med hörselnedsättning, där ljudet har ersatts
      med lampor. Socialarbetaren inom funktionshinderservicen i ditt område bedömer tillsammans
      med dig om det behövs ändringsarbeten i din bostad.
