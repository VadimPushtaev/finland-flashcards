    heading: Nyanlända med funktionsnedsättning kan ha rätt till olika tjänster
    source_range:
      start: 0
      end: 459
    range_basis: normalized_html_block
    extracted_passage: De inledande utmaningarna i Finland för en invandrare med funktionsnedsättning
      hänger ofta samman med att hen inte vet hurdana tjänster som finns tillgängliga, var hen ska
      ansöka om dem och hur de ska användas. Om personen har ett uppehållstillstånd och en hemkommun
      i Finland, har hen rätt till olika tjänster som välfärdsområdet och kommunen tillhandahåller,
      till exempel tjänster för personer med funktionsnedsättning, det vill säga funktionshinderservice.
