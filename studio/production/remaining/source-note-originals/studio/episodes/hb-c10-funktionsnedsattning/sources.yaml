    heading: Man kan få tolkning för till exempel arbete eller ärenden
    source_range:
      start: 0
      end: 515
    range_basis: normalized_html_block
    extracted_passage: En person med en hörselskada, syn- och hörselskada eller en talskada kan få
      en tolkningstjänst för arbete, studier, hobbyer eller ärenden. Rätt till tolkningstjänst för
      personer med funktionsnedsättning söks hos FPA. Av hemkommunen kan man få tolkningstjänster
      för småbarnspedagogik, för förskoleundervisning och för grundläggande undervisning. Det är
      gratis att använda en tolk om man beviljats rätt att använda en tolkningstjänst för personer
      med funktionsnedsättning. Den som behöver en tolk beställer den själv.
