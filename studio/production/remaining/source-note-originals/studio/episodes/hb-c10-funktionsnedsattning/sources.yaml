      end: 376
    range_basis: normalized_html_block
    extracted_passage: Största delen av välfärdsområdenas social- och hälsovårdstjänster är riktade
      till alla invånare i välfärdsområdet. Välfärdsområdena är också skyldiga att erbjuda personer
      med funktionsnedsättning särskilda tjänster för personer med funktionsnedsättning. Funktionshinderservicen
      stöder en jämlik delaktighet i samhället och underlättar vardagslivet med en funktionsnedsättning.
