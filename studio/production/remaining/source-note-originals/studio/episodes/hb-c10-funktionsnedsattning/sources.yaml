    heading: Syftet med rehabilitering är att förbättra arbetsförmågan och förmågan att klara sig
      i vardagen
    source_range:
      start: 0
      end: 654
    range_basis: normalized_html_block
    extracted_passage: Om en person har en grav funktionsnedsättning eller en svår sjukdom kan hen
      få rehabilitering. I Finland kan både barn och vuxna få rehabilitering. Rehabilitering erbjuds
      både personer med funktionsnedsättning och deras familjer. Rehabiliteringen är ledd verksamhet
      och kan vara till exempel en rehabiliteringskurs eller olika typer av vård som ges av en yrkesperson,
      till exempel fysioterapi, psykoterapi, talterapi eller ergoterapi. Det är möjligt att få en
      tolk för rehabiliteringskurser. Syftet med rehabiliteringen är att personen trots sin sjukdom
      eller funktionsnedsättning bättre och mer självständigt ska kunna arbeta eller klara sig i
      vardagen.
    normalization: whitespace_only
    repairs: []
