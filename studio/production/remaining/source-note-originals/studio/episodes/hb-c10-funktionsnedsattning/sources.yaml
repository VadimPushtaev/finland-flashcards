    range_basis: normalized_html_block
    extracted_passage: Välfärdsområdena ordnar arbetsverksamhet (työtoiminta) och dagverksamhet (päivätoiminta)
      för personer med funktionsnedsättning. I arbetsverksamheten ingår lätt arbete. Dagverksamheten
      är avsedd för personer med svår funktionsnedsättning som inte kan delta i arbetsverksamheten.
