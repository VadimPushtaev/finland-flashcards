    range_basis: normalized_html_block
    extracted_passage: I Finlands historia har det finska och det svenska språket länge levt sida
      vid sida. Det nuvarande Finlands område var länge en del av Sverige. Därför har Finland två
      nationalspråk. Finlandssvenskarna har en egen språklig och kulturell identitet och i Finland
      finns det svenskspråkiga skolor, universitet, tidningar, radiokanaler, teatrar och organisationer
      samt en svenskspråkig garnison.
