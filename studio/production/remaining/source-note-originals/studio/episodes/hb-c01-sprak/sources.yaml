    range_basis: normalized_html_block
    extracted_passage: Andra språk som använts länge i Finland är de samiska språken, den finländska
      romanin, karelska språket och teckenspråken. De samiska språken är de språk som talas av ursprungsbefolkningen
      i Lappland, och de är officiella språk inom samernas hembygdsområde. I Finland talas många
      olika språk. Några vanliga språk är ryska, estniska, engelska, somaliska och arabiska.
    normalization: whitespace_only
