    heading: Betalningsanmärkning
    source_range:
      start: 0
      end: 477
    range_basis: normalized_html_block
    extracted_passage: Om du inte betalar en räkning eller en skuld, kan du få en betalningsanmärkning
      (maksuhäiriömerkintä) i kreditupplysningsregistret. Detta orsakar många svårigheter för dig.
      Hyresvärdar och banker kontrollerar ofta kredituppgifterna i kreditupplysningsregistret. Om
      du har en betalningsanmärkning, får du inte nödvändigtvis en hyresbostad, ett banklån eller
      ett kreditkort. Även arbetsgivaren kan i vissa situationer förutsätta att arbetstagaren inte
      har betalningsanmärkningar.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0179:
