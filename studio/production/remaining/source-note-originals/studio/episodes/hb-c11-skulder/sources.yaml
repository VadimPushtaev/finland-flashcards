    heading: Inkasso
    source_range:
      start: 0
      end: 341
    range_basis: normalized_html_block
    extracted_passage: Om du inte har betalat en räkning senast på förfallodagen får du en betalningspåminnelse.
      Efter en eller två påminnelser kan räkningen övergå till en inkassobyrå. Inkassobyrån skickar
      dig genast ett betalningskrav. Om du inte kan betala räkningen på en gång, ska du kontakta
      inkassobyrån och komma överens om en betalningsplan för räkningen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0176:
