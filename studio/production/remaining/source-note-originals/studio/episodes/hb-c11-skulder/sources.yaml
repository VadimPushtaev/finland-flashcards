    heading: Om du inte kan betala din hyra
    source_range:
      start: 0
      end: 388
    range_basis: normalized_html_block
    extracted_passage: Hyresvärden har rätt att häva hyresavtalet om du inte betalar din hyra. Hyresvärden
      ska meddela hyresgästen om hävandet. I detta skede finns det vanligtvis ännu en möjlighet att
      komma överens om hyresbetalningen med hyresvärden. Om du inte betalar din hyra kan hyresvärden
      söka ett avhysningsbeslut i domstol. Det innebär att du måste flytta ut ur bostaden och betala
      de obetalda hyrorna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
