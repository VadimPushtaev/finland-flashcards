    range_basis: normalized_html_block
    extracted_passage: Hos Takuusäätiö kan du också få hjälp med och råd om betalningen av skulder.
      Stiftelsen kan hjälpa dig att slå ihop dina skulder till ett lån. Du kan ansöka om lånegaranti
      vid Takuusäätiö om du behöver ett banklån för att betala dina skulder. Vid Takuusäätiö kan
      du även ansöka om ett litet lån, om du behöver pengar för en utgift av engångskaraktär, såsom
      en hushållsmaskin, möbler, hyresdeposition, reparation av bilen eller glasögon.
