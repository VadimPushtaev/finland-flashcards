    range_basis: normalized_html_block
    extracted_passage: Ofta behövs ett domstolsbeslut för utmätning. Vissa betalningar går emellertid
      direkt till utmätning. Sådana betalningar är till exempel skatter, hälsocentralsavgifter och
      dagvårdsavgifter.
