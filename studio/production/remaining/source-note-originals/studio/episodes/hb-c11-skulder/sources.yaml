    range_basis: normalized_html_block
    extracted_passage: Om du inte betalar räkningen eller kommer överens om en betalningsplan kan
      skulden slutligen gå till utmätning (ulosotto). Utmätning betyder att myndigheten har rätt
      att ta en del av dina inkomster för betalning av skulder. Utmätningsmyndigheten kan även sälja
      värdefull egendom som du har för att betala skulden.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
