    heading: För personer som bor i Finland är studierna i allmänhet avgiftsfria
    source_range:
      start: 0
      end: 466
    range_basis: normalized_html_block
    extracted_passage: Att avlägga en hel examen kostar i allmänhet ingenting om den studerande bor
      permanent i Finland. Om man flyttar från utlandet till Finland för att studera, är man vanligtvis
      tvungen att själv finansiera sina studier och sitt liv. Det är värt att fråga den högskola
      man ämnar söka till om eventuella stipendier. Även om examensstudier i huvudsak är avgiftsfria
      i Finland, kan enskilda kurser eller fortbildning kosta, och en del läroanstalter är helt avgiftsbelagda.
    normalization: whitespace_only
