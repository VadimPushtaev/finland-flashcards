    heading: Det är möjligt att på vissa villkor studera också med arbetslöshetsförmån
    source_range:
      start: 0
      end: 360
    range_basis: normalized_html_block
    extracted_passage: En arbetslös kund hos sysselsättningstjänsterna kan på vissa villkor studera
      också med arbetslöshetsförmån. I sådana fall sker studierna inom en arbetskraftsutbildning,
      som man söker till via sysselsättningstjänsterna. Personer som studerar inom arbetskraftsutbildning
      har möjlighet att utöver arbetslöshetsförmån också få kostnadsersättning för studiedagarna.
    normalization: whitespace_only
