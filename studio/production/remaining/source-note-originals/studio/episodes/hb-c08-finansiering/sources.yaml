    heading: Det är möjligt att få ekonomiskt stöd för vuxenstudier
    source_range:
      start: 0
      end: 490
    range_basis: normalized_html_block
    extracted_passage: I Finland finns det olika sätt att finansiera vuxenstudier på. På vissa villkor
      kan man få olika typer av stöd, studielån och stipendier för sina studier. Många studier kan
      avläggas vid sidan av ett heltidsarbete. Då kan man arbeta som vanligt och studera på kvällar
      eller helger. Det är vanligt att i synnerhet högskolestuderande finansierar sina studier genom
      att ha ett deltidsarbete vid sidan av studierna. Många studerande arbetar hellre deltid vid
      sidan av studierna än tar studielån.
    normalization: whitespace_only
    repairs: []
