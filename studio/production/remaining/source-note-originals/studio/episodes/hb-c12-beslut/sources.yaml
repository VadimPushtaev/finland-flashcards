    range_basis: normalized_html_block
    extracted_passage: Om du redan är i Finland och får ett negativt beslut om uppehållstillstånd
      från Migrationsverket (Maahanmuuttovirasto), måste du lämna Finland. För dig kan det också
      fattas ett beslut om avlägsnande ur landet (maastapoistamispäätös), vilket innebär att du avvisas
      eller utvisas från Finland.
    normalization: whitespace_only
