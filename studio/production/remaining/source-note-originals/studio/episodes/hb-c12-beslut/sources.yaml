    range_basis: normalized_html_block
    extracted_passage: Om du får avslag på din ansökan om uppehållstillstånd eller om förvaltningsrätten
      avslår ditt överklagande, måste du lämna Finland. Du ges möjlighet att lämna landet frivilligt.
      Tidsfristen är vanligtvis 30 dagar eller så kan du avlägsnas ur landet genast. Du ser den exakta
      tidsfristen i beslutsdokumentet som du får från Migrationsverket.
