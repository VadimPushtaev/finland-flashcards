    range_basis: normalized_html_block
    extracted_passage: En besvärsanvisning om hur beslutet får överklagas bifogas alltid beslutet.
      Besvären behandlas av förvaltningsdomstolen (hallinto-oikeus). Förvaltningsdomstolen kan antingen
      avslå besvären eller sända ärendet till Migrationsverket för ny behandling. Avslag innebär
      att Migrationsverkets beslut förblir gällande.
    normalization: whitespace_only
