    heading: Vårdbidrag för pensionstagare
    source_range:
      start: 0
      end: 388
    range_basis: normalized_html_block
    extracted_passage: En pensionär vars funktionsförmåga försämrats under sammanlagt minst ett år
      på grund av sjukdom eller skada kan få vårdbidrag för pensionstagare. Du kan få stöd om du
      på grund av ditt handikapp eller din sjukdom behöver regelbunden hjälp eller handledning och
      övervakning. Hur stort stöd du får beror på hur mycket hjälp du behöver. Du kan ansöka om vårdbidrag
      för pensionstagare hos FPA.
