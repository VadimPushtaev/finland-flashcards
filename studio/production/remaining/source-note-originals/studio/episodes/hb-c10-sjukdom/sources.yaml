    source_kind: p
    source_role: content
    heading: Partiell sjukdagpenning
    source_range:
      start: 0
      end: 510
    range_basis: normalized_html_block
    extracted_passage: Den partiella sjukdagpenningen (osasairauspäiväraha) är avsedd för 18–67-åriga
      heltidsarbetande anställda eller företagare som omfattas av den sociala tryggheten i Finland
      . Syftet med den partiella sjukdagpenningen är att du kan fortsätta att arbeta eller att återgå
      till arbetet trots att du har blivit sjuk. Diskutera först med din läkare inom företagshälsovården
      och din arbetsgivare om möjligheten att söka partiell sjukdagpenning. Företagshälsovårdsläkaren
      avgör om du kan deltidsarbeta medan du är sjuk.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
