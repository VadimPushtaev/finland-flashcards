    heading: Handikappförmån för barn under 16 år
    source_range:
      start: 0
      end: 388
    range_basis: normalized_html_block
    extracted_passage: Ett barn under 16 år kan få handikappförmån (vammaistuki) om hen på grund
      av sin funktionsnedsättning eller sin sjukdom behöver regelbunden vård, omsorg och rehabilitering
      under minst sex månaders tid. Du ansöker om handikappförmån för barn under 16 år vid FPA. Handikappförmånet
      beviljas vanligtvis för en bestämd period. När perioden har gått kan man ansöka om förlängning
      för bidraget.
    normalization: whitespace_only
    repairs: []
