    range_basis: normalized_html_block
    extracted_passage: Om du vårdar en närstående med funktionsnedsättning i hemmet kan du få stöd
      för närståendevård (omaishoidontuki) från ditt välfärdsområde. Fråga mer hos funktionshinderservicen
      (vammaispalvelut) eller rådgivningen om närståendevård (omaishoito) i ditt område.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
