    range_basis: normalized_html_block
    extracted_passage: Om du får lön under sjukledigheten, ansöker din arbetsgivare om sjukdagpenningen.
      Då betalas sjukdagpenningen till din arbetsgivare. Om du är sjuk en lång tid och din arbetsgivare
      inte längre betalar din lön under sjukledigheten, betalar FPA sjukdagpenningen till dig. Sjukdagpenningens
      belopp beror på inkomsterna. När du söker sjukdagpenning ska du till ansökan bifoga ett läkarintyg
      om arbetsoförmåga.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c10-u0206:
    source_path: data/infofinland/content/health/support-during-illness.html
