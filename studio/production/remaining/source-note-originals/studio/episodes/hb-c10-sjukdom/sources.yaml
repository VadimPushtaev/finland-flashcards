    heading: Handikappbidrag för personer över 16 år
    source_range:
      start: 0
      end: 566
    range_basis: normalized_html_block
    extracted_passage: Om du har en funktionsnedsättning eller en sjukdom som försämrar din funktionsförmåga
      sammanhängande under minst ett år, kan du få handikappbidrag. Du måste ha ett läkarintyg för
      att ansöka om handikappbidrag. Villkoret är att du har rätt till FPA:s förmåner och att du
      har bott minst tre år i Finland eller i något annat EU- eller EES-land eller i Schweiz. Handikappbidrag
      för vuxna betalas till 16–64-åringar. Handikappbidragets storlek beror på hur stor olägenhet
      din sjukdom eller funktionsnedsättning orsakar dig och hur mycket hjälp och handledning du
      behöver.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
