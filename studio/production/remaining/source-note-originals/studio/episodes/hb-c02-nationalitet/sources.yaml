    range_basis: normalized_html_block
    extracted_passage: Finland var det tredje landet i världen och det första i Europa att ge kvinnor
      rösträtt. Finland var det första landet i världen att ge alla kvinnor rätt att kandidera i
      val. I valet år 1907 valdes 19 kvinnor in i Finlands riksdag. De var världens första kvinnliga
      riksdagsledamöter.
