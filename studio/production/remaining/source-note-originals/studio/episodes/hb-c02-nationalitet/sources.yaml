      end: 1211
    range_basis: raw_pdf_page
    extracted_passage: "Under ryska väldet föddes nationalistiska idéer i Finland först bland de\
      \ bildade svenskspråkiga \nklasserna. De blev intresserade av finska språket och finsk kultur\
      \ och framställde finländarna som ett \nfolk med en gemensam historia och kultur. Den ryska\
      \ förvaltningen stödde det nationella \nuppvaknandet och förbättrandet av det finska språkets\
      \ ställning. I Ryssland tänkte de att \nnationalkänslan skulle fjärma finländarna från Sverige\
      \ och svenskheten och föra dem närmare \nRyssland. Finskspråkiga skolor började grundas i städerna\
      \ på 1860-talet. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0029:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 13
    printed_page: 12
    source_range:
      start: 1211
      end: 1584
    range_basis: raw_pdf_page
    extracted_passage: "Nationalisterna kom att tvista om det finska och svenska språkets ställning\
      \ i Finland. En del ville \nbevara svenska språkets ställning i Finland medan andra ville att\
      \ finska skulle vara det enda språket. \nSpråkstriden skapade de första partierna i Finland\
      \ på 1860-talet. I och med stridigheterna blev finska \ndet andra officiella språket i Finland\
      \ i början av 1900-talet. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
