    heading: Finland fick en egen riksdag i början av 1900-talet
    source_range:
      start: 0
      end: 309
    range_basis: normalized_html_block
    extracted_passage: I början av 1900-talet ersattes Finlands lantdagar av en riksdag. År 1907
      hölls det första riksdagsvalet, där alla finländare över 24 år fick rösta. Reformen var ett
      stort steg framåt. I valet fick arbetarna, de fattiga på landsbygden och kvinnorna möjlighet
      att för första gången påverka politiken i Finland.
    normalization: whitespace_only
