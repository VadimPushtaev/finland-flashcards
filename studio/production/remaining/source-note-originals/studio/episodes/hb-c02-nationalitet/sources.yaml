    heading: Nationalismen gav upphov till idén om Finland som en egen nation
    source_range:
      start: 0
      end: 435
    range_basis: normalized_html_block
    extracted_passage: 1800-talet var också nationalismens eller nationalitetsidén århundrade. Enligt
      nationalitetsidén har varje folk ett eget språk, en egen religion och en egen historia, och
      varje folk borde vara en egen självständig stat. Länderna i Europa har dock bildats av många
      olika folk. Till följd av nationalismen förekom det uppror och oroligheter i många europeiska
      länder. Också i Finland började många anse att finländarna var ett eget folk.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0028:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 13
    printed_page: 12
    source_range:
