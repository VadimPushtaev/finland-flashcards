    heading: Lagar stiftades av den svenska ståndsriksdagen
    source_range:
      start: 0
      end: 332
    range_basis: normalized_html_block
    extracted_passage: Från Finland deltog man under det svenska styret i den svenska ståndsriksdagen.
      Ståndsriksdagen var en lagstiftande riksdag som tillkommit i Sverige på 1500-talet. Stånden
      representerade ändå bara de högre samhällsklasserna och den del av befolkningen som klarade
      sig bäst. Största delen av befolkningen hörde inte till något stånd.
    normalization: whitespace_only
    repairs: []
