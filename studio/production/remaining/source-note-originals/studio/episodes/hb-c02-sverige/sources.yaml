    heading: Kolonialismen ökade välståndet i Europa men utarmade kolonierna
    source_range:
      start: 0
      end: 434
    range_basis: normalized_html_block
    extracted_passage: Den kraftiga utvecklingen och blomstringen i de länder som deltog i kolonialismen
      skedde delvis på koloniernas bekostnad. Länderna som deltog i koloniseringen, till exempel
      Sverige och därmed också Finland, drog nytta av naturresurserna, råvarorna och produkterna
      i kolonierna samt handeln med dem. Produkter och råvaror som förts från kolonierna och som
      såldes på den internationella marknaden hade ofta producerats genom slavarbete.
    normalization: whitespace_only
