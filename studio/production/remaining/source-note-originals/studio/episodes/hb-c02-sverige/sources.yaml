    heading: Kolonialismen ökade välståndet i Europa men utarmade kolonierna
    source_range:
      start: 0
      end: 406
    range_basis: normalized_html_block
    extracted_passage: Samtidigt som man i Europa diskuterade mänskliga rättigheter utövade många
      europeiska länder kolonialism. Kolonialism innebär att ett land erövrar hela länder eller områden
      i andra världsdelar och utnyttjar deras resurser, såsom arbetskraft och naturresurser. Inom
      kolonialismen påverkar man också de lokala sederna, till exempel språket, religionen och utbildningen,
      i de erövrade länderna eller områdena.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
