    source_range:
      start: 0
      end: 231
    range_basis: normalized_html_block
    extracted_passage: Om ingen nära anhörig ser till att den avlidna personen blir begraven, kremerad
      eller transporterad till hemlandet kan beskickningen kontakta de lokala myndigheterna. I detta
      fall begravs eller kremeras kroppen enligt finsk praxis.
