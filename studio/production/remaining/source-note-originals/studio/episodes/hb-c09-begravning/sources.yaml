    heading: Familjepension
    source_range:
      start: 0
      end: 410
    range_basis: normalized_html_block
    extracted_passage: 'Efter en persons bortgång kan maka/make och barn få familjepension. Syftet
      med familjepensionen är att trygga änkans/änklingens och barnens uppehälle. I Finland finns
      två olika familjepensioner: FPA:s familjepension och familjepensionen från arbetspensionssystemet.
      Om den avlidna har arbetat som anställd eller företagare i Finland kan änkan/änklingen och
      barnen få familjepension från arbetspensionssystemet.'
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
