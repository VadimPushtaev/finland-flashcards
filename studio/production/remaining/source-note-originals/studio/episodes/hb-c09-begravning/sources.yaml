    heading: Hjälp och stöd
    source_range:
      start: 0
      end: 234
    range_basis: normalized_html_block
    extracted_passage: När en närstående person avlider, kan du få hjälp och stöd i sorgen vid social-
      och hälsocentralen (sosiaali- ja terveyskeskus) eller familjerådgivningen (perheneuvola) i
      ditt område, i MIELI ry:s kristelefon eller hos församlingarna.
    normalization: whitespace_only
