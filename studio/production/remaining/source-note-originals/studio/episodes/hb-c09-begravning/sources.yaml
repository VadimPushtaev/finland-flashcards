    heading: Begravningar kan ordnas enligt den avlidnes önskemål
    source_range:
      start: 0
      end: 369
    range_basis: normalized_html_block
    extracted_passage: Var och en får ordna en sådan begravning som den vill för den anhörige, men
      i mån av möjlighet ska den avlidnes önskemål uppfyllas. Människor som hör till olika religioner
      har olika begravningstraditioner. I Finland finns det många olika begravningsbyråer som erbjuder
      hjälp. Begravningsbyråer är företag som ordnar begravningar. Man kan också själv ordna begravningen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
