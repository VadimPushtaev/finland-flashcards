    heading: Begravningar kan ordnas enligt den avlidnes önskemål
    source_range:
      start: 0
      end: 375
    range_basis: normalized_html_block
    extracted_passage: I Finland är det vanligt att begravningar ordnas först flera veckor efter
      ett dödsfall. Det tar tid att ta hand om alla praktiska arrangemang och ordna med begravningen,
      och dessutom kan det vara rusning på begravningsplatserna. Den avlidne, det vill säga den som
      dött, kan dock begravas också snabbare, om dödsorsaken har utretts och en läkare har gett begravningstillstånd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
