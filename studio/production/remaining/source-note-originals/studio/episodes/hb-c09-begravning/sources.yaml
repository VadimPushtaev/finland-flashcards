    heading: Begravningsbidrag
    source_range:
      start: 0
      end: 334
    range_basis: normalized_html_block
    extracted_passage: Ibland kan en avliden person ha rätt till begravningsbidrag baserat på sin
      sista anställning eller sitt medlemskap i ett fackförbund. Fråga den sista arbetsgivaren eller
      fackförbundet om detta. För begravningskostnaderna för en medellös person kan du ansöka om
      utkomststöd (toimeentulotuki) hos FPA och socialtjänsterna i ditt område.
    normalization: whitespace_only
