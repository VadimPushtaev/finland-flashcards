    heading: En begravning kan vara en kistbegravning eller kremering
    source_range:
      start: 0
      end: 293
    range_basis: normalized_html_block
    extracted_passage: I Finland bestämmer den avlidne själv eller familjen vad som ska hända med
      kroppen efter döden. Den avlidne kan begravas i en kista eller så kan kroppen brännas. Kistbegravningar
      är vanliga i Finland. I en kista får en människa begravas endast på begravningsplatser som
      har behörigt tillstånd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
