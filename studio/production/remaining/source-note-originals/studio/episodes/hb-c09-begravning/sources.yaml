    heading: En begravning kan vara en kistbegravning eller kremering
    source_range:
      start: 0
      end: 330
    range_basis: normalized_html_block
    extracted_passage: Kremering har blivit vanligare de senaste årtiondena. Det är det förmånligaste
      begravningssättet. När den avlidne har kremerats, förs askan i ett särskilt kärl, en askurna,
      till en begravningsplats för att begravas. På begravningsplatser finns ett särskilt område,
      en urnlund, där urnan kan begravas eller askan spridas på marken.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
