    heading: Utländsk medborgare som avlider i Finland
    source_range:
      start: 0
      end: 325
    range_basis: normalized_html_block
    extracted_passage: När en person som är medborgare i något annat land avlider i Finland utreds
      dödsorsaken enligt finsk lag. En myndighet eller ett sjukhus anmäler dödsfallet till beskickningen
      i den avlidnes ursprungsland. Beskickningen eller utrikesministeriet i den avlidnes ursprungsland
      meddelar informationen till den avlidnes närstående.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
