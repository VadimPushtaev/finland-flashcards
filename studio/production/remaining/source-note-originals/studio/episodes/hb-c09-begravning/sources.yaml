    heading: Olika trossamfund har egna begravningsplatser
    source_range:
      start: 0
      end: 362
    range_basis: normalized_html_block
    extracted_passage: I Finland är majoriteten av begravningsplatserna begravningsplatser som upprätthålls
      av den evangelisk-lutherska kyrkan. På dem får dock också personer som hör till andra trossamfund
      begravas. På de flesta begravningsplatser finns det separata områden för avlidna som har varit
      medlemmar i något annat trossamfund eller inte varit medlemmar i något samfund alls.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
