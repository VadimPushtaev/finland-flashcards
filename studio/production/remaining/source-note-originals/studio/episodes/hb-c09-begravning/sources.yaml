    heading: I Finland kan en avliden utlännings kropp transporteras till ett annat land
    source_range:
      start: 0
      end: 302
    range_basis: normalized_html_block
    extracted_passage: Om en utlänning avlider i Finland och familjen vill transportera den avlidnes
      kropp eller aska till ett annat land för att begravas, ska de kontakta destinationslandets
      ambassad i Finland. En del länders ambassader hjälper familjer att transportera avlidna anhöriga.
      Familjen betalar själv transporten.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
