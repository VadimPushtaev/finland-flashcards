    source_range:
      start: 0
      end: 351
    range_basis: normalized_html_block
    extracted_passage: Kommunerna kan också ha egna begravningsplatser för olika religiösa samfund,
      till exempel en ortodox, muslimsk eller judisk begravningsplats. Olika religiösa eller icke-religiösa
      samfund kan ha egna privata begravningsplatser. Det egna religiösa samfundet eller begravningsbyråerna
      ger information om begravningsplatser och de praktiska arrangemangen.
