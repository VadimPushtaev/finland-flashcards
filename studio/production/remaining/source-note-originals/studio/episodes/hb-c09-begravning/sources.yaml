    source_role: content
    heading: Familjepension
    source_range:
      start: 0
      end: 247
    range_basis: normalized_html_block
    extracted_passage: Om en person har bott eller arbetat länge i ett annat land innan hen flyttade
      till Finland kan änkan/änklingen och barnen ha rätt till familjepension även från detta land.
      Ta reda på villkoren för familjepension från Finland eller ursprungslandet.
