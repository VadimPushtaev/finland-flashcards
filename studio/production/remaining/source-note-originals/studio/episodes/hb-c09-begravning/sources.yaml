    heading: En begravning kan vara en kistbegravning eller kremering
    source_range:
      start: 0
      end: 376
    range_basis: normalized_html_block
    extracted_passage: Om den avlidne eller den avlidnes familj vill kan askan också spridas någon
      annanstans, till exempel på familjens egen mark eller i havet. Om familjen vill sprida askan
      på någon annans mark eller vattenområde, måste man be om tillstånd av den som äger marken eller
      vattenområdet. All aska måste dessutom spridas på ett och samma ställe, man får med andra ord
      inte dela på den.
    normalization: whitespace_only
