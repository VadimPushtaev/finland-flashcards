    heading: Jämställdhetslagen tryggar jämställdhet mellan könen
    source_range:
      start: 0
      end: 634
    range_basis: normalized_html_block
    extracted_passage: Utöver att främja jämställdhet och förhindra diskriminering förbättrar jämställdhetslagen
      också kvinnornas ställning framför allt i arbetslivet. Enligt lagen får man till exempel inte
      avstå från att anställa en arbetstagare eller säga upp henne från arbetet om hon är gravid.
      När en arbetsgivare anställer nya arbetstagare ska valet göras utifrån arbetstagarnas meriter.
      En arbetstagare får inte väljas på grund av sitt kön. Man får inte heller till exempel betala
      högre lön till män bara för att de är män. Enligt lagen ska man betala lika lön för arbete
      som är att betrakta som lika eller likvärdigt oberoende av arbetstagarnas kön.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
