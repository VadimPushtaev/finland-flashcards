    source_kind: p
    source_role: content
    heading: Jämställdhet mellan män och kvinnor
    source_range:
      start: 0
      end: 391
    range_basis: normalized_html_block
    extracted_passage: Kvinnor och män kan själva besluta vem de gifter sig med. Att tvinga någon
      till äktenskap är ett brott i Finland. Exempelvis föräldrarna har inte rätt att tvinga eller
      utöva påtryckningar på sitt barn att gifta sig. Både kvinnan och mannen har rätt att få skilsmässa.
      Man kan även få skilsmässa utan makens eller makans samtycke. Ingen har rätt att förhindra
      någon från att ta ut skilsmässa.
