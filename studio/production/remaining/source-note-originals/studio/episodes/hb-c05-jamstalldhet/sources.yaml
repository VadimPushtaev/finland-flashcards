    heading: Jämställdhetslagen tryggar jämställdhet mellan könen
    source_range:
      start: 0
      end: 401
    range_basis: normalized_html_block
    extracted_passage: Lagen om jämställdhet mellan kvinnor och män stiftades år 1987 i Finland.
      Enligt jämställdhetslagen är könen jämställda och ingen får diskrimineras på grund av kön,
      könsidentitet eller könsuttryck. Alla myndigheter, arbetsgivare och anordnare av utbildning
      och småbarnspedagogik är skyldiga att främja jämställdhet. Efterlevnaden av jämställdhetslagen
      övervakas i Finland av en jämställdhetsombudsman.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
