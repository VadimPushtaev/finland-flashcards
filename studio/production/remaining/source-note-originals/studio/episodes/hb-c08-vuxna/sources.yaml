    heading: Studier inom det fria bildningsarbetet ökar kompetensen och välbefinnandet
    source_range:
      start: 0
      end: 639
    range_basis: normalized_html_block
    extracted_passage: För vuxna i Finland finns det utöver yrkesinriktade studier och högskolestudier
      också ett stort utbud av studier inom det fria bildningsarbetet vid medborgarinstitut, folkhögskolor,
      studiecentraler och sommaruniversitet. De erbjuder många olika slags utbildningar som vem som
      helst kan delta i. Utbildningarna är i allmänhet avgiftsbelagda och ordnas på dagar, kvällar
      och helger. Kursutbudet omfattar till exempel olika språk, idrott och dans, hantverk, bildkonst,
      informationsteknik och digitala färdigheter, musik, teater och samhällsstudier. Vid folkhögskolorna
      består utbildningarna vanligtvis av heltidsstudier som pågår i ett läsår.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
