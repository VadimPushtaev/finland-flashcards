    range_basis: normalized_html_block
    extracted_passage: Den grundläggande utbildningen för vuxna är avsedd särskilt för unga och vuxna
      som flyttat till Finland och som inte gått ut grundskolan, som endast gått lite i skolan eller
      vars avklarade grundskolestudier inte kan jämföras med studierna i Finland. Inom den grundläggande
      utbildningen studerar till exempel 17–25-åriga nyanlända som på grund av sin ålder inte längre
      kan delta i undervisning som ordnas för barn och unga men som behöver ett avgångsbetyg för
      den grundläggande utbildningen och studiefärdigheter för att kunna fortsätta studera på andra
      stadiet.
