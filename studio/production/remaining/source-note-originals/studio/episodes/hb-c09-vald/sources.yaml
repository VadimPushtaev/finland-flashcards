    range_basis: normalized_html_block
    extracted_passage: Att fysiskt aga och misshandla ett barn kan orsaka allvarliga skador, till
      och med dödsfall. Barnet kan få svåra trauman av det som skadar hens mentala och sociala utveckling.
      Om ett barn faller offer för våld, kan hen känna mycket hat och rädsla och förlora tilliten
      till vuxna. Om barnet tar modell av en vuxen som beter sig våldsamt, kan det ge problem genom
      hela livet.
