    extracted_passage: Våld är ett brott i Finland. Trots det förekommer det våld i en del familjer.
      Med våld i nära relationer avses våld där förövaren och offret har en nära relation till varandra.
      Offret är maken, partnern, den tidigare maken, ett barn, ett syskon, en släkting eller någon
      annan närstående.
