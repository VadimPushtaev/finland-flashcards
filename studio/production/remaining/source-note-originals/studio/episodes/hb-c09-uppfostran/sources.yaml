    range_basis: normalized_html_block
    extracted_passage: Den finländska uppfattningen om barn är också förknippad med en idé om vikten
      av lek. Genom lek lär sig barnen viktiga färdigheter, men leken i sig är också viktig. Leken
      ger barnen glädje och är en viktig del av att vara barn. Alla barn har rätt att leka.
