    range_basis: normalized_html_block
    extracted_passage: Det finns många sätt att vara en bra förälder. Ur barnets perspektiv är det
      viktigaste att hen känner sig älskad och uppskattad som hen är. Barnet känner sig tryggt och
      hens basbehov tillgodoses.
