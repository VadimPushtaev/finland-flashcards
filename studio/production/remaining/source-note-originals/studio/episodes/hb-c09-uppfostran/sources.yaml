    range_basis: normalized_html_block
    extracted_passage: I Finland betraktas barn som aktiva aktörer. Barn är alltså inte bara föremål
      för de vuxnas beskydd och beslut, utan de har egna tankar och åsikter som de vuxna ska respektera.
      Föräldrarna och samhället ska främja barnens växande till självständiga individer som fattar
      ansvarsfulla beslut.
