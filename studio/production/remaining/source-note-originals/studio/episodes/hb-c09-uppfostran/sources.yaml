    range_basis: normalized_html_block
    extracted_passage: Ibland kan det också hända att man förväntar sig för mycket självständighet
      och egna initiativ av barnen. Man måste komma ihåg att barn är individer. En del barn är redo
      för självständighet redan i yngre ålder, medan andra behöver mer tid. De vuxna har till uppgift
