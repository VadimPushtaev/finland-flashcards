    extracted_passage: Med uppfattning om barn avses hurdana barn anses vara. Det handlar också om
      hurdan relationen mellan barn och vuxna anses vara. En hurdan uppfattning om barn som råder
      i samhället tar sig uttryck i hur barn behandlas i vardagen. Dessutom syns samhällets uppfattning
      om barn i till exempel de lagar som gäller barn och i skolornas läroplaner.
