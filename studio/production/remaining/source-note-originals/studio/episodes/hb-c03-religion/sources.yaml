    heading: Den lutheranska och den ortodoxa kyrkan har en särställning i Finland
    source_range:
      start: 0
      end: 384
    range_basis: normalized_html_block
    extracted_passage: Majoriteten av invånarna i Finland, omkring 3,6 miljoner människor år 2023,
      hör till den evangelisk-lutherska kyrkan i Finland, som är en protestantisk, kristen kyrka.
      Den näst största kristna kyrkan i Finland är den ortodoxa kyrkan, till vilken omkring 53 000
      personer hörde år 2023. Den ortodoxa kyrkan i Finland lyder under Konstantinopels patriarkat,
      som har sitt säte i Istanbul.
