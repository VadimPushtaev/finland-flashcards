    heading: I Finland råder religionsfrihet
    source_range:
      start: 0
      end: 399
    range_basis: normalized_html_block
    extracted_passage: Enligt lag har människorna också frihet att inte höra till något religiöst
      samfund och inte utöva någon religion. År 2022 hörde en knapp tredjedel av invånarna i Finland
      inte till något registrerat religiöst samfund. De är en heterogen människoskara, där en del
      inte har någon religiös övertygelse, medan andra har. De är dock inte medlemmar i något trossamfund
      som för register över sina medlemmar.
    normalization: whitespace_only
    repairs: []
