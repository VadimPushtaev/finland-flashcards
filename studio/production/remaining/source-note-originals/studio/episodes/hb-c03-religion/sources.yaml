      end: 348
    range_basis: normalized_html_block
    extracted_passage: Enligt Finlands grundlag har var och en rätt att höra till ett religiöst samfund
      och utöva sin egen religion. Trossamfunden och församlingarna har samlingslokaler såsom kyrkor,
      moskéer, bönelokaler, synagogor, rikets salar och tempel på olika orter i Finland. Det är möjligt
      att valfritt ansluta sig till religiösa samfund och också utträda ur dem.
    normalization: whitespace_only
    repairs: []
