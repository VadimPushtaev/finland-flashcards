    heading: I Finland råder religionsfrihet
    source_range:
      start: 0
      end: 451
    range_basis: normalized_html_block
    extracted_passage: I Finland upprätthålls ett register över religiösa samfund som baserar sig
      på religionsfrihetslagen, och de registrerade religiösa samfunden i sin tur för egna register
      över sina medlemmar. Om ett samfund är registrerat som ett religiöst samfund enligt lagen,
      är det möjligt för det att få understöd för sin verksamhet. Registreringen påverkar också till
      exempel samfundsmedlemmarnas rätt att få undervisning i sin religion enligt läroplanen i skolan.
    normalization: whitespace_only
