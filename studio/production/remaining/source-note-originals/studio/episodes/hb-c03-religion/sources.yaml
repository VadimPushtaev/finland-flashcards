    heading: I Finland utövas många religioner
    source_range:
      start: 0
      end: 346
    range_basis: normalized_html_block
    extracted_passage: I Finland finns det bland annat olika kristna utövare såsom lutheraner, ortodoxer,
      katoliker och pingstvänner samt utövare av andra världsreligioner såsom muslimer, hinduer,
      buddister och judar. En del människor är icke-religiösa. Dessutom finns det många människor
      som upplever att de är andliga, men inte hör till något organiserat trossamfund.
