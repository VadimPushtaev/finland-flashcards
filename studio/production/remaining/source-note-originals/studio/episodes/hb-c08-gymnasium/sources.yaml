    range_basis: normalized_html_block
    extracted_passage: Gymnasiets läsår följer i allmänhet samma tidsplan som grundskolans. I gymnasiet
      studerar man i varierande studerandegrupper. Studierna är indelade i studieperioder, och de
      studerande kan själva planera sin läsordning. Största delen av studierna är obligatoriska.
      Dessutom väljer den studerande studier enligt sina egna intressen.
