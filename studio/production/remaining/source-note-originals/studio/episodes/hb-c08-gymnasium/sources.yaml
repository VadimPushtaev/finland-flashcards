    heading: Under gymnasiestudierna avläggs studentexamen
    source_range:
      start: 0
      end: 516
    range_basis: normalized_html_block
    extracted_passage: Under gymnasiet avlägger de studerande studentexamen. Studentexamen är densamma
      i hela Finland. I den ingår prov i modersmål och litteratur, det andra inhemska språket, främmande
      språk, matematik och naturvetenskapliga och humanistisk-samhälleliga läroämnen, det vill säga
      realämnen. Realämnen är till exempel historia, fysik, biologi, psykologi, religion, filosofi,
      geografi och hälsokunskap. Istället för provet i modersmål kan den studerande också avlägga
      ett prov i läroämnet finska eller svenska som andraspråk.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
