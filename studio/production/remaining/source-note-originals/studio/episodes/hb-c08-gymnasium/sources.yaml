    range_basis: normalized_html_block
    extracted_passage: Efter grundskolan fortsätter de unga sina studier på en utbildning på andra
      stadiet, det vill säga ett gymnasium eller en yrkesläroanstalt. Gymnasiestudierna är allmänbildande
      och ger de studerande färdigheter att inleda studier som leder till en högskoleexamen vid ett
      universitet eller en yrkeshögskola. Syftet med gymnasieutbildningen är bland annat att ge de
      studerande kunskaper och färdigheter som är nödvändiga för arbete och hobbyer. Utbildningen
      ger de studerande färdigheter för livslångt lärande och kontinuerlig utveckling av sig själva.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
