    heading: De studerandes lärande bedöms med siffervitsord
    source_range:
      start: 0
      end: 413
    range_basis: normalized_html_block
    extracted_passage: I gymnasiet får de studerande siffervitsord för de studieperioder de avlägger.
      Vitsordet visar hur väl den studerande har gått framåt under studieperioden och lärt sig nya
      saker. Det högsta vitsordet är 10 och det lägsta 4. Den studerande har rätt att försöka höja
      sina vitsord genom att göra om prov eller uppgifter. När den studerande har avlagt gymnasiets
      hela lärokurs får hen ett avgångsbetyg från gymnasiet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
