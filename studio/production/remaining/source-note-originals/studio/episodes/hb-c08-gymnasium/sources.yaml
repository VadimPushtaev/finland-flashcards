    range_basis: normalized_html_block
    extracted_passage: Med ett avgångsbetyg från gymnasiet och ett studentexamensbetyg kan man söka
      till många olika slags fortsatta studier vid en högskola. I Finland är det möjligt att avlägga
      också en IB-examen på engelska, det vill säga en internationell studentexamen, varefter man
      kan söka till högskolor i Finland och många andra länder.
