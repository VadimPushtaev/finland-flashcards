    heading: Det egna landets säkerhet och försvar betyder mycket
    source_range:
      start: 0
      end: 366
    range_basis: normalized_html_block
    extracted_passage: Finland har varit en självständig stat i bara drygt 100 år, och i närhistorien
      finns krig som hotade denna självständighet. I Finland har många människor en ganska stark
      nationalkänsla, det vill säga en känsla av samhörighet och stolthet över det egna landet och
      dess traditioner. Om nationalkänslan är stark anser människan att det egna landet är värt att
      försvara.
