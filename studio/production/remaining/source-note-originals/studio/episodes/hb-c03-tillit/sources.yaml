    heading: Utbildning och bildning är nycklar till ett gott liv och ett intressant arbete
    source_range:
      start: 0
      end: 456
    range_basis: normalized_html_block
    extracted_passage: Utbildning och bildning betraktas också som viktiga värderingar. Bildning
      bygger på de kunskaper och färdigheter man har fått genom sin utbildning. En bildad människa
      har goda kunskaper och omdömesförmåga, funktionsförmåga och förmåga till empati. I Finland
      värdesätts skola och utbildning samt att de är tillgängliga för alla. Att gå i skola och utbilda
      sig till ett yrke är viktiga steg mot ett gott liv. Läraryrket är populärt och respekterat
      i Finland.
    normalization: whitespace_only
    repairs: []
