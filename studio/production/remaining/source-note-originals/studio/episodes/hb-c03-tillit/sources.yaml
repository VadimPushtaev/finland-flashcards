    heading: Miljöskyddet och naturen är viktiga i Finland
    source_range:
      start: 0
      end: 350
    range_basis: normalized_html_block
    extracted_passage: Viktigt för finländarna är att vistas i naturen, njuta av naturen och vackra
      landskap, naturens mångfald och naturskydd. I exempelvis skogslagstiftningen försöker man också
      beakta miljöskyddets perspektiv. Finlands natur och nationallandskap ingår i många finländares
      uppfattning om hur det är att vara finländare och vad som är värdefullt i Finland.
