    range_basis: normalized_html_block
    extracted_passage: Det är viktigt att personer som flyttar till Finland får arbete med tanke
      på såväl deras utkomst, välbefinnande och integration som hela samhället. Om en nyanländ får
      ett bra arbete betalar hen också mer skatt, vilket är till nytta för samhällsekonomin och bidrar
      till att finansiera den offentliga servicen.
    normalization: whitespace_only
