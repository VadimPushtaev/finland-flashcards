    heading: Kunskaper i finska eller svenska gör det lättare att hitta arbete
    source_range:
      start: 0
      end: 314
    range_basis: normalized_html_block
    extracted_passage: När en person flyttar till Finland av andra orsaker än arbete kan det ta längre
      tid att få sysselsättning och man måste anstränga sig för att hitta ett arbete. Om man kan
      finska eller svenska bra är det lättare att hitta arbete. En del arbeten kan utföras på engelska,
      men det finns mycket färre arbetsmöjligheter.
    normalization: whitespace_only
