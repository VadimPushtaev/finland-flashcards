    range_basis: normalized_html_block
    extracted_passage: En del orter i Finland är svenskspråkiga och en del tvåspråkiga. Därför kan
      också kunskaper i svenska hjälpa en att hitta arbete. På orter där majoriteten talar svenska
      är kunskaper i svenska ofta ett krav för att få en anställning.
