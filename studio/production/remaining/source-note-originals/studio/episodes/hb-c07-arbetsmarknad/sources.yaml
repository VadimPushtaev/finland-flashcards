    source_range:
      start: 0
      end: 339
    range_basis: normalized_html_block
    extracted_passage: Visa arbetsgivaren antingen ditt pass, ett officiellt resedokument eller ditt
      uppehållstillståndskort. Du har rätt att själv behålla ditt pass och uppehållstillstånd. Arbetsgivaren
