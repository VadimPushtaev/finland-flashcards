    range_basis: normalized_html_block
    extracted_passage: Om du inte är finsk medborgare måste du bevisa för arbetsgivaren att du har
      rätt att arbeta i Finland. Rätten att arbeta beror på i vilket land du är medborgare och från
      vilket land du flyttar hit. Om du har uppehållstillstånd ser du rätten att arbeta på ditt uppehållstillståndskort.
