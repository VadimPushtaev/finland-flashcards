    source_range:
      start: 0
      end: 541
    range_basis: normalized_html_block
    extracted_passage: Många arbetsgivare vill att arbetstagaren kan språket som används på arbetsplatsen
      mycket väl. I många arbetsuppgifter är kunskaper i finska eller svenska ett villkor för att
      bli rekryterad. För en del tjänster inom den offentliga sektorn förutsätts att en person kan
      både finska och svenska. Det är värt att utveckla sina kunskaper i finska eller svenska också
      utanför arbetet till exempel genom att gå på språkkurser. Att utveckla sina språkkunskaper
      kan hjälpa en att avancera i karriären eller göra det lättare att hitta ett nytt arbete.
    normalization: whitespace_only
