    heading: I Finland värdesätts en bra utbildning
    source_range:
      start: 0
      end: 321
    range_basis: normalized_html_block
    extracted_passage: I Finland har utbildningsnivån stor inverkan på sysselsättningsmöjligheterna
      och lönen. Det har också betydelse var utbildningen har avlagts. Arbetsgivare värdesätter ofta
      utbildning och arbetslivserfarenhet som skaffats i Finland mer. För största delen av alla arbetsuppgifter
      krävs någon typ av utbildning eller examen.
