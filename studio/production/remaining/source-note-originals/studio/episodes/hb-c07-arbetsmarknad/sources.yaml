    heading: I Finland värdesätts en bra utbildning
    source_range:
      start: 0
      end: 449
    range_basis: normalized_html_block
    extracted_passage: När en arbetstagare börjar på en ny arbetsplats måste hen i allmänhet ha nödvändig
      kompetens genom utbildning och tidigare arbetslivserfarenhet för sitt arbete. Dessutom förväntas
      det ofta att hen kontinuerligt fortbildar sig. Det kan innebära olika korta eller längre kurser
      där arbetstagaren kompletterar sina kunskaper och sin kompetens. En del arbetsgivare tillåter
      att man går kurser på arbetstid, och en del kurser kan ordnas av arbetsgivaren.
