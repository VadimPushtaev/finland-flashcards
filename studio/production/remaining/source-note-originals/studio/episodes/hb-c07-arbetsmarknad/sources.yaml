units:
  hb-c07-u0013:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 78
    printed_page: 77
    source_range:
      start: 194
      end: 757
    range_basis: raw_pdf_page
    extracted_passage: "Arbetsmarknaden betyder marknaden mellan arbetsgivare och arbetstagare, där\
      \ arbetstagarna söker \narbete och arbetsgivarna erbjuder arbete. När en arbetsgivare erbjuder\
      \ ett arbete åt en arbetstagare \ngör de upp ett arbetsavtal och kommer i ett anställningsförhållande\
      \ till varandra. Arbetsmarknaden är \nen viktig del av samhället, som man försöker påverka\
      \ genom politik och annat beslutsfattande. På \narbetsmarknaden verkar olika människor i olika\
      \ ställningar samt många slag av institutioner. \nArbetsmarknaden styrs av lagar, avtal och\
      \ näringslivets konjunkturer."
    normalization: whitespace_only
    repairs: []
    selection: Complete additive paragraph explaining the labour market and its negotiated institutions;
      only PDF whitespace normalized.
  hb-c07-u0014:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 78
    printed_page: 77
    source_range:
      start: 1139
      end: 1600
    range_basis: raw_pdf_page
    extracted_passage: "Den finländska arbetsmarknaden styrs av en kultur av demokratiskt förhandlande\
      \ och \növerenskommande. På arbetsmarknaden representeras enskilda människor av institutioner,\
      \ till \nexempel intresseorganisationer. De förhandlar och kommer överens om arbetsmarknadens\
      \ regler och \nåtgärder, som lönenivå, arbetstider, åtgärder som förbättrar sysselsättningen\
      \ och liknande. Det här \nsystemet kallas arbetsmarknadssystemet och det har fått sin nuvarande\
      \ form efter hand."
    normalization: whitespace_only
    repairs: []
    selection: Complete additive paragraph explaining the labour market and its negotiated institutions;
      only PDF whitespace normalized.
