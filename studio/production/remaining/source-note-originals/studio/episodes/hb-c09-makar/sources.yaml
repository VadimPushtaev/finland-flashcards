    source_kind: p
    source_role: content
    heading: Delas egendomen jämnt eller inte?
    source_range:
      start: 0
      end: 291
    range_basis: normalized_html_block
    extracted_passage: Vanligtvis delas egendomen vid skilsmässa jämnt mellan makarna. I undantagsfall
      delas egendomen inte jämnt. Då kan bodelningen jämkas. Detta betyder att man i situationen
      beaktar vad som är rimligt. Om äktenskapet till exempel har varat under fem år delas egendomen
      inte nödvändigtvis jämnt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
