    heading: Makarnas underhållsskyldighet
    source_range:
      start: 0
      end: 209
    range_basis: normalized_html_block
    extracted_passage: Vardera maken ska efter förmåga bidra till familjens gemensamma hushåll och
      makarnas underhåll. Om den ena maken inte förvärvsarbetar ska den förmögnare maken stå för
      kostnader för till exempel mat och kläder.
