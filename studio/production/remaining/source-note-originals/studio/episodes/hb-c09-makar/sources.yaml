    heading: Giftorätten reglerar delningen av egendom när ett äktenskap upphör
    source_range:
      start: 0
      end: 262
    range_basis: normalized_html_block
    extracted_passage: Giftorätten träder i kraft först när ett äktenskap upphör. Under äktenskapet
      hör en egendom till den make i vars namn den står. Makarna är ändå skyldiga att förvalta den
      egendom som omfattas av giftorätten på ett sådant sätt att dess värde inte minskar i onödan.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0103:
    source_path: data/orientation/sv/laromedel/familj/aktenskap-och-samboforhallande.html
    sha256: 0381bebf52b16f20aed2dcf900b219f5cc2f20d97cba1c9c61ccf6f9127e48e2
