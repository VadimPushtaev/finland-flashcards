    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(9) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Skulder
    source_range:
      start: 0
      end: 325
    range_basis: normalized_html_block
    extracted_passage: Vardera maken ansvarar ensam för den skuld som de har tagit före äktenskapet
      eller under det. Om den ena maken har tagit lån för att försörja familjen, till exempel för
      att köpa mat, ansvarar båda makarna för denna skuld. Om makarna vill, kan de åta sig gemensamma
      skulder. Då måste de också återbetala skulderna tillsammans.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
