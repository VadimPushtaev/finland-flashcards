    heading: Makar har sinsemellan samma rättigheter och skyldigheter i äktenskapet
    source_range:
      start: 0
      end: 233
    range_basis: normalized_html_block
    extracted_passage: 'Makarna i ett äktenskap kan ha gemensam egendom, men också egen egendom.
      Den ena maken kan till exempel inte sälja den andra makens egendom. Den ena maken kan inte
      heller sälja det gemensamma hemmet eller lösöre utan den andras lov. '
    normalization: whitespace_only
    repairs: []
    selection: Retain own-property and joint-home consent protection; replace following individual-debt
      claim by fuller InfoFinland exception.
  hb-c09-u0100:
    source_path: data/infofinland/content/family/marriage-in-finland/rights-and-obligations-of-spouses.html
    sha256: fd95625b587b374ed89558527172a2723c992d2d379ae76dcbe27efb3284a743
