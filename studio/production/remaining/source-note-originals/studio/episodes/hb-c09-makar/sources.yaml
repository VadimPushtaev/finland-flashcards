      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(31)
    source_kind: p
    source_role: content
    heading: Med ett äktenskapsförord kan giftorätten begränsas
    source_range:
      start: 0
      end: 350
    range_basis: normalized_html_block
    extracted_passage: Om makarna vill hålla sina egendomar åtskilda, kan de upprätta ett äktenskapsförord.
      I ett äktenskapsförord kan man avtala om att giftorätten inte gäller eller att den till exempel
      gäller endast en del av makarnas egendom. Med ett äktenskapsförord kommer makarna alltså överens
      om hur deras egendom ska delas om den ena dör eller det blir skilsmässa.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0104:
    source_path: data/infofinland/content/family/marriage-in-finland/getting-married-in-finland-a-check-list.html
    sha256: bb954990ac688880585ead30e10b0846deb22e7a04d892ab4358665481864186
    source_block: b0032
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(10) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Äktenskapsförord
    source_range:
      start: 0
      end: 478
    range_basis: normalized_html_block
    extracted_passage: Äktenskapsförord är frivilligt. Med äktenskapsförord kan makarna utesluta
      giftorätten till den andras egendom antingen helt eller delvis om de skiljer sig eller om den
      ena av makarna dör. Äktenskapsförord kan upprättas före äktenskapet eller under det. Båda makarna
      ska underteckna äktenskapsförordet och två ojäviga vittnen ska vidimera underskrifterna. För
      att äktenskapsförordet ska träda i kraft, måste det registreras hos Myndigheten för digitalisering
      och befolkningsdata.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0105:
