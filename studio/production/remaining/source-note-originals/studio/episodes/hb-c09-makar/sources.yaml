    heading: Giftorätten reglerar delningen av egendom när ett äktenskap upphör
    source_range:
      start: 0
      end: 402
    range_basis: normalized_html_block
    extracted_passage: Makarnas ekonomiska ställning sinsemellan tryggas genom giftorätten. Giftorätt
      betyder att makarnas hela egendom räknas ihop och delas på hälften mellan båda vid en skilsmässa.
      Om den ena maken dör, räknas den döda makens och änkans eller änklingens egendomar ihop och
      delas före arvskiftet. Giftorätten kan inte upphävas genom testamente, men den kan upphävas
      eller begränsas med ett äktenskapsförord.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0102:
    source_path: data/orientation/sv/laromedel/familj/aktenskap-och-samboforhallande.html
