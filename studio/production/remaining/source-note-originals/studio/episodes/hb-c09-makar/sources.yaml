    heading: Makar har sinsemellan samma rättigheter och skyldigheter i äktenskapet
    source_range:
      start: 0
      end: 334
    range_basis: normalized_html_block
    extracted_passage: Enligt lagen har varje människa sexuell självbestämmanderätt i äktenskapet
      och alla parförhållanden. Om en person tvingar en annan till könsumgänge, är det fråga om våldtäkt.
      Det är ett brott i äktenskapet och också utanför det. Också våld i parrelationer är ett brott
      i Finland. Man får aldrig slå eller skada sin make på något sätt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
