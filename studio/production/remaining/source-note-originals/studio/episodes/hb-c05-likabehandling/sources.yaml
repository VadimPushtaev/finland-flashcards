    heading: Jämställdhet och likabehandling tryggas genom lagstiftning
    source_range:
      start: 0
      end: 447
    range_basis: normalized_html_block
    extracted_passage: Likabehandling betyder att alla människor är lika mycket värda och att de
      har samma rättigheter oberoende av sina egenskaper. I finsk lagstiftning pratar man om likabehandling
      när man menar att alla är lika mycket värda oberoende av till exempel nationalitet, funktionsnedsättning,
      sexuell läggning eller någon annan omständighet som gäller dem som person. Syftet med diskrimineringslagen
      är att främja likabehandling och förebygga diskriminering.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
