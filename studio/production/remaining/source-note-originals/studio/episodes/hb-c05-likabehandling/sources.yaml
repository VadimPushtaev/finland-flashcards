    heading: Jämlikhet i rekryteringen
    source_range:
      start: 0
      end: 542
    range_basis: normalized_html_block
    extracted_passage: Diskrimineringslagen förutsätter att alla arbetssökande behandlas lika. Arbetsgivaren
      måste välja den sökande som har de bästa meriterna för uppgiften. Arbetsgivaren ska också kunna
      bevisa att det finns godtagbara grunder för valet som anknyter till arbetets karaktär och att
      valet inte har varit diskriminerande. Man får inte kräva sådana egenskaper av arbetssökanden
      som inte är nödvändiga för att utföra arbetet. Arbetsgivaren får till exempel inte kräva att
      du ska behärska finska språket fullständigt om det inte är nödvändigt i arbetet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
