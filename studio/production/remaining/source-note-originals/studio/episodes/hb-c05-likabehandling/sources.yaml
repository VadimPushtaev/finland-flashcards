    range_basis: normalized_html_block
    extracted_passage: Enligt diskrimineringslagen ska alla människor i Finland ha samma möjligheter
      att studera, arbeta och ta del av tjänster. Enligt lagen ska myndigheterna främja likabehandling
      i all sin verksamhet.
