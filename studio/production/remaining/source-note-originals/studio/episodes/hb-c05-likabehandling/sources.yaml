    heading: Diskriminering kan vara ett brott
    source_range:
      start: 0
      end: 368
    range_basis: normalized_html_block
    extracted_passage: Diskriminering betyder att en människa eller en grupp behandlas sämre än andra.
      Det är fråga om diskriminering också om en skenbart jämlik regel eller praxis i praktiken leder
      till att en människa eller en grupp försätts i en svagare ställning än andra och det inte finns
      någon godtagbar grund för regeln eller praxisen. Diskriminering kan i vissa fall vara ett brott.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
