    source_range:
      start: 0
      end: 387
    range_basis: normalized_html_block
    extracted_passage: Arbetsgivaren får inte diskriminera dig vid beslut om fördelning av arbetsuppgifter,
      möjligheter till avancemang eller upphävande av anställningen. Dessutom måste arbetsgivaren
      se till att du, om du har ett annat modersmål än finska eller svenska, får information om de
      viktigaste villkoren för anställningsförhållandet samt vägledning i dina arbetsuppgifter på
      ett språk som du förstår.
