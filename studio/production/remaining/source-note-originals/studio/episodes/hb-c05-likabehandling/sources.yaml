    heading: Diskrimineringslagen förbjuder diskriminering på grund av till exempel ursprung och
      funktionsnedsättning
    source_range:
      start: 0
      end: 453
    range_basis: normalized_html_block
    extracted_passage: Lagen förbjuder diskriminering på grund av ålder, ursprung, nationalitet,
      språk, religion, övertygelse, åsikt, politisk verksamhet, fackföreningsverksamhet, familjeförhållanden,
      hälsotillstånd, funktionsnedsättning, sexuell läggning eller någon annan omständighet som gäller
      den enskilde som person. Ingen får hamna i en sämre ställning på grund av dessa orsaker. Efterlevnaden
      av diskrimineringslagen övervakas i Finland av en diskrimineringsombudsman.
    normalization: whitespace_only
    repairs: []
