    source_kind: p
    source_role: content
    heading: På jobbet utan diskriminering
    source_range:
      start: 0
      end: 617
    range_basis: normalized_html_block
    extracted_passage: Om jämlikhet och jämställdhet föreskrivs i diskrimineringslagen (yhdenvertaisuuslaki),
      lagen om jämställdhet mellan kvinnor och män (tasa-arvolaki) och i arbetsavtalslagen (työsopimuslaki).
      Enligt dessa ska anställda behandlas lika när det gäller anställning, arbetsförhållanden, anställningsvillkor,
      utbildning för personalen och avancemang i karriären. I Finland måste alla arbetsgivare främja
      jämlikhet och jämställdhet. Om det finns 30 eller fler arbetstagare på en arbetsplats, ska
      arbetsgivaren utarbeta en skriftlig jämställdhetsplan (tasa-arvosuunnitelma) och likabehandlingsplan
      (yhdenvertaisuussuunnitelma).
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
