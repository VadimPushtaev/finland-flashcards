    heading: Barnets föräldrar är vanligtvis också hens vårdnadshavare
    source_range:
      start: 0
      end: 465
    range_basis: normalized_html_block
    extracted_passage: I Finland kan ett barn officiellt ha en eller två föräldrar, det vill säga
      mammor eller pappor. Det officiella föräldraskapet baserar sig ofta på det biologiska föräldraskapet,
      men ibland kan den officiella föräldern vara någon annan än barnets biologiska förälder. Så
      kan det vara till exempel om ett barn i en regnbågsfamilj officiellt har två mammor, eller
      om föräldraskapet för barnet har överförts till en adoptivförälder eller adoptivföräldrar genom
      adoption.
    normalization: whitespace_only
