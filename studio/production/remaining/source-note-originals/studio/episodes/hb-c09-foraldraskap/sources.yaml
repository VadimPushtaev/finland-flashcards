    range_basis: normalized_html_block
    extracted_passage: Det officiella föräldraskapet som fastställs i lag motsvarar inte alltid den
      verklighet som familjen lever i. Numera anser man i Finland att föräldraskap ofta handlar mer
      om de känslomässiga banden mellan familjemedlemmarna och det liv de delar snarare än enbart
      om det biologiska eller officiella föräldraskapet. I praktiken innebär föräldraskap att man
      tar hand om och uppfostrar ett barn, ser till hens behov och älskar hen.
