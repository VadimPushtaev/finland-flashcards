    extracted_passage: "I den kristna kalendern är midsommaren Johannes döparens födelsedag, men\
      \ festen är mycket äldre \nän kristendomen. Redan för länge sedan firades ljusets och sommarens\
      \ fest på årets längsta dag.  \n"
    normalization: whitespace_only
    repairs: []
