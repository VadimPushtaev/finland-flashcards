      end: 1286
    range_basis: raw_pdf_page
    extracted_passage: "På midsommaren tänds stora brasor på stränder och klippor. Brasorna är en\
      \ gammal tradition som \nursprungligen var till för att avvärja ondska. På midsommaren pryds\
      \ dörrposterna med små björkar. \nMänniskor sysslar också lekfullt med midsommartrolldom. Syftet\
      \ med den var tidigare att trygga en \ngod skörd och ta reda på vem man skulle gifta sig med\
      \ och när.    \n"
    normalization: whitespace_only
    repairs: []
