    extracted_passage: Midsommar firas i slutet av juni. Midsommar är en högtid som firas nära sommarsolståndet.
      Många finländare åker gärna till stugan på midsommaren. Stora midsommareldar hör till de finländska
      midsommartraditionerna. I södra Finland reser man ibland också midsommarstången.
    normalization: whitespace_only
