    heading: I krigen mot Sovjetunionen led man stora förluster, men bevarade självständigheten
    source_range:
      start: 0
      end: 330
    range_basis: normalized_html_block
    extracted_passage: Även om bara två årtionden hade gått sedan inbördeskriget, stred finländarna
      nu sida vid sida mot Sovjetunionen. Finländarnas gemensamma mål var att bevara sin självständighet.
      Man ville glömma de gamla meningsskiljaktigheterna, och i medierna lyftes det finska folkets
      enighet fram. Det gav människorna kraft att överleva kriget.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
