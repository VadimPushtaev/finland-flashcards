    heading: I krigen mot Sovjetunionen led man stora förluster, men bevarade självständigheten
    source_range:
      start: 0
      end: 358
    range_basis: normalized_html_block
    extracted_passage: Dessa krig har stor betydelse för finländarna. I krigen dog uppemot 100 000
      soldater. Krigen sammanförde folket, och Finland förblev en självständig stat. Krigsupplevelserna
      förenade de generationer som var med om krigen. De arbetade för sitt land och levde under hårda
      och fattiga förhållanden efter kriget. Många led på grund av traumatiska krigshändelser.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
