    heading: I krigen mot Sovjetunionen led man stora förluster, men bevarade självständigheten
    source_range:
      start: 0
      end: 412
    range_basis: normalized_html_block
    extracted_passage: Som en följd av krigen förlorade Finland stora områden till Sovjetunionen.
      Människorna som bodde i dessa områden blev tvungna att lämna sina hem och evakuerades till
      andra ställen i Finland. Där var lokalbefolkningen länge misstänksam mot invandrarna på grund
      av deras annorlunda seder, dialekter och religion. De som evakuerades var också tvungna att
      lämna kvar en stor del av sin egendom på den gamla hemorten.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
