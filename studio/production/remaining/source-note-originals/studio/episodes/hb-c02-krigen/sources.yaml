    range_basis: normalized_html_block
    extracted_passage: Finland tvingades också betala stora krigsskadestånd till Sovjetunionen. Dessutom
      brände Finlands tidigare allierade tyskarna, som i slutet av kriget blivit fiender, en stor
      del av Lappland när de drevs ut ur Finland under Lapplandskriget. Återuppbyggnaden tog lång
      tid.
    normalization: whitespace_only
