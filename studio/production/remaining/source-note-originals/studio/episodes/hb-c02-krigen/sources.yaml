    heading: I krigen mot Sovjetunionen led man stora förluster, men bevarade självständigheten
    source_range:
      start: 0
      end: 230
    range_basis: normalized_html_block
    extracted_passage: Den fredliga utvecklingen i samhället avbröts när Sovjetunionen anföll Finland
      hösten 1939. Bakgrunden till anfallet var de landavträdelser som Sovjetunionen krävde och som
      Finland inte gick med på. Detta krig kallas vinterkriget.
    normalization: whitespace_only
    repairs: []
