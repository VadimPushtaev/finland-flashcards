    source_range:
      start: 0
      end: 330
    range_basis: normalized_html_block
    extracted_passage: Under andra världskriget utkämpade Finland två krig mot Sovjetunionen, vinterkriget
      och fortsättningskriget. I fortsättningskriget stred Finland vid Tysklands sida för att försöka
      vinna tillbaka de landområden som gått förlorade i vinterkriget. Efter det utkämpade Finland
      ännu Lapplandskriget mot sin tidigare allierade Tyskland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
