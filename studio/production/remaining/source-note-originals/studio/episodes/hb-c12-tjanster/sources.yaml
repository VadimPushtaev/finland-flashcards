    extracted_passage: Innan utbildningen börjar är det möjligt att den studerande genomgår ett test,
      där man testar språkkunskaperna och studiefärdigheterna. På basis av testet hänvisas hen till
      en lämplig utbildning. I integrationsutbildningen ingår också karriärvägledning och en eller
      flera perioder av lärande på en arbetsplats. Under en period av lärande på arbetsplatsen lär
      sig den studerande språket bättre och stärker sin yrkeskompetens på en finländsk arbetsplats.
