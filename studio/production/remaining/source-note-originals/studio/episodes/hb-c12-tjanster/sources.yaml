    range_basis: normalized_html_block
    extracted_passage: I integrationsplanen anges de tjänster och åtgärder som ska hjälpa den nyanlända
      att lära sig finska eller svenska och hitta till exempel ett arbete eller en studieplats. Den
      första integrationsplanen gäller i högst ett år och kan förlängas med ett år till. I vissa
      fall kan planen förlängas ytterligare, till exempel om den inte har kunnat genomföras som planerat
      på grund av föräldraledighet eller sjukdom.
