    heading: Utifrån bedömningen av servicebehovet upprättas en integrationsplan
    source_range:
      start: 0
      end: 516
    range_basis: normalized_html_block
    extracted_passage: En bedömning av kompetensen och behovet av integrationstjänster görs under
      de första åren efter flytten till landet, dock senast tre år efter att det första uppehållstillståndet
      eller uppehållskortet beviljades eller uppehållsrätten registrerades. I bedömningen av kompetensen
      och behovet av integrationstjänster bedömer kommunen eller arbetskraftsmyndigheten hurdan kompetens
      den nyanlända har, vilka hens mål och förväntningar är samt hurdana förutsättningar hen har
      för att integrera sig, få arbete eller studera.
    normalization: whitespace_only
    repairs: []
