    heading: Integrationsutbildning är en viktig tjänst som främjar integration
    source_range:
      start: 0
      end: 388
    range_basis: normalized_html_block
    extracted_passage: Under integrationsutbildningen studerar den nyanlända finska eller svenska
      samt viktiga frågor om det finländska samhället och arbetslivet. Integrationsutbildningen pågår
      i allmänhet i omkring ett år, men utbildningens längd, omfattning och innehåll kan variera
      enligt varje deltagares behov. Efter integrationsutbildningen är tanken att den nyanlända ska
      söka arbete eller börja studera.
