    heading: Man kan få internationellt skydd om man inte kan återvända till sitt hemland på grund
      av förföljelse eller en konflikt
    source_range:
      start: 0
      end: 437
    range_basis: normalized_html_block
    extracted_passage: Tillfälligt skydd kan ges i situationer där ett stort antal människor har
      varit tvungna att fly samtidigt till följd av till exempel krig. Tillfälligt skydd har i Finland
      beviljats personer som flytt kriget i Ukraina, som startade år 2022. Beviljande av tillfälligt
      skydd gör det möjligt att erbjuda ett begränsat antal människor skydd genom en snabb process
      som är enklare än asylförfarandet. Det har ursprungligen reglerats på EU-nivå.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
