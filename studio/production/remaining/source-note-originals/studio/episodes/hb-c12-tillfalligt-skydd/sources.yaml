    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/temporary-protection-in-finland.html
    sha256: 59570d41ecc4488cd55e49f43889ab01133ce3eea50c43d718952e2b5e90c6e6
    source_block: b0029
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Arbete och studier i Finland
    source_range:
      start: 0
      end: 334
    range_basis: normalized_html_block
    extracted_passage: Du har rätt att arbeta och studera i Finland omedelbart efter att du har ansökt
      om tillfälligt skydd. Du får arbeta utan några begränsningar, alltså i vilken bransch som helst.
      När du har fått uppehållstillstånd har du också rätt att ta del av tjänsterna för arbetslösa
      vid sysselsättningstjänsterna (työllisyyspalvelut) i din kommun.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0204:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/temporary-protection-in-finland.html
    sha256: 59570d41ecc4488cd55e49f43889ab01133ce3eea50c43d718952e2b5e90c6e6
    source_block: b0039
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(11) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Rätt till den sociala tryggheten i Finland
    source_range:
      start: 0
      end: 315
    range_basis: normalized_html_block
    extracted_passage: Du kan få rätt till FPA:s förmåner om du arbetar i Finland eller har bott
      i Finland minst ett år. Före detta har du rätt till mottagningscentrets tjänster. Du kan få
      mottagningspenning om dina eller dina familjemedlemmars inkomster och tillgångar inte räcker
      till den nödvändiga försörjningen, såsom mat och kläder.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
