    heading: I Finland byggdes vägar och fabriker och startades skolor
    source_range:
      start: 0
      end: 370
    range_basis: normalized_html_block
    extracted_passage: Under det ryska styret var det länge lugnt i Finland. Människorna var nöjda
      när det inte förekom några krig och samhället utvecklades. I Finland byggdes landsvägar, järnvägar
      och fabriker. Dessutom startades många skolor i Finland där folket lärde sig läsa och skriva.
      Vanliga människor diskuterade politik, startade organisationer och försökte påverka i samhällsfrågor.
    normalization: whitespace_only
    repairs: []
