    heading: Industrialiseringen fick människor att flytta från landet till städerna
    source_range:
      start: 0
      end: 367
    range_basis: normalized_html_block
    extracted_passage: Finlands folkmängd ökade från omkring en miljon till över tre miljoner. Samtidigt
      utvecklades jordbruksproduktionen, även om jordbruket producerade tillräckligt med mat för
      människorna i bara en del av landet. I Finland tog industrialiseringen fart först på 1880-talet,
      när pappersindustrin utvecklades. Från Finland exporterades främst produkter från skogsindustrin.
    normalization: whitespace_only
    repairs: []
