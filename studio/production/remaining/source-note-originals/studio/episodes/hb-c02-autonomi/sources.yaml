    heading: Under det ryska styret började det autonoma Finland industrialiseras
    source_range:
      start: 0
      end: 401
    range_basis: normalized_html_block
    extracted_passage: Finland blev en del av det ryska riket år 1809, då Sverige förlorade ett krig
      som det förde mot Ryssland. Under det ryska styret fortsatte utvecklingen av det finska samhället.
      Den ryska kejsaren beviljade Finland autonomi, det vill säga självstyre. Finland fick till
      exempel behålla sina gamla lagar från den svenska tiden och den lutherska tron. Finland fick
      också ordna egna lagstiftande lantdagar.
    normalization: whitespace_only
    repairs: []
