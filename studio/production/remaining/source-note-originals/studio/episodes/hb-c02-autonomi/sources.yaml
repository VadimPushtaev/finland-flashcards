    heading: Industrialiseringen fick människor att flytta från landet till städerna
    source_range:
      start: 0
      end: 250
    range_basis: normalized_html_block
    extracted_passage: 1800-talet var en period av stora förändringar i Europa. Europa industrialiserades
      och man började tillverka varor genom massproduktion. För det behövdes mycket arbetskraft och
      råvaror. Människorna flyttade till städerna och utomlands för att arbeta.
    normalization: whitespace_only
