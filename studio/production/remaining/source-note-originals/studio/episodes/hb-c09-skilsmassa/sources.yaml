    range_basis: normalized_html_block
    extracted_passage: Skilsmässa betyder att ett äktenskap upplöses. Makarna kan ansöka om skilsmässa
      tillsammans, eller så kan den ena maken ansöka på egen hand. För en skilsmässa behövs inte
      bådas samtycke och inga särskilda förklaringar. Man ansöker om skilsmässa skriftligt hos en
      tingsrätt. Rätten utreder inte varför makarna ansöker om skilsmässa.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
