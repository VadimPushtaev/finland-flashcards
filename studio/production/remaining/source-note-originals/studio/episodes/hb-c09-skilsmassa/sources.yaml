    source_range:
      start: 0
      end: 298
    range_basis: normalized_html_block
    extracted_passage: Ansökan om skilsmässa görs i två steg. Först lämnar man in skilsmässoansökan.
      Efter betänketiden fullföljer man sin ansökan med en ny ansökan. Domstolen dömer till skilsmässa
      först efter att den andra ansökan har lämnats in. Parterna döms till skilsmässa även om den
      andra parten motsätter sig det.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
