    heading: Samhällets stöd underlättar familjernas vardag
    source_range:
      start: 0
      end: 366
    range_basis: normalized_html_block
    extracted_passage: Föräldrarna ansvarar för omsorgen om och uppfostran av barnet. De har dock
      rätt att få hjälp av samhället om de behöver. I Finland bedriver myndigheterna mycket förebyggande
      arbete med barn och familjer. Det betyder att samhället försöker stödja barn, föräldrar och
      familjer redan innan problemen blir stora. Ibland behöver familjer mer stöd i svåra livssituationer.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
