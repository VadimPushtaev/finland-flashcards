    heading: Samhällets stöd underlättar familjernas vardag
    source_range:
      start: 0
      end: 256
    range_basis: normalized_html_block
    extracted_passage: Familjer kan ta del av många olika slags tjänster som kan underlätta vardagen
      och förhindra problem. Man kan få hjälp och stöd hos till exempel rådgivningsbyråerna, skolan,
      olika organisationer och föreningar eller församlingen och andra religiösa samfund.
    normalization: whitespace_only
