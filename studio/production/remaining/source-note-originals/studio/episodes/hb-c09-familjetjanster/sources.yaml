    heading: Socialtjänster för barnfamiljer stöder familjer på många olika sätt
    source_range:
      start: 0
      end: 160
    range_basis: normalized_html_block
    extracted_passage: En stödperson hjälper barnet med till exempel hobbyer och läxor. En stödfamilj
      är en vanlig familj som barnet ibland kan bo hos, till exempel en helg per månad.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0335:
