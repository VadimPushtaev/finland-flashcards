    heading: Socialtjänster för barnfamiljer stöder familjer på många olika sätt
    source_range:
      start: 0
      end: 282
    range_basis: normalized_html_block
    extracted_passage: Hemservice innebär att familjen får hembesök av en yrkesperson som hjälper
      till med hushållssysslor, till exempel städning, inköp eller barnomsorg. Man kan få hemservice
      om familjen behöver särskilt stöd. Det kan vara aktuellt till exempel om den ena föräldern
      blir allvarligt sjuk.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
