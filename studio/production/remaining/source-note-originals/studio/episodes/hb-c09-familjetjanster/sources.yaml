    heading: Socialtjänster för barnfamiljer stöder familjer på många olika sätt
    source_range:
      start: 0
      end: 382
    range_basis: normalized_html_block
    extracted_passage: Om stödet som ges via de tjänster som är gemensamma för alla inte är tillräckligt,
      kan man få hjälp via socialtjänsterna för barnfamiljer. Dessa tjänster omfattar bland annat
      handledning och rådgivning, ekonomiskt stöd, hemservice och en stödperson eller en stödfamilj.
      Barnets skolgång och hobbyer kan också stödjas. Genom att vara klient hos barnskyddet får man
      dessutom mer stöd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0333:
    source_path: data/orientation/sv/laromedel/familj/tjanster-for-barnfamiljer.html
