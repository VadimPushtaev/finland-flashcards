      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(47)
    source_kind: p
    source_role: content
    heading: Socialtjänster för barnfamiljer stöder familjer på många olika sätt
    source_range:
      start: 0
      end: 461
    range_basis: normalized_html_block
    extracted_passage: Utgångspunkten är att man försöker hjälpa barnet på ett sådant sätt att hen
      kan bo hemma med sin familj. Om barnets eller familjens situation kräver utomstående hjälp,
      försöker man alltid tillämpa lindrigast möjliga metod. Inom barnskyddet kallas dessa tjänster
      för stödåtgärder inom öppenvården. Stödåtgärderna är alltid frivilliga och bygger på samarbete
      med familjen. Nuförtiden kan man ta del av många av stödåtgärderna utan att vara klient hos
      barnskyddet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0336:
    source_path: data/infofinland/content/family/children/bringing-up-children-in-finland.html
    sha256: eed869b5690338818c3ed5bc210f005d96ecc700929038c771136f1d23858f1d
    source_block: b0012
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Hemservice för barnfamiljer
    source_range:
      start: 0
      end: 514
    range_basis: normalized_html_block
    extracted_passage: Om familjen har fått en baby, om en vuxen person i familjen är utmattad eller
      om familjen befinner sig i någon annan särskild situation kan man ansöka om hemservice. Hemservicen
      för barnfamiljer är praktisk hjälp i hushållsarbeten eller barnpassning som är avsedd att underlätta
      familjens vardag och barnfostran. Barnfamiljer kan ansöka om hemservice tillfälligt eller regelbundet
      om familjens situation kräver detta. Hemservicen är vanligtvis avgiftsbelagd. Familjens inkomster
      påverkar avgiften och dess storlek.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0337:
    source_path: data/infofinland/content/family/problems-in-the-family.html
    sha256: 0a16e31b3058f51b97f5f7b210636109dbe26e23ad612ba40e4fc6d5e0b2c532
    source_block: b0014
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Om du har ekonomiska svårigheter
    source_range:
      start: 0
      end: 343
    range_basis: normalized_html_block
    extracted_passage: Om du har problem med att betala räkningar, kan du få hjälp med och rådgivning
      om ekonomin. Om din inkomst minskar ska du ta reda på din rätt att få till exempel bostadsbidrag.
      Om dina inkomster och tillgångar inte räcker till den nödvändiga dagliga försörjningen, till
      exempel mat och läkemedel, kan du ha rätt till grundläggande utkomststöd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0338:
    source_path: data/infofinland/content/family/problems-in-the-family.html
    sha256: 0a16e31b3058f51b97f5f7b210636109dbe26e23ad612ba40e4fc6d5e0b2c532
    source_block: b0018
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Problem i skolan eller med studierna
    source_range:
      start: 0
      end: 253
    range_basis: normalized_html_block
    extracted_passage: Om ett barn eller en ung har problem i skolan eller med studierna är det bra
      att diskutera situationen med skolans eller läroanstaltens studievägledare. I skolan arbetar
      även en psykolog eller en kurator. Hen hjälper elever som har svårigheter i skolan.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0339:
    source_path: data/infofinland/content/family/problems-in-the-family.html
    sha256: 0a16e31b3058f51b97f5f7b210636109dbe26e23ad612ba40e4fc6d5e0b2c532
    source_block: b0019
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Problem i skolan eller med studierna
    source_range:
      start: 0
      end: 275
    range_basis: normalized_html_block
    extracted_passage: Om ett barn eller en ung blir mobbad i skolan är det skolans skyldighet att
      ingripa i detta. Berätta om mobbning för läraren eller rektorn. Ibland kan mobbning även vara
      ett brott enligt lagen, som kan anmälas till polisen. Till exempel fysiskt våld eller stjälande
      är brott.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0340:
    source_path: data/infofinland/content/family/problems-in-the-family.html
    sha256: 0a16e31b3058f51b97f5f7b210636109dbe26e23ad612ba40e4fc6d5e0b2c532
    source_block: b0021
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Rusmedelsbruk
    source_range:
      start: 0
      end: 223
    range_basis: normalized_html_block
    extracted_passage: Om en ung har problem med alkohol, droger eller spelande, kan hen få hjälp
      vid ungdomsstationen (nuorisoasema). Ungdomsstationer finns i många städer. Den unga kan komma
      till ungdomsstationen ensam eller med sina föräldrar.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0341:
    source_path: data/infofinland/content/family/problems-in-the-family.html
    sha256: 0a16e31b3058f51b97f5f7b210636109dbe26e23ad612ba40e4fc6d5e0b2c532
    source_block: b0023
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Brott
    source_range:
      start: 0
      end: 202
    range_basis: normalized_html_block
    extracted_passage: Brott har påföljder för personer under 15 år. Personen är skyldig att ersätta
      de skador som hen orsakat. Polisen anmäler brott som begåtts av barn under 18 år till föräldrarna
      och barnskyddsmyndigheten.
    normalization: whitespace_only
    repairs: []
