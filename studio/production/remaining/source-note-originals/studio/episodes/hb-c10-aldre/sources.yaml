    heading: Det är viktigt att ta hand om sin hälsa och sitt välbefinnande också när man är gammal
    source_range:
      start: 0
      end: 425
    range_basis: normalized_html_block
    extracted_passage: Man kan påverka sin hälsa och sitt välbefinnande genom sina levnadsvanor genom
      hela livet. Människans funktionsförmåga fortsätter att vara god när hen träffar andra människor
      och är aktiv. Dessutom är det bra att äta mångsidigt, motionera, undvika övervikt, låta blir
      att röka och undvika alkohol eller endast dricka måttligt. En god funktionsförmåga hjälper
      en att klara sig i vardagen och ta hand om sig själv och sitt hem.
    normalization: whitespace_only
    repairs: []
