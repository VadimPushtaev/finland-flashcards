    heading: Det är viktigt att ta hand om sin hälsa och sitt välbefinnande också när man är gammal
    source_range:
      start: 0
      end: 531
    range_basis: normalized_html_block
    extracted_passage: När en människa blir äldre är det viktigt att hen fortsätter att ta hand om
      sin hälsa. Betydelsen av att bibehålla hälsan, välbefinnandet och funktionsförmågan ökar när
      man blir äldre. Åldrandet orsakar förändringar i människans kropp. Det kan bli svårare att
      röra sig och man har kanske mindre krafter. Man kan ha problem med minnet. Olika sjukdomar
      kan förändra kroppen och försämra ens funktionsförmåga. Vanliga sjukdomar bland äldre i Finland
      är till exempel minnessjukdomar, diabetes, hjärtsjukdomar, lungsjukdomar och cancer.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
