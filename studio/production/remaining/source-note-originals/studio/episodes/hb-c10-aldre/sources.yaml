    range_basis: normalized_html_block
    extracted_passage: Välfärdsområdenas dagcenter ordnar dagverksamhet för äldre. Verksamheten stöder
      hemvården och hjälper den äldre att klara sig hemma och närståendevårdaren att orka. De äldre
      kan tillbringa tid på dagcentret och träffa andra människor. De kan också delta i motions-,
      rekreations- och kulturtjänster, till exempel teaterföreställningar. Välfärdsområdet ordnar
      transporten till dagcentret och serverar vanligtvis en måltid under dagen. En separat avgift
      kan tas ut för färdtjänsten.
