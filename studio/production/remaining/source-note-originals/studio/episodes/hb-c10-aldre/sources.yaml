    source_range:
      start: 0
      end: 498
    range_basis: normalized_html_block
    extracted_passage: Många kriser, förändringar och förluster i livet påverkar människans humör.
      En bra vardag gör att den äldre håller sig vid god psykisk hälsa. När en människa blir äldre
      blir ofta minnet sämre och hen glömmer saker. Det är viktigt att njuta av sitt liv och hitta
      källor till glädje i alla åldrar. Ett aktivt liv och att träffa andra människor ger glädje
      i vardagen. Kommunerna ordnar fritidsverksamhet för äldre. Också många föreningar, organisationer
      och församlingar ordnar verksamhet och klubbar.
