    extracted_passage: Alla som köper varor och tjänster är konsumenter. Konsumentskyddslagen tryggar
      konsumentens rättigheter i Finland. Du har rätt till gottgörelse till exempel då varan som
      du köpt har fel som inte du har orsakat. Du kan till exempel ersättas med en felfri vara eller
      få dina pengar tillbaka.
