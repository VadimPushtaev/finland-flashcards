    range_basis: normalized_html_block
    extracted_passage: Sexuella rättigheter avser individens rätt att själv bestämma över ssådant
      som rör hens sexualitet. De sexuella rättigheterna anknyter till självbestämmanderätten, det
      vill säga till det faktum att människan har rätt att bestämma över sitt liv och göra egna val.
      Var och en i Finland har rätt att bestämma över sin egen sexualitet och sin egen kropp också
      i kärleksrelationer och äktenskapet. De sexuella rättigheterna tillhör alla oavsett kön, etnisk
      bakgrund, sexuell läggning och hälsotillstånd.
