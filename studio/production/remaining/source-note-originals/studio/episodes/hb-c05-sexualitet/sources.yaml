    range_basis: normalized_html_block
    extracted_passage: Alla är skyldiga att respektera andras sexuella gränser och begär och önskemål
      i fråga om sexualiteten. I Finland anser man att en människa är skyldig att säkerställa att
      den andra samtycker till beröring och olika sexuella handlingar. Samtycket kan ges i ord, men
      också uttryckas med gester eller handlingar. Samtycke till sexuella handlingar behövs också
      mellan personer i ett äktenskap och ett parförhållande. Det borde inte heller endast vara fråga
      om att alla parter samtycker till sex. Att respektera den andra handlar också om att säkerställa
      att alla parter upplever att sexet är njutningsfullt.
