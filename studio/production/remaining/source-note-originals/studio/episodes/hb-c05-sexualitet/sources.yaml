    range_basis: normalized_html_block
    extracted_passage: Kroppslig självbestämmanderätt betyder att var och en har makt att fatta självständiga
      beslut om sin egen kropp utan våld eller tvång. Det innebär makt att bestämma när och med vem
      man vill ha en relation eller sex, eller om man överhuvudtaget vill ha dessa. Om en person
      säger nej, betyder det alltid att hen inte vill. Till självbestämmanderätten hör också makt
