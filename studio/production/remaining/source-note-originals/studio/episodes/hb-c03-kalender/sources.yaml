    extracted_passage: En del av högtiderna, till exempel jul och påsk, är allmänna lediga dagar.
      Då är också många butiker och ämbetsverk stängda. Ett sätt att fira en helgdag är att hissa
      flaggan. I Finland flaggar man på bestämda dagar som är intagna i kalendern. Både myndigheter
      och vanliga människor deltar i flaggdagarna. I Finland är flaggan något högtidligt.
