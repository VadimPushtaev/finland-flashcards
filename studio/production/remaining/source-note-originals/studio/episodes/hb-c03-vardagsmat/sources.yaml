    heading: I skolor, på daghem och arbetsplatser följs en ganska noggrann matrytm
    source_range:
      start: 0
      end: 516
    range_basis: normalized_html_block
    extracted_passage: På morgonen äter man frukost enligt vilken tid man vaknar. Lunch serveras
      tidigare än i många andra länder, omkring kl. 10.30–12. Lunchen består vanligtvis av varm mat,
      vilket innebär att många äter två varma måltider per dag. Lunchrasten är ganska kort både i
      skolorna och på arbetsplatserna. På grund av den tidiga lunchen äter många middag hemma redan
      kl. 17 eller 18. Dessutom är det vanligt att äta en lätt kvällsmåltid omkring kl. 20. I synnerhet
      för barnen är också mellanmålen mellan huvudmåltiderna viktiga.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
