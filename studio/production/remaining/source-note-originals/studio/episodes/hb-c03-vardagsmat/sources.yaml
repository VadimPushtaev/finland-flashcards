    heading: Det finns många olika slags vardagsmat
    source_range:
      start: 0
      end: 361
    range_basis: normalized_html_block
    extracted_passage: En del äter fisk, kött och potatis till vardags, medan andra lagar pastarätter
      eller köper hem sushi från en restaurang. I affären köper man fryspizza och portioner av färdigmat
      som värms i mikron. Typiska vardagsfavoriter är till exempel ugnslax, makaronilåda, köttbullar,
      köttfärssås, stekt fisk och soppor och olika gryt- och gröträtter som tillagas i ugnen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
