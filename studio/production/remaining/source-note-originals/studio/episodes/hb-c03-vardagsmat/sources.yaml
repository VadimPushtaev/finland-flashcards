    heading: På vardagar äts lunchen i skolans eller arbetsplatsens matsal
    source_range:
      start: 0
      end: 531
    range_basis: normalized_html_block
    extracted_passage: Ett typiskt kännetecken för den finländska vardagsmaten är att äta tillsammans.
      I skolan får barnen gratis skolmat, som består av en varm lunchrätt. I daghemmen får barnen
      förutom lunch också frukost och mellanmål. En del av de vuxna som arbetar äter sin lunch i
      en matsal eller på en restaurang, medan andra har egen matsäck med sig. Den kan förvaras i
      kylskåpet på arbetsplatsen i väntan på lunchrasten. Många restauranger som serverar kvällsmat
      har vid lunchtid ett buffébord, där man själv får ta den mat man vill på tallriken.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
