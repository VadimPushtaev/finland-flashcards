    heading: Gröt, bröd och kaffe till frukost
    source_range:
      start: 0
      end: 394
    range_basis: normalized_html_block
    extracted_passage: I Finland är det vanligt att äta gröt och bröd och dricka kaffe eller te till
      frukost. Många finländare gillar gröt och lagar olika slags gröt i mikron, på spisen eller
      i ugnen. Gröt lagas av till exempel havreflingor eller havregryn och vatten eller mjölk. I
      Finland bakas många olika slags bröd. Karakteristiskt för den finländska brödkulturen är den
      stora mängden och variationen av rågbröd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
