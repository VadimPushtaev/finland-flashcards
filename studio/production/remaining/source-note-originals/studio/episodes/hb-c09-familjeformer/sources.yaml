    heading: Ett par kan vara frivilligt eller ofrivilligt barnlöst
    source_range:
      start: 0
      end: 303
    range_basis: normalized_html_block
    extracted_passage: Man kan erbjuda ett barn eller en ung person ett hem också genom att bli familjehemsförälder.
      En familjehemsförälder öppnar sitt hem för ett barn som det av någon orsak inte är tryggt för
      att bo hos sina föräldrar. Barnet tas om hand av familjehemsföräldrarna tills vidare, ibland
      tills hen blir myndig.
