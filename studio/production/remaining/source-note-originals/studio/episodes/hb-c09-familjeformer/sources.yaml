    heading: I en bonusfamilj finns det barn från föräldrarnas tidigare förhållanden
    source_range:
      start: 0
      end: 388
    range_basis: normalized_html_block
    extracted_passage: I Finland är det vanligt att människor som skilt sig hittar en ny partner,
      flyttar ihop och ofta också gifter sig på nytt. Med bonusfamilj avses en familj där det finns
      barn från den ena eller båda föräldrarnas tidigare förhållanden. I en bonusfamilj kan det också
      finnas gemensamma barn. Ofta kan barnen i en bonusfamilj ha två hem. Då bor barnen hos den
      andra föräldern en del av tiden.
