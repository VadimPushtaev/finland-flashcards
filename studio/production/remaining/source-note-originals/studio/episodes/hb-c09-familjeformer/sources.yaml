    heading: En kärnfamilj består av föräldrar och deras gemensamma barn
    source_range:
      start: 0
      end: 470
    range_basis: normalized_html_block
    extracted_passage: Den vanligaste typen av barnfamilj i Finland är kärnfamiljen, det vill säga
      två föräldrar och deras gemensamma barn. Av föräldrarna i barnfamiljerna är största delen gifta
      med varandra. Andelen familjer där föräldrarna inte är gifta har ändå ökat i jämn takt. Endast
      en mycket liten del av människorna i Finland lever i familjer som består av fler än två generationer.
      Det innebär en familj där minst en far- eller morförälder bor tillsammans med sina barn och
      barnbarn.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
