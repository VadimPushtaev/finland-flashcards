    heading: Familjer med en förälder
    source_range:
      start: 0
      end: 343
    range_basis: normalized_html_block
    extracted_passage: I familjer med en förälder bor en förälder med barnen utan make eller maka.
      Föräldern kan då ha antingen ensam eller gemensam vårdnad om barnet. Som ensamstående förälder
      har man själv ansvaret för fostran av barnet. Om föräldrarna däremot har gemensam vårdnad (yhteishuoltaja)
      kommer föräldrarna tillsammans överens om barnets angelägenheter.
    normalization: whitespace_only
