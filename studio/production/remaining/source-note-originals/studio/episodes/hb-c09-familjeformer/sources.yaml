    heading: Ett par kan vara frivilligt eller ofrivilligt barnlöst
    source_range:
      start: 0
      end: 537
    range_basis: normalized_html_block
    extracted_passage: En del par får inga barn, även om de skulle vilja. För dem finns det fertilitetsbehandlingar
      som ökar sannolikheten att bli gravid och få barn. Par kan också överväga att adoptera ett
      barn. Ett adoptivbarn är biologiskt sett någon annans barn, men genom adoption, det vill säga
      att personen blir att betrakta som barn till de som adopterar, får hen nya föräldrar. I Finland
      adopteras barn ofta från utlandet. Adoptionsprocessen är fastställd i lag. Den börjar med en
      lagstadgad adoptionsrådgivning, där familjens livssituation kartläggs.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
