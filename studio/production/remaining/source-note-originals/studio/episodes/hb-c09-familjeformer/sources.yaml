    range_basis: normalized_html_block
    extracted_passage: När man pratar om familjer tänker man ofta på barnfamiljer. Det är ändå vanligt
      att en familj består av bara två vuxna. Alla par vill inte ha barn, och många är nöjda med
      sitt liv utan barn.
