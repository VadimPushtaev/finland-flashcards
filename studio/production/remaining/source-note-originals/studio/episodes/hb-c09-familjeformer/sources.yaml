    heading: Familjer kan också ha bara en förälder
    source_range:
      start: 0
      end: 356
    range_basis: normalized_html_block
    extracted_passage: När det finns barn i en familj men bara en vuxen, pratar man om en familj
      med en förälder. En ensamförsörjare är i allmänhet skild, änka eller änkling. Ibland har ensamförsörjaren
      skaffat barn på egen hand, det vill säga familjen har alltid bestått av bara en förälder. Kvinnor
      som bor ensamma kan i Finland få fertilitetsbehandling med spermier utan make.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
