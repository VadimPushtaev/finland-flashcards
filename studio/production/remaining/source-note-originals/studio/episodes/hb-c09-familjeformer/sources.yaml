    heading: Familjer kan också ha bara en förälder
    source_range:
      start: 0
      end: 492
    range_basis: normalized_html_block
    extracted_passage: Det kan vara utmanande för en ensamförsörjare att kombinera barnomsorg och
      förvärvsarbete. Den ekonomiska situationen kan vara tuff, och det kan ibland vara psykiskt
      tungt att ensam ta hand om ett barn. Finska staten stöder ensamförsörjare, så att familjerna
      med en förälder inte ska vara i en svagare ställning än andra. Till exempel en del av FPA:s
      stöd innehåller ett ensamförsörjartillägg, det vill säga stödet för familjer med en förälder
      är lite högre än för familjer med två föräldrar.
