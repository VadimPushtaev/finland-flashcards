- sentence_id: hb-c08-u0111-s002
  sv: De kan avläggas vid en läroanstalt, eller genom en läroavtalsutbildning eller en utbildning som
    grundar sig på utbildningsavtal.
  ru: Их можно получить в учебном заведении, путём обучения по ученическому договору (läroavtalsutbildning)
    или обучения на основе договора о прохождении стажировки (utbildningsavtal).
  scene_id: hb-c08-u0111
