- sentence_id: hb-c08-u0109-s001
  sv: Om en studerande inte har avlagt den grundläggande utbildningen i Finland, måste hen i allmänhet
    intyga att hen kan finska eller svenska tillräckligt väl för yrkesstudier.
  ru: Если учащийся не прошёл программу основного общего образования в Финляндии, ему, как правило, нужно
    подтвердить, что он достаточно хорошо владеет финским или шведским языком для профессионального обучения.
  scene_id: hb-c08-u0109
  visual_cue: 'Source-specific pictorial composition language: finska / svenska. Only the archived source
