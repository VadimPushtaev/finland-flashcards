- sentence_id: hb-c08-u0108-s002
  sv: En studerande i läropliktsåldern, det vill säga under 18 år, får läroböckerna och i allmänhet också
    de arbetsredskap som behövs i yrket gratis från läroanstalten och en avgiftsfri lunchmåltid.
  ru: Учащийся в возрасте обязательного обучения, то есть младше 18 лет, бесплатно получает в учебном
    заведении учебники и, как правило, также необходимые для профессии рабочие инструменты, а ещё бесплатный
    обед.
