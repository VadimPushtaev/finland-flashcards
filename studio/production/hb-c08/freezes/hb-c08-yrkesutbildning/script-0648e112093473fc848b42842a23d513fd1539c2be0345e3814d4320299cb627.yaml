- sentence_id: hb-c08-u0111-s003
  sv: En studerande som avlagt yrkesinriktad grundexamen kan söka till fortsatta studier vid en yrkeshögskola
    eller ett universitet, eller avlägga en yrkes- eller specialyrkesexamen.
  ru: Учащийся, получивший диплом о базовом профессиональном образовании, может подавать документы для
    дальнейшего обучения в университет прикладных наук (yrkeshögskola) или университет либо получить диплом
    об основном или специализированном профессиональном образовании.
  scene_id: hb-c08-u0111
