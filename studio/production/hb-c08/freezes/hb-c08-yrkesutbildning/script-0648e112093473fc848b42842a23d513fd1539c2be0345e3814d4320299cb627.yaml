- sentence_id: hb-c08-u0111-s001
  sv: Exempel på yrkesexamina är yrkesinriktad grundexamen, yrkesexamen och specialyrkesexamen.
  ru: К профессиональным дипломам относятся, например, диплом о базовом профессиональном образовании (yrkesinriktad
    grundexamen), диплом об основном профессиональном образовании (yrkesexamen) и диплом о специализированном
    профессиональном образовании (specialyrkesexamen).
  scene_id: hb-c08-u0111
