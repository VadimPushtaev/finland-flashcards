- sentence_id: hb-c08-u0107-s004
  sv: Yrken som man utexamineras till efter avlagd grundexamen är till exempel frisör, närvårdare, busschaufför,
    bilmekaniker, kock, elmontör och IT-supporter.
  ru: К профессиям, которые получают после завершения базового профессионального образования, относятся,
    например, парикмахер, специалист по уходу (närvårdare), водитель автобуса, автомеханик, повар, электромонтёр
    и специалист по ИТ-поддержке.
