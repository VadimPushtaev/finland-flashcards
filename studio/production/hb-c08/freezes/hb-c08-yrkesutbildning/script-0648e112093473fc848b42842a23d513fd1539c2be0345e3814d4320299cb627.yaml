- sentence_id: hb-c08-u0110-s002
  sv: I Finland finns det specialyrkesläroanstalter och specialyrkesutbildningar för studerande som behöver
    regelbundet stöd för studierna på grund av till exempel inlärningssvårigheter, en skada eller en sjukdom.
  ru: В Финляндии существуют специальные профессиональные учебные заведения и специальные программы профессионального
    образования для учащихся, которым нужна регулярная поддержка в учёбе, например из-за трудностей в
    обучении, нарушения здоровья или заболевания.
  scene_id: hb-c08-u0110
  visual_cue: 'Source-specific pictorial composition support: regelbundet stöd / inlärningssvårigheter.
    Only the archived source claim is illustrated.'
