scenes:
- id: hb-c08-u0107
  description: Inom yrkesutbildningar studerar man ett yrke och de färdigheter som krävs för det i teori
    och praktik.
- id: hb-c08-u0108
  description: Studier på en yrkesläroanstalt är avgiftsfria för den unga.
- id: hb-c08-u0109
  description: Om en studerande inte har avlagt den grundläggande utbildningen i Finland, måste hen i
    allmänhet intyga att hen kan finska eller svenska tillräckligt väl för yrkesstudier.
- id: hb-c08-u0110
  description: En yrkesutbildning kan avläggas på många olika sätt, och det finns studiemöjligheter för
    både unga och vuxna.
- id: hb-c08-u0111
  description: Exempel på yrkesexamina är yrkesinriktad grundexamen, yrkesexamen och specialyrkesexamen.
- id: hb-c08-u0112
  description: Inom alla yrkesexamina skaffar man kompetens också genom praktiska arbetsuppgifter på en
    arbetsplats.
- id: hb-c08-u0113
  description: Ett utbildningsavtal är ett arrangemang där den studerande skaffar kompetens på en arbetsplats
    genom praktiska arbetsuppgifter.
- id: hb-c08-u0114
  description: En läroavtalsutbildning innebär att den studerande studerar ett yrke i ett anställningsförhållande
    på en arbetsplats samtidigt som hen arbetar.
- id: hb-c08-u0115
  description: Som läroavtalsutbildning kan man studera en hel yrkesexamen, en del eller delar av en examen,
    eller en mindre helhet än en del av en examen.
- id: hb-c08-u0116
  description: Yrkesinriktad grundexamen är avsedd för personer som inte har tidigare kunskaper i yrket
    i fråga.
- id: hb-c08-u0117
  description: Yrkesutbildningen baserar sig på grunderna för yrkesinriktad grundexamen som utarbetats
    av Utbildningsstyrelsen.
- id: hb-c08-u0118
  description: I en grundexamen ingår också allmänbildande studier, det vill säga gemensamma examensdelar.
- id: hb-c08-u0119
  description: När studierna börjar gör skolan upp en personlig utvecklingsplan för kunnandet (PUK) för
    varje studerande.
- id: hb-c08-u0120
  description: Den studerande deltar aktivt i planeringen av sina studier och får studiehandledning under
    studiernas gång.
- id: hb-c08-u0121
  description: Inom yrkesinriktade grundexamina bedöms den studerandes kunnande vanligtvis genom prov
    som genomförs på en arbetsplats under perioder av lärande i arbete.
- id: hb-c08-u0122
  description: För varje prov får den studerande ett intyg, som är en del av examensbetyget.
- id: hb-c08-u0123
  description: Det är möjligt att avlägga gymnasiets studentexamen och en yrkesinriktad grundexamen inom
    samma studier.
- id: hb-c08-u0124
  description: Du kan söka till yrkesutbildning i Finland när du har avlagt grundskolans lärokurs eller
    har motsvarande färdigheter som förvärvats på andra sätt.
