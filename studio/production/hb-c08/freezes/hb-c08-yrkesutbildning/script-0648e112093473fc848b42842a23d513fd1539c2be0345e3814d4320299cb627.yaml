  sv: En yrkesutbildning kan avläggas på många olika sätt, och det finns studiemöjligheter för både unga
    och vuxna.
  ru: Профессиональное образование можно получить множеством разных способов, и возможности для обучения
    есть как у молодёжи, так и у взрослых.
  scene_id: hb-c08-u0110
