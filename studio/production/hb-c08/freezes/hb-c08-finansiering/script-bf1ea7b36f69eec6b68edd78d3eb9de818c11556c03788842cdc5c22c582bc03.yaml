episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Consecutive original source paragraphs/list items define topic scenes; exact wording and stored
    order are retained. Sentence illustrations follow the individual source claim.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 24fps, Chapter 8 teal palette {''background'': ''#193b40'', ''text'': ''#faf3e8'',
    ''secondary'': ''#c0dce0'', ''highlight'': ''#e8c081'', ''separator'': ''#3f6d73''}. Liberation Sans
    Bold48/Regular40 with right bilingual panel and fixed left foreground.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Helsinginkatu in Alppiharju with Helsinki Finnish Adult Education Centre on an afternoon
    in March 2024.jpg by JIP continuously as decorative background, darkened 42% and blurred 2.5 px. Smooth
    cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds per motion
    cycle, starting in motion, with no sentence resets. Total cycles=4.569047619047619. Foreground and
    bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Supertonic3/F1 Swedish,32steps,speed0.95,seed42,44100HzmonoPCM16,2ONNXthreads. Whole-video
    listening and user acceptance pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use On the Passing of Time by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 225.045 seconds; prepared lossless stereo bed 639.667
    seconds. Repeat count 2, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: A distinct relevant source-based illustration for nearly every sentence slide, supplemented
    by verified photographs where they clarify actual institutions or places. Distinct semantic compositions
    show only the source statements. Aim at least90% measured body picture coverage and report unique-picture
    ratio.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c08-u0163
  description: Du kan få FPA:s studiestöd om du
- id: hb-c08-u0164
  description: har registrerat dig i befolkningsdatasystemet som en person som bor stadigvarande i Finland,
- id: hb-c08-u0166
  description: har det uppehållstillstånd som krävs och
- id: hb-c08-u0167
  description: om du vistas i Finland av någon annan orsak än studier.
- id: hb-c08-u0168
  description: Om du flyttar till Finland för att studera kan du inte få studiestöd.
- id: hb-c08-u0169
  description: Studiestödet består av studiepenningen, statsborgen för studielån och studiestödets bostadstillägg.
- id: hb-c08-u0170
  description: Du kan få studiestöd om
- id: hb-c08-u0171
  description: du studerar vid gymnasiet
- id: hb-c08-u0173
  description: du studerar vid en yrkesläroanstalt eller avlägger yrkesinriktade tilläggsstudier
- id: hb-c08-u0174
  description: du studerar vid en högskola.
- id: hb-c08-u0175
  description: Du kan få studiepenning om du har fyllt 17 år.
- id: hb-c08-u0192
  description: Du kan arbeta vid sidan av studierna.
- id: hb-c08-u0176
  description: FPA betalar in studiepenningen på ditt konto månatligen.
- id: hb-c08-u0177
  description: Det är inte obligatoriskt att ta studielån.
- id: hb-c08-u0178
  description: Du kan få studiestödets bostadstillägg om du har rätt till studiestöd.
- id: hb-c08-u0179
  description: Skolresestödet (koulumatkatuki) ersätter kostnaderna för skolresor.
- id: hb-c08-u0180
  description: I vissa fall kan du ha rätt till skolresestöd om du studerar i gymnasiet eller vid en yrkesläroanstalt
    eller deltar i förberedande utbildning för dem.
- id: hb-c08-u0181
  description: Om du studerar vid en högskola får du också måltidsstöd (ateriatuki).
- id: hb-c08-u0182
  description: Du har inte rätt till måltidsstöd om du är i Finland endast på arbetspraktik (työharjoittelu)
    som ingår i en utländsk examen.
- id: hb-c08-u0183
  description: Utländska studerande kan ansöka om olika penningunderstöd för finländska högskolor.
- id: hb-c08-u0184
  description: Möjligheten till ett stipendium kan till exempel bero på hur framgångsrik du varit i dina
    studier.
- id: hb-c08-u0185
  description: Om du är medborgare i ett EU- eller EES-land, Schweiz eller något av de nordiska länderna,
    har du rätt att jobba obegränsat under din studietid och du behöver inget särskilt tillstånd för det.
- id: hb-c08-u0186
  description: I Finland finns det olika sätt att finansiera vuxenstudier på.
- id: hb-c08-u0187
  description: Att avlägga en hel examen kostar i allmänhet ingenting om den studerande bor permanent
    i Finland.
- id: hb-c08-u0188
  description: En arbetslös kund hos sysselsättningstjänsterna kan på vissa villkor studera också med
    arbetslöshetsförmån.
- id: hb-c08-u0189
  description: Med en arbetslöshetsförmån kan en arbetssökande på vissa villkor också genomföra självständiga
    studier som hen själv har hittat.
