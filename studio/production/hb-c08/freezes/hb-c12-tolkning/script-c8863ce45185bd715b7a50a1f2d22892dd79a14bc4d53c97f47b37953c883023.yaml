episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Exact source paragraphs/list items define consecutive topic scenes. Sentence-specific objects
    and source relationships are planned individually; no added spoken transitions or current-law updates.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter12 violet palette {''background'': ''#352e49'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d7cce7'', ''highlight'': ''#e2c58b'', ''separator'': ''#685881''}. Liberation Sans
    Bold48/Regular40 with a fixed right bilingual panel and relevant left foreground pictures.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Interpreting booth Juste Lipse building 01.jpg by FrDr continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=2.0351190476190473. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPyseed42 per invocation,44100HzmonoPCM16;
    initial2ONNXthreads shared with Chapter8 allocation. Exact synthesis inputs and actual seed scope
    are retained; whole-video listening remains pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Modern Vibes by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 121.626 seconds; prepared lossless stereo bed 284.917 seconds.
    Repeat count 2, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Distinct relevant picture for nearly every body sentence slide: actual places/objects where
    identity and license are verified, plus original pictorial diagrams for source-stated eligibility,
    administrative steps and personal-data protections. Avoid real personal identifiers and invented legal
    rules.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0046
  description: Om du måste sköta ärenden med finländska myndigheter, men inte kan finska eller svenska
    och det inte heller finns något annat språk som både du och myndigheten talar, kan du i vissa fall
    ha rätt till tolkning.
- id: hb-c12-u0047
  description: Myndigheten kan ordna och betala tolkningen när det gäller skötsel av ärenden som inletts
    på myndighetens initiativ.
- id: hb-c12-u0048
  description: Om du söker asyl i Finland har du rätt till tolkning i ärenden som rör behandlingen av
    din asylansökan.
- id: hb-c12-u0049
  description: Om du själv bokar tolken och betalar tolkningen, kan du anlita en tolk när som helst.
- id: hb-c12-u0050
  description: Tolken är med på möten mellan dig och myndigheten.
- id: hb-c12-u0051
  description: Tolken har som uppgift att tolka det som du och myndigheten säger.
- id: hb-c12-u0052
  description: Tolken har sekretessplikt och får inte berätta inte om dina angelägenheter för andra.
- id: hb-c12-u0053
  description: Man måste meddela om behovet av tolk i samband med tidsbokningen.
- id: hb-c12-u0054
  description: Om det inte är möjligt att få en professionell tolk ordnad av en myndighet för att uträtta
    ett ärende, kan kunden själv skaffa en tolk.
