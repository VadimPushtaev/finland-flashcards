episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Exact source paragraphs/list items define consecutive topic scenes. Sentence-specific objects
    and source relationships are planned individually; no added spoken transitions or current-law updates.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter12 violet palette {''background'': ''#352e49'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d7cce7'', ''highlight'': ''#e2c58b'', ''separator'': ''#685881''}. Liberation Sans
    Bold48/Regular40 with a fixed right bilingual panel and relevant left foreground pictures.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Valtion virastotalo Kokkola 20190527.jpg by Santeri Viinamäki continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=5.18422619047619. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPyseed42 per invocation,44100HzmonoPCM16;
    initial2ONNXthreads shared with Chapter8 allocation. Exact synthesis inputs and actual seed scope
    are retained; whole-video listening remains pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Ashton Manor by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 44.304 seconds; prepared lossless stereo bed 725.792 seconds.
    Repeat count 17, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Distinct relevant picture for nearly every body sentence slide: actual places/objects where
    identity and license are verified, plus original pictorial diagrams for source-stated eligibility,
    administrative steps and personal-data protections. Avoid real personal identifiers and invented legal
    rules.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0015
  description: När du flyttar till Finland har du rätt att få grundläggande information om Finland.
- id: hb-c12-u0016
  description: I Finland erbjuds även andra tjänster som stöd för integrationen.
- id: hb-c12-u0017
  description: du är arbetslös och söker jobb
- id: hb-c12-u0019
  description: du får utkomststöd annat än tillfälligt
- id: hb-c12-u0020
  description: du tar hand om ditt barn hemma och får stöd för hemvård av barn
- id: hb-c12-u0021
  description: du har kommit till Finland som minderårig utan vårdnadshavare
- id: hb-c12-u0022
  description: du har kommit till Finland som flykting
- id: hb-c12-u0023
  description: du är offer för människohandel.
- id: hb-c12-u0024
  description: Du kan också själv be om bedömningen.
- id: hb-c12-u0025
  description: Varje kommun har ett integrationsprogram som inkluderar de tjänster kommunen erbjuder nyanlända
    för att främja deras integration.
- id: hb-c12-u0026
  description: En bedömning av kompetensen och behovet av integrationstjänster görs under de första åren
    efter flytten till landet, dock senast tre år efter att det första uppehållstillståndet eller uppehållskortet
    beviljades eller uppehållsrätten registrerades.
- id: hb-c12-u0027
  description: Utifrån det som kommit fram bedöms hurdant stöd den nyanlända behöver för sin integration.
- id: hb-c12-u0028
  description: I integrationsplanen anges de tjänster och åtgärder som ska hjälpa den nyanlända att lära
    sig finska eller svenska och hitta till exempel ett arbete eller en studieplats.
- id: hb-c12-u0029
  description: Tillsammans med den nyanlända kommer man överens om individuella mål för integrationen.
- id: hb-c12-u0030
  description: För att nå målet kommer man i integrationsplanen vanligtvis överens om deltagande i utbildning
    eller andra åtgärder, till exempel arbetsprövning.
- id: hb-c12-u0031
  description: Medan åtgärderna i integrationsplanen genomförs, till exempel under integrationsutbildningen,
    är det ofta möjligt för den nyanlända att få en arbetslöshetsförmån, det vill säga ekonomiskt bidrag
    från Folkpensionsanstalten (FPA).
- id: hb-c12-u0032
  description: Under integrationsutbildningen studerar den nyanlända finska eller svenska samt viktiga
    frågor om det finländska samhället och arbetslivet.
- id: hb-c12-u0033
  description: Innan utbildningen börjar är det möjligt att den studerande genomgår ett test, där man
    testar språkkunskaperna och studiefärdigheterna.
- id: hb-c12-u0034
  description: I vissa fall kan man i integrationsplanen för en arbetssökande invandrare inkludera frivilliga
    studier, det vill säga annan utbildning än den integrationsutbildning som kommunens arbetskraftsmyndighet
    anordnar.
- id: hb-c12-u0035
  description: Man ska alltid komma överens om studier och om att inkludera dem i integrationsplanen med
    kommunens arbetskraftsmyndighet innan studierna påbörjas.
- id: hb-c12-u0036
  description: Målet är att planera olika tjänster så att de bildar en helhet för var och en som på bästa
    sätt stöder integrationen.
- id: hb-c12-u0037
  description: Kommunerna har också rådgivningsservice för nyanlända.
- id: hb-c12-u0038
  description: Dessutom erbjuds flerspråkig samhällsorientering.
- id: hb-c12-u0039
  description: Du kan studera finska och svenska även om ingen integrationsplan har utarbetats för dig.
