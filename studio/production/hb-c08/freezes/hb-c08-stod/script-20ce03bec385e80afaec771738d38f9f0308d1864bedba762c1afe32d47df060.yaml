- id: story_structure
  decision: Consecutive original source paragraphs/list items define topic scenes; exact wording and stored
    order are retained. Sentence illustrations follow the individual source claim.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 24fps, Chapter 8 teal palette {''background'': ''#193b40'', ''text'': ''#faf3e8'',
    ''secondary'': ''#c0dce0'', ''highlight'': ''#e8c081'', ''separator'': ''#3f6d73''}. Liberation Sans
    Bold48/Regular40 with right bilingual panel and fixed left foreground.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Elementary school classroom in Vantaankoski school in Vantaa, Finland, 2010.jpg by
    Leo-setä continuously as decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal
    pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting
    in motion, with no sentence resets. Total cycles=9.817261904761905. Foreground and bilingual text
    remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Supertonic3/F1 Swedish,32steps,speed0.95,seed42,44100HzmonoPCM16,2ONNXthreads. Whole-video
    listening and user acceptance pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Sovereign Quarter by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 291.396 seconds; prepared lossless stereo bed 1374.417
    seconds. Repeat count 4, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: A distinct relevant source-based illustration for nearly every sentence slide, supplemented
    by verified photographs where they clarify actual institutions or places. Distinct semantic compositions
    show only the source statements. Aim at least90% measured body picture coverage and report unique-picture
    ratio.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c08-u0067
  description: I Finland har ett skolår 190 skoldagar.
- id: hb-c08-u0068
  description: Utöver jullovet och sommarlovet har eleverna under läsåret höstlov på hösten och vinterlov
    i februari–mars.
- id: hb-c08-u0069
  description: I de lägre årskurserna är skoldagarna kortare än i de högre.
- id: hb-c08-u0070
  description: I skolan får eleverna elevhandledning.
- id: hb-c08-u0071
  description: Enligt lagen ska eleverna få tillräckligt stöd för lärandet och skolgången under hela grundskolan.
- id: hb-c08-u0072
  description: Eleverna kan få stöd för skolgången på olika sätt.
- id: hb-c08-u0073
  description: Stödet är avsett att vara flexibelt och välplanerat.
- id: hb-c08-u0074
  description: Inom den grundläggande utbildningen bedömer läraren elevens lärande, kunskaper, arbete
    och uppförande och jämför dem med målen för läroplanen.
- id: hb-c08-u0075
  description: I varje årskurs ges eleven ett läsårsbetyg när läsåret är slut.
- id: hb-c08-u0076
  description: Om eleven i slutet av läsåret inte får ett godkänt vitsord i ett ämne, kan det hända att
    hen inte kan gå upp till nästa årskurs.
- id: hb-c08-u0077
  description: I Finland är samarbetet mellan skolan och elevens vårdnadshavare och föräldrar mycket viktigt.
- id: hb-c08-u0078
  description: I skolan måste eleven ända från början ta ansvar för sina studier.
- id: hb-c08-u0079
  description: I Finland samarbetar hemmen och skolorna på många olika sätt.
- id: hb-c08-u0080
  description: Skolan använder vanligtvis ett elektroniskt informationssystem, oftast Wilma.
- id: hb-c08-u0081
  description: I Wilma följer läraren också upp barnets frånvaro från skolan.
- id: hb-c08-u0082
  description: Om föräldrarna och vårdnadshavarna inte är nöjda med skolans verksamhet, är det bra att
    först prata med elevens lärare.
- id: hb-c08-u0083
  description: Alla grundskolor, gymnasier och yrkesläroanstalter i Finland har lunchrast mitt under skoldagen.
- id: hb-c08-u0084
  description: Om en elev följer en specialkost av etiska, religiösa eller hälsomässiga skäl, försöker
    skolan beakta den.
- id: hb-c08-u0085
  description: När barnet går i grundskolan och har kort skolväg kan hen ända från början vanligtvis gå,
    cykla eller ta bussen på egen hand.
- id: hb-c08-u0086
  description: Eleverna ska uppföra sig sakligt mot lärare och andra elever.
- id: hb-c08-u0087
  description: Skolorna har en elevvårdsplan som beskriver bland annat hur skolan följer upp elevernas
    och skolgemenskapens välbefinnande, hälsa och säkerhet.
- id: hb-c08-u0088
  description: I skolorna accepteras inte diskriminering, mobbning, trakasserier eller våld.
- id: hb-c08-u0089
  description: Det är också mobbning eller diskriminering om en elev upprepade gånger lämnas utanför gruppen.
- id: hb-c08-u0090
  description: Elever i årskurs ett och två eller i specialundervisning kan få delta i morgon- och eftermiddagsverksamhet
    för skolelever.
- id: hb-c08-u0091
  description: Morgon- och eftermiddagsverksamheten är avsedd särskilt för barn med föräldrar som arbetar
    heltid.
- id: hb-c08-u0092
  description: Många skolor ordnar klubbar efter skoldagen.
- id: hb-c08-u0093
  description: När ett barn flyttar till Finland placeras hen i en årskurs inom den grundläggande utbildningen
    utifrån sin ålder och vilka kunskaper och färdigheter hen har.
- id: hb-c08-u0094
  description: Syftet med den förberedande undervisningen är att ge barnet nödvändiga kunskaper och färdigheter
    för att övergå till den allmänna grundläggande undervisningen.
- id: hb-c08-u0095
  description: Att studera undervisningsspråket är en viktig del av den förberedande undervisningen för
    de elever som ännu inte kan studera på finska eller svenska.
- id: hb-c08-u0096
  description: När barnet deltar i undervisning som förbereder för grundläggande utbildning får hen ett
    individuellt studieprogram.
- id: hb-c08-u0190
  description: Barn med funktionsnedsättning har rätt att gå i en närskola och få de stödåtgärder de behöver
    för sin skolgång.
- id: hb-c08-u0191
  description: I Finland kan studerande med funktionsnedsättning studera på vanliga läroanstalter med
    andra studerande inom till exempel integrationsutbildning, samhällsorientering eller olika utbildningar
    som leder till en examen.
