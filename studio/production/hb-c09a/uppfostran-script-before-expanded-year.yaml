episode_decisions:
- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Progress from views of children and play to loving consistent non-violent parenting, age-appropriate
    independence, weather and friendships, adolescent autonomy and exact archived age limits. Distinguish
    source hypothetical harmful practices from recommendations; all depictions remain non-graphic.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Distinct reserved episode photograph. Continuous full-episode diagonal pan with15% relative
    zoom, starting in motion; 140second smooth cycles. Final photograph identity/settings resolved during
    assets.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Distinct centrally reserved instrumental with full composer/source/license credits; accepted+2dB
    setting, narration ducking and gentle fades. Crossfade repeats only when required by measured duration.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: Med uppfattning om barn avses hurdana barn anses vara.
- id: scene-2
  description: I Finland betraktas barn som aktiva aktörer.
- id: scene-3
  description: Å andra sidan ska det unika med barn och barndomen också skyddas.
- id: scene-4
  description: Den finländska uppfattningen om barn är också förknippad med en idé om vikten av lek.
- id: scene-5
  description: Föräldraidealet, det vill säga idén om hur en bra förälder är, har förändrats med tiden.
- id: scene-6
  description: Det finns många sätt att vara en bra förälder.
- id: scene-7
  description: Aga betyder att en förälder eller någon annan använder våld för att straffa ett barn eller
    för att få barnet att uppföra sig på ett visst sätt.
- id: scene-8
  description: Aga är skadlig för barnets utveckling.
- id: scene-9
  description: Att sätta gränser för barn kan ibland vara utmanande.
- id: scene-10
  description: I Finland värdesätter man generellt i hög grad att människor är självständiga och klarar
    sig själva.
- id: scene-11
  description: I Finland är det också vanligt att barn rör sig utomhus på egen hand redan i ganska ung
    ålder.
- id: scene-12
  description: Ibland kan det också hända att man förväntar sig för mycket självständighet och egna initiativ
    av barnen.
- id: scene-13
  description: I Finland vistas barnen utomhus oavsett väder och årstid.
- id: scene-14
  description: Vänskapsförhållanden skapas till exempel på daghemmet, i skolan och inom hobbyer.
- id: scene-15
  description: I Finland är det vanligt att barn och unga sover över hos varandra.
- id: scene-16
  description: När ett barn kommer in i puberteten börjar hen så småningom frigöra sig från sina föräldrar.
- id: scene-17
  description: I Finland anser man att självbestämmanderätten också gäller barn, i den mån det är möjligt
    med tanke på deras ålder.
- id: scene-18
  description: Det är bra om föräldrarna ger den unga mer frihet i takt med att hen växer och visar att
    hen kan ta ansvar för sig själv.
- id: scene-19
  description: Man kan inte kräva att den unga berättar allt om sitt liv för sina föräldrar.
- id: scene-20
  description: I Finland är kroppslig bestraffning av barn förbjuden.
- id: scene-21
  description: Det är viktigt att sätta upp tydliga gränser och regler för barn och unga.
- id: scene-22
  description: När en person fyller 18 år är han eller hon enligt lagen myndig.
