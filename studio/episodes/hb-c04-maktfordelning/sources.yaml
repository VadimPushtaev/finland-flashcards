    range_basis: normalized_html_block
    extracted_passage: I Finland är makten indelad i lagstiftande makt, verkställande makt och domsrätt.
      Den lagstiftande makten, det vill säga makten att stifta lagar, utövas av riksdagen. Den verkställande
      makten, det vill säga makten att tillämpa lagar i praktiken, utövas av presidenten och regeringen.
      Regeringen ser till exempel till att ministerierna och de myndigheter som lyder under dem fattar
      beslut i enlighet med lagarna. Domsrätten, det vill säga makten att bedöma huruvida någon har
      agerat i enlighet med lagen i ett enskilt fall, verkställs av domstolarna.
    normalization: whitespace_only
    repairs: []
