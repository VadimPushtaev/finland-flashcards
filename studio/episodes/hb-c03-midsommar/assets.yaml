    off the southern coast of Helsinki, Finland. Midsummer 2014 was an exceptionally cool midsummer in
    the entire southern Finland. Only the bonfire kept me warm during the entire day. Only less than a
    month afterwards, in middle July, the weather in Finland was so warm I had to stop wearing a jacket
    and only wear a T-shirt on my upper body. Background is decorative context, not identification of
    a specific historical event. Metadata and identity checked through the Commons API for the linked
