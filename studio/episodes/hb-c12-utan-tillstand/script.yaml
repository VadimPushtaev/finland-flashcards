scenes:
- id: hb-c12-u0234
  description: Om du behöver visum eller uppehållstillstånd för att vistas i Finland, men inte har det,
    kan din vistelse i Finland vara illegal.
- id: hb-c12-u0235
  description: Om du är asylsökande har du rätt att vistas i Finland utan visum eller uppehållstillstånd
    så länge som handläggningen av din asylansökan pågår.
- id: hb-c12-u0236
  description: Även om du skulle ha kommit lagligt till Finland kan din vistelse i landet senare bli olaglig.
- id: hb-c12-u0237
  description: du får ett negativt beslut på din ansökan om uppehållstillstånd eller asylansökan
- id: hb-c12-u0239
  description: ditt uppehållstillstånd går ut och du ansöker inte om fortsatt tillstånd i tid eller
- id: hb-c12-u0240
  description: du har rest in i landet med visum och ditt visum går ut eller
- id: hb-c12-u0241
  description: vistelsetiden utan visum har gått ut eller du inte längre har någon laglig grund för vistelsen.
- id: hb-c12-u0242
  description: Du har rätt till nödinkvartering och mathjälp om du inte har pengar till mat eller någonstans
    att övernatta.
- id: hb-c12-u0243
  description: Du kan få juridisk rådgivning i frågor kring papperslöshet av en jurist vid Flyktingrådgivningen
    (Pakolaisneuvonta).
- id: hb-c12-u0244
  description: Om du blir sjuk eller skadas, har du rätt till brådskande och nödvändig vård inom den offentliga
    hälso- och sjukvården, till exempel på en hälsostation eller ett sjukhus.
- id: hb-c12-u0245
  description: Offentliga hälsovårdstjänster ordnas av välfärdsområdena (hyvinvointialueet) runtom i Finland.
