- sentence_id: hb-c03-u0019-s001
  sv: När man pratar om typiska seder och bruk i Finland är det bra att komma ihåg att till exempel personer
    i olika åldrar, invånare på olika orter, personer som talar olika språk och yrkesutbildade inom olika
    branscher kan ha seder som skiljer sig från varandra.
  ru: Говоря о типичных обычаях и традициях Финляндии, полезно помнить, что, например, люди разного возраста,
    жители разных населённых пунктов, носители разных языков и специалисты разных отраслей могут иметь
    отличающиеся друг от друга обычаи.
