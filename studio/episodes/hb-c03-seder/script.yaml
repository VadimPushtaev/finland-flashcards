  sv: Sederna och bruken dikterar bland annat vad som enligt en viss människogrupp är hänsynsfullt och
    artigt beteende, hur man hälsar i olika situationer och hur man äter på ett välartat sätt.
  ru: Обычаи и традиции определяют, среди прочего, что конкретная группа людей считает внимательным и
    вежливым поведением, как приветствуют друг друга в разных ситуациях и как вежливо ведут себя за столом.
  scene_id: scene-1
