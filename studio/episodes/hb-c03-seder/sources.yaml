    range_basis: normalized_html_block
    extracted_passage: Ofta anser människor som kommer från andra länder att finländarna är tysta
      och lugna. Många anser att kraftiga känslouttryck är en privat angelägenhet i Finland, och
      utanför hemmet beter sig människorna rätt så behärskat. Också när man som kund uträttar ärenden
      hos myndigheter förväntas man berätta om sitt ärende på ett lugnt sätt.
