    range_basis: normalized_html_block
    extracted_passage: Sederna och bruken dikterar bland annat vad som enligt en viss människogrupp
      är hänsynsfullt och artigt beteende, hur man hälsar i olika situationer och hur man äter på
      ett välartat sätt. Seder och bruk styr också hur nära man brukar stå en annan person under
      en vanlig konversation, och hur öppet man visar sina känslor.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
