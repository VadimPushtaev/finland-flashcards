    heading: I Finland anses personligt utrymme och lugn och ro vara viktiga
    source_range:
      start: 0
      end: 288
    range_basis: normalized_html_block
    extracted_passage: I Finland betyder artighet till exempel att var och en tillåts vara i lugn
      och ro och att man inte i onödan lägger sig i andras angelägenheter. Detta kan verka kallt
      eller likgiltigt. Det handlar ändå om att man i hög grad respekterar andras personliga utrymme,
      lugn och ro och privatliv.
    normalization: whitespace_only
