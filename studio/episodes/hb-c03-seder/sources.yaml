    heading: Att gå rakt på sak sparar tid för alla
    source_range:
      start: 0
      end: 400
    range_basis: normalized_html_block
    extracted_passage: I konversationer går man ofta rakt på sak. Man lägger nödvändigtvis ingen
      tid på artigheter eller på att fråga om den andra har något nytt att berätta. Det här kan kännas
      ovänligt, men man menar oftast väl med det. Till exempel anses det vara en bra sak på arbetsplatser
      att i början av ett möte hoppa över artigheterna och snabbt gå till saken. På så sätt sparar
      man tid för alla som sitter i mötet.
    normalization: whitespace_only
