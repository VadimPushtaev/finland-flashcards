    range_basis: normalized_html_block
    extracted_passage: Att respektera andras personliga utrymme innebär också att man i Finland vanligtvis
      inte går fysiskt så nära andra människor. Här är man van vid att ge andra utrymme till exempel
      vid busshållplatser, i bussen, i hissen, i köer eller vid samtal på tu man hand.
    normalization: whitespace_only
