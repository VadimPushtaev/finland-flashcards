    range_basis: normalized_html_block
    extracted_passage: Att ge andra utrymme hänger också samman med att man i en dialog låter den
      andra prata färdigt utan att avbryta. Det anses oartigt åtminstone vid mer officiellt umgänge
      att avbryta eller prata över andra. Att prata med vänner är mer avslappnat och att avbryta
      någon då kan snarare vara ett tecken på att samtalspartnern är entusiastisk över det som den
      andra säger och att hen njuter av att prata med hen.
