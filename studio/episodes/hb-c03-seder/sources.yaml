      start: 0
      end: 378
    range_basis: normalized_html_block
    extracted_passage: När man pratar om typiska seder och bruk i Finland är det bra att komma ihåg
      att till exempel personer i olika åldrar, invånare på olika orter, personer som talar olika
      språk och yrkesutbildade inom olika branscher kan ha seder som skiljer sig från varandra. Kulturer
      är aldrig enhetliga, utan människornas sätt att fungera och deras uppfattningar om den egna
      kulturen varierar.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
