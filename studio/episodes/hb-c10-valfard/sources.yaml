    heading: Finland är en nordisk välfärdsstat
    source_range:
      start: 0
      end: 378
    range_basis: normalized_html_block
    extracted_passage: I det finländska samhället förs en ständig debatt om vilka tjänster staten
      bör bekosta för människorna och vad som är en lämplig beskattningsnivå. Det handlar om hur
      mycket man är beredd att betala för att upprätthålla välfärdsstaten. Till exempel olika politiska
      partier har olika åsikter om detta. En fri politisk debatt om hur ett bra samhälle ser ut är
      en del av demokratin.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
