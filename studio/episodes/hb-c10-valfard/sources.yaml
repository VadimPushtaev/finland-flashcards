    extracted_passage: Om du flyttar till Finland för att studera, beror din rätt till FPA:s förmåner
      på hur länge dina studier varar och från vilket land du flyttar till Finland. Om du kommer
      från ett EU- eller EES-land, Schweiz eller Storbritannien, omfattas du vanligen av socialskyddet
      i ditt hemland. Om du kommer från något annat land och dina studier varar i minst 2 år, kan
      du har rätt till en del av FPA:s förmåner.
