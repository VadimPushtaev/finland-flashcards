    heading: Finland är en nordisk välfärdsstat
    source_range:
      start: 0
      end: 553
    range_basis: normalized_html_block
    extracted_passage: Med nordisk välfärdsstat avses att staten garanterar förutsättningar för ett
      människovärdigt liv för alla sina invånare. Viktiga tjänster och tjänster som främjar människornas
      välbefinnande, såsom hälsovård, utbildning, barnomsorg, bibliotek och många motionstjänster
      bekostas med skattemedel. De är förmånliga eller till och med kostnadsfria för användarna.
      Därtill ger staten ekonomiskt stöd i form av olika bidrag och förmåner till människor som annars
      inte skulle klara sig på grund av till exempel sjukdom, arbetslöshet eller en svår livssituation.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c10-u0002:
