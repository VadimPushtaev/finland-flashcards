- sentence_id: hb-c10-u0001-s004
  sv: Därtill ger staten ekonomiskt stöd i form av olika bidrag och förmåner till människor som annars
    inte skulle klara sig på grund av till exempel sjukdom, arbetslöshet eller en svår livssituation.
