- sentence_id: hb-c10-u0001-s002
  sv: Viktiga tjänster och tjänster som främjar människornas välbefinnande, såsom hälsovård, utbildning,
    barnomsorg, bibliotek och många motionstjänster bekostas med skattemedel.
  ru: Важные услуги и услуги, способствующие благополучию людей, такие как здравоохранение, образование,
    уход за детьми, библиотеки и многие услуги для занятий физкультурой, оплачиваются из налоговых средств.
