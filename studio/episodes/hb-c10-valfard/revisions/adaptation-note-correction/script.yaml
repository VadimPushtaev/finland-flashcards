- sentence_id: hb-c10-u0001-s001
  sv: Med nordisk välfärdsstat avses att staten garanterar förutsättningar för ett människovärdigt liv
    för alla sina invånare.
  ru: Понятие государства всеобщего благосостояния Северных стран означает, что государство гарантирует
    всем своим жителям условия для достойной человеческой жизни.
  scene_id: scene-1
  visual_cue: A diverse group of residents at eye level, avoiding claims that photographed people receive
    benefits.
