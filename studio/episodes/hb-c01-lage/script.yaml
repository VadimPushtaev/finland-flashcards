episode_decisions:
- id: opening
  decision: Show the exact bilingual heading for 3 seconds over the same full-frame forest background
    used throughout the video. Begin continuous background motion immediately; no narration on title.
  status: approved
  resolve_during: script
- id: story_structure
  decision: Move from landscape and shape to the Nordic region, then neighboring countries, two factual
    highlights, and finally Lake Saimaa. Keep every source sentence in its original order; add no spoken
    introduction, transition, or summary.
  status: approved
  resolve_during: script
- id: text_and_layout
  decision: 'Follow the shared directing guide: Swedish above Russian on a stable readable panel, imagery
    in a separate area. Show each complete sentence pair together with automatic line wrapping. No sentence
    segmentation is planned for this short episode; if fitting fails during layout review, record exact
    bilingual display segments here.'
  status: approved
  resolve_during: script
- id: pace
  decision: Start narration trials at 120–140 words per minute. Show each pair about 0.25 seconds before
    its speech; use the planned pauses below, with longer holds at topic boundaries. Measure actual audio
    later; do not infer final duration from word count or shorten text to fit.
  status: approved
  resolve_during: script
- id: visual_motion
  decision: 'Use the Kuivaketvele forest/lake photo throughout. Make its motion perceptible within 5–10
    seconds: continuous diagonal pan from normalized crop position (0.15, 0.15) to (0.85, 0.85), with
    zoom 1.06 to 1.219 (15% relative increase) across the full episode. Use linear progress and fractional
    bicubic sampling so motion starts immediately without sentence resets. Keep foreground images and
    text fixed.'
  status: approved
  resolve_during: script
- id: voice_selection
  decision: Use the shared Supertonic 3 F1 female voice with Swedish language sv, 32 synthesis steps,
    speed 0.95, seed 42 and 44.1 kHz mono PCM WAV. Select one clip per source sentence. The user accepted this voice in the complete video. Local transcript diagnostics
    remain available for future pronunciation review.
  status: approved
  resolve_during: assets
- id: music_selection
  decision: Keep Light Thought var 1 by Kevin MacLeod for this first subchapter, under CC BY 4.0; reserve
    a different track for every other subchapter. Raise music alone by 2 dB relative to v3, a small single-step
    increase requested after review. Retain narration level, music ducking, fades and timing. Record the
    official filename and differing embedded ID3 title in assets.yaml.
  status: approved
  resolve_during: assets
- id: foreground_selection
  decision: 'Use generated Natural Earth 5.1.2 maps: nordic_map for sentences 4–5; neighbors_all for sentence
    6, then neighbors_russia, neighbors_norway, neighbors_sweden and neighbors_estonia for the matching
    sentences. Reuse neighbors_estonia for the no-land-border sentence. Use finland_outline for shape
    and numerical facts. No flags or portraits.'
  status: approved
  resolve_during: script
- id: closing
  decision: Hold the steady Saimaa foreground photo through the last sentence and pause, then show two
    15-second credit cards over the continuing forest background with a dark translucent backing. Include
    full CREDITS.md alongside the video.
  status: approved
  resolve_during: script
- id: exceptions
  decision: No exceptions to the shared directing guide are proposed. Missing illustrations change the
    visual treatment only; retain all Swedish and Russian text.
  status: approved
  resolve_during: script
- id: render_layout
  decision: 'Keep the 1920×1080 24 fps bilingual split layout and typography. Add a stable translucent
    evergreen backing behind the text. Leave the useful-image area open for the first two sentences; show
    maps thereafter and the verified Saimaa photograph at the end. Background is always visible, darkened
    42%, blurred 2.5 px, and continuously zoomed from 1.06 to 1.219 (15% relative increase), with a visible
    diagonal pan from crop position (0.15, 0.15) to (0.85, 0.85), across the complete timeline using linear
    progress and fractional sampling. All foreground images remain still. Narration, pauses, music and
    credit durations remain as in the first render. Music-only revision: +2 dB relative to v3; preserve
    the rendered visuals and narration.'
  status: approved
  resolve_during: render
- id: russian_audio_track
  decision: Replace the Russian audio track using the reviewed Russian sentences and local Silero v5_6_ru
    Baya voice with explicit stress hints. Expand EET/GMT into their Russian meanings in speech. Preserve the accepted video and its scene boundaries. Use the original music bed,
    fades and levels with ducking aligned to Russian speech. Record pronunciation expansions and
    per-sentence timing in russian-narration.yaml and russian-narration.json. The selected takes fit
    without tempo adjustment. Supersede the previous Russian track at the user's request.
  status: proposed
  resolve_during: assets
scenes:
- id: landscape
  description: 'Sentences 1–3: establish forests and lakes, then show Finland’s north–south shape.'
- id: nordic_region
  description: 'Sentences 4–5: locate Finland within the Nordic region and show the other named countries.'
- id: neighbors
  description: 'Sentences 6–11: keep a stable closer map while emphasizing each neighboring country and
    the sea gap to Estonia.'
- id: key_facts
  description: 'Sentences 12–13: use the Finland outline as a quiet setting for the exact time-zone and
    area labels.'
- id: saimaa
  description: 'Sentence 14: finish on a verified view of Lake Saimaa with the Swedish name Saimen.'
asset_requests:
- id: forest_lake
  kind: background
  description: Verified Finnish forest/lake photograph used as a continuous decorative full-frame background
    throughout the episode, softly blurred and darkened beneath stable text and useful foreground imagery.
  fallback: Use another verified Finnish forest/lake image; if no suitable photo is available, use an
    explicitly illustrative landscape without naming a real location.
- id: finland_outline
  kind: foreground
  description: Accurate north-up Finland outline for the north–south shape, time-zone, and area scenes.
    Use reusable geographic data and maintain recognizable proportions.
  fallback: Use a sourced map of Finland. For numerical facts alone, retain the exact text highlight on
    a quiet background if the outline cannot be obtained.
- id: nordic_map
  kind: foreground
  description: Accurate north-up map showing Finland, Sweden, Norway, Denmark, and Iceland. Include Iceland
    visibly; use an explicitly marked inset if needed. Swedish labels come from the source sentences.
  fallback: Create a simple map from reusable geographic data. If unavailable, use a clean text arrangement
    of the named countries without implying geographic positions.
- id: neighbors_map
  kind: foreground
  description: Accurate closer map with Finland, Russia, Norway, Sweden, Estonia, and the Gulf of Finland.
    Keep the Finland–Estonia water gap visible; provide variants that emphasize one named country at a
    time.
  fallback: Use an attributed existing regional map with readable labels. If neither is available, use
    exact country-name text cards; never invent borders or a land connection to Estonia.
- id: saimaa_view
  kind: background
  description: A photograph verified as Lake Saimaa, with creator, source, and reuse terms. Label it with
    the Swedish name Saimen.
  fallback: Use an accurately located map of Lake Saimaa. If neither photo nor map is available, show
    only the source name on a neutral background; never label a generic lake as Saimaa.
- id: music_bed
  kind: music
  description: One gentle instrumental bed for the whole episode, with suitable reuse terms or an original
    score. Exact selection follows the script’s music decision.
  fallback: Create or choose another suitable instrumental bed; do not silently remove the required music.
- id: narration
  kind: narration
  description: Fourteen separately identified local Swedish TTS clips, using one selected female voice
    and checked speech-only expansions.
  fallback: If a candidate voice is unsuitable, audition another local female Sweden Swedish voice; keep
    the selection pending rather than using remote synthesis.
