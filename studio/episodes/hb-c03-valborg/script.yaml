- id: story_structure
  decision: Use consecutive source paragraphs as the scenes below, preserving every sentence and list
    fragment in stored source order.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps. Chapter3 plum palette: background#342736, ivory#faf3e8, secondary#d8c8dc,
    highlight#e2bb85, separator#62506a. Liberation Sans Bold48/regular40, explicit44/36 or40/34 only when
    needed. Fixed Swedish-above-Russian right panel; source-only term cards on left when useful.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display each pair0.25seconds before narration. Natural local voice at speed0.95. Pause1.5seconds
    after ordinary sentences and2.2seconds at scene ends;2.5seconds for long pairs. No target-duration
    acceleration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:01-05-2025 Vappu picnic in Helsinki.jpg by Lorenot continuously as decorative background,
    darkened42% and blurred2.5px. Smooth cyclic diagonal pan(0.15,0.15)→(0.85,0.85) and15%relative zoom1.06→1.219,140seconds
    per motion cycle, starting in motion, with no sentence resets. Total cycles=0.6958333333333334. Foreground
    and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use series local Supertonic3/F1, Swedish,32steps,speed0.95,seed42,44100Hz mono PCM16. Exact
    inputs and checksums retained. Numbers and abbreviations have separately recorded speech-only expansions;
    pronunciation awaits whole-video review.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Study And Relax by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 223.399 seconds; prepared lossless stereo bed 97.417 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Use selected exact source words and dates as complete typography cards. Cards add no claims
    and retain source qualifiers in the full text. Leave foreground empty elsewhere; suppress orphaned/redundant
    image captions.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two15second source/media credit cards; complete attribution accompanies exported MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. All creative choices are proposals for whole-video user
    review.
  status: proposed
  resolve_during: script
