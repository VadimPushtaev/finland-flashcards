    extracted_passage: Första maj är vårens och arbetarnas fest. I Finland firas Valborgsmässoafton
      och första maj på många olika sätt. Människorna samlas på picknick. På första maj äter man
      munkar och dricker mjöd, som liknar läsk. Många firar också med mousserande vin. Hemmen dekoreras
      med ballonger och serpentin. Studenterna tar på sig sina vita studentmössor. Arbetarna ordnar
      Valborgsmarscher.
