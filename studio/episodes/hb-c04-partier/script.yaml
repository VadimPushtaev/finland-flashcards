episode_decisions:
- id: opening
  decision: Exact bilingual heading, unspoken, for three seconds. Continuous photo motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Group consecutive source sentences into the scenes below. Read every body sentence once in
    its exact original order, without added narration.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920×1080 at 24 fps. Chapter 4 warm umber panel #382d24, ivory #faf3e8, secondary #dfcfbb,
    gold #dfb96f, separator #695540. Liberation Sans Bold 48 and Regular 40; stable right bilingual panel
    and occasional exact-source graphics at left.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display text 0.25 seconds before speech. Moderate local voice speed0.95; allow 1.5 seconds
    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Election posters Otto Karhi Park Oulu 20230401 01.jpg by Estormiz continuously as
    decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85)
    and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence
    resets. Total cycles=6.001488095238096. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Friday Morning by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 210.338 seconds; prepared lossless stereo bed 840.208 seconds.
    Repeat count 4, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Show eight verified dated party portraits and the graphical Centre clover at meaningful party
    boundaries. Historical 2023 affiliations and source licenses are documented. Preserve complete photographs
    and fixed bilingual source display. Introductory dates and the final Movement Now passage retain source-only
    text cards or open background.
  status: proposed
  resolve_during: script
- id: closing
  decision: 'Five readable 15-second credit cards over continuing photo: source, background/music/voice,
    then three dedicated foreground attribution cards. Full source URLs, licenses and changes accompany
    the MP4 in its CREDITS file.'
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
