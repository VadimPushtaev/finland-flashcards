    range_basis: normalized_html_block
    extracted_passage: Yrkeshögskolan kan ordna avgiftsfri utbildning för invandrare med målet att
      ge den studerande tillräckliga språkkunskaper och andra färdigheter som behövs för att studera
      vid yrkeshögskolan. Under studierna tränar studeranden sig i det finska språket, på att läsa
      saktexter och på sina studiefärdigheter. Dessutom får studerandena information om utbildningsområdet,
      arbetsmöjligheter och studier som leder till examen. Språkkunkapskravet för dem som söker till
      förberedande utbildning är oftast finskakunskaper på nivån B1 eller B2.
