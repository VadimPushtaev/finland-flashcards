scenes:
- id: hb-c08-u0127
  description: Högskolorna i Finland är yrkeshögskolor och universitet.
- id: hb-c08-u0128
  description: Universiteten bedriver akademisk forskning som producerar ny kunskap och främjar vetenskapens,
    konstens, ekonomins och samhällets utveckling.
- id: hb-c08-u0129
  description: Största delen av högskolorna är offentliga, och deras verksamhet upprätthålls i allmänhet
    med skattemedel.
- id: hb-c08-u0130
  description: Man kan söka till en högskola om man har avlagt gymnasiets lärokurs eller en treårig yrkesutbildning.
- id: hb-c08-u0131
  description: Varje utbildning har egna urvalskriterier som läroanstalterna följer när de väljer studerande.
- id: hb-c08-u0132
  description: Inträdesprovet kan vara skriftligt eller praktiskt.
- id: hb-c08-u0133
  description: Yrkeshögskolestudier omfattar arbetspraktik och ett examensarbete.
- id: hb-c08-u0134
  description: Inom vissa områden kan man också studera till en högre yrkeshögskoleexamen (högre YH),
    vilket tar 1–1,5 år.
- id: hb-c08-u0135
  description: Vid yrkeshögskolorna är det möjligt att avlägga examina och kompletterande studier vid
    sidan av arbetet.
- id: hb-c08-u0136
  description: Största delen av universiteten i Finland är tvärvetenskapliga läroanstalter, det vill säga
    man kan avlägga studier inom många olika områden där.
- id: hb-c08-u0137
  description: De studerande avlägger först en lägre högskoleexamen, det vill säga en kandidatexamen.
- id: hb-c08-u0138
  description: När en studerande får studierätt för en kandidatexamen får hen i allmänhet också rätt att
    fortsätta med en magisterexamen inom samma område.
- id: hb-c08-u0139
  description: Om en studerande är intresserad av en karriär som forskare och av vetenskaplig forskning,
    kan hen efter magisterstudierna söka till fortsatta studier för att avlägga en licentiat- eller doktorsexamen.
- id: hb-c08-u0140
  description: Om en person har avlagt en examen eller studier utomlands och ansöker om att fortsätta
    sina studier i Finland, är det läroanstalten eller högskolan som beslutar om antagningen som studerande.
- id: hb-c08-u0141
  description: När en person har fått studierätt i Finland bedömer läroanstalten eller högskolan huruvida
    den kompetens som hen skaffat utomlands kan räknas till godo för den utbildning som avläggs i Finland.
- id: hb-c08-u0142
  description: Yrkeshögskolan kan ordna avgiftsfri utbildning för invandrare med målet att ge den studerande
    tillräckliga språkkunskaper och andra färdigheter som behövs för att studera vid yrkeshögskolan.
