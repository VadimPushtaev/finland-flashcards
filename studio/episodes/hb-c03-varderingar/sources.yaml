    heading: Hurdana värderingar bygger Finland som land på?
    source_range:
      start: 0
      end: 332
    range_basis: normalized_html_block
    extracted_passage: De grundläggande värderingar i det finländska samhället som nämns i Finlands
      grundlag är frihet, mänskliga rättigheter och jämställdhet och jämlikhet. Jämlikhet innebär
      att alla människor är lika mycket värda. Ingen får diskrimineras av någon orsak som gäller
      hens person, till exempel nationellt ursprung, handikapp eller religion.
    normalization: whitespace_only
    repairs: []
