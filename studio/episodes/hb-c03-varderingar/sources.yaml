    range_basis: normalized_html_block
    extracted_passage: Värderingar är något som människor eller människogrupper anser är viktiga
      och eftersträvar. Värderingar hjälper oss att förstå människors val och beteende. Exempel på
      värderingar är jämställdhet, likabehandling och världsfred. Dessa värderingar är tillstånd
      som människor och samhällen eftersträvar. Det finns också värderingar som beskriver hur man
      önskar att människan skulle bete sig. Sådana värderingar är till exempel artighet, ärlighet
      eller flit.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
