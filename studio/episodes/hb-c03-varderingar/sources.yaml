    range_basis: normalized_html_block
    extracted_passage: Vad människan anser vara viktigt eller önskvärt förändras ofta under livets
      gång. Också ett helt samhälles värderingar kan förändras vid stora förändringar eller kriser.
      Människor som bor i samma samhälle har sinsemellan olika värderingar. Alla invånare i Finland
      anser inte att samma saker är viktiga eller baserar sitt liv på samma värderingar.
    normalization: whitespace_only
