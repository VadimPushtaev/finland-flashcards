    range_basis: normalized_html_block
    extracted_passage: I demokratiska samhällen som Finland diskuteras värderingar mycket. I sådana
      samhällen förekommer det samtidigt många olika synpunkter på vad som ska eftersträvas. Till
      exempel olika politiska partier och politiker har sinsemellan olika värderingar som styr deras
      beslut. Väljarna försöker välja ett parti eller en politiker vars värderingar motsvarar deras
      egna.
