- id: story_structure
  decision: Group consecutive source sentences into the scenes below. Read every body sentence once in
    its exact original order, without added narration.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920×1080,24fps. Chapter1 evergreen #102e2b, ivory #f6f1e6, muted sage #bdd3c9 and gold #e7bc70.
    Fixed right bilingual panel, Swedish above Russian. Arial Bold48 and Arial40; long pairs use the renderer’s
    recorded fitted sizes. Left useful-image area remains open when no source-based graphic clarifies
    a fact.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display text 0.25 seconds before speech. Moderate local voice speed0.95; allow 1.5 seconds
    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Bilingual street sign of Hietalahdenkatu in Helsinki, Finland, 2020.jpg by Henry
    Söderlund continuously as decorative background, darkened42% and blurred2.5px. Smooth cyclic diagonal
    pan(0.15,0.15)→(0.85,0.85) and15%relative zoom1.06→1.219,140seconds per motion cycle, starting in
    motion, with no sentence resets. Total cycles=1.3148809523809524. Foreground and bilingual text remain
    fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Evening Fall (Harp) by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter's
    distinct instrumental track. Original master 145.219 seconds; prepared lossless stereo bed 184.083
    seconds. Repeat count 1, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Generate only selected exact Swedish source words, dates and figures as calm high-contrast
    foreground typography; preserve qualifiers in body text. Do not use anonymous portraits as evidence
    of ethnicity. Leave the foreground area open in remaining sentences. Suppress the renderer’s duplicate
    bottom caption for these cards with render_caption:false; retain inline highlighting in the Swedish
    body text.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two readable15second credit cards over continuing photo. Full source and media attribution
    travels beside final MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
