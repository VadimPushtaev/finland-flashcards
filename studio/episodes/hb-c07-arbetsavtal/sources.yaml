    extracted_passage: "Innan arbetstagaren börjar i det nya arbetet ingår hen ett arbetsavtal med\
      \ arbetsgivaren. Arbetsavtalet \ningås vanligen skriftligt, men även ett muntligt avtal är\
      \ giltigt enligt lagen. Arbetsgivaren måste dock \nalltid ge avtalsvillkoren i skriftlig form\
      \ om arbetstagaren ber om det. Det är att rekommendera att \navtalet ingås skriftligt. Då kan\
      \ båda parterna hålla koll på de överenskomna sakerna och i \nproblemsituationer kan man hänvisa\
      \ till avtalets innehåll.  \n"
    normalization: whitespace_only
    repairs: []
    selection: Complete textbook paragraph explicitly preserves legal validity of oral contracts
      and recommends written agreement. Replaces website paragraph with unconditional always-two-signed-copies
      wording.
