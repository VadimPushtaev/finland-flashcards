- sentence_id: hb-c07-u0293-s001
  sv: Innan arbetstagaren börjar i det nya arbetet ingår hen ett arbetsavtal med arbetsgivaren.
  ru: Прежде чем приступить к новой работе, работник заключает с работодателем трудовой договор.
  scene_id: scene-1
  visual_cue: Arbetsavtalet och underskrift; show source-specific contract picture without an orphaned
    caption.
