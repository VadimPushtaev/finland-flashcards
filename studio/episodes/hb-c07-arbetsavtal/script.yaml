episode_decisions:
- id: opening
  decision: Exact bilingual heading on an unspoken3-second card; continuous background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Use the individually planned consecutive scenes; every source sentence/list fragment exactly
    once in original order without added spoken transitions.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080/24fps, Chapter7 olive palette {''background'': ''#30371f'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d2d9b7'', ''highlight'': ''#e7bf78'', ''separator'': ''#636e42''}. Liberation Sans
    Bold48/Regular40. Fixed Swedish/Russian panel right and source-specific foreground pictures left.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Text appears0.25seconds before complete measured narration; pause1.5seconds normally,2.2at
    scene boundaries,2.5for long pairs. No acceleration to force runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Väritehtaankatu 8 office building in Jokiniemi, Vantaa, Finland, 2022 April.jpg by
    Ximonic (Simo Räsänen) continuously as decorative background, darkened 42% and blurred 2.5 px. Smooth
    cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds per motion
    cycle, starting in motion, with no sentence resets. Total cycles=7.103869047619047. Foreground and
    bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, 32 steps, speed0.95, seed42, mono44100PCM16; 2 ONNX intra-op
    threads for initial source-order run. One selected bounded hours-number retake used 1 thread. Complete-video
    listening remains pending; ASR diagnostics cannot approve pronunciation.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Meditation Impromptu 03 by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 255.242 seconds; prepared lossless stereo bed 994.542
    seconds. Repeat count 3, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Individual pictorial scene plan: source-based diagrams and verified workplace/institution
    photos. Aim>=50% measured body picture coverage without generic filler. Labels only repeat source
    concepts; no new current-law claims.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Unspoken source/media credit cards and additional readable picture attributions,15seconds
    percard; full source,license and adaptation details accompany canonical export.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Exact archived Swedish and current reviewed Russian display
    preserved.
  status: proposed
  resolve_during: script
