- sentence_id: hb-c05-u0096-s002
  sv: De har rätt att delta i samhället och beslutsfattande som rör dem på ett jämlikt sätt med övriga
    invånare.
  ru: Они имеют право наравне с остальными жителями участвовать в жизни общества и в принятии касающихся
    их решений.
