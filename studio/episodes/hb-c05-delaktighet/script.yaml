- sentence_id: hb-c05-u0119-s001
  sv: Arbetsutrymmena kan ändras om så att arbetstagare med funktionsnedsättning kan både röra sig i dem
    obehindrat och arbeta i dem utan problem.
  ru: Рабочие помещения можно переоборудовать так, чтобы работники с инвалидностью могли и беспрепятственно
    передвигаться в них, и работать без проблем.
  scene_id: scene-6
