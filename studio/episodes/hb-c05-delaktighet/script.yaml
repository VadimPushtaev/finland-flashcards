- sentence_id: hb-c05-u0096-s003
  sv: De har enligt lagen rätt också till tjänster som stöder funktionsförmågan, såsom mobilitetstjänster,
    assistans- och tolkningstjänster och olika hjälpmedel.
  ru: Согласно закону они также имеют право на услуги, поддерживающие функциональные возможности, такие
    как услуги по обеспечению мобильности, помощи и перевода, и на различные вспомогательные средства.
  scene_id: scene-1
