  sv: En jämlik delaktighet för personer med funktionsnedsättning främjas i Finland genom till exempel
    lagen om funktionshinderservice, säkerställande av tillgänglighet, stöd för kommunikation och beslutsfattande
    och positiv särbehandling.
  ru: В Финляндии равноправному участию людей с инвалидностью способствуют, например, закон об услугах
    для людей с инвалидностью (lagen om funktionshinderservice), обеспечение доступности, поддержка общения
    и принятия решений, а также особые меры поддержки.
