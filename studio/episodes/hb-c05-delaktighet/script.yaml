- sentence_id: hb-c05-u0120-s002
  sv: Om arbetsgivaren trots begäran inte gör anpassningar, ska arbetstagaren få en skriftlig motivering
    om det.
  ru: Если работодатель, несмотря на просьбу, не принимает меры по адаптации, работник должен получить
    письменное обоснование этого.
  scene_id: scene-6
