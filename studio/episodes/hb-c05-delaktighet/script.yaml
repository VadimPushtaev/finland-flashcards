- sentence_id: hb-c05-u0119-s002
  sv: Dessutom kan man göra anpassningar för att säkerställa att arbetstagaren får nödvändig information
    i tillgängligt format i arbetet.
  ru: Кроме того, можно принять меры по адаптации, чтобы работник получал необходимую информацию в доступном
    формате в ходе работы.
  scene_id: scene-6
  visual_cue: Actual refreshable Braille display, a concrete assistive device for information accessibility;
