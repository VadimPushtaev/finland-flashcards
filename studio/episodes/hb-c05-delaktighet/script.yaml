- sentence_id: hb-c05-u0118-s004
  sv: En person är partiellt arbetsför om hen har tillgång till endast en del av sin arbetsförmåga på
    grund av en sjukdom eller en funktionsnedsättning och vill delta i arbetslivet.
  ru: Человек частично трудоспособен, если из-за болезни или инвалидности он располагает лишь частью своей
    трудоспособности и хочет участвовать в трудовой жизни.
  scene_id: scene-6
  visual_cue: Actual computer/Braille display demonstration at Wikimedia developer meeting; generic accessible
    digital work and study example, not inference of disability or employment status of pictured people.
    Preserve the whole image and fixed bilingual panel; no caption.
