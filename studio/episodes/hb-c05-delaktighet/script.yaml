- sentence_id: hb-c05-u0119-s003
  sv: Arbetsgivaren kan få ekonomiskt stöd för lönekostnaderna för en partiellt arbetsför eller handikappad
    arbetstagare eller för att ordna arbetsförhållandena.
  ru: Работодатель может получить финансовую поддержку для оплаты труда частично трудоспособного работника
    или работника с инвалидностью либо для организации условий труда.
  scene_id: scene-6
