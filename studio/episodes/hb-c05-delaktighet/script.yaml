- sentence_id: hb-c05-u0096-s004
  sv: Det är samhällets uppgift att säkerställa att det är möjligt för personer med funktionsnedsättning
    att delta i all verksamhet i samhället.
  ru: Задача общества — обеспечить людям с инвалидностью возможность участвовать во всех видах деятельности
    в обществе.
  scene_id: scene-1
