  sv: Med positiv särbehandling avses särskilda åtgärder för att förbättra ställningen och förhållandena
    för personer med funktionsnedsättning inom till exempel utbildning, antagning av studerande eller
    rekrytering.
  ru: Под особыми мерами поддержки понимаются специальные меры по улучшению положения и условий жизни
    людей с инвалидностью, например в образовании, при приёме на учёбу или при найме на работу.
