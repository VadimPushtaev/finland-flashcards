- sentence_id: hb-c05-u0120-s001
  sv: När arbetsgivaren fattar beslut om vem som ska anställas får beslutet inte påverkas av att en person
    med funktionsnedsättning behöver anpassningar för att kunna arbeta på arbetsplatsen.
  ru: Когда работодатель решает, кого принять на работу, на это решение не должна влиять потребность человека
    с инвалидностью в мерах по адаптации, необходимых ему для работы на данном рабочем месте.
  scene_id: scene-6
  visual_cue: Keep the foreground open to the moving background; exact bilingual source text remains fixed.
