- sentence_id: hb-c05-u0118-s003
  sv: Till exempel med en partiellt arbetsför person kan man komma överens om deltidsarbete eller andra
    arrangemang.
  ru: Например, с частично трудоспособным человеком можно договориться о работе с неполным рабочим временем
    или о других мерах.
  scene_id: scene-6
