- sentence_id: hb-c05-u0118-s001
  sv: På arbetsplatserna ska arbetsgivarna vid behov göra anpassningsarrangemang för arbetstagare med
    funktionsnedsättning.
  ru: На рабочих местах работодатели при необходимости должны принимать меры по адаптации условий труда
    для работников с инвалидностью.
