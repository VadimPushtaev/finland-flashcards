- sentence_id: hb-c05-u0097-s001
  sv: En person med funktionsnedsättning har en fysisk, intellektuell eller sensorisk funktionsnedsättning
    som kan göra det svårare för hen att delta i samhället fullt ut och på ett jämlikt sätt.
  ru: У человека с инвалидностью есть физическое, интеллектуальное или сенсорное нарушение, которое может
    затруднять его полноценное и равноправное участие в жизни общества.
