- sentence_id: hb-c05-u0118-s002
  sv: Rimliga anpassningar betyder att man skaffar hjälpmedel till arbetsplatsen eller att arbetsuppgifterna
    och arbetstiderna omorganiseras.
  ru: Разумные меры по адаптации означают приобретение вспомогательных средств для рабочего места либо
    изменение рабочих задач и рабочего времени.
  scene_id: scene-6
