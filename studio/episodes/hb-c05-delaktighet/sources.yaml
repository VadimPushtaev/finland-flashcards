    heading: På arbetsplatsen kan anpassningar göras för arbetstagare med funktionsnedsättning
    source_range:
      start: 0
      end: 540
    range_basis: normalized_html_block
    extracted_passage: På arbetsplatserna ska arbetsgivarna vid behov göra anpassningsarrangemang
      för arbetstagare med funktionsnedsättning. Rimliga anpassningar betyder att man skaffar hjälpmedel
      till arbetsplatsen eller att arbetsuppgifterna och arbetstiderna omorganiseras. Till exempel
      med en partiellt arbetsför person kan man komma överens om deltidsarbete eller andra arrangemang.
      En person är partiellt arbetsför om hen har tillgång till endast en del av sin arbetsförmåga
      på grund av en sjukdom eller en funktionsnedsättning och vill delta i arbetslivet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
