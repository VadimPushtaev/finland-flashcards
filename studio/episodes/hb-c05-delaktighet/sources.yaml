    heading: På arbetsplatsen kan anpassningar göras för arbetstagare med funktionsnedsättning
    source_range:
      start: 0
      end: 400
    range_basis: normalized_html_block
    extracted_passage: När arbetsgivaren fattar beslut om vem som ska anställas får beslutet inte
      påverkas av att en person med funktionsnedsättning behöver anpassningar för att kunna arbeta
      på arbetsplatsen. Om arbetsgivaren trots begäran inte gör anpassningar, ska arbetstagaren få
      en skriftlig motivering om det. Arbetstagaren kan också kontakta arbetarskyddsmyndigheten om
      man inte går framåt i frågan på arbetsplatsen.
    normalization: whitespace_only
    repairs: []
