    heading: På arbetsplatsen kan anpassningar göras för arbetstagare med funktionsnedsättning
    source_range:
      start: 0
      end: 428
    range_basis: normalized_html_block
    extracted_passage: Arbetsutrymmena kan ändras om så att arbetstagare med funktionsnedsättning
      kan både röra sig i dem obehindrat och arbeta i dem utan problem. Dessutom kan man göra anpassningar
      för att säkerställa att arbetstagaren får nödvändig information i tillgängligt format i arbetet.
      Arbetsgivaren kan få ekonomiskt stöd för lönekostnaderna för en partiellt arbetsför eller handikappad
      arbetstagare eller för att ordna arbetsförhållandena.
    normalization: whitespace_only
    repairs: []
