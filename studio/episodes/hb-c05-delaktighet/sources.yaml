    heading: Personer med funktionsnedsättning får stöd för skolgång och studier
    source_range:
      start: 0
      end: 365
    range_basis: normalized_html_block
    extracted_passage: En studerande med funktionsnedsättning kan få stöd, hjälp och rimliga anpassningar
      för studierna. En gravt handikappad studerande kan till exempel ha rätt till en personlig assistent,
      som hjälper hen att röra sig på läroanstalten, i matsalen eller med att göra anteckningar.
      Hörselskadade samt syn- och hörselskadade studerande har rätt till teckenspråkig tolkning.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
