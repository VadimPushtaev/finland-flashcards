    range_basis: normalized_html_block
    extracted_passage: En person med funktionsnedsättning har en fysisk, intellektuell eller sensorisk
      funktionsnedsättning som kan göra det svårare för hen att delta i samhället fullt ut och på
      ett jämlikt sätt. En person med utvecklingsstörning kan till exempel ha svårt att lära sig
      och förstå. En person med rörelsenedsättning har en funktionsnedsättning som påverkar rörligheten.
      En synskadad i sin tur har en funktionsnedsättning som påverkar synen och en hörselskadad en
      funktionsnedsättning som påverkar hörseln.
    normalization: whitespace_only
    repairs: []
