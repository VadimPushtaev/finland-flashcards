    source_range:
      start: 0
      end: 287
    range_basis: normalized_html_block
    extracted_passage: 'Ekonomin växte kraftigt under uppgången på 1980-talet. Utbildningsnivån steg
      också i häpnadsväckande takt. Finländarna blev så småningom konsumenter som hade råd att köpa
      också annat än bara det allra nödvändigaste: kläder, möbler, utlandsresor och bilar. Samtidigt
      steg bostadspriserna.'
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0076:
