    range_basis: normalized_html_block
    extracted_passage: Det räckte ändå inte arbete och bostäder till alla, och många flyttade utomlands
      för att arbeta. Över 400 000 finländare flyttade till Sverige på 1960- och 1970-talen. En del
      återvände hem när sysselsättningsläget blev bättre i Finland, men andra stannade kvar i Sverige.
      Fram till 2010-talet var finländarna den största invandrargruppen i Sverige.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
