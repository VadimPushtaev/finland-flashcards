    heading: Finland gick från jordbrukssamhälle till service- och informationssamhälle
    source_range:
      start: 0
      end: 302
    range_basis: normalized_html_block
    extracted_passage: På 1990-talet gick man från ett industri- och servicesamhälle till ett informationssamhälle.
      Informationstekniken och kommunikationstekniken utvecklades, användningen av internet blev
      vanligare och mobiltelefonerna blev en viktig exportprodukt för finländarna. Finländska företag
      internationaliserades.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
