    range_basis: normalized_html_block
    extracted_passage: Finland blev ett lika rikt och välmående land som de övriga nordiska länderna,
      trots att skillnaden jämfört med till exempel Sverige var stor ännu på 1950-talet. Vid den
      tiden var Finland ett fattigare och mindre utvecklat land än sina grannar som precis hade överlevt
      krig och betalat stora krigsskadestånd.
    normalization: whitespace_only
