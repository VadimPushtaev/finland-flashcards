    heading: Finland gick från jordbrukssamhälle till service- och informationssamhälle
    source_range:
      start: 0
      end: 319
    range_basis: normalized_html_block
    extracted_passage: På 1960-talet började Finland gå från ett jordbruksdominerat land till ett
      industri- och servicesamhälle. Arbetstillfällena på landsbygden minskade när användningen av
      jordbruksmaskiner ökade. Människorna flyttade till städerna. Där fanns det arbete inom industrin,
      servicebranschen och handels- och transportbranschen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
