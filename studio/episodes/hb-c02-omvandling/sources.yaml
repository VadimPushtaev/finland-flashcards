    heading: Finland gick från jordbrukssamhälle till service- och informationssamhälle
    source_range:
      start: 0
      end: 453
    range_basis: normalized_html_block
    extracted_passage: Så småningom blev ekonomin överhettad. Priserna blev för höga och till sist
      kraschade allt. Det ledde i början av 1990-talet till en lågkonjunktur, som var särskilt svår
      i Finland. Arbetslösheten var hög, och banker och företag gick i konkurs. Man blev tvungen
      att minska på välfärdsstatens tjänster till medborgarna. Finländarna drabbades hårt av nedgången.
      Finska staten var tvungen att ta stora lån för att landet skulle klara sig ur lågkonjunkturen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
