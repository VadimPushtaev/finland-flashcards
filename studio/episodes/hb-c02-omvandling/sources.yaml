    extracted_passage: Idén om en enhetlig nioårig grundskola som alla barn skulle få gå i föddes.
      På 1970-talet övergick finländarna till en sådan ny grundskola. När utbildningssystemet utvecklades
      blev samhället mer jämlikt och Finland utvecklades ekonomiskt.
    normalization: whitespace_only
