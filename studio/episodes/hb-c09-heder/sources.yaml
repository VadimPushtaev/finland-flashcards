    range_basis: normalized_html_block
    extracted_passage: Med tvångsäktenskap avses en situation där den ena eller båda makarna inte
      fritt har kunnat påverka äktenskapet eller ingåendet av en äktenskapsliknande relation eller
      valet av make. Man kan tvinga någon in i äktenskap genom att till exempel utöva påtryckningar
      eller utpressning, utöva våld eller hota med våld. Man kan också hota med uteslutning från
      familjen eller gemenskapen.
