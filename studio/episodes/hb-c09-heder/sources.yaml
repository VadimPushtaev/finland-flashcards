      under 18 år kan inte officiellt ingå äktenskap i Finland. Ett barn kan dock föras till ett
      annat land för att ingå äktenskap, eller så kan äktenskapet ingås endast med hjälp av religiösa
      ceremonier utan någon officiell vigsel.
