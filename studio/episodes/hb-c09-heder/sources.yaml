    range_basis: normalized_html_block
    extracted_passage: Hedersrelaterat våld förekommer först och främst i gemenskapsorienterade kulturer
      och samfund, där män har mycket mer makt än kvinnor. Det förekommer också i Finland. Det är
      ofta flickor och kvinnor och personer som hör till sexuella minoriteter eller könsminoriteter
      som faller offer för våldet. Också pojkar och män kan utsättas för hedersrelaterat våld. De
      kan också till exempel pressas att använda våld mot andra.
