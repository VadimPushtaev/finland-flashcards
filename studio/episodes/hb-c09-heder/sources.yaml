    range_basis: normalized_html_block
    extracted_passage: Hedersrelaterat våld kan vara psykiskt eller fysiskt. Det kan vara att offret
      till exempel blir utsatt för påtryckningar, tvingas att gifta sig, inte får röra sig eller
      klä sig som hen vill, eller att man styr vem hen sällskapar med eller vilka hobbyer hen har.
      Andra former av våld kan vara hot om att skicka personen tillbaka till det gamla hemlandet
      och andra hot, samt könsstympning av flickor och kvinnor eller förhindrande av skilsmässa.
    normalization: whitespace_only
