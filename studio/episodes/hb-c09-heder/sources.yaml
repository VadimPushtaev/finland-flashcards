    range_basis: normalized_html_block
    extracted_passage: Hedersrelaterat våld är våld som i allmänhet sker inom den egna familjen,
      släkten eller gemenskapen. Det hänger samman med ett försvar av familjens eller gemenskapens
      heder. Att bevara hedern innebär att en människa får respekt från andra och inte behöver skämmas.
      Släkten, familjen eller gemenskapen upplever att hedern är hela familjens eller släktens angelägenhet.
      När en individs gärningar bryter mot gemenskapens regler och seder försöker de övriga att återställa
      hedern genom att bruka våld eller hota med våld.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
