scenes:
- id: scene-1
  description: Hedersrelaterat våld är våld som i allmänhet sker inom den egna familjen, släkten eller
    gemenskapen.
- id: scene-2
  description: Ofta är hedersrelaterat våld förknippat med situationer där en familj eller släkt upplever
    att någon i familjen har brutit mot normerna i gemenskapen.
- id: scene-3
  description: Hedersrelaterat våld förekommer först och främst i gemenskapsorienterade kulturer och samfund,
    där män har mycket mer makt än kvinnor.
- id: scene-4
  description: Hedersrelaterat våld kan vara psykiskt eller fysiskt.
- id: scene-5
  description: Enligt Finlands lag är hedersrelaterat våld ett brott.
- id: scene-6
  description: Med tvångsäktenskap avses en situation där den ena eller båda makarna inte fritt har kunnat
    påverka äktenskapet eller ingåendet av en äktenskapsliknande relation eller valet av make.
- id: scene-7
  description: I synnerhet flickor och kvinnor blir tvingade att gifta sig, men också pojkar och män.
- id: scene-8
  description: Att tvinga någon in i äktenskap är ett brott i Finland.
- id: scene-9
  description: Hjälpsystemet för offer för människohandel ger stöd till offer för tvångsäktenskap och
    information om tvångsäktenskap och andra former av människohandel.
