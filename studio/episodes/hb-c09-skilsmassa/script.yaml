    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Source application stages and conditional clocks lead into property division, names, mediation
    and legal-aid eligibility; distinguish joint filing from notification of an individual filing.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Espoon käräjäoikeus May 2018.jpg by Abc10 continuously as decorative background,
    darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative
    zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets. Total
    cycles=3.8851190476190482. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Decline by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct instrumental
    track. Original master 207.177 seconds; prepared lossless stereo bed 543.917 seconds. Repeat count
    2, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music adjustment,
    ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: Skilsmässa betyder att ett äktenskap upplöses.
- id: scene-2
  description: Ansökan om skilsmässa görs i två steg.
- id: scene-3
  description: När den första ansökan om skilsmässa har lämnats in börjar en sex månader lång betänketid.
- id: scene-4
  description: Om du och din maka/make ansöker om skilsmässa tillsammans, börjar betänketiden direkt när
    er gemensamma ansökan har kommit in hos tingsrätten.
- id: scene-5
  description: Om en av makarna ensam ansöker om skilsmässa, börjar betänketiden från den dag då ansökan
    delges den andra makan.
- id: scene-6
  description: Det är viktigt att lämna in den andra ansökan om skilsmässa inom ett år efter att betänketiden
    började.
- id: scene-7
  description: I samband med en skilsmässa görs en avvittring av egendom, det vill säga parets egendom
    delas enligt antingen äktenskapslagen eller ett äktenskapsförord.
- id: scene-8
  description: Nuförtiden är skilsmässor vanliga i Finland, och människor är inte tvungna att stanna i
    ett olyckligt äktenskap.
- id: scene-9
  description: Bodelningen vid skilsmässa kan vara en komplicerad process.
- id: scene-10
  description: Om ni har bolån är det viktigt att komma överens om hur ni delar lånet.
- id: scene-11
  description: Om ni inte kan komma överens om hur ni ska dela upp egendomen, kan vem som helst av makarna
    kräva egendomsfördelning, det vill säga bodelning (ositus).
- id: scene-12
  description: När ni kräver bodelning förordnar tingsrätten en bodelningsman som delar egendomen.
- id: scene-13
  description: När bodelningen inleds ska man utreda hur mycket egendom och skulder vardera maka har.
- id: scene-14
  description: Om du eller din maka/make kommer från något annat land än Finland kan vissa rättsliga frågor
    påverkas av lagarna i ett annat land.
- id: scene-15
  description: Du kan be om råd av en jurist som har erfarenhet av denna typ av ärenden.
- id: scene-16
  description: Om ditt äktenskap slutar med skilsmässa, ändras inte ditt efternamn.
- id: scene-17
  description: När ni överväger skilsmässa och behöver hjälp med att komma överens om saker och ting,
    kan ni ansöka om medling i familjefrågor (perheasioiden sovittelu).
- id: scene-18
  description: Vid problem i parförhållandet kan du söka hjälp till exempel hos fostrings- och familjerådgivningen
    (kasvatus- ja perheneuvonta) eller social- och hälsocentralen (sosiaali- ja terveyskeskus).
- id: scene-19
  description: Vid en skilsmässa kan det uppstå frågor kring uppehållstillståndet, egendomen, underhållsbidraget
    eller barnets boende, vårdnad och umgänge.
- id: scene-20
  description: Juridisk rådgivning erbjuds av advokatbyråer, juridiska byråer och statens rättshjälpsbyråer,
    där offentliga rättsbiträden arbetar.
- id: scene-21
  description: Juristtjänsterna är avgiftsbelagda men om du har låg eller medelhög inkomst, kan du få
    gratis eller delvis ersättningsgill juridisk hjälp vid statens rättshjälpsbyrå.
- id: scene-22
  description: Om du har en rättsskyddsförsäkring som ersätter dina utgifter, kan du inte få offentlig
    rättshjälp.
