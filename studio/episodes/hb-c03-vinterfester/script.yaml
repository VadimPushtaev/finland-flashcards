  resolve_during: script
- id: voice_selection
  decision: Use series local Supertonic3/F1, Swedish,32steps,speed0.95,seed42,44100Hz mono PCM16. Exact
    inputs and checksums retained. Numbers and abbreviations have separately recorded speech-only expansions;
    pronunciation awaits whole-video review.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Moonstone by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 255.138 seconds; prepared lossless stereo bed 110.833 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Use selected exact source words and dates as complete typography cards. Cards add no claims
    and retain source qualifiers in the full text. Leave foreground empty elsewhere; suppress orphaned/redundant
    image captions.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two15second source/media credit cards; complete attribution accompanies exported MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. All creative choices are proposals for whole-video user
    review.
  status: proposed
  resolve_during: script
