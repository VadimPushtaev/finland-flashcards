episode_decisions:
- id: opening
  decision: Exact bilingual heading, unspoken, on a three-second card; background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Individually planned consecutive scenes preserve every exact body sentence and list fragment
    once in source order. No added spoken transitions.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter7 olive palette {''background'': ''#30371f'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d2d9b7'', ''highlight'': ''#e7bf78'', ''separator'': ''#636e42''}. Linux Liberation
    Sans Bold48/Regular40 with Swedish and Cyrillic coverage. Fixed bilingual right panel and separate
    left pictorial foreground.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Text appears0.25s before complete measured narration. Pause1.5s normally,2.2s at scene boundaries
    and2.5s for long pairs; no acceleration to fit a target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Fujitsun ja ABB-n konttorit - panoramio.jpg by Aulo Aasmaa continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=6.144047619047619. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPy seed42,44100Hz monoPCM16; initial ONNX
    intra-op2threads. Complete-video pronunciation and overall mix remain pending; ASR is diagnostic only.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Midnight Tale by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 161.567 seconds; prepared lossless stereo bed 860.167 seconds.
    Repeat count 5, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Source-specific pictorial workplace objects, process diagrams and accurately identified photographs
    at topic boundaries; >=50% actual body timeline picture target. No unrelated filler or text-only cards
    counted. No photographs imply depicted people are victims, offenders or particular applicants.
  status: proposed
  resolve_during: script
- id: closing
  decision: Unspoken source/media credits and foreground credits,15seconds each, over continuous background.
    Full actual publisher/copyright/license notices accompany canonical MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; exact archived source and current reviewed Russian display
    remain unchanged. No new employment rules, benefits or legal advice introduced.
  status: proposed
  resolve_during: script
