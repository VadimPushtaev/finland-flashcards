    extracted_passage: I Finland följer man i allmänhet arbetsavtal, kollektivavtal och arbetslagstiftningen.
      Ändå uppstår det ibland problem i arbetet. Problemen kan vara lindrigare eller allvarligare.
      Arbetsgivaren känner inte alltid till sina skyldigheter eller så handlar arbetsgivaren ibland
      felaktigt med avsikt. Arbetsrelaterat utnyttjande innebär att en anställd i en svag ställning
      utnyttjas i syfte att uppnå ekonomisk nytta.
