    range_basis: normalized_html_block
    extracted_passage: Romerna har ett eget rikt kulturarv, såsom romsk musik, romska seder och bruk,
      den romska dräkten och traditionellt också handarbetskonst. Viktiga aspekter inom seder och
      bruk är respekt för de äldre, gemenskap och familjecentrering. Tidigare levde romerna i Finland
