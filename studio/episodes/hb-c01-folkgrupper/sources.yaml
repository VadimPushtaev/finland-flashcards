    heading: Ester och estnisktalande har flyttat till Finland av familjeskäl och för arbete
    source_range:
      start: 0
      end: 631
    range_basis: normalized_html_block
    extracted_passage: År 2023 fanns det omkring 50 000 estnisktalande i Finland. Det estniska språket
      är släkt med finskan, och personer som kan finska kan förstå en del estniska och tvärtom. Efter
      Sovjetunionens fall flyttade estnisktalande till Finland i synnerhet av familjeskäl och i egenskap
      av ingermanländare. Efter att Estland anslöt sig till Europeiska unionen år 2004 har många
      ester flyttat till Finland för arbete. I Finland arbetar också många ester som bor permanent
      i Estland och kanske arbetar i både Finland och Estland. Dessutom har ester flyttat från Estland
      till Finland för att studera både före och efter att Estland gick med i EU.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
