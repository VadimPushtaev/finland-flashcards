    heading: I Finland bor många olika folkgrupper
    source_range:
      start: 0
      end: 453
    range_basis: normalized_html_block
    extracted_passage: Finlands befolkning har under årtusenden blandat sig med människogrupper som
      kommit hit från olika väderstreck. Före det nationella uppvaknandet i början av 1800-talet
      ansåg man inte att det fanns ett enhetligt folk i Finland. Människor som bodde på olika håll
      i landet upplevde att de i huvudsak hörde till sin egen ort eller sitt eget område. Det finns
      fortfarande skillnader mellan olika områden i Finland när det gäller dialekter och seder och
      bruk.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
