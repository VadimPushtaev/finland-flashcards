    range_basis: normalized_html_block
    extracted_passage: Ryssarna och de ryskspråkiga i Finland har alltid varit en komplex folkgrupp.
      En del av de ryskspråkiga eller deras familjemedlemmar är ingermanländare, en del ester eller
      ukrainare, eller andra utan ryskt medborgarskap. År 2023 fanns det uppemot 100 000 ryskspråkiga
      personer i Finland.
