    source_role: content
    heading: Finlands befolkning blir mer varierande när folk flyttar till Finland från olika håll
      i världen
    source_range:
      start: 0
      end: 372
    range_basis: normalized_html_block
    extracted_passage: Det har också uppstått flera nyare etniska, språkliga, religiösa och kulturella
      minoritetsgrupper i Finland. Några av de större grupper som kommit från länder utanför Europa
      är till exempel somalier, kineser, irakier och indier. I Finland bor det många som talar arabiska
      från olika länder, och alla de största religionerna i världen finns numera representerade i
      Finland.
