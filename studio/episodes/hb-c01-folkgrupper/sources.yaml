    heading: I Finland finns en liten judisk minoritet
    source_range:
      start: 0
      end: 344
    range_basis: normalized_html_block
    extracted_passage: 'Judar flyttade till Finland ursprungligen från Ryssland på 1830-talet. De
      har två församlingar, en i Åbo och en i Helsingfors. I Helsingfors finns också ett judiskt
      daghem och en judisk samskola. De finska judarnas modersmål var på 1800-talet till stor del
      jiddisch och senare svenska. I dag talar de finska och flera andra språk som hemspråk. '
    normalization: whitespace_only
    repairs: []
    selection: Omit only final undated Jewish population estimate.
