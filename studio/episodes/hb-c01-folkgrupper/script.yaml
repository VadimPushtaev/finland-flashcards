    decorative background, darkened42% and blurred2.5px. Smooth cyclic diagonal pan(0.15,0.15)→(0.85,0.85)
    and15%relative zoom1.06→1.219,140seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=3.1529761904761906. Foreground and bilingual text remain fixed.
