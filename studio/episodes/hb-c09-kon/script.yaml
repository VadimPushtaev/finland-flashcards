episode_decisions:
- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Paragraph and source-list groups retain their original progression. Source-specific illustrations
    explain the exact relationships without adding contemporary law or statistics.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Skatudden helsinki - tove jansson parc - playground 2.jpg by Sinikka Halme continuously
    as decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85)
    and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence
    resets. Total cycles=5.088392857142857. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Farm by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct instrumental
    track. Original master 292.323 seconds; prepared lossless stereo bed 712.375 seconds. Repeat count
    2, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music adjustment,
    ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: Familjerna har en viktig roll när det gäller att öka jämställdheten.
- id: scene-2
  description: Med stereotyp avses en förenklad och generaliserande uppfattning om hurdana vissa personer
    eller fenomen är.
- id: scene-3
  description: Stereotyper om kön är mycket vanliga och syns inom många områden av livet.
- id: scene-4
  description: Utifrån stereotyper och andra föreställningar skapas normer i samhället.
- id: scene-5
  description: En stereotyp om kvinnor kan vara ett antagande om att alla kvinnor är intresserade av sitt
    utseende och använder smink för att se vackrare ut.
- id: scene-6
  description: Könsnormer skapar oskrivna regler för hur kvinnor och män ska bete sig.
- id: scene-7
  description: Det finns ändå fortfarande många könsstereotyper och könsnormer i Finland som påverkar
    människors beteende.
- id: scene-8
  description: Könsstereotyper och könsnormer förändras över tid.
- id: scene-9
  description: Enligt en traditionell könsstereotyp tar kvinnorna hand om hushållsarbetet och barnen,
    medan männen försörjer familjen genom att arbeta utanför hemmet.
- id: scene-10
  description: Statistiken visar att kvinnor fortfarande ägnar mer tid åt hushållsarbete än män.
- id: scene-11
  description: Många familjer strävar efter att dela lika på hushållsarbetet och barnskötseln.
- id: scene-12
  description: Könsstereotyper och könsnormer när det gäller arbetsfördelning är numera mindre starka
    än tidigare.
- id: scene-13
  description: Barn tillägnar sig könsstereotyper och könsnormer redan när de är små.
- id: scene-14
  description: En jämställd barnuppfostran kräver att de vuxna ägnar uppmärksamhet åt sitt beteende och
    sina attityder.
- id: scene-15
  description: Barns tankesätt påverkas av om de vuxna delar in vissa lekar, leksaker och kläder som typiska
    för flickor eller pojkar.
- id: scene-16
  description: Det är också skadligt för ett barns välbefinnande om hen upplever att hen är fel på något
    sätt.
- id: scene-17
  description: Det är ganska enkelt för vuxna att märka om de erbjuder barn leksaker utifrån deras kön.
- id: scene-18
  description: När vuxna förväntar sig olika beteende av flickor och pojkar stärker de könsnormerna.
