    extracted_passage: När vuxna förväntar sig olika beteende av flickor och pojkar stärker de könsnormerna.
      Ofta lär sig flickorna ända från små att ta mer hänsyn till andra och ge andra mer utrymme.
      Pojkar i sin tur lär sig att ta risker och vara självsäkra. Dessa beteendemönster som man lär
      sig i barndomen inverkar på jämställdheten mellan könen i årtionden framöver.
