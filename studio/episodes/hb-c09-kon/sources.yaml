    heading: Jämställdheten är inte fulländad i Finland heller
    source_range:
      start: 0
      end: 478
    range_basis: normalized_html_block
    extracted_passage: Familjerna har en viktig roll när det gäller att öka jämställdheten. Den interna
      arbetsfördelningen i familjerna är i sig en jämställdhetsfråga. Dessutom har den betydelse
      för till exempel könens ställning på arbetsmarknaden. Å andra sidan har det stor betydelse
      för jämställdheten hur barnen uppfostras och huruvida flickor och pojkar behandlas på samma
      sätt i familjerna. De attityder och handlingsmönster som människor lärt sig som barn påverkar
      hur de agerar senare i livet.
    normalization: whitespace_only
    repairs: []
