    range_basis: normalized_html_block
    extracted_passage: En stereotyp om kvinnor kan vara ett antagande om att alla kvinnor är intresserade
      av sitt utseende och använder smink för att se vackrare ut. På motsvarande sätt kan en könsnorm
      bestämma att en kvinna måste använda smink och ta hand om sitt utseende. Då accepteras hon
