    extracted_passage: Det är också skadligt för ett barns välbefinnande om hen upplever att hen
      är fel på något sätt. Vuxna kanske säger till en pojke att det inte är passande för honom att
      klä sig i en prinsessklänning. Nuförtiden strävar man i Finland till exempel inom småbarnspedagogiken
      efter att barnen fritt ska få uttrycka sig och prova på olika roller. Barnen måste få uppleva
      att de får vara precis som de är och tycka om precis de saker de tycker om.
