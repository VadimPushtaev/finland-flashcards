    extracted_passage: Det är ganska enkelt för vuxna att märka om de erbjuder barn leksaker utifrån
      deras kön. Det finns ändå också beteenden som det är svårare att lägga märke till. Vuxna kan
      till exempel oftare be flickor att hjälpa till med hushållssysslorna. De kanske låter pojkar
      springa och skrika, men uppmanar flickor att lugna ner sig och bete sig behärskat.
