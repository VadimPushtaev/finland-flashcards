    range_basis: normalized_html_block
    extracted_passage: Barns tankesätt påverkas av om de vuxna delar in vissa lekar, leksaker och
      kläder som typiska för flickor eller pojkar. En sådan indelning styr barnen att tillägna sig
      de könsstereotyper och könsnormer som människorna i samhället delar. Det kan i sin tur påverka
      till exempel vilket yrke de börjar studera till i framtiden.
