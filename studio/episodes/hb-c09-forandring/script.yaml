episode_decisions:
- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Paragraph and source-list groups retain their original progression. Source-specific illustrations
    explain the exact relationships without adding contemporary law or statistics.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Fallkulla view 2016 7.jpg by Htm continuously as decorative background, darkened
    42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=6.9538690476190474.
    Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Ebbs and Flows by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 3534.054 seconds; prepared lossless stereo bed 973.542 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: Ofta har man den uppfattningen att en familj är detsamma som en barnfamilj, som består
    av föräldrar och minst ett barn.
- id: scene-2
  description: I det finska språket finns det olika ord för ”familj” och ”släkt”.
- id: scene-3
  description: Att familjerna blivit mindre beror delvis på att man i dag har bättre möjlighet att bestämma
    hur många barn man vill ha.
- id: scene-4
  description: Urbaniseringen har kraftigt bidragit till att kulturen och familjerna har förändrats.
- id: scene-5
  description: När folk flyttade till städerna fick de lönearbete, vanligtvis på en fabrik eller inom
    servicebranschen.
- id: scene-6
  description: Ogifta kvinnor fick rätt att bestämma över sina egna angelägenheter först i slutet av 1800-talet.
- id: scene-7
  description: Äktenskap ingicks länge av förnuftsskäl, och släkten hade inflytande på valet av make.
- id: scene-8
  description: 'Nedan finns en lista över viktiga lagar som gav kvinnor i Finland samma rättigheter som
    män:'
- id: scene-9
  description: '1878: lika arvsrätt som för män'
- id: scene-10
  description: '1906: rätt att rösta och kandidera i riksdagsval'
- id: scene-11
  description: '1919: rätt att utöva en näring utan makens samtycke'
- id: scene-12
  description: '1921: lagen om läroplikt, som garanterade både flickor och pojkar rätt att lära sig'
- id: scene-13
  description: '1922: rätt att själv ingå arbetsavtal utan maken'
- id: scene-14
  description: '1930: äktenskapslagen, som gjorde mannen och kvinnan jämställda i äktenskapet.'
- id: scene-15
  description: Nuförtiden bestämmer både kvinnor och män själva hur de gör för att kombinera arbete och
    familjeliv.
- id: scene-16
  description: I jordbrukssamhället utfördes många arbeten nära den egna gården.
- id: scene-17
  description: I och med industrialiseringen från och med mitten av 1800-talet blev det vanligare att
    kvinnor arbetade i fabriker i städerna.
- id: scene-18
  description: Under krigsåren 1939–1944 var männen vid fronten och kvinnorna utförde också männens arbete
    i fabrikerna och på lantgårdarna.
- id: scene-19
  description: Att kvinnorna förvärvsarbetade påverkade hela familjen, när allt fler mammor arbetade utanför
    hemmet.
- id: scene-20
  description: Under de senaste hundra åren har samhället i Finland förändrats och blivit mer individuellt,
    liberalt och sekulariserat.
- id: scene-21
  description: Nuförtiden är människorna i Finland vana vid att var och en får göra individuella val i
    sitt liv.
- id: scene-22
  description: Också i Finland är alla en del av en familj och en släkt och andra typer av grupper, till
    exempel en arbetsgemenskap, ett lokalsamhälle och i ett bredare perspektiv samhället.
- id: scene-23
  description: 'Individens frihet att göra egna val reflekteras också i de mänskliga relationerna: Alla
    oavsett kön får själva välja sin livskamrat.'
- id: scene-24
  description: Individens rätt till sina egna beslut och de förändrade idéerna om familj och parförhållanden
    har med tiden förändrat familjerna.
- id: scene-25
  description: På 1800-talet föddes kvinnosaksrörelsen i Europa och Förenta staterna.
- id: scene-26
  description: Enligt Finlands lag är föräldrarna förpliktade att ta hand om sina minderåriga barn ekonomiskt
    och gifta par om varandra.
