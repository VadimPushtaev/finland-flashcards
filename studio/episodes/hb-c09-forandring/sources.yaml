    heading: I dag har var och en i Finland rätt att själv bestämma över sina parförhållanden
    source_range:
      start: 0
      end: 391
    range_basis: normalized_html_block
    extracted_passage: Individens rätt till sina egna beslut och de förändrade idéerna om familj
      och parförhållanden har med tiden förändrat familjerna. Det är vanligt att människor har flera
      partner under sitt liv. Dessutom sällskapar människor ofta länge innan de flyttar ihop eller
      gifter sig. Ett fungerande parförhållande och kärlek anses vara viktiga grunder för lycka och
      lycka en viktig grund för familjen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c09-u0026:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 47
    printed_page: 46
    source_range:
      start: 1353
      end: 1707
    range_basis: raw_pdf_page
    extracted_passage: "På 1800-talet föddes kvinnosaksrörelsen i Europa och Förenta staterna. Den\
      \ strävade till att främja \nlikställdhet mellan kvinnor och män. I Finland fastslogs år 1864\
      \ en lag som befriade ogifta kvinnor \nfrån förmyndarskap. De fick alltså börja bestämma om\
      \ sina egna angelägenheter. Men gifta kvinnor \nvar fortfarande underställda sin mans förmyndarskap.\
      \ \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c09-u0027:
    source_path: data/infofinland/content/family/what-is-a-family.html
    sha256: e28112e1d8a2a483c35488d8216427cce905c33d8b10e058bfddf7a19cc13217
    source_block: b0024
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Underhållsskyldighet
    source_range:
      start: 0
      end: 445
    range_basis: normalized_html_block
    extracted_passage: Enligt Finlands lag är föräldrarna förpliktade att ta hand om sina minderåriga
      barn ekonomiskt och gifta par om varandra. Familjemedlemmarnas underhållsskyldighet sträcker
      sig inte till släktingar, till exempel vuxna syskon eller mor- eller farföräldrar. I Finland
      utgår man alltså inte från att enskilda människor tar hand om sådana släktingar som har det
      dåligt ställt ekonomiskt. Stödet kommer från samhället i form av den sociala tryggheten.
    normalization: whitespace_only
    repairs: []
