    heading: I dag har var och en i Finland rätt att själv bestämma över sina parförhållanden
    source_range:
      start: 0
      end: 539
    range_basis: normalized_html_block
    extracted_passage: 'Individens frihet att göra egna val reflekteras också i de mänskliga relationerna:
      Alla oavsett kön får själva välja sin livskamrat. Också de unga bestämmer själva över sina
      kärleksrelationer och behöver inte be sina föräldrar eller andra släktingar om lov. Många finländare
      diskuterar visserligen sina beslut med släktingar, men människor respekterar vanligen familjens
      och individens privatliv. Släktingarna accepterar ändå inte alltid de val som en medlem av
      släkten gör. Det kan förstöra relationerna mellan släktingar också i Finland.'
    normalization: whitespace_only
    repairs: []
