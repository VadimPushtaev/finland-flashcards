    heading: Ett individinriktat samhälle betyder inte att människorna inte skulle bry sig om varandra
    source_range:
      start: 0
      end: 608
    range_basis: normalized_html_block
    extracted_passage: Under de senaste hundra åren har samhället i Finland förändrats och blivit
      mer individuellt, liberalt och sekulariserat. I det jordbruksdominerade samhället var släkten,
      bygemenskapen och religionen kärnan i livet, och livet styrdes av starka moralregler. När människorna
      började arbeta i fabriker och på kontor och flyttade till städerna började fokus ligga mer
      på individen och hens val. När både kvinnor och män allt oftare hade ett lönearbete utanför
      hemmet, tog välfärdsstaten mer ansvar för att ta hand om de sjuka, de äldre och barnen. Människorna
      var inte längre lika beroende av stödet från släkten.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
