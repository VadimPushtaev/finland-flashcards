    range_basis: normalized_html_block
    extracted_passage: Också i Finland är alla en del av en familj och en släkt och andra typer av
      grupper, till exempel en arbetsgemenskap, ett lokalsamhälle och i ett bredare perspektiv samhället.
      Som medlemmar i dessa grupper upplever människorna en känsla av gemenskap och tillhörighet.
