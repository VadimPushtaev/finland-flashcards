    heading: Familjerna har blivit mindre under det senaste århundradet
    source_range:
      start: 0
      end: 417
    range_basis: normalized_html_block
    extracted_passage: Att familjerna blivit mindre beror delvis på att man i dag har bättre möjlighet
      att bestämma hur många barn man vill ha. Graviditetsprevention blev lättillgänglig på 1960-talet,
      och man började tala om familjeplanering. Det betyder att par själva kan påverka antalet barn
      när de använder preventivmedel. En bidragande orsak till att familjeplanering blivit vanligare
      är också att kvinnornas ställning har förbättrats.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
