    heading: Ett individinriktat samhälle betyder inte att människorna inte skulle bry sig om varandra
    source_range:
      start: 0
      end: 546
    range_basis: normalized_html_block
    extracted_passage: Nuförtiden är människorna i Finland vana vid att var och en får göra individuella
      val i sitt liv. Även om människorna inte längre har samma skyldighet att ta hand om sina släktingar,
      ansvarar individerna för andra genom att bidra till att upprätthålla välfärdssamhället. Det
      sker genom att betala skatter och till exempel utföra frivilligarbete. Tankesättet som framhäver
      individens friheter är också förknippat med att alla har samma rättigheter. Därför är det till
      exempel inte accepterat att favorisera släktingar i offentligt beslutsfattande.
    normalization: whitespace_only
    repairs: []
