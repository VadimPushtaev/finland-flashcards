    heading: Övergången från jordbrukssamhälle till städerna har påverkat familjerna
    source_range:
      start: 0
      end: 318
    range_basis: normalized_html_block
    extracted_passage: Urbaniseringen har kraftigt bidragit till att kulturen och familjerna har
      förändrats. Urbaniseringen skedde på 1900-talet i Finland, när många människor flyttade från
      landet till städerna för att söka arbete. År 1920 försörjde sig 70 procent av Finlands befolkning
      på jordbruk, men år 1975 var andelen bara 15 procent.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
