    range_basis: normalized_html_block
    extracted_passage: Under krigsåren 1939–1944 var männen vid fronten och kvinnorna utförde också
      männens arbete i fabrikerna och på lantgårdarna. Många kvinnor fortsatte med arbetet också
      efter kriget. I och med urbaniseringen och industrialiseringen var det redan på 1970-talet
      mycket vanligt att kvinnor förvärvsarbetade. Kommunerna började ordna dagvård för en del barn,
      vilket gjorde det lättare för kvinnor att arbeta.
