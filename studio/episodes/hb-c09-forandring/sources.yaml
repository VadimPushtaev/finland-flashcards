    heading: Övergången från jordbrukssamhälle till städerna har påverkat familjerna
    source_range:
      start: 0
      end: 529
    range_basis: normalized_html_block
    extracted_passage: När folk flyttade till städerna fick de lönearbete, vanligtvis på en fabrik
      eller inom servicebranschen. Tack vare lönearbetet var de inte längre beroende av sina släktingar.
      Tidigare ansvarade familjen och släkten för det ekonomiska och sociala stödet. I och med urbaniseringen
      och välfärdsstatens utveckling övergick ansvaret från släkten till staten. Målet är att alla
      människor med hjälp av lönearbete och de stöd som staten beviljar ska ha möjlighet att klara
      sig, även om de inte skulle få hjälp av släktingar eller vänner.
    normalization: whitespace_only
    repairs: []
