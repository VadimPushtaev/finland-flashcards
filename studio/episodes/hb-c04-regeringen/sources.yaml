    source_range:
      start: 0
      end: 495
    range_basis: normalized_html_block
    extracted_passage: När riksdagen beslutar någonting, verkställer regeringen beslutet. När riksdagen
      till exempel utfärdar en lag om inrättande av en ny nationalpark, börjar de myndigheter som
      ansvarar för nationalparkerna förbereda de praktiska åtgärderna i ärendet. Dessa åtgärder är
      till exempel att ordna med informationstavlor för nationalparkens besökare. Miljöministeriet
      och jord- och skogsbruksministeriet övervakar att myndigheterna ordnar med alla tjänster som
      lagen föreskriver i den nya nationalparken.
    normalization: whitespace_only
    repairs: []
