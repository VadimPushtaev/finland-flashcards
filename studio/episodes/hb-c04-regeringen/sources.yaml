    source_range:
      start: 0
      end: 310
    range_basis: normalized_html_block
    extracted_passage: De riksdagspartier som inte ingår i regeringen bildar opposition. Oppositionen
      har som uppgift att utmana regeringen och lägga fram alternativ till den politik som regeringen
      driver. Om oppositionen anser att riksdagen inte kan lita på regeringens arbete, kan den kräva
      en omröstning om regeringens förtroende.
