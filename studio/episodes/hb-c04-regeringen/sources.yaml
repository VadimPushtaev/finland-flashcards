    heading: Regeringen behöver riksdagens förtroende
    source_range:
      start: 0
      end: 504
    range_basis: normalized_html_block
    extracted_passage: Regeringen ansvarar för sitt arbete inför riksdagen, det vill säga regeringen
      och ministrarna måste ha riksdagens förtroende. Riksdagen måste alltså vara övertygad om att
      regeringen och alla ministrarna utför sitt arbete väl och på ett tillförlitligt sätt. Om riksdagen
      inte är övertygad om det, kan hela regeringen falla. Om regeringen faller, måste det kanske
      hållas ett nytt riksdagsval i förtid i landet. Det är ändå mycket sällsynt. I Finland har regeringarna
      varit långvariga de senaste årtiondena.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
