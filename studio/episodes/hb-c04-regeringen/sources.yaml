    heading: Regeringen består av en statsminister och andra ministrar
    source_range:
      start: 0
      end: 338
    range_basis: normalized_html_block
    extracted_passage: Statsministern och de övriga ministrarna bildar Finlands statsråd. I vardagsspråk
      används ofta ordet regering för statsrådet. Ministrarnas antal varierar, men under de senaste
      årtiondena har Finlands regering bestått av 15–20 ministrar. Exempel på ministrar är inrikesminister,
      utrikesminister, undervisningsminister och justitieminister.
    normalization: whitespace_only
