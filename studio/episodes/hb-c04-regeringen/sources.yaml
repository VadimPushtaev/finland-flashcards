    range_basis: normalized_html_block
    extracted_passage: I allmänhet blir den partiordförande som hade mest framgång i valet statsminister.
      Hen diskuterar med de övriga partierna och väljer vilka partier som ska börja bilda regering.
      I Finland är det vanligt att det finns flera partier i regeringen. Efter det utarbetar dessa
      partier tillsammans ett regeringsprogram. Det berättar om regeringens politiska mål och åtgärder
      under regeringens mandatperiod.
    normalization: whitespace_only
