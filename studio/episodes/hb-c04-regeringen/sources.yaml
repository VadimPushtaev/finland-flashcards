    range_basis: normalized_html_block
    extracted_passage: När regeringsprogrammet är färdigt utser riksdagen officiellt en statsminister
      genom omröstning. Regeringspartierna beslutar om vem från respektive parti som ska bli minister.
      När statsministern och övriga ministrar har utsetts utnämner presidenten dem för deras uppgifter.
      Riksdagen godkänner ännu genom omröstning statsrådets sammansättning och regeringsprogrammet.
    normalization: whitespace_only
    repairs: []
