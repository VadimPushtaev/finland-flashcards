    range_basis: normalized_html_block
    extracted_passage: I Finland är regeringarna i allmänhet majoritetsregeringar. Det betyder att
      majoriteten av riksdagsledamöterna hör till regeringspartierna. På så vis får regeringen vid
      en omröstning nästan alltid riksdagens förtroende och får igenom sina förslag i omröstningar.
