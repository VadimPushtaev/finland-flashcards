episode_decisions:
- id: opening
  decision: Exact bilingual heading, unspoken, for three seconds. Continuous photo motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Group consecutive source sentences into the scenes below. Read every body sentence once in
    its exact original order, without added narration.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920×1080 at 24 fps. Muted burgundy chapter palette {''background'': ''#39252b'', ''text'':
    ''#faf3e8'', ''secondary'': ''#e2c8cf'', ''highlight'': ''#dfbd82'', ''separator'': ''#70515a''}.
    Liberation Sans Bold 48 / Regular 40, stable right bilingual panel and relevant foreground pictures
    at left.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display text 0.25 seconds before speech. Moderate local voice speed0.95; allow 1.5 seconds
    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Helsingin synagoga 2022-09-18 03.jpg by Leonhard Lenz continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=0.9869047619047621. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Suonatore di Liuto by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 144.483 seconds; prepared lossless stereo bed 138.167
    seconds. Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Use topic-specific factual diagrams and verified relevant photographs across at least half
    of body display time. Diagrams explain relationships with pictorial objects and arrows; typography
    alone does not count. No inference about photographed people’s health, beliefs or experiences.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two unspoken 15-second source/media credit cards, with full image licenses and adaptation
    details in accompanying credits.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
