    people, arrows and source labels; no additional legal or medical claims.
  fallback: Use accurately identified relevant photographs; document any unresolved picture shortfall
    without filler.
- id: music_bed
  kind: music
  description: Distinct calm licensed instrumental track selected during assets, with documented crossfade
    extension if needed.
  fallback: Choose a distinct calm licensed instrumental track and document replacement; never omit music.
- id: narration
  kind: narration
  description: One complete local Supertonic3 F1 Swedish clip per exact source sentence, with separate
    speech-only number expansions where needed.
  fallback: Revise pronunciation expansion preserving source meaning; do not use cloud TTS.
