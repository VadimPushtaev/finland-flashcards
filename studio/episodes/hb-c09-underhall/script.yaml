scenes:
- id: scene-1
  description: Barnets underhåll (elatus) innebär att föräldern tillgodoser de behov som ett barn under
    18 år har samt ser till att barnet får den vård och utbildning som det behöver.
- id: scene-2
  description: Om barnet har två föräldrar, bär båda föräldrarna ansvaret för barnets underhåll, även
    om de inte bor tillsammans.
- id: scene-3
  description: Underhållsbidragets belopp beräknas utifrån barnets underhållsbehov och föräldrarnas underhållsförmåga.
- id: scene-4
  description: Ibland betalar den andra föräldern underhållsbidrag, även om barnet bor lika mycket eller
    nästa lika mycket med båda sina föräldrar.
- id: scene-5
  description: I vissa situationer kan den förälder som bor med barnet ansöka om underhållsstöd från FPA.
- id: scene-6
  description: 'Du kan ansöka om underhållsstöd från FPA i följande situationer:'
- id: scene-7
  description: Du har rätt att få underhållsbidrag från den andra föräldern, men hen har inte betalat
    det.
- id: scene-8
  description: Inget underhållsbidrag har fastställts, eftersom den andra föräldern har små inkomster.
- id: scene-9
  description: Underhållsbidraget har inte kunnat bekräftas samtidigt som föräldraskapet bekräftades.
- id: scene-10
  description: Det fastställda underhållsbidraget är mindre än underhållsstödet, eftersom den andra föräldern
    har små inkomster.
- id: scene-11
  description: Du har adopterat ett barn ensam.
- id: scene-12
  description: Barnet har fötts utom äktenskapet, fadern har inte fastställts och barnet har inte två
    underhållsskyldiga föräldrar.
- id: scene-13
  description: Du kan få underhållsstöd om ditt barn är stadigvarande bosatt i Finland eller vistas tillfälligt
    utomlands i högst sex månader.
