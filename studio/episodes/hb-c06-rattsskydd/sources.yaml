    heading: Rätt att söka rättelse i felaktiga beslut
    source_range:
      start: 0
      end: 499
    range_basis: normalized_html_block
    extracted_passage: Man kan i allmänhet kräva rättelse av eller överklaga ett felaktigt beslut.
      I anslutning till beslutet måste myndigheten ge kunden skriftliga anvisningar för hur hen kan
      söka rättelse eller göra en överklagan. Kunden måste göra ett skriftligt krav på rättelse eller
      en skriftlig överklagan inom en viss tid efter att hen fått beslutet. Myndigheten måste granska
      beslutet och orsakerna till det på nytt. Om myndigheten konstaterar att beslutet var felaktigt
      korrigeras det och ett nytt beslut fattas.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
