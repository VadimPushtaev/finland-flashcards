    heading: Justitieombudsmannen och justitiekanslern övervakar myndigheternas verksamhet
    source_range:
      start: 0
      end: 370
    range_basis: normalized_html_block
    extracted_passage: Justitieombudsmannen och justitiekanslern övervakar att regeringen, ministerierna,
      presidenten, domstolarna, åklagarna, myndigheterna och övriga tjänstemän agerar i enlighet
      med lagen och fullgör sina skyldigheter. Justitieombudsmannen säkerställer att de grundläggande
      och mänskliga rättigheterna uppfylls i rätten och att rätten följer principerna för god förvaltning.
    normalization: whitespace_only
