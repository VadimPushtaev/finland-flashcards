    heading: Justitieombudsmannen och justitiekanslern övervakar myndigheternas verksamhet
    source_range:
      start: 0
      end: 242
    range_basis: normalized_html_block
    extracted_passage: Också myndigheterna måste följa lagen. Om man misstänker att en myndighet
      inte agerar enligt lagen, kan man ingripa i dess verksamhet. Människorna kan anföra klagomål
      om myndigheters verksamhet hos justitieombudsmannen eller justitiekanslern.
    normalization: whitespace_only
