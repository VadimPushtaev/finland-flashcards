    range_basis: normalized_html_block
    extracted_passage: I lagen föreskrivs om vilka rättigheter och skyldigheter en person som uträttar
      ärenden hos en myndighet har. Kunden har till exempel rätt att få information om myndighetens
      beslut skriftligt. I beslutsbrevet motiverar myndigheten varför beslutet ser ut som det gör
      och vilka faktorer myndigheten har beaktat när den fattade beslutet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
