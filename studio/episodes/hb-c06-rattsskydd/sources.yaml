    heading: Rätt att få en uppskattning av handläggningstiden
    source_range:
      start: 0
      end: 455
    range_basis: normalized_html_block
    extracted_passage: Kunden har rätt att få en uppskattning av hur länge det kommer att ta att
      behandla hens ärende. Myndigheten ska också svara på frågor om hur behandlingen framskrider.
      Det är ändå bra att komma ihåg att handläggningstiden är en uppskattning, och ibland kan det
      ta längre eller kortare tid att behandla ett ärende. På behandlingens längd inverkar hur komplicerat
      ärendet är eller huruvida myndigheten är tvungen att begära ytterligare utredningar av kunden.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
