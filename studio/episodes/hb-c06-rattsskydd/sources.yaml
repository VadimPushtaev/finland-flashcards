    extracted_passage: Man kan också anföra klagomål över en myndighets verksamhet. Man kan anföra
      klagomål om man upplever att myndigheten har handlat i strid mot lagen. Det är inte möjligt
      att söka ändring i ett myndighetsbeslut genom klagomål.
