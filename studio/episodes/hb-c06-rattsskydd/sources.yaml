    range_basis: normalized_html_block
    extracted_passage: Vem som helst kan klaga hos justitieombudsmannen eller justitiekanslern om
      en myndighet har förfarit felaktigt. Man kan anföra klagomål om myndigheter, tjänstemän och
      personer som har ett offentligt uppdrag. Ett klagomål görs alltid skriftligt. Det kan vara
      fritt formulerat eller lämnas in med en blankett. Blanketter finns på justitieombudsmannens
      och justitiekanslerns byrå eller på internet. Justitieombudsmannen eller justitiekanslern utreder
      klagomålet.
    normalization: whitespace_only
