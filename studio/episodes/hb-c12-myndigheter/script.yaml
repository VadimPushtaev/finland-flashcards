episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Exact source paragraphs/list items define consecutive topic scenes. Sentence-specific objects
    and source relationships are planned individually; no added spoken transitions or current-law updates.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter12 violet palette {''background'': ''#352e49'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d7cce7'', ''highlight'': ''#e2c58b'', ''separator'': ''#685881''}. Liberation Sans
    Bold48/Regular40 with a fixed right bilingual panel and relevant left foreground pictures.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Kuopion kasarmialue - Kuopion kaupungin valtuusto-virastotalo (Ark.tsto Juhani Katainen,
    1989) - Suokatu 42 - Hatsala - Kuopio.jpg by Paju~commonswiki continuously as decorative background,
    darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative
    zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets. Total
    cycles=4.554166666666667. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPyseed42 per invocation,44100HzmonoPCM16;
    initial2ONNXthreads shared with Chapter8 allocation. Exact synthesis inputs and actual seed scope
    are retained; whole-video listening remains pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Consort for Brass by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 50.599 seconds; prepared lossless stereo bed 637.583
    seconds. Repeat count 13, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Distinct relevant picture for nearly every body sentence slide: actual places/objects where
    identity and license are verified, plus original pictorial diagrams for source-stated eligibility,
    administrative steps and personal-data protections. Avoid real personal identifiers and invented legal
    rules.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0055
  description: Myndigheter är offentliga ämbetsverk och inrättningar samt andra aktörer där tjänstemän
    eller tjänsteinnehavare arbetar.
- id: hb-c12-u0056
  description: Migrationsverket, Migri, fattar beslut i ärenden som gäller invandring, asyl, flyktingskap
    och medborgarskap och administrerar Finlands mottagningssystem.
- id: hb-c12-u0057
  description: Myndigheten för digitalisering och befolkningsdata, MDB, ansvarar i egenskap av personuppgiftsansvarig
    för Finlands befolkningsdatasystem.
- id: hb-c12-u0058
  description: Det är lättare att sköta ärenden i Finland när personuppgifterna och familjeförhållandena
    har lagrats i befolkningsdatasystemet.
- id: hb-c12-u0059
  description: MDB är närvarande vid många livshändelser i Finland.
- id: hb-c12-u0060
  description: Skatteförvaltningen ansvarar för att samla in de flesta skatter i Finland.
- id: hb-c12-u0061
  description: Folkpensionsanstalten, FPA, ansvarar till stor del för den sociala tryggheten för alla
    som bor eller arbetar i Finland genom att till exempel betala olika ekonomiska bidrag.
- id: hb-c12-u0062
  description: Rätten till bidrag från FPA baserar sig i allmänhet på antingen boende eller arbete i Finland.
- id: hb-c12-u0063
  description: Sysselsättningstjänster är tjänster som hjälper människor att få arbete.
- id: hb-c12-u0064
  description: Kommunen ansvarar för många av människornas dagliga tjänster.
- id: hb-c12-u0065
  description: Välfärdsområdena ansvarar för social- och hälsovårdstjänsterna.
- id: hb-c12-u0066
  description: Hälsovårdstjänsterna omfattar bland annat primärvården som hälsovårdscentralerna tillhandahåller,
    sjukhustjänster, munhälsovårdstjänster, mentalvårdstjänster, mödra- och barnrådgivningar och skolhälsovård
    för skolelever.
- id: hb-c12-u0067
  description: Polisen sörjer för den dagliga säkerheten i samhället, övervakar ordningen och efterlevnaden
    av trafikreglerna och utreder brott.
- id: hb-c12-u0068
  description: Patent- och registerstyrelsen, PRS, för register över bland annat företag, föreningar och
    stiftelser som är verksamma i Finland.
- id: hb-c12-u0069
  description: En viktig uppgift för Utbildningsstyrelsen är att göra upp grunderna för läroplanen för
    olika skolstadier i Finland.
