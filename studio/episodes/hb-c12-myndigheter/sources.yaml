    range_basis: normalized_html_block
    extracted_passage: En viktig uppgift för Utbildningsstyrelsen är att göra upp grunderna för läroplanen
      för olika skolstadier i Finland. En person som flyttat till Finland ska kontakta Utbildningsstyrelsen
      om hen ansöker om erkännande av en utländsk examen i Finland. Utbildningsstyrelsen ansvarar
      också för allmänna språkexamina, det vill säga YKI-test. Om en person ansöker om finskt medborgarskap
      kan hen visa sina språkkunskaper i finska eller svenska bland annat med ett YKI-test. Testet
      är avgiftsbelagt. Därtill upprätthåller Utbildningsstyrelsen ett register över auktoriserade
      översättare.
