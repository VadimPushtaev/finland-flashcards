    range_basis: normalized_html_block
    extracted_passage: Kommunen ansvarar för många av människornas dagliga tjänster. Nyanlända får
      tillgång till tjänster som stöder integrationen av kommunen. Kommunen ansvarar för barnens
      småbarnspedagogik, förskoleundervisning och grundskoleundervisning, likaså anordnas en stor
      del av gymnasieundervisningen och yrkesundervisningen av kommunerna. Också till exempel bibliotek,
      ungdomslokaler och boendetjänster är tjänster som kommunen ansvarar för.
