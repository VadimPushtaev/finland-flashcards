    range_basis: normalized_html_block
    extracted_passage: Folkpensionsanstalten, FPA, ansvarar till stor del för den sociala tryggheten
      för alla som bor eller arbetar i Finland genom att till exempel betala olika ekonomiska bidrag.
      Syftet med den sociala tryggheten är att trygga människors utkomst när de inte själva kan göra
      det. Orsaker till det kan vara ålderdom, sjukdom, arbetslöshet, barnafödsel eller studier.
