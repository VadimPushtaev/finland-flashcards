    range_basis: normalized_html_block
    extracted_passage: Myndigheten för digitalisering och befolkningsdata, MDB, ansvarar i egenskap
      av personuppgiftsansvarig för Finlands befolkningsdatasystem. Befolkningsdatasystemet är ett
      allmänt nationellt basregister där personuppgifter, hemkommun, adress och ofta också uppgifter
      om de närmaste familjeförhållandena lagras för alla finska medborgare och alla som bor i Finland.
      När en persons uppgifter sparas i befolkningsdatasystemet för första gången får hen en finsk
      personbeteckning.
