    range_basis: normalized_html_block
    extracted_passage: Välfärdsområdena ansvarar för social- och hälsovårdstjänsterna. Socialtjänsterna
      omfattar bland annat socialarbete och -handledning samt tjänster för familjer, till exempel
      hemservice för barnfamiljer samt fostrans- och familjerådgivning. De omfattar också tjänster
