- sentence_id: hb-c10-u0177-s003
  sv: Funktionshinderservicen stöder en jämlik delaktighet i samhället och underlättar vardagslivet med
    en funktionsnedsättning.
  ru: Услуги для людей с инвалидностью поддерживают их равноправное участие в жизни общества и облегчают
    повседневную жизнь с инвалидностью.
  scene_id: scene-3
  visual_cue: Actual accessible public environment illustrating participation,dignified context,no pictured
    person diagnosed or individual accessibility guarantee.
  asset_ids:
