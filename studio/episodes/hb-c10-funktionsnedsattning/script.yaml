  sv: Man kan få personlig hjälp med dagliga aktiviteter som man inte klarar av på egen hand på grund
    av en funktionsnedsättning eller en sjukdom.
  ru: Можно получить персональную помощь в повседневных делах, с которыми человек не справляется самостоятельно
    из-за инвалидности или болезни.
  scene_id: scene-6
