- sentence_id: hb-c10-u0178-s001
  sv: En del av tjänsterna för personer med funktionsnedsättning är tillgängliga också för långtidssjuka
    som har svårt att klara av dagliga aktiviteter eller problem med arbetsförmågan på grund av sjukdomen.
  ru: Часть услуг для людей с инвалидностью доступна также людям с длительными заболеваниями, которым
    из-за болезни трудно справляться с повседневными делами или у которых возникают проблемы с трудоспособностью.
  scene_id: scene-4
  visual_cue: SOME services also for chronic illness IF daily-activity difficulty OR work-capacity problems
    DUE TO illness; preserve both limitations.
  asset_ids:
