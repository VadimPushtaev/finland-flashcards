sentences:
- sentence_id: hb-c10-u0175-s001
  sv: De inledande utmaningarna i Finland för en invandrare med funktionsnedsättning hänger ofta samman
    med att hen inte vet hurdana tjänster som finns tillgängliga, var hen ska ansöka om dem och hur de
    ska användas.
  ru: Первые трудности иммигранта с инвалидностью в Финляндии часто связаны с тем, что он не знает, какие
    услуги доступны, куда обращаться за ними и как ими пользоваться.
  scene_id: scene-1
  visual_cue: 'New-arrival information challenge: WHICH services,WHERE apply,HOW use; source OFTEN,no
    real person assigned disability/immigration status.'
  asset_ids:
  - episode_background
  - picture-001
  text_highlights: []
  pronunciation_notes:
  - Swedish compounds, Finnish service names,abbreviations and numbers require whole-video listening;
    ASR is diagnostic only.
  speech_override: null
