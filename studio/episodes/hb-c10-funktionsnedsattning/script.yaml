- sentence_id: hb-c10-u0178-s002
  sv: Långvariga sjukdomar som kan försämra en persons funktionsförmåga i vardagen eller arbetslivet är
    till exempel diabetes, epilepsi, astma, reumatism och artros.
  ru: К длительным заболеваниям, которые могут снижать функциональные способности человека в повседневной
    жизни или на работе, относятся, например, диабет, эпилепсия, астма, ревматизм и артроз.
  scene_id: scene-4
  visual_cue: Five exact source examples diabetes,epilepsy,asthma,rheumatism,osteoarthritis MAY reduce
    function; no diagnosis,anatomy,treatment or universal incapacity.
  asset_ids:
