- sentence_id: hb-c10-u0177-s002
  sv: Välfärdsområdena är också skyldiga att erbjuda personer med funktionsnedsättning särskilda tjänster
    för personer med funktionsnedsättning.
  ru: Регионы по обеспечению благополучия населения также обязаны предлагать людям с инвалидностью специально
    предназначенные для них услуги.
  scene_id: scene-3
  visual_cue: Welfare-region obligation to offer disability-specific services,not a guarantee each applicant
    receives every named service.
  asset_ids:
