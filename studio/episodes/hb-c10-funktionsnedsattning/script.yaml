- sentence_id: hb-c10-u0177-s001
  sv: Största delen av välfärdsområdenas social- och hälsovårdstjänster är riktade till alla invånare
    i välfärdsområdet.
  ru: Большинство социальных и медицинских услуг регионов по обеспечению благополучия населения предназначено
    для всех жителей соответствующего региона.
  scene_id: scene-3
  visual_cue: Verified Finnish public social/health institution,source MOST services for ALL region residents;
    not a particular eligibility decision or all-services guarantee.
  asset_ids:
  - episode_background
  - picture-006
  text_highlights: []
  pronunciation_notes:
