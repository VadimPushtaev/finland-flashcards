- sentence_id: hb-c10-u0176-s003
  sv: Nyanlända med funktionsnedsättning har lika rättigheter till integration och anknytande åtgärder,
    till exempel språkundervisning, utbildning och sysselsättning.
  ru: Недавно приехавшие люди с инвалидностью имеют равные права на интеграцию и связанные с ней меры,
    например обучение языку, образование и трудоустройство.
  scene_id: scene-2
  visual_cue: Equal integration rights plus source EXAMPLES language teaching,education,employment; distinct
    three branches,no automatic job guarantee.
  asset_ids:
  - episode_background
  - picture-005
  text_highlights: []
  pronunciation_notes:
