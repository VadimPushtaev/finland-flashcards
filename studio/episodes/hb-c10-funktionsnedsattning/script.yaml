- sentence_id: hb-c10-u0176-s002
  sv: I planen skriver man in nödvändiga stödåtgärder och tjänster.
  ru: В план включают необходимые меры поддержки и услуги.
  scene_id: scene-2
  visual_cue: Neutral actual blank planning notebook/document object,not fabricated completed official
    client plan or real personal record.
  asset_ids:
  - episode_background
