  sv: Om du har en svår funktionsnedsättning eller sjukdom och du är under 65 år kan FPA ordna dig krävande
    medicinsk rehabilitering och ersätta en del av kostnaderna för rehabiliteringen.
  ru: Если у вас тяжёлая форма инвалидности или тяжёлое заболевание и вам меньше 65 лет, FPA может организовать
    для вас интенсивную медицинскую реабилитацию (krävande medicinsk rehabilitering) и возместить часть
    расходов на неё.
