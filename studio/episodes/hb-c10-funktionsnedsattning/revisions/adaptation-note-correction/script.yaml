- sentence_id: hb-c10-u0176-s001
  sv: En person med funktionsnedsättning som precis flyttat till Finland kan hos välfärdsområdets socialvård
    göra upp en klientplan för funktionshinderservice.
  ru: Человек с инвалидностью, только что переехавший в Финляндию, может составить в социальной службе
    своего региона по обеспечению благополучия населения индивидуальный план предоставления услуг для
    людей с инвалидностью.
  scene_id: scene-2
  visual_cue: Newly arrived person with disability MAY prepare client plan WITH welfare-region social
    care; anonymous persons/document,no actual protected status claim.
