sentences:
- sentence_id: hb-c10-u0175-s001
  sv: De inledande utmaningarna i Finland för en invandrare med funktionsnedsättning hänger ofta samman
    med att hen inte vet hurdana tjänster som finns tillgängliga, var hen ska ansöka om dem och hur de
    ska användas.
  ru: Первые трудности иммигранта с инвалидностью в Финляндии часто связаны с тем, что он не знает, какие
    услуги доступны, куда обращаться за ними и как ими пользоваться.
  scene_id: scene-1
  visual_cue: 'New-arrival information challenge: WHICH services,WHERE apply,HOW use; source OFTEN,no
    real person assigned disability/immigration status.'
  asset_ids:
  - episode_background
  - picture-001
  text_highlights: []
  pronunciation_notes:
  - Swedish compounds, Finnish service names,abbreviations and numbers require whole-video listening;
    ASR is diagnostic only.
  speech_override: null
  pause_after_seconds: 2.5
  audio_path: null
  start_seconds: null
  end_seconds: null
  display_segments: []
  render_caption: false
- sentence_id: hb-c10-u0175-s002
  sv: Om personen har ett uppehållstillstånd och en hemkommun i Finland, har hen rätt till olika tjänster
    som välfärdsområdet och kommunen tillhandahåller, till exempel tjänster för personer med funktionsnedsättning,
    det vill säga funktionshinderservice.
  ru: Если у человека есть вид на жительство и муниципалитет проживания в Финляндии, он имеет право на
    различные услуги региона по обеспечению благополучия населения (välfärdsområde) и муниципалитета,
    например услуги для людей с инвалидностью (funktionshinderservice).
  scene_id: scene-1
  visual_cue: Residence permit AND Finnish municipality of residence -> source right to services,including
    examples disability services; no unconditional permit-only eligibility.
  asset_ids:
  - episode_background
  - picture-002
  text_highlights: []
  pronunciation_notes:
  - Swedish compounds, Finnish service names,abbreviations and numbers require whole-video listening;
    ASR is diagnostic only.
