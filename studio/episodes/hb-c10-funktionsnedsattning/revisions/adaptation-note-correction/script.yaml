episode_decisions:
- id: fidelity
  decision: All67exact archived Swedish/current reviewed Russian pairs once,in stored order. Preserve
    AND/OR,may,examples,eligibility gates and fee distinctions. No diagnosis assigned to real photographed
    people; no invented aid specification,care amount,therapy outcome or current policy update.
  status: proposed
  resolve_during: script
- id: visuals
  decision: Aim for >=90%distinct pictures and100%body picture coverage. Actual licensed assistive devices,accessible
    transport,housing,cultural/work/everyday objects where concrete; source-specific useful relational
    diagrams for eligibility,assessment and fee distinctions.
  status: proposed
  resolve_during: script
- id: voice
  decision: LocalSwedishSupertonic3F1,32steps,speed.95,NumPyseed42,44100HzmonoPCM16; pronunciation remains
    whole-video listening priority.
  status: proposed
  resolve_during: script
- id: pace
  decision: 3secondtitle,.25secondtextlead,measured fullspeech,1.5secondpause and2.2attopicends;2.5forlongpairs.
    Do not accelerate to targetlength.
  status: proposed
  resolve_during: script
- id: background
  decision: A distinct licensed topic-related photograph with42%darken,2.5pxblur,15%relativezoom and continuous140secondglobalcyclicpan;
    exact source pending asset resolution, Chapter10oceanpalette.
  status: proposed
  resolve_during: assets
- id: music
  decision: Distinct centrally reserved calm instrumental track with+2dBbedadjustment,duckingandfades;
    exact selected source pending asset resolution.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Actual source attribution derived from sources.yaml,15secondreadablecreditcards and fullmatching
    sidecar.
  status: proposed
  resolve_during: script
