scenes:
- id: hb-c11-u0162
  description: En persons ekonomi är i balans när utgifterna inte överstiger inkomsterna.
- id: hb-c11-u0163
  description: Ett bra sätt att balansera inkomster och utgifter är med hjälp av budgetering.
- id: hb-c11-u0164
  description: Det är viktigt att se över sin konsumtion alltid när inkomsterna eller utgifterna förändras.
- id: hb-c11-u0165
  description: När man fattar beslut är det viktigt att komma ihåg att lånade pengar inte är gratis.
- id: hb-c11-u0166
  description: När man funderar på att ta ett lån ska man fundera över åtminstone hur stora återbetalningsbeloppen
    är och om man klarar av att betala dem under hela återbetalningstiden.
- id: hb-c11-u0167
  description: Om man lånar pengar till exempelvis en kompis eller en släkting är det bra att skriftligt
    komma överens om återbetalningen av lånet och de övriga villkoren för det.
- id: hb-c11-u0168
  description: Det är vanligt att ta lån i Finland när det är väl övervägt och välgrundat.
- id: hb-c11-u0169
  description: Att ta ett nytt lån för att betala gamla lån är på lång sikt ingen hållbar lösning.
- id: hb-c11-u0170
  description: Ibland kan det hända att förfallodagen för en faktura närmar sig, men det finns inte tillräckligt
    med pengar på kontot för att betala den.
- id: hb-c11-u0171
  description: Om man har lite pengar är det bra att börja med att betala de fakturor som är viktigast.
- id: hb-c11-u0172
  description: När det gäller att hantera sin ekonomi är det bra att vara aktiv och be om hjälp genast
    när man behöver det.
