    heading: När man tar lån ska man noggrant fundera över dess kostnader
    source_range:
      start: 0
      end: 515
    range_basis: normalized_html_block
    extracted_passage: När man fattar beslut är det viktigt att komma ihåg att lånade pengar inte
      är gratis. När man tar lån lovar man att sköta om de kommande betalningarna och ofta också
      om att betala ränta. Räntan är priset för de lånade pengarna. Ibland kan det vara motiverat
      att ta lån för en större anskaffning eller köpa en produkt på avbetalning. Det ska ändå alltid
      vara ett väl övervägt beslut. Innan man tar ett lån ska man alltid noggrant ta reda på villkoren
      för lånet och fundera över om man säkert kan betala tillbaka det.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
