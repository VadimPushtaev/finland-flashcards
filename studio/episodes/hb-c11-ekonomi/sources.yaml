    heading: När man tar lån ska man noggrant fundera över dess kostnader
    source_range:
      start: 0
      end: 504
    range_basis: normalized_html_block
    extracted_passage: När man funderar på att ta ett lån ska man fundera över åtminstone hur stora
      återbetalningsbeloppen är och om man klarar av att betala dem under hela återbetalningstiden.
      Anskaffningar på kredit påverkar alltid den framtida konsumtionen. Dessutom är det bra att
      kontrollera vad räntan på lånet är. Om räntan är hög kan lånet i verkligheten bli mycket dyrt.
      Man ska också fundera på hur lång lånetid man väljer. En lång lånetid betyder mindre delbetalningar,
      men på grund av räntan blir totalpriset högre.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
