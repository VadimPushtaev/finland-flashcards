    heading: Vad ska man göra om man inte kan betala en faktura?
    source_range:
      start: 0
      end: 396
    range_basis: normalized_html_block
    extracted_passage: Ibland kan det hända att förfallodagen för en faktura närmar sig, men det
      finns inte tillräckligt med pengar på kontot för att betala den. Då är det bra att genast kontakta
      den som skickat fakturan, till exempel elbolaget. När man förklarar situationen för bolaget
      är det vanligtvis möjligt att få extra tid på sig att betala. Det kan också vara möjligt att
      avtala om att betala fakturan i delar.
    normalization: whitespace_only
