    heading: Det är möjligt att få hjälp vid skuldproblem
    source_range:
      start: 0
      end: 432
    range_basis: normalized_html_block
    extracted_passage: Att ta ett nytt lån för att betala gamla lån är på lång sikt ingen hållbar
      lösning. Om skulderna består av flera konsumtionskrediter med hög ränta kan det ändå vara bra
      att ta reda på om det är möjligt att få ett banklån med rimlig ränta eller en social kredit
      för att betala skulderna. Man ansöker om social kredit hos det egna välfärdsområdet. Garantistiftelsen
      i sin tur kan i vissa fall gå i borgen för banklån med rimlig ränta.
    normalization: whitespace_only
    repairs: []
