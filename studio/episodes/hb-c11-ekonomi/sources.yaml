    range_basis: normalized_html_block
    extracted_passage: Det är viktigt att se över sin konsumtion alltid när inkomsterna eller utgifterna
      förändras. Till exempel en låginkomsttagare kan bli befriad från barnens avgifter för småbarnspedagogik,
      men när inkomsterna ökar höjs också avgifterna. Då är man tvungen att se över sin budget.
    normalization: whitespace_only
