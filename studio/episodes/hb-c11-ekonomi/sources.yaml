    source_range:
      start: 0
      end: 349
    range_basis: normalized_html_block
    extracted_passage: Det är vanligt att ta lån i Finland när det är väl övervägt och välgrundat.
      Till exempel bostäderna i Finland är så dyra att endast få kan köpa en bostad utan bostadslån.
      Likaså tar människor ofta lån för att till exempel köpa en bil. Ett lån är inte ett problem
      om man kan betala tillbaka det och återbetalningen inte påfrestar ekonomin för mycket.
    normalization: whitespace_only
    repairs: []
