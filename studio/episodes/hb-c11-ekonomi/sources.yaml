    heading: Budgetering som hjälp för att balansera inkomster och utgifter
    source_range:
      start: 0
      end: 372
    range_basis: normalized_html_block
    extracted_passage: En persons ekonomi är i balans när utgifterna inte överstiger inkomsterna.
      Det skulle vara bra att ha som mål att också kunna sätta undan pengar efter att alla utgifter
      är betalda. Besparingarna fungerar som en buffert om inkomsterna tillfälligt blir lägre än
      vanligt. Dessutom gör besparingarna det möjligt att man i framtiden kan betala en större anskaffning
      på en gång.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
