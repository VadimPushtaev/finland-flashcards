    range_basis: normalized_html_block
    extracted_passage: Ofta ska du betala en vattenavgift för bostaden. Betala vattenavgiften till
      hyresvärdens eller husbolagets konto på samma gång som du betalar hyra. Beloppet på vattenavgiften
      beror ofta på det antal personer som bor i bostaden. Om det finns en vattenmätare i bostaden,
      fastställs vattenavgiften enligt vattenkonsumtionen.
    normalization: whitespace_only
