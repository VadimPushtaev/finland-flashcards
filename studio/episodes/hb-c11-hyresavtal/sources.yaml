    range_basis: normalized_html_block
    extracted_passage: Uppsägningstid betyder den tidsperiod som hyresgästen ännu får bo i bostaden
      efter att hyresavtalet har sagts upp. Hyresgästen måste betala hyra för uppsägningstiden. Meddelandet
      om uppsägning ska alltid göras skriftligt, till exempel per e-post. Vid en eventuell tvist
      måste man kunna bevisa att meddelandet har levererats. Därför är det bra att begära ett kvitto
      på e-postmeddelandet som bekräftar att det har blivit läst.
