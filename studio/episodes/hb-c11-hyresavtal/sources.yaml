    heading: Hyresgarantin betalas tillbaka om man tar bra hand om bostaden och betalar sin hyra
    source_range:
      start: 0
      end: 391
    range_basis: normalized_html_block
    extracted_passage: I allmänhet måste man betala en hyresgaranti för bostaden innan man flyttar
      in. Hyresgaranti betyder att den som hyr bostaden betalar extra pengar i förväg till hyresvärden.
      För bostäder som ägs av privata hyresvärdar motsvarar garantin i allmänhet ett par månaders
      hyra. Hyresgarantin får inte vara större än tre månaders hyra. Företag som äger många bostäder
      kräver ofta en mindre garanti.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
