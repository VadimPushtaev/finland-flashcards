    range_basis: normalized_html_block
    extracted_passage: Ett hyresavtal som gäller tills vidare fortsätter tills den boende eller hyresvärden
      säger upp det. Om den boende säger upp avtalet är uppsägningstiden en månad. Om bostadens ägare
      säger upp avtalet är uppsägningstiden 3–6 månader. Ofta anges det i tillsvidareavtal att avtalet
      kan sägas upp tidigast efter en viss tid, till exempel tolv månader.
