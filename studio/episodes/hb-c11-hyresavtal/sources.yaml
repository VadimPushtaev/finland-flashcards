    heading: Hyresboende i Finland
    source_range:
      start: 0
      end: 354
    range_basis: normalized_html_block
    extracted_passage: I Finland bor många människor i hyresbostäder. Det som är bra med en hyresbostad
      är att det är lätt att byta bostad, eftersom du inte behöver sälja och köpa bostaden. Men å
      andra sidan kan hyresvärden bestämma sig för att säga upp hyresavtalet, om han eller hon har
      en godtagbar anledning. Då måste du flytta från hyresbostaden, även om du inte vill det.
