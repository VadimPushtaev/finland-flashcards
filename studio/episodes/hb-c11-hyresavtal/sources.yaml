    range_basis: normalized_html_block
    extracted_passage: Garantin betalas tillbaka när man flyttar ut, om bostaden är i bra skick och
      den boende har betalat hyrorna i tid. Om den boende inte betalar sin hyra eller om det krävs
      reparationer i bostaden, kan hyresvärden behålla en del av eller hela garantin. Hyresvärden
      kan inte behålla garantin för sådana spår efter den boende som beror på normalt slitage.
