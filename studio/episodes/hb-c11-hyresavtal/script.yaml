scenes:
- id: hb-c11-u0026
  description: När en person flyttar in i en hyresbostad ska hen ingå ett skriftligt hyresavtal om bostaden
    med hyresvärden.
- id: hb-c11-u0027
  description: Ett tidsbegränsat hyresavtal gäller för en viss tid, till exempel ett år.
- id: hb-c11-u0028
  description: Ett hyresavtal som gäller tills vidare fortsätter tills den boende eller hyresvärden säger
    upp det.
- id: hb-c11-u0029
  description: Uppsägningstid betyder den tidsperiod som hyresgästen ännu får bo i bostaden efter att
    hyresavtalet har sagts upp.
- id: hb-c11-u0030
  description: Det är bra att veta att uppsägningstiden oftast börjar räknas från slutet av den kalendermånad
    då avtalet sägs upp.
- id: hb-c11-u0031
  description: Det är bra att använda en standardmall för hyresavtal.
- id: hb-c11-u0032
  description: personuppgifter och adresser för bostadens ägare och hyresgästen
- id: hb-c11-u0034
  description: bostadens adress, typ, storlek, skick och utrustning (det vill säga vilka saker som finns
    i bostaden)
- id: hb-c11-u0035
  description: när hyresavtalet börjar gälla och när det upphör
- id: hb-c11-u0036
  description: beloppet av hyran och garantihyran i euro
- id: hb-c11-u0037
  description: när hyran ska betalas och till vilket bankkonto
- id: hb-c11-u0038
  description: vad som ingår i hyran och vad man måste betala extra för (till exempel vatten, el eller
    bilplats)
- id: hb-c11-u0039
  description: villkoren för hyreshöjning, det vill säga på vilka villkor bostadens ägare kan höja hyran
    en gång per år.
- id: hb-c11-u0040
  description: I allmänhet måste man betala en hyresgaranti för bostaden innan man flyttar in.
- id: hb-c11-u0041
  description: Garantin betalas tillbaka när man flyttar ut, om bostaden är i bra skick och den boende
    har betalat hyrorna i tid.
- id: hb-c11-u0042
  description: Om hyresgästen avsiktligen eller på grund av ovarsamt beteende har orsakat skador i bostaden
    som det kostar mer att reparera än vad garantin täcker, kan hyresvärden kräva extra ersättning.
- id: hb-c11-u0043
  description: Hyresgarantin kan inte användas för att betala hyran för de sista månaderna.
- id: hb-c11-u0044
  description: Ofta ska du betala en vattenavgift för bostaden.
- id: hb-c11-u0045
  description: Ofta ska du själv ingå ett elavtal.
- id: hb-c11-u0046
  description: Om bostaden har centralvärme, ingår uppvärmningen i allmänhet i hyran.
- id: hb-c11-u0047
  description: Det kostar i allmänhet att använda husbolagets bastu, tvättstuga och bilplatser.
- id: hb-c11-u0048
  description: Om du bor på hyra i ett egnahemshus, ska du ofta betala för uppvärmningen och avfallshanteringen.
- id: hb-c11-u0049
  description: I Finland bor många människor i hyresbostäder.
