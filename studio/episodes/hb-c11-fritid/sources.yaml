    heading: Också i vuxen ålder kan man börja med en ny hobby
    source_range:
      start: 0
      end: 460
    range_basis: normalized_html_block
    extracted_passage: Motion och idrott är populära hobbyer, och man kan utöva många idrotts- och
      motionsgrenar på egen hand. Till exempel kan man ta en joggingtur när det passar en själv bäst.
      Man kan också delta i ledd motionsverksamhet i en idrottsförening eller till exempel i kurser
      vid ett medborgarinstitut. Medborgarinstituten ordnar också olika kurser i bildkonst, handarbete
      och språk som många har som hobby att delta i. Föreningsverksamhet är en populär hobby i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
