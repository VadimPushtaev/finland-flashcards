    heading: Kommunernas simhallar och andra motionstjänster erbjuder sänkta priser för vissa grupper
    source_range:
      start: 0
      end: 375
    range_basis: normalized_html_block
    extracted_passage: Inom kommunernas motionstjänster, till exempel i simhallar, erbjuds i allmänhet
      sänkta priser för barn, pensionärer, studerande och arbetslösa. I en del simhallar är vissa
      tider reserverade endast för kvinnor. I simhallarna finns det också en bastu i anslutning till
      omklädnings- och tvättrummen. Det finns separata bastur för män och kvinnor, och man badar
      vanligtvis naken.
    normalization: whitespace_only
