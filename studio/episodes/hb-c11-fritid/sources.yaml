    range_basis: normalized_html_block
    extracted_passage: Tjänsterna inom kommunernas ungdomsarbete är avsedda för barn och unga vuxna.
      Unga kan delta i olika klubbar och den öppna verksamheten på ungdomsgårdarna. Ungdomsgården
      är ett ställe där ungdomarna kan tillbringa tid och idka olika aktiviteter. På ungdomsgårdarna
      ordnas alltid också ledd verksamhet. Största delen av verksamheten på ungdomsgårdarna är gratis.
