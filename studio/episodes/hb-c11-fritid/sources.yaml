    heading: Kommunerna erbjuder sina invånare närtjänster
    source_range:
      start: 0
      end: 244
    range_basis: normalized_html_block
    extracted_passage: I Finland förvaltar kommunerna många lokaler och tjänster som kan användas
      av alla kommuninvånare. Att använda dem är förmånligt eller kostnadsfritt. Utöver kommunerna
      förvaltar också olika föreningar lokaler och tjänster som är öppna för alla.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
