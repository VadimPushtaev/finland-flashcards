    heading: Lekparker, grönområden och badstränder är gemensamma platser för alla
    source_range:
      start: 0
      end: 386
    range_basis: normalized_html_block
    extracted_passage: På sina områden upprätthåller kommunerna också parker och andra grönområden,
      lekparker för barn samt allmänna badstränder. Dessa är platser som är öppna för alla och där
      människor fritt kan tillbringa tid. Även om områdena sköts och underhålls, ansvarar alla som
      använder dem för att de är prydliga och trivsamma. Därför är det viktigt att alla till exempel
      plockar upp sitt eget skräp.
    normalization: whitespace_only
    repairs: []
