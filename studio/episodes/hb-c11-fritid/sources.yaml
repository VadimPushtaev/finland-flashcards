    heading: Det är bra för alla barn att ha en hobby
    source_range:
      start: 0
      end: 365
    range_basis: normalized_html_block
    extracted_passage: I Finland har staten som officiellt mål att alla barn och unga ska ha åtminstone
      en rolig hobby. Kommunerna ordnar olika typer av kostnadsfri hobbyverksamhet i samband med
      skoldagen. Dessa kostnadsfria hobbyer kan vara till exempel motions-, musik- eller konstklubbar.
      Kommunerna ordnar hobbyverksamhet för barn också på andra tider, men de kan vara avgiftsbelagda.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0334:
    source_path: data/orientation/sv/laromedel/vardagen/fritid-och-resor.html
