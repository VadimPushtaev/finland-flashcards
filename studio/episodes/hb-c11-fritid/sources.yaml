    heading: Fritid och resor
    source_range:
      start: 0
      end: 426
    range_basis: normalized_html_block
    extracted_passage: På fritiden kan människor utöva aktiviteter som de tycker om. I Finland har
      både barn och vuxna ofta fritidsintressen. Fritidsintressen kan vara både organiserad verksamhet
      och aktiviteter på egen hand. På fritiden använder människorna ofta också olika närtjänster.
      Sådana är till exempel bibliotek, motionstjänster, ungdomsgårdar och invånarhus. Också att
      besöka olika kulturevenemang är ett bra sätt att tillbringa fritiden.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
