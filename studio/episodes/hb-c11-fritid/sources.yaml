    heading: Invånarhus och ungdomsgårdar är lokaler för samvaro och mångsidig verksamhet
    source_range:
      start: 0
      end: 326
    range_basis: normalized_html_block
    extracted_passage: I bostadsområden och byar finns invånarhus och -lokaler där många olika typer
      av verksamhet ordnas för invånarna i området. Lokalerna kan förvaltas av kommunen eller olika
      föreningar. Verksamheten kan vara till exempel klubbar och fria grupper. Det är ofta möjligt
      att hyra lokalerna för eget bruk, till exempel familjefester.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
