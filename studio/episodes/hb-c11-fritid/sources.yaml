    heading: Kommunernas simhallar och andra motionstjänster erbjuder sänkta priser för vissa grupper
    source_range:
      start: 0
      end: 371
    range_basis: normalized_html_block
    extracted_passage: I Finland ordnar till exempel idrottsföreningar och privata företag olika
      typer av idrotts- och motionsverksamhet. Också kommunerna erbjuder många olika slags motionstjänster,
      till exempel förmånliga simhalls- och gymtjänster och olika former av gruppträning. Kommunerna
      förvaltar idrottsplaner och inomhushallar, som det ofta är möjligt att hyra för sin egen hobbygrupp.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
