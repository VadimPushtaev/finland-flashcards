episode_decisions:
- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Separate legal parenthood, biological relationships and custody. Preserve source ordering
    of recognition, determination, support/inheritance/name effects and birth-registration requirements,
    with all conjunctions intact. No photographed person is assigned a parentage or treatment status.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Tikkurilan neuvola from 1952 in Tikkurila, Vantaa, Finland, 2022 April.jpg by Ximonic
    (Simo Räsänen) continuously as decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic
    diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle,
    starting in motion, with no sentence resets. Total cycles=4.957142857142857. Foreground and bilingual
    text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Teddy Bear Waltz by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 195.265 seconds; prepared lossless stereo bed 694.000 seconds.
    Repeat count 3, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: I Finland kan ett barn officiellt ha en eller två föräldrar, det vill säga mammor eller
    pappor.
- id: scene-2
  description: Det officiella föräldraskapet som fastställs i lag motsvarar inte alltid den verklighet
    som familjen lever i.
- id: scene-3
  description: Enligt finländsk lag är en person som är under 18 år ett barn.
- id: scene-4
  description: Om ett barn föds inom äktenskap är båda föräldrarna tillsammans barnets vårdnadshavare.
- id: scene-5
  description: Kvinnan som har fött barnet är barnets vårdnadshavare om föräldrarna inte är gifta och
    faderskap eller moderskap inte har erkänts.
- id: scene-6
  description: Om barnets mamma är gift med en man, betraktas maken automatiskt som pappa till barnet.
- id: scene-7
  description: Om en gravid kvinna har blivit gravid med hjälp av fertilitetsbehandlingar och mammans
    kvinnliga partner, det vill säga barnets andra mamma, har deltagit i behandlingarna, kan den andra
    mammans moderskap i allmänhet erkännas på rådgivningsbyrån redan innan barnet föds.
- id: scene-8
  description: I Finland finns en moderskapslag enligt vilken ett barn kan ha två mödrar.
- id: scene-9
  description: barnet föds till följd av fertilitetsbehandling till modern och moderns kvinnliga partner
    eller make
- id: scene-10
  description: båda föräldrarna har samtyckt till fertilitetsbehandlingen och
- id: scene-11
  description: ingen fader kan fastställas för barnet.
- id: scene-12
  description: Moderskap måste erkännas och fastställas även när föräldrarna är gifta.
- id: scene-13
  description: Du kan erkänna moderskapet före barnets födelse på mödrarådgivningen.
- id: scene-14
  description: Du kan också erkänna moderskapet efter barnets födelse hos barnatillsyningsmannen på din
    ort.
- id: scene-15
  description: När moderskapet har fastställts
- id: scene-16
  description: kan barnet ges endera moderns efternamn eller mödrarnas gemensamma efternamn
- id: scene-17
  description: båda mödrarna måste bidra till barnets underhåll
- id: scene-18
  description: mödrarna får agera som barnets vårdnadshavare antingen tillsammans eller var för sig
- id: scene-19
  description: barnet har arvsrätt till båda sina mödrar och deras släkt.
- id: scene-20
  description: När faderskapet har fastställts
- id: scene-21
  description: kan barnet ges faderns efternamn
- id: scene-22
  description: kan fadern vara barnets vårdnadshavare antingen tillsammans med barnets mor eller ensam.
- id: scene-23
  description: är fadern förpliktad att delta i underhåll av barnet
- id: scene-24
  description: har barnet rätt att ärva sin far och släkten på sin fars sida och tvärtom
- id: scene-25
  description: har barnet rätt till familjepension om fadern dör.
- id: scene-26
  description: Om fadern inte erkänner sitt faderskap kan modern väcka talan för fastställande av faderskapet.
- id: scene-27
  description: Ett barns födelse registreras i befolkningsdatasystemet på sjukhuset när barnet föds.
- id: scene-28
  description: modern har en hemkommun i Finland och
- id: scene-29
  description: modern har en finsk personbeteckning.
- id: scene-30
  description: Om modern inte är registrerad i Finland kan sjukhuset inte registrera barnets födelse.
- id: scene-31
  description: I Finland finns en namnlag.
- id: scene-32
  description: Barnet får sitt efternamn av sina föräldrar.
- id: scene-33
  description: Om föräldrarna har samma efternamn eller efternamnskombination får barnet detta namn som
    efternamn.
- id: scene-34
  description: Om ett barn endast har en förälder får barnet denna förälders efternamn.
- id: scene-35
  description: Om föräldrarna har gemensamma barn sedan tidigare, ska minderåriga syskon ha samma efternamn.
- id: scene-36
  description: Om föräldrarna har separerat, bestämmer barnets vårdnadshavare vilket namn barnet får.
- id: scene-37
  description: Om föräldrarna inte kommer överens om barnets efternamn, får barnet moderns efternamn.
- id: scene-38
  description: Om föräldrarna har olika efternamn avgörs barnets efternamn enligt situationen.
- id: scene-39
  description: Om föräldrarna är gifta kan de välja endera makens efternamn eller efternamnskombination
    till barnet.
- id: scene-40
  description: Om föräldrarna inte är gifta kan barnet få valfri förälders efternamn om faderskapet eller
    den icke-födande moderns moderskap har fastställts.
- id: scene-41
  description: Föräldrarnas första gemensamma barn kan ges en kombination av föräldrarnas efternamn eller
    det andra namnet i ena förälderns efternamnskombination.
- id: scene-42
  description: När barnet föds måste man registrera dess modersmål.
