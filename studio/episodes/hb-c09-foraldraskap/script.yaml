    föräldraskapet för barnet har överförts till en adoptivförälder eller adoptivföräldrar genom adoption.
  ru: Так может быть, например, если у ребёнка в радужной семье официально две матери или если в результате
    усыновления родительство перешло к усыновителю или усыновителям.
