      våld, våldtäkt, krig eller tortyr. Sådana upplevelser kan orsaka posttraumatiskt stressyndrom.
      Det innebär att minnesbilderna från traumat tvångsmässigt stiger upp i medvetandet i olika
      situationer, vilket orsakar kraftig ångest.
