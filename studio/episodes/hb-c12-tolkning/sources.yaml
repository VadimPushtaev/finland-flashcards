      end: 350
    range_basis: normalized_html_block
    extracted_passage: Myndigheten kan ordna och betala tolkningen när det gäller skötsel av ärenden
      som inletts på myndighetens initiativ. Detta är dock inte alltid möjligt. Om du behöver en
      tolk i integrationstjänsterna, till exempel när en integrationsplan ska utarbetas för dig,
      är myndigheten skyldig att beställa en tolk. Du kan på förhand fråga myndigheten om detta.
    normalization: whitespace_only
    repairs: []
