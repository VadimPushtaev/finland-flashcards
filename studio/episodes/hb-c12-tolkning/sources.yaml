      end: 192
    range_basis: normalized_html_block
    extracted_passage: Tolken är med på möten mellan dig och myndigheten. Han eller hon tolkar det
      som du och myndigheten säger. Tolken är antingen på plats eller också kan tolkningen ordnas
      via telefon eller video.
