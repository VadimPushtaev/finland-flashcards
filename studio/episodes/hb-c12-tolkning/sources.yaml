    source_range:
      start: 0
      end: 263
    range_basis: normalized_html_block
    extracted_passage: Tolken har som uppgift att tolka det som du och myndigheten säger. Tolken
      sköter inga andra uppgifter utöver tolkningen. Han eller hon kan således inte hjälpa dig med
      annat. Tolken är en neutral, utomstående person som varken är på din eller på myndighetens
      sida.
    normalization: whitespace_only
