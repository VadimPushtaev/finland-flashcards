    heading: I vissa fall kan en myndighet ordna en tolk
    source_range:
      start: 0
      end: 224
    range_basis: normalized_html_block
    extracted_passage: Man måste meddela om behovet av tolk i samband med tidsbokningen. Om man inte
      kommer till den avtalade tiden som tolken beställts till och inte avbokar den i tid, kan man
      bli tvungen att betala för den oanvända tolktjänsten.
