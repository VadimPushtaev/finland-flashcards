    source_kind: p
    source_role: content
    heading: I vissa fall kan en myndighet ordna en tolk
    source_range:
      start: 0
      end: 419
    range_basis: normalized_html_block
    extracted_passage: Om det inte är möjligt att få en professionell tolk ordnad av en myndighet
      för att uträtta ett ärende, kan kunden själv skaffa en tolk. I sådana fall betalar kunden kostnaderna
      för tolkningen. I vissa fall kan kunden ta med sig till exempel en bekant eller en familjemedlem
      för att hjälpa till. Det är ändå viktigt att var och en sköter sina egna angelägenheter själv.
      Ett minderårigt barn ska aldrig användas som tolk.
    normalization: whitespace_only
    repairs: []
