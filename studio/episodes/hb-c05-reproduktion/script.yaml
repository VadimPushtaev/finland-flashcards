asset_requests:
- id: episode_background
  kind: background
  description: Distinct verified topic-related photograph identified in assets.yaml; continuous full-frame
    decorative treatment.
  fallback: Use another accurately identified reusable topic-related photograph; revise only this visual
    choice.
- id: source_diagrams
  kind: foreground
  description: Pictorial explanations of the exact source relationships, using original schematic objects,
    people, arrows and source labels; no additional legal or medical claims.
  fallback: Use accurately identified relevant photographs; document any unresolved picture shortfall
    without filler.
- id: music_bed
  kind: music
  description: Distinct calm licensed instrumental track selected during assets, with documented crossfade
    extension if needed.
  fallback: Choose a distinct calm licensed instrumental track and document replacement; never omit music.
- id: narration
  kind: narration
  description: One complete local Supertonic3 F1 Swedish clip per exact source sentence, with separate
    speech-only number expansions where needed.
  fallback: Revise pronunciation expansion preserving source meaning; do not use cloud TTS.
- id: picture_court
  kind: foreground
  description: Actual Supreme Court of Finland exterior. Illustrates the judicial institution in passages
    on courts, constitutional rights and separation of powers; no particular case or judgment is depicted.
    Original photograph and Commons identity metadata visually checked on 2026-10-26. Here shown as a
    contextual foreground photograph; no personal status inferred.
  fallback: Use a source-based diagram and document missing photo.
- id: picture_health
  kind: foreground
  description: 'Actual Kalasatama health and wellbeing centre: contextual public health services, without
    a claim about particular patients.'
  fallback: Use original source-based health-services diagram.
