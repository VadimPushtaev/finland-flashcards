scenes:
- id: scene-1
  description: I Finland föreskriver barnskyddslagen hurdant barnskyddet ska vara.
- id: scene-2
  description: Utgångspunkten för barnskyddet är alltid barnets intresse.
- id: scene-3
  description: Om en familj behöver hjälp i en svår livssituation, kan den själv be om hjälp hos barnskyddet.
- id: scene-4
  description: Om det ser ut att finnas allvarliga problem i en familj och ett barns välbefinnande är
    i fara, kan också en person utanför familjen göra en barnskyddsanmälan.
- id: scene-5
  description: Till exempel anställda inom småbarnspedagogiken och skolan är skyldiga att göra en barnskyddsanmälan
    om de misstänker att ett barn behöver hjälp eller om någon måste ingripa i en situation.
- id: scene-6
  description: Anmälningar till barnskyddet görs till exempel om ett barn använder rusmedel, är självdestruktivt,
    kontinuerligt missköter skolan eller om det finns en misstanke om att barnet till exempel blir slaget.
- id: scene-7
  description: Om en barnskyddsanmälan har gjorts om en familj, är den sociala myndigheten skyldig att
    utreda huruvida barnet eller den unga behöver skydd, hjälp eller stöd.
- id: scene-8
  description: Utifrån samtalen bedömer myndigheterna huruvida familjen behöver stöd.
- id: scene-9
  description: Vård utom hemmet betyder att ett barn placeras tillfälligt att bo någon annanstans än hos
    sina föräldrar eller vårdnadshavare.
- id: scene-10
  description: En placering betyder inte nödvändigtvis omhändertagande.
- id: scene-11
  description: Om ett barn placeras utanför hemmet, tar välfärdsområdets barnskyddsmyndigheter hand om
    hen.
- id: scene-12
  description: Målet för barnskyddet är alltid att barnet ska kunna bo hemma hos sina föräldrar.
