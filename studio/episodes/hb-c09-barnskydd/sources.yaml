    source_kind: p
    source_role: content
    heading: Vård utom hemmet är det sista alternativet för att skydda barn
    source_range:
      start: 0
      end: 442
    range_basis: normalized_html_block
    extracted_passage: Vård utom hemmet betyder att ett barn placeras tillfälligt att bo någon annanstans
      än hos sina föräldrar eller vårdnadshavare. Om barnet är i omedelbar fara, kan hen placeras
      brådskande utanför hemmet. Orsaker till placeringen kan vara till exempel allvarlig utmattning
      hos föräldrarna, allvarliga utmaningar med uppfostran, en allvarlig långtidssjukdom eller mentala
      problem i familjen, problematisk användning av rusmedel eller familjevåld.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
