    heading: Barnskyddet baserar sig på lagen och barnets intresse
    source_range:
      start: 0
      end: 329
    range_basis: normalized_html_block
    extracted_passage: I Finland föreskriver barnskyddslagen hurdant barnskyddet ska vara. Syftet
      med barnskyddet är att säkerställa att barn har en trygg uppväxtmiljö och kan växa upp på ett
      harmoniskt sätt. Barnskyddslagen gäller alla barn som bor i Finland. Barnskyddsmyndigheterna
      är experter på socialarbete, och deras arbete baserar sig på lagen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
