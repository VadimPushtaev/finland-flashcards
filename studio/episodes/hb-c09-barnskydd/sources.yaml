    heading: Vård utom hemmet är det sista alternativet för att skydda barn
    source_range:
      start: 0
      end: 275
    range_basis: normalized_html_block
    extracted_passage: Målet för barnskyddet är alltid att barnet ska kunna bo hemma hos sina föräldrar.
      Också under vård utom hemmet eller ett omhändertagande arbetar barnskyddsmyndigheterna tillsammans
      med familjen. Tanken är att hjälpa familjen så att det är tryggt för barnet att återvända hem.
    normalization: whitespace_only
