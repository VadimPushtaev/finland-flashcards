    heading: Vem som helst som är orolig över ett barn kan göra en barnskyddsanmälan
    source_range:
      start: 0
      end: 281
    range_basis: normalized_html_block
    extracted_passage: Om det ser ut att finnas allvarliga problem i en familj och ett barns välbefinnande
      är i fara, kan också en person utanför familjen göra en barnskyddsanmälan. Anmälan görs till
      välfärdsområdets socialvårdstjänster och kan göras per telefon, skriftligt eller genom att
      besöka byrån.
    normalization: whitespace_only
