    heading: Vård utom hemmet är det sista alternativet för att skydda barn
    source_range:
      start: 0
      end: 279
    range_basis: normalized_html_block
    extracted_passage: En placering betyder inte nödvändigtvis omhändertagande. Ett omhändertagande
      kan göras om ingenting annat hjälper. Det innebär att myndigheterna övertar ansvaret för omsorgen
      om och uppfostran av barnet. Omhändertagande är myndigheternas sista alternativ för att skydda
      ett barn.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
