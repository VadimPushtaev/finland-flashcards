    source_kind: p
    source_role: content
    heading: Vem som helst som är orolig över ett barn kan göra en barnskyddsanmälan
    source_range:
      start: 0
      end: 559
    range_basis: normalized_html_block
    extracted_passage: Utifrån samtalen bedömer myndigheterna huruvida familjen behöver stöd. De
      gör tillsammans upp en plan för barnet och familjen där man skriver in vad familjen behöver
      hjälp med och hur hjälpen ser ut. Den kan bestå av till exempel rådgivning, handledning och
      samtalshjälp. En stödperson eller stödfamilj kan utses för familjen som kan tillbringa tid
      med familjens barn och på så sätt stödja både barnen och föräldrarna. Inom barnskyddsarbetet
      är det i de flesta fall fråga om öppenvårdstjänster, det vill säga barnet kan fortsätta att
      bo hemma hos föräldrarna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
