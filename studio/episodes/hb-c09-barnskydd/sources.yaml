    range_basis: normalized_html_block
    extracted_passage: Utgångspunkten för barnskyddet är alltid barnets intresse. Det betyder att
      de anställda i alla beslut som gäller barnet ska bedöma vilken den bästa lösningen är för just
      det här barnet i den här livssituationen.
    normalization: whitespace_only
