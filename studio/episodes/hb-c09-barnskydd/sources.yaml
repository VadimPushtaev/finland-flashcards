    heading: Vem som helst som är orolig över ett barn kan göra en barnskyddsanmälan
    source_range:
      start: 0
      end: 321
    range_basis: normalized_html_block
    extracted_passage: Om en barnskyddsanmälan har gjorts om en familj, är den sociala myndigheten
      skyldig att utreda huruvida barnet eller den unga behöver skydd, hjälp eller stöd. I allmänhet
      diskuterar myndigheterna saken först med familjen. I samtalet kan en tolk användas som hjälp.
      En socialarbetare träffar också barnet utan föräldrarna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
