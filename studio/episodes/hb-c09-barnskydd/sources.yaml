    heading: Barnskyddet skyddar barnen
    source_range:
      start: 0
      end: 307
    range_basis: normalized_html_block
    extracted_passage: Om en familj behöver hjälp i en svår livssituation, kan den själv be om hjälp
      hos barnskyddet. Likaså ska man be om hjälp om någon skadar ett barn allvarligt. Barnskyddet
      har skyldighet att ingripa också på eget initiativ, om föräldrarna inte kan ta hand om sitt
      barn eller om barnet på något sätt är hotat.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
