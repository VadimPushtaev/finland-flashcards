    source_kind: p
    source_role: content
    heading: Vård utom hemmet är det sista alternativet för att skydda barn
    source_range:
      start: 0
      end: 533
    range_basis: normalized_html_block
    extracted_passage: Om ett barn placeras utanför hemmet, tar välfärdsområdets barnskyddsmyndigheter
      hand om hen. Barnet placeras att bo i ett familjehem eller på ett barn- eller ungdomshem. En
      placering är alltid tillfällig. Myndigheterna utvärderar regelbundet huruvida barnet kan återvända
      hem till sin familj. Om situationen hemma lugnar sig snabbt, kan vården utom hemmet bli kortvarig.
      Ibland är ändå familjens problem långvariga. Då kan vården utom hemmet eller omhändertagandet
      fortsätta tills barnet blir myndigt och flyttar till en egen bostad.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
