    heading: Vem som helst som är orolig över ett barn kan göra en barnskyddsanmälan
    source_range:
      start: 0
      end: 306
    range_basis: normalized_html_block
    extracted_passage: Till exempel anställda inom småbarnspedagogiken och skolan är skyldiga att
      göra en barnskyddsanmälan om de misstänker att ett barn behöver hjälp eller om någon måste
      ingripa i en situation. Dessutom kan vem som helst göra en barnskyddsanmälan till de sociala
      myndigheterna. Anmälan kan också göras anonymt.
    normalization: whitespace_only
