    range_basis: normalized_html_block
    extracted_passage: Anmälningar till barnskyddet görs till exempel om ett barn använder rusmedel,
      är självdestruktivt, kontinuerligt missköter skolan eller om det finns en misstanke om att
      barnet till exempel blir slaget.
