    heading: En hållbar utveckling tryggar goda levnadsvillkor och bromsar klimatförändringen
    source_range:
      start: 0
      end: 301
    range_basis: normalized_html_block
    extracted_passage: En annan utmaning för Finland är att trygga en hållbar utveckling. Hållbar
      utveckling är lokal, regional och global utveckling som garanterar goda levnadsvillkor för
      nuvarande och kommande generationer. Hållbar utveckling är att minska fattigdom, minska ekonomisk
      ojämlikhet och skydda miljön globalt.
    normalization: whitespace_only
    repairs: []
