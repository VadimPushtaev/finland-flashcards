    heading: Finland är ett av världens mest utvecklade länder
    source_range:
      start: 0
      end: 397
    range_basis: normalized_html_block
    extracted_passage: Det självständiga Finland fyllde hundra år 2017. På drygt hundra år har Finland
      genomgått stora förändringar. Ett jordbruksdominerat, fattigt land utvecklades till ett välmående,
      modernt samhälle. Finland blev en liberal demokrati, vars grundlag skyddar alla människors
      rättigheter. Finland är också en nordisk välfärdsstat, som garanterar grundläggande livsförutsättningar
      för alla sina invånare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
