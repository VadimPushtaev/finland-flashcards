    range_basis: normalized_html_block
    extracted_passage: Välfärdsstaten finansieras i huvudsak med skattemedel och därför är det av
      avgörande betydelse att det finns tillräckligt med skattebetalare. Man måste fundera på hur
      man i framtiden ska kunna erbjuda goda utbildnings-, social- och hälsovårdstjänster i Finland,
      när det finns allt färre människor i arbetsför ålder och skattebetalare och allt fler som är
      i behov av tjänster.
