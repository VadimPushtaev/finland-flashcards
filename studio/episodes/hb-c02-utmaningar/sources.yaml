    heading: Finland behöver en större befolkning i arbetsför ålder
    source_range:
      start: 0
      end: 453
    range_basis: normalized_html_block
    extracted_passage: Även om förhållandena är goda, har Finland ändå olika utmaningar att lösa
      i dag och framöver i en värld som ständigt förändras. En av utmaningarna är en försämrad demografisk
      försörjningskvot. Med det avses att det i landet föds färre barn än tidigare, samtidigt som
      människorna lever allt längre. I Finland, liksom i övriga industriländer, finns det allt fler
      äldre och allt färre människor i arbetsför ålder i förhållande till befolkningen som helhet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
