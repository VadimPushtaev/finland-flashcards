    heading: En hållbar utveckling tryggar goda levnadsvillkor och bromsar klimatförändringen
    source_range:
      start: 0
      end: 366
    range_basis: normalized_html_block
    extracted_passage: Åtgärderna för att bromsa klimatförändringen måste ökas och effektiviseras.
      Finlands nordliga läge skyddar landet från de värsta extrema väderfenomenen som orsakas av
      klimatförändringen. Ändå lider naturen och näringarna av klimatförändringen, i synnerhet i
      Lappland. Det är också viktigt att vidta brådskande åtgärder för att stoppa förlusten av biologisk
      mångfald.
