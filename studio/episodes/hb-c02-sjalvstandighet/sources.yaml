    heading: Finland blev självständigt, men hamnade genast i ett inbördeskrig
    source_range:
      start: 0
      end: 373
    range_basis: normalized_html_block
    extracted_passage: Först i det självständiga Finland var människorna av mycket olika åsikt om
      hur staten skulle styras och utvecklas. Socialisterna ville göra omfattande samhällsreformer
      för att förbättra förhållandena för arbetarna och den fattiga landsbygdsbefolkningen och utveckla
      demokratin i kommunerna. Högern motsatte sig reformerna och var rädd för socialismens inflytande
      i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
