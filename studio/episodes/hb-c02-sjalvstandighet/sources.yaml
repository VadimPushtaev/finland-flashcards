    heading: Finland som en del av Kejsardömet Ryssland 1809–1917
    source_range:
      start: 0
      end: 441
    range_basis: normalized_html_block
    extracted_passage: Från 1899 och framåt tog Ryssland ett hårdare grepp om storfurstendömet Finland.
      Finland deltog inte i första världskriget, men nationalismen hade inverkan även i det finska
      området. Finland fick en egen lantdag 1906 och det första valet ordnades 1907. Finland förklarade
      sig självständigt den 6 december 1917 och bolsjevikregeringen som tog makten i samband med
      oktoberrevolutionen i Ryssland erkände självständigheten den 31 december 1917.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
