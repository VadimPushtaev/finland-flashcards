    heading: Finland blev självständigt, men hamnade genast i ett inbördeskrig
    source_range:
      start: 0
      end: 270
    range_basis: normalized_html_block
    extracted_passage: Inte förrän i det självständiga Finland blev förhållandena i samhället utmanande
      på grund av bland annat livsmedelsbrist, arbetslöshet och betydande politiska meningsskiljaktigheter.
      Dessa faktorer bidrog till uppkomsten av inbördeskriget. Kriget bröt ut i januari 1918.
    normalization: whitespace_only
