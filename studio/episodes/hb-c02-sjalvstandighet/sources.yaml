    heading: Finland blev självständigt, men hamnade genast i ett inbördeskrig
    source_range:
      start: 0
      end: 334
    range_basis: normalized_html_block
    extracted_passage: I kriget stred de röda och de vita mot varandra. De röda var arbetare och
      fattiga från landsbygden som hörde till den politiska vänstern. De vita var bönder, tjänstemän
      och lärare som var anhängare av högerpolitik. Alla medborgare var ändå inte knutna till de
      röda eller de vita, utan mångas politiska ståndpunkt låg mellan dessa två.
    normalization: whitespace_only
    repairs: []
