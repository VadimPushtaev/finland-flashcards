    heading: Självständighetens tidiga år 1917–1945
    source_range:
      start: 0
      end: 322
    range_basis: normalized_html_block
    extracted_passage: Finlands ställning under självständighetens tidiga år var skör. Snart efter
      att landet hade blivit självständigt utbröt ett blodigt inbördeskrig i Finland. Kriget bekämpades
      mellan den röda arbetarrörelsen och vita regeringsstyrkor. De vita fick stöd av Tyskland och
      de röda av Ryssland. Kriget slutade med de vitas seger.
    normalization: whitespace_only
    repairs: []
