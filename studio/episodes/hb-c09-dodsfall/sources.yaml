    heading: I en obduktion utreds dödsorsaken
    source_range:
      start: 0
      end: 364
    range_basis: normalized_html_block
    extracted_passage: Polisen ansvarar för rättsmedicinska utredningar av dödsorsak. Polisen beordrar
      att en rättsmedicinsk obduktion ska utföras om ett dödsfall inte beror på en sjukdom, om det
      har inträffat plötsligt eller om dödsfallet har inträffat i samband med en olycka, ett brott
      eller självmord. Polisen behöver inte familjens tillstånd och familjen kan inte vägra obduktionen.
    normalization: whitespace_only
    repairs: []
