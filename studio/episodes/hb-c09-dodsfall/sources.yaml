    heading: I en obduktion utreds dödsorsaken
    source_range:
      start: 0
      end: 284
    range_basis: normalized_html_block
    extracted_passage: En medicinsk utredning av dödsorsak utförs av en läkare. En sådan görs om
      en människas död beror på en sjukdom. Då är en utredning av dödsorsaken till allmän nytta för
      hälso- och sjukvården. Familjen måste ge sitt tillstånd till medicinsk obduktion. Den kan inte
      göras utan tillstånd.
    normalization: whitespace_only
