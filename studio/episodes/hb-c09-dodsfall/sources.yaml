    heading: I en obduktion utreds dödsorsaken
    source_range:
      start: 0
      end: 224
    range_basis: normalized_html_block
    extracted_passage: Om dödsorsaken inte är klar, ska den avlidne obduceras. Vid en obduktion tar
      läkaren reda på varför personen dog. Kroppen kan inte begravas innan dödsorsaken har utretts.
      En obduktion kan vara medicinsk eller rättsmedicinsk.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
