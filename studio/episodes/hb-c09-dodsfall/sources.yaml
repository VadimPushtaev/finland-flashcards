    heading: Organdonation kan rädda en annan människas liv
    source_range:
      start: 0
      end: 195
    range_basis: normalized_html_block
    extracted_passage: Organdonation innebär att en människa ger organen och vävnaderna i sin kropp
      till andra människor efter sin död. De donerade organen kan rädda en annan människas liv eller
      förbättra någons hälsa.
    normalization: whitespace_only
