    heading: Organdonation kan rädda en annan människas liv
    source_range:
      start: 0
      end: 523
    range_basis: normalized_html_block
    extracted_passage: Enligt finsk lag är varje människa organdonator om hen inte har motsatt sig
      det medan hen levde. Om man överväger organdonation, försöker läkaren ta reda på vad den avlidnes
      vilja skulle ha varit i frågan. Man antar ändå att personen skulle ha samtyckt till organdonation
      om man inte känner till att hen varit emot det. Om en person vill kan hen göra upp ett organdonationstestamente
      före sin död. Av det framgår personens vilja tydligt. Familjen kan inte vägra organdonation
      om personen själv har önskat donera sina organ.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
