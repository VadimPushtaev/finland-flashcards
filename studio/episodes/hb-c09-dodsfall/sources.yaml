    heading: När en närstående avlider är det många ärenden att ta hand om
    source_range:
      start: 0
      end: 453
    range_basis: normalized_html_block
    extracted_passage: När en människa avlider måste familjen och släkten trots sorgen ta itu med
      många olika saker. Om dödsfallet har inträffat hemma, ska man i allmänhet ringa nödcentralen,
      som hänvisar ärendet till en läkare eller till polisen. Läkaren konstaterar dödsfallet och
      avgör om orsaken till det är klar eller om en obduktion ska göras av den avlidne. Om dödsfallet
      är plötsligt eller inträffar på natten eller på en helg, meddelar man i allmänhet polisen om
      det.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
