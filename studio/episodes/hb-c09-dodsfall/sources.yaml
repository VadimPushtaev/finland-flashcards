    heading: Läkaren skickar information om dödsfallet till befolkningsdatasystemet
    source_range:
      start: 0
      end: 533
    range_basis: normalized_html_block
    extracted_passage: Dödsfall konstateras alltid av läkare. Läkaren ger familjen begravningstillstånd.
      Läkaren skickar också information om dödsfallet till befolkningsdatasystemet. Myndigheterna,
      såsom FPA, och till exempel den avlidnes bank och arbetspensionsförsäkringsbolag får informationen
      från befolkningsdatasystemet, men ofta är det ändå bra att kontakta dessa aktörer. De närstående
      ska meddela om dödsfallet till den avlidnes eventuella arbetsgivare, till husbolagets disponent
      och hyresvärden och till bland annat elbolaget och telefonbolaget.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
