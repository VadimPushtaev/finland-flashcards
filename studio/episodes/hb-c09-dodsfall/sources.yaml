    heading: För skötseln av ärenden ska en släktutredning göras
    source_range:
      start: 0
      end: 307
    range_basis: normalized_html_block
    extracted_passage: En dödsattest är ett dokument som anger orsaken till ett dödsfall. Ibland
      skriver läkaren dödsattesten först månader efter dödsfallet. Familjen behöver inte dödsattesten
      när de uträttar ärenden hos olika myndigheter. Dödsattesten behövs närmast om familjen måste
      sköta livförsäkringsärenden för den avlidne.
    normalization: whitespace_only
    repairs: []
