scenes:
- id: scene-1
  description: När en människa avlider måste familjen och släkten trots sorgen ta itu med många olika
    saker.
- id: scene-2
  description: Dödsfall konstateras alltid av läkare.
- id: scene-3
  description: En dödsattest är ett dokument som anger orsaken till ett dödsfall.
- id: scene-4
  description: Om dödsorsaken inte är klar, ska den avlidne obduceras.
- id: scene-5
  description: En medicinsk utredning av dödsorsak utförs av en läkare.
- id: scene-6
  description: Polisen ansvarar för rättsmedicinska utredningar av dödsorsak.
- id: scene-7
  description: Organdonation innebär att en människa ger organen och vävnaderna i sin kropp till andra
    människor efter sin död.
- id: scene-8
  description: Enligt finsk lag är varje människa organdonator om hen inte har motsatt sig det medan hen
    levde.
- id: scene-9
  description: Man kan också testamentera sin kropp till medicinsk forskning.
