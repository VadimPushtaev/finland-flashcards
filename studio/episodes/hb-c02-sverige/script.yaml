- sentence_id: hb-c02-u0017-s002
  sv: Kolonialism innebär att ett land erövrar hela länder eller områden i andra världsdelar och utnyttjar
    deras resurser, såsom arbetskraft och naturresurser.
  ru: Колониализм означает, что страна завоёвывает целые страны или территории в других частях света и
    использует их ресурсы, такие как рабочая сила и природные ресурсы.
  scene_id: colonialism
  visual_cue: Keep foreground open to the continuous decorative background; the exact bilingual sentence
    pair carries the explanation.
  asset_ids:
