- sentence_id: hb-c02-u0018-s002
  sv: Länderna som deltog i koloniseringen, till exempel Sverige och därmed också Finland, drog nytta
    av naturresurserna, råvarorna och produkterna i kolonierna samt handeln med dem.
  ru: Страны, участвовавшие в колонизации, например Швеция, а следовательно, и Финляндия, извлекали выгоду
    из природных ресурсов, сырья и товаров колоний, а также из торговли ими.
  scene_id: colonialism
