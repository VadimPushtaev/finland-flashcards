  resolve_during: script
- id: music_selection
  decision: Use With the Sea by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 163.399 seconds; prepared lossless stereo bed 371.750 seconds.
    Repeat count 2, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Sparse exact-source date and concept cards at selected factual turning points. Background
    remains visible otherwise. These typography cards do not imply historical event imagery; suppress
    redundant captions.
  status: proposed
  resolve_during: script
- id: closing
