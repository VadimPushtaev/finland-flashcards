- sentence_id: hb-c02-u0017-s003
  sv: Inom kolonialismen påverkar man också de lokala sederna, till exempel språket, religionen och utbildningen,
    i de erövrade länderna eller områdena.
  ru: В рамках колониализма также влияют на местные обычаи, например язык, религию и образование, в завоёванных
    странах или территориях.
  scene_id: colonialism
