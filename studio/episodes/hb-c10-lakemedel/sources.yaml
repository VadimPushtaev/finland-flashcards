    heading: Munhälsovård inom den offentliga hälsovården
    source_range:
      start: 0
      end: 337
    range_basis: normalized_html_block
    extracted_passage: På en offentlig hälsostation kan man få tid till tandläkare och tandhygienist.
      I en del välfärdsområden kan det finnas en särskild tandvårdsklinik. Tandhygienisten ger förebyggande
      mun- och tandvård och gör tandkontroller. Tandläkaren lagar tänder och åtgärdar bettet och
      andra tandproblem. Det är ofta kö till den offentliga tandvården.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
