    range_basis: normalized_html_block
    extracted_passage: Munhälsovården för barn under 18 år är avgiftsfri på offentliga hälsostationer
      och tandvårdskliniker. För barn ordnas regelbundna kontroller av munhälsan när de är i daghems-
      och skolåldern. Syftet med vården för barn och unga är att säkerställa att de har en god mun-
      och tandhälsa redan från början.
