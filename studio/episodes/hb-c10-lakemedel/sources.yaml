    heading: Munhälsovård inom den offentliga hälsovården
    source_range:
      start: 0
      end: 293
    range_basis: normalized_html_block
    extracted_passage: 'Den offentliga munhälsovården i Finland omfattar två typer av vård: förebyggande
      och korrigerande vård. Förebyggande vård betyder att munnens och tändernas hälsa upprätthålls
      med god egenvård, det vill säga daglig munrengöring hemma och regelbundna kontroller hos en
      yrkesperson inom munhälsa.'
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
