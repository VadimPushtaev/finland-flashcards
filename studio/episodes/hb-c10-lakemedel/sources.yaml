    range_basis: normalized_html_block
    extracted_passage: Jouren betjänar människor som behöver brådskande vård. Ett brådskande behov
      är till exempel om en tand värker eller lossnar. Den anställda i tidsbokningen bedömer per
      telefon hur brådskande behovet av tandvård är. Om det behövs en tandkirurg för vården av tänderna,
      bokas först en tid till en vanlig tandläkare. Hen skriver vid behov en remiss till specialisttandvården.
    normalization: whitespace_only
    repairs: []
