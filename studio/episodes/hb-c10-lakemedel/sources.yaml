    source_range:
      start: 0
      end: 298
    range_basis: normalized_html_block
    extracted_passage: Inom den korrigerande vården åtgärdar och behandlar en tandläkare befintliga
      skador och besvär. I Finland får man om man vill alltid smärtlindring vid olika vårdåtgärder.
      Vid till exempel plombering får patienten först ytbedövning i munslemhinnan och därefter lokalbedövning
      i form av en injektion.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
