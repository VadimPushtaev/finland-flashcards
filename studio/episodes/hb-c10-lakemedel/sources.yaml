    range_basis: normalized_html_block
    extracted_passage: Man kan också besöka en privattandläkare för att kontrollera munhälsan. FPA
      ersätter en del av avgiften för privattandläkare om man har ett FPA-kort. Om man inte har något
      kort, kan man ansöka om ersättning hos FPA i efterhand. Man får vanligtvis snabbt en tid hos
      privattandläkare.
