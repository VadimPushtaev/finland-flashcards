    heading: Mediciner köps på apoteket med ett recept utskrivet av en läkare
    source_range:
      start: 0
      end: 474
    range_basis: normalized_html_block
    extracted_passage: I Finland behövs ett recept för många mediciner. En läkare skriver ut ett
      recept på medicin på mottagningen elektroniskt, vilket innebär att det sparas i den nationella
      receptdatabasen. När patienten går till apoteket, kan farmaceuten kontrollera receptet med
      hjälp av hens FPA-kort, identitetskort eller körkort. Patienten kan köpa sina mediciner på
      vilket apotek som helst i Finland. Värkmediciner liksom andra mediciner säljs inte i mataffärerna,
      utan endast på apoteken.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
