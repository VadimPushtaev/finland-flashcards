  sv: Om det står klart att försäljaren har känt till fel i bostaden utan att berätta om detta för köparen,
    kan säljaren tvingas ersätta köparen för felet.
  ru: Если выяснится, что продавец знал о дефектах жилья, но не сообщил о них покупателю, его могут обязать
    возместить покупателю ущерб, связанный с дефектом.
  scene_id: hb-c11-u0095
  visual_cue: Possible compensation for undisclosed known defects, not automatic damages for every defect;
