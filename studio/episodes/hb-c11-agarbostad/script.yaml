- sentence_id: hb-c11-u0094-s002
  sv: Du behöver inte heller något tillstånd om du ska köpa en fastighet tillsammans med din make eller
    maka eller sambo som är medborgare i ett EU- eller EES-land.
  ru: Разрешение также не требуется, если вы собираетесь купить недвижимость вместе с мужем, женой или
