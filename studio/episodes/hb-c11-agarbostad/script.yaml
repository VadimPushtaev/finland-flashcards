scenes:
- id: hb-c11-u0079
  description: I ett bostadsaktiebolag har du skyldighet att
- id: hb-c11-u0080
  description: Betala bolagsvederlag och eventuellt även finansieringsvederlag för bostadsaktiebolagets
    lån till bostadsaktiebolaget.
- id: hb-c11-u0082
  description: Se till att din bostad hålls i gott skick.
- id: hb-c11-u0083
  description: I förväg meddela till bostadsaktiebolagets disponent eller styrelse om du ska göra en sådan
    ändring i din bostad som kan påverka husets bärande konstruktioner, vattenledningar, fuktisolering,
    elledningar eller ventilationssystem.
- id: hb-c11-u0084
  description: Genomföra renoveringar på ett sådant sätt att bygganden inte tar skada.
- id: hb-c11-u0085
  description: Meddela bostadsaktiebolaget eller disponenten, i praktiken vanligtvis allra först fastighetsskötseln,
    om det finns ett sådant fel i din bostad vars åtgärdande åligger bostadsaktiebolaget.
- id: hb-c11-u0086
  description: 'I ett bostadsaktiebolag har du följande rättigheter:'
- id: hb-c11-u0087
  description: Förvalta den bostad vars aktier du äger.
- id: hb-c11-u0089
  description: Hyra ut din bostad eller en del av den till en annan person.
- id: hb-c11-u0090
  description: Delta i stämmor och på dem påverka det som händer i bostadsaktiebolaget.
- id: hb-c11-u0091
  description: 'För bostaden anges två priser i försäljningsannonsen: försäljningspriset och det skuldfria
    priset.'
- id: hb-c11-u0092
  description: I ett bostadsaktiebolag är bolagsvederlaget oftast en stor kostnadspost.
- id: hb-c11-u0093
  description: Om du inte är medborgare i ett EU- eller EES-land och du ska köpa en fastighet med tillhörande
    tomt, behöver du vanligtvis ett tillstånd för detta.
- id: hb-c11-u0094
  description: Om du ska köpa en bostadsaktie behöver du inget tillstånd.
- id: hb-c11-u0095
  description: Enligt lagen måste den som säljer bostaden berätta om de fel som han/hon känner till innan
    försäljningen av bostaden.
- id: hb-c11-u0096
  description: Det kan också finnas dolda fel i bostaden.
- id: hb-c11-u0097
  description: När du köper en bostad måste du också betala överlåtelseskatt (varainsiirtovero).
- id: hb-c11-u0098
  description: Köpebrevet är ett kontrakt där t.ex. bostadens pris, bostadens storlek, bostadens skick
    och datumet då köparen får tillgång till bostaden finns inskrivet.
