    range_basis: raw_pdf_page
    extracted_passage: "I februari firas sportlov i finländska skolor. Då har barnen en vecka ledigt\
      \ från skolan. Sportlovet har \nfirats sedan 1930-talet. Ursprungligen var det meningen att\
      \ barnen skulle få motion och kunna skida \nhela veckan. Nuförtiden skidas det mindre, men\
      \ många far till exempel och skida slalom. Sportlovet \nfiras olika veckor i olika delar av\
      \ Finland, från mitten av februari framåt. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0087:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 18
    printed_page: 17
    source_range:
      start: 2738
      end: 3026
    range_basis: raw_pdf_page
    extracted_passage: "I början av juni får skoleleverna i Finland sommarlov. Läsårets slut firas\
      \ vid skolans vårfest, dit också \nföräldrarna är bjudna. På vårfesten sjungs ofta sommarpsalmen\
      \ Den blomstertid nu kommer. Barnens \nsommarlov fortsätter till mitten av augusti och varar\
      \ alltså ungefär tio veckor.   "
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0088:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 19
    printed_page: 18
    source_range:
      start: 1851
      end: 2218
    range_basis: raw_pdf_page
    extracted_passage: "I slutet av oktober firas Halloween, som är en ganska ny fest i Finland.\
      \ Halloween är ursprungligen \nen irländsk-amerikansk fest. Nuförtiden går en del barn också\
      \ i Finland från dörr till dörr utklädda i \nmaskeraddräkter och ber om godis. Skolorna har\
      \ också halloween-fester för barnen. En del ställer \nprydnadspumpor med ljus inuti i fönstren\
      \ eller utanför dörren. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0089:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 416
      end: 655
    range_basis: raw_pdf_page
    extracted_passage: "Under december firas lillajulsfester i skolor, på arbetsplatser, bland studerande\
      \ och i föreningar. Julen \nfiras i Finland vanligen inom familjen, men lillajulsfesterna firas\
      \ tillsammans med arbets- och \nskolkamrater och andra grupper.   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0090:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 655
      end: 1066
    range_basis: raw_pdf_page
    extracted_passage: "Lillajulsfesterna är avslappnade och informella till sin karaktär. Vid dem\
      \ bjuds första gången på \njulmat, framför allt risgrynsgröt och glögg. På vuxnas lillajulsfester\
      \ klär man sig i festkläder, äter gott \noch dricker ofta alkohol. På barnens fester i skolor\
      \ och hobbygrupper äter man gott och delar ut \nlillajulspresenter. Var och en hämtar ett litet\
      \ paket och får sedan ett litet paket att ta med sig hem. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0091:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 1095
      end: 1369
    range_basis: raw_pdf_page
    extracted_passage: "Några dagar före julen börjar skolornas jullov. I skolan firas först en julfest\
      \ där barnen uppträder till \nexempel med sång. Barnen får julbetyg och sedan börjar jullovet\
      \ som varar i cirka två veckor. Det är \nslutet på skolornas hösttermin. Efter lovet börjar\
      \ vårterminen. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0092:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 2218
      end: 2637
    range_basis: raw_pdf_page
    extracted_passage: "I dagens Finland firas åtminstone i större städer också andra fester, som\
      \ invandrare hämtat med sig. \nSådana fester är till exempel det kinesiska nyåret, det persiska\
      \ eller kurdiska nyåret nowruz och \nmuslimernas fastemånad ramadan. Under ramadan får vuxna\
      \ muslimer inte äta eller dricka på dagen \ninnan solen gått ner. Ramadan avslutas med den\
      \ stora id-festen, då man samlas till festbord med \nvänner och släktingar. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
