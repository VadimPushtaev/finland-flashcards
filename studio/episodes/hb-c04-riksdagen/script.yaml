episode_decisions:
- id: opening
  decision: Exact bilingual source heading, unspoken, for three seconds. No added narration.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Use consecutive source paragraphs as the scenes below, preserving every sentence and list
    fragment in stored source order.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920×1080 at 24 fps. Chapter 4 warm umber #382d24; ivory #faf3e8, secondary #dfcfbb, gold
    #dfb96f, separator #695540. Liberation Sans Bold 48/Regular 40 with a stable Swedish-above-Russian
    right panel and optional source-term cards on the left.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display each pair 0.25 seconds before narration. Natural local voice at speed 0.95. Pause
    1.5 seconds after ordinary sentences and 2.2 seconds at scene ends; 2.5 seconds for long pairs. No
    target-duration acceleration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Riksdagshuset Helsingfors November 2025 01.jpg by ArildV continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=1.6571428571428573. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use series local Supertonic 3/F1, Swedish, 32 steps,speed 0.95, seed 42, 44100 Hz mono PCM16.
    Exact inputs and checksums retained. Numbers and abbreviations have separately recorded speech-only
    expansions; pronunciation awaits whole-video review.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Ethereal Relaxation by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 1686.073 seconds; prepared lossless stereo bed 232.000
    seconds. Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Selected source terms highlight this episode’s actual concepts. Use complete source-only typography
    cards; labels preserve exact source spelling and add no facts. Leave the foreground open elsewhere,
    suppressing unused captions.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two 15 second source/media credit cards; complete attribution accompanies exported MP4.
  status: proposed
  resolve_during: script
- id: background_resampling
  decision: Bilinear sampling of the softened decorative photograph; retain continuous fractional motion,
    full 1080p text and steady foreground graphics. Verify motion from exported frames.
  status: proposed
  resolve_during: render
- id: exceptions
  decision: No exception to shared direction. All creative choices are proposals for whole-video user
    review.
  status: proposed
  resolve_during: script
- id: foreground_picture_coverage
  decision: Use 4 relevant registered foreground pictures over 20 of 24 source pairs as the planning proxy
    for at least 50% of body display time. Verify actual coverage against measured narration timing. Identities
    and sentence-specific relevance reviewed; no text cards or background duplicates count.
  status: proposed
  resolve_during: render
