    range_basis: normalized_html_block
    extracted_passage: Riksdagen godkänner också regeringens förslag till statens budget. Budgeten
      är en plan över hur statens skattepengar och övriga intäkter ska användas. Regeringen förhandlar
      om budgeten varje år och gör ett budgetförslag till riksdagen. Riksdagen övervakar förverkligandet
      av budgeten.
