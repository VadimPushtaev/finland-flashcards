    extracted_passage: Riksdagen måste hålla sig uppdaterad om vad som beslutas i Europeiska unionen.
      Riksdagen berättar för regeringen vad Finland anser om de ärenden som behandlas i EU. Finlands
      lagar och EU:s rättsakter kan inte stå i strid med varandra. Finland måste ta EU:s rättsakter
