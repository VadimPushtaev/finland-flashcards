    range_basis: normalized_html_block
    extracted_passage: Riksdagen diskuterar lagmotionen eller regeringens lagproposition och behandlar
      ärendet i olika utskott. Till sist röstar riksdagsledamöterna om huruvida de understöder lagen.
      Om riksdagen godkänner lagen, stadfäster presidenten den med sin underskrift. Myndigheterna
      informerar om lagändringen, och medierna rapporterar om den nya lagen, dess syfte och innehåll.
      På så sätt får medborgarna aktuell information om nya lagar.
    normalization: whitespace_only
    repairs: []
