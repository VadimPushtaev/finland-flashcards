    extracted_passage: Riksdagen stiftar lagarna i Finland. Vanligtvis lämnar regeringen förslag
      till nya lagar till riksdagen. Också en enskild riksdagsledamot kan göra lagmotioner, eller
      så kan ett lagförslag komma till riksdagen via ett medborgarinitiativ.
    normalization: whitespace_only
