    heading: Den tredje och fjärde sektorn eftersträvar inte vinst
    source_range:
      start: 0
      end: 571
    range_basis: normalized_html_block
    extracted_passage: Ofta talar man förutom om den offentliga och den privata sektorn också om
      den tredje sektorn. Med tredje sektorn avses olika organisationer, till exempel idrottsföreningar,
      miljöorganisationer och politiska organisationer. En stor del av organisationerna utför socialt
      eller ideellt arbete. De vill alltså förbättra förhållandena för människorna och samhället
      socialt eller samhälleligt. En del av arbetstagarna inom den tredje sektorn får lön för sitt
      arbete, men en stor del av verksamheten bedrivs av frivilliga. Syftet med organisationerna
      är inte att generera vinst.
    normalization: whitespace_only
    repairs: []
