    heading: Näringsstrukturen har blivit mer servicebetonad efter 1950-talet
    source_range:
      start: 0
      end: 275
    range_basis: normalized_html_block
    extracted_passage: Före andra världskriget arbetade största delen av den arbetande befolkningen
      i Finland inom jordbruket. Från och med 1950-talet har antalet finländare som försörjer sig
      på jordbruk minskat drastiskt. Människorna har övergått till att arbeta inom industrin och
      tjänstesektorn.
