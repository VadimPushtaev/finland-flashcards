    heading: Finland är en öppen marknadsekonomi där staten är inblandad i vissa sektorer
    source_range:
      start: 0
      end: 491
    range_basis: normalized_html_block
    extracted_passage: Det ekonomiska systemet i Finland, liksom i nästan alla länder, är en så kallad
      blandekonomi. Även om ekonomin baserar sig på fritt utbud och fri efterfrågan av varor och
      tjänster, reglerar den offentliga makten marknadens verksamhet och äger också en del företag.
      Finska staten äger till exempel helt och hållet eller aktiemajoriteten i Posti och VR, som
      ansvarar för tågtrafiken, samt flygbolaget Finnair. Staten har monopol på försäljningen av
      starka alkoholdrycker som Alko ansvarar för.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
