    heading: Finland är en öppen marknadsekonomi där staten är inblandad i vissa sektorer
    source_range:
      start: 0
      end: 446
    range_basis: normalized_html_block
    extracted_passage: Det ekonomiska systemet i Finland bygger på en öppen marknadsekonomi. Det
      betyder att Finland bedriver handel med andra länder och att exporten är en viktig del av Finlands
      ekonomi. I en marknadsekonomi bestäms priserna på produkter och tjänster på den fria marknaden,
      enligt utbudet och efterfrågan. Vem som helst kan bli företagare och starta ett företag. Privata
      företag producerar varor och tjänster och bedriver handel på marknadens villkor.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
