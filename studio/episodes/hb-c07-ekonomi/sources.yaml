    heading: Den privata sektorn genererar vinst och skatteintäkter, den offentliga sektorn välfärd
      med hjälp av skatter
    source_range:
      start: 0
      end: 432
    range_basis: normalized_html_block
    extracted_passage: Den offentliga sektorn avser staten, kommunerna och välfärdsområdena. De producerar
      tjänster som främjar människornas välfärd. Den offentliga sektorns uppgift är inte att generera
      vinst. Sektorn är en stor arbetsgivare i Finland. Alla de som arbetar på till exempel offentliga
      sjukhus, daghem, skolor och socialbyråer, liksom vid polisen, hos skatteverket och inom försvarsmakten
      arbetar för staten, kommunerna och välfärdsområdena.
    normalization: whitespace_only
    repairs: []
