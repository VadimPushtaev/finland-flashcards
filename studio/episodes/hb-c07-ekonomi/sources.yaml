    range_basis: normalized_html_block
    extracted_passage: Antalet arbetstagare inom i synnerhet servicenäringarna har ökat mycket kraftigt.
      Servicenäringarna består av en mycket varierande grupp yrkesområden. Exempel på yrken inom
      servicebranschen är servitör, busschaufför, klasslärare, violinist, programutvecklare och företagskonsult.
