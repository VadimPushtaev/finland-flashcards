    range_basis: normalized_html_block
    extracted_passage: I dag talar man också om fjärde sektorn. Med den avses ett fritt och utspritt
      medborgarsamhälle. Medborgarverksamheten inom den fjärde sektorn har ökat sin betydelse vid
      sidan om mer traditionell organisationsverksamhet. Till den fjärde sektorn hör till exempel
      nätverk för stadsodling och återanvändning som ofta organiserar sin verksamhet via sociala
      medier.
