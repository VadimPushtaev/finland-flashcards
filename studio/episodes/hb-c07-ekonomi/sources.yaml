    heading: Näringsstrukturen har blivit mer servicebetonad efter 1950-talet
    source_range:
      start: 0
      end: 471
    range_basis: normalized_html_block
    extracted_passage: Näringsstrukturen började förändras senare i Finland än i en del andra europeiska
      länder, men utvecklingen var snabb. Antalet arbetstagare inom i synnerhet social- och hälsovårdssektorn
      ökade när finska staten började utveckla sin offentliga service. Även om servicebranscherna
      ökade mycket, utvecklades också industrin i Finland i rask takt. De största industrisektorerna
      var skogsindustrin, träindustrin och pappersindustrin samt metallindustrin och verkstadsindustrin.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
