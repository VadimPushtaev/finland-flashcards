      end: 3382
    range_basis: raw_pdf_page
    extracted_passage: "Gymnasieutbildning och studentexamen blev vanligare särskilt på 1950- och\
      \ 1960-talet. I Finland \nbörjade man eftersträva samhällelig jämlikhet och ekonomisk utveckling\
      \ genom att bygga en \nvälfärdsstat. Samtidigt föddes tanken på en enhetlig 9-årig grundskola.\
      \ Under 1970-talet övergick \nman i hela landet från det gamla systemet med separat folkskola\
      \ och läroverk till en grundskola som \nvar gemensam för alla. \n"
    normalization: whitespace_only
