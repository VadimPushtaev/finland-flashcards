scenes:
- id: hb-c12-u0205
  description: Om du har ett tidsbestämt uppehållstillstånd med familjeband som grund kan det faktum att
    äktenskapet eller det registrerade parförhållandet upphör påverka uppehållstillståndet.
- id: hb-c12-u0206
  description: Om familjebandet inte längre existerar kan det hända att uppehållstillståndet inte förlängs.
- id: hb-c12-u0207
  description: Uppehållstillståndet kan dock förlängas om det vore oskäligt att vägra det och du fortsättningsvis
    har starka band till Finland.
- id: hb-c12-u0208
  description: barn eller andra familjemedlemmar i Finland
- id: hb-c12-u0210
  description: arbetsplats eller eget företag i Finland
- id: hb-c12-u0211
  description: studieplats i Finland
- id: hb-c12-u0212
  description: Om du skiljer dig från din make/maka eftersom han/hon varit våldsam mot dig eller ditt
    barn, kan ditt uppehållstillstånd förlängas trots skilsmässan.
- id: hb-c12-u0213
  description: Om du redan har uppehållstillstånd i Finland och du har fallit offer för arbetsgivarens
    utnyttjande, kan du ansöka om fortsatt tillstånd eller intyg om utvidgad rätt att arbeta på grund
    av arbetsgivarens utnyttjande.
- id: hb-c12-u0214
  description: Om du har blivit offer för människohandel eller om det finns motiverade skäl att misstänka
    det, kan du beviljas uppehållstillstånd i Finland.
