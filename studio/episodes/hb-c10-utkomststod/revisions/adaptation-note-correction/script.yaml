- sentence_id: hb-c10-u0023-s001
  sv: Innan du ansöker om utkomststöd ska du ansöka om de andra bidragen som du har rätt till (till exempel
    arbetslöshetsförsäkring, bostadsbidrag, pension, studiestöd, föräldradagpenning, sjukdagpenning, hemvårdsstöd
    eller underhållsstöd).
  ru: Прежде чем подавать заявление на социальное пособие, необходимо обратиться за другими пособиями,
    на которые вы имеете право (например, пособием по страхованию от безработицы, жилищным пособием, пенсией,
    финансовой помощью на обучение, родительским дневным пособием, пособием по болезни, пособием по уходу
    за ребёнком на дому или пособием на содержание ребёнка).
