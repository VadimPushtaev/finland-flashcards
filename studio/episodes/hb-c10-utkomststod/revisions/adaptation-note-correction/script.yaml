sentences:
- sentence_id: hb-c10-u0021-s001
  sv: Om du eller din familj inte har tillräckliga inkomster eller tillgångar för den nödvändiga dagliga
    försörjningen kan du söka grundläggande utkomststöd hos FPA.
  ru: Если у вас или вашей семьи недостаточно доходов или имущества для покрытия необходимых повседневных
    расходов, вы можете подать заявление на базовое социальное пособие в Ведомство социального обеспечения
    (FPA).
  scene_id: necessities
  visual_cue: Family and insufficient means lead to an application to FPA; no eligibility guarantee.
  asset_ids:
  - episode_background
  - picture-01
  text_highlights: []
  pronunciation_notes:
  - FPA and Finnish benefit names require whole-video listening; automated ASR is diagnostic only.
  speech_override:
    text: Om du eller din familj inte har tillräckliga inkomster eller tillgångar för den nödvändiga dagliga
      försörjningen kan du söka grundläggande utkomststöd hos F P A.
    reason: Speak Swedish initial letters distinctly without changing display or meaning.
    review_status: pending
