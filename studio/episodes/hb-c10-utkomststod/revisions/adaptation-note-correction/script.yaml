  sv: Om du eller din familj har särskilda utgifter, för vilka du inte kan få grundläggande utkomststöd,
    kan välfärdsområdet bevilja kompletterande och förebyggande utkomststöd (täydentävä ja ehkäisevä toimeentulotuki).
  ru: Если у вас или вашей семьи есть особые расходы, на которые нельзя получить базовое социальное пособие,
    регион по обеспечению благополучия населения (välfärdsområde) может назначить дополнительное и профилактическое
    социальное пособие (täydentävä ja ehkäisevä toimeentulotuki).
