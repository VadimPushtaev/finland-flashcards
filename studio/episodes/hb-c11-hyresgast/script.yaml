episode_decisions:
- id: opening
  decision: Exact unspoken bilingual source heading,3seconds; no added speech.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: 'Exact source topics: tenant duties,permitted use,maintenance responsibilities,owner entry,notice/exceptions
    and repair/damage conditions. Do not turn permissions or exceptions into unconditional rights.'
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080/24fps; Liberation Sans48/40, stable right bilingual panel and fixed left foreground.
    Chapter palette: {''background'': ''#243c32'', ''text'': ''#faf3e8'', ''secondary'': ''#c5dfce'',
    ''highlight'': ''#e3c58c'', ''separator'': ''#4d7560''}. Use permitted44/36 or40/34 only if necessary;
    manually segment oversized pairs.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Full measured local narration once per source sentence/list fragment,0.25second text lead,1.7second
    ordinary pauses and2.2seconds at source-paragraph boundaries; longer pairs2.5seconds.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,seed42,44100HzmonoPCM16. Initial allocation2ONNXthreads;
    metrics record actual per-invocation settings and retained takes. Whole-video listening pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Individually authored source-specific pictures for almost every body slide. Actual object/place
    photographs where useful; original diagrams visualize only stated relationships. Inspect every picture;
    do not use irrelevant filler.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Kiiliänkuja 2.jpg by Sadenäyttely continuously as decorative background, darkened
    42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=3.9211309523809526.
    Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Plaint by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct instrumental
    track. Original master 196.545 seconds; prepared lossless stereo bed 548.958 seconds. Repeat count
    2, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music adjustment,
    ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credits and matching canonical sidecar,derived from this episode actual
    sources.yaml and media sources. No spoken credits.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception. Exact archived wording and current reviewed Russian remain unchanged. Record
    source typos/pronunciation diagnostics for whole-video review.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c11-u0050
  description: Du är skyldig
- id: hb-c11-u0051
  description: Att följa ordningsreglerna i ditt bostadsaktiebolag om du bor i ett höghus eller ett radhus.
- id: hb-c11-u0053
  description: Att se till att även dina gäster följer ordningsreglerna.
- id: hb-c11-u0054
  description: Att enbart använda bostaden för det avsedda ändamålet.
- id: hb-c11-u0055
  description: Du har rätt
- id: hb-c11-u0056
  description: Att leva ett normalt liv i ditt hem.
- id: hb-c11-u0058
  description: Till hemfrid.
- id: hb-c11-u0059
  description: Du är skyldig
- id: hb-c11-u0060
  description: Att betala hyran i tid.
- id: hb-c11-u0062
  description: Att se till att hyresbostaden hålls i ett gott skick.
- id: hb-c11-u0063
  description: Att följa villkoren i hyresavtalet.
- id: hb-c11-u0064
  description: Att fråga om tillstånd hos hyresvärden om du vill göra ändringar i bostaden, till exempel
    måla en vägg.
- id: hb-c11-u0065
  description: Att ersätta hyresvärden för skador som du åsamkar bostaden.
- id: hb-c11-u0066
  description: Att meddela hyresvärden om du upptäcker sådana fel i bostaden som hyresvärden ansvarar
    för.
- id: hb-c11-u0067
  description: Att meddela eventuella fel till fastighetsskötseln, till exempel en läckande kran.
- id: hb-c11-u0068
  description: Du har rätt
- id: hb-c11-u0069
  description: Att bo i hyreslägenheten enligt vad som anges i hyresavtalet.
- id: hb-c11-u0071
  description: Att få ett skriftligt meddelande i förväg om hyran höjs.
- id: hb-c11-u0072
  description: Till en uppsägningstid enligt lag.
- id: hb-c11-u0073
  description: Att häva hyresavtalet omedelbart om det är skadligt för hälsan att bo i bostaden.
- id: hb-c11-u0074
  description: Att hyra ut en del av bostaden till en annan person, om detta inte medför olägenhet för
    hyresvärden.
- id: hb-c11-u0075
  description: Att få ett förhandsmeddelande om reparationer.
- id: hb-c11-u0076
  description: Det är en god idé för hyresgästen att besöka bostaden tillsammans med hyresvärden före
    flytten.
- id: hb-c11-u0077
  description: Hyresvärden eller husbolaget ska alltid utan dröjsmål informeras om skadedjur som upptäcks
    i en bostad eller byggnad.
- id: hb-c11-u0078
  description: Det är bra att alltid göra hyresavtalet skriftligt.
