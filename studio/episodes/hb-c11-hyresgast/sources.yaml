    range_basis: normalized_html_block
    extracted_passage: Hyresvärden eller husbolaget ska alltid utan dröjsmål informeras om skadedjur
      som upptäcks i en bostad eller byggnad. Skadedjur är till exempel vägglöss, möss och råttor.
      Skadedjur sprider sig lätt mellan bostäder. Därför är det viktigt att de bekämpas samtidigt
      i alla bostäder.
