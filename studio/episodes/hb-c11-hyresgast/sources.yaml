    range_basis: normalized_html_block
    extracted_passage: Det är en god idé för hyresgästen att besöka bostaden tillsammans med hyresvärden
      före flytten. Det är bra att anteckna och fotografera vilka fel som finns eller vilka reparationer
      som behövs i bostaden. Då blir hyresgästen inte tvungen att betala för gamla fel när hen flyttar
      ut från bostaden.
