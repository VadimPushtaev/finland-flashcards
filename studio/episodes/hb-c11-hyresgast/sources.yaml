    range_basis: normalized_html_block
    extracted_passage: Det är bra att alltid göra hyresavtalet skriftligt. Då är det tydligt vad
      man har kommit överens om, om det senare uppstår meningsskiljaktigheter med hyresvärden. Om
      det uppstår en tvist med hyresvärden kan Konsumentförbundets boenderådgivning ge råd. Även
      Konsumentrådgivningen erbjuder rådgivning.
