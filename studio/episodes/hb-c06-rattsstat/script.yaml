- id: music_selection
  decision: Use Gymnopedie No. 3 by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 145.006 seconds; prepared lossless stereo bed 463.042 seconds.
    Repeat count 3, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
