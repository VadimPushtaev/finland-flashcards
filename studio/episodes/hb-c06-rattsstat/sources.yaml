    range_basis: normalized_html_block
    extracted_passage: I Finland måste alla följa finsk lag. När en människa bor och lever i Finland
      är det viktigt att hen känner till lagarna i landet. Lagarna tryggar allas rättigheter och
      den allmänna ordningen i samhället.
