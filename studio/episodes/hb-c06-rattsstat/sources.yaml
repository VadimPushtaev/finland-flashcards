    range_basis: normalized_html_block
    extracted_passage: Grundläggande värderingar i det finländska samhället är en idé om det allmänna
      bästa och frihet, mänskliga rättigheter och likabehandling. Var och en ska ha möjlighet att
      studera, få ett yrke och vara framgångsrik i sitt liv. Dessa värderingar bildar en stabil grund
