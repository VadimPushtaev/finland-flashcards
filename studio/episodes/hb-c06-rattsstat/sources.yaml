    heading: Finlands viktigaste lag är grundlagen
    source_range:
      start: 0
      end: 262
    range_basis: normalized_html_block
    extracted_passage: Enligt grundlagen är Finland en republik. Makten att bestämma om landets angelägenheter
      ligger hos folket. Grundlagen bestämmer hur till exempel riksdagsledamöter, ministrar och presidenten
      utses. Den bestämmer också hur stiftandet av lagar i riksdagen går till.
    normalization: whitespace_only
