    heading: Rättsväsendet upprätthåller rättsstaten och alla har rättssäkerhet
    source_range:
      start: 0
      end: 401
    range_basis: normalized_html_block
    extracted_passage: Rättsväsendet upprätthåller rättsstaten. Rättsväsendet omfattar domstolarna,
      statens rättshjälpsbyråer, Åklagarmyndigheten, Utsökningsverket, ekonomi- och skuldrådgivning,
      allmän intressebevakning samt Brottspåföljdsmyndigheten. Rättsväsendet ansvarar för att rättvisa
      straff utdelas för brott. Förundersökningsmyndigheterna utreder brott och säkerställer att
      medborgarna kan leva i fred och säkerhet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
