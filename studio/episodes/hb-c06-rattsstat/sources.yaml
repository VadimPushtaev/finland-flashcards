    heading: Rättsväsendet upprätthåller rättsstaten och alla har rättssäkerhet
    source_range:
      start: 0
      end: 390
    range_basis: normalized_html_block
    extracted_passage: I en rättsstat finns det också rättssäkerhet. Rättssäkerhet betyder att alla
      har lika rätt att få sin sak behandlad på behörigt sätt och utan ogrundat dröjsmål av en opartisk
      domstol eller någon annan myndighet. Alla ärenden behandlas i domstol enligt lagen, jämlikt
      och likvärdigt. Enligt finsk lagstiftning ska en människa betraktas som oskyldig tills hens
      skuld har lagligen fastställts.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
