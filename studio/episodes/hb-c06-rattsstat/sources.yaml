    range_basis: normalized_html_block
    extracted_passage: Europeiska unionens förordningar är direkt tillämplig lagstiftning i Finland.
      Ett direktiv är en anvisning om en lag som EU:s medlemsländer måste stifta nationellt. I fråga
      om direktiv har medlemsländerna fler möjligheter att välja på vilket sätt anvisningen genomförs
      i den nationella lagstiftningen.
