    range_basis: normalized_html_block
    extracted_passage: Finland är ett världsligt, det vill säga sekulärt, land. Finlands lagar baserar
      sig inte direkt på någon religion. Ännu på 1500- och 1600-talen baserade sig europeiska lagar
      allmänt på bibeltexter. År 1734 genomfördes en stor lagreform i Sverige, som Finland på den
      tiden hörde till, och i och med den övergick man till en sekulär lagstiftning.
