    heading: Lagar är gemensamma spelregler för samhället
    source_range:
      start: 0
      end: 333
    range_basis: normalized_html_block
    extracted_passage: I Finland anses det i allmänhet viktigt att följa lagar. Att bryta mot lagen
      är oacceptabelt och godkänns inte. Det är viktigt att lagarna är i linje med människornas allmänna
      rättskänsla, det vill säga uppfattningen om vad som är rätt och fel. Om lagen och människornas
      rättskänsla strider mot varandra, minskar respekten för lagen.
    normalization: whitespace_only
    repairs: []
