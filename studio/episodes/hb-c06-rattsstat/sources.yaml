    range_basis: normalized_html_block
    extracted_passage: Lagar bygger på värderingarna och normerna i samhället. Med värderingar avses
      det som människorna anser vara viktiga och värda att eftersträva. Olika kulturer och religioner
      har olika värderingar, och också människor som lever i samma kultur har olika personliga värderingar.
