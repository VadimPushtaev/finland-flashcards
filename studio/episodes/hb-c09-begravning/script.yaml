scenes:
- id: scene-1
  description: I Finland är det vanligt att begravningar ordnas först flera veckor efter ett dödsfall.
- id: scene-2
  description: Var och en får ordna en sådan begravning som den vill för den anhörige, men i mån av möjlighet
    ska den avlidnes önskemål uppfyllas.
- id: scene-3
  description: I Finland bestämmer den avlidne själv eller familjen vad som ska hända med kroppen efter
    döden.
- id: scene-4
  description: Kremering har blivit vanligare de senaste årtiondena.
- id: scene-5
  description: Om den avlidne eller den avlidnes familj vill kan askan också spridas någon annanstans,
    till exempel på familjens egen mark eller i havet.
- id: scene-6
  description: I Finland är majoriteten av begravningsplatserna begravningsplatser som upprätthålls av
    den evangelisk-lutherska kyrkan.
- id: scene-7
  description: Kommunerna kan också ha egna begravningsplatser för olika religiösa samfund, till exempel
    en ortodox, muslimsk eller judisk begravningsplats.
- id: scene-8
  description: Om en utlänning avlider i Finland och familjen vill transportera den avlidnes kropp eller
    aska till ett annat land för att begravas, ska de kontakta destinationslandets ambassad i Finland.
- id: scene-9
  description: När en närstående person avlider, kan du få hjälp och stöd i sorgen vid social- och hälsocentralen
    (sosiaali- ja terveyskeskus) eller familjerådgivningen (perheneuvola) i ditt område, i MIELI ry:s
    kristelefon eller hos församlingarna.
- id: scene-10
  description: Du får hjälp på finska och svenska och på de flesta ställena även på engelska.
- id: scene-11
  description: När en person som är medborgare i något annat land avlider i Finland utreds dödsorsaken
    enligt finsk lag.
- id: scene-12
  description: Om ingen nära anhörig ser till att den avlidna personen blir begraven, kremerad eller transporterad
    till hemlandet kan beskickningen kontakta de lokala myndigheterna.
- id: scene-13
  description: Ibland kan en avliden person ha rätt till begravningsbidrag baserat på sin sista anställning
    eller sitt medlemskap i ett fackförbund.
- id: scene-14
  description: Efter en persons bortgång kan maka/make och barn få familjepension.
- id: scene-15
  description: Om en person har bott eller arbetat länge i ett annat land innan hen flyttade till Finland
    kan änkan/änklingen och barnen ha rätt till familjepension även från detta land.
