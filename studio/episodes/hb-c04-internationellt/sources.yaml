    range_basis: normalized_html_block
    extracted_passage: Finland har varit medlem i Förenta nationerna sedan år 1955. FN grundades
      år 1945 efter andra världskriget. Syftet var att främja samarbetet mellan världens länder så
      att det aldrig mer skulle bli ett världskrig. I dag är nästan alla länder i världen medlemmar
      i FN. År 2024 var antalet medlemsländer sammanlagt 193.
