    range_basis: normalized_html_block
    extracted_passage: Finland har undertecknat många internationella avtal som landet ska följa.
      Avtalen kan vara bilaterala, det vill säga avtal som Finland har ingått med ett annat land.
      Avtalen kan också vara multilaterala, det vill säga avtal som ett antal länder har slutit tillsammans.
