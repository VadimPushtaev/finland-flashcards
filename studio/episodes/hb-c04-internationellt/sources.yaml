    range_basis: normalized_html_block
    extracted_passage: Europeiska unionen (EU) är en politisk och ekonomisk sammanslutning av stater.
      År 2024 bestod den av 27 stater. Syftet med den är att främja fred och medborgarnas välfärd
      och förbättra handeln och ekonomin i Europa. Medlemsländerna i EU är självständiga stater.
      De måste ändå följa unionens beslut och bestämmelser.
