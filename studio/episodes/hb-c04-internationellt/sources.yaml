    range_basis: normalized_html_block
    extracted_passage: I EU fattas besluten av Europaparlamentet och ministerrådet. Medlemmarna i
      Europaparlamentet väljs genom val i varje medlemsland. Parlamentet representerar därför EU-ländernas
      medborgare. Ministerrådet i sin tur består av ministrar från EU:s medlemsländer. Det representerar
      därför de nationella regeringarna. Parlamentet och ministerrådet stiftar största delen av lagarna
      genom en medbeslutandeprocedur, där parlamentet har en jämlik ställning med ministerrådet.
      Ministerrådet ansvarar dock för till exempel EU:s utrikes- och säkerhetspolitik.
    normalization: whitespace_only
    repairs: []
