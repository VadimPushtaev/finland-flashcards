    range_basis: normalized_html_block
    extracted_passage: Finland blev medlem i EU år 1995. Då överfördes en del av det politiska beslutsfattandet
      i Finland till Europeiska unionen. EU-medlemskapet underlättar samarbetet med andra länder
      inom till exempel handeln. Inom EU får människor, varor och tjänster röra sig fritt. Finländska
      politiker deltar i alla viktiga beslut om utvecklingen av EU. Samtidigt lyfter de upp frågor
      som är viktiga för finländarna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
