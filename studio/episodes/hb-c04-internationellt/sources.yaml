    heading: Finland har också andra internationella åtaganden
    source_range:
      start: 0
      end: 347
    range_basis: normalized_html_block
    extracted_passage: Utöver Europeiska unionen hör Finland också till Nato och Förenta nationerna
      (FN). Finland är också medlem i många olika slags andra internationella organisationer. Genom
      dem kan Finland påverka internationellt och främja sina utrikespolitiska mål. Till exempel
      i FN har Finland försökt främja fred runt om i världen genom fredsbevarande insatser.
    normalization: whitespace_only
