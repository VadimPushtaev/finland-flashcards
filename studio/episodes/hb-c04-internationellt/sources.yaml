    range_basis: normalized_html_block
    extracted_passage: Finland blev medlem i Nordatlantiska fördragsorganisationen Nato år 2023.
      Nato är en politisk och militär allians med målet att främja säkerhet och frihet i sina medlemsländer.
      År 2024 var 32 länder medlemmar i Nato. Största delen av medlemsländerna ligger i Europa, förutom
