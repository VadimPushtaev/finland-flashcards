    range_basis: normalized_html_block
    extracted_passage: Exempel på internationella avtal är konventionerna om de mänskliga rättigheterna.
      En del av konventionerna om de mänskliga rättigheterna gäller alla människors rättigheter,
      andra i sin tur fokuserar särskilt på till exempel rättigheterna för barn eller personer med
      funktionsnedsättning. Andra internationella avtal är klimatavtal, där världens länder har kommit
      överens om hur de ska försöka bromsa den globala uppvärmningen.
