    heading: Registrering av föreningen
    source_range:
      start: 0
      end: 335
    range_basis: normalized_html_block
    extracted_passage: Det lönar sig att registrera sin förening. Då är föreningen en juridisk person
      vars medlemmar inte personligen bär ansvar för föreningens verksamhet. En registrerad förening
      kan ansöka om finansiering och bidrag samt samarbeta med andra föreningar och myndigheter.
      Föreningen registreras med anmälan till Patent- och registerstyrelsen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c04-u0202:
    source_path: data/infofinland/content/leisure/associations.html
