    range_basis: normalized_html_block
    extracted_passage: Föreningar bedriver sin verksamhet vanligen ett år i taget. De planerar sin
      verksamhet och sin ekonomi ett år fram i tiden. Ekonomin och bokföringen ska granskas i slutet
      av perioden.
    normalization: whitespace_only
