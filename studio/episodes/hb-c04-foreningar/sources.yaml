    range_basis: normalized_html_block
    extracted_passage: På många orter finns det också föreningar som bildats av nyanlända och som
      erbjuder samvaro, stöd och verksamhet för till exempel människor som flyttat till Finland från
      ett visst land eller ett visst område. Dessa föreningar kan vara bra ställen för kamratstöd
      från andra människor som flyttat till landet. I dem kan man till exempel fira högtider som
      hör till den egna kulturen tillsammans med andra.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
