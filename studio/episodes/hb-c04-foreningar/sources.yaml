    source_kind: p
    source_role: content
    heading: Att grunda en förening när stiftarna är utlänningar
    source_range:
      start: 0
      end: 185
    range_basis: normalized_html_block
    extracted_passage: Också utlänningar, d.v.s. personer som inte har finskt medborgarskap, kan
      grunda en registrerad förening. I detta fall ska både ordföranden och vice ordföranden ha sin
      hemort i Finland.
    normalization: whitespace_only
    repairs: []
