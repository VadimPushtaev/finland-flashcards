    heading: Föreningsverksamhet är en viktig del av det finländska medborgarsamhället
    source_range:
      start: 0
      end: 492
    range_basis: normalized_html_block
    extracted_passage: Syftet med föreningarnas verksamhet är inte att eftersträva vinst, utan den
      ger många fördelar för de människor som är verksamma i organisationerna och för hela samhället.
      Många organisationer försöker främja en idé, en fråga eller en viss grupps intressen i samhället.
      Idén kan vara politisk, religiös eller basera sig mer allmänt på värderingar. Organisationer
      kan till exempel bedriva kommunikations- och påverkansarbete för att försöka främja frågor
      som de anser vara viktiga i samhället.
    normalization: whitespace_only
