    heading: Föreningsverksamhet
    source_range:
      start: 0
      end: 448
    range_basis: normalized_html_block
    extracted_passage: Föreningsverksamhet är medborgarverksamhet där människor organiserar sig för
      en gemensam sak. Föreningsverksamhet är mycket populär i Finland. Det finns många olika slags
      föreningar, det vill säga organisationer och stiftelser, i landet. Organisationer kan bedriva
      påverkansarbete för att främja en idé eller förbättra situationen för en grupp människor. De
      kan också till exempel erbjuda människor motions-, idrotts-, kultur- eller socialtjänster.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
