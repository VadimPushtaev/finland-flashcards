    heading: Föreningsverksamhet är en viktig del av det finländska medborgarsamhället
    source_range:
      start: 0
      end: 415
    range_basis: normalized_html_block
    extracted_passage: Inom medborgarverksamheten deltar människor aktivt i utvecklingen av sitt
      samhälle, lär sig nya saker och arbetar tillsammans. Medborgarverksamhet bedrivs ofta i föreningar,
      det vill säga organisationer. År 2024 fanns det omkring 108 000 registrerade föreningar och
      omkring 2 700 stiftelser i Finland. Utöver dessa finns det också mängder av olika oregistrerade
      grupper, klubbar och andra sammanslutningar i landet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
