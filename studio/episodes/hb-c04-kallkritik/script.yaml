- sentence_id: hb-c04-u0230-s002
  sv: Medieinnehåll är både innehåll i traditionella medier, såsom tidningsartiklar och tv-nyheter, samt
    till exempel blogginlägg, inlägg på sociala medier och olika videor som sprids på internet.
  ru: Медиаконтент — это и содержание традиционных СМИ, такое как газетные статьи и телевизионные новости,
    и, например, публикации в блогах, публикации в социальных сетях и различные видео, распространяемые
    в интернете.
