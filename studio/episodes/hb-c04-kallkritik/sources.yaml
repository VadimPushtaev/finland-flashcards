    range_basis: normalized_html_block
    extracted_passage: Det finns inte nödvändigtvis alltid en enda entydig sanning om vissa saker.
      Olika människors upplevelser av samma händelse kan skilja sig mycket från varandra. I sådana
      fall kan det hända att två olika beskrivningar av en händelse till viss del kan vara sanna
      båda två. Ofta baserar sig ändå en del beskrivningar i högre grad på objektiva fakta än andra.
      Till exempel en bedömning av en expert som forskat i ett ämne är en pålitligare informationskälla
      än en vanlig människas personliga åsikt.
