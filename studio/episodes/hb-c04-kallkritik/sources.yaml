    heading: Kritisk mediekunnighet blir allt viktigare i dag
    source_range:
      start: 0
      end: 581
    range_basis: normalized_html_block
    extracted_passage: Kritisk mediekunnighet betyder att en människa kan granska medieinnehåll kritiskt.
      Medieinnehåll är både innehåll i traditionella medier, såsom tidningsartiklar och tv-nyheter,
      samt till exempel blogginlägg, inlägg på sociala medier och olika videor som sprids på internet.
      Kritisk betyder i fråga om mediekunnighet inte en negativ inställning eller motstånd. Det betyder
      att man är intresserad av att förstå medieinnehåll och varför man berättar om olika saker på
      ett visst sätt. En mediekunnig person kan kritiskt granska också såväl sin egen som andras
      aktivitet i olika medier.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
