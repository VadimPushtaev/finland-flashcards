    extracted_passage: Tekniken utvecklas hela tiden och gör det allt lättare att sprida falsk information.
      I dag är det till exempel med hjälp av artificiell intelligens möjligt att producera videor
      som ser väldigt äkta ut och där en person ser ut att göra något som hen aldrig har gjort i
