  decision: Episode-specific consecutive source-topic scenes below; read all body sentences/list fragments
    exactly once in stored source order without additions.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080/24fps, Chapter7 olive palette {''background'': ''#30371f'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d2d9b7'', ''highlight'': ''#e7bf78'', ''separator'': ''#636e42''}. Liberation Sans48/40
    with fixed right bilingual panel and left foreground picture area.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: 'Use File:Hakaniemi market hall.jpg by JIP | Talk.


    Original uploader was JIP at en.wikipedia continuously as decorative background, darkened 42% and
    blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=7.069345238095238.
    Foreground and bilingual text remain fixed.'
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,seed42,mono44100PCM16; initial2ONNXthreads
    with one selected1thread bounded age-component candidate. Pronunciation and whole-video mix still
    await listening; ASR cannot establish audible quality.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Pensif by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct instrumental
    track. Original master 129.071 seconds; prepared lossless stereo bed 989.708 seconds. Repeat count
    7, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music adjustment,
    ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Source-specific diagrams and verified photographs change at meaningful source-topic boundaries;
    aim>=50%actual narrated-body display duration. No speculative numerical data or updated legal/economic
    claims.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
