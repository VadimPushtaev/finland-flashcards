    arbetslöshetskassa (yrittäjien työttömyyskassa).
  ru: Если вы хотите получать обеспечение по безработице, соотнесённое с утраченным заработком, необходимо
    вступить в кассу по безработице предпринимателей (yrittäjien työttömyyskassa).
