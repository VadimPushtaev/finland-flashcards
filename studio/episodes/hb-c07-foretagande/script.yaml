- sentence_id: hb-c07-u0275-s001
  sv: Du kan få inkomstrelaterad dagpenning från företagarnas arbetslöshetskassa om du har bedrivit företagsverksamhet
    och varit medlem i kassan tillräckligt länge innan du blev arbetslös.
  ru: Вы можете получать пособие, соотнесённое с утраченным заработком, от кассы по безработице предпринимателей,
    если до наступления безработицы вы вели предпринимательскую деятельность и состояли в кассе достаточно
    долго.
  scene_id: scene-22
