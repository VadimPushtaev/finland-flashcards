    päiväraha) vid arbetslöshetskassan.
  ru: Если ваша предпринимательская деятельность прекращается, вы можете подать в кассу по безработице
    заявление на пособие, соотнесённое с утраченным заработком (ansiosidonnainen päiväraha).
