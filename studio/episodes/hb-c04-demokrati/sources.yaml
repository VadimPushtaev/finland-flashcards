    range_basis: normalized_html_block
    extracted_passage: En demokrati kan vara direkt, deltagande eller representativ. Med direkt demokrati
      avses till exempel att en fråga avgörs genom ett massmöte eller en folkomröstning. Beslutet
      baserar sig direkt på medborgarnas åsikt. Majoritetens åsikt vinner. När en medborgare deltar
      i en omröstning kan hen direkt påverka resultatet av den.
