    heading: Yttrandefrihet är en förutsättning för samhällsdebatten
    source_range:
      start: 0
      end: 669
    range_basis: normalized_html_block
    extracted_passage: Yttrandefrihet innebär till exempel att en person kan kritisera politiska
      beslutsfattare och makthavare om hen inte är nöjd med deras arbete. I Finland förs hela tiden
      livliga diskussioner i samhällsfrågor i till exempel tidningar och sociala medier. Vem som
      helst som bor i Finland kan delta i diskussionerna och skriva vad hen tycker i frågorna eller
      om beslutsfattarna. Man kan också kontakta politiker direkt för att berätta om sina tankar.
      Människorna kan kritisera politikernas arbete utan att bli föremål för påtryckningar eller
      hot. Också osakliga åsikter får framföras, men hatretorik regleras i lagstiftningen, och till
      exempel att hota människor är olagligt.
