    range_basis: normalized_html_block
    extracted_passage: Deltagande demokrati betyder olika sätt för människor att på ett friare sätt
      delta i det gemensamma beslutsfattandet. Deltagande demokrati är till exempel medborgarverksamhet
      eller att kommunen ordnar en invånarpanel, dit alla invånare i kommunen bjuds in för att diskutera
      en fråga som det ska fattas beslut i. Panelen fattar inget direkt beslut, men politikerna lyssnar
      på den och tar invånarnas synpunkter i beaktande när de fattar beslutet.
