    heading: Ju mer inkomster, desto högre skatteprocent
    source_range:
      start: 0
      end: 265
    range_basis: normalized_html_block
    extracted_passage: I Finland tillämpas progressiv beskattning när förvärvsinkomster beskattas.
      Det betyder att ju mer inkomster en person har, desto högre procent betalar hen i skatt. Om
      en person har hög lön är också skatteprocenten hög, och om lönen är liten är skatteprocenten
      låg.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0279:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
    source_block: b0006
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Skattesystemet i Finland
    source_range:
      start: 0
      end: 199
    range_basis: normalized_html_block
    extracted_passage: Skatt betalas på både förvärvs- och kapitalinkomster. Förvärvs- och kapitalinkomsterna
      beskattas på olika sätt. Kapitalinkomst är inkomster från förmögenhet. De övriga inkomsterna
      är förvärvsinkomst.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0280:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
    source_block: b0018
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Skattesystemet i Finland
    source_range:
      start: 0
      end: 377
    range_basis: normalized_html_block
    extracted_passage: I Finland är beskattningen progressiv. Det innebär att man på en stor lön
      betalar en större andel skatt än på en mindre lön. Skatteprocenten anger hur mycket skatt du
      betalar på dina inkomster. Den beräknas i Finland för var och en separat. Din makas/makes inkomster
      inverkar inte på din skatteprocent. Du kan uppskatta din skatteprocent med Skatteförvaltningens
      skatteräknare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0281:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
    source_block: b0019
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(5)
    source_kind: p
    source_role: content
    heading: Skattesystemet i Finland
    source_range:
      start: 0
      end: 473
    range_basis: normalized_html_block
    extracted_passage: Om du får lön drar arbetsgivaren av skatten från lönen och betalar den direkt
      till skattemyndigheten. För att kunna göra det behöver arbetsgivaren ett skattekort av dig.
      Skattekortet är ett dokument som anger din skatteprocent. Skatteförvaltningen räknar efter
      varje år om du har betalat tillräckligt med skatt på dina inkomster. Om du har betalat för
      mycket skatt får du skatteåterbäring. Om du har betalat för lite skatt ska du betala den återstående
      delen som kvarskatt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0282:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
    source_block: b0021
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(7)
    source_kind: p
    source_role: content
    heading: Skattesystemet i Finland
    source_range:
      start: 0
      end: 170
    range_basis: normalized_html_block
    extracted_passage: Kontrollera i lönespecifikationen och skattedeklarationen att arbetsgivaren
      har dragit av skatten från din lön och betalat den till skattemyndigheten. Spara lönekvittona.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0283:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
