    heading: Skatteåterbäring och kvarskatt
    source_range:
      start: 0
      end: 198
    range_basis: normalized_html_block
    extracted_passage: I beskattningsbeslutet ser du om du har betalat rätt mängd skatt. Om du har
      betalat för mycket skatt får du skatteåterbäring. Om du har betalat för lite i skatt blir du
      tvungen att betala kvarskatt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0291:
    source_path: data/infofinland/content/work-and-enterprise/taxation/tax-return-and-tax-decision.html
    sha256: 22b3b5da525fd52c83196d3b4fbbfb711a76e6fb178061daee3368e8ff4d53a4
    source_block: b0025
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(10) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Skatteåterbäring och kvarskatt
    source_range:
      start: 0
      end: 194
    range_basis: normalized_html_block
    extracted_passage: Om du har betalat för lite skatt under året ska du betala den återstående
      delen som kvarskatt. I beskattningsbeslutet eller på MinSkatt ser du alla uppgifter du behöver
      när du betalar kvarskatt.
    normalization: whitespace_only
    repairs: []
