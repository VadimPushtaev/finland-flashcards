  hb-c07-u0292:
    source_path: data/infofinland/content/work-and-enterprise/taxation/tax-card.html
    sha256: 110a427807afc30810947c9cddeaf5a25466cac027766cdfddee7059ea4fdd49
    source_block: b0024
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Skattenummer
    source_range:
      start: 0
      end: 361
    range_basis: normalized_html_block
    extracted_passage: Du behöver ett skattenummer om du arbetar på en byggarbetsplats eller ett
      varvsområde i Finland. Med hjälp av skattenumret kontrolleras att alla arbetstagare finns i
      Skatteförvaltningens register. Skattenumret ska framgå av den fotoförsedda namnskylt som du
      får av din arbetsgivare. Du får inte arbeta på en byggarbetsplats eller ett varvsområde utan
      namnskylt.
    normalization: whitespace_only
    repairs: []
