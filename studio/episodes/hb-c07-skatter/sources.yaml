    heading: Ju mer inkomster, desto högre skatteprocent
    source_range:
      start: 0
      end: 205
    range_basis: normalized_html_block
    extracted_passage: I Finland betalar människorna också många andra skatter. För produkter och
      tjänster betalas mervärdesskatt, bilägare betalar bilskatt, för arv betalas arvsskatt och fastighetsägare
      betalar fastighetsskatt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0278:
    source_path: data/orientation/sv/laromedel/arbete/att-arbeta-i-finland.html
