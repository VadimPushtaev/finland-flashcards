    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(8)
    source_kind: p
    source_role: content
    heading: Skattesystemet i Finland
    source_range:
      start: 0
      end: 132
    range_basis: normalized_html_block
    extracted_passage: Förutom skatterna drar arbetsgivaren av från din lön obligatoriska försäkringspremier
      till exempel för arbetslöshet och insjuknande.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0284:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
    source_block: b0027
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Beskattningen när du börjar arbeta i Finland
    source_range:
      start: 0
      end: 483
    range_basis: normalized_html_block
    extracted_passage: Om du vistas i Finland i mer än sex månader, ska du i allmänhet betala skatt
      på alla dina inkomster till Finland. Detta gäller även de inkomster som du får från utlandet.
      Du ska i allmänhet också betala de obligatoriska försäkringspremierna till Finland. Om du har
      en finländsk arbetsgivare bestäms din skatteprocent enligt inkomsterna för hela året. Skatteprocenten
      är desto större ju mer du har löneinkomster. Du behöver en finländsk personbeteckning och ett
      finländskt skattekort.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0285:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
    source_block: b0028
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Beskattningen när du börjar arbeta i Finland
    source_range:
      start: 0
      end: 538
    range_basis: normalized_html_block
    extracted_passage: Om du vistas i Finland i högst sex månader och din arbetsgivare är ett utländskt
      företag, behöver du i allmänhet inte betala skatt till Finland. Om din arbetsgivare dock är
      finländare eller om din utländska arbetsgivare har en arbetsplats i Finland, betalar du skatt
      i Finland. Du kan söka progressiv beskattning, om du bor i ett land som hör till Europeiska
      ekonomiska samarbetsområdet eller i ett land med vilket Finland har ett skatteavtal. I annat
      fall betalar du en källskatt på 35 procent på lönen och du behöver ett källskattekort.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0286:
    source_path: data/infofinland/content/work-and-enterprise/taxation.html
    sha256: b80eae598b212ddfbc1308c1136c09e39eab9271d18abe604c908ad2f4bd1922
    source_block: b0029
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Beskattningen när du börjar arbeta i Finland
    source_range:
      start: 0
      end: 268
    range_basis: normalized_html_block
    extracted_passage: Om du har sjukförsäkring i Finland förordnar Skatteförvaltningen dig arbetstagarens
      sjukförsäkringsavgift. Du betalar dock inte sjukförsäkringsavgift i Finland om du har ett A1-intyg
      eller liknande intyg med vilket du påvisar att du är försäkrad i det land där du bor.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0287:
    source_path: data/infofinland/content/work-and-enterprise/taxation/tax-return-and-tax-decision.html
    sha256: 22b3b5da525fd52c83196d3b4fbbfb711a76e6fb178061daee3368e8ff4d53a4
    source_block: b0007
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Skattedeklaration
    source_range:
      start: 0
      end: 260
    range_basis: normalized_html_block
    extracted_passage: I skattedeklarationen ser du uppgifterna om dina inkomster, skatter och avdrag
      under det föregående året. Kontrollera skattedeklarationen och komplettera och rätta till uppgifterna
      i webbtjänsten MinSkatt. Om uppgifterna är korrekta behöver du inte göra något.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0288:
    source_path: data/infofinland/content/work-and-enterprise/taxation/tax-return-and-tax-decision.html
    sha256: 22b3b5da525fd52c83196d3b4fbbfb711a76e6fb178061daee3368e8ff4d53a4
    source_block: b0011
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Kontrollera dina avdrag
    source_range:
      start: 0
      end: 233
    range_basis: normalized_html_block
    extracted_passage: Du kan i beskattningen få avdrag som minskar beloppet på skatt som betalas.
      Skatteförvaltningen gör en del avdrag automatiskt, men en del måste du själv anmäla. Du kan
      anmäla avdragen på ditt skattekort eller i din skattedeklaration.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0289:
    source_path: data/infofinland/content/work-and-enterprise/taxation/tax-return-and-tax-decision.html
    sha256: 22b3b5da525fd52c83196d3b4fbbfb711a76e6fb178061daee3368e8ff4d53a4
    source_block: b0020
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(9) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Beskattningsbeslut
    source_range:
      start: 0
      end: 485
    range_basis: normalized_html_block
    extracted_passage: Utfallet av din beskattning för föregående året ser du på ditt beskattningsbeslut.
      Om du gör ändringar i din på förhand ifyllda skattedeklaration eller Skatteförvaltningen får
      från annanstans (till exempel av din arbetsgivare) uppgifter som påverkar din beskattning,
      får du ett nytt beskattningsbeslut. I beskattningsbeslutet finns en beräkning på utfallet av
      din beskattning. Du kan behöva beskattningsbeslutet till exempel då du söker hyresbostad eller
      du förordnas dagvårdsavgifter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0290:
    source_path: data/infofinland/content/work-and-enterprise/taxation/tax-return-and-tax-decision.html
    sha256: 22b3b5da525fd52c83196d3b4fbbfb711a76e6fb178061daee3368e8ff4d53a4
    source_block: b0023
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
