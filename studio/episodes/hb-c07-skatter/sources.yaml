    heading: Ju mer inkomster, desto högre skatteprocent
    source_range:
      start: 0
      end: 456
    range_basis: normalized_html_block
    extracted_passage: I Finland måste alla betala skatt. Med skattepengarna tillhandahåller staten
      omfattande offentlig service, som främjar medborgarnas välbefinnande. Människorna betalar skatt
      på sina förvärvsinkomster. Förvärvsinkomster är till exempel lön, arbetslöshetsdagpenning,
      pension och studiestöd. Arbetsgivaren eller den som betalar förmånerna, till exempel FPA, drar
      av skatterna på lönen eller förmånen automatiskt och betalar dem direkt till Skatteförvaltningen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0277:
