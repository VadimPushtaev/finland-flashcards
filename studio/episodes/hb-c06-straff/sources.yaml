    range_basis: normalized_html_block
    extracted_passage: Om en person begår ett brott, får hen en anteckning i straffregistret. Straffregistret
      är en databas med uppgifter om alla som är dömda för brott. Böter ger i allmänhet ingen anteckning
      i straffregistret, medan alla andra straff gör det.
