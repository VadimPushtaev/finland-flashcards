    range_basis: normalized_html_block
    extracted_passage: Om brottet inte är särskilt allvarligt, kan straffet vara böter, som betalas
      till staten. Andra vanliga straff i Finland är fängelse, samhällstjänst och övervakningsstraff.
      Ett fängelsestraff kan vara ovillkorligt, varvid straffet avtjänas i fängelse, eller villkorligt.
      Villkorligt fängelsestraff betyder att den dömde inte hamnar direkt i fängelse, utan får en
      prövotid. Om hen inte gör sig skyldig till nya brott under prövotiden, behöver hen inte avtjäna
      straffet i fängelse.
    normalization: whitespace_only
    repairs: []
