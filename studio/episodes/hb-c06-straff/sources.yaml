    heading: Polis eller åklagare kan utdöma ordningsböter eller dagsböter utan rättegång
    source_range:
      start: 0
      end: 411
    range_basis: normalized_html_block
    extracted_passage: Om det är fråga om ett lindrigt brott, kan polisen eller åklagaren utdöma
      ordningsböter eller dagsböter. Då inleds ingen straffprocess och ärendet behandlas inte i rätten.
      Både den som böterna utdöms till och det eventuella offret för brottet ska gå med på att ärendet
      behandlas i ett bötesförfarande. Om antingen gärningsmannen eller offret motsätter sig ett
      bötesförfarande, inleds en straffprocess i ärendet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
