    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:House with a garden in Vartiosaari, Helsinki, Finland, 2020 July.jpg by Antti T.
    Nissinen continuously as decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal
    pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting
    in motion, with no sentence resets. Total cycles=2.8592261904761904. Foreground and bilingual text
    remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Simple Duet by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 199.344 seconds; prepared lossless stereo bed 400.292 seconds.
    Repeat count 2, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
