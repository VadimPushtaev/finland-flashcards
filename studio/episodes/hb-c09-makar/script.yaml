scenes:
- id: scene-1
  description: Vardera maken har rätt att själv besluta om sitt deltagande i förvärvsarbete samt i samhällelig
    och annan verksamhet utanför familjen.
- id: scene-2
  description: Vardera maken ska efter förmåga bidra till familjens gemensamma hushåll och makarnas underhåll.
- id: scene-3
  description: Enligt lagen har varje människa sexuell självbestämmanderätt i äktenskapet och alla parförhållanden.
- id: scene-4
  description: Man har rätt att få information om sin makes hälsotillstånd av till exempel en läkare endast
    med makens samtycke.
- id: scene-5
  description: Makarna i ett äktenskap kan ha gemensam egendom, men också egen egendom.
- id: scene-6
  description: Vardera maken ansvarar ensam för den skuld som de har tagit före äktenskapet eller under
    det.
- id: scene-7
  description: Makarnas ekonomiska ställning sinsemellan tryggas genom giftorätten.
- id: scene-8
  description: Giftorätten träder i kraft först när ett äktenskap upphör.
- id: scene-9
  description: Om makarna vill hålla sina egendomar åtskilda, kan de upprätta ett äktenskapsförord.
- id: scene-10
  description: Äktenskapsförord är frivilligt.
- id: scene-11
  description: Vanligtvis delas egendomen vid skilsmässa jämnt mellan makarna.
- id: scene-12
  description: Bodelningen kan jämkas endast om någon av makarna separat kräver det.
