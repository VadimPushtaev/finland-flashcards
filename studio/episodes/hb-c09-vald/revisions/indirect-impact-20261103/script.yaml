episode_decisions:
- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Neutral protection, legal, control and consequence diagrams describe violence without staging
    acts or assigning victim status to photographed people. Preserve source consent, responsibility, age
    boundaries and same-development-stage qualification; use a verified actual police exterior only for
    reporting.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Imatran virastotalo ja poliisiasema 1.JPG by MKFI continuously as decorative background,
    darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative
    zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets. Total
    cycles=3.1416666666666666. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Heartbreaking by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 96.048 seconds; prepared lossless stereo bed 439.833 seconds.
    Repeat count 4, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: Våld är ett brott i Finland.
- id: scene-2
  description: Våld i nära relationer är våld som sker inom familjen.
- id: scene-3
  description: Det påverkar alla familjemedlemmar, inte bara den som utsätts för våldet.
- id: scene-4
  description: Fysiskt våld är ofta lätt att känna igen som våld.
- id: scene-5
  description: Våld kan också vara ekonomiskt.
- id: scene-6
  description: Typiskt för våld i nära relationer är att det först börjar med psykiskt våld, det vill
    säga med till exempel ett kontrollerande beteende.
- id: scene-7
  description: Om det förekommer våld i familjen är det viktigt att anmäla det till polisen.
- id: scene-8
  description: Att fysiskt aga och misshandla ett barn kan orsaka allvarliga skador, till och med dödsfall.
- id: scene-9
  description: Om en förälder eller ett syskon utnyttjar ett barn sexuellt, är det fråga om särskilt allvarligt
    sexuellt våld och incest.
- id: scene-10
  description: Ett barn är aldrig skyldigt till det utnyttjande som hen utsätts för, utan ansvaret ligger
    alltid hos den vuxne.
- id: scene-11
  description: Användning av våld eller hot om våld påverkar alltid barnen, även om våldet inte skulle
    rikta sig mot dem.
- id: scene-12
  description: Barn kan uppleva att till exempel våld mot mamman är mer skrämmande än våld som de själva
    utsätts för.
- id: scene-13
  description: Våld och rädsla för våld kan ge barnet ångest, glädjelöshet och sömnsvårigheter.
- id: scene-14
  description: Skyddsåldersgränsen för sexuellt umgänge är 16 år.
- id: scene-15
  description: De vuxna måste skydda barn från sexuella trakasserier.
