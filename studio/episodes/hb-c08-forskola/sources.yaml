    range_basis: normalized_html_block
    extracted_passage: I Finland ska barnen delta i förskoleundervisning under ett års tid innan
      läroplikten börjar. Vanligtvis börjar förskoleundervisningen det år då barnet fyller sex år.
      Förskoleundervisningen ordnas av kommunerna och är kostnadsfri för familjen. Förskoleundervisningen
      ges av högutbildade pedagoger inom småbarnspedagogik. Förskoleundervisning ges vanligtvis fyra
      timmar om dagen från måndag till fredag under skolans verksamhetstider. Barnet kan utöver förskoleundervisning
      delta även i småbarnspedagogik.
