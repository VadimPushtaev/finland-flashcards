    extracted_passage: Huvudansvaret för genomförandet av förskoleundervisningen ligger på lärarna,
      som vanligtvis har en utbildning som lärare inom småbarnspedagogik eller som klasslärare. I
      förskolegrupperna arbetar också en annan lärare, barnskötare eller assistent. Förskolepersonalen
      diskuterar regelbundet barnets fostran och utveckling tillsammans med föräldrarna och vårdnadshavarna.
