    range_basis: normalized_html_block
    extracted_passage: Förskoleundervisningen är avgiftsfri, och under förskoledagen får barnen en
      avgiftsfri varm måltid. Undervisning ges i allmänhet fyra timmar per dag. Också läromedlen
      är avgiftsfria. Om föräldrarna arbetar, deltar barnet vanligtvis i småbarnspedagogik på eftermiddagen
      efter förskoleundervisningen. Då betalar föräldrarna normal klientavgift för småbarnspedagogik
      för halva dagen.
    normalization: whitespace_only
