    range_basis: normalized_html_block
    extracted_passage: När ett barn är sex år gammalt, det vill säga året innan läroplikten börjar,
      deltar hen i förskoleundervisning. Syftet med förskoleundervisningen är att främja barnets
      förutsättningar att växa, utvecklas och lära sig. Förskoleundervisningen pågår i ett år innan
      skolan börjar. Det är bindande att delta i förskoleundervisning eller annan verksamhet som
      uppnår målen för förskoleundervisningen. I talspråk kallas förskoleundervisningen ofta för
      förskola.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
