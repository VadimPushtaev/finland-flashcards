    range_basis: normalized_html_block
    extracted_passage: Inom förskoleundervisningen får barnet färdigheter som hen kan använda för
      att lära sig nya saker. Förskoleundervisningen stärker barnets sociala färdigheter och självkänsla.
      Syftet är att ge barnen positiva upplevelser av lärande och främja deras språkliga utveckling.
      Barnen lär sig genom att leka och utforska tillsammans och med hjälp av fantasin.
