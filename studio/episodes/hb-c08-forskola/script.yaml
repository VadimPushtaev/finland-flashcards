scenes:
- id: hb-c08-u0031
  description: När ett barn är sex år gammalt, det vill säga året innan läroplikten börjar, deltar hen
    i förskoleundervisning.
- id: hb-c08-u0032
  description: Huvudansvaret för genomförandet av förskoleundervisningen ligger på lärarna, som vanligtvis
    har en utbildning som lärare inom småbarnspedagogik eller som klasslärare.
- id: hb-c08-u0033
  description: Förskoleundervisningen är avgiftsfri, och under förskoledagen får barnen en avgiftsfri
    varm måltid.
- id: hb-c08-u0034
  description: Inom förskoleundervisningen får barnet färdigheter som hen kan använda för att lära sig
    nya saker.
- id: hb-c08-u0035
  description: Lärarna inom förskoleundervisningen beaktar barnets utvecklingsnivå.
- id: hb-c08-u0036
  description: I Finland ska barnen delta i förskoleundervisning under ett års tid innan läroplikten börjar.
