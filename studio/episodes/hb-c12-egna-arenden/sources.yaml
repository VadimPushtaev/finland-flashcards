      end: 251
    range_basis: normalized_html_block
    extracted_passage: Var och en ansvarar själv för att man har gett en myndighet korrekta och aktuella
      uppgifter. Att lämna felaktiga uppgifter kan leda till ett felaktigt beslut. Att avsiktligen
      lämna felaktiga uppgifter till en myndighet kan till och med leda till åtal.
