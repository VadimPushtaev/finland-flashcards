    heading: Uppgifterna om en själv ska hållas uppdaterade
    source_range:
      start: 0
      end: 354
    range_basis: normalized_html_block
    extracted_passage: Kunden ska alltid meddela myndigheten om hens situation förändras på något
      väsentligt sätt. Om man till exempel får bostadsbidrag från FPA, måste man meddela om man flyttar
      till en annan bostad eller om inkomsterna förändras. Om FPA betalar ut för mycket stöd på grund
      av felaktiga uppgifter eller en flytt utomlands kräver myndigheten tillbaka pengarna.
    normalization: whitespace_only
