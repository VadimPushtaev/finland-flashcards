    heading: Var och en har rätt att själv sköta sina ärenden
    source_range:
      start: 0
      end: 428
    range_basis: normalized_html_block
    extracted_passage: Ibland kan en person inte sköta ett visst ärende själv, till exempel om hen
      är sjuk eller på resa. Då är det vanligtvis möjligt för hen att ge någon annan fullmakt att
      sköta ärendet för hens räkning. Det är bra att utfärda fullmakten skriftligt, och för det finns
      färdiga mallar. Det är alltid frivilligt att ge en fullmakt. Ingen får utöva påtryckning på
      någon annan för att hen ska ge upp sin makt att sköta sina egna ärenden.
    normalization: whitespace_only
