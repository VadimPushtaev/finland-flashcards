    heading: Var och en har rätt att själv sköta sina ärenden
    source_range:
      start: 0
      end: 309
    range_basis: normalized_html_block
    extracted_passage: Myndigheterna får i allmänhet inte lämna ut uppgifter till andra än den som
      uppgifterna gäller. Uppgifter om barn får lämnas ut till de officiella vårdnadshavarna. I vissa
      fall måste också ett minderårigt barn först själv ge samtycke till att exempelvis hens hälsouppgifter
      får lämnas ut till vårdnadshavarna.
    normalization: whitespace_only
