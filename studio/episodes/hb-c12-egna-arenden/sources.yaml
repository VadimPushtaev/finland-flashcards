    source_range:
      start: 0
      end: 465
    range_basis: normalized_html_block
    extracted_passage: Det är annars också viktigt att se till att lämna in nödvändiga ansökningar
      och anmälningar till myndigheter i rätt tid. Till exempel den förhandsifyllda skattedeklarationen
      som skatteförvaltningen skickar ut måste kontrolleras och eventuella ändringar meddelas före
      tidsfristen löper ut. Om man låter bli att korrigera fel i skattedeklarationen och inte meddelar
      en inkomst man fått kan man göra sig skyldig till kringgående av skatt, som är en straffbar
      handling.
    normalization: whitespace_only
