    range_basis: normalized_html_block
    extracted_passage: När en kund ger en myndighet uppgifter om sig själv och sin situation försäkrar
      hen att uppgifterna är korrekta. Därför är det viktigt att fråga om råd eller en förklaring
      om man inte förstår till exempel en punkt på en blankett. Annars kan man av misstag lämna felaktiga
      uppgifter.
    normalization: whitespace_only
