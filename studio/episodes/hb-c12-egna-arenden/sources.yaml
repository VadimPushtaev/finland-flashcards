    range_basis: normalized_html_block
    extracted_passage: Myndigheter fattar i allmänhet sina beslut på basen av människors ansökningar
      om en tjänst eller ett beslut. När man ansöker om ett beslut, en tjänst, en förmån eller ett
      bidrag ska ansökan göras noggrannt, och uppgifterna i ansökan måste vara korrekta. När man
      undertecknar ansökan förbinder man sig till att ge endast korrekt och sanningsenlig information.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
