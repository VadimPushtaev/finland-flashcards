    heading: Var och en har rätt att själv sköta sina ärenden
    source_range:
      start: 0
      end: 455
    range_basis: normalized_html_block
    extracted_passage: I Finland utgår man ifrån att vuxna människor själva sköter sina myndighetsärenden.
      Det är alltså inte vanligt att till exempel mannen sköter myndighetsärenden för sin frus räkning.
      Bakgrunden till detta är en individuell och jämställd kultur, där var och en har rätt att ha
      kontroll över sina egna uppgifter och att själv ingå de avtal som gäller en själv. Att sköta
      sina egna ärenden främjar också människans integration och ökar känslan av delaktighet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
