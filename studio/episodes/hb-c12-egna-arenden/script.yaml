    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0070
  description: Myndigheter fattar i allmänhet sina beslut på basen av människors ansökningar om en tjänst
    eller ett beslut.
- id: hb-c12-u0071
  description: Kunden måste ge myndigheten de uppgifter och dokument som behövs för att ansökan ska kunna
    behandlas.
- id: hb-c12-u0072
  description: Kunden ska alltid meddela myndigheten om hens situation förändras på något väsentligt sätt.
- id: hb-c12-u0073
  description: Om man har låtit bli att berätta om förändrade omständigheter kan man utöver återbetalning
    i värsta fall åtalas för brott.
- id: hb-c12-u0074
  description: Det är annars också viktigt att se till att lämna in nödvändiga ansökningar och anmälningar
    till myndigheter i rätt tid.
- id: hb-c12-u0075
  description: Likaså måste man ansöka om fortsatt uppehållstillstånd i tid innan uppehållstillståndet
    löper ut.
- id: hb-c12-u0076
  description: När en kund ger en myndighet uppgifter om sig själv och sin situation försäkrar hen att
    uppgifterna är korrekta.
- id: hb-c12-u0077
  description: Var och en ansvarar själv för att man har gett en myndighet korrekta och aktuella uppgifter.
- id: hb-c12-u0078
  description: I Finland utgår man ifrån att vuxna människor själva sköter sina myndighetsärenden.
- id: hb-c12-u0079
  description: Myndigheterna får i allmänhet inte lämna ut uppgifter till andra än den som uppgifterna
    gäller.
- id: hb-c12-u0080
  description: Ibland kan en person inte sköta ett visst ärende själv, till exempel om hen är sjuk eller
    på resa.
