      end: 368
    range_basis: normalized_html_block
    extracted_passage: Det är möjligt att avlägga gymnasiets studentexamen och en yrkesinriktad grundexamen
      inom samma studier. Då pratar man om en dubbelexamen. Gymnasiestudierna avläggs ofta på ett
      vuxengymnasium så att man studerar gymnasieämnen två dagar i veckan. Läroämnena inom den yrkesinriktade
      grundexamen studeras tre dagar i veckan. En dubbelexamen avläggs i allmänhet på 3,5 år.
