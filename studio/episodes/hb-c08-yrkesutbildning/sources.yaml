    range_basis: normalized_html_block
    extracted_passage: En läroavtalsutbildning innebär att den studerande studerar ett yrke i ett
      anställningsförhållande på en arbetsplats samtidigt som hen arbetar. Den studerande ingår ett
      tidsbundet arbetsavtal med arbetsgivaren. Dessutom ingår utbildningsanordnaren, det vill säga
      läroanstalten, och arbetsgivaren ett avtal om ordnandet av läroavtalsutbildningen. Den studerande
      ska själv hitta en lämplig arbetsplats. För arbetsdagarna får den studerande normal lön. I
      studierna ingår också dagar med studier på läroanstalten.
