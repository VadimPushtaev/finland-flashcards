    range_basis: normalized_html_block
    extracted_passage: Inom yrkesutbildningar studerar man ett yrke och de färdigheter som krävs
      för det i teori och praktik. De teoretiska studierna kopplas till praktiska arbetsuppgifter.
      Den som avlagt examen har utbildning och kompetens för ett visst yrke. Yrken som man utexamineras
      till efter avlagd grundexamen är till exempel frisör, närvårdare, busschaufför, bilmekaniker,
      kock, elmontör och IT-supporter. De populäraste utbildningsområdena är teknikområdet och hälso-
      och välfärdsområdet.
