    extracted_passage: Barnets ställning är så gott som densamma oavsett om hens föräldrar är gifta
      eller inte. Barnet kan få vilket som helst av föräldrarnas efternamn och har rätt att ärva
      sina föräldrar och få familjepension om den ena föräldern dör. Båda föräldrarna är skyldiga
      att försörja sitt barn, även om de inte skulle vara gifta.
