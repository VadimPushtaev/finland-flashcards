    source_range:
      start: 0
      end: 262
    range_basis: normalized_html_block
    extracted_passage: Om samborna förvärvar egendom tillsammans ska båda parterna antecknas som
      köpare och alla kvitton sparas. Då delas denna egendom jämnt om samboförhållandet upphör. Om
      bara en av parterna står som köpare är denne ägare till egendomen när samboförhållandet upphör.
    normalization: whitespace_only
