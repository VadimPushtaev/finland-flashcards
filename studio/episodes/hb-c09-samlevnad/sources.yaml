    heading: I Finland är det mycket vanligt att leva i ett samboförhållande
    source_range:
      start: 0
      end: 462
    range_basis: normalized_html_block
    extracted_passage: Inget skriftligt avtal ingås om ett samboförhållande. Inför lagen har sambor
      inte samma rättigheter och skyldigheter som gifta par. Sambor är inte underhållsskyldiga gentemot
      varandra, det vill säga den ena maken behöver inte försörja den andra om hen till exempel blir
      arbetslös. Om den ena maken dör, ärver inte den andra hen, om det inte finns ett testamente
      över arvet. Samborna kommer tillsammans överens om hur de delar på familjens inkomster och
      utgifter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
