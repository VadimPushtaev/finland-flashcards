    heading: I Finland är det mycket vanligt att leva i ett samboförhållande
    source_range:
      start: 0
      end: 328
    range_basis: normalized_html_block
    extracted_passage: I Finland är det vanligt att par inte ingår äktenskap, även om de är tillsammans
      i ett stadigvarande förhållande. Om två makar inte är gifta men bor tillsammans, har de ett
      samboförhållande. Då är de sambor med varandra. Samboförhållande är inte ett officiellt civilstånd,
      det vill säga det anges inte i befolkningsdatasystemet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
