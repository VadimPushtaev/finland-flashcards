    source_kind: p
    source_role: content
    heading: Upphörande av ett samboförhållande
    source_range:
      start: 0
      end: 297
    range_basis: normalized_html_block
    extracted_passage: I vissa fall kan den ena sambon få jämkning av den andra sambon när paret
      skiljer sig. En sambo kan få jämkning om han eller hon till exempel genom arbete hjälpt den
      andra sambon att utöka sin egendom och för att det därför skulle vara orättvist att fördela
      egendomen enbart baserat på ägarskapet.
    normalization: whitespace_only
    repairs: []
