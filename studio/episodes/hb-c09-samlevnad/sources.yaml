    range_basis: normalized_html_block
    extracted_passage: Ett samboförhållande upphör när parterna inte längre bor på samma adress.
      Upphörandet av samboförhållandet kan påverka till exempel de stöd som FPA betalar och barnens
      dagvårdsavgifter. Du ska själv meddela att samboförhållandet har upphört.
    normalization: whitespace_only
