    sha256: 7189a5f51265da675ba22a553fc1bc274c816b60e387887065357356a9b65c94
    source_block: b0011
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(4) > p:nth-of-type(9)
    source_kind: p
    source_role: content
    heading: Upphörande av ett samboförhållande
    source_range:
      start: 0
      end: 465
    range_basis: normalized_html_block
    extracted_passage: Sambor kan dock upprätta ett testamente (testamentti) för det fall att någon
      avlider. Genom testamente kan de säkerställa att en viss egendom, till exempel den gemensamma
      bostaden, ärvs av sambon. Sambor kan även upprätta ett skriftligt avtal om hur egendomen ska
      fördelas om paret går isär. Om du vill upprätta ett avtal eller ett testamente för fördelning
      av egendomen i ett samboförhållande, kan du be om råd till exempel vid rättshjälpsbyrån eller
      av en jurist.
    normalization: whitespace_only
    repairs: []
