- id: music_selection
  decision: Use Swimmey Texture by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 64.575 seconds; prepared lossless stereo bed 390.500 seconds.
    Repeat count 6, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
