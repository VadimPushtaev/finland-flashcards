scenes:
- id: scene-1
  description: Civilstånd är en uppgift som införs i Finlands befolkningsdatasystem.
- id: scene-2
  description: I Finland är det vanligt att par inte ingår äktenskap, även om de är tillsammans i ett
    stadigvarande förhållande.
- id: scene-3
  description: Inget skriftligt avtal ingås om ett samboförhållande.
- id: scene-4
  description: Barnets ställning är så gott som densamma oavsett om hens föräldrar är gifta eller inte.
- id: scene-5
  description: Ni kan ta ett gemensamt efternamn om
- id: scene-6
  description: ni har gemensamma barn eller
- id: scene-7
  description: om ni har bott tillsammans minst fem år.
- id: scene-8
  description: Om ni bor stadigvarande tillsammans i samma bostad, hör ni till samma hushåll.
- id: scene-9
  description: Ett samboförhållande upphör när parterna inte längre bor på samma adress.
- id: scene-10
  description: I ett samboförhållande behåller vardera part sin egen egendom.
- id: scene-11
  description: Om samborna förvärvar egendom tillsammans ska båda parterna antecknas som köpare och alla
    kvitton sparas.
- id: scene-12
  description: Sambor kan ha sådan egendom om vars ägande de inte har en överenskommelse.
- id: scene-13
  description: I vissa fall kan den ena sambon få jämkning av den andra sambon när paret skiljer sig.
- id: scene-14
  description: Sambor kan dock upprätta ett testamente (testamentti) för det fall att någon avlider.
