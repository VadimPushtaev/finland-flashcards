  decision: Use File:Nykäsenranta Oulu 20220307.jpg by Estormiz continuously as decorative background,
    darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative
