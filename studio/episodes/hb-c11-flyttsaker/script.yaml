- sentence_id: hb-c11-u0262-s001
  sv: Om du flyttar till Finland från ett land utanför EU (eller från ett land utanför EU:s tull- och
    skatteområde) måste du dock göra en tulldeklaration för flyttsakerna till de finländska tullmyndigheterna.
  ru: Однако если вы переезжаете в Финляндию из страны, не входящей в Европейский союз (EU), или из страны
    за пределами таможенной и налоговой территории ЕС, вам необходимо подать таможенную декларацию на
    перевозимые при переезде вещи в таможенные органы Финляндии.
