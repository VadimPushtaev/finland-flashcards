- id: story_structure
  decision: Preserve every exact source sentence/list fragment once. Episode-specific scenes below follow
    institutional distinctions and explain their relationships in the original source order.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920×1080 at24fps. Chapter4 warm umber #382d24, ivory #faf3e8, secondary #dfcfbb, gold #dfb96f,
    separator #695540. Liberation Sans Bold48/Regular40 with44/36 or40/34 only where necessary. Stable
    right bilingual text panel, separate steady source-term cards at selected explanatory turns.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display text 0.25 seconds before speech. Moderate local voice speed0.95; allow 1.5 seconds
    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Polling station Allitie 3 Oulu 20230402.jpg by Estormiz continuously as decorative
    background, darkened 42% and blurred 2.5px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=4.373511904761904. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Kalimba Relaxation Music by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 428.069 seconds; prepared lossless stereo bed 612.292
    seconds. Repeat count 1, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Sparse exact-source date and concept cards at selected factual turning points. Background
    remains visible otherwise. These typography cards do not imply historical event imagery; suppress
    redundant captions.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two readable15second credit cards over continuing photo. Full source and media attribution
    travels beside final MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
