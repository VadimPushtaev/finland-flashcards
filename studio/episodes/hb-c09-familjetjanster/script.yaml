- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Preventive support and voluntary family assistance lead into conditional home-service fees,
    financial help, school and youth services. Physical cleaning, reading and service institutions may
    use object photos; no real family is labelled a client.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Nummela-perhekeskus.jpg by Abc10 continuously as decorative background, darkened
    42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=3.204761904761905.
    Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Crossing the Divide by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 193.071 seconds; prepared lossless stereo bed 448.667
    seconds. Repeat count 2, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: Föräldrarna ansvarar för omsorgen om och uppfostran av barnet.
- id: scene-2
  description: Familjer kan ta del av många olika slags tjänster som kan underlätta vardagen och förhindra
    problem.
- id: scene-3
  description: Om stödet som ges via de tjänster som är gemensamma för alla inte är tillräckligt, kan
    man få hjälp via socialtjänsterna för barnfamiljer.
- id: scene-4
  description: Hemservice innebär att familjen får hembesök av en yrkesperson som hjälper till med hushållssysslor,
    till exempel städning, inköp eller barnomsorg.
- id: scene-5
  description: En stödperson hjälper barnet med till exempel hobbyer och läxor.
- id: scene-6
  description: Utgångspunkten är att man försöker hjälpa barnet på ett sådant sätt att hen kan bo hemma
    med sin familj.
- id: scene-7
  description: Om familjen har fått en baby, om en vuxen person i familjen är utmattad eller om familjen
    befinner sig i någon annan särskild situation kan man ansöka om hemservice.
- id: scene-8
  description: Om du har problem med att betala räkningar, kan du få hjälp med och rådgivning om ekonomin.
- id: scene-9
  description: Om ett barn eller en ung har problem i skolan eller med studierna är det bra att diskutera
    situationen med skolans eller läroanstaltens studievägledare.
- id: scene-10
  description: Om ett barn eller en ung blir mobbad i skolan är det skolans skyldighet att ingripa i detta.
- id: scene-11
  description: Om en ung har problem med alkohol, droger eller spelande, kan hen få hjälp vid ungdomsstationen
    (nuorisoasema).
- id: scene-12
  description: Brott har påföljder för personer under 15 år.
