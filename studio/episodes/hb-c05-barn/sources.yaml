    heading: Barnets föräldrar är vanligtvis också hens vårdnadshavare
    source_range:
      start: 61
      end: 504
    range_basis: normalized_html_block
    extracted_passage: Vårdnadshavarna är i allmänhet barnets föräldrar. Ibland kan vårdnadshavaren
      vara någon annan. Vårdnadshavaren beslutar om barnets omsorg, uppfostran, boendeort och andra
      viktiga frågor. Enligt finsk lag måste man ändå lyssna på barnets önskemål i frågor som rör
      hen. Barnet ska ha en trygg livsmiljö och positiva och nära relationer till andra människor.
      Vårdnadshavaren är skyldig att se till barnets välbefinnande och harmoniska utveckling.
    normalization: whitespace_only
    repairs: []
    selection: Retain six complete sentences on guardianship responsibilities and listening to the
      child; omit the opening one-or-two guardian cap, which is not qualified in this archived paragraph.
      Chapter09 provides the fuller at-least-one guardian wording from InfoFinland.
