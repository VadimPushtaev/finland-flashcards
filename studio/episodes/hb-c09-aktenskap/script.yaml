episode_decisions:
- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Paragraph and source-list groups retain their original progression. Source-specific illustrations
    explain the exact relationships without adding contemporary law or statistics.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Triple wedding in Porvoo 1965 (JOKAÖN3A B04-1).tif by Photographer unrecorded; Borgåbladet
    / JOKA Journalistinen kuva-arkisto / Museovirasto continuously as decorative background, darkened
    42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=3.063095238095238.
    Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Canon in D for Autoharp by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 339.618 seconds; prepared lossless stereo bed 428.833
    seconds. Repeat count 1, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: År 2023 var uppemot två miljoner av invånarna i Finland gifta.
- id: scene-2
  description: 'Du kan gifta dig om du:'
- id: scene-3
  description: är minst 18 år gammal
- id: scene-4
  description: inte är gift eller i registrerat parförhållande sedan tidigare.
- id: scene-5
  description: Även samkönade par kan gifta sig i Finland.
- id: scene-6
  description: Nära släktingar får inte gifta sig enligt Finlands lag.
- id: scene-7
  description: Äktenskapet är alltid ett frivilligt val som ingen kan tvingas till.
- id: scene-8
  description: I Finland kan kvinnor och män själva besluta vem de ska gifta sig med.
- id: scene-9
  description: Det har gjorts ändringar i Finlands äktenskapslag genom tiderna.
- id: scene-10
  description: Enligt lag kan en person gifta sig om det inte finns något hinder för hen att ingå äktenskap.
- id: scene-11
  description: Förlovning är ett frivilligt och fritt avtal om att ett par senare ska gifta sig.
- id: scene-12
  description: Par kan fritt bryta en förlovning om den ena eller båda parterna vill det.
- id: scene-13
  description: En borgerlig vigsel kan ske antingen på ett verksamhetsställe för Myndigheten för digitalisering
    och befolkningsdata eller i en tingsrätt.
- id: scene-14
  description: En kyrklig vigsel kan förrättas av en präst inom den evangelisk-lutherska eller den ortodoxa
    kyrkan.
- id: scene-15
  description: Båda makarna måste vara på plats vid vigseltillfället.
- id: scene-16
  description: Alla har rätt till borgerlig vigsel, även de som tillhör ett trossamfund.
- id: scene-17
  description: När ett par gifter sig kan de om de vill ta ett gemensamt efternamn.
