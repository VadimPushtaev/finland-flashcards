    heading: Att ändra sitt efternamn till följd av äktenskap är frivilligt för båda makarna
    source_range:
      start: 0
      end: 451
    range_basis: normalized_html_block
    extracted_passage: När ett par gifter sig kan de om de vill ta ett gemensamt efternamn. Det var
      länge vanligt att kvinnan tog mannens efternamn. Namnlagen, som var i kraft från år 1930 till
      år 1986, gjorde detta obligatoriskt. I dag är det möjligt för mannen att ta kvinnans efternamn.
      Båda kan också behålla sina efternamn, eller så kan paret ta ett helt nytt, gemensamt efternamn.
      Om de vill kan den ena eller båda makarna kombinera sitt eget namn med den andras namn.
