    range_basis: raw_pdf_page
    extracted_passage: "Det har gjorts ändringar i Finlands äktenskapslag genom tiderna. Sedan 2017\
      \ är äktenskapslagen i \nFinland jämlik. Det betyder att också par av samma kön kan ingå äktenskap.\
      \ Innan det här kunde \nmanliga par och kvinnliga par bara registrera sitt parförhållande.\
      \ Ett registrerat partnerskap var ett \näktenskapslikt avtal där makarna ändå inte hade alla\
      \ de rättigheter som makarna i ett äktenskap hade. \n"
    normalization: whitespace_only
