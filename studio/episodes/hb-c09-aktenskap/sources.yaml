    heading: En vigsel kan vara kyrklig eller borgerlig
    source_range:
      start: 0
      end: 495
    range_basis: normalized_html_block
    extracted_passage: En kyrklig vigsel kan förrättas av en präst inom den evangelisk-lutherska
      eller den ortodoxa kyrkan. En kyrklig vigsel kan förrättas också av en annan representant för
      ett religiöst samfund registrerat i Finland som Myndigheten för digitalisering och befolkningsdata
      har beviljat vigselrätt. Ett äktenskap som ingåtts inom ett religiöst samfund är officiellt
      endast om paret vigs av en person med officiell vigselrätt. Dessutom måste en prövning av hinder
      för äktenskapet ha gjorts före vigseln.
    normalization: whitespace_only
    repairs: []
