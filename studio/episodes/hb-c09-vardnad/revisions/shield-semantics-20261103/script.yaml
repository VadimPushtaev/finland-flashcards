- id: opening
  decision: Exact unspoken bilingual heading for three seconds, then every archived body sentence and
    list fragment once in stored order.
  status: proposed
  resolve_during: script
- id: layout
  decision: Fixed right bilingual panel at 1920x1080/24 fps with Liberation Sans, Swedish48 and Russian40;
    Chapter9 terracotta palette. Foreground remains steady while decorative background moves continuously.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Separate official residence, actual alternating residence, legal custody and contact rights.
    List fragments stay ordered under their exact parent source context; protection conditions remain
    explicit.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1, steps32, speed0.95, seed42, 44100Hz mono PCM16; initial ONNX
    threads2. Full-video pronunciation and user listening review remain pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: A distinct source-bound foreground picture is planned for almost every sentence. Physical
    objects/institutions prioritize verified photography; legal and familial relationships use original
    explicit pictorial diagrams. No repeated generic image or text-only quota filler.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show sentence pair0.25s before narration, retain through measured full speech and 1.5s regular
    pause;2.2s at source-topic ends and2.5s for long pairs. No arbitrary runtime target.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Pelle Hermannin leikkipuisto - liukumäki.jpg by kallerna continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=2.975. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Music Box Theme by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 63.582 seconds; prepared lossless stereo bed 416.500 seconds.
    Repeat count 6, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credit cards and complete accompanying source and reuse notices.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source wording, reviewed Russian text, ordering or IDs are changed; foreground scarcity
    will be explicitly documented instead of irrelevant filler.
  status: proposed
  resolve_during: script
scenes:
- id: scene-1
  description: 'Om familjen har barn under 18 år och äktenskapet slutar ska föräldrarna i samband med
    skilsmässan komma överens om följande:'
- id: scene-2
  description: Var ska barnet bo?
- id: scene-3
  description: Vem är barnets vårdnadshavare?
- id: scene-4
  description: Hur ordnas umgänget?
- id: scene-5
  description: Underhållsbidrag.
- id: scene-6
  description: När föräldrarna har kommit överens om barnets boende, vårdnad, umgängesrätt och underhållsbidrag
    kan barnatillsyningsmannen (lastenvalvoja) på din ort bekräfta avtalet.
- id: scene-7
  description: Om ni inte kan komma överens om boende, vårdnad, umgänge och underhåll kan ni ansöka om
    medling i familjefrågor (perheasioiden sovittelu).
- id: scene-8
  description: Låt alltid barnets intressen gå först när ni beslutar om boendet.
- id: scene-9
  description: Officiellt kan ett barn bara bo på ett ställe.
- id: scene-10
  description: I praktiken kan barnet dock bo en del av tiden hos sin andra förälder.
- id: scene-11
  description: Barnbidraget betalas till den förälder hos vilken barnet bor officiellt.
- id: scene-12
  description: Vårdnaden om ett barn innebär
- id: scene-13
  description: att man tar hand om barnet
- id: scene-14
  description: att man uppfostrar barnet
- id: scene-15
  description: att man tar hand om och beslutar om barnets angelägenheter.
- id: scene-16
  description: När ett äktenskap slutar beslutar barnets föräldrar hur vårdnaden ska ordnas.
- id: scene-17
  description: När båda föräldrarna är barnets vårdnadshavare, alltså när de har gemensam vårdnad, beslutar
    de många saker tillsammans.
- id: scene-18
  description: namn
- id: scene-19
  description: bostadsort
- id: scene-20
  description: fostran
- id: scene-21
  description: språk
- id: scene-22
  description: religion
- id: scene-23
  description: utbildning
- id: scene-24
  description: hälsovård
- id: scene-25
  description: disponering av barnets egendom
- id: scene-26
  description: Också till exempel för en passansökan behövs båda föräldrarnas samtycke.
- id: scene-27
  description: När föräldrarna har gemensam vårdnad måste de kunna komma överens om saker med varandra.
- id: scene-28
  description: Barnet har rätt att ha kontakt med båda sina föräldrar efter skilsmässan.
- id: scene-29
  description: Umgängesrätten kan till exempel innebära att barnet bor hos den ena föräldern och träffar
    den andra föräldern vartannat veckoslut och dessutom vissa tider under loven.
- id: scene-30
  description: Umgängesrätten kan också vara så omfattande att barnet bor lika mycket hos båda föräldrarna.
- id: scene-31
  description: Vid problem med umgänget kan du kontakta barnatillsyningsmannen.
- id: scene-32
  description: Om du misstänker att barnets hälsa eller säkerhet äventyras när barnet träffar den andra
    föräldern ska du meddela detta till socialmyndigheter.
