scenes:
- id: hb-c12-u0215
  description: Om du redan är i Finland och får ett negativt beslut om uppehållstillstånd från Migrationsverket
    (Maahanmuuttovirasto), måste du lämna Finland.
- id: hb-c12-u0216
  description: Du kan överklaga beslutet om du är missnöjd med det.
- id: hb-c12-u0217
  description: Du kan överklaga också om du har ansökt om uppehållstillstånd utomlands.
- id: hb-c12-u0218
  description: En besvärsanvisning om hur beslutet får överklagas bifogas alltid beslutet.
- id: hb-c12-u0219
  description: Om förvaltningsdomstolen avslår besvären kan du i vissa fall ansöka om besvärstillstånd
    hos högsta förvaltningsdomstolen (korkein hallinto-oikeus).
- id: hb-c12-u0220
  description: Du kan få hjälp med att överklaga av antingen en privat jurist, en statlig rättshjälpsbyrå
    (valtion oikeusaputoimisto) eller Flyktingrådgivningen rf (Pakolaisneuvonta) (endast asylsökande).
- id: hb-c12-u0221
  description: Om du får avslag på din ansökan om uppehållstillstånd eller om förvaltningsrätten avslår
    ditt överklagande, måste du lämna Finland.
- id: hb-c12-u0222
  description: Om du inte lämnar landet inom tidsfristen, avlägsnar polisen eller gränsbevakningsväsendet
    dig ur landet.
- id: hb-c12-u0223
  description: Enligt lag kan du inte utvisas om du hotas av dödsstraff, tortyr, förföljelse eller någon
    annan behandling som är omänsklig eller kränker människovärdet i ditt hemland.
- id: hb-c12-u0224
  description: Vänligen observera att endast Migrationsverket kan fatta beslut om uppehållstillstånd.
- id: hb-c12-u0225
  description: När du flyttar utomlands från Finland ska du anmäla flytten till Myndigheten för digitalisering
    och befolkningsdata (Digi- ja väestötietovirasto).
- id: hb-c12-u0226
  description: När du flyttar utomlands måste du meddela detta till FPA, om du får FPA:s förmåner eller
    om du har det europeiska sjukvårdskortet.
- id: hb-c12-u0227
  description: När du är utomlands och har rätt till FPA:s förmåner ska du alltid anmäla ändringar i dina
    förhållanden till FPA.
- id: hb-c12-u0228
  description: Om du vill återvända till ditt hemland, kan du i vissa fall få stöd för frivilligt återvändande.
- id: hb-c12-u0229
  description: Du kan få stöd för frivilligt återvändande om du är medborgare i ett land som inte är ett
    EU-land och
- id: hb-c12-u0230
  description: du har ansökt om asyl och fått avslag på din ansökan,
- id: hb-c12-u0232
  description: du har ansökt om asyl och dragit tillbaka din asylansökan eller
- id: hb-c12-u0233
  description: du har tidigare beviljats internationellt skydd, men det har upphört.
