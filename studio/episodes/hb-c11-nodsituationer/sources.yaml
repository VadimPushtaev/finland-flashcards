    range_basis: normalized_html_block
    extracted_passage: Man får ringa nödnumret bara om det är fråga om en akut nödsituation. Man
      kan ringa nödnumret om någons liv, hälsa, egendom eller omgivning är i fara. Via nödnumret
      kan man kalla polisen, brandkåren, en ambulans eller en social myndighet till platsen. Nödcentralen
      avgör huruvida hjälp behövs till platsen och vilken myndighet som kommer för att hjälpa i vilken
      situation. Det kostar ingenting att ringa nödnumret.
    normalization: whitespace_only
    repairs: []
