episode_decisions:
- id: fidelity
  decision: Read every exact archived source sentence/list fragment once,in stored order,with current
    reviewed Russian. Only112digit speech is expanded. No invented emergency,triage,first-aid,address,translation-availability,penalty
    or preparedness instruction.
  status: proposed
  resolve_during: script
- id: visuals
  decision: Aim for at least90%distinct relevant picture sources and100%body picture coverage; prioritize
    actual verified vehicles,phones,address signs,agency settings and Finnish environments,with useful
    individually composed logic diagrams. Four direct source continuations may deliberately retain their
    meaningful illustration. No fake variants or real-person victim/diagnosis assignments.
  status: proposed
  resolve_during: script
- id: voice
  decision: LocalSwedishSupertonic3F1,32steps,speed.95,NumPyseed42,44100HzmonoPCM16; pronunciation remains
    whole-video listening priority.
  status: proposed
  resolve_during: script
- id: pace
  decision: 3secondtitle,.25secondtextlead,measured fullspeech,1.5secondpause and2.2attopicends;2.5forlongpairs.
    Do not accelerate to targetlength.
  status: proposed
  resolve_during: script
- id: background
  decision: Use File:Kajaanin paloasema ja kaupungin varikko Kuntokatu 7 Kajaani.jpg by MailariX continuously
    as decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85)
    and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence
    resets. Total cycles=3.0032738095238094. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music
  decision: Use Sovereign by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 371.566 seconds; prepared lossless stereo bed 420.458 seconds.
    Repeat count 1, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Actual source attribution derived from sources.yaml,15secondreadablecreditcards and fullmatching
    sidecar.
  status: proposed
  resolve_during: script
