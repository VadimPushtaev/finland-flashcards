    range_basis: normalized_html_block
    extracted_passage: Finland tar som kvotflyktingar emot personer som har flyktingstatus enligt
      Förenta nationernas flyktingorganisation UNHCR. Kvotflyktingarna väljs bland de personer som
      UNHCR föreslår till Finland. De finländska myndigheterna intervjuar dessa flyktingar. Utgående
      från intervjuerna väljer man de flyktingar som tas emot till Finland. Intervjuerna görs i de
      länder där flyktingarna vistas, vanligen i flyktingläger eller i UNHCR:s lokaler.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
