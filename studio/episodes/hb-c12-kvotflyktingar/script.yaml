scenes:
- id: hb-c12-u0188
  description: Dessutom tar Finland varje år emot ett visst antal flyktingar som FN:s flyktingorgan UNHCR
    har erkänt som flyktingar.
- id: hb-c12-u0189
  description: Man kan inte ansöka om att bli kvotflykting via myndigheterna i Finland.
- id: hb-c12-u0190
  description: Finland tar som kvotflyktingar emot personer som har flyktingstatus enligt Förenta nationernas
    flyktingorganisation UNHCR.
- id: hb-c12-u0191
  description: Riksdagen i Finland bestämmer hur många flyktingar som tas emot i landet.
- id: hb-c12-u0192
  description: Kommunen och välfärdsområdet ordnar nödvändiga lokala tjänster för kvotflyktingarna.
- id: hb-c12-u0193
  description: Dessutom är Finlands Röda Kors (FRK) frivilliga involverade i mottagningen av flyktingar
    i kommunerna och ger stöd för integrationen.
- id: hb-c12-u0194
  description: Flyktingar kan be om hjälp och rådgivning i rättsliga frågor bland annat hos Flyktingrådgivningen
    rf eller hos rättshjälpsbyråerna.
