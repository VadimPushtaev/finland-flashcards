    heading: Man kan boka tid på en privat läkarstation för behandling av vilken sjukdom som helst
    source_range:
      start: 0
      end: 485
    range_basis: normalized_html_block
    extracted_passage: Det finns privata läkarstationer runt om i Finland och deras kontaktuppgifter
      finns på internet. Man får ofta en tid till privatläkare snabbare än till offentliga hälsovårdstjänster.
      Privata hälsovårdstjänster är dock mycket dyrare än offentliga. En del privatläkare gör också
      hembesök, men de kan vara dyra. Om man har ett FPA-kort, kan man få tillbaka en liten del av
      avgifterna för privatläkare från FPA. Om man inte har något kort, kan man ansöka om ersättning
      hos FPA i efterhand.
