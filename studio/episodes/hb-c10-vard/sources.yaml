    heading: Jouren hjälper vid brådskande sjukdomsfall
    source_range:
      start: 0
      end: 414
    range_basis: normalized_html_block
    extracted_passage: Om man blir sjuk kvällstid eller under en helg och behöver brådskande vård,
      ska man ringa jouren och följa anvisningarna man får. Man åker till akuten endast när en sjukdom
      kräver omedelbar vård och vården inte kan vänta till följande vardag. Ofta kan en människa
      ta sig på egen hand eller med taxi till akuten. Ambulans behövs när en persons liv är i fara
      eller hen inte längre kan hjälpa sig själv i situationen.
