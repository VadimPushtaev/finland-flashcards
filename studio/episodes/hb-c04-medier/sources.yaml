    range_basis: normalized_html_block
    extracted_passage: I sociala medier kan vem som helst publicera sina åsikter om vilket ämne som
      helst. Inlägg från vanliga människor kan snabbt sprida sig till tusentals eller till och med
      miljontals människor runt om i världen. Detta är på många sätt en bra sak för demokratin, eftersom
      det ger alla möjlighet att delta i samhällsdebatten. Risken är ändå att det är svårt att veta
      vad som är sant och inte när vem som helst kan skriva vad som helst.
