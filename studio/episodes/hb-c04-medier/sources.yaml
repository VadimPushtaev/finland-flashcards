    extracted_passage: Opinionsnämnden för massmedier, ONM, utvärderar god journalistisk sed genom
      att tolka Journalistreglerna. ONM är ett samarbetsorgan som grundats av medieutgivare och journalister.
      Om man misstänker att ett medium har agerat i strid med Journalistreglerna, kan man klaga hos
