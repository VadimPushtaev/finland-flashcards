    range_basis: normalized_html_block
    extracted_passage: Pressfrihet betyder att medier och journalister har frihet att utföra sitt
      arbete och rapportera om allt som händer i samhället. Pressfriheten är på olika sätt begränsad
      eller hotad i stora delar av världen. Staten kan begränsa pressfriheten genom att till exempel
      utöva påtryckningar mot medierna för att de inte ska publicera material som kritiserar beslutsfattarnas
      handlingar. I en del länder kan journalister bli fängslade eller till och med dödade om de
      enligt beslutsfattarna skriver om fel saker.
