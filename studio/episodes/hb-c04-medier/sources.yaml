    range_basis: normalized_html_block
    extracted_passage: Tidningar är mycket populära i Finland. År 2023 läste 96 procent av finländarna
      över 15 år tidningar antingen i pappersform eller på nätet. I Finland finns det ett tjugotal
      tidningar som utkommer varje dag eller nästan varje dag och dessutom omkring hundra tidningar
      som utkommer en eller ett par gånger i veckan. Några tidningar läses i hela Finland, och därtill
      finns det ett antal tidningar som läses i ett eller några landskap. Många av tidningarna är
      små lokaltidningar.
