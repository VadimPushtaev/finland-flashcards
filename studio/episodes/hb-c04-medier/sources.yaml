    extracted_passage: Tidningarna ägs i allmänhet av privata mediebolag. I Finland är de flesta
      tidningar inte politiskt bundna, utan bestämmer själva sin linje i olika samhällsfrågor. Det
      finns också politiska tidningar, men deras antal har minskat under de senaste årtiondena. De
      senaste åren har tidningsägandet koncentrerats till stora mediebolag. Denna utveckling kan
      begränsa vilka frågor medierna rapporterar om.
