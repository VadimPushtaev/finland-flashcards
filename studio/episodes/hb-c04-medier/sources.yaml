    range_basis: normalized_html_block
    extracted_passage: I Finland regleras mediernas verksamhet av lagen och dessutom av Journalistreglerna.
      Journalistreglerna är ett gemensamt avtal för mediebranschen om att alla medier som förbundit
      sig till reglerna ska utföra sitt arbete på ett etiskt sätt. Syftet med reglerna är att styra
      mediernas arbete och försvara publiceringsfriheten. En stor del av de journalistiska medierna
      i Finland har förbundit sig till dessa regler.
