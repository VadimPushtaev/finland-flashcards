    range_basis: normalized_html_block
    extracted_passage: Medierna är en viktig del av demokratin. De förväntas ge människor tillförlitlig
      information om samhället. Med hjälp av medierna får människor information om samhälleliga beslut
      och diskussioner. De lyfter fram problem och missbruk i beslutsfattandet och förvaltningen.
      Dessutom följer och kritiserar medierna vad politikerna och andra makthavare gör och säger.
      I Finland får journalister fritt kritisera politikernas beslut och uttalanden.
