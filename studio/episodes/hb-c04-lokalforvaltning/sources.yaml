      start: 0
      end: 377
    range_basis: normalized_html_block
    extracted_passage: Kommunfullmäktige utser också nämnder. Exempel på nämnder är bildningsnämnden,
      som ansvarar för utbildnings- och kulturfrågor, och centralvalnämnden, som ansvarar för förrättandet
      av val i kommunens område. Nämnderna bereder ärenden för kommunfullmäktige, som fattar besluten.
      Medlemmarna i nämnderna är kommunfullmäktigeledamöter eller kommuninvånare som utsetts av partierna.
