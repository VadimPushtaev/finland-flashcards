    source_range:
      start: 0
      end: 353
    range_basis: normalized_html_block
    extracted_passage: Var och en som är permanent bosatt i Finland är invånare i en kommun. Kommunen
      erbjuder sina invånare mycket basservice. Kommunen ansvarar för till exempel skolorna, småbarnspedagogiken,
      biblioteken och olika motions- och idrottstjänster. Kommunen planerar också gator, bostäder
      och parkområden och sörjer för vatten- och eltillgången och renhållningen.
