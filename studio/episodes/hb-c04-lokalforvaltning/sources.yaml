    heading: Kommunerna ansvarar för många av människornas dagliga tjänster
    source_range:
      start: 0
      end: 261
    range_basis: normalized_html_block
    extracted_passage: Det finns cirka 300 kommuner i Finland. Kommunerna beslutar i mycket hög grad
      själva om sina angelägenheter och sin ekonomi. Kommunerna har rätt att ta ut skatt av invånarna.
      Utöver kommunalskatten får kommunerna också pengar från staten för att ordna tjänster.
    normalization: whitespace_only
