    42% and blurred 2.5px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=2.1758928571428573.
    Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Wind of the Rainforest by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 3534.054 seconds; prepared lossless stereo bed 304.625
    seconds. Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Use four verified foreground sources at relevant topic boundaries: wellbeing-county map,
    Tornio health centre, municipal public library and Helsinki City Hall. Target at least50% of measured
    body display time. Source-term cards remain only where useful and do not count as pictures.'
  status: proposed
  resolve_during: script
- id: closing
