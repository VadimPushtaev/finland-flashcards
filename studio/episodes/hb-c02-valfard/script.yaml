- sentence_id: hb-c02-u0065-s001
  sv: Även om socialministeriet, som skulle ansvara för socialskyddet, grundades vid samma tid som Finland
    blev självständigt 1917, började man skapa omfattande offentliga stödsystem i Finland först i slutet
    av 1930-talet.
  ru: Хотя министерство социальных дел (socialministeriet), которое должно было отвечать за социальную
    защиту, было основано одновременно с обретением Финляндией независимости в 1917 году, создавать широкие
    государственные системы поддержки в Финляндии начали лишь в конце 1930-х годов.
