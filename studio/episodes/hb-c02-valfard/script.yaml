- sentence_id: hb-c02-u0064-s006
  sv: Den tidens finska socialförsäkring var internationellt sett gammalmodig, men i den oeniga politiska
    atmosfär som härskade var det mycket svårt att införa försäkringar för ålderdom, arbetsoförmåga eller
    sjukdom.
  ru: Финское социальное страхование того времени было устаревшим по международным меркам, однако в царившей
    атмосфере политических разногласий было очень трудно ввести страхование по старости, нетрудоспособности
    или болезни.
