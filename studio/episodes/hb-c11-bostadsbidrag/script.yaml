scenes:
- id: hb-c11-u0117
  description: Om du har en låg inkomst och du är stadigvarande bosatt i Finland kan du ha rätt till FPA:s
    bostadsbidrag.
- id: hb-c11-u0118
  description: Med stadigvarande boende avses att du har ditt egentliga hem i Finland och huvudsakligen
    också vistas i landet.
- id: hb-c11-u0119
  description: 'FPA:s stöd för boende är följande:'
- id: hb-c11-u0120
  description: allmänt bostadsbidrag
- id: hb-c11-u0122
  description: bostadsbidrag för pensionstagare
- id: hb-c11-u0123
  description: bostadsunderstöd i samband med militärunderstöd för värnpliktiga och civiltjänstgörare.
- id: hb-c11-u0124
  description: Vanligtvis kan du få endast ett stöd för boende i taget.
- id: hb-c11-u0125
  description: Stöd kan betalas till en person eller till ett hushåll (ruokakunta).
- id: hb-c11-u0126
  description: Beakta att om du delar bostad med till exempel en vän och ni har ett gemensamt hyresavtal
    så anses ni höra till samma hushåll.
- id: hb-c11-u0127
  description: 'Följande kan få allmänt bostadsbidrag:'
- id: hb-c11-u0128
  description: barnfamiljer
- id: hb-c11-u0130
  description: gifta par och registrerade par
- id: hb-c11-u0131
  description: sambor
- id: hb-c11-u0132
  description: ensamboende eller
- id: hb-c11-u0133
  description: de som bor i kollektiv
- id: hb-c11-u0134
  description: studerande som bor med sitt eget barn eller med sin makas/makes barn eller som inte har
    rätt till studiestöd.
- id: hb-c11-u0135
  description: Hushållets tillgångar påverkar hur mycket bostadsbidrag ni kan få.
- id: hb-c11-u0136
  description: Bostadsbidrag kan beviljas för en fast bostad som ligger i Finland.
- id: hb-c11-u0137
  description: en hyresbostad
- id: hb-c11-u0139
  description: en bostadsrättsbostad
- id: hb-c11-u0140
  description: en delägarbostad.
- id: hb-c11-u0141
  description: Du kan få stöd för till exempel hyran, vattenavgifterna och uppvärmningskostnaderna.
- id: hb-c11-u0142
  description: Bostadsbidrag beviljas för skäliga boendekostnader.
- id: hb-c11-u0143
  description: En del av boendekostnaderna måste du betala själv.
- id: hb-c11-u0144
  description: hur många vuxna och barn som hör till hushållet
- id: hb-c11-u0146
  description: hushållets bruttoinkomster (inkomster före skatt)
- id: hb-c11-u0147
  description: Om inkomsterna är mycket låga bortfaller bassjälvrisken.
- id: hb-c11-u0148
  description: Det finns övre gränser för boendeutgifterna, det vill säga det största belopp som beaktas
    som boendeutgifter enligt vilket du kan få stöd för boendet.
- id: hb-c11-u0149
  description: kommunen där bostaden är belägen
- id: hb-c11-u0151
  description: antalet vuxna och barn i hushållets storlek
- id: hb-c11-u0152
  description: Om bostaden är större eller dyrare än vad lagen om allmänt bostadsbidrag tillåter växer
    den andel av boendekostnaderna som du betalar själv.
- id: hb-c11-u0153
  description: Det allmänna bostadsbidraget är 70 procent av de godtagbara boendeutgifterna, med avdrag
    för bassjälvriskandelen.
- id: hb-c11-u0154
  description: Om dina inkomster, boende- eller familjeförhållanden eller andra omständigheter ändras
    ska du omgående anmäla ändringen till Fpa.
- id: hb-c11-u0155
  description: Om du är studerande, kan du vanligtvis inte få allmänt bostadsbidrag.
- id: hb-c11-u0156
  description: 'Som studerande kan du få allmänt bostadsbidrag till exempel i följande situationer:'
- id: hb-c11-u0157
  description: Du bor med ditt barn eller med din makas/makes barn.
- id: hb-c11-u0159
  description: Du får någon förmån på grund av vilken du inte kan få studiestöd.
- id: hb-c11-u0160
  description: Du har avbrutit studierna eller har inte kvar några studiestödsmånader.
- id: hb-c11-u0161
  description: Dina studier har inte framskridit tillräckligt och FPA har dragit in ditt studiestöd.
