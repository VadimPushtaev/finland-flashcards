    heading: Den finska matkulturen
    source_range:
      start: 0
      end: 316
    range_basis: normalized_html_block
    extracted_passage: Alkoholdrycker är relativt dyra i Finland och köpet av dem begränsas med åldersgränser
      för unga personer. I mataffären säljs endast milda alkoholdrycker. Starka alkoholdrycker köper
      man i de statligt reglerade Alko-butikerna. Att köra bil under alkoholpåverkan är förbjudet
      enligt lag och det kan ge ett hårt straff.
