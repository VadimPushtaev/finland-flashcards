    heading: På julen dukas traditionella delikatesser fram
    source_range:
      start: 0
      end: 360
    range_basis: normalized_html_block
    extracted_passage: Den traditionella finska julmaten är mångsidig och läcker. I risgrynsgröten
      läggs en skalad mandel. Enligt vissa traditioner får den som hittar mandeln i sin gröt lycka.
      Glögg, det vill säga en varm, kryddad saftdryck, serveras under julen med pepparkakor. Ibland
      innehåller glöggen också alkohol. På Luciadagen äter man saffransbullar formade som bokstaven
      s.
    normalization: whitespace_only
    repairs: []
