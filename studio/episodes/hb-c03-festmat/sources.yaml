      end: 537
    range_basis: normalized_html_block
    extracted_passage: Man dricker kaffe på morgonen, dagen och kvällen, på jobbet och hemma, när
      det är fest och till vardags och på kafé eller till exempel utflykter i naturen. Kafferasten
      på arbetsplatsen är en trevlig social paus i arbetet. Under rasten kan man fråga arbetskamraterna
      om det hänt någonting nytt. Istället för kaffe kan man också dricka te eller någon annan dryck.
