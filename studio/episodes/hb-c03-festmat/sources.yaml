    heading: På midsommar grillar man hemma, och på sensommaren ordnas kräftskiva
    source_range:
      start: 0
      end: 218
    range_basis: normalized_html_block
    extracted_passage: På midsommar firar många sommaren genom att grilla ute. På grillen grillas
      korv, kött och grönsaker. Kring midsommar kommer den första potatisen för säsongen till affärerna.
      De kokas och äts med smör och dill och sill.
    normalization: whitespace_only
