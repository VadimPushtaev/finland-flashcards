    heading: Lamm serveras på påsk och mjöd på valborg
    source_range:
      start: 0
      end: 273
    range_basis: normalized_html_block
    extracted_passage: På många påskbord serveras lamm, ägg, memma, pasha och chokladägg. Äggen dekoreras
      och målas. Att måla ägg är ursprungligen en ortodox sed. Memma är en söt efterrätt av malt
      och rågmjöl som tillagas i ugn och äts med grädde och socker. Pasha är en efterrätt gjord av
      kvarg.
    normalization: whitespace_only
    repairs: []
