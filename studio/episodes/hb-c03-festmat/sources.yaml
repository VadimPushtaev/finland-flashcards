    heading: På vintern äter man fastlagsbullar, runebergstårtor och blinier
    source_range:
      start: 0
      end: 435
    range_basis: normalized_html_block
    extracted_passage: I februari finns det runebergstårtor och fastlagsbullar i affärerna. Runebergstårtorna
      smakar mandel och ovanpå dem finns hallonsylt. En fastlagsbulle är en stor, rund bulle skuren
      på mitten. Mellan halvorna finns vispgrädde och mandelmassa eller sylt. På fastlagen äter man
      också ärtsoppa. Andra delikatesser som hör början av vintern till är blinier, det vill säga
      plättar av bovetemjöl, som ingår i den ortodoxa fastlagstraditionen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
