    source_range:
      start: 0
      end: 206
    range_basis: normalized_html_block
    extracted_passage: På valborg dricker man mjöd och äter munkar och struvor. Mjöd är en dryck
      som tillverkas genom jäsning av vatten, citron och socker och som många tillverkar hemma. Mjöd
      kan innehålla en liten mängd alkohol.
