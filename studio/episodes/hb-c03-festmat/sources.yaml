    heading: På julen dukas traditionella delikatesser fram
    source_range:
      start: 0
      end: 498
    range_basis: normalized_html_block
    extracted_passage: På julbordet serveras de bästa traditionella delikatesserna. Många steker
      julskinkan själv hemma. Med den serveras kokt potatis och lådrätter, det vill säga rotsaksrätter
      tillagade i ugn, till exempel kålrots-, potatis- och morotslåda. Till julbordet hör också sillsallad,
      det vill säga en sallad gjord av kokta och hackade rotsaker. På julen äter man också mycket
      fisk och olika slags sillar, strömming, gravad lax samt lutfisk av torkad fisk, som enligt
      många är en av de bästa juldelikatesserna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
