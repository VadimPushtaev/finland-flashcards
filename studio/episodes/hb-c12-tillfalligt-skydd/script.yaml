scenes:
- id: hb-c12-u0195
  description: Tillfälligt skydd kan ges i situationer där ett stort antal människor har varit tvungna
    att fly samtidigt till följd av till exempel krig.
- id: hb-c12-u0196
  description: Du kan få uppehållstillstånd på grund av tillfälligt skydd om du är
- id: hb-c12-u0197
  description: ukrainsk medborgare och inte kan återvända till Ukraina på grund av det ryska anfallet
- id: hb-c12-u0199
  description: medborgare i ett land utanför EU och har fått internationellt skydd i Ukraina eller bott
    i Ukraina med ett permanent uppehållstillstånd, och inte kan återvända till ditt hemland
- id: hb-c12-u0200
  description: familjemedlem till ovan nämnda personer, om familjebandet bildades i Ukraina före 24.2.2022.
- id: hb-c12-u0201
  description: I övriga fall ska du kontrollera på Migrationsverkets webbplats om du har rätt att få tillfälligt
    skydd i Finland.
- id: hb-c12-u0202
  description: När du har ansökt om tillfälligt skydd kan du bo i ett mottagningscenter och få mottagningscentrets
    tjänster.
- id: hb-c12-u0203
  description: Du har rätt att arbeta och studera i Finland omedelbart efter att du har ansökt om tillfälligt
    skydd.
- id: hb-c12-u0204
  description: Du kan få rätt till FPA:s förmåner om du arbetar i Finland eller har bott i Finland minst
    ett år.
