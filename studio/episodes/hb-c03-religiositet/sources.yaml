    heading: För en del som bor i Finland är andlighet och religiös övertygelse viktiga
    source_range:
      start: 0
      end: 525
    range_basis: normalized_html_block
    extracted_passage: Människors övertygelse uppstår på ett alltmer individuellt sätt. Många väljer
      delar från olika källor för sin andlighet. De kan välja delar från olika religiösa traditioner
      eller andra former av andlighet. Någon kan till exempel bekänna en kristen tro och i den inkludera
      idén om själavandring, trots att läran om själavandring inte hör till kristendomens dogmer.
      En annan i sin tur deltar i evenemang som ordnas av flera olika religiösa samfund, eftersom
      vart och ett av dem ger hen någonting meningsfullt i fråga andlighet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
