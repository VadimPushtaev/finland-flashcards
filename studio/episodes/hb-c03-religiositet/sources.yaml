    source_range:
      start: 0
      end: 424
    range_basis: normalized_html_block
    extracted_passage: I skolor och daghem firas högtidsdagar enligt kalendern, till exempel jul
      och påsk, som har ett delvis religiöst och kristet ursprung. Att fira dessa högtider betraktas
      i allmänhet inte som egentligt religionsutövande. För en stor del är dessa fester en del av
      den lokala kulturtraditionen och deras religiösa budskap får mindre uppmärksamhet. Många högtider
      är dessutom en blandning av kristna och icke-kristna traditioner.
    normalization: whitespace_only
