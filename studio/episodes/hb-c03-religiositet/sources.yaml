    range_basis: normalized_html_block
    extracted_passage: På finländska arbetsplatser brukar man inte utöva religiösa seder eller ritualer.
      En del arbetsgivare har på arbetstagarnas önskemål ordnat till exempel en böneplats i arbetsplatsens
      lokaler. Bönestunden ska hållas i samband med övriga pauser under arbetsdagen.
