    heading: I Finland får man undervisning i religion och livsåskådningskunskap i skolan
    source_range:
      start: 0
      end: 329
    range_basis: normalized_html_block
    extracted_passage: I skolorna i Finland ordnas undervisning i åskådningsämnen, det vill säga
      religion eller livsåskådningskunskap. Skolornas undervisning i religion och livsåskådningskunskap
      regleras i Finlands lag om grundläggande utbildning. Religionsundervisningens uppgift är att
      ge eleverna en bred allmänbildning i religion och livsåskådning.
