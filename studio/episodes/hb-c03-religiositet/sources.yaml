    heading: Religionen syns i festtraditionerna, trots att många har sekulariserats
    source_range:
      start: 0
      end: 449
    range_basis: normalized_html_block
    extracted_passage: I Finland, liksom i många andra europeiska länder, har samhället under lång
      tid blivit mer sekulärt. Det betyder att religion har fått mindre betydelse i människors vardag
      och i samhället. Med det menas att religionens betydelse har minskat i samhället och individens
      liv. Många anser inte att religiösa seder och bruk, värderingar och attityder är någon viktig
      del av deras liv och är inte intresserade av att föra dem vidare till nästa generation.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
