    source_range:
      start: 0
      end: 381
    range_basis: normalized_html_block
    extracted_passage: Religionsutövandet syns inte särskilt mycket i vardagen i Finland. Man deltar
      ofta i verksamheten i religiösa samfund utifrån sina egna personliga förutsättningar när det
      känns som att det motsvarar ens egna behov och känns meningsfullt för en själv. Många går till
      exempel i kyrkan eller besöker andra platser avsedda för religionsutövande endast vid familjehögtider
      eller helger.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
