    heading: Religionen syns i festtraditionerna, trots att många har sekulariserats
    source_range:
      start: 0
      end: 407
    range_basis: normalized_html_block
    extracted_passage: Kristendomen och de lutherska kristna värderingarna har framför allt tidigare
      inverkat mycket på det finländska samhället, kulturen, människornas värderingar, vardagen och
      etikettsreglerna och konsten. Även många festtraditioner anknyter till religionen. Traditionerna
      syns särskilt i ritualer som hänför sig till livets gång eller årscykeln, till exempel bröllop
      och begravningar samt jul- och påskfirande.
    normalization: whitespace_only
    repairs: []
