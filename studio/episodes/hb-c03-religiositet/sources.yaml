    heading: För en del som bor i Finland är andlighet och religiös övertygelse viktiga
    source_range:
      start: 0
      end: 316
    range_basis: normalized_html_block
    extracted_passage: I Finland har en del människor ett starkt band till sitt religiösa samfund.
      De följer dess traditioner, deltar i ceremonier och är med vid religiösa tillfällen. Andra
      i sin tur är inte särskilt starkt engagerade i något religiöst samfunds verksamhet. Ändå kan
      andlighet och religiös övertygelse vara viktiga för dem.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
