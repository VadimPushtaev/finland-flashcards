scenes:
- id: hb-c03-u0055
  description: Kristendomen och de lutherska kristna värderingarna har framför allt tidigare inverkat
    mycket på det finländska samhället, kulturen, människornas värderingar, vardagen och etikettsreglerna
    och konsten.
- id: hb-c03-u0056
  description: I Finland, liksom i många andra europeiska länder, har samhället under lång tid blivit
    mer sekulärt.
- id: hb-c03-u0057
  description: Religionsutövandet syns inte särskilt mycket i vardagen i Finland.
- id: hb-c03-u0058
  description: I skolor och daghem firas högtidsdagar enligt kalendern, till exempel jul och påsk, som
    har ett delvis religiöst och kristet ursprung.
- id: hb-c03-u0059
  description: På finländska arbetsplatser brukar man inte utöva religiösa seder eller ritualer.
- id: hb-c03-u0060
  description: I Finland har en del människor ett starkt band till sitt religiösa samfund.
- id: hb-c03-u0061
  description: Människors övertygelse uppstår på ett alltmer individuellt sätt.
- id: hb-c03-u0062
  description: Karakteristiskt för den finländska religiositeten är dessutom att andlig övertygelse ofta
    betraktas som en privat angelägenhet.
- id: hb-c03-u0063
  description: I skolorna i Finland ordnas undervisning i åskådningsämnen, det vill säga religion eller
    livsåskådningskunskap.
- id: hb-c03-u0064
  description: I Finland deltar största delen av eleverna i undervisningen i evangelisk-luthersk tro.
- id: hb-c03-u0065
  description: Religionsundervisningen i skolan är inte religionsutövande eller religiöst bindande.
- id: hb-c03-u0066
  description: Livsåskådningskunskap lärs ut till elever som inte hör till något registrerat religionssamfund.
