  sv: Kristendomen och de lutherska kristna värderingarna har framför allt tidigare inverkat mycket på
    det finländska samhället, kulturen, människornas värderingar, vardagen och etikettsreglerna och konsten.
  ru: Христианство и лютеранские христианские ценности, прежде всего в прошлом, сильно влияли на финляндское
    общество, культуру, ценности людей, повседневную жизнь, правила этикета и искусство.
