- sentence_id: hb-c03-u0066-s002
  sv: Livsåskådningskunskap är ett tvärvetenskapligt, obundet åskådningsämne i grundskolan och gymnasiet
    som omfattar element från filosofin och samhälls-, religions- och kulturvetenskaperna.
  ru: «Мировоззрение и этика» — междисциплинарный, независимый от вероисповедания мировоззренческий предмет
    в общеобразовательной школе и гимназии, включающий элементы философии и общественных наук, религиоведения
    и культурологии.
  scene_id: hb-c03-u0066
