scenes:
- id: scene-1
  description: Om du tar hand om ditt barn hemma, har du rätt att ta ut oavlönad vårdledighet från ditt
    arbete ända tills barnet fyller tre år.
- id: scene-2
  description: Om du ska vara vårdledig kan du ansöka om hemvårdsstöd hos FPA.
- id: scene-3
  description: 'Du kan få hemvårdsstöd om alla dessa villkor uppfylls:'
- id: scene-4
  description: Barnet är inte på daghem (eller i annan småbarnspedagogik).
- id: scene-5
  description: Föräldern eller någon annan (t.ex. en släkting) vårdar barnet.
- id: scene-6
  description: Det har gått 160 vardagar (ungefär sex månader) sedan barnet föddes.
- id: scene-7
  description: För barnet betalas ingen föräldrapenning eller partiell föräldrapenning.
- id: scene-8
  description: 'Också ett av följande krav måste uppfyllas:'
- id: scene-9
  description: Barnet bor stadigvarande i Finland eller
- id: scene-10
  description: Barnet bor tillfälligt i Finland och minst en av föräldrarna arbetar i Finland och har
    en arbetspensionsförsäkring.
- id: scene-11
  description: Du kan få hemvårdsstöd samtidigt för flera barn under skolåldern, så länge barnen inte
    är på daghem (eller i annan småbarnspedagogik).
- id: scene-12
  description: Hemvårdsstödet är skattepliktigt.
- id: scene-13
  description: Hemvårdsstöd kan i vissa fall även betalas när barnet bor i ett annat land.
- id: scene-14
  description: Du kan få hemvårdsstöd från Finland om
- id: scene-15
  description: du arbetar i Finland men ditt barn bor i ett annat EU- eller EES-land eller
- id: scene-16
  description: du flyttar tillfälligt utomlands.
- id: scene-17
  description: Flexibel vårdpenning och partiell vårdpenning är avsedda för föräldrar som arbetar på deltid
    på grund av vård av barn.
- id: scene-18
  description: Föräldrarna kan få flexibel vårdpenning eller partiell vårdpenning samtidigt om båda föräldrarna
    arbetar på deltid och tar hand om barnet under olika tider.
- id: scene-19
  description: Vårdpenning betalas bara för ett barn i taget och är skattepliktig inkomst.
- id: scene-20
  description: Du kan få flexibel vårdpenning om
- id: scene-21
  description: du bor med barnet i Finland
- id: scene-22
  description: barnet är under tre år
- id: scene-23
  description: du arbetar högst 30 timmar i veckan
- id: scene-24
  description: barnet inte är på daghem (eller i annan småbarnspedagogik) på heltid.
- id: scene-25
  description: Barnet kan vara på daghem eller i annan småbarnspedagogik på deltid.
- id: scene-26
  description: Du kan få partiell vårdpenning om
- id: scene-27
  description: du bor med barnet i Finland
- id: scene-28
  description: barnet går i åk 1 eller 2 i grundskolan
- id: scene-29
  description: du arbetar högst 30 timmar i veckan.
- id: scene-30
  description: Du kan inte få flexibel eller partiell vårdpenning om du får föräldradagpenning och/eller
    hemvårdsstöd och själv tar hand om dina barn.
