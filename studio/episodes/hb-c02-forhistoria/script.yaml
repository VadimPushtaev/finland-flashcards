    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Lake Vanajavesi and Häme Castle from air.jpg by Janne Räkköläinen from Hämeenlinna,
    Finland continuously as decorative background, darkened42% and blurred2.5px. Smooth cyclic diagonal
    pan(0.15,0.15)→(0.85,0.85) and15%relative zoom1.06→1.219,140seconds per motion cycle, starting in
    motion, with no sentence resets. Total cycles=1.9949404761904759. Foreground and bilingual text remain
    fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Light Awash by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 1760.052 seconds; prepared lossless stereo bed 279.292 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Sparse exact-source date and concept cards at selected factual turning points. Background
    remains visible otherwise. These typography cards do not imply historical event imagery; suppress
    redundant captions.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two readable15second credit cards over continuing photo. Full source and media attribution
    travels beside final MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
