episode_decisions:
- id: opening
  decision: Exact bilingual heading on an unspoken3-second card; continuous background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Use the individually planned consecutive scenes; every source sentence/list fragment exactly
    once in original order without added spoken transitions.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080/24fps, muted olive Chapter7palette {''background'': ''#30371f'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d2d9b7'', ''highlight'': ''#e7bf78'', ''separator'': ''#636e42''}. Liberation Sans48/40;
    fixed right bilingual panel and separate left picture area.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Text appears0.25seconds before complete measured narration; pause1.5seconds normally,2.2at
    scene boundaries,2.5for long pairs. No acceleration to force runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:0661 Nordea Helsinki.JPG by Arto Alanenpää continuously as decorative background,
    darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative
    zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets. Total
    cycles=5.461011904761905. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Shared local Swedish Supertonic3/F1,32steps,speed0.95,seed42,44100HzmonoPCM16; actual threads/settings
    measured in metrics. Names/numbers/overallbalance pending whole-video listening; ASR diagnostic only.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Thinking of You by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 110.054 seconds; prepared lossless stereo bed 764.542 seconds.
    Repeat count 7, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Change relevant foregrounds at employment-source topic boundaries: accurately identified
    photos of places/objects and original pictorial process diagrams. Aim>=50% measured narrated body
    display; never imply photographed people face the depicted employment problem. Source text unchanged;
    no added employment advice or updated claims.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Unspoken source/media credit cards and additional readable picture attributions,15seconds
    percard; full source,license and adaptation details accompany canonical export.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Exact archived Swedish and current reviewed Russian display
    preserved.
  status: proposed
  resolve_during: script
