    heading: Lön betalas vanligtvis en gång i månaden
    source_range:
      start: 0
      end: 467
    range_basis: normalized_html_block
    extracted_passage: Arbetsgivaren måste ge den anställda en lönespecifikation. I den ser den anställda
      alla skatter och övriga avgifter som dragits av på lönen. I specifikationen kan man också kontrollera
      att lönen och tilläggen har betalats ut korrekt. Om det finns ett fel i lönebetalningen och
      det har betalats för lite lön, ska man be att det korrigeras. Om man av misstag har fått för
      mycket lön är den anställda skyldig att betala tillbaka den del som överstiger den normala
      lönen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
