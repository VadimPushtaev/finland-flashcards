    source_range:
      start: 0
      end: 298
    range_basis: normalized_html_block
    extracted_passage: I Finland finns ingen allmän minimilön som skulle gälla alla yrken. Minilönerna
      för olika branscher anges i kollektivavtalen. Lönen kan vara antingen månadslön eller timlön.
      Lönen kan också vara en ackordslön. Då får en person lön när ett visst projekt eller en viss
      arbetsprestation har slutförts.
