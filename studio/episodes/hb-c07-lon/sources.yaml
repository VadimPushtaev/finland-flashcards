    range_basis: normalized_html_block
    extracted_passage: Matrasten på en halvtimme ingår i allmänhet inte i den avlönade arbetstiden,
      vilket innebär att man kan avlägsna sig från arbetsplatsen. Kafferasten i sin tur ingår i arbetstiden
      och ska tillbringas på arbetsplatsen.
