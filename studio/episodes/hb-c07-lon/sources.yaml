    heading: Under arbetsdagen har man rätt att ta överenskomna raster
    source_range:
      start: 0
      end: 390
    range_basis: normalized_html_block
    extracted_passage: Under arbetsdagen har den anställda raster. Rasternas antal och längd beror
      på arbetsdagens längd. I branschens kollektivavtal kan man kontrollera vad som avtalats om
      raster. Om arbetsdagen är över sex timmar lång, har den anställda rätt till minst en halvtimmes
      rast under dagen. Om den anställda arbetar åtta timmar per dag, har hen vanligtvis en längre
      matrast och två korta kafferaster.
    normalization: whitespace_only
    repairs: []
