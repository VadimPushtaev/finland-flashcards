    heading: Användning av egen telefon under arbetsdagen kan begränsas
    source_range:
      start: 0
      end: 342
    range_basis: normalized_html_block
    extracted_passage: Den anställda får inte sköta egna angelägenheter på arbetstid. I allmänhet
      är till exempel användning av egen telefon begränsad under arbetsdagen. Den anställda får ändå
      använda sin telefon på raster och då uträtta ärenden. Om arbetsgivaren förser den anställda
      med en arbetstelefon, är den i allmänhet avsedd endast för utförande av arbetet.
