    source_range:
      start: 0
      end: 482
    range_basis: normalized_html_block
    extracted_passage: Om en anställd arbetar på kvällar, helger eller högtider får hen utöver den
      vanliga lönen också tillägg. Tilläggens storlek beror på yrket och kollektivavtalet för branschen.
      För söndagsarbete måste man betala dubbel lön inom alla branscher. Om en anställd på arbetsgivarens
      order arbetar övertid utöver den normala arbetstiden, måste extra lön betalas också för det.
      I kollektivavtalet för den egna branschen finns information om hurdana tillägg som ska betalas
      till arbetstagarna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
