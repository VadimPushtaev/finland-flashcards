- id: text_and_layout
  decision: '1920x1080 at24fps. Chapter3 plum palette #342736; ivory #faf3e8, lavender #d8c8dc, warm highlight
    #e2bb85, separator #62506a. Liberation Sans Bold48/regular40; explicitly44/36 or40/34 only where layout
    requires. Stable Swedish-above-Russian right panel; source-only foreground term cards when useful.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display each pair0.25seconds before narration. Natural local voice at speed0.95. Pause1.5seconds
    after ordinary sentences and2.2seconds at scene ends;2.5seconds for long pairs. No target-duration
    acceleration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Musiikkitalo, Helsinki, Finland.jpg by Alejandro continuously as decorative background,
    darkened42% and blurred2.5px. Smooth cyclic diagonal pan(0.15,0.15)→(0.85,0.85) and15%relative zoom1.06→1.219,140seconds
    per motion cycle, starting in motion, with no sentence resets. Total cycles=1.1104166666666668. Foreground
    and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use series local Supertonic3/F1, Swedish,32steps,speed0.95,seed42,44100Hz mono PCM16. Exact
    inputs and checksums retained. Numbers and abbreviations have separately recorded speech-only expansions;
    pronunciation awaits whole-video review.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Gymnopedie No. 1 by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 187.089 seconds; prepared lossless stereo bed 155.458 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Selected source terms highlight this episode’s actual concepts. Use complete source-only typography
    cards; labels preserve exact source spelling and add no facts. Leave the foreground open elsewhere,
    suppressing unused captions.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two15second source/media credit cards; complete attribution accompanies exported MP4.
  status: proposed
  resolve_during: script
- id: background_resampling
  decision: Use bilinear resampling only for the preblurred decorative background, preserving fractional
    crop and continuous motion. Coordinator reference benchmark found mean pixel difference 0.071/255
    and maximum 2/255 versus bicubic, reducing per-frame background processing. Text and foreground remain
    unchanged; inspect stills and verify exported motion.
  status: proposed
  resolve_during: render
- id: exceptions
  decision: No exception to shared direction. All creative choices are proposals for whole-video user
    review.
  status: proposed
  resolve_during: script
