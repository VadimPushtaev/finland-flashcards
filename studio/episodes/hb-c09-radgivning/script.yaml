scenes:
- id: scene-1
  description: En mödrarådgivning är en hälsovårdstjänst där mamman och hela familjen får vägledning och
    råd.
- id: scene-2
  description: Efter att barnet fötts följer en hälsovårdare på rådgivningsbyrån upp hur barnet växer
    och utvecklas.
- id: scene-3
  description: För föräldrar som väntar sitt första barn ordnar rådgivningsbyrån en familjeförberedelsekurs.
- id: scene-4
  description: Mammor som är permanent bosatta i Finland kan ansöka om moderskapsunderstöd hos FPA.
- id: scene-5
  description: Staten började dela ut moderskapsunderstöd till mindre bemedlade mammor på 1930-talet.
- id: scene-6
  description: I Finland föder så gott som alla mammor på ett förlossningssjukhus.
- id: scene-7
  description: I Finland är könsstympning av flickor och kvinnor ett brott.
- id: scene-8
  description: I Finland är könsstympning av flickor ett allvarligt brott, som kan ge flera års fängelsestraff.
- id: scene-9
  description: Omskärelse av pojkar är inte förbjuden i lag i Finland, men utförs inte inom den offentliga
    hälsovården utan medicinsk orsak.
- id: scene-10
  description: Vanligen måste du vara stadigvarande bosatt i Finland eller arbeta i Finland för att kunna
    få stöd.
- id: scene-11
  description: Om du bor i Finland kan du ha rätt till moderskapsunderstöd.
- id: scene-12
  description: Du har rätt till moderskapsunderstöd då
- id: scene-13
  description: graviditeten varat i cirka fem månader,
- id: scene-14
  description: du har gjort en läkarundersökning före utgången av den fjärde graviditetsmånaden och
- id: scene-15
  description: du bor stadigvarande i Finland.
