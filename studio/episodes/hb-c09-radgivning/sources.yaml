    heading: Moderskapsförpackningen innehåller babykläder och produkter för babyvård
    source_range:
      start: 0
      end: 384
    range_basis: normalized_html_block
    extracted_passage: Mammor som är permanent bosatta i Finland kan ansöka om moderskapsunderstöd
      hos FPA. Moderskapsunderstödet kan fås antingen i form av en moderskapsförpackning eller i
      pengar. Moderskapsförpackningen innehåller saker som babyn behöver de första månaderna, till
      exempel kläder, en åkpåse och produkter för babyvård. Allt är packat i en stor låda som kan
      användas som babyns första säng.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
