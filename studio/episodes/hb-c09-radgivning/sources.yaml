    heading: I Finland sker förlossningar i allmänhet på sjukhus
    source_range:
      start: 0
      end: 265
    range_basis: normalized_html_block
    extracted_passage: I Finland föder så gott som alla mammor på ett förlossningssjukhus. Där hjälper
      en barnmorska mamman under förlossningen. En barnmorska är en sjukskötare som är specialiserad
      på förlossningar. Det är vanligt att också babyns andra förälder är med vid förlossningen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
