    source_range:
      start: 0
      end: 236
    range_basis: normalized_html_block
    extracted_passage: Efter att barnet fötts följer en hälsovårdare på rådgivningsbyrån upp hur
      barnet växer och utvecklas. Hälsovårdaren diskuterar också med familjen om sådant som gäller
      barnet. Rådgivningsbyrån är avgiftsfri, och alla familjer kan gå dit.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
