    range_basis: normalized_html_block
    extracted_passage: För föräldrar som väntar sitt första barn ordnar rådgivningsbyrån en familjeförberedelsekurs.
      På kursen berättar hälsovårdare om hur man ska ta hand om babyn och om livet med en baby.
