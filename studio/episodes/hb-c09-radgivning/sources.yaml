    heading: I Finland är könsstympning av flickor förbjuden
    source_range:
      start: 0
      end: 336
    range_basis: normalized_html_block
    extracted_passage: I Finland är könsstympning av flickor ett allvarligt brott, som kan ge flera
      års fängelsestraff. En finsk medborgare eller en flicka som bor här permanent får inte könsstympas
      i Finland eller något annat land. En vuxen får alltså inte ta med sig en flicka från Finland
      till ett annat land för att tvinga henne att genomgå könsstympning.
    normalization: whitespace_only
