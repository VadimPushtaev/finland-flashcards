    heading: Mödrarådgivningen stöder den blivande mamman, fostret och hela familjens välbefinnande
    source_range:
      start: 0
      end: 252
    range_basis: normalized_html_block
    extracted_passage: En mödrarådgivning är en hälsovårdstjänst där mamman och hela familjen får
      vägledning och råd. På mödrarådgivningen följer man upp den gravida kvinnans och fostrets välbefinnande.
      Dessutom får hela familjen stöd med att förbereda sig för den nya babyn.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
