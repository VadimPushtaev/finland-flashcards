    range_basis: normalized_html_block
    extracted_passage: Staten började dela ut moderskapsunderstöd till mindre bemedlade mammor på
      1930-talet. Med hjälp av det fick mammor och babyer tillgång till hälsovård och barndödligheten
      började minska. Från och med år 1949 har alla mammor i Finland fått understödet.
    normalization: whitespace_only
