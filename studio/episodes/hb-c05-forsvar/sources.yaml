    extracted_passage: Om en värnpliktig vägrar att göra antingen beväringstjänst eller civiltjänst,
      eller vägrar att slutföra en påbörjad tjänstgöring, döms hen för vägran att fullgöra värnplikt
      eller civiltjänst. Domens längd är hälften av den kvarvarande tjänstgöringstiden. Numera avtjänas
      straff för vägran i allmänhet som övervakningsstraff, det vill säga husarrest, i stället för
      i fängelse.
