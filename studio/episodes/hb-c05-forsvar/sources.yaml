    extracted_passage: Av skyldigheten att försvara landet följer att alla finländska män i åldern
      18–60 år har värnplikt. Det betyder att de måste göra antingen beväringstjänst, det vill säga
      militärtjänst, eller civiltjänst. Civiltjänst är ett alternativ för dem som inte vill göra
      militärtjänst.
