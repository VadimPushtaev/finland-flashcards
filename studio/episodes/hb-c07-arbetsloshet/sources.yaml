    heading: Arbetsverksamhet i rehabiliteringssyfte stärker arbetsförmågan
    source_range:
      start: 0
      end: 399
    range_basis: normalized_html_block
    extracted_passage: Om en arbetssökande har varit länge arbetslös, kan hen få delta i arbetsverksamhet
      i rehabiliteringssyfte. Man kommer överens om innehållet i den tillsammans med sysselsättningstjänsterna
      och välfärdsområdet. Syftet med arbetsverksamhet i rehabiliteringssyfte är att stärka kundens
      arbets- och funktionsförmåga och förbättra hens kompetens. Verksamheten kan vara av samma typ
      som vid arbetsprövning.
    normalization: whitespace_only
