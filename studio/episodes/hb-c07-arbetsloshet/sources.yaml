    heading: Arbetskraftsutbildning kan förbättra den arbetssökandes sysselsättningsmöjligheter
    source_range:
      start: 0
      end: 529
    range_basis: normalized_html_block
    extracted_passage: Det är möjligt att be om stöd också för utbildning eller byte av yrke hos
      sysselsättningstjänsterna. Ett av de viktigaste alternativen är yrkesinriktad arbetskraftsutbildning.
      Det finns utbildning inom många olika branscher. Till arbetskraftsutbildningar ansöker man
      via sysselsättningstjänsterna. Sysselsättningstjänsterna kan också stödja frivillig utbildning
      som den arbetssökande själv har hittat, om den förbättrar hens sysselsättningsmöjligheter och
      det bland arbetskraftsutbildningarna inte finns någon lämplig utbildning.
