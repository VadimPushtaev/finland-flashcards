    range_basis: normalized_html_block
    extracted_passage: En arbetsprövning kan pågå i högst sex månader hos samma arbetsgivare. Under
      den tiden ges den som deltar i arbetsprövningen möjlighet att visa för arbetsgivaren vad hen
      kan och hur stor motivation hen har för arbetet. Ibland kan en period av arbetsprövning ge
      en riktig arbetsplats med lön eller ett lönesubventionerat arbete.
