    range_basis: normalized_html_block
    extracted_passage: Sysselsättningstjänsterna kartlägger också tillsammans med kunden olika utbildningsmöjligheter,
      till exempel arbetskraftsutbildningar eller självständiga studier. I synnerhet till personer
      som varit arbetslösa en längre tid kan sysselsättningstjänsterna skicka erbjudanden om lediga
      platser som de måste söka. Om de inte gör det kan de förlora rätten till arbetslöshetsskydd
      för en viss tid.
