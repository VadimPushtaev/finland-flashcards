    heading: Vilka tjänster erbjuder sysselsättningstjänsterna för arbetssökande?
    source_range:
      start: 0
      end: 332
    range_basis: normalized_html_block
    extracted_passage: När en person söker arbete är det viktigaste att hen själv är aktiv. Sysselsättningstjänsterna
      ger handledning och rådgivning för jobbsökningen och utvecklingen av den egna kompetensen.
      De hänvisar arbetssökande till exempelvis rekryteringsevenemang och till att leta efter lediga
      platser på internet och lämna in arbetsansökningar.
