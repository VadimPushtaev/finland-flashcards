    heading: Med hjälp av lönesubvention är det förmånligare för arbetsgivaren att anställa arbetstagare
    source_range:
      start: 0
      end: 440
    range_basis: normalized_html_block
    extracted_passage: Lönesubvention är ett ekonomiskt stöd som betalas av staten och som underlättar
      sysselsättningen av arbetslösa arbetssökande. Lönesubvention betalas till arbetsgivaren för
      arbetstagarens lönekostnader. Arbetstagaren har ett normalt anställningsförhållande med arbetsgivaren.
      Man kan fråga om möjligheten till lönesubvention hos sysselsättningstjänsterna. Arbetslösa
      arbetssökande kan ansöka om lönesubvention också för läroavtalsutbildning.
    normalization: whitespace_only
