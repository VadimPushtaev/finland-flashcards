    heading: Arbetsgivaren kan inte på egen hand avtala om oavlönade praktikperioder
    source_range:
      start: 0
      end: 530
    range_basis: normalized_html_block
    extracted_passage: Det är viktigt att komma ihåg att i Finland kan endast arbetskraftstjänsterna
      eller läroanstalter godkänna oavlönade perioder av arbetspraktik eller arbetsprövning. Ibland
      kan det hända att en arbetsgivare tar en arbetstagare direkt till arbetsplatsen för en oavlönad
      praktikperiod och lovar att hen kan få ett lönearbete när perioden är slut. Arbetsgivaren har
      ändå inte rätt att låta en arbetstagare utföra gratis arbete, om sysselsättningstjänsterna
      eller en läroanstalt inte först har godkänt praktik- eller prövningsperioden.
