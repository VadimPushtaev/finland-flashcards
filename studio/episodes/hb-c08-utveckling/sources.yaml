    range_basis: normalized_html_block
    extracted_passage: I Finland kan man få en utbildning enligt utbildningssystemet på finska eller
      svenska. I de svenskspråkiga skolorna studerar man också finska. Studierna i finska inleds
      ofta redan i årskurs ett. I de finskspråkiga skolorna studerar man svenska oftast från och
      med årskurs sex.
