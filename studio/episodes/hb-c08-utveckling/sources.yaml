    source_range:
      start: 0
      end: 381
    range_basis: normalized_html_block
    extracted_passage: Lärandet och studierna upphör inte när en person avlägger sin examen eller
      blir myndig. Det är bra att utveckla sig själv under hela livet, eftersom det omgivande samhället
      och arbetslivet hela tiden förändras. Med hjälp av utbildning kan vem som helst ha möjlighet
      att få en bättre ställning i samhället. Lärande och bildning är viktiga och användbara för
      det egna välbefinnandet.
    normalization: whitespace_only
