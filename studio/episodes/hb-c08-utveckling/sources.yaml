    extracted_passage: Utvecklingen av utbildningssystemet var en viktig del av uppbyggnaden av välfärdssamhället
      i Finland. Höjningen av medborgarnas utbildningsnivå under de senaste hundra åren har bidragit
      till landets ekonomiska utveckling och uppkomsten av ett mer jämställt samhälle.
