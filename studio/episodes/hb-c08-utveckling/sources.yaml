    range_basis: normalized_html_block
    extracted_passage: Bakgrunden till det finländska utbildningssystemet är en idé om kontinuerligt
      lärande. Med kontinuerligt lärande avses allt lärande som sker genom hela livet och som syftar
      till att utveckla individens kunskaper, färdigheter och förmågor i både det personliga livet
      och arbetslivet. Människan lär sig såväl i skolan som i livet, till exempel i vardagen och
      hobbyer.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
