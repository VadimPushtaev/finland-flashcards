- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Heinatori School Oulu pre1911.jpg by Unknown authorUnknown author continuously as
    decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85)
    and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence
    resets. Total cycles=3.5339285714285715. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Supertonic3/F1 Swedish,32steps,speed0.95,seed42,44100HzmonoPCM16,2ONNXthreads. Whole-video
    listening and user acceptance pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Smoother Move by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 278.073 seconds; prepared lossless stereo bed 494.750 seconds.
    Repeat count 1, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: A distinct relevant source-based illustration for nearly every sentence slide, supplemented
    by verified photographs where they clarify actual institutions or places. Distinct semantic compositions
    show only the source statements. Aim at least90% measured body picture coverage and report unique-picture
    ratio.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c08-u0001
  description: Samhälleliga förändringar sker alltid av någon orsak.
- id: hb-c08-u0002
  description: I många europeiska länder började reformationen på 1500-talet.
- id: hb-c08-u0003
  description: I början av 1800-talet blev Finland en autonom del av Ryssland, vilket ändrade Finlands
    ställning.
- id: hb-c08-u0004
  description: I och med industrialiseringen skildes skolan från kyrkan.
- id: hb-c08-u0005
  description: Kommunerna började grunda folkskolor separat från kyrkan och dessa skolor spreds småningom
    till hela landet.
- id: hb-c08-u0006
  description: Vid sidan av folkskolorna fanns också läroverk, av vilka många var privata.
- id: hb-c08-u0007
  description: Först på 1900-talets sida började större delen av befolkningen stöda folkskolan och 1921
    stiftades en lag om läroplikt i Finland.
- id: hb-c08-u0008
  description: Gymnasieutbildning och studentexamen blev vanligare särskilt på 1950- och 1960-talet.
- id: hb-c08-u0009
  description: Utvecklingen av utbildningssystemet var en viktig del av uppbyggnaden av välfärdssamhället
    i Finland.
- id: hb-c08-u0010
  description: I Finland kan man få en utbildning enligt utbildningssystemet på finska eller svenska.
- id: hb-c08-u0011
  description: Bakgrunden till det finländska utbildningssystemet är en idé om kontinuerligt lärande.
- id: hb-c08-u0012
  description: Lärandet och studierna upphör inte när en person avlägger sin examen eller blir myndig.
- id: hb-c08-u0013
  description: Lärande och utbildning hjälper människor att klara sig både i det föränderliga arbetslivet
    och i en värld som blir alltmer internationell.
