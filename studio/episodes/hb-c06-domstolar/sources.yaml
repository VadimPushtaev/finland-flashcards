    range_basis: normalized_html_block
    extracted_passage: Den första rättsinstansen är tingsrätten, som fäller en dom i ärendet. Förhandlingen
      i tingsrätten kan ske muntligt eller skriftligt. Vid en muntlig förhandling berättar parterna
      (den åtalade, målsäganden, det vill säga offret, och åklagaren) vad som har hänt ur sitt perspektiv.
    normalization: whitespace_only
