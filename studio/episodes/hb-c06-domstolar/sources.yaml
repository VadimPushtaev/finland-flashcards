    heading: Domstolssystemet bedömer om lagen har brutits
    source_range:
      start: 0
      end: 571
    range_basis: normalized_html_block
    extracted_passage: I rätten bedömer domarna om bevisen i fallen är tillförlitliga. Sedan utfärdar
      de domar i fallen de behandlar. I en del länder bedöms bevisen av en jury eller så kan landets
      rättssystem basera sig på religionen. Också i Finland kan det ibland finnas nämndemän, det
      vill säga lekmannadomare, vid domstolsförhandlingar, om det är fråga om ett grovt eller allvarligt
      brottmål. I sådana fall är det i allmänhet en nämndemannasammansättning bestående av en yrkesdomare
      och två nämndemän som beslutar om domen. Varje medlem i sammansättningen har samma makt i beslutsfattandet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
