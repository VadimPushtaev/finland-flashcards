    range_basis: normalized_html_block
    extracted_passage: Om ett vittne är rädd, kan rätten höra hen vid en annan tidpunkt än den åtalade
      eller bakom en skärmvägg. Då behöver vittnet inte se eller träffa den åtalade i rätten. I extremfall
      kan ett vittnesskyddsprogram inledas för ett vittne som innebär att hen tillfälligt får ett
      nytt namn och en ny bostadsort.
