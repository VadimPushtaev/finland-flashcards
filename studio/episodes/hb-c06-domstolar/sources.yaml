    heading: Domstolssystemet bedömer om lagen har brutits
    source_range:
      start: 0
      end: 403
    range_basis: normalized_html_block
    extracted_passage: 'Finland har ett domstolssystem i tre steg: tingsrätter, hovrätter och högsta
      domstolen. I Finland finns det också en förvaltningsdomstol, som behandlar främst ärenden som
      gäller myndigheter och deras verksamhet. Som högsta förvaltningsdomstol verkar högsta förvaltningsdomstolen.
      Utöver dessa finns det också specialdomstolar, till exempel en arbetsdomstol, en försäkringsdomstol
      och en marknadsdomstol.'
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
