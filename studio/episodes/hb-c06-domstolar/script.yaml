- sentence_id: hb-c06-u0097-s002
  sv: I Finland finns det också en förvaltningsdomstol, som behandlar främst ärenden som gäller myndigheter
    och deras verksamhet.
  ru: В Финляндии также существует административный суд, который рассматривает прежде всего дела, касающиеся
    органов власти и их деятельности.
  scene_id: system
