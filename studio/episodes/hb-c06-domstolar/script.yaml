    om det är fråga om ett grovt eller allvarligt brottmål.
  ru: И в Финляндии в судебных заседаниях иногда могут участвовать заседатели, то есть непрофессиональные
    судьи, если рассматривается тяжкое или серьёзное уголовное дело.
