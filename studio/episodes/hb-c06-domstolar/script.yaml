sentences:
- sentence_id: hb-c06-u0097-s001
  sv: 'Finland har ett domstolssystem i tre steg: tingsrätter, hovrätter och högsta domstolen.'
  ru: 'В Финляндии трёхступенчатая судебная система: уездные суды (tingsrätter), апелляционные суды (hovrätter)
    и Верховный суд (högsta domstolen).'
  scene_id: system
  visual_cue: Court system and separate jurisdictions; foreground levels
