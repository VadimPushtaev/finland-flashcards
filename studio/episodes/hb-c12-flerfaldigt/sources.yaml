    range_basis: normalized_html_block
    extracted_passage: Alla stater godkänner dock inte flerfaldigt medborgarskap. Innan du ansöker
      om finskt medborgarskap är det bra att ta reda på om flerfaldigt medborgarskap också är tillåtet
      i det land där du är medborgare. Om denna stat inte tillåter flerfaldigt medborgarskap kan
      du förlora ditt nuvarande medborgarskap när du får finskt medborgarskap.
    normalization: whitespace_only
