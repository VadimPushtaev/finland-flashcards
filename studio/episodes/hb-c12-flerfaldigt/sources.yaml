      end: 345
    range_basis: normalized_html_block
    extracted_passage: Flerfaldigt medborgarskap kan vara en fördel, men också en nackdel. Det lönar
      sig att till exempel ta reda på om man tvingas göra värnplikten i flera medborgarskapsstater
      eller om det räcker med ett intyg över fullgjord värnplikt i ett land. Flerfaldigt medborgarskap
      kan vara en fördel när man till exempel flyttar från ett land till ett annat.
    normalization: whitespace_only
    repairs: []
