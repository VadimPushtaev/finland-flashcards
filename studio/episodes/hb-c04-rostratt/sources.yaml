    heading: I Europaparlamentsvalet utses Finlands representanter i Europaparlamentet
    source_range:
      start: 0
      end: 435
    range_basis: normalized_html_block
    extracted_passage: Kandidaterna i Europaparlamentsvalet representerar olika partier, på samma
      sätt som i riksdagsvalet. Hela Finland är en och samma valkrets, det vill säga man kan rösta
      på samma kandidater överallt i Finland. Man kan ställa upp som kandidat om man är finsk medborgare
      eller medborgare i ett annat EU-land, det vill säga om man har rösträtt i Europaparlamentsvalet.
      Kandidaterna nomineras av ett politiskt parti eller en valmansförening.
