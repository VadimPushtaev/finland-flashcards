    heading: Samarbetsfärdigheter värdesätts
    source_range:
      start: 0
      end: 290
    range_basis: normalized_html_block
    extracted_passage: På arbetsplatserna arbetar man ofta i team. Därför är det viktigt att kunna
      samarbeta med sina arbetskamrater. I allmänhet hjälper de anställda varandra och utför flexibelt
      olika uppgifter enligt behov. Människorna litar på varandra och på att var och en utför överenskomna
      arbetsuppgifter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
