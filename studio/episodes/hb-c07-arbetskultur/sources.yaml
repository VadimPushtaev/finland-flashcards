    source_kind: p
    source_role: content
    heading: På arbetsplatserna är man rättfram
    source_range:
      start: 0
      end: 546
    range_basis: normalized_html_block
    extracted_passage: På arbetsplatsen är människorna vanligtvis ganska rättframma och säger vad
      de tänker. Det är vanligt att gå rakt på sak utan att först prata om ditt och datt. I arbetet
      diskuterar man ofta direkt också negativa saker. Man behöver alltså inte ta illa upp om till
      exempel chefen eller en arbetskamrat säger att arbetet har utförts dåligt. Alla misslyckas
      ibland i arbetet. I dag uppmuntras respons i arbetet. Respons ges mellan anställda, av anställda
      till chefen och av chefen till anställda. Responsen ska ändå alltid vara saklig och konstruktiv.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
