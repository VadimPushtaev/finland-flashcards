    source_role: content
    heading: Chefen förväntar sig att den anställda är initiativrik
    source_range:
      start: 0
      end: 428
    range_basis: normalized_html_block
    extracted_passage: Chefen är ingen absolut auktoritet, utan vanligtvis ger hen de anställda möjlighet
      att planera sitt arbete och komma med idéer. Chefen förväntar sig att de anställda är initiativrika
      och samvetsgrant utför de överenskomna arbetsuppgifterna. Hen övervakar inte hela tiden de
      anställda, utan litar på att arbetet blir gjort. Chefen har ändå rätt att leda arbetet och
      ge de anställda instruktioner och order som de förväntas följa.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0033:
