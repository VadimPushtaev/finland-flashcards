    heading: Chefen förväntar sig att den anställda är initiativrik
    source_range:
      start: 0
      end: 442
    range_basis: normalized_html_block
    extracted_passage: Den anställda får på eget initiativ göra sådant på arbetsplatsen som hen märker
      att skulle vara bra att blir gjort. När en arbetsuppgift är klar börjar den anställda på eget
      initiativ med nästa, och när hen märker att något behöver göras gör hen det. Personen väntar
      inte på att chefen ska säga till hen att göra det. Om den anställda inte vet vad hen ska göra
      eller hur en arbetsuppgift ska utföras, frågar hen chefen eller arbetskamraterna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
