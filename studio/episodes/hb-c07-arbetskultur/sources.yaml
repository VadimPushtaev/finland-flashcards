    heading: Chefen förväntar sig att den anställda är initiativrik
    source_range:
      start: 0
      end: 411
    range_basis: normalized_html_block
    extracted_passage: Hierarkin på de finländska arbetsplatserna är i allmänhet låg. Chefen skiljer
      sig nästan inte alls från mängden och utför rätt så liknande arbete som de övriga. Chefen klär
      sig på samma sätt som de andra och hen tilltalas med förnamn. Man kan alltid gå till chefen
      om man har frågor om arbetet. Arbetsklädseln är ofta ledig och informell i Finland. Löneskillnaderna
      mellan chefen och de anställda är ganska små.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c07-u0032:
