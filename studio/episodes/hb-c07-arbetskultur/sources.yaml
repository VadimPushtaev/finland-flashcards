    heading: Släktskap eller kön ska inte påverka anställningen
    source_range:
      start: 0
      end: 483
    range_basis: normalized_html_block
    extracted_passage: Den individinriktade och jämställda kulturen i Finland är tydlig i arbetskulturen
      i landet. Individens kompetens och prestationer är viktiga för att få anställning, utföra arbetet
      och avancera i yrkeskarriären. Att favorisera släktingar eller vänner vid rekrytering oberoende
      av om personen är lämplig för arbetsuppgiften är inte acceptabelt i Finland. Inte heller könet
      ska påverka anställningen eller hur man avancerar i karriären, utan kvinnor och män är jämställda
      i arbetslivet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
