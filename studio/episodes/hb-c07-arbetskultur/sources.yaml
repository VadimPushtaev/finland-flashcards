    heading: Det är bra att säga till om man inte kan eller hinner utföra en arbetsuppgift
    source_range:
      start: 0
      end: 369
    range_basis: normalized_html_block
    extracted_passage: Om en anställd ombeds att göra en viss arbetsuppgift som hen inte kan, är
      det bättre att hen genast öppet säger att hen inte har gjort uppgiften i fråga tidigare eller
      annars inte behärskar den. Då tycker arbetskamraterna och chefen att den anställda har varit
      ärlig. Hen kan till exempel säga att hen gärna lär sig uppgiften och fråga om någon kan berätta
      hur man gör.
    normalization: whitespace_only
