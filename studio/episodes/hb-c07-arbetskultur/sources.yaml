    heading: En bra arbetstagare är punktlig och flitig
    source_range:
      start: 0
      end: 530
    range_basis: normalized_html_block
    extracted_passage: Utöver initiativrikedom är också punktlighet, flit och samvetsgrannhet uppskattade
      egenskaper hos arbetstagare i Finland. Om en anställd ofta kommer för sent till jobbet eller
      inte följer tidsplaner betraktas hen som opålitlig, vilket till och med kan vara en orsak till
      att avsluta anställningsförhållandet. Under arbetstid strävar man efter att vara flitig och
      utföra sitt arbete så effektivt som möjligt. Samvetsgrannhet betyder att den anställda utför
      de uppgifter som getts hen så bra som hen kan och att man kan lita på hen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
