- sentence_id: hb-c07-u0029-s003
  sv: Att favorisera släktingar eller vänner vid rekrytering oberoende av om personen är lämplig för arbetsuppgiften
    är inte acceptabelt i Finland.
  ru: Оказывать предпочтение родственникам или друзьям при найме независимо от того, подходит ли человек
    для этой работы, в Финляндии недопустимо.
  scene_id: scene-1
  visual_cue: Show Kompetens, prestation och jämställd rekrytering using the source-specific foreground
