scenes:
- id: hb-c08-u0097
  description: Efter grundskolan fortsätter de unga sina studier på en utbildning på andra stadiet, det
    vill säga ett gymnasium eller en yrkesläroanstalt.
- id: hb-c08-u0098
  description: Med ett avgångsbetyg från gymnasiet och ett studentexamensbetyg kan man söka till många
    olika slags fortsatta studier vid en högskola.
- id: hb-c08-u0099
  description: Gymnasiets läsår följer i allmänhet samma tidsplan som grundskolans.
- id: hb-c08-u0100
  description: Vanligtvis tar gymnasiestudierna tre år, men man kan också avlägga dess lärokurs långsammare
    eller snabbare.
- id: hb-c08-u0101
  description: I gymnasiet studerar man många olika läroämnen, till exempel modersmål och främmande språk,
    finska eller svenska som andraspråk, matematik, fysik, kemi, biologi, historia, religion eller livsåskådningskunskap,
    samhällslära, gymnastik, musik och bildkonst.
- id: hb-c08-u0102
  description: I gymnasiet får de studerande siffervitsord för de studieperioder de avlägger.
- id: hb-c08-u0103
  description: Under gymnasiet avlägger de studerande studentexamen.
- id: hb-c08-u0104
  description: Studentexamen ordnas två gånger per år, varje vår och höst.
- id: hb-c08-u0105
  description: För studentexamensproven får den studerande vitsord med bokstäver som härstammar från latinska
    vitsord.
- id: hb-c08-u0106
  description: På gymnasiet finns inga terminsavgifter.
