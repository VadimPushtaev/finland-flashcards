- id: music_selection
  decision: Use Comfortable Mystery 2 by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 53.917 seconds; prepared lossless stereo bed 274.208
    seconds. Repeat count 5, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credits and matching canonical sidecar,derived from this episode actual
    sources.yaml and media sources. No spoken credits.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception. Exact archived wording and current reviewed Russian remain unchanged. Record
    source typos/pronunciation diagnostics for whole-video review.
  status: proposed
  resolve_during: script
