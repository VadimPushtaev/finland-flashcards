- id: visual_motion
  decision: Use File:Nuuksio National Park 8-2022 49.jpg by Stephan van Helden continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
