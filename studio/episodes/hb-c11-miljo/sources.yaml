  hb-c11-u0195:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 6
    printed_page: 5
    source_range:
      start: 1575
      end: 2049
    range_basis: raw_pdf_page
    extracted_passage: "Naturen skyddas för att man vill bevara djur- och växtarter och skydda naturens\
      \ mångfald mot \npåverkan från mänsklig verksamhet. Mångfald i naturen betyder att det finns\
      \ så många olika arter av \ndjur, växter och andra organismer som möjligt.  Människans verksamhet\
      \ orsakar förändringar i den \nnaturliga miljön; förstöring, förorening, nedskräpning och övergödning\
      \ samt utrotning av arter. \nMiljöskyddslagen förebygger förstöring av natur och miljö och\
      \ motverkar miljöskador."
    normalization: whitespace_only
    repairs: []
    selection: Add textbook subsection1.1 nature protection, biodiversity and animal welfare; preserve
      complete paragraph.
  hb-c11-u0196:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 6
    printed_page: 5
    source_range:
      start: 2051
      end: 2317
    range_basis: raw_pdf_page
    extracted_passage: "I Finland skyddas naturen av finsk lag, EU-lagstiftning, statliga myndigheter\
      \ och olika \nfrivilligorganisationer. Miljöministeriet grundades i Finland redan år 1983.\
      \ Det övervakar bland annat \natt naturresurserna utnyttjas hållbart och att naturens mångfald\
      \ bevaras."
    normalization: whitespace_only
    repairs: []
    selection: Add textbook subsection1.1 nature protection, biodiversity and animal welfare; preserve
      complete paragraph.
  hb-c11-u0197:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 6
    printed_page: 5
    source_range:
      start: 2319
      end: 2835
    range_basis: raw_pdf_page
    extracted_passage: "I Finland ska både vilda djur, husdjur och sällskapsdjur behandlas etiskt\
      \ och korrekt. Djurskyddslagen \nfrämjar djurens välmående och en bra behandling av djuren\
      \ i Finland. I lagen fastslås bland annat hur \ndjur ska skötas, uppfödas och slaktas och i\
      \ hurudana omständigheter djuren inte får hållas. \nMyndigheterna övervakar uppfödningen av\
      \ produktionsdjur, alltså till exempel kor, svin och höns. I \nFinland hör hundar och katter\
      \ till de vanligaste sällskapsdjuren. Både människor i städer och på landet \nhar sådana."
    normalization: whitespace_only
    repairs: []
    selection: Add textbook subsection1.1 nature protection, biodiversity and animal welfare; preserve
      complete paragraph.
