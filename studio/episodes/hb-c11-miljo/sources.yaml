    heading: Varför ska man spara energi?
    source_range:
      start: 0
      end: 368
    range_basis: normalized_html_block
    extracted_passage: I Finland är det viktigt att spara energi. Genom att spara energi och vatten
      sparar man pengar, eftersom el- och vattenräkningarna blir lägre. Genom att spara energi skyddar
      människorna också miljön. Tanken är att alla människor ska använda el, energi och vatten sparsamt
      hemma. Ju mindre energi som förbrukas, desto bättre kan vi skydda jorden mot klimatförändringen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
