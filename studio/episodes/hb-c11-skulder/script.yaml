    source typos/pronunciation diagnostics for whole-video review.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c11-u0173
  description: Om du har en räkning som du inte kan betala, kontakta avsändaren direkt.
- id: hb-c11-u0174
  description: Om du inte betalar räkningen senast på förfallodagen eller inte har kommit överens om att
    förlänga betalningstiden, måste du betala påminnelse- och inkassokostnader samt dröjsmålsränta.
- id: hb-c11-u0175
  description: Om du inte har betalat en räkning senast på förfallodagen får du en betalningspåminnelse.
- id: hb-c11-u0176
  description: Om du inte betalar räkningen eller kommer överens om en betalningsplan kan skulden slutligen
    gå till utmätning (ulosotto).
- id: hb-c11-u0177
  description: Ofta behövs ett domstolsbeslut för utmätning.
- id: hb-c11-u0178
  description: Om du inte betalar en räkning eller en skuld, kan du få en betalningsanmärkning (maksuhäiriömerkintä)
    i kreditupplysningsregistret.
- id: hb-c11-u0179
  description: Hyresvärden har rätt att häva hyresavtalet om du inte betalar din hyra.
- id: hb-c11-u0180
  description: Om du har svårigheter att betala hyran för din bostad ska du ta kontakt med hyresvärden.
- id: hb-c11-u0181
  description: Försök att komma överens om att flytta fram förfallodagen med din hyresvärd.
- id: hb-c11-u0182
  description: Om du har problem med att betala räkningar och skulder, kontakta rättshjälpsbyråns ekonomi-
    och skuldrådgivning (talous- ja velkaneuvonta).
- id: hb-c11-u0183
  description: 'Ekonomi- och skuldrådgivaren:'
- id: hb-c11-u0184
  description: utreder din ekonomiska situation med dig,
- id: hb-c11-u0186
  description: hjälper till att överväga olika lösningsalternativ och
- id: hb-c11-u0187
  description: hjälper till att utarbeta betalningsavtal.
- id: hb-c11-u0188
  description: Dessutom kan ekonomi- och skuldrådgivaren ge dig råd om hur du ansöker om ett skuldsaneringslån
    och skuldsanering.
- id: hb-c11-u0189
  description: Hos Takuusäätiö kan du också få hjälp med och råd om betalningen av skulder.
