    extracted_passage: I dag kommer en stor del av invandrarna till Finland på grund av arbete, studier
      eller familjen. Endast en liten del av de som flyttar till Finland är kvotflyktingar eller
      kommer till landet som asylsökande. År 2023 var de åtta största utländska nationaliteterna
      i Finland i storleksordning ester, ryssar, ukrainare, irakier, kineser, indier, filippinare
