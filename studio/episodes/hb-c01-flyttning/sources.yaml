    range_basis: normalized_html_block
    extracted_passage: 'Tidigare var Finland ett fattigt land, som många flyttade ifrån till andra
      länder för att hitta arbete och få ett bättre liv. På 1800-talet flyttade finländare i synnerhet
      till Nordamerika. Efter andra världskriget började finländarna i allt högre grad flytta från
      landet till städerna. Många flyttade utomlands för arbete, eftersom det inte fanns arbete för
      alla i Finland. På 1960- och 1970-talen flyttade som mest tiotusentals finländare till Sverige
      varje år för att få arbete. Finländarna var länge den största gruppen nyanlända i Sverige. '
    normalization: whitespace_only
    repairs: []
    selection: Omit final undated number of people in Sweden with Finnish ancestry; historical migration
      explanation retained.
