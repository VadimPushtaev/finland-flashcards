    range_basis: normalized_html_block
    extracted_passage: Olika världshändelser har under de senaste årtiondena fört fler människor
      till Finland från olika länder. Finland tog emot små mängder flyktingar på 1970- och 1980-talen
      först från Chile och sedan från Vietnam. Till följd av krigen som ledde till Jugoslaviens upplösning
      på 1990-talet kom det flyktingar från Balkanländerna.
