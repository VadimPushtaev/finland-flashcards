- sentence_id: hb-c05-u0073-s002
  sv: Man kan ta upp beteende eller praxis som skapar ojämlikhet till exempel på arbetsplatsen med chefen,
    på läroanstalten med en lärare eller inom myndighetstjänster med myndigheten i fråga.
  ru: Поведение или практику, создающие неравенство, можно обсудить, например, на работе с руководителем,
    в учебном заведении с учителем или при получении услуг органов власти с соответствующим органом власти.
