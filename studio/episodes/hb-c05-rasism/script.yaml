- sentence_id: hb-c05-u0071-s001
  sv: Rasism som dyker upp i interaktion kan visa sig i form av till exempel rop, öknamn, gester, utestängning,
    användning av rasistiska begrepp eller uttryck, eller mikroaggressioner.
  ru: Расизм, возникающий во взаимодействии, может проявляться, например, в форме выкриков, обидных прозвищ,
    жестов, исключения из общения, использования расистских понятий или выражений либо микроагрессий.
  scene_id: scene-5
  visual_cue: Show the source-backed interaction picture, with full source pair in fixed bilingual panel.
    Labels are part of the illustration; omit separate caption.
