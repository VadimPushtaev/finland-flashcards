  render_caption: false
  text_style:
    sv_size: 48
    ru_size: 40
- sentence_id: hb-c05-u0071-s002
  sv: Mikroaggressioner är till exempel frågor eller kommentarer om utseende eller beteende som kan vara
    oavsiktliga och välmenande, men som ändå stärker och upprätthåller rasistiska eller diskriminerande
    stereotyper.
  ru: Микроагрессии — это, например, вопросы или комментарии о внешности или поведении, которые могут
    быть непреднамеренными и благонамеренными, но всё же усиливают и поддерживают расистские или дискриминационные
    стереотипы.
  scene_id: scene-5
  visual_cue: Show the source-backed interaction picture, with full source pair in fixed bilingual panel.
    Labels are part of the illustration; omit separate caption.
