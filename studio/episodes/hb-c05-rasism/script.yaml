- sentence_id: hb-c05-u0072-s001
  sv: Upprepad rasism som förekommer i interaktion och mikroaggressioner kan ge upphov till minoritetsstress.
  ru: Повторяющийся расизм во взаимодействии и микроагрессии могут вызывать стресс меньшинств.
