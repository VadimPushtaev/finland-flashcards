- sentence_id: hb-c05-u0072-s004
  sv: Den kan också leda till internaliserad rasism, det vill säga till att den som upplever rasism själv
    börjar tro att hen är på något sätt sämre än andra.
  ru: Он также может привести к интернализованному расизму, то есть к тому, что человек, сталкивающийся
    с расизмом, сам начинает верить, что он в чём-то хуже других.
  scene_id: scene-6
  visual_cue: Show the source-backed stress picture, with full source pair in fixed bilingual panel. Labels
