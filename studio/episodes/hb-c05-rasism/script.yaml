- sentence_id: hb-c05-u0070-s006
  sv: Det är inte alltid fråga om enskilda handlingar, utan om ett större fenomen som berör hela samhället.
  ru: Речь не всегда идёт об отдельных действиях, а о более широком явлении, затрагивающем всё общество.
