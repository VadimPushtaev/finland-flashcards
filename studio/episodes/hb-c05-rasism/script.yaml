- sentence_id: hb-c05-u0072-s002
  sv: Den uppkommer till följd av upplevelser av diskriminering och rasism eller en rädsla för att sådana
    ska upprepas i olika situationer.
  ru: Он возникает вследствие пережитой дискриминации и расизма либо страха их повторения в различных
    ситуациях.
