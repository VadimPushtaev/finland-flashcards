- sentence_id: hb-c05-u0072-s006
  sv: Internaliserad rasism uppkommer ofta till följd av att omgivningen inte ingriper i rasistiska situationer,
    utan tigande verkar acceptera rasismen.
  ru: Интернализованный расизм часто возникает вследствие того, что окружающие не вмешиваются в расистские
    ситуации, а своим молчанием словно принимают расизм.
