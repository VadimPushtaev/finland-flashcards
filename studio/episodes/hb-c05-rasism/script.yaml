- sentence_id: hb-c05-u0071-s003
  sv: De upprätthåller idén om att en person avviker från normen, det vill säga från hurdan en person
    som befinner sig i en viss ställning eller som talar ett visst språk förväntas vara.
  ru: Они поддерживают представление о том, что человек отклоняется от нормы, то есть от того, каким ожидают
    видеть человека в определённом положении или говорящего на определённом языке.
  scene_id: scene-5
