    range_basis: normalized_html_block
    extracted_passage: Hux-utbildningen pågår i högst ett år, och under den bekantar man sig med
      olika utbildningar. Från Hux-utbildningen är det möjligt att på ett flexibelt sätt direkt övergå
      till en yrkesutbildning eller ett gymnasium. Hux-utbildningar är avsedda för både unga i läropliktsåldern
      och vuxna. För att avlägga en sådan kan man få studiestöd från FPA. Utbildningen är avgiftsfri,
      och man ansöker via den gemensamma ansökan eller den kontinuerliga ansökan.
