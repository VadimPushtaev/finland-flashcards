    extracted_passage: Under en Hux-utbildning, det vill säga en utbildning som handleder för examensutbildning,
      är det möjligt att förbättra sina studiefärdigheter eller kunskaper i studiespråket. Under
      Hux-utbildningen är det möjligt att höja vitsord från den grundläggande utbildningen, om det
      är nödvändigt för att få en utbildningsplats. Dessutom kan den studerande avlägga studier inom
      gymnasieutbildning och yrkesutbildning.
