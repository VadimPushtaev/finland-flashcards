    range_basis: normalized_html_block
    extracted_passage: Huvudhyresgästen ansvarar för bostaden och betalningen av hyran. Om huvudhyresgästen
      inte själv bor i bostaden, utan hyr ut hela bostaden till någon annan, är det fråga om vidareuthyrning.
      Uthyraren, eller hyresvärden, ska alltid informeras om vidareuthyrning och hen kan av grundad
      anledning också förbjuda vidareuthyrning.
