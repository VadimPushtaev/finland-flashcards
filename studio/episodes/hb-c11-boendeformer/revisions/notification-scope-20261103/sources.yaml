    range_basis: normalized_html_block
    extracted_passage: Vanligtvis ingår hyresgästen ett hyresavtal direkt med bostadens ägare, det
      vill säga ett företag, en privat hyresvärd eller ett kommunalt bostadsbolag. Hen är då bostadens
      huvudhyresgäst. Ibland kan huvudhyresgästen låta en underhyresgäst flytta in i bostaden. Då
      får en annan person bo i till exempel ett av rummen i samma bostad som huvudhyresgästen. Underhyresgästen
      ingår ett skriftligt hyresavtal med huvudhyresgästen, inte med bostadens ägare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
