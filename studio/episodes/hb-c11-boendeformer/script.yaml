scenes:
- id: hb-c11-u0001
  description: Det är lätt att hitta annonser om hyresbostäder på internet.
- id: hb-c11-u0002
  description: Hyresbostäderna i ett bostadsbolag som ägs av en stad eller en kommun är i allmänhet billigare
    än bostäder som ägs av en privatperson eller ett företag.
- id: hb-c11-u0003
  description: Vanligtvis ingår hyresgästen ett hyresavtal direkt med bostadens ägare, det vill säga ett
    företag, en privat hyresvärd eller ett kommunalt bostadsbolag.
- id: hb-c11-u0004
  description: Huvudhyresgästen ansvarar för bostaden och betalningen av hyran.
- id: hb-c11-u0005
  description: Ägarboende betyder för det mesta att den boende äger antingen ett egnahemshus eller en
    bostadsaktie.
- id: hb-c11-u0006
  description: Om man äger en bostad i ett höghus eller ett radhus är det fråga om en bostadsaktie.
- id: hb-c11-u0007
  description: Tomten som ett hus står på kan ägas av husets ägare eller av bostadsaktiebolaget.
- id: hb-c11-u0008
  description: En bostadsrättsbostad är en bostad för vilken du först betalar en bostadsrättsavgift.
- id: hb-c11-u0009
  description: Om bostadsrättsbostaden inte är byggd med statligt stöd kan husets ägare själv välja de
    boende.
- id: hb-c11-u0010
  description: Med delägarbostad avses en bostad där du först köper endast en del av bostaden och hyr
    sedan bostaden som du bor i.
- id: hb-c11-u0011
  description: När du flyttar in i en delägarbostad, betalar du först ungefär 10–20 procent av bostadens
    pris.
- id: hb-c11-u0012
  description: Efter hyrestiden köper du bostaden.
- id: hb-c11-u0013
  description: Om du är studerande kan du söka hyresbostäder som är speciellt avsedda för studerande.
- id: hb-c11-u0014
  description: Studentbostäder hyrs ut av studentbostadsstiftelser, universitetens studentkårer, nationer
    och vissa andra stiftelser.
- id: hb-c11-u0015
  description: Om du får en studentbostad kan du vanligen bo i den under hela studietiden.
- id: hb-c11-u0016
  description: I Finland ordnas stödboende (tukiasuminen) och serviceboende (palveluasuminen) för dem
    som behöver stöd för att kunna bo självständigt.
- id: hb-c11-u0017
  description: Stöd- och serviceboende kan ordnas för
- id: hb-c11-u0018
  description: åldringar
- id: hb-c11-u0020
  description: handikappade
- id: hb-c11-u0021
  description: utvecklingsstörda
- id: hb-c11-u0022
  description: människor som återhämtar sig från problem med den mentala hälsan och missbrukarproblem.
- id: hb-c11-u0023
  description: Stöd- och serviceboende tillhandahålls av välfärdsområdena, organisationer och privata
    företagare.
- id: hb-c11-u0024
  description: Den som bor i en stödbostad klarar nästan självständigt av de dagliga bestyren.
- id: hb-c11-u0025
  description: Hur länge man bor i stödbostad beror på kundens livssituation och behov.
