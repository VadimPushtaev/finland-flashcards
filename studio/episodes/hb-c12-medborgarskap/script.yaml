scenes:
- id: hb-c12-u0246
  description: Du kan ansöka om finskt medborgarskap om du har bott i Finland tillräckligt länge och bland
    annat lärt dig ett lokalt språk.
- id: hb-c12-u0247
  description: I vissa situationer kan man få medborgarskap även genom anmälan.
- id: hb-c12-u0248
  description: Finskt medborgarskap är inte samma sak som uppehållstillstånd.
- id: hb-c12-u0249
  description: 'Barnet får automatiskt finskt medborgarskap vid födseln i följande fall:'
- id: hb-c12-u0250
  description: barnets mor är finsk medborgare,
- id: hb-c12-u0252
  description: barnets far är finsk medborgare och gift med barnets mor,
- id: hb-c12-u0253
  description: barnet föds i Finland, barnets far är finsk medborgare och faderskapet har bekräftats eller
- id: hb-c12-u0254
  description: barnet föds i Finland, barnets mor som inte har fött barnet är finsk medborgare och den
    icke-födande moderns moderskap har bekräftats 1.4.2019 eller senare.
- id: hb-c12-u0255
  description: Barnet kan få finskt medborgarskap genom anmälan om barnet föds utomlands, har en finsk
    far eller en finsk mor som inte har fött barnet och föräldrarna inte är gifta med varandra.
- id: hb-c12-u0256
  description: Också ett barn till utländska föräldrar som föds i Finland kan få finskt medborgarskap,
    om hen inte får medborgarskap i något annat land av sina föräldrar.
- id: hb-c12-u0257
  description: 'Följande personer kan få finskt medborgarskap snabbare och förmånligare genom medborgarskapsanmälan:'
- id: hb-c12-u0258
  description: tidigare finsk medborgare
- id: hb-c12-u0260
  description: ett barn som föds utomlands utom äktenskapet till en finsk far eller till en finsk mor
    som inte har fött barnet
- id: hb-c12-u0261
  description: 18–22 år gamla personer som har bott i Finland flera år
- id: hb-c12-u0262
  description: 12–17 år gammalt adoptivbarn till en finsk medborgare
- id: hb-c12-u0263
  description: medborgare i ett nordiskt land som har bott i Finland de senaste fem åren.
