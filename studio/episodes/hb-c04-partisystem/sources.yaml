    range_basis: normalized_html_block
    extracted_passage: Finland har ett flerpartisystem, det vill säga det finns många olika partier.
      Stödet för partierna varierar från val till val. I allmänhet har inget enskilt parti absolut
      majoritet i riksdagen. Partierna måste samarbeta med varandra. Därför är det viktigt att kunna
