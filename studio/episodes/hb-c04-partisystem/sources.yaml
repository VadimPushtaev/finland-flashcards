    range_basis: normalized_html_block
    extracted_passage: Liberalismen i sin tur är förknippad med stor individuell och ekonomisk frihet,
      liberala värderingar och mänskliga rättigheter. För liberaler är till exempel kvinnors rättigheter
      och rättigheterna för könsminoriteter och sexuella minoriteter ofta viktiga. Liberaler betonar
