    range_basis: normalized_html_block
    extracted_passage: Den traditionellt sett viktigaste faktorn som skiljer partierna åt har varit
      indelningen i höger och vänster. Vänsterpartierna har förespråkat socialism eller socialdemokrati,
      arbetarnas rättigheter och en stark stat, som erbjuder människorna olika tjänster och får sin
      finansiering genom de skatter som enskilda individer och företag betalar. Vänstern har varit
      beredd att acceptera höga skatter, eftersom man enligt deras uppfattning kan bygga och upprätthålla
      ett jämställt samhälle där alla människor tas om hand med hjälp av skatter.
