    range_basis: normalized_html_block
    extracted_passage: Man kan också göra andra indelningar av partierna. I dag skiljer i synnerhet
      konservatismen och liberalismen människor åt. Konservatismen är förknippad med traditionella
      värderingar och måttliga, det vill säga små, reformer i samhället. Nuförtiden är de konservativa
