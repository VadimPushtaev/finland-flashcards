- sentence_id: hb-c04-u0122-s002
  sv: Dessutom skiljer sig partierna från varandra i fråga om till exempel inställningen till lantbruk
    och upprätthållande av servicen i glesbygden, inställningen till invandring samt hur viktiga de anser
    att miljöskydd och bromsandet av klimatförändringen är.
  ru: Кроме того, партии отличаются друг от друга, например, отношением к сельскому хозяйству и поддержанию
    услуг в малонаселённых районах, отношением к иммиграции, а также тем, насколько важными они считают
    охрану окружающей среды и замедление изменения климата.
