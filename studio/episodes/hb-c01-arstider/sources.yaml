    heading: Vädret varierar mycket beroende på årstiden
    source_range:
      start: 0
      end: 300
    range_basis: normalized_html_block
    extracted_passage: Finland har fyra tydliga årstider. Klimatet varierar mycket i de olika delarna
      av landet. På Finlands sydvästkust varierar dygnsmedeltemperaturen från +17 grader Celsius
      i juli till –4 grader i februari, medan dygnsmedeltemperaturen i nordligaste Finland är cirka
      +14 °C i juli och –13 °C i februari.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
