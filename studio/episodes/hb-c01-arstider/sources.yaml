    heading: På våren börjar en ny växtsäsong
    source_range:
      start: 0
      end: 433
    range_basis: normalized_html_block
    extracted_passage: Våren är den kortaste av årstiderna i Finland. Den varar endast 1,5–2 månader
      och infaller i april–maj. På våren smälter snön och isen, och den ljusa delen av dygnet blir
      längre. Samtidigt börjar en ny växtsäsong. I Finland har växterna bara en växtsäsong, från
      våren till hösten. Människorna följer ofta ivrigt med hur våren framskrider, till exempel när
      vissa flyttfåglar återvänder till landet eller de första blommorna visar sig.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
