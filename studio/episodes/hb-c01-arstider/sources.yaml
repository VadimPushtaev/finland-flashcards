    source_kind: p
    source_role: content
    heading: Mörkret kan påverka humöret
    source_range:
      start: 0
      end: 390
    range_basis: normalized_html_block
    extracted_passage: Den mörkaste månaden är december. På årets kortaste dag den 21 eller 22 december
      är den ljusa delen av dagen mindre än sex timmar lång i Helsingfors. I Lappland går solen inte
      upp alls på vintern, vilket kallas polarnatt. Polarnatten varar som kortast ett par dagar och
      blir längre ju längre norrut man kommer. På Finlands nordligaste ort Nuorgam går solen inte
      upp alls på över sju veckor.
    normalization: whitespace_only
    repairs: []
