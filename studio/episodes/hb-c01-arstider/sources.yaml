    heading: Vintern kräver anpassning, men livet går vidare också på vintern
    source_range:
      start: 0
      end: 367
    range_basis: normalized_html_block
    extracted_passage: Ett av särdragen i klimatet i Finland jämfört med många andra länder är vintern.
      Man kan behöva vänja sig vid kylan, mörkret och halkan som kännetecknar den finska vintern.
      Livet fortsätter ändå som vanligt också på vintern. Även om särskilt rikliga mängder snö kan
      störa trafiken, är det mycket ovanligt att till exempel skolor stänger på vintern på grund
      av vädret.
    normalization: whitespace_only
