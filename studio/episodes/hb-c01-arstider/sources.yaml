    heading: På sommaren är det ljust också på natten i Finland
    source_range:
      start: 0
      end: 431
    range_basis: normalized_html_block
    extracted_passage: Sommaren är en varm årstid, som varar i omkring två månader i norr och omkring
      fyra månader i söder. Sommarmånaderna är juni, juli och augusti. Den finska sommaren är ibland
      het och temperaturen stiger över +25 °C. Ibland kan sommaren vara sval och regnig. I Lappland
      skiner solen dygnet runt på sommaren, också på natten. Fenomenet kallas midnattssol. På sommaren
      vistas människorna mycket utomhus och njuter av ljuset och värmen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
