    heading: Vädret varierar mycket beroende på årstiden
    source_range:
      start: 0
      end: 346
    range_basis: normalized_html_block
    extracted_passage: Till följd av klimatförändringen håller Finlands klimat redan på att förändras,
      och effekterna kommer att öka framöver. Temperaturerna stiger och nederbörden ökar, men å andra
      sidan blir perioderna med torka också fler. Perioderna med snö blir kortare särskilt i söder.
      Om det inte finns snö på marken som reflekterar ljuset är vintrarna mörkare.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
