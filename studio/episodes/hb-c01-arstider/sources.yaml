    heading: På hösten förbereder man sig för vintern
    source_range:
      start: 0
      end: 422
    range_basis: normalized_html_block
    extracted_passage: Hösten varar omkring två månader i Finland. I söder börjar hösten i september
      och slutar när vintern börjar i slutet av november. I norr börjar hösten redan i slutet av
      augusti och slutar i mitten av oktober. Under hösten blir vädret kallare och den ljusa delen
      av dygnet blir kortare. Trädens löv och växterna vissnar så småningom bort. På hösten skördas
      åkrarna, och många människor plockar gärna bär och svamp i skogen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
