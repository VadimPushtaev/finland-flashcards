    heading: Vintern kan vara kall och snörik
    source_range:
      start: 0
      end: 668
    range_basis: normalized_html_block
    extracted_passage: I norra Finland kan vintern vara kall och mycket snörik. Temperaturen kan
      ibland vara till och med –30 °C. I Södra Finland är det sällan så kallt. Till exempel i Helsingfors
      ligger temperaturen i januari mellan 0 °C och –10 °C den största delen av tiden. Hur lång vintern
      är varierar i olika delar av landet. I den norra delen av Finland, det vill säga Lappland,
      varar vintern ett halvår, medan Södra Finland har vinter en tredjedel av året, i allmänhet
      från slutet av november till slutet av mars. Den ljusa tiden av dygnet är kort på vintern,
      kortare i norr än i söder. På vintern utövar många gärna vintersporter, såsom skridskoåkning,
      längdåkning och utförsåkning.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
