    heading: Höst
    source_range:
      start: 0
      end: 254
    range_basis: normalized_html_block
    extracted_passage: Hösten börjar vanligen i slutet av augusti eller början av september. I september
      och oktober är det höstglöd i Finland. På många växter och träd blir löven, som varit gröna
      på sommaren, gula, orange och röda. Höstglöden gör naturen vacker och färggrann.
