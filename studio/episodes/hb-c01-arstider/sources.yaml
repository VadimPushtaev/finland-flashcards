    heading: Vädret varierar mycket beroende på årstiden
    source_range:
      start: 0
      end: 349
    range_basis: normalized_html_block
    extracted_passage: I Finland kommer det regn och snö ganska jämnt under hela året. Hela årets
      nederbördsmängd är i allmänhet 500–650 millimeter. I öster och söder kommer det i genomsnitt
      aningen mer nederbörd än i väster och norr. Mest nederbörd kommer det på sommaren. Då regnar
      det ofta mycket på en gång. Flest dagar med nederbörd är det ändå på hösten och vintern.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
