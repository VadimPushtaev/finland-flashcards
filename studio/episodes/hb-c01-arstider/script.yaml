  resolve_during: script
- id: music
  decision: Almost in F — Kevin MacLeod, CC BY 4.0, selected from official catalog. Distinct track reserved
    for this subchapter. Use original from start, excerpt to video; no loop required (original 32m42s).
    Same accepted +2 dB music adjustment, gentle fades and narration ducking.
