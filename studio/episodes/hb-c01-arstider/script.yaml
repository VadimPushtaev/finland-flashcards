    No independent listening approval claimed; review in complete video.
  status: proposed
  resolve_during: script
- id: pacing
  decision: Sentence pair appears .25 seconds before speech. Pause 1.3 seconds normally, 2 seconds at
    passage boundaries, 2.5 seconds after long comparisons. Never accelerate long sentences. Actual timing
    from WAV duration.
  status: proposed
  resolve_during: script
- id: foreground
  decision: Use restrained source-based factual cards only when they clarify an explicit number, month
    or comparison. Rest of prose leaves image area open to the decorative photograph. Cards repeat source
    wording only; no quantitative map or inferred proportions. Fact cards use a 1520×1440 px evergreen
    canvas, Arial Bold 90 px for up to 3 labels or 72 px otherwise, reducing only to fit 1280 px width.
    They scale into the fixed 760×720 px foreground slot. Card text repeats the chapter cream/gold colors.
