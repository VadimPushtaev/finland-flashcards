scenes:
- id: scene-1
  description: Ett skyddshem är ett ställe där personer som upplevt våld i nära relationer eller hot om
    sådant får hjälp och trygghet.
- id: scene-2
  description: Man kan gå till ett skyddshem alltid när det inte är tryggt att vara där hemma.
- id: scene-3
  description: Skyddshemmens tjänster är till för alla kön.
- id: scene-4
  description: Ett mödrahem är en plats dit en mamma kan komma med sin baby om hon är i en svår livssituation
    eller om hon är helt ensam.
- id: scene-5
  description: Om du behöver brådskande hjälp av polisen, ring nödnumret 112.
- id: scene-6
  description: Nollalinja är en hjälptelefon som du kan ringa om du har blivit utsatt för våld i familjen
    eller sexuellt våld eller hot om våld.
- id: scene-7
  description: Nollalinja erbjuder också tolktjänst.
- id: scene-8
  description: Samtal till Nollalinja är kostnadsfria och de syns inte i telefonräkningen.
- id: scene-9
  description: På många orter finns ett SERI-stödcenter (SERI-tukikeskus) som är avsett för offer för
    sexuellt våld.
- id: scene-10
  description: Du kan också alltid söka hjälp vid social- och hälsocentralen.
- id: scene-11
  description: Om någon upprepade gånger hotar eller trakasserar dig och du vill ha skydd, kan du ansöka
    om besöksförbud (lähestymiskielto) för denna person.
