      \ fiske, terrängcykling, \nvinterbadande och vandring. Det är inte långt till skogen ens i\
      \ huvudstaden. Städerna har också många \nparker och andra grönområden där man kan vistas.\
      \ För finländarna är en snygg och ren natur och \nmiljö viktiga. Att skräpa ner anses hänsynslöst\
