- id: voice
  decision: Shared Supertonic3 F1 Sweden Swedish sv local ONNX CPU,32steps,speed0.95,seed42,44100Hz mono
    PCM16. Review pronunciation within complete video.
  status: proposed
  resolve_during: assets
- id: background
  decision: Use a distinct verified photograph throughout, darken42%,blur2.5px. Linear full-episode diagonal
    pan crop position(0.15,0.15)→(0.85,0.85), zoom1.06→1.219, fractional bicubic sampling. For this longer
    episode use additional slow cyclic motion to keep motion visible within5–10seconds if supported; otherwise
    inspect and adjust exact zoom after timeline.
  status: proposed
  resolve_during: script
- id: music
  decision: Use Garden Music by Kevin MacLeod, CC BY4.0, unique to this subchapter. Keep cohesive bed
    throughout with shared accepted +2dB music level, fades and speech ducking. If shorter than full episode,
    repeat same track with4second equal-power crossfades, explicitly disclosed in credits.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Use two readable15second credit cards and accompanying full credits file. Whole-video user
    review remains pending; no standalone listening approval gate.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source-content changes or new claims. Foreground source-based graphics repeat exact Swedish
    phrases; geographical groupings are landscape descriptions, not administrative borders.
  status: proposed
  resolve_during: script
