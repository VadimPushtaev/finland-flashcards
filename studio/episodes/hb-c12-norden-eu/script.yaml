scenes:
- id: hb-c12-u0127
  description: Om du är medborgare i ett nordiskt land och flyttar till Finland, behöver du inte ansöka
    om uppehållstillstånd eller motivera din vistelse i Finland.
- id: hb-c12-u0128
  description: De nordiska länderna är Finland, Sverige, Norge, Danmark och Island.
- id: hb-c12-u0129
  description: Nordiska medborgare får bo och arbeta i Finland utan uppehållstillstånd.
- id: hb-c12-u0130
  description: Gör registreringen så fort som möjligt, dock senast inom en månad efter att du har flyttat
    till Finland.
- id: hb-c12-u0131
  description: Om en av dina familjemedlemmar, som flyttar med dig till Finland, inte är medborgare i
    ett nordiskt land, kan han/hon behöva uppehållstillstånd eller ett registreringsintyg över uppehållsrätt
    för EU-medborgare.
- id: hb-c12-u0132
  description: Om du är medborgare i ett EU-land behöver du inget uppehållstillstånd i Finland.
- id: hb-c12-u0133
  description: Detsamma gäller medborgare i Schweiz och Liechtenstein.
- id: hb-c12-u0134
  description: Du kan vistas i Finland högst tre månader i sträck utan att registrera din uppehållsrätt.
- id: hb-c12-u0135
  description: Om du avser att bo i Finland i över tre månader, ska du ansöka om registrering av uppehållsrätten
    för EU-medborgare hos Migrationsverket (Maahanmuuttovirasto).
- id: hb-c12-u0136
  description: Om du har en grund för din vistelse i Finland och förutsättningarna för vistelsen uppfylls,
    får du ett intyg över registreringen från Migrationsverket.
- id: hb-c12-u0137
  description: När du har bott i Finland lagligt och utan avbrott i fem år, kan du ansöka om permanent
    uppehållsrätt för EU-medborgare.
- id: hb-c12-u0138
  description: Om du är familjemedlem till en finsk medborgare ska du fylla i bilagan om utnyttjande av
    en finsk medborgares rätt till fri rörlighet.
- id: hb-c12-u0139
  description: Om du inte själv är medborgare i ett EU-land, Liechtenstein, Schweiz, Norge eller Island,
    men du avser att flytta till Finland för att bo hos en familjemedlem som är EU-medborgare, måste du
    ansöka om uppehållskort för en familjemedlem till en EU-medborgare.
