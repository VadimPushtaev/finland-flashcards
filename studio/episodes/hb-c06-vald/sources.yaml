    extracted_passage: Könsumgänge utan den andra partens samtycke är alltid våldtäkt. Samtycke innebär
      att en människa deltar i handlingen frivilligt av sin egen vilja. Om man deltar endast för
      att man är rädd för att säga nej, är det inte fråga om samtycke. En människa som till exempel
      sover eller är medvetslös på grund av alkohol, droger eller läkemedel kan inte samtycka till
      sex. Samtycke kan ges till exempel i ord eller med kroppsspråk.
