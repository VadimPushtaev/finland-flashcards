scenes:
- id: hb-c11-u0347
  description: 'När du flyttar i Finland från en bostad till en annan:'
- id: hb-c11-u0099
  description: Kom ihåg att göra flyttanmälan till Myndigheten för digitalisering och befolkningsdata
    (Digi- ja väestötietovirasto).
- id: hb-c11-u0101
  description: Om du bor i höghus eller radhus ska du alltid också komma ihåg att meddela husets disponent
    (isännöitsijä) att du flyttar.
- id: hb-c11-u0102
  description: Meddela din nya adress till alla instanser som skickar dig post.
- id: hb-c11-u0103
  description: I varje husbolag finns det ordningsregler, och alla boende ska följa dem.
- id: hb-c11-u0104
  description: Reglerna säger när höghusets ytterdörr är öppen och vilken tid det ska vara tyst i huset.
- id: hb-c11-u0105
  description: Då det ska vara tyst i huset får man exempelvis inte spela hög musik eller renovera.
- id: hb-c11-u0106
  description: Om en boende bryter mot ordningsreglerna kan hen få en varning.
- id: hb-c11-u0107
  description: Att ta hänsyn till grannarna innebär också att var och en ser till att de gemensamma utrymmena
    är prydliga.
- id: hb-c11-u0108
  description: Ibland kan det uppstå meningsskiljaktigheter med grannarna.
- id: hb-c11-u0109
  description: Om problemen med en granne förvärras och inte heller husbolaget kan lösa frågan, kan grannskapsmedling
    vara till hjälp.
- id: hb-c11-u0110
  description: Enligt lag får hyresvärdar inte diskriminera någon till exempel på grund av etniskt ursprung,
    religion, medborgarskap eller handikapp när de väljer hyresgäster.
- id: hb-c11-u0111
  description: Du har rätt att se bostaden i förväg och bostadsförmedlaren kan inte kräva att få betalt
    för detta.
- id: hb-c11-u0112
  description: Oftast betalar hyresvärden förmedlingsarvodet.
- id: hb-c11-u0113
  description: Om du inte har en stadigvarande bostad och inte heller är officiell hyresgäst eller underhyresgäst,
    är du bostadslös.
- id: hb-c11-u0114
  description: Om du inte har en bostad, ta kontakt med socialservicen (sosiaalipalvelut) i området där
    du vistas.
- id: hb-c11-u0115
  description: På kvällar och veckoslut ska du kontakta social- och krisjouren (sosiaali- ja kriisipäivystys).
- id: hb-c11-u0116
  description: Du kan också vända dig till kommunens rådgivningstjänst för invandrare.
