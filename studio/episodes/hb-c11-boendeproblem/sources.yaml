    heading: Alla boende ska följa husbolagets ordningsregler
    source_range:
      start: 0
      end: 336
    range_basis: normalized_html_block
    extracted_passage: I varje husbolag finns det ordningsregler, och alla boende ska följa dem.
      Då är det trivsamt och tryggt för alla att bo i huset. Ordningsreglerna finns ofta på husbolagets
      anslagstavla, eller så har de delats ut på papper till varje bostad. Om man inte hittar ordningsreglerna
      kan man begära att få dem av hyresvärden eller disponenten.
    normalization: whitespace_only
    repairs: []
