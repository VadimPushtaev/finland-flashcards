    source_kind: p
    source_role: content
    heading: Jag misstänker att jag har blivit diskriminerad när jag letade efter bostad. Var får
      jag hjälp?
    source_range:
      start: 0
      end: 377
    range_basis: normalized_html_block
    extracted_passage: Enligt lag får hyresvärdar inte diskriminera någon till exempel på grund av
      etniskt ursprung, religion, medborgarskap eller handikapp när de väljer hyresgäster. En privat
      hyresvärd har rätt att välja hyresgästen till bostaden men utan diskriminering. Om du misstänker
      att du har blivit diskriminerad kan du fråga om råd till exempel hos diskrimineringsombudsmannens
      kundtjänst.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0111:
    source_path: data/infofinland/content/housing/housing-problems.html
    sha256: fd473eb8cc25040ce69c271997178ee9738436f1a153a5be6fbe75c7c163066f
