    source_kind: p
    source_role: content
    heading: Bostadsförmedlaren kräver att jag betalar hen för att få se bostaden. Måste jag betala?
    source_range:
      start: 0
      end: 183
    range_basis: normalized_html_block
    extracted_passage: Du har rätt att se bostaden i förväg och bostadsförmedlaren kan inte kräva
      att få betalt för detta. Om du har problem som rör förmedlingsarvodet kan du kontakta Konsumentrådgivningen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0112:
    source_path: data/infofinland/content/housing/housing-problems.html
    sha256: fd473eb8cc25040ce69c271997178ee9738436f1a153a5be6fbe75c7c163066f
