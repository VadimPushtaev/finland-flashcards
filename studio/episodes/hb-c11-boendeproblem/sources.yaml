    range_basis: normalized_html_block
    extracted_passage: Reglerna säger när höghusets ytterdörr är öppen och vilken tid det ska vara
      tyst i huset. Reglerna ger också den boende anvisningar för hur husbolagets gemensamma utrymmen,
      till exempel tvättstugan eller bastun, kan användas.
    normalization: whitespace_only
