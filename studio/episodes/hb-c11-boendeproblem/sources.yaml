    source_kind: p
    source_role: content
    heading: Måste jag betala ett förmedlingsarvode till bostadsförmedlaren när jag hyr en bostad?
    source_range:
      start: 0
      end: 350
    range_basis: normalized_html_block
    extracted_passage: Oftast betalar hyresvärden förmedlingsarvodet. Du själv betalar förmedlingsarvodet
      endast om du har ingått ett skriftligt uppdragsavtal med bostadsförmedlaren om att söka en
      bostad åt dig. Om du inte har ingått ett skriftligt uppdragsavtal får bostadsförmedlaren inte
      kräva dig på förmedlingsarvode. Om hen försöker göra detta kan du polisanmäla hen.
    normalization: whitespace_only
    repairs: []
    selection: Keep unlawful brokerage fee and police remedy; omit trailing navigation.
