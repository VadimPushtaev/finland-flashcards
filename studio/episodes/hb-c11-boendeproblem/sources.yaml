    heading: Om du inte har en bostad
    source_range:
      start: 0
      end: 365
    range_basis: normalized_html_block
    extracted_passage: Om du inte har en bostad, ta kontakt med socialservicen (sosiaalipalvelut)
      i området där du vistas. Kontaktuppgifterna hittar du på välfärdsområdenas webbplatser. Socialservicen
      hjälper dig när du söker bostad eller tillfällig inkvartering. En tillfällig inkvartering kan
      vara ett hem för bostadslösa, ett natthärbärge eller en bostad som är avsedd för bostadslösa.
