    range_basis: normalized_html_block
    extracted_passage: Att ta hänsyn till grannarna innebär också att var och en ser till att de
      gemensamma utrymmena är prydliga. Gemensamma utrymmen är platser som alla i huset använder.
      Det kan vara gården, trappan, tvättstugan och platsen för sopor. På gården slänger alla sina
      sopor i ett gemensamt sopkärl.
