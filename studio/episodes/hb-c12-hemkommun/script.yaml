episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Exact source paragraphs/list items define consecutive topic scenes. Sentence-specific objects
    and source relationships are planned individually; no added spoken transitions or current-law updates.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter12 violet palette {''background'': ''#352e49'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d7cce7'', ''highlight'': ''#e2c58b'', ''separator'': ''#685881''}. Liberation Sans
    Bold48/Regular40 with a fixed right bilingual panel and relevant left foreground pictures.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Mustasaari municipal border sign 20190603.jpg by Santeri Viinamäki continuously as
    decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85)
    and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence
    resets. Total cycles=2.05. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPyseed42 per invocation,44100HzmonoPCM16;
    initial2ONNXthreads shared with Chapter8 allocation. Exact synthesis inputs and actual seed scope
    are retained; whole-video listening remains pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Daytime TV Theme by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 48.483 seconds; prepared lossless stereo bed 287.000 seconds.
    Repeat count 6, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Distinct relevant picture for nearly every body sentence slide: actual places/objects where
    identity and license are verified, plus original pictorial diagrams for source-stated eligibility,
    administrative steps and personal-data protections. Avoid real personal identifiers and invented legal
    rules.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0100
  description: Kommunerna tillhandahåller många tjänster för sina invånare.
- id: hb-c12-u0101
  description: Det lönar sig för dig att utreda om du och de andra medlemmarna i din familj har rätt till
    en hemkommun i Finland.
- id: hb-c12-u0102
  description: För att få en hemkommun i Finland måste du flytta till Finland och bo här minst ett år.
- id: hb-c12-u0103
  description: När du har fått en hemkommun har du samma rättigheter, tjänster och skyldigheter som personer
    som bor stadigvarande i Finland.
- id: hb-c12-u0104
  description: 'Du har möjlighet att få en hemkommun i Finland om:'
- id: hb-c12-u0105
  description: du är medborgare i Finland eller något annat nordiskt land
- id: hb-c12-u0107
  description: du är medborgare i EU, Schweiz eller Liechtenstein och du har registrerat din uppehållsrätt
    hos Migrationsverket (Maahanmuuttovirasto)
- id: hb-c12-u0108
  description: du har permanent (P) eller kontinuerligt (A) uppehållstillstånd som är i kraft
- id: hb-c12-u0109
  description: du är familjemedlem till en person som har en hemkommun i Finland
- id: hb-c12-u0110
  description: Om du har ett tillfälligt uppehållstillstånd (B-tillstånd) som är i kraft minst ett år,
    kan du få en hemkommun om du kan påvisa att det är din avsikt att bo stadigvarande i Finland.
- id: hb-c12-u0111
  description: 'Stadigvarande boende kan påvisas till exempel genom följande omständigheter:'
- id: hb-c12-u0112
  description: du har en arbetsplats i Finland och ditt arbetskontrakt är i kraft minst två år
- id: hb-c12-u0114
  description: du studerar i Finland och dina studier räcker minst två år
- id: hb-c12-u0115
  description: du har tidigare haft en hemkommun i Finland
- id: hb-c12-u0116
  description: du har varit fortlöpande bosatt i Finland under minst ett års tid
- id: hb-c12-u0117
  description: du är av finländsk härkomst.
- id: hb-c12-u0118
  description: Din hemkommun är vanligen den kommun du bor i.
