    heading: Myndigheterna övervakar efterlevandet av lagarna
    source_range:
      start: 0
      end: 368
    range_basis: normalized_html_block
    extracted_passage: I Finland övervakar myndigheterna att människorna följer lagarna. Säkerheten
      i samhället övervakas gemensamt av räddningsverket, polisen, Tullen, gränsbevakningsväsendet
      och försvarsmakten. Försvarsmakten har som uppgift att försvara Finland militärt. Polisen upprätthåller
      den allmänna säkerheten och ordningen i landet. Polisen är en respekterad myndighet i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
