    range_basis: normalized_html_block
    extracted_passage: Om man vet eller misstänker att ett brott har begåtts, kan man göra en brottsanmälan
      till polisen. Vem som helst kan göra en brottsanmälan på en polisstation, på internet, genom
      att berätta för en polispatrull om det eller ibland också per telefon. Polisen är skyldig att
      ta emot brottsanmälningar.
    normalization: whitespace_only
