    heading: I Finlands rättssystem har uppgifterna och makten fördelats mellan olika aktörer
    source_range:
      start: 0
      end: 392
    range_basis: normalized_html_block
    extracted_passage: I det finländska rättssystemet stiftar riksdagen lagarna. Polisen och övriga
      myndigheter övervakar att människorna följer lagen. Domstolarna utövar sin domsrätt, det vill
      säga bedömer om någon har agerat i strid med lagen. Domstolarna har också makt att utdöma straff
      om någon har brutit mot lagen. Domstolarna, polisen och övriga myndigheter utför sitt arbete
      fria från politiskt inflytande.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
