    range_basis: normalized_html_block
    extracted_passage: Polisen, myndigheter och politiker tar inte emot mutor. En muta är en gåva
      eller en förmån som ges till en myndighet för att denna ska hjälpa den som ger gåvan på ett
      annat sätt än andra människor. Då är det fråga om korruption. I Finland är det ett brott både
      att ge och att ta emot mutor.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
