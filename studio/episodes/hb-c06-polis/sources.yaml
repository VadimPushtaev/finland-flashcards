    source_range:
      start: 0
      end: 267
    range_basis: normalized_html_block
    extracted_passage: Polisen utreder också brott och försöker förebygga brottslighet. Var och en
      kan meddela till polisen om man misstänker att ett brott har begåtts. Man kan göra en polisanmälan
      på en polisstation, per telefon eller på internet. Anmälan kan vara muntlig eller skriftlig.
    normalization: whitespace_only
