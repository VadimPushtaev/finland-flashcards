    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Main Police Station in Jokiniemi, Vantaa, Finland; October 2024 – 02.jpg by Sanni
    Penttinen continuously as decorative background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal
    pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting
    in motion, with no sentence resets. Total cycles=1.7788690476190476. Foreground and bilingual text
    remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Prelude in C (BWV 846) by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 178.704 seconds; prepared lossless stereo bed 249.042
    seconds. Repeat count 1, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Use verified photographs of actual Finnish legal institutions and objects, plus original source-based
    pictorial diagrams at meaningful topic boundaries. Preserve complete source text and leave captions
    off. Measure at least50% body-duration picture coverage; neither the decorative background nor typography
    cards count.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credit cards plus dedicated foreground attribution cards, 15 seconds each,
    over continuing background. Full URLs, licenses and adaptation details accompany the canonical MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
