    heading: Könsstympning kan ge allvarliga hälsoproblem
    source_range:
      start: 0
      end: 371
    range_basis: normalized_html_block
    extracted_passage: Det blir stora hälsoproblem om urinen eller menstruationsblodet inte kommer
      ut normalt. Följden kan vara till exempel olika inflammationer. Sexuellt umgänge kan innebära
      problem, och kvinnan kan ha svårt att njuta av sex. Könsstympning ökar också riskerna vid graviditet
      och förlossning. Dessutom kan traumat förknippat med åtgärden orsaka problem med den mentala
      hälsan.
    normalization: whitespace_only
