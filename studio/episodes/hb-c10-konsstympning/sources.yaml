    heading: En öppningsoperation eller rekonstruerande operation kan underlätta besvären som en
      könsstympning orsakar
    source_range:
      start: 0
      end: 357
    range_basis: normalized_html_block
    extracted_passage: Vid en rekonstruerande operation försöker man återställa könsorganens normala
      anatomi och funktion. Syftet med en rekonstruerande operation är att underlätta besvären som
      stympningen orsakar och öka kvinnans sexuella välbefinnande. Rekonstruerande operationer utförs
      av en plastikkirurg på ett sjukhus och kräver en läkarremiss från den egna hälsostationen.
