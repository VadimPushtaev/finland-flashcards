    heading: En öppningsoperation eller rekonstruerande operation kan underlätta besvären som en
      könsstympning orsakar
    source_range:
      start: 0
      end: 328
    range_basis: normalized_html_block
    extracted_passage: En kvinna vars könsorgan har stympats kan genomgå en öppningsoperation eller
      en rekonstruerande operation. Vid en öppningsoperation öppnas blygdläpparna, vilket i allmänhet
      hjälper för problem och smärtor vid urinering, menstruation och samlag. En öppningsoperation
      görs i lokalbedövning på en poliklinik och är en snabb åtgärd.
    normalization: whitespace_only
