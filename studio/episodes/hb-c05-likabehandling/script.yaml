- sentence_id: hb-c05-u0048-s002
  sv: I finsk lagstiftning pratar man om likabehandling när man menar att alla är lika mycket värda oberoende
    av till exempel nationalitet, funktionsnedsättning, sexuell läggning eller någon annan omständighet
    som gäller dem som person.
  ru: В финляндском законодательстве о равном обращении говорят, когда имеют в виду, что все люди имеют
    равную ценность независимо, например, от гражданства, инвалидности, сексуальной ориентации или любого
    другого обстоятельства, касающегося их личности.
