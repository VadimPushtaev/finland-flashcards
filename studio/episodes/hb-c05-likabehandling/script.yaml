- sentence_id: hb-c05-u0051-s001
  sv: Lagen förbjuder diskriminering på grund av ålder, ursprung, nationalitet, språk, religion, övertygelse,
    åsikt, politisk verksamhet, fackföreningsverksamhet, familjeförhållanden, hälsotillstånd, funktionsnedsättning,
    sexuell läggning eller någon annan omständighet som gäller den enskilde som person.
  ru: Закон запрещает дискриминацию по признаку возраста, происхождения, гражданства, языка, религии,
    убеждений, мнения, политической деятельности, профсоюзной деятельности, семейных обстоятельств, состояния
    здоровья, инвалидности, сексуальной ориентации или любого другого обстоятельства, касающегося личности
    человека.
