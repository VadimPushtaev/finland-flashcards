    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Interior of Helsinki Central Library Oodi in 2019 (46535194044).jpg by Nicolas Buffler
    from Guilherand Granges, France continuously as decorative background, darkened 42% and blurred 2.5
    px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds
    per motion cycle, starting in motion, with no sentence resets. Total cycles=4.120535714285714. Foreground
    and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Mana Two - Part 1 by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 234.018 seconds; prepared lossless stereo bed 576.875
    seconds. Repeat count 2, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Topic-specific verified photographs and source-backed pictorial diagrams explain equality,
    access, support and reporting without assigning discrimination or victim status to photographed people.
    Change pictures at meaningful boundaries; measure actual body coverage against50% target. Diagrams
    are labeled illustrative and contain no additional legal claim.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credit cards plus dedicated foreground attribution cards, 15 seconds each,
    over continuing background. Full URLs, licenses and adaptation details accompany the canonical MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
- id: final-question-prohibition
  decision: Keep final employer-question prohibition foreground open so the preceding consent illustration
    cannot imply a permission exception. Exact source, narration and timing retained.
  status: approved
  resolve_during: render
