episode_decisions:
- id: fidelity
  decision: Exact body sentences and list fragments once, source order, current reviewed Russian; heading
    unspoken. No added medical/legal claims.
  status: proposed
  resolve_during: script
- id: visuals
  decision: An individually planned relevant picture for each sentence; prioritize actual accurately identified
    licensed concrete objects,places,equipment and useful source-specific pictorial relationships. No
    invented diagnoses,medical procedures,numerical data or eligibility conditions.
  status: proposed
  resolve_during: script
- id: voice
  decision: LocalSwedishSupertonic3F1,32steps,speed.95,NumPyseed42,44100HzmonoPCM16; pronunciation remains
    whole-video listening priority.
  status: proposed
  resolve_during: script
- id: pace
  decision: 3secondtitle,.25secondtextlead,measured fullspeech,1.5secondpause and2.2attopicends;2.5forlongpairs.
    Do not accelerate to targetlength.
  status: proposed
  resolve_during: script
- id: background
  decision: A distinct licensed topic-related photograph with42%darken,2.5pxblur,15%relativezoom and continuous140secondglobalcyclicpan;
    exact source pending asset resolution, Chapter10oceanpalette.
  status: proposed
  resolve_during: assets
- id: music
  decision: Use centrally reserved Pride (USUAN1100106) by Kevin MacLeod,CC BY4.0; accepted +2dB bed adjustment
    with speech ducking and crossfade only if needed. Perceptual balance remains whole-video listening.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Actual source attribution derived from sources.yaml,15secondreadablecreditcards and fullmatching
    sidecar.
  status: proposed
  resolve_during: script
