- sentence_id: hb-c10-u0251-s001
  sv: När kvinnorna började arbeta utanför hemmet och familjerna blev mindre blev det svårare att ta hand
    om de äldre hemma.
  ru: Когда женщины стали работать вне дома, а семьи стали меньше, заботиться о пожилых людях дома стало
    труднее.
  scene_id: scene-3
  visual_cue: 'Two stated historical changes made home care harder; no blame or new claim about women''s
    duty to care. Required source logic: Two stated historical changes made home care harder; no blame
    or new claim about women''s duty to care. Preferred objects: work (kvinnorna började arbeta); family
    (familjerna blev mindre); house (svårare att ta hand om de äldre hemma).'
