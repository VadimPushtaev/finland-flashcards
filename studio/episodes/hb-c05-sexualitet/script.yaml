  sv: Om de sexuella rättigheterna inte uppfylls, uppfylls inte heller de övriga mänskliga rättigheterna,
    och de sexuella rättigheterna kan inte uppfyllas utan att de övriga rättigheterna uppfylls.
  ru: Если сексуальные права не реализуются, не реализуются и остальные права человека, а сексуальные
    права не могут реализовываться без реализации остальных прав.
