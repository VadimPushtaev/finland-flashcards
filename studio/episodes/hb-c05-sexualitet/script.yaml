- sentence_id: hb-c05-u0138-s002
  sv: Till exempel tillräcklig hälsovård, föda och en bostad samt en trygg livsmiljö är alla förutsättningar
    för att en människa ska kunna leva ut sin sexualitet på ett säkert och tillfredsställande sätt.
  ru: Например, достаточное медицинское обслуживание, питание и жильё, а также безопасная жизненная среда
    — всё это предпосылки для того, чтобы человек мог безопасно проявлять свою сексуальность так, чтобы
    это приносило удовлетворение.
