episode_decisions:
- id: opening
  decision: Unspoken bilingual source heading for three seconds; preserve all exact body sentences and
    Russian translations in source order.
  status: proposed
  resolve_during: script
- id: palette_layout
  decision: 'Use the shared Chapter 1 evergreen #102e2b, cream #f6f1e6, sage #bdd3c9 and gold #e7bc70
    palette. Render 1920×1080 at24fps. Stable right text panel (890,165)-(1860,980), Swedish Arial Bold48
    above Russian Arial40 with 5% margins; reduce font only where necessary and record each exception.
    Steady useful-image panel left; leave empty when no useful illustration.'
  status: proposed
  resolve_during: script
- id: pacing
  decision: Show each sentence pair0.25seconds before speech, retain through1.3second pause; use2seconds
    at scene boundaries. Do not accelerate narration.
  status: proposed
  resolve_during: script
- id: voice
  decision: Shared Supertonic3 F1 Sweden Swedish sv local ONNX CPU,32steps,speed0.95,seed42,44100Hz mono
    PCM16. Review pronunciation within complete video.
  status: proposed
  resolve_during: assets
- id: background
  decision: Use verified Töölönlahti park photograph throughout; darken42%, blur2.5px. Continuous smooth
    sinusoidal pan/zoom cycles over global timeline, each140seconds, normalized crop(0.15,0.15)↔(0.85,0.85),
    zoom1.06↔1.219. Start at midpoint moving immediately; fractional bicubic sampling, smooth reversals
    and no sentence resets. motion_cycles equals measured full-video duration/140.
  status: proposed
  resolve_during: script
- id: music
  decision: Use Floating Cities by Kevin MacLeod, CC BY4.0, unique to this subchapter. Keep cohesive bed
    throughout with shared accepted +2dB music level, fades and speech ducking. If shorter than full episode,
    repeat same track with4second linear crossfades, explicitly disclosed in credits.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Use two readable15second credit cards and accompanying full credits file. Whole-video user
    review remains pending; no standalone listening approval gate.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No source-content changes or new claims. Foreground source-based graphics repeat exact Swedish
    phrases; geographical groupings are landscape descriptions, not administrative borders.
  status: proposed
  resolve_during: script
- id: maps
  decision: Use actual Natural Earth5.1.2 country outline and populated-place point geometry for selected
    source-mentioned cities; no regional boundaries. Source-name cards remain useful for longer city lists.
    Region examples not administrative areas.
  status: proposed
  resolve_during: script
- id: targeted_narration
  decision: Use targeted same-voice F1 sv, 32 steps, speed 0.95, seed 42 candidates for sentences 33 and
    35. Begin with the complete source-order run and replace only the selected takes. Preserve original
    hashes and diagnostic transcripts in narration-check.json. Sentence 33 separates clauses with punctuation;
    sentence 35 keeps the input unchanged. Review pronunciation in the complete video.
  status: proposed
  resolve_during: assets
