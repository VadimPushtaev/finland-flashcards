    range_basis: normalized_html_block
    extracted_passage: Södra Finland är Finlands mest tätbefolkade område. Där ligger Finlands största
      städer, till exempel Finlands huvudstad Helsingfors. Helsingfors omges av huvudstadsregionen,
      som förutom Helsingfors inkluderar Esbo, Vanda och Grankulla. Andra städer i Södra Finland
      är bland annat Åbo, Björneborg, Kotka och Tavastehus. En del av området längs kusten i Södra
      Finland är tvåspråkig, det vill säga en del av befolkningen har finska som modersmål, en del
      svenska. Helsingfors har det största antalet svenskspråkiga invånare i Finland.
    normalization: whitespace_only
    repairs: []
