    range_basis: normalized_html_block
    extracted_passage: Den nordligaste delen av Finland är Lappland. I de nordligaste delarna av
      Lappland är klimatet så kallt att träden inte växer, och snön täcker marken i genomsnitt sju
      månader per år. På andra håll i Lappland består landskapet av barrskog och det finns mycket
