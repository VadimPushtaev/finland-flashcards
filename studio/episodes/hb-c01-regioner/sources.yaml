    range_basis: normalized_html_block
    extracted_passage: I Södra Finland är klimatet mildare än i de nordligare delarna av landet.
      Södra Finland är ett flackt område. Sett till klimatet och jordmånen är det Finlands bästa
      odlingsområde. Det finns fler arter av lövträd där än längre norrut i landet.
