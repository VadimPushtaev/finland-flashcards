scenes:
- id: scene-1
  description: Den vanligaste typen av barnfamilj i Finland är kärnfamiljen, det vill säga två föräldrar
    och deras gemensamma barn.
- id: scene-2
  description: När man pratar om familjer tänker man ofta på barnfamiljer.
- id: scene-3
  description: En del par får inga barn, även om de skulle vilja.
- id: scene-4
  description: Man kan erbjuda ett barn eller en ung person ett hem också genom att bli familjehemsförälder.
- id: scene-5
  description: När det finns barn i en familj men bara en vuxen, pratar man om en familj med en förälder.
- id: scene-6
  description: I familjer med en förälder bor en förälder med barnen utan make eller maka.
- id: scene-7
  description: Det kan vara utmanande för en ensamförsörjare att kombinera barnomsorg och förvärvsarbete.
- id: scene-8
  description: I Finland är det vanligt att människor som skilt sig hittar en ny partner, flyttar ihop
    och ofta också gifter sig på nytt.
- id: scene-9
  description: I Finland kallas familjer med personer som hör till en sexuell minoritet eller en könsminoritet
    för regnbågsfamiljer.
- id: scene-10
  description: Regnbågsfamiljer får barn på olika sätt.
- id: scene-11
  description: I Finland har det länge arbetats för att sexuella minoriteter och regnbågsfamiljer ska
    ha samma rättigheter som familjer som består av en man och en kvinna.
- id: scene-12
  description: Föräldrapartnerskap innebär att två personer beslutar sig för att bli föräldrar tillsammans
    utan att vara i ett parförhållande.
- id: scene-13
  description: Ibland har föräldrapartnerna varit vänner redan innan de bestämmer sig för att bli föräldrar
    tillsammans.
- id: scene-14
  description: Det är vanligt att till exempel studerande bor själva i små enrummare.
- id: scene-15
  description: Förutom unga bor också vuxna som inte har någon partner eller hemmaboende barn ensamma.
- id: scene-16
  description: Gifta makar av samma kön har rätt att adoptera ett barn och rätt till adoption inom familjen.
