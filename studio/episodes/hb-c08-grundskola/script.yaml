- sentence_id: hb-c08-u0037-s001
  sv: Alla barn som bor permanent i Finland har läroplikt mellan 7 och 18 års ålder.
  ru: Все дети, постоянно проживающие в Финляндии, подлежат обязательному обучению в возрасте от 7 до
    18 лет.
