scenes:
- id: hb-c08-u0037
  description: Alla barn som bor permanent i Finland har läroplikt mellan 7 och 18 års ålder.
- id: hb-c08-u0038
  description: Barnets föräldrar eller vårdnadshavare ska se till att barnet fullgör sin läroplikt.
- id: hb-c08-u0039
  description: Den grundläggande utbildningen, det vill säga grundskolan, omfattar årskurserna 1–9.
- id: hb-c08-u0040
  description: Enligt lagen har eleverna också rätt till avgiftsfria tjänster inom elevhälsa.
- id: hb-c08-u0041
  description: Syftet med den grundläggande utbildningen är bland annat att
- id: hb-c08-u0042
  description: ge barnen en allmänbildande utbildning
- id: hb-c08-u0044
  description: lära ut kunskaper och färdigheter som behövs i livet
- id: hb-c08-u0045
  description: förbättra barnens färdigheter i att lära sig
- id: hb-c08-u0046
  description: hjälpa barnen att växa upp till harmoniska individer
- id: hb-c08-u0047
  description: hjälpa barnen att växa upp till medlemmar i ett demokratiskt samhälle
- id: hb-c08-u0048
  description: lära barnen ett hållbart levnadssätt
- id: hb-c08-u0049
  description: lära barnen om demokratiska värden i det finländska samhället, till exempel likabehandling
    och jämställdhet
- id: hb-c08-u0050
  description: fostra barnen i mänskliga rättigheter och lära dem att respektera dem
- id: hb-c08-u0051
  description: lära barnen om olika kulturer på ett mångsidigt sätt
- id: hb-c08-u0052
  description: stödja barnen i att bygga upp en kulturell identitet.
- id: hb-c08-u0053
  description: Under de sex första åren undervisas barnen av en klasslärare, som undervisar dem i alla
    eller nästan alla läroämnen.
- id: hb-c08-u0054
  description: Eleven får ett avgångsbetyg för den grundläggande utbildningen när hen med godkänt resultat
    har avlagt den grundläggande utbildningens lärokurs.
- id: hb-c08-u0055
  description: Den grundläggande utbildningen inkluderar obligatoriska läroämnen som är gemensamma för
    alla och läroämnen som eleven själv kan välja.
- id: hb-c08-u0056
  description: Läroämnen som är gemensamma för alla är i årskurs 1–2 till exempel modersmål och litteratur
    och främmande språk, matematik, omgivningslära, religion eller livsåskådningskunskap, musik, gymnastik
    och slöjd.
- id: hb-c08-u0057
  description: Antalet läroämnen ökar i takt med att den grundläggande utbildningen framskrider.
- id: hb-c08-u0058
  description: Elever med invandrarbakgrund och tvåspråkiga elever kan få undervisning i sitt modersmål
    som en del av den grundläggande utbildningen.
- id: hb-c08-u0059
  description: Istället för religion kan eleverna studera livsåskådningskunskap i skolan, om de inte är
    medlemmar i något registrerat religiöst samfund.
- id: hb-c08-u0060
  description: Om elevens modersmål är finska, svenska eller samiska, studerar hen detta språk inom läroämnet
    ”modersmål och litteratur”.
- id: hb-c08-u0061
  description: I Finland styr lagen ordnandet av den grundläggande utbildningen.
- id: hb-c08-u0062
  description: I läroplanen för den grundläggande utbildningen betraktas eleven som en aktiv aktör.
- id: hb-c08-u0063
  description: Målet är att elevernas arbete i skolan ska vara undersökande och kreativt.
- id: hb-c08-u0064
  description: Grundskolorna och gymnasierna är i huvudsak offentliga i Finland.
- id: hb-c08-u0065
  description: I skolorna rangordnas eleverna inte i klasserna eller inom läroämnena.
- id: hb-c08-u0066
  description: I skolorna i Finland, liksom i arbetslivet i Finland, är hierarkin låg.
