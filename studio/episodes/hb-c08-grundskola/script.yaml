- sentence_id: hb-c08-u0037-s002
  sv: Barn och unga deltar först i den grundläggande utbildningen, det vill säga årskurserna 1–9, eller
    inhämtar på annat sätt kunskaper som motsvarar den grundläggande utbildningens lärokurs.
  ru: Сначала дети и подростки получают основное общее образование, то есть учатся в 1–9 классах, или
    другим способом приобретают знания, соответствующие программе основного общего образования.
  scene_id: hb-c08-u0037
  visual_cue: 'Source-specific pictorial composition path: årskurserna 1–9 / kunskaper. Only the archived
