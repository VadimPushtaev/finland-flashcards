- id: music_selection
  decision: Use Awaiting Return by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 105.378 seconds; prepared lossless stereo bed 778.250 seconds.
    Repeat count 7, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
