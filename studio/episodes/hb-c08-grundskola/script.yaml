- sentence_id: hb-c08-u0037-s003
  sv: Efter den grundläggande utbildningen ska alla unga dessutom studera till exempel på en utbildning
    på andra stadiet, tills de utexamineras eller fyller 18 år.
  ru: После основного общего образования все подростки должны также продолжать учёбу, например в учебном
    заведении второй ступени, пока не закончат обучение или им не исполнится 18 лет.
  scene_id: hb-c08-u0037
