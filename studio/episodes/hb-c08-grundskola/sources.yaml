    range_basis: normalized_html_block
    extracted_passage: I skolorna i Finland, liksom i arbetslivet i Finland, är hierarkin låg. Lärarna
      och skolans rektor är lättillgängliga för både eleverna och föräldrarna. Rektorn är skolans
      pedagogiska ledare. Också hen har lärarutbildning och tidigare erfarenhet av att arbeta som
