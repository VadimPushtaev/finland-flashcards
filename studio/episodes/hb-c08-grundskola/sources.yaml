    range_basis: normalized_html_block
    extracted_passage: Elever med invandrarbakgrund och tvåspråkiga elever kan få undervisning i
      sitt modersmål som en del av den grundläggande utbildningen. Inom religionsundervisningen finns
      det olika lärokurser, till exempel evangelisk-luthersk religion, ortodox religion eller islam.
      Utöver religionen som studeras lär man sig också om andra religioner och åskådningar. I lagen
      om grundläggande utbildning föreskrivs närmare om i vilket av skolans åskådningsämnen eleven
      ska eller kan delta i.
