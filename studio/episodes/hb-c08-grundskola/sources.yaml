    range_basis: normalized_html_block
    extracted_passage: I skolorna rangordnas eleverna inte i klasserna eller inom läroämnena. Istället
      är målet att göra undervisningen individuell och uppmuntrande och stödja lärandet på många
      olika sätt. På lektionerna används mångsidiga arbetssätt, till exempel mycket grupparbeten
      och tillsammans med små skolelever lärande genom lek.
