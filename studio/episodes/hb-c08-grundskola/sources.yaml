    range_basis: normalized_html_block
    extracted_passage: I läroplanen för den grundläggande utbildningen betraktas eleven som en aktiv
      aktör. I skolan lär hen sig att sätta upp mål och lösa problem både självständigt och tillsammans
      med andra. Lärandet sker i växelverkan med övriga elever och med omgivningen. Läraren styr
      lärandet, uppmuntrar och ger stärkande respons.
