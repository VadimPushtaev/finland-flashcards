    range_basis: normalized_html_block
    extracted_passage: I Finland styr lagen ordnandet av den grundläggande utbildningen. Dessutom
      ska skolorna och lärarna följa den läroplan som har utarbetats utifrån Utbildningsstyrelsens
      grunder för läroplanen. Samma grunder för läroplanen gäller alla skolor och elever.
