    extracted_passage: Istället för religion kan eleverna studera livsåskådningskunskap i skolan,
      om de inte är medlemmar i något registrerat religiöst samfund. Också en del andra elever har
      möjlighet att delta i undervisningen i livsåskådningskunskap. Livsåskådningskunskap är ett
