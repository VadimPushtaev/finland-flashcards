    heading: Läroplanen styr skolornas arbete
    source_range:
      start: 0
      end: 334
    range_basis: normalized_html_block
    extracted_passage: Målet är att elevernas arbete i skolan ska vara undersökande och kreativt.
      Undervisningsmetoderna kan variera. Digital kompetens, det vill säga färdigheter i att använda
      datorer och mobila enheter, blir allt viktigare i dagens samhälle. Dessa färdigheter är nödvändiga
      i vardagen och arbetslivet. Därför lär man ut dem också i skolan.
