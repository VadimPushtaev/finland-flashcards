    heading: Målet är att barns undervisning ska vara individuell och uppmuntrande
    source_range:
      start: 0
      end: 427
    range_basis: normalized_html_block
    extracted_passage: Grundskolorna och gymnasierna är i huvudsak offentliga i Finland. Det finns
      också privata skolor, men de är på samma sätt som de offentliga skolorna beroende av offentlig
      finansiering. I skolorna i Finland används inte skoluniform, och det finns nästan inga bestämmelser
      om hur eleverna ska klä sig. Pojkar och flickor går i samma skolor och samma klasser. I många
      skolor har man också blandade grupper på gymnastiklektionerna.
