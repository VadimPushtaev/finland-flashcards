episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Exact source paragraphs/list items define consecutive topic scenes. Sentence-specific objects
    and source relationships are planned individually; no added spoken transitions or current-law updates.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter12 violet palette {''background'': ''#352e49'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d7cce7'', ''highlight'': ''#e2c58b'', ''separator'': ''#685881''}. Liberation Sans
    Bold48/Regular40 with a fixed right bilingual panel and relevant left foreground pictures.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Rauhanasema 2023 (202327;+G72587).jpg by Tuula Sipilä; Helsingin kaupunginmuseo /
    Helsinki City Museum (archival source) continuously as decorative background, darkened 42% and blurred
    2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds
    per motion cycle, starting in motion, with no sentence resets. Total cycles=3.344642857142857. Foreground
    and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPyseed42 per invocation,44100HzmonoPCM16;
    initial2ONNXthreads shared with Chapter8 allocation. Exact synthesis inputs and actual seed scope
    are retained; whole-video listening remains pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use The Forest and the Trees by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 94.248 seconds; prepared lossless stereo bed 468.250
    seconds. Repeat count 5, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Distinct relevant picture for nearly every body sentence slide: actual places/objects where
    identity and license are verified, plus original pictorial diagrams for source-stated eligibility,
    administrative steps and personal-data protections. Avoid real personal identifiers and invented legal
    rules.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0001
  description: Integration betyder att en människa vänjer sig vid sitt nya hemland.
- id: hb-c12-u0002
  description: Integration förutsätter att den nyanlända är aktiv.
- id: hb-c12-u0003
  description: I takt med att tiden i det nya landet går vänjer sig personen vid de nya sederna och börjar
    förstå dem.
- id: hb-c12-u0004
  description: Integration betyder till exempel att en person lär sig landets språk tillräckligt bra.
- id: hb-c12-u0005
  description: När man i Finland pratar om integration betonar man ofta betydelsen av att få ett arbete.
- id: hb-c12-u0006
  description: En viktig del av integrationen är att lära känna andra människor som bor i Finland.
- id: hb-c12-u0007
  description: Integration innebär också att den nyanlända deltar i samhällets verksamhet på sätt som
    passar hen själv och känner sig delaktig i det finländska samhället.
- id: hb-c12-u0008
  description: Till integrationen hör att den nyanlända har kännedom om det finländska samhället och den
    finländska kulturen.
- id: hb-c12-u0009
  description: Integration betyder också att personen betraktar Finland som en viktig del av sitt liv
    och sin framtid och känner samhörighet med finländarna.
- id: hb-c12-u0010
  description: Också det omgivande samhällets mottaglighet har betydelse för känslan av delaktighet.
- id: hb-c12-u0011
  description: Integration i Finland kräver att den nyanlända anpassar sig och tar till sig nya kunskaper
    och färdigheter.
- id: hb-c12-u0012
  description: Invandringen till Finland var länge liten, och fortfarande bor det i Finland färre människor
    som flyttat hit från andra länder än i många andra länder i Västeuropa.
- id: hb-c12-u0013
  description: Att främja mottaglighet innebär till exempel att man identifierar de strukturer i samhället
    som skapar ojämlikhet och aktivt strävar efter att avveckla dem.
- id: hb-c12-u0014
  description: Finska statens målsättning är att den som flyttat till Finland känner sig som en del av
    det finska samhället och är med och utvecklar det.
