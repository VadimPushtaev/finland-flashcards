    source_kind: p
    source_role: content
    heading: Ett arbete är både en metod och ett mål för integrationen
    source_range:
      start: 0
      end: 422
    range_basis: normalized_html_block
    extracted_passage: När man i Finland pratar om integration betonar man ofta betydelsen av att
      få ett arbete. Man anser att ett arbete å ena sidan är ett mål för integrationen och å andra
      sidan främjar personens integration i Finland. Genom arbetet blir personen en del av samhället
      och lär känna andra människor. Hens ekonomiska situation förbättras. Också studier främjar
      integrationen och hjälper personen att hitta ett arbete i framtiden.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
