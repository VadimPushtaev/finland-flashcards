    heading: Sociala nätverk främjar välbefinnandet och integrationen
    source_range:
      start: 0
      end: 288
    range_basis: normalized_html_block
    extracted_passage: En viktig del av integrationen är att lära känna andra människor som bor i
      Finland. Sociala nätverk är viktiga för människans välbefinnande. Det kan vara till nytta att
      lära känna andra människor som flyttat till Finland från andra länder, eftersom de kan ge kamratstöd
      för integrationen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
