    heading: Delaktighet innebär att hitta sin plats i samhället
    source_range:
      start: 0
      end: 361
    range_basis: normalized_html_block
    extracted_passage: Integration innebär också att den nyanlända deltar i samhällets verksamhet
      på sätt som passar hen själv och känner sig delaktig i det finländska samhället. Delaktighet
      innebär att personen kan påverka sitt liv och de saker som är viktiga för hen i hens gemenskap
      och omgivning. Om personen vill kan hen delta i gemensam verksamhet och gemensamt beslutsfattande.
    normalization: whitespace_only
