    heading: Integration handlar om många saker
    source_range:
      start: 0
      end: 416
    range_basis: normalized_html_block
    extracted_passage: I takt med att tiden i det nya landet går vänjer sig personen vid de nya sederna
      och börjar förstå dem. Efter det är det lättare att leva i den nya miljön. Till slut är det
      möjligt att hitta en balans mellan de båda kulturerna. Vanligtvis håller människan fast vid
      de saker som var viktiga för hen i den kultur som hen tidigare levt i. Samtidigt tillägnar
      hen sig nya tankar och tillvägagångssätt i den nya kulturen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
