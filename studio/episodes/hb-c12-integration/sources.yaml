    range_basis: normalized_html_block
    extracted_passage: Integration i Finland kräver att den nyanlända anpassar sig och tar till sig
      nya kunskaper och färdigheter. Samtidigt måste också de som bor i Finland sedan tidigare anpassa
      sig, lära sig och ge akt på sina attityder. Det är fråga om så kallad dubbelriktad integration
