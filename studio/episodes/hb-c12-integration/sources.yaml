    heading: Vad betyder integration?
    source_range:
      start: 0
      end: 284
    range_basis: normalized_html_block
    extracted_passage: Integration förutsätter att den nyanlända är aktiv. Att till exempel lära
      sig språket och hitta arbete kräver mycket egen ansträngning. En person som integrerat sig
      i Finland känner sig som en del av det finländska samhället och bidrar till att forma det på
      sätt som passar hen själv.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
