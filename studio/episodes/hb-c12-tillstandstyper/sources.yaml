      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(25)
    source_kind: p
    source_role: content
    heading: Ett uppehållstillstånd är alltid först tidsbegränsat
    source_range:
      start: 0
      end: 424
    range_basis: normalized_html_block
    extracted_passage: En person kan få permanent uppehållstillstånd, som anges med bokstavskoden
      P på uppehållstillståndskortet, när hen har bott tillräckligt länge i Finland med ett kontinuerligt
      uppehållstillstånd. I allmänhet är grunden densamma som grunden för det föregående, kontinuerliga
      uppehållstillståndet, till exempel familjeband eller arbete. Grunden ska fortfarande gälla.
      Man kan ansöka om permanent tillstånd också på en ny grund.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0165:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/residence-permit-extension.html
    sha256: 845cbb643dba802fddf9efafaf4caf623f7a135f402469725faf855814b0813a
    source_block: b0002
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(4)
    source_kind: div
    source_role: content
    heading: Fortsatt tillstånd
    source_range:
      start: 0
      end: 315
    range_basis: normalized_html_block
    extracted_passage: Om giltighetstiden för ditt uppehållstillstånd snart går ut och du vill förlänga
      din vistelse i Finland behöver du ett nytt uppehållstillstånd. Det är viktigt att du ansöker
      om fortsatt tillstånd innan ditt tidigare uppehållstillstånd går ut. Du kan endast ansöka om
      fortsatt tillstånd om du befinner dig i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0166:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/residence-permit-extension.html
    sha256: 845cbb643dba802fddf9efafaf4caf623f7a135f402469725faf855814b0813a
    source_block: b0005
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Fortsatt tillstånd
    source_range:
      start: 0
      end: 313
    range_basis: normalized_html_block
    extracted_passage: Om ditt tidigare uppehållstillstånd går ut under behandlingen av din ansökan
      får du uppehålla dig i Finland och vanligtvis har du även rätt att arbeta under den tid som
      ansökan behandlas. Du kan få ett negativt beslut om du ansöker om fortsatt tillstånd först
      efter att ditt föregående uppehållstillstånd gått ut.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0167:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/residence-permit-extension.html
    sha256: 845cbb643dba802fddf9efafaf4caf623f7a135f402469725faf855814b0813a
    source_block: b0006
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Fortsatt tillstånd
    source_range:
      start: 0
      end: 311
    range_basis: normalized_html_block
    extracted_passage: Migrationsverket (Maahanmuuttovirasto) beviljar dig fortsatt tillstånd om
      grunden för det tidigare uppehållstillståndet fortfarande existerar. Du kan även ansöka om
      fortsatt tillstånd på någon annan grund än det första tillståndet. Kom ihåg att du måste uppfylla
      villkoren för det aktuella uppehållstillståndet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0168:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/residence-permit-extension.html
    sha256: 845cbb643dba802fddf9efafaf4caf623f7a135f402469725faf855814b0813a
    source_block: b0014
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Tillräckliga inkomster
    source_range:
      start: 0
      end: 204
    range_basis: normalized_html_block
    extracted_passage: Observera att ändringar i din livssituation också kan påverka ditt uppehållstillstånd.
      Ett tidsbegränsat uppehållstillstånd kan återkallas om de grunder på vilka tillståndet beviljades
      inte längre gäller.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0169:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/if-the-reason-for-your-residence-in-finland-changes.html
    sha256: 9b1e237fbe5253428c7ad4d8915e77312a0c412ed5f2c50b30d4881c1a7a8f00
    source_block: b0008
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Om orsaken för din vistelse i Finland ändras
    source_range:
      start: 0
      end: 337
    range_basis: normalized_html_block
    extracted_passage: Om du har ett tillfälligt uppehållstillstånd (A- eller B-tillstånd) och orsaken
      för din vistelse i Finland ändras måste du ansöka om ett nytt uppehållstillstånd på den nya
      grunden. Om du har ett permanent uppehållstillstånd (P) i Finland behöver du inte ändra grunden
      för ditt uppehållstillstånd även om orsaken till din vistelse ändras.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0170:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/if-the-reason-for-your-residence-in-finland-changes.html
    sha256: 9b1e237fbe5253428c7ad4d8915e77312a0c412ed5f2c50b30d4881c1a7a8f00
    source_block: b0018
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(6) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Om orsaken för din vistelse i Finland ändras
    source_range:
      start: 0
      end: 257
    range_basis: normalized_html_block
    extracted_passage: Det är bra att komma ihåg att grunden för uppehållstillståndet kan påverka
      vilka rättigheter du har i Finland. Till exempel ger ett uppehållstillstånd på grund av familjeband
      mer omfattande rätt att arbeta än ett tillstånd som beviljats på grund av studier.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0171:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/permanent-residence-permit.html
    sha256: a648bd624aaacc0d495f84fc6c9fc296dcd4521dd240eed5bf9ceb15b78ec034
    source_block: b0014
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(4) > p:nth-of-type(6)
    source_kind: p
    source_role: content
    heading: Permanent uppehållstillstånd
    source_range:
      start: 0
      end: 240
    range_basis: normalized_html_block
    extracted_passage: Ett permanent uppehållstillstånd gäller tills vidare. Tillståndet kan dock
      dras tillbaka om du lämnar Finland permanent, uppehåller dig utomlands kontinuerligt i minst
      två år eller har lämnat felaktiga uppgifter då du ansökt om tillståndet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
