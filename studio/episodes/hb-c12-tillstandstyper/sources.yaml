    source_range:
      start: 0
      end: 234
    range_basis: normalized_html_block
    extracted_passage: Utgångspunkten är att man får kontinuerligt uppehållstillstånd om flytten
      till Finland betraktas som permanent. Då får personen en hemkommun i Finland. I vissa fall
      kan man få en hemkommun också med ett tillfälligt uppehållstillstånd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0164:
    source_path: data/orientation/sv/laromedel/lag-och-ratt/uppehallstillstand-och-medborgarskap.html
