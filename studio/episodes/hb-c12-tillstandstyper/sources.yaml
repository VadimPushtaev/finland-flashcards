    heading: Ett uppehållstillstånd är alltid först tidsbegränsat
    source_range:
      start: 0
      end: 342
    range_basis: normalized_html_block
    extracted_passage: 'Det första uppehållstillståndet är alltid tidsbegränsat. Tidsbegränsat tillstånd
      betyder att det gäller för en viss tid, till exempel ett år. Det finns två typer av tidsbegränsade
      tillstånd: kontinuerligt tillstånd, med bokstavskoden A på uppehållstillståndskortet, och tillfälligt
      tillstånd, med bokstavskoden B på uppehållstillståndskortet.'
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
