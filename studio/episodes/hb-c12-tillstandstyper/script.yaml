- sentence_id: hb-c12-u0169-s001
  sv: Om du har ett tillfälligt uppehållstillstånd (A- eller B-tillstånd) och orsaken för din vistelse
    i Finland ändras måste du ansöka om ett nytt uppehållstillstånd på den nya grunden.
  ru: Если у вас есть вид на жительство на определённый срок (категории A или B) и причина вашего пребывания
    в Финляндии меняется, вы должны подать заявление на новый вид на жительство на новом основании.
  scene_id: hb-c12-u0169
  visual_cue: Changed reason with A/B time-limited permit needs new permit on new ground. Preserve archived
    wording without falsely equating continuous A with temporary-B category.
