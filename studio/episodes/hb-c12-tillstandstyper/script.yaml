- sentence_id: hb-c12-u0169-s002
  sv: Om du har ett permanent uppehållstillstånd (P) i Finland behöver du inte ändra grunden för ditt
    uppehållstillstånd även om orsaken till din vistelse ändras.
  ru: Если у вас есть постоянный вид на жительство (P) в Финляндии, вам не нужно менять его основание,
    даже если причина вашего пребывания меняется.
  scene_id: hb-c12-u0169
  visual_cue: P permit need not change ground when reason for stay changes; cross change requirement,
    not permit or right to remain.
