- sentence_id: hb-c12-u0171-s002
  sv: Tillståndet kan dock dras tillbaka om du lämnar Finland permanent, uppehåller dig utomlands kontinuerligt
    i minst två år eller har lämnat felaktiga uppgifter då du ansökt om tillståndet.
  ru: Однако вид на жительство может быть аннулирован, если вы уезжаете из Финляндии навсегда, непрерывно
    пребываете за границей не менее двух лет или сообщили неверные сведения при подаче заявления на вид
    на жительство.
  scene_id: hb-c12-u0171
  visual_cue: 'Alternative withdrawal grounds: permanent departure, continuous foreign stay at least two
    years, or false application details. Do not join them as simultaneous requirements.'
