- sentence_id: hb-c12-u0170-s002
  sv: Till exempel ger ett uppehållstillstånd på grund av familjeband mer omfattande rätt att arbeta än
    ett tillstånd som beviljats på grund av studier.
  ru: Например, вид на жительство на основании семейных связей даёт более широкое право на работу, чем
    вид на жительство, выданный на основании учёбы.
  scene_id: hb-c12-u0170
  visual_cue: Compare work-right scope for family versus study permits without inventing hours, sectors
    or universal exceptions.
