  sv: Ett tidsbegränsat uppehållstillstånd kan återkallas om de grunder på vilka tillståndet beviljades
    inte längre gäller.
  ru: Вид на жительство, выданный на определённый срок, может быть аннулирован, если основания, по которым
    он был выдан, больше не действуют.
  scene_id: hb-c12-u0168
