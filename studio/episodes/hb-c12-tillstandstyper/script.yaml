scenes:
- id: hb-c12-u0161
  description: Det finns olika typer av uppehållstillstånd.
- id: hb-c12-u0162
  description: Det första uppehållstillståndet är alltid tidsbegränsat.
- id: hb-c12-u0163
  description: Utgångspunkten är att man får kontinuerligt uppehållstillstånd om flytten till Finland
    betraktas som permanent.
- id: hb-c12-u0164
  description: En person kan få permanent uppehållstillstånd, som anges med bokstavskoden P på uppehållstillståndskortet,
    när hen har bott tillräckligt länge i Finland med ett kontinuerligt uppehållstillstånd.
- id: hb-c12-u0165
  description: Om giltighetstiden för ditt uppehållstillstånd snart går ut och du vill förlänga din vistelse
    i Finland behöver du ett nytt uppehållstillstånd.
- id: hb-c12-u0166
  description: Om ditt tidigare uppehållstillstånd går ut under behandlingen av din ansökan får du uppehålla
    dig i Finland och vanligtvis har du även rätt att arbeta under den tid som ansökan behandlas.
- id: hb-c12-u0167
  description: Migrationsverket (Maahanmuuttovirasto) beviljar dig fortsatt tillstånd om grunden för det
    tidigare uppehållstillståndet fortfarande existerar.
- id: hb-c12-u0168
  description: Observera att ändringar i din livssituation också kan påverka ditt uppehållstillstånd.
- id: hb-c12-u0169
  description: Om du har ett tillfälligt uppehållstillstånd (A- eller B-tillstånd) och orsaken för din
    vistelse i Finland ändras måste du ansöka om ett nytt uppehållstillstånd på den nya grunden.
- id: hb-c12-u0170
  description: Det är bra att komma ihåg att grunden för uppehållstillståndet kan påverka vilka rättigheter
    du har i Finland.
- id: hb-c12-u0171
  description: Ett permanent uppehållstillstånd gäller tills vidare.
