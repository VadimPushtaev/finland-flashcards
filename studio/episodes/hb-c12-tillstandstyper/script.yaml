- sentence_id: hb-c12-u0166-s002
  sv: Du kan få ett negativt beslut om du ansöker om fortsatt tillstånd först efter att ditt föregående
    uppehållstillstånd gått ut.
  ru: Вы можете получить отказ, если подадите заявление на продление вида на жительство лишь после того,
    как истечёт срок действия предыдущего.
  scene_id: hb-c12-u0166
