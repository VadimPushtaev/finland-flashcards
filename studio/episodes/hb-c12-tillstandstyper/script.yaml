- sentence_id: hb-c12-u0166-s001
  sv: Om ditt tidigare uppehållstillstånd går ut under behandlingen av din ansökan får du uppehålla dig
    i Finland och vanligtvis har du även rätt att arbeta under den tid som ansökan behandlas.
  ru: Если срок действия предыдущего вида на жительство истечёт во время рассмотрения вашего заявления,
    вы можете пребывать в Финляндии и обычно также имеете право работать, пока заявление рассматривается.
  scene_id: hb-c12-u0166
  visual_cue: Pending continuation allows stay and usually work if prior permit expires during processing;
    do not conflate first-application work rule.
  asset_ids:
