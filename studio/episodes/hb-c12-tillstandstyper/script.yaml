- sentence_id: hb-c12-u0167-s002
  sv: Du kan även ansöka om fortsatt tillstånd på någon annan grund än det första tillståndet.
  ru: Вы также можете подать заявление на продление вида на жительство на ином основании, чем при получении
    первого.
  scene_id: hb-c12-u0167
