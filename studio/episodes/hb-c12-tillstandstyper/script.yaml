- sentence_id: hb-c12-u0165-s003
  sv: Du kan endast ansöka om fortsatt tillstånd om du befinner dig i Finland.
  ru: Подать заявление на продление вида на жительство можно только находясь в Финляндии.
  scene_id: hb-c12-u0165
  visual_cue: Continuation application only while in Finland, generic location context without invented
    travel restriction beyond source.
