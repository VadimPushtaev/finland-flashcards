- sentence_id: hb-c12-u0165-s002
  sv: Det är viktigt att du ansöker om fortsatt tillstånd innan ditt tidigare uppehållstillstånd går ut.
  ru: Важно подать заявление на продление вида на жительство (fortsatt tillstånd) до истечения срока действия
    предыдущего вида на жительство.
  scene_id: hb-c12-u0165
