  sv: Om giltighetstiden för ditt uppehållstillstånd snart går ut och du vill förlänga din vistelse i
    Finland behöver du ett nytt uppehållstillstånd.
  ru: Если срок действия вашего вида на жительство скоро истекает и вы хотите продлить своё пребывание
    в Финляндии, вам нужен новый вид на жительство.
