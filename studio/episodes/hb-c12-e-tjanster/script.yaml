episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Exact source paragraphs/list items define consecutive topic scenes. Sentence-specific objects
    and source relationships are planned individually; no added spoken transitions or current-law updates.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter12 violet palette {''background'': ''#352e49'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d7cce7'', ''highlight'': ''#e2c58b'', ''separator'': ''#685881''}. Liberation Sans
    Bold48/Regular40 with a fixed right bilingual panel and relevant left foreground pictures.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Computer keyboard.jpg by Joe lope continuously as decorative background, darkened
    42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=2.248511904761905.
    Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPyseed42 per invocation,44100HzmonoPCM16;
    initial2ONNXthreads shared with Chapter8 allocation. Exact synthesis inputs and actual seed scope
    are retained; whole-video listening remains pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Overheat by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 423.340 seconds; prepared lossless stereo bed 314.792 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Distinct relevant picture for nearly every body sentence slide: actual places/objects where
    identity and license are verified, plus original pictorial diagrams for source-stated eligibility,
    administrative steps and personal-data protections. Avoid real personal identifiers and invented legal
    rules.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0119
  description: I Finland har myndigheterna alltmer övergått till elektronisk ärendehantering.
- id: hb-c12-u0120
  description: Suomi.fi är en webbplats som administreras av finska staten.
- id: hb-c12-u0121
  description: Många kommuner har kundtjänster som erbjuder digitalt stöd och där man kan få hjälp med
    att till exempel använda olika myndigheters e-tjänster.
- id: hb-c12-u0122
  description: Om man inte kan eller vill använda e-tjänster kan man vanligtvis uträtta sina ärenden också
    genom att besöka myndigheten eller ett kundtjänstställe, eller genom att ringa.
- id: hb-c12-u0123
  description: För elektronisk ärendehantering krävs i Finland i allmänhet stark autentisering.
- id: hb-c12-u0124
  description: Stark autentisering sker med nätbankskoder, ett mobilcertifikat eller ett chipförsett identitetskort.
- id: hb-c12-u0125
  description: Man ansöker om nätbankskoder hos sin egen bank.
- id: hb-c12-u0126
  description: Nätbankskoder och andra verktyg för stark autentisering är alltid personliga.
