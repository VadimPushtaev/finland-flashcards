    heading: Stark autentisering sker i allmänhet med bankkoder
    source_range:
      start: 0
      end: 419
    range_basis: normalized_html_block
    extracted_passage: För elektronisk ärendehantering krävs i Finland i allmänhet stark autentisering.
      Stark autentisering betyder att en person på ett tillförlitligt sätt styrker sin identitet
      när hen använder e-tjänster. Det är samma ska som när en person visar sitt identitetsbevis
      när hen uträttar ärenden genom att fysiskt besöka ett kundtjänstställe. För att använda stark
      autentisering krävs i allmänhet en finländsk personbeteckning.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
