    range_basis: normalized_html_block
    extracted_passage: Man ansöker om nätbankskoder hos sin egen bank. I allmänhet är det värt att
      fråga efter koderna när man öppnar ett bankkonto. Det ställs ändå högre krav på nätbankskoder
      än på att öppna ett konto. Ibland kan banken inte bevilja nätbankskoder, även om man får öppna
      ett konto. Banken kan till exempel kräva att man har ett identitetskort som utfärdats av polisen
      i Finland.
