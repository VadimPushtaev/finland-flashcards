    range_basis: normalized_html_block
    extracted_passage: Om man inte kan eller vill använda e-tjänster kan man vanligtvis uträtta sina
      ärenden också genom att besöka myndigheten eller ett kundtjänstställe, eller genom att ringa.
      Om man vill besöka en myndighet för att uträtta ett ärende måste man ofta boka tid. Ibland
      kan ett ärende inte uträttas på nätet eller per telefon, utan man måste själv besöka myndigheten.
      Så är det till exempel när man första gången ansöker om en finländsk personbeteckning eller
      ett finländskt identitetskort.
    normalization: whitespace_only
