    extracted_passage: Stark autentisering sker med nätbankskoder, ett mobilcertifikat eller ett
      chipförsett identitetskort. Att använda ett chipförsett identitetskort för elektronisk ärendehantering
      kräver en särskild programvara och en kortläsare som kopplas till en dator. De flesta använder
      nätbankskoder för att uträtta ärenden elektroniskt.
