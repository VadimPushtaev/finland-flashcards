episode_decisions:
- id: opening
  decision: Exact bilingual unspoken3-second heading. Continuous decorative background motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Exact source paragraphs/list items define consecutive topic scenes. Sentence-specific objects
    and source relationships are planned individually; no added spoken transitions or current-law updates.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080 at24fps; Chapter12 violet palette {''background'': ''#352e49'', ''text'': ''#faf3e8'',
    ''secondary'': ''#d7cce7'', ''highlight'': ''#e2c58b'', ''separator'': ''#685881''}. Liberation Sans
    Bold48/Regular40 with a fixed right bilingual panel and relevant left foreground pictures.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Show both texts0.25seconds before narration; use full measured clips,1.5second regular pause,2.2at
    scene ends and2.5for longer pairs. Do not accelerate to a target runtime.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Kuopion kasarmialue - Maistraatti - tiilirakennus vuodelta 1915 - Puistokatu 29 -
    Hatsala - Kuopio.jpg by Paju~commonswiki continuously as decorative background, darkened 42% and blurred
    2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219, 140 seconds
    per motion cycle, starting in motion, with no sentence resets. Total cycles=4.52797619047619. Foreground
    and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,NumPyseed42 per invocation,44100HzmonoPCM16;
    initial2ONNXthreads shared with Chapter8 allocation. Exact synthesis inputs and actual seed scope
    are retained; whole-video listening remains pending.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use New Direction by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 679.549 seconds; prepared lossless stereo bed 633.917 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: 'Distinct relevant picture for nearly every body sentence slide: actual places/objects where
    identity and license are verified, plus original pictorial diagrams for source-stated eligibility,
    administrative steps and personal-data protections. Avoid real personal identifiers and invented legal
    rules.'
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credits followed by foreground attribution,15seconds each, with full URLs/licenses
    and original notices in canonical sidecar.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. Preserve exact archived source,reviewed Russian,sourceorder
    and IDs.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c12-u0081
  description: Personbeteckningen är en individuell kod som ges till alla människor som registreras i
    Finlands befolkningsdatasystem.
- id: hb-c12-u0082
  description: Två personer kan aldrig ha samma personbeteckning.
- id: hb-c12-u0083
  description: Personbeteckningen är mycket viktig i Finland, och en sådan krävs i så gott som alla myndighetsärenden.
- id: hb-c12-u0084
  description: Befolkningsdatasystemet som upprätthålls av Myndigheten för digitalisering och befolkningsdata
    är ett basregister som används av Finlands myndigheter.
- id: hb-c12-u0085
  description: I annat fall beror det på situationen vilka uppgifter myndigheterna kan få om en person
    från andra myndigheter.
- id: hb-c12-u0086
  description: En myndighet har alltid rätt att få tillgång till endast sådana uppgifter om en person
    som den har laglig grund för att få.
- id: hb-c12-u0087
  description: När du får en personbeteckning blir du inte automatiskt registrerad som invånare i en viss
    kommun.
- id: hb-c12-u0088
  description: Du kan få en personbeteckning om du lagligt vistas i Finland.
- id: hb-c12-u0089
  description: Du behöver en personbeteckning för arbete, studier eller en motsvarande orsak som äger
    rum i Finland.
- id: hb-c12-u0091
  description: Din familjemedlem har redan en registrerad adress i Finland.
- id: hb-c12-u0092
  description: Migrationsverket har beviljat dig ett uppehållstillstånd eller uppehållskort eller registrerat
    din uppehållsrätt för EU-medborgare i Finland.
- id: hb-c12-u0093
  description: När dina personuppgifter registreras sparas samtidigt också en adress för dig.
- id: hb-c12-u0094
  description: En tillfällig adress gäller tillfälligt och du har blivit registrerad som invånare på adressen
    för en viss tidsperiod.
- id: hb-c12-u0095
  description: När Myndigheten för digitalisering och befolkningsdata registrerar dig en permanent adress,
    registrerar den dig som invånare på adressen tills vidare.
- id: hb-c12-u0096
  description: Till kommunens tjänster hör till exempel skolorna, småbarnspedagogiken, sysselsättningstjänsterna
    (työllisyyspalvelut) och integrationstjänsterna (kotoutumispalvelut) för invandrare.
- id: hb-c12-u0097
  description: Det är bra att ta reda på om du och de andra medlemmarna i din familj har rätt till en
    hemkommun i Finland.
- id: hb-c12-u0098
  description: Om en postadress registreras för dig registreras du inte som invånare på adressen i fråga.
- id: hb-c12-u0099
  description: Myndigheten för digitalisering och befolkningsdata registrerar dina uppgifter i det finländska
    befolkningsdatasystemet.
