  sv: Gränsförfarandet(rajamenettely) innebär att Migrationsverket behandlar ansökan vid ett påskyndat
    förfarande eller fattar beslut om att avvisa ansökan utan prövning.
  ru: Пограничная процедура (rajamenettely) означает, что Миграционная служба рассматривает заявление
    в ускоренном порядке или принимает решение оставить его без рассмотрения.
  scene_id: hb-c12-u0178
  visual_cue: Border procedure may involve accelerated examination or inadmissibility decision; alternatives,
    not automatic refusal or physical removal.
