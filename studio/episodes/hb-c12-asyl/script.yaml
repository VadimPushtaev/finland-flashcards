scenes:
- id: hb-c12-u0172
  description: I allmänhet måste man ansöka om uppehållstillstånd innan man flyttar till Finland.
- id: hb-c12-u0173
  description: Med internationellt skydd avses i Finland flyktingstatus eller status som alternativt skyddsbehövande.
- id: hb-c12-u0174
  description: Man kan ansöka om internationellt skydd genom att lämna in en asylansökan.
- id: hb-c12-u0175
  description: En person kan få alternativt skydd om hen löper risk att utsättas för någon annan verklig
    och allvarlig fara än den förföljelse som ligger till grund för asyl.
- id: hb-c12-u0176
  description: Du kan söka asyl i Finland om du har välgrundad fruktan för förföljelse i ditt hemland.
- id: hb-c12-u0177
  description: När myndigheten har mottagit din asylansökan, hänvisas du till ett mottagningscenter.
- id: hb-c12-u0178
  description: I vissa situationer kan gränsmyndigheten lämna över din asylansökan till gränsförfarandet.
- id: hb-c12-u0179
  description: Gränsmyndigheten hänvisar dig till ett mottagningscenter.
- id: hb-c12-u0180
  description: Om du är under 18 år gammal och kommer till Finland som asylsökande utan vårdnadshavare,
    förordnas du ett ombud.
- id: hb-c12-u0181
  description: Migrationsverket handlägger din ansökan och fattar ett beslut.
- id: hb-c12-u0182
  description: Det är vanligt att behandlingen av ansökan tar flera månader.
- id: hb-c12-u0183
  description: Som asylsökande har du rätt att använda ett rättsbiträde under samtalet.
- id: hb-c12-u0184
  description: Under tiden då din ansökan behandlas kan du få rådgivning och rättshjälp vid den offentliga
    rättshjälpsbyrån.
- id: hb-c12-u0185
  description: Du kan även få rådgivning hos Flyktingrådgivningen rf (Pakolaisneuvonta ry).
- id: hb-c12-u0186
  description: Asylsökande har inte rätt till den sociala tryggheten i Finland.
- id: hb-c12-u0187
  description: Förläggningen betalar ut mottagningspenning till dig.
