    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(11)
    source_kind: p
    source_role: content
    heading: Man kan få internationellt skydd om man inte kan återvända till sitt hemland på grund
      av förföljelse eller en konflikt
    source_range:
      start: 0
      end: 331
    range_basis: normalized_html_block
    extracted_passage: En person kan få alternativt skydd om hen löper risk att utsättas för någon
      annan verklig och allvarlig fara än den förföljelse som ligger till grund för asyl. En orsak
      till det kan vara hot om dödsstraff eller tortyr. En orsak kan också vara att personen utsätts
      för en allvarlig och personlig fara på grund av en väpnad konflikt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0176:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0015
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(5) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Asyl i Finland
    source_range:
      start: 0
      end: 233
    range_basis: normalized_html_block
    extracted_passage: Du kan söka asyl i Finland om du har välgrundad fruktan för förföljelse i
      ditt hemland. Orsaker till förföljelse kan vara etniskt ursprung, religion, medborgarskap,
      tillhörighet till en viss grupp i samhället eller politiska åsikter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0177:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0023
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Söka asyl
    source_range:
      start: 0
      end: 226
    range_basis: normalized_html_block
    extracted_passage: När myndigheten har mottagit din asylansökan, hänvisas du till ett mottagningscenter.
      Där kan du bo under tiden då Migrationsverket behandlar din ansökan. Du kan även bo någon annanstans,
      men då måste du själv bekosta boendet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0178:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0025
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(5)
    source_kind: p
    source_role: content
    heading: Gränsförfarandet
    source_range:
      start: 0
      end: 403
    range_basis: normalized_html_block
    extracted_passage: I vissa situationer kan gränsmyndigheten lämna över din asylansökan till gränsförfarandet.
      För detta måste det alltid finnas en laglig grund. Gränsförfarandet(rajamenettely) innebär
      att Migrationsverket behandlar ansökan vid ett påskyndat förfarande eller fattar beslut om
      att avvisa ansökan utan prövning. I utlänningslagen (ulkomaalaislaki) definieras i vilka situationer
      Migrationsverket kan göra så.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0179:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0026
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(7) > p:nth-of-type(6)
    source_kind: p
    source_role: content
    heading: Gränsförfarandet
    source_range:
      start: 0
      end: 274
    range_basis: normalized_html_block
    extracted_passage: Gränsmyndigheten hänvisar dig till ett mottagningscenter. Du måste bo där
      under den tid som gränsförfarandet pågår. Du får inte lämna mottagningscentrets område utan
      tillstånd. Vid gränsförfarandet har du samma rätt till rådgivning och juridisk hjälp som andra
      asylsökanden.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0180:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0043
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(14) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Minderåriga asylsökande
    source_range:
      start: 0
      end: 437
    range_basis: normalized_html_block
    extracted_passage: Om du är under 18 år gammal och kommer till Finland som asylsökande utan vårdnadshavare,
      förordnas du ett ombud. Ombudet är en pålitlig vuxen person som hjälper dig med olika ärenden
      under tiden då Migrationsverket behandlar din ansökan. Ombudet följer med dig när du ska prata
      med myndigheter. Dessutom utreder ditt ombud om du kan återförenas med din familj. Du har rätt
      till boende, mat och hälsovård. Du har även rätt att gå i skola.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0181:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0046
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(16) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Handläggning av asylansökan
    source_range:
      start: 0
      end: 172
    range_basis: normalized_html_block
    extracted_passage: Migrationsverket handlägger din ansökan och fattar ett beslut. Migrationsverket
      utreder din identitet och resväg till Finland och bedömer om du kan beviljas asyl i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0182:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0047
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(16) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Handläggning av asylansökan
    source_range:
      start: 0
      end: 262
    range_basis: normalized_html_block
    extracted_passage: Det är vanligt att behandlingen av ansökan tar flera månader. När du har sökt
      asyl har du rätt att vistas i Finland medan din ansökan behandlas. Under denna tid kan du inte
      resa utomlands. Om du reser kan myndigheterna besluta att din ansökan inte längre gäller.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0183:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0052
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(18) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Asylsamtal
    source_range:
      start: 0
      end: 127
    range_basis: normalized_html_block
    extracted_passage: Som asylsökande har du rätt att använda ett rättsbiträde under samtalet. Biträdet
      deltar i asylsamtalet efter sitt eget omdöme.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0184:
    source_path: data/infofinland/content/moving-to-finland/non-eu-citizens/asylum-in-finland.html
    sha256: 55adfa5635fadfbc1e662b1ce0a7fc560ca430e8567d496899ce00d22defb54f
    source_block: b0073
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(23) > p:nth-of-type(1)
    source_kind: p
    source_role: content
    heading: Rättshjälp för asylsökande
    source_range:
      start: 0
      end: 317
    range_basis: normalized_html_block
    extracted_passage: Under tiden då din ansökan behandlas kan du få rådgivning och rättshjälp vid
      den offentliga rättshjälpsbyrån. Kontakta rättshjälpsbyrån om du vill ha ett rättsbiträde.
      Vid behov hjälper mottagningscentret dig. Rättshjälpsbyrån (oikeusaputoimisto) kan även hänvisa
      dig till en privat jurist eller en privat juristbyrå.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
