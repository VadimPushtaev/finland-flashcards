    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(10)
    source_kind: p
    source_role: content
    heading: Man kan få internationellt skydd om man inte kan återvända till sitt hemland på grund
      av förföljelse eller en konflikt
    source_range:
      start: 0
      end: 389
    range_basis: normalized_html_block
    extracted_passage: Man kan ansöka om internationellt skydd genom att lämna in en asylansökan.
      Migrationsverket utreder om en person har rätt till asyl. Om förutsättningarna för att få asyl
      uppfylls, beviljas personen uppehållstillstånd på grund av flyktingstatus. Om förutsättningarna
      för att få asyl inte uppfylls, utreder man om personen har rätt till skydd i Finland enligt
      principen om alternativt skydd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0175:
    source_path: data/orientation/sv/laromedel/lag-och-ratt/uppehallstillstand-och-medborgarskap.html
