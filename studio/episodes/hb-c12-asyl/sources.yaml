    heading: Uppehållstillstånd och medborgarskap
    source_range:
      start: 0
      end: 393
    range_basis: normalized_html_block
    extracted_passage: I allmänhet måste man ansöka om uppehållstillstånd innan man flyttar till
      Finland. Ett undantag är ändå ansökan om asyl, eftersom man kan ansöka om asyl endast i Finland.
      Om en person beviljas asyl, får hen uppehållstillstånd på basis av sin flyktingstatus. Med
      en asylansökan kan man också få uppehållstillstånd på grund av alternativt skydd eller till
      exempel individuella mänskliga orsaker.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
