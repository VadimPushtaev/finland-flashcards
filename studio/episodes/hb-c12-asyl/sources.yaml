    source_kind: p
    source_role: content
    heading: Man kan få internationellt skydd om man inte kan återvända till sitt hemland på grund
      av förföljelse eller en konflikt
    source_range:
      start: 0
      end: 209
    range_basis: normalized_html_block
    extracted_passage: Med internationellt skydd avses i Finland flyktingstatus eller status som
      alternativt skyddsbehövande. I utlänningslagen finns bestämmelser om grunderna och förfarandena
      enligt vilka internationellt skydd ges.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c12-u0174:
    source_path: data/orientation/sv/laromedel/lag-och-ratt/uppehallstillstand-och-medborgarskap.html
    sha256: edce233ade78cd40cd16b10a0bdc1dafc917b572f5b72e04e4fd51860879fcf1
