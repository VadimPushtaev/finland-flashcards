    heading: Efter krigen påbörjades uppbyggnaden av välfärdsstaten
    source_range:
      start: 0
      end: 359
    range_basis: normalized_html_block
    extracted_passage: Efter andra världskriget tvingades Finland hålla samma linje som Sovjetunionen
      i sin utrikespolitik för att undvika ockupation. Officiellt var Finland ett neutralt land,
      men i verkligheten måste det i sin politik också beakta Sovjetunionens intressen. Å andra sidan
      förblev Finland ett självständigt land och drog ekonomisk nytta av handeln med Sovjetunionen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
