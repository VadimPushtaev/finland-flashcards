    heading: Efter krigen påbörjades uppbyggnaden av välfärdsstaten
    source_range:
      start: 0
      end: 356
    range_basis: normalized_html_block
    extracted_passage: Så småningom blev Finland en välfärdsstat, där staten och kommunerna gavs
      en viktig roll i att säkerställa medborgarnas levnadsstandard och försörjning. Det faktum att
      alla medborgare erbjöds tjänster och social trygghet som tillhandahölls med skattemedel fick
      människorna att lita på det demokratiska beslutsfattandet och samhället och dess institutioner.
    normalization: whitespace_only
    repairs: []
