    heading: Efter krigen påbörjades uppbyggnaden av välfärdsstaten
    source_range:
      start: 0
      end: 462
    range_basis: normalized_html_block
    extracted_passage: Efter krigen utvecklades Finlands industri och ekonomin växte kraftigt. Den
      politiska viljan att bygga upp Finland till ett ännu bättre, mer jämlikt och tryggare land
      var stark. Samtliga partier antog som sitt politiska mål att bygga upp en välfärdsstat. En
      viktig förutsättning för uppbyggnaden var tillräcklig ekonomisk tillväxt. Människorna förenades
      av att de upplevt svåra levnadsförhållanden, vilket gjorde att alla förband sig till att utveckla
      samhället.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
