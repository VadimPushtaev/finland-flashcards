    heading: Återuppbyggnad, industrialisering och kalla kriget 1945–1991
    source_range:
      start: 0
      end: 458
    range_basis: normalized_html_block
    extracted_passage: Finland förlorade kriget och var därför tvunget att betala ett tungt krigsskadestånd
      till Sovjetunionen i form av varor. Som krigsskadestånd levererade man till exempel tåg, fartyg
      och råvaror. Finland finansierade tillverkningen av varorna med lån och understöd. I och med
      produktionen av krigsskadeståndet utvecklades Finland från ett jordbruksland till ett industriland.
      I takt med industrialiseringen började flyttrörelsen från landsbygden till städerna.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0056:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 127
    printed_page: 126
    source_range:
      start: 1347
      end: 2171
    range_basis: raw_pdf_page
    extracted_passage: "Efter krigen präglades politiken först av försiktighet och oro över att Sovjetunionen\
      \ skulle ockupera \nlandet. Kommunistisk politisk verksamhet var tillåten igen och man var\
      \ också rädd för en \nkommunistisk revolution. Men spänningen minskade så småningom när förhållandena\
      \ stabiliserades. \nNär också förhållandet till Sovjet stabiliserades lärde sig finländarna\
      \ hur det lönar sig att handla som \ngranne till en inflytelserik stormakt. År 1948 slöt Finland\
      \ och Sovjet VSB-pakten, det vill säga \nVänskaps-, samarbets- och biståndspakten. Pakten gav\
      \ Finland ekonomiska fördelar, men innebar \nockså att Finland i både inrikes- och utrikespolitiken\
      \ måste handla så att man inte irriterade Sovjet. \nFinland var officiellt ett självständigt\
      \ och neutralt land, men i verkligheten måste man beakta Sovjets \nintressen i sin politik.\
      \ \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
