    source_range:
      start: 0
      end: 347
    range_basis: normalized_html_block
    extracted_passage: När polisen har överfört ett ärende till en åklagare, utreder hen fallet och
      bestämmer om ärendet ska föras vidare till domstol. Åklagaren kan bestämma att inget åtal väcks,
      om till exempel brottet är ringa eller man redan har gjort en förlikning i ärendet. Åklagaren
      kan också påföra gärningsmannen böter eller föreslå förlikning mellan parterna.
