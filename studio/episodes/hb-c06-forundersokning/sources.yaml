    heading: I förundersökningen utreder polisen om ett brott har begåtts
    source_range:
      start: 0
      end: 345
    range_basis: normalized_html_block
    extracted_passage: Om polisen har skäl att misstänka att ett brott har begåtts inleds en förundersökning.
      Under förundersökningen utreder polisen närmare vad som har hänt. Om det i förundersökningen
      konstateras att ett brott har begåtts, överför polisen ärendet till en åklagare. Polisen kan
      också ålägga gärningsmannen böter eller föreslå medling mellan parterna.
    normalization: whitespace_only
    repairs: []
