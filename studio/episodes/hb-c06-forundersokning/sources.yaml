    heading: Åklagaren bestämmer om åtal ska väckas
    source_range:
      start: 0
      end: 440
    range_basis: normalized_html_block
    extracted_passage: Medling betyder att man löser ett ärende och till exempel kommer överens om
      betalning av ersättning mellan parterna utan att ärendet behandlas i en domstol. Medling är
      alltid frivillig. Dessutom bedömer medlingsbyrån om ärendet är lämpligt att lösa genom medling.
      I en medling deltar alltid utbildade medlare, som har som uppgift att se till att båda parterna
      godkänner lösningen. Resultatet av medlingen är rättsligt bindande för parterna.
    normalization: whitespace_only
    repairs: []
