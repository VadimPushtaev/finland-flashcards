episode_decisions:
- id: opening
  decision: Exact bilingual heading, unspoken, for three seconds. Continuous photo motion starts immediately.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: Group consecutive source sentences into the scenes below. Read every body sentence once in
    its exact original order, without added narration.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920×1080 at 24 fps, Chapter 5 burgundy palette: #39252b / #faf3e8 / #e2c8cf / #dfbd82 /
    #70515a. Liberation Sans Bold 48 and Regular 40, fixed bilingual panel at right, relevant pictures
    at left.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display text 0.25 seconds before speech. Moderate local voice speed0.95; allow 1.5 seconds
    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Palace of Nations - flags - 2.JPG by Benoît Prieur continuously as decorative background,
    darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative
    zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets. Total
    cycles=1.5511904761904762. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Avec Soin by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 145.084 seconds; prepared lossless stereo bed 217.167 seconds.
    Repeat count 1, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Use verified photographs of actual Finnish civic activity, associations and institutions at
    meaningful topic boundaries. Preserve full pictures and source text; captions remain off where a source
    highlight is not a literal picture label. Measure at least 50% body-duration picture coverage; no
    decorative background or text card counts.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credit cards plus dedicated foreground attribution cards, 15 seconds each,
    over continuing background. Full URLs, licenses and adaptation details accompany the canonical MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
