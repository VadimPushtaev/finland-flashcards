    heading: Myndigheternas verksamhet i Finland regleras av lagar
    source_range:
      start: 0
      end: 437
    range_basis: normalized_html_block
    extracted_passage: I Finland regleras alla myndigheters verksamhet av förvaltningslagen som allmän
      lag. Dessutom finns det egna lagar för många myndigheters verksamhet som föreskriver om vilka
      ärenden som ingår i den aktuella myndighetens behörighet. Med behörighet avses de frågor som
      den aktuella myndigheten har makt att fatta beslut i. En del frågor inom myndigheternas verksamhet,
      såsom behandlingen av personuppgifter, regleras genom EU-lagstiftning.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
