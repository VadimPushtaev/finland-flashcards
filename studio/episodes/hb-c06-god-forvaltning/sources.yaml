    source_range:
      start: 0
      end: 513
    range_basis: normalized_html_block
    extracted_passage: Eftersom myndigheternas verksamhet i Finland är strängt reglerad av lagar
      kan den ibland kännas stel. Det är vanligtvis inte möjligt att påskynda en enskild kunds ärende
      eller göra undantag i ett beslut, eller så är det möjligt endast om det finns en grundad anledning
      eller särskilt vägande skäl. Sådana skäl är i allmänhet fastställda i förväg, och en enskild
      tjänsteman kan inte avvika från reglerna även om hen skulle vilja. Syftet är att alla ska behandlas
      lika och att myndigheternas beslut ska följa lagen.
    normalization: whitespace_only
