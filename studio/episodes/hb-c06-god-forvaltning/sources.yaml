    range_basis: normalized_html_block
    extracted_passage: I Finland är målet att skapa ett mer jämlikt samhälle. Därför till exempel
      jämnas inkomstskillnaderna mellan människor ut med hjälp av beskattning. Jämlika inkomster
      ökar människornas tillit till samhället och minskar korruption. Finland hör till ett av de
      minst korrumperade länderna i världen. Missbruk förekommer ibland också i Finland, men man
      försöker ingripa effektivt i det.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
