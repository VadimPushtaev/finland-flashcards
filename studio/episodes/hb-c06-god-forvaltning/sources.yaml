    range_basis: normalized_html_block
    extracted_passage: Finlands rättssystem avser det sätt som rätten fungerar på i Finland och som
      myndigheterna använder för att övervaka utövandet av rätten. Finland är ett land med god förvaltning.
      God förvaltning betyder att samhället fungerar smidigt och är jämlikt och att myndigheterna
      verkar objektivt och i proportion till det eftersträvade målet. Människorna kan utöva sina
      rättigheter och skyldigheter, och det förekommer lite korruption.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
