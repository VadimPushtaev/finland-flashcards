    range_basis: normalized_html_block
    extracted_passage: Korruption betyder att myndigheter kan mutas och inte alltid följer regler
      eller lagar i sitt arbete. Korruption är till exempel om någon ger eller får en gentjänst för
      pengar eller andra förmåner som hen inte har laglig rätt till. Korruption är också till exempel
      att favorisera släktingar eller vänner i beslutsfattande eller att en politiker deltar i beslutsfattande
      som direkt gynnar ett företag som hen äger.
    normalization: whitespace_only
