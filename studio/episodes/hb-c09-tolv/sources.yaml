    range_basis: normalized_html_block
    extracted_passage: 'Rättighet: Barnets för- eller efternamn kan inte bytas utan barnets tillstånd.
      Barnet kan inte anslutas till ett trossamfund utan barnets tillstånd. Barnets tillstånd behövs
      också för utträde ur ett trossamfund. Om barnets föräldrar skiljer sig, har barnet rätt att
      träffa båda sina föräldrar. Barnets åsikt ska beaktas senast när barnet ät tolv år gammalt.
      Om barnet inte vill träffa någon av föräldrarna har hen rätt att säga sin åsikt. Barnets åsikt
      ska beaktas också när man fattar beslut om hos vilken förälder barnet ska bo. Om det finns
      problem i familjen kan barnet själv be om vård utom hemmet. Vård utom hemmet betyder att barnet
      bor någon annanstans än hos sina föräldrar.'
    normalization: whitespace_only
    repairs: []
