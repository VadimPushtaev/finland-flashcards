    heading: Egen bil medför kostnader, men kan vara nödvändig i glesbygdsområden
    source_range:
      start: 0
      end: 193
    range_basis: normalized_html_block
    extracted_passage: Egen bil, bensin, försäkringsavgifter, skatter och bilservice är dyra i Finland.
      I de större städerna behöver man vanligtvis ingen egen bil. På mindre orter kan en egen bil
      ändå vara nödvändig.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0252:
    source_path: data/orientation/sv/laromedel/vardagen/fritid-och-resor.html
