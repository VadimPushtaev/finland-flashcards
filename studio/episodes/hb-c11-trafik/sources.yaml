    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(17) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Utländskt körkort i Finland
    source_range:
      start: 0
      end: 199
    range_basis: normalized_html_block
    extracted_passage: I Finland accepteras alla körkort som är beviljade i stater som Finland har
      erkänt. Ett utländskt körkort accepteras inte om kortinnehavaren har bott i Finland vid den
      tidpunkt som kortet beviljades.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0257:
    source_path: data/infofinland/content/information-about-finland/traffic-in-finland.html
    sha256: a4a073b158e6f6853ca04eba489c1b14f81f38e497275f3801ea209d57329f33
    source_block: b0074
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(17) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Utländskt körkort i Finland
    source_range:
      start: 0
      end: 235
    range_basis: normalized_html_block
    extracted_passage: Texten på körkortet ska vara skriven med latinska bokstäver eller så ska du
      ha med dig en översättning av körkortet till finska, svenska eller engelska. Du måste också
      uppfylla de ålders- och hälsokrav för körkort som gäller i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0258:
    source_path: data/infofinland/content/information-about-finland/traffic-in-finland.html
    sha256: a4a073b158e6f6853ca04eba489c1b14f81f38e497275f3801ea209d57329f33
    source_block: b0075
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(17) > p:nth-of-type(4)
    source_kind: p
    source_role: content
    heading: Utländskt körkort i Finland
    source_range:
      start: 0
      end: 462
    range_basis: normalized_html_block
    extracted_passage: Om du har ett körkort som beviljats i ett EU- eller EES-land, kan du köra
      med detta kort i Finland så länge kortet är giltigt. Du kan du byta ut kortet mot ett finländskt
      körkort om du bor stadigvarande i Finland eller har studerat i Finland i minst sex månader.
      Ett körkort som ger rätt att framföra personbil måste bytas mot ett finskt körkort inom två
      år från att dess giltighetstid har gått ut. Om kortets giltighetstid gått ut behöver du ett
      läkarutlåtande.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0259:
    source_path: data/infofinland/content/information-about-finland/traffic-in-finland.html
    sha256: a4a073b158e6f6853ca04eba489c1b14f81f38e497275f3801ea209d57329f33
    source_block: b0076
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(17) > p:nth-of-type(5)
    source_kind: p
    source_role: content
    heading: Utländskt körkort i Finland
    source_range:
      start: 0
      end: 732
    range_basis: normalized_html_block
    extracted_passage: Om du har ett körkort som utfärdats i ett land utanför EU som är anslutet
      till Genève- eller Wienkonventionerna om vägtrafik, kan du köra med detta kort högst två år
      i Finland. Med ett körkort som utfärdats i Hongkong, Macao eller Taiwan får du likaså köra
      bil i högst två år. Du kan byta ditt utländska körkort mot ett finskt körkort när du bor stadigvarande
      i Finland. När du har flyttat till Finland och bor här stadigvarande har du två år på dig att
      byta ditt körkort mot ett finskt körkort. Ditt körkort måste vara giltigt vid den tidpunkt
      när du byter det. Du behöver också ett läkarutlåtande. Om du inte byter ut ditt kort i tid
      eller ditt kort inte längre gäller, måste du avlägga förarexamen (teori- och körprov) i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0260:
    source_path: data/infofinland/content/information-about-finland/traffic-in-finland.html
    sha256: a4a073b158e6f6853ca04eba489c1b14f81f38e497275f3801ea209d57329f33
    source_block: b0077
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(17) > p:nth-of-type(6)
    source_kind: p
    source_role: content
    heading: Utländskt körkort i Finland
    source_range:
      start: 0
      end: 319
    range_basis: normalized_html_block
    extracted_passage: Om du har ett körkort som utfärdats i ett land som inte är anslutet till Genève-
      eller Wienkonventionerna om vägtrafik, får du köra bil med detta körkort under ett års tid
      efter att ha blivit registrerad i befolkningsdatasystemet i Finland. Därefter måste du avlägga
      förarexamen i Finland om du vill fortsätta köra bil.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
