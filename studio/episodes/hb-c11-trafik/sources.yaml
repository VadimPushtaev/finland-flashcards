    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(43)
    source_kind: p
    source_role: content
    heading: Egen bil medför kostnader, men kan vara nödvändig i glesbygdsområden
    source_range:
      start: 0
      end: 258
    range_basis: normalized_html_block
    extracted_passage: När man kör med bil i trafiken måste man noggrant följa de trafikregler som
      gäller i Finland. Polisen övervakar bilisterna och ger böter om de bryter mot reglerna. Man
      får inte köra bil om man har druckit alkohol. Gränsvärdet för att få köra är 0,5 promille.
    normalization: whitespace_only
    repairs: []
    selection: Keep traffic enforcement and alcohol limit; omit unsafe approximation in glasses of
      alcohol.
  hb-c11-u0253:
    source_path: data/infofinland/content/information-about-finland/traffic-in-finland.html
    sha256: a4a073b158e6f6853ca04eba489c1b14f81f38e497275f3801ea209d57329f33
