    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(11) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Att köra bil i Finland
    source_range:
      start: 0
      end: 128
    range_basis: normalized_html_block
    extracted_passage: Om du har en bil måste du teckna en trafikförsäkring (liikennevakuutus). Trafikförsäkringen
      tecknar du hos ett försäkringsbolag.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0254:
    source_path: data/infofinland/content/information-about-finland/traffic-in-finland.html
    sha256: a4a073b158e6f6853ca04eba489c1b14f81f38e497275f3801ea209d57329f33
    source_block: b0033
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(11) > p:nth-of-type(3)
    source_kind: p
    source_role: content
    heading: Att köra bil i Finland
    source_range:
      start: 0
      end: 250
    range_basis: normalized_html_block
    extracted_passage: I Finland måste bilen besiktigas och registreras. Besiktningar görs på besiktningsstationer.
      Registreringen kan göras till exempel på besiktningsstationer, vid försäkringsbolag och hos
      bilhandlare. Du kan även registrera bilen på Traficoms webbplats.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0255:
    source_path: data/infofinland/content/information-about-finland/traffic-in-finland.html
