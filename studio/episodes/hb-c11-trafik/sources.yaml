    heading: Det är tryggt och enkelt att gå och cykla i Finland
    source_range:
      start: 0
      end: 373
    range_basis: normalized_html_block
    extracted_passage: I Finland är det vanligt att människor förflyttar sig korta sträckor till
      fots. Städerna är planerade så att det är tryggt att gå. Det finns övergångsställen med jämna
      mellanrum för fotgängare som ska korsa gatan, och ofta finns det också trafikljus. På landsbygden
      finns det inte så ofta trottoarer längs vägarna. Då ska fotgängare gå längs den vänstra kanten
      av körbanan.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0248:
    source_path: data/orientation/sv/laromedel/vardagen/fritid-och-resor.html
    sha256: 48f1a1f60ecbe5c4b1012aab726be930db7d3f966da1eeb1aa225b95210f6709
    source_block: b0052
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2)
      > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2)
      > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(1) > p:nth-of-type(34)
    source_kind: p
    source_role: content
    heading: Det är tryggt och enkelt att gå och cykla i Finland
    source_range:
      start: 0
      end: 354
    range_basis: normalized_html_block
    extracted_passage: Ett annat bra sätt att förflytta sig är med cykel. I Finland cyklar en del
      till jobbet eller skolan också på vintern. Endast små barn får cykla på trottoaren. Övriga
      cyklar på en separat cykelbana eller ett separat cykelfält. Om sådana saknas cyklar man på
      körbanan. När man cyklar ska man använda cykelhjälm, och när det är mörkt ska cykeln ha en
      lykta.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c11-u0249:
    source_path: data/orientation/sv/laromedel/vardagen/fritid-och-resor.html
