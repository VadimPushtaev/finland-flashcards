    heading: Kollektivtrafiken fungerar bra i synnerhet i de stora städerna
    source_range:
      start: 0
      end: 366
    range_basis: normalized_html_block
    extracted_passage: De största städerna i Finland har bra kollektivtrafik. Med kollektivtrafik
      avses bussar, lokaltåg, metro och spårvagn. Man kan köpa engångsbiljetter, seriebiljetter eller
      månadsbiljetter till kollektivtrafiken och använda den för att ta sig till jobbet eller skolan.
      I små städer och på landsbygden finns det färre kollektivtrafiklinjer och de trafikeras mer
      sällan.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
