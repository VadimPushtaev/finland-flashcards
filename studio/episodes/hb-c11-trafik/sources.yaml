    heading: Mellan städer kan man vanligtvis resa med tåg eller buss
    source_range:
      start: 0
      end: 116
    range_basis: normalized_html_block
    extracted_passage: I Finland kan man ta sig till de flesta ställen med buss, tåg, flyg eller
      båt. En del av trafiken går endast sällan.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
