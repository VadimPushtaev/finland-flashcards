      end: 315
    range_basis: normalized_html_block
    extracted_passage: 'Förutom i Finland finns det samer i Sverige, Norge och Ryssland. De talar
      flera olika samiska språk, varav tre används i Finland: nordsamiska, skoltsamiska och enaresamiska.
      Dagens samer är i huvudsak kristna, varav största delen hör till den evangelisk-lutherska kyrkan.
      Skolterna har traditionellt varit ortodoxa.'
