    range_basis: normalized_html_block
    extracted_passage: De finska romernas modersmål är vanligtvis finska, men omkring en tredjedel
      av dem har åtminstone nöjaktiga muntliga kunskaper i romani. Barnen kan få undervisning i romani
      i skolan. Språket är släkt med sanskrit och hindi. Romerna i Finland är kristna och hör vanligtvis
      till den evangelisk-lutherska kyrkan eller till en pingstförsamling.
