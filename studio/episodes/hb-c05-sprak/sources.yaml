    heading: I Finland bor många olika folkgrupper
    source_range:
      start: 0
      end: 293
    range_basis: normalized_html_block
    extracted_passage: Det finns också många olika minoriteter i Finland. En del minoriteter har
      ett gemensamt språk, medan andra förenas av sin kultur, sin religion eller sitt etniska ursprung.
      Enligt Finlands grundlag har alla minoriteter i Finland rätt att bevara och utveckla sitt eget
      språk och sin egen kultur.
    normalization: whitespace_only
    repairs: []
