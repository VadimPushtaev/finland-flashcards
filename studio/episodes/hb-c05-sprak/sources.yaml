    heading: I Finland talas två nationalspråk och många andra språk
    source_range:
      start: 0
      end: 483
    range_basis: normalized_html_block
    extracted_passage: I Finland finns det två nationalspråk, finska och svenska. Omkring 85 procent
      av finländarna hade år 2023 finska som modersmål. De svenskspråkiga i Finland utgjorde omkring
      fem procent av befolkningen. Enligt grundlagen har den finskspråkiga och den svenskspråkiga
      befolkningen lika rättigheter till kultur- och samhällstjänster på sitt eget språk. Det finns
      många olika dialekter av svenska och finska. På olika håll i Finland talar man alltså finska
      och svenska på lite olika sätt.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
