    range_basis: normalized_html_block
    extracted_passage: Sametinget är samernas representativa självstyrelseorgan i Finland. Sametingets
      viktigaste uppgift är att verkställa det självstyre i fråga om språket och kulturen som tryggas
      för det i grundlagen och att säkerställa att samernas ursprungskultur bevaras och utvecklas.
      Enligt lag ska Finlands myndigheter förhandla med sametinget om alla åtgärder som kan inverka
      på samernas ställning.
