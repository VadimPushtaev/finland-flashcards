    heading: Teckenspråkiga personer har rätt till tolkning
    source_range:
      start: 0
      end: 453
    range_basis: normalized_html_block
    extracted_passage: I Finland betraktas teckenspråkiga personer som en språklig minoritet. I Finland
      används två nationella teckenspråk, det finska och det finlandssvenska teckenspråket. Teckenspråkiga
      personer kan vara döva, hörande eller ha nedsatt hörsel. Uppskattningsvis 5 500 personer använder
      det finska teckenspråket som modersmål. Om en teckenspråkig person behöver en tolk när hen
      ska uträtta olika ärenden, har hen en lagstadgad rätt att få kostnadsfri tolkning.
