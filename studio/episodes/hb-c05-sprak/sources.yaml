    heading: Samerna och de samisktalande är en nordlig ursprungsbefolkning
    source_range:
      start: 0
      end: 645
    range_basis: normalized_html_block
    extracted_passage: Samerna är den enda erkända ursprungsbefolkningen inom Europeiska unionen.
      Ursprungsbefolkning avser en människogrupp med starka rötter i de områden som den traditionellt
      har befolkat och i naturen. Gruppen har sina egna språk, seder och traditioner. Som ursprungsbefolkning
      har samerna rätt att bevara och utveckla sitt språk och sin kultur samt de traditionella näringar
      som hör till den i Finland. Samernas traditionella näringar är renskötsel, fiske och jakt,
      samlande och hantverk. Numera bor största delen av samerna i städer och arbetar inom samma
      branscher som övriga invånare i Finland. År 2023 bodde det omkring 10 000 samer i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
