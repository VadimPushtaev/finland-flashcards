- id: story_structure
  decision: Group consecutive source sentences into the scenes below. Read every body sentence once in
    its exact original order, without added narration.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920×1080 at 24 fps. Chapter 5 burgundy panel #39252b, text #faf3e8, secondary #e2c8cf, highlight
    #dfbd82, separator #70515a. Liberation Sans 48/40, fixed bilingual panel and separate left foreground.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Display text 0.25 seconds before speech. Moderate local voice speed0.95; allow 1.5 seconds
    after each pair and2.2 seconds at scene endings. Longer pairs receive2.5 seconds. Measure full clips
    rather than truncating to target duration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Sajos behind trees.jpg by JIP continuously as decorative background, darkened 42%
    and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative zoom 1.06→1.219,
    140 seconds per motion cycle, starting in motion, with no sentence resets. Total cycles=3.9080357142857145.
    Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Use shared local Supertonic3/F1, sv,32steps,speed0.95,seed42,44100Hz mono PCM16. Record exact
    inputs and generated clip metrics. Pronunciation and overall mix await review in complete video; no
    separate listening approval gate.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Organic Meditations Three by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 967.288 seconds; prepared lossless stereo bed 547.125
    seconds. Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: foreground_selection
  decision: Relevant verified photographs and flags at meaningful topic boundaries, targeting at least
    50% measured body picture coverage. No inferred personal health, ethnicity, immigration or political
    status. Any generic illustration is explicitly described as such in provenance.
  status: proposed
  resolve_during: script
- id: closing
  decision: Source and media credit cards plus dedicated foreground attribution cards, 15 seconds each,
    over continuing background. Full URLs, licenses and adaptation details accompany the canonical MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction; no additions to spoken source or translated display.
  status: proposed
  resolve_during: script
