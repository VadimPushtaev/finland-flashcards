- id: opening
  decision: Exact unspoken bilingual source heading,3seconds; no added speech.
  status: proposed
  resolve_during: script
- id: story_structure
  decision: 'Every source sentence in stored order: household sorting/local variation,costs,each source
    material stream,hazardous/electronic/medicine returns,reuse/donation and container deposits. All conditions
    remain in the bilingual main text and are made explicit in relevant diagrams.'
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: '1920x1080/24fps; Liberation Sans48/40, stable right bilingual panel and fixed left foreground.
    Chapter palette: {''background'': ''#243c32'', ''text'': ''#faf3e8'', ''secondary'': ''#c5dfce'',
    ''highlight'': ''#e3c58c'', ''separator'': ''#4d7560''}. Use permitted44/36 or40/34 only if necessary;
    manually segment oversized pairs.'
  status: proposed
  resolve_during: script
- id: pace
  decision: Full measured local narration once per source sentence/list fragment,0.25second text lead,1.7second
    ordinary pauses and2.2seconds at source-paragraph boundaries; longer pairs2.5seconds.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Local Swedish Supertonic3/F1,32steps,speed0.95,seed42,44100HzmonoPCM16. Initial allocation2ONNXthreads;
    metrics record actual per-invocation settings and retained takes. Whole-video listening pending.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Individually authored source-specific pictures for almost every body slide. Actual object/place
    photographs where useful; original diagrams visualize only stated relationships. Inspect every picture;
    do not use irrelevant filler.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Recycling station Raksila Oulu 20081226.JPG by Estormiz continuously as decorative
    background, darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and
    15% relative zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets.
    Total cycles=4.044642857142857. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: music_selection
  decision: Use Comfortable Mystery 3 by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 66.534 seconds; prepared lossless stereo bed 566.250
    seconds. Repeat count 8, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: assets
- id: closing
  decision: Readable source/media credits and matching canonical sidecar,derived from this episode actual
    sources.yaml and media sources. No spoken credits.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception. Exact archived wording and current reviewed Russian remain unchanged. Record
    source typos/pronunciation diagnostics for whole-video review.
  status: proposed
  resolve_during: script
scenes:
- id: hb-c11-u0198
  description: Sortera dina sopor hemma innan du slänger dem i sopkärlet.
- id: hb-c11-u0199
  description: Anvisningarna för sorteringen skiljer sig något från varandra i olika delar av landet.
- id: hb-c11-u0200
  description: Sortera avfallet enligt material.
- id: hb-c11-u0201
  description: Lägg inte skräp, mat eller kemikaler i avloppet (WC:n).
- id: hb-c11-u0202
  description: Vid alla hus finns inte alltid samtliga insamlingskärl.
- id: hb-c11-u0203
  description: I Finland anser man att det är viktigt att människorna sparar på naturresurser och skyddar
    miljön.
- id: hb-c11-u0204
  description: Om människorna sorterar avfallet fel blir avfallshanteringen långsammare, vilket orsakar
    extra avgifter för samhället.
- id: hb-c11-u0205
  description: Bioavfall är bland annat matrester, fruktskal, kaffe- och tesump, äggskal, fiskrens och
    små ben.
- id: hb-c11-u0206
  description: I kartonginsamlingen sorteras matförpackningar av papp, papplådor och mjölk- och saftförpackningar.
- id: hb-c11-u0207
  description: Tidningar och tidskrifter, reklampapper, kuvert, böcker utan pärmar och vitt skrivarpapper
    slängs i pappersinsamlingen.
- id: hb-c11-u0208
  description: I plastinsamlingen kan till exempel askar, omslag, påsar och flaskor som använts till att
    förpacka livsmedel eller kosmetika slängas.
- id: hb-c11-u0209
  description: I glasinsamlingen slängs glasburkar och glasflaskor utan pant.
- id: hb-c11-u0210
  description: I metallinsamlingen slängs konservburkar, aluminiumformar och aluminiumfolie, hushållsartiklar
    av metall och små metallföremål som enkelt ryms i kärlet.
- id: hb-c11-u0211
  description: Blandavfall är allt avfall som inte kan sorteras i något av de andra kärlen.
- id: hb-c11-u0212
  description: Det är mycket viktigt att sortera farligt avfall separat.
- id: hb-c11-u0213
  description: Även el- och elektronikavfall, till exempel gamla hushållsmaskiner och datorer, ska sorteras
    separat.
- id: hb-c11-u0214
  description: Gamla läkemedel och mediciner ska föras till apoteket.
- id: hb-c11-u0215
  description: Man kan spara på miljön och resurserna också genom att ge bort eller sälja saker som man
    inte längre behöver.
- id: hb-c11-u0216
  description: För en stor del av de dryckesflaskor och dryckesburkar som säljs i affärerna betalas en
    pant.
