    heading: Flytten till Finland kan förändra de interna rollerna inom familjen
    source_range:
      start: 0
      end: 561
    range_basis: normalized_html_block
    extracted_passage: I det nya landet kan de interna rollerna inom familjen ibland förändras. Alla
      familjemedlemmarna går igenom samma saker i det nya landet, men var och en hanterar dem i sin
      egen takt. Barnen kanske anpassar sig snabbare än föräldrarna. När barnen hela tiden tar till
      sig nya värderingar och vanor kan det leda till spänningar och bråk i familjen. Det är viktigt
      att föräldrarna diskuterar med varandra och med barnen om dessa och de känslor som den nya
      omgivningen väcker. Med tiden är det möjligt att hitta ett sätt för alla familjemedlemmar att
      leva i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
