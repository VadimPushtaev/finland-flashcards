    heading: Flytten till Finland kan förändra de interna rollerna inom familjen
    source_range:
      start: 0
      end: 490
    range_basis: normalized_html_block
    extracted_passage: Också parförhållandet kan få överraskande utmaningar, när hela familjen ställs
      inför nya omständigheter. Mannens och kvinnans roller kan vara annorlunda i Finland än i det
      gamla hemlandet. Om den ena maken är född i Finland, har bott längre i Finland eller annars
      kan det nya språket bättre än den andra, kan hen hjälpa och stödja sin partner. Det är ändå
      viktigt att båda är aktiva och lär sig språket, så att den ena inte blir för beroende av den
      andra. Det stärker också parförhållandet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
