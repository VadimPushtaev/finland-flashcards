    range_basis: normalized_html_block
    extracted_passage: Ibland har en människa varit tvungen att flytta till ett nytt land på egen
      hand. Då har hen ingen välbekant och trygg familj eller släkt runt omkring sig. Det är vanligt
      att det tar tid för en människa att anpassa sig till stora förändringar både på ett personligt
      plan och inom familjen.
