    heading: Barns flerspråkighet är en rikedom
    source_range:
      start: 0
      end: 511
    range_basis: normalized_html_block
    extracted_passage: Forskning visar ändå att det är lättare för barn att lära sig ett nytt språk
      om de kan sitt modersmål bra. Modersmålet är människans känslospråk. Därför är det viktigt
      för växelverkan mellan föräldrarna och barnet att föräldrarna pratar med barnet på det språk
      som de själva kan bäst. Modersmålet är också en del av människans identitet och kultur. Alla
      barn har rätt att lära sig sitt eget språk och vara stolta över det. Att kunna sitt modersmål
      hjälper en också att hålla kontakten med släktingar och vänner.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
