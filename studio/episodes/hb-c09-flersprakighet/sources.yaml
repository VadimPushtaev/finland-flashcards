    heading: Barns flerspråkighet är en rikedom
    source_range:
      start: 0
      end: 416
    range_basis: normalized_html_block
    extracted_passage: När en familj flyttar till Finland är det viktigt att alla familjemedlemmar
      lär sig finska eller svenska. Det är viktigt att föräldrarna uppmuntrar barnet att prata finska
      eller svenska i skolan. Ibland kanske föräldrarna tänker att barnet lär sig finska eller svenska
      snabbare om hela familjen pratar det nya språket hemma. De kanske tänker att barnen inte har
      någon nytta av att kunna föräldrarnas språk i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
