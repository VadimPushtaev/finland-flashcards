    source_range:
      start: 0
      end: 339
    range_basis: normalized_html_block
    extracted_passage: När familjen flyttar till Finland är det bra om barnen snabbt kan börja i
      skolan eller småbarnspedagogik. Där lär barnet sig finska eller svenska och får kompisar i
      samma ålder. Under tiden som barnen är i småbarnspedagogik eller skolan har föräldrarna tid
      att arbeta, söka arbete, studera och sköta sina egna och familjens angelägenheter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
