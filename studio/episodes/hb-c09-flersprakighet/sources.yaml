    heading: Flytten till Finland kan förändra de interna rollerna inom familjen
    source_range:
      start: 0
      end: 452
    range_basis: normalized_html_block
    extracted_passage: När en familj flyttar till Finland från ett annat land måste familjemedlemmarna
      lära sig många nya saker om Finland och den nya omgivningen. Det är viktigt att föräldrarna
      känner till kulturen, värderingarna och samhället i Finland. Då vet de hur man i allmänhet
      gör i landet. Denna kunskap och förståelse hjälper familjen att må bra och integrera sig i
      det nya landet. Det är också lättare för föräldrarna att hjälpa sina barn att klara sig i Finland.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
