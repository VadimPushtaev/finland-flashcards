scenes:
- id: scene-1
  description: När en familj flyttar till Finland från ett annat land måste familjemedlemmarna lära sig
    många nya saker om Finland och den nya omgivningen.
- id: scene-2
  description: När familjen flyttar till Finland är det bra om barnen snabbt kan börja i skolan eller
    småbarnspedagogik.
- id: scene-3
  description: I det nya landet kan de interna rollerna inom familjen ibland förändras.
- id: scene-4
  description: Också parförhållandet kan få överraskande utmaningar, när hela familjen ställs inför nya
    omständigheter.
- id: scene-5
  description: Ibland har en människa varit tvungen att flytta till ett nytt land på egen hand.
- id: scene-6
  description: När en familj flyttar till Finland är det viktigt att alla familjemedlemmar lär sig finska
    eller svenska.
- id: scene-7
  description: Forskning visar ändå att det är lättare för barn att lära sig ett nytt språk om de kan
    sitt modersmål bra.
- id: scene-8
  description: I en familj kan man använda många olika språk.
- id: scene-9
  description: Enligt Finlands grundlag har alla som bor i Finland rätt att bevara och utveckla sitt språk
    och sin kultur.
