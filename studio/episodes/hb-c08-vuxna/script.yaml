- sentence_id: hb-c08-u0144-s002
  sv: Inom den grundläggande utbildningen studerar till exempel 17–25-åriga nyanlända som på grund av
    sin ålder inte längre kan delta i undervisning som ordnas för barn och unga men som behöver ett avgångsbetyg
    för den grundläggande utbildningen och studiefärdigheter för att kunna fortsätta studera på andra
    stadiet.
  ru: Основное общее образование получают, например, недавно приехавшие люди в возрасте 17–25 лет, которые
    из-за своего возраста уже не могут участвовать в обучении для детей и подростков, но которым нужны
    свидетельство об основном общем образовании и учебные навыки для продолжения учёбы на второй ступени.
  scene_id: hb-c08-u0144
  visual_cue: 'Source-specific pictorial composition path: 17–25-åriga / andra stadiet. Only the archived
