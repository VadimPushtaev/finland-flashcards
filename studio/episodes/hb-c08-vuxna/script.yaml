- sentence_id: hb-c08-u0145-s001
  sv: En annan viktig grupp som studerar inom den grundläggande utbildningen för vuxna är invandrade vuxna
    som på grund en svag grundutbildning behöver undervisning i särskilt läs- och skrivkunnighet, finska
    eller svenska och engelska samt matematik, eller som behöver ett avgångsbetyg för fortsatta studier.
  ru: Ещё одна важная группа учащихся основного общего образования для взрослых — взрослые иммигранты,
    которым из-за слабой базовой подготовки необходимо обучение прежде всего чтению и письму, финскому
    или шведскому, английскому языку и математике либо свидетельство об окончании школы для дальнейшего
    обучения.
