scenes:
- id: hb-c08-u0143
  description: Många vuxengymnasier, medborgarinstitut och folkhögskolor erbjuder grundläggande utbildning
    för vuxna.
- id: hb-c08-u0144
  description: Den grundläggande utbildningen för vuxna är avsedd särskilt för unga och vuxna som flyttat
    till Finland och som inte gått ut grundskolan, som endast gått lite i skolan eller vars avklarade
    grundskolestudier inte kan jämföras med studierna i Finland.
- id: hb-c08-u0145
  description: En annan viktig grupp som studerar inom den grundläggande utbildningen för vuxna är invandrade
    vuxna som på grund en svag grundutbildning behöver undervisning i särskilt läs- och skrivkunnighet,
    finska eller svenska och engelska samt matematik, eller som behöver ett avgångsbetyg för fortsatta
    studier.
- id: hb-c08-u0146
  description: Utbildningsstyrelsen har utfärdat egna grunder för läroplanen för den grundläggande utbildningen
    för vuxna.
- id: hb-c08-u0147
  description: I slutskedet studerar man över tio olika läroämnen.
- id: hb-c08-u0148
  description: Vem som helst som har avlagt den grundläggande utbildningens lärokurs eller en motsvarande
    lärokurs kan söka till en gymnasieutbildning för vuxna.
- id: hb-c08-u0149
  description: Gymnasieutbildning för vuxna ger färdigheter för fortsatta studier vid universitet och
    yrkeshögskolor och inom yrkesutbildning som baserar sig på gymnasiets lärokurs.
- id: hb-c08-u0150
  description: Vid ett vuxengymnasium kan man avlägga gymnasiets hela lärokurs och studentexamen.
- id: hb-c08-u0151
  description: Vid vuxengymnasier följs grunderna för läroplanen för gymnasieutbildning för vuxna.
- id: hb-c08-u0152
  description: Yrkesexamen och specialyrkesexamen är avsedda för personer som genom arbete eller hobbyer
    redan har skaffat sig yrkeskunskaper inom branschen i fråga, eller som vill utveckla sin kompetens.
- id: hb-c08-u0153
  description: Den studerande kan avlägga sin examen genom prov och är inte tvungen att delta i utbildningen.
- id: hb-c08-u0154
  description: Vid alla yrkeshögskolor finns också en öppen yrkeshögskola och vid universiteten ett öppet
    universitet.
- id: hb-c08-u0155
  description: Inom vissa områden kan man via en separat ansökan bli antagen för att avlägga en hel examen
    vid ett universitet eller en yrkeshögskola, om man först har avlagt en viss mängd studier inom området
    vid ett öppet universitet eller en öppen yrkeshögskola.
- id: hb-c08-u0156
  description: För vuxna i Finland finns det utöver yrkesinriktade studier och högskolestudier också ett
    stort utbud av studier inom det fria bildningsarbetet vid medborgarinstitut, folkhögskolor, studiecentraler
    och sommaruniversitet.
- id: hb-c08-u0157
  description: Med fritt bildningsarbete avses studier som vanligtvis inte leder till någon examen.
- id: hb-c08-u0158
  description: En del läroanstalter inom det fria bildningsarbetet erbjuder också kompletterande utbildning
    för arbetslivet, öppna universitetsstudier och föreläsningar för allmänheten.
- id: hb-c08-u0159
  description: Sysselsättningstjänsterna erbjuder arbetskraftsutbildning för personer i arbetsför ålder
    som är arbetslösa eller riskerar att bli arbetslösa.
- id: hb-c08-u0160
  description: Arbetskraftsutbildningar är utbildningar som ökar yrkeskompetensen, yrkesfärdigheterna
    och företagarfärdigheterna.
- id: hb-c08-u0161
  description: Yrkesutbildningar är grundexamen, yrkesexamen och specialyrkesexamen.
- id: hb-c08-u0162
  description: I vissa situationer kan studierna vid dessa läroanstalter dock vara kostnadsfria.
