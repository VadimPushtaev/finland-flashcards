- sentence_id: hb-c08-u0144-s001
  sv: Den grundläggande utbildningen för vuxna är avsedd särskilt för unga och vuxna som flyttat till
    Finland och som inte gått ut grundskolan, som endast gått lite i skolan eller vars avklarade grundskolestudier
    inte kan jämföras med studierna i Finland.
  ru: Основное общее образование для взрослых предназначено прежде всего для переехавших в Финляндию молодых
    людей и взрослых, которые не окончили общеобразовательную школу, мало учились в школе или получили
    школьное образование, несопоставимое с образованием в Финляндии.
  scene_id: hb-c08-u0144
