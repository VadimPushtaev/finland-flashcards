    range_basis: normalized_html_block
    extracted_passage: Ett brott är en förbjuden handling som man enligt lagen får ett straff för.
      Också försummelse, det vill säga att låta bli att göra något, kan vara ett brott, likaså att
      uppvigla någon annan till ett brott. Ibland är redan ett försök till brott ett brott, som kan
      ge ett straff.
    normalization: whitespace_only
