    range_basis: normalized_html_block
    extracted_passage: I Finland är alla skyldiga att meddela till polisen om man vet att någon planerar
      ett brott. Då kan brottet ännu förhindras. Anmälningsskyldigheten gäller allvarliga brott,
      till exempel brott mot liv, våldtäkt, misshandel och rån. Närstående familjemedlemmar till
      en person som planerar ett brott har inte anmälningsskyldighet.
    normalization: whitespace_only
    repairs: []
