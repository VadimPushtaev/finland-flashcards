      end: 306
    range_basis: normalized_html_block
    extracted_passage: 'Skadegörelse: Man får inte skada eller förstöra någon annans egendom. Om
      en människa orsakar skada på någon annans egendom, är hen ersättningsskyldig. Det betyder att
      hen måste betala för skadorna. Om gärningsmannen inte betalar för skadorna, kan en myndighet
      dra av skadeersättningarna direkt på hens lön.'
    normalization: whitespace_only
    repairs: []
