      verksamheten är att främja barnets utveckling och lärande. Barnet lär sig även sociala färdigheter.
      Barnet får stöd i att lära sig det finska eller svenska språket, om hans/hennes modersmål är
      ett annat språk. Om barnet behöver, kan hen även få specialundervisning.
