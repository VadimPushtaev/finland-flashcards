scenes:
- id: hb-c08-u0193
  description: Småbarnspedagogik är avsedd för barn under skolåldern.
- id: hb-c08-u0014
  description: Småbarnspedagogik är fostran, undervisning och omsorg som är pedagogiskt planerad och som
    har noga genomtänkta mål.
- id: hb-c08-u0015
  description: I Finland har ett barn rätt till småbarnspedagogik från början av den månad då barnet fyller
    nio månader.
- id: hb-c08-u0016
  description: Familjedagvård innebär att skötaren vårdar barnen i sitt eget hem.
- id: hb-c08-u0017
  description: Avgiften för småbarnspedagogik (varhaiskasvatusmaksu) beror på
- id: hb-c08-u0018
  description: familjens inkomster
- id: hb-c08-u0020
  description: familjens storlek och
- id: hb-c08-u0021
  description: på hur många timmar per vecka barnet deltar i småbarnspedagogik.
- id: hb-c08-u0022
  description: Man får syskonrabatt.
- id: hb-c08-u0023
  description: Du kan också leta upp en privat familjedagvårdare som vårdar barnen hemma hos sig, eller
    anställa en skötare i ditt eget hem.
- id: hb-c08-u0024
  description: Kommunen övervakar den privata småbarnspedagogiken.
- id: hb-c08-u0025
  description: Priserna för den privata småbarnspedagogiken varierar.
- id: hb-c08-u0194
  description: Om barnet har en hemkommun i Finland , kan du ansöka om stöd för privat vård hos FPA.
- id: hb-c08-u0195
  description: Du kan ansöka om privatvårdsstöd (yksityisen hoidon tuki), om
- id: hb-c08-u0196
  description: ditt barn som är under skolåldern är i privat dagvård, eller
- id: hb-c08-u0198
  description: barnet har någon annan privat skötare.
- id: hb-c08-u0199
  description: Du kan inte ansöka om privatvårdsstöd om skötaren är en medlem i barnets familj eller om
    barnet och skötaren bor i samma hushåll.
- id: hb-c08-u0200
  description: Stödets storlek beror bland annat på familjens inkomster och kommunen som familjen bor
    i.
- id: hb-c08-u0201
  description: FPA betalar stödet direkt till skötaren eller producenten av småbarnspedagogik.
- id: hb-c08-u0026
  description: Till småbarnspedagogiken hör mångsidig verksamhet, till exempel lekar, motion, utevistelse,
    musik, pyssel och utfärder.
- id: hb-c08-u0027
  description: Daghemmet är ändå inte en skola.
- id: hb-c08-u0028
  description: 'Barnen äter tre måltider under dagen: frukost, lunch och mellanmål.'
- id: hb-c08-u0029
  description: I småbarnspedagogiken beaktas familjens religion eller livsåskådning.
- id: hb-c08-u0030
  description: Vanligen börjar dagen på daghemmet på morgonen och slutar på eftermiddagen.
