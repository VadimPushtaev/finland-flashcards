  resolve_during: script
- id: visual_motion
  decision: Use File:Oulu Cemetery 20121103.JPG by Estormiz continuously as decorative background, darkened42%
    and blurred2.5px. Smooth cyclic diagonal pan(0.15,0.15)→(0.85,0.85) and15%relative zoom1.06→1.219,140seconds
    per motion cycle, starting in motion, with no sentence resets. Total cycles=0.5616071428571429. Foreground
    and bilingual text remain fixed.
  status: proposed
  resolve_during: script
- id: voice_selection
  decision: Use series local Supertonic3/F1, Swedish,32steps,speed0.95,seed42,44100Hz mono PCM16. Exact
    inputs and checksums retained. Numbers and abbreviations have separately recorded speech-only expansions;
    pronunciation awaits whole-video review.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Winter Reflections by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s
    distinct instrumental track. Original master 142.054 seconds; prepared lossless stereo bed 78.625
    seconds. Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2
    dB music adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution
    accompanies the video.
  status: proposed
  resolve_during: script
- id: foreground_selection
  decision: Use selected exact source words and dates as complete typography cards. Cards add no claims
    and retain source qualifiers in the full text. Leave foreground empty elsewhere; suppress orphaned/redundant
    image captions.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two15second source/media credit cards; complete attribution accompanies exported MP4.
  status: proposed
  resolve_during: script
- id: exceptions
  decision: No exception to shared direction. All creative choices are proposals for whole-video user
    review.
  status: proposed
  resolve_during: script
