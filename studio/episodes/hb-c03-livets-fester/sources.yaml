      end: 2811
    range_basis: raw_pdf_page
    extracted_passage: "Till människans levnadslopp hör också många viktiga fester som inte är beroende\
      \ av kalendern och \nsom släkt, familj och vänner firar tillsammans. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0154:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 2924
      end: 2987
    range_basis: raw_pdf_page
    extracted_passage: "Vid dopet får \nbarnet ett namn och blir en del av församlingen."
    normalization: whitespace_only
    repairs: []
    selection: Complete baptism explanation after omitted undated70% statistic.
  hb-c03-u0094:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 39
      end: 336
    range_basis: raw_pdf_page
    extracted_passage: "Föräldrar som inte hör till kyrkan kan välja att ordna en namngivningsfest\
      \ i stället, där familj och \nsläktingar samlas för att fira det lilla barnet. Dopet eller\
      \ namngivningsfesten ordnas hemma eller i \nkyrkan eller i någon annan festlokal och de närmaste\
      \ släktingarna och vännerna bjuds in.    \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0095:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 336
      end: 634
    range_basis: raw_pdf_page
    extracted_passage: "Två faddrar utses åt barnet bland vännerna eller släktingarna. Ursprungligen\
      \ var fadderns uppgift att \nvara en slags andlig förälder åt barnet och sköta om barnets kristna\
      \ fostran. I dag tänker man mera att \nbarnet är en särskilt viktig människa i fadderns liv\
      \ och faddern följer barnets uppväxt. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0096:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 675
      end: 1237
    range_basis: raw_pdf_page
    extracted_passage: "I Finland kan barn konfirmera sig det år de fyller 15. Konfirmationen är\
      \ en ceremoni som hålls i \nkyrkan. Där bekräftas den ungas kristna tro och medlemskapet i\
      \ församlingen. Konfirmationen \nföregås av en skriftskola som innehåller religionsundervisning\
      \ och som nuförtiden ofta hålls i form \nav ett sommarläger. En stor del av de unga deltar\
      \ i skriftskollägret och konfirmationen för att det är \nroligt på lägret, för att föräldrarna\
      \ förväntar sig att barnen ska göra det och för att det efter \nkonfirmationen ordnas en fest\
      \ hemma där den unga får presenter.   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0097:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 1237
      end: 1494
    range_basis: raw_pdf_page
    extracted_passage: "En del unga deltar vid samma ålder i ett Prometheus-läger som är ett religiöst\
      \ och politiskt obundet \nlivssynsläger. Lägrets syfte är att uppmuntra de unga till att utveckla\
      \ sin egen livssyn. Efter lägret \nhålls en fest hemma där den unga får presenter.   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0098:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 1511
      end: 1984
    range_basis: raw_pdf_page
    extracted_passage: "När en ung människa gått igenom gymnasiet och klarat studentskrivningarna\
      \ får hon avgångsbetyg \nfrån gymnasiet och ett studentbetyg. Med betyget kan hon ansöka om\
      \ studieplats vid ett universitet \neller en högskola. Studentexamen firas både i skolan och\
      \ hemma hos studenten. I skolan får den unga \nsitt betyg och en studentmössa. Hemma väntar\
      \ en kaffebjudning och presenter. Släktingar och vänner \när inbjudna. De som utexamineras\
      \ från yrkesskolor firar likadana fester.   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0099:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 2629
      end: 2943
    range_basis: raw_pdf_page
    extracted_passage: "I Finland firas framför allt barns födelsedagar. Barnen kan bjuda in sina\
      \ kompisar på kalas. Många \nfirar också med familj, släktingar och faddrar. På kalasen leker\
      \ man, äter kaka och ger presenter. \nÄven vuxna kan ordna kalas för att fira sin födelsedag,\
      \ särskilt när de fyller jämna år som 50, 60 eller \n70.    \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0100:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 2957
      end: 3487
    range_basis: raw_pdf_page
    extracted_passage: "När en människa dör ordnar släktingarna begravning i en kyrka, ett kapell\
      \ eller någon annan lokal. \nTill begravningen kommer familj och släktingar, den dödas vänner\
      \ och ibland också arbetskamrater. \nEfter den kyrkliga förrättningen samlas begravningsföljet\
      \ till en minnesstund där man äter och dricker \nkaffe och minns den avlidne, alltså den som\
      \ dött. I Finland kan begravningen ordnas enligt den \nreligion som den avlidne hörde till.\
      \ Begravningen kan också vara sekulär, om den avlidne inte hörde \ntill något religiöst samfund. "
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0155:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 2088
      end: 2615
    range_basis: raw_pdf_page
    extracted_passage: "Vid vigseln \när ofta släktingar och vänner närvarande. Många ordnar en bröllopsfest\
      \ efteråt där man äter, dansar \noch firar brudparet med olika programnummer. Till programmet\
      \ hör ofta tal, lekar och uppträdanden. \nBrudparet får presenter. Bröllop är privata tillställningar\
      \ dit man kan gå bara om man är bjuden. \nEftersom det bjuds mat och dryck på bröllopsfesten\
      \ kan det bli väldigt dyrt att ordna bröllop. Därför \nbjuder de flesta inte alla sina bekanta\
      \ till bröllopet. Många par åker på bröllopsresa efter \nbröllopsfesten. \n"
    normalization: whitespace_only
    repairs: []
    selection: Preserve additional cultural explanation; complete contiguous sentences, omit only
      neighbouring undated statistic or duplicate narrative.
