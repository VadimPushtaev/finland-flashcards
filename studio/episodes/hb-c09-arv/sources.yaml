    heading: En bouppteckning är en förteckning över den avlidnes förmögenhet och skulder samt arvingar
    source_range:
      start: 0
      end: 428
    range_basis: normalized_html_block
    extracted_passage: Vid bouppteckningen gör man upp en förteckning över den avlidnes egendom,
      det vill säga dödsboet. Förteckningen över den avlidnes egendom kallas för en bouppteckningshandling.
      Handlingen kan upprättas av en anställd person, till exempel en advokat, eller någon av arvingarna.
      I bouppteckningshandlingen antecknas den avlidnes förmögenhet och skulder, uppgifter om hens
      arvingar och innehållet i testamentet, om ett sådant finns.
    normalization: whitespace_only
