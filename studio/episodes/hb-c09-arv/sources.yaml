    heading: En bouppteckning är en förteckning över den avlidnes förmögenhet och skulder samt arvingar
    source_range:
      start: 0
      end: 326
    range_basis: normalized_html_block
    extracted_passage: När ett arv delas ordnas en bouppteckning. En bouppteckning är en tillställning
      där man utreder den avlidnes tillgångar och skulder. Tillställningen ordnas vanligtvis av den
      avlidnes änka eller änkling eller barn. Den måste ordnas inom tre månader efter dödsfallet
      och samtliga av den avlidnes arvingar ska bjudas in till den.
    normalization: whitespace_only
    repairs: []
