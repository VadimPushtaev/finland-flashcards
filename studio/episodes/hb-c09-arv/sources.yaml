    heading: Testamente
    source_range:
      start: 0
      end: 466
    range_basis: normalized_html_block
    extracted_passage: Vem som ärver egendom efter en avliden person fastställs i lagen. Du kan även
      själv påverka till vilka personer din egendom fördelas. Du kan skriva ett testamente, som är
      en skriftlig redogörelse över vem som ärver dina ägodelar efter din bortgång. Ett testamente
      ska innehålla vissa punkter och det ska alltid undertecknas av två ojäviga vittnen. Annars
      är testamentet inte legitimt. Det är alltså tillrådligt att ta hjälp av en jurist när du ska
      skriva testamente.
    normalization: whitespace_only
