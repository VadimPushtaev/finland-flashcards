    source_range:
      start: 155
      end: 467
    range_basis: normalized_html_block
    extracted_passage: I Finland finns det två arvsskatteklasser. Den avlidnes närmaste släktingar,
      till exempel barn, barnbarn och make eller maka, betalar mindre skatt på sina respektive arv.
      Om arvingen är mer avlägset släkt eller inte alls släkt med den avlidne, är skatten högre.
      Skatteprocenten är också högre ju större arvet är.
