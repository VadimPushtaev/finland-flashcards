    range_basis: normalized_html_block
    extracted_passage: I Finland har det funnits lika arvsrätt sedan år 1878. Lika arvsrätt betyder
      att kvinnor och män har samma rätt till arv. Om en avliden person inte har några arvingar och
      inte har upprättat något testamente, går hens egendom till staten.
