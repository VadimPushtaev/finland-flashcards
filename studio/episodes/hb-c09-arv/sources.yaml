    range_basis: normalized_html_block
    extracted_passage: Före sin död kan en människa också upprätta ett testamente, där hen förordnar
      hur hens egendom ska delas. Finlands lag förskriver ändå att den avlidnes barn har rätt till
      åtminstone hälften av det belopp som de enligt lag skulle få om det inte fanns något testamente.
      Detta är fallet även om den avlidne genom testamente skulle förordna sin egendom till någon
      annan.
    normalization: whitespace_only
