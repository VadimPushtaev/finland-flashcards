scenes:
- id: scene-1
  description: När en människa avlider, lämnar hen ofta efter sig egendom, till exempel pengar eller en
    bostad.
- id: scene-2
  description: Före sin död kan en människa också upprätta ett testamente, där hen förordnar hur hens
    egendom ska delas.
- id: scene-3
  description: I Finland har det funnits lika arvsrätt sedan år 1878.
- id: scene-4
  description: När ett arv delas ordnas en bouppteckning.
- id: scene-5
  description: Vid bouppteckningen gör man upp en förteckning över den avlidnes egendom, det vill säga
    dödsboet.
- id: scene-6
  description: Arvingarna ansvarar inte för skulder som den avlidne lämnar efter sig, så länge som skulderna
    är korrekt antecknade i bouppteckningen.
- id: scene-7
  description: Vem som ärver egendom efter en avliden person fastställs i lagen.
- id: scene-8
  description: I Finland finns det två arvsskatteklasser.
