    range_basis: normalized_html_block
    extracted_passage: Om en gärningsman är en ung person i åldern 15–17 år kan rätten utdöma ett
      ungdomsstraff till hen. Syftet med det är att hindra den unga från att begå nya brott eller
      bli socialt utslagen. Ett ungdomsstraff kan vara till exempel övervakat oavlönat arbete eller
      deltagande i olika program som främjar den ungas förmåga att agera i sociala situationer.
    normalization: whitespace_only
