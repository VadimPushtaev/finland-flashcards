      end: 423
    range_basis: normalized_html_block
    extracted_passage: Barn under 15 år är inte straffrättsligt ansvariga i Finland. Om de begår
      ett brott, ställs de inte inför rätta. De har ändå ersättningsansvar, det vill säga de måste
      ersätta skadorna de orsakat. Skador som måste ersättas kan vara till exempel sönderslagen egendom,
      eller skada eller lidande som orsakats en annan människa. Ofta betalar barnet i praktiken ersättningen
      först i vuxen ålder när hen börjar få arbetsinkomster.
    normalization: whitespace_only
