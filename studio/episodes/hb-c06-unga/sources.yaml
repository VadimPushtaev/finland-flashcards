    range_basis: normalized_html_block
    extracted_passage: Om ett barn under 15 år begår ett brott, görs en barnskyddsanmälan om hen.
      En barnskyddsanmälan innebär en anmälan till de sociala myndigheterna. De sociala myndigheterna
      utreder barnets situation och tar reda på hur de kan hjälpa hen. I de allvarligaste fallen
      kan barnet omhändertas och till exempel placeras på en sluten anstalt, om det är nödvändigt
      med tanke på hens egen och andras säkerhet.
    normalization: whitespace_only
