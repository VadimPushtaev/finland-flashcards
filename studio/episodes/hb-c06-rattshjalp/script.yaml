- id: story_structure
  decision: Consecutive source-based scenes below; each body sentence/list fragment read once in frozen
    order. No added transitions.
  status: proposed
  resolve_during: script
- id: text_and_layout
  decision: 1920x1080 at24fps, Chapter6 indigo palette, Liberation Sans48/40 with fixed right bilingual
    panel and separate left pictorial foreground. Inspect long pairs, split manually if necessary; never
    below40/34.
  status: proposed
  resolve_during: script
- id: pace
  decision: Show pairs0.25seconds before speech; allow1.5seconds after each,2.2seconds at topic boundaries
    and2.5seconds after long pairs; use measured narration.
  status: proposed
  resolve_during: script
- id: visual_motion
  decision: Use File:Tampereen käräjäoikeus.jpg by Stefan Flöper continuously as decorative background,
    darkened 42% and blurred 2.5 px. Smooth cyclic diagonal pan (0.15,0.15)→(0.85,0.85) and 15% relative
    zoom 1.06→1.219, 140 seconds per motion cycle, starting in motion, with no sentence resets. Total
    cycles=1.0601190476190478. Foreground and bilingual text remain fixed.
  status: proposed
  resolve_during: assets
- id: voice_selection
  decision: Use shared local Supertonic 3 / F1, Swedish, 32 steps, speed 0.95, seed 42, 44,100 Hz mono
    PCM16. These clips use one ONNX intra-op thread under the shared production budget; metrics record
    actual settings and separate seed invocations. Pronunciation and overall mix await complete-video
    listening.
  status: proposed
  resolve_during: script
- id: music_selection
  decision: Use Water Prelude by Kevin MacLeod (incompetech.com), CC BY 4.0, as this subchapter’s distinct
    instrumental track. Original master 324.911 seconds; prepared lossless stereo bed 148.417 seconds.
    Repeat count 0, using 4-second equal-power crossfades when needed. Retain the accepted +2 dB music
    adjustment, ducking under speech, 2-second fade-in and 3-second fade-out. Full attribution accompanies
    the video.
  status: proposed
  resolve_during: assets
- id: foreground_pictures
  decision: Relevant non-graphic photographs and original pictorial diagrams of source relationships.
    Every planned body pair has contextual illustration; verify measured>=50percent and relevance. People
    icons represent generic roles, never actual victims or accused persons.
  status: proposed
  resolve_during: script
