- sentence_id: hb-c06-u0121-s003
  sv: Rättshjälpen kan vara till exempel en advokat eller ett allmänt rättsbiträde vid en rättegång, juridisk
    rådgivning, hjälp vid förlikningsförhandlingar och uppgörande av olika dokument, avtal eller klagomål.
  ru: Юридическая помощь может включать, например, услуги адвоката или государственного юридического помощника
    в судебном процессе, юридические консультации, помощь в переговорах о примирении и составление различных
    документов, договоров или жалоб.
  scene_id: aid
