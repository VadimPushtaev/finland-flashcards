    extracted_passage: I Finland har alla rätt till rättshjälp om de har juridiska problem. Staten
      hjälper mindre bemedlade vars inkomster inte räcker till för att betala till exempel advokatarvoden.
      Rättshjälpen kan vara till exempel en advokat eller ett allmänt rättsbiträde vid en rättegång,
      juridisk rådgivning, hjälp vid förlikningsförhandlingar och uppgörande av olika dokument, avtal
      eller klagomål. Om en person behöver offentlig rättshjälp, ska hen ansöka om det hos en rättshjälpsbyrå.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
