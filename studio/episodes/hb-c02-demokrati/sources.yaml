    printed_page: 125
    source_range:
      start: 3243
      end: 3509
    range_basis: raw_pdf_page
    extracted_passage: "I Finland förekom både höger- och vänsterextremism. På grund av extremhögerns\
      \ påtryckningar \nförbjöds kommunistisk verksamhet i lag år 1930. Därför verkade de finländska\
      \ kommunisterna i \nhemlighet. En del av dem försökte organisera sig för en ny arbetarrevolution.\
      \ \n"
    normalization: whitespace_only
    repairs: []
