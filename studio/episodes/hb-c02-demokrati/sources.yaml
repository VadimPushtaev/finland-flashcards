    range_basis: normalized_html_block
    extracted_passage: Efter inbördeskriget år 1918 var folket djupt splittrat, även om inte alla
      varit anhängare av antingen de röda eller de vita under kriget. Kriget påverkade livet på olika
      sätt på olika håll i landet beroende på hur stort understöd de röda eller de vita hade haft
      på orten i fråga. Till exempel Tammerfors var en starkt röd stad och drabbades särskilt hårt
      av kriget.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
