    heading: Efter inbördeskriget fortsatte utvecklingen av det finländska samhället
    source_range:
      start: 0
      end: 435
    range_basis: normalized_html_block
    extracted_passage: Det politiska samarbetet mellan de olika parterna var inte enkelt, men i arbetet
      i de demokratiska institutionerna var man tvungen att lära sig att göra kompromisser. Det gemensamma
      beslutsfattandet underlättades också av de politiska mittengrupperingarna, som hade mer moderata
      ståndpunkter än den strikta höger- eller vänsterpolitiken. Samtidigt ökade tilliten till att
      det var möjligt att göra förändringar på ett demokratiskt sätt.
    normalization: whitespace_only
    repairs: []
