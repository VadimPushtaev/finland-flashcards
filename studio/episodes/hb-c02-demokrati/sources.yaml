    heading: Efter inbördeskriget fortsatte utvecklingen av det finländska samhället
    source_range:
      start: 0
      end: 445
    range_basis: normalized_html_block
    extracted_passage: Efter kriget genomfördes många reformer inom politiken i syfte att förbättra
      de fattigas ställning. Till exempel lagarna om läroplikt och progressiv beskattning stiftades
      under den här tiden. Stabiliteten i samhället förbättrades också av att man kunde utveckla
      Finland utifrån de reformer som genomförts redan tidigare. Dessa var bland annat allmän och
      lika rösträtt och arbetstidslagen om åtta timmars arbetsdag som hade trätt i kraft år 1917.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
