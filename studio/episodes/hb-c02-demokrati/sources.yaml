    heading: Efter inbördeskriget fortsatte utvecklingen av det finländska samhället
    source_range:
      start: 0
      end: 523
    range_basis: normalized_html_block
    extracted_passage: På 1930-talet drabbades hela världen av en svår ekonomisk depression, då det
      blev brist på allt, också mat. Ländernas ekonomi försvagades kraftigt och arbetslösheten ökade.
      Extremhögern fick makt i många länder, eftersom den lovade att lyfta Europa ur depressionen.
      Extremhögerns anhängare motsatte sig demokrati och ville ha en stark ledare för staten. Efter
      depressionen förbättrades levnadsförhållandena mycket, men flera europeiska länder hade blivit
      diktaturer ledda av extremhögern. Finland förblev ändå en demokrati.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0045:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
