    source_range:
      start: 0
      end: 433
    range_basis: normalized_html_block
    extracted_passage: Parterna i kriget var länge misstänksamma mot varandra. De röda var i egenskap
      av förlorare bittra över att krigets händelser ofta beskrevs ur de vitas synvinkel när de diskuterades
      i offentligheten. De vita ansåg att de stred för Finlands frihet och självständighet. Enligt
      de röda hade det varit fråga om ett klasskrig, där den fattiga samhällsklassen försökte få
      en jämlik ställning med dem som hade det bättre ställt i samhället.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
