scenes:
- id: scene-1
  description: Du kan gå på graviditetsledighet 14–30 vardagar före det beräknade förlossningsdatumet.
- id: scene-2
  description: 'Du kan få graviditetspenning om följande villkor uppfylls:'
- id: scene-3
  description: Du är den förälder som ska föda barnet och graviditeten har varat i 154 dagar.
- id: scene-4
  description: Du är borta från ditt arbete.
- id: scene-5
  description: Du har rätt till FPA:s stöd.
- id: scene-6
  description: Du kan få graviditetspenning också om du är studerande eller arbetslös.
- id: scene-7
  description: Efter graviditetspenningperioden kan du vara föräldraledig och få föräldrapenning.
- id: scene-8
  description: 'Du kan få föräldrapenning från FPA om följande villkor uppfylls:'
- id: scene-9
  description: Du vårdar ett barn som är under två år eller ett adoptivbarn som tagits i vård för mindre
    än två år sedan hemma.
- id: scene-10
  description: Du arbetar inte.
- id: scene-11
  description: Du har rätt till FPA:s stöd.
- id: scene-12
  description: Om du är den förälder som ska föda barnet kan du få föräldrapenning direkt efter att graviditetspenningperioden
    har upphört, även om barnet inte skulle ha fötts ännu.
- id: scene-13
  description: Om du är den förälder som inte ska föda barnet kan du inleda föräldrapenningperioden så
    fort barnet har fötts.
- id: scene-14
  description: Föräldrarna kan få föräldrapenning för sammanlagt 320 vardagar, alltså ungefär 13 månader.
- id: scene-15
  description: Om du är barnets enda vårdnadshavare, kan du använda alla 320 vardagar och få föräldrapenning
    under en längre period.
- id: scene-16
  description: Om familjen får tvillingar kan ni få föräldrapenning för ytterligare 84 vardagar.
- id: scene-17
  description: Du kan få föräldrapenning flexibelt när du vill fram till dess att barnet fyller två år.
- id: scene-18
  description: Du kan överlåta högst 63 vardagar av din föräldrapenningkvot på 160 vardagar till barnets
    andra förälder.
- id: scene-19
  description: Beloppet på föräldradagpenningen beror på din årsinkomst.
- id: scene-20
  description: Om du inte har några inkomster, får du föräldrapenningens minimibelopp.
- id: scene-21
  description: Ta i god tid reda på om din arbetsgivare betalar ut lön för föräldraledigheten.
- id: scene-22
  description: Om du tar hand om barnet under en del av dagen och har ett deltidsarbete samtidigt, kan
    du ansöka om partiell föräldrapenning.
- id: scene-23
  description: Föräldrarna kan också arbeta deltid och sköta barnet växelvis eller samtidigt.
