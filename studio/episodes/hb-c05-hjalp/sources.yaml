    source_kind: p
    source_role: content
    heading: Jämlikhet på arbetsplatsen
    source_range:
      start: 0
      end: 247
    range_basis: normalized_html_block
    extracted_passage: Arbetsdiskriminering är ett brott. Om du misstänker att du blivit utsatt för
      arbetsdiskriminering kan du kontakta arbetarskyddsmyndigheterna (työsuojeluviranomaiset), diskrimineringsombudsmannen
      (yhdenvertaisuusvaltuutettu) eller ditt fackförbund.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c05-u0080:
    source_path: data/infofinland/content/work-and-enterprise/finnish-working-life/working-without-discrimination.html
    sha256: bd594bd165e07166768ebaa0f9459e130816e3ee3894e90bb5f185b1f980afd0
    source_block: b0018
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(8) > p:nth-of-type(6)
    source_kind: p
    source_role: content
    heading: Jämlikhet på arbetsplatsen
    source_range:
      start: 0
      end: 415
    range_basis: normalized_html_block
    extracted_passage: Vid problem kan du fråga om råd hos arbetarskyddsfullmäktige (työsuojeluvaltuutettu)
      eller den förtroendevalda (luottamusmies) på din arbetsplats. Arbetarskyddsfullmäktige övervakar
      de anställdas säkerhet. Den förtroendevalda övervakar att arbetsgivaren följer arbetslagstiftningen
      och kollektivavtalet på arbetsplatsen. Den förtroendevalda ger råd och kan vid behov också
      reda ut eventuella meningsskiljaktigheter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c05-u0081:
    source_path: data/infofinland/content/work-and-enterprise/finnish-working-life/working-without-discrimination.html
    sha256: bd594bd165e07166768ebaa0f9459e130816e3ee3894e90bb5f185b1f980afd0
    source_block: b0026
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(10) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Jämställdhet mellan könen i rekryteringen och på arbetsplatsen
    source_range:
      start: 0
      end: 485
    range_basis: normalized_html_block
    extracted_passage: I Finland finns en lag om jämställdhet mellan kvinnor och män, som föreskriver
      att arbetsgivaren ska övervaka att jämställdhet uppnås på arbetsplatsen och att ingen diskrimineras
      på arbetsplatsen. Jämställdhetsombudsmannen (tasa-arvovaltuutettu) övervakar att lagen om jämställdhet
      mellan kvinnor och män följs. Om du misstänker att din arbetsgivare har diskriminerat dig på
      grund av ditt kön kan du be jämställdhetsombudsmannen om anvisningar och råd samt hjälp med
      att reda ut saken.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
