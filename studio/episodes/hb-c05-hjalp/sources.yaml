  hb-c05-u0078:
    source_path: data/infofinland/content/information-about-finland/equality-and-non-discrimination.html
    sha256: b8783e9b1fb5d7f0f39d0e69dbb055df9c02e8812d348538f9752784e7e0b902
    source_block: b0036
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1)
      > div:nth-of-type(10) > p:nth-of-type(2)
    source_kind: p
    source_role: content
    heading: Diskrimineringsombudsmannen
    source_range:
      start: 0
      end: 536
    range_basis: normalized_html_block
    extracted_passage: Diskrimineringsombudsmannen är en självständig och oberoende myndighet, vars
      uppgift är att främja likabehandling och ingripa i diskriminering. Diskrimineringsombudsmannen
      kan ge anvisningar, råd och rekommendationer samt hjälpa med att åstadkomma en förlikning i
      diskrimineringsfall. Ombudsmannen kan även vid behov be den som misstänks för diskriminering
      om en redogörelse för händelsen. Dessutom kan diskrimineringsombudsmannen föra eller hjälpa
      med att föra ärendet till Diskriminerings- och jämställdhetsnämnden eller till domstol.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
