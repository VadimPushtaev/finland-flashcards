    heading: Diskrimineringsombudsmannen
    source_range:
      start: 0
      end: 277
    range_basis: normalized_html_block
    extracted_passage: Om du blir utsatt för eller bevittnar diskriminering någonstans, kan du kontakta
      diskrimineringsombudsmannen (yhdenvertaisuusvaltuutettu). Du kan även polisanmäla diskriminering.
      Du kan kontakta diskrimineringsombudsmannen även på en annan persons eller på någon grupps
      vägnar.
    normalization: whitespace_only
