- sentence_id: hb-c05-u0081-s001
  sv: I Finland finns en lag om jämställdhet mellan kvinnor och män, som föreskriver att arbetsgivaren
    ska övervaka att jämställdhet uppnås på arbetsplatsen och att ingen diskrimineras på arbetsplatsen.
  ru: В Финляндии существует закон о равноправии женщин и мужчин, который предписывает работодателю следить
    за тем, чтобы на рабочем месте обеспечивалось гендерное равенство и никто не подвергался дискриминации.
