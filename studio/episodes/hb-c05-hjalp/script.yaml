sentences:
- sentence_id: hb-c05-u0075-s001
  sv: Om man upplever, misstänker eller blir vittne till diskriminering kan man kontakta jämställdhetsombudsmannen
    eller diskrimineringsombudsmannen, beroende på orsaken till diskrimineringen.
  ru: Если человек сталкивается с дискриминацией, подозревает её или становится её свидетелем, он может
    обратиться к уполномоченному по вопросам равноправия (jämställdhetsombudsmannen) или уполномоченному
    по вопросам равенства (diskrimineringsombudsmannen), в зависимости от причины дискриминации.
  scene_id: scene-1
  visual_cue: 'Verified contextual photograph: Ratapihantie9 in Helsinki: actual office building of the
    Non-Discrimination Ombudsman and National Non-Discrimination and Equality Tribunal. Official identity
    verified at https://yhdenvertaisuusvaltuutettu.fi/toimiston-yhteystiedot and https://www.yvtltk.fi/yleistiedoksiannot/
    on2026-10-26. Building context; not a photograph of an actual complaint or advice session. Keep full
    bilingual sentence on right; no separate caption.'
  asset_ids:
