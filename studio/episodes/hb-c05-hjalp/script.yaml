- sentence_id: hb-c05-u0076-s001
  sv: Om man anser att det har skett ett fel eller en försummelse inom till exempel familje- och socialtjänster,
    hälsovården, skolans eller någon annan myndighets verksamhet kan man kontakta Regionförvaltningsverket.
  ru: Если человек считает, что, например, в работе семейных и социальных служб, здравоохранения, школы
    или другого органа власти была допущена ошибка или упущение, он может обратиться в Ведомство регионального
    управления (Regionförvaltningsverket).
  scene_id: scene-1
