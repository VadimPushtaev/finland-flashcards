    heading: Arbeta i Finland
    source_range:
      start: 0
      end: 360
    range_basis: normalized_html_block
    extracted_passage: Innan du kan få ett uppehållstillstånd måste du hitta ett jobb i Finland.
      När du har hittat ett jobb kan du ansöka om uppehållstillstånd. För att kunna arbeta i Finland
      behöver du vanligen antingen ett uppehållstillstånd för arbetstagare eller något annat av uppehållstillstånd
      för förvärvsarbete. Arten av det arbete du ska utföra påverkar typen av tillstånd.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
