    range_basis: normalized_html_block
    extracted_passage: Om du redan har uppehållstillstånd i Finland utifrån en annan grund, till
      exempel familjeband, kan du ha rätt att arbeta i Finland. Då behöver du inte ett separat uppehållstillstånd
      för att arbeta. Du kan kontrollera om du har rätt att arbeta i Finland från ditt uppehållstillståndskort
      eller beslut om uppehållstillstånd.
    normalization: whitespace_only
    repairs: []
