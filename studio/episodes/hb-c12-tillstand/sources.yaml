      end: 294
    range_basis: normalized_html_block
    extracted_passage: Uppehållstillståndet för en arbetstagare kan vara förbundet med tillgångsprövning.
      Det betyder att arbetsgivaren måste utreda om man inom rimlig tid kan få arbetskraft till en
      uppgift från Finland eller EU/EES-området. Migrationsverket beslutar om du ska beviljas uppehållstillstånd
      eller inte.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
