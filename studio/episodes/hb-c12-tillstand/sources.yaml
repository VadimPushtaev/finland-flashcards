    heading: På vilka grunder kan man få uppehållstillstånd?
    source_range:
      start: 0
      end: 267
    range_basis: normalized_html_block
    extracted_passage: Migrationsverket behandlar alla ansökningar om uppehållstillstånd. Det fattar
      också skriftliga beslut om ansökningarna, det vill säga beviljar eller avslår dem. Man kan
      få uppehållstillstånd på grund av bland annat arbete eller företagande, studier eller familjeband.
    normalization: whitespace_only
