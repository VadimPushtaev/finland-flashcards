    heading: På vilka grunder kan man få uppehållstillstånd?
    source_range:
      start: 0
      end: 378
    range_basis: normalized_html_block
    extracted_passage: Villkoret för uppehållstillstånd som beviljas för arbete, studier eller familjeband
      är ofta tillräcklig försörjning. Det betyder att den sökande ska ha tillräckligt med pengar
      för att hen och hens familj ska kunna bo och leva i Finland. Också när en person kommer till
      Finland för att arbeta måste hen intyga att arbetet ger tillräckligt med lön och att hen kan
      leva på sin lön.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
