scenes:
- id: hb-c12-u0140
  description: När en person flyttar till Finland behöver hen ofta ett uppehållstillstånd.
- id: hb-c12-u0141
  description: Migrationsverket behandlar alla ansökningar om uppehållstillstånd.
- id: hb-c12-u0142
  description: Villkoret för uppehållstillstånd som beviljas för arbete, studier eller familjeband är
    ofta tillräcklig försörjning.
- id: hb-c12-u0143
  description: Innan du kan få ett uppehållstillstånd måste du hitta ett jobb i Finland.
- id: hb-c12-u0144
  description: Uppehållstillståndet för en arbetstagare kan vara förbundet med tillgångsprövning.
- id: hb-c12-u0145
  description: Om du redan har uppehållstillstånd i Finland utifrån en annan grund, till exempel familjeband,
    kan du ha rätt att arbeta i Finland.
- id: hb-c12-u0146
  description: Så länge handläggningen av din första ansökan om uppehållstillstånd pågår har du vanligtvis
    inte rätt att arbeta.
- id: hb-c12-u0147
  description: Din företagsverksamhet ska vara lönsam och dina inkomster från företagsverksamheten måste
    ge dig en tryggad försörjning.
- id: hb-c12-u0148
  description: Uppehållstillstånd beviljas inte på grund av att du äger ett företag.
- id: hb-c12-u0149
  description: Innan du kan ansöka om uppehållstillstånd måste du skaffa dig en studieplats i Finland.
- id: hb-c12-u0150
  description: 'Studieplatsen ska uppfylla ett av följande villkor:'
- id: hb-c12-u0151
  description: studierna leder till yrke eller examen
- id: hb-c12-u0153
  description: du deltar i ett utbytesprogram mellan läroanstalter eller något annat utbytesprogram
- id: hb-c12-u0154
  description: du avlägger en kompletterande utbildning eller en specialutbildning som hör till din examen.
- id: hb-c12-u0155
  description: Uppehållstillstånd för studerande beviljas vanligen för studietiden.
- id: hb-c12-u0156
  description: Alla familjemedlemmar kan inte få uppehållstillstånd.
- id: hb-c12-u0157
  description: Om din familjemedlem bor i Finland och du vill flytta till denna person, behöver du ett
    uppehållstillstånd på grund av familjeband.
- id: hb-c12-u0158
  description: Om du är familjemedlem till en finsk medborgare, behöver din försörjning inte vara tryggad.
- id: hb-c12-u0159
  description: Om du är av finländsk härkomst eller har en nära kontakt med Finland kan du beviljas uppehållstillstånd
    i Finland på grund av detta.
- id: hb-c12-u0160
  description: Personer som aldrig själv har varit finska medborgare men vars ena förälder eller mor-
    eller farförälder är eller har varit infödd finsk medborgare betraktas som återflyttare (paluumuuttaja)
    av finsk härkomst.
