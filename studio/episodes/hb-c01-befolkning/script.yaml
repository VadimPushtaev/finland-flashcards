episode_decisions:
- id: opening
  decision: Show exact bilingual source heading unspoken for 3 seconds over the continuous topic photograph.
  status: proposed
  resolve_during: script
- id: structure
  decision: Keep all source sentences and fragments once, in source order. Group by original passage.
    Add no narration, invented data, quiz or summary.
  status: proposed
  resolve_during: script
- id: layout
  decision: '1920×1080 at 24 fps. Chapter 1 palette: evergreen panel #102e2b, Swedish #f6f1e6, Russian
    #bdd3c9, highlights #e7bc70, separators #35534b. Stable right panel spans (890,165) to (1860,980),
    evergreen alpha 225; text starts x 930 with 900 px wrapping width. Useful foreground slot is 760×720
    px at (90,180), images steady. Swedish Arial Bold 48 px with 63 px leading above Russian Arial 40
    px with 55 px leading. Header Arial Bold 30 px, counter Arial 27 px. About 90 px horizontal safe margin.
    All pairs use the default body sizes; all source wording retained. Source/credit cards remain unspoken.'
  status: proposed
  resolve_during: script
- id: motion
  decision: Use Helsinki panorama — DIMMIS as continuous full-frame decorative background. Darken 42%,
    blur 2.5 px. Linear fractional diagonal pan crop(.15,.15)→(.85,.85), zoom1.06→1.219 (15% relative
    increase). Motion starts immediately and never resets at sentences.
  status: proposed
  resolve_during: script
- id: voice
  decision: Shared local Supertonic 3 F1, sv, 32 steps, speed .95, seed 42, 44.1 kHz mono PCM16, four
    CPU threads. One WAV per sentence; numeric speech expansions separate from exact bilingual display.
    No independent listening approval claimed; review in complete video.
  status: proposed
  resolve_during: script
- id: pacing
  decision: Sentence pair appears .25 seconds before speech. Pause 1.3 seconds normally, 2 seconds at
    passage boundaries, 2.5 seconds after long comparisons. Never accelerate long sentences. Actual timing
    from WAV duration.
  status: proposed
  resolve_during: script
- id: foreground
  decision: Use restrained source-based factual cards only when they clarify an explicit number, month
    or comparison. Rest of prose leaves image area open to the decorative photograph. Cards repeat source
    wording only; no quantitative map or inferred proportions. Fact cards use a 1520×1440 px evergreen
    canvas, Arial Bold 90 px for up to 3 labels or 72 px otherwise, reducing only to fit 1280 px width.
    They scale into the fixed 760×720 px foreground slot. Card text repeats the chapter cream/gold colors.
  status: proposed
  resolve_during: script
- id: music
  decision: Dreams Become Real — Kevin MacLeod, CC BY 4.0, selected from official catalog. Distinct track
    reserved for this subchapter. Use original from start, excerpt to video; no loop required (original
    6m50s). Same accepted +2 dB music adjustment, gentle fades and narration ducking.
  status: proposed
  resolve_during: script
- id: closing
  decision: Two 15-second readable credit cards over continuing background. Full source/media credits
    alongside canonical video. Photos cropped/darkened/softened/panned; preserve applicable share-alike
    notice.
  status: proposed
  resolve_during: script
- id: review
  decision: Production decisions proposed under existing shared direction. Final complete-video user review
    pending. No new shared-direction exception.
  status: proposed
  resolve_during: script
