    source_range:
      start: 0
      end: 221
    range_basis: normalized_html_block
    extracted_passage: Att besöka torg och saluhallar eller små specialbutiker är mer sällsynt, men
      möjligt, i synnerhet i de större städerna. Torg är populära sommartid. På sommaren kan det
      dessutom ordnas torgevenemang för lokala producenter.
