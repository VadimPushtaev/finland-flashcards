    heading: Traditionell mat har varit mild och enkel
    source_range:
      start: 0
      end: 253
    range_basis: normalized_html_block
    extracted_passage: Den traditionella matkulturen i Finland är tudelad. I västra Finland har matkulturen
      inspirerats mycket av den svenska matkulturen och i östra Finland av den ryska. I norra Finland
      bedriver man dessutom renskötsel, och därför används ofta också renkött.
    normalization: whitespace_only
    repairs: []
