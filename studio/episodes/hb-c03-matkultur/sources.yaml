      > div:nth-of-type(1) > p:nth-of-type(9)
    source_kind: p
    source_role: content
    heading: För många är det viktigt att äta hälsosam och etiskt producerad mat
    source_range:
      start: 0
      end: 353
    range_basis: normalized_html_block
    extracted_passage: För många är det också viktigt att djuren som används till mat har behandlats
      väl. Många äter ingen animalisk mat alls, eftersom de inte vill skada djur eller eftersom de
      vill minska koldioxidutsläppen från matproduktionen. Veganismen och vegetarianismen har ökat
      i Finland under de senaste 20 åren. En vegansk kost innehåller inga animaliska produkter.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
