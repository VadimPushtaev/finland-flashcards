    heading: Många har matlagning som hobby och testar nya recept
    source_range:
      start: 0
      end: 309
    range_basis: normalized_html_block
    extracted_passage: På restaurang äter man ofta till exempel pizza, hamburgare, sushi, pastarätter,
      kinesisk mat eller mat från Mellanöstern. I allmänhet beställer var och en i sällskapet en
      egen portion åt sig, och man delar vanligtvis inte på maten. Var och en betalar också ofta
      endast sin egen mat när man äter på restaurang.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
