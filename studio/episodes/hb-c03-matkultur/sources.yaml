    source_kind: p
    source_role: content
    heading: Traditionell mat har varit mild och enkel
    source_range:
      start: 0
      end: 241
    range_basis: normalized_html_block
    extracted_passage: Traditionell finsk mat har varit mild. Man använde lite kryddor, eftersom
      de måste hämtas långt ifrån och var dyra. Finland var länge ett fattigt land, där maten var
      anspråkslös och enkel. Typisk finsk mat var kött och fisk med kokt potatis.
    normalization: whitespace_only
