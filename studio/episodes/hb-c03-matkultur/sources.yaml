    heading: För många är det viktigt att äta hälsosam och etiskt producerad mat
    source_range:
      start: 0
      end: 182
    range_basis: normalized_html_block
    extracted_passage: Många är noggranna med att maten de äter är hälsosam, ekologisk och närproducerad.
      Många har minskat på användningen av fett och salt och ökat mängden frukt och grönsaker i sin
      kost.
    normalization: whitespace_only
    repairs: []
