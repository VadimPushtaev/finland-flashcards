    heading: Många har matlagning som hobby och testar nya recept
    source_range:
      start: 0
      end: 332
    range_basis: normalized_html_block
    extracted_passage: I Finland lagar både männen och kvinnorna i hushållen mat och gör dagliga
      matinköp. Matlagning är en vanlig hobby, och människorna vill testa nya smaker och matlagningsmetoder.
      Olika länders kök och varierande mattrender kommer till finländarnas kännedom via internet,
      medier och resor och tack vare att Finland internationaliseras.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
