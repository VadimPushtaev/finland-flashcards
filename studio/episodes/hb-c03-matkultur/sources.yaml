    source_role: content
    heading: Mat som går att äta vill man inte slänga i onödan
    source_range:
      start: 0
      end: 383
    range_basis: normalized_html_block
    extracted_passage: Eftersom Finland tidigare var ett land med låg levnadsstandard, är många fortfarande
      noggranna med att inte laga för mycket mat, som sedan slängs. För att det inte ska uppstå något
      matsvinn är i synnerhet de äldre generationerna av den åsikten att man äter upp allt man har
      på tallriken. På matställen, där man själv får ta mat åt sig, tar man endast så mycket mat
      som man orkar äta.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
