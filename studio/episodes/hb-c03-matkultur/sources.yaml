    source_kind: p
    source_role: content
    heading: Traditionell mat har varit mild och enkel
    source_range:
      start: 0
      end: 392
    range_basis: normalized_html_block
    extracted_passage: Ryska maträtter och matlagningsmetoder gör att den finska matkulturen skiljer
      sig från den i de övriga nordiska länderna. Finländarna använder gärna svamp i maten och lagar
      karelsk stek och karelska piroger. Även påskrätterna liknar de ryska, likaså bakverk med kvarg.
      Maträtter som är gemensamma med svenskarnas är till exempel ärtsoppa, pannkaka, köttbullar,
      kanelbullar och fastlagsbullar.
    normalization: whitespace_only
    repairs: []
