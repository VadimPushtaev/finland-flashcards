    range_basis: normalized_html_block
    extracted_passage: Förr åt människorna i Finland för det mesta potatis, men numera är ris och
      pasta vanliga. En vardagslunch är vanligtvis hälsosam och mångsidig, och på lunchrestaurangernas
      dagligen varierande matsedlar finns det ofta typiska finska maträtter.
    normalization: whitespace_only
