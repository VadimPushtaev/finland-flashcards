    heading: Råvarorna varierar beroende på årstiden
    source_range:
      start: 0
      end: 220
    range_basis: normalized_html_block
    extracted_passage: På vintern är grönsakerna dyrare än på sommaren, eftersom många av dem importeras
      till Finland från utlandet. I dag finns nästan alla livsmedel tillgängliga året om, men många
      följer ändå skördesäsongen i sin matlagning.
