    heading: Matkultur och ätande
    source_range:
      start: 0
      end: 384
    range_basis: normalized_html_block
    extracted_passage: Finländarnas matvanor har förändrats mycket under de senaste 50 åren. I affärerna
      finns ett brett utbud av råvaror från hela världen. I synnerhet utbudet av frukt och grönsaker
      har blivit mångsidigare. Människornas kost tar mycket mer än tidigare intryck från andra länder.
      Även utbudet av färdigmat och halvfabrikat har ökat, och för många är de en viktig del av vardagsmatlagningen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
