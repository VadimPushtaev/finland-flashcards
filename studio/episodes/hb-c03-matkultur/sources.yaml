      > div:nth-of-type(1) > p:nth-of-type(15)
    source_kind: p
    source_role: content
    heading: Råvarorna varierar beroende på årstiden
    source_range:
      start: 0
      end: 339
    range_basis: normalized_html_block
    extracted_passage: Skördesäsong betyder den tid då grönsaker, frukter och bär är som bäst och
      det finns mycket av dem. Också priset är lägre under skördesäsongen än annars. Om man till
      exempel vill köpa jordgubbar i juni finns det bra tillgång till finska bär och de är billigare.
      På vintern importeras jordgubbarna från utlandet och är därför mycket dyrare.
