# Editorial proposals, not automatic authority to compose chapters.
# Paths are relative to the relevant archive root, without .html.
# Explicit overrides take precedence over category defaults.
schema_version: 1
common_omissions:
  - Website navigation, external-link cards and duplicated introductions.
  - Classroom discussion questions, exercises, learning objectives and trainer-directed framing.
  - Local addresses, phone directories, appointment/website walkthroughs and application checklists.
  - Unsupported current claims, unresolved contradictions and statistics presented as current without an identifiable date.
common_retention:
  - Complete explanations, definitions, qualifications and examples needed to understand an included civic topic.
  - Safety actions and remedies that explain a civic right or duty; procedural appearance alone is not grounds to omit them.

