- id: hb-c05-barn
  title: Barns rättigheter
  blocks:
  - id: hb-c05-u0121
    source_path: data/orientation/sv/laromedel/familj/barnomsorg-och-barnuppfostran-i-finland.html
    source_block: b0015
    kind: paragraph
    source_range:
    - 61
    - 504
    expected_text: Vårdnadshavarna är i allmänhet barnets föräldrar. Ibland kan vårdnadshavaren vara någon
      annan. Vårdnadshavaren beslutar om barnets omsorg, uppfostran, boendeort och andra viktiga frågor.
      Enligt finsk lag måste man ändå lyssna på barnets önskemål i frågor som rör hen. Barnet ska ha en
      trygg livsmiljö och positiva och nära relationer till andra människor. Vårdnadshavaren är skyldig
      att se till barnets välbefinnande och harmoniska utveckling.
    selection_reason: Retain six complete sentences on guardianship responsibilities and listening to
      the child; omit the opening one-or-two guardian cap, which is not qualified in this archived paragraph.
      Chapter09 provides the fuller at-least-one guardian wording from InfoFinland.
