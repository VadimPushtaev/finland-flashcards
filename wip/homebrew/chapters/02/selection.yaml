    - 1286
    expected_text: Under 1960- och 1970-talet utvecklades Finland småningom till en nordisk välfärdsstat.
      Sverige var ett modelland i fråga om välfärden och påverkade Finland mycket. Staten tog allt mer
      ansvar för medborgarnas välfärd. Medborgarna fick fler inkomstöverföringar från staten, till exempel
      moderskapspenning och sjukpenning samt ersättningar för läkemedelsutgifter och läkararvoden. Det
      satsades på utbildning och sjukvård genom att det byggdes nya sjukhus och skolor och läkarutbildningen
      utvidgades.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c02-u0068
