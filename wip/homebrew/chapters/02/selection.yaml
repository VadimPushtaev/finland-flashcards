- id: hb-c02-nationalitet
  title: Nationell identitet och demokratisering
  blocks:
  - id: hb-c02-u0027
    kind: paragraph
    source_path: data/orientation/sv/laromedel/finlands-historia/huvuddragen-i-finlands-historia-1-finland-som-en-del-av-sverige-och-ryssland.html
