    source_path: data/orientation_guide.pdf
    pdf_page: 27
    source_range:
    - 1761
    - 2245
    expected_text: Välfärdsstaten utvecklades ur jämlikhetsperspektiv. På 1970-talet började alla barn
      oberoende av samhällsklass gå samma kostnadsfria grundskola. De som studerade vid universitet, högskolor
      eller andra stadiets läroanstalter började få studiestöd, det vill säga ekonomiskt stöd för livet
      under studietiden. Tack vare studiestödet hade barndomsfamiljens tillgångar inte längre så stor
      betydelse för om en ung vuxen hade ekonomisk möjlighet att utbilda sig till det yrke hen ville.
