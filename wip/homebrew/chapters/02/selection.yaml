    - 2119
    expected_text: Först klarade sig Finland bra i kriget och erövrade fler områden. Men sedan blev det
      slut med Finlands bundsförvant Tysklands framgångar i Europa. Tyskland hade under andra världskriget
      erövrat en stor del av Europa, men det stora anfallet mot Sovjetunionen misslyckades och Tyskland
      måste retirera. Sovjetunionen anföll Finland och hösten 1944 slöt man fred. Finland måste igen överlåta
      områden åt Sovjetunionen, betala krigsskadestånd och driva ut de tyska trupper som fanns i landet.
      Kriget mot de tyska trupperna kallas lapplandskriget. I det kriget brände tyskarna en stor del av
      Lappland när de lämnade Finland.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
- id: hb-c02-ateruppbyggnad
  title: Återuppbyggnad och kalla kriget
  blocks:
  - id: hb-c02-u0055
    kind: paragraph
    source_path: data/infofinland/content/information-about-finland/finnish-history.html
    source_block: b0035
  - id: hb-c02-u0056
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 127
    source_range:
    - 1347
    - 2171
    expected_text: Efter krigen präglades politiken först av försiktighet och oro över att Sovjetunionen
      skulle ockupera landet. Kommunistisk politisk verksamhet var tillåten igen och man var också rädd
      för en kommunistisk revolution. Men spänningen minskade så småningom när förhållandena stabiliserades.
      När också förhållandet till Sovjet stabiliserades lärde sig finländarna hur det lönar sig att handla
      som granne till en inflytelserik stormakt. År 1948 slöt Finland och Sovjet VSB-pakten, det vill
      säga Vänskaps-, samarbets- och biståndspakten. Pakten gav Finland ekonomiska fördelar, men innebar
      också att Finland i både inrikes- och utrikespolitiken måste handla så att man inte irriterade Sovjet.
      Finland var officiellt ett självständigt och neutralt land, men i verkligheten måste man beakta
      Sovjets intressen i sin politik.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
