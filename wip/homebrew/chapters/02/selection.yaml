- id: hb-c02-valfard
  title: Välfärdsstatens framväxt
  blocks:
  - id: hb-c02-u0061
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 25
    source_range:
    - 2652
    - 3044
    expected_text: Ännu i slutet av 1800-talet var det främst familjen, bygemenskapen och enskilda förmögna
      välgörare samt framför allt kyrkan som tog hand om fattiga och sjuka i Finland. Sedan överfördes
      ansvaret för landsbygdens fattiga allt mer från kyrkan till kommunerna. De fattiga arbetarna fick
      ekonomisk hjälp bara om de samtidigt förband sig att arbeta för en gård, en kommun eller en församling.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c02-u0062
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 25
    source_range:
    - 3044
    - 3486
    expected_text: Under industrialiseringen i slutet av 1800-talet blev det allmän diskussion om fabriksarbetarnas
      usla villkor och fattigdom. Det lilla socialskydd fabriksarbetarna hade sköttes främst av arbetsgivarna
      och småningom även av medborgarorganisationer. På fabriksorter ägde och administrerade fabriksägaren
      också arbetarnas bostäder, daghem och åldringsvård. Fabriken påverkade hela arbetarnas livsmiljö
      och knöt dem tätt till arbetsgivaren.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c02-u0063
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 26
    source_range:
    - 309
    - 833
    expected_text: Samhällsaktiviteten i organisationerna var viktig för demokratins utveckling i Finland.
      Till de första stora folkrörelserna i Finland hörde nykterhetsrörelsen, gymnastik- och idrottsrörelsen,
      arbetar- och fackföreningsrörelserna samt ungdomsföreningar. Folkrörelserna och samhällsaktiviteten
      hjälpte till att förena finländarna som nation. De utbildade och upplyste finländarna, skapade nationalkänsla
      och lärde människorna att sköta gemensamma ärenden. Allt detta behövdes när Finland blev en självständig
      stat 1917.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c02-u0064
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 26
    source_range:
    - 1254
    - 1984
    expected_text: Grunden till den finska välfärden är heltäckande tjänster inom social- och utkomstskydd.
      Socialskyddssystemet, en struktur av sociala förmåner och understöd, utvecklades senare i Finland
      än i de övriga nordiska länderna. År 1895 stiftades en lag om arbetsolycksfallsförsäkring. Det var
      första steget i utvecklandet av finsk socialförsäkring, men var också länge den enda formen av socialförsäkring
      i Finland. Lagen fastslog att arbetstagaren skulle betalas ersättning i fall av arbetsolycka eller
      yrkessjukdom. Den tidens finska socialförsäkring var internationellt sett gammalmodig, men i den
      oeniga politiska atmosfär som härskade var det mycket svårt att införa försäkringar för ålderdom,
      arbetsoförmåga eller sjukdom.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c02-u0065
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 26
    source_range:
    - 1984
    - 2463
    expected_text: Även om socialministeriet, som skulle ansvara för socialskyddet, grundades vid samma
      tid som Finland blev självständigt 1917, började man skapa omfattande offentliga stödsystem i Finland
      först i slutet av 1930-talet. Den första folkpensionslagen godkändes 1937. Lagen gav de försäkrade
      folkpension, det vill säga ekonomisk hjälp för ålderdomen och vid arbetsoförmåga. Samma år grundades
      Folkpensionsanstalten FPA (på finska Kela), vars uppgift var att betala folkpensionen.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c02-u0066
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 26
    source_range:
    - 2515
    - 3152
    expected_text: Den ursprungliga målsättningen med att göra Finland till en välfärdsstat var att minska
      fattigdomen och garantera en daglig utkomst för alla finländare. Man ansåg att detta skulle stabilisera
      samhället och dess utveckling och minska stödet för alla slags extrema rörelser. Tanken var också
      att mindre inkomstskillnader skulle göra människorna mer jämlika. Det skulle leda till att Finlands
      folk skulle vara enigare och alla skulle vilja arbeta för att utveckla landet. Det skulle vara lättare
      för olika befolkningsgrupper, till exempel rika och fattiga och grupper med olika politiska uppfattningar,
      att leva i fred med varandra.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
