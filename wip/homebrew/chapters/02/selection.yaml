    expected_text: I det medeltida Finland byggdes flera slott för att försvara området mot ryssarna.
      Två av dem var Tavastehus slott och Viborgs slott. Under medeltiden grundades också de första städerna
      i Finland, bland annat Åbo och Borgå.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
