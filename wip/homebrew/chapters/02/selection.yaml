    source_path: data/orientation_guide.pdf
    pdf_page: 11
    source_range:
    - 266
    - 667
    expected_text: Innan kristendomen kom till Finland utövades här hednisk religion. Det var en polyteistisk
      religion, det vill säga människorna trodde på många gudar. Man tillbad också avlidna och djur, till
      exempel björnen. I samhällena fanns siare, som botade sjuka och tryggade en god skörd. I skogarna
      och på kärren fanns heliga platser där människor offrade åt gudarna och dit de förde mat åt naturväsendena.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
