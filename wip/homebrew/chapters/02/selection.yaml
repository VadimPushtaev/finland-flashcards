    source_path: data/orientation_guide.pdf
    pdf_page: 13
    source_range:
    - 663
    - 1211
    expected_text: Under ryska väldet föddes nationalistiska idéer i Finland först bland de bildade svenskspråkiga
      klasserna. De blev intresserade av finska språket och finsk kultur och framställde finländarna som
      ett folk med en gemensam historia och kultur. Den ryska förvaltningen stödde det nationella uppvaknandet
      och förbättrandet av det finska språkets ställning. I Ryssland tänkte de att nationalkänslan skulle
      fjärma finländarna från Sverige och svenskheten och föra dem närmare Ryssland. Finskspråkiga skolor
      började grundas i städerna på 1860-talet.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c02-u0029
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 13
    source_range:
    - 1211
    - 1584
    expected_text: Nationalisterna kom att tvista om det finska och svenska språkets ställning i Finland.
      En del ville bevara svenska språkets ställning i Finland medan andra ville att finska skulle vara
      det enda språket. Språkstriden skapade de första partierna i Finland på 1860-talet. I och med stridigheterna
      blev finska det andra officiella språket i Finland i början av 1900-talet.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
