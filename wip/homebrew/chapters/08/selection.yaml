schema_version: 1
chapter_id: hb-c08
title: Utbildning och lärande
language: sv
sections:
- id: hb-c08-utveckling
  title: Utbildningssystemets utveckling
  blocks:
  - id: hb-c08-u0001
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 64
    source_range:
    - 1833
    - 2349
    expected_text: Samhälleliga förändringar sker alltid av någon orsak. Vanligen ligger det ett behov
      eller en ideologi bakom dem. Det finländska utbildningssystemets uppkomst och utveckling har också
      påverkats av samhälleliga behov och ideologier. De första skolorna grundades i Finland för över
      700 år sedan i anslutning till den katolska kyrkan. Då bodde nästan alla finländare på landsbygden
      och under en lång tid var skolgång möjlig endast för ett fåtal pojkar ur den övre samhällsklassen.
      De utbildades främst till präster.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  - id: hb-c08-u0002
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 64
    source_range:
    - 2351
    - 2810
    expected_text: I många europeiska länder började reformationen på 1500-talet. Nya kyrkosamfund, till
      exempel det lutherska, separerade från den katolska kyrkan. Även Finland var tidigare ett katolskt
      land som i och med reformationen gick över till lutherdom. Reformationen ledde småningom till en
      ändrad syn på utbildning, eftersom den lutherska kyrkan betonade folkspråk och läskunnighet. Tanken
      var att alla i församlingen skulle må bra av att själv kunna läsa Bibeln.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  - id: hb-c08-u0003
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 65
    source_range:
    - 165
    - 431
    expected_text: I början av 1800-talet blev Finland en autonom del av Ryssland, vilket ändrade Finlands
      ställning. Det var ändå fortfarande kyrkan som skötte folkets utbildning ända till mitten av 1800-talet.
      Efter det började det finländska samhället ändras i allt snabbare takt.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  - id: hb-c08-u0004
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 65
    source_range:
    - 1109
    - 1287
    expected_text: I och med industrialiseringen skildes skolan från kyrkan. Arbetande föräldrar kunde
      inte längre sköta sina barn på dagtid, så det uppstod ett behov av att utveckla skolsystemet.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  - id: hb-c08-u0005
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 65
    source_range:
    - 1289
    - 1398
    expected_text: Kommunerna började grunda folkskolor separat från kyrkan och dessa skolor spreds småningom
      till hela landet.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  - id: hb-c08-u0006
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 65
    source_range:
    - 1402
    - 1748
    expected_text: Vid sidan av folkskolorna fanns också läroverk, av vilka många var privata. I dem gick
      främst rikare familjers barn. Det tog flera tiotals år innan hela befolkningen omfattades av utbildningen,
      för särskilt på landsbygden var det många som inte förstod vikten av utbildning och som ställde
      sig misstroget till att skicka sina barn till skolan.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  - id: hb-c08-u0007
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 65
    source_range:
    - 2700
    - 2968
    expected_text: Först på 1900-talets sida började större delen av befolkningen stöda folkskolan och
      1921 stiftades en lag om läroplikt i Finland. Det betydde att skolgång blev obligatoriskt för alla.
      Folkskolan utvidgades till att omfatta hela åldersklassen på 1920- och 1930-talet.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  - id: hb-c08-u0008
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 65
    source_range:
    - 2970
    - 3380
    expected_text: Gymnasieutbildning och studentexamen blev vanligare särskilt på 1950- och 1960-talet.
      I Finland började man eftersträva samhällelig jämlikhet och ekonomisk utveckling genom att bygga
      en välfärdsstat. Samtidigt föddes tanken på en enhetlig 9-årig grundskola. Under 1970-talet övergick
      man i hela landet från det gamla systemet med separat folkskola och läroverk till en grundskola
      som var gemensam för alla.
    selection_reason: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
