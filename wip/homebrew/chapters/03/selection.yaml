- id: hb-c03-kulturdagar
  title: Runeberg, kvinnodagen och Minna Canths dag (19 mars)
  blocks:
  - id: hb-c03-u0083
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 17
    source_range:
    - 1170
    - 1502
    expected_text: Den 5 februari firas Runebergsdagen. Då firas Finlands nationalskald Johan Ludvig Runeberg,
      som skrev orden till Finlands nationalsång som heter Vårt land. Han hade stort inflytande på finländsk
      litteratur och kultur. På Runebergsdagen äts runebergstårtor, en slags bakelse som skaldens hustru,
      Fredrika Runeberg, brukade baka.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0084
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 17
    source_range:
    - 2438
    - 2700
    expected_text: Den 8 mars firas den internationella kvinnodagen. Då ordnar många organisationer och
      andra grupper diskussionstillfällen och andra evenemang, där kvinnans ställning i det finska samhället
      och i världen behandlas. I Finland är kvinnodagen en vanlig arbetsdag.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0085
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 17
    source_range:
    - 2726
    - 2959
    expected_text: I mars firas Minna Canths dag, eller jämställdhetens dag. Minna Canth var en finsk
      författare och samhällspåverkare. Hon främjade kvinnornas ställning i Finland bland annat genom
      att förbättra flickors möjligheter till utbildning.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
