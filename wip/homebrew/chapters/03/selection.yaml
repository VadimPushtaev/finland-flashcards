  - id: hb-c03-u0094
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 39
    - 336
    expected_text: Föräldrar som inte hör till kyrkan kan välja att ordna en namngivningsfest i stället,
      där familj och släktingar samlas för att fira det lilla barnet. Dopet eller namngivningsfesten ordnas
      hemma eller i kyrkan eller i någon annan festlokal och de närmaste släktingarna och vännerna bjuds
      in.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0095
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 336
    - 634
    expected_text: Två faddrar utses åt barnet bland vännerna eller släktingarna. Ursprungligen var fadderns
      uppgift att vara en slags andlig förälder åt barnet och sköta om barnets kristna fostran. I dag
      tänker man mera att barnet är en särskilt viktig människa i fadderns liv och faddern följer barnets
      uppväxt.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0096
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 675
    - 1237
    expected_text: I Finland kan barn konfirmera sig det år de fyller 15. Konfirmationen är en ceremoni
      som hålls i kyrkan. Där bekräftas den ungas kristna tro och medlemskapet i församlingen. Konfirmationen
      föregås av en skriftskola som innehåller religionsundervisning och som nuförtiden ofta hålls i form
      av ett sommarläger. En stor del av de unga deltar i skriftskollägret och konfirmationen för att
      det är roligt på lägret, för att föräldrarna förväntar sig att barnen ska göra det och för att det
      efter konfirmationen ordnas en fest hemma där den unga får presenter.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0097
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 1237
    - 1494
    expected_text: En del unga deltar vid samma ålder i ett Prometheus-läger som är ett religiöst och
      politiskt obundet livssynsläger. Lägrets syfte är att uppmuntra de unga till att utveckla sin egen
      livssyn. Efter lägret hålls en fest hemma där den unga får presenter.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0098
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 1511
    - 1984
    expected_text: När en ung människa gått igenom gymnasiet och klarat studentskrivningarna får hon avgångsbetyg
      från gymnasiet och ett studentbetyg. Med betyget kan hon ansöka om studieplats vid ett universitet
      eller en högskola. Studentexamen firas både i skolan och hemma hos studenten. I skolan får den unga
      sitt betyg och en studentmössa. Hemma väntar en kaffebjudning och presenter. Släktingar och vänner
      är inbjudna. De som utexamineras från yrkesskolor firar likadana fester.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0099
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 2629
    - 2943
    expected_text: I Finland firas framför allt barns födelsedagar. Barnen kan bjuda in sina kompisar
      på kalas. Många firar också med familj, släktingar och faddrar. På kalasen leker man, äter kaka
      och ger presenter. Även vuxna kan ordna kalas för att fira sin födelsedag, särskilt när de fyller
      jämna år som 50, 60 eller 70.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0100
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 2957
    - 3487
    expected_text: När en människa dör ordnar släktingarna begravning i en kyrka, ett kapell eller någon
      annan lokal. Till begravningen kommer familj och släktingar, den dödas vänner och ibland också arbetskamrater.
      Efter den kyrkliga förrättningen samlas begravningsföljet till en minnesstund där man äter och dricker
      kaffe och minns den avlidne, alltså den som dött. I Finland kan begravningen ordnas enligt den religion
      som den avlidne hörde till. Begravningen kan också vara sekulär, om den avlidne inte hörde till
      något religiöst samfund.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0155
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 21
    source_range:
    - 2088
    - 2615
    expected_text: Vid vigseln är ofta släktingar och vänner närvarande. Många ordnar en bröllopsfest
      efteråt där man äter, dansar och firar brudparet med olika programnummer. Till programmet hör ofta
      tal, lekar och uppträdanden. Brudparet får presenter. Bröllop är privata tillställningar dit man
      kan gå bara om man är bjuden. Eftersom det bjuds mat och dryck på bröllopsfesten kan det bli väldigt
      dyrt att ordna bröllop. Därför bjuder de flesta inte alla sina bekanta till bröllopet. Många par
      åker på bröllopsresa efter bröllopsfesten.
    selection_reason: Preserve additional cultural explanation; complete contiguous sentences, omit only
      neighbouring undated statistic or duplicate narrative.
