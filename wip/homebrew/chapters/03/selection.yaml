    source_path: data/orientation_guide.pdf
    pdf_page: 19
    source_range:
    - 925
    - 1286
    expected_text: På midsommaren tänds stora brasor på stränder och klippor. Brasorna är en gammal tradition
      som ursprungligen var till för att avvärja ondska. På midsommaren pryds dörrposterna med små björkar.
      Människor sysslar också lekfullt med midsommartrolldom. Syftet med den var tidigare att trygga en
      god skörd och ta reda på vem man skulle gifta sig med och när.
