    - 1148
    expected_text: I februari firas sportlov i finländska skolor. Då har barnen en vecka ledigt från skolan.
      Sportlovet har firats sedan 1930-talet. Ursprungligen var det meningen att barnen skulle få motion
      och kunna skida hela veckan. Nuförtiden skidas det mindre, men många far till exempel och skida
      slalom. Sportlovet firas olika veckor i olika delar av Finland, från mitten av februari framåt.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0087
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 18
    source_range:
    - 2738
    - 3026
    expected_text: I början av juni får skoleleverna i Finland sommarlov. Läsårets slut firas vid skolans
      vårfest, dit också föräldrarna är bjudna. På vårfesten sjungs ofta sommarpsalmen Den blomstertid
      nu kommer. Barnens sommarlov fortsätter till mitten av augusti och varar alltså ungefär tio veckor.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0088
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 19
    source_range:
    - 1851
    - 2218
    expected_text: I slutet av oktober firas Halloween, som är en ganska ny fest i Finland. Halloween
      är ursprungligen en irländsk-amerikansk fest. Nuförtiden går en del barn också i Finland från dörr
      till dörr utklädda i maskeraddräkter och ber om godis. Skolorna har också halloween-fester för barnen.
      En del ställer prydnadspumpor med ljus inuti i fönstren eller utanför dörren.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0089
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 20
    source_range:
    - 416
    - 655
    expected_text: Under december firas lillajulsfester i skolor, på arbetsplatser, bland studerande och
      i föreningar. Julen firas i Finland vanligen inom familjen, men lillajulsfesterna firas tillsammans
      med arbets- och skolkamrater och andra grupper.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0090
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 20
    source_range:
    - 655
    - 1066
    expected_text: Lillajulsfesterna är avslappnade och informella till sin karaktär. Vid dem bjuds första
      gången på julmat, framför allt risgrynsgröt och glögg. På vuxnas lillajulsfester klär man sig i
      festkläder, äter gott och dricker ofta alkohol. På barnens fester i skolor och hobbygrupper äter
      man gott och delar ut lillajulspresenter. Var och en hämtar ett litet paket och får sedan ett litet
      paket att ta med sig hem.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0091
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 20
    source_range:
    - 1095
    - 1369
    expected_text: Några dagar före julen börjar skolornas jullov. I skolan firas först en julfest där
      barnen uppträder till exempel med sång. Barnen får julbetyg och sedan börjar jullovet som varar
      i cirka två veckor. Det är slutet på skolornas hösttermin. Efter lovet börjar vårterminen.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
  - id: hb-c03-u0092
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 20
    source_range:
    - 2218
    - 2637
    expected_text: I dagens Finland firas åtminstone i större städer också andra fester, som invandrare
      hämtat med sig. Sådana fester är till exempel det kinesiska nyåret, det persiska eller kurdiska
      nyåret nowruz och muslimernas fastemånad ramadan. Under ramadan får vuxna muslimer inte äta eller
      dricka på dagen innan solen gått ner. Ramadan avslutas med den stora id-festen, då man samlas till
      festbord med vänner och släktingar.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
- id: hb-c03-livets-fester
  title: Fester genom livet
  blocks:
