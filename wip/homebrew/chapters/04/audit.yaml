gaps:
- topic: European Council explanation
  source_refs:
  - det-finlandska-forvaltningssystemet:b0064
  reason: The source calls EU national leaders Europaradet. No replacement explanation in inspected three
    sources; Commission sentences retained unchanged.
- topic: Citizen initiative signature threshold
  source_refs:
  - olika-satt-att-delta-och-paverka:b0039
  - textbook:PDF134
  reason: Both accounts say more than50000 and omit time condition. Hold threshold sentence rather than
    import legal details from outside permitted learner sources.
- topic: Public hearings
  source_refs:
  - olika-satt-att-delta-och-paverka:b0037
  reason: Full paragraph is Finnish despite Swedish page; translation is deferred. Participation and consultation
    examples remain in other selected passages.
- topic: Fundraising exceptions
  source_refs:
  - foreningsverksamhet:b0024
  reason: Absolute no-collection-without-permit claim lacks qualifications in inspected sources; omit
    rather than restate uncertain rule.
resolutions:
- topic: Voting eligibility
  source_refs:
  - val-i-finland:b0052
  - elections-and-voting-in-finland:b0018-b0031
  decision: Use explicit Finland/EU/Iceland/Norway and other-country two-year conditions; retain Helsinki
    and Aland exceptions.
- topic: Presidential terms
  source_refs:
  - val-i-finland:b0065
  - elections-and-voting-in-finland:b0047
  decision: Use consecutive-term qualification without suggesting a lifetime maximum.
snapshot_sensitive_passages:
- Party profiles, party counts, electoral boundaries, member counts and institutional responsibilities
  reflect fixed archives.
- Electoral residence days, initiative rules and association governance are source summaries rather than
  exhaustive law.
visual_review:
  decision: No visual selected. Explanations are complete prose/list passages; no dangling image references.
  evidence: Website illustrations are remote and absent locally. Textbook additive selection is a complete
    plain paragraph on PDF124.
