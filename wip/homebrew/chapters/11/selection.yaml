- id: hb-c11-miljo
  title: Miljöansvar och naturskydd
  blocks:
  - id: hb-c11-u0192
    kind: paragraph
    source_path: data/orientation/sv/laromedel/vardagen/praktiska-fragor-om-boende.html
    source_block: b0060
  - id: hb-c11-u0193
    kind: paragraph
    source_path: data/orientation/sv/laromedel/vardagen/praktiska-fragor-om-boende.html
    source_block: b0061
  - id: hb-c11-u0194
    kind: paragraph
    source_path: data/orientation/sv/laromedel/vardagen/praktiska-fragor-om-boende.html
    source_block: b0062
  - id: hb-c11-u0195
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 6
    source_range:
    - 1575
    - 2049
    expected_text: Naturen skyddas för att man vill bevara djur- och växtarter och skydda naturens mångfald
      mot påverkan från mänsklig verksamhet. Mångfald i naturen betyder att det finns så många olika arter
      av djur, växter och andra organismer som möjligt. Människans verksamhet orsakar förändringar i den
      naturliga miljön; förstöring, förorening, nedskräpning och övergödning samt utrotning av arter.
      Miljöskyddslagen förebygger förstöring av natur och miljö och motverkar miljöskador.
    selection_reason: Add textbook subsection1.1 nature protection, biodiversity and animal welfare; preserve
      complete paragraph.
  - id: hb-c11-u0196
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 6
    source_range:
    - 2051
    - 2317
    expected_text: I Finland skyddas naturen av finsk lag, EU-lagstiftning, statliga myndigheter och olika
      frivilligorganisationer. Miljöministeriet grundades i Finland redan år 1983. Det övervakar bland
      annat att naturresurserna utnyttjas hållbart och att naturens mångfald bevaras.
    selection_reason: Add textbook subsection1.1 nature protection, biodiversity and animal welfare; preserve
      complete paragraph.
  - id: hb-c11-u0197
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 6
    source_range:
    - 2319
    - 2835
    expected_text: I Finland ska både vilda djur, husdjur och sällskapsdjur behandlas etiskt och korrekt.
      Djurskyddslagen främjar djurens välmående och en bra behandling av djuren i Finland. I lagen fastslås
      bland annat hur djur ska skötas, uppfödas och slaktas och i hurudana omständigheter djuren inte
      får hållas. Myndigheterna övervakar uppfödningen av produktionsdjur, alltså till exempel kor, svin
      och höns. I Finland hör hundar och katter till de vanligaste sällskapsdjuren. Både människor i städer
      och på landet har sådana.
    selection_reason: Add textbook subsection1.1 nature protection, biodiversity and animal welfare; preserve
      complete paragraph.
