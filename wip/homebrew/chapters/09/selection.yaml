    expected_text: På 1800-talet föddes kvinnosaksrörelsen i Europa och Förenta staterna. Den strävade
      till att främja likställdhet mellan kvinnor och män. I Finland fastslogs år 1864 en lag som befriade
      ogifta kvinnor från förmyndarskap. De fick alltså börja bestämma om sina egna angelägenheter. Men
      gifta kvinnor var fortfarande underställda sin mans förmyndarskap.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
