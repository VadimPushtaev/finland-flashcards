    source_range:
    - 155
    - 467
    expected_text: I Finland finns det två arvsskatteklasser. Den avlidnes närmaste släktingar, till exempel
      barn, barnbarn och make eller maka, betalar mindre skatt på sina respektive arv. Om arvingen är
      mer avlägset släkt eller inte alls släkt med den avlidne, är skatten högre. Skatteprocenten är också
      högre ju större arvet är.
    selection_reason: Retain taxclasses, kinship and size principles; omit initial undated20000euro threshold.
