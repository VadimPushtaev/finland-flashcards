- id: hb-c07-arbetsavtal
  title: Arbetsavtal och anställningsformer
  blocks:
  - id: hb-c07-u0293
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 89
    source_range:
    - 1251
    - 1716
    expected_text: Innan arbetstagaren börjar i det nya arbetet ingår hen ett arbetsavtal med arbetsgivaren.
      Arbetsavtalet ingås vanligen skriftligt, men även ett muntligt avtal är giltigt enligt lagen. Arbetsgivaren
      måste dock alltid ge avtalsvillkoren i skriftlig form om arbetstagaren ber om det. Det är att rekommendera
      att avtalet ingås skriftligt. Då kan båda parterna hålla koll på de överenskomna sakerna och i problemsituationer
      kan man hänvisa till avtalets innehåll.
    selection_reason: Complete textbook paragraph explicitly preserves legal validity of oral contracts
      and recommends written agreement. Replaces website paragraph with unconditional always-two-signed-copies
      wording.
