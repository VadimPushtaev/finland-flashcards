- id: hb-c07-arbetsmarknad
  title: Arbetsmarknaden och sysselsättning
  blocks:
  - id: hb-c07-u0013
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 78
    source_range:
    - 194
    - 757
    expected_text: Arbetsmarknaden betyder marknaden mellan arbetsgivare och arbetstagare, där arbetstagarna
      söker arbete och arbetsgivarna erbjuder arbete. När en arbetsgivare erbjuder ett arbete åt en arbetstagare
      gör de upp ett arbetsavtal och kommer i ett anställningsförhållande till varandra. Arbetsmarknaden
      är en viktig del av samhället, som man försöker påverka genom politik och annat beslutsfattande.
      På arbetsmarknaden verkar olika människor i olika ställningar samt många slag av institutioner.
      Arbetsmarknaden styrs av lagar, avtal och näringslivets konjunkturer.
    selection_reason: Complete additive paragraph explaining the labour market and its negotiated institutions;
      only PDF whitespace normalized.
  - id: hb-c07-u0014
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 78
    source_range:
    - 1139
    - 1600
    expected_text: Den finländska arbetsmarknaden styrs av en kultur av demokratiskt förhandlande och
      överenskommande. På arbetsmarknaden representeras enskilda människor av institutioner, till exempel
      intresseorganisationer. De förhandlar och kommer överens om arbetsmarknadens regler och åtgärder,
      som lönenivå, arbetstider, åtgärder som förbättrar sysselsättningen och liknande. Det här systemet
      kallas arbetsmarknadssystemet och det har fått sin nuvarande form efter hand.
    selection_reason: Complete additive paragraph explaining the labour market and its negotiated institutions;
      only PDF whitespace normalized.
