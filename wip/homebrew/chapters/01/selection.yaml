- id: hb-c01-flyttning
  title: Ut- och invandring
  blocks:
  - id: hb-c01-u0060
    kind: paragraph
    source_path: data/orientation/sv/laromedel/manniskorna-och-kulturen/finlands-befolkning.html
    source_block: b0019
    source_range:
    - 0
    - 545
    expected_text: Tidigare var Finland ett fattigt land, som många flyttade ifrån till andra länder för
      att hitta arbete och få ett bättre liv. På 1800-talet flyttade finländare i synnerhet till Nordamerika.
      Efter andra världskriget började finländarna i allt högre grad flytta från landet till städerna.
      Många flyttade utomlands för arbete, eftersom det inte fanns arbete för alla i Finland. På 1960-
      och 1970-talen flyttade som mest tiotusentals finländare till Sverige varje år för att få arbete.
      Finländarna var länge den största gruppen nyanlända i Sverige.
    selection_reason: Omit final undated number of people in Sweden with Finnish ancestry; historical
      migration explanation retained.
  - id: hb-c01-u0061
    kind: paragraph
    source_path: data/orientation/sv/laromedel/manniskorna-och-kulturen/finlands-befolkning.html
    source_block: b0020
    source_range:
    - 0
    - 215
    expected_text: En större invandring till Finland började egentligen först efter kalla krigets slut
      i början av 1990-talet. Till följd av Sovjetunionens fall flyttade ryssar och ester samt också somaliska
      asylsökande till Finland.
    selection_reason: Omit final sentence with undated Ingrian count;1990s migration explanation retained.
