    source_block: b0033
    source_range:
    - 0
    - 251
    expected_text: Samerna är den enda erkända ursprungsbefolkningen inom Europeiska unionen. Ursprungsbefolkning
      avser en människogrupp med starka rötter i de områden som den traditionellt har befolkat och i naturen.
      Gruppen har sina egna språk, seder och traditioner.
    selection_reason: Keep definition of Sami as an indigenous people; legal rights, Sami languages and
      self-government retained in pilot.
  - id: hb-c01-u0051
    kind: paragraph
    source_path: data/orientation/sv/laromedel/manniskorna-och-kulturen/finlands-befolkning.html
    source_block: b0040
  - id: hb-c01-u0052
    kind: paragraph
