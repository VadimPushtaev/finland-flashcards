    expected_text: I Finland finns det två nationalspråk, finska och svenska. Omkring 85 procent av finländarna
      hade år 2023 finska som modersmål. De svenskspråkiga i Finland utgjorde omkring fem procent av befolkningen.
    selection_reason: Retain national-language identification and dated2023 proportions. Full rights and
