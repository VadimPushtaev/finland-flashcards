- id: hb-c01-natur
  title: Natur och friluftsliv
  blocks:
  - id: hb-c01-u0023
    kind: paragraph
    source_path: data/orientation_guide.pdf
    pdf_page: 6
    source_range:
    - 54
    - 545
    expected_text: Finland är ett glesbebyggt land med mycket skogar och sjöar samt orörd natur. Finländarna
      uppskattar naturen och vistas gärna i den. Många människor gillar till exempel fiske, terrängcykling,
      vinterbadande och vandring. Det är inte långt till skogen ens i huvudstaden. Städerna har också
      många parker och andra grönområden där man kan vistas. För finländarna är en snygg och ren natur
      och miljö viktiga. Att skräpa ner anses hänsynslöst och oartigt och man kan också bötfällas för
      det.
    selection_reason: Additive complete textbook paragraph; preserve substantive wording and normalize
      whitespace only.
