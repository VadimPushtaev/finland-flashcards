    expected_text: År 2020 bodde 73 procent av invånarna i Finland i städer. Jämfört med många andra europeiska
      länder urbaniserades Finland sent. Den snabba urbaniseringen började i Finland först efter andra
      världskriget på 1950-talet.
    selection_reason: Retain dated2020 urbanisation and historical explanation; omit final undated count
      of cities.
