  - id: hb-c01-u0053
    kind: paragraph
    source_path: data/orientation/sv/laromedel/manniskorna-och-kulturen/finlands-befolkning.html
    source_block: b0049
    source_range:
    - 0
    - 198
    expected_text: Tatarerna är ett turkfolk och det äldsta muslimska samfundet i Finland. Tatarerna kom
      till Finland ursprungligen från Ryssland i slutet av 1800-talet och början av 1900-talet främst
      som handelsmän.
    selection_reason: Retain origin and oldest Muslim-community history; omit undated count and following
      isolated present-language claim.
  - id: hb-c01-u0054
    kind: paragraph
    source_path: data/orientation/sv/laromedel/manniskorna-och-kulturen/finlands-befolkning.html
    source_block: b0051
    source_range:
    - 0
    - 344
    expected_text: Judar flyttade till Finland ursprungligen från Ryssland på 1830-talet. De har två församlingar,
      en i Åbo och en i Helsingfors. I Helsingfors finns också ett judiskt daghem och en judisk samskola.
      De finska judarnas modersmål var på 1800-talet till stor del jiddisch och senare svenska. I dag
      talar de finska och flera andra språk som hemspråk.
    selection_reason: Omit only final undated Jewish population estimate.
  - id: hb-c01-u0064
    kind: paragraph
    source_path: data/orientation/sv/laromedel/manniskorna-och-kulturen/finlands-befolkning.html
    source_block: b0053
    source_range:
    - 0
    - 67
    expected_text: Karelska språket är det språk som är närmast besläktat med finskan.
    selection_reason: Retain complete first sentence on language relatedness; omit intervening undated
      population estimate and retain following context separately.
  - id: hb-c01-u0055
    kind: paragraph
    source_path: data/orientation/sv/laromedel/manniskorna-och-kulturen/finlands-befolkning.html
    source_block: b0053
    source_range:
    - 158
    - 440
    expected_text: Personer som talade karelska placerades på olika håll i Finland efter andra världskriget,
      när deras gamla hembygder blev en del av Sovjetunionen till följd av kriget. Karelska talas numera
      i Finland och Ryssland. Personer som talar karelska hör i allmänhet till den ortodoxa kyrkan.
    selection_reason: Keep postwar resettlement and language/religion context; omit undated speaker estimate.
      Language-family sentence retained in separate preceding block.
