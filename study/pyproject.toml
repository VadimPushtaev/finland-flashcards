[tool.poetry]
name = "homebrew-study"
version = "0.1.0"
description = "Swedish Homebrew study reader"
authors = ["Vadim Pushtaev <pushtaev.vm@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115,<1"
uvicorn = ">=0.34,<1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
httpx = "^0.28"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
