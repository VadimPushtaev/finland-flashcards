name: Check generated outputs up to date

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install deps
        run: |
          poetry install --no-interaction --no-root

      - name: Rebuild generated files
        run: |
          make
          make kahoot

      - name: Verify generated files are unchanged
        run: |
          fail=0

          check_file_clean () {
            local path="$1"
            if git diff --quiet -- "$path" && [ -z "$(git status --porcelain -- "$path")" ]; then
              echo "$path is up to date."
            else
              echo "$path is stale. Please regenerate and commit the result." >&2
              git status --porcelain -- "$path" || true
              git --no-pager diff --unified=0 -- "$path" || true
              fail=1
            fi
          }

          check_dir_clean () {
            local path="$1"
            if git diff --quiet -- "$path" && [ -z "$(git status --porcelain -- "$path")" ]; then
              echo "$path is up to date."
            else
              echo "$path is stale. Please regenerate and commit the result." >&2
              git status --porcelain -- "$path" || true
              git --no-pager diff --name-only -- "$path" || true
              fail=1
            fi
          }

          check_file_clean "cards/ALL.txt"
          check_dir_clean "kahoot"
          exit "$fail"
