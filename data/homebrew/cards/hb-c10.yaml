schema_version: 1
chapter_id: hb-c10
language: sv
cards:
- id: hb-c10-valfard-0001
  section_id: hb-c10-valfard
  category: "Välfärd och social trygghet"
  question: "Vilket är ett centralt mål för den nordiska välfärdsstaten?"
  options:
  - id: a0
    text: "Att trygga förutsättningar för ett människovärdigt liv"
  - id: a1
    text: "Att göra all social hjälp beroende av släktingars gåvor"
  - id: a2
    text: "Att bara ge stöd till personer med fast heltidsarbete"
  - id: a3
    text: "Att ersätta offentliga tjänster med obligatoriska privata avtal"
  correct_option_id: a0
- id: hb-c10-valfard-0002
  section_id: hb-c10-valfard
  category: "Välfärd och social trygghet"
  question: "Varför är fri debatt om skatter och välfärdstjänster viktig i en demokrati?"
  options:
  - id: a0
    text: "Den ger varje invånare rätt att ensam bestämma statens budget."
  - id: a1
    text: "Människor kan jämföra politiska alternativ och påverka gemensamma val."
  - id: a2
    text: "Den gör att lagar automatiskt upphör när någon är missnöjd."
  - id: a3
    text: "Den innebär att bara ett parti får diskutera offentliga tjänster."
  correct_option_id: a1
- id: hb-c10-valfard-0003
  section_id: hb-c10-valfard
  category: "Välfärd och social trygghet"
  question: "Vad är FPA:s huvudsakliga roll i socialskyddet?"
  options:
  - id: a0
    text: "Att avgöra alla vårdnadstvister i tingsrätten"
  - id: a1
    text: "Att besluta vilka partier som får delta i val"
  - id: a2
    text: "Att pröva och betala lagstadgade sociala förmåner"
  - id: a3
    text: "Att ordna alla kommuners läkarjour"
  correct_option_id: a2
- id: hb-c10-valfard-0004
  section_id: hb-c10-valfard
  category: "Välfärd och social trygghet"
  question: "Vad används FPA-kortet normalt till på apotek och anslutna privata vårdställen?"
  options:
  - id: a0
    text: "Att få varje privat behandling helt gratis"
  - id: a1
    text: "Att ersätta ett pass vid resor utanför EU"
  - id: a2
    text: "Att bevisa att alla familjemedlemmar har samma vårdrätt"
  - id: a3
    text: "Att få direktersättning för kostnader som omfattas av ersättningen"
  correct_option_id: a3
- id: hb-c10-valfard-0005
  section_id: hb-c10-valfard
  category: "Välfärd och social trygghet"
  question: "Ger bosättning eller arbete i Finland automatiskt rätt till varje FPA-förmån?"
  options:
  - id: a0
    text: "Nej, FPA prövar den egna situationen och villkoren för varje förmån."
  - id: a1
    text: "Ja, ett finländskt telefonnummer räcker för alla förmåner."
  - id: a2
    text: "Ja, varje anställning ger alla förmåner utan ansökan."
  - id: a3
    text: "Nej, enbart finska medborgare kan få någon förmån."
  correct_option_id: a0
- id: hb-c10-valfard-0006
  section_id: hb-c10-valfard
  category: "Välfärd och social trygghet"
  question: "Vad kan FPA beakta vid bedömningen av stadigvarande bosättning efter en flytt till Finland?"
  options:
  - id: a0
    text: "Enbart vilket mobilabonnemang personen väljer."
  - id: a1
    text: "Att personen återvänder till Finland efter att ha bott utomlands."
  - id: a2
    text: "Enbart om personen handlar i finländska butiker."
  - id: a3
    text: "Enbart vilken bank personen använder utomlands."
  correct_option_id: a1
- id: hb-c10-valfard-0007
  section_id: hb-c10-valfard
  category: "Välfärd och social trygghet"
  question: "Vilket lands socialskydd omfattar en studerande från ett annat EU-land i Finland vanligen?"
  options:
  - id: a0
    text: "Alltid Finlands från första studiedagen."
  - id: a1
    text: "Alltid båda ländernas alla förmåner samtidigt."
  - id: a2
    text: "Det tidigare hemlandets socialskydd."
  - id: a3
    text: "Inget lands socialskydd under studietiden."
  correct_option_id: a2
- id: hb-c10-utkomststod-0001
  section_id: hb-c10-utkomststod
  category: "Utkomststöd"
  question: "Vilken ställning har utkomststödet i förhållande till andra inkomster och förmåner?"
  options:
  - id: a0
    text: "Det ersätter alla andra förmåner utan inkomstprövning."
  - id: a1
    text: "Det betalas alltid ut som en lika stor gåva till varje vuxen."
  - id: a2
    text: "Det får bara sökas av personer som aldrig har arbetat."
  - id: a3
    text: "Det är behovsprövat stöd i sista hand; andra förmåner söks först."
  correct_option_id: a3
- id: hb-c10-utkomststod-0002
  section_id: hb-c10-utkomststod
  category: "Utkomststöd"
  question: "Vem kan bevilja kompletterande eller förebyggande utkomststöd utöver FPA:s grundläggande stöd?"
  options:
  - id: a0
    text: "Det egna välfärdsområdets socialservice."
  - id: a1
    text: "Arbetslöshetskassan."
  - id: a2
    text: "Arbetspensionsbolaget."
  - id: a3
    text: "Skatteförvaltningen."
  correct_option_id: a0
- id: hb-c10-folkhalsa-0001
  section_id: hb-c10-folkhalsa
  category: "Hälsa och förebyggande arbete"
  question: "Varför begränsar tobakslagen rökning på vissa platser?"
  options:
  - id: a0
    text: "För att skydda hälsan, även hos dem som utsätts för andras rök"
  - id: a1
    text: "För att rökning annars automatiskt ger rätt till sjukpension"
  - id: a2
    text: "För att endast kommunanställda får använda offentliga platser"
  - id: a3
    text: "För att varje utomhusvistelse kräver ett särskilt röktillstånd"
  correct_option_id: a0
- id: hb-c10-folkhalsa-0002
  section_id: hb-c10-folkhalsa
  category: "Hälsa och förebyggande arbete"
  question: "Vad är ett mål med skolans undervisning i hälsokunskap?"
  options:
  - id: a0
    text: "Att göra varje elev till behörig läkare efter grundskolan"
  - id: a1
    text: "Att låta skolan bestämma all behandling utan vårdnadshavare eller vård"
  - id: a2
    text: "Att stärka elevernas kunskaper om hälsa, välbefinnande och säkerhet"
  - id: a3
    text: "Att ersätta alla personliga besök i hälso- och sjukvården"
  correct_option_id: a2
- id: hb-c10-folkhalsa-0003
  section_id: hb-c10-folkhalsa
  category: "Hälsa och förebyggande arbete"
  question: "Vad gäller barnvaccinationer i det nationella vaccinationsprogrammet?"
  options:
  - id: a0
    text: "De får enbart ges efter ett beslut från tingsrätten."
  - id: a1
    text: "De är frivilliga och avgiftsfria och ges via rådgivning och skola."
  - id: a2
    text: "De är obligatoriska och betalas alltid privat."
  - id: a3
    text: "De ges bara till barn som redan har haft sjukdomen."
  correct_option_id: a1
- id: hb-c10-folkhalsa-0004
  section_id: hb-c10-folkhalsa
  category: "Hälsa och förebyggande arbete"
  question: "Vad gäller saknade vaccinationer i vaccinationsprogrammet när någon flyttar stadigvarande till Finland?"
  options:
  - id: a0
    text: "De måste alltid betalas helt privat."
  - id: a1
    text: "De kan kompletteras först efter finskt medborgarskap."
  - id: a2
    text: "De får bara ges i det tidigare hemlandet."
  - id: a3
    text: "De kan kompletteras kostnadsfritt."
  correct_option_id: a3
- id: hb-c10-folkhalsa-0005
  section_id: hb-c10-folkhalsa
  category: "Hälsa och förebyggande arbete"
  question: "Kan minderåriga och gravida som söker asyl få vaccinationer enligt det nationella programmet?"
  options:
  - id: a0
    text: "Ja, enligt de gällande vaccinationsanvisningarna."
  - id: a1
    text: "Nej, de måste alltid vänta tills medborgarskap beviljats."
  - id: a2
    text: "Ja, men bara om de har ett finländskt arbetsavtal."
  - id: a3
    text: "Nej, programmet gäller endast personer födda i Finland."
  correct_option_id: a0
- id: hb-c10-vard-0001
  section_id: hb-c10-vard
  category: "Offentlig och privat hälsovård"
  question: "Är all offentlig hälsovård avgiftsfri i Finland?"
  options:
  - id: a0
    text: "Ja, om patienten bokar tiden per telefon."
  - id: a1
    text: "Nej, en del tjänster är gratis och andra har reglerade klientavgifter."
  - id: a2
    text: "Ja, varje offentlig tjänst är alltid gratis för alla."
  - id: a3
    text: "Nej, alla offentliga tjänster har samma privata marknadspris."
  correct_option_id: a1
- id: hb-c10-vard-0002
  section_id: hb-c10-vard
  category: "Offentlig och privat hälsovård"
  question: "Hur många välfärdsområden finns i Finland, utöver Helsingfors särskilda ordning?"
  options:
  - id: a0
    text: "22"
  - id: a1
    text: "24"
  - id: a2
    text: "21"
  - id: a3
    text: "19"
  correct_option_id: a2
- id: hb-c10-vard-0003
  section_id: hb-c10-vard
  category: "Offentlig och privat hälsovård"
  question: "Vilken undersökning hör till tjänster som kan ordnas via en hälsocentral?"
  options:
  - id: a0
    text: "Körprov för körkort."
  - id: a1
    text: "Laboratorieundersökning."
  - id: a2
    text: "Bostadsbesiktning."
  - id: a3
    text: "Språkprov för medborgarskap."
  correct_option_id: a1
- id: hb-c10-vard-0004
  section_id: hb-c10-vard
  category: "Offentlig och privat hälsovård"
  question: "Måste varje besvär på en hälsostation behandlas av en läkare?"
  options:
  - id: a0
    text: "Nej, sjukskötare kan behandla många sjukdomar och besvär."
  - id: a1
    text: "Ja, sjukskötare får bara sköta tidsbokningen."
  - id: a2
    text: "Ja, även enkel vård kräver alltid läkarbesök."
  - id: a3
    text: "Nej, men bara om patienten har privat försäkring."
  correct_option_id: a0
- id: hb-c10-vard-0005
  section_id: hb-c10-vard
  category: "Offentlig och privat hälsovård"
  question: "Hur får man normalt tid till specialiserad offentlig sjukvård?"
  options:
  - id: a0
    text: "Genom att alltid boka valfri specialist direkt utan bedömning"
  - id: a1
    text: "Enbart genom arbetsgivarens personliga tillstånd"
  - id: a2
    text: "Bara genom att betala en högre skatt i förväg"
  - id: a3
    text: "Efter bedömning och remiss när sådan behövs"
  correct_option_id: a3
- id: hb-c10-vard-0006
  section_id: hb-c10-vard
  category: "Offentlig och privat hälsovård"
  question: "Vad bör du göra vid brådskande vårdbehov utanför hälsostationens öppettid, utan omedelbar livsfara?"
  options:
  - id: a0
    text: "Kontakta jourrådgivningen och följ anvisningarna."
  - id: a1
    text: "Vänta alltid till nästa vardag oavsett hur du mår."
  - id: a2
    text: "Beställ alltid ambulans enbart för att slippa väntetid."
  - id: a3
    text: "Åk till valfri specialist utan att först fråga om vårdbehovet."
  correct_option_id: a0
- id: hb-c10-vard-0007
  section_id: hb-c10-vard
  category: "Offentlig och privat hälsovård"
  question: "Vad innebär vårdgarantin i den offentliga hälsovården?"
  options:
  - id: a0
    text: "Privat vård blir automatiskt gratis vid varje väntetid."
  - id: a1
    text: "Icke-brådskande vård ska ges inom lagens tidsgränser efter bedömning."
  - id: a2
    text: "Alla får välja exakt samma behandling utan medicinsk bedömning."
  - id: a3
    text: "Varje patient ska alltid få vård samma minut som hen ringer."
  correct_option_id: a1
- id: hb-c10-tillgang-0001
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Vad innebär en hemkommun i Finland för tillgången till offentlig hälso- och sjukvård?"
  options:
  - id: a0
    text: "Den ger rätt att använda den offentliga vården."
  - id: a1
    text: "Den ger bara tillgång till privat vård."
  - id: a2
    text: "Den ersätter behovet av vårdbedömning."
  - id: a3
    text: "Den ger vårdrätt först efter finskt medborgarskap."
  correct_option_id: a0
- id: hb-c10-tillgang-0002
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Kan rätt till offentlig vård finnas utan hemkommun i Finland?"
  options:
  - id: a0
    text: "Nej, inget undantag är möjligt."
  - id: a1
    text: "Ja, men enbart om man äger en bostad."
  - id: a2
    text: "Nej, inte ens en lagstadgad vårdrätt får beaktas."
  - id: a3
    text: "Ja, till exempel genom arbete eller internationella regler."
  correct_option_id: a3
- id: hb-c10-tillgang-0003
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Får en person utan vanlig rätt till offentlig vård ändå akut vård?"
  options:
  - id: a0
    text: "Ja, men kostnadsansvaret bedöms separat."
  - id: a1
    text: "Nej, hemkommun måste alltid registreras först."
  - id: a2
    text: "Ja, och vården är därför alltid helt gratis."
  - id: a3
    text: "Nej, om personen saknar ett finländskt bankkonto."
  correct_option_id: a0
- id: hb-c10-tillgang-0004
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Är barnets hemkommun den enda möjliga grunden för offentlig vård?"
  options:
  - id: a0
    text: "Ja, inget barn utan hemkommun kan få vård."
  - id: a1
    text: "Nej, men undantag gäller enbart barn över arton år."
  - id: a2
    text: "Ja, även akut vård kräver hemkommun."
  - id: a3
    text: "Nej, även till exempel minderåriga asylsökande har vårdrätt."
  correct_option_id: a3
- id: hb-c10-tillgang-0005
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Vilket är huvudregeln för vård av en beslutskapabel patient?"
  options:
  - id: a0
    text: "Vården ges i samförstånd; patienten kan samtycka eller avstå."
  - id: a1
    text: "Vårdpersonalen får alltid bortse från patientens vilja."
  - id: a2
    text: "Släkten bestämmer alltid över en vuxen patients samtycke."
  - id: a3
    text: "Samtycke behövs bara vid privat finansierad vård."
  correct_option_id: a0
- id: hb-c10-tillgang-0006
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Vad kan en patient göra om patientjournalen innehåller felaktiga uppgifter?"
  options:
  - id: a0
    text: "Bara be sin arbetsgivare att skriva om journalen"
  - id: a1
    text: "Begära att få se uppgifterna och begära rättelse hos vårdgivaren"
  - id: a2
    text: "Själv radera alla uppgifter i hela vårdens databas"
  - id: a3
    text: "Kräva att alla andra patienters journaler lämnas ut"
  correct_option_id: a1
- id: hb-c10-tillgang-0007
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Gäller rätten till gott och jämlikt bemötande även i privat hälsovård?"
  options:
  - id: a0
    text: "Ja, men bara när patienten betalar kontant."
  - id: a1
    text: "Nej, den som köper vård avstår automatiskt från skyddet."
  - id: a2
    text: "Ja, patienträttigheter gäller även privata vårdgivare."
  - id: a3
    text: "Nej, privat vård står helt utanför patientlagstiftningen."
  correct_option_id: a2
- id: hb-c10-tillgang-0008
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Vad bör du göra om du behöver tolk för att förstå vården?"
  options:
  - id: a0
    text: "Ta alltid ett minderårigt barn som enda medicinska tolk"
  - id: a1
    text: "Avstå från att berätta om symtom du inte kan översätta själv"
  - id: a2
    text: "Utgå från att du inte får någon vård förrän du talar finska"
  - id: a3
    text: "Meddela vårdstället i förväg så att lämplig tolkning kan ordnas"
  correct_option_id: a3
- id: hb-c10-tillgang-0009
  section_id: hb-c10-tillgang
  category: "Tillgång till vård och patientens rättigheter"
  question: "Vem ger avgiftsfri vägledning om patienträttigheter, anmärkningar och patientskadeärenden?"
  options:
  - id: a0
    text: "Patientombudet"
  - id: a1
    text: "Enbart sjukhusets fastighetsmäklare"
  - id: a2
    text: "FPA:s studiestödshandläggare"
  - id: a3
    text: "Den privata försäkringssäljaren som beslutar alla vårdklagomål"
  correct_option_id: a0
- id: hb-c10-lakemedel-0001
  section_id: hb-c10-lakemedel
  category: "Läkemedel och munhälsovård"
  question: "Vad behöver du för att köpa ett receptbelagt läkemedel på apotek?"
  options:
  - id: a0
    text: "Ett giltigt recept."
  - id: a1
    text: "Enbart ett kvitto från ett tidigare köp."
  - id: a2
    text: "Enbart ett godkännande av arbetsgivaren."
  - id: a3
    text: "En bild av läkemedlet utan ordination."
  correct_option_id: a0
- id: hb-c10-lakemedel-0002
  section_id: hb-c10-lakemedel
  category: "Läkemedel och munhälsovård"
  question: "För vem är tandvårdsjouren avsedd?"
  options:
  - id: a0
    text: "Alla som vill boka en vanlig årskontroll snabbare."
  - id: a1
    text: "Enbart personer med privat tandförsäkring."
  - id: a2
    text: "Personer som behöver brådskande tandvård."
  - id: a3
    text: "Bara patienter som redan fått specialistremiss."
  correct_option_id: a2
- id: hb-c10-lakemedel-0003
  section_id: hb-c10-lakemedel
  category: "Läkemedel och munhälsovård"
  question: "Vad gäller offentlig tandvård för barn under 18 år?"
  options:
  - id: a0
    text: "Den är avgiftsfri; tandreglering kräver att vårdkriterierna uppfylls."
  - id: a1
    text: "All tandvård är alltid privat och betalas fullt av familjen."
  - id: a2
    text: "Enbart kosmetisk tandreglering är gratis."
  - id: a3
    text: "Avgiftsfriheten gäller bara barn med två gifta föräldrar."
  correct_option_id: a0
- id: hb-c10-lakemedel-0004
  section_id: hb-c10-lakemedel
  category: "Läkemedel och munhälsovård"
  question: "Vad bör du göra med oanvändbara eller föråldrade läkemedel?"
  options:
  - id: a0
    text: "Lägga dem löst i matavfallet"
  - id: a1
    text: "Ge dem till en bekant utan ordination"
  - id: a2
    text: "Lämna dem till apoteket enligt anvisningarna för läkemedelsavfall"
  - id: a3
    text: "Spola ned dem i toaletten"
  correct_option_id: a2
- id: hb-c10-lakemedel-0005
  section_id: hb-c10-lakemedel
  category: "Läkemedel och munhälsovård"
  question: "Får du beställa läkemedel per post från länder utanför EES och Nordirland till Finland?"
  options:
  - id: a0
    text: "Ja, om mängden räcker för högst en månad."
  - id: a1
    text: "Ja, om säljaren erbjuder fri frakt."
  - id: a2
    text: "Nej, sådan postbeställning är förbjuden."
  - id: a3
    text: "Ja, ett recept tillåter alltid postbeställningen."
  correct_option_id: a2
- id: hb-c10-psykisk-0001
  section_id: hb-c10-psykisk
  category: "Psykisk hälsa och stöd vid beroende"
  question: "Var kan man normalt börja söka professionell hjälp för psykiska besvär?"
  options:
  - id: a0
    text: "Bara genom ett godkännande från arbetsgivaren"
  - id: a1
    text: "På den egna hälsostationen, som bedömer behovet och vidare vård"
  - id: a2
    text: "Enbart hos polisen efter att ett brott har begåtts"
  - id: a3
    text: "Enbart på ett sjukhus efter två års symtom"
  correct_option_id: a1
- id: hb-c10-psykisk-0002
  section_id: hb-c10-psykisk
  category: "Psykisk hälsa och stöd vid beroende"
  question: "Vad bör man göra om psykiska besvär kräver brådskande vård?"
  options:
  - id: a0
    text: "Avbryta all vårdkontakt tills symtomen gått över"
  - id: a1
