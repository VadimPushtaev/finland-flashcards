  section_id: hb-c06-rattsstat
  category: "Rättsstaten och grundlagen"
  question: "Hur ska en brottsmisstänkt betraktas innan skulden lagligen har fastställts i Finland?"
  options:
  - id: a0
    text: "Som oskyldig"
  - id: a1
    text: "Som skyldig när polisen inleder en utredning"
  - id: a2
    text: "Som skyldig när åklagaren väcker åtal"
  - id: a3
    text: "Som skyldig om personen avstår från att uttala sig"
  correct_option_id: a0
- id: hb-c06-rattsstat-0006
  section_id: hb-c06-rattsstat
  category: "Rättsstaten och grundlagen"
  question: "Vad innebär det att Finland är en sekulär stat?"
  options:
  - id: a0
    text: "Religiösa regler ersätter lagen i familjeärenden."
  - id: a1
    text: "Medborgarnas religion avgör vilken strafflag som gäller."
  - id: a2
    text: "Landets lagstiftning grundas inte direkt på en religion."
  - id: a3
    text: "Landets största religionssamfund godkänner nya lagar."
  correct_option_id: a2
- id: hb-c06-rattsstat-0007
  section_id: hb-c06-rattsstat
  category: "Rättsstaten och grundlagen"
  question: "Hur gäller en EU-förordning i Finland?"
  options:
  - id: a0
    text: "Den blir bindande när varje kommun godkänner den."
  - id: a1
    text: "Den gäller efter att samma regler skrivits i en finsk lag."
  - id: a2
    text: "Den ger medlemsländerna en frivillig rekommendation."
  - id: a3
    text: "Den är direkt tillämplig i medlemsländerna."
  correct_option_id: a3
- id: hb-c06-rattsstat-0008
  section_id: hb-c06-rattsstat
  category: "Rättsstaten och grundlagen"
  question: "Hur genomförs ett EU-direktiv normalt i Finland?"
  options:
  - id: a0
    text: "Genom nationella regler som uppfyller direktivets mål"
  - id: a1
    text: "Genom beslut av EU-domstolen i varje enskilt medlemsland"
  - id: a2
    text: "Genom att direktivet automatiskt upphäver all nationell lag"
  - id: a3
    text: "Genom frivilliga rekommendationer utan rättslig verkan"
  correct_option_id: a0
- id: hb-c06-god-forvaltning-0001
