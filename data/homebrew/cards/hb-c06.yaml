  section_id: hb-c06-rattsskydd
  category: "Beslut, rättelse och tillsyn"
  question: "Vilka övervakar lagligheten i myndigheternas verksamhet i Finland?"
  options:
  - id: a0
    text: "Riksdagens talman och republikens president"
  - id: a1
    text: "Statsrådets kansli och riksdagens kansli"
  - id: a2
    text: "Riksdagens justitieombudsman och justitiekanslern"
  - id: a3
