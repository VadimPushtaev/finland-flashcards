  options:
  - id: a0
    text: "Den har lägre ställning än nyare lagar."
  - id: a1
    text: "Den gäller bara när andra lagar saknas."
  - id: a2
    text: "Den har högre ställning än andra lagar."
  - id: a3
    text: "Den har samma ställning som kommunala föreskrifter."
  correct_option_id: a2
