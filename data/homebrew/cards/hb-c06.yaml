- id: hb-c06-rattsstat-0001
  section_id: hb-c06-rattsstat
  category: "Rättsstaten och grundlagen"
  question: "Vad innebär det att Finland är en rättsstat?"
  options:
  - id: a0
    text: "Den offentliga makten måste ha stöd i lag."
  - id: a1
    text: "Regeringen får ersätta lagar med politiska riktlinjer."
  - id: a2
    text: "Domstolarna bestämmer vilket parti som ska regera."
  - id: a3
    text: "Myndigheterna får välja vilka lagar de följer."
  correct_option_id: a0
