  section_id: hb-c06-rattsskydd
  category: "Beslut, rättelse och tillsyn"
  question: "Vad ska normalt framgå av motiveringen till ett finländskt myndighetsbeslut?"
  options:
  - id: a0
    text: "Bara en hänvisning till att ärendet har behandlats"
  - id: a1
    text: "Vilka omständigheter och regler beslutet bygger på"
  - id: a2
    text: "Bara myndighetens namn och beslutets datum"
  - id: a3
    text: "Bara kontaktuppgifterna till den beslutande tjänstemannen"
  correct_option_id: a1
- id: hb-c06-rattsskydd-0002
  section_id: hb-c06-rattsskydd
  category: "Beslut, rättelse och tillsyn"
  question: "Vad är viktigt om du vill begära omprövning eller överklaga ett myndighetsbeslut?"
  options:
  - id: a0
    text: "Följ beslutets anvisningar och lämna begäran inom tidsfristen."
  - id: a1
    text: "Vänta tills myndigheten själv kontaktar dig om ett överklagande."
  - id: a2
    text: "Skicka en muntlig invändning till valfri annan myndighet."
  - id: a3
    text: "Utgå från att en kommentar på sociala medier stoppar tidsfristen."
  correct_option_id: a0
- id: hb-c06-rattsskydd-0003
  section_id: hb-c06-rattsskydd
  category: "Beslut, rättelse och tillsyn"
  question: "Kan ett förvaltningsklagomål i sig ändra det myndighetsbeslut du är missnöjd med?"
  options:
  - id: a0
    text: "Ja, klagomålet ger automatiskt en ny besvärstid."
  - id: a1
    text: "Nej, ändring kräver rätt omprövnings- eller besvärsförfarande."
  - id: a2
    text: "Ja, klagomålet ersätter automatiskt ett överklagande."
  - id: a3
    text: "Ja, beslutet upphör att gälla när klagomålet skickas."
  correct_option_id: a1
