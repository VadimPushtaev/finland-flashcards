  section_id: hb-c06-rattsskydd
  category: "Beslut, rättelse och tillsyn"
  question: "Vad gäller ett klagomål till Finlands justitieombudsman?"
  options:
  - id: a0
    text: "Klagomål kräver finskt medborgarskap och en advokat."
  - id: a1
    text: "Klagomål lämnas muntligt och kostar en handläggningsavgift."
  - id: a2
    text: "Klagomål får lämnas först efter tillstånd från myndigheten."
