  category: "God förvaltning och korruption"
  question: "Vilken princip ska styra en finländsk myndighets behandling av personer i jämförbara situationer?"
  options:
  - id: a0
    text: "Olika regler beroende på personens samhällsställning"
  - id: a1
    text: "Likabehandling och opartiskhet"
  - id: a2
    text: "Förtur för tjänstemannens bekanta"
  - id: a3
    text: "Förtur för det största partiets medlemmar"
  correct_option_id: a1
- id: hb-c06-god-forvaltning-0002
  section_id: hb-c06-god-forvaltning
  category: "God förvaltning och korruption"
  question: "Vilken situation är ett exempel på korruption i offentlig förvaltning?"
  options:
  - id: a0
    text: "En tjänsteman hänvisar en kund till rätt myndighet."
  - id: a1
    text: "En myndighet begär en utredning som lagen kräver."
  - id: a2
    text: "En beslutsfattare gynnar sitt eget företag i ett ärende."
  - id: a3
    text: "En myndighet publicerar grunderna för ett beslut."
  correct_option_id: a2
- id: hb-c06-god-forvaltning-0003
  section_id: hb-c06-god-forvaltning
  category: "God förvaltning och korruption"
  question: "För vilka syften får en finländsk myndighet använda sina befogenheter?"
  options:
  - id: a0
    text: "För att ge myndighetens bekanta ekonomiska fördelar"
  - id: a1
    text: "För syften som är godtagbara enligt lag"
  - id: a2
    text: "För att gynna den tjänsteman som fattar beslutet"
  - id: a3
    text: "För att belöna dem som stöder regeringens partier"
  correct_option_id: a1
- id: hb-c06-god-forvaltning-0004
  section_id: hb-c06-god-forvaltning
  category: "God förvaltning och korruption"
  question: "Vad innebär proportionalitet i finländsk förvaltning?"
  options:
  - id: a0
    text: "Den mest ingripande åtgärden ska väljas i varje ärende."
  - id: a1
    text: "Åtgärdernas omfattning ska följa kundens samhällsställning."
  - id: a2
    text: "Åtgärderna ska stå i rimlig proportion till sitt syfte."
  - id: a3
    text: "Samma åtgärd ska användas oavsett hur allvarligt ärendet är."
  correct_option_id: a2
- id: hb-c06-god-forvaltning-0005
  section_id: hb-c06-god-forvaltning
  category: "God förvaltning och korruption"
  question: "Vad gäller myndigheters rådgivning om hur man sköter ärenden inom deras behörighet i Finland?"
  options:
  - id: a0
    text: "Rådgivningen kostar lika mycket som själva beslutet."
  - id: a1
    text: "Rådgivningen är gratis bara om kunden får ett positivt beslut."
  - id: a2
    text: "Rådgivningen är gratis bara för finska medborgare."
  - id: a3
    text: "Rådgivningen är avgiftsfri."
  correct_option_id: a3
