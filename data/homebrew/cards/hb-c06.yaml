  section_id: hb-c06-rattsstat
  category: "Rättsstaten och grundlagen"
  question: "Vilka tre former av makt skiljer maktfördelningsläran åt?"
  options:
  - id: a0
    text: "Nationell, regional och internationell makt"
  - id: a1
    text: "Lagstiftande, verkställande och dömande makt"
  - id: a2
    text: "Statlig, kommunal och privat makt"
  - id: a3
    text: "Politisk, ekonomisk och religiös makt"
  correct_option_id: a1
