  options:
  - id: a0
    text: "Ett beslut som alltid motsvarar ditt eget önskemål"
  - id: a1
    text: "En domare som du själv väljer för ärendet"
  - id: a2
    text: "Förtur framför andra om du betalar en extra avgift"
  - id: a3
    text: "Behörig och opartisk behandling utan ogrundat dröjsmål"
  correct_option_id: a3
