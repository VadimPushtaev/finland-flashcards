    text: "Ja, den som hjälper till med språket får automatiskt tillgång"
  - id: a1
    text: "Nej, det krävs exempelvis samtycke eller annat lagstöd"
  - id: a2
    text: "Ja, en make får tillgång utan fullmakt eller lagstöd"
  - id: a3
    text: "Ja, en vuxen släkting får tillgång om efternamnet är samma"
