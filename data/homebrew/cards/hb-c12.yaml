schema_version: 1
chapter_id: hb-c12
language: sv
cards:
- id: hb-c12-integration-0001
  section_id: hb-c12-integration
  category: "Integration och delaktighet"
  question: "Vad omfattar integration i ett nytt hemland?"
  options:
  - id: a0
    text: "Språk, deltagande och en plats i samhället genom olika vägar"
  - id: a1
    text: "Att enbart lära sig språket utan deltagande i samhällslivet"
  - id: a2
    text: "Att få medborgarskap, oavsett deltagande och vardagskontakter"
  - id: a3
    text: "Att helt ersätta sin tidigare identitet med majoritetens kultur"
  correct_option_id: a0
- id: hb-c12-integration-0002
  section_id: hb-c12-integration
  category: "Integration och delaktighet"
  question: "Vad innebär delaktighet i samhället?"
  options:
  - id: a0
    text: "Att låta en företrädare välja ens mål utan eget deltagande"
  - id: a1
    text: "Att följa majoritetens privata åsikter som villkor för deltagande"
  - id: a2
    text: "Att kunna påverka sitt liv och delta i sin gemenskap"
  - id: a3
    text: "Att kunna ta emot service men sakna inflytande över sitt liv"
  correct_option_id: a2
- id: hb-c12-integration-0003
  section_id: hb-c12-integration
  category: "Integration och delaktighet"
  question: "Varför är kunskap om rättigheter och skyldigheter viktig för integrationen?"
  options:
  - id: a0
    text: "Den ersätter individuella ansökningar om de rättigheter man läst om"
  - id: a1
    text: "Den gör informella råd likvärdiga med ett myndighetsbeslut"
  - id: a2
    text: "Den innebär att tidigare hemlandets regler styr myndighetsärenden här"
  - id: a3
    text: "Den hjälper personen att orientera sig och delta i samhället"
  correct_option_id: a3
- id: hb-c12-integration-0004
  section_id: hb-c12-integration
  category: "Integration och delaktighet"
  question: "Vad betyder dubbelriktad integration?"
  options:
  - id: a0
    text: "Både nyanlända och det mottagande samhället lär sig och anpassar sig"
  - id: a1
    text: "Nyanlända anpassar sig, medan mottagande samhället saknar ansvar"
  - id: a2
    text: "Två myndigheter byter ansvaret utan deltagande från den nyanlände"
  - id: a3
    text: "Integrationsinsatser genomförs i både ursprungslandet och Finland"
  correct_option_id: a0
- id: hb-c12-integration-0005
  section_id: hb-c12-integration
  category: "Integration och delaktighet"
  question: "Måste integration innebära att man överger sitt tidigare språk och sin kultur?"
  options:
  - id: a0
    text: "Ja, stöd för integration kräver att tidigare kultur överges"
  - id: a1
    text: "Nej, deltagande kan förenas med att bevara språk och kultur"
  - id: a2
    text: "Ja, tidigare kultur måste ersättas för att räknas som delaktig"
  - id: a3
    text: "Ja, modersmålet måste lämnas för att svenska ska bli integrationsspråk"
  correct_option_id: a1
- id: hb-c12-tjanster-0001
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Vilken grundläggande information ska nyanlända kunna få?"
  options:
  - id: a0
    text: "Enbart arbetsgivarens regler, utan information om rättigheter"
  - id: a1
    text: "Enbart kommunens historia, utan vägledning om aktuella tjänster"
  - id: a2
    text: "Information om samhället, arbetslivet, rättigheter och tjänster"
  - id: a3
    text: "Enbart krav för tillstånd, utan vägledning om vardagstjänster"
  correct_option_id: a2
- id: hb-c12-tjanster-0002
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Vem ordnar det lokala integrationsprogrammet med bedömning, handledning och utbildning?"
  options:
  - id: a0
    text: "Enbart den lokala polisen"
  - id: a1
    text: "Enbart Patent- och registerstyrelsen"
  - id: a2
    text: "Enbart Skatteförvaltningen"
  - id: a3
    text: "Kommunen och den ansvariga arbetskraftsmyndigheten inom sina uppdrag"
  correct_option_id: a3
- id: hb-c12-tjanster-0003
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Vilka individuella tjänster kan ingå i stödet för integration?"
  options:
  - id: a0
    text: "Automatiskt beviljande av medborgarskap."
  - id: a1
    text: "Befrielse från alla krav för yrkesbehörighet."
  - id: a2
    text: "En garanterad arbetsplats utan bedömning av behov."
  - id: a3
    text: "Bedömning av servicebehov och en integrationsplan."
  correct_option_id: a3
- id: hb-c12-tjanster-0004
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Vad är en integrationsplan?"
  options:
  - id: a0
    text: "Ett bevis på att alla integrationsinsatser redan är slutförda"
  - id: a1
    text: "Ett ensidigt löfte från personen utan överenskomna tjänster"
  - id: a2
    text: "En individuell plan med överenskomna mål, tjänster och åtgärder"
  - id: a3
    text: "Ett generellt program som saknar individuella mål och uppföljning"
  correct_option_id: a2
- id: hb-c12-tjanster-0005
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Vad kan vara ett villkor för arbetslöshetsstöd under integrationstiden?"
  options:
  - id: a0
    text: "Att följa planen och delta i överenskomna åtgärder"
  - id: a1
    text: "Att välja vilka överenskomna aktiviteter man vill utebli från"
  - id: a2
    text: "Att låta bli att meddela när studier påbörjas"
  - id: a3
    text: "Att avsluta registreringen som arbetssökande utan annan grund"
  correct_option_id: a0
- id: hb-c12-tjanster-0006
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Vad innehåller integrationsutbildning normalt?"
  options:
  - id: a0
    text: "Enbart samhällshistoria utan språk- eller arbetslivsinnehåll"
  - id: a1
    text: "Finska eller svenska samt samhälls- och arbetslivskunskap"
  - id: a2
    text: "Enbart yrkesutbildning utan språk- eller samhällskunskap"
  - id: a3
    text: "Enbart språkprov utan undervisning eller vägledning"
  correct_option_id: a1
- id: hb-c12-tjanster-0007
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Var kan en nyanländ få lokal vägledning om att sköta myndighetsärenden?"
  options:
  - id: a0
    text: "Hos enbart gränskontrollen efter inresan"
  - id: a1
    text: "Hos enbart Migrationsverkets tillståndshandläggare"
  - id: a2
    text: "Hos kommunens rådgivning för nyanlända"
  - id: a3
    text: "Hos Skatteförvaltningen som ansvarig för all integration"
  correct_option_id: a2
- id: hb-c12-tjanster-0008
  section_id: hb-c12-tjanster
  category: "Integrationstjänster och integrationsplan"
  question: "Kan du studera finska eller svenska utan en integrationsplan?"
  options:
  - id: a0
    text: "Ja, exempelvis genom olika utbildningsanordnares kurser"
  - id: a1
    text: "Nej, kursutbudet utanför en integrationsplan är stängt för nyanlända"
  - id: a2
    text: "Ja, men enbart efter att en tidigare integrationsplan löpt ut"
  - id: a3
    text: "Ja, men enbart om kurserna gäller det andra nationalspråket"
  correct_option_id: a0
- id: hb-c12-sprak-0001
  section_id: hb-c12-sprak
  category: "Integrationsspråk och språkliga rättigheter"
  question: "Vilka språk kan man välja som integrationsspråk i Finland?"
  options:
  - id: a0
    text: "Engelska som lagstadgat likvärdigt alternativ till nationalspråken"
  - id: a1
    text: "Finska eller svenska"
  - id: a2
    text: "Finska som obligatoriskt första språk och svenska först därefter"
  - id: a3
    text: "Svenska enbart för personer som redan har finskt medborgarskap"
  correct_option_id: a1
- id: hb-c12-sprak-0002
  section_id: hb-c12-sprak
  category: "Integrationsspråk och språkliga rättigheter"
  question: "Vilken rätt gäller normalt hos statliga och tvåspråkiga lokala myndigheter?"
  options:
  - id: a0
    text: "Att kräva engelska som likvärdigt lagstadgat servicespråk överallt"
  - id: a1
    text: "Att alltid använda vilket språk som helst utan tolkning"
  - id: a2
    text: "Att myndigheten fritt väljer mellan finska och svenska åt kunden"
  - id: a3
    text: "Att använda finska eller svenska inom språklagens tillämpning"
  correct_option_id: a3
- id: hb-c12-tolkning-0001
  section_id: hb-c12-tolkning
  category: "Tolkning och sekretess"
  question: "Vem ordnar och betalar tolk när myndigheten har en lagstadgad tolkningsskyldighet?"
  options:
  - id: a0
    text: "Myndigheten"
  - id: a1
    text: "Kunden genom ett obligatoriskt privat avtal"
  - id: a2
    text: "Kundens närmaste anhöriga"
  - id: a3
    text: "Den enskilda tjänstemannen privat"
  correct_option_id: a0
- id: hb-c12-tolkning-0002
  section_id: hb-c12-tolkning
  category: "Tolkning och sekretess"
  question: "Vilken språklig rätt har en asylsökande i sitt asylärende?"
  options:
  - id: a0
    text: "En rätt att slippa lämna uppgifter om en tolk behöver användas"
  - id: a1
    text: "Nödvändig tolkning och beslutsinformation på ett begripligt språk"
  - id: a2
    text: "Enbart skriftlig information på finska oavsett förståelse"
  - id: a3
    text: "En skyldighet att själv betala all nödvändig myndighetstolkning"
  correct_option_id: a1
- id: hb-c12-tolkning-0003
  section_id: hb-c12-tolkning
  category: "Tolkning och sekretess"
  question: "Vilken roll har en tolk i ett myndighetsmöte?"
  options:
  - id: a0
    text: "Att ge egna juridiska råd i stället för att återge båda parter"
  - id: a1
    text: "Att företräda den part som betalar tolkningsarvodet"
  - id: a2
    text: "Att opartiskt förmedla det parterna säger"
  - id: a3
    text: "Att sammanfatta det som tolken själv anser viktigt för beslutet"
  correct_option_id: a2
- id: hb-c12-tolkning-0004
  section_id: hb-c12-tolkning
  category: "Tolkning och sekretess"
  question: "Vad innebär tolkens sekretessplikt?"
  options:
  - id: a0
    text: "Att uppgifterna kan berättas vidare när myndigheten fattat beslut"
  - id: a1
    text: "Att sekretessen gäller bara möten på plats och inte distanstolkning"
  - id: a2
    text: "Att tolken får dela ärendet med familjen utan deltagarnas samtycke"
  - id: a3
    text: "Att uppgifter inte får spridas utan laglig grund"
  correct_option_id: a3
- id: hb-c12-tolkning-0005
  section_id: hb-c12-tolkning
  category: "Tolkning och sekretess"
  question: "Vem ska inte användas som tolk för en vuxens myndighetsärenden?"
  options:
  - id: a0
    text: "En lämplig yrkestolk via telefon"
  - id: a1
    text: "Ett minderårigt barn"
  - id: a2
    text: "En opartisk yrkestolk på plats"
  - id: a3
    text: "En lämplig yrkestolk via video"
  correct_option_id: a1
