    text: "Personen bestämmer själv och får inte pressas att ge bort kontrollen"
  - id: a1
    text: "Maken får automatiskt överta ärendena genom äktenskapet"
  - id: a2
    text: "En anhörig får besluta åt personen genom gemensam adress"
  - id: a3
