  options:
  - id: a0
    text: "Att koppla registrerade uppgifter till rätt person"
  - id: a1
    text: "Att ensam bevisa att en nätanvändare är den registrerade personen"
  - id: a2
    text: "Att ersätta ett uppehållstillstånd"
  - id: a3
    text: "Att automatiskt ge rätt till alla FPA-förmåner"
