  options:
  - id: a0
    text: "Genom att bara känna till personens personbeteckning"
  - id: a1
    text: "Genom att bo på samma adress"
  - id: a2
    text: "Genom att utan lov använda personens bankkoder"
  - id: a3
    text: "Genom en lämplig fullmakt inom den tillåtna omfattningen"
