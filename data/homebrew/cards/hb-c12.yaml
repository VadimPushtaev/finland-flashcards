    text: "Ja, men enbart om vårdnadshavaren saknar finskt medborgarskap"
  - id: a1
    text: "Nej, barn kan aldrig ha någon egen rätt till sekretess"
  - id: a2
    text: "Ja, barnets beslutsförmåga och sekretessregler kan påverka tillgången"
  - id: a3
    text: "Nej, varje vårdnadshavare får alltid se allt"
