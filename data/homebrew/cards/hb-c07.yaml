schema_version: 1
chapter_id: hb-c07
language: sv
cards:
- id: hb-c07-ekonomi-0001
  section_id: hb-c07-ekonomi
  category: "Samhällets sektorer och ekonomi"
  question: "Vad innebär det att Finland har en öppen ekonomi?"
  options:
  - id: a0
    text: "Finländska företag får endast sälja inom landet."
  - id: a1
    text: "Utländska företag är undantagna från alla finländska regler."
  - id: a2
    text: "Handel med andra länder är en viktig del av ekonomin."
  - id: a3
    text: "Staten fastställer priset på varje vara som säljs."
  correct_option_id: a2
- id: hb-c07-ekonomi-0002
  section_id: hb-c07-ekonomi
  category: "Samhällets sektorer och ekonomi"
  question: "Vad påverkar normalt priserna i en marknadsekonomi?"
  options:
  - id: a0
    text: "En gemensam prislista som riksdagen fastställer varje år"
  - id: a1
    text: "Enbart antalet offentligt anställda i kommunen"
  - id: a2
    text: "Enbart varans ursprungsland, oberoende av efterfrågan"
  - id: a3
    text: "Utbud och efterfrågan"
  correct_option_id: a3
- id: hb-c07-ekonomi-0003
  section_id: hb-c07-ekonomi
  category: "Samhällets sektorer och ekonomi"
  question: "Varför kan Finlands ekonomi beskrivas som en blandekonomi?"
  options:
  - id: a0
    text: "Marknader kombineras med offentlig reglering och ägande."
  - id: a1
    text: "Alla företag ägs gemensamt av staten och kommunerna."
  - id: a2
    text: "Alla priser bestäms av staten men företagen är privata."
  - id: a3
    text: "Den offentliga sektorn får inte påverka marknaderna."
  correct_option_id: a0
- id: hb-c07-ekonomi-0004
  section_id: hb-c07-ekonomi
  category: "Samhällets sektorer och ekonomi"
  question: "Vad kännetecknar den privata sektorn?"
  options:
  - id: a0
    text: "Verksamheten drivs alltid av staten eller kommunerna."
  - id: a1
    text: "Verksamheten får aldrig sälja tjänster till offentlig sektor."
  - id: a2
    text: "Verksamheten ägs av privatpersoner eller privata sammanslutningar."
  - id: a3
    text: "Verksamheten finansieras alltid enbart med skatter."
  correct_option_id: a2
- id: hb-c07-ekonomi-0005
  section_id: hb-c07-ekonomi
  category: "Samhällets sektorer och ekonomi"
  question: "Hur finansieras en stor del av Finlands offentliga service?"
  options:
  - id: a0
    text: "Enbart med frivilliga donationer från användarna"
  - id: a1
    text: "Enbart med medlemsavgifter till fackförbunden"
  - id: a2
    text: "Enbart med vinsten från varje enskilt sjukhus"
  - id: a3
    text: "Med skatteintäkter"
  correct_option_id: a3
- id: hb-c07-ekonomi-0006
  section_id: hb-c07-ekonomi
  category: "Samhällets sektorer och ekonomi"
  question: "Vilka hör till den offentliga sektorn i Finland?"
  options:
  - id: a0
    text: "Staten, kommunerna och välfärdsområdena"
  - id: a1
    text: "Enbart privata aktiebolag med många anställda"
  - id: a2
    text: "Enbart ideella föreningar och frivilliga nätverk"
  - id: a3
    text: "Enbart företag som säljer tjänster utomlands"
  correct_option_id: a0
- id: hb-c07-ekonomi-0007
  section_id: hb-c07-ekonomi
  category: "Samhällets sektorer och ekonomi"
  question: "Vilken verksamhet är ett typiskt exempel på den tredje sektorn i Finland?"
  options:
  - id: a0
    text: "Ett statligt ministerium"
  - id: a1
    text: "En ideell idrottsförening"
  - id: a2
    text: "En kommunal socialmyndighet"
  - id: a3
    text: "Ett privat börsbolag"
  correct_option_id: a1
- id: hb-c07-arbetsmarknad-0001
  section_id: hb-c07-arbetsmarknad
  category: "Arbetsmarknaden och sysselsättning"
  question: "Vad kännetecknar ett reglerat yrke i Finland?"
  options:
  - id: a0
    text: "Lagen ställer särskilda krav för att få utöva yrket."
  - id: a1
    text: "Arbetsgivaren kan fritt avskaffa alla behörighetskrav."
  - id: a2
    text: "Yrket får bara utövas i ett statligt företag."
  - id: a3
    text: "Yrket får aldrig utövas av någon med utländsk utbildning."
  correct_option_id: a0
- id: hb-c07-arbetsmarknad-0002
  section_id: hb-c07-arbetsmarknad
  category: "Arbetsmarknaden och sysselsättning"
  question: "Vad ska arbetsgivaren kontrollera när en utländsk person anställs i Finland?"
  options:
  - id: a0
    text: "Att personen är medlem i arbetsgivarens branschförbund."
  - id: a1
    text: "Att personen äger en bostad i den kommun där arbetet utförs."
  - id: a2
    text: "Att personen har rätt att utföra arbetet i Finland."
  - id: a3
    text: "Att personen har avsagt sig sitt tidigare medborgarskap."
  correct_option_id: a2
- id: hb-c07-arbetsmarknad-0003
  section_id: hb-c07-arbetsmarknad
  category: "Arbetsmarknaden och sysselsättning"
  question: "Får arbetsgivaren behålla en utländsk arbetstagares pass som säkerhet?"
  options:
  - id: a0
    text: "Ja, tills en eventuell prövotid har löpt ut."
  - id: a1
    text: "Ja, om arbetsgivaren har betalat resan till Finland."
  - id: a2
    text: "Ja, om det skrivs in i arbetsavtalet."
  - id: a3
    text: "Nej, arbetstagaren har rätt att behålla sitt pass."
  correct_option_id: a3
- id: hb-c07-arbetskultur-0001
  section_id: hb-c07-arbetskultur
  category: "Arbetskultur"
  question: "Får kön i sig avgöra vem som anställs eller befordras i Finland?"
  options:
  - id: a0
    text: "Nej, arbetsgivaren ska följa jämställdhetslagens krav."
  - id: a1
    text: "Ja, om arbetsgivaren beskriver det som sin personliga preferens."
  - id: a2
    text: "Ja, om företaget saknar ett skriftligt jämställdhetsprogram."
  - id: a3
    text: "Nej, men bara när företaget är helt statligt ägt."
  correct_option_id: a0
- id: hb-c07-arbetskultur-0002
  section_id: hb-c07-arbetskultur
  category: "Arbetskultur"
  question: "Vad innebär arbetsgivarens arbetsledningsrätt i Finland?"
  options:
  - id: a0
    text: "Att bestämma över arbetstagarens alla privata föreningsmedlemskap"
  - id: a1
    text: "Att ensidigt ta bort samtliga avtalade lönevillkor"
  - id: a2
    text: "Att ge lagliga anvisningar och leda arbetet inom tillåtna ramar"
  - id: a3
    text: "Att ersätta arbetslagstiftningen med egna regler"
  correct_option_id: a2
- id: hb-c07-arbetsavtal-0001
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Kan ett muntligt arbetsavtal vara giltigt i Finland?"
  options:
  - id: a0
    text: "Ja, men ett skriftligt avtal gör villkoren lättare att bevisa."
  - id: a1
    text: "Nej, alla arbetsavtal måste bestyrkas av en domstol."
  - id: a2
    text: "Ja, men bara om arbetstagaren är finsk medborgare."
  - id: a3
    text: "Nej, avtalet blir giltigt först när fackförbundet godkänner det."
  correct_option_id: a0
- id: hb-c07-arbetsavtal-0002
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Får sämre arbetsvillkor motiveras enbart med att en anställning är tidsbegränsad eller på deltid?"
  options:
  - id: a0
    text: "Ja, tidsbegränsade avtal saknar alltid minimiskydd."
  - id: a1
    text: "Ja, deltidsanställda står alltid utanför arbetslagstiftningen."
  - id: a2
    text: "Nej, men bara om arbetstagaren har varit anställd i fem år."
  - id: a3
    text: "Nej, sämre villkor kräver sakliga skäl enligt lagen."
  correct_option_id: a3
- id: hb-c07-arbetsavtal-0003
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Vad betyder ett arbetsavtal som gäller tills vidare?"
  options:
  - id: a0
    text: "Anställningen har inget på förhand bestämt slutdatum."
  - id: a1
    text: "Anställningen upphör automatiskt efter prövotiden."
  - id: a2
    text: "Anställningen gäller alltid i exakt ett år."
  - id: a3
    text: "Anställningen får aldrig avslutas av någondera parten."
  correct_option_id: a0
- id: hb-c07-arbetsavtal-0004
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Måste en arbetstagare normalt ange ett skäl när hen säger upp sin tillsvidareanställning?"
  options:
  - id: a0
    text: "Ja, och arbetsgivaren måste godkänna skälet."
  - id: a1
    text: "Ja, och skälet måste först prövas av polisen."
  - id: a2
    text: "Nej, och därför behöver ingen uppsägningstid iakttas."
  - id: a3
    text: "Nej, men tillämplig uppsägningstid ska iakttas."
  correct_option_id: a3
- id: hb-c07-arbetsavtal-0005
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "När upphör ett vanligt tidsbegränsat arbetsavtal normalt?"
  options:
  - id: a0
    text: "Först när arbetsgivaren har sålt företaget"
  - id: a1
    text: "När den avtalade tiden går ut eller det avtalade arbetet blir klart"
  - id: a2
    text: "Först när arbetstagaren går i pension"
  - id: a3
    text: "Alltid en månad efter att prövotiden har börjat"
  correct_option_id: a1
- id: hb-c07-arbetsavtal-0006
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Kan ett tidsbegränsat arbetsavtal normalt sägas upp i förtid utan en överenskommen uppsägningsmöjlighet?"
  options:
  - id: a0
    text: "Ja, men bara arbetsgivaren har en ovillkorlig rätt att göra det."
  - id: a1
    text: "Ja, men bara arbetstagaren har en ovillkorlig rätt att göra det."
  - id: a2
    text: "Nej, det är normalt bindande till den avtalade sluttidpunkten."
  - id: a3
    text: "Ja, det får alltid sägas upp med en dags varsel."
  correct_option_id: a2
- id: hb-c07-arbetsavtal-0007
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Vad innebär ett nolltimmarsavtal med arbetstid 0–20 timmar per vecka?"
  options:
  - id: a0
    text: "Avtalet garanterar ingen minsta mängd arbete per vecka."
  - id: a1
    text: "Arbetsgivaren måste erbjuda exakt 20 timmar varje vecka."
  - id: a2
    text: "Arbetstagaren har rätt till heltidslön även utan arbetstimmar."
  - id: a3
    text: "Arbetet utförs utan lön tills 20 timmar har samlats in."
  correct_option_id: a0
- id: hb-c07-arbetsavtal-0008
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Får arbetsgivaren ange noll som minimiarbetstid om behovet av arbetskraft i verkligheten är fast?"
  options:
  - id: a0
    text: "Ja, om arbetsgivaren kallar avtalet för en prövotid."
  - id: a1
    text: "Nej, minimiarbetstiden ska motsvara det verkliga arbetskraftsbehovet."
  - id: a2
    text: "Ja, om arbetstagaren får timlön i stället för månadslön."
  - id: a3
    text: "Ja, om företaget har färre än tio anställda."
  correct_option_id: a1
- id: hb-c07-arbetsavtal-0009
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Vem är normalt arbetsgivare och betalar lönen vid hyrt arbete?"
  options:
  - id: a0
    text: "Varje kund hos företaget där arbetet utförs"
  - id: a1
    text: "Den kommun där arbetstagaren är bosatt"
  - id: a2
    text: "Arbetstagarens arbetslöshetskassa"
  - id: a3
    text: "Bemanningsföretaget som anställt arbetstagaren"
  correct_option_id: a3
- id: hb-c07-arbetsavtal-0010
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Får ett bemanningsföretag kräva att arbetstagaren betalar för att bli anställd eller få arbete förmedlat?"
  options:
  - id: a0
    text: "Nej, arbetstagaren ska inte betala en sådan rekryteringsavgift."
  - id: a1
    text: "Ja, om avgiften dras direkt från den första lönen."
  - id: a2
    text: "Ja, om arbetstagaren kommer från ett land utanför EU."
  - id: a3
    text: "Ja, om avgiften beskrivs som en obligatorisk inskolningskostnad."
  correct_option_id: a0
- id: hb-c07-arbetsavtal-0011
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Vilket ansvar har kundföretaget när en inhyrd arbetstagare börjar där?"
  options:
  - id: a0
    text: "Att ersätta lagstadgad introduktion med ett löneavdrag"
  - id: a1
    text: "Att ge arbetsplatsens introduktion och sköta säkerheten i arbetet"
  - id: a2
    text: "Att överlåta all säkerhetsinformation åt arbetstagaren själv"
  - id: a3
    text: "Att undanta inhyrda arbetstagare från kraven på skyddsutrustning"
  correct_option_id: a1
- id: hb-c07-arbetsavtal-0012
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Hur kan arbetsavtalet normalt avslutas under en giltig prövotid?"
  options:
  - id: a0
    text: "Endast arbetstagaren kan häva det utan uppsägningstid."
  - id: a1
    text: "Ingen av parterna kan avsluta det före prövotidens slut."
  - id: a2
    text: "Vardera parten kan häva det utan uppsägningstid enligt lagens villkor."
  - id: a3
    text: "Endast arbetsgivaren kan häva det utan uppsägningstid."
  correct_option_id: a2
- id: hb-c07-arbetsavtal-0013
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Får arbetsgivaren häva ett arbetsavtal under prövotiden av diskriminerande skäl?"
  options:
  - id: a0
    text: "Ja, eftersom diskrimineringslagen inte gäller under prövotid."
  - id: a1
    text: "Ja, om beslutet bara meddelas muntligt."
  - id: a2
    text: "Ja, om prövotiden är kortare än en månad."
  - id: a3
    text: "Nej, diskriminerande eller ovidkommande grunder är förbjudna."
  correct_option_id: a3
- id: hb-c07-arbetsavtal-0014
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "När kan en arbetstagare ha rätt att häva avtalet omedelbart på grund av arbetsgivarens agerande?"
  options:
  - id: a0
    text: "Vid så allvarligt avtalsbrott att fortsatt arbete inte kan krävas"
  - id: a1
    text: "När hen får en annan arbetsuppgift inom avtalets gränser"
  - id: a2
    text: "När hen inte får sin önskade semestervecka trots laglig förläggning"
  - id: a3
    text: "När arbetsgivaren ber hen följa en lagenlig säkerhetsanvisning"
  correct_option_id: a0
- id: hb-c07-arbetsavtal-0015
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Vad innebär permittering i Finland?"
  options:
  - id: a0
    text: "Arbetstagaren måste arbeta som vanligt utan lön."
  - id: a1
    text: "Arbetstagaren får automatiskt full lön från staten."
  - id: a2
    text: "Arbete och lön avbryts eller minskas medan anställningen består."
  - id: a3
    text: "Anställningen avslutas alltid permanent samma dag."
  correct_option_id: a2
- id: hb-c07-arbetsavtal-0016
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Vad har du rätt att begära när anställningen upphör i Finland?"
  options:
  - id: a0
    text: "Ett löfte om en ny tjänst hos samma arbetsgivare"
  - id: a1
    text: "Ett intyg om att alla framtida arbetsgivare måste anställa dig"
  - id: a2
    text: "Ett beslut om arbetslöshetsförmån utfärdat av arbetsgivaren"
  - id: a3
    text: "Ett arbetsintyg om anställningens längd och arbetsuppgifter"
  correct_option_id: a3
- id: hb-c07-arbetsavtal-0017
  section_id: hb-c07-arbetsavtal
  category: "Arbetsavtal och anställningsformer"
  question: "Får arbetsgivaren på eget initiativ lägga till en bedömning av ditt uppförande i arbetsintyget?"
  options:
  - id: a0
    text: "Nej, en sådan bedömning kräver att du uttryckligen begär den."
  - id: a1
    text: "Ja, den måste alltid ingå i varje arbetsintyg."
  - id: a2
    text: "Ja, men bara om bedömningen är negativ."
  - id: a3
    text: "Nej, arbetsintyg får aldrig innehålla en bedömning ens på begäran."
  correct_option_id: a0
- id: hb-c07-regler-0001
  section_id: hb-c07-regler
  category: "Arbetstagarens och arbetsgivarens rättigheter och skyldigheter"
  question: "Vad gäller normalt arbetsgivarens affärshemligheter som du får kännedom om i arbetet?"
  options:
  - id: a0
    text: "Du får offentliggöra dem så snart prövotiden är slut."
  - id: a1
    text: "Du får dela dem med en konkurrent om denne lovar att inte sprida dem."
  - id: a2
    text: "Du får inte obehörigen använda eller röja dem."
  - id: a3
    text: "Du får sälja dem om du gör det utanför arbetstid."
  correct_option_id: a2
- id: hb-c07-regler-0002
  section_id: hb-c07-regler
  category: "Arbetstagarens och arbetsgivarens rättigheter och skyldigheter"
  question: "Vad innebär tystnadsplikt för en anställd som hanterar patientuppgifter?"
  options:
  - id: a0
    text: "Uppgifterna får bara lämnas ut när det finns en laglig grund."
  - id: a1
    text: "Uppgifterna får delas med alla som känner patienten."
  - id: a2
    text: "Uppgifterna blir offentliga när arbetspasset är slut."
  - id: a3
    text: "Uppgifterna får användas privat om patientens namn utelämnas."
  correct_option_id: a0
- id: hb-c07-regler-0003
  section_id: hb-c07-regler
  category: "Arbetstagarens och arbetsgivarens rättigheter och skyldigheter"
  question: "Vad är ett kollektivavtal i arbetslivet?"
  options:
  - id: a0
    text: "Ett avtal mellan kunden och företaget om priset på en tjänst"
  - id: a1
    text: "Ett anställningsintyg som utfärdas efter att arbetet upphört"
  - id: a2
    text: "Ett avtal om arbetsvillkor mellan arbetsmarknadens parter"
  - id: a3
    text: "Ett privat låneavtal mellan arbetstagare och arbetsgivare"
  correct_option_id: a2
- id: hb-c07-regler-0004
  section_id: hb-c07-regler
  category: "Arbetstagarens och arbetsgivarens rättigheter och skyldigheter"
  question: "Vilken myndighet övervakar att arbetsgivare följer arbetslagstiftningen?"
  options:
  - id: a0
    text: "Skatteförvaltningen i alla anställningstvister"
  - id: a1
    text: "Migrationsverket i alla anställningsförhållanden"
  - id: a2
    text: "Utbildningsstyrelsen på alla arbetsplatser"
  - id: a3
    text: "Arbetarskyddsmyndigheten"
  correct_option_id: a3
- id: hb-c07-regler-0005
  section_id: hb-c07-regler
  category: "Arbetstagarens och arbetsgivarens rättigheter och skyldigheter"
  question: "Får en arbetsgivare avsluta en anställning helt utan hänsyn till lagens villkor?"
  options:
  - id: a0
    text: "Nej, avslutandet måste följa lagens villkor."
  - id: a1
    text: "Ja, arbetsledningsrätten räcker alltid."
  - id: a2
    text: "Ja, om beslutet meddelas muntligt."
  - id: a3
    text: "Ja, så länge arbetstagaren saknar fackmedlemskap."
  correct_option_id: a0
- id: hb-c07-regler-0006
  section_id: hb-c07-regler
  category: "Arbetstagarens och arbetsgivarens rättigheter och skyldigheter"
  question: "Vad ska arbetsgivaren normalt ge dig om de centrala arbetsvillkoren inte framgår av ett skriftligt avtal?"
  options:
  - id: a0
    text: "Enbart muntlig information på begäran."
  - id: a1
    text: "Skriftlig information om de centrala villkoren."
  - id: a2
    text: "Bara företagets allmänna reklambroschyr."
  - id: a3
    text: "Information först när anställningen upphör."
  correct_option_id: a1
- id: hb-c07-kollektivavtal-0001
  section_id: hb-c07-kollektivavtal
