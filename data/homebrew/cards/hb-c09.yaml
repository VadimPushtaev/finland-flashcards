schema_version: 1
chapter_id: hb-c09
language: sv
cards:
- id: hb-c09-forandring-0001
  section_id: hb-c09-forandring
  category: "Familjer förr och nu"
  question: "Hur förändrade välfärdsstatens utveckling människors beroende av släkten?"
  options:
  - id: a0
    text: "Alla vuxna blev juridiskt skyldiga att försörja sina kusiner."
  - id: a1
    text: "Offentliga stöd och tjänster minskade beroendet av släktens hjälp."
  - id: a2
    text: "Släktingarna tog över statens ansvar för sociala förmåner."
  - id: a3
    text: "Rätten till offentligt stöd började bero på släktens godkännande."
  correct_option_id: a1
- id: hb-c09-forandring-0002
  section_id: hb-c09-forandring
  category: "Familjer förr och nu"
  question: "Hur bidrar människor till ett gemensamt ansvar i välfärdssamhället?"
  options:
  - id: a0
    text: "Genom exempelvis skatter och frivilligarbete"
  - id: a1
    text: "Genom att överlåta alla sociala tjänster till släkten"
  - id: a2
    text: "Genom att göra stöd beroende av mottagarens familjenamn"
  - id: a3
    text: "Genom att enbart hjälpa personer med samma arbetsgivare"
  correct_option_id: a0
- id: hb-c09-forandring-0003
  section_id: hb-c09-forandring
  category: "Familjer förr och nu"
  question: "Varför är det olämpligt att gynna släktingar i offentligt beslutsfattande?"
  options:
  - id: a0
    text: "Offentliga beslut ska alltid bygga på den största släktens önskemål."
  - id: a1
    text: "Det strider mot kraven på opartiskhet och lika behandling."
  - id: a2
    text: "Släktingar får aldrig ha kontakt med offentliga myndigheter."
  - id: a3
    text: "Familjeband ger automatiskt större rätt till offentliga tjänster."
  correct_option_id: a1
- id: hb-c09-forandring-0004
  section_id: hb-c09-forandring
  category: "Familjer förr och nu"
  question: "Vilken underhållsskyldighet har gifta makar gentemot varandra?"
  options:
  - id: a0
    text: "Bara maken med högst ålder har underhållsskyldighet."
  - id: a1
    text: "Skyldigheten gäller bara om paret har gemensamma barn."
  - id: a2
    text: "Makarna saknar underhållsskyldighet om de har olika efternamn."
  - id: a3
    text: "Båda ska bidra till familjens underhåll efter förmåga."
  correct_option_id: a3
- id: hb-c09-forandring-0005
  section_id: hb-c09-forandring
  category: "Familjer förr och nu"
  question: "Finns en allmän laglig skyldighet att försörja sina vuxna syskon eller mor- och farföräldrar?"
  options:
  - id: a0
    text: "Nej, någon sådan allmän familjerättslig skyldighet finns inte."
  - id: a1
    text: "Ja, samma skyldighet gäller som för minderåriga barn."
  - id: a2
    text: "Ja, men bara om släktingarna bor i olika kommuner."
  - id: a3
    text: "Ja, men bara efter att den anhörige gått i pension."
  correct_option_id: a0
- id: hb-c09-familjeformer-0001
  section_id: hb-c09-familjeformer
  category: "Olika familjeformer"
  question: "Vad innebär adoption juridiskt?"
  options:
  - id: a0
    text: "Adoptivföräldern blir enbart kontaktperson till skolan."
  - id: a1
    text: "Ett rättsligt föräldra-barnförhållande etableras."
  - id: a2
    text: "Barnet får en tillfällig barnvakt utan rättslig förändring."
  - id: a3
    text: "Alla barnets rättigheter upphör fram till artonårsdagen."
  correct_option_id: a1
- id: hb-c09-familjeformer-0002
  section_id: hb-c09-familjeformer
  category: "Olika familjeformer"
  question: "Är fertilitetsbehandling med donerade spermier i Finland begränsad till olikkönade par?"
  options:
  - id: a0
    text: "Nej, även ensamstående kvinnor och kvinnliga par kan få behandling."
  - id: a1
    text: "Ja, behandling kräver alltid en manlig make."
  - id: a2
    text: "Ja, ensamstående kan endast få adoptionsrådgivning."
  - id: a3
    text: "Nej, men kvinnliga par måste först upplösa sitt äktenskap."
  correct_option_id: a0
- id: hb-c09-familjeformer-0003
  section_id: hb-c09-familjeformer
  category: "Olika familjeformer"
  question: "Vad har arbetet för regnbågsfamiljers rättigheter i Finland syftat till?"
  options:
  - id: a0
    text: "Samma rättigheter som för andra familjer."
  - id: a1
    text: "Att begränsa familjerätt till gifta olikkönade par."
  - id: a2
    text: "Att införa skilda medborgarskap för familjetyper."
  - id: a3
    text: "Att låta kommuner bestämma familjers grundläggande rättigheter."
  correct_option_id: a0
- id: hb-c09-familjeformer-0004
  section_id: hb-c09-familjeformer
  category: "Olika familjeformer"
  question: "Kan gifta makar av samma kön adoptera i Finland?"
  options:
  - id: a0
    text: "Ja, men enbart om de först registrerar ett separat partnerskap."
  - id: a1
    text: "Nej, enbart ensamstående personer får ansöka om adoption."
  - id: a2
    text: "Ja, adoption prövas enligt de vanliga rättsliga villkoren."
  - id: a3
    text: "Nej, äktenskap ger aldrig samkönade makar möjlighet att adoptera."
  correct_option_id: a2
- id: hb-c09-kon-0001
  section_id: hb-c09-kon
  category: "Jämställdhet i familjens vardag"
  question: "Vad innebär jämställd uppfostran av barn?"
  options:
  - id: a0
    text: "Barnets kön avgör vilket yrke föräldrarna ska välja åt barnet."
  - id: a1
    text: "Barnets kön ska inte begränsa intressen och möjligheter."
  - id: a2
    text: "Flickor och pojkar ska alltid erbjudas olika ämnen i skolan."
  - id: a3
    text: "Alla barn måste tycka om exakt samma lekar."
  correct_option_id: a1
- id: hb-c09-samlevnad-0001
  section_id: hb-c09-samlevnad
  category: "Civilstånd och samboförhållande"
  question: "Har sambor samma ömsesidiga underhållsskyldighet som gifta makar?"
  options:
  - id: a0
    text: "Ja, skyldigheten börjar automatiskt första dagen de bor ihop."
  - id: a1
    text: "Ja, men enbart om samborna har olika efternamn."
  - id: a2
    text: "Nej, men bara den yngre sambon måste försörja den äldre."
  - id: a3
    text: "Nej, sambor har inte makarnas allmänna underhållsskyldighet."
  correct_option_id: a3
- id: hb-c09-samlevnad-0002
  section_id: hb-c09-samlevnad
  category: "Civilstånd och samboförhållande"
  question: "Ärver en sambo automatiskt sin partner utan testamente?"
  options:
  - id: a0
    text: "Nej, ett testamente kan behövas för att ge sambon arvsrätt."
  - id: a1
    text: "Ja, sambon är alltid första arvinge före barnen."
  - id: a2
    text: "Ja, efter en enda månad på samma adress."
  - id: a3
    text: "Ja, om paret har ett gemensamt bankkonto."
  correct_option_id: a0
- id: hb-c09-samlevnad-0003
  section_id: hb-c09-samlevnad
  category: "Civilstånd och samboförhållande"
  question: "Vad ger fastställt juridiskt föräldraskap barnet i arvsfrågor?"
  options:
  - id: a0
    text: "Arvsrätt bara om barnet har förälderns efternamn"
  - id: a1
    text: "Ingen arvsrätt om barnet bor hos den andra föräldern"
  - id: a2
    text: "Arvsrätt efter den juridiska föräldern enligt arvsreglerna"
  - id: a3
    text: "Arvsrätt bara om föräldrarna har varit gifta i fem år"
  correct_option_id: a2
- id: hb-c09-samlevnad-0004
  section_id: hb-c09-samlevnad
  category: "Civilstånd och samboförhållande"
  question: "Upphör en förälders skyldighet att försörja sitt minderåriga barn vid separation?"
  options:
  - id: a0
    text: "Ja, skyldigheten gäller bara den som barnet bor mest hos."
  - id: a1
    text: "Ja, om föräldrarna aldrig varit gifta."
  - id: a2
    text: "Ja, om barnet får ett annat efternamn."
  - id: a3
    text: "Nej, båda juridiska föräldrarna har fortsatt underhållsansvar."
  correct_option_id: a3
- id: hb-c09-samlevnad-0005
  section_id: hb-c09-samlevnad
  category: "Civilstånd och samboförhållande"
  question: "Vad bör man göra när ett samboförhållande upphör och hushållet förändras?"
  options:
  - id: a0
    text: "Ändra bara telefonnummer och behålla tidigare förmånsuppgifter"
  - id: a1
    text: "Meddela berörda myndigheter eftersom förmåner och avgifter kan ändras"
  - id: a2
    text: "Utgå från att alla privata överenskommelser registreras automatiskt"
  - id: a3
    text: "Vänta tills båda har gift om sig innan FPA kontaktas"
  correct_option_id: a1
- id: hb-c09-samlevnad-0006
  section_id: hb-c09-samlevnad
  category: "Civilstånd och samboförhållande"
  question: "Vad är utgångspunkten för egendomsfördelning när sambor separerar?"
  options:
  - id: a0
    text: "Den som flyttar först förlorar automatiskt alla tillgångar."
  - id: a1
    text: "All egendom tillfaller den som har högst inkomst."
  - id: a2
    text: "Var och en behåller sitt; gemensamt ägande behöver klarläggas."
  - id: a3
    text: "All egendom delas alltid lika oberoende av ägande."
  correct_option_id: a2
- id: hb-c09-aktenskap-0001
  section_id: hb-c09-aktenskap
  category: "Äktenskap och vigsel"
  question: "Vilken rättslig ställning har makarna i ett äktenskap i Finland?"
  options:
  - id: a0
    text: "Den som tog den andras efternamn förlorar sin självbestämmanderätt."
  - id: a1
    text: "De är jämlika med samma grundläggande rättigheter och skyldigheter."
  - id: a2
    text: "Den som tjänar mest får bestämma över den andras personliga liv."
  - id: a3
    text: "Den äldre maken är automatiskt den andras förmyndare."
  correct_option_id: a1
- id: hb-c09-aktenskap-0002
  section_id: hb-c09-aktenskap
  category: "Äktenskap och vigsel"
  question: "Vilken är den lägsta åldern för att ingå äktenskap i Finland?"
  options:
  - id: a0
    text: "15 år med föräldrarnas samtycke"
  - id: a1
    text: "17 år med trossamfundets tillstånd"
  - id: a2
    text: "18 år"
  - id: a3
    text: "16 år"
  correct_option_id: a2
- id: hb-c09-aktenskap-0003
  section_id: hb-c09-aktenskap
  category: "Äktenskap och vigsel"
  question: "Varför görs en hindersprövning före vigseln?"
  options:
  - id: a0
    text: "För att avgöra om makarna har tillräckligt stor gemensam bostad"
  - id: a1
    text: "För att få släktens godkännande av valet av partner"
  - id: a2
    text: "För att bestämma hur länge paret måste vara förlovat"
  - id: a3
    text: "För att kontrollera att inget lagligt hinder mot äktenskapet finns"
  correct_option_id: a3
- id: hb-c09-aktenskap-0004
  section_id: hb-c09-aktenskap
  category: "Äktenskap och vigsel"
  question: "Förpliktar en förlovning någon att senare gifta sig?"
  options:
  - id: a0
    text: "Nej, båda har rätt att avstå från äktenskapet."
  - id: a1
    text: "Ja, om paret har köpt förlovningsringar."
  - id: a2
    text: "Ja, om förlovningen har varat längre än ett år."
  - id: a3
    text: "Ja, när båda familjerna har informerats."
  correct_option_id: a0
- id: hb-c09-aktenskap-0005
  section_id: hb-c09-aktenskap
  category: "Äktenskap och vigsel"
  question: "Vad krävs av den som förrättar en juridiskt giltig vigsel?"
  options:
  - id: a0
    text: "Enbart rätt att bevittna bankhandlingar"
  - id: a1
    text: "Enbart medlemskap i ett registrerat trossamfund"
  - id: a2
    text: "Officiell vigselrätt"
  - id: a3
    text: "Enbart släktskap med någon av makarna"
  correct_option_id: a2
- id: hb-c09-aktenskap-0006
  section_id: hb-c09-aktenskap
  category: "Äktenskap och vigsel"
  question: "Kan en person som hör till ett trossamfund välja borgerlig vigsel?"
  options:
  - id: a0
    text: "Ja, religiöst medlemskap hindrar inte borgerlig vigsel."
  - id: a1
    text: "Nej, medlemskapet måste alltid avslutas först."
  - id: a2
    text: "Ja, men bara om den andra personen har en annan religion."
  - id: a3
    text: "Nej, borgerlig vigsel gäller enbart utländska medborgare."
  correct_option_id: a0
- id: hb-c09-makar-0001
  section_id: hb-c09-makar
  category: "Makars rättigheter, egendom och skulder"
  question: "Är misshandel mindre straffbar för att den sker mellan makar eller andra familjemedlemmar?"
  options:
  - id: a0
    text: "Ja, om familjen vill lösa saken utan insyn."
  - id: a1
    text: "Ja, om förövaren betalar hushållets utgifter."
  - id: a2
    text: "Nej, familjerelationen gör inte misshandel tillåten."
  - id: a3
    text: "Ja, om paret fortfarande bor tillsammans."
  correct_option_id: a2
- id: hb-c09-makar-0002
  section_id: hb-c09-makar
  category: "Makars rättigheter, egendom och skulder"
  question: "Ger ett äktenskap automatiskt rätt att få den andra makens patientuppgifter?"
  options:
  - id: a0
    text: "Ja, alla journaluppgifter är alltid gemensamma."
  - id: a1
    text: "Ja, men bara om makarna har samma efternamn."
  - id: a2
    text: "Nej, inte ens makens eget samtycke kan tillåta det."
  - id: a3
    text: "Nej, samtycke eller en särskild laglig grund behövs."
  correct_option_id: a3
- id: hb-c09-makar-0003
  section_id: hb-c09-makar
  category: "Makars rättigheter, egendom och skulder"
  question: "Blir all egendom automatiskt gemensamt ägd när man gifter sig?"
  options:
  - id: a0
    text: "Nej, makarna kan fortfarande äga egendom var för sig."
  - id: a1
    text: "Ja, varje tillgång byter automatiskt till hälften ägare."
  - id: a2
    text: "Ja, men bara egendom som köptes före vigseln."
  - id: a3
    text: "Nej, all egendom övergår i stället till den äldre maken."
  correct_option_id: a0
- id: hb-c09-makar-0004
  section_id: hb-c09-makar
  category: "Makars rättigheter, egendom och skulder"
  question: "Vad gäller normalt för skulder i ett äktenskap?"
  options:
  - id: a0
    text: "Bara den make som har störst inkomst ansvarar för alla lån."
  - id: a1
    text: "Äktenskap innebär att banken inte längre får kräva återbetalning."
  - id: a2
    text: "Var och en ansvarar för egna skulder samt avtalat gemensamt lån."
  - id: a3
    text: "Alla tidigare skulder övergår automatiskt till den nya maken."
  correct_option_id: a2
- id: hb-c09-makar-0005
  section_id: hb-c09-makar
  category: "Makars rättigheter, egendom och skulder"
  question: "Vad kan makarna reglera genom ett äktenskapsförord?"
  options:
  - id: a0
    text: "Vem som får rösta i allmänna val"
  - id: a1
    text: "Om den andra maken ska få arbeta utanför hemmet"
  - id: a2
    text: "Om barnets rätt till underhåll ska upphöra"
  - id: a3
    text: "Om giftorätten ska uteslutas helt eller för viss egendom"
  correct_option_id: a3
- id: hb-c09-skilsmassa-0001
  section_id: hb-c09-skilsmassa
  category: "Skilsmässa och bodelning"
  question: "Vilken instans behandlar en ansökan om skilsmässa i Finland?"
  options:
  - id: a0
    text: "Tingsrätten, utan att kräva en förklaring till varför man vill skiljas"
  - id: a1
    text: "FPA, som först prövar om makarna har tillräcklig inkomst"
  - id: a2
    text: "Polisen, som alltid utreder vem som bär skulden till separationen"
  - id: a3
    text: "Församlingen, även när äktenskapet ingicks borgerligt"
  correct_option_id: a0
- id: hb-c09-skilsmassa-0002
  section_id: hb-c09-skilsmassa
  category: "Skilsmässa och bodelning"
  question: "Vad behöver klarläggas vid avvittring i samband med skilsmässa?"
  options:
  - id: a0
    text: "Makarnas tillgångar, skulder och eventuell begränsning av giftorätten"
  - id: a1
    text: "Enbart vem som först föreslog skilsmässan"
  - id: a2
    text: "Enbart vilken make som har högst utbildning"
  - id: a3
    text: "Enbart hur många gäster som deltog i bröllopet"
  correct_option_id: a0
- id: hb-c09-skilsmassa-0003
  section_id: hb-c09-skilsmassa
  category: "Skilsmässa och bodelning"
  question: "Vem kan utse en skiftesman om makar inte kan komma överens om avvittringen?"
  options:
  - id: a0
    text: "FPA utan att någon ansöker"
  - id: a1
    text: "Enbart den make som har mest egendom"
  - id: a2
    text: "Den bank där den ena maken har sitt lönekonto"
  - id: a3
    text: "Tingsrätten på ansökan"
  correct_option_id: a3
- id: hb-c09-skilsmassa-0004
  section_id: hb-c09-skilsmassa
  category: "Skilsmässa och bodelning"
  question: "Vad kan medling i familjefrågor hjälpa föräldrar med?"
  options:
  - id: a0
    text: "Att ersätta barnets bästa med den ena förälderns vilja"
  - id: a1
    text: "Att automatiskt upplösa äktenskap utan någon domstolsansökan"
  - id: a2
    text: "Att bestämma ett straff för den som vill separera"
  - id: a3
    text: "Att nå överenskommelser, till exempel om barnets situation"
  correct_option_id: a3
- id: hb-c09-vardnad-0001
  section_id: hb-c09-vardnad
  category: "Barnets boende, vårdnad och umgänge"
  question: "Vad innebär det att barnatillsyningsmannen fastställer föräldrarnas avtal?"
  options:
  - id: a0
    text: "Barnet förlorar automatiskt kontakten med en förälder."
  - id: a1
    text: "Föräldrarna måste alltid göra ett nytt avtal hos polisen."
  - id: a2
    text: "Avtalet blir verkställbart på samma sätt som ett domstolsbeslut."
  - id: a3
    text: "Det blir enbart ett privat råd som ingen behöver följa."
  correct_option_id: a2
- id: hb-c09-vardnad-0002
  section_id: hb-c09-vardnad
  category: "Barnets boende, vårdnad och umgänge"
  question: "Vem kan avgöra en olöst tvist om barnets vårdnad eller boende?"
  options:
  - id: a0
    text: "Enbart FPA"
  - id: a1
    text: "Enbart barnets skola"
  - id: a2
    text: "Enbart den förälder som har högst inkomst"
  - id: a3
    text: "Tingsrätten"
  correct_option_id: a3
- id: hb-c09-vardnad-0003
  section_id: hb-c09-vardnad
  category: "Barnets boende, vårdnad och umgänge"
  question: "Vad innebär gemensam vårdnad som huvudregel?"
  options:
  - id: a0
    text: "Vårdnadshavarna blir automatiskt sambor igen."
  - id: a1
    text: "Vårdnadshavarna fattar viktiga beslut om barnet tillsammans."
  - id: a2
    text: "Bara den som barnet bor hos får fatta alla beslut."
  - id: a3
    text: "Barnet måste alltid bo exakt halva tiden hos vardera."
  correct_option_id: a1
- id: hb-c09-vardnad-0004
  section_id: hb-c09-vardnad
  category: "Barnets boende, vårdnad och umgänge"
  question: "Vems rätt är umgängesrätten efter föräldrarnas separation i första hand?"
  options:
  - id: a0
    text: "Barnets rätt till kontakt med föräldern, med tryggheten beaktad"
  - id: a1
    text: "Den förmögnare förälderns rätt att bestämma ensam"
  - id: a2
    text: "Släktens rätt att besluta var barnet ska bo"
  - id: a3
    text: "Skolans rätt att bestämma familjens helgschema"
  correct_option_id: a0
- id: hb-c09-vardnad-0005
  section_id: hb-c09-vardnad
  category: "Barnets boende, vårdnad och umgänge"
  question: "Vart bör en förälder vända sig om barnets säkerhet hotas vid umgänge?"
  options:
  - id: a0
    text: "Till ingen, eftersom umgängesrätt alltid går före barnets säkerhet"
  - id: a1
    text: "Till socialmyndigheterna; umgänget kan behöva skyddande arrangemang"
  - id: a2
    text: "Enbart till barnets fritidsförening"
  - id: a3
    text: "Enbart till banken som tar emot underhållsbidraget"
  correct_option_id: a1
- id: hb-c09-underhall-0001
  section_id: hb-c09-underhall
