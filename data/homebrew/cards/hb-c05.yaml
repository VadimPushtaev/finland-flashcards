  options:
  - id: a0
    text: "Jämställdhetsombudsmannen"
  - id: a1
    text: "Polisen"
  - id: a2
    text: "Diskrimineringsombudsmannen"
  - id: a3
    text: "Riksdagens justitieombudsman"
  correct_option_id: a1
- id: hb-c05-hjalp-0001
