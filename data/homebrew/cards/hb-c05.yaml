  question: "Vad ska stöd enligt funktionshinderservicen i Finland utgå från?"
  options:
  - id: a0
    text: "Ett likadant tjänstepaket för varje person med samma diagnos"
  - id: a1
    text: "Arbetsgivarens beslut om en anställds rätt till offentlig service"
  - id: a2
