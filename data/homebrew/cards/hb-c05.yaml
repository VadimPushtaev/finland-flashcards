  options:
  - id: a0
    text: "Dataombudsmannen"
  - id: a1
    text: "Jämställdhetsombudsmannen"
  - id: a2
    text: "Konsumentombudsmannen"
  - id: a3
    text: "Barnombudsmannen"
  correct_option_id: a1
