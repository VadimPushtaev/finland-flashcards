  section_id: hb-c05-jamstalldhet
  category: "Jämställdhet mellan könen"
  question: "Får en arbetsgivare i Finland neka anställning eller säga upp någon på grund av graviditet eller föräldraskap?"
  options:
  - id: a0
    text: "Ja, om anställningen börjar före föräldraledigheten."
  - id: a1
    text: "Ja, om arbetsgivaren bedömer att en vikarie behövs."
  - id: a2
    text: "Ja, om arbetsgivaren erbjuder en kortare uppsägningstid."
  - id: a3
    text: "Nej, graviditet eller föräldraskap får inte vara grunden."
  correct_option_id: a3
