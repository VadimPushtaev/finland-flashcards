  category: "Jämställdhet mellan könen"
  question: "Behöver en vuxen kvinna i Finland sin makes eller sina föräldrars tillåtelse för att arbeta eller studera?"
  options:
  - id: a0
    text: "Ja, om hennes make betalar familjens utgifter."
  - id: a1
    text: "Ja, om hon är gift och har barn."
  - id: a2
    text: "Ja, om föräldrarna betalar hennes boende."
  - id: a3
    text: "Nej, hon bestämmer själv."
  correct_option_id: a3
- id: hb-c05-jamstalldhet-0007
  section_id: hb-c05-jamstalldhet
  category: "Jämställdhet mellan könen"
  question: "Vad gäller om familjen försöker tvinga någon att gifta sig i Finland?"
  options:
  - id: a0
    text: "Föräldrarnas beslut ersätter personens vilja före 18 års ålder."
  - id: a1
    text: "Familjen får fatta beslutet om den bekostar bröllopet."
  - id: a2
    text: "Valet av make är frivilligt; tvångsäktenskap är ett brott."
  - id: a3
    text: "Tvånget är tillåtet när båda familjerna godkänner det."
  correct_option_id: a2
