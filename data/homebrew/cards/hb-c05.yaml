  question: "Hur förhåller sig en utländsk arbetstagares lagstadgade villkor till en finsk arbetstagares i Finland?"
  options:
  - id: a0
    text: "Samma lagstadgade skydd gäller; utländskt ursprung sänker det inte."
  - id: a1
    text: "Hemlandets lägre minimivillkor får ersätta finskt lagstadgat skydd."
  - id: a2
    text: "Arbetsgivaren får avtala bort skyddet före finskt medborgarskap."
  - id: a3
    text: "Skyddet börjar gälla efter två år med hemkommun i Finland."
  correct_option_id: a0
