  category: "Rättigheter för personer med funktionsnedsättning"
  question: "Hur ska personer med funktionsnedsättning kunna delta i samhällsliv och beslut som rör dem i Finland?"
  options:
  - id: a0
    text: "Deras synpunkter ersätts av arbetsgivarens bedömning."
  - id: a1
    text: "Deras deltagande börjar först efter att stödtjänster avslutats."
  - id: a2
    text: "De ska kunna delta och påverka på jämlika villkor."
