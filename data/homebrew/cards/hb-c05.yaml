  section_id: hb-c05-sprak
  category: "Språkliga minoriteter och urfolk"
  question: "Vilken språklig och kulturell rätt har minoriteter i Finland?"
  options:
  - id: a0
    text: "Att få varje offentlig tjänst på sitt språk i hela landet"
  - id: a1
    text: "Att bevara och utveckla sitt eget språk och sin kultur"
  - id: a2
    text: "Att ersätta statens lagar med egna kulturella regler"
  - id: a3
    text: "Att ge ett språk nationell ställning genom ett lokalt föreningsbeslut"
  correct_option_id: a1
