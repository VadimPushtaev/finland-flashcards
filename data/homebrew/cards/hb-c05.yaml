  options:
  - id: a0
    text: "Servicen förutsätter att användaren blir finsk medborgare."
  - id: a1
    text: "Användaren måste köpa tjänsten av en privat tolk."
  - id: a2
    text: "Servicen är avgiftsfri för användaren."
  - id: a3
    text: "Användaren betalar avgiften genom sin arbetsgivare."
  correct_option_id: a2
