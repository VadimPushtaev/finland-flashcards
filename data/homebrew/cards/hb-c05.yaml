  section_id: hb-c05-grundlag
  category: "Grundläggande och mänskliga rättigheter"
  question: "Vad kräver rättsstatsprincipen av den offentliga makten i Finland?"
  options:
  - id: a0
    text: "Att den låter varje myndighet välja vilka lagar den tillämpar"
  - id: a1
    text: "Att den följer lagarna och tryggar grundläggande rättigheter"
  - id: a2
    text: "Att den följer regeringsprogrammet även när det strider mot lag"
  - id: a3
    text: "Att den låter majoritetens stöd ersätta domstolarnas rättsskydd"
