  question: "Hur ska det allmänna beakta finskspråkigas och svenskspråkigas kulturella och samhälleliga behov?"
  options:
  - id: a0
    text: "På lika grunder"
  - id: a1
    text: "Utifrån språkgruppens skatteintäkter"
  - id: a2
    text: "Genom att hänvisa svenskspråkiga tjänster till Åland"
  - id: a3
