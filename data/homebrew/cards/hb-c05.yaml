  options:
  - id: a0
    text: "Bosättningsort, yrke och utbildningsnivå"
  - id: a1
    text: "Kön, könsidentitet och könsuttryck"
  - id: a2
    text: "Medborgarskap, hemkommun och uppehållstillstånd"
  - id: a3
    text: "Ålder, nationalitet och modersmål"
  correct_option_id: a1
