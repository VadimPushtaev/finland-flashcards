  section_id: hb-c05-jamstalldhet
  category: "Jämställdhet mellan könen"
  question: "Vilken princip gäller lön för lika eller likvärdigt arbete i Finland?"
  options:
  - id: a0
    text: "Visstidsanställda kan undantas från principen om lika lön."
  - id: a1
    text: "Lika lön krävs först när arbetet har exakt samma befattningsnamn."
  - id: a2
    text: "Kön får inte vara skäl för olika lön."
  - id: a3
    text: "Arbetsgivaren får bestämma olika grundlöner för kvinnor och män."
  correct_option_id: a2
