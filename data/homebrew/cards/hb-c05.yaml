  - id: a0
    text: "Det ersätter prövningen av vilket underliggande brott som begåtts."
  - id: a1
    text: "Det är en ansvarsfrihetsgrund för brott med politiska motiv."
  - id: a2
    text: "Det flyttar straffprövningen från domstolen till ombudsmannen."
  - id: a3
    text: "Det kan vara en grund för straffskärpning."
  correct_option_id: a3
