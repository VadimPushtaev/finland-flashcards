  category: "Hjälp vid diskriminering"
  question: "Vilka har särskilda roller för råd, tillsyn eller stöd vid arbetsdiskriminering i Finland?"
  options:
  - id: a0
    text: "Skatteförvaltningen, Migrationsverket eller tullmyndigheten"
  - id: a1
    text: "Konsumentombudsmannen, socialnämnden eller valmyndigheten"
  - id: a2
    text: "Dataombudsmannen, kommunens byggnadstillsyn eller magistraten"
  - id: a3
    text: "Arbetarskyddsmyndigheten, diskrimineringsombudsmannen eller facket"
