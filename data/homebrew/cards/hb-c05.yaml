  - id: a0
    text: "Som förbjuden diskriminering"
  - id: a1
    text: "Som en arbetsmiljöfråga utanför diskrimineringsreglerna"
  - id: a2
    text: "Som diskriminering först när trakasserierna påverkar lönen"
  - id: a3
