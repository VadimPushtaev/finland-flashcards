  section_id: hb-c05-grundlag
  category: "Grundläggande och mänskliga rättigheter"
  question: "Vad betyder det att mänskliga rättigheter är universella?"
  options:
  - id: a0
    text: "De uppkommer genom medlemskap i en internationell organisation."
  - id: a1
    text: "De tillhör varje människa, oberoende av nationalitet."
  - id: a2
    text: "De börjar gälla när en person får ett lands medborgarskap."
  - id: a3
    text: "De gäller den som har ett arbete och betalar skatt."
  correct_option_id: a1
- id: hb-c05-friheter-0001
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vilket påstående om grundläggande rättigheter i Finland är riktigt?"
  options:
  - id: a0
    text: "De skyddar utlänningar först när de får finskt medborgarskap."
  - id: a1
    text: "De skyddar utlänningar genom arbetsgivaren i stället för genom lag."
  - id: a2
    text: "De skyddar utlänningar först efter fem års bosättning."
  - id: a3
    text: "De skyddar i regel också utlänningar som bor i Finland."
  correct_option_id: a3
- id: hb-c05-friheter-0002
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vad skyddar rätten till personlig integritet i Finland?"
  options:
  - id: a0
    text: "Den egna egendomen mot olagligt förfogande"
  - id: a1
    text: "Möjligheten att ta del av offentliga handlingar"
  - id: a2
    text: "Den egna kroppen mot otillåtna ingrepp"
  - id: a3
    text: "Tillgången till grundläggande utbildning"
  correct_option_id: a2
- id: hb-c05-friheter-0003
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Är dödsstraff eller tortyr tillåtna i Finland?"
  options:
  - id: a0
    text: "Ja, dödsstraff är tillåtet men inte tortyr."
  - id: a1
    text: "Ja, tortyr är tillåten men inte dödsstraff."
  - id: a2
    text: "Nej, varken dödsstraff eller tortyr är tillåtna."
  - id: a3
    text: "Ja, båda är tillåtna vid särskilt allvarliga brott."
  correct_option_id: a2
- id: hb-c05-friheter-0004
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "När kan en handling ligga till grund för straff i Finland?"
  options:
  - id: a0
    text: "När en myndighet i efterhand beslutat att kriminalisera den"
  - id: a1
    text: "När den blev straffbar före domstolens avgörande"
  - id: a2
    text: "När den var straffbar i lag då den utfördes"
  - id: a3
    text: "När regeringen efteråt förklarat den samhällsskadlig"
  correct_option_id: a2
- id: hb-c05-friheter-0005
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vad innebär rörelsefriheten för den som lagligen vistas i Finland?"
  options:
  - id: a0
    text: "Att få använda privat mark som bostadsplats utan tillstånd"
  - id: a1
    text: "Att få bosätta sig i andra länder utan deras inresevillkor"
  - id: a2
    text: "Att få ersätta hemkommunens regler med egna beslut"
  - id: a3
    text: "Att få röra sig i landet och välja bostadsort inom lagens ramar"
  correct_option_id: a3
- id: hb-c05-friheter-0006
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vad gäller normalt för handlingar som finns hos finländska myndigheter?"
  options:
  - id: a0
    text: "De är hemliga om inte regeringen godkänner varje utlämnande."
  - id: a1
    text: "De blir offentliga först efter att myndigheten lagts ned."
  - id: a2
    text: "De är offentliga om lagstadgad sekretess inte gäller."
  - id: a3
    text: "De får lämnas ut till journalister men inte till privatpersoner."
  correct_option_id: a2
- id: hb-c05-friheter-0007
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vad innebär grundlagens egendomsskydd i Finland?"
  options:
  - id: a0
    text: "Att människors rätt att äga egendom är skyddad"
  - id: a1
    text: "Att egendom kan användas utan hänsyn till andras rättigheter"
  - id: a2
    text: "Att fastighetsägare är befriade från lagstadgade skatter"
  - id: a3
    text: "Att ägande ger rätt att avgöra vilka lagar som gäller på platsen"
  correct_option_id: a0
- id: hb-c05-friheter-0008
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vad gäller för grundläggande utbildning i Finland?"
  options:
  - id: a0
    text: "Undervisningen är gratis men obligatoriska läroböcker ska köpas."
  - id: a1
    text: "Familjen betalar undervisningsavgift men får skolmat avgiftsfritt."
  - id: a2
    text: "Den är en grundläggande rättighet och avgiftsfri."
  - id: a3
    text: "Den är avgiftsfri först efter att eleven fått finskt medborgarskap."
  correct_option_id: a2
- id: hb-c05-friheter-0009
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vad skyddar rätten att välja arbete eller näring i Finland?"
  options:
  - id: a0
    text: "Möjligheten att försörja sig genom självvalt lagligt arbete"
  - id: a1
    text: "Rätten att själv bestämma vilka anställningslagar som gäller"
  - id: a2
    text: "Rätten att få den anställning man föredrar utan behörighet"
  - id: a3
    text: "Rätten att utöva tillståndspliktig verksamhet utan tillstånd"
  correct_option_id: a0
- id: hb-c05-friheter-0010
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vem har rätt till oundgänglig försörjning och omsorg i Finland?"
  options:
  - id: a0
    text: "Den som köper en bostad oberoende av sin försörjning"
  - id: a1
    text: "Den som betalar skatt oberoende av sitt behov av stöd"
  - id: a2
    text: "Den som vill ersätta sin lön med en valfri offentlig ersättning"
  - id: a3
    text: "Den som inte själv kan få den trygghet ett människovärdigt liv kräver"
  correct_option_id: a3
- id: hb-c05-friheter-0011
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vilken princip ska det allmänna trygga inom social- och hälsovården i Finland?"
  options:
  - id: a0
    text: "Valfri behandling utan behovsbedömning eller rättsliga villkor"
  - id: a1
    text: "Tillräckliga tjänster enligt de villkor som lagen anger"
  - id: a2
    text: "Avgiftsfri privat vård genom ett allmänt löfte i grundlagen"
  - id: a3
    text: "Samma vårdinsats till varje person oberoende av behov"
  correct_option_id: a1
- id: hb-c05-friheter-0012
  section_id: hb-c05-friheter
  category: "Grundläggande friheter och rättigheter"
  question: "Vilken rätt har du när en domstol eller myndighet i Finland behandlar ditt ärende?"
  options:
  - id: a0
    text: "Ett beslut som följer det yrkande du framför"
  - id: a1
    text: "Ett slutligt beslut utan möjlighet till laglig överprövning"
  - id: a2
    text: "Valfri handläggare oberoende av myndighetens behörighet"
  - id: a3
    text: "Behörig behandling utan ogrundat dröjsmål"
  correct_option_id: a3
- id: hb-c05-jamstalldhet-0001
