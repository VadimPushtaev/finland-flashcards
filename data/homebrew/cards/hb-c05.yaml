  section_id: hb-c05-jamstalldhet
  category: "Jämställdhet mellan könen"
  question: "Kan en person få skilsmässa i Finland om den andra maken motsätter sig den?"
  options:
  - id: a0
    text: "Nej, båda makarna måste underteckna ansökan."
  - id: a1
    text: "Nej, om den andra maken betalar familjens gemensamma utgifter."
  - id: a2
    text: "Ja, men endast om makarna saknar gemensamma barn."
  - id: a3
    text: "Ja, den andra makens samtycke krävs inte."
  correct_option_id: a3
