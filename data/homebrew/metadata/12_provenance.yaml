    extracted_passage: Varje kommun har ett integrationsprogram som inkluderar de tjänster kommunen erbjuder
      nyanlända för att främja deras integration. De omfattar åtminstone en bedömning av servicebehovet,
      upprättande av en integrationsplan, handledning och rådgivning medan integrationsprogrammet pågår,
      flerspråkig samhällsorientering och integrationsutbildning, utbildning i läs- och skrivfärdighet
      och sluttestning av språkkunskaperna. Dessutom kan programmet inkludera annan utbildning och tjänster,
      som främjar kunskaper i finska eller svenska.
