    range_basis: normalized_html_block
    extracted_passage: Föräldraidealet, det vill säga idén om hur en bra förälder är, har förändrats med
      tiden. I dag anser man i Finland generellt att en bra förälder framför allt är kärleksfull och tålmodig.
      Hen tillbringar mycket tid tillsammans med barnet. Förr var det vanligare att framhäva lydnad och
