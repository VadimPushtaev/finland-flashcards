      end: 538
    range_basis: normalized_html_block
    extracted_passage: När en människa avlider, lämnar hen ofta efter sig egendom, till exempel pengar
      eller en bostad. Den avlidnes egendom kallas arv. Enligt lagen delas arvet mellan arvingarna. Arvingar
      är enligt lagen i första hand den avlidnes barn, eller om något av barnet har dött, barnbarnen,
      deras barn och så vidare. Om den avlidne inte har några barn, är maken eller makan, föräldrarna,
      syskonen, syskonens barn, far- och morföräldrarna eller i sista hand mostrar och fastrar, morbröder
      och farbröder arvingar. Den avlidnes kusiner är inte arvingar.
