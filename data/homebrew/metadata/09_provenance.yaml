    heading: I Finland är barn rätt så självständiga
    source_range:
      start: 0
      end: 429
    range_basis: normalized_html_block
    extracted_passage: I Finland värdesätter man generellt i hög grad att människor är självständiga och
      klarar sig själva. Det gäller också barnen. Också små barn uppmuntras att göra saker själva, till
      exempel ta på sig ytterkläderna. Ibland kräver det tålamod av de vuxna. I Finland anser man ändå
      att det är viktigt att barnen lär sig att ta ansvar för det som rör dem. Barnen får erfarenheter
      av framgång när de lär sig att göra saker på egen hand.
