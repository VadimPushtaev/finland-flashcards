    range_basis: normalized_html_block
    extracted_passage: I Finland är det också vanligt att barn rör sig utomhus på egen hand redan i ganska
      ung ålder. Det är till exempel mycket vanligt att sjuåriga förstaklassare går själva till skolan.
      Detta hänger samman med att man värdesätter barns självständighet, men en trygg miljö och det faktum
      att största delen av barnen går i skola nära hemmet gör det möjligt för dem att röra sig på egen
      hand. Det är dock viktigt att lära barnen hur man rör sig tryggt i trafiken, innan de får röra sig
      utomhus på egen hand.
