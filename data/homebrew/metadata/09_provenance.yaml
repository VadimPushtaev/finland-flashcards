    heading: Alla former av aga är förbjudna i Finland
    source_range:
      start: 0
      end: 534
    range_basis: normalized_html_block
    extracted_passage: Aga betyder att en förälder eller någon annan använder våld för att straffa ett
      barn eller för att få barnet att uppföra sig på ett visst sätt. Alla former av aga är förbjudna
      i lag i Finland. Aga är både fysisk bestraffning och psykiskt våld som används som straff. Fysisk
      bestraffning innebär allt som syftar till att orsaka barnet smärta, till exempel att slå, dra i
      håret, knäppa på fingrarna eller, om det är fråga om en baby, skaka den. Psykiskt våld kan vara
      till exempel att hota med våld, håna eller medvetet ignorera barnet.
