    heading: Underhållsskyldighet
    source_range:
      start: 0
      end: 445
    range_basis: normalized_html_block
    extracted_passage: Enligt Finlands lag är föräldrarna förpliktade att ta hand om sina minderåriga
      barn ekonomiskt och gifta par om varandra. Familjemedlemmarnas underhållsskyldighet sträcker sig
      inte till släktingar, till exempel vuxna syskon eller mor- eller farföräldrar. I Finland utgår man
      alltså inte från att enskilda människor tar hand om sådana släktingar som har det dåligt ställt
      ekonomiskt. Stödet kommer från samhället i form av den sociala tryggheten.
