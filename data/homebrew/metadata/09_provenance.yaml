      end: 1707
    range_basis: raw_pdf_page
    extracted_passage: "På 1800-talet föddes kvinnosaksrörelsen i Europa och Förenta staterna. Den strävade\
      \ till att främja \nlikställdhet mellan kvinnor och män. I Finland fastslogs år 1864 en lag som\
