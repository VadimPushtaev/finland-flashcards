    heading: Familjerna har blivit mindre under det senaste århundradet
    source_range:
      start: 0
      end: 549
    range_basis: normalized_html_block
    extracted_passage: Ofta har man den uppfattningen att en familj är detsamma som en barnfamilj, som
      består av föräldrar och minst ett barn. En sådan familj kallas i Finland för kärnfamilj. I Finland
      finns det också många andra slags familjer. Uppfattningen om hurdana de finländska familjerna är
      förändras hela tiden. Nuförtiden finns det i barnfamiljerna oftast ett eller två barn. Man får barn
      senare än tidigare. Det finns också många människor och par som inte har barn. Av dem är många frivilligt
      barnlösa. Andra i sin tur kan inte få barn även om de skulle vilja.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
