    heading: Familjerna har blivit mindre under det senaste århundradet
    source_range:
      start: 0
      end: 401
    range_basis: normalized_html_block
    extracted_passage: I det finska språket finns det olika ord för ”familj” och ”släkt”. Med dem avses
      olika saker, även om de hänger samman med varandra. Med familj avses i allmänhet familjemedlemmar
      som bor tillsammans eller en helhet bestående av föräldrar och barn. Släkt i sin tur betyder en
      större grupp av släktingar bestående av bland annat far- och morföräldrar, fastrar, mostrar, farbröder,
      morbröder och kusiner.
    normalization: whitespace_only
    repairs: []
