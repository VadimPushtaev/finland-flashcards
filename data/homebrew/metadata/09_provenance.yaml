    heading: Alla former av aga är förbjudna i Finland
    source_range:
      start: 0
      end: 598
    range_basis: normalized_html_block
    extracted_passage: Aga är skadlig för barnets utveckling. De negativa följderna för barn av också
      lindriga former av aga har påvisats på ett omfattande och övertygande sätt i undersökningar på olika
      håll i världen. Det kan verka som att aga fungerar och förändrar barnets beteende, eftersom det
      orsakar barnet omedelbar smärta och rädsla. På lång sikt ökar ändå agan barnets aggressivitet, rädslor
      och beteendestörningar. Den är därmed i alla sina former en ineffektiv och skadlig uppfostringsmetod.
      Barn som har upplevt aga växer upp till vuxna som mår sämre, är sjukare och mer våldsamma än barn
      som inte har agats.
