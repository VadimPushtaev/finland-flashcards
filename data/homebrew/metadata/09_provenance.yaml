    range_basis: normalized_html_block
    extracted_passage: Den vanligaste typen av barnfamilj i Finland är kärnfamiljen, det vill säga två
      föräldrar och deras gemensamma barn. Av föräldrarna i barnfamiljerna är största delen gifta med
