    range_basis: normalized_html_block
    extracted_passage: Könsnormer skapar oskrivna regler för hur kvinnor och män ska bete sig. Brott mot
      dessa regler åtföljs ofta av någon form av socialt straff. Straffet kan vara lindrigt, till exempel
      förvåning, skratt eller ogillande. Det kan också vara strängare, till exempel skymf, diskriminering,
      utestängning från gemenskapen eller i extremfall till och med våld. Därför försöker människor i
      allmänhet agera i enlighet med normen.
