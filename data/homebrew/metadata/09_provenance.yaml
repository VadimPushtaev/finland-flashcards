    range_basis: normalized_html_block
    extracted_passage: Att sätta gränser för barn kan ibland vara utmanande. Alla föräldrar måste lära
      sig olika sätt för att styra och vid behov begränsa barnet utan våld. Det är bra för föräldrarna
      att lära sig att identifiera de känslor som kan få dem att aga sitt barn. Nuförtiden anser man att
      barn lär sig att respektera vuxna som tydligt berättar för dem hurdant beteende som är acceptabelt
      och inte. En bra förälder är konsekvent och rättvis. Hen lyssnar på barnet och motiverar varför
      hen vill att saker och ting ska göras på ett visst sätt.
