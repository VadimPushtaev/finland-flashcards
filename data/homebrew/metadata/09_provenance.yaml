    extracted_passage: Äktenskap ingicks länge av förnuftsskäl, och släkten hade inflytande på valet av
      make. Redan på 1700-talet föreskrevs ändå att både mannen och kvinnan måste ge sitt frivilliga samtycke
      till äktenskapet. Mot slutet av 1800-talet började uppfattningen om att äktenskapet ska bygga på
      kärlek bli vanligare. Det var möjligt att vara ogift, men tidigare kunde det hända att kvinnor som
      förblev ogifta föraktades. Skilsmässor var ovanliga före andra världskriget, även om den lutherska
      kyrkan redan från början har möjliggjort skilsmässa i vissa fall.
