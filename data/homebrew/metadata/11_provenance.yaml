    source_range:
      start: 0
      end: 506
    range_basis: normalized_html_block
    extracted_passage: Ett bra sätt att balansera inkomster och utgifter är med hjälp av budgetering.
      Först räknar man hur mycket pengar man har till sitt förfogande till exempel under en månad eller
      en vecka. Efter det fördelar man beloppet mellan olika typer av utgifter. Först drar man av alla
      fasta, nödvändiga utgifter såsom hyra, läkemedel och nödvändiga fakturor. Det resterande beloppet
      fördelas mellan övriga utgifter. På så vis ser man hur mycket man kan spendera på en månad på till
      exempel mat och fritidsaktiviteter.
    normalization: whitespace_only
