    heading: Man kan äga ett egnahemshus eller en bostadsaktie
    source_range:
      start: 0
      end: 469
    range_basis: normalized_html_block
    extracted_passage: Om man äger en bostad i ett höghus eller ett radhus är det fråga om en bostadsaktie.
      I sådana fall äger personen inte själva bostaden, utan aktier i det husbolag som förvaltar huset.
      I husbolaget bestämmer aktieägarna tillsammans om vilka renoveringar som ska göras i huset och om
      underhållet av det. Dessutom betalar aktieägarna varje månad ett vederlag till husbolaget som täcker
      bland annat uppvärmningen av bostaden, avfallshanteringen och servicebolagets tjänster.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
