    range_basis: normalized_html_block
    extracted_passage: Tomten som ett hus står på kan ägas av husets ägare eller av bostadsaktiebolaget.
      Tomten kan också vara en arrendetomt, som ägs av till exempel kommunen. De boende i ett hus som
      ägs av ett bostadsaktiebolag på en arrendetomt betalar hyra för tomten som en del av vederlaget.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
