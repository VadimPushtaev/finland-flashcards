    range_basis: normalized_html_block
    extracted_passage: När man fattar beslut är det viktigt att komma ihåg att lånade pengar inte är gratis.
      När man tar lån lovar man att sköta om de kommande betalningarna och ofta också om att betala ränta.
      Räntan är priset för de lånade pengarna. Ibland kan det vara motiverat att ta lån för en större
