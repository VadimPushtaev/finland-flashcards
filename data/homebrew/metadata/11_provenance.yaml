    heading: Bostadsrättsbostad
    source_range:
      start: 0
      end: 277
    range_basis: normalized_html_block
    extracted_passage: En bostadsrättsbostad är en bostad för vilken du först betalar en bostadsrättsavgift.
      Dessutom betalar du varje månad en viss summa för boendet, ett bruksvederlag. Bostadsrättsavgiften
      är cirka 15 procent av bostadens pris. Bruksvederlagets storlek beror på bostaden och orten.
    normalization: whitespace_only
