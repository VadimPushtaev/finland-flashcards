    range_basis: normalized_html_block
    extracted_passage: Hyresbostäderna i ett bostadsbolag som ägs av en stad eller en kommun är i allmänhet
      billigare än bostäder som ägs av en privatperson eller ett företag. Det kan ändå finnas många sökande
      till stadens eller kommunens bostäder. Man kan göra en bostadsansökan på internet.
    normalization: whitespace_only
    repairs: []
