    extracted_passage: Det är lätt att hitta annonser om hyresbostäder på internet. Bostäder hyrs ut av
      bostadsbolag, som ägs av städer och kommuner samt olika företag. Även privata hyresvärdar söker
      hyresgäster. Privata hyresvärdar är människor som äger bostäder.
