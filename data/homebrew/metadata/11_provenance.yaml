    heading: Man kan äga ett egnahemshus eller en bostadsaktie
    source_range:
      start: 0
      end: 248
    range_basis: normalized_html_block
    extracted_passage: Ägarboende betyder för det mesta att den boende äger antingen ett egnahemshus eller
      en bostadsaktie. När man äger ett egnahemshus är man själv ansvarig för alla reparationer, skatter
      och andra avgifter som är förknippade med huset och att bo i det.
    normalization: whitespace_only
    repairs: []
