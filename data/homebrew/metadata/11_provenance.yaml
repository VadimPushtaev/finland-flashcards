    range_basis: normalized_html_block
    extracted_passage: Klimatförändringen innebär att temperaturen på jorden gradvis ökar. Klimatförändringen
      har många allvarliga konsekvenser för människornas och djurens liv på hela jordklotet. När temperaturen
      på jorden ökar blir det svårare och svårare att bedriva jordbruk. De extrema väderfenomenen blir
      kraftigare, vilket innebär att det på torra platser blir allt torrare och varmare och på andra platser
      fuktigare eller kallare. Förändringarna orsakar fara för både människorna, djuren och hela vår livsmiljö.
