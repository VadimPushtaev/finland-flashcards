gaps:
- topic: Precise current tuition entitlement and funding
  reason: Archive mixes simplified school-age wording and fee rules; selected passages retain source qualifications,
    without certifying present-day eligibility. No unsupported age20 material added.
  source_refs:
  - orientation:laromedel/studier-och-utbildning/utbildning-pa-andra-stadiet
  - infofinland:education/financing-your-studies
resolutions:
- issue: Compulsory education endpoint
  decision: Exclude textbookPDFp66 age17; use orientation b0020 age18 or upper-secondary graduation with
    guardian duty intact.
- issue: Student housing support
  decision: Use InfoFinland financing-your-studies b0014/b0022 housing supplement; omit orientation b0083
    general housing benefit presentation.
- issue: Free higher education
  decision: Omit blanket summary and retain qualified orientation vuxenutbildning b0037 explaining English-degree
    fees for students from outside EU.
- topic: Private early-childhood support and provider responsibility
  decision: 'Restore whole introductory block b0002 identifying municipal/public and private providers,
    and all eligibility/payment paragraphs b0036–b0042 after the support summary: residence, approved
    provider, eligible care, household exclusion, means factors, direct payment, taxation and no payment
    abroad.'
snapshot_sensitive_passages:
- Study support, fee eligibility, preparatory programmes, language thresholds, degree durations and agency
  names remain snapshot claims.
- Numeric grading scales and matriculation examination structure retained as civic education-system context;
  no exam coaching.
visual_review:
  decision: System pathways can be understood from retained degree/progression paragraphs; no essential
    locally archived HTML figure is available.
  reviewed_sources:
  - Textbook history selectedPDF64–65 paragraphs contain full standalone prose.
  - Education HTML image URLs are references, not downloaded assets.
editorial_policy: Whole paragraphs and complete lists; eight historical PDFparagraphs whitespace-normalized;
  one adult-education paragraph filtered only to remove a trailing internal-link instruction. Complete-sentence
  range cuts remove trailing website/contact pointers; exact cut ranges retained in provenance.
