      start: 194
      end: 757
    range_basis: raw_pdf_page
    extracted_passage: "Arbetsmarknaden betyder marknaden mellan arbetsgivare och arbetstagare, där arbetstagarna\
      \ söker \narbete och arbetsgivarna erbjuder arbete. När en arbetsgivare erbjuder ett arbete åt en\
      \ arbetstagare \ngör de upp ett arbetsavtal och kommer i ett anställningsförhållande till varandra.\
      \ Arbetsmarknaden är \nen viktig del av samhället, som man försöker påverka genom politik och annat\
      \ beslutsfattande. På \narbetsmarknaden verkar olika människor i olika ställningar samt många slag\
      \ av institutioner. \nArbetsmarknaden styrs av lagar, avtal och näringslivets konjunkturer."
