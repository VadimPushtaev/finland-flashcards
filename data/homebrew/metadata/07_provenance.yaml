    heading: Den privata sektorn genererar vinst och skatteintäkter, den offentliga sektorn välfärd med
      hjälp av skatter
    source_range:
      start: 0
      end: 580
    range_basis: normalized_html_block
    extracted_passage: När man talar om ekonomi och arbetsplatser talar man ofta om den privata sektorn
      och den offentliga sektorn. Med privata sektorn avses närmast företagsverksamhet som ägs av privatpersoner
      eller privata grupper. Till den privata sektorn hör alla företag, både små företag och stora multinationella
      företag. Syftet med företag är att generera vinst för sina ägare. Företagen lyssnar på vad de betalande
      kunderna vill ha och behöver och erbjuder dem sådana varor och tjänster. Företagen betalar skatt
      till staten. Med statens skatteintäkter bekostas den offentliga sektorns tjänster.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
