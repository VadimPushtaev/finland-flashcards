    heading: Exporten och utrikeshandeln är viktiga för Finlands ekonomi
    source_range:
      start: 0
      end: 455
    range_basis: normalized_html_block
    extracted_passage: Finland är starkt beroende av exporten till och handeln med andra länder. Export
      betyder att finländska företag säljer varor och tjänster till andra länder. Dessa företag betalar
      skatt i Finland och lön till sina anställda. På så vis stannar pengarna i Finland. Import i sin
      tur innebär att man importerar varor och tjänster till Finland från andra länder. Då betalar företag
      och människor i Finland för varorna och tjänsterna till företag i andra länder.
    normalization: whitespace_only
    repairs: []
