      \ och \nåtgärder, som lönenivå, arbetstider, åtgärder som förbättrar sysselsättningen och liknande.\
      \ Det här \nsystemet kallas arbetsmarknadssystemet och det har fått sin nuvarande form efter hand."
    normalization: whitespace_only
