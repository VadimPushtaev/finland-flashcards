      en större andel skatt än på en mindre lön. Skatteprocenten anger hur mycket skatt du betalar på
      dina inkomster. Den beräknas i Finland för var och en separat. Din makas/makes inkomster inverkar
      inte på din skatteprocent. Du kan uppskatta din skatteprocent med Skatteförvaltningens skatteräknare.
