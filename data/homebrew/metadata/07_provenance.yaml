    range_basis: normalized_html_block
    extracted_passage: Arbetet och arbetets karaktär har förändrats mycket i Finland under de senaste
      årtiondena. Tidigare arbetade en stor del av människorna heltid på samma arbetsplats i många år
      eller till och med hela sin karriär. Numera är arbetet inte lika oföränderligt. En del utför många
      olika arbeten samtidigt för olika arbetsgivare. Andelen deltidsarbeten och korta anställningar,
      det vill säga kortjobb, har ökat.
