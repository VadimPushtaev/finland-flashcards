      end: 1600
    range_basis: raw_pdf_page
    extracted_passage: "Den finländska arbetsmarknaden styrs av en kultur av demokratiskt förhandlande\
      \ och \növerenskommande. På arbetsmarknaden representeras enskilda människor av institutioner, till\
