    heading: Man skiljer tydligt på arbetstid och fritid
    source_range:
      start: 0
      end: 495
    range_basis: normalized_html_block
    extracted_passage: I Finland är man ofta noggrann med att skilja på arbete och fritid. På arbetstid
      arbetar arbetstagaren, och på fritiden har hen egen tid. Arbetet börjar och slutar en viss tid.
      Människorna tillbringar inte nödvändigtvis tid med sina arbetskamrater när de är lediga. Undantag
      är gemensamma fester på arbetsplatsen, till exempel julfester och rekreationsdagar. Syftet med dem
      är att förbättra gemenskapen på arbetsplatsen. Till arbetsplatsens fester blir de anställdas makar
      inte så ofta inbjudna.
    normalization: whitespace_only
