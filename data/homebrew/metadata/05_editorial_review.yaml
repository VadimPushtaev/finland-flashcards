resolutions:
- topic: Demonstrations
  source_refs:
  - individens-rattigheter-och-skyldigheter:b0020
  - legislation-and-rights:b0010
  decision: Use InfoFinland full item including police notification, retain association sentence separately.
- topic: School obligation
  source_refs:
  - individens-rattigheter-och-skyldigheter:b0034
  - skolgang-och-studier-i-finland:b0018
  - textbook:PDF116
  decision: Use the fuller orientation education paragraph. Do not repeat textbook ages 7-16 or flatten
    the secondary-completion condition.
- topic: Abortion limits
  source_refs:
  - sexuell-halsa:b0061-b0062
  - abortion:b0009-b0020
  decision: Reject the orientation later-abortion passage saying no justified/legal ground through week
    24; retain InfoFinland distinctions between weeks 12, 20, 24 and danger to health, with the complete
    grounds list. No updated external authority names substituted.
- topic: National languages
  source_refs:
  - individens-rattigheter-och-skyldigheter:b0024
  - finlands-befolkning:b0014-b0015
  - finlands-lage-och-olika-omraden:b0032
  decision: Retain population-page rights plus explicit Swedish-only Aland paragraph.
- topic: Citizen versus resident rights
  source_refs:
  - individens-rattigheter-och-skyldigheter:b0042-b0049
  - the-rights-and-obligations-of-finnish-citizens:b0002-b0009
  - legislation-and-rights:b0015
  decision: Use qualified InfoFinland introduction and age-qualified voting/candidacy items; retain possibility
    of noncitizen voting.
- topic: Prescription referent
  source_refs:
  - sexual-health-and-contraception:b0019-b0020
  decision: Keep the complete preceding prescription paragraph so the minor-consent passage does not refer
    to a missing receptet. Accept the small amount of practical text to preserve context.
gaps:
- topic: Extradition qualifications
  source_refs:
  - individens-rattigheter-och-skyldigheter:b0047
  - the-rights-and-obligations-of-finnish-citizens:b0005
  reason: The archived rights lists give an unqualified right to refuse surrender. Appropriate exceptions
    are not explained in the inspected materials. Retain entry/non-expulsion clauses separately; hold
    only the extradition clause out, with no substitute rule invented.
snapshot_sensitive_passages:
- Military-service age 18-60, durations and sanctions; source explicitly dates recruitment figures 2023/2024.
- Regionforvaltningsverket and Valvira names and institutional remits are archived wording, not independently
  verified for 2026.
- Reproductive-health thresholds and minor consent rules are archived accounts.
- Minority population estimates, language-service and healthcare entitlement summaries are not exhaustive
  legal formulations.
preserved_source_defects:
- sexuell-halsa:b0018 has ssådant; left verbatim.
- religions-in-finland:b0014 begins Nät; left verbatim.
- abortion:b0009 repeats kan du; left verbatim.
- finlands-befolkning:b0037 has a malformed rights phrase; left verbatim.
- jamstalldhet-och-likabehandling:b0046 uses Egendomen where its context suggests a different word; left
  verbatim.
visual_review:
  decision: No visual required to understand these selected passages. No figure or table pointer retained.
  evidence: Selected textbook PDF pages 114 and 115 were rendered locally and inspected; both selections
    are plain paragraphs. Website illustrations are not local assets and are not fetched.
sentence_review: All sentence starts/ends reviewed against the Swedish reading copy. List fragments are
  valid segments; protected decimal times/dates, abbreviations, Swedish code points and quote endings
  have regression tests. Sentence IDs/ranges are frozen in wip/homebrew/pilot_sentences.yaml; rebuilds
  fail on changed text.
