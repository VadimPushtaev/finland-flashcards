    heading: Barnets föräldrar är vanligtvis också hens vårdnadshavare
    source_range:
      start: 0
      end: 504
    range_basis: normalized_html_block
    extracted_passage: Alla barn under 18 år har också en eller två vårdnadshavare. Vårdnadshavarna är
      i allmänhet barnets föräldrar. Ibland kan vårdnadshavaren vara någon annan. Vårdnadshavaren beslutar
      om barnets omsorg, uppfostran, boendeort och andra viktiga frågor. Enligt finsk lag måste man ändå
      lyssna på barnets önskemål i frågor som rör hen. Barnet ska ha en trygg livsmiljö och positiva och
      nära relationer till andra människor. Vårdnadshavaren är skyldig att se till barnets välbefinnande
      och harmoniska utveckling.
    normalization: whitespace_only
