    range_basis: normalized_html_block
    extracted_passage: I Finland har personer med funktionsnedsättning samma rättigheter som alla andra.
      De har rätt att delta i samhället och beslutsfattande som rör dem på ett jämlikt sätt med övriga
      invånare. De har enligt lagen rätt också till tjänster som stöder funktionsförmågan, såsom mobilitetstjänster,
      assistans- och tolkningstjänster och olika hjälpmedel. Det är samhällets uppgift att säkerställa
