    heading: Internaliserad rasism och minoritetsstress
    source_range:
      start: 0
      end: 679
    range_basis: normalized_html_block
    extracted_passage: Upprepad rasism som förekommer i interaktion och mikroaggressioner kan ge upphov
      till minoritetsstress. Den uppkommer till följd av upplevelser av diskriminering och rasism eller
      en rädsla för att sådana ska upprepas i olika situationer. Minoritetsstress försämrar människans
      välbefinnande. Den kan också leda till internaliserad rasism, det vill säga till att den som upplever
      rasism själv börjar tro att hen är på något sätt sämre än andra. Den kan påverka självkänslan och
      uppfattningen om den egna förmågan på ett negativt sätt. Internaliserad rasism uppkommer ofta till
      följd av att omgivningen inte ingriper i rasistiska situationer, utan tigande verkar acceptera rasismen.
    normalization: whitespace_only
    repairs: []
