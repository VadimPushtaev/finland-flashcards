    heading: Diskriminering kan vara ett brott
    source_range:
      start: 0
      end: 533
    range_basis: normalized_html_block
    extracted_passage: Annorlunda behandling är ändå inte alltid diskriminering om den baserar sig på
      lagen eller det finns godtagbara skäl till den. I sådana fall pratar man om positiv särbehandling,
      som betyder att en människa eller en grupp får särskilt stöd. Positiv särbehandling kan vara till
      exempel integrationsutbildning för nyanlända eller sysselsättningsstöd för unga. Syftet med dessa
      är att jämna ut skillnaderna i fråga om människors möjligheter. Målet är att alla ska ha samma möjligheter
      att få utbildning, arbeta och delta i samhällslivet.
