    heading: Socialisterna försvarade arbetarnas rättigheter
    source_range:
      start: 0
      end: 586
    range_basis: normalized_html_block
    extracted_passage: Under industrialiseringen i Europa påverkades samhällsutvecklingen av bland annat
      socialismen. Ideologin strävade efter att förbättra arbetarnas ställning. Socialisterna motsatte
      sig det kapitalistiska ekonomiska systemet, där privatpersoner ägde alla fabriker och maskiner.
      Viktiga frågor var medborgarnas jämlikhet, social rättvisa och kvinnornas rösträtt. Fackförbund
      och socialistiska partier grundades runt om i Europa. I Finland fanns det ännu i slutet av 1800-talet
      endast lite fabriksarbetare, eftersom industristäderna var små. På landsbygden hade de fattiga det
      dåligt ställt.
