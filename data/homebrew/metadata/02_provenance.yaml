    heading: Under upplysningen utvecklades rättsstaten och de mänskliga rättigheterna
    source_range:
      start: 0
      end: 519
    range_basis: normalized_html_block
    extracted_passage: I slutet av 1600-talet inleddes en period i Europa som kallades upplysningen. Under
      upplysningen ville man minska den enväldige kungens makt och kyrkans stora inflytande. Man började
      ägna uppmärksamhet åt mänskliga rättigheter och ville göra staten till en rättsstat. I en rättsstat
      har alla människor mänskliga rättigheter, politiska rättigheter och rätt att delta i samhället.
      I Sverige till exempel förbjöd man tortyr som förhörsmetod. Viktiga mål under upplysningen var rösträtt,
      yttrandefrihet och religionsfrihet.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
