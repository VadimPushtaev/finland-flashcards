  hb-c02-u0054:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 14
    printed_page: 13
    source_range:
      start: 1494
      end: 2119
    range_basis: raw_pdf_page
    extracted_passage: "Först klarade sig Finland bra i kriget och erövrade fler områden. Men sedan blev\
      \ det slut med Finlands \nbundsförvant Tysklands framgångar i Europa. Tyskland hade under andra\
      \ världskriget erövrat en stor \ndel av Europa, men det stora anfallet mot Sovjetunionen misslyckades\
      \ och Tyskland måste retirera. \nSovjetunionen anföll Finland och hösten 1944 slöt man fred. Finland\
      \ måste igen överlåta områden åt \nSovjetunionen, betala krigsskadestånd och driva ut de tyska trupper\
      \ som fanns i landet. Kriget mot \nde tyska trupperna kallas lapplandskriget. I det kriget brände\
      \ tyskarna en stor del av Lappland när de \nlämnade Finland. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0055:
    source_path: data/infofinland/content/information-about-finland/finnish-history.html
    sha256: e04965fb86cc9d6361439afdb52bd74b5125d5d3e65ead4e5cfdf08e7a91f31d
    source_block: b0035
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(8)
