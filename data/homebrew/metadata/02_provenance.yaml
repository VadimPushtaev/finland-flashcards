      > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1)
      > p:nth-of-type(13)
    source_kind: p
    source_role: content
    heading: Efter krigen påbörjades uppbyggnaden av välfärdsstaten
    source_range:
      start: 0
      end: 462
    range_basis: normalized_html_block
    extracted_passage: Efter krigen utvecklades Finlands industri och ekonomin växte kraftigt. Den politiska
      viljan att bygga upp Finland till ett ännu bättre, mer jämlikt och tryggare land var stark. Samtliga
      partier antog som sitt politiska mål att bygga upp en välfärdsstat. En viktig förutsättning för
      uppbyggnaden var tillräcklig ekonomisk tillväxt. Människorna förenades av att de upplevt svåra levnadsförhållanden,
      vilket gjorde att alla förband sig till att utveckla samhället.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0060:
    source_path: data/orientation/sv/laromedel/finlands-historia/huvuddragen-i-finlands-historia-2-det-sjalvstandiga-finland.html
    sha256: 408b0f4098812e05ecc24922773c664f82186f3406d9cc24853360116285ee77
    source_block: b0028
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1)
      > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(2) > section:nth-of-type(1)
      > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1)
      > p:nth-of-type(14)
    source_kind: p
    source_role: content
    heading: Efter krigen påbörjades uppbyggnaden av välfärdsstaten
    source_range:
      start: 0
      end: 356
    range_basis: normalized_html_block
    extracted_passage: Så småningom blev Finland en välfärdsstat, där staten och kommunerna gavs en viktig
      roll i att säkerställa medborgarnas levnadsstandard och försörjning. Det faktum att alla medborgare
      erbjöds tjänster och social trygghet som tillhandahölls med skattemedel fick människorna att lita
      på det demokratiska beslutsfattandet och samhället och dess institutioner.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0061:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 25
    printed_page: 24
    source_range:
      start: 2652
      end: 3044
    range_basis: raw_pdf_page
    extracted_passage: "Ännu i slutet av 1800-talet var det främst familjen, bygemenskapen och enskilda\
      \ förmögna välgörare \nsamt framför allt kyrkan som tog hand om fattiga och sjuka i Finland. Sedan\
      \ överfördes ansvaret för \nlandsbygdens fattiga allt mer från kyrkan till kommunerna. De fattiga\
      \ arbetarna fick ekonomisk hjälp \nbara om de samtidigt förband sig att arbeta för en gård, en kommun\
      \ eller en församling. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0062:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 25
    printed_page: 24
    source_range:
      start: 3044
      end: 3486
    range_basis: raw_pdf_page
    extracted_passage: "Under industrialiseringen i slutet av 1800-talet blev det allmän diskussion om\
      \ fabriksarbetarnas usla \nvillkor och fattigdom. Det lilla socialskydd fabriksarbetarna hade sköttes\
      \ främst av arbetsgivarna och \nsmåningom även av medborgarorganisationer. På fabriksorter ägde\
      \ och administrerade fabriksägaren \nockså arbetarnas bostäder, daghem och åldringsvård. Fabriken\
      \ påverkade hela arbetarnas livsmiljö \noch knöt dem tätt till arbetsgivaren. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0063:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 26
    printed_page: 25
    source_range:
      start: 309
      end: 833
    range_basis: raw_pdf_page
    extracted_passage: "Samhällsaktiviteten i organisationerna var viktig för demokratins utveckling i\
      \ Finland. Till de första \nstora folkrörelserna i Finland hörde nykterhetsrörelsen, gymnastik-\
      \ och idrottsrörelsen, arbetar- och \nfackföreningsrörelserna samt ungdomsföreningar. Folkrörelserna\
      \ och samhällsaktiviteten hjälpte till \natt förena finländarna som nation. De utbildade och upplyste\
      \ finländarna, skapade nationalkänsla och \nlärde människorna att sköta gemensamma ärenden. Allt\
      \ detta behövdes när Finland blev en \nsjälvständig stat 1917. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0064:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 26
    printed_page: 25
    source_range:
      start: 1254
      end: 1984
    range_basis: raw_pdf_page
    extracted_passage: "Grunden till den finska välfärden är heltäckande tjänster inom social- och utkomstskydd.\
      \ \nSocialskyddssystemet, en struktur av sociala förmåner och understöd, utvecklades senare i Finland\
      \ \nän i de övriga nordiska länderna. År 1895 stiftades en lag om arbetsolycksfallsförsäkring. Det\
      \ var \nförsta steget i utvecklandet av finsk socialförsäkring, men var också länge den enda formen\
      \ av \nsocialförsäkring i Finland. Lagen fastslog att arbetstagaren skulle betalas ersättning i\
      \ fall av \narbetsolycka eller yrkessjukdom. Den tidens finska socialförsäkring var internationellt\
      \ sett \ngammalmodig, men i den oeniga politiska atmosfär som härskade var det mycket svårt att\
      \ införa \nförsäkringar för ålderdom, arbetsoförmåga eller sjukdom. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0065:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 26
    printed_page: 25
    source_range:
      start: 1984
      end: 2463
    range_basis: raw_pdf_page
    extracted_passage: "Även om socialministeriet, som skulle ansvara för socialskyddet, grundades vid\
      \ samma tid som \nFinland blev självständigt 1917, började man skapa omfattande offentliga stödsystem\
      \ i Finland först \ni slutet av 1930-talet. Den första folkpensionslagen godkändes 1937. Lagen gav\
      \ de försäkrade \nfolkpension, det vill säga ekonomisk hjälp för ålderdomen och vid arbetsoförmåga.\
      \ Samma år \ngrundades Folkpensionsanstalten FPA (på finska Kela), vars uppgift var att betala folkpensionen.\
      \ \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0066:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 26
    printed_page: 25
    source_range:
      start: 2515
      end: 3152
    range_basis: raw_pdf_page
    extracted_passage: "Den ursprungliga målsättningen med att göra Finland till en välfärdsstat var att\
      \ minska fattigdomen \noch garantera en daglig utkomst för alla finländare. Man ansåg att detta\
      \ skulle stabilisera samhället \noch dess utveckling och minska stödet för alla slags extrema rörelser.\
      \ Tanken var också att mindre \ninkomstskillnader skulle göra människorna mer jämlika. Det skulle\
      \ leda till att Finlands folk skulle \nvara enigare och alla skulle vilja arbeta för att utveckla\
      \ landet. Det skulle vara lättare för olika \nbefolkningsgrupper, till exempel rika och fattiga\
      \ och grupper med olika politiska uppfattningar, att \nleva i fred med varandra. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0067:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 27
    printed_page: 26
    source_range:
      start: 783
      end: 1286
    range_basis: raw_pdf_page
    extracted_passage: "Under 1960- och 1970-talet utvecklades Finland småningom till en nordisk välfärdsstat.\
      \ Sverige var \nett modelland i fråga om välfärden och påverkade Finland mycket. Staten tog allt\
      \ mer ansvar för \nmedborgarnas välfärd. Medborgarna fick fler inkomstöverföringar från staten,\
      \ till exempel \nmoderskapspenning och sjukpenning samt ersättningar för läkemedelsutgifter och\
      \ läkararvoden. Det \nsatsades på utbildning och sjukvård genom att det byggdes nya sjukhus och\
      \ skolor och \nläkarutbildningen utvidgades. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0068:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 27
    printed_page: 26
    source_range:
      start: 1761
      end: 2245
    range_basis: raw_pdf_page
    extracted_passage: "Välfärdsstaten utvecklades ur jämlikhetsperspektiv. På 1970-talet började alla\
      \ barn oberoende av \nsamhällsklass gå samma kostnadsfria grundskola. De som studerade vid universitet,\
      \ högskolor eller \nandra stadiets läroanstalter började få studiestöd, det vill säga ekonomiskt\
      \ stöd för livet under \nstudietiden. Tack vare studiestödet hade barndomsfamiljens tillgångar inte\
      \ längre så stor betydelse \nför om en ung vuxen hade ekonomisk möjlighet att utbilda sig till det\
      \ yrke hen ville. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0069:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 2700
      end: 2970
    range_basis: raw_pdf_page
    extracted_passage: "Först på 1900-talets sida började större delen av befolkningen stöda folkskolan\
      \ och 1921 stiftades en \nlag om läroplikt i Finland. Det betydde att skolgång blev obligatoriskt\
      \ för alla. Folkskolan utvidgades \ntill att omfatta hela åldersklassen på 1920- och 1930-talet.\
      \ \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0070:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 2970
      end: 3382
    range_basis: raw_pdf_page
    extracted_passage: "Gymnasieutbildning och studentexamen blev vanligare särskilt på 1950- och 1960-talet.\
      \ I Finland \nbörjade man eftersträva samhällelig jämlikhet och ekonomisk utveckling genom att bygga\
      \ en \nvälfärdsstat. Samtidigt föddes tanken på en enhetlig 9-årig grundskola. Under 1970-talet\
      \ övergick \nman i hela landet från det gamla systemet med separat folkskola och läroverk till en\
      \ grundskola som \nvar gemensam för alla. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c02-u0071:
    source_path: data/orientation/sv/laromedel/finlands-historia/huvuddragen-i-finlands-historia-2-det-sjalvstandiga-finland.html
    sha256: 408b0f4098812e05ecc24922773c664f82186f3406d9cc24853360116285ee77
    source_block: b0030
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1)
