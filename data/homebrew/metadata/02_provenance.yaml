    range_basis: normalized_html_block
    extracted_passage: Den kraftiga utvecklingen och blomstringen i de länder som deltog i kolonialismen
      skedde delvis på koloniernas bekostnad. Länderna som deltog i koloniseringen, till exempel Sverige
