    source_kind: p
    source_role: content
    heading: Efter krigen påbörjades uppbyggnaden av välfärdsstaten
    source_range:
      start: 0
      end: 359
    range_basis: normalized_html_block
    extracted_passage: Efter andra världskriget tvingades Finland hålla samma linje som Sovjetunionen
      i sin utrikespolitik för att undvika ockupation. Officiellt var Finland ett neutralt land, men i
      verkligheten måste det i sin politik också beakta Sovjetunionens intressen. Å andra sidan förblev
      Finland ett självständigt land och drog ekonomisk nytta av handeln med Sovjetunionen.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c02-u0059:
    source_path: data/orientation/sv/laromedel/finlands-historia/huvuddragen-i-finlands-historia-2-det-sjalvstandiga-finland.html
    sha256: 408b0f4098812e05ecc24922773c664f82186f3406d9cc24853360116285ee77
    source_block: b0027
    locator: html:nth-of-type(1) > body:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1)
