      > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1)
      > p:nth-of-type(15)
    source_kind: p
    source_role: content
    heading: Finland gick från jordbrukssamhälle till service- och informationssamhälle
    source_range:
      start: 0
      end: 319
    range_basis: normalized_html_block
    extracted_passage: På 1960-talet började Finland gå från ett jordbruksdominerat land till ett industri-
