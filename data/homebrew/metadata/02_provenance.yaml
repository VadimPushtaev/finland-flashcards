    range_basis: normalized_html_block
    extracted_passage: Den katolska kyrkan kom till Finland via Sverige och den ortodoxa kyrkan från Novgorod
      i öster, nuvarande Rysslands område. Nöteborgsfreden 1323 avslutade kriget mellan Sverige och Novgorod
      om herraväldet i området. Med freden etablerades den katolska tron i Finlands västra delar och den
      ortodoxa tron i landets östra delar. Denna gräns mellan religionerna finns fortfarande, men med
      reformationen byttes den katolska tron till den lutherska.
    normalization: whitespace_only
    repairs: []
