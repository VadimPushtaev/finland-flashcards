    heading: Genom reformationen övergick man från katolicism till lutherdom
    source_range:
      start: 0
      end: 517
    range_basis: normalized_html_block
    extracted_passage: Till följd av reformationen övergick man i en del av Europa på 1500-talet från
      katolicismen till protestantisk tro. I Sverige och den östra delen av riket, Finland, innebar detta
      lutherdom, som är en inriktning inom den protestantiska kristendomen. Bakgrunden till reformationen
      var både försök att förnya kyrkans läror och politiska orsaker. Genom reformationen ökade den svenska
      kungens makt, när han blev kyrkans överhuvud istället för påven. Dessutom övergick en stor del av
      kyrkans betydande egendom till staten.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
