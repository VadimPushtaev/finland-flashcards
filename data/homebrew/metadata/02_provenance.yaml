      Krigen sammanförde folket, och Finland förblev en självständig stat. Krigsupplevelserna förenade
      de generationer som var med om krigen. De arbetade för sitt land och levde under hårda och fattiga
      förhållanden efter kriget. Många led på grund av traumatiska krigshändelser.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
