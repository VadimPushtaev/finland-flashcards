    range_basis: normalized_html_block
    extracted_passage: Beloppet av en dagsbot beror både på hur allvarligt brottet är och på personens
      inkomster. På basis av brottets allvarlighetsgrad bestämmer myndigheten för hur många dagar man
      måste betala böter. Dagsbotens belopp beräknas utifrån inkomsterna. En person med höga inkomster
      måste alltså betala mycket mer i böter än en person med låga inkomster. Tanken är att det skulle
      vara orättvist om böterna var lika stora för alla, eftersom det i sådana fall skulle vara ett strängare
      straff för en låginkomsttagare än för en höginkomsttagare. Dagsböter kan utdömas för till exempel
      snatteri och de flesta trafikbrott.
