    heading: Finlands viktigaste lag är grundlagen
    source_range:
      start: 0
      end: 281
    range_basis: normalized_html_block
    extracted_passage: Grundlagen har en högre ställning än övriga lagar. När riksdagen stiftar lagar
      ska den säkerställa att övriga lagar inte står i strid med grundlagen. Om en annan lag uppenbart
      står i strid med grundlagen, ska domstolar i ärenden som behandlas ge grundlagens bestämmelser företräde.
    normalization: whitespace_only
    repairs: []
