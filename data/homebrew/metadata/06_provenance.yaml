    heading: I en rättsstat baserar sig utövandet av den offentliga makten på lagen
    source_range:
      start: 0
      end: 467
    range_basis: normalized_html_block
    extracted_passage: Finland är en rättsstat. Det betyder att den offentliga makten baserar sig på lagen.
      Makten i samhället är fördelad mellan olika aktörer så att den inte koncentreras för mycket till
      en aktör. Enligt den tredelade maktfördelningsläran har den lagstiftande makten, den verkställande
      makten och den dömande makten skilts från varandra. Då är det svårare att missbruka makt. Målet
      med indelningen är bland annat att trygga en jämlik och likvärdig behandling av människor.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
