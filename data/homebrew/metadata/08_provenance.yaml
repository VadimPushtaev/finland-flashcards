    range_basis: normalized_html_block
    extracted_passage: Alla barn som bor permanent i Finland har läroplikt mellan 7 och 18 års ålder.
      Barn och unga deltar först i den grundläggande utbildningen, det vill säga årskurserna 1–9, eller
      inhämtar på annat sätt kunskaper som motsvarar den grundläggande utbildningens lärokurs. Efter den
      grundläggande utbildningen ska alla unga dessutom studera till exempel på en utbildning på andra
      stadiet, tills de utexamineras eller fyller 18 år. Det har ursprungligen föreskrivits om läroplikten
      i Finland redan år 1921.
