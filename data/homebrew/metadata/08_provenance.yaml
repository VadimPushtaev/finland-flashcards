schema_version: 1
chapter_id: hb-c08
units:
  hb-c08-u0001:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 64
    printed_page: 63
    source_range:
      start: 1833
      end: 2349
    range_basis: raw_pdf_page
    extracted_passage: "Samhälleliga förändringar sker alltid av någon orsak. Vanligen ligger det ett\
      \ behov eller en ideologi \nbakom dem. Det finländska utbildningssystemets uppkomst och utveckling\
      \ har också påverkats av \nsamhälleliga behov och ideologier. De första skolorna grundades i Finland\
      \ för över 700 år sedan i \nanslutning till den katolska kyrkan. Då bodde nästan alla finländare\
      \ på landsbygden och under en \nlång tid var skolgång möjlig endast för ett fåtal pojkar ur den\
      \ övre samhällsklassen. De utbildades \nfrämst till präster."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  hb-c08-u0002:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 64
    printed_page: 63
    source_range:
      start: 2351
      end: 2810
    range_basis: raw_pdf_page
    extracted_passage: "I många europeiska länder började reformationen på 1500-talet. Nya kyrkosamfund,\
      \ till exempel det \nlutherska, separerade från den katolska kyrkan. Även Finland var tidigare ett\
      \ katolskt land som i och \nmed reformationen gick över till lutherdom. Reformationen ledde småningom\
      \ till en ändrad syn på \nutbildning, eftersom den lutherska kyrkan betonade folkspråk och läskunnighet.\
      \ Tanken var att alla i \nförsamlingen skulle må bra av att själv kunna läsa Bibeln."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  hb-c08-u0003:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 165
      end: 431
    range_basis: raw_pdf_page
    extracted_passage: "I början av 1800-talet blev Finland en autonom del av Ryssland, vilket ändrade\
      \ Finlands ställning. \nDet var ändå fortfarande kyrkan som skötte folkets utbildning ända till\
      \ mitten av 1800-talet. Efter det \nbörjade det finländska samhället ändras i allt snabbare takt."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  hb-c08-u0004:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 1109
      end: 1287
    range_basis: raw_pdf_page
    extracted_passage: "I och med industrialiseringen skildes skolan från kyrkan. Arbetande föräldrar\
      \ kunde inte längre sköta \nsina barn på dagtid, så det uppstod ett behov av att utveckla skolsystemet."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  hb-c08-u0005:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 1289
      end: 1398
    range_basis: raw_pdf_page
    extracted_passage: "Kommunerna började grunda folkskolor separat från kyrkan och dessa skolor spreds\
      \ småningom till \nhela landet."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  hb-c08-u0006:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 1402
      end: 1748
    range_basis: raw_pdf_page
    extracted_passage: "Vid sidan av folkskolorna fanns också läroverk, av vilka många var privata. I\
      \ dem gick främst rikare \nfamiljers barn. Det tog flera tiotals år innan hela befolkningen omfattades\
      \ av utbildningen, för särskilt \npå landsbygden var det många som inte förstod vikten av utbildning\
      \ och som ställde sig misstroget \ntill att skicka sina barn till skolan."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  hb-c08-u0007:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 2700
      end: 2968
    range_basis: raw_pdf_page
    extracted_passage: "Först på 1900-talets sida började större delen av befolkningen stöda folkskolan\
      \ och 1921 stiftades en \nlag om läroplikt i Finland. Det betydde att skolgång blev obligatoriskt\
      \ för alla. Folkskolan utvidgades \ntill att omfatta hela åldersklassen på 1920- och 1930-talet."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
  hb-c08-u0008:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 65
    printed_page: 64
    source_range:
      start: 2970
      end: 3380
    range_basis: raw_pdf_page
    extracted_passage: "Gymnasieutbildning och studentexamen blev vanligare särskilt på 1950- och 1960-talet.\
      \ I Finland \nbörjade man eftersträva samhällelig jämlikhet och ekonomisk utveckling genom att bygga\
      \ en \nvälfärdsstat. Samtidigt föddes tanken på en enhetlig 9-årig grundskola. Under 1970-talet\
      \ övergick \nman i hela landet från det gamla systemet med separat folkskola och läroverk till en\
      \ grundskola som \nvar gemensam för alla."
    normalization: whitespace_only
    repairs: []
    selection: Complete historical paragraph adding development of education; PDF whitespace normalized,
      no substantive edits.
