    range_basis: normalized_html_block
    extracted_passage: Ett typiskt kännetecken för den finländska vardagsmaten är att äta tillsammans.
      I skolan får barnen gratis skolmat, som består av en varm lunchrätt. I daghemmen får barnen förutom
