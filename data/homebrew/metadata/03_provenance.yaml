    range_basis: normalized_html_block
    extracted_passage: Julen är årets viktigaste fest i Finland. Då minns man Jesu födelse i kyrkan. Den
      egentliga dagen för firandet är julafton den 24 december. Många skaffar sig en julgran som pyntas.
      Julklapparna delas oftast ut på julafton. Till den finländska julen hör många slags festmat, såsom
      julskinka, rosoll som är en rödbetssallad, olika slags lådor, julstjärnor och pepparkakor. På julen
      sjunger man julsånger och umgås med familjen och andra nära och kära.
    normalization: whitespace_only
    repairs: []
    selection: Complete source paragraph or list item.
  hb-c03-u0083:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 17
    printed_page: 16
    source_range:
      start: 1170
      end: 1502
    range_basis: raw_pdf_page
    extracted_passage: "Den 5 februari firas Runebergsdagen. Då firas Finlands nationalskald Johan Ludvig\
      \ Runeberg, som \nskrev orden till Finlands nationalsång som heter Vårt land. Han hade stort inflytande\
      \ på finländsk \nlitteratur och kultur. På Runebergsdagen äts runebergstårtor, en slags bakelse\
      \ som skaldens hustru, \nFredrika Runeberg, brukade baka. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0084:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 17
    printed_page: 16
    source_range:
      start: 2438
      end: 2700
    range_basis: raw_pdf_page
    extracted_passage: "Den 8 mars firas den internationella kvinnodagen. Då ordnar många organisationer\
      \ och andra grupper \ndiskussionstillfällen och andra evenemang, där kvinnans ställning i det finska\
      \ samhället och i världen \nbehandlas. I Finland är kvinnodagen en vanlig arbetsdag. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0085:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 17
    printed_page: 16
    source_range:
      start: 2726
      end: 2959
    range_basis: raw_pdf_page
    extracted_passage: "I mars firas Minna Canths dag, eller jämställdhetens dag. Minna Canth var en finsk\
      \ författare och \nsamhällspåverkare. Hon främjade kvinnornas ställning i Finland bland annat genom\
      \ att förbättra \nflickors möjligheter till utbildning. "
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0086:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 17
    printed_page: 16
    source_range:
      start: 763
      end: 1148
    range_basis: raw_pdf_page
    extracted_passage: "I februari firas sportlov i finländska skolor. Då har barnen en vecka ledigt från\
      \ skolan. Sportlovet har \nfirats sedan 1930-talet. Ursprungligen var det meningen att barnen skulle\
      \ få motion och kunna skida \nhela veckan. Nuförtiden skidas det mindre, men många far till exempel\
      \ och skida slalom. Sportlovet \nfiras olika veckor i olika delar av Finland, från mitten av februari\
      \ framåt. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0087:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 18
    printed_page: 17
    source_range:
      start: 2738
      end: 3026
    range_basis: raw_pdf_page
    extracted_passage: "I början av juni får skoleleverna i Finland sommarlov. Läsårets slut firas vid\
      \ skolans vårfest, dit också \nföräldrarna är bjudna. På vårfesten sjungs ofta sommarpsalmen Den\
      \ blomstertid nu kommer. Barnens \nsommarlov fortsätter till mitten av augusti och varar alltså\
      \ ungefär tio veckor.   "
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0088:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 19
    printed_page: 18
    source_range:
      start: 1851
      end: 2218
    range_basis: raw_pdf_page
    extracted_passage: "I slutet av oktober firas Halloween, som är en ganska ny fest i Finland. Halloween\
      \ är ursprungligen \nen irländsk-amerikansk fest. Nuförtiden går en del barn också i Finland från\
      \ dörr till dörr utklädda i \nmaskeraddräkter och ber om godis. Skolorna har också halloween-fester\
      \ för barnen. En del ställer \nprydnadspumpor med ljus inuti i fönstren eller utanför dörren. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0089:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 416
      end: 655
    range_basis: raw_pdf_page
    extracted_passage: "Under december firas lillajulsfester i skolor, på arbetsplatser, bland studerande\
      \ och i föreningar. Julen \nfiras i Finland vanligen inom familjen, men lillajulsfesterna firas\
      \ tillsammans med arbets- och \nskolkamrater och andra grupper.   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0090:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 655
      end: 1066
    range_basis: raw_pdf_page
    extracted_passage: "Lillajulsfesterna är avslappnade och informella till sin karaktär. Vid dem bjuds\
      \ första gången på \njulmat, framför allt risgrynsgröt och glögg. På vuxnas lillajulsfester klär\
      \ man sig i festkläder, äter gott \noch dricker ofta alkohol. På barnens fester i skolor och hobbygrupper\
      \ äter man gott och delar ut \nlillajulspresenter. Var och en hämtar ett litet paket och får sedan\
      \ ett litet paket att ta med sig hem. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0091:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 1095
      end: 1369
    range_basis: raw_pdf_page
    extracted_passage: "Några dagar före julen börjar skolornas jullov. I skolan firas först en julfest\
      \ där barnen uppträder till \nexempel med sång. Barnen får julbetyg och sedan börjar jullovet som\
      \ varar i cirka två veckor. Det är \nslutet på skolornas hösttermin. Efter lovet börjar vårterminen.\
      \ \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0092:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 2218
      end: 2637
    range_basis: raw_pdf_page
    extracted_passage: "I dagens Finland firas åtminstone i större städer också andra fester, som invandrare\
      \ hämtat med sig. \nSådana fester är till exempel det kinesiska nyåret, det persiska eller kurdiska\
      \ nyåret nowruz och \nmuslimernas fastemånad ramadan. Under ramadan får vuxna muslimer inte äta\
      \ eller dricka på dagen \ninnan solen gått ner. Ramadan avslutas med den stora id-festen, då man\
      \ samlas till festbord med \nvänner och släktingar. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0093:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 2664
      end: 2811
    range_basis: raw_pdf_page
    extracted_passage: "Till människans levnadslopp hör också många viktiga fester som inte är beroende\
      \ av kalendern och \nsom släkt, familj och vänner firar tillsammans. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0154:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 20
    printed_page: 19
    source_range:
      start: 2924
      end: 2987
    range_basis: raw_pdf_page
    extracted_passage: "Vid dopet får \nbarnet ett namn och blir en del av församlingen."
    normalization: whitespace_only
    repairs: []
    selection: Complete baptism explanation after omitted undated70% statistic.
  hb-c03-u0094:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 39
      end: 336
    range_basis: raw_pdf_page
    extracted_passage: "Föräldrar som inte hör till kyrkan kan välja att ordna en namngivningsfest i stället,\
      \ där familj och \nsläktingar samlas för att fira det lilla barnet. Dopet eller namngivningsfesten\
      \ ordnas hemma eller i \nkyrkan eller i någon annan festlokal och de närmaste släktingarna och vännerna\
      \ bjuds in.    \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0095:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 336
      end: 634
    range_basis: raw_pdf_page
    extracted_passage: "Två faddrar utses åt barnet bland vännerna eller släktingarna. Ursprungligen var\
      \ fadderns uppgift att \nvara en slags andlig förälder åt barnet och sköta om barnets kristna fostran.\
      \ I dag tänker man mera att \nbarnet är en särskilt viktig människa i fadderns liv och faddern följer\
      \ barnets uppväxt. \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0096:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 675
      end: 1237
    range_basis: raw_pdf_page
    extracted_passage: "I Finland kan barn konfirmera sig det år de fyller 15. Konfirmationen är en ceremoni\
      \ som hålls i \nkyrkan. Där bekräftas den ungas kristna tro och medlemskapet i församlingen. Konfirmationen\
      \ \nföregås av en skriftskola som innehåller religionsundervisning och som nuförtiden ofta hålls\
      \ i form \nav ett sommarläger. En stor del av de unga deltar i skriftskollägret och konfirmationen\
      \ för att det är \nroligt på lägret, för att föräldrarna förväntar sig att barnen ska göra det och\
      \ för att det efter \nkonfirmationen ordnas en fest hemma där den unga får presenter.   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0097:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 1237
      end: 1494
    range_basis: raw_pdf_page
    extracted_passage: "En del unga deltar vid samma ålder i ett Prometheus-läger som är ett religiöst\
      \ och politiskt obundet \nlivssynsläger. Lägrets syfte är att uppmuntra de unga till att utveckla\
      \ sin egen livssyn. Efter lägret \nhålls en fest hemma där den unga får presenter.   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0098:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 1511
      end: 1984
    range_basis: raw_pdf_page
    extracted_passage: "När en ung människa gått igenom gymnasiet och klarat studentskrivningarna får\
      \ hon avgångsbetyg \nfrån gymnasiet och ett studentbetyg. Med betyget kan hon ansöka om studieplats\
      \ vid ett universitet \neller en högskola. Studentexamen firas både i skolan och hemma hos studenten.\
      \ I skolan får den unga \nsitt betyg och en studentmössa. Hemma väntar en kaffebjudning och presenter.\
      \ Släktingar och vänner \när inbjudna. De som utexamineras från yrkesskolor firar likadana fester.\
      \   \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0099:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 2629
      end: 2943
    range_basis: raw_pdf_page
    extracted_passage: "I Finland firas framför allt barns födelsedagar. Barnen kan bjuda in sina kompisar\
      \ på kalas. Många \nfirar också med familj, släktingar och faddrar. På kalasen leker man, äter kaka\
      \ och ger presenter. \nÄven vuxna kan ordna kalas för att fira sin födelsedag, särskilt när de fyller\
      \ jämna år som 50, 60 eller \n70.    \n"
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0100:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 2957
      end: 3487
    range_basis: raw_pdf_page
    extracted_passage: "När en människa dör ordnar släktingarna begravning i en kyrka, ett kapell eller\
      \ någon annan lokal. \nTill begravningen kommer familj och släktingar, den dödas vänner och ibland\
      \ också arbetskamrater. \nEfter den kyrkliga förrättningen samlas begravningsföljet till en minnesstund\
      \ där man äter och dricker \nkaffe och minns den avlidne, alltså den som dött. I Finland kan begravningen\
      \ ordnas enligt den \nreligion som den avlidne hörde till. Begravningen kan också vara sekulär,\
      \ om den avlidne inte hörde \ntill något religiöst samfund. "
    normalization: whitespace_only
    repairs: []
    selection: Additive complete textbook paragraph; preserve substantive wording and normalize whitespace
      only.
  hb-c03-u0155:
    source_path: data/orientation_guide.pdf
    sha256: 4710f62fe7b7264272d50a46cd35ec3f2a2836d17669ae376c2ec12f5175048f
    pdf_page: 21
    printed_page: 20
    source_range:
      start: 2088
      end: 2615
    range_basis: raw_pdf_page
    extracted_passage: "Vid vigseln \när ofta släktingar och vänner närvarande. Många ordnar en bröllopsfest\
      \ efteråt där man äter, dansar \noch firar brudparet med olika programnummer. Till programmet hör\
      \ ofta tal, lekar och uppträdanden. \nBrudparet får presenter. Bröllop är privata tillställningar\
      \ dit man kan gå bara om man är bjuden. \nEftersom det bjuds mat och dryck på bröllopsfesten kan\
      \ det bli väldigt dyrt att ordna bröllop. Därför \nbjuder de flesta inte alla sina bekanta till\
      \ bröllopet. Många par åker på bröllopsresa efter \nbröllopsfesten. \n"
    normalization: whitespace_only
    repairs: []
    selection: Preserve additional cultural explanation; complete contiguous sentences, omit only neighbouring
      undated statistic or duplicate narrative.
