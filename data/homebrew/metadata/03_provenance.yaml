    range_basis: normalized_html_block
    extracted_passage: På morgonen äter man frukost enligt vilken tid man vaknar. Lunch serveras tidigare
      än i många andra länder, omkring kl. 10.30–12. Lunchen består vanligtvis av varm mat, vilket innebär
