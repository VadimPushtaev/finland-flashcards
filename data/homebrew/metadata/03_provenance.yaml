    source_range:
      start: 0
      end: 524
    range_basis: normalized_html_block
    extracted_passage: Inom den evangelisk-lutherska kyrkan i Finland finns olika väckelserörelser, till
      exempel gammallaestadianismen och pietismen. Dessa rörelser följer seder och värderingar som delvis
      skiljer sig från den konventionella evangelisk-lutherska traditionen. I Finland finns det också
      andra kristna kyrkor och samfund, såsom den katolska kyrkan och pingstförsamlingar. Alla kristna
      följer inte samma seder och tolkar inte Bibeln på samma sätt. Karakteristiskt för den finländska
      kristendomen är att den är måttfull till sina läror.
