    range_basis: normalized_html_block
    extracted_passage: I det finländska samhället förs en ständig debatt om vilka tjänster staten bör
      bekosta för människorna och vad som är en lämplig beskattningsnivå. Det handlar om hur mycket man
      är beredd att betala för att upprätthålla välfärdsstaten. Till exempel olika politiska partier har
      olika åsikter om detta. En fri politisk debatt om hur ett bra samhälle ser ut är en del av demokratin.
