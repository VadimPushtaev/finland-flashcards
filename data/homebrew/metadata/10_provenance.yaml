    heading: Finland är en nordisk välfärdsstat
    source_range:
      start: 0
      end: 354
    range_basis: normalized_html_block
    extracted_passage: För att kunna erbjuda tjänster och betala ut olika stöd och förmåner behöver staten
      pengar. Därför betalar man mer skatt i en välfärdsstat än i många andra länder. Skatt betalas av
      såväl den enskilda individen som företagen. Forskning visar att de flesta människor i Finland gärna
      betalar skatt, eftersom de upplever att den välfärd det ger är värdefull.
    normalization: whitespace_only
