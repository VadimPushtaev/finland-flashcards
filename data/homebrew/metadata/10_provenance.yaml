    heading: Med EU:s funktionshinderkort kan man bekräfta behovet av en assistent
    source_range:
      start: 0
      end: 574
    range_basis: normalized_html_block
    extracted_passage: I Finland kan personer med funktionsnedsättning ansöka om EU:s funktionshinderkort.
      Det beviljas personer med en permanent funktionsnedsättning eller en långvarig sjukdom. Kortet kan
      användas på kulturplatser, motions- och idrottsplatser och olika besöksmål både i Finland och flera
      andra EU-länder. Med hjälp av funktionshinderkortet kan användaren visa att hen behöver hjälp, en
      tillgänglig väg eller en assistent vid till exempel idrotts- och kulturevenemang. På många ställen
      får assistenten eller tolken komma med gratis när man visar kortet och det är märkt med ett A.
