    heading: Att röra sig
    source_range:
      start: 0
      end: 463
    range_basis: normalized_html_block
    extracted_passage: Om du på grund av din funktionsnedsättning inte kan använda kollektivtrafiken kan
      du ha rätt till färdtjänst. Vid behov kan du även ha med dig en ledsagare, det vill säga en person
