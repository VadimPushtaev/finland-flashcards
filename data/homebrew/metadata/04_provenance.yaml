    range_basis: normalized_html_block
    extracted_passage: Regeringen bereder ärenden som riksdagen behandlar. Till exempel om regeringspartierna
      har beslutat att en ny nationalpark ska inrättas i Finland, börjar miljöministeriet bereda ärendet.
      Ministeriet undersöker var den nya nationalparken ska inrättas och lyssnar på andra myndigheters
      och medborgarorganisationers åsikter, information och erfarenheter i frågan. Under regeringens ledning
      utarbetar ministeriet ett förslag, där det motiverar varför det valda området skulle vara det bästa
      för den nya nationalparken och hurdana konsekvenser förslaget skulle ha. Efter det överförs ärendet
      till riksdagen för beslut.
