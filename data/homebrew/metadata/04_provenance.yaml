    heading: Som en följd av det proportionella valsättet har Finland ett flerpartisystem
    source_range:
      start: 0
      end: 616
    range_basis: normalized_html_block
    extracted_passage: I Finland tillämpas ett proportionellt valsätt vid riksdagsval, välfärdsområdes-
      och kommunalval och Europaparlamentsval. Det innebär att i varje valkrets blir det antal kandidater
      från varje parti valt som motsvarar partiets andel av alla avgivna röster i valkretsen. Om ett parti
      med andra ord får 20 procent av de avgivna rösterna, får det i stort sett 20 procent av platserna.
      I riksdagsval är valkretsarna stora, och från varje valkrets väljs flera representanter. Vid välfärdsområdesval
      utgörs valkretsen av välfärdsområdet och vid kommunalval av kommunen. Vid Europaparlamentsval utgör
      hela landet valkretsen.
