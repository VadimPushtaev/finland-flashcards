    range_basis: normalized_html_block
    extracted_passage: I ett val får de partier som får flest röster av väljarna flest representanter.
      Det betyder ändå inte att majoriteten fram till nästa val skulle ha rätt att diskriminera eller
      förtrycka minoriteten, det vill säga dem som är av en annan åsikt än majoriteten. I ett samhälle
