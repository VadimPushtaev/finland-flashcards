    range_basis: normalized_html_block
    extracted_passage: Finland är en demokratisk stat. Det betyder att folket i Finland har makt att bestämma
      hur staten ska styras. Demokratin i Finland är en representativ demokrati, det vill säga medborgarna
      väljer representanter för sig själva som fattar beslut för dem. Representanterna väljs i rättvisa
      och fria val. De beslutsfattare som utsetts genom val ska lyssna på väljarnas åsikter, eftersom
      väljarna annars kanske inte röstar på dem i följande val.
