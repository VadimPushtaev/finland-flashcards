    heading: Regeringen och ministerierna bereder lagförslag och verkställer lagar
    source_range:
      start: 0
      end: 490
    range_basis: normalized_html_block
    extracted_passage: Ministrarna leder ministeriernas arbete. Ministerierna bereder och verkställer
      de ärenden som regeringen beslutar om. Exempel på ministerier är försvarsministeriet, social- och
      hälsovårdsministeriet och inrikesministeriet. Flera statliga ämbetsverk och inrättningar lyder under
      och styrs av ministerierna. Till exempel Migrationsverket är ett ämbetsverk som lyder under inrikesministeriet.
      Tillsammans med ministerierna bildar statens ämbetsverk och inrättningar statens centralförvaltning.
