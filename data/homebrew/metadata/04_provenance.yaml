    source_range:
      start: 0
      end: 474
    range_basis: normalized_html_block
    extracted_passage: Direkt demokrati är svår att genomföra på statlig nivå, eftersom människorna är
      många. I en direkt demokrati borde varje medborgare ägna mycket tid åt att bestämma om gemensamma
      angelägenheter genom att delta i möten, omröstningar och olika val. Därför avgörs endast en del
      frågor i många demokratiska länder med hjälp av direkt folkstyre. I Finland ordnades till exempel
      en rådgivande folkomröstning år 1994 om huruvida Finland borde gå med i Europeiska unionen eller
      inte.
