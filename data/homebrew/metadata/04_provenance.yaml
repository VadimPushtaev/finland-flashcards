    range_basis: normalized_html_block
    extracted_passage: I demokratiska stater tillämpas i allmänhet representativ demokrati, som kan kompletteras
      med direkt och deltagande demokrati. Så är fallet också i Finland. I Finland hålls regelbundet val,
      där medborgarna väljer representanter för sig. Representanterna bedriver politiskt arbete i samhället
