    range_basis: normalized_html_block
    extracted_passage: Demokrati är ett statsskick där medborgarna påverkar hurdana beslut som fattas
      i gemensamma frågor, vem som fattar besluten och vad statens pengar används till. Könet eller samhällsställningen
      har ingen betydelse för vem som får påverka i olika frågor.
