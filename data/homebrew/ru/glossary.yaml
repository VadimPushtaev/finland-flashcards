schema_version: 1
entries:
- id: finland
  lemma: Finland
  pos: PROPN
  sense: country
  ru: Финляндия
  note: Established Russian country name.
- id: norden
  lemma: Norden
  pos: PROPN
  sense: Nordic region
  ru: Северные страны
  note: Distinguish the Nordic region from broader geographic Northern Europe; terminology supported by
    Nordic cooperation publications.
- id: nordeuropa
  lemma: Nordeuropa
  pos: PROPN
  sense: Northern Europe
  ru: Северная Европа
  note: Geographic region; keep distinct from Norden.
- id: nordisk
  lemma: nordisk
  pos: ADJ
  sense: relating to Nordic countries
  ru: относящийся к Северным странам
  note: In this geographic grouping, avoid narrowing the meaning to Scandinavian.
- id: finska-viken
  lemma: Finska viken
  pos: PROPN
  sense: Gulf of Finland
  ru: Финский залив
  note: Treat the established geographic name as one lexical unit.
- id: saimen
  lemma: Saimen
  pos: PROPN
  sense: lake Saimaa
  ru: Сайма
  note: Established Russian lake name; Swedish Saimen, not a transliteration into Russian.
- id: eet
  lemma: EET
  pos: PROPN
  sense: Eastern European Time abbreviation
  ru: восточноевропейское время
  note: Preserve the source abbreviation in Russian prose.
- id: gmt
  lemma: GMT
  pos: PROPN
  sense: Greenwich Mean Time abbreviation
  ru: среднее время по Гринвичу
  note: Retain the archived GMT +2 notation without updating the time convention.
- id: nationalsprak
  lemma: nationalspråk
  pos: NOUN
  ru: национальный язык
  sense: constitutional national language
  note: Preserve the Swedish distinction from officiellt språk.
- id: finlandssvensk-person
  lemma: finlandssvensk
  pos: NOUN
  ru: финляндский швед
  sense: Swedish-speaking Finn
  note: Person, not the Finland-Swedish language variety.
- id: ursprungsbefolkning
  lemma: ursprungsbefolkning
  pos: NOUN
  ru: коренное население
  sense: indigenous population
  note: ''
- id: same
  lemma: same
  pos: NOUN
  ru: саам
  sense: Sami person
  note: ''
- id: rom
  lemma: rom
  pos: NOUN
  ru: ром
  sense: Roma person
  note: ''
- id: ingermanlandare
  lemma: ingermanländare
  pos: NOUN
  ru: ингерманландец
  sense: Ingrian person
  note: Keep the source ethnic designation without adding citizenship or migration status.
- id: europeiska-unionen
  lemma: Europeiska unionen
  pos: PROPN
  ru: Европейский союз
  sense: European Union
  note: ''
- id: eu
  lemma: EU
  pos: PROPN
  ru: Европейский союз
  sense: European Union abbreviation
  note: Retain EU at first useful institutional mention.
- id: asylsokande
  lemma: asylsökande
  pos: NOUN
  ru: проситель убежища
  sense: person applying for asylum
  note: Keep distinct from a person already recognised as a refugee.
- id: kvotflykting
  lemma: kvotflykting
  pos: NOUN
  ru: беженец, принимаемый по квоте
  sense: refugee admitted through a quota
  note: Preserve the Finnish quota-refugee distinction.
- id: sodra-finland
  lemma: Södra Finland
  pos: PROPN
  sense: southern geographic region
  ru: Южная Финляндия
  note: Geographic area here, not the former administrative province.
- id: insjofinland
  lemma: Insjöfinland
  pos: PROPN
  sense: Finnish Lakeland
  ru: Озёрная Финляндия
  note: Established descriptive Russian region name.
- id: osterbotten
  lemma: Österbotten
  pos: PROPN
  sense: broad geographic region
  ru: Остроботния
  note: Source includes Oulu; preserve broad geographic scope, not only the current administrative region.
- id: lappland
  lemma: Lappland
  pos: PROPN
  sense: Finnish Lapland
  ru: Лапландия
  note: Chapter context identifies the Finnish northern region.
- id: aland
  lemma: Åland
  pos: PROPN
  sense: Aland Islands
  ru: Аландские острова
  note: Established Russian archipelago name.
- id: helsingfors
  lemma: Helsingfors
  pos: PROPN
  sense: city
  ru: Хельсинки
  note: Use the established Russian name instead of transliterating the Swedish name.
- id: sydvastra-finland
  lemma: Sydvästra Finland
  pos: PROPN
  sense: southwestern geographic region
  ru: Юго-Западная Финляндия
  note: Geographic description, not an assertion of administrative boundaries.
- id: sjalvstyre
  lemma: självstyre
  pos: NOUN
  sense: territorial or cultural self-government
  ru: самоуправление
  note: Does not imply sovereignty; Aland remains part of Finland.
- id: huvudstadsregion
  lemma: huvudstadsregion
  pos: NOUN
  sense: Helsinki capital region
  ru: столичный регион
  note: Includes Helsinki, Espoo, Vantaa and Kauniainen in this passage.
- id: finlandare
  lemma: finländare
  pos: NOUN
  sense: person from Finland
  ru: финляндец; житель Финляндии
  note: Broad population term, not limited to Finnish ethnicity or language.
