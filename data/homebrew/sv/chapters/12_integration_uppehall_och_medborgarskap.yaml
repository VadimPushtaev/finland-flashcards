schema_version: 1
id: hb-c12
language: sv
title: Integration, uppehåll och medborgarskap
sections:
- id: hb-c12-integration
  title: Integration och delaktighet
  blocks:
  - type: paragraph
    id: hb-c12-u0001
    text: Integration betyder att en människa vänjer sig vid sitt nya hemland. Hen lär sig språket och
      hittar ett arbete eller en studieplats och sin plats i samhället.
    sentences:
    - id: hb-c12-u0001-s001
      start: 0
      end: 68
    - id: hb-c12-u0001-s002
      start: 69
      end: 158
  - type: paragraph
    id: hb-c12-u0002
    text: Integration förutsätter att den nyanlända är aktiv. Att till exempel lära sig språket och hitta
      arbete kräver mycket egen ansträngning. En person som integrerat sig i Finland känner sig som en
      del av det finländska samhället och bidrar till att forma det på sätt som passar hen själv.
    sentences:
    - id: hb-c12-u0002-s001
      start: 0
      end: 51
    - id: hb-c12-u0002-s002
      start: 52
      end: 135
    - id: hb-c12-u0002-s003
      start: 136
      end: 284
  - type: paragraph
    id: hb-c12-u0003
    text: I takt med att tiden i det nya landet går vänjer sig personen vid de nya sederna och börjar
      förstå dem. Efter det är det lättare att leva i den nya miljön. Till slut är det möjligt att hitta
      en balans mellan de båda kulturerna. Vanligtvis håller människan fast vid de saker som var viktiga
      för hen i den kultur som hen tidigare levt i. Samtidigt tillägnar hen sig nya tankar och tillvägagångssätt
      i den nya kulturen.
    sentences:
    - id: hb-c12-u0003-s001
      start: 0
      end: 103
    - id: hb-c12-u0003-s002
      start: 104
      end: 155
    - id: hb-c12-u0003-s003
      start: 156
      end: 227
    - id: hb-c12-u0003-s004
      start: 228
      end: 335
    - id: hb-c12-u0003-s005
      start: 336
      end: 416
  - type: paragraph
    id: hb-c12-u0004
    text: Integration betyder till exempel att en person lär sig landets språk tillräckligt bra. Då kan
      hen skapa sociala relationer, studera eller arbeta på språket.
    sentences:
    - id: hb-c12-u0004-s001
      start: 0
      end: 86
    - id: hb-c12-u0004-s002
      start: 87
      end: 156
  - type: paragraph
    id: hb-c12-u0005
    text: När man i Finland pratar om integration betonar man ofta betydelsen av att få ett arbete. Man
      anser att ett arbete å ena sidan är ett mål för integrationen och å andra sidan främjar personens
      integration i Finland. Genom arbetet blir personen en del av samhället och lär känna andra människor.
      Hens ekonomiska situation förbättras. Också studier främjar integrationen och hjälper personen att
      hitta ett arbete i framtiden.
    sentences:
    - id: hb-c12-u0005-s001
      start: 0
      end: 89
    - id: hb-c12-u0005-s002
      start: 90
      end: 214
    - id: hb-c12-u0005-s003
      start: 215
      end: 293
    - id: hb-c12-u0005-s004
      start: 294
      end: 331
    - id: hb-c12-u0005-s005
      start: 332
      end: 422
  - type: paragraph
    id: hb-c12-u0006
    text: En viktig del av integrationen är att lära känna andra människor som bor i Finland. Sociala
      nätverk är viktiga för människans välbefinnande. Det kan vara till nytta att lära känna andra människor
      som flyttat till Finland från andra länder, eftersom de kan ge kamratstöd för integrationen.
    sentences:
    - id: hb-c12-u0006-s001
      start: 0
      end: 83
    - id: hb-c12-u0006-s002
      start: 84
      end: 140
    - id: hb-c12-u0006-s003
      start: 141
      end: 288
  - type: paragraph
    id: hb-c12-u0007
    text: Integration innebär också att den nyanlända deltar i samhällets verksamhet på sätt som passar
      hen själv och känner sig delaktig i det finländska samhället. Delaktighet innebär att personen kan
      påverka sitt liv och de saker som är viktiga för hen i hens gemenskap och omgivning. Om personen
      vill kan hen delta i gemensam verksamhet och gemensamt beslutsfattande.
    sentences:
    - id: hb-c12-u0007-s001
      start: 0
      end: 155
    - id: hb-c12-u0007-s002
      start: 156
      end: 277
    - id: hb-c12-u0007-s003
      start: 278
      end: 361
  - type: paragraph
    id: hb-c12-u0008
    text: Till integrationen hör att den nyanlända har kännedom om det finländska samhället och den finländska
      kulturen. Det är viktigt att personen känner till sina rättigheter och skyldigheter i Finland. Det
      är också bra att känna till Finlands historia och veta hurdana lagar och seder det finns i Finland
      och varför.
    sentences:
    - id: hb-c12-u0008-s001
      start: 0
      end: 110
    - id: hb-c12-u0008-s002
      start: 111
      end: 195
    - id: hb-c12-u0008-s003
      start: 196
      end: 310
  - type: paragraph
    id: hb-c12-u0009
    text: Integration betyder också att personen betraktar Finland som en viktig del av sitt liv och sin
      framtid och känner samhörighet med finländarna. Hen har hittat sin plats i samhället och har byggt
      sociala nätverk. Om personen vill kan hen vara aktiv i sina gemenskaper eller till exempel inom
      politiken.
    sentences:
    - id: hb-c12-u0009-s001
      start: 0
      end: 142
    - id: hb-c12-u0009-s002
      start: 143
      end: 210
    - id: hb-c12-u0009-s003
      start: 211
      end: 300
  - type: paragraph
    id: hb-c12-u0010
    text: Också det omgivande samhällets mottaglighet har betydelse för känslan av delaktighet.
    sentences:
    - id: hb-c12-u0010-s001
      start: 0
      end: 85
  - type: paragraph
    id: hb-c12-u0011
    text: Integration i Finland kräver att den nyanlända anpassar sig och tar till sig nya kunskaper och
      färdigheter. Samtidigt måste också de som bor i Finland sedan tidigare anpassa sig, lära sig och
      ge akt på sina attityder. Det är fråga om så kallad dubbelriktad integration och samhällets mottaglighet.
    sentences:
    - id: hb-c12-u0011-s001
      start: 0
      end: 107
    - id: hb-c12-u0011-s002
      start: 108
      end: 217
    - id: hb-c12-u0011-s003
      start: 218
      end: 297
  - type: paragraph
    id: hb-c12-u0012
    text: Invandringen till Finland var länge liten, och fortfarande bor det i Finland färre människor
      som flyttat hit från andra länder än i många andra länder i Västeuropa. Tyvärr är alla i Finland
      inte alltid lika positiva till nyanlända, utan en del kan ha fördomar mot invandringen.
    sentences:
    - id: hb-c12-u0012-s001
      start: 0
      end: 164
    - id: hb-c12-u0012-s002
      start: 165
      end: 277
  - type: paragraph
    id: hb-c12-u0013
    text: Att främja mottaglighet innebär till exempel att man identifierar de strukturer i samhället
      som skapar ojämlikhet och aktivt strävar efter att avveckla dem. På så sätt bidrar man till att
      alla faktiskt har lika möjligheter att delta i samhället. Därför är till exempel att identifiera
      och bekämpa rasism en viktig del av att främja dubbelriktad integration
    sentences:
    - id: hb-c12-u0013-s001
      start: 0
      end: 156
    - id: hb-c12-u0013-s002
      start: 157
      end: 245
    - id: hb-c12-u0013-s003
      start: 246
      end: 356
  - type: paragraph
    id: hb-c12-u0014
    text: Finska statens målsättning är att den som flyttat till Finland känner sig som en del av det
      finska samhället och är med och utvecklar det. Samtidigt kan personen bevara sitt eget språk och
      sin kultur och banden till fosterlandet.
    sentences:
    - id: hb-c12-u0014-s001
      start: 0
      end: 138
    - id: hb-c12-u0014-s002
      start: 139
      end: 229
- id: hb-c12-tjanster
  title: Integrationstjänster och integrationsplan
  blocks:
  - type: paragraph
    id: hb-c12-u0015
    text: När du flyttar till Finland har du rätt att få grundläggande information om Finland. När du
      får ett uppehållstillstånd eller uppehållskort eller registrerar din uppehållsrätt får du samtidigt
      information om det finländska samhället och arbetslivet, dina rättigheter och skyldigheter samt
      om tjänster som främjar din integration.
    sentences:
    - id: hb-c12-u0015-s001
      start: 0
      end: 84
    - id: hb-c12-u0015-s002
      start: 85
      end: 328
  - type: paragraph
    id: hb-c12-u0016
    text: 'I Finland erbjuds även andra tjänster som stöd för integrationen. Dessa tjänster är avsedda
      för personer som bott i Finland i mindre än tre år. Sådana tjänster är bedömningen av kompetens
      och behovet av integrationstjänster samt integrationsplanen. Du kan ha rätt att ta del av dessa
      tjänster i vissa situationer, exempelvis följande:'
    sentences:
    - id: hb-c12-u0016-s001
      start: 0
      end: 65
    - id: hb-c12-u0016-s002
      start: 66
      end: 143
    - id: hb-c12-u0016-s003
      start: 144
      end: 248
    - id: hb-c12-u0016-s004
      start: 249
      end: 334
  - id: hb-c12-u0018
    type: list
    ordered: false
    items:
    - id: hb-c12-u0017
      text: du är arbetslös och söker jobb
      sentences:
      - id: hb-c12-u0017-s001
        start: 0
        end: 30
    - id: hb-c12-u0019
      text: du får utkomststöd annat än tillfälligt
      sentences:
      - id: hb-c12-u0019-s001
        start: 0
        end: 39
    - id: hb-c12-u0020
      text: du tar hand om ditt barn hemma och får stöd för hemvård av barn
      sentences:
      - id: hb-c12-u0020-s001
        start: 0
        end: 63
    - id: hb-c12-u0021
      text: du har kommit till Finland som minderårig utan vårdnadshavare
      sentences:
      - id: hb-c12-u0021-s001
        start: 0
        end: 61
    - id: hb-c12-u0022
      text: du har kommit till Finland som flykting
      sentences:
      - id: hb-c12-u0022-s001
        start: 0
        end: 39
    - id: hb-c12-u0023
      text: du är offer för människohandel.
      sentences:
      - id: hb-c12-u0023-s001
        start: 0
        end: 31
  - type: paragraph
    id: hb-c12-u0024
    text: Du kan också själv be om bedömningen.
    sentences:
    - id: hb-c12-u0024-s001
      start: 0
      end: 37
  - type: paragraph
    id: hb-c12-u0025
    text: Varje kommun har ett integrationsprogram som inkluderar de tjänster kommunen erbjuder nyanlända
      för att främja deras integration. De omfattar åtminstone en bedömning av servicebehovet, upprättande
      av en integrationsplan, handledning och rådgivning medan integrationsprogrammet pågår, flerspråkig
      samhällsorientering och integrationsutbildning, utbildning i läs- och skrivfärdighet och sluttestning
      av språkkunskaperna. Dessutom kan programmet inkludera annan utbildning och tjänster, som främjar
      kunskaper i finska eller svenska.
    sentences:
    - id: hb-c12-u0025-s001
      start: 0
      end: 129
    - id: hb-c12-u0025-s002
      start: 130
      end: 418
    - id: hb-c12-u0025-s003
      start: 419
      end: 529
  - type: paragraph
    id: hb-c12-u0026
    text: En bedömning av kompetensen och behovet av integrationstjänster görs under de första åren efter
      flytten till landet, dock senast tre år efter att det första uppehållstillståndet eller uppehållskortet
      beviljades eller uppehållsrätten registrerades. I bedömningen av kompetensen och behovet av integrationstjänster
      bedömer kommunen eller arbetskraftsmyndigheten hurdan kompetens den nyanlända har, vilka hens mål
      och förväntningar är samt hurdana förutsättningar hen har för att integrera sig, få arbete eller
      studera.
    sentences:
    - id: hb-c12-u0026-s001
      start: 0
      end: 247
    - id: hb-c12-u0026-s002
      start: 248
      end: 516
  - type: paragraph
    id: hb-c12-u0027
    text: Utifrån det som kommit fram bedöms hurdant stöd den nyanlända behöver för sin integration. Vid
      behov upprättas en integrationsplan för den nyanlända. Integrationsplanen upprättas senast tre år
      efter att det första uppehållstillståndet eller uppehållskortet beviljades eller uppehållsrätten
      registrerades.
    sentences:
    - id: hb-c12-u0027-s001
      start: 0
      end: 90
    - id: hb-c12-u0027-s002
      start: 91
      end: 149
    - id: hb-c12-u0027-s003
      start: 150
      end: 304
  - type: paragraph
    id: hb-c12-u0028
    text: I integrationsplanen anges de tjänster och åtgärder som ska hjälpa den nyanlända att lära sig
      finska eller svenska och hitta till exempel ett arbete eller en studieplats. Den första integrationsplanen
      gäller i högst ett år och kan förlängas med ett år till. I vissa fall kan planen förlängas ytterligare,
      till exempel om den inte har kunnat genomföras som planerat på grund av föräldraledighet eller sjukdom.
    sentences:
    - id: hb-c12-u0028-s001
      start: 0
      end: 170
    - id: hb-c12-u0028-s002
      start: 171
      end: 257
    - id: hb-c12-u0028-s003
      start: 258
      end: 408
  - type: paragraph
    id: hb-c12-u0029
    text: Tillsammans med den nyanlända kommer man överens om individuella mål för integrationen. Ett
      viktigt mål är vanligtvis sysselsättning eller, om sysselsättning inte är aktuell på grund av personens
      livssituation, att utveckla arbetslivsfärdigheterna. För personer under 25 år är målet att åtminstone
      genomföra en utbildning på andra stadiet.
    sentences:
    - id: hb-c12-u0029-s001
      start: 0
      end: 87
    - id: hb-c12-u0029-s002
      start: 88
      end: 248
    - id: hb-c12-u0029-s003
      start: 249
      end: 339
  - type: paragraph
    id: hb-c12-u0030
    text: För att nå målet kommer man i integrationsplanen vanligtvis överens om deltagande i utbildning
      eller andra åtgärder, till exempel arbetsprövning. Under planens giltighetstid kan den nyanlända
      hänvisas till exempelvis en avgiftsfri integrationsutbildning. I planen ingår vanligtvis också en
      skyldighet att söka arbete.
    sentences:
    - id: hb-c12-u0030-s001
      start: 0
      end: 145
    - id: hb-c12-u0030-s002
      start: 146
      end: 254
    - id: hb-c12-u0030-s003
      start: 255
      end: 317
  - type: paragraph
    id: hb-c12-u0031
    text: Medan åtgärderna i integrationsplanen genomförs, till exempel under integrationsutbildningen,
      är det ofta möjligt för den nyanlända att få en arbetslöshetsförmån, det vill säga ekonomiskt bidrag
      från Folkpensionsanstalten (FPA). Ett villkor för att få arbetslöshetsförmån är att den nyanlända
      följer den integrationsplan som man kommit överens om tillsammans med hen, till exempel deltar i
      överenskommen utbildning.
    sentences:
    - id: hb-c12-u0031-s001
      start: 0
      end: 228
    - id: hb-c12-u0031-s002
      start: 229
      end: 415
  - type: paragraph
    id: hb-c12-u0032
    text: Under integrationsutbildningen studerar den nyanlända finska eller svenska samt viktiga frågor
      om det finländska samhället och arbetslivet. Integrationsutbildningen pågår i allmänhet i omkring
      ett år, men utbildningens längd, omfattning och innehåll kan variera enligt varje deltagares behov.
      Efter integrationsutbildningen är tanken att den nyanlända ska söka arbete eller börja studera.
    sentences:
    - id: hb-c12-u0032-s001
      start: 0
      end: 139
    - id: hb-c12-u0032-s002
      start: 140
      end: 292
    - id: hb-c12-u0032-s003
      start: 293
      end: 388
  - type: paragraph
    id: hb-c12-u0033
    text: Innan utbildningen börjar är det möjligt att den studerande genomgår ett test, där man testar
      språkkunskaperna och studiefärdigheterna. På basis av testet hänvisas hen till en lämplig utbildning.
      I integrationsutbildningen ingår också karriärvägledning och en eller flera perioder av lärande
      på en arbetsplats. Under en period av lärande på arbetsplatsen lär sig den studerande språket bättre
      och stärker sin yrkeskompetens på en finländsk arbetsplats.
    sentences:
    - id: hb-c12-u0033-s001
      start: 0
      end: 135
    - id: hb-c12-u0033-s002
      start: 136
      end: 195
    - id: hb-c12-u0033-s003
      start: 196
      end: 310
    - id: hb-c12-u0033-s004
      start: 311
      end: 452
  - type: paragraph
    id: hb-c12-u0034
    text: I vissa fall kan man i integrationsplanen för en arbetssökande invandrare inkludera frivilliga
      studier, det vill säga annan utbildning än den integrationsutbildning som kommunens arbetskraftsmyndighet
      anordnar. Villkoret är att studierna anses främja den nyanländas integration och sysselsättning.
    sentences:
    - id: hb-c12-u0034-s001
      start: 0
      end: 210
    - id: hb-c12-u0034-s002
      start: 211
      end: 297
  - type: paragraph
    id: hb-c12-u0035
    text: Man ska alltid komma överens om studier och om att inkludera dem i integrationsplanen med kommunens
      arbetskraftsmyndighet innan studierna påbörjas. frivilliga studier kan vara till exempel utbildning
      i läs- och skrivfärdighet, grundläggande utbildning för vuxna, utbildning som handleder för examensutbildning,
      yrkesutbildning eller utbildning som handleder för högskolestudier. Studierna kan också vara utbildning
      som kvalificerar den nyanlända att utöva sitt yrke i Finland.
    sentences:
    - id: hb-c12-u0035-s001
      start: 0
      end: 147
    - id: hb-c12-u0035-s002
      start: 148
      end: 378
    - id: hb-c12-u0035-s003
      start: 379
      end: 476
  - type: paragraph
    id: hb-c12-u0036
    text: Målet är att planera olika tjänster så att de bildar en helhet för var och en som på bästa sätt
      stöder integrationen.
    sentences:
    - id: hb-c12-u0036-s001
      start: 0
      end: 117
  - type: paragraph
    id: hb-c12-u0037
    text: Kommunerna har också rådgivningsservice för nyanlända. Rådgivningstjänsterna kan ge vägledning
      för hur man uträttar ärenden till exempel hos myndigheter. Ibland kan man få rådgivning på sitt
      eget modersmål. Många föreningar och organisationer erbjuder också hjälp och råd för nyanlända.
    sentences:
    - id: hb-c12-u0037-s001
      start: 0
      end: 54
    - id: hb-c12-u0037-s002
      start: 55
      end: 153
    - id: hb-c12-u0037-s003
      start: 154
      end: 206
    - id: hb-c12-u0037-s004
      start: 207
      end: 286
  - type: paragraph
    id: hb-c12-u0038
    text: Dessutom erbjuds flerspråkig samhällsorientering. Tanken är att du ska delta i samhällsorienteringen
      på ditt modersmål eller något annat språk som du kan bra. Där bekantar du dig med det finländska
      samhället och arbetslivet och den finländska kulturen. Fråga mer vid din hemkommun.
    sentences:
    - id: hb-c12-u0038-s001
      start: 0
      end: 49
    - id: hb-c12-u0038-s002
      start: 50
      end: 158
    - id: hb-c12-u0038-s003
      start: 159
      end: 252
    - id: hb-c12-u0038-s004
      start: 253
      end: 281
  - type: paragraph
    id: hb-c12-u0039
    text: Du kan studera finska och svenska även om ingen integrationsplan har utarbetats för dig. Kurser
      ordnas till exempel av medborgarinstitut, arbetarinstitut, folkhögskolor, universitet och sommaruniversitet.
      Om du är arbetslös arbetssökande ska du ändå komma ihåg om studierna med medarbetaren inom sysselsättningstjänsterna
      innan du inleder en kurs.
    sentences:
    - id: hb-c12-u0039-s001
      start: 0
      end: 88
    - id: hb-c12-u0039-s002
      start: 89
      end: 204
    - id: hb-c12-u0039-s003
      start: 205
      end: 347
- id: hb-c12-sprak
  title: Integrationsspråk och språkliga rättigheter
  blocks:
  - type: paragraph
    id: hb-c12-u0040
    text: I Finland är det möjligt att integrera sig på antingen finska eller svenska. Valet av språk
      för integrationen beror på den nyanländas situation. I största delen av Finland talar majoriteten
      av människorna finska och största delen av arbetsplatserna är finskspråkiga. En del kommuner är
      tvåspråkiga och i en del kommuner talar majoriteten svenska.
    sentences:
    - id: hb-c12-u0040-s001
      start: 0
      end: 76
    - id: hb-c12-u0040-s002
      start: 77
      end: 144
    - id: hb-c12-u0040-s003
      start: 145
      end: 266
    - id: hb-c12-u0040-s004
      start: 267
      end: 346
  - type: paragraph
    id: hb-c12-u0041
    text: Att integrera sig på svenska kan vara ett bra alternativ om man bor i en kommun med många svensktalande
      invånare eller där det finns svenskspråkiga arbetsplatser, eller om familj och vänner talar svenska.
      Det kan vara bra att hela familjen väljer samma integrationsspråk, så att det till exempel är lättare
      för föräldrarna att stödja barnens skolgång.
    sentences:
    - id: hb-c12-u0041-s001
      start: 0
      end: 204
    - id: hb-c12-u0041-s002
      start: 205
      end: 351
  - type: paragraph
    id: hb-c12-u0042
    text: Svenska språket är släkt med till exempel tyskan och engelskan. Därför kan en del som redan
      kan dessa språk bra uppleva att det är lättare att lära sig svenska än finska. På många arbetsplatser
      behövs kunskaper i både finska och svenska, och ibland kan det vara nödvändigt att lära sig båda
      språken.
    sentences:
    - id: hb-c12-u0042-s001
      start: 0
      end: 63
    - id: hb-c12-u0042-s002
      start: 64
      end: 170
    - id: hb-c12-u0042-s003
      start: 171
      end: 299
  - type: paragraph
    id: hb-c12-u0043
    text: I integrationsplanen kommer man överens om det primära integrationsspråket.
    sentences:
    - id: hb-c12-u0043-s001
      start: 0
      end: 75
  - type: paragraph
    id: hb-c12-u0044
    text: I en del kommuner kan du delta i integrationsutbildning på svenska. Om du inte blir antagen
      till integrationsutbildning på svenska kan du i vissa fall få stöd för frivilliga studier i svenska,
      om detta har avtalats i din integrationsplan (kotoutumissuunnitelma). Fråga om integration på svenska
      när din bedömning av kompetens och behovet av integrationstjänster (kotoutumisen palvelutarpeen
      ja osaamisen arviointi) och integrationsplan upprättas. Enligt lag har du rätt att välja antingen
      finska eller svenska som integrationsspråk.
    sentences:
    - id: hb-c12-u0044-s001
      start: 0
      end: 67
    - id: hb-c12-u0044-s002
      start: 68
      end: 262
    - id: hb-c12-u0044-s003
      start: 263
      end: 446
    - id: hb-c12-u0044-s004
      start: 447
      end: 532
  - type: paragraph
    id: hb-c12-u0045
    text: I Finland garanterar språklagen rätt för alla att använda finska eller svenska hos nationella
      myndigheter. Hos lokala myndigheter har man rätt att använda finska eller svenska i tvåspråkiga
      kommuner eller välfärdsområden. Många myndigheter erbjuder service också på engelska.
    sentences:
    - id: hb-c12-u0045-s001
      start: 0
      end: 106
    - id: hb-c12-u0045-s002
      start: 107
      end: 221
    - id: hb-c12-u0045-s003
      start: 222
      end: 275
- id: hb-c12-tolkning
  title: Tolkning och sekretess
  blocks:
  - type: paragraph
    id: hb-c12-u0046
    text: Om du måste sköta ärenden med finländska myndigheter, men inte kan finska eller svenska och
      det inte heller finns något annat språk som både du och myndigheten talar, kan du i vissa fall ha
      rätt till tolkning. Då beställer myndigheten tolken och betalar för tolkningen.
    sentences:
    - id: hb-c12-u0046-s001
      start: 0
      end: 209
    - id: hb-c12-u0046-s002
      start: 210
      end: 269
  - type: paragraph
    id: hb-c12-u0047
    text: Myndigheten kan ordna och betala tolkningen när det gäller skötsel av ärenden som inletts på
      myndighetens initiativ. Detta är dock inte alltid möjligt. Om du behöver en tolk i integrationstjänsterna,
      till exempel när en integrationsplan ska utarbetas för dig, är myndigheten skyldig att beställa
      en tolk. Du kan på förhand fråga myndigheten om detta.
    sentences:
    - id: hb-c12-u0047-s001
      start: 0
      end: 116
    - id: hb-c12-u0047-s002
      start: 117
      end: 151
    - id: hb-c12-u0047-s003
      start: 152
      end: 304
    - id: hb-c12-u0047-s004
      start: 305
      end: 350
  - type: paragraph
    id: hb-c12-u0048
    text: Om du söker asyl i Finland har du rätt till tolkning i ärenden som rör behandlingen av din asylansökan.
      Du har rätt att få information om ett beslut gällande dig på ditt modersmål eller ett annat språk
      som du förstår. Information om beslutet ges genom tolkning eller översättning.
    sentences:
    - id: hb-c12-u0048-s001
      start: 0
      end: 103
    - id: hb-c12-u0048-s002
      start: 104
      end: 217
    - id: hb-c12-u0048-s003
      start: 218
      end: 280
  - type: paragraph
    id: hb-c12-u0049
    text: Om du själv bokar tolken och betalar tolkningen, kan du anlita en tolk när som helst.
    sentences:
    - id: hb-c12-u0049-s001
      start: 0
      end: 85
  - type: paragraph
    id: hb-c12-u0050
    text: Tolken är med på möten mellan dig och myndigheten. Han eller hon tolkar det som du och myndigheten
      säger. Tolken är antingen på plats eller också kan tolkningen ordnas via telefon eller video.
    sentences:
    - id: hb-c12-u0050-s001
      start: 0
      end: 50
    - id: hb-c12-u0050-s002
      start: 51
      end: 105
    - id: hb-c12-u0050-s003
      start: 106
      end: 192
  - type: paragraph
    id: hb-c12-u0051
    text: Tolken har som uppgift att tolka det som du och myndigheten säger. Tolken sköter inga andra
      uppgifter utöver tolkningen. Han eller hon kan således inte hjälpa dig med annat. Tolken är en neutral,
      utomstående person som varken är på din eller på myndighetens sida.
    sentences:
    - id: hb-c12-u0051-s001
      start: 0
      end: 66
    - id: hb-c12-u0051-s002
      start: 67
      end: 120
    - id: hb-c12-u0051-s003
      start: 121
      end: 173
    - id: hb-c12-u0051-s004
      start: 174
      end: 263
  - type: paragraph
    id: hb-c12-u0052
    text: Tolken har sekretessplikt och får inte berätta inte om dina angelägenheter för andra.
    sentences:
    - id: hb-c12-u0052-s001
      start: 0
      end: 85
  - type: paragraph
    id: hb-c12-u0053
    text: Man måste meddela om behovet av tolk i samband med tidsbokningen. Om man inte kommer till den
      avtalade tiden som tolken beställts till och inte avbokar den i tid, kan man bli tvungen att betala
      för den oanvända tolktjänsten.
    sentences:
    - id: hb-c12-u0053-s001
      start: 0
      end: 65
    - id: hb-c12-u0053-s002
      start: 66
      end: 224
  - type: paragraph
    id: hb-c12-u0054
    text: Om det inte är möjligt att få en professionell tolk ordnad av en myndighet för att uträtta ett
      ärende, kan kunden själv skaffa en tolk. I sådana fall betalar kunden kostnaderna för tolkningen.
      I vissa fall kan kunden ta med sig till exempel en bekant eller en familjemedlem för att hjälpa
      till. Det är ändå viktigt att var och en sköter sina egna angelägenheter själv. Ett minderårigt
      barn ska aldrig användas som tolk.
    sentences:
    - id: hb-c12-u0054-s001
      start: 0
      end: 135
    - id: hb-c12-u0054-s002
      start: 136
      end: 192
    - id: hb-c12-u0054-s003
      start: 193
      end: 294
    - id: hb-c12-u0054-s004
      start: 295
      end: 368
    - id: hb-c12-u0054-s005
      start: 369
      end: 419
- id: hb-c12-myndigheter
  title: Myndigheter och deras uppgifter
  blocks:
  - type: paragraph
    id: hb-c12-u0055
    text: Myndigheter är offentliga ämbetsverk och inrättningar samt andra aktörer där tjänstemän eller
      tjänsteinnehavare arbetar. Varje myndighet har sina egna föreskrivna uppgifter och behörigheter.
      Nedan presenteras några viktiga myndigheter som personer som flyttat till Finland ofta kommer i
      kontakt med.
    sentences:
    - id: hb-c12-u0055-s001
      start: 0
      end: 120
    - id: hb-c12-u0055-s002
      start: 121
      end: 190
    - id: hb-c12-u0055-s003
      start: 191
      end: 299
  - type: paragraph
    id: hb-c12-u0056
    text: Migrationsverket, Migri, fattar beslut i ärenden som gäller invandring, asyl, flyktingskap och
      medborgarskap och administrerar Finlands mottagningssystem. Migrationsverket ansvarar också för
      att utfärda främlingspass och resedokument för flyktingar och för hjälpsystemet för offer för människohandel.
    sentences:
    - id: hb-c12-u0056-s001
      start: 0
      end: 154
    - id: hb-c12-u0056-s002
      start: 155
      end: 300
  - type: paragraph
    id: hb-c12-u0057
    text: Myndigheten för digitalisering och befolkningsdata, MDB, ansvarar i egenskap av personuppgiftsansvarig
      för Finlands befolkningsdatasystem. Befolkningsdatasystemet är ett allmänt nationellt basregister
      där personuppgifter, hemkommun, adress och ofta också uppgifter om de närmaste familjeförhållandena
      lagras för alla finska medborgare och alla som bor i Finland. När en persons uppgifter sparas i
      befolkningsdatasystemet för första gången får hen en finsk personbeteckning.
    sentences:
    - id: hb-c12-u0057-s001
      start: 0
      end: 138
    - id: hb-c12-u0057-s002
      start: 139
      end: 362
    - id: hb-c12-u0057-s003
      start: 363
      end: 473
  - type: paragraph
    id: hb-c12-u0058
    text: Det är lättare att sköta ärenden i Finland när personuppgifterna och familjeförhållandena har
      lagrats i befolkningsdatasystemet. Det är också viktigt att adressen och de övriga uppgifterna är
      uppdaterade i systemet.
    sentences:
    - id: hb-c12-u0058-s001
      start: 0
      end: 128
    - id: hb-c12-u0058-s002
      start: 129
      end: 215
  - type: paragraph
    id: hb-c12-u0059
    text: MDB är närvarande vid många livshändelser i Finland. Myndigheten ansvarar för bland annat borgerliga
      vigslar, registrering av barns namn och namnändringar. Dessutom främjar MDB digitaliseringen av
      samhället.
    sentences:
    - id: hb-c12-u0059-s001
      start: 0
      end: 52
    - id: hb-c12-u0059-s002
      start: 53
      end: 155
    - id: hb-c12-u0059-s003
      start: 156
      end: 207
  - type: paragraph
    id: hb-c12-u0060
    text: Skatteförvaltningen ansvarar för att samla in de flesta skatter i Finland. Dessutom ansvarar
      Skatteförvaltningen för att skattepengarna förmedlas vidare till olika offentliga aktörer, vars
      verksamhet finansieras med skattemedel. Skatteförvaltningen ger också råd i frågor som gäller betalning
      av skatter. Den som flyttar till Finland ska ansöka om ett skattekort hos Skatteförvaltningen när
      hen ska börja arbeta i Finland.
    sentences:
    - id: hb-c12-u0060-s001
      start: 0
      end: 74
    - id: hb-c12-u0060-s002
      start: 75
      end: 228
    - id: hb-c12-u0060-s003
      start: 229
      end: 304
    - id: hb-c12-u0060-s004
      start: 305
      end: 422
  - type: paragraph
    id: hb-c12-u0061
    text: Folkpensionsanstalten, FPA, ansvarar till stor del för den sociala tryggheten för alla som bor
      eller arbetar i Finland genom att till exempel betala olika ekonomiska bidrag. Syftet med den sociala
      tryggheten är att trygga människors utkomst när de inte själva kan göra det. Orsaker till det kan
      vara ålderdom, sjukdom, arbetslöshet, barnafödsel eller studier.
    sentences:
    - id: hb-c12-u0061-s001
      start: 0
      end: 173
    - id: hb-c12-u0061-s002
      start: 174
      end: 273
    - id: hb-c12-u0061-s003
      start: 274
      end: 359
  - type: paragraph
    id: hb-c12-u0062
    text: Rätten till bidrag från FPA baserar sig i allmänhet på antingen boende eller arbete i Finland.
      Vem som har rätt till bidrag beror på bidraget och tjänsten. En invandrares rätt till vissa stöd
      och tjänster beror på till exempel huruvida hen har kommit till Finland på grund av arbete, studier
      eller något annat.
    sentences:
    - id: hb-c12-u0062-s001
      start: 0
      end: 94
    - id: hb-c12-u0062-s002
      start: 95
      end: 155
    - id: hb-c12-u0062-s003
      start: 156
      end: 310
  - type: paragraph
    id: hb-c12-u0063
    text: Sysselsättningstjänster är tjänster som hjälper människor att få arbete. Sysselsättningstjänsterna
      består i de flesta fall av ett sysselsättningsområde som omfattar flera kommuner. Sysselsättningstjänsterna
      erbjuder rådgivning och handledning och olika tjänster för personer som söker arbete. Att anmäla
      sig som arbetslös arbetssökande hos sysselsättningstjänsterna är en av förutsättningarna för att
      en person ska få arbetslöshetsförmån.
    sentences:
    - id: hb-c12-u0063-s001
      start: 0
      end: 72
    - id: hb-c12-u0063-s002
      start: 73
      end: 180
    - id: hb-c12-u0063-s003
      start: 181
      end: 292
    - id: hb-c12-u0063-s004
      start: 293
      end: 438
  - type: paragraph
    id: hb-c12-u0064
    text: Kommunen ansvarar för många av människornas dagliga tjänster. Nyanlända får tillgång till tjänster
      som stöder integrationen av kommunen. Kommunen ansvarar för barnens småbarnspedagogik, förskoleundervisning
      och grundskoleundervisning, likaså anordnas en stor del av gymnasieundervisningen och yrkesundervisningen
      av kommunerna. Också till exempel bibliotek, ungdomslokaler och boendetjänster är tjänster som kommunen
      ansvarar för.
    sentences:
    - id: hb-c12-u0064-s001
      start: 0
      end: 61
    - id: hb-c12-u0064-s002
      start: 62
      end: 136
    - id: hb-c12-u0064-s003
      start: 137
      end: 327
    - id: hb-c12-u0064-s004
      start: 328
      end: 430
  - type: paragraph
    id: hb-c12-u0065
    text: Välfärdsområdena ansvarar för social- och hälsovårdstjänsterna. Socialtjänsterna omfattar bland
      annat socialarbete och -handledning samt tjänster för familjer, till exempel hemservice för barnfamiljer
      samt fostrans- och familjerådgivning. De omfattar också tjänster för äldre, såsom hemvård, tjänster
      som främjar mobilitet och olika boendetjänster samt tjänster för personer med funktionsnedsättning,
      såsom hjälpmedels- och färdtjänster. Socialtjänsterna omfattar dessutom tjänster som främjar integration.
    sentences:
    - id: hb-c12-u0065-s001
      start: 0
      end: 63
    - id: hb-c12-u0065-s002
      start: 64
      end: 238
    - id: hb-c12-u0065-s003
      start: 239
      end: 437
    - id: hb-c12-u0065-s004
      start: 438
      end: 506
  - type: paragraph
    id: hb-c12-u0066
    text: Hälsovårdstjänsterna omfattar bland annat primärvården som hälsovårdscentralerna tillhandahåller,
      sjukhustjänster, munhälsovårdstjänster, mentalvårdstjänster, mödra- och barnrådgivningar och skolhälsovård
      för skolelever.
    sentences:
    - id: hb-c12-u0066-s001
      start: 0
      end: 220
  - type: paragraph
    id: hb-c12-u0067
    text: Polisen sörjer för den dagliga säkerheten i samhället, övervakar ordningen och efterlevnaden
      av trafikreglerna och utreder brott. Polisen ansvarar också för många tillståndstjänster. Många
      som flyttat till Finland besöker till exempel en polisstation när de ansöker om ett finländskt identitetskort.
      Polisen är en respekterad myndighet i Finland, och forskning visar att finländarna har ett starkt
      förtroende för polisens verksamhet.
    sentences:
    - id: hb-c12-u0067-s001
      start: 0
      end: 129
    - id: hb-c12-u0067-s002
      start: 130
      end: 182
    - id: hb-c12-u0067-s003
      start: 183
      end: 299
    - id: hb-c12-u0067-s004
      start: 300
      end: 433
  - type: paragraph
    id: hb-c12-u0068
    text: Patent- och registerstyrelsen, PRS, för register över bland annat företag, föreningar och stiftelser
      som är verksamma i Finland. PRS beviljar också patent och registrerar varumärken i Finland. Om en
      person vill bli företagare i Finland måste hen i vissa fall anmäla sig till handelsregistret, som
      upprätthålls av PRS.
    sentences:
    - id: hb-c12-u0068-s001
      start: 0
      end: 128
    - id: hb-c12-u0068-s002
      start: 129
      end: 192
    - id: hb-c12-u0068-s003
      start: 193
      end: 317
  - type: paragraph
    id: hb-c12-u0069
    text: En viktig uppgift för Utbildningsstyrelsen är att göra upp grunderna för läroplanen för olika
      skolstadier i Finland. En person som flyttat till Finland ska kontakta Utbildningsstyrelsen om hen
      ansöker om erkännande av en utländsk examen i Finland. Utbildningsstyrelsen ansvarar också för allmänna
      språkexamina, det vill säga YKI-test. Om en person ansöker om finskt medborgarskap kan hen visa
      sina språkkunskaper i finska eller svenska bland annat med ett YKI-test. Testet är avgiftsbelagt.
      Därtill upprätthåller Utbildningsstyrelsen ett register över auktoriserade översättare.
    sentences:
    - id: hb-c12-u0069-s001
      start: 0
      end: 116
    - id: hb-c12-u0069-s002
      start: 117
      end: 247
    - id: hb-c12-u0069-s003
      start: 248
      end: 334
    - id: hb-c12-u0069-s004
      start: 335
      end: 465
    - id: hb-c12-u0069-s005
      start: 466
      end: 490
    - id: hb-c12-u0069-s006
      start: 491
      end: 578
- id: hb-c12-egna-arenden
  title: Att sköta egna ärenden
  blocks:
  - type: paragraph
    id: hb-c12-u0070
    text: Myndigheter fattar i allmänhet sina beslut på basen av människors ansökningar om en tjänst eller
      ett beslut. När man ansöker om ett beslut, en tjänst, en förmån eller ett bidrag ska ansökan göras
      noggrannt, och uppgifterna i ansökan måste vara korrekta. När man undertecknar ansökan förbinder
      man sig till att ge endast korrekt och sanningsenlig information.
    sentences:
    - id: hb-c12-u0070-s001
      start: 0
      end: 108
    - id: hb-c12-u0070-s002
      start: 109
      end: 253
    - id: hb-c12-u0070-s003
      start: 254
      end: 358
  - type: paragraph
    id: hb-c12-u0071
    text: Kunden måste ge myndigheten de uppgifter och dokument som behövs för att ansökan ska kunna behandlas.
      Kunden får inte medvetet dölja information som kan påverka beslutet.
    sentences:
    - id: hb-c12-u0071-s001
      start: 0
      end: 101
    - id: hb-c12-u0071-s002
      start: 102
      end: 170
  - type: paragraph
    id: hb-c12-u0072
    text: Kunden ska alltid meddela myndigheten om hens situation förändras på något väsentligt sätt.
      Om man till exempel får bostadsbidrag från FPA, måste man meddela om man flyttar till en annan bostad
      eller om inkomsterna förändras. Om FPA betalar ut för mycket stöd på grund av felaktiga uppgifter
      eller en flytt utomlands kräver myndigheten tillbaka pengarna.
    sentences:
    - id: hb-c12-u0072-s001
      start: 0
      end: 91
    - id: hb-c12-u0072-s002
      start: 92
      end: 225
    - id: hb-c12-u0072-s003
      start: 226
      end: 354
  - type: paragraph
    id: hb-c12-u0073
    text: Om man har låtit bli att berätta om förändrade omständigheter kan man utöver återbetalning i
      värsta fall åtalas för brott. Den som ansöker om en förmån är skyldig att ta reda på och informera
      myndigheten om faktorer som påverkar hens rätt att få förmånen, till exempel arbetsmarknadsstöd.
    sentences:
    - id: hb-c12-u0073-s001
      start: 0
      end: 122
    - id: hb-c12-u0073-s002
      start: 123
      end: 288
  - type: paragraph
    id: hb-c12-u0074
    text: Det är annars också viktigt att se till att lämna in nödvändiga ansökningar och anmälningar
      till myndigheter i rätt tid. Till exempel den förhandsifyllda skattedeklarationen som skatteförvaltningen
      skickar ut måste kontrolleras och eventuella ändringar meddelas före tidsfristen löper ut. Om man
      låter bli att korrigera fel i skattedeklarationen och inte meddelar en inkomst man fått kan man
      göra sig skyldig till kringgående av skatt, som är en straffbar handling.
    sentences:
    - id: hb-c12-u0074-s001
      start: 0
      end: 120
    - id: hb-c12-u0074-s002
      start: 121
      end: 288
    - id: hb-c12-u0074-s003
      start: 289
      end: 465
  - type: paragraph
    id: hb-c12-u0075
    text: Likaså måste man ansöka om fortsatt uppehållstillstånd i tid innan uppehållstillståndet löper
      ut. Det är på personens eget ansvar att sköta dessa ärenden.
    sentences:
    - id: hb-c12-u0075-s001
      start: 0
      end: 97
    - id: hb-c12-u0075-s002
      start: 98
      end: 154
  - type: paragraph
    id: hb-c12-u0076
    text: När en kund ger en myndighet uppgifter om sig själv och sin situation försäkrar hen att uppgifterna
      är korrekta. Därför är det viktigt att fråga om råd eller en förklaring om man inte förstår till
      exempel en punkt på en blankett. Annars kan man av misstag lämna felaktiga uppgifter.
    sentences:
    - id: hb-c12-u0076-s001
      start: 0
      end: 112
    - id: hb-c12-u0076-s002
      start: 113
      end: 229
    - id: hb-c12-u0076-s003
      start: 230
      end: 282
  - type: paragraph
    id: hb-c12-u0077
    text: Var och en ansvarar själv för att man har gett en myndighet korrekta och aktuella uppgifter.
      Att lämna felaktiga uppgifter kan leda till ett felaktigt beslut. Att avsiktligen lämna felaktiga
      uppgifter till en myndighet kan till och med leda till åtal.
    sentences:
    - id: hb-c12-u0077-s001
      start: 0
      end: 92
    - id: hb-c12-u0077-s002
      start: 93
      end: 158
    - id: hb-c12-u0077-s003
      start: 159
      end: 251
  - type: paragraph
    id: hb-c12-u0078
    text: I Finland utgår man ifrån att vuxna människor själva sköter sina myndighetsärenden. Det är alltså
      inte vanligt att till exempel mannen sköter myndighetsärenden för sin frus räkning. Bakgrunden till
      detta är en individuell och jämställd kultur, där var och en har rätt att ha kontroll över sina
      egna uppgifter och att själv ingå de avtal som gäller en själv. Att sköta sina egna ärenden främjar
      också människans integration och ökar känslan av delaktighet.
    sentences:
    - id: hb-c12-u0078-s001
      start: 0
      end: 83
    - id: hb-c12-u0078-s002
      start: 84
      end: 181
    - id: hb-c12-u0078-s003
      start: 182
      end: 357
    - id: hb-c12-u0078-s004
      start: 358
      end: 455
  - type: paragraph
    id: hb-c12-u0079
    text: Myndigheterna får i allmänhet inte lämna ut uppgifter till andra än den som uppgifterna gäller.
      Uppgifter om barn får lämnas ut till de officiella vårdnadshavarna. I vissa fall måste också ett
      minderårigt barn först själv ge samtycke till att exempelvis hens hälsouppgifter får lämnas ut till
      vårdnadshavarna.
    sentences:
    - id: hb-c12-u0079-s001
      start: 0
      end: 95
    - id: hb-c12-u0079-s002
      start: 96
      end: 163
    - id: hb-c12-u0079-s003
      start: 164
      end: 309
  - type: paragraph
    id: hb-c12-u0080
    text: Ibland kan en person inte sköta ett visst ärende själv, till exempel om hen är sjuk eller på
      resa. Då är det vanligtvis möjligt för hen att ge någon annan fullmakt att sköta ärendet för hens
      räkning. Det är bra att utfärda fullmakten skriftligt, och för det finns färdiga mallar. Det är
      alltid frivilligt att ge en fullmakt. Ingen får utöva påtryckning på någon annan för att hen ska
      ge upp sin makt att sköta sina egna ärenden.
    sentences:
    - id: hb-c12-u0080-s001
      start: 0
      end: 98
    - id: hb-c12-u0080-s002
      start: 99
      end: 199
    - id: hb-c12-u0080-s003
      start: 200
      end: 279
    - id: hb-c12-u0080-s004
      start: 280
      end: 324
    - id: hb-c12-u0080-s005
      start: 325
      end: 428
- id: hb-c12-personuppgifter
  title: Personbeteckning och personuppgifter
  blocks:
  - type: paragraph
    id: hb-c12-u0081
    text: Personbeteckningen är en individuell kod som ges till alla människor som registreras i Finlands
      befolkningsdatasystem. Registreringen baserar sig i allmänhet på att man bor i Finland eller har
      finskt medborgarskap.
    sentences:
    - id: hb-c12-u0081-s001
      start: 0
      end: 118
    - id: hb-c12-u0081-s002
      start: 119
      end: 214
  - type: paragraph
    id: hb-c12-u0082
    text: Två personer kan aldrig ha samma personbeteckning. Med hjälp av personbeteckningen kan människor
      alltså identifieras, även om de skulle ha exakt samma namn och födelsedatum. När man en gång har
      fått en personbeteckning förblir den för alltid densamma, förutom i vissa undantagsfall. Även om
      man skulle flytta från Finland och bo utomlands i flera år eller årtionden, förblir personbeteckningen
      densamma. Med hjälp av personbeteckningen kan myndigheterna säkerställa att uppgifter kopplas till
      rätt person. Också många privata aktörer såsom banker använder personbeteckningen för att identifiera
      människor. Det underlättar överföringen av uppgifter mellan olika myndigheter och aktörer.
    sentences:
    - id: hb-c12-u0082-s001
      start: 0
      end: 50
    - id: hb-c12-u0082-s002
      start: 51
      end: 173
    - id: hb-c12-u0082-s003
      start: 174
      end: 282
    - id: hb-c12-u0082-s004
      start: 283
      end: 403
    - id: hb-c12-u0082-s005
      start: 404
      end: 505
    - id: hb-c12-u0082-s006
      start: 506
      end: 605
    - id: hb-c12-u0082-s007
      start: 606
      end: 685
  - type: paragraph
    id: hb-c12-u0083
    text: Personbeteckningen är mycket viktig i Finland, och en sådan krävs i så gott som alla myndighetsärenden.
      Ofta krävs en personbeteckning också till exempel för att hyra en bostad, skaffa ett telefonabonnemang
      och öppna ett bankkonto. Man ska inte i onödan ge ut sin personbeteckning till okända, eftersom
      det kan vara möjligt för kriminella att till exempel ansöka om lån i en annan persons namn med hjälp
      av personbeteckningen.
    sentences:
    - id: hb-c12-u0083-s001
      start: 0
      end: 103
    - id: hb-c12-u0083-s002
      start: 104
      end: 231
    - id: hb-c12-u0083-s003
      start: 232
      end: 426
  - type: paragraph
    id: hb-c12-u0084
    text: Befolkningsdatasystemet som upprätthålls av Myndigheten för digitalisering och befolkningsdata
      är ett basregister som används av Finlands myndigheter. Myndigheterna får i allmänhet basuppgifter,
      det vill säga namn, adress och hemkommun, om en person direkt från befolkningsdatasystemet. När
      det gäller barn får myndigheterna i allmänhet uppgifter om vem eller vilka som är barnets vårdnadshavare.
      Också till exempel bankerna får dessa basuppgifter direkt från befolkningsdatasystemet.
    sentences:
    - id: hb-c12-u0084-s001
      start: 0
      end: 150
    - id: hb-c12-u0084-s002
      start: 151
      end: 286
    - id: hb-c12-u0084-s003
      start: 287
      end: 396
    - id: hb-c12-u0084-s004
      start: 397
      end: 484
  - type: paragraph
    id: hb-c12-u0085
    text: I annat fall beror det på situationen vilka uppgifter myndigheterna kan få om en person från
      andra myndigheter. Behandlingen av personuppgifter och tillgången till information baserar sig alltid
      på lagstiftningen och myndighetens uppdrag. En myndighet har i allmänhet rätt att utan kundens separata
      samtycke få tillgång till sådana uppgifter som är nödvändiga för att fatta ett beslut i kundens
      ärende. Till exempel FPA kan från sysselsättningstjänsterna få information om kundens arbetssökning
      om hen har ansökt om arbetslöshetsförmåner. I andra fall måste myndigheten först be om kundens samtycke
      till utlämnande av uppgifterna.
    sentences:
    - id: hb-c12-u0085-s001
      start: 0
      end: 111
    - id: hb-c12-u0085-s002
      start: 112
      end: 238
    - id: hb-c12-u0085-s003
      start: 239
      end: 402
    - id: hb-c12-u0085-s004
      start: 403
      end: 538
    - id: hb-c12-u0085-s005
      start: 539
      end: 630
  - type: paragraph
    id: hb-c12-u0086
    text: En myndighet har alltid rätt att få tillgång till endast sådana uppgifter om en person som den
      har laglig grund för att få. Även om en enskild tjänsteman skulle ha tillgång till uppgifterna om
      en person i myndighetens system, kan hen titta på dem endast om uppgifterna är nödvändiga för hens
      arbete.
    sentences:
    - id: hb-c12-u0086-s001
      start: 0
      end: 123
    - id: hb-c12-u0086-s002
      start: 124
      end: 299
  - type: paragraph
    id: hb-c12-u0087
    text: När du får en personbeteckning blir du inte automatiskt registrerad som invånare i en viss kommun.
      Om du har fått personbeteckningen hos Migrationsverket (Maahanmuuttovirasto) eller skatteförvaltningen
      (Vero), måste du vanligtvis också registrera en tillfällig eller stadigvarande bostadsadress hos
      Myndigheten för digitalisering och befolkningsdata (Digi- ja väestötietovirasto). När du registrerar
      en stadigvarande adress och hemkommun, får du till exempel använda de kommunala tjänsterna.
    sentences:
    - id: hb-c12-u0087-s001
      start: 0
      end: 98
    - id: hb-c12-u0087-s002
      start: 99
      end: 380
    - id: hb-c12-u0087-s003
      start: 381
      end: 491
  - type: paragraph
    id: hb-c12-u0088
    text: 'Du kan få en personbeteckning om du lagligt vistas i Finland. En laglig vistelse kan grunda
      sig på till exempel ett uppehållstillstånd, fri rörlighet för EU-medborgare, ett visum eller visumfrihet.
      Dessutom krävs det att ett av följande villkor uppfylls:'
    sentences:
    - id: hb-c12-u0088-s001
      start: 0
      end: 61
    - id: hb-c12-u0088-s002
      start: 62
      end: 197
    - id: hb-c12-u0088-s003
      start: 198
      end: 254
  - id: hb-c12-u0090
    type: list
    ordered: false
    items:
    - id: hb-c12-u0089
      text: Du behöver en personbeteckning för arbete, studier eller en motsvarande orsak som äger rum
        i Finland.
      sentences:
      - id: hb-c12-u0089-s001
        start: 0
        end: 101
    - id: hb-c12-u0091
      text: Din familjemedlem har redan en registrerad adress i Finland.
      sentences:
      - id: hb-c12-u0091-s001
        start: 0
        end: 60
    - id: hb-c12-u0092
      text: Migrationsverket har beviljat dig ett uppehållstillstånd eller uppehållskort eller registrerat
        din uppehållsrätt för EU-medborgare i Finland.
      sentences:
      - id: hb-c12-u0092-s001
        start: 0
        end: 141
  - type: paragraph
    id: hb-c12-u0093
    text: När dina personuppgifter registreras sparas samtidigt också en adress för dig. Adressen kan
      vara tillfällig, permanent eller enbart postadress.
    sentences:
    - id: hb-c12-u0093-s001
      start: 0
      end: 78
    - id: hb-c12-u0093-s002
      start: 79
      end: 143
  - type: paragraph
    id: hb-c12-u0094
    text: En tillfällig adress gäller tillfälligt och du har blivit registrerad som invånare på adressen
      för en viss tidsperiod. En tillfällig adress gäller vanligtvis ett år i taget.
    sentences:
    - id: hb-c12-u0094-s001
      start: 0
      end: 118
    - id: hb-c12-u0094-s002
      start: 119
      end: 173
  - type: paragraph
    id: hb-c12-u0095
    text: När Myndigheten för digitalisering och befolkningsdata registrerar dig en permanent adress,
      registrerar den dig som invånare på adressen tills vidare. Adressen gäller tills du gör en flyttanmälan
      till en annan adress. Samtidigt sparas för dig även en hemkommun i Finland. Hemkommunen kan vara
      en stor stad eller en liten kommun. Du behöver en hemkommun för att kunna använda tjänsterna som
      välfärdsområdet (hyvinvointialue) staden eller kommunen tillhandahåller.
    sentences:
    - id: hb-c12-u0095-s001
      start: 0
      end: 150
    - id: hb-c12-u0095-s002
      start: 151
      end: 217
    - id: hb-c12-u0095-s003
      start: 218
      end: 271
    - id: hb-c12-u0095-s004
      start: 272
      end: 328
    - id: hb-c12-u0095-s005
      start: 329
      end: 462
  - type: paragraph
    id: hb-c12-u0096
    text: Till kommunens tjänster hör till exempel skolorna, småbarnspedagogiken, sysselsättningstjänsterna
      (työllisyyspalvelut) och integrationstjänsterna (kotoutumispalvelut) för invandrare. Till välfärdsområdets
      tjänster hör hälsovården och socialtjänsterna.
    sentences:
    - id: hb-c12-u0096-s001
      start: 0
      end: 182
    - id: hb-c12-u0096-s002
      start: 183
      end: 251
  - type: paragraph
    id: hb-c12-u0097
    text: Det är bra att ta reda på om du och de andra medlemmarna i din familj har rätt till en hemkommun
      i Finland. Rätten till en hemkommun i Finland bestäms enligt hemkommunslagen. Vid Myndigheten för
      digitalisering och befolkningsdata kan du ta reda på om du har rätt till en hemkommun i Finland.
    sentences:
    - id: hb-c12-u0097-s001
      start: 0
      end: 107
    - id: hb-c12-u0097-s002
      start: 108
      end: 174
    - id: hb-c12-u0097-s003
      start: 175
      end: 291
  - type: paragraph
    id: hb-c12-u0098
    text: Om en postadress registreras för dig registreras du inte som invånare på adressen i fråga. Postadress
      kan användas om du inte har en permanent bostadsadress, du bor på hotell eller du vill hämta din
      post från postkontoret.
    sentences:
    - id: hb-c12-u0098-s001
      start: 0
      end: 90
    - id: hb-c12-u0098-s002
      start: 91
      end: 222
  - type: paragraph
    id: hb-c12-u0099
    text: Myndigheten för digitalisering och befolkningsdata registrerar dina uppgifter i det finländska
      befolkningsdatasystemet. Dessa uppgifter är bland annat namn, födelsedatum, kön, medborgarskap,
      födelseplats, modersmål och adress.
    sentences:
    - id: hb-c12-u0099-s001
      start: 0
      end: 119
    - id: hb-c12-u0099-s002
      start: 120
      end: 226
- id: hb-c12-hemkommun
  title: Hemkommun och offentliga tjänster
  blocks:
  - type: paragraph
    id: hb-c12-u0100
    text: Kommunerna tillhandahåller många tjänster för sina invånare. Om du har en hemkommun (kotikunta)
      i Finland, har du vanligtvis rätt att använda tjänsterna som välfärdsområdet, staden eller kommunen
      tillhandahåller.
    sentences:
    - id: hb-c12-u0100-s001
      start: 0
      end: 60
    - id: hb-c12-u0100-s002
      start: 61
      end: 212
  - type: paragraph
    id: hb-c12-u0101
    text: Det lönar sig för dig att utreda om du och de andra medlemmarna i din familj har rätt till en
      hemkommun i Finland. Rätten till en hemkommun i Finland bestäms enligt hemkommunslagen. Du kan fråga
      hos Myndigheten för digitalisering och befolkningsdata (Digi- ja väestötietovirasto) om du har rätt
      till hemkommun i Finland.
    sentences:
    - id: hb-c12-u0101-s001
      start: 0
      end: 114
    - id: hb-c12-u0101-s002
      start: 115
      end: 181
    - id: hb-c12-u0101-s003
      start: 182
      end: 320
  - type: paragraph
    id: hb-c12-u0102
    text: För att få en hemkommun i Finland måste du flytta till Finland och bo här minst ett år. Om du
      bor i Finland tillfälligt, om du till exempel flyttar till Finland för studier eller jobb för en
      kortare tid än ett år, kan du vanligtvis inte få en hemkommun i Finland.
    sentences:
    - id: hb-c12-u0102-s001
      start: 0
      end: 87
    - id: hb-c12-u0102-s002
      start: 88
      end: 263
  - type: paragraph
    id: hb-c12-u0103
    text: När du har fått en hemkommun har du samma rättigheter, tjänster och skyldigheter som personer
      som bor stadigvarande i Finland.
    sentences:
    - id: hb-c12-u0103-s001
      start: 0
      end: 126
  - type: paragraph
    id: hb-c12-u0104
    text: 'Du har möjlighet att få en hemkommun i Finland om:'
    sentences:
    - id: hb-c12-u0104-s001
      start: 0
      end: 50
  - id: hb-c12-u0106
    type: list
    ordered: false
    items:
    - id: hb-c12-u0105
      text: du är medborgare i Finland eller något annat nordiskt land
      sentences:
      - id: hb-c12-u0105-s001
        start: 0
        end: 58
    - id: hb-c12-u0107
      text: du är medborgare i EU, Schweiz eller Liechtenstein och du har registrerat din uppehållsrätt
        hos Migrationsverket (Maahanmuuttovirasto)
      sentences:
      - id: hb-c12-u0107-s001
        start: 0
        end: 134
    - id: hb-c12-u0108
      text: du har permanent (P) eller kontinuerligt (A) uppehållstillstånd som är i kraft
      sentences:
      - id: hb-c12-u0108-s001
        start: 0
        end: 78
    - id: hb-c12-u0109
      text: du är familjemedlem till en person som har en hemkommun i Finland
      sentences:
      - id: hb-c12-u0109-s001
        start: 0
        end: 65
    - id: hb-c12-u0110
      text: Om du har ett tillfälligt uppehållstillstånd (B-tillstånd) som är i kraft minst ett år, kan
        du få en hemkommun om du kan påvisa att det är din avsikt att bo stadigvarande i Finland.
      sentences:
      - id: hb-c12-u0110-s001
        start: 0
        end: 181
  - type: paragraph
    id: hb-c12-u0111
    text: 'Stadigvarande boende kan påvisas till exempel genom följande omständigheter:'
    sentences:
    - id: hb-c12-u0111-s001
      start: 0
      end: 76
  - id: hb-c12-u0113
    type: list
    ordered: false
    items:
    - id: hb-c12-u0112
      text: du har en arbetsplats i Finland och ditt arbetskontrakt är i kraft minst två år
      sentences:
      - id: hb-c12-u0112-s001
        start: 0
        end: 79
    - id: hb-c12-u0114
      text: du studerar i Finland och dina studier räcker minst två år
      sentences:
      - id: hb-c12-u0114-s001
        start: 0
        end: 58
    - id: hb-c12-u0115
      text: du har tidigare haft en hemkommun i Finland
      sentences:
      - id: hb-c12-u0115-s001
        start: 0
        end: 43
    - id: hb-c12-u0116
      text: du har varit fortlöpande bosatt i Finland under minst ett års tid
      sentences:
      - id: hb-c12-u0116-s001
        start: 0
        end: 65
    - id: hb-c12-u0117
      text: du är av finländsk härkomst.
      sentences:
      - id: hb-c12-u0117-s001
        start: 0
        end: 28
  - type: paragraph
    id: hb-c12-u0118
    text: Din hemkommun är vanligen den kommun du bor i. Om du inte har en bostad eller om du har bostäder
      på flera kommuners område är din hemkommun den kommun som du själv uppfattar som din hemkommun och
      som du har någon fast förbindelse till, till exempel genom familjeförhållanden eller arbetsplats.
    sentences:
    - id: hb-c12-u0118-s001
      start: 0
      end: 46
    - id: hb-c12-u0118-s002
      start: 47
      end: 293
- id: hb-c12-e-tjanster
  title: Elektroniska tjänster och identifiering
  blocks:
  - type: paragraph
    id: hb-c12-u0119
    text: I Finland har myndigheterna alltmer övergått till elektronisk ärendehantering. Elektronisk ärendehantering
      betyder att kunden kan sköta sina ärenden självständigt på internet. Hen måste alltså inte besöka
      myndigheten eller ringa kundtjänsten.
    sentences:
    - id: hb-c12-u0119-s001
      start: 0
      end: 78
    - id: hb-c12-u0119-s002
      start: 79
      end: 175
    - id: hb-c12-u0119-s003
      start: 176
      end: 242
  - type: paragraph
    id: hb-c12-u0120
    text: Suomi.fi är en webbplats som administreras av finska staten. På webbplatsen finns förutom meddelandetjänsten
      också länkar till olika myndigheters e-tjänster och mycket information om olika myndigheters tjänster
      i Finland.
    sentences:
    - id: hb-c12-u0120-s001
      start: 0
      end: 60
    - id: hb-c12-u0120-s002
      start: 61
      end: 221
  - type: paragraph
    id: hb-c12-u0121
    text: Många kommuner har kundtjänster som erbjuder digitalt stöd och där man kan få hjälp med att
      till exempel använda olika myndigheters e-tjänster.
    sentences:
    - id: hb-c12-u0121-s001
      start: 0
      end: 143
  - type: paragraph
    id: hb-c12-u0122
    text: Om man inte kan eller vill använda e-tjänster kan man vanligtvis uträtta sina ärenden också
      genom att besöka myndigheten eller ett kundtjänstställe, eller genom att ringa. Om man vill besöka
      en myndighet för att uträtta ett ärende måste man ofta boka tid. Ibland kan ett ärende inte uträttas
      på nätet eller per telefon, utan man måste själv besöka myndigheten. Så är det till exempel när
      man första gången ansöker om en finländsk personbeteckning eller ett finländskt identitetskort.
    sentences:
    - id: hb-c12-u0122-s001
      start: 0
      end: 171
    - id: hb-c12-u0122-s002
      start: 172
      end: 255
    - id: hb-c12-u0122-s003
      start: 256
      end: 360
    - id: hb-c12-u0122-s004
      start: 361
      end: 483
  - type: paragraph
    id: hb-c12-u0123
    text: För elektronisk ärendehantering krävs i Finland i allmänhet stark autentisering. Stark autentisering
      betyder att en person på ett tillförlitligt sätt styrker sin identitet när hen använder e-tjänster.
      Det är samma ska som när en person visar sitt identitetsbevis när hen uträttar ärenden genom att
      fysiskt besöka ett kundtjänstställe. För att använda stark autentisering krävs i allmänhet en finländsk
      personbeteckning.
    sentences:
    - id: hb-c12-u0123-s001
      start: 0
      end: 80
    - id: hb-c12-u0123-s002
      start: 81
      end: 200
    - id: hb-c12-u0123-s003
      start: 201
      end: 334
    - id: hb-c12-u0123-s004
      start: 335
      end: 419
  - type: paragraph
    id: hb-c12-u0124
    text: Stark autentisering sker med nätbankskoder, ett mobilcertifikat eller ett chipförsett identitetskort.
      Att använda ett chipförsett identitetskort för elektronisk ärendehantering kräver en särskild programvara
      och en kortläsare som kopplas till en dator. De flesta använder nätbankskoder för att uträtta ärenden
      elektroniskt.
    sentences:
    - id: hb-c12-u0124-s001
      start: 0
      end: 101
    - id: hb-c12-u0124-s002
      start: 102
      end: 252
    - id: hb-c12-u0124-s003
      start: 253
      end: 323
  - type: paragraph
    id: hb-c12-u0125
    text: Man ansöker om nätbankskoder hos sin egen bank. I allmänhet är det värt att fråga efter koderna
      när man öppnar ett bankkonto. Det ställs ändå högre krav på nätbankskoder än på att öppna ett konto.
      Ibland kan banken inte bevilja nätbankskoder, även om man får öppna ett konto. Banken kan till exempel
      kräva att man har ett identitetskort som utfärdats av polisen i Finland.
    sentences:
    - id: hb-c12-u0125-s001
      start: 0
      end: 47
    - id: hb-c12-u0125-s002
      start: 48
      end: 125
    - id: hb-c12-u0125-s003
      start: 126
      end: 196
    - id: hb-c12-u0125-s004
      start: 197
      end: 275
    - id: hb-c12-u0125-s005
      start: 276
      end: 372
  - type: paragraph
    id: hb-c12-u0126
    text: Nätbankskoder och andra verktyg för stark autentisering är alltid personliga. De får aldrig
      lämnas ut till någon annan. Uppgifter som lämnats och avtal som ingåtts medan man varit inloggad
      genom stark autentisering är lika bindande som sådana som bekräftats personligen med en underskrift.
    sentences:
    - id: hb-c12-u0126-s001
      start: 0
      end: 77
    - id: hb-c12-u0126-s002
      start: 78
      end: 119
    - id: hb-c12-u0126-s003
      start: 120
      end: 289
- id: hb-c12-norden-eu
  title: Nordiska medborgare och EU-medborgare
  blocks:
  - type: paragraph
    id: hb-c12-u0127
    text: Om du är medborgare i ett nordiskt land och flyttar till Finland, behöver du inte ansöka om
      uppehållstillstånd eller motivera din vistelse i Finland. Du kan arbeta, driva ett företag eller
      studera i Finland med lika villkor som finländska medborgare.
    sentences:
    - id: hb-c12-u0127-s001
      start: 0
      end: 149
    - id: hb-c12-u0127-s002
      start: 150
      end: 250
  - type: paragraph
    id: hb-c12-u0128
    text: De nordiska länderna är Finland, Sverige, Norge, Danmark och Island. Eftersom Åland hör till
      Finland och Färöarna och Grönland till Danmark, är även ålänningarna, färingarna och grönländarna
      nordbor.
    sentences:
    - id: hb-c12-u0128-s001
      start: 0
      end: 68
    - id: hb-c12-u0128-s002
      start: 69
      end: 199
  - type: paragraph
    id: hb-c12-u0129
    text: Nordiska medborgare får bo och arbeta i Finland utan uppehållstillstånd. Utöver Finland är de
      nordiska länderna Sverige, Norge, Danmark och Island. Om en nordisk medborgare vistas i Finland
      i över sex månader, ska hen personligen besöka servicestället för Myndigheten för digitalisering
      och befolkningsdata på sin hemort för att registrera sig.
    sentences:
    - id: hb-c12-u0129-s001
      start: 0
      end: 72
    - id: hb-c12-u0129-s002
      start: 73
      end: 147
    - id: hb-c12-u0129-s003
      start: 148
      end: 344
  - type: paragraph
    id: hb-c12-u0130
    text: Gör registreringen så fort som möjligt, dock senast inom en månad efter att du har flyttat till
      Finland.
    sentences:
    - id: hb-c12-u0130-s001
      start: 0
      end: 104
  - type: paragraph
    id: hb-c12-u0131
    text: Om en av dina familjemedlemmar, som flyttar med dig till Finland, inte är medborgare i ett nordiskt
      land, kan han/hon behöva uppehållstillstånd eller ett registreringsintyg över uppehållsrätt för
      EU-medborgare.
    sentences:
    - id: hb-c12-u0131-s001
      start: 0
      end: 210
  - type: paragraph
    id: hb-c12-u0132
    text: Om du är medborgare i ett EU-land behöver du inget uppehållstillstånd i Finland. Om du bor i
      Finland över tre månader, måste du registrera din uppehållsrätt.
    sentences:
    - id: hb-c12-u0132-s001
      start: 0
      end: 80
    - id: hb-c12-u0132-s002
      start: 81
      end: 157
  - type: paragraph
    id: hb-c12-u0133
    text: Detsamma gäller medborgare i Schweiz och Liechtenstein. Du kan resa till Finland om du har ett
      giltigt ID-kort eller pass. Du har rätt att arbeta, driva ett företag och studera i Finland med
      lika villkor som finska medborgare. Du måste själv trygga din försörjning i Finland.
    sentences:
    - id: hb-c12-u0133-s001
      start: 0
      end: 55
    - id: hb-c12-u0133-s002
      start: 56
      end: 122
    - id: hb-c12-u0133-s003
      start: 123
      end: 226
    - id: hb-c12-u0133-s004
      start: 227
      end: 275
  - type: paragraph
    id: hb-c12-u0134
    text: Du kan vistas i Finland högst tre månader i sträck utan att registrera din uppehållsrätt. Om
      du vill stanna i Finland och registrera dig som invånare, måste du ha ett jobb eller ett aktivt
      företag, en studieplats, familjeband eller tillräckliga medel.
    sentences:
    - id: hb-c12-u0134-s001
      start: 0
      end: 89
    - id: hb-c12-u0134-s002
      start: 90
      end: 251
  - type: paragraph
    id: hb-c12-u0135
    text: Om du avser att bo i Finland i över tre månader, ska du ansöka om registrering av uppehållsrätten
      för EU-medborgare hos Migrationsverket (Maahanmuuttovirasto). Ansökan ska ställas senast inom tre
      månader från datumet för inresa. Om du är medborgare i ett nordiskt land (Island, Norge, Sverige
      och Danmark) räcker det med att du registrerar dina uppgifter hos Myndigheten för digitalisering
      och befolkningsdata.
    sentences:
    - id: hb-c12-u0135-s001
      start: 0
      end: 159
    - id: hb-c12-u0135-s002
      start: 160
      end: 228
    - id: hb-c12-u0135-s003
      start: 229
      end: 410
  - type: paragraph
    id: hb-c12-u0136
    text: Om du har en grund för din vistelse i Finland och förutsättningarna för vistelsen uppfylls,
      får du ett intyg över registreringen från Migrationsverket. Registreringen av uppehållsrätten gäller
      tillsvidare.
    sentences:
    - id: hb-c12-u0136-s001
      start: 0
      end: 151
    - id: hb-c12-u0136-s002
      start: 152
      end: 205
  - type: paragraph
    id: hb-c12-u0137
    text: När du har bott i Finland lagligt och utan avbrott i fem år, kan du ansöka om permanent uppehållsrätt
      för EU-medborgare. Permanent uppehållsrätt för EU-medborgare ansöks separat från Migrationsverket.
    sentences:
    - id: hb-c12-u0137-s001
      start: 0
      end: 120
    - id: hb-c12-u0137-s002
      start: 121
      end: 200
  - type: paragraph
    id: hb-c12-u0138
    text: Om du är familjemedlem till en finsk medborgare ska du fylla i bilagan om utnyttjande av en
      finsk medborgares rätt till fri rörlighet. Utnyttjande av rätten till fri rörlighet innebär att
      din familjemedlem som är finsk medborgare har bott i ett annat EU-land eller ett land som jämställs
      med ett EU-land i minst tre månader utan avbrott. Under denna tid ska personen ha levt familjeliv
      med dig.
    sentences:
    - id: hb-c12-u0138-s001
      start: 0
      end: 134
    - id: hb-c12-u0138-s002
      start: 135
      end: 337
    - id: hb-c12-u0138-s003
      start: 338
      end: 394
  - type: paragraph
    id: hb-c12-u0139
    text: Om du inte själv är medborgare i ett EU-land, Liechtenstein, Schweiz, Norge eller Island, men
      du avser att flytta till Finland för att bo hos en familjemedlem som är EU-medborgare, måste du
      ansöka om uppehållskort för en familjemedlem till en EU-medborgare.
    sentences:
    - id: hb-c12-u0139-s001
      start: 0
      end: 257
- id: hb-c12-tillstand
  title: Grunder för uppehållstillstånd
  blocks:
  - type: paragraph
    id: hb-c12-u0140
    text: När en person flyttar till Finland behöver hen ofta ett uppehållstillstånd. I Finlands utlänningslag
      föreskrivs om hur man kan ansöka om asyl eller uppehållstillstånd, hur familjeåterförening går till
      och hurdan rätt att arbeta nyanlända har i Finland.
    sentences:
    - id: hb-c12-u0140-s001
      start: 0
      end: 75
    - id: hb-c12-u0140-s002
      start: 76
      end: 252
  - type: paragraph
    id: hb-c12-u0141
    text: Migrationsverket behandlar alla ansökningar om uppehållstillstånd. Det fattar också skriftliga
      beslut om ansökningarna, det vill säga beviljar eller avslår dem. Man kan få uppehållstillstånd
      på grund av bland annat arbete eller företagande, studier eller familjeband.
    sentences:
    - id: hb-c12-u0141-s001
      start: 0
      end: 66
    - id: hb-c12-u0141-s002
      start: 67
      end: 160
    - id: hb-c12-u0141-s003
      start: 161
      end: 267
  - type: paragraph
    id: hb-c12-u0142
    text: Villkoret för uppehållstillstånd som beviljas för arbete, studier eller familjeband är ofta
      tillräcklig försörjning. Det betyder att den sökande ska ha tillräckligt med pengar för att hen
      och hens familj ska kunna bo och leva i Finland. Också när en person kommer till Finland för att
      arbeta måste hen intyga att arbetet ger tillräckligt med lön och att hen kan leva på sin lön.
    sentences:
    - id: hb-c12-u0142-s001
      start: 0
      end: 116
    - id: hb-c12-u0142-s002
      start: 117
      end: 236
    - id: hb-c12-u0142-s003
      start: 237
      end: 378
  - type: paragraph
    id: hb-c12-u0143
    text: Innan du kan få ett uppehållstillstånd måste du hitta ett jobb i Finland. När du har hittat
      ett jobb kan du ansöka om uppehållstillstånd. För att kunna arbeta i Finland behöver du vanligen
      antingen ett uppehållstillstånd för arbetstagare eller något annat av uppehållstillstånd för förvärvsarbete.
      Arten av det arbete du ska utföra påverkar typen av tillstånd.
    sentences:
    - id: hb-c12-u0143-s001
      start: 0
      end: 73
    - id: hb-c12-u0143-s002
      start: 74
      end: 137
    - id: hb-c12-u0143-s003
      start: 138
      end: 297
    - id: hb-c12-u0143-s004
      start: 298
      end: 360
  - type: paragraph
    id: hb-c12-u0144
    text: Uppehållstillståndet för en arbetstagare kan vara förbundet med tillgångsprövning. Det betyder
      att arbetsgivaren måste utreda om man inom rimlig tid kan få arbetskraft till en uppgift från Finland
      eller EU/EES-området. Migrationsverket beslutar om du ska beviljas uppehållstillstånd eller inte.
    sentences:
    - id: hb-c12-u0144-s001
      start: 0
      end: 82
    - id: hb-c12-u0144-s002
      start: 83
      end: 218
    - id: hb-c12-u0144-s003
      start: 219
      end: 294
  - type: paragraph
    id: hb-c12-u0145
    text: Om du redan har uppehållstillstånd i Finland utifrån en annan grund, till exempel familjeband,
      kan du ha rätt att arbeta i Finland. Då behöver du inte ett separat uppehållstillstånd för att arbeta.
      Du kan kontrollera om du har rätt att arbeta i Finland från ditt uppehållstillståndskort eller beslut
      om uppehållstillstånd.
    sentences:
    - id: hb-c12-u0145-s001
      start: 0
      end: 131
    - id: hb-c12-u0145-s002
      start: 132
      end: 197
    - id: hb-c12-u0145-s003
      start: 198
      end: 322
  - type: paragraph
    id: hb-c12-u0146
    text: Så länge handläggningen av din första ansökan om uppehållstillstånd pågår har du vanligtvis
      inte rätt att arbeta. Du hittar information om rätten att arbeta på Migrationsverkets ansökningssida.
    sentences:
    - id: hb-c12-u0146-s001
      start: 0
      end: 113
    - id: hb-c12-u0146-s002
      start: 114
      end: 193
  - type: paragraph
    id: hb-c12-u0147
    text: Din företagsverksamhet ska vara lönsam och dina inkomster från företagsverksamheten måste ge
      dig en tryggad försörjning. Om ditt företag är ett uppstartsföretag som inte ännu har omsättning,
      kan du bevisa en tillräcklig utkomst med övriga inkomster.
    sentences:
    - id: hb-c12-u0147-s001
      start: 0
      end: 120
    - id: hb-c12-u0147-s002
      start: 121
      end: 249
  - type: paragraph
    id: hb-c12-u0148
    text: Uppehållstillstånd beviljas inte på grund av att du äger ett företag. Du behöver jobba i ditt
      företag i Finland för att kunna få ett uppehållstillstånd.
    sentences:
    - id: hb-c12-u0148-s001
      start: 0
      end: 69
    - id: hb-c12-u0148-s002
      start: 70
      end: 152
  - type: paragraph
    id: hb-c12-u0149
    text: Innan du kan ansöka om uppehållstillstånd måste du skaffa dig en studieplats i Finland. Godkända
      läroanstalter är läroanstalter efter grundskolan, till exempel universitet, högskolor och yrkesläroanstalter.
    sentences:
    - id: hb-c12-u0149-s001
      start: 0
      end: 87
    - id: hb-c12-u0149-s002
      start: 88
      end: 206
  - type: paragraph
    id: hb-c12-u0150
    text: 'Studieplatsen ska uppfylla ett av följande villkor:'
    sentences:
    - id: hb-c12-u0150-s001
      start: 0
      end: 51
  - id: hb-c12-u0152
    type: list
    ordered: false
    items:
    - id: hb-c12-u0151
      text: studierna leder till yrke eller examen
      sentences:
      - id: hb-c12-u0151-s001
        start: 0
        end: 38
    - id: hb-c12-u0153
      text: du deltar i ett utbytesprogram mellan läroanstalter eller något annat utbytesprogram
      sentences:
      - id: hb-c12-u0153-s001
        start: 0
        end: 84
    - id: hb-c12-u0154
      text: du avlägger en kompletterande utbildning eller en specialutbildning som hör till din examen.
      sentences:
      - id: hb-c12-u0154-s001
        start: 0
        end: 92
  - type: paragraph
    id: hb-c12-u0155
    text: Uppehållstillstånd för studerande beviljas vanligen för studietiden. Om du kommer till Finland
      för att avlägga en fullständig högskoleexamen beviljas du ett A-tillstånd, dvs. ett kontinuerligt
      uppehållstillstånd. Annars får du ett B-tillstånd, dvs. ett tillfälligt uppehållstillstånd.
    sentences:
    - id: hb-c12-u0155-s001
      start: 0
      end: 68
    - id: hb-c12-u0155-s002
      start: 69
      end: 212
    - id: hb-c12-u0155-s003
      start: 213
      end: 284
  - type: paragraph
    id: hb-c12-u0156
    text: Alla familjemedlemmar kan inte få uppehållstillstånd. Tillstånd beviljas vanligen till maka/make,
      registrerad partner eller sambo till en person som är bosatt i Finland eller minderåriga, ogifta
      barn till en sådan person eller deras vårdnadshavare.
    sentences:
    - id: hb-c12-u0156-s001
      start: 0
      end: 53
    - id: hb-c12-u0156-s002
      start: 54
      end: 248
  - type: paragraph
    id: hb-c12-u0157
    text: Om din familjemedlem bor i Finland och du vill flytta till denna person, behöver du ett uppehållstillstånd
      på grund av familjeband. Ofta krävs det även att du själv eller den person bosatt i Finland som
      ansöker om familjeförening har tillräckliga medel för den egna och familjens försörjning. Dessa
      medel kan till exempel vara lön, inkomster från företagsverksamhet, förmögenhet eller pension.
    sentences:
    - id: hb-c12-u0157-s001
      start: 0
      end: 131
    - id: hb-c12-u0157-s002
      start: 132
      end: 292
    - id: hb-c12-u0157-s003
      start: 293
      end: 393
  - type: paragraph
    id: hb-c12-u0158
    text: Om du är familjemedlem till en finsk medborgare, behöver din försörjning inte vara tryggad.
      Du har obegränsad rätt att arbeta. Du får börja arbeta först när du har fått ett uppehållstillstånd.
    sentences:
    - id: hb-c12-u0158-s001
      start: 0
      end: 91
    - id: hb-c12-u0158-s002
      start: 92
      end: 126
    - id: hb-c12-u0158-s003
      start: 127
      end: 192
  - type: paragraph
    id: hb-c12-u0159
    text: Om du är av finländsk härkomst eller har en nära kontakt med Finland kan du beviljas uppehållstillstånd
      i Finland på grund av detta. Då är du återflyttare (paluumuuttaja). Huruvida du beviljas uppehållstillstånd
      beror på hur starka och nära släktband du har till Finland. För att få tillståndet krävs inga andra
      skäl, som till exempel arbete eller studier.
    sentences:
    - id: hb-c12-u0159-s001
      start: 0
      end: 132
    - id: hb-c12-u0159-s002
      start: 133
      end: 171
    - id: hb-c12-u0159-s003
      start: 172
      end: 271
    - id: hb-c12-u0159-s004
      start: 272
      end: 356
  - type: paragraph
    id: hb-c12-u0160
    text: Personer som aldrig själv har varit finska medborgare men vars ena förälder eller mor- eller
      farförälder är eller har varit infödd finsk medborgare betraktas som återflyttare (paluumuuttaja)
      av finsk härkomst. Också före detta finska medborgare räknas som återflyttare.
    sentences:
    - id: hb-c12-u0160-s001
      start: 0
      end: 209
    - id: hb-c12-u0160-s002
      start: 210
      end: 269
- id: hb-c12-tillstandstyper
  title: Tillståndstyper och fortsatt vistelse
  blocks:
  - type: paragraph
    id: hb-c12-u0161
    text: Det finns olika typer av uppehållstillstånd. Ett tillstånd kan vara tidsbegränsat eller permanent.
    sentences:
    - id: hb-c12-u0161-s001
      start: 0
      end: 44
    - id: hb-c12-u0161-s002
      start: 45
      end: 98
  - type: paragraph
    id: hb-c12-u0162
    text: 'Det första uppehållstillståndet är alltid tidsbegränsat. Tidsbegränsat tillstånd betyder att
      det gäller för en viss tid, till exempel ett år. Det finns två typer av tidsbegränsade tillstånd:
      kontinuerligt tillstånd, med bokstavskoden A på uppehållstillståndskortet, och tillfälligt tillstånd,
      med bokstavskoden B på uppehållstillståndskortet.'
    sentences:
    - id: hb-c12-u0162-s001
      start: 0
      end: 56
    - id: hb-c12-u0162-s002
      start: 57
      end: 141
    - id: hb-c12-u0162-s003
      start: 142
      end: 342
  - type: paragraph
    id: hb-c12-u0163
    text: Utgångspunkten är att man får kontinuerligt uppehållstillstånd om flytten till Finland betraktas
      som permanent. Då får personen en hemkommun i Finland. I vissa fall kan man få en hemkommun också
      med ett tillfälligt uppehållstillstånd.
    sentences:
    - id: hb-c12-u0163-s001
      start: 0
      end: 111
    - id: hb-c12-u0163-s002
      start: 112
      end: 151
    - id: hb-c12-u0163-s003
      start: 152
      end: 234
  - type: paragraph
    id: hb-c12-u0164
    text: En person kan få permanent uppehållstillstånd, som anges med bokstavskoden P på uppehållstillståndskortet,
      när hen har bott tillräckligt länge i Finland med ett kontinuerligt uppehållstillstånd. I allmänhet
      är grunden densamma som grunden för det föregående, kontinuerliga uppehållstillståndet, till exempel
      familjeband eller arbete. Grunden ska fortfarande gälla. Man kan ansöka om permanent tillstånd också
      på en ny grund.
    sentences:
    - id: hb-c12-u0164-s001
      start: 0
      end: 194
    - id: hb-c12-u0164-s002
      start: 195
      end: 333
    - id: hb-c12-u0164-s003
      start: 334
      end: 364
    - id: hb-c12-u0164-s004
      start: 365
      end: 424
  - type: paragraph
    id: hb-c12-u0165
    text: Om giltighetstiden för ditt uppehållstillstånd snart går ut och du vill förlänga din vistelse
      i Finland behöver du ett nytt uppehållstillstånd. Det är viktigt att du ansöker om fortsatt tillstånd
      innan ditt tidigare uppehållstillstånd går ut. Du kan endast ansöka om fortsatt tillstånd om du
      befinner dig i Finland.
    sentences:
    - id: hb-c12-u0165-s001
      start: 0
      end: 143
    - id: hb-c12-u0165-s002
      start: 144
      end: 242
    - id: hb-c12-u0165-s003
      start: 243
      end: 315
  - type: paragraph
    id: hb-c12-u0166
    text: Om ditt tidigare uppehållstillstånd går ut under behandlingen av din ansökan får du uppehålla
      dig i Finland och vanligtvis har du även rätt att arbeta under den tid som ansökan behandlas. Du
      kan få ett negativt beslut om du ansöker om fortsatt tillstånd först efter att ditt föregående uppehållstillstånd
      gått ut.
    sentences:
    - id: hb-c12-u0166-s001
      start: 0
      end: 187
    - id: hb-c12-u0166-s002
      start: 188
      end: 313
  - type: paragraph
    id: hb-c12-u0167
    text: Migrationsverket (Maahanmuuttovirasto) beviljar dig fortsatt tillstånd om grunden för det tidigare
      uppehållstillståndet fortfarande existerar. Du kan även ansöka om fortsatt tillstånd på någon annan
      grund än det första tillståndet. Kom ihåg att du måste uppfylla villkoren för det aktuella uppehållstillståndet.
    sentences:
    - id: hb-c12-u0167-s001
      start: 0
      end: 142
    - id: hb-c12-u0167-s002
      start: 143
      end: 231
    - id: hb-c12-u0167-s003
      start: 232
      end: 311
  - type: paragraph
    id: hb-c12-u0168
    text: Observera att ändringar i din livssituation också kan påverka ditt uppehållstillstånd. Ett tidsbegränsat
      uppehållstillstånd kan återkallas om de grunder på vilka tillståndet beviljades inte längre gäller.
    sentences:
    - id: hb-c12-u0168-s001
      start: 0
      end: 86
    - id: hb-c12-u0168-s002
      start: 87
      end: 204
  - type: paragraph
    id: hb-c12-u0169
    text: Om du har ett tillfälligt uppehållstillstånd (A- eller B-tillstånd) och orsaken för din vistelse
      i Finland ändras måste du ansöka om ett nytt uppehållstillstånd på den nya grunden. Om du har ett
      permanent uppehållstillstånd (P) i Finland behöver du inte ändra grunden för ditt uppehållstillstånd
      även om orsaken till din vistelse ändras.
    sentences:
    - id: hb-c12-u0169-s001
      start: 0
      end: 180
    - id: hb-c12-u0169-s002
      start: 181
      end: 337
  - type: paragraph
    id: hb-c12-u0170
    text: Det är bra att komma ihåg att grunden för uppehållstillståndet kan påverka vilka rättigheter
      du har i Finland. Till exempel ger ett uppehållstillstånd på grund av familjeband mer omfattande
      rätt att arbeta än ett tillstånd som beviljats på grund av studier.
    sentences:
    - id: hb-c12-u0170-s001
      start: 0
      end: 110
    - id: hb-c12-u0170-s002
      start: 111
      end: 257
  - type: paragraph
    id: hb-c12-u0171
    text: Ett permanent uppehållstillstånd gäller tills vidare. Tillståndet kan dock dras tillbaka om
      du lämnar Finland permanent, uppehåller dig utomlands kontinuerligt i minst två år eller har lämnat
      felaktiga uppgifter då du ansökt om tillståndet.
    sentences:
    - id: hb-c12-u0171-s001
      start: 0
      end: 53
    - id: hb-c12-u0171-s002
      start: 54
      end: 240
- id: hb-c12-asyl
  title: Asyl och internationellt skydd
  blocks:
  - type: paragraph
    id: hb-c12-u0172
    text: I allmänhet måste man ansöka om uppehållstillstånd innan man flyttar till Finland. Ett undantag
      är ändå ansökan om asyl, eftersom man kan ansöka om asyl endast i Finland. Om en person beviljas
      asyl, får hen uppehållstillstånd på basis av sin flyktingstatus. Med en asylansökan kan man också
      få uppehållstillstånd på grund av alternativt skydd eller till exempel individuella mänskliga orsaker.
    sentences:
    - id: hb-c12-u0172-s001
      start: 0
      end: 82
    - id: hb-c12-u0172-s002
      start: 83
      end: 170
    - id: hb-c12-u0172-s003
      start: 171
      end: 257
    - id: hb-c12-u0172-s004
      start: 258
      end: 393
  - type: paragraph
    id: hb-c12-u0173
    text: Med internationellt skydd avses i Finland flyktingstatus eller status som alternativt skyddsbehövande.
      I utlänningslagen finns bestämmelser om grunderna och förfarandena enligt vilka internationellt
      skydd ges.
    sentences:
    - id: hb-c12-u0173-s001
      start: 0
      end: 102
    - id: hb-c12-u0173-s002
      start: 103
      end: 209
  - type: paragraph
    id: hb-c12-u0174
    text: Man kan ansöka om internationellt skydd genom att lämna in en asylansökan. Migrationsverket
      utreder om en person har rätt till asyl. Om förutsättningarna för att få asyl uppfylls, beviljas
      personen uppehållstillstånd på grund av flyktingstatus. Om förutsättningarna för att få asyl inte
      uppfylls, utreder man om personen har rätt till skydd i Finland enligt principen om alternativt
      skydd.
    sentences:
    - id: hb-c12-u0174-s001
      start: 0
      end: 74
    - id: hb-c12-u0174-s002
      start: 75
      end: 132
    - id: hb-c12-u0174-s003
      start: 133
      end: 244
    - id: hb-c12-u0174-s004
      start: 245
      end: 389
  - type: paragraph
    id: hb-c12-u0175
    text: En person kan få alternativt skydd om hen löper risk att utsättas för någon annan verklig och
      allvarlig fara än den förföljelse som ligger till grund för asyl. En orsak till det kan vara hot
      om dödsstraff eller tortyr. En orsak kan också vara att personen utsätts för en allvarlig och personlig
      fara på grund av en väpnad konflikt.
    sentences:
    - id: hb-c12-u0175-s001
      start: 0
      end: 159
    - id: hb-c12-u0175-s002
      start: 160
      end: 218
    - id: hb-c12-u0175-s003
      start: 219
      end: 331
  - type: paragraph
    id: hb-c12-u0176
    text: Du kan söka asyl i Finland om du har välgrundad fruktan för förföljelse i ditt hemland. Orsaker
      till förföljelse kan vara etniskt ursprung, religion, medborgarskap, tillhörighet till en viss grupp
      i samhället eller politiska åsikter.
    sentences:
    - id: hb-c12-u0176-s001
      start: 0
      end: 87
    - id: hb-c12-u0176-s002
      start: 88
      end: 233
  - type: paragraph
    id: hb-c12-u0177
    text: När myndigheten har mottagit din asylansökan, hänvisas du till ett mottagningscenter. Där kan
      du bo under tiden då Migrationsverket behandlar din ansökan. Du kan även bo någon annanstans, men
      då måste du själv bekosta boendet.
    sentences:
    - id: hb-c12-u0177-s001
      start: 0
      end: 85
    - id: hb-c12-u0177-s002
      start: 86
      end: 154
    - id: hb-c12-u0177-s003
      start: 155
      end: 226
  - type: paragraph
    id: hb-c12-u0178
    text: I vissa situationer kan gränsmyndigheten lämna över din asylansökan till gränsförfarandet. För
      detta måste det alltid finnas en laglig grund. Gränsförfarandet(rajamenettely) innebär att Migrationsverket
      behandlar ansökan vid ett påskyndat förfarande eller fattar beslut om att avvisa ansökan utan prövning.
      I utlänningslagen (ulkomaalaislaki) definieras i vilka situationer Migrationsverket kan göra så.
    sentences:
    - id: hb-c12-u0178-s001
      start: 0
      end: 90
    - id: hb-c12-u0178-s002
      start: 91
      end: 141
    - id: hb-c12-u0178-s003
      start: 142
      end: 306
    - id: hb-c12-u0178-s004
      start: 307
      end: 403
  - type: paragraph
    id: hb-c12-u0179
    text: Gränsmyndigheten hänvisar dig till ett mottagningscenter. Du måste bo där under den tid som
      gränsförfarandet pågår. Du får inte lämna mottagningscentrets område utan tillstånd. Vid gränsförfarandet
      har du samma rätt till rådgivning och juridisk hjälp som andra asylsökanden.
    sentences:
    - id: hb-c12-u0179-s001
      start: 0
      end: 57
    - id: hb-c12-u0179-s002
      start: 58
      end: 115
    - id: hb-c12-u0179-s003
      start: 116
      end: 176
    - id: hb-c12-u0179-s004
      start: 177
      end: 274
  - type: paragraph
    id: hb-c12-u0180
    text: Om du är under 18 år gammal och kommer till Finland som asylsökande utan vårdnadshavare, förordnas
      du ett ombud. Ombudet är en pålitlig vuxen person som hjälper dig med olika ärenden under tiden
      då Migrationsverket behandlar din ansökan. Ombudet följer med dig när du ska prata med myndigheter.
      Dessutom utreder ditt ombud om du kan återförenas med din familj. Du har rätt till boende, mat och
      hälsovård. Du har även rätt att gå i skola.
    sentences:
    - id: hb-c12-u0180-s001
      start: 0
      end: 112
    - id: hb-c12-u0180-s002
      start: 113
      end: 237
    - id: hb-c12-u0180-s003
      start: 238
      end: 294
    - id: hb-c12-u0180-s004
      start: 295
      end: 360
    - id: hb-c12-u0180-s005
      start: 361
      end: 404
    - id: hb-c12-u0180-s006
      start: 405
      end: 437
  - type: paragraph
    id: hb-c12-u0181
    text: Migrationsverket handlägger din ansökan och fattar ett beslut. Migrationsverket utreder din
      identitet och resväg till Finland och bedömer om du kan beviljas asyl i Finland.
    sentences:
    - id: hb-c12-u0181-s001
      start: 0
      end: 62
    - id: hb-c12-u0181-s002
      start: 63
      end: 172
  - type: paragraph
    id: hb-c12-u0182
    text: Det är vanligt att behandlingen av ansökan tar flera månader. När du har sökt asyl har du rätt
      att vistas i Finland medan din ansökan behandlas. Under denna tid kan du inte resa utomlands. Om
      du reser kan myndigheterna besluta att din ansökan inte längre gäller.
    sentences:
    - id: hb-c12-u0182-s001
      start: 0
      end: 61
    - id: hb-c12-u0182-s002
      start: 62
      end: 144
    - id: hb-c12-u0182-s003
      start: 145
      end: 188
    - id: hb-c12-u0182-s004
      start: 189
      end: 262
  - type: paragraph
    id: hb-c12-u0183
    text: Som asylsökande har du rätt att använda ett rättsbiträde under samtalet. Biträdet deltar i asylsamtalet
      efter sitt eget omdöme.
    sentences:
    - id: hb-c12-u0183-s001
      start: 0
      end: 72
    - id: hb-c12-u0183-s002
      start: 73
      end: 127
  - type: paragraph
    id: hb-c12-u0184
    text: Under tiden då din ansökan behandlas kan du få rådgivning och rättshjälp vid den offentliga
      rättshjälpsbyrån. Kontakta rättshjälpsbyrån om du vill ha ett rättsbiträde. Vid behov hjälper mottagningscentret
      dig. Rättshjälpsbyrån (oikeusaputoimisto) kan även hänvisa dig till en privat jurist eller en privat
      juristbyrå.
    sentences:
    - id: hb-c12-u0184-s001
      start: 0
      end: 109
    - id: hb-c12-u0184-s002
      start: 110
      end: 167
    - id: hb-c12-u0184-s003
      start: 168
      end: 209
    - id: hb-c12-u0184-s004
      start: 210
      end: 317
  - type: paragraph
    id: hb-c12-u0185
    text: Du kan även få rådgivning hos Flyktingrådgivningen rf (Pakolaisneuvonta ry). Flyktingrådgivningen
      ger rådgivning även till personer som vistas i Finland utan uppehållstillstånd.
    sentences:
    - id: hb-c12-u0185-s001
      start: 0
      end: 76
    - id: hb-c12-u0185-s002
      start: 77
      end: 177
  - type: paragraph
    id: hb-c12-u0186
    text: Asylsökande har inte rätt till den sociala tryggheten i Finland. Det innebär att du inte kan
      få FPA:s förmåner.
    sentences:
    - id: hb-c12-u0186-s001
      start: 0
      end: 64
    - id: hb-c12-u0186-s002
      start: 65
      end: 111
  - type: paragraph
    id: hb-c12-u0187
    text: Förläggningen betalar ut mottagningspenning till dig. Den betalas under den tid då din asylansökan
      behandlas. Mottagningspenningen är ett litet belopp avsett för nödvändiga utgifter.
    sentences:
    - id: hb-c12-u0187-s001
      start: 0
      end: 53
    - id: hb-c12-u0187-s002
      start: 54
      end: 109
    - id: hb-c12-u0187-s003
      start: 110
      end: 182
- id: hb-c12-kvotflyktingar
  title: Kvotflyktingar
  blocks:
  - type: paragraph
    id: hb-c12-u0188
    text: Dessutom tar Finland varje år emot ett visst antal flyktingar som FN:s flyktingorgan UNHCR har
      erkänt som flyktingar. Detta antal kallas för flyktingkvot.
    sentences:
    - id: hb-c12-u0188-s001
      start: 0
      end: 117
    - id: hb-c12-u0188-s002
      start: 118
      end: 154
  - type: paragraph
    id: hb-c12-u0189
    text: Man kan inte ansöka om att bli kvotflykting via myndigheterna i Finland. Man kan inte heller
      föreslå en annan person, till exempel en släkting eller vän, som kvotflykting.
    sentences:
    - id: hb-c12-u0189-s001
      start: 0
      end: 72
    - id: hb-c12-u0189-s002
      start: 73
      end: 171
  - type: paragraph
    id: hb-c12-u0190
    text: Finland tar som kvotflyktingar emot personer som har flyktingstatus enligt Förenta nationernas
      flyktingorganisation UNHCR. Kvotflyktingarna väljs bland de personer som UNHCR föreslår till Finland.
      De finländska myndigheterna intervjuar dessa flyktingar. Utgående från intervjuerna väljer man de
      flyktingar som tas emot till Finland. Intervjuerna görs i de länder där flyktingarna vistas, vanligen
      i flyktingläger eller i UNHCR:s lokaler.
    sentences:
    - id: hb-c12-u0190-s001
      start: 0
      end: 122
    - id: hb-c12-u0190-s002
      start: 123
      end: 196
    - id: hb-c12-u0190-s003
      start: 197
      end: 253
    - id: hb-c12-u0190-s004
      start: 254
      end: 332
    - id: hb-c12-u0190-s005
      start: 333
      end: 437
  - type: paragraph
    id: hb-c12-u0191
    text: Riksdagen i Finland bestämmer hur många flyktingar som tas emot i landet. År 2025 är Finlands
      flyktingkvot 500 personer. Inrikesministeriet bestämmer tillsammans med utrikesministeriet och arbets-
      och näringsministeriet från vilka länder kvotflyktingar tas emot.
    sentences:
    - id: hb-c12-u0191-s001
      start: 0
      end: 73
    - id: hb-c12-u0191-s002
      start: 74
      end: 120
    - id: hb-c12-u0191-s003
      start: 121
      end: 262
  - type: paragraph
    id: hb-c12-u0192
    text: Kommunen och välfärdsområdet ordnar nödvändiga lokala tjänster för kvotflyktingarna. Kvotflyktingarna
      får exempelvis rådgivning och vägledning, integrationstjänster samt social- och hälsovårdstjänster.
    sentences:
    - id: hb-c12-u0192-s001
      start: 0
      end: 84
    - id: hb-c12-u0192-s002
      start: 85
      end: 201
  - type: paragraph
    id: hb-c12-u0193
    text: Dessutom är Finlands Röda Kors (FRK) frivilliga involverade i mottagningen av flyktingar i kommunerna
      och ger stöd för integrationen. De ordnar bland annat gemensamma aktiviteter, hjälper till med boendeärenden
      och ordnar vänverksamhet.
    sentences:
    - id: hb-c12-u0193-s001
      start: 0
      end: 133
    - id: hb-c12-u0193-s002
      start: 134
      end: 236
  - type: paragraph
    id: hb-c12-u0194
    text: Flyktingar kan be om hjälp och rådgivning i rättsliga frågor bland annat hos Flyktingrådgivningen
      rf eller hos rättshjälpsbyråerna.
    sentences:
    - id: hb-c12-u0194-s001
      start: 0
      end: 131
- id: hb-c12-tillfalligt-skydd
  title: Tillfälligt skydd
  blocks:
  - type: paragraph
    id: hb-c12-u0195
    text: Tillfälligt skydd kan ges i situationer där ett stort antal människor har varit tvungna att
      fly samtidigt till följd av till exempel krig. Tillfälligt skydd har i Finland beviljats personer
      som flytt kriget i Ukraina, som startade år 2022. Beviljande av tillfälligt skydd gör det möjligt
      att erbjuda ett begränsat antal människor skydd genom en snabb process som är enklare än asylförfarandet.
      Det har ursprungligen reglerats på EU-nivå.
    sentences:
    - id: hb-c12-u0195-s001
      start: 0
      end: 138
    - id: hb-c12-u0195-s002
      start: 139
      end: 239
    - id: hb-c12-u0195-s003
      start: 240
      end: 393
    - id: hb-c12-u0195-s004
      start: 394
      end: 437
  - type: paragraph
    id: hb-c12-u0196
    text: Du kan få uppehållstillstånd på grund av tillfälligt skydd om du är
    sentences:
    - id: hb-c12-u0196-s001
      start: 0
      end: 67
  - id: hb-c12-u0198
    type: list
    ordered: false
    items:
    - id: hb-c12-u0197
      text: ukrainsk medborgare och inte kan återvända till Ukraina på grund av det ryska anfallet
      sentences:
      - id: hb-c12-u0197-s001
        start: 0
        end: 86
    - id: hb-c12-u0199
      text: medborgare i ett land utanför EU och har fått internationellt skydd i Ukraina eller bott i
        Ukraina med ett permanent uppehållstillstånd, och inte kan återvända till ditt hemland
      sentences:
      - id: hb-c12-u0199-s001
        start: 0
        end: 177
    - id: hb-c12-u0200
      text: familjemedlem till ovan nämnda personer, om familjebandet bildades i Ukraina före 24.2.2022.
      sentences:
      - id: hb-c12-u0200-s001
        start: 0
        end: 92
  - type: paragraph
    id: hb-c12-u0201
    text: I övriga fall ska du kontrollera på Migrationsverkets webbplats om du har rätt att få tillfälligt
      skydd i Finland.
    sentences:
    - id: hb-c12-u0201-s001
      start: 0
      end: 114
  - type: paragraph
    id: hb-c12-u0202
    text: När du har ansökt om tillfälligt skydd kan du bo i ett mottagningscenter och få mottagningscentrets
      tjänster. Du har rätt att ta emot mottagningstjänster även efter att du har beviljats uppehållstillstånd
      på grund av tillfälligt skydd.
    sentences:
    - id: hb-c12-u0202-s001
      start: 0
      end: 109
    - id: hb-c12-u0202-s002
      start: 110
      end: 235
  - type: paragraph
    id: hb-c12-u0203
    text: Du har rätt att arbeta och studera i Finland omedelbart efter att du har ansökt om tillfälligt
      skydd. Du får arbeta utan några begränsningar, alltså i vilken bransch som helst. När du har fått
      uppehållstillstånd har du också rätt att ta del av tjänsterna för arbetslösa vid sysselsättningstjänsterna
      (työllisyyspalvelut) i din kommun.
    sentences:
    - id: hb-c12-u0203-s001
      start: 0
      end: 101
    - id: hb-c12-u0203-s002
      start: 102
      end: 176
    - id: hb-c12-u0203-s003
      start: 177
      end: 334
  - type: paragraph
    id: hb-c12-u0204
    text: Du kan få rätt till FPA:s förmåner om du arbetar i Finland eller har bott i Finland minst ett
      år. Före detta har du rätt till mottagningscentrets tjänster. Du kan få mottagningspenning om dina
      eller dina familjemedlemmars inkomster och tillgångar inte räcker till den nödvändiga försörjningen,
      såsom mat och kläder.
    sentences:
    - id: hb-c12-u0204-s001
      start: 0
      end: 97
    - id: hb-c12-u0204-s002
      start: 98
      end: 155
    - id: hb-c12-u0204-s003
      start: 156
      end: 315
- id: hb-c12-familjeband
  title: Ändrade familjeband och skydd vid utnyttjande
  blocks:
  - type: paragraph
    id: hb-c12-u0205
    text: Om du har ett tidsbestämt uppehållstillstånd med familjeband som grund kan det faktum att äktenskapet
      eller det registrerade parförhållandet upphör påverka uppehållstillståndet. Också familjemedlemmens
      bortgång kan påverka uppehållstillståndet, om denna familjemedlem var den person som ansökte om
      familjeförening i Finland.
    sentences:
    - id: hb-c12-u0205-s001
      start: 0
      end: 177
    - id: hb-c12-u0205-s002
      start: 178
      end: 324
  - type: paragraph
    id: hb-c12-u0206
    text: Om familjebandet inte längre existerar kan det hända att uppehållstillståndet inte förlängs.
      Det är även möjligt att ett existerande tillstånd upphävs.
    sentences:
    - id: hb-c12-u0206-s001
      start: 0
      end: 92
    - id: hb-c12-u0206-s002
      start: 93
      end: 151
  - type: paragraph
    id: hb-c12-u0207
    text: 'Uppehållstillståndet kan dock förlängas om det vore oskäligt att vägra det och du fortsättningsvis
      har starka band till Finland. Exempel på sådana är:'
    sentences:
    - id: hb-c12-u0207-s001
      start: 0
      end: 128
    - id: hb-c12-u0207-s002
      start: 129
      end: 150
  - id: hb-c12-u0209
    type: list
    ordered: false
    items:
    - id: hb-c12-u0208
      text: barn eller andra familjemedlemmar i Finland
      sentences:
      - id: hb-c12-u0208-s001
        start: 0
        end: 43
    - id: hb-c12-u0210
      text: arbetsplats eller eget företag i Finland
      sentences:
      - id: hb-c12-u0210-s001
        start: 0
        end: 40
    - id: hb-c12-u0211
      text: studieplats i Finland
      sentences:
      - id: hb-c12-u0211-s001
        start: 0
        end: 21
  - type: paragraph
    id: hb-c12-u0212
    text: Om du skiljer dig från din make/maka eftersom han/hon varit våldsam mot dig eller ditt barn,
      kan ditt uppehållstillstånd förlängas trots skilsmässan. Du ska lämna in en redovisning, exempelvis
      läkarintyg eller utlåtande från familjerådgivning. Bifoga även till ansökan om uppehållstillstånd
      din egen redovisning av situationen.
    sentences:
    - id: hb-c12-u0212-s001
      start: 0
      end: 149
    - id: hb-c12-u0212-s002
      start: 150
      end: 243
    - id: hb-c12-u0212-s003
      start: 244
      end: 327
  - type: paragraph
    id: hb-c12-u0213
    text: Om du redan har uppehållstillstånd i Finland och du har fallit offer för arbetsgivarens utnyttjande,
      kan du ansöka om fortsatt tillstånd eller intyg om utvidgad rätt att arbeta på grund av arbetsgivarens
      utnyttjande. Ansök om fortsatt tillstånd på grund av arbetsgivarens utnyttjande, om ditt nuvarande
      uppehållstillstånd ska utgå och du inte har en ny arbetsgivare. Ansök om intyg på grund av arbetsgivarens
      utnyttjande om du har ett giltigt uppehållstillstånd och en ny arbetsgivare. Med hjälp av intyget
      eller det fortsatta tillståndet kan du arbeta inom vilken bransch som helst.
    sentences:
    - id: hb-c12-u0213-s001
      start: 0
      end: 216
    - id: hb-c12-u0213-s002
      start: 217
      end: 366
    - id: hb-c12-u0213-s003
      start: 367
      end: 485
    - id: hb-c12-u0213-s004
      start: 486
      end: 583
  - type: paragraph
    id: hb-c12-u0214
    text: Om du har blivit offer för människohandel eller om det finns motiverade skäl att misstänka det,
      kan du beviljas uppehållstillstånd i Finland. Du måste vara i Finland för att kunna ansöka om uppehållstillstånd
      som människohandelns offer. Om du är i en speciellt sårbar ställning, kan du få ett kontinuerligt
      uppehållstillstånd.
    sentences:
    - id: hb-c12-u0214-s001
      start: 0
      end: 141
    - id: hb-c12-u0214-s002
      start: 142
      end: 236
    - id: hb-c12-u0214-s003
      start: 237
      end: 326
- id: hb-c12-beslut
  title: Negativa beslut, rättsskydd och återvändande
  blocks:
  - type: paragraph
    id: hb-c12-u0215
    text: Om du redan är i Finland och får ett negativt beslut om uppehållstillstånd från Migrationsverket
      (Maahanmuuttovirasto), måste du lämna Finland. För dig kan det också fattas ett beslut om avlägsnande
      ur landet (maastapoistamispäätös), vilket innebär att du avvisas eller utvisas från Finland.
    sentences:
    - id: hb-c12-u0215-s001
      start: 0
      end: 143
    - id: hb-c12-u0215-s002
      start: 144
      end: 291
  - type: paragraph
    id: hb-c12-u0216
    text: Du kan överklaga beslutet om du är missnöjd med det. Du kan avlägsnas ur Finland trots att du
      överklagar.
    sentences:
    - id: hb-c12-u0216-s001
      start: 0
      end: 52
    - id: hb-c12-u0216-s002
      start: 53
      end: 105
  - type: paragraph
    id: hb-c12-u0217
    text: Du kan överklaga också om du har ansökt om uppehållstillstånd utomlands. Då måste du vänta på
      behandlingen av besvären utomlands.
    sentences:
    - id: hb-c12-u0217-s001
      start: 0
      end: 72
    - id: hb-c12-u0217-s002
      start: 73
      end: 129
  - type: paragraph
    id: hb-c12-u0218
    text: En besvärsanvisning om hur beslutet får överklagas bifogas alltid beslutet. Besvären behandlas
      av förvaltningsdomstolen (hallinto-oikeus). Förvaltningsdomstolen kan antingen avslå besvären eller
      sända ärendet till Migrationsverket för ny behandling. Avslag innebär att Migrationsverkets beslut
      förblir gällande.
    sentences:
    - id: hb-c12-u0218-s001
      start: 0
      end: 75
    - id: hb-c12-u0218-s002
      start: 76
      end: 138
    - id: hb-c12-u0218-s003
      start: 139
      end: 249
    - id: hb-c12-u0218-s004
      start: 250
      end: 311
  - type: paragraph
    id: hb-c12-u0219
    text: Om förvaltningsdomstolen avslår besvären kan du i vissa fall ansöka om besvärstillstånd hos
      högsta förvaltningsdomstolen (korkein hallinto-oikeus). Om högsta förvaltningsdomstolen beviljar
      besvärstillstånd, behandlar den besvären.
    sentences:
    - id: hb-c12-u0219-s001
      start: 0
      end: 147
    - id: hb-c12-u0219-s002
      start: 148
      end: 230
  - type: paragraph
    id: hb-c12-u0220
    text: Du kan få hjälp med att överklaga av antingen en privat jurist, en statlig rättshjälpsbyrå (valtion
      oikeusaputoimisto) eller Flyktingrådgivningen rf (Pakolaisneuvonta) (endast asylsökande).
    sentences:
    - id: hb-c12-u0220-s001
      start: 0
      end: 189
  - type: paragraph
    id: hb-c12-u0221
    text: Om du får avslag på din ansökan om uppehållstillstånd eller om förvaltningsrätten avslår ditt
      överklagande, måste du lämna Finland. Du ges möjlighet att lämna landet frivilligt. Tidsfristen
      är vanligtvis 30 dagar eller så kan du avlägsnas ur landet genast. Du ser den exakta tidsfristen
      i beslutsdokumentet som du får från Migrationsverket.
    sentences:
    - id: hb-c12-u0221-s001
      start: 0
      end: 131
    - id: hb-c12-u0221-s002
      start: 132
      end: 177
    - id: hb-c12-u0221-s003
      start: 178
      end: 256
    - id: hb-c12-u0221-s004
      start: 257
      end: 340
  - type: paragraph
    id: hb-c12-u0222
    text: Om du inte lämnar landet inom tidsfristen, avlägsnar polisen eller gränsbevakningsväsendet dig
      ur landet.
    sentences:
    - id: hb-c12-u0222-s001
      start: 0
      end: 105
  - type: paragraph
    id: hb-c12-u0223
    text: Enligt lag kan du inte utvisas om du hotas av dödsstraff, tortyr, förföljelse eller någon annan
      behandling som är omänsklig eller kränker människovärdet i ditt hemland.
    sentences:
    - id: hb-c12-u0223-s001
      start: 0
      end: 168
  - type: paragraph
    id: hb-c12-u0224
    text: Vänligen observera att endast Migrationsverket kan fatta beslut om uppehållstillstånd.
    sentences:
    - id: hb-c12-u0224-s001
      start: 0
      end: 86
  - type: paragraph
    id: hb-c12-u0225
    text: När du flyttar utomlands från Finland ska du anmäla flytten till Myndigheten för digitalisering
      och befolkningsdata (Digi- ja väestötietovirasto). Du kan göra anmälan på internet eller med en
      blankett som du får vid postkontoret eller Myndigheten för digitalisering och befolkningsdatas serviceställe.
    sentences:
    - id: hb-c12-u0225-s001
      start: 0
      end: 146
    - id: hb-c12-u0225-s002
      start: 147
      end: 301
  - type: paragraph
    id: hb-c12-u0226
    text: När du flyttar utomlands måste du meddela detta till FPA, om du får FPA:s förmåner eller om
      du har det europeiska sjukvårdskortet.
    sentences:
    - id: hb-c12-u0226-s001
      start: 0
      end: 130
  - type: paragraph
    id: hb-c12-u0227
    text: När du är utomlands och har rätt till FPA:s förmåner ska du alltid anmäla ändringar i dina förhållanden
      till FPA. Till exempel ändrade familjeförhållanden eller att du börjar arbeta kan påverka din rätt
      till FPA:s förmåner.
    sentences:
    - id: hb-c12-u0227-s001
      start: 0
      end: 113
    - id: hb-c12-u0227-s002
      start: 114
      end: 223
  - type: paragraph
    id: hb-c12-u0228
    text: Om du vill återvända till ditt hemland, kan du i vissa fall få stöd för frivilligt återvändande.
      Stödet består antingen av pengar eller tjänster.
    sentences:
    - id: hb-c12-u0228-s001
      start: 0
      end: 96
    - id: hb-c12-u0228-s002
      start: 97
      end: 145
  - type: paragraph
    id: hb-c12-u0229
    text: Du kan få stöd för frivilligt återvändande om du är medborgare i ett land som inte är ett EU-land
      och
    sentences:
    - id: hb-c12-u0229-s001
      start: 0
      end: 101
  - id: hb-c12-u0231
    type: list
    ordered: false
    items:
    - id: hb-c12-u0230
      text: du har ansökt om asyl och fått avslag på din ansökan,
      sentences:
      - id: hb-c12-u0230-s001
        start: 0
        end: 53
    - id: hb-c12-u0232
      text: du har ansökt om asyl och dragit tillbaka din asylansökan eller
      sentences:
      - id: hb-c12-u0232-s001
        start: 0
        end: 63
    - id: hb-c12-u0233
      text: du har tidigare beviljats internationellt skydd, men det har upphört.
      sentences:
      - id: hb-c12-u0233-s001
        start: 0
        end: 69
- id: hb-c12-utan-tillstand
  title: Rättigheter utan uppehållstillstånd
  blocks:
  - type: paragraph
    id: hb-c12-u0234
    text: Om du behöver visum eller uppehållstillstånd för att vistas i Finland, men inte har det, kan
      din vistelse i Finland vara illegal.
    sentences:
    - id: hb-c12-u0234-s001
      start: 0
      end: 129
  - type: paragraph
    id: hb-c12-u0235
    text: Om du är asylsökande har du rätt att vistas i Finland utan visum eller uppehållstillstånd så
      länge som handläggningen av din asylansökan pågår.
    sentences:
    - id: hb-c12-u0235-s001
      start: 0
      end: 143
  - type: paragraph
    id: hb-c12-u0236
    text: 'Även om du skulle ha kommit lagligt till Finland kan din vistelse i landet senare bli olaglig.
      Detta kan hända till exempel i följande situationer:'
    sentences:
    - id: hb-c12-u0236-s001
      start: 0
      end: 94
    - id: hb-c12-u0236-s002
      start: 95
      end: 147
  - id: hb-c12-u0238
    type: list
    ordered: false
    items:
    - id: hb-c12-u0237
      text: du får ett negativt beslut på din ansökan om uppehållstillstånd eller asylansökan
      sentences:
      - id: hb-c12-u0237-s001
        start: 0
        end: 81
    - id: hb-c12-u0239
      text: ditt uppehållstillstånd går ut och du ansöker inte om fortsatt tillstånd i tid eller
      sentences:
      - id: hb-c12-u0239-s001
        start: 0
        end: 84
    - id: hb-c12-u0240
      text: du har rest in i landet med visum och ditt visum går ut eller
      sentences:
      - id: hb-c12-u0240-s001
        start: 0
        end: 61
    - id: hb-c12-u0241
      text: vistelsetiden utan visum har gått ut eller du inte längre har någon laglig grund för vistelsen.
      sentences:
      - id: hb-c12-u0241-s001
        start: 0
        end: 95
  - type: paragraph
    id: hb-c12-u0242
    text: Du har rätt till nödinkvartering och mathjälp om du inte har pengar till mat eller någonstans
      att övernatta. Kommuner, församlingar och vissa organisationer ordnar nödinkvartering.
    sentences:
    - id: hb-c12-u0242-s001
      start: 0
      end: 108
    - id: hb-c12-u0242-s002
      start: 109
      end: 180
  - type: paragraph
    id: hb-c12-u0243
    text: Du kan få juridisk rådgivning i frågor kring papperslöshet av en jurist vid Flyktingrådgivningen
      (Pakolaisneuvonta). Rådgivningen är kostnadsfri.
    sentences:
    - id: hb-c12-u0243-s001
      start: 0
      end: 116
    - id: hb-c12-u0243-s002
      start: 117
      end: 145
  - type: paragraph
    id: hb-c12-u0244
    text: Om du blir sjuk eller skadas, har du rätt till brådskande och nödvändig vård inom den offentliga
      hälso- och sjukvården, till exempel på en hälsostation eller ett sjukhus.
    sentences:
    - id: hb-c12-u0244-s001
      start: 0
      end: 170
  - type: paragraph
    id: hb-c12-u0245
    text: Offentliga hälsovårdstjänster ordnas av välfärdsområdena (hyvinvointialueet) runtom i Finland.
      Om du behöver hälso- och sjukvårdstjänster ska du kontakta den närmaste social- och hälsocentralen
      (sosiaali- ja terveyskeskus) på din hemort.
    sentences:
    - id: hb-c12-u0245-s001
      start: 0
      end: 94
    - id: hb-c12-u0245-s002
      start: 95
      end: 237
- id: hb-c12-medborgarskap
  title: Medborgarskapets innebörd och förvärv
  blocks:
  - type: paragraph
    id: hb-c12-u0246
    text: Du kan ansöka om finskt medborgarskap om du har bott i Finland tillräckligt länge och bland
      annat lärt dig ett lokalt språk. Du kan även få medborgarskapet av en förälder som är finsk medborgare.
    sentences:
    - id: hb-c12-u0246-s001
      start: 0
      end: 124
    - id: hb-c12-u0246-s002
      start: 125
      end: 195
  - type: paragraph
    id: hb-c12-u0247
    text: I vissa situationer kan man få medborgarskap även genom anmälan. I vissa undantagsfall kan man
      dessutom få medborgarskap på grundval av att man är född i Finland.
    sentences:
    - id: hb-c12-u0247-s001
      start: 0
      end: 64
    - id: hb-c12-u0247-s002
      start: 65
      end: 162
  - type: paragraph
    id: hb-c12-u0248
    text: Finskt medborgarskap är inte samma sak som uppehållstillstånd.
    sentences:
    - id: hb-c12-u0248-s001
      start: 0
      end: 62
  - type: paragraph
    id: hb-c12-u0249
    text: 'Barnet får automatiskt finskt medborgarskap vid födseln i följande fall:'
    sentences:
    - id: hb-c12-u0249-s001
      start: 0
      end: 72
  - id: hb-c12-u0251
    type: list
    ordered: false
    items:
    - id: hb-c12-u0250
      text: barnets mor är finsk medborgare,
      sentences:
      - id: hb-c12-u0250-s001
        start: 0
        end: 32
    - id: hb-c12-u0252
      text: barnets far är finsk medborgare och gift med barnets mor,
      sentences:
      - id: hb-c12-u0252-s001
        start: 0
        end: 57
    - id: hb-c12-u0253
      text: barnet föds i Finland, barnets far är finsk medborgare och faderskapet har bekräftats eller
      sentences:
      - id: hb-c12-u0253-s001
        start: 0
        end: 91
    - id: hb-c12-u0254
      text: barnet föds i Finland, barnets mor som inte har fött barnet är finsk medborgare och den icke-födande
        moderns moderskap har bekräftats 1.4.2019 eller senare.
      sentences:
      - id: hb-c12-u0254-s001
        start: 0
        end: 156
  - type: paragraph
    id: hb-c12-u0255
    text: Barnet kan få finskt medborgarskap genom anmälan om barnet föds utomlands, har en finsk far
      eller en finsk mor som inte har fött barnet och föräldrarna inte är gifta med varandra.
    sentences:
    - id: hb-c12-u0255-s001
      start: 0
      end: 179
  - type: paragraph
    id: hb-c12-u0256
    text: Också ett barn till utländska föräldrar som föds i Finland kan få finskt medborgarskap, om hen
      inte får medborgarskap i något annat land av sina föräldrar.
    sentences:
    - id: hb-c12-u0256-s001
      start: 0
      end: 155
  - type: paragraph
    id: hb-c12-u0257
    text: 'Följande personer kan få finskt medborgarskap snabbare och förmånligare genom medborgarskapsanmälan:'
    sentences:
    - id: hb-c12-u0257-s001
      start: 0
      end: 100
  - id: hb-c12-u0259
    type: list
    ordered: false
    items:
    - id: hb-c12-u0258
      text: tidigare finsk medborgare
      sentences:
      - id: hb-c12-u0258-s001
        start: 0
        end: 25
    - id: hb-c12-u0260
      text: ett barn som föds utomlands utom äktenskapet till en finsk far eller till en finsk mor som
        inte har fött barnet
      sentences:
      - id: hb-c12-u0260-s001
        start: 0
        end: 111
    - id: hb-c12-u0261
      text: 18–22 år gamla personer som har bott i Finland flera år
      sentences:
      - id: hb-c12-u0261-s001
        start: 0
        end: 55
    - id: hb-c12-u0262
      text: 12–17 år gammalt adoptivbarn till en finsk medborgare
      sentences:
      - id: hb-c12-u0262-s001
        start: 0
        end: 53
    - id: hb-c12-u0263
      text: medborgare i ett nordiskt land som har bott i Finland de senaste fem åren.
      sentences:
      - id: hb-c12-u0263-s001
        start: 0
        end: 74
- id: hb-c12-flerfaldigt
  title: Flerfaldigt medborgarskap och förlust av medborgarskap
  blocks:
  - type: paragraph
    id: hb-c12-u0264
    text: Finland godkänner flerfaldigt medborgarskap, d.v.s. att du utöver ditt finska medborgarskap
      även har medborgarskap i ett annat land.
    sentences:
    - id: hb-c12-u0264-s001
      start: 0
      end: 132
  - type: paragraph
    id: hb-c12-u0265
    text: Alla stater godkänner dock inte flerfaldigt medborgarskap. Innan du ansöker om finskt medborgarskap
      är det bra att ta reda på om flerfaldigt medborgarskap också är tillåtet i det land där du är medborgare.
      Om denna stat inte tillåter flerfaldigt medborgarskap kan du förlora ditt nuvarande medborgarskap
      när du får finskt medborgarskap.
    sentences:
    - id: hb-c12-u0265-s001
      start: 0
      end: 58
    - id: hb-c12-u0265-s002
      start: 59
      end: 205
    - id: hb-c12-u0265-s003
      start: 206
      end: 336
  - type: paragraph
    id: hb-c12-u0266
    text: Flerfaldigt medborgarskap kan vara en fördel, men också en nackdel. Det lönar sig att till exempel
      ta reda på om man tvingas göra värnplikten i flera medborgarskapsstater eller om det räcker med
      ett intyg över fullgjord värnplikt i ett land. Flerfaldigt medborgarskap kan vara en fördel när
      man till exempel flyttar från ett land till ett annat.
    sentences:
    - id: hb-c12-u0266-s001
      start: 0
      end: 67
    - id: hb-c12-u0266-s002
      start: 68
      end: 241
    - id: hb-c12-u0266-s003
      start: 242
      end: 345
  - type: paragraph
    id: hb-c12-u0267
    text: Barnet kan ha finskt medborgarskap och medborgarskap i något annat land. Detta beror på huruvida
