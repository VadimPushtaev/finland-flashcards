schema_version: 1
id: hb-c06
language: sv
title: Lagar, rättsväsende och rättsskydd
sections:
- id: hb-c06-rattsstat
  title: Rättsstaten och grundlagen
  blocks:
  - type: paragraph
    id: hb-c06-u0001
    text: Finland är en rättsstat. Det betyder att den offentliga makten baserar sig på lagen. Makten
      i samhället är fördelad mellan olika aktörer så att den inte koncentreras för mycket till en aktör.
      Enligt den tredelade maktfördelningsläran har den lagstiftande makten, den verkställande makten
      och den dömande makten skilts från varandra. Då är det svårare att missbruka makt. Målet med indelningen
      är bland annat att trygga en jämlik och likvärdig behandling av människor.
    sentences:
    - id: hb-c06-u0001-s001
      start: 0
      end: 24
    - id: hb-c06-u0001-s002
      start: 25
      end: 84
    - id: hb-c06-u0001-s003
      start: 85
      end: 191
    - id: hb-c06-u0001-s004
      start: 192
      end: 332
    - id: hb-c06-u0001-s005
      start: 333
      end: 370
    - id: hb-c06-u0001-s006
      start: 371
      end: 467
  - type: paragraph
    id: hb-c06-u0002
    text: Grundlagen har en högre ställning än övriga lagar. När riksdagen stiftar lagar ska den säkerställa
      att övriga lagar inte står i strid med grundlagen. Om en annan lag uppenbart står i strid med grundlagen,
      ska domstolar i ärenden som behandlas ge grundlagens bestämmelser företräde.
    sentences:
    - id: hb-c06-u0002-s001
      start: 0
      end: 50
    - id: hb-c06-u0002-s002
      start: 51
      end: 149
    - id: hb-c06-u0002-s003
      start: 150
      end: 281
  - type: paragraph
    id: hb-c06-u0003
    text: Enligt grundlagen är Finland en republik. Makten att bestämma om landets angelägenheter ligger
      hos folket. Grundlagen bestämmer hur till exempel riksdagsledamöter, ministrar och presidenten utses.
      Den bestämmer också hur stiftandet av lagar i riksdagen går till.
    sentences:
    - id: hb-c06-u0003-s001
      start: 0
      end: 41
    - id: hb-c06-u0003-s002
      start: 42
      end: 106
    - id: hb-c06-u0003-s003
      start: 107
      end: 196
    - id: hb-c06-u0003-s004
      start: 197
      end: 262
  - type: paragraph
    id: hb-c06-u0004
    text: I en rättsstat finns det också rättssäkerhet. Rättssäkerhet betyder att alla har lika rätt att
      få sin sak behandlad på behörigt sätt och utan ogrundat dröjsmål av en opartisk domstol eller någon
      annan myndighet. Alla ärenden behandlas i domstol enligt lagen, jämlikt och likvärdigt. Enligt finsk
      lagstiftning ska en människa betraktas som oskyldig tills hens skuld har lagligen fastställts.
    sentences:
    - id: hb-c06-u0004-s001
      start: 0
      end: 45
    - id: hb-c06-u0004-s002
      start: 46
      end: 211
    - id: hb-c06-u0004-s003
      start: 212
      end: 282
    - id: hb-c06-u0004-s004
      start: 283
      end: 390
  - type: paragraph
    id: hb-c06-u0005
    text: Rättsväsendet upprätthåller rättsstaten. Rättsväsendet omfattar domstolarna, statens rättshjälpsbyråer,
      Åklagarmyndigheten, Utsökningsverket, ekonomi- och skuldrådgivning, allmän intressebevakning samt
      Brottspåföljdsmyndigheten. Rättsväsendet ansvarar för att rättvisa straff utdelas för brott. Förundersökningsmyndigheterna
      utreder brott och säkerställer att medborgarna kan leva i fred och säkerhet.
    sentences:
    - id: hb-c06-u0005-s001
      start: 0
      end: 40
    - id: hb-c06-u0005-s002
      start: 41
      end: 228
    - id: hb-c06-u0005-s003
      start: 229
      end: 294
    - id: hb-c06-u0005-s004
      start: 295
      end: 401
  - type: paragraph
    id: hb-c06-u0006
    text: I Finland måste alla följa finsk lag. När en människa bor och lever i Finland är det viktigt
      att hen känner till lagarna i landet. Lagarna tryggar allas rättigheter och den allmänna ordningen
      i samhället.
    sentences:
    - id: hb-c06-u0006-s001
      start: 0
      end: 37
    - id: hb-c06-u0006-s002
      start: 38
      end: 130
    - id: hb-c06-u0006-s003
      start: 131
      end: 204
  - type: paragraph
    id: hb-c06-u0007
    text: I Finland anses det i allmänhet viktigt att följa lagar. Att bryta mot lagen är oacceptabelt
      och godkänns inte. Det är viktigt att lagarna är i linje med människornas allmänna rättskänsla,
      det vill säga uppfattningen om vad som är rätt och fel. Om lagen och människornas rättskänsla strider
      mot varandra, minskar respekten för lagen.
    sentences:
    - id: hb-c06-u0007-s001
      start: 0
      end: 56
    - id: hb-c06-u0007-s002
      start: 57
      end: 111
    - id: hb-c06-u0007-s003
      start: 112
      end: 244
    - id: hb-c06-u0007-s004
      start: 245
      end: 333
  - type: paragraph
    id: hb-c06-u0008
    text: Lagar bygger på värderingarna och normerna i samhället. Med värderingar avses det som människorna
      anser vara viktiga och värda att eftersträva. Olika kulturer och religioner har olika värderingar,
      och också människor som lever i samma kultur har olika personliga värderingar.
    sentences:
    - id: hb-c06-u0008-s001
      start: 0
      end: 55
    - id: hb-c06-u0008-s002
      start: 56
      end: 143
    - id: hb-c06-u0008-s003
      start: 144
      end: 275
  - type: paragraph
    id: hb-c06-u0009
    text: Normer är etablerade tankar, regler eller påbud om hur människorna ska bete sig. Normerna visar
      vad som anses vara acceptabelt beteende, rätt och fel och hur människorna borde leva.
    sentences:
    - id: hb-c06-u0009-s001
      start: 0
      end: 80
    - id: hb-c06-u0009-s002
      start: 81
      end: 181
  - type: paragraph
    id: hb-c06-u0010
    text: Grundläggande värderingar i det finländska samhället är en idé om det allmänna bästa och frihet,
      mänskliga rättigheter och likabehandling. Var och en ska ha möjlighet att studera, få ett yrke och
      vara framgångsrik i sitt liv. Dessa värderingar bildar en stabil grund för ett gott och rättvist
      samhälle.
    sentences:
    - id: hb-c06-u0010-s001
      start: 0
      end: 138
    - id: hb-c06-u0010-s002
      start: 139
      end: 225
    - id: hb-c06-u0010-s003
      start: 226
      end: 302
  - type: paragraph
    id: hb-c06-u0011
    text: Finland är ett världsligt, det vill säga sekulärt, land. Finlands lagar baserar sig inte direkt
      på någon religion. Ännu på 1500- och 1600-talen baserade sig europeiska lagar allmänt på bibeltexter.
      År 1734 genomfördes en stor lagreform i Sverige, som Finland på den tiden hörde till, och i och
      med den övergick man till en sekulär lagstiftning.
    sentences:
    - id: hb-c06-u0011-s001
      start: 0
      end: 56
    - id: hb-c06-u0011-s002
      start: 57
      end: 114
    - id: hb-c06-u0011-s003
      start: 115
      end: 197
    - id: hb-c06-u0011-s004
      start: 198
      end: 344
  - type: paragraph
    id: hb-c06-u0012
    text: Europeiska unionens förordningar är direkt tillämplig lagstiftning i Finland. Ett direktiv är
      en anvisning om en lag som EU:s medlemsländer måste stifta nationellt. I fråga om direktiv har medlemsländerna
      fler möjligheter att välja på vilket sätt anvisningen genomförs i den nationella lagstiftningen.
    sentences:
    - id: hb-c06-u0012-s001
      start: 0
      end: 77
    - id: hb-c06-u0012-s002
      start: 78
      end: 164
    - id: hb-c06-u0012-s003
      start: 165
      end: 301
- id: hb-c06-god-forvaltning
  title: God förvaltning och korruption
  blocks:
  - type: paragraph
    id: hb-c06-u0013
    text: Finlands rättssystem avser det sätt som rätten fungerar på i Finland och som myndigheterna använder
      för att övervaka utövandet av rätten. Finland är ett land med god förvaltning. God förvaltning betyder
      att samhället fungerar smidigt och är jämlikt och att myndigheterna verkar objektivt och i proportion
      till det eftersträvade målet. Människorna kan utöva sina rättigheter och skyldigheter, och det förekommer
      lite korruption.
    sentences:
    - id: hb-c06-u0013-s001
      start: 0
      end: 137
    - id: hb-c06-u0013-s002
      start: 138
      end: 178
    - id: hb-c06-u0013-s003
      start: 179
      end: 334
    - id: hb-c06-u0013-s004
      start: 335
      end: 427
  - type: paragraph
    id: hb-c06-u0014
    text: Korruption betyder att myndigheter kan mutas och inte alltid följer regler eller lagar i sitt
      arbete. Korruption är till exempel om någon ger eller får en gentjänst för pengar eller andra förmåner
      som hen inte har laglig rätt till. Korruption är också till exempel att favorisera släktingar eller
      vänner i beslutsfattande eller att en politiker deltar i beslutsfattande som direkt gynnar ett företag
      som hen äger.
    sentences:
    - id: hb-c06-u0014-s001
      start: 0
      end: 101
    - id: hb-c06-u0014-s002
      start: 102
      end: 231
    - id: hb-c06-u0014-s003
      start: 232
      end: 413
  - type: paragraph
    id: hb-c06-u0015
    text: I Finland är målet att skapa ett mer jämlikt samhälle. Därför till exempel jämnas inkomstskillnaderna
      mellan människor ut med hjälp av beskattning. Jämlika inkomster ökar människornas tillit till samhället
      och minskar korruption. Finland hör till ett av de minst korrumperade länderna i världen. Missbruk
      förekommer ibland också i Finland, men man försöker ingripa effektivt i det.
    sentences:
    - id: hb-c06-u0015-s001
      start: 0
      end: 54
    - id: hb-c06-u0015-s002
      start: 55
      end: 147
    - id: hb-c06-u0015-s003
      start: 148
      end: 229
    - id: hb-c06-u0015-s004
      start: 230
      end: 295
    - id: hb-c06-u0015-s005
      start: 296
      end: 381
  - type: paragraph
    id: hb-c06-u0016
    text: I Finland regleras alla myndigheters verksamhet av förvaltningslagen som allmän lag. Dessutom
      finns det egna lagar för många myndigheters verksamhet som föreskriver om vilka ärenden som ingår
      i den aktuella myndighetens behörighet. Med behörighet avses de frågor som den aktuella myndigheten
      har makt att fatta beslut i. En del frågor inom myndigheternas verksamhet, såsom behandlingen av
      personuppgifter, regleras genom EU-lagstiftning.
    sentences:
    - id: hb-c06-u0016-s001
      start: 0
      end: 84
    - id: hb-c06-u0016-s002
      start: 85
      end: 231
    - id: hb-c06-u0016-s003
      start: 232
      end: 320
    - id: hb-c06-u0016-s004
      start: 321
      end: 437
  - type: paragraph
    id: hb-c06-u0017
    text: Eftersom myndigheternas verksamhet i Finland är strängt reglerad av lagar kan den ibland kännas
      stel. Det är vanligtvis inte möjligt att påskynda en enskild kunds ärende eller göra undantag i
      ett beslut, eller så är det möjligt endast om det finns en grundad anledning eller särskilt vägande
      skäl. Sådana skäl är i allmänhet fastställda i förväg, och en enskild tjänsteman kan inte avvika
      från reglerna även om hen skulle vilja. Syftet är att alla ska behandlas lika och att myndigheternas
      beslut ska följa lagen.
    sentences:
    - id: hb-c06-u0017-s001
      start: 0
      end: 101
    - id: hb-c06-u0017-s002
      start: 102
      end: 297
    - id: hb-c06-u0017-s003
      start: 298
      end: 428
    - id: hb-c06-u0017-s004
      start: 429
      end: 513
  - type: paragraph
    id: hb-c06-u0018
    text: Myndigheternas verksamhet styrs av principerna för god förvaltning. Dessa principer är fastställda
      i lag. Enligt principerna
    sentences:
    - id: hb-c06-u0018-s001
      start: 0
      end: 67
    - id: hb-c06-u0018-s002
      start: 68
      end: 105
    - id: hb-c06-u0018-s003
      start: 106
      end: 124
  - id: hb-c06-u0020
    type: list
    ordered: false
    items:
    - id: hb-c06-u0019
      text: ska myndigheternas verksamhet vara rättvis, det vill säga en myndighet ska behandla alla människor
        jämlikt, konsekvent och utan att diskriminera någon. Till exempel får en anställd på skattebyrån
        inte ge sina släktingar en lägre skatteprocent än någon annan i en exakt likadan situation
      sentences:
      - id: hb-c06-u0019-s001
        start: 0
        end: 151
      - id: hb-c06-u0019-s002
        start: 152
        end: 286
    - id: hb-c06-u0021
      text: ska verksamheten vara objektiv. En kommun får till exempel inte ge alla nya byggprojekt till
        samma byggföretag bara för att företagets direktör hör till samma parti som kommundirektören
      sentences:
      - id: hb-c06-u0021-s001
        start: 0
        end: 31
      - id: hb-c06-u0021-s002
        start: 32
        end: 185
    - id: hb-c06-u0022
      text: får en myndighet bara använda sina befogenheter för godtagbara syften som står i lagen. Till
        exempel får en polis inte utöva sin makt för att få personliga fördelar
      sentences:
      - id: hb-c06-u0022-s001
        start: 0
        end: 87
      - id: hb-c06-u0022-s002
        start: 88
        end: 164
    - id: hb-c06-u0023
      text: ska myndigheternas åtgärder också stå i rätt proportion till den eftersträvade nyttan. Det
        skulle till exempel vara orimligt om om ett litet överskridande av hastighetsgränsen gav lika
        höga böter som ett stort överskridande.
      sentences:
      - id: hb-c06-u0023-s001
        start: 0
        end: 86
      - id: hb-c06-u0023-s002
        start: 87
        end: 224
  - type: paragraph
    id: hb-c06-u0024
    text: Utöver dessa grundprinciper föreskriver lagen bland annat att en myndighet inom ramen för sin
      behörighet ska ge avgiftsfri rådgivning och svara på frågor och förfrågningar som gäller uträttandet
      av ärenden. Om ett ärende inte hör till den aktuella myndighetens behörighet ska den i mån av möjlighet
      hänvisa personen till rätt myndighet.
    sentences:
    - id: hb-c06-u0024-s001
      start: 0
      end: 206
    - id: hb-c06-u0024-s002
      start: 207
      end: 336
  - type: paragraph
    id: hb-c06-u0025
    text: Till god förvaltning hör också att man inte kan köpa sig specialbehandling av myndigheter genom
      mutor. I Finland är det ett brott att muta myndigheter.
    sentences:
    - id: hb-c06-u0025-s001
      start: 0
      end: 102
    - id: hb-c06-u0025-s002
      start: 103
      end: 151
  - type: paragraph
    id: hb-c06-u0026
    text: Ibland är det möjligt för en myndighet att utöva prövningsrätt. Prövningsrätt innebär att det
      i lag inte entydigt föreskrivs om hur ett beslut ska fattas, utan tjänstemän kan i viss utsträckning
      utöva prövning. I lagen föreskrivs när prövning kan utövas och hur stor frihet en myndighet har
      att välja mellan olika beslutsalternativ.
    sentences:
    - id: hb-c06-u0026-s001
      start: 0
      end: 63
    - id: hb-c06-u0026-s002
      start: 64
      end: 210
    - id: hb-c06-u0026-s003
      start: 211
      end: 332
  - type: paragraph
    id: hb-c06-u0027
    text: Ett beslut baseras på en helhetsbedömning av situationen. Beslut som olika människor får kan
      därför vara olika om deras situationer är olika ur ett helhetsperspektiv.
    sentences:
    - id: hb-c06-u0027-s001
      start: 0
      end: 57
    - id: hb-c06-u0027-s002
      start: 58
      end: 166
- id: hb-c06-rattsskydd
  title: Beslut, rättelse och tillsyn
  blocks:
  - type: paragraph
    id: hb-c06-u0028
    text: I lagen föreskrivs om vilka rättigheter och skyldigheter en person som uträttar ärenden hos
      en myndighet har. Kunden har till exempel rätt att få information om myndighetens beslut skriftligt.
      I beslutsbrevet motiverar myndigheten varför beslutet ser ut som det gör och vilka faktorer myndigheten
      har beaktat när den fattade beslutet.
    sentences:
    - id: hb-c06-u0028-s001
      start: 0
      end: 109
    - id: hb-c06-u0028-s002
      start: 110
      end: 192
    - id: hb-c06-u0028-s003
      start: 193
      end: 334
  - type: paragraph
    id: hb-c06-u0029
    text: Kunden har rätt att få en uppskattning av hur länge det kommer att ta att behandla hens ärende.
      Myndigheten ska också svara på frågor om hur behandlingen framskrider. Det är ändå bra att komma
      ihåg att handläggningstiden är en uppskattning, och ibland kan det ta längre eller kortare tid att
      behandla ett ärende. På behandlingens längd inverkar hur komplicerat ärendet är eller huruvida myndigheten
      är tvungen att begära ytterligare utredningar av kunden.
    sentences:
    - id: hb-c06-u0029-s001
      start: 0
      end: 95
    - id: hb-c06-u0029-s002
      start: 96
      end: 166
    - id: hb-c06-u0029-s003
      start: 167
      end: 312
    - id: hb-c06-u0029-s004
      start: 313
      end: 455
  - type: paragraph
    id: hb-c06-u0030
    text: Om man inte förstår ett beslut som man har fått ska man alltid kontakta den myndighet som fattat
      beslutet. Myndigheten kan förklara varför beslutet ser ut som det gör.
    sentences:
    - id: hb-c06-u0030-s001
      start: 0
      end: 106
    - id: hb-c06-u0030-s002
      start: 107
      end: 167
  - type: paragraph
    id: hb-c06-u0031
    text: Man kan i allmänhet kräva rättelse av eller överklaga ett felaktigt beslut. I anslutning till
      beslutet måste myndigheten ge kunden skriftliga anvisningar för hur hen kan söka rättelse eller
      göra en överklagan. Kunden måste göra ett skriftligt krav på rättelse eller en skriftlig överklagan
      inom en viss tid efter att hen fått beslutet. Myndigheten måste granska beslutet och orsakerna till
      det på nytt. Om myndigheten konstaterar att beslutet var felaktigt korrigeras det och ett nytt beslut
      fattas.
    sentences:
    - id: hb-c06-u0031-s001
      start: 0
      end: 75
    - id: hb-c06-u0031-s002
      start: 76
      end: 209
    - id: hb-c06-u0031-s003
      start: 210
      end: 335
    - id: hb-c06-u0031-s004
      start: 336
      end: 402
    - id: hb-c06-u0031-s005
      start: 403
      end: 499
  - type: paragraph
    id: hb-c06-u0032
    text: Man kan också anföra klagomål över en myndighets verksamhet. Man kan anföra klagomål om man
      upplever att myndigheten har handlat i strid mot lagen. Det är inte möjligt att söka ändring i ett
      myndighetsbeslut genom klagomål.
    sentences:
    - id: hb-c06-u0032-s001
      start: 0
      end: 60
    - id: hb-c06-u0032-s002
      start: 61
      end: 147
    - id: hb-c06-u0032-s003
      start: 148
      end: 223
  - type: paragraph
    id: hb-c06-u0033
    text: Också myndigheterna måste följa lagen. Om man misstänker att en myndighet inte agerar enligt
      lagen, kan man ingripa i dess verksamhet. Människorna kan anföra klagomål om myndigheters verksamhet
      hos justitieombudsmannen eller justitiekanslern.
    sentences:
    - id: hb-c06-u0033-s001
      start: 0
      end: 38
    - id: hb-c06-u0033-s002
      start: 39
      end: 134
    - id: hb-c06-u0033-s003
      start: 135
      end: 242
  - type: paragraph
    id: hb-c06-u0034
    text: Justitieombudsmannen och justitiekanslern övervakar att regeringen, ministerierna, presidenten,
      domstolarna, åklagarna, myndigheterna och övriga tjänstemän agerar i enlighet med lagen och fullgör
      sina skyldigheter. Justitieombudsmannen säkerställer att de grundläggande och mänskliga rättigheterna
      uppfylls i rätten och att rätten följer principerna för god förvaltning.
    sentences:
    - id: hb-c06-u0034-s001
      start: 0
      end: 214
    - id: hb-c06-u0034-s002
      start: 215
      end: 370
  - type: paragraph
    id: hb-c06-u0035
    text: Vem som helst kan klaga hos justitieombudsmannen eller justitiekanslern om en myndighet har
      förfarit felaktigt. Man kan anföra klagomål om myndigheter, tjänstemän och personer som har ett
      offentligt uppdrag. Ett klagomål görs alltid skriftligt. Det kan vara fritt formulerat eller lämnas
      in med en blankett. Blanketter finns på justitieombudsmannens och justitiekanslerns byrå eller på
      internet. Justitieombudsmannen eller justitiekanslern utreder klagomålet.
    sentences:
    - id: hb-c06-u0035-s001
      start: 0
      end: 111
    - id: hb-c06-u0035-s002
      start: 112
      end: 207
    - id: hb-c06-u0035-s003
      start: 208
      end: 244
    - id: hb-c06-u0035-s004
      start: 245
      end: 307
    - id: hb-c06-u0035-s005
      start: 308
      end: 395
    - id: hb-c06-u0035-s006
      start: 396
      end: 459
  - type: paragraph
    id: hb-c06-u0036
    text: Justitieombudsmannen och justitiekanslern undersöker klagomålen och granskar myndigheter och
      instanser. Det kostar inget att anföra klagomål.
    sentences:
    - id: hb-c06-u0036-s001
      start: 0
      end: 103
    - id: hb-c06-u0036-s002
      start: 104
      end: 141
- id: hb-c06-polis
  title: Polisen och rättsväsendets aktörer
  blocks:
  - type: paragraph
    id: hb-c06-u0037
    text: I det finländska rättssystemet stiftar riksdagen lagarna. Polisen och övriga myndigheter övervakar
      att människorna följer lagen. Domstolarna utövar sin domsrätt, det vill säga bedömer om någon har
      agerat i strid med lagen. Domstolarna har också makt att utdöma straff om någon har brutit mot lagen.
      Domstolarna, polisen och övriga myndigheter utför sitt arbete fria från politiskt inflytande.
    sentences:
    - id: hb-c06-u0037-s001
      start: 0
      end: 57
    - id: hb-c06-u0037-s002
      start: 58
      end: 128
    - id: hb-c06-u0037-s003
      start: 129
      end: 222
    - id: hb-c06-u0037-s004
      start: 223
      end: 298
    - id: hb-c06-u0037-s005
      start: 299
      end: 392
  - type: paragraph
    id: hb-c06-u0038
    text: I Finland övervakar myndigheterna att människorna följer lagarna. Säkerheten i samhället övervakas
      gemensamt av räddningsverket, polisen, Tullen, gränsbevakningsväsendet och försvarsmakten. Försvarsmakten
      har som uppgift att försvara Finland militärt. Polisen upprätthåller den allmänna säkerheten och
      ordningen i landet. Polisen är en respekterad myndighet i Finland.
    sentences:
    - id: hb-c06-u0038-s001
      start: 0
      end: 65
    - id: hb-c06-u0038-s002
      start: 66
      end: 189
    - id: hb-c06-u0038-s003
      start: 190
      end: 251
    - id: hb-c06-u0038-s004
      start: 252
      end: 321
    - id: hb-c06-u0038-s005
      start: 322
      end: 368
  - type: paragraph
    id: hb-c06-u0039
    text: Polisen utreder också brott och försöker förebygga brottslighet. Var och en kan meddela till
      polisen om man misstänker att ett brott har begåtts. Man kan göra en polisanmälan på en polisstation,
      per telefon eller på internet. Anmälan kan vara muntlig eller skriftlig.
    sentences:
    - id: hb-c06-u0039-s001
      start: 0
      end: 64
    - id: hb-c06-u0039-s002
      start: 65
      end: 145
    - id: hb-c06-u0039-s003
      start: 146
      end: 225
    - id: hb-c06-u0039-s004
      start: 226
      end: 267
  - type: paragraph
    id: hb-c06-u0040
    text: Polisen, myndigheter och politiker tar inte emot mutor. En muta är en gåva eller en förmån som
      ges till en myndighet för att denna ska hjälpa den som ger gåvan på ett annat sätt än andra människor.
      Då är det fråga om korruption. I Finland är det ett brott både att ge och att ta emot mutor.
    sentences:
    - id: hb-c06-u0040-s001
      start: 0
      end: 55
    - id: hb-c06-u0040-s002
      start: 56
      end: 197
    - id: hb-c06-u0040-s003
      start: 198
      end: 228
    - id: hb-c06-u0040-s004
      start: 229
      end: 290
  - type: paragraph
    id: hb-c06-u0041
    text: Om man vet eller misstänker att ett brott har begåtts, kan man göra en brottsanmälan till polisen.
      Vem som helst kan göra en brottsanmälan på en polisstation, på internet, genom att berätta för en
      polispatrull om det eller ibland också per telefon. Polisen är skyldig att ta emot brottsanmälningar.
    sentences:
    - id: hb-c06-u0041-s001
      start: 0
      end: 98
    - id: hb-c06-u0041-s002
      start: 99
      end: 248
    - id: hb-c06-u0041-s003
      start: 249
      end: 298
  - type: paragraph
    id: hb-c06-u0042
    text: Man kan anmäla brott till polisen också anonymt genom att ringa en tipstelefon eller skicka
      e-post. Då får den som begått brottet inte veta vem som har anmält det till polisen.
    sentences:
    - id: hb-c06-u0042-s001
      start: 0
      end: 99
    - id: hb-c06-u0042-s002
      start: 100
      end: 176
- id: hb-c06-brott
  title: Brott och straffansvar
  blocks:
  - type: paragraph
    id: hb-c06-u0043
    text: Ett brott är en förbjuden handling som man enligt lagen får ett straff för. Också försummelse,
      det vill säga att låta bli att göra något, kan vara ett brott, likaså att uppvigla någon annan till
      ett brott. Ibland är redan ett försök till brott ett brott, som kan ge ett straff.
    sentences:
    - id: hb-c06-u0043-s001
      start: 0
      end: 75
    - id: hb-c06-u0043-s002
      start: 76
      end: 205
    - id: hb-c06-u0043-s003
      start: 206
      end: 277
  - type: paragraph
    id: hb-c06-u0044
    text: I Finland är alla skyldiga att meddela till polisen om man vet att någon planerar ett brott.
      Då kan brottet ännu förhindras. Anmälningsskyldigheten gäller allvarliga brott, till exempel brott
      mot liv, våldtäkt, misshandel och rån. Närstående familjemedlemmar till en person som planerar ett
      brott har inte anmälningsskyldighet.
    sentences:
    - id: hb-c06-u0044-s001
      start: 0
      end: 92
    - id: hb-c06-u0044-s002
      start: 93
      end: 124
    - id: hb-c06-u0044-s003
      start: 125
      end: 230
    - id: hb-c06-u0044-s004
      start: 231
      end: 327
  - type: paragraph
    id: hb-c06-u0045
    text: 'Följande är typiska brott i Finland:'
    sentences:
    - id: hb-c06-u0045-s001
      start: 0
      end: 36
  - id: hb-c06-u0047
    type: list
    ordered: false
    items:
    - id: hb-c06-u0046
      text: 'Stöld: Stöld betyder att en människa tar någon annans egendom utan lov. Butiksstölder anmäls
        alltid till polisen. Att stjäla mindre värdefulla saker kallas snatteri.'
      sentences:
      - id: hb-c06-u0046-s001
        start: 0
        end: 71
      - id: hb-c06-u0046-s002
        start: 72
        end: 113
      - id: hb-c06-u0046-s003
        start: 114
        end: 165
    - id: hb-c06-u0048
      text: 'Trafikbrott: Trafikreglerna, till exempel fartbegränsningarna, måste följas. Man får inte
        köra fordon utan körkort. Man får inte köra bil, motorcykel eller moped när man är berusad eller
        påverkad av droger.'
      sentences:
      - id: hb-c06-u0048-s001
        start: 0
        end: 76
      - id: hb-c06-u0048-s002
        start: 77
        end: 115
      - id: hb-c06-u0048-s003
        start: 116
        end: 206
    - id: hb-c06-u0049
      text: 'Skadegörelse: Man får inte skada eller förstöra någon annans egendom. Om en människa orsakar
        skada på någon annans egendom, är hen ersättningsskyldig. Det betyder att hen måste betala för
        skadorna. Om gärningsmannen inte betalar för skadorna, kan en myndighet dra av skadeersättningarna
        direkt på hens lön.'
      sentences:
      - id: hb-c06-u0049-s001
        start: 0
        end: 69
      - id: hb-c06-u0049-s002
        start: 70
        end: 150
      - id: hb-c06-u0049-s003
        start: 151
        end: 197
      - id: hb-c06-u0049-s004
        start: 198
        end: 306
    - id: hb-c06-u0050
      text: 'Våldsbrott och brott mot liv: Våld är ett brott i Finland. Våld kan vara fysiskt, sexuellt
        eller psykiskt våld eller hot om våld. Brott mot liv är mord, dråp och vållande till annans död.'
      sentences:
      - id: hb-c06-u0050-s001
        start: 0
        end: 58
      - id: hb-c06-u0050-s002
        start: 59
        end: 129
      - id: hb-c06-u0050-s003
        start: 130
        end: 187
  - type: paragraph
    id: hb-c06-u0051
    text: Ett brott är en handling som det i Finlands lag föreskrivs ett straff för. I Finland är alla
      som fyllt 15 år straffrättsligt ansvariga för sina handlingar. Det betyder att alla som är minst
      15 år kan åtalas och få en dom om de begår ett brott.
    sentences:
    - id: hb-c06-u0051-s001
      start: 0
      end: 74
    - id: hb-c06-u0051-s002
      start: 75
      end: 155
    - id: hb-c06-u0051-s003
      start: 156
      end: 243
- id: hb-c06-vald
  title: Våld och sexuellt självbestämmande
  blocks:
  - type: paragraph
    id: hb-c06-u0052
    text: Våld kränker de mänskliga rättigheterna. Det påverkar välbefinnandet och hälsan för alla inblandade.
      Våld orsakar förutom fysiska skador också till exempel depression, ångest, ätstörningar och sömnstörningar.
    sentences:
    - id: hb-c06-u0052-s001
      start: 0
      end: 40
    - id: hb-c06-u0052-s002
      start: 41
      end: 100
    - id: hb-c06-u0052-s003
      start: 101
      end: 208
  - id: hb-c06-u0054
    type: list
    ordered: false
    items:
    - id: hb-c06-u0053
      text: Fysiskt våld är till exempel att slå, knuffa, dra i håret, strypa, sparka eller förhindra
        någon att röra sig. Misshandel betyder att en människa riktar eller försöker rikta våld mot en
        annan människa. Misshandel är ett brott även om den inte skulle lämna spår på kroppen.
      sentences:
      - id: hb-c06-u0053-s001
        start: 0
        end: 109
      - id: hb-c06-u0053-s002
        start: 110
        end: 200
      - id: hb-c06-u0053-s003
        start: 201
        end: 271
    - id: hb-c06-u0055
      text: Psykiskt våld är att hota, utöva utpressning mot någon, kalla någon vid öknamn, isolera någon
        från andra och behandla någon illa eller till exempel undersöka någons telefon eller e-post. Psykiskt
        våld lämnar inga yttre spår och är därför ibland svårt att känna igen.
      sentences:
      - id: hb-c06-u0055-s001
        start: 0
        end: 186
      - id: hb-c06-u0055-s002
        start: 187
        end: 266
    - id: hb-c06-u0056
      text: Sexuellt våld är till exempel ofredande, beröring, trakasserier, våldtäkt eller sexuella övergrepp.
      sentences:
      - id: hb-c06-u0056-s001
        start: 0
        end: 99
  - type: paragraph
    id: hb-c06-u0057
    text: I Finland är misshandel ett brott som hör under allmänt åtal. Det betyder att gärningsmannen
      kan åtalas för sina gärningar, även om offret, det vill säga den som utsatts för våldet, inte skulle
      vilja det.
    sentences:
    - id: hb-c06-u0057-s001
      start: 0
      end: 61
    - id: hb-c06-u0057-s002
      start: 62
      end: 204
  - type: paragraph
    id: hb-c06-u0058
    text: Sexualbrott är brott som kränker en annan människas sexuella självbestämmanderätt. Sexualbrott
      är bland annat våldtäkt, sexuella övergrepp och sexuellt ofredande.
    sentences:
    - id: hb-c06-u0058-s001
      start: 0
      end: 82
    - id: hb-c06-u0058-s002
      start: 83
      end: 162
  - type: paragraph
    id: hb-c06-u0059
    text: Könsumgänge utan den andra partens samtycke är alltid våldtäkt. Samtycke innebär att en människa
      deltar i handlingen frivilligt av sin egen vilja. Om man deltar endast för att man är rädd för att
      säga nej, är det inte fråga om samtycke. En människa som till exempel sover eller är medvetslös
      på grund av alkohol, droger eller läkemedel kan inte samtycka till sex. Samtycke kan ges till exempel
      i ord eller med kroppsspråk.
    sentences:
    - id: hb-c06-u0059-s001
      start: 0
      end: 63
    - id: hb-c06-u0059-s002
      start: 64
      end: 146
    - id: hb-c06-u0059-s003
      start: 147
      end: 236
    - id: hb-c06-u0059-s004
      start: 237
      end: 363
    - id: hb-c06-u0059-s005
      start: 364
      end: 422
  - type: paragraph
    id: hb-c06-u0060
    text: Också andra sexuella handlingar än könsumgänge är brott om den andra parten inte har samtyckt
      till dem. Brottsrubriceringen är då sexuellt övergrepp. Sådana handlingar kan vara till exempel
      att kraftigt röra en annan persons könsorgan eller bröst, eller att masturbera inför någon annan.
    sentences:
    - id: hb-c06-u0060-s001
      start: 0
      end: 103
    - id: hb-c06-u0060-s002
      start: 104
      end: 149
    - id: hb-c06-u0060-s003
      start: 150
      end: 287
  - type: paragraph
    id: hb-c06-u0061
    text: Sexuellt ofredande är till exempel att röra någon annan sexuellt utan hens samtycke. Dessutom
      kan sexuellt ofredande vara till exempel upprepade verbala handlingar, meddelanden eller blottande
      som kränker en annan människas sexuella självbestämmanderätt.
    sentences:
    - id: hb-c06-u0061-s001
      start: 0
      end: 84
    - id: hb-c06-u0061-s002
      start: 85
      end: 254
  - type: paragraph
    id: hb-c06-u0062
    text: En sexuell handling utan den andras samtycke eller sexuellt ofredande berättigas inte av att
      offret till exempel bar avslöjande kläder, var berusat, gick hem till gärningsmannens bostad tillsammans
      med hen eller tidigare har samtyckt till sex med gärningsmannen eller någon annan. Ett parförhållande
      eller äktenskap innebär inte automatiskt samtycke till sexuella handlingar, utan man måste fråga
      om samtycke separat varje gång.
    sentences:
    - id: hb-c06-u0062-s001
      start: 0
      end: 280
    - id: hb-c06-u0062-s002
      start: 281
      end: 428
  - type: paragraph
    id: hb-c06-u0063
    text: Inte heller samtycke till en typ av sexuell handling, till exempel samlag med kondom, innebär
      automatiskt samtycke till andra sexuella handlingar, till exempel samlag utan kondom.
    sentences:
    - id: hb-c06-u0063-s001
      start: 0
      end: 179
  - type: paragraph
    id: hb-c06-u0064
    text: När offret är ett barn under 16 år är könsumgänge eller någon annan sexuell handling alltid
      ett brott. Ett barn under 16 år kan alltså inte samtycka till sex. Undantaget är om båda parterna
      är i samma ålder och den sexuella självbestämmanderätten inte har kränkts. Om det handlar om en
      ung person i åldern 16–17 år, är det fråga om ett brott om den andra parten har en dominerande ställning
      över den unga.
    sentences:
    - id: hb-c06-u0064-s001
      start: 0
      end: 102
    - id: hb-c06-u0064-s002
      start: 103
      end: 158
    - id: hb-c06-u0064-s003
      start: 159
      end: 264
    - id: hb-c06-u0064-s004
      start: 265
      end: 405
  - type: paragraph
    id: hb-c06-u0065
    text: Det är vanligt att offer inte anmäler sexualbrott till polisen. Det kan bero på att de känner
      skam eller skuld över händelsen. Ett sexualbrott är dock aldrig offrets fel. Under straffprocessen
      är det möjligt att få stöd. Även om det ofta är en traumatisk upplevelse att falla offer för ett
      sexualbrott, är det möjligt att återhämta sig från det.
    sentences:
    - id: hb-c06-u0065-s001
      start: 0
      end: 63
    - id: hb-c06-u0065-s002
      start: 64
      end: 126
    - id: hb-c06-u0065-s003
      start: 127
      end: 170
    - id: hb-c06-u0065-s004
      start: 171
      end: 220
    - id: hb-c06-u0065-s005
      start: 221
      end: 345
  - type: paragraph
    id: hb-c06-u0066
    text: Offer för sexualbrott kan få stöd också utan att göra en brottsanmälan. På Seri-stödcentren
      får man till exempel traumastöd och psykologisk rådgivning. Alla över 16 år oavsett kön kan kontakta
      ett stödcenter. Också en del organisationer erbjuder stöd för offer för sexualbrott. Om ett sexualbrott
      riktar sig mot ett barn, får barnet och familjen stöd hos barnskyddet.
    sentences:
    - id: hb-c06-u0066-s001
      start: 0
      end: 71
    - id: hb-c06-u0066-s002
      start: 72
      end: 151
    - id: hb-c06-u0066-s003
      start: 152
      end: 208
    - id: hb-c06-u0066-s004
      start: 209
      end: 277
    - id: hb-c06-u0066-s005
      start: 278
      end: 367
- id: hb-c06-manniskohandel
  title: Människohandel och hjälp till utsatta
  blocks:
  - type: paragraph
    id: hb-c06-u0067
    text: 'Människohandel är ett brott i Finland. Människohandel är till exempel:'
    sentences:
    - id: hb-c06-u0067-s001
      start: 0
      end: 38
    - id: hb-c06-u0067-s002
      start: 39
      end: 70
  - id: hb-c06-u0069
    type: list
    ordered: false
    items:
    - id: hb-c06-u0068
      text: att tvinga någon till arbete, för vilket man betalar för lite eller ingen lön alls
      sentences:
      - id: hb-c06-u0068-s001
        start: 0
        end: 82
    - id: hb-c06-u0070
      text: att tvinga någon att sälja sex
      sentences:
      - id: hb-c06-u0070-s001
        start: 0
        end: 30
    - id: hb-c06-u0071
      text: att tvinga någon att tigga eller begå brott
      sentences:
      - id: hb-c06-u0071-s001
        start: 0
        end: 43
    - id: hb-c06-u0072
      text: att tvinga någon till äktenskap.
      sentences:
      - id: hb-c06-u0072-s001
        start: 0
        end: 32
  - type: paragraph
    id: hb-c06-u0073
    text: Du kan vara offer för människohandel, om
    sentences:
    - id: hb-c06-u0073-s001
      start: 0
      end: 40
  - id: hb-c06-u0075
    type: list
    ordered: false
    items:
    - id: hb-c06-u0074
      text: någon tvingar dig att göra saker som du inte vill göra
      sentences:
      - id: hb-c06-u0074-s001
        start: 0
        end: 54
    - id: hb-c06-u0076
      text: någon hotar dig eller din familj med våld
      sentences:
      - id: hb-c06-u0076-s001
        start: 0
        end: 41
    - id: hb-c06-u0077
      text: någon hotar med att ange dig till myndigheter om du inte gör som hen säger
      sentences:
      - id: hb-c06-u0077-s001
        start: 0
        end: 74
    - id: hb-c06-u0078
      text: någon hindrar eller övervakar dina rörelser
      sentences:
      - id: hb-c06-u0078-s001
        start: 0
        end: 43
    - id: hb-c06-u0079
      text: du inte kan fritt prata om din situation för andra.
      sentences:
      - id: hb-c06-u0079-s001
        start: 0
        end: 51
  - type: paragraph
    id: hb-c06-u0080
    text: Såväl män som kvinnor och barn kan vara offer till människohandel. Förövarna kan vara yrkesbrottslingar
      men även offrets bekanta, vänner eller släktingar.
    sentences:
    - id: hb-c06-u0080-s001
      start: 0
      end: 66
    - id: hb-c06-u0080-s002
      start: 67
      end: 154
  - type: paragraph
    id: hb-c06-u0081
    text: Människohandelns offer kan få hjälp. Om du misstänker att du är offer för människohandel, kontakta
      Hjälpsystemet för offer för människohandel. Du hittar kontaktuppgifterna på webbplatsen ihmiskauppa.fi.
    sentences:
    - id: hb-c06-u0081-s001
      start: 0
      end: 36
    - id: hb-c06-u0081-s002
      start: 37
      end: 142
    - id: hb-c06-u0081-s003
      start: 143
      end: 202
  - type: paragraph
    id: hb-c06-u0082
    text: Om du har blivit utsatt för ett brott, kan du få hjälp och råd vid Brottsofferjouren. Du kan
      kontakta Brottsofferjouren per telefon eller via chatten eller besöka servicepunkten. Brottsofferjouren
      (Rikosuhripäivystys) erbjuder även kostnadsfri rådgivning av en jurist.
    sentences:
    - id: hb-c06-u0082-s001
      start: 0
      end: 85
    - id: hb-c06-u0082-s002
      start: 86
      end: 178
    - id: hb-c06-u0082-s003
      start: 179
      end: 268
- id: hb-c06-brottsoffer
  title: Brottsoffers rättigheter och stöd
  blocks:
  - type: paragraph
    id: hb-c06-u0083
    text: När det är fråga om en nödsituation och hjälp behövs till platsen genast ska man ringa nödnumret
      112. En nödsituation är när någons liv, hälsa, egendom eller omgivning är i fara.
    sentences:
    - id: hb-c06-u0083-s001
      start: 0
      end: 101
    - id: hb-c06-u0083-s002
      start: 102
      end: 178
  - type: paragraph
    id: hb-c06-u0084
    text: 'Det är viktigt att söka hjälp om man faller offer för ett brott. Det kan vara svårt att klara
      av situationen på egen hand. Till exempel på följande ställen kan man få hjälp:'
    sentences:
    - id: hb-c06-u0084-s001
      start: 0
      end: 64
    - id: hb-c06-u0084-s002
      start: 65
      end: 122
    - id: hb-c06-u0084-s003
      start: 123
      end: 173
  - type: paragraph
    id: hb-c06-u0085
    text: 'Brottsofferjouren: Brottsofferjouren RIKU är en avgiftsfri tjänst som kan användas av brottsoffer,
      närstående till offer och vittnen. Hos brottsofferjouren kan man få rådgivning eller en stödperson
      för olika faser av straffprocessen.'
    sentences:
    - id: hb-c06-u0085-s001
      start: 0
      end: 133
    - id: hb-c06-u0085-s002
      start: 134
      end: 233
  - type: paragraph
    id: hb-c06-u0086
    text: 'Skyddshem: På många orter finns skyddshem. Man kan komma till ett sådant ensam eller tillsammans
      med sina barn om det förekommer våld eller hot om våld hemma. På ett skyddshem kan man bo tillfälligt,
      och där får man hjälp för att ta sig ur våldet. Förbundet för mödra- och skyddshem och det egna
      välfärdsområdets socialtjänster ger mer information om skyddshemmen.'
    sentences:
    - id: hb-c06-u0086-s001
      start: 0
      end: 42
    - id: hb-c06-u0086-s002
      start: 43
      end: 158
    - id: hb-c06-u0086-s003
      start: 159
      end: 247
    - id: hb-c06-u0086-s004
      start: 248
      end: 364
  - type: paragraph
    id: hb-c06-u0087
    text: 'Hjälpsystemet för offer för människohandel: Hjälpsystemet för offer för människohandel hjälper
      människor som har utsatts för människohandel.'
    sentences:
    - id: hb-c06-u0087-s001
      start: 0
      end: 140
  - type: paragraph
    id: hb-c06-u0088
    text: 'Föreningar: Många föreningar hjälper människor som har upplevt våld eller hot om våld. Också
      närstående till offer får hjälp. Sådana föreningar är till exempel förbundet Monika-Naiset liittos
      Kriscenter Monika och Kvinnolinjen.'
    sentences:
    - id: hb-c06-u0088-s001
      start: 0
      end: 86
    - id: hb-c06-u0088-s002
      start: 87
      end: 125
    - id: hb-c06-u0088-s003
      start: 126
      end: 227
  - id: hb-c06-u0090
    type: list
    ordered: false
    items:
    - id: hb-c06-u0089
      text: 'Kommunen, välfärdsområdet och församlingarna: Man kan också söka hjälp hos kommunens eller
        stadens rådgivningstjänster, välfärdsområdets socialtjänster, hälsocentralen, familjerådgivningen
        eller till exempel kyrkans familjerådgivningscentral.'
      sentences:
      - id: hb-c06-u0089-s001
        start: 0
        end: 242
- id: hb-c06-forundersokning
  title: Förundersökning, medling och åtal
  blocks:
  - type: paragraph
    id: hb-c06-u0091
    text: I Finland bedömer en domstol vad den lagenliga lösningen är i konfliktsituationer eller om ett
      brott har begåtts. Den kan också utdöma straff. Strafflagen fastställer vilka handlingar man får
      straff för och vad straffet kan vara.
    sentences:
    - id: hb-c06-u0091-s001
      start: 0
      end: 113
    - id: hb-c06-u0091-s002
      start: 114
      end: 142
    - id: hb-c06-u0091-s003
      start: 143
      end: 229
  - type: paragraph
    id: hb-c06-u0092
    text: Om polisen har skäl att misstänka att ett brott har begåtts inleds en förundersökning. Under
      förundersökningen utreder polisen närmare vad som har hänt. Om det i förundersökningen konstateras
      att ett brott har begåtts, överför polisen ärendet till en åklagare. Polisen kan också ålägga gärningsmannen
      böter eller föreslå medling mellan parterna.
    sentences:
    - id: hb-c06-u0092-s001
      start: 0
      end: 86
    - id: hb-c06-u0092-s002
      start: 87
      end: 152
    - id: hb-c06-u0092-s003
      start: 153
      end: 260
    - id: hb-c06-u0092-s004
      start: 261
      end: 345
  - type: paragraph
    id: hb-c06-u0093
    text: Om det är fråga om ett brott som hör under allmänt åtal, utreder polisen brottet även om offret
      för brottet inte kräver det. Sådana brott är till exempel brott mot liv och misshandel.
    sentences:
    - id: hb-c06-u0093-s001
      start: 0
      end: 124
    - id: hb-c06-u0093-s002
      start: 125
      end: 183
  - type: paragraph
    id: hb-c06-u0094
    text: Om det är fråga om ett målsägandebrott, utreder polisen brottet endast om målsäganden själv
      vill det. Målsägandebrott är till exempel ärekränkning och hemfridsbrott.
    sentences:
    - id: hb-c06-u0094-s001
      start: 0
      end: 101
    - id: hb-c06-u0094-s002
      start: 102
      end: 165
  - type: paragraph
    id: hb-c06-u0095
    text: Medling betyder att man löser ett ärende och till exempel kommer överens om betalning av ersättning
      mellan parterna utan att ärendet behandlas i en domstol. Medling är alltid frivillig. Dessutom bedömer
      medlingsbyrån om ärendet är lämpligt att lösa genom medling. I en medling deltar alltid utbildade
      medlare, som har som uppgift att se till att båda parterna godkänner lösningen. Resultatet av medlingen
      är rättsligt bindande för parterna.
    sentences:
    - id: hb-c06-u0095-s001
      start: 0
      end: 156
    - id: hb-c06-u0095-s002
      start: 157
      end: 185
    - id: hb-c06-u0095-s003
      start: 186
      end: 263
    - id: hb-c06-u0095-s004
      start: 264
      end: 380
    - id: hb-c06-u0095-s005
      start: 381
      end: 440
  - type: paragraph
    id: hb-c06-u0096
    text: När polisen har överfört ett ärende till en åklagare, utreder hen fallet och bestämmer om ärendet
      ska föras vidare till domstol. Åklagaren kan bestämma att inget åtal väcks, om till exempel brottet
      är ringa eller man redan har gjort en förlikning i ärendet. Åklagaren kan också påföra gärningsmannen
      böter eller föreslå förlikning mellan parterna.
    sentences:
    - id: hb-c06-u0096-s001
      start: 0
      end: 128
    - id: hb-c06-u0096-s002
      start: 129
      end: 257
    - id: hb-c06-u0096-s003
      start: 258
      end: 347
- id: hb-c06-domstolar
  title: Domstolar och rättegång
  blocks:
  - type: paragraph
    id: hb-c06-u0097
    text: 'Finland har ett domstolssystem i tre steg: tingsrätter, hovrätter och högsta domstolen. I Finland
      finns det också en förvaltningsdomstol, som behandlar främst ärenden som gäller myndigheter och
      deras verksamhet. Som högsta förvaltningsdomstol verkar högsta förvaltningsdomstolen. Utöver dessa
      finns det också specialdomstolar, till exempel en arbetsdomstol, en försäkringsdomstol och en marknadsdomstol.'
    sentences:
    - id: hb-c06-u0097-s001
      start: 0
      end: 87
    - id: hb-c06-u0097-s002
      start: 88
      end: 211
    - id: hb-c06-u0097-s003
      start: 212
      end: 279
    - id: hb-c06-u0097-s004
      start: 280
      end: 403
  - type: paragraph
    id: hb-c06-u0098
    text: I rätten bedömer domarna om bevisen i fallen är tillförlitliga. Sedan utfärdar de domar i fallen
      de behandlar. I en del länder bedöms bevisen av en jury eller så kan landets rättssystem basera
      sig på religionen. Också i Finland kan det ibland finnas nämndemän, det vill säga lekmannadomare,
      vid domstolsförhandlingar, om det är fråga om ett grovt eller allvarligt brottmål. I sådana fall
      är det i allmänhet en nämndemannasammansättning bestående av en yrkesdomare och två nämndemän som
      beslutar om domen. Varje medlem i sammansättningen har samma makt i beslutsfattandet.
    sentences:
    - id: hb-c06-u0098-s001
      start: 0
      end: 63
    - id: hb-c06-u0098-s002
      start: 64
      end: 110
    - id: hb-c06-u0098-s003
      start: 111
      end: 211
    - id: hb-c06-u0098-s004
      start: 212
      end: 373
    - id: hb-c06-u0098-s005
      start: 374
      end: 504
    - id: hb-c06-u0098-s006
      start: 505
      end: 571
  - type: paragraph
    id: hb-c06-u0099
    text: Om åklagaren väcker åtal, behandlas ärendet i en domstol, det vill säga i rätten. Domstolen
      löser meningsskiljaktigheter och avgör om lagen har brutits.
    sentences:
    - id: hb-c06-u0099-s001
      start: 0
      end: 81
    - id: hb-c06-u0099-s002
      start: 82
      end: 152
  - type: paragraph
    id: hb-c06-u0100
    text: Den första rättsinstansen är tingsrätten, som fäller en dom i ärendet. Förhandlingen i tingsrätten
      kan ske muntligt eller skriftligt. Vid en muntlig förhandling berättar parterna (den åtalade, målsäganden,
      det vill säga offret, och åklagaren) vad som har hänt ur sitt perspektiv.
    sentences:
    - id: hb-c06-u0100-s001
      start: 0
      end: 70
    - id: hb-c06-u0100-s002
      start: 71
      end: 133
    - id: hb-c06-u0100-s003
      start: 134
      end: 279
  - type: paragraph
    id: hb-c06-u0101
    text: Vid en rättegång kan rätten höra experter och vittnen. Parterna kan anlita ett biträde för domstolsförhandlingen.
      Ibland kan rätten höra vittnen också per telefon eller via videoförbindelse.
    sentences:
    - id: hb-c06-u0101-s001
      start: 0
      end: 54
    - id: hb-c06-u0101-s002
      start: 55
      end: 113
    - id: hb-c06-u0101-s003
      start: 114
      end: 190
  - type: paragraph
    id: hb-c06-u0102
    text: Om ett vittne är rädd, kan rätten höra hen vid en annan tidpunkt än den åtalade eller bakom
      en skärmvägg. Då behöver vittnet inte se eller träffa den åtalade i rätten. I extremfall kan ett
      vittnesskyddsprogram inledas för ett vittne som innebär att hen tillfälligt får ett nytt namn och
      en ny bostadsort.
    sentences:
    - id: hb-c06-u0102-s001
      start: 0
      end: 105
    - id: hb-c06-u0102-s002
      start: 106
      end: 167
    - id: hb-c06-u0102-s003
      start: 168
      end: 304
- id: hb-c06-overklagande
  title: Överklagande och rättegångskostnader
  blocks:
  - type: paragraph
    id: hb-c06-u0103
    text: Om en person är missnöjd med tingsrättens beslut, kan hen överklaga till följande rättsinstans,
      som är hovrätten. Hovrätten behandlar överklaganden av tingsrättens beslut. Ibland kan hovrätten
      ändra tingsrättens beslut.
    sentences:
    - id: hb-c06-u0103-s001
      start: 0
      end: 113
    - id: hb-c06-u0103-s002
      start: 114
      end: 171
    - id: hb-c06-u0103-s003
      start: 172
      end: 219
  - type: paragraph
    id: hb-c06-u0104
    text: Om parterna inte är nöjda med hovrättens beslut, kan de ansöka om besvärstillstånd till högsta
      domstolen. I Finland är högsta domstolen den sista och högsta rättsinstansen. Högsta domstolen behandlar
      bara ärenden som har fått besvärstillstånd till högsta domstolen. Besvärstillstånd beviljas endast
      sällan.
    sentences:
    - id: hb-c06-u0104-s001
      start: 0
      end: 105
    - id: hb-c06-u0104-s002
      start: 106
      end: 172
    - id: hb-c06-u0104-s003
      start: 173
      end: 265
    - id: hb-c06-u0104-s004
      start: 266
      end: 306
  - type: paragraph
    id: hb-c06-u0105
    text: Högsta domstolen behandlar samhälleligt viktiga ärenden. Sådana är bland annat ärenden som det
      tidigare inte har utfärdats något domstolsbeslut i och som senare kan bli prejudikatfall. Tingsrätterna
      och hovrätterna följer i allmänhet prejudikatfall när de beslutar om domar i framtida liknande fall.
    sentences:
    - id: hb-c06-u0105-s001
      start: 0
      end: 56
    - id: hb-c06-u0105-s002
      start: 57
      end: 184
    - id: hb-c06-u0105-s003
      start: 185
      end: 299
  - type: paragraph
    id: hb-c06-u0106
    text: Om man upplever att man inte har blivit behandlad på det sätt som de mänskliga rättigheterna
      förutsätter i en rättegångsförhandling i Finland, kan man vidare överklaga till Europadomstolen.
      Man kan anföra klagomål om alla rättsliga medel i Finland har använts.
    sentences:
    - id: hb-c06-u0106-s001
      start: 0
      end: 189
    - id: hb-c06-u0106-s002
      start: 190
      end: 260
  - type: paragraph
    id: hb-c06-u0107
    text: Kostnaderna för en rättegång består av rättegångsavgiften, arvoden till rättegångsbiträden,
      till exempel advokater, och de ersättningar som betalas till vittnen.
    sentences:
    - id: hb-c06-u0107-s001
      start: 0
      end: 161
  - type: paragraph
    id: hb-c06-u0108
    text: I tvistemål, det vill säga meningsskiljaktigheter mellan privatpersoner eller till exempel företag,
      är den part som förlorat tvisten ofta tvungen att betala också den andra partens rättegångskostnader.
      Ibland ansvarar vardera parten för sina respektive kostnader. Rädslan för höga kostnader kan ibland
      hindra människor från att ta tvistemål till rätten.
    sentences:
    - id: hb-c06-u0108-s001
      start: 0
      end: 201
    - id: hb-c06-u0108-s002
      start: 202
      end: 263
    - id: hb-c06-u0108-s003
      start: 264
      end: 353
  - type: paragraph
    id: hb-c06-u0109
    text: I brottmål ålägger rätten ofta den åtalade att betala rättegångskostnaderna, om hen konstateras
      vara skyldig. Om den åtalade konstateras vara oskyldig, kan hen ansöka om ersättning för sina rättegångskostnader.
    sentences:
    - id: hb-c06-u0109-s001
      start: 0
      end: 109
    - id: hb-c06-u0109-s002
      start: 110
      end: 210
- id: hb-c06-straff
  title: Straff och skadestånd
  blocks:
  - type: paragraph
    id: hb-c06-u0110
    text: Olika myndigheter, polisen, åklagaren och domstolarna kan utdöma straff åt dem som gjort sig
      skyldiga till brott. I Finland får bara den som begått brottet ett straff, inte förbrytarens familj.
    sentences:
    - id: hb-c06-u0110-s001
      start: 0
      end: 113
    - id: hb-c06-u0110-s002
      start: 114
      end: 193
  - type: paragraph
    id: hb-c06-u0111
    text: Om brottet inte är särskilt allvarligt, kan straffet vara böter, som betalas till staten. Andra
      vanliga straff i Finland är fängelse, samhällstjänst och övervakningsstraff. Ett fängelsestraff
      kan vara ovillkorligt, varvid straffet avtjänas i fängelse, eller villkorligt. Villkorligt fängelsestraff
      betyder att den dömde inte hamnar direkt i fängelse, utan får en prövotid. Om hen inte gör sig skyldig
      till nya brott under prövotiden, behöver hen inte avtjäna straffet i fängelse.
    sentences:
    - id: hb-c06-u0111-s001
      start: 0
      end: 89
    - id: hb-c06-u0111-s002
      start: 90
      end: 172
    - id: hb-c06-u0111-s003
      start: 173
      end: 270
    - id: hb-c06-u0111-s004
      start: 271
      end: 372
    - id: hb-c06-u0111-s005
      start: 373
      end: 479
  - type: paragraph
    id: hb-c06-u0112
    text: Utöver straffet kan man bli tvungen att betala skadestånd till offren. En utländsk medborgare
      som dömts för ett brott kan i vissa fall förvisas från Finland. Då förfaller hens uppehållstillstånd
      och hen måste lämna landet.
    sentences:
    - id: hb-c06-u0112-s001
      start: 0
      end: 70
    - id: hb-c06-u0112-s002
      start: 71
      end: 157
    - id: hb-c06-u0112-s003
      start: 158
      end: 222
  - type: paragraph
    id: hb-c06-u0113
    text: I Finland tillämpas inte dödsstraff.
    sentences:
    - id: hb-c06-u0113-s001
      start: 0
      end: 36
  - type: paragraph
    id: hb-c06-u0114
    text: Om en person begår ett brott, får hen en anteckning i straffregistret. Straffregistret är en
      databas med uppgifter om alla som är dömda för brott. Böter ger i allmänhet ingen anteckning i straffregistret,
      medan alla andra straff gör det.
    sentences:
    - id: hb-c06-u0114-s001
      start: 0
      end: 70
    - id: hb-c06-u0114-s002
      start: 71
      end: 146
    - id: hb-c06-u0114-s003
      start: 147
      end: 237
  - type: paragraph
    id: hb-c06-u0115
    text: En anteckning i straffregistret kan hindra eller göra det svårare för en person att få uppehållstillstånd
      och vissa arbeten. Hur länge uppgifterna sparas i straffregistret beror på hur strängt straffet
      är.
    sentences:
    - id: hb-c06-u0115-s001
      start: 0
      end: 124
    - id: hb-c06-u0115-s002
      start: 125
      end: 205
  - type: paragraph
    id: hb-c06-u0116
    text: Om det är fråga om ett lindrigt brott, kan polisen eller åklagaren utdöma ordningsböter eller
      dagsböter. Då inleds ingen straffprocess och ärendet behandlas inte i rätten. Både den som böterna
      utdöms till och det eventuella offret för brottet ska gå med på att ärendet behandlas i ett bötesförfarande.
      Om antingen gärningsmannen eller offret motsätter sig ett bötesförfarande, inleds en straffprocess
      i ärendet.
    sentences:
    - id: hb-c06-u0116-s001
      start: 0
      end: 104
    - id: hb-c06-u0116-s002
      start: 105
      end: 171
    - id: hb-c06-u0116-s003
      start: 172
      end: 301
    - id: hb-c06-u0116-s004
      start: 302
      end: 411
  - type: paragraph
    id: hb-c06-u0117
    text: Beloppet av en dagsbot beror både på hur allvarligt brottet är och på personens inkomster. På
      basis av brottets allvarlighetsgrad bestämmer myndigheten för hur många dagar man måste betala böter.
      Dagsbotens belopp beräknas utifrån inkomsterna. En person med höga inkomster måste alltså betala
      mycket mer i böter än en person med låga inkomster. Tanken är att det skulle vara orättvist om böterna
      var lika stora för alla, eftersom det i sådana fall skulle vara ett strängare straff för en låginkomsttagare
      än för en höginkomsttagare. Dagsböter kan utdömas för till exempel snatteri och de flesta trafikbrott.
    sentences:
    - id: hb-c06-u0117-s001
      start: 0
      end: 90
    - id: hb-c06-u0117-s002
      start: 91
      end: 195
    - id: hb-c06-u0117-s003
      start: 196
      end: 243
    - id: hb-c06-u0117-s004
      start: 244
      end: 344
    - id: hb-c06-u0117-s005
      start: 345
      end: 532
    - id: hb-c06-u0117-s006
      start: 533
      end: 607
- id: hb-c06-unga
  title: Barn och unga i rättssystemet
  blocks:
  - type: paragraph
    id: hb-c06-u0118
    text: Barn under 15 år är inte straffrättsligt ansvariga i Finland. Om de begår ett brott, ställs
      de inte inför rätta. De har ändå ersättningsansvar, det vill säga de måste ersätta skadorna de orsakat.
      Skador som måste ersättas kan vara till exempel sönderslagen egendom, eller skada eller lidande
      som orsakats en annan människa. Ofta betalar barnet i praktiken ersättningen först i vuxen ålder
      när hen börjar få arbetsinkomster.
    sentences:
    - id: hb-c06-u0118-s001
      start: 0
      end: 61
    - id: hb-c06-u0118-s002
      start: 62
      end: 112
    - id: hb-c06-u0118-s003
      start: 113
      end: 195
    - id: hb-c06-u0118-s004
      start: 196
      end: 323
    - id: hb-c06-u0118-s005
      start: 324
      end: 423
  - type: paragraph
    id: hb-c06-u0119
    text: Om ett barn under 15 år begår ett brott, görs en barnskyddsanmälan om hen. En barnskyddsanmälan
      innebär en anmälan till de sociala myndigheterna. De sociala myndigheterna utreder barnets situation
      och tar reda på hur de kan hjälpa hen. I de allvarligaste fallen kan barnet omhändertas och till
      exempel placeras på en sluten anstalt, om det är nödvändigt med tanke på hens egen och andras säkerhet.
    sentences:
    - id: hb-c06-u0119-s001
      start: 0
      end: 74
    - id: hb-c06-u0119-s002
      start: 75
      end: 145
    - id: hb-c06-u0119-s003
      start: 146
      end: 235
    - id: hb-c06-u0119-s004
      start: 236
      end: 397
  - type: paragraph
    id: hb-c06-u0120
    text: Om en gärningsman är en ung person i åldern 15–17 år kan rätten utdöma ett ungdomsstraff till
      hen. Syftet med det är att hindra den unga från att begå nya brott eller bli socialt utslagen. Ett
      ungdomsstraff kan vara till exempel övervakat oavlönat arbete eller deltagande i olika program som
      främjar den ungas förmåga att agera i sociala situationer.
    sentences:
    - id: hb-c06-u0120-s001
      start: 0
      end: 98
    - id: hb-c06-u0120-s002
      start: 99
      end: 188
    - id: hb-c06-u0120-s003
      start: 189
      end: 350
- id: hb-c06-rattshjalp
  title: Rättshjälp och biträde
  blocks:
  - type: paragraph
    id: hb-c06-u0121
    text: I Finland har alla rätt till rättshjälp om de har juridiska problem. Staten hjälper mindre bemedlade
      vars inkomster inte räcker till för att betala till exempel advokatarvoden. Rättshjälpen kan vara
      till exempel en advokat eller ett allmänt rättsbiträde vid en rättegång, juridisk rådgivning, hjälp
      vid förlikningsförhandlingar och uppgörande av olika dokument, avtal eller klagomål. Om en person
      behöver offentlig rättshjälp, ska hen ansöka om det hos en rättshjälpsbyrå.
    sentences:
    - id: hb-c06-u0121-s001
      start: 0
      end: 68
    - id: hb-c06-u0121-s002
      start: 69
      end: 176
    - id: hb-c06-u0121-s003
      start: 177
      end: 383
    - id: hb-c06-u0121-s004
      start: 384
      end: 472
  - type: paragraph
    id: hb-c06-u0122
    text: Den som är åtalad för ett brott har rätt att få en försvarsadvokat. Ibland förordnar domstolen
      på eget initiativ en försvarare åt den åtalade, om den åtalade är minderårig eller av någon annan
      orsak inte kan försvara sig själv. Brottsoffret kan få ett biträde eller en stödperson för rättegången.
    sentences:
    - id: hb-c06-u0122-s001
      start: 0
      end: 67
    - id: hb-c06-u0122-s002
      start: 68
      end: 227
    - id: hb-c06-u0122-s003
      start: 228
      end: 296
  - type: paragraph
    id: hb-c06-u0123
    text: Flyktingrådgivningen bistår med juridisk hjälp i asylprocesser och även i andra processer gällande
      uppehållstillstånd. Flyktingrådgivningen ger även allmän juridisk rådgivning i frågor kring asyl
      och uppehållstillstånd.
    sentences:
    - id: hb-c06-u0123-s001
      start: 0
      end: 118
    - id: hb-c06-u0123-s002
      start: 119
      end: 219
  - type: paragraph
    id: hb-c06-u0124
    text: Du kan även vända dig till en rättshjälpsbyrå om du behöver rådgivning eller rättshjälp i ett
      uppehållstillståndsärende.
    sentences:
    - id: hb-c06-u0124-s001
      start: 0
      end: 120
