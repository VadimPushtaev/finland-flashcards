schema_version: 1
id: hb-c10
language: sv
title: Hälsa, social trygghet och åldrande
sections:
- id: hb-c10-valfard
  title: Välfärd och social trygghet
  blocks:
  - type: paragraph
    id: hb-c10-u0001
    text: Med nordisk välfärdsstat avses att staten garanterar förutsättningar för ett människovärdigt
      liv för alla sina invånare. Viktiga tjänster och tjänster som främjar människornas välbefinnande,
      såsom hälsovård, utbildning, barnomsorg, bibliotek och många motionstjänster bekostas med skattemedel.
      De är förmånliga eller till och med kostnadsfria för användarna. Därtill ger staten ekonomiskt stöd
      i form av olika bidrag och förmåner till människor som annars inte skulle klara sig på grund av
      till exempel sjukdom, arbetslöshet eller en svår livssituation.
    sentences:
    - id: hb-c10-u0001-s001
      start: 0
      end: 120
    - id: hb-c10-u0001-s002
      start: 121
      end: 293
    - id: hb-c10-u0001-s003
      start: 294
      end: 358
    - id: hb-c10-u0001-s004
      start: 359
      end: 553
  - type: paragraph
    id: hb-c10-u0002
    text: För att kunna erbjuda tjänster och betala ut olika stöd och förmåner behöver staten pengar.
      Därför betalar man mer skatt i en välfärdsstat än i många andra länder. Skatt betalas av såväl den
      enskilda individen som företagen. Forskning visar att de flesta människor i Finland gärna betalar
      skatt, eftersom de upplever att den välfärd det ger är värdefull.
    sentences:
    - id: hb-c10-u0002-s001
      start: 0
      end: 91
    - id: hb-c10-u0002-s002
      start: 92
      end: 163
    - id: hb-c10-u0002-s003
      start: 164
      end: 224
    - id: hb-c10-u0002-s004
      start: 225
      end: 354
  - type: paragraph
    id: hb-c10-u0003
    text: I det finländska samhället förs en ständig debatt om vilka tjänster staten bör bekosta för människorna
      och vad som är en lämplig beskattningsnivå. Det handlar om hur mycket man är beredd att betala för
      att upprätthålla välfärdsstaten. Till exempel olika politiska partier har olika åsikter om detta.
      En fri politisk debatt om hur ett bra samhälle ser ut är en del av demokratin.
    sentences:
    - id: hb-c10-u0003-s001
      start: 0
      end: 146
    - id: hb-c10-u0003-s002
      start: 147
      end: 234
    - id: hb-c10-u0003-s003
      start: 235
      end: 299
    - id: hb-c10-u0003-s004
      start: 300
      end: 378
  - type: paragraph
    id: hb-c10-u0004
    text: FPA betalar förmåner till bland andra barnfamiljer, arbetslösa, studerande, personer med funktionsnedsättning
      och dem som har en långtidssjukdom eller behöver rehabilitering. Man kan i vissa situationer även
      ansöka om stöd till boendekostnader.
    sentences:
    - id: hb-c10-u0004-s001
      start: 0
      end: 174
    - id: hb-c10-u0004-s002
      start: 175
      end: 244
  - type: paragraph
    id: hb-c10-u0005
    text: Om du är sjukförsäkrad i Finland får du ett FPA-kort. När du visar kortet får du på apoteken
      och många privata läkarstationer ersättning för dina kostnader. Då betalar du endast för självriskdelen
      i räkningen.
    sentences:
    - id: hb-c10-u0005-s001
      start: 0
      end: 53
    - id: hb-c10-u0005-s002
      start: 54
      end: 156
    - id: hb-c10-u0005-s003
      start: 157
      end: 209
  - type: paragraph
    id: hb-c10-u0006
    text: Grunderna för FPA:s bidrag definieras i lagen. När du ansöker om en förmån, utreder FPA om du
      har rätt till FPA:s förmåner. På detta inverkar ditt stadigvarande boende och arbete i Finland.
      Varje sökandes livssituation behandlas individuellt när FPA fattar beslut om bidrag.
    sentences:
    - id: hb-c10-u0006-s001
      start: 0
      end: 46
    - id: hb-c10-u0006-s002
      start: 47
      end: 123
    - id: hb-c10-u0006-s003
      start: 124
      end: 189
    - id: hb-c10-u0006-s004
      start: 190
      end: 274
  - type: paragraph
    id: hb-c10-u0007
    text: Sökandens livssituation och behov av understöd är ofta mycket olika. Därför varierar även bidragens
      belopp och grunder. Du ska alltid utreda din egen situation individuellt.
    sentences:
    - id: hb-c10-u0007-s001
      start: 0
      end: 68
    - id: hb-c10-u0007-s002
      start: 69
      end: 119
    - id: hb-c10-u0007-s003
      start: 120
      end: 173
  - type: paragraph
    id: hb-c10-u0008
    text: Huvudregeln är att om du bor stadigvarande i Finland, kan du få FPA:s förmåner. Vad stadigvarande
      boende betyder definieras i lagen.
    sentences:
    - id: hb-c10-u0008-s001
      start: 0
      end: 79
    - id: hb-c10-u0008-s002
      start: 80
      end: 132
  - type: paragraph
    id: hb-c10-u0009
    text: Du kan också få rätt till FPA:s förmåner genom att arbeta i Finland.
    sentences:
    - id: hb-c10-u0009-s001
      start: 0
      end: 68
  - type: paragraph
    id: hb-c10-u0010
    text: När du flyttar till Finland bedömer FPA alltid först om din flytt till Finland är stadigvarande
      boende i den mening som avses i lagstiftningen om social trygghet.
    sentences:
    - id: hb-c10-u0010-s001
      start: 0
      end: 162
  - type: paragraph
    id: hb-c10-u0011
    text: 'FPA kan bedöma att din flytt till Finland är stadigvarande i följande situationer:'
    sentences:
    - id: hb-c10-u0011-s001
      start: 0
      end: 82
  - id: hb-c10-u0013
    type: list
    ordered: false
    items:
    - id: hb-c10-u0012
      text: du är återflyttare, det vill säga återvänder till Finland från utlandet
      sentences:
      - id: hb-c10-u0012-s001
        start: 0
        end: 71
    - id: hb-c10-u0014
      text: du har en fast anställning eller motsvarande avtal för ett arbete som du utför i Finland
      sentences:
      - id: hb-c10-u0014-s001
        start: 0
        end: 88
    - id: hb-c10-u0015
      text: du är gift eller annars i ett nära familjeförhållande till en person som redan bor stadigvarande
        i Finland.
      sentences:
      - id: hb-c10-u0015-s001
        start: 0
        end: 107
  - type: paragraph
    id: hb-c10-u0016
    text: Dessutom kräver FPA vanligen att ditt uppehållstillstånd är giltigt, om du är skyldig att ha
      ett uppehållstillstånd.
    sentences:
    - id: hb-c10-u0016-s001
      start: 0
      end: 116
  - type: paragraph
    id: hb-c10-u0017
    text: FPA gör en helhetsbedömning av din situation. På basis av bedömningen beslutar FPA om boendet
      är stadigvarande eller inte.
    sentences:
    - id: hb-c10-u0017-s001
      start: 0
      end: 45
    - id: hb-c10-u0017-s002
      start: 46
      end: 122
  - type: paragraph
    id: hb-c10-u0018
    text: Om FPA anser att din flytt till Finland inte är stadigvarande, har du vanligen inte rätt till
      FPA:s förmåner. Du kan ändå ha rätt till vissa förmåner, till exempel på basis av ditt arbete.
    sentences:
    - id: hb-c10-u0018-s001
      start: 0
      end: 109
    - id: hb-c10-u0018-s002
      start: 110
      end: 188
  - type: paragraph
    id: hb-c10-u0019
    text: Om du flyttar till Finland för att studera, beror din rätt till FPA:s förmåner på hur länge
      dina studier varar och från vilket land du flyttar till Finland. Om du kommer från ett EU- eller
      EES-land, Schweiz eller Storbritannien, omfattas du vanligen av socialskyddet i ditt hemland. Om
      du kommer från något annat land och dina studier varar i minst 2 år, kan du har rätt till en del
      av FPA:s förmåner.
    sentences:
    - id: hb-c10-u0019-s001
      start: 0
      end: 156
    - id: hb-c10-u0019-s002
      start: 157
      end: 282
    - id: hb-c10-u0019-s003
      start: 283
      end: 401
  - type: paragraph
    id: hb-c10-u0020
    text: Det finns även bidrag som du inte kan få om du inte bor stadigvarande i Finland eller har gjort
      det tidigare. Om du kommer från ett annat EU-land kan du i vissa fall utnyttja de försäkringsperioder
      som du har ackumulerat i andra EU-länder. Fråga mer hos FPA:s center för internationella ärenden.
    sentences:
    - id: hb-c10-u0020-s001
      start: 0
      end: 109
    - id: hb-c10-u0020-s002
      start: 110
      end: 239
    - id: hb-c10-u0020-s003
      start: 240
      end: 295
- id: hb-c10-utkomststod
  title: Utkomststöd
  blocks:
  - type: paragraph
    id: hb-c10-u0021
    text: Om du eller din familj inte har tillräckliga inkomster eller tillgångar för den nödvändiga dagliga
      försörjningen kan du söka grundläggande utkomststöd hos FPA. Med den nödvändiga dagliga försörjningen
      avses skäliga utgifter till exempel för mat, kläder, hälsovård och boende. Du kan ansöka om stöd
      om du är stadigvarande bosatt i Finland.
    sentences:
    - id: hb-c10-u0021-s001
      start: 0
      end: 159
    - id: hb-c10-u0021-s002
      start: 160
      end: 275
    - id: hb-c10-u0021-s003
      start: 276
      end: 338
  - type: paragraph
    id: hb-c10-u0022
    text: Betalningen av utkomststöd påverkas av alla dina inkomster och tillgångar. I kalkylen beaktas
      även de sociala förmåner som du får till exempel av FPA, en arbetspensionsförsäkring eller arbetslöshetskassan.
    sentences:
    - id: hb-c10-u0022-s001
      start: 0
      end: 74
    - id: hb-c10-u0022-s002
      start: 75
      end: 205
  - type: paragraph
    id: hb-c10-u0023
    text: Innan du ansöker om utkomststöd ska du ansöka om de andra bidragen som du har rätt till (till
      exempel arbetslöshetsförsäkring, bostadsbidrag, pension, studiestöd, föräldradagpenning, sjukdagpenning,
      hemvårdsstöd eller underhållsstöd).
    sentences:
    - id: hb-c10-u0023-s001
      start: 0
      end: 234
  - type: paragraph
    id: hb-c10-u0024
    text: Utkomststödet är avsett som en tillfällig hjälp. Utkomststöd betalas endast om du inte kan få
      några andra inkomster och bidrag eller om dina övriga inkomster inte räcker till för de nödvändiga
      utgifterna.
    sentences:
    - id: hb-c10-u0024-s001
      start: 0
      end: 48
    - id: hb-c10-u0024-s002
      start: 49
      end: 204
  - type: paragraph
    id: hb-c10-u0025
    text: Om du eller din familj har särskilda utgifter, för vilka du inte kan få grundläggande utkomststöd,
      kan välfärdsområdet bevilja kompletterande och förebyggande utkomststöd (täydentävä ja ehkäisevä
      toimeentulotuki). Du kan få kompletterande utkomststöd till exempel för att trygga ditt boende eller
      om din ekonomiska situation plötsligt har försämrats.
    sentences:
    - id: hb-c10-u0025-s001
      start: 0
      end: 213
    - id: hb-c10-u0025-s002
      start: 214
      end: 350
- id: hb-c10-folkhalsa
  title: Hälsa och förebyggande arbete
  blocks:
  - type: paragraph
    id: hb-c10-u0026
    text: En frisk människa mår bra fysiskt, psykiskt och socialt. Hen klarar av uppgifterna och utmaningarna
      i det dagliga livet. Hälsa betyder inte bara att en människa inte har någon sjukdom. Det är människans
      förmåga att fungera i vardagen.
    sentences:
    - id: hb-c10-u0026-s001
      start: 0
      end: 56
    - id: hb-c10-u0026-s002
      start: 57
      end: 120
    - id: hb-c10-u0026-s003
      start: 121
      end: 184
    - id: hb-c10-u0026-s004
      start: 185
      end: 234
  - type: paragraph
    id: hb-c10-u0027
    text: En frisk människa klarar av att göra sådant i sitt liv som är meningsfullt för hen, till exempel
      studera, utöva hobbyer, arbeta eller ha ett socialt liv. Om en människa blir sjuk eller skadar sig
      allvarligt kan hen ofta bli tvungen att ge upp sådant som är viktigt för hen. En människa kan ändå
      uppleva att hen är handlingskraftig och välmående, trots att hen har en långvarig sjukdom. Om sjukdomen
      behandlas, kan människan leva ett gott liv trots sjukdomen.
    sentences:
    - id: hb-c10-u0027-s001
      start: 0
      end: 153
    - id: hb-c10-u0027-s002
      start: 154
      end: 273
    - id: hb-c10-u0027-s003
      start: 274
      end: 385
    - id: hb-c10-u0027-s004
      start: 386
      end: 458
  - type: paragraph
    id: hb-c10-u0028
    text: En del sjukdomar, skador och åkommor är akuta, det vill säga plötsliga, och kortvariga. Sådana
      är till exempel många inflammationer, influensor och skador. En del sjukdomar är kroniska, det vill
      säga långvariga eller bestående.
    sentences:
    - id: hb-c10-u0028-s001
      start: 0
      end: 87
    - id: hb-c10-u0028-s002
      start: 88
      end: 155
    - id: hb-c10-u0028-s003
      start: 156
      end: 227
  - type: paragraph
    id: hb-c10-u0029
    text: Många olika faktorer påverkar en människas hälsa. Det är lättare för hen att hålla sig frisk
      om hen har tillgång till goda hälsovårdstjänster. Tjänsterna hjälper människor att ha ett sunt levnadssätt.
      Med hjälp av tjänsterna kan många sjukdomar konstateras i ett tidigt skede och då bättre behandlas.
    sentences:
    - id: hb-c10-u0029-s001
      start: 0
      end: 49
    - id: hb-c10-u0029-s002
      start: 50
      end: 142
    - id: hb-c10-u0029-s003
      start: 143
      end: 200
    - id: hb-c10-u0029-s004
      start: 201
      end: 300
  - type: paragraph
    id: hb-c10-u0030
    text: Hälsa och välbefinnande främjas också på många andra sätt, till exempel
    sentences:
    - id: hb-c10-u0030-s001
      start: 0
      end: 71
  - id: hb-c10-u0032
    type: list
    ordered: false
    items:
    - id: hb-c10-u0031
      text: en mångsidig och näringsrik kost
      sentences:
      - id: hb-c10-u0031-s001
        start: 0
        end: 32
    - id: hb-c10-u0033
      text: fysisk aktivitet och motion
      sentences:
      - id: hb-c10-u0033-s001
        start: 0
        end: 27
    - id: hb-c10-u0034
      text: tillräckligt med sömn och vila
      sentences:
      - id: hb-c10-u0034-s001
        start: 0
        end: 30
    - id: hb-c10-u0035
      text: tillräcklig utkomst
      sentences:
      - id: hb-c10-u0035-s001
        start: 0
        end: 19
    - id: hb-c10-u0036
      text: skäliga boendeförhållanden
      sentences:
      - id: hb-c10-u0036-s001
        start: 0
        end: 26
    - id: hb-c10-u0037
      text: goda sociala relationer
      sentences:
      - id: hb-c10-u0037-s001
        start: 0
        end: 23
    - id: hb-c10-u0038
      text: fred i samhället
      sentences:
      - id: hb-c10-u0038-s001
        start: 0
        end: 16
    - id: hb-c10-u0039
      text: ett rättvist och demokratiskt samhälle
      sentences:
      - id: hb-c10-u0039-s001
        start: 0
        end: 38
    - id: hb-c10-u0040
      text: tillräcklig utbildning
      sentences:
      - id: hb-c10-u0040-s001
        start: 0
        end: 22
    - id: hb-c10-u0041
      text: möjlighet att arbeta eller bedriva annan nyttig verksamhet i samhället.
      sentences:
      - id: hb-c10-u0041-s001
        start: 0
        end: 71
  - type: paragraph
    id: hb-c10-u0042
    text: Det finländska välfärdssamhället ser på många sätt till att människor håller sig så friska som
      möjligt. För det har det stiftats lagar i syfte att främja medborgarnas hälsa. Ett exempel är tobakslagen,
      som begränsar tobaksrökning på offentliga platser. Rökning är ohälsosam och orsakar sjukdomar för
      rökarna själva och för dem som är tvungna att andas in tobaksröken.
    sentences:
    - id: hb-c10-u0042-s001
      start: 0
      end: 103
    - id: hb-c10-u0042-s002
      start: 104
      end: 173
    - id: hb-c10-u0042-s003
      start: 174
      end: 252
    - id: hb-c10-u0042-s004
      start: 253
      end: 367
  - type: paragraph
    id: hb-c10-u0043
    text: I Finland samlar man hela tiden in forskningsdata om människors hälsa och sjukdomar. Med hjälp
      av informationen kan man i samhället planera och genomföra program som främjar hälsan. Programmen
      kan gälla till exempel hjärt- och kärlsjukdomar eller cancersjukdomar.
    sentences:
    - id: hb-c10-u0043-s001
      start: 0
      end: 84
    - id: hb-c10-u0043-s002
      start: 85
      end: 181
    - id: hb-c10-u0043-s003
      start: 182
      end: 263
  - type: paragraph
    id: hb-c10-u0044
    text: I Finland arbetar också olika organisationer mycket för att främja hälsa. För många långtidssjuka
      finns egna föreningar som kan ge de sjuka och deras närstående stöd och information.
    sentences:
    - id: hb-c10-u0044-s001
      start: 0
      end: 73
    - id: hb-c10-u0044-s002
      start: 74
      end: 182
  - type: paragraph
    id: hb-c10-u0045
    text: Inom den grundläggande utbildningen för barn är hälsokunskap ett separat läroämne. Syftet med
      undervisningen i hälsokunskap är att främja elevernas kunskaper om hälsa, välbefinnande och säkerhet.
    sentences:
    - id: hb-c10-u0045-s001
      start: 0
      end: 82
    - id: hb-c10-u0045-s002
      start: 83
      end: 195
  - type: paragraph
    id: hb-c10-u0046
    text: Människornas hälsa observeras också med hjälp av screeningar. En screening är en undersökning
      där man letar efter tecken på allvarlig sjukdom. Exempel på sådana sjukdomar kan vara till exempel
      livmoderhalscancer, bröstcancer eller tarmcancer. Behandlingsresultaten blir bättre när sjukdomar
      upptäcks i ett tidigt skede.
    sentences:
    - id: hb-c10-u0046-s001
      start: 0
      end: 61
    - id: hb-c10-u0046-s002
      start: 62
      end: 142
    - id: hb-c10-u0046-s003
      start: 143
      end: 242
    - id: hb-c10-u0046-s004
      start: 243
      end: 319
  - type: paragraph
    id: hb-c10-u0047
    text: I Finland är det lätt att hitta information om hur man främjar sin hälsa och sitt välbefinnande
      till exempel på internet, biblioteken, hos läkaren eller olika hälsoorganisationer. Dessutom erbjuder
      välfärdsområdena och olika organisationer och företag många olika slags vårdtjänster, motionsgrenar,
      välbefinnanderådgivning och kostrådgivning samt olika kulturtjänster. De hjälper folk att hålla
      sig friska och må bra. För barn är skolan en viktig uppväxtmiljö som ger deras vardag struktur och
      där de också lär sig att främja hälsa och välbefinnande.
    sentences:
    - id: hb-c10-u0047-s001
      start: 0
      end: 179
    - id: hb-c10-u0047-s002
      start: 180
      end: 368
    - id: hb-c10-u0047-s003
      start: 369
      end: 417
    - id: hb-c10-u0047-s004
      start: 418
      end: 550
  - type: paragraph
    id: hb-c10-u0048
    text: I Finland kan barnen vaccineras (rokotus) mot många smittsamma sjukdomar. Vaccinationerna ges
      på barnrådgivningen (lastenneuvola) och inom skolhälsovården. De vaccinationer som ingår i vaccinationsprogrammet
      är avgiftsfria för familjen. Vaccinationerna är frivilliga. De flesta barn i Finland får de vaccinationer
      som ingår i vaccinationsprogrammet. Berätta för hälsovårdaren vilka vaccinationer ditt barn har
      fått innan ni kom till Finland.
    sentences:
    - id: hb-c10-u0048-s001
      start: 0
      end: 73
    - id: hb-c10-u0048-s002
      start: 74
      end: 155
    - id: hb-c10-u0048-s003
      start: 156
      end: 236
    - id: hb-c10-u0048-s004
      start: 237
      end: 267
    - id: hb-c10-u0048-s005
      start: 268
      end: 349
    - id: hb-c10-u0048-s006
      start: 350
      end: 441
  - type: paragraph
    id: hb-c10-u0049
    text: I Finland finns ett vaccinationsprogram, enligt vilket alla barn erbjuds kostnadsfria vaccinationer
      mot fler livsfarliga sjukdomar. Vaccinationer erbjuds mot bland annat polio, stelkramp, difteri,
      kikhosta, mässling och påssjuka.
    sentences:
    - id: hb-c10-u0049-s001
      start: 0
      end: 131
    - id: hb-c10-u0049-s002
      start: 132
      end: 229
  - type: paragraph
    id: hb-c10-u0050
    text: Om du ingår i en riskgrupp för influensa, kan du också få en kostnadsfri vaccination mot influensa.
      Detta gäller för både vuxna och barn.
    sentences:
    - id: hb-c10-u0050-s001
      start: 0
      end: 99
    - id: hb-c10-u0050-s002
      start: 100
      end: 137
  - type: paragraph
    id: hb-c10-u0051
    text: När du flyttar till Finland ska du ta reda på vilka vaccinationer enligt vaccinationsprogrammet
      du saknar. Om du inte har fått alla vaccinationer enligt vaccinationsprogrammet kan du få dem kostnadsfritt
      om du flyttar till Finland stadigvarande.
    sentences:
    - id: hb-c10-u0051-s001
      start: 0
      end: 106
    - id: hb-c10-u0051-s002
      start: 107
      end: 245
  - type: paragraph
    id: hb-c10-u0052
    text: Om du har ansökt om asyl eller tillfälligt skydd i Finland kan du få vaccinationerna om du är
      minderårig eller gravid.
    sentences:
    - id: hb-c10-u0052-s001
      start: 0
      end: 118
- id: hb-c10-vard
  title: Offentlig och privat hälsovård
  blocks:
  - type: paragraph
    id: hb-c10-u0053
    text: Offentliga hälsovårdstjänster är avsedda för personer som är permanent bosatta i Finland. En
      del av de offentliga hälsovårdstjänsterna är avgiftsfria och för en del tas en klientavgift ut.
      Tjänsterna är förmånliga, eftersom de betalas med statens skattepengar. Fakturan för användningen
      av en tjänst skickas till klienten i efterhand.
    sentences:
    - id: hb-c10-u0053-s001
      start: 0
      end: 89
    - id: hb-c10-u0053-s002
      start: 90
      end: 188
    - id: hb-c10-u0053-s003
      start: 189
      end: 260
    - id: hb-c10-u0053-s004
      start: 261
      end: 334
  - type: paragraph
    id: hb-c10-u0054
    text: Det lokala välfärdsområdet ansvarar för ordnandet av de offentliga hälsovårdstjänsterna. Det
      finns 21 välfärdsområden i Finland som baserar sig på landskapen i landet. I Helsingfors är det
      staden som ordnar social- och hälsovårdstjänsterna.
    sentences:
    - id: hb-c10-u0054-s001
      start: 0
      end: 88
    - id: hb-c10-u0054-s002
      start: 89
      end: 167
    - id: hb-c10-u0054-s003
      start: 168
      end: 240
  - type: paragraph
    id: hb-c10-u0055
    text: Hälsovårds- och socialtjänsterna på vårdcentralerna är till exempel
    sentences:
    - id: hb-c10-u0055-s001
      start: 0
      end: 67
  - id: hb-c10-u0057
    type: list
    ordered: false
    items:
    - id: hb-c10-u0056
      text: läkar- eller sjukskötarmottagningar
      sentences:
      - id: hb-c10-u0056-s001
        start: 0
        end: 35
    - id: hb-c10-u0058
      text: tandvård
      sentences:
      - id: hb-c10-u0058-s001
        start: 0
        end: 8
    - id: hb-c10-u0059
      text: mödra- och barnrådgivningar
      sentences:
      - id: hb-c10-u0059-s001
        start: 0
        end: 27
    - id: hb-c10-u0060
      text: tjänster inom psykiatri och missbrukarvård
      sentences:
      - id: hb-c10-u0060-s001
        start: 0
        end: 42
    - id: hb-c10-u0061
      text: tjänster inom socialarbete och socialhandledning
      sentences:
      - id: hb-c10-u0061-s001
        start: 0
        end: 48
    - id: hb-c10-u0062
      text: rehabiliteringstjänster och funktionshinderservice
      sentences:
      - id: hb-c10-u0062-s001
        start: 0
        end: 50
    - id: hb-c10-u0063
      text: laboratorieundersökningar.
      sentences:
      - id: hb-c10-u0063-s001
        start: 0
        end: 26
  - type: paragraph
    id: hb-c10-u0064
    text: Offentliga hälsovårdstjänster för skolelever ordnas delvis på skolorna och delvis på vårdcentralerna.
      Skolhälsovården för barn och unga omfattar bland annat tandvård, regelbundna hälso- och läkarkontroller
      och hälsorådgivning.
    sentences:
    - id: hb-c10-u0064-s001
      start: 0
      end: 101
    - id: hb-c10-u0064-s002
      start: 102
      end: 226
  - type: paragraph
    id: hb-c10-u0065
    text: En person som flyttat till eller arbetar i Finland kan ansöka om ett FPA-kort, det vill säga
      ett sjukförsäkringskort. Genom att visa kortet får man direktersättning för medicin- och läkarkostnader
      på apoteken och de flesta privata läkarstationer. Då dras den FPA-ersättning som kunden har rätt
      till av på medicinens eller läkarbesökets pris och hen behöver betala endast självrisken. Om man
      inte har något FPA-kort, kan man ansöka om ersättningar i efterhand.
    sentences:
    - id: hb-c10-u0065-s001
      start: 0
      end: 117
    - id: hb-c10-u0065-s002
      start: 118
      end: 246
    - id: hb-c10-u0065-s003
      start: 247
      end: 383
    - id: hb-c10-u0065-s004
      start: 384
      end: 459
  - type: paragraph
    id: hb-c10-u0066
    text: När man ringer en hälsostation för att boka tid måste man berätta varför man vill ha vård. Den
      anställda i tidsbokningen bedömer per telefon vilken yrkesperson man behöver få en tid till.
    sentences:
    - id: hb-c10-u0066-s001
      start: 0
      end: 90
    - id: hb-c10-u0066-s002
      start: 91
      end: 187
  - type: paragraph
    id: hb-c10-u0067
    text: I Finland behandlar sjukskötare och hälsovårdare många sjukdomar och besvär, och man behöver
      inte nödvändigtvis en tid till en läkare. På hälsostationerna arbetar vanligtvis både sjukskötare
      och hälsovårdare.
    sentences:
    - id: hb-c10-u0067-s001
      start: 0
      end: 134
    - id: hb-c10-u0067-s002
      start: 135
      end: 208
  - type: paragraph
    id: hb-c10-u0068
    text: Sjukskötarna behandlar mer akuta sjukdomar och besvär, medan hälsovårdarna utför mer förebyggande
      arbete. Det går ofta snabbare att få en tid till en sjukskötar- eller hälsovårdarmottagning än till
      en läkare. Om en läkare ändå behövs, skickar vårdaren patienten till en läkares mottagning.
    sentences:
    - id: hb-c10-u0068-s001
      start: 0
      end: 105
    - id: hb-c10-u0068-s002
      start: 106
      end: 208
    - id: hb-c10-u0068-s003
      start: 209
      end: 289
  - type: paragraph
    id: hb-c10-u0069
    text: Om det behövs en specialist för behandlingen av en sjukdom, bokas först en tid till en allmänläkare.
      Allmänläkaren bedömer situationen och skriver vid behov en remiss till en specialist. Man kan inte
      själv boka tid till en specialist.
    sentences:
    - id: hb-c10-u0069-s001
      start: 0
      end: 100
    - id: hb-c10-u0069-s002
      start: 101
      end: 186
    - id: hb-c10-u0069-s003
      start: 187
      end: 234
  - type: paragraph
    id: hb-c10-u0070
    text: Om man blir sjuk kvällstid eller under en helg och behöver brådskande vård, ska man ringa jouren
      och följa anvisningarna man får. Man åker till akuten endast när en sjukdom kräver omedelbar vård
      och vården inte kan vänta till följande vardag. Ofta kan en människa ta sig på egen hand eller med
      taxi till akuten. Ambulans behövs när en persons liv är i fara eller hen inte längre kan hjälpa
      sig själv i situationen.
    sentences:
    - id: hb-c10-u0070-s001
      start: 0
      end: 129
    - id: hb-c10-u0070-s002
      start: 130
      end: 242
    - id: hb-c10-u0070-s003
      start: 243
      end: 311
    - id: hb-c10-u0070-s004
      start: 312
      end: 414
  - type: paragraph
    id: hb-c10-u0071
    text: På akuten kan man vara tvungen att vänta länge. Patienterna får inte vård i den ordning de kommer,
      utan enligt hur brådskande deras besvär eller skada är. Läkaren bestämmer ordningen.
    sentences:
    - id: hb-c10-u0071-s001
      start: 0
      end: 47
    - id: hb-c10-u0071-s002
      start: 48
      end: 154
    - id: hb-c10-u0071-s003
      start: 155
      end: 183
  - type: paragraph
    id: hb-c10-u0072
    text: Det finns privata läkarstationer runt om i Finland och deras kontaktuppgifter finns på internet.
      Man får ofta en tid till privatläkare snabbare än till offentliga hälsovårdstjänster. Privata hälsovårdstjänster
      är dock mycket dyrare än offentliga. En del privatläkare gör också hembesök, men de kan vara dyra.
      Om man har ett FPA-kort, kan man få tillbaka en liten del av avgifterna för privatläkare från FPA.
      Om man inte har något kort, kan man ansöka om ersättning hos FPA i efterhand.
    sentences:
    - id: hb-c10-u0072-s001
      start: 0
      end: 96
    - id: hb-c10-u0072-s002
      start: 97
      end: 182
    - id: hb-c10-u0072-s003
      start: 183
      end: 246
    - id: hb-c10-u0072-s004
      start: 247
      end: 308
    - id: hb-c10-u0072-s005
      start: 309
      end: 407
    - id: hb-c10-u0072-s006
      start: 408
      end: 485
  - type: paragraph
    id: hb-c10-u0073
    text: I Finland ordnar arbetsgivarna företagshälsovård för alla sina anställda. Företagshälsovården
      omfattar till exempel hälsokontroller och utredning av arbetsrelaterade sjukdomar och symtom.
    sentences:
    - id: hb-c10-u0073-s001
      start: 0
      end: 73
    - id: hb-c10-u0073-s002
      start: 74
      end: 187
  - type: paragraph
    id: hb-c10-u0074
    text: Företagshälsovården kan ordnas på antingen en vårdcentral eller en privat läkarcentral. Ofta
      kan företagshälsovården omfatta förutom hälsokontroller också sjukvård och besök hos läkare, företagshälsovårdspsykolog
      eller fysioterapeut.
    sentences:
    - id: hb-c10-u0074-s001
      start: 0
      end: 87
    - id: hb-c10-u0074-s002
      start: 88
      end: 233
  - type: paragraph
    id: hb-c10-u0075
    text: Inom den offentliga hälsovården i Finland finns en vårdgaranti. En person som är permanent bosatt
      i landet har enligt lagen rätt att få icke-brådskande vård inom rimlig tid. Om personen å andra
      sidan behöver akut vård, ordnas det alltid genast.
    sentences:
    - id: hb-c10-u0075-s001
      start: 0
      end: 63
    - id: hb-c10-u0075-s002
      start: 64
      end: 173
    - id: hb-c10-u0075-s003
      start: 174
      end: 244
- id: hb-c10-tillgang
  title: Tillgång till vård och patientens rättigheter
  blocks:
  - type: paragraph
    id: hb-c10-u0076
    text: 'Du kan utnyttja de offentliga hälsovårdstjänsterna i Finland om du har hemkommun (kotikunta)
      i Finland. Rätten till hemkommun beror på följande:'
    sentences:
    - id: hb-c10-u0076-s001
      start: 0
      end: 103
    - id: hb-c10-u0076-s002
      start: 104
      end: 144
  - id: hb-c10-u0078
    type: list
    ordered: false
    items:
    - id: hb-c10-u0077
      text: från vilket land du kommer till Finland
      sentences:
      - id: hb-c10-u0077-s001
        start: 0
        end: 39
    - id: hb-c10-u0079
      text: varför du kommer till Finland (t.ex. arbete, studier)
      sentences:
      - id: hb-c10-u0079-s001
        start: 0
        end: 53
    - id: hb-c10-u0080
      text: om du ska bo stadigvarande i Finland eller vistas här tillfälligt
      sentences:
      - id: hb-c10-u0080-s001
        start: 0
        end: 65
    - id: hb-c10-u0081
      text: om din vistelse i Finland är tillfällig, beroende på hur länge vistelsen varar.
      sentences:
      - id: hb-c10-u0081-s001
        start: 0
        end: 79
  - type: paragraph
    id: hb-c10-u0082
    text: Om du inte är säker på om du har hemkommun i Finland, kontrollera din situation hos Myndigheten
      för digitalisering och befolkningsdata (Digi- ja väestötietovirasto).
    sentences:
    - id: hb-c10-u0082-s001
      start: 0
      end: 165
  - type: paragraph
    id: hb-c10-u0083
    text: Om du inte har en hemkommun i Finland kan du ändå ha rätt till vård till exempel på grund av
      arbete. Du måste ansöka separat om denna rätt.
    sentences:
    - id: hb-c10-u0083-s001
      start: 0
      end: 100
    - id: hb-c10-u0083-s002
      start: 101
      end: 139
  - type: paragraph
    id: hb-c10-u0084
    text: I nödfall får du vård inom den offentliga hälso- och sjukvården fastän du inte har en hemkommun
      i Finland eller rätt till vård exempelvis på grund av arbete. Du kan krävas på vårdkostnaderna i
      efterhand.
    sentences:
    - id: hb-c10-u0084-s001
      start: 0
      end: 157
    - id: hb-c10-u0084-s002
      start: 158
      end: 203
  - type: paragraph
    id: hb-c10-u0085
    text: Om du inte har rätt till de offentliga hälsovårdstjänsterna, kan du boka tid på en privat läkarstation.
      Privata hälsovårdstjänster är avsevärt dyrare för kunden än de offentliga.
    sentences:
    - id: hb-c10-u0085-s001
      start: 0
      end: 103
    - id: hb-c10-u0085-s002
      start: 104
      end: 178
  - type: paragraph
    id: hb-c10-u0086
    text: När du har bokat tid för ett läkarbesök ska du vara punktligt på plats. Om du har bokat tid
      för ett läkarbesök men får förhinder är det mycket viktigt att du avbokar besöket i god tid, helst
      dagen innan. Om du inte kommer och inte heller har avbokat din tidsbeställning måste du betala en
      avgift.
    sentences:
    - id: hb-c10-u0086-s001
      start: 0
      end: 71
    - id: hb-c10-u0086-s002
      start: 72
      end: 203
    - id: hb-c10-u0086-s003
      start: 204
      end: 296
  - type: paragraph
    id: hb-c10-u0087
    text: Om ditt barn har hemkommun i Finland har han eller hon rätt att utnyttja de offentliga hälsovårdstjänsterna.
      Barn har vid vissa tillfällen rätt att utnyttja tjänsterna även utan hemkommun. Till exempel under
      18-åriga asylsökande har rätt till tjänsterna.
    sentences:
    - id: hb-c10-u0087-s001
      start: 0
      end: 108
    - id: hb-c10-u0087-s002
      start: 109
      end: 188
    - id: hb-c10-u0087-s003
      start: 189
      end: 254
  - type: paragraph
    id: hb-c10-u0088
    text: 'När en människa blir sjuk och vårdas på en hälsostation eller ett sjukhus, blir hen patient.
      I Finland föreskriver lagen vilka minimirättigheter en patient har. Patientens rättigheter inkluderar
      till exempel:'
    sentences:
    - id: hb-c10-u0088-s001
      start: 0
      end: 92
    - id: hb-c10-u0088-s002
      start: 93
      end: 160
    - id: hb-c10-u0088-s003
      start: 161
      end: 208
  - id: hb-c10-u0090
    type: list
    ordered: false
    items:
    - id: hb-c10-u0089
      text: rätt till god vård och ett människovärdigt, gott bemötande inom offentliga hälsovårdstjänster
      sentences:
      - id: hb-c10-u0089-s001
        start: 0
        end: 93
    - id: hb-c10-u0091
      text: rätt att samtycka till vård. Samtycket ska säkerställas med patienten innan vården inleds
      sentences:
      - id: hb-c10-u0091-s001
        start: 0
        end: 28
      - id: hb-c10-u0091-s002
        start: 29
        end: 89
    - id: hb-c10-u0092
      text: rätt att vägra vård
      sentences:
      - id: hb-c10-u0092-s001
        start: 0
        end: 19
    - id: hb-c10-u0093
      text: rätt att kontrollera sina uppgifter i patientjournalerna och rätt att få felaktiga uppgifter
        korrigerade.
      sentences:
      - id: hb-c10-u0093-s001
        start: 0
        end: 105
  - type: paragraph
    id: hb-c10-u0094
    text: Enligt lagen har alla människor rätt till likvärdiga offentliga och privata hälsovårdstjänster
      i Finland. Patienten har vid behov rätt till en tolk på mottagningen.
    sentences:
    - id: hb-c10-u0094-s001
      start: 0
      end: 105
    - id: hb-c10-u0094-s002
      start: 106
      end: 164
  - type: paragraph
    id: hb-c10-u0095
    text: Om man blir felaktigt eller orättvist behandlad inom hälsovårdstjänster, kan man kontakta en
      patientombudsman. Patientombudsmannens tjänster är gratis. Hen hjälper och ger råd om man vill göra
      en anmärkning om bristfällig eller felaktig vård, eller ansöka om ersättning för patientskada.
    sentences:
    - id: hb-c10-u0095-s001
      start: 0
      end: 110
    - id: hb-c10-u0095-s002
      start: 111
      end: 151
    - id: hb-c10-u0095-s003
      start: 152
      end: 287
- id: hb-c10-lakemedel
  title: Läkemedel och munhälsovård
  blocks:
  - type: paragraph
    id: hb-c10-u0096
    text: I Finland behövs ett recept för många mediciner. En läkare skriver ut ett recept på medicin
      på mottagningen elektroniskt, vilket innebär att det sparas i den nationella receptdatabasen. När
      patienten går till apoteket, kan farmaceuten kontrollera receptet med hjälp av hens FPA-kort, identitetskort
      eller körkort. Patienten kan köpa sina mediciner på vilket apotek som helst i Finland. Värkmediciner
      liksom andra mediciner säljs inte i mataffärerna, utan endast på apoteken.
    sentences:
    - id: hb-c10-u0096-s001
      start: 0
      end: 48
    - id: hb-c10-u0096-s002
      start: 49
      end: 185
    - id: hb-c10-u0096-s003
      start: 186
      end: 313
    - id: hb-c10-u0096-s004
      start: 314
      end: 385
    - id: hb-c10-u0096-s005
      start: 386
      end: 474
  - type: paragraph
    id: hb-c10-u0097
    text: 'Den offentliga munhälsovården i Finland omfattar två typer av vård: förebyggande och korrigerande
      vård. Förebyggande vård betyder att munnens och tändernas hälsa upprätthålls med god egenvård, det
      vill säga daglig munrengöring hemma och regelbundna kontroller hos en yrkesperson inom munhälsa.'
    sentences:
    - id: hb-c10-u0097-s001
      start: 0
      end: 103
    - id: hb-c10-u0097-s002
      start: 104
      end: 293
  - type: paragraph
    id: hb-c10-u0098
    text: Inom den korrigerande vården åtgärdar och behandlar en tandläkare befintliga skador och besvär.
      I Finland får man om man vill alltid smärtlindring vid olika vårdåtgärder. Vid till exempel plombering
      får patienten först ytbedövning i munslemhinnan och därefter lokalbedövning i form av en injektion.
    sentences:
    - id: hb-c10-u0098-s001
      start: 0
      end: 95
    - id: hb-c10-u0098-s002
      start: 96
      end: 170
    - id: hb-c10-u0098-s003
      start: 171
      end: 298
  - type: paragraph
    id: hb-c10-u0099
    text: På en offentlig hälsostation kan man få tid till tandläkare och tandhygienist. I en del välfärdsområden
      kan det finnas en särskild tandvårdsklinik. Tandhygienisten ger förebyggande mun- och tandvård och
      gör tandkontroller. Tandläkaren lagar tänder och åtgärdar bettet och andra tandproblem. Det är ofta
      kö till den offentliga tandvården.
    sentences:
    - id: hb-c10-u0099-s001
      start: 0
      end: 78
    - id: hb-c10-u0099-s002
      start: 79
      end: 147
    - id: hb-c10-u0099-s003
      start: 148
      end: 222
    - id: hb-c10-u0099-s004
      start: 223
      end: 290
    - id: hb-c10-u0099-s005
      start: 291
      end: 337
  - type: paragraph
    id: hb-c10-u0100
    text: Jouren betjänar människor som behöver brådskande vård. Ett brådskande behov är till exempel
      om en tand värker eller lossnar. Den anställda i tidsbokningen bedömer per telefon hur brådskande
      behovet av tandvård är. Om det behövs en tandkirurg för vården av tänderna, bokas först en tid till
      en vanlig tandläkare. Hen skriver vid behov en remiss till specialisttandvården.
    sentences:
    - id: hb-c10-u0100-s001
      start: 0
      end: 54
    - id: hb-c10-u0100-s002
      start: 55
      end: 124
    - id: hb-c10-u0100-s003
      start: 125
      end: 213
    - id: hb-c10-u0100-s004
      start: 214
      end: 311
    - id: hb-c10-u0100-s005
      start: 312
      end: 370
  - type: paragraph
    id: hb-c10-u0101
    text: Munhälsovården för barn under 18 år är avgiftsfri på offentliga hälsostationer och tandvårdskliniker.
      För barn ordnas regelbundna kontroller av munhälsan när de är i daghems- och skolåldern. Syftet
      med vården för barn och unga är att säkerställa att de har en god mun- och tandhälsa redan från
      början.
    sentences:
    - id: hb-c10-u0101-s001
      start: 0
      end: 101
    - id: hb-c10-u0101-s002
      start: 102
      end: 190
    - id: hb-c10-u0101-s003
      start: 191
      end: 301
  - type: paragraph
    id: hb-c10-u0102
    text: Om ett barn har ett funktionellt bettfel och uppfyller kriterierna för vård, hänvisas hen till
      tandreglering. Tandreglering som korrigerar bettfel är avgiftsfri för barn under 18 år på social-
      och hälsovårdscentralerna.
    sentences:
    - id: hb-c10-u0102-s001
      start: 0
      end: 109
    - id: hb-c10-u0102-s002
      start: 110
      end: 219
  - type: paragraph
    id: hb-c10-u0103
    text: Man kan också besöka en privattandläkare för att kontrollera munhälsan. FPA ersätter en del
      av avgiften för privattandläkare om man har ett FPA-kort. Om man inte har något kort, kan man ansöka
      om ersättning hos FPA i efterhand. Man får vanligtvis snabbt en tid hos privattandläkare.
    sentences:
    - id: hb-c10-u0103-s001
      start: 0
      end: 71
    - id: hb-c10-u0103-s002
      start: 72
      end: 149
    - id: hb-c10-u0103-s003
      start: 150
      end: 227
    - id: hb-c10-u0103-s004
      start: 228
      end: 282
  - type: paragraph
    id: hb-c10-u0104
    text: På läkemedelsförpackningen står det sista användningsdatumet. Om läkemedlet har föråldrats kan
      det inte längre användas. Släng inte föråldrade läkemedel utan lämna dem alltid till apoteket (apteekki),
      eftersom de är problemavfall.
    sentences:
    - id: hb-c10-u0104-s001
      start: 0
      end: 61
    - id: hb-c10-u0104-s002
      start: 62
      end: 120
    - id: hb-c10-u0104-s003
      start: 121
      end: 230
  - type: paragraph
    id: hb-c10-u0105
    text: På apoteket kan du byta ut det läkemedel som föreskrivs på receptet mot ett annat, förmånligare
      läkemedel om det verksamma ämnet är detsamma i båda preparaten. Den anställda på apoteket berättar
      för kunden om det finns ett billigare alternativ.
    sentences:
    - id: hb-c10-u0105-s001
      start: 0
      end: 159
    - id: hb-c10-u0105-s002
      start: 160
      end: 244
  - type: paragraph
    id: hb-c10-u0106
    text: Vissa läkemedel kan du ta med dig från utlandet till Finland för eget bruk. Importen är dock
      begränsad. Begränsningarna beror på vilken sorts läkemedel det är fråga om och från vilket land
      du tar med dig läkemedlet till Finland. Du måste också till exempel med ett recept eller ett läkarintyg
      kunna bevisa att läkemedlet är avsett för eget bruk.
    sentences:
    - id: hb-c10-u0106-s001
      start: 0
      end: 75
    - id: hb-c10-u0106-s002
      start: 76
      end: 103
    - id: hb-c10-u0106-s003
      start: 104
      end: 228
    - id: hb-c10-u0106-s004
      start: 229
      end: 345
  - type: paragraph
    id: hb-c10-u0107
    text: Ta reda på begränsningarna innan du för in läkemedel i Finland. Ta reda på begränsningarna också
      om du vill beställa läkemedel till Finland per post.
    sentences:
    - id: hb-c10-u0107-s001
      start: 0
      end: 63
    - id: hb-c10-u0107-s002
      start: 64
      end: 149
  - type: paragraph
    id: hb-c10-u0108
    text: Från EES-länderna eller Nordirland får du ta med dig läkemedel för eget bruk i en mängd som
      motsvarar ett års förbrukning. Per post får du från dessa länder beställa den mängd läkemedel som
      motsvarar högst tre månaders förbrukning.
    sentences:
    - id: hb-c10-u0108-s001
      start: 0
      end: 122
    - id: hb-c10-u0108-s002
      start: 123
      end: 231
  - type: paragraph
    id: hb-c10-u0109
    text: Från länder utanför EES-området och Nordirland får du ta med dig till Finland den mängd läkemedel
      för eget bruk som motsvarar högst tre månaders förbrukning. Enligt lag får man inte beställa läkemedel
      per post från utanför dessa länder.
    sentences:
    - id: hb-c10-u0109-s001
      start: 0
      end: 157
    - id: hb-c10-u0109-s002
      start: 158
      end: 236
  - type: paragraph
    id: hb-c10-u0110
    text: Om läkemedlet har klassificerats som narkotika är begränsningarna strängare.
    sentences:
    - id: hb-c10-u0110-s001
      start: 0
      end: 76
  - type: paragraph
    id: hb-c10-u0111
    text: Om du är osäker på om ett visst läkemedel får föras in i Finland ska du fråga råd vid Tullen
      (Tulli).
    sentences:
    - id: hb-c10-u0111-s001
      start: 0
      end: 101
- id: hb-c10-psykisk
  title: Psykisk hälsa och stöd vid beroende
  blocks:
  - type: paragraph
    id: hb-c10-u0112
    text: När den mentala hälsan är god är människan handlingskraftig och klarar bättre av de svårigheter
      och förändringar som hen ställs inför i livet. Olika faktorer skyddar den mentala hälsan, till exempel
      goda sociala relationer och hälsosamma levnadsvanor. Att ta hand om sin mentala hälsa är lika viktigt
      som att ta hand om sitt fysiska välbefinnande.
    sentences:
    - id: hb-c10-u0112-s001
      start: 0
      end: 142
    - id: hb-c10-u0112-s002
      start: 143
      end: 251
    - id: hb-c10-u0112-s003
      start: 252
      end: 347
  - type: paragraph
    id: hb-c10-u0113
    text: Välbefinnandet hos nyanlända främjas av förutom ovanstående också ofta av till exempel möjligheten
      att leva med sin familj, gemenskap, den egna religiösa övertygelsen och att bli jämlikt behandlad.
    sentences:
    - id: hb-c10-u0113-s001
      start: 0
      end: 197
  - type: paragraph
    id: hb-c10-u0114
    text: Faktorer som belastar den mentala hälsan är till exempel att man har upplevt diskriminering
      och rasism. Också ensamhet, ekonomisk osäkerhet och svårigheter att få social- och hälsovårdstjänster
      belastar den mentala hälsan. Dessutom kan inlärningen och användningen av ett nytt språk och kulturella
      utmaningar orsaka svårigheter.
    sentences:
    - id: hb-c10-u0114-s001
      start: 0
      end: 103
    - id: hb-c10-u0114-s002
      start: 104
      end: 222
    - id: hb-c10-u0114-s003
      start: 223
      end: 328
  - type: paragraph
    id: hb-c10-u0115
    text: I Finland tillhandahålls mentalvårdstjänster för olika mentala problem och störningar av hälsostationerna
      och privata läkarstationer. Mentala störningar kan vara till exempel depression, ångest, ätstörningar
      och kraftiga rädslor.
    sentences:
    - id: hb-c10-u0115-s001
      start: 0
      end: 133
    - id: hb-c10-u0115-s002
      start: 134
      end: 229
  - type: paragraph
    id: hb-c10-u0116
    text: Om man behöver mentalvårdstjänster ska man först boka en tid till en hälsovårdare eller läkare
      på den egna hälsostationen. Läkaren utreder hurdan hjälp man behöver. Hen kan skriva en remiss till
      en psykiatrisk poliklinik eller någon annan mentalvårdstjänst. Vården inkluderar i allmänhet samtal
      med till exempel en psykolog eller en psykoterapeut och vanligtvis också medicinbehandling.
    sentences:
    - id: hb-c10-u0116-s001
      start: 0
      end: 122
    - id: hb-c10-u0116-s002
      start: 123
      end: 164
    - id: hb-c10-u0116-s003
      start: 165
      end: 257
    - id: hb-c10-u0116-s004
      start: 258
      end: 386
  - type: paragraph
    id: hb-c10-u0117
    text: Man kan boka tid också på en privat läkarstation. Där arbetar psykiatriker och psykologer. En
      privatläkare kostar dock mycket mer än offentlig hälsovård på en hälsostation.
    sentences:
    - id: hb-c10-u0117-s001
      start: 0
      end: 49
    - id: hb-c10-u0117-s002
      start: 50
      end: 90
    - id: hb-c10-u0117-s003
      start: 91
      end: 172
  - type: paragraph
    id: hb-c10-u0118
    text: Om man behöver brådskande vård, kan man ringa en hälsostation eller ett sjukhus med jour. Akut
      psykiatrisk vård tillhandahålls av jourerna vid psykiatriska sjukhus.
    sentences:
    - id: hb-c10-u0118-s001
      start: 0
      end: 89
    - id: hb-c10-u0118-s002
      start: 90
      end: 164
  - type: paragraph
    id: hb-c10-u0119
    text: Om ett barn eller en ung person har problem med den mentala hälsan, kan föräldrarna kontakta
      familjerådgivningen i det egna välfärdsområdet. Också skolorna och läroanstalterna tillhandahåller
      tjänster inom elevhälsa, det vill säga olika yrkesutbildade personer som stöder barn i frågor som
      rör den mentala hälsan. Sådana yrkesutbildade är kuratorer, psykologer, hälsovårdare och läkare.
    sentences:
    - id: hb-c10-u0119-s001
      start: 0
      end: 140
    - id: hb-c10-u0119-s002
      start: 141
      end: 313
    - id: hb-c10-u0119-s003
      start: 314
      end: 386
  - type: paragraph
    id: hb-c10-u0120
    text: Alkohol och droger är rusmedel. De vanligaste drogerna är cannabis, opioider, amfetamin, ecstasy,
      kokain och khat. Alla droger är olagliga i Finland. Innehav och försäljning av sådana är ett brott
      som ger bötes- eller fängelsestraff.
    sentences:
    - id: hb-c10-u0120-s001
      start: 0
      end: 31
    - id: hb-c10-u0120-s002
      start: 32
      end: 114
    - id: hb-c10-u0120-s003
      start: 115
      end: 149
    - id: hb-c10-u0120-s004
      start: 150
      end: 233
  - type: paragraph
    id: hb-c10-u0121
    text: Om man har ett rusmedelsberoende eller något annat beroende, kan man få hjälp och stöd på den
      egna social- och hälsovårdsstationen, hos studerandehälsovården och företagshälsovården. Både rusmedelsberoende
      och till exempel spelberoende kan orsaka problem såväl för den som använder rusmedlen eller spelaren
      själv som för hens närstående. De orsakar ofta också ekonomiska problem.
    sentences:
    - id: hb-c10-u0121-s001
      start: 0
      end: 182
    - id: hb-c10-u0121-s002
      start: 183
      end: 337
    - id: hb-c10-u0121-s003
      start: 338
      end: 379
  - type: paragraph
    id: hb-c10-u0122
    text: Också A-klinikerna erbjuder vård och rehabiliteringstjänster för personer som är beroende av
      rusmedel. Också deras närstående kan få hjälp och stöd. Vården är gratis, och klinikerna erbjuder
      också avgiftning. Vid avgiftning slutar missbrukaren helt att använda rusmedel under behandlingen.
    sentences:
    - id: hb-c10-u0122-s001
      start: 0
      end: 102
    - id: hb-c10-u0122-s002
      start: 103
      end: 148
    - id: hb-c10-u0122-s003
      start: 149
      end: 208
    - id: hb-c10-u0122-s004
      start: 209
      end: 289
  - type: paragraph
    id: hb-c10-u0123
    text: I många städer finns det hälsorådgivningar avsedda för drogmissbrukare. På rådgivningarna kan
      man byta gamla och använda drogsprutor till nya. Rådgivningarna ger också social- och hälsovårdsrådgivning
      och handledning.
    sentences:
    - id: hb-c10-u0123-s001
      start: 0
      end: 71
    - id: hb-c10-u0123-s002
      start: 72
      end: 142
    - id: hb-c10-u0123-s003
      start: 143
      end: 217
  - type: paragraph
    id: hb-c10-u0124
    text: Myndigheterna erbjuder problemanvändare gratis drogsprutor av hälsoskäl. Om drogmissbrukarna
      använder smutsiga sprutor sprids olika sjukdomar med dem. Via rådgivningarna kan missbrukarna också
      komma in på avgiftning för att sluta med missbruket. Kontaktuppgifterna för hälsorådgivningen på
      den egna orten finns på internet.
    sentences:
    - id: hb-c10-u0124-s001
      start: 0
      end: 72
    - id: hb-c10-u0124-s002
      start: 73
      end: 150
    - id: hb-c10-u0124-s003
      start: 151
      end: 245
    - id: hb-c10-u0124-s004
      start: 246
      end: 323
  - type: paragraph
    id: hb-c10-u0125
    text: Krävande livssituationer kan vara till exempel när man flyttar från ett land till ett annat,
      har problem på arbetsplatsen eller förlorar sin arbetsplats. Problem i familjen, skilsmässa, dödsfall
      av en anhörig, sjukdom eller annan livsförändring kan vara krissituationer då man behöver hjälp.
      Också positiva saker, såsom att man får barn, kan ändra livet så mycket att man behöver stöd i den
      nya situationen. Ibland kan man må dåligt först i efterhand när man redan har lagt den svåra erfarenheten
      bakom sig och situationen har lugnat ner sig.
    sentences:
    - id: hb-c10-u0125-s001
      start: 0
      end: 153
    - id: hb-c10-u0125-s002
      start: 154
      end: 291
    - id: hb-c10-u0125-s003
      start: 292
      end: 407
    - id: hb-c10-u0125-s004
      start: 408
      end: 542
  - type: paragraph
    id: hb-c10-u0126
    text: Ofta hjälper det redan att tala om dessa saker med familjen eller vänner. Ibland behövs det
      även professionell hjälp. Tillsammans med en hälsovårdare eller en läkare kan ni fundera på vilken
      sorts stöd som skulle passa just dig.
    sentences:
    - id: hb-c10-u0126-s001
      start: 0
      end: 73
    - id: hb-c10-u0126-s002
      start: 74
      end: 117
    - id: hb-c10-u0126-s003
      start: 118
      end: 228
  - type: paragraph
    id: hb-c10-u0127
    text: Ofta hjälper terapi, medicinering eller en kombination av båda. Ibland behövs sjukhusvård.
    sentences:
    - id: hb-c10-u0127-s001
      start: 0
      end: 63
    - id: hb-c10-u0127-s002
      start: 64
      end: 90
  - type: paragraph
    id: hb-c10-u0128
    text: Med en yrkesutbildad person inom hälsovården, såsom en läkare eller hälsovårdare, kan du samtala
      konfidentiellt. De har tystnadsplikt, Det innebär att de inte berättar om dina angelägenheter till
      någon annan. Om någon annan sakkunnig inom hälso- och sjukvården behöver dina uppgifter, tillfrågas
      du separat om tillstånd för utlämnande av dessa.
    sentences:
    - id: hb-c10-u0128-s001
      start: 0
      end: 112
    - id: hb-c10-u0128-s002
      start: 113
      end: 208
    - id: hb-c10-u0128-s003
      start: 209
      end: 344
  - type: paragraph
    id: hb-c10-u0129
    text: Om du är orolig för en närstående person och tror att hen kan vara i behov av hjälp, kan du
      rådfråga till exempel hälsovårdaren eller läkaren vid social- och hälsocentralen.
    sentences:
    - id: hb-c10-u0129-s001
      start: 0
      end: 173
  - type: paragraph
    id: hb-c10-u0130
    text: Om symtomen är mycket allvarliga eller akuta, ring nödnumret 112. Sådana symtom är till exempel
      självdestruktivitet eller kraftig våldsamhet.
    sentences:
    - id: hb-c10-u0130-s001
      start: 0
      end: 65
    - id: hb-c10-u0130-s002
      start: 66
      end: 141
  - type: paragraph
    id: hb-c10-u0131
    text: Om din närstående är i mycket dåligt skick och behöver akut psykiatrisk sjukhusvård, kan hen
      omhändertas för vård mot sin vilja. För detta behövs läkarens remiss för tvångsvård.
    sentences:
    - id: hb-c10-u0131-s001
      start: 0
      end: 128
    - id: hb-c10-u0131-s002
      start: 129
      end: 177
  - type: paragraph
    id: hb-c10-u0132
    text: MIELI rf:s kristelefon erbjuder omedelbar samtalshjälp för människor i kris och deras närstående.
      Samtalen besvaras av krisarbetare och utbildade frivilliga stödpersoner. Du behöver inte uppge ditt
      namn när du ringer. På kristelefonen kan du prata om en oväntad händelse eller en svår livssituation
      i en tillåtande och stödande atmosfär.
    sentences:
    - id: hb-c10-u0132-s001
      start: 0
      end: 97
    - id: hb-c10-u0132-s002
      start: 98
      end: 170
    - id: hb-c10-u0132-s003
      start: 171
      end: 217
    - id: hb-c10-u0132-s004
      start: 218
      end: 337
  - type: paragraph
    id: hb-c10-u0133
    text: Om du har genomgått svåra traumatiska upplevelser är det viktigt att du söker hjälp. Traumatiska
      upplevelser kan till exempel vara förknippade med förföljelse, diskriminering, våld, våldtäkt, krig
      eller tortyr. Sådana upplevelser kan orsaka posttraumatiskt stressyndrom. Det innebär att minnesbilderna
      från traumat tvångsmässigt stiger upp i medvetandet i olika situationer, vilket orsakar kraftig
      ångest.
    sentences:
    - id: hb-c10-u0133-s001
      start: 0
      end: 84
    - id: hb-c10-u0133-s002
      start: 85
      end: 210
    - id: hb-c10-u0133-s003
      start: 211
      end: 270
    - id: hb-c10-u0133-s004
      start: 271
      end: 405
  - type: paragraph
    id: hb-c10-u0134
    text: Det går att tillfriskna från posttraumatiskt stressyndrom och du kan få hjälp med situationen.
      Kontakta din social- och hälsocentral och berätta om din situation för en läkare. Hen skriver vid
      behov en remiss till fortsatt vård.
    sentences:
    - id: hb-c10-u0134-s001
      start: 0
      end: 94
    - id: hb-c10-u0134-s002
      start: 95
      end: 176
    - id: hb-c10-u0134-s003
      start: 177
      end: 228
  - type: paragraph
    id: hb-c10-u0135
    text: Om du har svårt att studera eller arbeta på grund av psykisk ohälsa kan du eventuellt ansöka
      om FPA:s stöd för psykoterapi. Detta kallas för rehabiliterande psykoterapi.
    sentences:
    - id: hb-c10-u0135-s001
      start: 0
      end: 123
    - id: hb-c10-u0135-s002
      start: 124
      end: 169
  - type: paragraph
    id: hb-c10-u0136
    text: A-kliniken kan hjälpa dig med missbruksproblem och andra beroendeproblem. A-kliniker erbjuder
      bland annat polikliniktjänster, substitutionsbehandling och avgiftning. Det finns A-kliniker på
      olika orter i Finland. Behandlingen på A-kliniken är konfidentiell.
    sentences:
    - id: hb-c10-u0136-s001
      start: 0
      end: 73
    - id: hb-c10-u0136-s002
      start: 74
      end: 165
    - id: hb-c10-u0136-s003
      start: 166
      end: 212
    - id: hb-c10-u0136-s004
      start: 213
      end: 257
  - type: paragraph
    id: hb-c10-u0137
    text: Om en ung har problem med alkohol, droger eller spelande, kan hen få hjälp vid ungdomsstationen
      (nuorisoasema). Ungdomsstationer finns i många städer. Den unga kan komma till ungdomsstationen
      ensam eller med sina föräldrar.
    sentences:
    - id: hb-c10-u0137-s001
      start: 0
      end: 111
    - id: hb-c10-u0137-s002
      start: 112
      end: 150
    - id: hb-c10-u0137-s003
      start: 151
      end: 223
  - type: paragraph
    id: hb-c10-u0138
    text: Anonyma Alkoholister (Nimettömät Alkoholistit) AA on är en kamratförening där deltagarna delar
      med sig av sina erfarenheter av alkoholism och försöker hjälpa varandra att bli friska. AA-grupper
      finns på många orter och i de större städerna finns även grupper på engelska.
    sentences:
    - id: hb-c10-u0138-s001
      start: 0
      end: 182
    - id: hb-c10-u0138-s002
      start: 183
      end: 271
  - type: paragraph
    id: hb-c10-u0139
    text: Al-Anon erbjuder stöd till närstående personer till en alkoholist.
    sentences:
    - id: hb-c10-u0139-s001
      start: 0
      end: 66
- id: hb-c10-sexuell
  title: Sexuell och reproduktiv hälsa
  blocks:
  - type: paragraph
    id: hb-c10-u0140
    text: Sexuell hälsa är också nära förknippad med reproduktiv hälsa, som avser alla hälsofrågor i anknytning
      till sexualitet. Dessa är bland annat
    sentences:
    - id: hb-c10-u0140-s001
      start: 0
      end: 118
    - id: hb-c10-u0140-s002
      start: 119
      end: 139
  - id: hb-c10-u0142
    type: list
    ordered: false
    items:
    - id: hb-c10-u0141
      text: förebyggande och behandling av könssjukdomar
      sentences:
      - id: hb-c10-u0141-s001
        start: 0
        end: 44
    - id: hb-c10-u0143
      text: användning av moderna och tillförlitliga preventivmetoder
      sentences:
      - id: hb-c10-u0143-s001
        start: 0
        end: 57
    - id: hb-c10-u0144
      text: uppföljning av och modern vård vid graviditet
      sentences:
      - id: hb-c10-u0144-s001
        start: 0
        end: 45
    - id: hb-c10-u0145
      text: trygga förlossningar
      sentences:
      - id: hb-c10-u0145-s001
        start: 0
        end: 20
    - id: hb-c10-u0146
      text: utredningar och behandlingar av barnlöshet
      sentences:
      - id: hb-c10-u0146-s001
        start: 0
        end: 42
    - id: hb-c10-u0147
      text: möjlighet till säkra aborter.
      sentences:
      - id: hb-c10-u0147-s001
        start: 0
        end: 29
  - type: paragraph
    id: hb-c10-u0148
    text: I Finland erbjuds tjänster inom reproduktiv hälsa på välfärdsområdets hälsostationer, mödrarådgivningarna,
      inom skol- och studerandehälsovården och preventiv- och familjeplaneringsrådgivningen. En del områden
      erbjuder avgiftsfria preventivmedel mot graviditet och könssjukdomar till alla unga under 20 eller
      25 år.
    sentences:
    - id: hb-c10-u0148-s001
      start: 0
      end: 193
    - id: hb-c10-u0148-s002
      start: 194
      end: 314
  - type: paragraph
    id: hb-c10-u0152
    text: I skolorna i Finland får barn och unga sexualundervisning enligt sin ålder och utvecklingsnivå.
      Utgångspunkten för skolans sexualundervisning är den ungas rätt att få information i frågor som
      rör den egna hälsan och det egna välbefinnandet. Målet är att främja och skydda den ungas sexuella
      utveckling. Inom sexualundervisningen behandlas också emotionella och sociala färdigheter och mångfalden
      av sexuella läggningar och kön.
    sentences:
    - id: hb-c10-u0152-s001
      start: 0
      end: 95
    - id: hb-c10-u0152-s002
      start: 96
      end: 240
    - id: hb-c10-u0152-s003
      start: 241
      end: 302
    - id: hb-c10-u0152-s004
      start: 303
      end: 427
  - type: paragraph
    id: hb-c10-u0153
    text: Forskning visar att information om sexualitet gör de unga mer ansvarsfulla samt skyddar och
      främjar deras hälsa. Många undersökningar har visat att sexualundervisningen inte leder till tidiga
      sexuella experiment eller påverkar de ungas sexuella identitet.
    sentences:
    - id: hb-c10-u0153-s001
      start: 0
      end: 112
    - id: hb-c10-u0153-s002
      start: 113
      end: 255
  - type: paragraph
    id: hb-c10-u0154
    text: På lektionerna i sexualundervisning i skolan får eleverna lära sig att sexualitet är en naturlig
      och hälsosam del av en människas liv. På lektionerna betonas viktiga värderingar inom sexualundervisningen,
      till exempel självbestämmanderätt och vikten av personlig integritet. De unga får lära sig att ingen
      behöver göra något som den inte vill när det kommer till sexualitet. För sexuellt umgänge behövs
      alltid ett tydligt samtycke av alla parter.
    sentences:
    - id: hb-c10-u0154-s001
      start: 0
      end: 134
    - id: hb-c10-u0154-s002
      start: 135
      end: 274
    - id: hb-c10-u0154-s003
      start: 275
      end: 374
    - id: hb-c10-u0154-s004
      start: 375
      end: 446
  - type: paragraph
    id: hb-c10-u0155
    text: Undervisning i emotionella färdigheter och arbete med att stärka barns integritet kan ordnas
      redan för små barn på daghemmen. Inom arbetet med att stärka barns integritet ges barnen information
      om den egna kroppen och deras rätt till fysisk integritet. Barnen får på ett lämpligt sätt med tanke
      på sin ålder lära sig hur de kan respektera sin kropp, hur de kan skydda sig själva och hur de ska
      göra om någon rör dem utan lov eller på ett störande sätt.
    sentences:
    - id: hb-c10-u0155-s001
      start: 0
      end: 125
    - id: hb-c10-u0155-s002
      start: 126
      end: 252
    - id: hb-c10-u0155-s003
      start: 253
      end: 452
  - type: paragraph
    id: hb-c10-u0156
    text: Målet är att lära barnen färdigheter som kan hjälpa dem att undvika situationer där någon besvärar,
      lockar eller ofredar dem. Barnen lär sig också hur de kan skydda sig själva och sina gränser om
      de hamnar i en svår situation.
    sentences:
    - id: hb-c10-u0156-s001
      start: 0
      end: 125
    - id: hb-c10-u0156-s002
      start: 126
      end: 226
  - type: paragraph
    id: hb-c10-u0157
    text: När du upptäcker att du är gravid, kontakta mödrarådgivningen (äitiysneuvola) eller familjecentret
      (perhekeskus) i ditt område. Du kan använda tjänsterna vid rådgivningsbyrån eller familjecentret
      om du har en hemkommun i Finland. Du behöver inte betala för tjänsterna vid rådgivningsbyrån.
    sentences:
    - id: hb-c10-u0157-s001
      start: 0
      end: 127
    - id: hb-c10-u0157-s002
      start: 128
      end: 229
    - id: hb-c10-u0157-s003
      start: 230
      end: 289
  - type: paragraph
    id: hb-c10-u0158
    text: Också asylsökande kan använda tjänsterna vid mödrarådgivningen. Du kan använda tjänsterna vid
      mödrarådgivningen även om du är i Finland utan uppehållstillstånd, men då måste du oftast betala
      kostnaderna själv.
    sentences:
    - id: hb-c10-u0158-s001
      start: 0
      end: 63
    - id: hb-c10-u0158-s002
      start: 64
      end: 209
  - type: paragraph
    id: hb-c10-u0159
    text: På rådgivningsbyrån följer en hälsovårdare ditt hälsotillstånd och babyns hälsa. På rådgivningsbyrån
      får du anvisningar för en trygg graviditet och förlossning. Du får även viktig information om tjänsterna
      för barnfamiljer i Finland.
    sentences:
    - id: hb-c10-u0159-s001
      start: 0
      end: 80
    - id: hb-c10-u0159-s002
      start: 81
      end: 160
    - id: hb-c10-u0159-s003
      start: 161
      end: 233
  - type: paragraph
    id: hb-c10-u0160
    text: Barnets båda föräldrar är välkomna till rådgivningsbyrån. Om du vill kan du även be en stödperson
      att följa med.
    sentences:
    - id: hb-c10-u0160-s001
      start: 0
      end: 57
    - id: hb-c10-u0160-s002
      start: 58
      end: 112
  - type: paragraph
    id: hb-c10-u0161
    text: Om du behöver tolk kan sköterskan på rådgivningsbyrån be en tolk att närvara vid besöken. Tolken
      ska vara vuxen.
    sentences:
    - id: hb-c10-u0161-s001
      start: 0
      end: 89
    - id: hb-c10-u0161-s002
      start: 90
      end: 112
  - type: paragraph
    id: hb-c10-u0162
    text: I Finland finns även privata mödrarådgivningar. Tänk på att privata hälso- och sjukvårdstjänster
      är avgiftsbelagda.
    sentences:
    - id: hb-c10-u0162-s001
      start: 0
      end: 47
    - id: hb-c10-u0162-s002
      start: 48
      end: 115
  - type: paragraph
    id: hb-c10-u0163
    text: I Finland föder kvinnorna oftast på sjukhus. Fråga på mödrarådgivningen på vilket sjukhus du
      ska föda.
    sentences:
    - id: hb-c10-u0163-s001
      start: 0
      end: 44
    - id: hb-c10-u0163-s002
      start: 45
      end: 102
  - type: paragraph
    id: hb-c10-u0164
    text: Om du har en hemkommun i Finland kostar förlossningen inte särskilt mycket.
    sentences:
    - id: hb-c10-u0164-s001
      start: 0
      end: 75
  - type: paragraph
    id: hb-c10-u0165
    text: Barnets andra förälder kan vara med på förlossningen. Om du vill kan du även be någon annan
      släkting eller en vän att följa med.
    sentences:
    - id: hb-c10-u0165-s001
      start: 0
      end: 53
    - id: hb-c10-u0165-s002
      start: 54
      end: 128
  - type: paragraph
    id: hb-c10-u0166
    text: Om du är rädd inför förlossningen, prata om det på rådgivningsbyrån. Du kan få hjälp med rädslan
      till exempel på polikliniken för förlossningsrädsla.
    sentences:
    - id: hb-c10-u0166-s001
      start: 0
      end: 68
    - id: hb-c10-u0166-s002
      start: 69
      end: 149
  - type: paragraph
    id: hb-c10-u0167
    text: Du kan köpa kondomer i affärer, på bensinstationer, kiosker och apotek. Du behöver inget recept.
    sentences:
    - id: hb-c10-u0167-s001
      start: 0
      end: 71
    - id: hb-c10-u0167-s002
      start: 72
      end: 96
  - type: paragraph
    id: hb-c10-u0168
    text: Om du behöver p-piller behöver du ett recept från läkaren. Med receptet kan du hämta ut dina
      piller på apoteket. Boka en tid hos läkaren för att få receptet.
    sentences:
    - id: hb-c10-u0168-s001
      start: 0
      end: 58
    - id: hb-c10-u0168-s002
      start: 59
      end: 112
    - id: hb-c10-u0168-s003
      start: 113
      end: 157
  - type: paragraph
    id: hb-c10-u0169
    text: Du behöver inte ha vårdnadshavarens tillstånd för receptet om du är minderårig. Vissa områden
      erbjuder unga kostnadsfria preventivmedel. Du kan fråga om detta på social- och hälsocentralen eller
      av hälsovårdaren på din skola.
    sentences:
    - id: hb-c10-u0169-s001
      start: 0
      end: 79
    - id: hb-c10-u0169-s002
      start: 80
      end: 136
    - id: hb-c10-u0169-s003
      start: 137
      end: 225
  - type: paragraph
    id: hb-c10-u0170
    text: Barnlöshet kan oftast behandlas. Orsaken till barnlöshet kan finnas hos kvinnan eller hos mannen.
      Ibland hittar man ingen medicinsk orsak till den.
    sentences:
    - id: hb-c10-u0170-s001
      start: 0
      end: 32
    - id: hb-c10-u0170-s002
      start: 33
      end: 97
    - id: hb-c10-u0170-s003
      start: 98
      end: 147
  - type: paragraph
    id: hb-c10-u0171
    text: Fertilitetsbehandlingar tillhandahålls av både offentliga och privata kliniker. till exempel
      kvinnans ålder påverkar rätten till fertilitetsbehandling inom de offentliga hälsovårdstjänsterna.
    sentences:
    - id: hb-c10-u0171-s001
      start: 0
      end: 79
    - id: hb-c10-u0171-s002
      start: 80
      end: 191
  - type: paragraph
    id: hb-c10-u0172
    text: Om du misstänker att du har en könssjukdom kan du boka en läkartid på social- och hälsocentralen
      eller en privat läkarstation. I vissa områden kan du även kontakta preventivmedels- och familjeplaneringsrådgivningen
      (ehkäisy- ja perhesuunnitteluneuvonta). Fråga mer på din egen på social- och hälsocentral.
    sentences:
    - id: hb-c10-u0172-s001
      start: 0
      end: 126
    - id: hb-c10-u0172-s002
      start: 127
      end: 254
    - id: hb-c10-u0172-s003
      start: 255
      end: 305
  - type: paragraph
    id: hb-c10-u0173
    text: Du kan skydda dig mot de flesta könssjukdomarna med kondom eller slicklapp.
    sentences:
    - id: hb-c10-u0173-s001
      start: 0
      end: 75
  - type: paragraph
    id: hb-c10-u0174
    text: Också papperslösa och asylsökande har rätt att få behandling för könssjukdomar. Om du vistas
      i Finland utan uppehållstillstånd kan du emellertid bli tvungen att betala för vården.
    sentences:
    - id: hb-c10-u0174-s001
      start: 0
      end: 79
    - id: hb-c10-u0174-s002
      start: 80
      end: 179
- id: hb-c10-konsstympning
  title: 'Kvinnlig könsstympning: följder och vård'
  blocks:
  - type: paragraph
    id: hb-c10-u0149
    text: Det blir stora hälsoproblem om urinen eller menstruationsblodet inte kommer ut normalt. Följden
      kan vara till exempel olika inflammationer. Sexuellt umgänge kan innebära problem, och kvinnan kan
      ha svårt att njuta av sex. Könsstympning ökar också riskerna vid graviditet och förlossning. Dessutom
      kan traumat förknippat med åtgärden orsaka problem med den mentala hälsan.
    sentences:
    - id: hb-c10-u0149-s001
      start: 0
      end: 87
    - id: hb-c10-u0149-s002
      start: 88
      end: 139
    - id: hb-c10-u0149-s003
      start: 140
      end: 221
    - id: hb-c10-u0149-s004
      start: 222
      end: 287
    - id: hb-c10-u0149-s005
      start: 288
      end: 371
  - type: paragraph
    id: hb-c10-u0150
    text: En kvinna vars könsorgan har stympats kan genomgå en öppningsoperation eller en rekonstruerande
      operation. Vid en öppningsoperation öppnas blygdläpparna, vilket i allmänhet hjälper för problem
      och smärtor vid urinering, menstruation och samlag. En öppningsoperation görs i lokalbedövning på
      en poliklinik och är en snabb åtgärd.
    sentences:
    - id: hb-c10-u0150-s001
      start: 0
      end: 106
    - id: hb-c10-u0150-s002
      start: 107
      end: 244
    - id: hb-c10-u0150-s003
      start: 245
      end: 328
  - type: paragraph
    id: hb-c10-u0151
    text: Vid en rekonstruerande operation försöker man återställa könsorganens normala anatomi och funktion.
      Syftet med en rekonstruerande operation är att underlätta besvären som stympningen orsakar och öka
      kvinnans sexuella välbefinnande. Rekonstruerande operationer utförs av en plastikkirurg på ett sjukhus
      och kräver en läkarremiss från den egna hälsostationen.
    sentences:
    - id: hb-c10-u0151-s001
      start: 0
      end: 99
    - id: hb-c10-u0151-s002
      start: 100
      end: 231
    - id: hb-c10-u0151-s003
      start: 232
      end: 357
- id: hb-c10-funktionsnedsattning
  title: Funktionshinderservice och delaktighet
  blocks:
  - type: paragraph
    id: hb-c10-u0175
    text: De inledande utmaningarna i Finland för en invandrare med funktionsnedsättning hänger ofta samman
      med att hen inte vet hurdana tjänster som finns tillgängliga, var hen ska ansöka om dem och hur
      de ska användas. Om personen har ett uppehållstillstånd och en hemkommun i Finland, har hen rätt
      till olika tjänster som välfärdsområdet och kommunen tillhandahåller, till exempel tjänster för
      personer med funktionsnedsättning, det vill säga funktionshinderservice.
    sentences:
    - id: hb-c10-u0175-s001
      start: 0
      end: 210
    - id: hb-c10-u0175-s002
      start: 211
      end: 459
  - type: paragraph
    id: hb-c10-u0176
    text: En person med funktionsnedsättning som precis flyttat till Finland kan hos välfärdsområdets
      socialvård göra upp en klientplan för funktionshinderservice. I planen skriver man in nödvändiga
      stödåtgärder och tjänster. Nyanlända med funktionsnedsättning har lika rättigheter till integration
      och anknytande åtgärder, till exempel språkundervisning, utbildning och sysselsättning.
    sentences:
    - id: hb-c10-u0176-s001
      start: 0
      end: 153
    - id: hb-c10-u0176-s002
      start: 154
      end: 215
    - id: hb-c10-u0176-s003
      start: 216
      end: 376
  - type: paragraph
    id: hb-c10-u0177
    text: Största delen av välfärdsområdenas social- och hälsovårdstjänster är riktade till alla invånare
      i välfärdsområdet. Välfärdsområdena är också skyldiga att erbjuda personer med funktionsnedsättning
      särskilda tjänster för personer med funktionsnedsättning. Funktionshinderservicen stöder en jämlik
      delaktighet i samhället och underlättar vardagslivet med en funktionsnedsättning.
    sentences:
    - id: hb-c10-u0177-s001
      start: 0
      end: 114
    - id: hb-c10-u0177-s002
      start: 115
      end: 253
    - id: hb-c10-u0177-s003
      start: 254
      end: 376
  - type: paragraph
    id: hb-c10-u0178
    text: En del av tjänsterna för personer med funktionsnedsättning är tillgängliga också för långtidssjuka
      som har svårt att klara av dagliga aktiviteter eller problem med arbetsförmågan på grund av sjukdomen.
      Långvariga sjukdomar som kan försämra en persons funktionsförmåga i vardagen eller arbetslivet är
      till exempel diabetes, epilepsi, astma, reumatism och artros.
    sentences:
    - id: hb-c10-u0178-s001
      start: 0
      end: 201
    - id: hb-c10-u0178-s002
      start: 202
      end: 361
  - type: paragraph
    id: hb-c10-u0179
    text: Färdtjänst får användas av personer med funktionsnedsättning som inte kan använda kollektivtrafiken
      eller som behöver hjälp när de rör sig utanför hemmet.
    sentences:
    - id: hb-c10-u0179-s001
      start: 0
      end: 154
  - type: paragraph
    id: hb-c10-u0180
    text: Man kan få personlig hjälp med dagliga aktiviteter som man inte klarar av på egen hand på grund
      av en funktionsnedsättning eller en sjukdom. Den personliga assistenten hjälper personen med funktionsnedsättning
      till exempel med matlagning och butiksbesök, på arbetsplatsen, eller med att röra sig eller studera.
      Välfärdsområdet betalar assistentens lön.
    sentences:
    - id: hb-c10-u0180-s001
      start: 0
      end: 140
    - id: hb-c10-u0180-s002
      start: 141
      end: 310
    - id: hb-c10-u0180-s003
      start: 311
      end: 352
  - type: paragraph
    id: hb-c10-u0181
    text: Välfärdsområdet ordnar serviceboende och stött boende för personer med funktionsnedsättning.
      Invånaren betalar boendekostnaderna själv. Särskilda tjänster och stödåtgärder som hjälper personen
      att klara de dagliga sysslorna hemma är avgiftsfria.
    sentences:
    - id: hb-c10-u0181-s001
      start: 0
      end: 92
    - id: hb-c10-u0181-s002
      start: 93
      end: 135
    - id: hb-c10-u0181-s003
      start: 136
      end: 245
  - type: paragraph
    id: hb-c10-u0182
    text: Välfärdsområdet ordnar de hjälpmedel som personer med funktionsnedsättning behöver. De kan få
      till exempel en rullstol eller en hörapparat, eller en vit käpp och en ledarhund för synskadade.
      Hjälpmedlen är avgiftsfria.
    sentences:
    - id: hb-c10-u0182-s001
      start: 0
      end: 83
    - id: hb-c10-u0182-s002
      start: 84
      end: 190
    - id: hb-c10-u0182-s003
      start: 191
      end: 218
  - type: paragraph
    id: hb-c10-u0183
    text: Gravt handikappade kan få parkeringstillstånd för rörelsehindrade. En bil med parkeringstillstånd
      får parkera på platser som är markerade med ett rullstolsmärke. Dessa parkeringsplatser finns nära
      ingången till byggnader.
    sentences:
    - id: hb-c10-u0183-s001
      start: 0
      end: 66
    - id: hb-c10-u0183-s002
      start: 67
      end: 161
    - id: hb-c10-u0183-s003
      start: 162
      end: 221
  - type: paragraph
    id: hb-c10-u0184
    text: En person med en hörselskada, syn- och hörselskada eller en talskada kan få en tolkningstjänst
      för arbete, studier, hobbyer eller ärenden. Rätt till tolkningstjänst för personer med funktionsnedsättning
      söks hos FPA. Av hemkommunen kan man få tolkningstjänster för småbarnspedagogik, för förskoleundervisning
      och för grundläggande undervisning. Det är gratis att använda en tolk om man beviljats rätt att
      använda en tolkningstjänst för personer med funktionsnedsättning. Den som behöver en tolk beställer
      den själv.
    sentences:
    - id: hb-c10-u0184-s001
      start: 0
      end: 138
    - id: hb-c10-u0184-s002
      start: 139
      end: 216
    - id: hb-c10-u0184-s003
      start: 217
      end: 344
    - id: hb-c10-u0184-s004
      start: 345
      end: 470
    - id: hb-c10-u0184-s005
      start: 471
      end: 515
  - type: paragraph
    id: hb-c10-u0185
    text: Om en person har en grav funktionsnedsättning eller en svår sjukdom kan hen få rehabilitering.
      I Finland kan både barn och vuxna få rehabilitering. Rehabilitering erbjuds både personer med funktionsnedsättning
      och deras familjer. Rehabiliteringen är ledd verksamhet och kan vara till exempel en rehabiliteringskurs
      eller olika typer av vård som ges av en yrkesperson, till exempel fysioterapi, psykoterapi, talterapi
      eller ergoterapi. Det är möjligt att få en tolk för rehabiliteringskurser. Syftet med rehabiliteringen
      är att personen trots sin sjukdom eller funktionsnedsättning bättre och mer självständigt ska kunna
      arbeta eller klara sig i vardagen.
    sentences:
    - id: hb-c10-u0185-s001
      start: 0
      end: 94
    - id: hb-c10-u0185-s002
      start: 95
      end: 147
    - id: hb-c10-u0185-s003
      start: 148
      end: 229
    - id: hb-c10-u0185-s004
      start: 230
      end: 434
    - id: hb-c10-u0185-s005
      start: 435
      end: 491
    - id: hb-c10-u0185-s006
      start: 492
      end: 654
  - type: paragraph
    id: hb-c10-u0186
    text: I Finland kan personer med funktionsnedsättning ansöka om EU:s funktionshinderkort. Det beviljas
      personer med en permanent funktionsnedsättning eller en långvarig sjukdom. Kortet kan användas på
      kulturplatser, motions- och idrottsplatser och olika besöksmål både i Finland och flera andra EU-länder.
      Med hjälp av funktionshinderkortet kan användaren visa att hen behöver hjälp, en tillgänglig väg
      eller en assistent vid till exempel idrotts- och kulturevenemang. På många ställen får assistenten
      eller tolken komma med gratis när man visar kortet och det är märkt med ett A.
    sentences:
    - id: hb-c10-u0186-s001
      start: 0
      end: 83
    - id: hb-c10-u0186-s002
      start: 84
      end: 171
    - id: hb-c10-u0186-s003
      start: 172
      end: 299
    - id: hb-c10-u0186-s004
      start: 300
      end: 462
    - id: hb-c10-u0186-s005
      start: 463
      end: 574
  - type: paragraph
    id: hb-c10-u0187
    text: I Finland finns det olika handikapp- och patientorganisationer som bevakar sina medlemmars intressen.
      Via handikapporganisationerna är det också möjligt att påverka samhällets verksamhet och ställningen
      för personer med funktionsnedsättning.
    sentences:
    - id: hb-c10-u0187-s001
      start: 0
      end: 101
    - id: hb-c10-u0187-s002
      start: 102
      end: 241
  - type: paragraph
    id: hb-c10-u0188
    text: Om det måste göras ändringsarbeten eller installeras fasta hjälpmedel i din bostad kan du få
      ersättning för detta. Bostaden kan till exempel byggas om så att du kan röra dig med en rullstol
      i den. Fasta hjälpmedel kan till exempel vara olika typer av lyftanordningar samt brandvarnare och
      dörrklocka för personer med hörselnedsättning, där ljudet har ersatts med lampor. Socialarbetaren
      inom funktionshinderservicen i ditt område bedömer tillsammans med dig om det behövs ändringsarbeten
      i din bostad.
    sentences:
    - id: hb-c10-u0188-s001
      start: 0
      end: 114
    - id: hb-c10-u0188-s002
      start: 115
      end: 196
    - id: hb-c10-u0188-s003
      start: 197
      end: 370
    - id: hb-c10-u0188-s004
      start: 371
      end: 501
  - type: paragraph
    id: hb-c10-u0189
    text: Om du på grund av din funktionsnedsättning inte kan använda kollektivtrafiken kan du ha rätt
      till färdtjänst. Vid behov kan du även ha med dig en ledsagare, det vill säga en person som assisterar
      dig på resor. Du kan få färdtjänst och en ledsagare med dig på resor som anknyter till arbete, studier
      eller fritid. Du kan ansöka om färdtjänst hos funktionshinderservicen i ditt område. Du betalar
      för färdtjänsten högst samma taxa som gäller inom kollektivtrafiken.
    sentences:
    - id: hb-c10-u0189-s001
      start: 0
      end: 109
    - id: hb-c10-u0189-s002
      start: 110
      end: 209
    - id: hb-c10-u0189-s003
      start: 210
      end: 312
    - id: hb-c10-u0189-s004
      start: 313
      end: 383
    - id: hb-c10-u0189-s005
      start: 384
      end: 463
  - type: paragraph
    id: hb-c10-u0190
    text: Om du har en svår funktionsnedsättning eller sjukdom och du är under 65 år kan FPA ordna dig
      krävande medicinsk rehabilitering och ersätta en del av kostnaderna för rehabiliteringen. Du kan
      få rehabilitering om du på grund av din funktionsnedsättning eller sjukdom har stora svårigheter
      att klara av vardagen i hemmet, på jobbet eller i skolan.
    sentences:
    - id: hb-c10-u0190-s001
      start: 0
      end: 182
    - id: hb-c10-u0190-s002
      start: 183
      end: 344
  - type: paragraph
    id: hb-c10-u0191
    text: Du kan få medicinsk rehabilitering vid en rehabiliteringsinrättning eller så att du bor hemma
      och besöker rehabiliteringen. Målet är att du ska klara dig bättre i vardagen.
    sentences:
    - id: hb-c10-u0191-s001
      start: 0
      end: 123
    - id: hb-c10-u0191-s002
      start: 124
      end: 172
  - type: paragraph
    id: hb-c10-u0192
    text: Även barn med en svår funktionsnedsättning kan få krävande medicinsk rehabilitering.
    sentences:
    - id: hb-c10-u0192-s001
      start: 0
      end: 84
  - type: paragraph
    id: hb-c10-u0193
    text: För krävande medicinsk rehabilitering behöver du en rehabiliteringsplan. Kontakta din social-
      och hälsocentral eller läkaren vid företagshälsovården.
    sentences:
    - id: hb-c10-u0193-s001
      start: 0
      end: 72
    - id: hb-c10-u0193-s002
      start: 73
      end: 149
  - type: paragraph
    id: hb-c10-u0194
    text: Familjevård (perhehoito) innebär att en person vårdas, fostras eller omhändertas i ett privat
      hem utanför det egna hemmet. En person med intellektuell funktionsnedsättning som behöver vård kan
      bo i ett familjehem. Man kan också bo tillfälligt i ett familjehem. Familjevård kan även ordnas
      i den vårdbehövandes eget hem.
    sentences:
    - id: hb-c10-u0194-s001
      start: 0
      end: 122
    - id: hb-c10-u0194-s002
      start: 123
      end: 213
    - id: hb-c10-u0194-s003
      start: 214
      end: 260
    - id: hb-c10-u0194-s004
      start: 261
      end: 319
  - type: paragraph
    id: hb-c10-u0195
    text: Om en person med intellektuell funktionsnedsättning behöver kontinuerlig vård och inte kan få
      det hemma eller i en servicebostad kan han eller hon även bo på en anstalt (laitos). Man kan också
      bo korta tider i en anstalt.
    sentences:
    - id: hb-c10-u0195-s001
      start: 0
      end: 178
    - id: hb-c10-u0195-s002
      start: 179
      end: 221
  - type: paragraph
    id: hb-c10-u0196
    text: Välfärdsområdena ordnar arbetsverksamhet (työtoiminta) och dagverksamhet (päivätoiminta) för
      personer med funktionsnedsättning. I arbetsverksamheten ingår lätt arbete. Dagverksamheten är avsedd
      för personer med svår funktionsnedsättning som inte kan delta i arbetsverksamheten. Dagverksamheten
      kan omfatta till exempel matlagning, motion, samtal och friluftsliv.
    sentences:
    - id: hb-c10-u0196-s001
      start: 0
      end: 127
    - id: hb-c10-u0196-s002
      start: 128
      end: 167
    - id: hb-c10-u0196-s003
      start: 168
      end: 277
    - id: hb-c10-u0196-s004
      start: 278
      end: 362
- id: hb-c10-sjukdom
  title: Stöd vid sjukdom och funktionsnedsättning
  blocks:
  - type: paragraph
    id: hb-c10-u0197
    text: Om du blir sjuk eller råkar ut för en olycka har du rätt att stanna hemma från arbetet. Om du
      omfattas av den finländska sjukförsäkringen (sairausvakuutus) har du efter en självrisktid (omavastuuaika)
      rätt att söka sjukdagpenning (sairauspäiväraha) hos FPA (Kela).
    sentences:
    - id: hb-c10-u0197-s001
      start: 0
      end: 87
    - id: hb-c10-u0197-s002
      start: 88
      end: 264
  - type: paragraph
    id: hb-c10-u0198
    text: Självrisktiden är vanligen den dag då du insjuknade och därpå följande nio vardagar. Om din
      anställning har varat över en månad före insjuknandet betalar din arbetsgivare full lön för självrisktiden.
      Sjukdagpenning betalas för högst 300 vardagar. Den ska sökas inom två månader efter insjuknandet.
    sentences:
    - id: hb-c10-u0198-s001
      start: 0
      end: 84
    - id: hb-c10-u0198-s002
      start: 85
      end: 199
    - id: hb-c10-u0198-s003
      start: 200
      end: 246
    - id: hb-c10-u0198-s004
      start: 247
      end: 297
  - type: paragraph
    id: hb-c10-u0199
    text: 'Du kan ansöka om sjukdagpenning om du:'
    sentences:
    - id: hb-c10-u0199-s001
      start: 0
      end: 38
  - id: hb-c10-u0201
    type: list
    ordered: false
    items:
    - id: hb-c10-u0200
      text: omfattas av den finländska sjukförsäkringen
      sentences:
      - id: hb-c10-u0200-s001
        start: 0
        end: 43
    - id: hb-c10-u0202
      text: är 18–67 år gammal
      sentences:
      - id: hb-c10-u0202-s001
        start: 0
        end: 18
    - id: hb-c10-u0203
      text: är arbetsoförmögen på grund av en sjukdom
      sentences:
      - id: hb-c10-u0203-s001
        start: 0
        end: 41
    - id: hb-c10-u0204
      text: är arbetstagare, företagare, yrkesutövare, studerar på heltid eller arbetslös arbetssökande
        eller om du sköter din egen ekonomi.
      sentences:
      - id: hb-c10-u0204-s001
        start: 0
        end: 128
  - type: paragraph
    id: hb-c10-u0205
    text: Om du får lön under sjukledigheten, ansöker din arbetsgivare om sjukdagpenningen. Då betalas
      sjukdagpenningen till din arbetsgivare. Om du är sjuk en lång tid och din arbetsgivare inte längre
      betalar din lön under sjukledigheten, betalar FPA sjukdagpenningen till dig. Sjukdagpenningens belopp
      beror på inkomsterna. När du söker sjukdagpenning ska du till ansökan bifoga ett läkarintyg om arbetsoförmåga.
    sentences:
    - id: hb-c10-u0205-s001
      start: 0
      end: 81
    - id: hb-c10-u0205-s002
      start: 82
      end: 132
    - id: hb-c10-u0205-s003
      start: 133
      end: 268
    - id: hb-c10-u0205-s004
      start: 269
      end: 315
    - id: hb-c10-u0205-s005
      start: 316
      end: 404
  - type: paragraph
    id: hb-c10-u0206
    text: Den partiella sjukdagpenningen (osasairauspäiväraha) är avsedd för 18–67-åriga heltidsarbetande
      anställda eller företagare som omfattas av den sociala tryggheten i Finland . Syftet med den partiella
      sjukdagpenningen är att du kan fortsätta att arbeta eller att återgå till arbetet trots att du har
      blivit sjuk. Diskutera först med din läkare inom företagshälsovården och din arbetsgivare om möjligheten
      att söka partiell sjukdagpenning. Företagshälsovårdsläkaren avgör om du kan deltidsarbeta medan
      du är sjuk.
    sentences:
    - id: hb-c10-u0206-s001
      start: 0
      end: 173
    - id: hb-c10-u0206-s002
      start: 174
      end: 310
    - id: hb-c10-u0206-s003
      start: 311
      end: 436
    - id: hb-c10-u0206-s004
      start: 437
      end: 510
  - type: paragraph
    id: hb-c10-u0207
    text: Om du har en funktionsnedsättning eller en sjukdom som försämrar din funktionsförmåga sammanhängande
      under minst ett år, kan du få handikappbidrag. Du måste ha ett läkarintyg för att ansöka om handikappbidrag.
      Villkoret är att du har rätt till FPA:s förmåner och att du har bott minst tre år i Finland eller
      i något annat EU- eller EES-land eller i Schweiz. Handikappbidrag för vuxna betalas till 16–64-åringar.
      Handikappbidragets storlek beror på hur stor olägenhet din sjukdom eller funktionsnedsättning orsakar
      dig och hur mycket hjälp och handledning du behöver.
    sentences:
    - id: hb-c10-u0207-s001
      start: 0
      end: 147
    - id: hb-c10-u0207-s002
      start: 148
      end: 209
    - id: hb-c10-u0207-s003
      start: 210
      end: 357
    - id: hb-c10-u0207-s004
      start: 358
      end: 411
    - id: hb-c10-u0207-s005
      start: 412
      end: 566
  - type: paragraph
    id: hb-c10-u0208
    text: Om du vårdar en närstående med funktionsnedsättning i hemmet kan du få stöd för närståendevård
      (omaishoidontuki) från ditt välfärdsområde. Fråga mer hos funktionshinderservicen (vammaispalvelut)
      eller rådgivningen om närståendevård (omaishoito) i ditt område.
    sentences:
    - id: hb-c10-u0208-s001
      start: 0
      end: 138
    - id: hb-c10-u0208-s002
      start: 139
      end: 259
  - type: paragraph
    id: hb-c10-u0209
    text: Ett barn under 16 år kan få handikappförmån (vammaistuki) om hen på grund av sin funktionsnedsättning
      eller sin sjukdom behöver regelbunden vård, omsorg och rehabilitering under minst sex månaders tid.
      Du ansöker om handikappförmån för barn under 16 år vid FPA. Handikappförmånet beviljas vanligtvis
      för en bestämd period. När perioden har gått kan man ansöka om förlängning för bidraget.
    sentences:
    - id: hb-c10-u0209-s001
      start: 0
      end: 201
    - id: hb-c10-u0209-s002
      start: 202
      end: 261
    - id: hb-c10-u0209-s003
      start: 262
      end: 322
    - id: hb-c10-u0209-s004
      start: 323
      end: 388
  - type: paragraph
    id: hb-c10-u0272
    text: Du kan ansöka om specialvårdspenning om du måste delta i vård eller rehabilitering av ett barn
      med en svår sjukdom eller en funktionsnedsättning och kan inte arbeta på grund av det. Som alternativ
      för specialvårdspenning har du rätt till rehabiliteringspenning under rehabilitering av barnet.
    sentences:
    - id: hb-c10-u0272-s001
      start: 0
      end: 181
    - id: hb-c10-u0272-s002
      start: 182
      end: 292
  - type: paragraph
    id: hb-c10-u0210
    text: Du kan få specialvårdspenning från FPA om du
    sentences:
    - id: hb-c10-u0210-s001
      start: 0
      end: 44
  - id: hb-c10-u0212
    type: list
    ordered: false
    items:
    - id: hb-c10-u0211
      text: deltar i sjukhus- eller poliklinikvården av ditt barn som är under 7 år
      sentences:
      - id: hb-c10-u0211-s001
        start: 0
        end: 71
    - id: hb-c10-u0213
      text: deltar i sjukhus- eller poliklinikvården av ditt barn i åldern 7–15 år som har en svår sjukdom
      sentences:
      - id: hb-c10-u0213-s001
        start: 0
        end: 94
    - id: hb-c10-u0214
      text: deltar i rehabiliteringen av ditt barn i åldern 0–15 år
      sentences:
      - id: hb-c10-u0214-s001
        start: 0
        end: 55
    - id: hb-c10-u0215
      text: vårdar ditt barn under 16 år som har en svår sjukdom hemma och att hemvården är kopplad till
        barnets sjukhus- eller poliklinikvård
      sentences:
      - id: hb-c10-u0215-s001
        start: 0
        end: 130
    - id: hb-c10-u0216
      text: finns i beredskap under barnets skol- eller dagvårdsförsök i anslutning till en svår sjukdom.
      sentences:
      - id: hb-c10-u0216-s001
        start: 0
        end: 93
  - type: paragraph
    id: hb-c10-u0217
    text: En pensionär vars funktionsförmåga försämrats under sammanlagt minst ett år på grund av sjukdom
      eller skada kan få vårdbidrag för pensionstagare. Du kan få stöd om du på grund av ditt handikapp
      eller din sjukdom behöver regelbunden hjälp eller handledning och övervakning. Hur stort stöd du
      får beror på hur mycket hjälp du behöver. Du kan ansöka om vårdbidrag för pensionstagare hos FPA.
    sentences:
    - id: hb-c10-u0217-s001
      start: 0
      end: 145
    - id: hb-c10-u0217-s002
      start: 146
      end: 272
    - id: hb-c10-u0217-s003
      start: 273
      end: 332
    - id: hb-c10-u0217-s004
      start: 333
      end: 388
- id: hb-c10-pension
  title: Pensioner
  blocks:
  - type: paragraph
    id: hb-c10-u0218
    text: Du kan få ålderspension när du uppnår pensionsåldern. Åldersgränsen beror på när du är född.
      Om du till exempel är född 1964, är din pensionsålder 65 år.
    sentences:
    - id: hb-c10-u0218-s001
      start: 0
      end: 53
    - id: hb-c10-u0218-s002
      start: 54
      end: 92
    - id: hb-c10-u0218-s003
      start: 93
      end: 153
  - type: paragraph
    id: hb-c10-u0219
    text: Pensioner betalas ut av arbetspensionsanstalter och FPA. Arbetspensionsanstalterna betalar ut
      arbetspension. Den grundar sig på lönen och andra arbetsinkomster. Om arbetspensionen är liten,
      kan du också få pension från FPA.
    sentences:
    - id: hb-c10-u0219-s001
      start: 0
      end: 56
    - id: hb-c10-u0219-s002
      start: 57
      end: 108
    - id: hb-c10-u0219-s003
      start: 109
      end: 160
    - id: hb-c10-u0219-s004
      start: 161
      end: 223
  - type: paragraph
    id: hb-c10-u0220
    text: Om du vill kan du också arbeta när du är pensionerad. Om du får ålderspension påverkar din arbetsinkomst
      inte pensionens storlek. Då tjänar du in ny pension, som betalas ut till dig när du uppnått den
      högsta pensionsåldern. Den högsta pensionsåldern är den ålder då du inte längre tjänar in ny pension
      även om du fortsätter arbeta. Du kan kontrollera dina lägsta och högsta ålderspensionsålder till
      exempel med Pensionsskyddscentralens (Eläketurvakeskus) eller arbetspensionsanstaltens räknare.
    sentences:
    - id: hb-c10-u0220-s001
      start: 0
      end: 53
    - id: hb-c10-u0220-s002
      start: 54
      end: 129
    - id: hb-c10-u0220-s003
      start: 130
      end: 223
    - id: hb-c10-u0220-s004
      start: 224
      end: 331
    - id: hb-c10-u0220-s005
      start: 332
      end: 494
  - type: paragraph
    id: hb-c10-u0221
    text: Du måste själv ansöka om pension hos din arbetspensionsanstalt, eftersom utbetalningen inte
      börjar automatiskt.
    sentences:
    - id: hb-c10-u0221-s001
      start: 0
      end: 111
  - type: paragraph
    id: hb-c10-u0222
    text: I Finland betalas skatt på pensionerna.
    sentences:
    - id: hb-c10-u0222-s001
      start: 0
      end: 39
  - type: paragraph
    id: hb-c10-u0223
    text: När du arbetar, betalas arbetspensionsavgifter från din lön. Ju högre lön eller arbetsinkomst
      som företagare du får och ju längre du arbetar, desto större blir din arbetspension.
    sentences:
    - id: hb-c10-u0223-s001
      start: 0
      end: 60
    - id: hb-c10-u0223-s002
      start: 61
      end: 178
  - type: paragraph
    id: hb-c10-u0224
    text: Arbetspensionsförsäkringsbolag, pensionskassor och -stiftelser har hand om arbetspensionsförsäkringarna.
      Pensionsskyddscentralen sköter centraliserat frågor som rör pensionsskyddet.
    sentences:
    - id: hb-c10-u0224-s001
      start: 0
      end: 104
    - id: hb-c10-u0224-s002
      start: 105
      end: 181
  - type: paragraph
    id: hb-c10-u0225
    text: Du ska själv följa upp i ditt arbetspensionsutdrag att alla förvärvsinkomster som du haft finns
      med. Om uppgifterna är fel, kontakta din pensionsanstalt.
    sentences:
    - id: hb-c10-u0225-s001
      start: 0
      end: 100
    - id: hb-c10-u0225-s002
      start: 101
      end: 153
  - type: paragraph
    id: hb-c10-u0226
    text: Du kan ansöka om folkpension om du inte har någon arbetspension eller om din arbetspension är
      väldigt liten. Folkpensionens belopp beror på hur länge du har bott eller arbetat i Finland. Dina
      familjeförhållanden och andra kontinuerliga pensionsinkomster påverkar också folkpensionens belopp.
      FPA sköter folkpensionerna och garantipensionerna.
    sentences:
    - id: hb-c10-u0226-s001
      start: 0
      end: 108
    - id: hb-c10-u0226-s002
      start: 109
      end: 186
    - id: hb-c10-u0226-s003
      start: 187
      end: 291
    - id: hb-c10-u0226-s004
      start: 292
      end: 342
  - type: paragraph
    id: hb-c10-u0227
    text: Du kan söka folkpension och garantipension om du omfattas av Finländska socialskyddet och när
      du har bott i Finland minst tre år efter att du fyllde 16 år. Också den tid som du har varit bosatt
      i något annat EU- eller EES-land kan delvis beaktas.
    sentences:
    - id: hb-c10-u0227-s001
      start: 0
      end: 155
    - id: hb-c10-u0227-s002
      start: 156
      end: 246
  - type: paragraph
    id: hb-c10-u0228
    text: Garantipensionen tryggar ett existensminimum för pensionärer. Garantipensionens belopp är mellanskillnaden
      mellan de övriga pensionerna som du får och garantipensionens fulla belopp. Om det sammanlagda beloppet
      från dina övriga pensioner överskrider garantipensionens fulla belopp kan du inte få garantipension.
    sentences:
    - id: hb-c10-u0228-s001
      start: 0
      end: 61
    - id: hb-c10-u0228-s002
      start: 62
      end: 182
    - id: hb-c10-u0228-s003
      start: 183
      end: 311
  - type: paragraph
    id: hb-c10-u0229
    text: Pensionsförsäkringen för företagare, FöPL, tryggar din försörjning om du börjar få sjukpension
      eller ålderspension och företagsverksamheten upphör. Anhöriga kan få familjepension efter att företagaren
      avlider. Pensionsförsäkringen för företagare, FöPL, påverkar förutom arbetspensionen också storleken
      på FPA:s stöd, till exempel sjukdagpenningen, arbetslöshetsförmånen eller föräldradagpenningen.
    sentences:
    - id: hb-c10-u0229-s001
      start: 0
      end: 147
    - id: hb-c10-u0229-s002
      start: 148
      end: 209
    - id: hb-c10-u0229-s003
      start: 210
      end: 397
  - type: paragraph
    id: hb-c10-u0230
    text: Om din arbetspension är liten kan du dessutom få folkpension eller garantipension från FPA.
      Du får mer information om pensionsärenden hos FPA eller arbetspensionsanstalten.
    sentences:
    - id: hb-c10-u0230-s001
      start: 0
      end: 91
    - id: hb-c10-u0230-s002
      start: 92
      end: 172
  - type: paragraph
    id: hb-c10-u0231
    text: Om du har arbetat i andra länder som Finland inte har ett socialskyddsavtal med, måste du själv
      ta reda på om du har rätt att få pension från dessa länder. Om du kan få pension, måste du själv
      ansöka om den.
    sentences:
    - id: hb-c10-u0231-s001
      start: 0
      end: 155
    - id: hb-c10-u0231-s002
      start: 156
      end: 207
  - type: paragraph
    id: hb-c10-u0232
    text: Du ska alltid meddela FPA om varaktig flytt utomlands eller vistelse utomlands som varar över
      tre månader.
    sentences:
    - id: hb-c10-u0232-s001
      start: 0
      end: 106
  - type: paragraph
    id: hb-c10-u0233
    text: Om du vistas utomlands tillfälligt, det vill säga under ett år, betalar FPA vanligtvis din pension
      som vanligt. Om du flyttar utomlands för över ett år, kan du vanligtvis inte få FPA:s ålderspension
      eller invalidpension från Finland. FPA betalar inte heller garantipension till utlandet.
    sentences:
    - id: hb-c10-u0233-s001
      start: 0
      end: 111
    - id: hb-c10-u0233-s002
      start: 112
      end: 233
    - id: hb-c10-u0233-s003
      start: 234
      end: 287
  - type: paragraph
    id: hb-c10-u0234
    text: I vissa fall kan FPA emellertid betala pension till sådana länder med vilka Finland har ett
      socialskyddsavtal. Exempel på dessa länder är USA, Kanada, Israel, Chile och Australien.
    sentences:
    - id: hb-c10-u0234-s001
      start: 0
      end: 110
    - id: hb-c10-u0234-s002
      start: 111
      end: 180
  - type: paragraph
    id: hb-c10-u0235
    text: Om du har fyllt 61 eller 62 år kan du få partiell pension redan före din lägsta ålderspensionsålder.
      Åldersgränsen för pension beror på vilket år du är född. Detta kallas partiell förtida ålderspension.
      Du kan själv välja om du vill ta ut 25 procent eller 50 procent av beloppet på din månatliga arbetspension.
      Om du vill kan du samtidigt fortsätta arbeta heltid eller komma överens om en kortare arbetstid
      med arbetsgivaren. Du kan också sluta arbeta. Du bör observera att den partiella förtida ålderspensionen
      permanent minskar beloppet på den slutliga ålderspensionen. Du kan fråga mer av din pensionsanstalt.
    sentences:
    - id: hb-c10-u0235-s001
      start: 0
      end: 100
    - id: hb-c10-u0235-s002
      start: 101
      end: 157
    - id: hb-c10-u0235-s003
      start: 158
      end: 202
    - id: hb-c10-u0235-s004
      start: 203
      end: 310
    - id: hb-c10-u0235-s005
      start: 311
      end: 425
    - id: hb-c10-u0235-s006
      start: 426
      end: 452
    - id: hb-c10-u0235-s007
      start: 453
      end: 571
    - id: hb-c10-u0235-s008
      start: 572
      end: 612
  - type: paragraph
    id: hb-c10-u0236
    text: Om du är sjuk under en lång tid får du vanligtvis först sjukdagpenning i ungefär ett år. Om
      du inte kan återgå till arbetet på grund av sjukdom eller skada, kan du ansöka om sjukpension (työkyvyttömyyseläke)
      eller rehabiliteringsstöd (kuntoutustuki).
    sentences:
    - id: hb-c10-u0236-s001
      start: 0
      end: 88
    - id: hb-c10-u0236-s002
      start: 89
      end: 250
  - type: paragraph
    id: hb-c10-u0237
    text: Den partiella sjukpensionen (osatyökyvyttömyyseläke) tryggar din försörjning om din arbetsförmåga
      är nedsatt, men du ändå kan arbeta på deltid. Den partiella sjukpensionen är hälften av sjukpensionen.
    sentences:
    - id: hb-c10-u0237-s001
      start: 0
      end: 143
    - id: hb-c10-u0237-s002
      start: 144
      end: 200
  - type: paragraph
    id: hb-c10-u0238
    text: Om du förvärvsarbetar eller bedriver företagsverksamhet samtidigt som du får sjukpension ska
      du fråga FPA eller din arbetspensionsanstalt hur mycket du får tjäna. Om du har en tillräckligt
      hög inkomst från arbetet per månad kan du låta din pension vila. Detta innebär att du håller en
      paus i lyftandet av pensionen. Pausen kan vara minst tre månader och högst två år lång. Under denna
      tid förlorar du inte rätten till sjukpension.
    sentences:
    - id: hb-c10-u0238-s001
      start: 0
      end: 162
    - id: hb-c10-u0238-s002
      start: 163
      end: 253
    - id: hb-c10-u0238-s003
      start: 254
      end: 315
    - id: hb-c10-u0238-s004
      start: 316
      end: 372
    - id: hb-c10-u0238-s005
      start: 373
      end: 430
  - type: paragraph
    id: hb-c10-u0239
    text: Utöver pension kan FPA betala ut bostadsbidrag till pensionstagare med låga inkomster.
    sentences:
    - id: hb-c10-u0239-s001
      start: 0
      end: 86
  - type: paragraph
    id: hb-c10-u0240
    text: Till långtidssjuka eller handikappade kan FPA betala ut vårdbidrag för pensionstagare. Fråga
      mer på FPA.
    sentences:
    - id: hb-c10-u0240-s001
      start: 0
      end: 86
    - id: hb-c10-u0240-s002
      start: 87
      end: 104
  - type: paragraph
    id: hb-c10-u0241
    text: När du har pensionerats kan du få pensionärsrabatt till exempel på tåg-, buss- och flygresor
      i Finland. De som fyllt 65 år får reserabatt genom att uppvisa sitt identitetsbevis. En pensionär
      som inte har fyllt 65 år kan få rabatt genom att uppvisa sitt personbevis och sitt arbetspensionskort
      eller folkpensionärskort. Kontrollera villkoren för pensionärsrabatten på biljettkontoren.
    sentences:
    - id: hb-c10-u0241-s001
      start: 0
      end: 103
    - id: hb-c10-u0241-s002
      start: 104
      end: 177
    - id: hb-c10-u0241-s003
      start: 178
      end: 318
    - id: hb-c10-u0241-s004
      start: 319
      end: 383
  - type: paragraph
    id: hb-c10-u0242
    text: Du kan även få rabatt på exempelvis olika former av motion och kultur.
    sentences:
    - id: hb-c10-u0242-s001
      start: 0
      end: 70
  - type: paragraph
    id: hb-c10-u0243
    text: 'Finlands pensionssystem består av tre delar: arbetspension, folkpension och garantipension.
      Ofta består en persons pension av flera olika typer av pensioner, till exempel arbetspension och
      partiell folkpension.'
    sentences:
    - id: hb-c10-u0243-s001
      start: 0
      end: 91
    - id: hb-c10-u0243-s002
      start: 92
      end: 210
  - type: paragraph
    id: hb-c10-u0244
    text: Största delen av pensionerna är arbetspensioner. Arbetspensionens belopp baserar sig på de pensionsförsäkringsavgifter
      som man betalat på sin lön. En del av försäkringsavgifterna betalas av arbetstagaren och en del
      av arbetsgivaren. Pensionens belopp påverkas av bland annat lönens nivå och antalet arbetsår. Arbetspensionen
      betalas av en arbetspensionsanstalt. Också företagare kan få arbetspension, men de måste betala
      sina pensionsförsäkringsavgifter själva.
    sentences:
    - id: hb-c10-u0244-s001
      start: 0
      end: 48
    - id: hb-c10-u0244-s002
      start: 49
      end: 146
    - id: hb-c10-u0244-s003
      start: 147
      end: 232
    - id: hb-c10-u0244-s004
      start: 233
      end: 308
    - id: hb-c10-u0244-s005
      start: 309
      end: 361
    - id: hb-c10-u0244-s006
      start: 362
      end: 461
  - type: paragraph
    id: hb-c10-u0245
    text: Om en person inte längre kan arbeta på grund av en sjukdom eller skada, kan hen få invalidpension
      från en arbetspensionsanstalt. Det kan man få redan före den officiella pensionsåldern. Invalidpensionen
      kan vara full eller partiell. Partiell invalidpension innebär att personen arbetar deltid. Hens
      inkomster består då av dels en lön och dels en pension.
    sentences:
    - id: hb-c10-u0245-s001
      start: 0
      end: 128
    - id: hb-c10-u0245-s002
      start: 129
      end: 185
    - id: hb-c10-u0245-s003
      start: 186
      end: 232
    - id: hb-c10-u0245-s004
      start: 233
      end: 293
    - id: hb-c10-u0245-s005
      start: 294
      end: 354
  - type: paragraph
    id: hb-c10-u0246
    text: En person kan tjäna in pension i alla de länder där hen har bott och arbetat. I allmänhet tjänar
      man in pension genom att arbeta. I en del länder kan man ansöka om pension med samma blankett som
      man ansöker om pension i Finland. En del länders pensioner söks å andra sidan direkt hos pensionsanstalterna
      i länderna i fråga. På skattedeklarationen måste också pensioner från utlandet uppges.
    sentences:
    - id: hb-c10-u0246-s001
      start: 0
      end: 77
    - id: hb-c10-u0246-s002
      start: 78
      end: 129
    - id: hb-c10-u0246-s003
      start: 130
      end: 228
    - id: hb-c10-u0246-s004
      start: 229
      end: 323
    - id: hb-c10-u0246-s005
      start: 324
      end: 390
  - type: paragraph
    id: hb-c10-u0247
    text: Om en pensionär flyttar utomlands, måste hen alltid anmäla det till FPA. Finska pensioner kan
      på vissa villkor fås till utlandet. Det är bra att i förväg ta reda på om villkoren uppfylls. Likaså
      kan en person i vissa fall ansöka om pension i Finland när hen går i pension i ett annat land.
    sentences:
    - id: hb-c10-u0247-s001
      start: 0
      end: 72
    - id: hb-c10-u0247-s002
      start: 73
      end: 129
    - id: hb-c10-u0247-s003
      start: 130
      end: 187
    - id: hb-c10-u0247-s004
      start: 188
      end: 289
  - type: paragraph
    id: hb-c10-u0248
    text: En person kan arbeta även om hen är pensionerad. Arbete som utförs när man är pensionär ökar
      arbetspensionens belopp. Som pensionär kan man arbeta deltid eller heltid. Om en person har invalidpension
      får hen arbeta endast i begränsad utsträckning. Om arbetsinkomsterna överskrider en viss inkomstgräns
      kan utbetalningen av invalidpensionen avbrytas.
    sentences:
    - id: hb-c10-u0248-s001
      start: 0
      end: 48
    - id: hb-c10-u0248-s002
      start: 49
      end: 117
    - id: hb-c10-u0248-s003
      start: 118
      end: 167
    - id: hb-c10-u0248-s004
      start: 168
      end: 247
    - id: hb-c10-u0248-s005
      start: 248
      end: 349
- id: hb-c10-aldre
  title: Äldreomsorg och ett självständigt liv
  blocks:
  - type: paragraph
    id: hb-c10-u0249
    text: Nuförtiden lever de äldre i Finland ofta själva eller med sin make. Tack vare folkpensionslagen
      som trädde i kraft år 1957 har de möjlighet till det. Folkpensionslagen garanterade alla äldre en
      pension, även personer som inte har arbetat.
    sentences:
    - id: hb-c10-u0249-s001
      start: 0
      end: 67
    - id: hb-c10-u0249-s002
      start: 68
      end: 149
    - id: hb-c10-u0249-s003
      start: 150
      end: 238
  - type: paragraph
    id: hb-c10-u0250
    text: Äldre människor bodde tidigare hemma med sin familj, och flera generationer kunde bo i samma
      hushåll. Medlemmarna i familjen och släkten tog hand om varandra. Om en äldre inte hade någon familj,
      var hen tvungen att bo på ett kommunalhem. Det var en inrättning avsedd för äldre där förhållandena
      var anspråkslösa.
    sentences:
    - id: hb-c10-u0250-s001
      start: 0
      end: 101
    - id: hb-c10-u0250-s002
      start: 102
      end: 158
    - id: hb-c10-u0250-s003
      start: 159
      end: 237
    - id: hb-c10-u0250-s004
      start: 238
      end: 312
  - type: paragraph
    id: hb-c10-u0251
    text: När kvinnorna började arbeta utanför hemmet och familjerna blev mindre blev det svårare att
      ta hand om de äldre hemma. Samtidigt höjdes levnadsstandarden, vilket gav de äldre nya möjligheter
      till ett självständigt liv.
    sentences:
    - id: hb-c10-u0251-s001
      start: 0
      end: 118
    - id: hb-c10-u0251-s002
      start: 119
      end: 218
  - type: paragraph
    id: hb-c10-u0252
    text: När en människa blir äldre är det viktigt att hen fortsätter att ta hand om sin hälsa. Betydelsen
      av att bibehålla hälsan, välbefinnandet och funktionsförmågan ökar när man blir äldre. Åldrandet
      orsakar förändringar i människans kropp. Det kan bli svårare att röra sig och man har kanske mindre
      krafter. Man kan ha problem med minnet. Olika sjukdomar kan förändra kroppen och försämra ens funktionsförmåga.
      Vanliga sjukdomar bland äldre i Finland är till exempel minnessjukdomar, diabetes, hjärtsjukdomar,
      lungsjukdomar och cancer.
    sentences:
    - id: hb-c10-u0252-s001
      start: 0
      end: 86
    - id: hb-c10-u0252-s002
      start: 87
      end: 184
    - id: hb-c10-u0252-s003
      start: 185
      end: 235
    - id: hb-c10-u0252-s004
      start: 236
      end: 303
    - id: hb-c10-u0252-s005
      start: 304
      end: 334
    - id: hb-c10-u0252-s006
      start: 335
      end: 406
    - id: hb-c10-u0252-s007
      start: 407
      end: 531
  - type: paragraph
    id: hb-c10-u0253
    text: Man kan påverka sin hälsa och sitt välbefinnande genom sina levnadsvanor genom hela livet. Människans
      funktionsförmåga fortsätter att vara god när hen träffar andra människor och är aktiv. Dessutom
      är det bra att äta mångsidigt, motionera, undvika övervikt, låta blir att röka och undvika alkohol
      eller endast dricka måttligt. En god funktionsförmåga hjälper en att klara sig i vardagen och ta
      hand om sig själv och sitt hem.
    sentences:
    - id: hb-c10-u0253-s001
      start: 0
      end: 90
    - id: hb-c10-u0253-s002
      start: 91
      end: 188
    - id: hb-c10-u0253-s003
      start: 189
      end: 326
    - id: hb-c10-u0253-s004
      start: 327
      end: 425
  - type: paragraph
    id: hb-c10-u0254
    text: Många kriser, förändringar och förluster i livet påverkar människans humör. En bra vardag gör
      att den äldre håller sig vid god psykisk hälsa. När en människa blir äldre blir ofta minnet sämre
      och hen glömmer saker. Det är viktigt att njuta av sitt liv och hitta källor till glädje i alla
      åldrar. Ett aktivt liv och att träffa andra människor ger glädje i vardagen. Kommunerna ordnar fritidsverksamhet
      för äldre. Också många föreningar, organisationer och församlingar ordnar verksamhet och klubbar.
    sentences:
    - id: hb-c10-u0254-s001
      start: 0
      end: 75
    - id: hb-c10-u0254-s002
      start: 76
      end: 141
    - id: hb-c10-u0254-s003
      start: 142
      end: 214
    - id: hb-c10-u0254-s004
      start: 215
      end: 295
    - id: hb-c10-u0254-s005
      start: 296
      end: 364
    - id: hb-c10-u0254-s006
      start: 365
      end: 411
    - id: hb-c10-u0254-s007
      start: 412
      end: 498
  - type: paragraph
    id: hb-c10-u0255
    text: I Finland utför många äldre frivilligarbete, eftersom de vill vara aktiva och påverka samhället.
      Frivilligarbete skänker glädje åt den som utför det. Frivilligarbete kan vara till exempel att hjälpa
      barnfamiljer eller ensamma människor.
    sentences:
    - id: hb-c10-u0255-s001
      start: 0
      end: 96
    - id: hb-c10-u0255-s002
      start: 97
      end: 149
    - id: hb-c10-u0255-s003
      start: 150
      end: 236
  - type: paragraph
    id: hb-c10-u0256
    text: Välfärdsområdena ansvarar för tjänsterna för äldre. De tjänster som välfärdsområdet erbjuder
      är boendeservice och social- och hälsovårdstjänster. Om en äldre behöver tjänster av välfärdsområdet,
      gör en myndighet i området en bedömning av vårdbehovet för hen. I den bedöms vilka tjänster personen
      behöver. Välfärdsområdet beviljar tjänster utifrån det individuella behovet.
    sentences:
    - id: hb-c10-u0256-s001
      start: 0
      end: 51
    - id: hb-c10-u0256-s002
      start: 52
      end: 145
    - id: hb-c10-u0256-s003
      start: 146
      end: 258
    - id: hb-c10-u0256-s004
      start: 259
      end: 304
    - id: hb-c10-u0256-s005
      start: 305
      end: 372
  - type: paragraph
    id: hb-c10-u0257
    text: Hemmet är en viktig plats för alla. I Finland bor äldre för det mesta i sitt eget hem antingen
      själva eller med sin make. En stor del av människorna vill bo hemma också när de är gamla. Att bo
      ensam kan ändå bli utmanande. Den äldre kan till exempel få svårare att röra sig, få sämre syn eller
      hörsel och få svårt att komma ihåg saker.
    sentences:
    - id: hb-c10-u0257-s001
      start: 0
      end: 35
    - id: hb-c10-u0257-s002
      start: 36
      end: 121
    - id: hb-c10-u0257-s003
      start: 122
      end: 185
    - id: hb-c10-u0257-s004
      start: 186
      end: 222
    - id: hb-c10-u0257-s005
      start: 223
      end: 335
  - type: paragraph
    id: hb-c10-u0258
    text: Ändringar kan göras i bostaden eller dess omgivning så att det blir enklare att bo hemma. Exempelvis
      kan dörrar breddas eller strösklar avlägsnas. Det är viktigt att den äldre känner sig trygg i sitt
      hem.
    sentences:
    - id: hb-c10-u0258-s001
      start: 0
      end: 89
    - id: hb-c10-u0258-s002
      start: 90
      end: 146
    - id: hb-c10-u0258-s003
      start: 147
      end: 204
  - type: paragraph
    id: hb-c10-u0259
    text: Välfärdsområdet kan ordna hemvård eller hemsjukvård för äldre. De anställda inom hemservicen
      hjälper de äldre med sådant som de inte längre kan göra på egen hand. Sådana saker är till exempel
      att äta, gå på toaletten, duscha och klä på sig.
    sentences:
    - id: hb-c10-u0259-s001
      start: 0
      end: 62
    - id: hb-c10-u0259-s002
      start: 63
      end: 162
    - id: hb-c10-u0259-s003
      start: 163
      end: 240
  - type: paragraph
    id: hb-c10-u0260
    text: Om den äldre behöver hemsjukvård, kan hen få besök av en sjukskötare. Hemsjukvård ska sökas
      hos den egna hälsostationen.
    sentences:
    - id: hb-c10-u0260-s001
      start: 0
      end: 69
    - id: hb-c10-u0260-s002
      start: 70
      end: 120
  - type: paragraph
    id: hb-c10-u0261
    text: Både välfärdsområdena och privata företag ordnar hemservice och hemsjukvård. Välfärdsområdet
      kan ge servicesedlar som kan användas för att köpa vårdtjänster av företag. En tjänst som köpts
      med en servicesedel är ett alternativ till den tjänst som välfärdsområdet erbjuder.
    sentences:
    - id: hb-c10-u0261-s001
      start: 0
      end: 76
    - id: hb-c10-u0261-s002
      start: 77
      end: 168
    - id: hb-c10-u0261-s003
      start: 169
      end: 272
  - type: paragraph
    id: hb-c10-u0262
    text: Boende hemma kan stödas genom att man beställer måltidsservice. Måltidsservicen hämtar hem färdiga
      måltider varje dag eller några gånger i veckan.
    sentences:
    - id: hb-c10-u0262-s001
      start: 0
      end: 63
    - id: hb-c10-u0262-s002
      start: 64
      end: 146
  - type: paragraph
    id: hb-c10-u0263
    text: Trygghetsservice eller en trygghetstelefon är avsedd för personer som har svårt att klara vardagen
      på egen hand eller som har någon sjukdom. Trygghetstelefonen kan vara till exempel ett trygghetsarmband.
      När personen trycker på knappen på armbandet får hen kontakt med larmcentralen dygnet runt.
    sentences:
    - id: hb-c10-u0263-s001
      start: 0
      end: 140
    - id: hb-c10-u0263-s002
      start: 141
      end: 203
    - id: hb-c10-u0263-s003
      start: 204
      end: 295
  - type: paragraph
    id: hb-c10-u0264
    text: Ibland vill den äldres familj ta hand om hen hemma. Då tar en av familjemedlemmarna hand om
      den äldre, och välfärdsområdet betalar stöd för närståendevård till vårdaren. Stöd för närståendevård
      kan fås om den äldre behöver hjälp hela tiden och om vården är bindande och krävande. Närståendevårdaren
      har rätt också till lediga dagar.
    sentences:
    - id: hb-c10-u0264-s001
      start: 0
      end: 51
    - id: hb-c10-u0264-s002
      start: 52
      end: 169
    - id: hb-c10-u0264-s003
      start: 170
      end: 279
    - id: hb-c10-u0264-s004
      start: 280
      end: 332
  - type: paragraph
    id: hb-c10-u0265
    text: Välfärdsområdenas dagcenter ordnar dagverksamhet för äldre. Verksamheten stöder hemvården och
      hjälper den äldre att klara sig hemma och närståendevårdaren att orka. De äldre kan tillbringa tid
      på dagcentret och träffa andra människor. De kan också delta i motions-, rekreations- och kulturtjänster,
      till exempel teaterföreställningar. Välfärdsområdet ordnar transporten till dagcentret och serverar
      vanligtvis en måltid under dagen. En separat avgift kan tas ut för färdtjänsten.
    sentences:
    - id: hb-c10-u0265-s001
      start: 0
      end: 59
    - id: hb-c10-u0265-s002
      start: 60
      end: 164
    - id: hb-c10-u0265-s003
      start: 165
      end: 234
    - id: hb-c10-u0265-s004
      start: 235
      end: 334
    - id: hb-c10-u0265-s005
      start: 335
      end: 432
    - id: hb-c10-u0265-s006
      start: 433
      end: 479
  - type: paragraph
    id: hb-c10-u0266
    text: När en äldre inte längre kan bo hemma ordnar välfärdsområdet en bostad för hen på ett servicehus
      eller en inrättning. Också privata företag ordnar serviceboende. Syftet med serviceboende är att
      den äldre ska ha ett tryggt och meningsfullt liv. Den äldre betalar i allmänhet själv för serviceboendet.
    sentences:
    - id: hb-c10-u0266-s001
      start: 0
      end: 117
    - id: hb-c10-u0266-s002
      start: 118
      end: 161
    - id: hb-c10-u0266-s003
      start: 162
      end: 243
    - id: hb-c10-u0266-s004
      start: 244
      end: 299
  - type: paragraph
    id: hb-c10-u0267
    text: En äldre person kan bo på ett servicehus när hen behöver hjälp och omsorg dygnet runt. På ett
      servicehus finns det alltid personal på plats. Alla boende på ett servicehus har en egen bostad
      eller ett eget rum, och det finns många gemensamma utrymmen. Den äldre kan möblera och inreda sin
      bostad med sina egna saker.
    sentences:
    - id: hb-c10-u0267-s001
      start: 0
      end: 86
    - id: hb-c10-u0267-s002
      start: 87
      end: 140
    - id: hb-c10-u0267-s003
      start: 141
      end: 250
    - id: hb-c10-u0267-s004
      start: 251
      end: 315
  - type: paragraph
    id: hb-c10-u0273
    text: Om en äldre person inte längre kan bo hemma eller på ett servicehus placeras hen i institutionsvård.
      En person i institutionsvård behöver kontinuerligt krävande vård som inte kan ordnas på ett säkert
      sätt någon annanstans. Den äldre kan till exempel på grund av en sjukdom behöva hjälp av många vårdare
      varje dag.
    sentences:
    - id: hb-c10-u0273-s001
      start: 0
      end: 100
    - id: hb-c10-u0273-s002
      start: 101
      end: 222
    - id: hb-c10-u0273-s003
      start: 223
      end: 313
  - type: paragraph
    id: hb-c10-u0268
    text: Om familjen vill kan den delta i vården av den äldre som får institutionsvård. Syftet med institutionsvården
      är att upprätthålla den äldres funktionsförmåga och förbättra hens livskvalitet och mående.
    sentences:
    - id: hb-c10-u0268-s001
      start: 0
      end: 78
    - id: hb-c10-u0268-s002
      start: 79
      end: 200
  - type: paragraph
    id: hb-c10-u0269
    text: På hälsostationerna kan äldre låna olika hjälpmedel. För mobiliteten kan man få låna till exempel
      en promenadkäpp eller en rollator. En rollator är ett hjälpmedel som man kan stödja sig på när man
      går.
    sentences:
    - id: hb-c10-u0269-s001
      start: 0
      end: 52
    - id: hb-c10-u0269-s002
      start: 53
      end: 132
    - id: hb-c10-u0269-s003
      start: 133
      end: 201
  - type: paragraph
    id: hb-c10-u0270
    text: I Finland kan du få olika slags tjänster som underlättar vardagen och gör det möjligt för dig
      att bo hemma. Om du har hemkommun i Finland har du rätt till tjänsterna för äldre som ditt välfärdsområde
      (hyvinvointialue) tillhandahåller.
    sentences:
    - id: hb-c10-u0270-s001
      start: 0
      end: 107
    - id: hb-c10-u0270-s002
      start: 108
      end: 234
  - type: paragraph
    id: hb-c10-u0271
    text: Om ditt hälsotillstånd är dåligt och du behöver hjälp för att klara vardagen kan du ansöka om
      hemvård (kotihoito) hos socialtjänsterna i ditt område. Hemvården omfattar hemtjänster, hemsjukvård
      och stödtjänster.
    sentences:
    - id: hb-c10-u0271-s001
      start: 0
      end: 149
    - id: hb-c10-u0271-s002
      start: 150
      end: 211
