schema_version: 1
id: hb-c07
language: sv
title: Arbete, näringsliv och beskattning
sections:
- id: hb-c07-ekonomi
  title: Samhällets sektorer och ekonomi
  blocks:
  - type: paragraph
    id: hb-c07-u0001
    text: Före andra världskriget arbetade största delen av den arbetande befolkningen i Finland inom
      jordbruket. Från och med 1950-talet har antalet finländare som försörjer sig på jordbruk minskat
      drastiskt. Människorna har övergått till att arbeta inom industrin och tjänstesektorn.
    sentences:
    - id: hb-c07-u0001-s001
      start: 0
      end: 103
    - id: hb-c07-u0001-s002
      start: 104
      end: 199
    - id: hb-c07-u0001-s003
      start: 200
      end: 275
  - type: paragraph
    id: hb-c07-u0002
    text: Antalet arbetstagare inom i synnerhet servicenäringarna har ökat mycket kraftigt. Servicenäringarna
      består av en mycket varierande grupp yrkesområden. Exempel på yrken inom servicebranschen är servitör,
      busschaufför, klasslärare, violinist, programutvecklare och företagskonsult.
    sentences:
    - id: hb-c07-u0002-s001
      start: 0
      end: 81
    - id: hb-c07-u0002-s002
      start: 82
      end: 150
    - id: hb-c07-u0002-s003
      start: 151
      end: 279
  - type: paragraph
    id: hb-c07-u0003
    text: Näringsstrukturen började förändras senare i Finland än i en del andra europeiska länder, men
      utvecklingen var snabb. Antalet arbetstagare inom i synnerhet social- och hälsovårdssektorn ökade
      när finska staten började utveckla sin offentliga service. Även om servicebranscherna ökade mycket,
      utvecklades också industrin i Finland i rask takt. De största industrisektorerna var skogsindustrin,
      träindustrin och pappersindustrin samt metallindustrin och verkstadsindustrin.
    sentences:
    - id: hb-c07-u0003-s001
      start: 0
      end: 117
    - id: hb-c07-u0003-s002
      start: 118
      end: 250
    - id: hb-c07-u0003-s003
      start: 251
      end: 342
    - id: hb-c07-u0003-s004
      start: 343
      end: 471
  - type: paragraph
    id: hb-c07-u0004
    text: Finland är starkt beroende av exporten till och handeln med andra länder. Export betyder att
      finländska företag säljer varor och tjänster till andra länder. Dessa företag betalar skatt i Finland
      och lön till sina anställda. På så vis stannar pengarna i Finland. Import i sin tur innebär att
      man importerar varor och tjänster till Finland från andra länder. Då betalar företag och människor
      i Finland för varorna och tjänsterna till företag i andra länder.
    sentences:
    - id: hb-c07-u0004-s001
      start: 0
      end: 73
    - id: hb-c07-u0004-s002
      start: 74
      end: 156
    - id: hb-c07-u0004-s003
      start: 157
      end: 223
    - id: hb-c07-u0004-s004
      start: 224
      end: 261
    - id: hb-c07-u0004-s005
      start: 262
      end: 356
    - id: hb-c07-u0004-s006
      start: 357
      end: 455
  - type: paragraph
    id: hb-c07-u0005
    text: De viktigaste exportprodukterna för Finland är olika produkter från teknikindustrin, såsom produkter
      från elektronik- och elindustrin och maskin- och metallindustrin. Andra viktiga exportprodukter
      är produkter från kemiindustrin och skogsindustrin.
    sentences:
    - id: hb-c07-u0005-s001
      start: 0
      end: 166
    - id: hb-c07-u0005-s002
      start: 167
      end: 248
  - type: paragraph
    id: hb-c07-u0006
    text: Också informationstekniken, det vill säga IKT-branschen, är viktig för Finland. Förut tillverkades
      mycket mobiltelefoner i Finland. Numera sysselsätter IKT-branschen människor inom till exempel serverbranschen,
      dataspelsbranschen och programvaruutveckling.
    sentences:
    - id: hb-c07-u0006-s001
      start: 0
      end: 79
    - id: hb-c07-u0006-s002
      start: 80
      end: 131
    - id: hb-c07-u0006-s003
      start: 132
      end: 256
  - type: paragraph
    id: hb-c07-u0007
    text: Det ekonomiska systemet i Finland bygger på en öppen marknadsekonomi. Det betyder att Finland
      bedriver handel med andra länder och att exporten är en viktig del av Finlands ekonomi. I en marknadsekonomi
      bestäms priserna på produkter och tjänster på den fria marknaden, enligt utbudet och efterfrågan.
      Vem som helst kan bli företagare och starta ett företag. Privata företag producerar varor och tjänster
      och bedriver handel på marknadens villkor.
    sentences:
    - id: hb-c07-u0007-s001
      start: 0
      end: 69
    - id: hb-c07-u0007-s002
      start: 70
      end: 181
    - id: hb-c07-u0007-s003
      start: 182
      end: 300
    - id: hb-c07-u0007-s004
      start: 301
      end: 357
    - id: hb-c07-u0007-s005
      start: 358
      end: 446
  - type: paragraph
    id: hb-c07-u0008
    text: Det ekonomiska systemet i Finland, liksom i nästan alla länder, är en så kallad blandekonomi.
      Även om ekonomin baserar sig på fritt utbud och fri efterfrågan av varor och tjänster, reglerar
      den offentliga makten marknadens verksamhet och äger också en del företag. Finska staten äger till
      exempel helt och hållet eller aktiemajoriteten i Posti och VR, som ansvarar för tågtrafiken, samt
      flygbolaget Finnair. Staten har monopol på försäljningen av starka alkoholdrycker som Alko ansvarar
      för.
    sentences:
    - id: hb-c07-u0008-s001
      start: 0
      end: 93
    - id: hb-c07-u0008-s002
      start: 94
      end: 264
    - id: hb-c07-u0008-s003
      start: 265
      end: 407
    - id: hb-c07-u0008-s004
      start: 408
      end: 491
  - type: paragraph
    id: hb-c07-u0009
    text: När man talar om ekonomi och arbetsplatser talar man ofta om den privata sektorn och den offentliga
      sektorn. Med privata sektorn avses närmast företagsverksamhet som ägs av privatpersoner eller privata
      grupper. Till den privata sektorn hör alla företag, både små företag och stora multinationella företag.
      Syftet med företag är att generera vinst för sina ägare. Företagen lyssnar på vad de betalande kunderna
      vill ha och behöver och erbjuder dem sådana varor och tjänster. Företagen betalar skatt till staten.
      Med statens skatteintäkter bekostas den offentliga sektorns tjänster.
    sentences:
    - id: hb-c07-u0009-s001
      start: 0
      end: 108
    - id: hb-c07-u0009-s002
      start: 109
      end: 210
    - id: hb-c07-u0009-s003
      start: 211
      end: 305
    - id: hb-c07-u0009-s004
      start: 306
      end: 362
    - id: hb-c07-u0009-s005
      start: 363
      end: 473
    - id: hb-c07-u0009-s006
      start: 474
      end: 510
    - id: hb-c07-u0009-s007
      start: 511
      end: 580
  - type: paragraph
    id: hb-c07-u0010
    text: Den offentliga sektorn avser staten, kommunerna och välfärdsområdena. De producerar tjänster
      som främjar människornas välfärd. Den offentliga sektorns uppgift är inte att generera vinst. Sektorn
      är en stor arbetsgivare i Finland. Alla de som arbetar på till exempel offentliga sjukhus, daghem,
      skolor och socialbyråer, liksom vid polisen, hos skatteverket och inom försvarsmakten arbetar för
      staten, kommunerna och välfärdsområdena.
    sentences:
    - id: hb-c07-u0010-s001
      start: 0
      end: 69
    - id: hb-c07-u0010-s002
      start: 70
      end: 126
    - id: hb-c07-u0010-s003
      start: 127
      end: 186
    - id: hb-c07-u0010-s004
      start: 187
      end: 229
    - id: hb-c07-u0010-s005
      start: 230
      end: 432
  - type: paragraph
    id: hb-c07-u0011
    text: Ofta talar man förutom om den offentliga och den privata sektorn också om den tredje sektorn.
      Med tredje sektorn avses olika organisationer, till exempel idrottsföreningar, miljöorganisationer
      och politiska organisationer. En stor del av organisationerna utför socialt eller ideellt arbete.
      De vill alltså förbättra förhållandena för människorna och samhället socialt eller samhälleligt.
      En del av arbetstagarna inom den tredje sektorn får lön för sitt arbete, men en stor del av verksamheten
      bedrivs av frivilliga. Syftet med organisationerna är inte att generera vinst.
    sentences:
    - id: hb-c07-u0011-s001
      start: 0
      end: 93
    - id: hb-c07-u0011-s002
      start: 94
      end: 222
    - id: hb-c07-u0011-s003
      start: 223
      end: 290
    - id: hb-c07-u0011-s004
      start: 291
      end: 387
    - id: hb-c07-u0011-s005
      start: 388
      end: 515
    - id: hb-c07-u0011-s006
      start: 516
      end: 571
  - type: paragraph
    id: hb-c07-u0012
    text: I dag talar man också om fjärde sektorn. Med den avses ett fritt och utspritt medborgarsamhälle.
      Medborgarverksamheten inom den fjärde sektorn har ökat sin betydelse vid sidan om mer traditionell
      organisationsverksamhet. Till den fjärde sektorn hör till exempel nätverk för stadsodling och återanvändning
      som ofta organiserar sin verksamhet via sociala medier.
    sentences:
    - id: hb-c07-u0012-s001
      start: 0
      end: 40
    - id: hb-c07-u0012-s002
      start: 41
      end: 96
    - id: hb-c07-u0012-s003
      start: 97
      end: 220
    - id: hb-c07-u0012-s004
      start: 221
      end: 360
- id: hb-c07-arbetsmarknad
  title: Arbetsmarknaden och sysselsättning
  blocks:
  - type: paragraph
    id: hb-c07-u0013
    text: Arbetsmarknaden betyder marknaden mellan arbetsgivare och arbetstagare, där arbetstagarna söker
      arbete och arbetsgivarna erbjuder arbete. När en arbetsgivare erbjuder ett arbete åt en arbetstagare
      gör de upp ett arbetsavtal och kommer i ett anställningsförhållande till varandra. Arbetsmarknaden
      är en viktig del av samhället, som man försöker påverka genom politik och annat beslutsfattande.
      På arbetsmarknaden verkar olika människor i olika ställningar samt många slag av institutioner.
      Arbetsmarknaden styrs av lagar, avtal och näringslivets konjunkturer.
    sentences:
    - id: hb-c07-u0013-s001
      start: 0
      end: 137
    - id: hb-c07-u0013-s002
      start: 138
      end: 279
    - id: hb-c07-u0013-s003
      start: 280
      end: 392
    - id: hb-c07-u0013-s004
      start: 393
      end: 488
    - id: hb-c07-u0013-s005
      start: 489
      end: 558
  - type: paragraph
    id: hb-c07-u0014
    text: Den finländska arbetsmarknaden styrs av en kultur av demokratiskt förhandlande och överenskommande.
      På arbetsmarknaden representeras enskilda människor av institutioner, till exempel intresseorganisationer.
      De förhandlar och kommer överens om arbetsmarknadens regler och åtgärder, som lönenivå, arbetstider,
      åtgärder som förbättrar sysselsättningen och liknande. Det här systemet kallas arbetsmarknadssystemet
      och det har fått sin nuvarande form efter hand.
    sentences:
    - id: hb-c07-u0014-s001
      start: 0
      end: 99
    - id: hb-c07-u0014-s002
      start: 100
      end: 206
    - id: hb-c07-u0014-s003
      start: 207
      end: 362
    - id: hb-c07-u0014-s004
      start: 363
      end: 457
  - type: paragraph
    id: hb-c07-u0015
    text: Det är viktigt att personer som flyttar till Finland får arbete med tanke på såväl deras utkomst,
      välbefinnande och integration som hela samhället. Om en nyanländ får ett bra arbete betalar hen
      också mer skatt, vilket är till nytta för samhällsekonomin och bidrar till att finansiera den offentliga
      servicen.
    sentences:
    - id: hb-c07-u0015-s001
      start: 0
      end: 147
    - id: hb-c07-u0015-s002
      start: 148
      end: 308
  - type: paragraph
    id: hb-c07-u0016
    text: Ju längre en person bor i Finland, desto mer förbättras hens möjligheter att hitta arbete. Integration
      i det finländska samhället och kunskaper i finska eller svenska gör det lättare att få arbete.
    sentences:
    - id: hb-c07-u0016-s001
      start: 0
      end: 90
    - id: hb-c07-u0016-s002
      start: 91
      end: 197
  - type: paragraph
    id: hb-c07-u0017
    text: Situationen i samhället och ekonomin påverkar allas sysselsättning. Om den ekonomiska situationen
      i ett område eller i hela landet är dålig finns det färre lediga arbetsplatser. Också sysselsättningsmöjligheterna
      inom olika branscher varierar.
    sentences:
    - id: hb-c07-u0017-s001
      start: 0
      end: 67
    - id: hb-c07-u0017-s002
      start: 68
      end: 177
    - id: hb-c07-u0017-s003
      start: 178
      end: 243
  - type: paragraph
    id: hb-c07-u0018
    text: När en person flyttar till Finland av andra orsaker än arbete kan det ta längre tid att få sysselsättning
      och man måste anstränga sig för att hitta ett arbete. Om man kan finska eller svenska bra är det
      lättare att hitta arbete. En del arbeten kan utföras på engelska, men det finns mycket färre arbetsmöjligheter.
    sentences:
    - id: hb-c07-u0018-s001
      start: 0
      end: 159
    - id: hb-c07-u0018-s002
      start: 160
      end: 228
    - id: hb-c07-u0018-s003
      start: 229
      end: 314
  - type: paragraph
    id: hb-c07-u0019
    text: En del orter i Finland är svenskspråkiga och en del tvåspråkiga. Därför kan också kunskaper
      i svenska hjälpa en att hitta arbete. På orter där majoriteten talar svenska är kunskaper i svenska
      ofta ett krav för att få en anställning.
    sentences:
    - id: hb-c07-u0019-s001
      start: 0
      end: 64
    - id: hb-c07-u0019-s002
      start: 65
      end: 129
    - id: hb-c07-u0019-s003
      start: 130
      end: 232
  - type: paragraph
    id: hb-c07-u0020
    text: Många arbetsgivare vill att arbetstagaren kan språket som används på arbetsplatsen mycket väl.
      I många arbetsuppgifter är kunskaper i finska eller svenska ett villkor för att bli rekryterad.
      För en del tjänster inom den offentliga sektorn förutsätts att en person kan både finska och svenska.
      Det är värt att utveckla sina kunskaper i finska eller svenska också utanför arbetet till exempel
      genom att gå på språkkurser. Att utveckla sina språkkunskaper kan hjälpa en att avancera i karriären
      eller göra det lättare att hitta ett nytt arbete.
    sentences:
    - id: hb-c07-u0020-s001
      start: 0
      end: 94
    - id: hb-c07-u0020-s002
      start: 95
      end: 190
    - id: hb-c07-u0020-s003
      start: 191
      end: 292
    - id: hb-c07-u0020-s004
      start: 293
      end: 419
    - id: hb-c07-u0020-s005
      start: 420
      end: 541
  - type: paragraph
    id: hb-c07-u0021
    text: I Finland har utbildningsnivån stor inverkan på sysselsättningsmöjligheterna och lönen. Det
      har också betydelse var utbildningen har avlagts. Arbetsgivare värdesätter ofta utbildning och arbetslivserfarenhet
      som skaffats i Finland mer. För största delen av alla arbetsuppgifter krävs någon typ av utbildning
      eller examen.
    sentences:
    - id: hb-c07-u0021-s001
      start: 0
      end: 87
    - id: hb-c07-u0021-s002
      start: 88
      end: 141
    - id: hb-c07-u0021-s003
      start: 142
      end: 235
    - id: hb-c07-u0021-s004
      start: 236
      end: 321
  - type: paragraph
    id: hb-c07-u0022
    text: När en arbetstagare börjar på en ny arbetsplats måste hen i allmänhet ha nödvändig kompetens
      genom utbildning och tidigare arbetslivserfarenhet för sitt arbete. Dessutom förväntas det ofta
      att hen kontinuerligt fortbildar sig. Det kan innebära olika korta eller längre kurser där arbetstagaren
      kompletterar sina kunskaper och sin kompetens. En del arbetsgivare tillåter att man går kurser på
      arbetstid, och en del kurser kan ordnas av arbetsgivaren.
    sentences:
    - id: hb-c07-u0022-s001
      start: 0
      end: 160
    - id: hb-c07-u0022-s002
      start: 161
      end: 226
    - id: hb-c07-u0022-s003
      start: 227
      end: 340
    - id: hb-c07-u0022-s004
      start: 341
      end: 449
  - type: paragraph
    id: hb-c07-u0023
    text: I en del yrken måste man uppfylla detaljerade behörighetskrav som är fastställda i lag. Kraven
      kan gälla utbildning eller arbetslivserfarenhet, eller avläggande av ett visst prov.
    sentences:
    - id: hb-c07-u0023-s001
      start: 0
      end: 87
    - id: hb-c07-u0023-s002
      start: 88
      end: 179
  - type: paragraph
    id: hb-c07-u0024
    text: Sådana yrken är reglerade yrken. Till exempel de flesta yrken inom hälsovårds- och socialbranschen
      är reglerade i Finland. För att en person ska kunna arbeta inom dessa branscher måste hen ha rätt
      att utöva yrket. Rätten beviljas av Valvira, som är tillstånds- och tillsynsverket för social- och
      hälsovården.
    sentences:
    - id: hb-c07-u0024-s001
      start: 0
      end: 32
    - id: hb-c07-u0024-s002
      start: 33
      end: 122
    - id: hb-c07-u0024-s003
      start: 123
      end: 213
    - id: hb-c07-u0024-s004
      start: 214
      end: 308
  - type: paragraph
    id: hb-c07-u0025
    text: Andra reglerade yrken är till exempel yrken inom utbildningsbranschen, advokat, revisor, bilskollärare,
      mottagare av körprov och väktare samt kyrkliga yrken och yrken inom räddningsväsendet. Om man har
      avlagt en examen utomlands behöver man ett beslut av en myndighet i Finland för att få behörighet
      att arbeta inom dessa yrken.
    sentences:
    - id: hb-c07-u0025-s001
      start: 0
      end: 190
    - id: hb-c07-u0025-s002
      start: 191
      end: 328
  - type: paragraph
    id: hb-c07-u0026
    text: Om man har avlagt en examen utomlands behöver man ett beslut om erkännande av sin examen också
      om man vill arbeta i en uppgift som det enligt lag krävs en högskoleexamen eller en högskoleexamen
      på en viss nivå för. Sådana uppgifter finns särskilt inom den offentliga sektorn, det vill säga
      hos staten och kommunerna. Beslutet fattas av Utbildningsstyrelsen och är avgiftsbelagt.
    sentences:
    - id: hb-c07-u0026-s001
      start: 0
      end: 214
    - id: hb-c07-u0026-s002
      start: 215
      end: 316
    - id: hb-c07-u0026-s003
      start: 317
      end: 378
  - type: paragraph
    id: hb-c07-u0027
    text: Om du inte är finsk medborgare måste du bevisa för arbetsgivaren att du har rätt att arbeta
      i Finland. Rätten att arbeta beror på i vilket land du är medborgare och från vilket land du flyttar
      hit. Om du har uppehållstillstånd ser du rätten att arbeta på ditt uppehållstillståndskort.
    sentences:
    - id: hb-c07-u0027-s001
      start: 0
      end: 102
    - id: hb-c07-u0027-s002
      start: 103
      end: 197
    - id: hb-c07-u0027-s003
      start: 198
      end: 284
  - type: paragraph
    id: hb-c07-u0028
    text: Visa arbetsgivaren antingen ditt pass, ett officiellt resedokument eller ditt uppehållstillståndskort.
      Du har rätt att själv behålla ditt pass och uppehållstillstånd. Arbetsgivaren har endast rätt att
      se dem. Arbetsgivaren tar vanligtvis en kopia av grunden för din rätt att arbeta, eftersom den enligt
      lag måste förvaras på arbetsplatsen.
    sentences:
    - id: hb-c07-u0028-s001
      start: 0
      end: 102
    - id: hb-c07-u0028-s002
      start: 103
      end: 166
    - id: hb-c07-u0028-s003
      start: 167
      end: 208
    - id: hb-c07-u0028-s004
      start: 209
      end: 339
- id: hb-c07-arbetskultur
  title: Arbetskultur
  blocks:
  - type: paragraph
    id: hb-c07-u0029
    text: Den individinriktade och jämställda kulturen i Finland är tydlig i arbetskulturen i landet.
      Individens kompetens och prestationer är viktiga för att få anställning, utföra arbetet och avancera
      i yrkeskarriären. Att favorisera släktingar eller vänner vid rekrytering oberoende av om personen
      är lämplig för arbetsuppgiften är inte acceptabelt i Finland. Inte heller könet ska påverka anställningen
      eller hur man avancerar i karriären, utan kvinnor och män är jämställda i arbetslivet.
    sentences:
    - id: hb-c07-u0029-s001
      start: 0
      end: 91
    - id: hb-c07-u0029-s002
      start: 92
      end: 210
    - id: hb-c07-u0029-s003
      start: 211
      end: 352
    - id: hb-c07-u0029-s004
      start: 353
      end: 483
  - type: paragraph
    id: hb-c07-u0030
    text: I Finland är man ofta noggrann med att skilja på arbete och fritid. På arbetstid arbetar arbetstagaren,
      och på fritiden har hen egen tid. Arbetet börjar och slutar en viss tid. Människorna tillbringar
      inte nödvändigtvis tid med sina arbetskamrater när de är lediga. Undantag är gemensamma fester på
      arbetsplatsen, till exempel julfester och rekreationsdagar. Syftet med dem är att förbättra gemenskapen
      på arbetsplatsen. Till arbetsplatsens fester blir de anställdas makar inte så ofta inbjudna.
    sentences:
    - id: hb-c07-u0030-s001
      start: 0
      end: 67
    - id: hb-c07-u0030-s002
      start: 68
      end: 137
    - id: hb-c07-u0030-s003
      start: 138
      end: 176
    - id: hb-c07-u0030-s004
      start: 177
      end: 265
    - id: hb-c07-u0030-s005
      start: 266
      end: 358
    - id: hb-c07-u0030-s006
      start: 359
      end: 420
    - id: hb-c07-u0030-s007
      start: 421
      end: 495
  - type: paragraph
    id: hb-c07-u0031
    text: Hierarkin på de finländska arbetsplatserna är i allmänhet låg. Chefen skiljer sig nästan inte
      alls från mängden och utför rätt så liknande arbete som de övriga. Chefen klär sig på samma sätt
      som de andra och hen tilltalas med förnamn. Man kan alltid gå till chefen om man har frågor om arbetet.
      Arbetsklädseln är ofta ledig och informell i Finland. Löneskillnaderna mellan chefen och de anställda
      är ganska små.
    sentences:
    - id: hb-c07-u0031-s001
      start: 0
      end: 62
    - id: hb-c07-u0031-s002
      start: 63
      end: 160
    - id: hb-c07-u0031-s003
      start: 161
      end: 234
    - id: hb-c07-u0031-s004
      start: 235
      end: 294
    - id: hb-c07-u0031-s005
      start: 295
      end: 348
    - id: hb-c07-u0031-s006
      start: 349
      end: 411
  - type: paragraph
    id: hb-c07-u0032
    text: Chefen är ingen absolut auktoritet, utan vanligtvis ger hen de anställda möjlighet att planera
      sitt arbete och komma med idéer. Chefen förväntar sig att de anställda är initiativrika och samvetsgrant
      utför de överenskomna arbetsuppgifterna. Hen övervakar inte hela tiden de anställda, utan litar
      på att arbetet blir gjort. Chefen har ändå rätt att leda arbetet och ge de anställda instruktioner
      och order som de förväntas följa.
    sentences:
    - id: hb-c07-u0032-s001
      start: 0
      end: 127
    - id: hb-c07-u0032-s002
      start: 128
      end: 240
    - id: hb-c07-u0032-s003
      start: 241
      end: 322
    - id: hb-c07-u0032-s004
      start: 323
      end: 428
  - type: paragraph
    id: hb-c07-u0033
    text: Den anställda får på eget initiativ göra sådant på arbetsplatsen som hen märker att skulle vara
      bra att blir gjort. När en arbetsuppgift är klar börjar den anställda på eget initiativ med nästa,
      och när hen märker att något behöver göras gör hen det. Personen väntar inte på att chefen ska säga
      till hen att göra det. Om den anställda inte vet vad hen ska göra eller hur en arbetsuppgift ska
      utföras, frågar hen chefen eller arbetskamraterna.
    sentences:
    - id: hb-c07-u0033-s001
      start: 0
      end: 115
    - id: hb-c07-u0033-s002
      start: 116
      end: 250
    - id: hb-c07-u0033-s003
      start: 251
      end: 317
    - id: hb-c07-u0033-s004
      start: 318
      end: 442
  - type: paragraph
    id: hb-c07-u0034
    text: Utöver initiativrikedom är också punktlighet, flit och samvetsgrannhet uppskattade egenskaper
      hos arbetstagare i Finland. Om en anställd ofta kommer för sent till jobbet eller inte följer tidsplaner
      betraktas hen som opålitlig, vilket till och med kan vara en orsak till att avsluta anställningsförhållandet.
      Under arbetstid strävar man efter att vara flitig och utföra sitt arbete så effektivt som möjligt.
      Samvetsgrannhet betyder att den anställda utför de uppgifter som getts hen så bra som hen kan och
      att man kan lita på hen.
    sentences:
    - id: hb-c07-u0034-s001
      start: 0
      end: 121
    - id: hb-c07-u0034-s002
      start: 122
      end: 308
    - id: hb-c07-u0034-s003
      start: 309
      end: 407
    - id: hb-c07-u0034-s004
      start: 408
      end: 530
  - type: paragraph
    id: hb-c07-u0035
    text: På arbetsplatserna arbetar man ofta i team. Därför är det viktigt att kunna samarbeta med sina
      arbetskamrater. I allmänhet hjälper de anställda varandra och utför flexibelt olika uppgifter enligt
      behov. Människorna litar på varandra och på att var och en utför överenskomna arbetsuppgifter.
    sentences:
    - id: hb-c07-u0035-s001
      start: 0
      end: 43
    - id: hb-c07-u0035-s002
      start: 44
      end: 110
    - id: hb-c07-u0035-s003
      start: 111
      end: 202
    - id: hb-c07-u0035-s004
      start: 203
      end: 290
  - type: paragraph
    id: hb-c07-u0036
    text: På arbetsplatsen är människorna vanligtvis ganska rättframma och säger vad de tänker. Det är
      vanligt att gå rakt på sak utan att först prata om ditt och datt. I arbetet diskuterar man ofta
      direkt också negativa saker. Man behöver alltså inte ta illa upp om till exempel chefen eller en
      arbetskamrat säger att arbetet har utförts dåligt. Alla misslyckas ibland i arbetet. I dag uppmuntras
      respons i arbetet. Respons ges mellan anställda, av anställda till chefen och av chefen till anställda.
      Responsen ska ändå alltid vara saklig och konstruktiv.
    sentences:
    - id: hb-c07-u0036-s001
      start: 0
      end: 85
    - id: hb-c07-u0036-s002
      start: 86
      end: 158
    - id: hb-c07-u0036-s003
      start: 159
      end: 217
    - id: hb-c07-u0036-s004
      start: 218
      end: 336
    - id: hb-c07-u0036-s005
      start: 337
      end: 370
    - id: hb-c07-u0036-s006
      start: 371
      end: 406
    - id: hb-c07-u0036-s007
      start: 407
      end: 491
    - id: hb-c07-u0036-s008
      start: 492
      end: 546
  - type: paragraph
    id: hb-c07-u0037
    text: Om en anställd ombeds att göra en viss arbetsuppgift som hen inte kan, är det bättre att hen
      genast öppet säger att hen inte har gjort uppgiften i fråga tidigare eller annars inte behärskar
      den. Då tycker arbetskamraterna och chefen att den anställda har varit ärlig. Hen kan till exempel
      säga att hen gärna lär sig uppgiften och fråga om någon kan berätta hur man gör.
    sentences:
    - id: hb-c07-u0037-s001
      start: 0
      end: 194
    - id: hb-c07-u0037-s002
      start: 195
      end: 267
    - id: hb-c07-u0037-s003
      start: 268
      end: 369
  - type: paragraph
    id: hb-c07-u0038
    text: Likaså om en anställd ombeds att utföra en extra arbetsuppgift då hen annars har bråttom är
      det bra att ärligt säga att hen inte hinner just nu eller fråga om hen kan utföra uppgiften senare.
    sentences:
    - id: hb-c07-u0038-s001
      start: 0
      end: 191
  - type: paragraph
    id: hb-c07-u0039
    text: Om man inte förstår givna instruktioner eller en tilldelad arbetsuppgift ska man säga det rakt
      ut. I Finland anses det inte skamligt att medge att man inte har förstått. Det är ett större problem
      om man gör fel eller låter bli att göra något för att man inte har förstått instruktionerna.
    sentences:
    - id: hb-c07-u0039-s001
      start: 0
      end: 98
    - id: hb-c07-u0039-s002
      start: 99
      end: 169
    - id: hb-c07-u0039-s003
      start: 170
      end: 288
  - type: paragraph
    id: hb-c07-u0040
    text: I Finland värdesätts förutom ärlighet också anspråkslöshet. Man anser att det som en person
      gör och hur hen agerar är viktigare än vad hen säger.
    sentences:
    - id: hb-c07-u0040-s001
      start: 0
      end: 59
    - id: hb-c07-u0040-s002
      start: 60
      end: 145
- id: hb-c07-arbetsavtal
  title: Arbetsavtal och anställningsformer
  blocks:
  - type: paragraph
    id: hb-c07-u0293
    text: Innan arbetstagaren börjar i det nya arbetet ingår hen ett arbetsavtal med arbetsgivaren. Arbetsavtalet
      ingås vanligen skriftligt, men även ett muntligt avtal är giltigt enligt lagen. Arbetsgivaren måste
      dock alltid ge avtalsvillkoren i skriftlig form om arbetstagaren ber om det. Det är att rekommendera
      att avtalet ingås skriftligt. Då kan båda parterna hålla koll på de överenskomna sakerna och i problemsituationer
      kan man hänvisa till avtalets innehåll.
    sentences:
    - id: hb-c07-u0293-s001
      start: 0
      end: 89
    - id: hb-c07-u0293-s002
      start: 90
      end: 183
    - id: hb-c07-u0293-s003
      start: 184
      end: 280
    - id: hb-c07-u0293-s004
      start: 281
      end: 334
    - id: hb-c07-u0293-s005
      start: 335
      end: 458
  - type: paragraph
    id: hb-c07-u0042
    text: Genom att underteckna arbetsavtalet går den anställda med på det som skrivits in i avtalet,
      till exempel natt- eller helgarbete. I arbetsavtalet kommer man också överens om var arbetet utförs.
    sentences:
    - id: hb-c07-u0042-s001
      start: 0
      end: 128
    - id: hb-c07-u0042-s002
      start: 129
      end: 192
  - type: paragraph
    id: hb-c07-u0043
    text: Det är en god idé att läsa igenom avtalet i lugn och ro innan man undertecknar det för att säkerställa
      att man har förstått vad allt som avtalas i det. Man kan till exempel ta med sig avtalet hem och
      gå igenom det med någon innan man undertecknar det.
    sentences:
    - id: hb-c07-u0043-s001
      start: 0
      end: 151
    - id: hb-c07-u0043-s002
      start: 152
      end: 251
  - type: paragraph
    id: hb-c07-u0044
    text: 'I ett arbetsavtal ingår bland annat följande uppgifter:'
    sentences:
    - id: hb-c07-u0044-s001
      start: 0
      end: 55
  - id: hb-c07-u0046
    type: list
    ordered: false
    items:
    - id: hb-c07-u0045
      text: startdatum för arbetet
      sentences:
      - id: hb-c07-u0045-s001
        start: 0
        end: 22
    - id: hb-c07-u0047
      text: arbetsplats
      sentences:
      - id: hb-c07-u0047-s001
        start: 0
        end: 11
    - id: hb-c07-u0048
      text: information om huruvida anställningen är fast eller tidsbegränsad
      sentences:
      - id: hb-c07-u0048-s001
        start: 0
        end: 65
    - id: hb-c07-u0049
      text: anställningsförhållandets längd
      sentences:
      - id: hb-c07-u0049-s001
        start: 0
        end: 31
    - id: hb-c07-u0050
      text: arbetstid
      sentences:
      - id: hb-c07-u0050-s001
        start: 0
        end: 9
    - id: hb-c07-u0051
      text: arbetsuppgift
      sentences:
      - id: hb-c07-u0051-s001
        start: 0
        end: 13
    - id: hb-c07-u0052
      text: prövotiden och dess längd
      sentences:
      - id: hb-c07-u0052-s001
        start: 0
        end: 25
    - id: hb-c07-u0053
      text: lön och lönebetalningsperiod
      sentences:
      - id: hb-c07-u0053-s001
        start: 0
        end: 28
    - id: hb-c07-u0054
      text: kollektivavtal
      sentences:
      - id: hb-c07-u0054-s001
        start: 0
        end: 14
    - id: hb-c07-u0055
      text: semester
      sentences:
      - id: hb-c07-u0055-s001
        start: 0
        end: 8
    - id: hb-c07-u0056
      text: uppsägningstid.
      sentences:
      - id: hb-c07-u0056-s001
        start: 0
        end: 15
  - type: paragraph
    id: hb-c07-u0057
    text: Arbetet och arbetets karaktär har förändrats mycket i Finland under de senaste årtiondena. Tidigare
      arbetade en stor del av människorna heltid på samma arbetsplats i många år eller till och med hela
      sin karriär. Numera är arbetet inte lika oföränderligt. En del utför många olika arbeten samtidigt
      för olika arbetsgivare. Andelen deltidsarbeten och korta anställningar, det vill säga kortjobb,
      har ökat.
    sentences:
    - id: hb-c07-u0057-s001
      start: 0
      end: 90
    - id: hb-c07-u0057-s002
      start: 91
      end: 211
    - id: hb-c07-u0057-s003
      start: 212
      end: 254
    - id: hb-c07-u0057-s004
      start: 255
      end: 321
    - id: hb-c07-u0057-s005
      start: 322
      end: 403
  - type: paragraph
    id: hb-c07-u0058
    text: Ett arbetsavtal kan antingen gälla tills vidare, det vill säga vara fast, eller vara tidsbegränsat.
      Alla anställda måste ändå behandlas jämlikt. Visstidsanställda eller deltidsanställda får inte ha
      sämre arbetsvillkor än fast anställda eller heltidsanställda.
    sentences:
    - id: hb-c07-u0058-s001
      start: 0
      end: 99
    - id: hb-c07-u0058-s002
      start: 100
      end: 144
    - id: hb-c07-u0058-s003
      start: 145
      end: 259
  - type: paragraph
    id: hb-c07-u0059
    text: Ett arbetsavtal som gäller tills vidare innebär att anställningsförhållandet är fortlöpande,
      det vill säga fast eller ordinarie. Arbetsgivaren eller den anställda kan vid behov säga upp avtalet,
      men i sådana fall iakttas en uppsägningstid.
    sentences:
    - id: hb-c07-u0059-s001
      start: 0
      end: 128
    - id: hb-c07-u0059-s002
      start: 129
      end: 239
  - type: paragraph
    id: hb-c07-u0060
    text: Om en arbetsgivare säger upp en anställd måste hen ha ett sakligt och vägande skäl till det.
      Ett giltigt skäl kan vara till exempel företagets dåliga ekonomiska läge eller att den anställda
      på ett allvarligt sätt har försummat sina uppgifter. Om det är fråga om försummelse ska den anställda
      höras och ges en varning före uppsägningen. Om den anställda är frånvarande från arbetsplatsen i
      sju dagar utan att meddela något godtagbart skäl till frånvaron, betraktas anställningsförhållandet
      som upphävt.
    sentences:
    - id: hb-c07-u0060-s001
      start: 0
      end: 92
    - id: hb-c07-u0060-s002
      start: 93
      end: 242
    - id: hb-c07-u0060-s003
      start: 243
      end: 335
    - id: hb-c07-u0060-s004
      start: 336
      end: 501
  - type: paragraph
    id: hb-c07-u0061
    text: En anställd kan säga upp sig utan att uppge något skäl. Om en anställd säger upp sig och blir
      arbetslös, får hen i allmänhet ingen arbetslöshetsförmån genast, utan först efter en viss tid.
    sentences:
    - id: hb-c07-u0061-s001
      start: 0
      end: 55
    - id: hb-c07-u0061-s002
      start: 56
      end: 188
  - type: paragraph
    id: hb-c07-u0062
    text: Ett tidsbegränsat arbetsavtal upphör på ett avtalat datum, som anges i arbetsavtalet. Om arbetsavtalet
      är tidsbegränsat, måste man ha ett bra skäl till tidsbegränsningen, till exempel att det är fråga
      om ett vikariat, säsongsarbete eller projektarbete. Skälet ska framgå av arbetsavtalet. Tidsbegränsade
      arbetsavtal kan i allmänhet inte sägas upp.
    sentences:
    - id: hb-c07-u0062-s001
      start: 0
      end: 85
    - id: hb-c07-u0062-s002
      start: 86
      end: 252
    - id: hb-c07-u0062-s003
      start: 253
      end: 288
    - id: hb-c07-u0062-s004
      start: 289
      end: 347
  - type: paragraph
    id: hb-c07-u0063
    text: Om arbetet är på heltid arbetar man i allmänhet fem dagar i veckan och arbetstiden är 37,5–40
      timmar per vecka. För heltidsarbete betalas vanligtvis en månadslön, och antalet arbetstimmar och
      lönen varierar inte. Beroende på yrket är heltidsarbetet dagarbete, kvällsarbete, nattarbete eller
      skiftarbete.
    sentences:
    - id: hb-c07-u0063-s001
      start: 0
      end: 111
    - id: hb-c07-u0063-s002
      start: 112
      end: 212
    - id: hb-c07-u0063-s003
      start: 213
      end: 303
  - type: paragraph
    id: hb-c07-u0064
    text: Om arbetet är på deltid är arbetstiden per vecka mindre än vid heltidsarbete. Antalet arbetstimmar
      kan också variera. Lönen betalas vanligtvis som timlön. Då beror månadslönen på hur många timmar
      den anställda har arbetat under månaden.
    sentences:
    - id: hb-c07-u0064-s001
      start: 0
      end: 77
    - id: hb-c07-u0064-s002
      start: 78
      end: 117
    - id: hb-c07-u0064-s003
      start: 118
      end: 154
    - id: hb-c07-u0064-s004
      start: 155
      end: 236
  - type: paragraph
    id: hb-c07-u0065
    text: Med nollavtal avses ett arbetsavtal där arbetstiden är till exempel 0–40 eller 0–15 timmar per
      vecka. Med ett sådant är arbetsgivaren inte tvungen att erbjuda arbete. Den anställda kan i sin
      tur ta emot endast så mycket arbete som hen själv vill.
    sentences:
    - id: hb-c07-u0065-s001
      start: 0
      end: 101
    - id: hb-c07-u0065-s002
      start: 102
      end: 166
    - id: hb-c07-u0065-s003
      start: 167
      end: 246
  - type: paragraph
    id: hb-c07-u0066
    text: På arbetsgivarens initiativ kan ett nollavtal upprättas endast om det på riktigt inte alls finns
      arbete vissa veckor. Om det i verkligheten kontinuerligt finns mer arbete måste arbetsgivaren erbjuda
      ett avtal där arbetstiden motsvarar den verkliga situationen. Arbetsgivaren måste en gång om året
      kontrollera att den arbetstid som anges i avtalet motsvarar verkligheten.
    sentences:
    - id: hb-c07-u0066-s001
      start: 0
      end: 117
    - id: hb-c07-u0066-s002
      start: 118
      end: 260
    - id: hb-c07-u0066-s003
      start: 261
      end: 370
  - type: paragraph
    id: hb-c07-u0067
    text: Om den anställda själv vill ha ett nollavtal behövs ingen orsak till det. På den anställdas
      initiativ kan ett nollavtal därför upprättas när som helst om arrangemanget passar arbetsgivaren.
    sentences:
    - id: hb-c07-u0067-s001
      start: 0
      end: 73
    - id: hb-c07-u0067-s002
      start: 74
      end: 189
  - type: paragraph
    id: hb-c07-u0068
    text: Hyrt arbete betyder att en arbetstagare anställs av ett bemanningsföretag, som betalar hens
      lön. Den anställda utför ströjobb på en eller flera arbetsplatser, det vill säga kundföretag. Arbetet
      kan vara korta jobb eller längre projekt eller vikariat. Man får inte kräva pengar av en person
      för att förmedla arbete till hen eller för att hen anställs för en arbetsuppgift.
    sentences:
    - id: hb-c07-u0068-s001
      start: 0
      end: 96
    - id: hb-c07-u0068-s002
      start: 97
      end: 185
    - id: hb-c07-u0068-s003
      start: 186
      end: 250
    - id: hb-c07-u0068-s004
      start: 251
      end: 371
  - type: paragraph
    id: hb-c07-u0069
    text: Ett bemanningsföretag förmedlar arbetstagare till branscher där det ofta behövs tillfällig extra
      arbetskraft. Sådana är till exempel bygg- och restaurangbranschen och social- och hälsovårdsbranschen.
      Hyrt arbete kan vara ett sätt att få fast anställning. Om arbetet går bra anställs ibland den hyrda
      arbetstagaren som ordinarie anställd i kundföretaget.
    sentences:
    - id: hb-c07-u0069-s001
      start: 0
      end: 109
    - id: hb-c07-u0069-s002
      start: 110
      end: 199
    - id: hb-c07-u0069-s003
      start: 200
      end: 254
    - id: hb-c07-u0069-s004
      start: 255
      end: 353
  - type: paragraph
    id: hb-c07-u0070
    text: Kundföretaget ansvarar för introduktionen av den anställda och för arbetarskyddet. Hyrda arbetstagare
      råkar enligt statistiken ut för fler olycksfall i arbetet än ordinarie personal. Därför är det viktigt
      för en hyrd arbetstagare att säkerställa att hen får introduktion i säkra arbetssätt och tillräcklig
      skyddsutrustning.
    sentences:
    - id: hb-c07-u0070-s001
      start: 0
      end: 82
    - id: hb-c07-u0070-s002
      start: 83
      end: 182
    - id: hb-c07-u0070-s003
      start: 183
      end: 323
  - type: paragraph
    id: hb-c07-u0071
    text: Ett tidsbestämt arbetsavtal är bindande för både arbetsgivaren och arbetstagaren fram till den
      avtalade tidsfristen. Arbetsgivaren får inte säga upp ett tidsbestämt arbetsavtal under anställningsförhållandet,
      om man inte har kommit överens om detta i arbetsavtalet eller senare under anställningsförhållandet.
      Ett tidsbestämt avtal förpliktar också arbetstagaren. Ett tidsbestämt anställningsförhållande upphör
      på det datum som står i ditt arbetsavtal.
    sentences:
    - id: hb-c07-u0071-s001
      start: 0
      end: 116
    - id: hb-c07-u0071-s002
      start: 117
      end: 309
    - id: hb-c07-u0071-s003
      start: 310
      end: 363
    - id: hb-c07-u0071-s004
      start: 364
      end: 452
  - type: paragraph
    id: hb-c07-u0072
    text: Under prövotiden kan arbetstagaren eller arbetsgivaren häva arbetsavtalet utan uppsägningstid.
      Du kan häva anställningsförhållandet under prövotiden om du till exempel inte är nöjd med arbetsuppgifterna
      eller arbetsförhållandena. Arbetsgivaren kan häva anställningsförhållandet under prövotiden exempelvis
      om arbetstagaren inte har tillräcklig kompetens för arbetet i fråga eller om arbetstagaren inte
      sköter sina arbetsuppgifter. Hävning av anställningsförhållandet under prövotiden får inte vara
      diskriminerande eller osakligt.
    sentences:
    - id: hb-c07-u0072-s001
      start: 0
      end: 94
    - id: hb-c07-u0072-s002
      start: 95
      end: 229
    - id: hb-c07-u0072-s003
      start: 230
      end: 430
    - id: hb-c07-u0072-s004
      start: 431
      end: 529
  - type: paragraph
    id: hb-c07-u0073
    text: Hävning av arbetsavtalet innebär att arbetsavtalet upphör omedelbart. Då tillämpas ingen uppsägningstid.
      Annars kan arbetsavtalet endast sägas upp om det finns mycket vägande skäl till detta. Arbetsgivaren
      kan ha vägande skäl att häva arbetsavtalet om arbetstagaren inte fullgör sina skyldigheter eller
      allvarligt bryter mot reglerna, till exempel om arbetstagaren stjäl från arbetsplatsen eller kommer
      berusad till jobbet.
    sentences:
    - id: hb-c07-u0073-s001
      start: 0
      end: 69
    - id: hb-c07-u0073-s002
      start: 70
      end: 104
    - id: hb-c07-u0073-s003
      start: 105
      end: 191
    - id: hb-c07-u0073-s004
      start: 192
      end: 423
  - type: paragraph
    id: hb-c07-u0074
    text: Arbetstagaren kan ha vägande skäl att häva arbetsavtalet om arbetsgivaren inte fullgör sina
      skyldigheter eller allvarligt bryter mot reglerna, till exempel om arbetsgivaren inte betalar ut
      lön eller försummar arbetarskyddet.
    sentences:
    - id: hb-c07-u0074-s001
      start: 0
      end: 224
  - type: paragraph
    id: hb-c07-u0075
    text: I de flesta branscherna fastställs uppsägningstiderna (irtisanomisajat) i kollektivavtalet (työehtosopimus).
      Kontrollera därför uppsägningstiden i kollektivavtalet. Om det inte finns något kollektivavtal i
      din bransch finns uppsägningstiderna i lagen.
    sentences:
    - id: hb-c07-u0075-s001
      start: 0
      end: 108
    - id: hb-c07-u0075-s002
      start: 109
      end: 164
    - id: hb-c07-u0075-s003
      start: 165
      end: 251
  - type: paragraph
    id: hb-c07-u0076
    text: Permittering (lomautus) innebär att arbetsgivaren avbryter arbetet och löneutbetalningarna.
      Med andra ord ska du inte arbeta under permitteringen och du får inte heller betalt för denna tid.
      Du kan bli permitterad om din arbetsgivare inte har tillräckligt mycket arbete. Permitteringen kan
      pågå även en längre tid, men din anställning upphör inte.
    sentences:
    - id: hb-c07-u0076-s001
      start: 0
      end: 91
    - id: hb-c07-u0076-s002
      start: 92
      end: 190
    - id: hb-c07-u0076-s003
      start: 191
      end: 270
    - id: hb-c07-u0076-s004
      start: 271
      end: 347
  - type: paragraph
    id: hb-c07-u0077
    text: Du har rätt att få besked om permittering personligen minst 14 kalenderdagar innan permitteringen
      börjar. Denna tidsfrist kan också vara längre om man kommit överens om det i kollektivavtalet.
    sentences:
    - id: hb-c07-u0077-s001
      start: 0
      end: 105
    - id: hb-c07-u0077-s002
      start: 106
      end: 192
  - type: paragraph
    id: hb-c07-u0078
    text: Du har rätt att på begäran få ett arbetsintyg (työtodistus) av arbetsgivaren när anställningen
      upphör. Arbetsgivaren är inte skyldig att utfärda ett arbetsintyg om du inte begär det.
    sentences:
    - id: hb-c07-u0078-s001
      start: 0
      end: 102
    - id: hb-c07-u0078-s002
      start: 103
      end: 182
  - type: paragraph
    id: hb-c07-u0079
    text: Arbetsintyget är ett viktigt dokument där anställningens längd och arbetsuppgifterna redovisas.
      Du kan också be att arbetsgivaren anger orsaken till att anställningen upphört och en bedömning
      av dina färdigheter och ditt uppförande i intyget. Dessa får inte skrivas i intyget om du inte uttryckligen
      begär det.
    sentences:
    - id: hb-c07-u0079-s001
      start: 0
      end: 95
    - id: hb-c07-u0079-s002
      start: 96
      end: 242
    - id: hb-c07-u0079-s003
      start: 243
      end: 310
  - type: paragraph
    id: hb-c07-u0080
    text: Det är olagligt att vägra att ge ett arbetsintyg. Om arbetsgivaren inte ger dig ett arbetsintyg
      trots att du ber om det kan du be arbetarskyddsmyndigheten (työsuojeluviranomainen) om hjälp.
    sentences:
    - id: hb-c07-u0080-s001
      start: 0
      end: 49
    - id: hb-c07-u0080-s002
      start: 50
      end: 189
- id: hb-c07-regler
  title: Arbetstagarens och arbetsgivarens rättigheter och skyldigheter
  blocks:
  - type: paragraph
    id: hb-c07-u0081
    text: Arbetsgivaren och den anställda har rättigheter och skyldigheter. De fastställs i lagar och
      kollektivavtal. När båda parterna följer det som man tillsammans kommit överens om löper arbetet
      bättre.
    sentences:
    - id: hb-c07-u0081-s001
      start: 0
      end: 65
    - id: hb-c07-u0081-s002
      start: 66
      end: 107
    - id: hb-c07-u0081-s003
      start: 108
      end: 196
  - type: paragraph
    id: hb-c07-u0082
    text: Till den anställdas viktigaste rättigheter hör bland annat rätten att få
    sentences:
    - id: hb-c07-u0082-s001
      start: 0
      end: 72
  - id: hb-c07-u0084
    type: list
    ordered: false
    items:
    - id: hb-c07-u0083
      text: lön i enlighet med kollektivavtalet
      sentences:
      - id: hb-c07-u0083-s001
        start: 0
        end: 35
    - id: hb-c07-u0085
      text: sådant skydd som lagar och avtal ger för arbetet
      sentences:
      - id: hb-c07-u0085-s001
        start: 0
        end: 48
    - id: hb-c07-u0086
      text: höra till ett fackförbund
      sentences:
      - id: hb-c07-u0086-s001
        start: 0
        end: 25
    - id: hb-c07-u0087
      text: en trygg och sund arbetsmiljö.
      sentences:
      - id: hb-c07-u0087-s001
        start: 0
        end: 30
  - type: paragraph
    id: hb-c07-u0088
    text: Till arbetsgivarens rättigheter hör bland annat rätten att
    sentences:
    - id: hb-c07-u0088-s001
      start: 0
      end: 58
  - id: hb-c07-u0090
    type: list
    ordered: false
    items:
    - id: hb-c07-u0089
      text: bestämma vem som anställs i arbete
      sentences:
      - id: hb-c07-u0089-s001
        start: 0
        end: 34
    - id: hb-c07-u0091
      text: övervaka och leda arbetet
      sentences:
      - id: hb-c07-u0091-s001
        start: 0
        end: 25
    - id: hb-c07-u0092
      text: ge instruktioner och föreskrifter
      sentences:
      - id: hb-c07-u0092-s001
        start: 0
        end: 33
    - id: hb-c07-u0093
      text: avsluta anställningsförhållanden om vissa villkor uppfylls.
      sentences:
      - id: hb-c07-u0093-s001
        start: 0
        end: 59
  - type: paragraph
    id: hb-c07-u0094
    text: En anställd har många skyldigheter. Om hen inte iakttar dem kan anställningsförhållandet till
      och med avslutas.
    sentences:
    - id: hb-c07-u0094-s001
      start: 0
      end: 35
    - id: hb-c07-u0094-s002
      start: 36
      end: 111
  - type: paragraph
    id: hb-c07-u0095
    text: Den anställda är bland annat skyldig att
    sentences:
    - id: hb-c07-u0095-s001
      start: 0
      end: 40
  - id: hb-c07-u0097
    type: list
    ordered: false
    items:
    - id: hb-c07-u0096
      text: utföra arbetet väl
      sentences:
      - id: hb-c07-u0096-s001
        start: 0
        end: 18
    - id: hb-c07-u0098
      text: följa arbetsgivarens anvisningar och reglerna på arbetsplatsen. Man får till exempel inte
        komma berusad till jobbet och inte stjäla eller avsiktligen förstöra arbetsgivarens egendom
      sentences:
      - id: hb-c07-u0098-s001
        start: 0
        end: 63
      - id: hb-c07-u0098-s002
        start: 64
        end: 181
    - id: hb-c07-u0099
      text: bevara affärs- och yrkeshemligheter för arbetsgivarens räkning
      sentences:
      - id: hb-c07-u0099-s001
        start: 0
        end: 62
    - id: hb-c07-u0100
      text: beakta arbetsgivarens intressen
      sentences:
      - id: hb-c07-u0100-s001
        start: 0
        end: 31
    - id: hb-c07-u0101
      text: vägra att delta i verksamhet som konkurrerar med arbetsgivaren.
      sentences:
      - id: hb-c07-u0101-s001
        start: 0
        end: 63
  - type: paragraph
    id: hb-c07-u0102
    text: I många yrken, till exempel inom hälsovårdsbranschen, har den anställda också tystnadsplikt.
      Det betyder att hen under inga omständigheter får berätta för andra om vad hen hör eller hurdana
      dokument hen ser i sitt arbete. Tystnadsplikten måste iakttas.
    sentences:
    - id: hb-c07-u0102-s001
      start: 0
      end: 92
    - id: hb-c07-u0102-s002
      start: 93
      end: 221
    - id: hb-c07-u0102-s003
      start: 222
      end: 252
  - type: paragraph
    id: hb-c07-u0103
    text: Också arbetsgivaren har skyldigheter gentemot de anställda. Arbetsgivaren måste
    sentences:
    - id: hb-c07-u0103-s001
      start: 0
      end: 59
    - id: hb-c07-u0103-s002
      start: 60
      end: 79
  - id: hb-c07-u0105
    type: list
    ordered: false
    items:
    - id: hb-c07-u0104
      text: följa lagar och avtal
      sentences:
      - id: hb-c07-u0104-s001
        start: 0
        end: 21
    - id: hb-c07-u0106
      text: behandla alla anställda jämlikt och jämställt
      sentences:
      - id: hb-c07-u0106-s001
        start: 0
        end: 45
    - id: hb-c07-u0107
      text: sörja för arbetarskyddet
      sentences:
      - id: hb-c07-u0107-s001
        start: 0
        end: 24
    - id: hb-c07-u0108
      text: ge de viktigaste villkoren för anställningsförhållandet skriftligt till den anställda
      sentences:
      - id: hb-c07-u0108-s001
        start: 0
        end: 85
    - id: hb-c07-u0109
      text: främja ett gott arbetsklimat och de anställdas arbetsprestationer och yrkesmässiga utveckling.
      sentences:
      - id: hb-c07-u0109-s001
        start: 0
        end: 94
  - type: paragraph
    id: hb-c07-u0110
    text: Arbetslagstiftningen omfattar många olika lagar. För anställda är arbetsavtalslagen, arbetstidslagen
      och semesterlagen de viktigaste. Också diskrimineringslagen är viktig. Den skyddar anställda och
      arbetssökande mot till exempel diskriminering på grund av språk, ursprung eller religion.
    sentences:
    - id: hb-c07-u0110-s001
      start: 0
      end: 48
    - id: hb-c07-u0110-s002
      start: 49
      end: 133
    - id: hb-c07-u0110-s003
      start: 134
      end: 171
    - id: hb-c07-u0110-s004
      start: 172
      end: 287
  - type: paragraph
    id: hb-c07-u0111
    text: På alla arbetsplatser måste lagar följas. Dessutom måste kollektivavtal följas inom nästan alla
      branscher. Lagarna och kollektivavtalen fastställer minimivillkoren för anställningsförhållandet.
      De gäller på samma sätt för finländska och utländska arbetstagare.
    sentences:
    - id: hb-c07-u0111-s001
      start: 0
      end: 41
    - id: hb-c07-u0111-s002
      start: 42
      end: 106
    - id: hb-c07-u0111-s003
      start: 107
      end: 193
    - id: hb-c07-u0111-s004
      start: 194
      end: 260
  - type: paragraph
    id: hb-c07-u0112
    text: Kollektivavtal är avtal mellan arbetsgivar- och arbetstagarorganisationer. I dem avtalas ofta
      om bättre villkor än de som föreskrivs i lag. Efterlevnaden av arbetslagstiftningen övervakas av
      arbetarskyddsmyndigheten.
    sentences:
    - id: hb-c07-u0112-s001
      start: 0
      end: 74
    - id: hb-c07-u0112-s002
      start: 75
      end: 139
    - id: hb-c07-u0112-s003
      start: 140
      end: 216
- id: hb-c07-kollektivavtal
  title: Kollektivavtal och fackförbund
  blocks:
  - type: paragraph
    id: hb-c07-u0113
    text: Det är viktigt att den anställda vet vad kollektivavtal är. Kollektivavtal är avtal som upprättats
      i samarbete mellan arbetsgivar- och arbetstagarorganisationer. I dem avtalas om lönerna och övriga
      villkor inom olika branscher. Arbetsvillkor är till exempel arbetstider, raster och semestrar. På
      finska används ofta förkortningen TES för kollektivavtal, och på svenska ibland KA.
    sentences:
    - id: hb-c07-u0113-s001
      start: 0
      end: 59
    - id: hb-c07-u0113-s002
      start: 60
      end: 161
    - id: hb-c07-u0113-s003
      start: 162
      end: 227
    - id: hb-c07-u0113-s004
      start: 228
      end: 292
    - id: hb-c07-u0113-s005
      start: 293
      end: 379
  - type: paragraph
    id: hb-c07-u0114
    text: Den anställda kan i sitt eget arbetsavtal avtala om bättre arbetsvillkor än de som finns i branschens
      kollektivavtal. I arbetsavtalet kan man inte avtala om villkor som är sämre än i kollektivavtalet.
    sentences:
    - id: hb-c07-u0114-s001
      start: 0
      end: 117
    - id: hb-c07-u0114-s002
      start: 118
      end: 200
  - type: paragraph
    id: hb-c07-u0115
    text: I kollektivavtal avtalas ofta om bättre arbetsvillkor än vad som regleras i lag. Nästan alla
      branscher har ett eget kollektivavtal. Till exempel handeln, byggbranschen och restaurangbranschen
      har ett eget kollektivavtal. Kollektivavtalet måste följas.
    sentences:
    - id: hb-c07-u0115-s001
      start: 0
      end: 80
    - id: hb-c07-u0115-s002
      start: 81
      end: 131
    - id: hb-c07-u0115-s003
      start: 132
      end: 220
    - id: hb-c07-u0115-s004
      start: 221
      end: 251
  - type: paragraph
    id: hb-c07-u0116
    text: Syftet med kollektivavtalen är å ena sidan att garantera en miniminivå för arbetsvillkoren för
      arbetstagarna och å andra sidan arbetsfred. Med arbetsfred avses att arbetstagarna till exempel
      inte får gå i strejk för att kräva bättre lön medan ett kollektivavtal gäller.
    sentences:
    - id: hb-c07-u0116-s001
      start: 0
      end: 138
    - id: hb-c07-u0116-s002
      start: 139
      end: 269
  - type: paragraph
    id: hb-c07-u0117
    text: Kollektivavtal är nästan alltid tidsbundna och gäller i några år i taget. Efter det omförhandlas
      avtalen. Kollektivavtal upprättas i samarbete mellan representanter för arbetsgivarna och arbetstagarna.
      I förhandlingarna deltar fackförbunden, som representerar arbetstagarna, och representanter för
      arbetsgivarna.
    sentences:
    - id: hb-c07-u0117-s001
      start: 0
      end: 73
    - id: hb-c07-u0117-s002
      start: 74
      end: 105
    - id: hb-c07-u0117-s003
      start: 106
      end: 201
    - id: hb-c07-u0117-s004
      start: 202
      end: 312
  - type: paragraph
    id: hb-c07-u0118
    text: Fackförbunden bevakar sina medlemmars intressen. Om det uppstår problem i arbetet, ger fackförbundet
      stöd och hjälp. Fackförbundet kan hjälpa till exempel om en arbetstagare inte får den lön som hen
      har rätt till. Fackförbundet ger stöd också vid jobbsökning och arbetslöshet. Fackförbunden hjälper
      också sina medlemmar med att bilda nätverk och utveckla sin yrkeskompetens.
    sentences:
    - id: hb-c07-u0118-s001
      start: 0
      end: 48
    - id: hb-c07-u0118-s002
      start: 49
      end: 116
    - id: hb-c07-u0118-s003
      start: 117
      end: 213
    - id: hb-c07-u0118-s004
      start: 214
      end: 276
    - id: hb-c07-u0118-s005
      start: 277
      end: 374
  - type: paragraph
    id: hb-c07-u0119
    text: På stora arbetsplatser representeras fackförbundets medlemmar av en förtroendeman. Hen väljs
      i ett val bland de anställda. Förtroendemannen övervakar att arbetsgivaren följer kollektivavtalet
      och arbetslagstiftningen på arbetsplatsen. Förtroendemannens uppgift är att stödja och hjälpa de
      anställda och ingripa i problem. Förtroendemannen ser till att de anställda behandlas rättvist och
      jämlikt på arbetsplatsen.
    sentences:
    - id: hb-c07-u0119-s001
      start: 0
      end: 82
    - id: hb-c07-u0119-s002
      start: 83
      end: 122
    - id: hb-c07-u0119-s003
      start: 123
      end: 234
    - id: hb-c07-u0119-s004
      start: 235
      end: 321
    - id: hb-c07-u0119-s005
      start: 322
      end: 413
  - type: paragraph
    id: hb-c07-u0120
    text: Alla arbetsplatser har inte en förtroendeman. I sådana fall kan de anställda välja en anställd
      till förtroendeombud eller söka stöd hos fackförbundet. Förtroendeombudet har inte lika omfattande
      uppgifter och befogenheter som en förtroendeman.
    sentences:
    - id: hb-c07-u0120-s001
      start: 0
      end: 45
    - id: hb-c07-u0120-s002
      start: 46
      end: 150
    - id: hb-c07-u0120-s003
      start: 151
      end: 242
  - type: paragraph
    id: hb-c07-u0121
    text: En arbetsgivare är vem som helst som anställer en annan person som arbetstagare. Det är viktigt
      att arbetsgivaren är medveten om den lagstiftning som gäller arbetet och om arbetsgivarens skyldigheter.
      Arbetsgivaren ska ta reda på om det finns ett allmänt bindande kollektivavtal som gäller för branschen.
      Föreskrifterna i ett allmänt bindande kollektivavtal om till exempel minimilöner ska följas, även
      om arbetsgivaren inte skulle höra till något arbetsgivarförbund. Det är också bra om arbetsgivaren
      berättar för den anställda om dennes skyldigheter och rättigheter.
    sentences:
    - id: hb-c07-u0121-s001
      start: 0
      end: 80
    - id: hb-c07-u0121-s002
      start: 81
      end: 200
    - id: hb-c07-u0121-s003
      start: 201
      end: 304
    - id: hb-c07-u0121-s004
      start: 305
      end: 467
    - id: hb-c07-u0121-s005
      start: 468
      end: 568
  - type: paragraph
    id: hb-c07-u0122
    text: Samma fackförbund omfattar vanligtvis personer inom samma bransch (till exempel sjuksköterskor)
      eller personer med samma utbildning (till exempel ingenjörer). Arbetstagarens rätt att höra till
      ett fackförbund kan inte begränsas med avtal. Det är straffbart att diskriminera arbetstagare på
      grund av deras medlemskap i ett fackförbund.
    sentences:
    - id: hb-c07-u0122-s001
      start: 0
      end: 158
    - id: hb-c07-u0122-s002
      start: 159
      end: 238
    - id: hb-c07-u0122-s003
      start: 239
      end: 334
  - type: paragraph
    id: hb-c07-u0123
    text: Fackförbundets medlemmar kan delta i utbildning och fritidsaktiviteter som förbundet ordnar.
      De får också stöd av förbundets förtroendeman vid konflikter på arbetsplatsen. Vid behov får man
      också råd eller förhandlingsstöd från fackförbundet.
    sentences:
    - id: hb-c07-u0123-s001
      start: 0
      end: 92
    - id: hb-c07-u0123-s002
      start: 93
      end: 171
    - id: hb-c07-u0123-s003
      start: 172
      end: 242
  - type: paragraph
    id: hb-c07-u0124
    text: På arbetsplatsen representeras fackförbundet och de anställda som är medlemmar i det av förtroendemannen.
      Förtroendemannen väljs av de anställda. Förtroendemannen agerar som förhandlare, medlare och informationsförmedlare
      mellan arbetsgivaren och anställda. Man kan också vända sig till förtroendemannen till exempel med
      frågor om kollektivavtalet.
    sentences:
    - id: hb-c07-u0124-s001
      start: 0
      end: 105
    - id: hb-c07-u0124-s002
      start: 106
      end: 145
    - id: hb-c07-u0124-s003
      start: 146
      end: 257
    - id: hb-c07-u0124-s004
      start: 258
      end: 348
  - type: paragraph
    id: hb-c07-u0125
    text: För att få inkomstrelaterad dagpenning från arbetslöshetskassan finns några villkor. Ta reda
      på dessa villkor genast när du ansluter dig till arbetslöshetskassan. Till exempel måste du arbeta
      och vara medlem av arbetslöshetskassan under en viss period.
    sentences:
    - id: hb-c07-u0125-s001
      start: 0
      end: 84
    - id: hb-c07-u0125-s002
      start: 85
      end: 162
    - id: hb-c07-u0125-s003
      start: 163
      end: 252
- id: hb-c07-lon
  title: Lön och arbetstid
  blocks:
  - type: paragraph
    id: hb-c07-u0126
    text: I Finland finns ingen allmän minimilön som skulle gälla alla yrken. Minilönerna för olika branscher
      anges i kollektivavtalen. Lönen kan vara antingen månadslön eller timlön. Lönen kan också vara en
      ackordslön. Då får en person lön när ett visst projekt eller en viss arbetsprestation har slutförts.
    sentences:
    - id: hb-c07-u0126-s001
      start: 0
      end: 67
    - id: hb-c07-u0126-s002
      start: 68
      end: 125
    - id: hb-c07-u0126-s003
      start: 126
      end: 173
    - id: hb-c07-u0126-s004
      start: 174
      end: 209
    - id: hb-c07-u0126-s005
      start: 210
      end: 298
  - type: paragraph
    id: hb-c07-u0127
    text: Om en anställd arbetar på kvällar, helger eller högtider får hen utöver den vanliga lönen också
      tillägg. Tilläggens storlek beror på yrket och kollektivavtalet för branschen. För söndagsarbete
      måste man betala dubbel lön inom alla branscher. Om en anställd på arbetsgivarens order arbetar
      övertid utöver den normala arbetstiden, måste extra lön betalas också för det. I kollektivavtalet
      för den egna branschen finns information om hurdana tillägg som ska betalas till arbetstagarna.
    sentences:
    - id: hb-c07-u0127-s001
      start: 0
      end: 104
    - id: hb-c07-u0127-s002
      start: 105
      end: 174
    - id: hb-c07-u0127-s003
      start: 175
      end: 241
    - id: hb-c07-u0127-s004
      start: 242
      end: 367
    - id: hb-c07-u0127-s005
      start: 368
      end: 482
  - type: paragraph
    id: hb-c07-u0128
    text: Arbetsgivaren måste ge den anställda en lönespecifikation. I den ser den anställda alla skatter
      och övriga avgifter som dragits av på lönen. I specifikationen kan man också kontrollera att lönen
      och tilläggen har betalats ut korrekt. Om det finns ett fel i lönebetalningen och det har betalats
      för lite lön, ska man be att det korrigeras. Om man av misstag har fått för mycket lön är den anställda
      skyldig att betala tillbaka den del som överstiger den normala lönen.
    sentences:
    - id: hb-c07-u0128-s001
      start: 0
      end: 58
    - id: hb-c07-u0128-s002
      start: 59
      end: 140
    - id: hb-c07-u0128-s003
      start: 141
      end: 233
    - id: hb-c07-u0128-s004
      start: 234
      end: 338
    - id: hb-c07-u0128-s005
      start: 339
      end: 467
  - type: paragraph
    id: hb-c07-u0129
    text: Om branschen inte har ett kollektivavtal kan arbetsgivaren och arbetstagaren komma överens om
      lönen sinsemellan. Enligt lagen ska lönen vara sedvanlig och skälig, med andra ord ska du få samma
      lön som andra som utför samma eller liknande arbete.
    sentences:
    - id: hb-c07-u0129-s001
      start: 0
      end: 112
    - id: hb-c07-u0129-s002
      start: 113
      end: 245
  - type: paragraph
    id: hb-c07-u0130
    text: Om du har en prövotid ska normal lön betalas under denna period. Att arbeta utan lön är lagligt
      endast i sysselsättningstjänsternas arbetsprövning, i volontärarbete eller under en praktik som
      ingår i studierna.
    sentences:
    - id: hb-c07-u0130-s001
      start: 0
      end: 64
    - id: hb-c07-u0130-s002
      start: 65
      end: 210
  - type: paragraph
    id: hb-c07-u0131
    text: Lönen för arbetet kan betalas som timlön, veckolön eller månadslön. I vissa branscher betalas
      ackordslön (urakkapalkka), som baserar sig på prestationen.
    sentences:
    - id: hb-c07-u0131-s001
      start: 0
      end: 67
    - id: hb-c07-u0131-s002
      start: 68
      end: 153
  - type: paragraph
    id: hb-c07-u0132
    text: Arbetsgivaren ska betala in lönen på ditt bankkonto den dag som överenskommits i arbetsavtalet.
      Vanligtvis betalas lönen en gång i månaden eller varannan vecka. Om utbetalningsdagen infaller på
      veckoslutet eller en helgdag ska lönen betalas den föregående vardagen. Lön betalas också under
      sjukledighet och semester.
    sentences:
    - id: hb-c07-u0132-s001
      start: 0
      end: 95
    - id: hb-c07-u0132-s002
      start: 96
      end: 160
    - id: hb-c07-u0132-s003
      start: 161
      end: 265
    - id: hb-c07-u0132-s004
      start: 266
      end: 316
  - type: paragraph
    id: hb-c07-u0133
    text: Av lönespecifikationen framgår hur mycket lön du har fått, vilka avdrag som gjorts från denna
      bruttolön (bruttopalkka) och hur mycket pengar som betalas in på ditt konto, alltså vad din nettolön
      (nettopalkka) är. Du ska kontrollera att uppgifterna i lönespecifikationen är korrekta. Skriv upp
      dina arbetstimmar så är det lättare att kontrollera lönespecifikationen.
    sentences:
    - id: hb-c07-u0133-s001
      start: 0
      end: 212
    - id: hb-c07-u0133-s002
      start: 213
      end: 282
    - id: hb-c07-u0133-s003
      start: 283
      end: 365
  - type: paragraph
    id: hb-c07-u0134
    text: Tulorekisteri är en databas dit arbetsgivarna anmäler lönerna som de betalat till sina anställda.
      Uppgifterna i tulorekisteri används av många organisationer och myndigheter som har rätt att göra
      det. Förutom Skatteförvaltningen är dessa Migrationsverket (Maahanmuuttovirasto), FPA (Kela), Pensionsskyddscentralen
      (Eläketurvakeskus), arbetslöshetskassorna och andra myndigheter.
    sentences:
    - id: hb-c07-u0134-s001
      start: 0
      end: 97
    - id: hb-c07-u0134-s002
      start: 98
      end: 200
    - id: hb-c07-u0134-s003
      start: 201
      end: 378
  - type: paragraph
    id: hb-c07-u0135
    text: Arbetsgivaren ansvarar för att anmäla korrekta uppgifter till inkomstregistret. När löneuppgifterna
      är korrekt anmälda borde du se samma belopp på ditt konto och i inkomstregistret. Om det finns fel
      i uppgifterna ska du be arbetsgivaren att korrigera uppgifterna i inkomstregistret. Du kan fråga
      skattemyndigheterna om mer information.
    sentences:
    - id: hb-c07-u0135-s001
      start: 0
      end: 79
    - id: hb-c07-u0135-s002
      start: 80
      end: 181
    - id: hb-c07-u0135-s003
      start: 182
      end: 282
    - id: hb-c07-u0135-s004
      start: 283
      end: 335
  - type: paragraph
    id: hb-c07-u0136
    text: Med arbetstid avses den tid som används på arbetet och som arbetstagaren ska befinna sig på
      arbetsplatsen eller finnas tillgänglig för arbetsgivarens förfogande. I Finland regleras arbetstiden
      av arbetstidslagen (työaikalaki) och kollektivavtalen (työehtosopimus).
    sentences:
    - id: hb-c07-u0136-s001
      start: 0
      end: 161
    - id: hb-c07-u0136-s002
      start: 162
      end: 264
  - type: paragraph
    id: hb-c07-u0137
    text: Arbetsgivaren måste bokföra dina arbetstimmar. Du har rätt att få en kopia av arbetstidsbokföringen.
      Det är bra att också själv skriva upp hur många timmar du har arbetat. Kom ihåg att också anteckna
      när arbetsskiften börjar och slutar.
    sentences:
    - id: hb-c07-u0137-s001
      start: 0
      end: 46
    - id: hb-c07-u0137-s002
      start: 47
      end: 100
    - id: hb-c07-u0137-s003
      start: 101
      end: 171
    - id: hb-c07-u0137-s004
      start: 172
      end: 236
  - type: paragraph
    id: hb-c07-u0138
    text: Arbetstiden varierar i olika branscher. Enligt lag får den ordinarie arbetstiden (säännöllinen
      työaika) vara högst åtta timmar per dygn och 40 timmar per vecka. Arbetstagaren har vanligtvis rätt
      till två lediga dagar per vecka.
    sentences:
    - id: hb-c07-u0138-s001
      start: 0
      end: 39
    - id: hb-c07-u0138-s002
      start: 40
      end: 160
    - id: hb-c07-u0138-s003
      start: 161
      end: 227
  - type: paragraph
    id: hb-c07-u0139
    text: I vissa yrken, till exempel i restaurangbranschen, transportbranschen och på vårdinrättningar,
      kan den ordinarie arbetstiden ordnas som periodiskt arbete. I detta fall är den ordinarie arbetstiden
      antingen 80 timmar under en tvåveckorsperiod eller 120 timmar under en treveckorsperiod. Kontrollera
      arbetstiden i kollektivavtalet för din bransch.
    sentences:
    - id: hb-c07-u0139-s001
      start: 0
      end: 154
    - id: hb-c07-u0139-s002
      start: 155
      end: 285
    - id: hb-c07-u0139-s003
      start: 286
      end: 345
  - type: paragraph
    id: hb-c07-u0140
    text: Flexibel arbetstid (liukuva työaika) innebär att du själv kan bestämma vilken tid under dagen
      du börjar och slutar jobba. Du måste ändå följa de randvillkor som avtalas i arbetsavtalet.
    sentences:
    - id: hb-c07-u0140-s001
      start: 0
      end: 121
    - id: hb-c07-u0140-s002
      start: 122
      end: 185
  - type: paragraph
    id: hb-c07-u0141
    text: I skiftarbete (vuorotyö) varierar arbetsskiften så att du till exempel kan arbeta i morgonskift,
      kvällsskift eller nattskift. Arbetsgivaren måste göra en skiftlista i förväg som du har rätt att
      se senast en vecka innan arbetsveckan börjar.
    sentences:
    - id: hb-c07-u0141-s001
      start: 0
      end: 125
    - id: hb-c07-u0141-s002
      start: 126
      end: 239
  - type: paragraph
    id: hb-c07-u0142
    text: Om arbetsgivaren ber dig att arbeta övertid (ylityö), det vill säga att arbeta utöver din ordinarie
      arbetstid, måste du få en högre lön för det. Höjningen är minst 50 procent. Du kan inte arbeta övertid
      utan arbetsgivarens tillstånd. Arbetsgivaren måste också få ditt samtycke till övertidsarbete.
    sentences:
    - id: hb-c07-u0142-s001
      start: 0
      end: 144
    - id: hb-c07-u0142-s002
      start: 145
      end: 175
    - id: hb-c07-u0142-s003
      start: 176
      end: 233
    - id: hb-c07-u0142-s004
      start: 234
      end: 297
  - type: paragraph
    id: hb-c07-u0143
    text: Observera att om arbetsgivaren slutar att erbjuda dig arbete helt och hållet, har du rätt att
      få en skriftlig förklaring av arbetsgivaren om varför arbetsmängden har minskat.
    sentences:
    - id: hb-c07-u0143-s001
      start: 0
      end: 174
  - type: paragraph
    id: hb-c07-u0144
    text: Din arbetsgivare borde betala ut lönen till ditt bankkonto. Lönen får endast betalas ut i kontanter
      om inga andra alternativ finns. Så gör man till exempel om du inte har ett bankkonto.
    sentences:
    - id: hb-c07-u0144-s001
      start: 0
      end: 59
    - id: hb-c07-u0144-s002
      start: 60
      end: 131
    - id: hb-c07-u0144-s003
      start: 132
      end: 185
  - type: paragraph
    id: hb-c07-u0145
    text: Om du får lönen utbetalad i kontanter, ska du ge din arbetsgivare ett skriftligt intyg om löneutbetalningen.
      På så sätt kan man bevisa att lönen verkligen har betalats till dig.
    sentences:
    - id: hb-c07-u0145-s001
      start: 0
      end: 108
    - id: hb-c07-u0145-s002
      start: 109
      end: 177
  - type: paragraph
    id: hb-c07-u0146
    text: Under arbetsdagen har den anställda raster. Rasternas antal och längd beror på arbetsdagens
      längd. I branschens kollektivavtal kan man kontrollera vad som avtalats om raster. Om arbetsdagen
      är över sex timmar lång, har den anställda rätt till minst en halvtimmes rast under dagen. Om den
      anställda arbetar åtta timmar per dag, har hen vanligtvis en längre matrast och två korta kafferaster.
    sentences:
    - id: hb-c07-u0146-s001
      start: 0
      end: 43
    - id: hb-c07-u0146-s002
      start: 44
      end: 98
    - id: hb-c07-u0146-s003
      start: 99
      end: 174
    - id: hb-c07-u0146-s004
      start: 175
      end: 280
    - id: hb-c07-u0146-s005
      start: 281
      end: 390
  - type: paragraph
    id: hb-c07-u0147
    text: Matrasten på en halvtimme ingår i allmänhet inte i den avlönade arbetstiden, vilket innebär
      att man kan avlägsna sig från arbetsplatsen. Kafferasten i sin tur ingår i arbetstiden och ska tillbringas
      på arbetsplatsen.
    sentences:
    - id: hb-c07-u0147-s001
      start: 0
      end: 136
    - id: hb-c07-u0147-s002
      start: 137
      end: 216
  - type: paragraph
    id: hb-c07-u0148
    text: Den anställda får inte sköta egna angelägenheter på arbetstid. I allmänhet är till exempel användning
      av egen telefon begränsad under arbetsdagen. Den anställda får ändå använda sin telefon på raster
      och då uträtta ärenden. Om arbetsgivaren förser den anställda med en arbetstelefon, är den i allmänhet
      avsedd endast för utförande av arbetet.
    sentences:
    - id: hb-c07-u0148-s001
      start: 0
      end: 62
    - id: hb-c07-u0148-s002
      start: 63
      end: 146
    - id: hb-c07-u0148-s003
      start: 147
      end: 223
    - id: hb-c07-u0148-s004
      start: 224
      end: 342
- id: hb-c07-ledighet
  title: Semester och ledighet
  blocks:
  - type: paragraph
    id: hb-c07-u0149
    text: Den anställda tjänar in en viss mängd ledighet som hen får lön för. Denna ledighet kallas semester.
      I semesterlagen regleras semesterlönen och semesterersättningarna och hur semestern får tas ut.
    sentences:
    - id: hb-c07-u0149-s001
      start: 0
      end: 67
    - id: hb-c07-u0149-s002
      start: 68
      end: 99
    - id: hb-c07-u0149-s003
      start: 100
      end: 195
  - type: paragraph
    id: hb-c07-u0150
    text: Semesterns längd och lönen för semestertiden beror på hur länge anställningsförhållandet har
      varat och hurdant antal arbetstimmar den anställda har. I heltidsarbete tjänar man in minst 2,5
      dagar semester per månad när anställningsförhållandet har varat i ett år. Om anställningsförhållandet
      har varat i mindre än ett år, tjänar man in minst två dagar semester per månad.
    sentences:
    - id: hb-c07-u0150-s001
      start: 0
      end: 148
    - id: hb-c07-u0150-s002
      start: 149
      end: 262
    - id: hb-c07-u0150-s003
      start: 263
      end: 370
  - type: paragraph
    id: hb-c07-u0151
    text: Huvudregeln är att största delen av semestern ska tas ut under sommarsemesterperioden, det vill
      säga mellan maj och september. Ibland upphör ett anställningsförhållande så att den anställda inte
      hinner ta ut alla intjänade semesterdagar. Då får hen ekonomisk ersättning för de outtagna dagarna.
    sentences:
    - id: hb-c07-u0151-s001
      start: 0
      end: 126
    - id: hb-c07-u0151-s002
      start: 127
      end: 237
    - id: hb-c07-u0151-s003
      start: 238
      end: 294
  - type: paragraph
    id: hb-c07-u0152
    text: Man får aldrig vara borta från arbetet utan grundad anledning. Om en anställd blir sjuk, ska
      hen genast informera arbetsgivaren om det genom att ringa eller följa arbetsplatsens rutiner. Varje
      arbetsplats har egna regler för hur många dagar en person kan vara borta från arbetet utan läkarintyg.
    sentences:
    - id: hb-c07-u0152-s001
      start: 0
      end: 62
    - id: hb-c07-u0152-s002
      start: 63
      end: 186
    - id: hb-c07-u0152-s003
      start: 187
      end: 295
  - type: paragraph
    id: hb-c07-u0153
    text: När du arbetar i Finland har du laglig rätt till semester. Du får semesterlön under din semester.
      Dessutom kan du få semesterpenning, så kallad semesterpremie, om detta föreskrivs i kollektivavtalet.
    sentences:
    - id: hb-c07-u0153-s001
      start: 0
      end: 58
    - id: hb-c07-u0153-s002
      start: 59
      end: 97
    - id: hb-c07-u0153-s003
      start: 98
      end: 199
  - type: paragraph
    id: hb-c07-u0154
    text: I olika livssituationer kan du också få ledigt från jobbet enligt lag. Sådana situationer är
      till exempel graviditet, barnets födelse, vård av ett litet barn och sjukdom hos ett litet barn.
      Tanken bakom lagstiftningen om detta har varit att ge människorna möjligheter att studera och utveckla
      sig och säkerställa människornas arbetshälsa.
    sentences:
    - id: hb-c07-u0154-s001
      start: 0
      end: 70
    - id: hb-c07-u0154-s002
      start: 71
      end: 189
    - id: hb-c07-u0154-s003
      start: 190
      end: 338
  - type: paragraph
    id: hb-c07-u0155
    text: Du tjänar in semester om du arbetar minst 14 dagar eller 35 timmar i månaden. Om du arbetar
      mindre, har du rätt till ledighet och semesterersättning.
    sentences:
    - id: hb-c07-u0155-s001
      start: 0
      end: 77
    - id: hb-c07-u0155-s002
      start: 78
      end: 149
  - type: paragraph
    id: hb-c07-u0156
    text: Antalet semesterdagar beräknas under perioden 1 april–31 mars (t.ex. 1.4.2024–31.3.2025). Längden
      på din anställning påverkar hur många semesterdagar du tjänar in per kalendermånad. Om du till exempel
      börjar på ett nytt jobb den 1 maj och din anställning endast varar sex månader, tjänar du in två
      semesterdagar per arbetsmånad, alltså 12 semesterdagar. Detta förutsätter att du har arbetat minst
      14 dagar eller 35 timmar per månad. Fråga din arbetsgivare eller fackförbundet om det exakta antalet
      semesterdagar.
    sentences:
    - id: hb-c07-u0156-s001
      start: 0
      end: 89
    - id: hb-c07-u0156-s002
      start: 90
      end: 181
    - id: hb-c07-u0156-s003
      start: 182
      end: 353
    - id: hb-c07-u0156-s004
      start: 354
      end: 432
    - id: hb-c07-u0156-s005
      start: 433
      end: 512
  - type: paragraph
    id: hb-c07-u0157
    text: Semesterperioden är 2 maj–30 september. Normalt måste man ta sommarsemestern under den här perioden.
      De flesta människorna i Finland tar semester i juli. Meddela din arbetsgivare när du vill ta din
      semester. Arbetsgivaren är dock den som bestämmer när semester kan tas.
    sentences:
    - id: hb-c07-u0157-s001
      start: 0
      end: 39
    - id: hb-c07-u0157-s002
      start: 40
      end: 100
    - id: hb-c07-u0157-s003
      start: 101
      end: 153
    - id: hb-c07-u0157-s004
      start: 154
      end: 207
    - id: hb-c07-u0157-s005
      start: 208
      end: 269
  - type: paragraph
    id: hb-c07-u0158
    text: Under semestern får du semesterlön. Arbetsgivaren ska samtidigt ge dig en lönespecifikation
      av semesterlönen. Om din anställning upphör, har du rätt att få semesterersättning för semester
      eller ledighet som du inte har tagit ut.
    sentences:
    - id: hb-c07-u0158-s001
      start: 0
      end: 35
    - id: hb-c07-u0158-s002
      start: 36
      end: 109
    - id: hb-c07-u0158-s003
      start: 110
      end: 228
  - type: paragraph
    id: hb-c07-u0159
    text: Om du vill ta ut obetald ledighet (palkaton vapaa) av andra skäl än vård av barn eller studier
      ska du komma överens om detta med din arbetsgivare. Ingå avtalet skriftligt.
    sentences:
    - id: hb-c07-u0159-s001
      start: 0
      end: 146
    - id: hb-c07-u0159-s002
      start: 147
      end: 171
  - type: paragraph
    id: hb-c07-u0160
    text: Arbetsgivaren har rätt att neka till obetald ledighet. Och vice versa – din arbetsgivare kan
      inte tvinga dig att ta ledigt utan lön.
    sentences:
    - id: hb-c07-u0160-s001
      start: 0
      end: 54
    - id: hb-c07-u0160-s002
      start: 55
      end: 132
  - type: paragraph
    id: hb-c07-u0294
    text: Självrisktiden är vanligen den dag då du insjuknade och därpå följande nio vardagar. Om din
      anställning har varat över en månad före insjuknandet betalar din arbetsgivare full lön för självrisktiden.
    sentences:
    - id: hb-c07-u0294-s001
      start: 0
      end: 84
    - id: hb-c07-u0294-s002
      start: 85
      end: 199
  - type: paragraph
    id: hb-c07-u0295
    text: Om du inte kan återvända till arbetet efter dessa dagar kan du ansöka om sjukdagpenning hos
      Kela, om du är sjukförsäkrad i Finland. Arbetsgivare kan betala lön också för en längre period.
      Sjukdagpenningens belopp beror på din inkomst.
    sentences:
    - id: hb-c07-u0295-s001
      start: 0
      end: 131
    - id: hb-c07-u0295-s002
      start: 132
      end: 187
    - id: hb-c07-u0295-s003
      start: 188
      end: 234
  - type: paragraph
    id: hb-c07-u0162
    text: I kollektivavtalet kan det finnas andra bestämmelser om arbetsgivarens skyldighet att betala
      lön för sjukdomstiden. Kontrollera detta i kollektivavtalet eller hos ditt fackförbund.
    sentences:
    - id: hb-c07-u0162-s001
      start: 0
      end: 115
    - id: hb-c07-u0162-s002
      start: 116
      end: 180
  - type: paragraph
    id: hb-c07-u0163
    text: Om ett barn yngre än tio år insjuknar akut kan en av barnets föräldrar stanna hemma för att
      ta hand om barnet. Om du måste stanna hemma för att ta hand om ett sjukt barn ska du utan dröjsmål
      meddela detta till din chef. Vårdledigheten kan vara högst fyra dagar. I kollektivavtalet bestäms
      om du får lön för denna tid eller inte. Om branschen inte har ett kollektivavtal behöver lön inte
      betalas.
    sentences:
    - id: hb-c07-u0163-s001
      start: 0
      end: 110
    - id: hb-c07-u0163-s002
      start: 111
      end: 219
    - id: hb-c07-u0163-s003
      start: 220
      end: 261
    - id: hb-c07-u0163-s004
      start: 262
      end: 328
    - id: hb-c07-u0163-s005
      start: 329
      end: 395
- id: hb-c07-arbetarskydd
  title: Arbetarskydd och företagshälsovård
  blocks:
  - type: paragraph
    id: hb-c07-u0164
    text: Arbetarskyddslagen föreskriver att arbetsplatsen ska vara säker och hälsosam. Det ansvarar arbetsgivaren
      och cheferna för. Arbetet ska vara säkert både fysiskt och mentalt. Arbetsgivaren ska också se till
      att de anställda inte blir sjuka på grund av arbetet.
    sentences:
    - id: hb-c07-u0164-s001
      start: 0
      end: 77
    - id: hb-c07-u0164-s002
      start: 78
      end: 122
    - id: hb-c07-u0164-s003
      start: 123
      end: 172
    - id: hb-c07-u0164-s004
      start: 173
      end: 258
  - type: paragraph
    id: hb-c07-u0165
    text: Arbetarskydd innebär åtgärder som genomförs för att det ska vara säkert på arbetsplatsen. Arbetarskyddet
      är en gemensam uppgift för hela arbetsplatsen.
    sentences:
    - id: hb-c07-u0165-s001
      start: 0
      end: 89
    - id: hb-c07-u0165-s002
      start: 90
      end: 151
  - type: paragraph
    id: hb-c07-u0166
    text: Om en anställd upptäcker en fara på arbetsplatsen ska hen genast informera chefen eller arbetarskyddsfullmäktigen
      om det. Det kan vara fråga om till exempel ett farligt arbetssätt, ett trasigt verktyg eller otillräcklig
      skyddsutrustning. Den anställda kan också föreslå hur arbetet skulle kunna göras säkrare.
    sentences:
    - id: hb-c07-u0166-s001
      start: 0
      end: 121
    - id: hb-c07-u0166-s002
      start: 122
      end: 237
    - id: hb-c07-u0166-s003
      start: 238
      end: 309
  - type: paragraph
    id: hb-c07-u0167
    text: På arbetsplatsen sörjer också arbetarskyddsfullmäktigen för arbetarskyddet. Hen väljs i ett
      val bland de anställda. Arbetarskyddsfullmäktigen har till uppgift att regelbundet övervaka faktorer
      som påverkar de anställdas säkerhet och hälsa på arbetsplatsen, informera arbetsgivaren om missförhållanden
      som hen upptäcker och representera de anställda i frågor som rör arbetarskyddet.
    sentences:
    - id: hb-c07-u0167-s001
      start: 0
      end: 75
    - id: hb-c07-u0167-s002
      start: 76
      end: 115
    - id: hb-c07-u0167-s003
      start: 116
      end: 381
  - type: paragraph
    id: hb-c07-u0168
    text: Arbetarskyddsmyndigheten övervakar att arbetsgivaren följer de lagar som gäller arbetarskydd.
      Myndigheten gör bland annat inspektioner på arbetsplatser, ger arbetsgivare och arbetstagare rådgivning
      och utreder orsakerna till allvarliga olycksfall i arbetet och arbetsrelaterade sjukdomar.
    sentences:
    - id: hb-c07-u0168-s001
      start: 0
      end: 93
    - id: hb-c07-u0168-s002
      start: 94
      end: 288
  - type: paragraph
    id: hb-c07-u0169
    text: Den anställda måste få utbildning i rätt arbetssätt och en genomgång av sådant som rör arbetssäkerheten.
      På arbetsplatsen ska det finnas tydliga anvisningar i händelse av olycksfall eller olyckor. Alla
      anställda måste veta hur de ska agera i sådana situationer. Den anställda ska följa arbetsgivarens
      instruktioner och utföra arbetet på ett säkert sätt. Om en arbetsuppgift är för farlig kan man vägra
      att utföra den.
    sentences:
    - id: hb-c07-u0169-s001
      start: 0
      end: 104
    - id: hb-c07-u0169-s002
      start: 105
      end: 196
    - id: hb-c07-u0169-s003
      start: 197
      end: 261
    - id: hb-c07-u0169-s004
      start: 262
      end: 353
    - id: hb-c07-u0169-s005
      start: 354
      end: 417
  - type: paragraph
    id: hb-c07-u0170
    text: Enligt finsk lag ska arbetsgivare ha en försäkring för olycksfall i arbetet och yrkessjukdom
      som gäller samtliga anställda. Försäkringen ersätter kostnader om en anställd råkar ut för ett olycksfall
      i arbetet. Försäkringen ersätter också kostnader om en anställd får en yrkessjukdom av sitt arbete.
    sentences:
    - id: hb-c07-u0170-s001
      start: 0
      end: 123
    - id: hb-c07-u0170-s002
      start: 124
      end: 209
    - id: hb-c07-u0170-s003
      start: 210
      end: 298
  - type: paragraph
    id: hb-c07-u0171
    text: En yrkessjukdom är en sjukdom som sannolikt beror på att en arbetstagare har exponerats för
      en fysikalisk, kemisk eller biologisk agens i sitt arbete. Vanliga yrkessjukdomar är till exempel
      bullerskador, astma, allergiska eksem och belastningsskador i händerna eller armarna.
    sentences:
    - id: hb-c07-u0171-s001
      start: 0
      end: 150
    - id: hb-c07-u0171-s002
      start: 151
      end: 275
  - type: paragraph
    id: hb-c07-u0172
    text: I allmänhet måste arbetsgivaren också teckna en grupplivförsäkring för de anställda. Om en anställd
      avlider på arbetstid eller på fritiden, betalar försäkringen ersättning till den anställdas familj.
    sentences:
    - id: hb-c07-u0172-s001
      start: 0
      end: 84
    - id: hb-c07-u0172-s002
      start: 85
      end: 199
  - type: paragraph
    id: hb-c07-u0173
    text: Enligt lagen är arbetsgivaren skyldig att ordna företagshälsovård för de anställda. Arbetsgivaren
      måste erbjuda alla anställda företagshälsovård, oberoende av om de är fast anställda, visstidsanställda
      eller deltidsanställda.
    sentences:
    - id: hb-c07-u0173-s001
      start: 0
      end: 83
    - id: hb-c07-u0173-s002
      start: 84
      end: 225
  - type: paragraph
    id: hb-c07-u0174
    text: Företagshälsovårdstjänsternas omfattning varierar mellan olika arbetsgivare. En del arbetsgivare
      erbjuder sina anställda omfattande företagshälsovårdstjänster, medan andra erbjuder mer begränsade.
      Man kan fråga arbetsgivaren om företagshälsovårdstjänsterna till exempel under anställningsintervjun.
    sentences:
    - id: hb-c07-u0174-s001
      start: 0
      end: 76
    - id: hb-c07-u0174-s002
      start: 77
      end: 196
    - id: hb-c07-u0174-s003
      start: 197
      end: 298
  - type: paragraph
    id: hb-c07-u0175
    text: Företagshälsovård är förebyggande hälsovård som inkluderar till exempel hälsokontroller. Arbetsgivaren
      får själv bestämma huruvida företagshälsovården ska täcka också till exempel sjukvård och besök
      hos läkare, företagshälsovårdspsykolog eller fysioterapeut. Arbetsgivaren ska berätta för de anställda
      vilka tjänster som ingår i företagshälsovården.
    sentences:
    - id: hb-c07-u0175-s001
      start: 0
      end: 88
    - id: hb-c07-u0175-s002
      start: 89
      end: 258
    - id: hb-c07-u0175-s003
      start: 259
      end: 349
  - type: paragraph
    id: hb-c07-u0176
    text: Om man misstänker att en sjukdom hos en anställd beror på arbetet, ska en utredning av ärendet
      inledas vid företagshälsovården. Företagshälsovården kan finnas på den lokala hälsovårdscentralen
      eller en privat läkarcentral. Tjänsterna får användas endast av de anställda, inte deras familjemedlemmar.
    sentences:
    - id: hb-c07-u0176-s001
      start: 0
      end: 127
    - id: hb-c07-u0176-s002
      start: 128
      end: 222
    - id: hb-c07-u0176-s003
      start: 223
      end: 299
  - type: paragraph
    id: hb-c07-u0177
    text: Enligt finsk lag måste arbetsgivaren ordna förebyggande företagshälsovård för alla arbetstagare.
      Arbetsgivaren måste informera dig om vilka tjänster du får via företagshälsovården. Avtalet om företagshälsovård
      ska finnas tillgängligt på din arbetsplats. Där kan du kontrollera vilka tjänster du får via företagshälsovården.
      Anställningens längd och form har ingen betydelse. Syftet med företagshälsovården är att främja
      arbetstagarnas hälsa, arbetsförmåga och säkerhet på arbetsplatsen. Företagshälsovårdens tjänster
      är kostnadsfria för arbetstagarna.
    sentences:
    - id: hb-c07-u0177-s001
      start: 0
      end: 96
    - id: hb-c07-u0177-s002
      start: 97
      end: 180
    - id: hb-c07-u0177-s003
      start: 181
      end: 253
    - id: hb-c07-u0177-s004
      start: 254
      end: 323
    - id: hb-c07-u0177-s005
      start: 324
      end: 374
    - id: hb-c07-u0177-s006
      start: 375
      end: 486
    - id: hb-c07-u0177-s007
      start: 487
      end: 551
  - type: paragraph
    id: hb-c07-u0178
    text: Personalen inom företagshälsovården har sekretess. De lämnar inte ut information om din situation
      till din arbetsgivare, om inte du själv har gett tillstånd till det. Företagshälsovården kan dock
      ge din arbetsgivare en bedömning av huruvida ditt hälsotillstånd tillåter att du fortsätter att
      arbeta.
    sentences:
    - id: hb-c07-u0178-s001
      start: 0
      end: 50
    - id: hb-c07-u0178-s002
      start: 51
      end: 166
    - id: hb-c07-u0178-s003
      start: 167
      end: 299
- id: hb-c07-problem
  title: Rekrytering och problem i arbetslivet
  blocks:
  - type: paragraph
    id: hb-c07-u0179
    text: I meritförteckningen kan man ange en referens. En referens är till exempel en tidigare chef
      eller arbetskamrat som kan berätta positiva saker om den arbetssökande. Man måste alltid fråga referensen
      om lov att ange hens kontaktuppgifter i meritförteckningen. Det kan hända att en rekryterare ringer
      referensen för att fråga hurdan hen tycker att den sökande är som arbetstagare.
    sentences:
    - id: hb-c07-u0179-s001
      start: 0
      end: 46
    - id: hb-c07-u0179-s002
      start: 47
      end: 163
    - id: hb-c07-u0179-s003
      start: 164
      end: 257
    - id: hb-c07-u0179-s004
      start: 258
      end: 377
  - type: paragraph
    id: hb-c07-u0180
    text: I Finland är diskriminering i platsannonser och vid rekrytering förbjudna i lag. Diskriminering
      betyder att en arbetssökande behandlas sämre än andra på grund av en personlig egenskap.
    sentences:
    - id: hb-c07-u0180-s001
      start: 0
      end: 80
    - id: hb-c07-u0180-s002
      start: 81
      end: 184
  - type: paragraph
    id: hb-c07-u0181
    text: I platsannonser får man inte kräva egenskaper eller färdigheter av de sökande som inte är nödvändiga
      för arbetet. I en anställningsintervju får arbetsgivaren inte ställa frågor om den sökandes personliga
      angelägenheter som inte är relaterade till arbetsuppgiften. Sådana frågor kan gälla till exempel
      den sökandes religion, politiska övertygelse eller planer på att skaffa barn.
    sentences:
    - id: hb-c07-u0181-s001
      start: 0
      end: 113
    - id: hb-c07-u0181-s002
      start: 114
      end: 263
    - id: hb-c07-u0181-s003
      start: 264
      end: 378
  - type: paragraph
    id: hb-c07-u0182
    text: Vid rekrytering får man inte diskriminera en sökande på grund av kön, ålder, ursprung, nationalitet,
      språk, religion, övertygelse, åsikt, politisk verksamhet, facklig verksamhet, familjeförhållanden,
      hälsotillstånd, funktionsnedsättning, sexuell läggning eller könsuttryck.
    sentences:
    - id: hb-c07-u0182-s001
      start: 0
      end: 273
  - type: paragraph
    id: hb-c07-u0183
    text: Om man möter diskriminering när man söker arbete kan man anmäla det till arbetarskyddsmyndigheten
      eller diskrimineringsombudsmannen.
    sentences:
    - id: hb-c07-u0183-s001
      start: 0
      end: 132
  - type: paragraph
    id: hb-c07-u0184
    text: I Finland följer man i allmänhet arbetsavtal, kollektivavtal och arbetslagstiftningen. Ändå
      uppstår det ibland problem i arbetet. Problemen kan vara lindrigare eller allvarligare. Arbetsgivaren
      känner inte alltid till sina skyldigheter eller så handlar arbetsgivaren ibland felaktigt med avsikt.
      Arbetsrelaterat utnyttjande innebär att en anställd i en svag ställning utnyttjas i syfte att uppnå
      ekonomisk nytta.
    sentences:
    - id: hb-c07-u0184-s001
      start: 0
      end: 86
    - id: hb-c07-u0184-s002
      start: 87
      end: 129
    - id: hb-c07-u0184-s003
      start: 130
      end: 179
    - id: hb-c07-u0184-s004
      start: 180
      end: 295
    - id: hb-c07-u0184-s005
      start: 296
      end: 412
  - type: paragraph
    id: hb-c07-u0185
    text: Om en anställd inte känner till sina rättigheter i arbetet, ökar risken för att bli utnyttjad.
      En del anställda är också rädda för att det påverkar deras uppehållstillstånd om de lyfter fram
      problem på arbetsplatsen. Personer som blivit utnyttjade av en arbetsgivare kan i Finland ansöka
      om fortsatt uppehållstillstånd för sin vistelse på grund av utnyttjandet.
    sentences:
    - id: hb-c07-u0185-s001
      start: 0
      end: 94
    - id: hb-c07-u0185-s002
      start: 95
      end: 216
    - id: hb-c07-u0185-s003
      start: 217
      end: 361
  - type: paragraph
    id: hb-c07-u0186
    text: 'Problem kan uppstå i bland annat följande situationer:'
    sentences:
    - id: hb-c07-u0186-s001
      start: 0
      end: 54
  - id: hb-c07-u0188
    type: list
    ordered: false
    items:
    - id: hb-c07-u0187
      text: Arbetsgivaren betalar inte lön i enlighet med kollektivavtalet.
      sentences:
      - id: hb-c07-u0187-s001
        start: 0
        end: 63
    - id: hb-c07-u0189
      text: Arbetsgivaren betalar inte de tillägg eller övertidsersättningar som ingår i den anställdas
        lön.
      sentences:
      - id: hb-c07-u0189-s001
        start: 0
        end: 96
    - id: hb-c07-u0190
      text: Arbetsgivaren vill betala lönen direkt i handen, det vill säga inte betala skatter och andra
        avgifter.
      sentences:
      - id: hb-c07-u0190-s001
        start: 0
        end: 102
    - id: hb-c07-u0191
      text: Arbetsgivaren betalar för lite eller ingen lön alls för sjukdomstid.
      sentences:
      - id: hb-c07-u0191-s001
        start: 0
        end: 68
    - id: hb-c07-u0192
      text: Arbetsgivaren ger ingen lönespecifikation till den anställda.
      sentences:
      - id: hb-c07-u0192-s001
        start: 0
        end: 61
    - id: hb-c07-u0193
      text: Arbetsgivaren ger arbetsskiftsförteckningen för sent eller ändrar arbetsskift i den utan den
        anställdas samtycke.
      sentences:
      - id: hb-c07-u0193-s001
        start: 0
        end: 113
    - id: hb-c07-u0194
      text: Arbetsgivaren ringer den anställda när hen är på semester eller har en ledig dag och beordrar
        hen att komma till arbetet.
      sentences:
      - id: hb-c07-u0194-s001
        start: 0
        end: 121
    - id: hb-c07-u0195
      text: Det är farligt att arbeta på arbetsplatsen, eftersom till exempel skyddsutrustning saknas.
      sentences:
      - id: hb-c07-u0195-s001
        start: 0
        end: 90
    - id: hb-c07-u0196
      text: Arbetsgivaren låter den anställda arbeta för mycket.
      sentences:
      - id: hb-c07-u0196-s001
        start: 0
        end: 52
    - id: hb-c07-u0197
      text: Arbetsgivaren reagerar inte, trots att den anställda trakasseras eller behandlas osakligt.
      sentences:
      - id: hb-c07-u0197-s001
        start: 0
        end: 90
    - id: hb-c07-u0198
      text: Arbetsgivaren vägrar ordna företagshälsovårdstjänster för den anställda.
      sentences:
      - id: hb-c07-u0198-s001
        start: 0
        end: 72
    - id: hb-c07-u0199
      text: Arbetsgivaren ger inget arbetsintyg när anställningen upphör, trots att den anställda ber
        om det.
      sentences:
      - id: hb-c07-u0199-s001
        start: 0
        end: 97
  - type: paragraph
    id: hb-c07-u0200
    text: För svartarbete betalas lönen vanligtvis kontakt, och arbetsgivaren och den anställda meddelar
      inte inkomsterna från svartarbetet till myndigheterna. Arbetsgivaren betalar inte den anställdas
      socialförsäkringsavgifter och verkställer ingen förskottsinnehållning på lönen. Ofta har arbetsgivaren
      och den anställda kommit överens om svartarbetet. Svartarbete är ett brott i Finland. Både den anställda
      och arbetsgivaren kan få ett straff för det.
    sentences:
    - id: hb-c07-u0200-s001
      start: 0
      end: 149
    - id: hb-c07-u0200-s002
      start: 150
      end: 271
    - id: hb-c07-u0200-s003
      start: 272
      end: 344
    - id: hb-c07-u0200-s004
      start: 345
      end: 380
    - id: hb-c07-u0200-s005
      start: 381
      end: 444
  - type: paragraph
    id: hb-c07-u0201
    text: Svartarbete är inte lönsamt för varken arbetstagaren eller samhället. Samhällets tjänster betalas
      med gemensamma skattepengar. Om människorna inte betalar skatt, äventyras välfärden och stabiliteten
      i samhället. Den som utför svartarbete blir utan inkomstrelaterad arbetslöshetsdagpenning och graviditetspenning
      och föräldrapenning, och tjänar inte in någon pension för ålderdomen eller i händelse av arbetsoförmåga.
    sentences:
    - id: hb-c07-u0201-s001
      start: 0
      end: 69
    - id: hb-c07-u0201-s002
      start: 70
      end: 126
    - id: hb-c07-u0201-s003
      start: 127
      end: 211
    - id: hb-c07-u0201-s004
      start: 212
      end: 416
  - type: paragraph
    id: hb-c07-u0202
    text: Den som utför svartarbete är i en betydligt svagare ställning än anställda i ett lagligt anställningsförhållande.
      Om det uppstår en tvist med arbetsgivaren om till exempel lönen, är det svårt att få hjälp. Om det
      sker en olycka på arbetsplatsen kan den anställda inte få någon försäkringsersättning.
    sentences:
    - id: hb-c07-u0202-s001
      start: 0
      end: 113
    - id: hb-c07-u0202-s002
      start: 114
      end: 205
    - id: hb-c07-u0202-s003
      start: 206
      end: 299
  - type: paragraph
    id: hb-c07-u0203
    text: I värsta fall kan utnyttjande av en arbetstagare vara människohandel. Med människohandel avses
      en situation där en arbetstagare är tvungen att arbeta under förhållanden som påminner om tvångsarbete.
    sentences:
    - id: hb-c07-u0203-s001
      start: 0
      end: 69
    - id: hb-c07-u0203-s002
      start: 70
      end: 198
  - type: paragraph
    id: hb-c07-u0204
    text: 'Människohandel kännetecknas av bland annat följande:'
    sentences:
    - id: hb-c07-u0204-s001
      start: 0
      end: 52
  - id: hb-c07-u0206
    type: list
    ordered: false
    items:
    - id: hb-c07-u0205
      text: Arbetsgivaren beslagtar arbetstagarens bankkort, pass, uppehållstillstånd eller andra viktiga
        handlingar.
      sentences:
      - id: hb-c07-u0205-s001
        start: 0
        end: 105
    - id: hb-c07-u0207
      text: Arbetstagaren är tvungen att övernatta på arbetsplatsen under eländiga förhållanden.
      sentences:
      - id: hb-c07-u0207-s001
        start: 0
        end: 84
    - id: hb-c07-u0208
      text: Arbetsgivaren är våldsam mot eller hotar arbetstagaren med våld.
      sentences:
      - id: hb-c07-u0208-s001
        start: 0
        end: 64
  - type: paragraph
    id: hb-c07-u0209
    text: Människohandel är ofta förknippad med att en arbetstagare är verkligt bunden till arbetsgivaren.
      Arbetstagaren kan stå i skuld till arbetsgivaren eller så har arbetsgivaren beslagtagit den anställdas
      handlingar. Det är i praktiken omöjligt för den anställda att vägra utföra arbetet eller sluta att
      arbeta för arbetsgivaren. Dessutom kan det hända att arbetsgivaren använder våld eller hotar att
      skada arbetstagaren eller hens närstående.
    sentences:
    - id: hb-c07-u0209-s001
      start: 0
      end: 96
    - id: hb-c07-u0209-s002
      start: 97
      end: 211
    - id: hb-c07-u0209-s003
      start: 212
      end: 324
    - id: hb-c07-u0209-s004
      start: 325
      end: 438
  - type: paragraph
    id: hb-c07-u0210
    text: Det är bra om den anställda först pratar direkt med chefen. Hen kan också be förtroendemannen
      eller arbetarskyddsfullmäktigen om hjälp om en sådan finns på arbetsplatsen.
    sentences:
    - id: hb-c07-u0210-s001
      start: 0
      end: 59
    - id: hb-c07-u0210-s002
      start: 60
      end: 170
  - type: paragraph
    id: hb-c07-u0211
    text: Ibland kan man inte vända sig till chefen, eftersom hen är delaktig i den dåliga behandlingen
      av den anställda. Om situationen inte kan lösas på arbetsplatsen eller om det är fråga om allvarligare
      problem, är det värt att berätta om den dåliga behandlingen för en utomstående, till exempel en
      myndighet eller Brottsofferjouren.
    sentences:
    - id: hb-c07-u0211-s001
      start: 0
      end: 111
    - id: hb-c07-u0211-s002
      start: 112
      end: 327
  - type: paragraph
    id: hb-c07-u0212
    text: Arbetarskyddsmyndigheten ger både arbetstagare och arbetsgivare rådgivning. Den övervakar att
      arbetsgivarna följer de lagar som gäller arbetslivet. Vid diskriminering kan man kontakta förutom
      arbetarskyddsmyndigheten också diskrimineringsombudsmannen eller jämställdhetsombudsmannen.
    sentences:
    - id: hb-c07-u0212-s001
      start: 0
      end: 75
    - id: hb-c07-u0212-s002
      start: 76
      end: 147
    - id: hb-c07-u0212-s003
      start: 148
      end: 283
  - type: paragraph
    id: hb-c07-u0213
    text: Också fackförbundet erbjuder hjälp om den anställda är medlem i ett sådant. Fackförbunden främjar
      arbetstagarnas rättigheter. Finlands Fackförbunds Centralorganisation FFC erbjuder dessutom gratis
      anställningsrådgivning, även om man inte är medlem i något fackförbund. Man kan få rådgivning per
      telefon och e-post.
    sentences:
    - id: hb-c07-u0213-s001
      start: 0
      end: 75
    - id: hb-c07-u0213-s002
      start: 76
      end: 125
    - id: hb-c07-u0213-s003
      start: 126
      end: 268
    - id: hb-c07-u0213-s004
      start: 269
      end: 314
  - type: paragraph
    id: hb-c07-u0214
    text: Människohandel är en polisfråga i Finland, men man kan till en början söka hjälp också hos till
      exempel arbetarskyddsmyndigheterna eller Brottsofferjouren. Brottsofferjouren är en organisation
      som ger brottsoffer rådgivning och stöd.
    sentences:
    - id: hb-c07-u0214-s001
      start: 0
      end: 155
    - id: hb-c07-u0214-s002
      start: 156
      end: 233
  - type: paragraph
    id: hb-c07-u0215
    text: I Finland finns dessutom Hjälpsystemet för offer för människohandel, som är en myndighet som
      lyder under Migrationsverket. Personer som antagits i hjälpsystemet kan genom systemet vid behov
      få bland annat ett tryggt boende, handledning och rådgivning eller ett rättsbiträde.
    sentences:
    - id: hb-c07-u0215-s001
      start: 0
      end: 122
    - id: hb-c07-u0215-s002
      start: 123
      end: 274
  - type: paragraph
    id: hb-c07-u0216
    text: Om du har fått för lite lön, ska du be din arbetsgivare att rätta till löneutbetalningen. Om
      arbetsgivaren inte betalar ut din lön korrekt, trots att du ber om det, kan du kontakta ditt fackförbund.
      Om du inte är med i ett fackförbund kan du be om hjälp från personalrepresentanterna på din arbetsplats
      eller rättshjälpsbyrån.
    sentences:
    - id: hb-c07-u0216-s001
      start: 0
      end: 89
    - id: hb-c07-u0216-s002
      start: 90
      end: 198
    - id: hb-c07-u0216-s003
      start: 199
      end: 326
  - type: paragraph
    id: hb-c07-u0217
    text: Om arbetsgivaren inte kan betala ut din lön, ska du omgående kontakta Lönegarantin. Om arbetsgivaren
      inte har pengar kan du få betalt där. Gör ansökan inom tre månader från det att lönen skulle ha
      betalats.
    sentences:
    - id: hb-c07-u0217-s001
      start: 0
      end: 83
    - id: hb-c07-u0217-s002
      start: 84
      end: 138
    - id: hb-c07-u0217-s003
      start: 139
      end: 206
  - type: paragraph
    id: hb-c07-u0218
    text: Om man inte kommer överens om löneutbetalningen måste ärendet avgöras i domstol. Detta är dock
      det sista alternativet.
    sentences:
    - id: hb-c07-u0218-s001
      start: 0
      end: 80
    - id: hb-c07-u0218-s002
      start: 81
      end: 118
- id: hb-c07-arbetsloshet
  title: Arbetslöshet och stöd till sysselsättning
  blocks:
  - type: paragraph
    id: hb-c07-u0219
    text: Vem som helst kan någon gång i livet bli arbetslös. Då kan man få stöd för jobbsökningen och
      försörjningen av olika myndigheter, fackförbund och organisationer.
    sentences:
    - id: hb-c07-u0219-s001
      start: 0
      end: 51
    - id: hb-c07-u0219-s002
      start: 52
      end: 160
  - type: paragraph
    id: hb-c07-u0220
    text: Om man blir arbetslös ska man först anmäla sig som arbetssökande hos kommunens sysselsättningstjänster.
      Anmälan kan göras redan före den första arbetslöshetsdagen på internet, per telefon eller genom
      att besöka den lokala arbetskraftsmyndigheten.
    sentences:
    - id: hb-c07-u0220-s001
      start: 0
      end: 103
    - id: hb-c07-u0220-s002
      start: 104
      end: 246
  - type: paragraph
    id: hb-c07-u0221
    text: Sysselsättningstjänsterna kallar den som anmält sig som arbetssökande till en inledande intervju.
      I den kartläggs den sökandes situation och görs en sysselsättningsplan upp. Vid mötet kommer man
      överens om hur man ska hålla kontakten och går igenom den arbetssökandes skyldigheter. En arbetslös
      arbetssökande förväntas söka arbete aktivt och i huvudsak självständigt.
    sentences:
    - id: hb-c07-u0221-s001
      start: 0
      end: 97
    - id: hb-c07-u0221-s002
      start: 98
      end: 173
    - id: hb-c07-u0221-s003
      start: 174
      end: 281
    - id: hb-c07-u0221-s004
      start: 282
      end: 367
  - type: paragraph
    id: hb-c07-u0222
    text: När man anmäler sig som arbetssökande ger sysselsättningstjänsterna den som betalar arbetslöshetsförmånen
      ett utlåtande om huruvida personen har rätt till arbetslöshetsförmån. En arbetslöshetsförmån är
      ekonomiskt stöd som betalas av FPA eller en arbetslöshetskassa.
    sentences:
    - id: hb-c07-u0222-s001
      start: 0
      end: 175
    - id: hb-c07-u0222-s002
      start: 176
      end: 265
  - type: paragraph
    id: hb-c07-u0223
    text: Förändringar i den sökandes situation ska alltid anmälas till sysselsättningstjänsterna. En
      anmälan ska göras om den sökande får arbete eller en studieplats, eller om adressen eller telefonnumret
      ändras. Den arbetssökande ska också meddela om hens livssituation förändras och hen inte längre
      kan söka eller ta emot ett heltidsarbete eller en studieplats.
    sentences:
    - id: hb-c07-u0223-s001
      start: 0
      end: 88
    - id: hb-c07-u0223-s002
      start: 89
      end: 203
    - id: hb-c07-u0223-s003
      start: 204
      end: 354
  - type: paragraph
    id: hb-c07-u0224
    text: När en person är arbetslös arbetssökande har hen vanligtvis rätt att få arbetslöshetsförmån.
      Det betyder arbetslöshetsdagpenning eller arbetsmarknadsstöd. En nyanlända med temporärt uppehållstillstånd
      kan anmäla sig som arbetssökande. Hen har ändå inte nödvändigtvis rätt till arbetslöshetsskydd om
      hen inte redan har arbetat i Finland.
    sentences:
    - id: hb-c07-u0224-s001
      start: 0
      end: 92
    - id: hb-c07-u0224-s002
      start: 93
      end: 154
    - id: hb-c07-u0224-s003
      start: 155
      end: 234
    - id: hb-c07-u0224-s004
      start: 235
      end: 336
  - type: paragraph
    id: hb-c07-u0225
    text: Det är möjligt att få arbetslöshetsförmån endast för den tid som jobbsökningen är i kraft. Arbetslöshetsdagpenning
      kan beviljas en arbetslös som har anmält sig som arbetssökande och som är beredd att ta emot ett
      heltidsarbete eller en utbildning. En arbetslös arbetssökande är skyldig att söka arbete under hela
      den tid som jobbsökningen är i kraft och ska vara beredd att ta emot ett nytt arbete om ett sådant
      erbjuds.
    sentences:
    - id: hb-c07-u0225-s001
      start: 0
      end: 90
    - id: hb-c07-u0225-s002
      start: 91
      end: 246
    - id: hb-c07-u0225-s003
      start: 247
      end: 419
  - type: paragraph
    id: hb-c07-u0226
    text: På arbetslöshetsförmånen betalar man skatt. Det är bra att kontrollera sin skatteprocent för
      förmånen hos skattemyndigheten. Man ansöker själv med en separat ansökan om arbetslöshetsförmån
      hos arbetslöshetskassan eller FPA.
    sentences:
    - id: hb-c07-u0226-s001
      start: 0
      end: 43
    - id: hb-c07-u0226-s002
      start: 44
      end: 124
    - id: hb-c07-u0226-s003
      start: 125
      end: 223
  - type: paragraph
    id: hb-c07-u0227
    text: Arbetslöshetskassan betalar inkomstrelaterad dagpenning som arbetslöshetsförmån till personer
      som har rätt till arbetslöshetsförmån, som är medlem i kassan och som medan medlemskapet varit i
      kraft har varit tillräckligt länge i arbete.
    sentences:
    - id: hb-c07-u0227-s001
      start: 0
      end: 235
  - type: paragraph
    id: hb-c07-u0228
    text: En arbetslöshetskassa är en organisation som har som syfte att betala lagstadgad inkomstrelaterad
      dagpenning till sina medlemmar. När man ansluter sig till en arbetslöshetskassa tecknar man på sätt
      och vis en försäkring för arbetslöshet för sig själv. Till kassan betalar man en medlemsavgift en
      gång per år, och om man blir arbetslös får man försörjning från kassan under arbetslösheten.
    sentences:
    - id: hb-c07-u0228-s001
      start: 0
      end: 129
    - id: hb-c07-u0228-s002
      start: 130
      end: 251
    - id: hb-c07-u0228-s003
      start: 252
      end: 388
  - type: paragraph
    id: hb-c07-u0229
    text: Personer som hör till ett fackförbund är i allmänhet samtidigt också medlemmar i en arbetslöshetskassa.
      Man kan höra till en arbetslöshetskassa också utan att höra till ett fackförbund.
    sentences:
    - id: hb-c07-u0229-s001
      start: 0
      end: 103
    - id: hb-c07-u0229-s002
      start: 104
      end: 185
  - type: paragraph
    id: hb-c07-u0230
    text: Till personer som inte är medlemmar i någon arbetslöshetskassa beviljas och betalas arbetslöshetsförmånen
      av FPA. En arbetslös kan få grunddagpenning om hen innan arbetslösheten började hade varit minst
      tolv månader i arbete.
    sentences:
    - id: hb-c07-u0230-s001
      start: 0
      end: 113
    - id: hb-c07-u0230-s002
      start: 114
      end: 225
  - type: paragraph
    id: hb-c07-u0231
    text: Om man ännu inte har varit i arbete tillräckligt länge eller redan har fått grunddagpenning
      eller inkomstrelaterad dagpenning för maximitiden kan man få arbetsmarknadsstöd från FPA. Arbetsmarknadsstödet
      och grunddagpenningen är lika stora förmåner.
    sentences:
    - id: hb-c07-u0231-s001
      start: 0
      end: 181
    - id: hb-c07-u0231-s002
      start: 182
      end: 248
  - type: paragraph
    id: hb-c07-u0232
    text: Syftet med arbetslöshetsskyddet är att alla arbetslösa ska ha en rimlig ekonomisk försörjning
      medan de aktivt söker ett heltidsarbete. Stödet är knappt för dem som inte får inkomstrelaterad
      arbetslöshetsdagpenning. Arbetslösa arbetssökande som får arbetsmarknadsstöd eller grunddagpenning
      får ofta också andra stöd, till exempel bostadsbidrag eller utkomststöd.
    sentences:
    - id: hb-c07-u0232-s001
      start: 0
      end: 134
    - id: hb-c07-u0232-s002
      start: 135
      end: 214
    - id: hb-c07-u0232-s003
      start: 215
      end: 361
  - type: paragraph
    id: hb-c07-u0233
    text: En arbetslös arbetssökande kan också ansöka om utkomststöd, om hens inkomster och tillgångar
      inte räcker till för de nödvändiga utgifterna. Grundläggande utkomststöd beviljas av FPA och kan
      i allmänhet fås för en månad i taget. Utkomststödet är avsett för tillfälliga behov. I vissa fall
      kan det vara möjligt att dessutom få kompletterande eller förebyggande utkomststöd av det egna välfärdsområdet.
    sentences:
    - id: hb-c07-u0233-s001
      start: 0
      end: 139
    - id: hb-c07-u0233-s002
      start: 140
      end: 227
    - id: hb-c07-u0233-s003
      start: 228
      end: 274
    - id: hb-c07-u0233-s004
      start: 275
      end: 399
  - type: paragraph
    id: hb-c07-u0234
    text: När en person söker arbete är det viktigaste att hen själv är aktiv. Sysselsättningstjänsterna
      ger handledning och rådgivning för jobbsökningen och utvecklingen av den egna kompetensen. De hänvisar
      arbetssökande till exempelvis rekryteringsevenemang och till att leta efter lediga platser på internet
      och lämna in arbetsansökningar.
    sentences:
    - id: hb-c07-u0234-s001
      start: 0
      end: 68
    - id: hb-c07-u0234-s002
      start: 69
      end: 185
    - id: hb-c07-u0234-s003
      start: 186
      end: 332
  - type: paragraph
    id: hb-c07-u0235
    text: Sysselsättningstjänsterna kartlägger också tillsammans med kunden olika utbildningsmöjligheter,
      till exempel arbetskraftsutbildningar eller självständiga studier. I synnerhet till personer som
      varit arbetslösa en längre tid kan sysselsättningstjänsterna skicka erbjudanden om lediga platser
      som de måste söka. Om de inte gör det kan de förlora rätten till arbetslöshetsskydd för en viss
      tid.
    sentences:
    - id: hb-c07-u0235-s001
      start: 0
      end: 162
    - id: hb-c07-u0235-s002
      start: 163
      end: 309
    - id: hb-c07-u0235-s003
      start: 310
      end: 391
  - type: paragraph
    id: hb-c07-u0236
    text: Vid arbetsprövning arbetar den arbetssökande som normalt på en arbetsplats, men får ingen lön
      för det utan endast arbetslöshetsdagpenning. Man måste själv hitta en plats för arbetsprövning.
      Efter det måste man ännu få ett beslut från sysselsättningstjänsterna om att man kan inleda arbetsprövningen.
    sentences:
    - id: hb-c07-u0236-s001
      start: 0
      end: 138
    - id: hb-c07-u0236-s002
      start: 139
      end: 189
    - id: hb-c07-u0236-s003
      start: 190
      end: 299
  - type: paragraph
    id: hb-c07-u0237
    text: En arbetsprövning kan pågå i högst sex månader hos samma arbetsgivare. Under den tiden ges den
      som deltar i arbetsprövningen möjlighet att visa för arbetsgivaren vad hen kan och hur stor motivation
      hen har för arbetet. Ibland kan en period av arbetsprövning ge en riktig arbetsplats med lön eller
      ett lönesubventionerat arbete.
    sentences:
    - id: hb-c07-u0237-s001
      start: 0
      end: 70
    - id: hb-c07-u0237-s002
      start: 71
      end: 218
    - id: hb-c07-u0237-s003
      start: 219
      end: 327
  - type: paragraph
    id: hb-c07-u0238
    text: Det är viktigt att komma ihåg att i Finland kan endast arbetskraftstjänsterna eller läroanstalter
      godkänna oavlönade perioder av arbetspraktik eller arbetsprövning. Ibland kan det hända att en arbetsgivare
      tar en arbetstagare direkt till arbetsplatsen för en oavlönad praktikperiod och lovar att hen kan
      få ett lönearbete när perioden är slut. Arbetsgivaren har ändå inte rätt att låta en arbetstagare
      utföra gratis arbete, om sysselsättningstjänsterna eller en läroanstalt inte först har godkänt praktik-
      eller prövningsperioden.
    sentences:
    - id: hb-c07-u0238-s001
      start: 0
      end: 164
    - id: hb-c07-u0238-s002
      start: 165
      end: 343
    - id: hb-c07-u0238-s003
      start: 344
      end: 530
  - type: paragraph
    id: hb-c07-u0239
    text: Lönesubvention är ett ekonomiskt stöd som betalas av staten och som underlättar sysselsättningen
      av arbetslösa arbetssökande. Lönesubvention betalas till arbetsgivaren för arbetstagarens lönekostnader.
      Arbetstagaren har ett normalt anställningsförhållande med arbetsgivaren. Man kan fråga om möjligheten
      till lönesubvention hos sysselsättningstjänsterna. Arbetslösa arbetssökande kan ansöka om lönesubvention
      också för läroavtalsutbildning.
    sentences:
    - id: hb-c07-u0239-s001
      start: 0
      end: 125
    - id: hb-c07-u0239-s002
      start: 126
      end: 201
    - id: hb-c07-u0239-s003
      start: 202
      end: 274
    - id: hb-c07-u0239-s004
      start: 275
      end: 354
    - id: hb-c07-u0239-s005
      start: 355
      end: 440
  - type: paragraph
    id: hb-c07-u0240
    text: Om en arbetssökande har varit länge arbetslös, kan hen få delta i arbetsverksamhet i rehabiliteringssyfte.
      Man kommer överens om innehållet i den tillsammans med sysselsättningstjänsterna och välfärdsområdet.
      Syftet med arbetsverksamhet i rehabiliteringssyfte är att stärka kundens arbets- och funktionsförmåga
      och förbättra hens kompetens. Verksamheten kan vara av samma typ som vid arbetsprövning.
    sentences:
    - id: hb-c07-u0240-s001
      start: 0
      end: 106
    - id: hb-c07-u0240-s002
      start: 107
      end: 208
    - id: hb-c07-u0240-s003
      start: 209
      end: 340
    - id: hb-c07-u0240-s004
      start: 341
      end: 399
  - type: paragraph
    id: hb-c07-u0241
    text: Det är möjligt att be om stöd också för utbildning eller byte av yrke hos sysselsättningstjänsterna.
      Ett av de viktigaste alternativen är yrkesinriktad arbetskraftsutbildning. Det finns utbildning
      inom många olika branscher. Till arbetskraftsutbildningar ansöker man via sysselsättningstjänsterna.
      Sysselsättningstjänsterna kan också stödja frivillig utbildning som den arbetssökande själv har
      hittat, om den förbättrar hens sysselsättningsmöjligheter och det bland arbetskraftsutbildningarna
      inte finns någon lämplig utbildning.
    sentences:
    - id: hb-c07-u0241-s001
      start: 0
      end: 100
    - id: hb-c07-u0241-s002
      start: 101
      end: 175
    - id: hb-c07-u0241-s003
      start: 176
      end: 224
    - id: hb-c07-u0241-s004
      start: 225
      end: 297
    - id: hb-c07-u0241-s005
      start: 298
      end: 529
- id: hb-c07-foretagande
  title: Företagande och företagsformer
  blocks:
  - type: paragraph
    id: hb-c07-u0242
    text: Ett alternativ till arbete är att starta ett eget företag eller bli egenföretagare. Till exempel
      tolkar, journalister, musiker, bokförare och grafiska formgivare kan vara egenföretagare.
    sentences:
    - id: hb-c07-u0242-s001
      start: 0
      end: 83
    - id: hb-c07-u0242-s002
      start: 84
      end: 186
  - type: paragraph
    id: hb-c07-u0243
    text: Om man vill bli företagare ska man ha en bra affärsidé. Man behöver också tillräckligt mycket
      pengar för att komma igång. Företagande är alltid förknippat med en ekonomisk risk. Om ett företag
      inte har några kunder, får det inga inkomster. Om en person är företagare på heltid eller egenföretagare,
      har hen inte rätt till arbetslöshetsförmåner.
    sentences:
    - id: hb-c07-u0243-s001
      start: 0
      end: 55
    - id: hb-c07-u0243-s002
      start: 56
      end: 121
    - id: hb-c07-u0243-s003
      start: 122
      end: 177
    - id: hb-c07-u0243-s004
      start: 178
      end: 239
    - id: hb-c07-u0243-s005
      start: 240
      end: 344
  - type: paragraph
    id: hb-c07-u0244
    text: Att starta företag kräver yrkesskicklighet och kunskap om till exempel beskattning och bokföring.
      Om man funderar på att starta eget företag ska man först göra upp en preliminär affärsplan, det
      vill säga en kalkyl över huruvida företaget kommer att vara lönsamt.
    sentences:
    - id: hb-c07-u0244-s001
      start: 0
      end: 97
    - id: hb-c07-u0244-s002
      start: 98
      end: 262
  - type: paragraph
    id: hb-c07-u0245
    text: Städernas nyföretagarcentrum erbjuder hjälp med upprättande av affärsplaner och allt som rör
      startande av företag. De erbjuder också utbildning för personer som vill bli företagare. Likaså
      erbjuder kommunens sysselsättningstjänster tjänster för företagare.
    sentences:
    - id: hb-c07-u0245-s001
      start: 0
      end: 114
    - id: hb-c07-u0245-s002
      start: 115
      end: 181
    - id: hb-c07-u0245-s003
      start: 182
      end: 256
  - type: paragraph
    id: hb-c07-u0246
    text: För att starta ett företag behövs pengar, i synnerhet om företaget behöver hyra affärslokaler
      eller köpa utrustning. Bankerna kan bevilja lån för företagsverksamhet. Också det statsägda finansinstitutet
      Finnvera kan bevilja företag lån eller gå i borgen för banklån.
    sentences:
    - id: hb-c07-u0246-s001
      start: 0
      end: 116
    - id: hb-c07-u0246-s002
      start: 117
      end: 165
    - id: hb-c07-u0246-s003
      start: 166
      end: 266
  - type: paragraph
    id: hb-c07-u0247
    text: En ny företagare kan ansöka om startbidrag hos kommunens sysselsättningstjänster för det inledande
      skedet av företagsstarten. Startbidraget är avsett för företagarens levnadskostnader, inte för företagets
      verksamhet. Startbidrag kan betalas i högst tolv månader.
    sentences:
    - id: hb-c07-u0247-s001
      start: 0
      end: 125
    - id: hb-c07-u0247-s002
      start: 126
      end: 216
    - id: hb-c07-u0247-s003
      start: 217
      end: 262
  - type: paragraph
    id: hb-c07-u0248
    text: Företagaren är skyldig att ordna med företagets bokföring. I bokföringen antecknas företagets
      inkomster och utgifter. Företagaren kan upprätta bokföringen själv eller anlita en bokföringsbyrå
      för det. Bokföringen måste upprättas på det sätt som lagen föreskriver.
    sentences:
    - id: hb-c07-u0248-s001
      start: 0
      end: 58
    - id: hb-c07-u0248-s002
      start: 59
      end: 117
    - id: hb-c07-u0248-s003
      start: 118
      end: 200
    - id: hb-c07-u0248-s004
      start: 201
      end: 263
  - type: paragraph
    id: hb-c07-u0249
    text: Det är inte alltid lätt att veta om man är företagare eller anställd. Ibland kan det i arbetsavtalet
      stå att en person är företagare, trots att hen i praktiken arbetar som anställd. I sådana fall ska
      hen ha samma rättigheter som en anställd.
    sentences:
    - id: hb-c07-u0249-s001
      start: 0
      end: 69
    - id: hb-c07-u0249-s002
      start: 70
      end: 181
    - id: hb-c07-u0249-s003
      start: 182
      end: 241
  - type: paragraph
    id: hb-c07-u0250
    text: Som företagare är man fri att bestämma hur, när, till vilket pris och för vem man arbetar. Om
      ett företag till exempel meddelar en person om arbetstider kan det hända att hen är anställd. Då
      har hen samma rättigheter som en anställd, till exempel semester med lön, sjukledighet med lön,
      övertidsersättning, företagshälsovård och olycksfallsförsäkring.
    sentences:
    - id: hb-c07-u0250-s001
      start: 0
      end: 90
    - id: hb-c07-u0250-s002
      start: 91
      end: 187
    - id: hb-c07-u0250-s003
      start: 188
      end: 351
  - type: paragraph
    id: hb-c07-u0251
    text: Det är bra att se till sina rättigheter som anställd. Det är värt att läsa igenom villkoren
      i arbetsavtalet noggrant. Det är en långsam och arbetsdryg process att kräva sina rättigheter i
      efterhand. Om man inte är säker på om man är företagare eller anställd kan man fråga arbetarskyddsmyndigheten
      om råd.
    sentences:
    - id: hb-c07-u0251-s001
      start: 0
      end: 53
    - id: hb-c07-u0251-s002
      start: 54
      end: 117
    - id: hb-c07-u0251-s003
      start: 118
      end: 198
    - id: hb-c07-u0251-s004
      start: 199
      end: 305
  - type: paragraph
    id: hb-c07-u0252
    text: Det enklaste och vanligaste sättet att starta företagsverksamhet är att driva en firma som enskild
      näringsidkare. Du har bestämmanderätt över och ansvar för firmans ärenden och företaget kan anställa
      medarbetare precis som andra företag. Om företagsverksamheten är en bisyssla lönar det sig ofta
      att starta firma som enskild näringsidkare. Det går snabbt och enkelt att starta företagsverksamhet.
    sentences:
    - id: hb-c07-u0252-s001
      start: 0
      end: 113
    - id: hb-c07-u0252-s002
      start: 114
      end: 237
    - id: hb-c07-u0252-s003
      start: 238
      end: 339
    - id: hb-c07-u0252-s004
      start: 340
      end: 396
  - type: paragraph
    id: hb-c07-u0253
    text: Aktiebolaget är den vanligaste företagsformen i Finland. Ett aktiebolag passar för all slags
      affärsverksamhet. Du kan grunda ett aktiebolag antingen själv eller tillsammans med andra delägare.
      Delägarens rösträtt, avkastning och ansvar i bolaget beror på hur många aktier i bolaget hen äger.
    sentences:
    - id: hb-c07-u0253-s001
      start: 0
      end: 56
    - id: hb-c07-u0253-s002
      start: 57
      end: 110
    - id: hb-c07-u0253-s003
      start: 111
      end: 192
    - id: hb-c07-u0253-s004
      start: 193
      end: 291
  - type: paragraph
    id: hb-c07-u0254
    text: Ett öppet bolag bildas då två eller fler personer kommer överens om att grunda ett bolag genom
      att teckna ett bolagsavtal. Bolagsmännen, det vill säga de personer som tillsammans äger bolaget,
      är jämställda i all verksamhet som bolaget driver och ansvarar tillsammans och personligen för bolagets
      beslut, förbindelser och skulder.
    sentences:
    - id: hb-c07-u0254-s001
      start: 0
      end: 122
    - id: hb-c07-u0254-s002
      start: 123
      end: 330
  - type: paragraph
    id: hb-c07-u0255
    text: Ett kommanditbolag är ett personbolag som skiljer sig från ett öppet bolag på så sätt att det
      i kommanditbolaget finns utöver en eller flera ansvariga bolagsmän åtminstone en tyst bolagsman,
      det vill säga en person som är delägare i företaget. Vanligen är den tysta bolagsmannen en investerare.
    sentences:
    - id: hb-c07-u0255-s001
      start: 0
      end: 243
    - id: hb-c07-u0255-s002
      start: 244
      end: 294
  - type: paragraph
    id: hb-c07-u0256
    text: Ett andelslag är ett företag som ägs av medlemmarna. Ett andelslag kan ha en eller fler medlemmar.
      På andelslagets stämma har varje medlem en röst. Medlemmarna ansvarar för andelslagets förpliktelser
      (t.ex. skulder) endast med det belopp som de investerat i andelslaget.
    sentences:
    - id: hb-c07-u0256-s001
      start: 0
      end: 52
    - id: hb-c07-u0256-s002
      start: 53
      end: 98
    - id: hb-c07-u0256-s003
      start: 99
      end: 147
    - id: hb-c07-u0256-s004
      start: 148
      end: 270
  - type: paragraph
    id: hb-c07-u0257
    text: I Finland får man driva en laglig näring som följer god sed utan ett tillstånd som beviljas
      av myndigheter. I vissa fall behövs det dock ett tillstånd från myndigheter för att starta företagsverksamhet,
      eller också måste man anmäla verksamheten till myndigheter.
    sentences:
    - id: hb-c07-u0257-s001
      start: 0
      end: 107
    - id: hb-c07-u0257-s002
      start: 108
      end: 262
  - type: paragraph
    id: hb-c07-u0258
    text: Du måste teckna en företagarpensionsförsäkring (FöPL) om
    sentences:
    - id: hb-c07-u0258-s001
      start: 0
      end: 56
  - id: hb-c07-u0260
    type: list
    ordered: false
    items:
    - id: hb-c07-u0259
      text: du är företagare,
      sentences:
      - id: hb-c07-u0259-s001
        start: 0
        end: 17
    - id: hb-c07-u0261
      text: du är 18–69 år gammal,
      sentences:
      - id: hb-c07-u0261-s001
        start: 0
        end: 22
    - id: hb-c07-u0262
      text: du har bedrivit företagsverksamhet i minst fyra månader och
      sentences:
      - id: hb-c07-u0262-s001
        start: 0
        end: 59
    - id: hb-c07-u0263
      text: din arbetsinkomst från företagsverksamheten är (FöPL-arbetsinkomst) är minst 9 208,43 euro
        per år (2025).
      sentences:
      - id: hb-c07-u0263-s001
        start: 0
        end: 105
  - type: paragraph
    id: hb-c07-u0264
    text: Pensionsförsäkringen tryggar företagarens utkomst då företagsverksamheten upphör på grund av
      invaliditet eller ålder och den ger företagarens anhöriga ett familjepensionsskydd efter att företagaren
      har dött. Pensionsförsäkringar fås antingen genom försäkringsbolag eller pensionskassor (eläkekassa).
      Teckna en pensionsförsäkring senast när det har gått sex månader sedan du startade företagsverksamheten.
      En ny företagare får en rabatt på 22 procent på pensionspremierna under de fyra första åren.
    sentences:
    - id: hb-c07-u0264-s001
      start: 0
      end: 207
    - id: hb-c07-u0264-s002
      start: 208
      end: 299
    - id: hb-c07-u0264-s003
      start: 300
      end: 404
    - id: hb-c07-u0264-s004
      start: 405
      end: 497
  - type: paragraph
    id: hb-c07-u0265
    text: Storleken av försäkringspremierna och pensionen beror på hur stor förvärvsinkomst (työtulo)
      förtagaren har. Arbetsinkomstens storlek påverkar förutom arbetspensionen också direkt din sociala
      trygghet om du blir sjuk eller arbetslös eller ska vara föräldraledig.
    sentences:
    - id: hb-c07-u0265-s001
      start: 0
      end: 107
    - id: hb-c07-u0265-s002
      start: 108
      end: 261
  - type: paragraph
    id: hb-c07-u0266
    text: Företagsformen påverkar företagets beskattning. Detta är det bra att beakta när du väljer företagsform.
    sentences:
    - id: hb-c07-u0266-s001
      start: 0
      end: 47
    - id: hb-c07-u0266-s002
      start: 48
      end: 103
  - type: paragraph
    id: hb-c07-u0267
    text: Skatter betalas på de inkomster som företagaren eller företaget har kvar när alla kostnader
      för företagsverksamheten har dragits av försäljningen. Företagets skatter betalas på basis av de
      beskattningsbara inkomsterna, vars belopp man uppskattar på förhand. Uppskattningen baseras på beloppet
      av de beskattningsbara inkomsterna året innan. I ett nytt företag uppskattar företagaren själv storleken
      av den beskattningsbara inkomsten och meddelar denna till skattmyndigheten.
    sentences:
    - id: hb-c07-u0267-s001
      start: 0
      end: 146
    - id: hb-c07-u0267-s002
      start: 147
      end: 257
    - id: hb-c07-u0267-s003
      start: 258
      end: 339
    - id: hb-c07-u0267-s004
      start: 340
      end: 473
  - type: paragraph
    id: hb-c07-u0268
    text: Om en arbetstagare kommer från ett land utanför EU eller EES, måste hen ha rätt att arbeta i
      Finland. När du anställer en utländsk arbetstagare ska du säkerställa att hens rätt att arbeta gäller
      under hela anställningstiden. Förvara grunden för och övriga uppgifter om din utländska arbetstagares
      rätt att arbeta i fyra års tid efter att anställningen har upphört. Uppgifterna måste finnas på
      arbetsplatsen så att arbetarskyddsmyndigheterna vid behov kan kontrollera dem.
    sentences:
    - id: hb-c07-u0268-s001
      start: 0
      end: 101
    - id: hb-c07-u0268-s002
      start: 102
      end: 224
    - id: hb-c07-u0268-s003
      start: 225
      end: 364
    - id: hb-c07-u0268-s004
      start: 365
      end: 471
  - type: paragraph
    id: hb-c07-u0269
    text: För din utländska arbetstagare gäller samma anställningsvillkor, arbetssäkerhetskrav och lagstadgade
      försäkringar som på dina finländska arbetstagare.
    sentences:
    - id: hb-c07-u0269-s001
      start: 0
      end: 150
  - type: paragraph
    id: hb-c07-u0270
    text: Om ditt företag har anställda ska du också sköta pensions- och arbetslöshetsförsäkringsavgifterna
      och socialskyddsavgifterna för dina anställda. Du måste teckna en pensionsförsäkring (ArPL-försäkring)
      och en olycksfallsförsäkring, som omfattar en grupplivförsäkring och en arbetslöshetsförsäkring,
      för de anställda. Arbetsgivaren betalar arbetstagarens socialskyddsavgifter till skattemyndigheten
      i anslutning till skatteinnehållningen.
    sentences:
    - id: hb-c07-u0270-s001
      start: 0
      end: 144
    - id: hb-c07-u0270-s002
      start: 145
      end: 315
    - id: hb-c07-u0270-s003
      start: 316
      end: 436
  - type: paragraph
    id: hb-c07-u0271
    text: Som arbetsgivare måste du teckna en yrkessjukdoms- och arbetsolycksfallsförsäkring för dina
      anställda. Detta ska alltid göras när en anställning börjar. Arbetstagaren kan få ersättning om
      hen råkar ut för ett olycksfall i arbetet.
    sentences:
    - id: hb-c07-u0271-s001
      start: 0
      end: 102
    - id: hb-c07-u0271-s002
      start: 103
      end: 152
    - id: hb-c07-u0271-s003
      start: 153
      end: 230
  - type: paragraph
    id: hb-c07-u0272
    text: Också en företagare kan ha rätt till arbetslöshetsförmåner, om hen är arbetslös och registrerad
      som arbetssökande. En företagare är arbetslös när hen har lagt ned sin företagsverksamhet eller
      sålt sin andel av företaget. Företagandet kan också upphöra om företaget säljs, avvecklas, går i
      konkurs, försätts i likvidation eller på grund av skilsmässa. Företagandet kan också upphöra om
      du inte längre arbetar för företaget.
    sentences:
    - id: hb-c07-u0272-s001
      start: 0
      end: 114
    - id: hb-c07-u0272-s002
      start: 115
      end: 220
    - id: hb-c07-u0272-s003
      start: 221
      end: 350
    - id: hb-c07-u0272-s004
      start: 351
      end: 422
  - type: paragraph
    id: hb-c07-u0273
    text: För att få arbetslöshetsförmåner måste din jobbsökning vara i kraft och du måste vara beredd
      att ta emot ett heltidsjobb.
    sentences:
    - id: hb-c07-u0273-s001
      start: 0
      end: 121
  - type: paragraph
    id: hb-c07-u0274
    text: Om du vill få inkomstrelaterat utkomstskydd för arbetslösa, ska du ansluta dig som medlem i
      företagarnas arbetslöshetskassa (yrittäjien työttömyyskassa). Om din företagsverksamhet upphör,
      kan du ansöka om inkomstrelaterad dagpenning (ansiosidonnainen päiväraha) vid arbetslöshetskassan.
    sentences:
    - id: hb-c07-u0274-s001
      start: 0
      end: 153
    - id: hb-c07-u0274-s002
      start: 154
      end: 286
  - type: paragraph
    id: hb-c07-u0275
    text: Du kan få inkomstrelaterad dagpenning från företagarnas arbetslöshetskassa om du har bedrivit
      företagsverksamhet och varit medlem i kassan tillräckligt länge innan du blev arbetslös. Den inkomstrelaterade
      dagpenningen är större än grunddagpenningen eller arbetsmarknadsstödet. Hur stor inkomstrelaterad
      dagpenning du får beror på hur stora förvärvsinkomster du angett som grund för arbetslöshetsförsäkringen.
    sentences:
    - id: hb-c07-u0275-s001
      start: 0
      end: 182
    - id: hb-c07-u0275-s002
      start: 183
      end: 276
    - id: hb-c07-u0275-s003
      start: 277
      end: 408
- id: hb-c07-skatter
  title: Skatter och deklarationsskyldighet
  blocks:
  - type: paragraph
    id: hb-c07-u0276
    text: I Finland måste alla betala skatt. Med skattepengarna tillhandahåller staten omfattande offentlig
      service, som främjar medborgarnas välbefinnande. Människorna betalar skatt på sina förvärvsinkomster.
      Förvärvsinkomster är till exempel lön, arbetslöshetsdagpenning, pension och studiestöd. Arbetsgivaren
      eller den som betalar förmånerna, till exempel FPA, drar av skatterna på lönen eller förmånen automatiskt
      och betalar dem direkt till Skatteförvaltningen.
    sentences:
    - id: hb-c07-u0276-s001
      start: 0
      end: 34
    - id: hb-c07-u0276-s002
      start: 35
      end: 146
    - id: hb-c07-u0276-s003
      start: 147
      end: 199
    - id: hb-c07-u0276-s004
      start: 200
      end: 287
    - id: hb-c07-u0276-s005
      start: 288
      end: 456
  - type: paragraph
    id: hb-c07-u0277
    text: I Finland betalar människorna också många andra skatter. För produkter och tjänster betalas
      mervärdesskatt, bilägare betalar bilskatt, för arv betalas arvsskatt och fastighetsägare betalar
      fastighetsskatt.
    sentences:
    - id: hb-c07-u0277-s001
      start: 0
      end: 56
    - id: hb-c07-u0277-s002
      start: 57
      end: 205
  - type: paragraph
    id: hb-c07-u0278
    text: I Finland tillämpas progressiv beskattning när förvärvsinkomster beskattas. Det betyder att
      ju mer inkomster en person har, desto högre procent betalar hen i skatt. Om en person har hög lön
      är också skatteprocenten hög, och om lönen är liten är skatteprocenten låg.
    sentences:
    - id: hb-c07-u0278-s001
      start: 0
      end: 75
    - id: hb-c07-u0278-s002
      start: 76
      end: 164
    - id: hb-c07-u0278-s003
      start: 165
      end: 265
  - type: paragraph
    id: hb-c07-u0279
    text: Skatt betalas på både förvärvs- och kapitalinkomster. Förvärvs- och kapitalinkomsterna beskattas
      på olika sätt. Kapitalinkomst är inkomster från förmögenhet. De övriga inkomsterna är förvärvsinkomst.
    sentences:
    - id: hb-c07-u0279-s001
      start: 0
      end: 53
    - id: hb-c07-u0279-s002
      start: 54
      end: 111
    - id: hb-c07-u0279-s003
      start: 112
      end: 157
    - id: hb-c07-u0279-s004
      start: 158
      end: 199
  - type: paragraph
    id: hb-c07-u0280
    text: I Finland är beskattningen progressiv. Det innebär att man på en stor lön betalar en större
      andel skatt än på en mindre lön. Skatteprocenten anger hur mycket skatt du betalar på dina inkomster.
      Den beräknas i Finland för var och en separat. Din makas/makes inkomster inverkar inte på din skatteprocent.
      Du kan uppskatta din skatteprocent med Skatteförvaltningens skatteräknare.
    sentences:
    - id: hb-c07-u0280-s001
      start: 0
      end: 38
    - id: hb-c07-u0280-s002
      start: 39
      end: 124
    - id: hb-c07-u0280-s003
      start: 125
      end: 193
    - id: hb-c07-u0280-s004
      start: 194
      end: 240
    - id: hb-c07-u0280-s005
      start: 241
      end: 302
    - id: hb-c07-u0280-s006
      start: 303
      end: 377
  - type: paragraph
    id: hb-c07-u0281
    text: Om du får lön drar arbetsgivaren av skatten från lönen och betalar den direkt till skattemyndigheten.
      För att kunna göra det behöver arbetsgivaren ett skattekort av dig. Skattekortet är ett dokument
      som anger din skatteprocent. Skatteförvaltningen räknar efter varje år om du har betalat tillräckligt
      med skatt på dina inkomster. Om du har betalat för mycket skatt får du skatteåterbäring. Om du har
      betalat för lite skatt ska du betala den återstående delen som kvarskatt.
    sentences:
    - id: hb-c07-u0281-s001
      start: 0
      end: 101
    - id: hb-c07-u0281-s002
      start: 102
      end: 169
    - id: hb-c07-u0281-s003
      start: 170
      end: 227
    - id: hb-c07-u0281-s004
      start: 228
      end: 329
    - id: hb-c07-u0281-s005
      start: 330
      end: 389
    - id: hb-c07-u0281-s006
      start: 390
      end: 473
  - type: paragraph
    id: hb-c07-u0282
    text: Kontrollera i lönespecifikationen och skattedeklarationen att arbetsgivaren har dragit av skatten
      från din lön och betalat den till skattemyndigheten. Spara lönekvittona.
    sentences:
    - id: hb-c07-u0282-s001
      start: 0
      end: 150
    - id: hb-c07-u0282-s002
      start: 151
      end: 170
  - type: paragraph
    id: hb-c07-u0283
    text: Förutom skatterna drar arbetsgivaren av från din lön obligatoriska försäkringspremier till exempel
      för arbetslöshet och insjuknande.
    sentences:
    - id: hb-c07-u0283-s001
      start: 0
      end: 132
  - type: paragraph
    id: hb-c07-u0284
    text: Om du vistas i Finland i mer än sex månader, ska du i allmänhet betala skatt på alla dina inkomster
      till Finland. Detta gäller även de inkomster som du får från utlandet. Du ska i allmänhet också
      betala de obligatoriska försäkringspremierna till Finland. Om du har en finländsk arbetsgivare bestäms
      din skatteprocent enligt inkomsterna för hela året. Skatteprocenten är desto större ju mer du har
      löneinkomster. Du behöver en finländsk personbeteckning och ett finländskt skattekort.
    sentences:
    - id: hb-c07-u0284-s001
      start: 0
      end: 113
    - id: hb-c07-u0284-s002
      start: 114
      end: 170
    - id: hb-c07-u0284-s003
      start: 171
      end: 254
    - id: hb-c07-u0284-s004
      start: 255
      end: 350
    - id: hb-c07-u0284-s005
      start: 351
      end: 411
    - id: hb-c07-u0284-s006
      start: 412
      end: 483
  - type: paragraph
    id: hb-c07-u0285
    text: Om du vistas i Finland i högst sex månader och din arbetsgivare är ett utländskt företag, behöver
      du i allmänhet inte betala skatt till Finland. Om din arbetsgivare dock är finländare eller om din
      utländska arbetsgivare har en arbetsplats i Finland, betalar du skatt i Finland. Du kan söka progressiv
      beskattning, om du bor i ett land som hör till Europeiska ekonomiska samarbetsområdet eller i ett
      land med vilket Finland har ett skatteavtal. I annat fall betalar du en källskatt på 35 procent
      på lönen och du behöver ett källskattekort.
    sentences:
    - id: hb-c07-u0285-s001
      start: 0
      end: 144
    - id: hb-c07-u0285-s002
      start: 145
      end: 277
    - id: hb-c07-u0285-s003
      start: 278
      end: 443
    - id: hb-c07-u0285-s004
      start: 444
      end: 538
  - type: paragraph
    id: hb-c07-u0286
    text: Om du har sjukförsäkring i Finland förordnar Skatteförvaltningen dig arbetstagarens sjukförsäkringsavgift.
      Du betalar dock inte sjukförsäkringsavgift i Finland om du har ett A1-intyg eller liknande intyg
      med vilket du påvisar att du är försäkrad i det land där du bor.
    sentences:
    - id: hb-c07-u0286-s001
      start: 0
      end: 106
    - id: hb-c07-u0286-s002
      start: 107
      end: 268
  - type: paragraph
    id: hb-c07-u0287
    text: I skattedeklarationen ser du uppgifterna om dina inkomster, skatter och avdrag under det föregående
      året. Kontrollera skattedeklarationen och komplettera och rätta till uppgifterna i webbtjänsten
      MinSkatt. Om uppgifterna är korrekta behöver du inte göra något.
    sentences:
    - id: hb-c07-u0287-s001
      start: 0
      end: 105
    - id: hb-c07-u0287-s002
      start: 106
      end: 205
    - id: hb-c07-u0287-s003
      start: 206
      end: 260
  - type: paragraph
    id: hb-c07-u0288
    text: Du kan i beskattningen få avdrag som minskar beloppet på skatt som betalas. Skatteförvaltningen
      gör en del avdrag automatiskt, men en del måste du själv anmäla. Du kan anmäla avdragen på ditt
      skattekort eller i din skattedeklaration.
    sentences:
    - id: hb-c07-u0288-s001
      start: 0
      end: 75
    - id: hb-c07-u0288-s002
      start: 76
      end: 160
    - id: hb-c07-u0288-s003
      start: 161
      end: 233
  - type: paragraph
    id: hb-c07-u0289
    text: Utfallet av din beskattning för föregående året ser du på ditt beskattningsbeslut. Om du gör
      ändringar i din på förhand ifyllda skattedeklaration eller Skatteförvaltningen får från annanstans
      (till exempel av din arbetsgivare) uppgifter som påverkar din beskattning, får du ett nytt beskattningsbeslut.
      I beskattningsbeslutet finns en beräkning på utfallet av din beskattning. Du kan behöva beskattningsbeslutet
      till exempel då du söker hyresbostad eller du förordnas dagvårdsavgifter.
    sentences:
    - id: hb-c07-u0289-s001
      start: 0
      end: 82
    - id: hb-c07-u0289-s002
      start: 83
      end: 302
    - id: hb-c07-u0289-s003
      start: 303
      end: 376
    - id: hb-c07-u0289-s004
      start: 377
      end: 485
  - type: paragraph
    id: hb-c07-u0290
    text: I beskattningsbeslutet ser du om du har betalat rätt mängd skatt. Om du har betalat för mycket
      skatt får du skatteåterbäring. Om du har betalat för lite i skatt blir du tvungen att betala kvarskatt.
    sentences:
    - id: hb-c07-u0290-s001
      start: 0
      end: 65
    - id: hb-c07-u0290-s002
      start: 66
      end: 125
    - id: hb-c07-u0290-s003
      start: 126
      end: 198
  - type: paragraph
    id: hb-c07-u0291
    text: Om du har betalat för lite skatt under året ska du betala den återstående delen som kvarskatt.
      I beskattningsbeslutet eller på MinSkatt ser du alla uppgifter du behöver när du betalar kvarskatt.
    sentences:
    - id: hb-c07-u0291-s001
      start: 0
      end: 94
    - id: hb-c07-u0291-s002
      start: 95
      end: 194
  - type: paragraph
    id: hb-c07-u0292
    text: Du behöver ett skattenummer om du arbetar på en byggarbetsplats eller ett varvsområde i Finland.
      Med hjälp av skattenumret kontrolleras att alla arbetstagare finns i Skatteförvaltningens register.
      Skattenumret ska framgå av den fotoförsedda namnskylt som du får av din arbetsgivare. Du får inte
      arbeta på en byggarbetsplats eller ett varvsområde utan namnskylt.
    sentences:
    - id: hb-c07-u0292-s001
      start: 0
      end: 96
    - id: hb-c07-u0292-s002
      start: 97
      end: 196
    - id: hb-c07-u0292-s003
      start: 197
      end: 282
    - id: hb-c07-u0292-s004
      start: 283
      end: 361
