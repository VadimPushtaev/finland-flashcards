schema_version: 1
id: hb-c11
language: sv
title: Boende, vardag och miljö
sections:
- id: hb-c11-boendeformer
  title: Boendeformer
  blocks:
  - type: paragraph
    id: hb-c11-u0001
    text: Det är lätt att hitta annonser om hyresbostäder på internet. Bostäder hyrs ut av bostadsbolag,
      som ägs av städer och kommuner samt olika företag. Även privata hyresvärdar söker hyresgäster. Privata
      hyresvärdar är människor som äger bostäder.
    sentences:
    - id: hb-c11-u0001-s001
      start: 0
      end: 60
    - id: hb-c11-u0001-s002
      start: 61
      end: 145
    - id: hb-c11-u0001-s003
      start: 146
      end: 189
    - id: hb-c11-u0001-s004
      start: 190
      end: 241
  - type: paragraph
    id: hb-c11-u0002
    text: Hyresbostäderna i ett bostadsbolag som ägs av en stad eller en kommun är i allmänhet billigare
      än bostäder som ägs av en privatperson eller ett företag. Det kan ändå finnas många sökande till
      stadens eller kommunens bostäder. Man kan göra en bostadsansökan på internet.
    sentences:
    - id: hb-c11-u0002-s001
      start: 0
      end: 152
    - id: hb-c11-u0002-s002
      start: 153
      end: 225
    - id: hb-c11-u0002-s003
      start: 226
      end: 269
  - type: paragraph
    id: hb-c11-u0003
    text: Vanligtvis ingår hyresgästen ett hyresavtal direkt med bostadens ägare, det vill säga ett företag,
      en privat hyresvärd eller ett kommunalt bostadsbolag. Hen är då bostadens huvudhyresgäst. Ibland
      kan huvudhyresgästen låta en underhyresgäst flytta in i bostaden. Då får en annan person bo i till
      exempel ett av rummen i samma bostad som huvudhyresgästen. Underhyresgästen ingår ett skriftligt
      hyresavtal med huvudhyresgästen, inte med bostadens ägare.
    sentences:
    - id: hb-c11-u0003-s001
      start: 0
      end: 152
    - id: hb-c11-u0003-s002
      start: 153
      end: 188
    - id: hb-c11-u0003-s003
      start: 189
      end: 261
    - id: hb-c11-u0003-s004
      start: 262
      end: 353
    - id: hb-c11-u0003-s005
      start: 354
      end: 450
  - type: paragraph
    id: hb-c11-u0004
    text: Huvudhyresgästen ansvarar för bostaden och betalningen av hyran. Om huvudhyresgästen inte själv
      bor i bostaden, utan hyr ut hela bostaden till någon annan, är det fråga om vidareuthyrning. Uthyraren,
      eller hyresvärden, ska alltid informeras om vidareuthyrning och hen kan av grundad anledning också
      förbjuda vidareuthyrning.
    sentences:
    - id: hb-c11-u0004-s001
      start: 0
      end: 64
    - id: hb-c11-u0004-s002
      start: 65
      end: 188
    - id: hb-c11-u0004-s003
      start: 189
      end: 324
  - type: paragraph
    id: hb-c11-u0005
    text: Ägarboende betyder för det mesta att den boende äger antingen ett egnahemshus eller en bostadsaktie.
      När man äger ett egnahemshus är man själv ansvarig för alla reparationer, skatter och andra avgifter
      som är förknippade med huset och att bo i det.
    sentences:
    - id: hb-c11-u0005-s001
      start: 0
      end: 100
    - id: hb-c11-u0005-s002
      start: 101
      end: 248
  - type: paragraph
    id: hb-c11-u0006
    text: Om man äger en bostad i ett höghus eller ett radhus är det fråga om en bostadsaktie. I sådana
      fall äger personen inte själva bostaden, utan aktier i det husbolag som förvaltar huset. I husbolaget
      bestämmer aktieägarna tillsammans om vilka renoveringar som ska göras i huset och om underhållet
      av det. Dessutom betalar aktieägarna varje månad ett vederlag till husbolaget som täcker bland annat
      uppvärmningen av bostaden, avfallshanteringen och servicebolagets tjänster.
    sentences:
    - id: hb-c11-u0006-s001
      start: 0
      end: 84
    - id: hb-c11-u0006-s002
      start: 85
      end: 182
    - id: hb-c11-u0006-s003
      start: 183
      end: 300
    - id: hb-c11-u0006-s004
      start: 301
      end: 469
  - type: paragraph
    id: hb-c11-u0007
    text: Tomten som ett hus står på kan ägas av husets ägare eller av bostadsaktiebolaget. Tomten kan
      också vara en arrendetomt, som ägs av till exempel kommunen. De boende i ett hus som ägs av ett
      bostadsaktiebolag på en arrendetomt betalar hyra för tomten som en del av vederlaget.
    sentences:
    - id: hb-c11-u0007-s001
      start: 0
      end: 81
    - id: hb-c11-u0007-s002
      start: 82
      end: 153
    - id: hb-c11-u0007-s003
      start: 154
      end: 274
  - type: paragraph
    id: hb-c11-u0008
    text: En bostadsrättsbostad är en bostad för vilken du först betalar en bostadsrättsavgift. Dessutom
      betalar du varje månad en viss summa för boendet, ett bruksvederlag. Bostadsrättsavgiften är cirka
      15 procent av bostadens pris. Bruksvederlagets storlek beror på bostaden och orten.
    sentences:
    - id: hb-c11-u0008-s001
      start: 0
      end: 85
    - id: hb-c11-u0008-s002
      start: 86
      end: 163
    - id: hb-c11-u0008-s003
      start: 164
      end: 223
    - id: hb-c11-u0008-s004
      start: 224
      end: 277
  - type: paragraph
    id: hb-c11-u0009
    text: Om bostadsrättsbostaden inte är byggd med statligt stöd kan husets ägare själv välja de boende.
      Om staten har betalat understöd för byggandet av bostaden, finns det olika kriterier som tillämpas
      på de boende, till exempel ålder och förmögenhet.
    sentences:
    - id: hb-c11-u0009-s001
      start: 0
      end: 95
    - id: hb-c11-u0009-s002
      start: 96
      end: 244
  - type: paragraph
    id: hb-c11-u0010
    text: Med delägarbostad avses en bostad där du först köper endast en del av bostaden och hyr sedan
      bostaden som du bor i. Senare kan du köpa bostaden.
    sentences:
    - id: hb-c11-u0010-s001
      start: 0
      end: 115
    - id: hb-c11-u0010-s002
      start: 116
      end: 144
  - type: paragraph
    id: hb-c11-u0011
    text: När du flyttar in i en delägarbostad, betalar du först ungefär 10–20 procent av bostadens pris.
      Därefter hyr du bostaden som du bor i. Hyrestiden är vanligtvis kring 5–12 år. Du kan samtidigt
      köpa fler andelar av bostaden, om du har kommit överens om detta med byggherren.
    sentences:
    - id: hb-c11-u0011-s001
      start: 0
      end: 95
    - id: hb-c11-u0011-s002
      start: 96
      end: 134
    - id: hb-c11-u0011-s003
      start: 135
      end: 174
    - id: hb-c11-u0011-s004
      start: 175
      end: 272
  - type: paragraph
    id: hb-c11-u0012
    text: Efter hyrestiden köper du bostaden. Då äger du en vanlig ägarbostad i ett bostadsaktiebolag.
    sentences:
    - id: hb-c11-u0012-s001
      start: 0
      end: 35
    - id: hb-c11-u0012-s002
      start: 36
      end: 92
  - type: paragraph
    id: hb-c11-u0013
    text: Om du är studerande kan du söka hyresbostäder som är speciellt avsedda för studerande. Studentbostäder
      har ofta lägre hyra än vanliga bostäder.
    sentences:
    - id: hb-c11-u0013-s001
      start: 0
      end: 86
    - id: hb-c11-u0013-s002
      start: 87
      end: 143
  - type: paragraph
    id: hb-c11-u0014
    text: Studentbostäder hyrs ut av studentbostadsstiftelser, universitetens studentkårer, nationer och
      vissa andra stiftelser. Dessutom har vissa läroanstalter egna studenthem. Fråga på din studieort
      var du kan söka en studentbostad.
    sentences:
    - id: hb-c11-u0014-s001
      start: 0
      end: 118
    - id: hb-c11-u0014-s002
      start: 119
      end: 168
    - id: hb-c11-u0014-s003
      start: 169
      end: 225
  - type: paragraph
    id: hb-c11-u0015
    text: Om du får en studentbostad kan du vanligen bo i den under hela studietiden. Du måste dock studera
      på heltid och framskrida i dina studier. Hyresvärden kan säga upp hyresavtalet om du inte klarar
      tillräckligt många kurser.
    sentences:
    - id: hb-c11-u0015-s001
      start: 0
      end: 75
    - id: hb-c11-u0015-s002
      start: 76
      end: 138
    - id: hb-c11-u0015-s003
      start: 139
      end: 221
  - type: paragraph
    id: hb-c11-u0016
    text: I Finland ordnas stödboende (tukiasuminen) och serviceboende (palveluasuminen) för dem som behöver
      stöd för att kunna bo självständigt.
    sentences:
    - id: hb-c11-u0016-s001
      start: 0
      end: 135
  - type: paragraph
    id: hb-c11-u0017
    text: Stöd- och serviceboende kan ordnas för
    sentences:
    - id: hb-c11-u0017-s001
      start: 0
      end: 38
  - id: hb-c11-u0019
    type: list
    ordered: false
    items:
    - id: hb-c11-u0018
      text: åldringar
      sentences:
      - id: hb-c11-u0018-s001
        start: 0
        end: 9
    - id: hb-c11-u0020
      text: handikappade
      sentences:
      - id: hb-c11-u0020-s001
        start: 0
        end: 12
    - id: hb-c11-u0021
      text: utvecklingsstörda
      sentences:
      - id: hb-c11-u0021-s001
        start: 0
        end: 17
    - id: hb-c11-u0022
      text: människor som återhämtar sig från problem med den mentala hälsan och missbrukarproblem.
      sentences:
      - id: hb-c11-u0022-s001
        start: 0
        end: 87
  - type: paragraph
    id: hb-c11-u0023
    text: Stöd- och serviceboende tillhandahålls av välfärdsområdena, organisationer och privata företagare.
    sentences:
    - id: hb-c11-u0023-s001
      start: 0
      end: 98
  - type: paragraph
    id: hb-c11-u0024
    text: Den som bor i en stödbostad klarar nästan självständigt av de dagliga bestyren. Stödets omfattning
      beror på den boendes behov. En stödbostad kan antingen vara kundens egen ägarbostad, en hyresbostad
      eller någon annan bostadsform.
    sentences:
    - id: hb-c11-u0024-s001
      start: 0
      end: 79
    - id: hb-c11-u0024-s002
      start: 80
      end: 126
    - id: hb-c11-u0024-s003
      start: 127
      end: 229
  - type: paragraph
    id: hb-c11-u0025
    text: Hur länge man bor i stödbostad beror på kundens livssituation och behov. Avsikten är att kunderna
      under sin tid i en stödbostad kommer till rätta med sitt liv i den mån att de kan övergå till självständigt
      boende.
    sentences:
    - id: hb-c11-u0025-s001
      start: 0
      end: 72
    - id: hb-c11-u0025-s002
      start: 73
      end: 213
- id: hb-c11-hyresavtal
  title: Hyresavtal och boendekostnader
  blocks:
  - type: paragraph
    id: hb-c11-u0026
    text: När en person flyttar in i en hyresbostad ska hen ingå ett skriftligt hyresavtal om bostaden
      med hyresvärden. Hyresavtalet kan vara tidsbegränsat eller gälla tills vidare.
    sentences:
    - id: hb-c11-u0026-s001
      start: 0
      end: 109
    - id: hb-c11-u0026-s002
      start: 110
      end: 171
  - type: paragraph
    id: hb-c11-u0027
    text: Ett tidsbegränsat hyresavtal gäller för en viss tid, till exempel ett år. Det upphör automatiskt
      och kan vanligtvis inte sägas upp mitt under avtalsperioden. Det kan anges i avtalet att avtalet
      efter den bestämda tidsperioden fortsätter att gälla tills vidare.
    sentences:
    - id: hb-c11-u0027-s001
      start: 0
      end: 73
    - id: hb-c11-u0027-s002
      start: 74
      end: 157
    - id: hb-c11-u0027-s003
      start: 158
      end: 260
  - type: paragraph
    id: hb-c11-u0028
    text: Ett hyresavtal som gäller tills vidare fortsätter tills den boende eller hyresvärden säger upp
      det. Om den boende säger upp avtalet är uppsägningstiden en månad. Om bostadens ägare säger upp
      avtalet är uppsägningstiden 3–6 månader. Ofta anges det i tillsvidareavtal att avtalet kan sägas
      upp tidigast efter en viss tid, till exempel tolv månader.
    sentences:
    - id: hb-c11-u0028-s001
      start: 0
      end: 99
    - id: hb-c11-u0028-s002
      start: 100
      end: 161
    - id: hb-c11-u0028-s003
      start: 162
      end: 231
    - id: hb-c11-u0028-s004
      start: 232
      end: 346
  - type: paragraph
    id: hb-c11-u0029
    text: Uppsägningstid betyder den tidsperiod som hyresgästen ännu får bo i bostaden efter att hyresavtalet
      har sagts upp. Hyresgästen måste betala hyra för uppsägningstiden. Meddelandet om uppsägning ska
      alltid göras skriftligt, till exempel per e-post. Vid en eventuell tvist måste man kunna bevisa
      att meddelandet har levererats. Därför är det bra att begära ett kvitto på e-postmeddelandet som
      bekräftar att det har blivit läst.
    sentences:
    - id: hb-c11-u0029-s001
      start: 0
      end: 114
    - id: hb-c11-u0029-s002
      start: 115
      end: 166
    - id: hb-c11-u0029-s003
      start: 167
      end: 246
    - id: hb-c11-u0029-s004
      start: 247
      end: 324
    - id: hb-c11-u0029-s005
      start: 325
      end: 424
  - type: paragraph
    id: hb-c11-u0030
    text: Det är bra att veta att uppsägningstiden oftast börjar räknas från slutet av den kalendermånad
      då avtalet sägs upp. Det betyder att om hyresgästen säger upp hyresavtalet under mars månad, måste
      hen betala hyra ännu för april. Så här är det oavsett om meddelandet om uppsägning skickas i början
      eller slutet av månaden.
    sentences:
    - id: hb-c11-u0030-s001
      start: 0
      end: 115
    - id: hb-c11-u0030-s002
      start: 116
      end: 225
    - id: hb-c11-u0030-s003
      start: 226
      end: 318
  - type: paragraph
    id: hb-c11-u0031
    text: 'Det är bra att använda en standardmall för hyresavtal. En sådan är lätt att hitta på internet
      och innehåller åtminstone följande:'
    sentences:
    - id: hb-c11-u0031-s001
      start: 0
      end: 54
    - id: hb-c11-u0031-s002
      start: 55
      end: 129
  - id: hb-c11-u0033
    type: list
    ordered: false
    items:
    - id: hb-c11-u0032
      text: personuppgifter och adresser för bostadens ägare och hyresgästen
      sentences:
      - id: hb-c11-u0032-s001
        start: 0
        end: 64
    - id: hb-c11-u0034
      text: bostadens adress, typ, storlek, skick och utrustning (det vill säga vilka saker som finns
        i bostaden)
      sentences:
      - id: hb-c11-u0034-s001
        start: 0
        end: 101
    - id: hb-c11-u0035
      text: när hyresavtalet börjar gälla och när det upphör
      sentences:
      - id: hb-c11-u0035-s001
        start: 0
        end: 48
    - id: hb-c11-u0036
      text: beloppet av hyran och garantihyran i euro
      sentences:
      - id: hb-c11-u0036-s001
        start: 0
        end: 41
    - id: hb-c11-u0037
      text: när hyran ska betalas och till vilket bankkonto
      sentences:
      - id: hb-c11-u0037-s001
        start: 0
        end: 47
    - id: hb-c11-u0038
      text: vad som ingår i hyran och vad man måste betala extra för (till exempel vatten, el eller bilplats)
      sentences:
      - id: hb-c11-u0038-s001
        start: 0
        end: 97
    - id: hb-c11-u0039
      text: villkoren för hyreshöjning, det vill säga på vilka villkor bostadens ägare kan höja hyran
        en gång per år.
      sentences:
      - id: hb-c11-u0039-s001
        start: 0
        end: 105
  - type: paragraph
    id: hb-c11-u0040
    text: I allmänhet måste man betala en hyresgaranti för bostaden innan man flyttar in. Hyresgaranti
      betyder att den som hyr bostaden betalar extra pengar i förväg till hyresvärden. För bostäder som
      ägs av privata hyresvärdar motsvarar garantin i allmänhet ett par månaders hyra. Hyresgarantin får
      inte vara större än tre månaders hyra. Företag som äger många bostäder kräver ofta en mindre garanti.
    sentences:
    - id: hb-c11-u0040-s001
      start: 0
      end: 79
    - id: hb-c11-u0040-s002
      start: 80
      end: 173
    - id: hb-c11-u0040-s003
      start: 174
      end: 271
    - id: hb-c11-u0040-s004
      start: 272
      end: 328
    - id: hb-c11-u0040-s005
      start: 329
      end: 391
  - type: paragraph
    id: hb-c11-u0041
    text: Garantin betalas tillbaka när man flyttar ut, om bostaden är i bra skick och den boende har
      betalat hyrorna i tid. Om den boende inte betalar sin hyra eller om det krävs reparationer i bostaden,
      kan hyresvärden behålla en del av eller hela garantin. Hyresvärden kan inte behålla garantin för
      sådana spår efter den boende som beror på normalt slitage.
    sentences:
    - id: hb-c11-u0041-s001
      start: 0
      end: 114
    - id: hb-c11-u0041-s002
      start: 115
      end: 249
    - id: hb-c11-u0041-s003
      start: 250
      end: 350
  - type: paragraph
    id: hb-c11-u0042
    text: Om hyresgästen avsiktligen eller på grund av ovarsamt beteende har orsakat skador i bostaden
      som det kostar mer att reparera än vad garantin täcker, kan hyresvärden kräva extra ersättning.
    sentences:
    - id: hb-c11-u0042-s001
      start: 0
      end: 188
  - type: paragraph
    id: hb-c11-u0043
    text: Hyresgarantin kan inte användas för att betala hyran för de sista månaderna.
    sentences:
    - id: hb-c11-u0043-s001
      start: 0
      end: 76
  - type: paragraph
    id: hb-c11-u0044
    text: Ofta ska du betala en vattenavgift för bostaden. Betala vattenavgiften till hyresvärdens eller
      husbolagets konto på samma gång som du betalar hyra. Beloppet på vattenavgiften beror ofta på det
      antal personer som bor i bostaden. Om det finns en vattenmätare i bostaden, fastställs vattenavgiften
      enligt vattenkonsumtionen.
    sentences:
    - id: hb-c11-u0044-s001
      start: 0
      end: 48
    - id: hb-c11-u0044-s002
      start: 49
      end: 147
    - id: hb-c11-u0044-s003
      start: 148
      end: 227
    - id: hb-c11-u0044-s004
      start: 228
      end: 321
  - type: paragraph
    id: hb-c11-u0045
    text: Ofta ska du själv ingå ett elavtal. Du ingår ett elavtal genom att ringa ett elbolag och uppge
      ditt namn och din nya adress. Om du vill hitta det förmånligaste priset, kan du jämföra olika elbolags
      priser.
    sentences:
    - id: hb-c11-u0045-s001
      start: 0
      end: 35
    - id: hb-c11-u0045-s002
      start: 36
      end: 124
    - id: hb-c11-u0045-s003
      start: 125
      end: 205
  - type: paragraph
    id: hb-c11-u0046
    text: Om bostaden har centralvärme, ingår uppvärmningen i allmänhet i hyran. Om bostaden har oljevärme
      eller elvärme, ska avgiften ibland betalas separat.
    sentences:
    - id: hb-c11-u0046-s001
      start: 0
      end: 70
    - id: hb-c11-u0046-s002
      start: 71
      end: 148
  - type: paragraph
    id: hb-c11-u0047
    text: Det kostar i allmänhet att använda husbolagets bastu, tvättstuga och bilplatser. I allmänhet
      ska dessa avgifter betalas direkt till husbolaget.
    sentences:
    - id: hb-c11-u0047-s001
      start: 0
      end: 80
    - id: hb-c11-u0047-s002
      start: 81
      end: 143
  - type: paragraph
    id: hb-c11-u0048
    text: Om du bor på hyra i ett egnahemshus, ska du ofta betala för uppvärmningen och avfallshanteringen.
    sentences:
    - id: hb-c11-u0048-s001
      start: 0
      end: 97
  - type: paragraph
    id: hb-c11-u0049
    text: I Finland bor många människor i hyresbostäder. Det som är bra med en hyresbostad är att det
      är lätt att byta bostad, eftersom du inte behöver sälja och köpa bostaden. Men å andra sidan kan
      hyresvärden bestämma sig för att säga upp hyresavtalet, om han eller hon har en godtagbar anledning.
      Då måste du flytta från hyresbostaden, även om du inte vill det.
    sentences:
    - id: hb-c11-u0049-s001
      start: 0
      end: 46
    - id: hb-c11-u0049-s002
      start: 47
      end: 166
    - id: hb-c11-u0049-s003
      start: 167
      end: 289
    - id: hb-c11-u0049-s004
      start: 290
      end: 354
- id: hb-c11-hyresgast
  title: Hyresgästens rättigheter och skyldigheter
  blocks:
  - type: paragraph
    id: hb-c11-u0050
    text: Du är skyldig
    sentences:
    - id: hb-c11-u0050-s001
      start: 0
      end: 13
  - id: hb-c11-u0052
    type: list
    ordered: false
    items:
    - id: hb-c11-u0051
      text: Att följa ordningsreglerna i ditt bostadsaktiebolag om du bor i ett höghus eller ett radhus.
        I ordningsreglerna anges vanligtvis till exempel tiderna för när det ska vara tyst i huset. Ofta
        innehåller de även anvisningar om användningen av gemensamma utrymmen i huset. I ett höghus hittar
        du ordningsreglerna vanligtvis i trapphuset nära entrédörren.
      sentences:
      - id: hb-c11-u0051-s001
        start: 0
        end: 92
      - id: hb-c11-u0051-s002
        start: 93
        end: 184
      - id: hb-c11-u0051-s003
        start: 185
        end: 268
      - id: hb-c11-u0051-s004
        start: 269
        end: 350
    - id: hb-c11-u0053
      text: Att se till att även dina gäster följer ordningsreglerna.
      sentences:
      - id: hb-c11-u0053-s001
        start: 0
        end: 57
    - id: hb-c11-u0054
      text: Att enbart använda bostaden för det avsedda ändamålet. Om bostaden är avsedd att användas
        för boende, kan du inte bo på ett annat ställe och använda bostaden som lokal.
      sentences:
      - id: hb-c11-u0054-s001
        start: 0
        end: 54
      - id: hb-c11-u0054-s002
        start: 55
        end: 168
  - type: paragraph
    id: hb-c11-u0055
    text: Du har rätt
    sentences:
    - id: hb-c11-u0055-s001
      start: 0
      end: 11
  - id: hb-c11-u0057
    type: list
    ordered: false
    items:
    - id: hb-c11-u0056
      text: Att leva ett normalt liv i ditt hem. Bostadsaktiebolaget kan inte utfärda sådana ordningsregler
        som står i strid med lagen eller begränsar ett normalt liv i alltför stor omfattning.
      sentences:
      - id: hb-c11-u0056-s001
        start: 0
        end: 36
      - id: hb-c11-u0056-s002
        start: 37
        end: 181
    - id: hb-c11-u0058
      text: Till hemfrid. Dina grannar får inte störa din hemfrid till exempel genom att föra oljud mitt
        i natten. Om en granne ofta bryter mot ordningsreglerna på ett allvarligt sätt, ska du först ta
        upp saken med grannen. Om detta inte hjälper, kan du kontakta disponenten eller hyresvärden. Hemfrid
        innebär också att du i regel själv får bestämma vem som har tillträde till ditt hem.
      sentences:
      - id: hb-c11-u0058-s001
        start: 0
        end: 13
      - id: hb-c11-u0058-s002
        start: 14
        end: 102
      - id: hb-c11-u0058-s003
        start: 103
        end: 211
      - id: hb-c11-u0058-s004
        start: 212
        end: 281
      - id: hb-c11-u0058-s005
        start: 282
        end: 374
  - type: paragraph
    id: hb-c11-u0059
    text: Du är skyldig
    sentences:
    - id: hb-c11-u0059-s001
      start: 0
      end: 13
  - id: hb-c11-u0061
    type: list
    ordered: false
    items:
    - id: hb-c11-u0060
      text: Att betala hyran i tid. Hyresbeloppet anges i hyresavtalet. Hyresvärden kan höja hyran i enlighet
        med vad som anges i hyresavtalet.
      sentences:
      - id: hb-c11-u0060-s001
        start: 0
        end: 23
      - id: hb-c11-u0060-s002
        start: 24
        end: 59
      - id: hb-c11-u0060-s003
        start: 60
        end: 131
    - id: hb-c11-u0062
      text: Att se till att hyresbostaden hålls i ett gott skick.
      sentences:
      - id: hb-c11-u0062-s001
        start: 0
        end: 53
    - id: hb-c11-u0063
      text: Att följa villkoren i hyresavtalet. Om det till exempel anges i hyresavtalet att det är förbjudet
        att röka i bostaden, kan du inte röka i ditt hem. Ta om du har husdjur reda på om du har rätt
        att ha sådana i bostaden. Om hyresavtalet kräver att du har en hemförsäkring, måste du teckna
        en sådan. Det är bra att teckna en hemförsäkring även om detta inte krävs i hyresavtalet.
      sentences:
      - id: hb-c11-u0063-s001
        start: 0
        end: 35
      - id: hb-c11-u0063-s002
        start: 36
        end: 147
      - id: hb-c11-u0063-s003
        start: 148
        end: 217
      - id: hb-c11-u0063-s004
        start: 218
        end: 295
      - id: hb-c11-u0063-s005
        start: 296
        end: 375
    - id: hb-c11-u0064
      text: Att fråga om tillstånd hos hyresvärden om du vill göra ändringar i bostaden, till exempel
        måla en vägg. Utan tillstånd får du inte göra några ändringar, även om du skulle bekosta renoveringen
        själv. Begär tillståndet skriftligt.
      sentences:
      - id: hb-c11-u0064-s001
        start: 0
        end: 103
      - id: hb-c11-u0064-s002
        start: 104
        end: 198
      - id: hb-c11-u0064-s003
        start: 199
        end: 228
    - id: hb-c11-u0065
      text: Att ersätta hyresvärden för skador som du åsamkar bostaden.
      sentences:
      - id: hb-c11-u0065-s001
        start: 0
        end: 59
    - id: hb-c11-u0066
      text: Att meddela hyresvärden om du upptäcker sådana fel i bostaden som hyresvärden ansvarar för.
        Hyresvärden ansvarar till exempel för bostadens fasta inredning och ytmaterial.
      sentences:
      - id: hb-c11-u0066-s001
        start: 0
        end: 91
      - id: hb-c11-u0066-s002
        start: 92
        end: 171
    - id: hb-c11-u0067
      text: Att meddela eventuella fel till fastighetsskötseln, till exempel en läckande kran.
      sentences:
      - id: hb-c11-u0067-s001
        start: 0
        end: 82
  - type: paragraph
    id: hb-c11-u0068
    text: Du har rätt
    sentences:
    - id: hb-c11-u0068-s001
      start: 0
      end: 11
  - id: hb-c11-u0070
    type: list
    ordered: false
    items:
    - id: hb-c11-u0069
      text: Att bo i hyreslägenheten enligt vad som anges i hyresavtalet. Hyresvärden får endast beträda
        bostaden i vissa undantagsfall, till exempel för att övervaka reparationer i bostaden eller visa
        bostaden för köpare. Även då måste hen försöka i förväg komma överens om detta med dig.
      sentences:
      - id: hb-c11-u0069-s001
        start: 0
        end: 61
      - id: hb-c11-u0069-s002
        start: 62
        end: 210
      - id: hb-c11-u0069-s003
        start: 211
        end: 277
    - id: hb-c11-u0071
      text: Att få ett skriftligt meddelande i förväg om hyran höjs. I meddelandet ska det stå hur mycket
        och när hyran kommer att höjas och vad som är grunden till höjningen. Om villkoren och tidpunkten
        för hyreshöjningen står i hyresavtalet, kan hyresvärden höja hyran på grundval av avtalet utan
        separat meddelande.
      sentences:
      - id: hb-c11-u0071-s001
        start: 0
        end: 56
      - id: hb-c11-u0071-s002
        start: 57
        end: 163
      - id: hb-c11-u0071-s003
        start: 164
        end: 306
    - id: hb-c11-u0072
      text: Till en uppsägningstid enligt lag.
      sentences:
      - id: hb-c11-u0072-s001
        start: 0
        end: 34
    - id: hb-c11-u0073
      text: Att häva hyresavtalet omedelbart om det är skadligt för hälsan att bo i bostaden.
      sentences:
      - id: hb-c11-u0073-s001
        start: 0
        end: 81
    - id: hb-c11-u0074
      text: Att hyra ut en del av bostaden till en annan person, om detta inte medför olägenhet för hyresvärden.
      sentences:
      - id: hb-c11-u0074-s001
        start: 0
        end: 100
    - id: hb-c11-u0075
      text: Att få ett förhandsmeddelande om reparationer. Små reparationer ska meddelas 14 dagar i förväg
        och stora reparationer sex månader i förväg. Brådskande reparationer kan dock göras utan ett meddelande.
        Om det är svårt eller omöjligt att bo i bostaden under reparationerna, har du rätt att säga upp
        hyresavtalet eller får nedsatt hyra. Detta måste du emellertid alltid komma överens om med hyresvärden.
      sentences:
      - id: hb-c11-u0075-s001
        start: 0
        end: 46
      - id: hb-c11-u0075-s002
        start: 47
        end: 139
      - id: hb-c11-u0075-s003
        start: 140
        end: 199
      - id: hb-c11-u0075-s004
        start: 200
        end: 332
      - id: hb-c11-u0075-s005
        start: 333
        end: 399
  - type: paragraph
    id: hb-c11-u0076
    text: Det är en god idé för hyresgästen att besöka bostaden tillsammans med hyresvärden före flytten.
      Det är bra att anteckna och fotografera vilka fel som finns eller vilka reparationer som behövs
      i bostaden. Då blir hyresgästen inte tvungen att betala för gamla fel när hen flyttar ut från bostaden.
    sentences:
    - id: hb-c11-u0076-s001
      start: 0
      end: 95
    - id: hb-c11-u0076-s002
      start: 96
      end: 203
    - id: hb-c11-u0076-s003
      start: 204
      end: 295
  - type: paragraph
    id: hb-c11-u0077
    text: Hyresvärden eller husbolaget ska alltid utan dröjsmål informeras om skadedjur som upptäcks i
      en bostad eller byggnad. Skadedjur är till exempel vägglöss, möss och råttor. Skadedjur sprider
      sig lätt mellan bostäder. Därför är det viktigt att de bekämpas samtidigt i alla bostäder.
    sentences:
    - id: hb-c11-u0077-s001
      start: 0
      end: 117
    - id: hb-c11-u0077-s002
      start: 118
      end: 170
    - id: hb-c11-u0077-s003
      start: 171
      end: 214
    - id: hb-c11-u0077-s004
      start: 215
      end: 279
  - type: paragraph
    id: hb-c11-u0078
    text: Det är bra att alltid göra hyresavtalet skriftligt. Då är det tydligt vad man har kommit överens
      om, om det senare uppstår meningsskiljaktigheter med hyresvärden. Om det uppstår en tvist med hyresvärden
      kan Konsumentförbundets boenderådgivning ge råd. Även Konsumentrådgivningen erbjuder rådgivning.
    sentences:
    - id: hb-c11-u0078-s001
      start: 0
      end: 51
    - id: hb-c11-u0078-s002
      start: 52
      end: 162
    - id: hb-c11-u0078-s003
      start: 163
      end: 251
    - id: hb-c11-u0078-s004
      start: 252
      end: 299
- id: hb-c11-agarbostad
  title: Ägarbostad och bostadsbolag
  blocks:
  - type: paragraph
    id: hb-c11-u0079
    text: I ett bostadsaktiebolag har du skyldighet att
    sentences:
    - id: hb-c11-u0079-s001
      start: 0
      end: 45
  - id: hb-c11-u0081
    type: list
    ordered: false
    items:
    - id: hb-c11-u0080
      text: Betala bolagsvederlag och eventuellt även finansieringsvederlag för bostadsaktiebolagets lån
        till bostadsaktiebolaget. Vederlagen används till att sköta bostadsaktiebolaget, till exempel
        underhålla byggnaderna och gårdsområdet.
      sentences:
      - id: hb-c11-u0080-s001
        start: 0
        end: 118
      - id: hb-c11-u0080-s002
        start: 119
        end: 227
    - id: hb-c11-u0082
      text: Se till att din bostad hålls i gott skick.
      sentences:
      - id: hb-c11-u0082-s001
        start: 0
        end: 42
    - id: hb-c11-u0083
      text: I förväg meddela till bostadsaktiebolagets disponent eller styrelse om du ska göra en sådan
        ändring i din bostad som kan påverka husets bärande konstruktioner, vattenledningar, fuktisolering,
        elledningar eller ventilationssystem. Till exempel ska en badrumsrenovering alltid meddelas i
        förväg.
      sentences:
      - id: hb-c11-u0083-s001
        start: 0
        end: 229
      - id: hb-c11-u0083-s002
        start: 230
        end: 293
    - id: hb-c11-u0084
      text: Genomföra renoveringar på ett sådant sätt att bygganden inte tar skada. I Finland finns exakta
        bestämmelser till exempel om hurdant tätskikt ett badrum ska ha.
      sentences:
      - id: hb-c11-u0084-s001
        start: 0
        end: 71
      - id: hb-c11-u0084-s002
        start: 72
        end: 159
    - id: hb-c11-u0085
      text: Meddela bostadsaktiebolaget eller disponenten, i praktiken vanligtvis allra först fastighetsskötseln,
        om det finns ett sådant fel i din bostad vars åtgärdande åligger bostadsaktiebolaget.
      sentences:
      - id: hb-c11-u0085-s001
        start: 0
        end: 187
  - type: paragraph
    id: hb-c11-u0086
    text: 'I ett bostadsaktiebolag har du följande rättigheter:'
    sentences:
    - id: hb-c11-u0086-s001
      start: 0
      end: 52
  - id: hb-c11-u0088
    type: list
    ordered: false
    items:
    - id: hb-c11-u0087
      text: Förvalta den bostad vars aktier du äger. Du får göra ändringar i din bostad. Tänk på att renoveringen
        inte får medföra olägenhet till bostadsaktiebolaget eller de andra aktieägarna.
      sentences:
      - id: hb-c11-u0087-s001
        start: 0
        end: 40
      - id: hb-c11-u0087-s002
        start: 41
        end: 76
      - id: hb-c11-u0087-s003
        start: 77
        end: 181
    - id: hb-c11-u0089
      text: Hyra ut din bostad eller en del av den till en annan person.
      sentences:
      - id: hb-c11-u0089-s001
        start: 0
        end: 60
    - id: hb-c11-u0090
      text: Delta i stämmor och på dem påverka det som händer i bostadsaktiebolaget. På en stämma kan
        du rösta om olika saker och kräva att ett ärende tas upp för behandling på stämman. Bostadsaktiebolaget
        ska se till att husets konstruktioner, isolering, värmesystem, elledningar, vattenledningar och
        avlopp samt gårdsområden hålls i gott skick. På stämman fattas beslut om reparationer gällande
        dessa. I vissa bostadsaktiebolag har man beslutat att fördela ansvaret på ett annat sätt. I detta
        fall står det i bolagsordningen vem som ansvarar för vad.
      sentences:
      - id: hb-c11-u0090-s001
        start: 0
        end: 72
      - id: hb-c11-u0090-s002
        start: 73
        end: 173
      - id: hb-c11-u0090-s003
        start: 174
        end: 334
      - id: hb-c11-u0090-s004
        start: 335
        end: 391
      - id: hb-c11-u0090-s005
        start: 392
        end: 474
      - id: hb-c11-u0090-s006
        start: 475
        end: 540
  - type: paragraph
    id: hb-c11-u0091
    text: 'För bostaden anges två priser i försäljningsannonsen: försäljningspriset och det skuldfria
      priset. Det verkliga totalpriset för bostaden är det skuldfria priset. Försäljningspriset anger
      för vilket belopp du kan köpa bostaden, men utöver det betalar du bostadsaktiebolagets lån med bolagsvederlaget,
      vilket kan höja boendekostnaderna avsevärt.'
    sentences:
    - id: hb-c11-u0091-s001
      start: 0
      end: 98
    - id: hb-c11-u0091-s002
      start: 99
      end: 161
    - id: hb-c11-u0091-s003
      start: 162
      end: 343
  - type: paragraph
    id: hb-c11-u0092
    text: I ett bostadsaktiebolag är bolagsvederlaget oftast en stor kostnadspost. Bolagsvederlaget påverkas
      i synnerhet av bostadens storlek, renoveringar och huruvida bostadsaktiebolaget själv äger tomten.
      När du köper en bostad, ska du kontrollera om bolaget äger tomten eller om det är en hyrestomt.
    sentences:
    - id: hb-c11-u0092-s001
      start: 0
      end: 72
    - id: hb-c11-u0092-s002
      start: 73
      end: 197
    - id: hb-c11-u0092-s003
      start: 198
      end: 293
  - type: paragraph
    id: hb-c11-u0093
    text: Om du inte är medborgare i ett EU- eller EES-land och du ska köpa en fastighet med tillhörande
      tomt, behöver du vanligtvis ett tillstånd för detta. Ansök om tillståndet hos försvarsministeriet.
    sentences:
    - id: hb-c11-u0093-s001
      start: 0
      end: 147
    - id: hb-c11-u0093-s002
      start: 148
      end: 193
  - type: paragraph
    id: hb-c11-u0094
    text: Om du ska köpa en bostadsaktie behöver du inget tillstånd. Du behöver inte heller något tillstånd
      om du ska köpa en fastighet tillsammans med din make eller maka eller sambo som är medborgare i
      ett EU- eller EES-land.
    sentences:
    - id: hb-c11-u0094-s001
      start: 0
      end: 58
    - id: hb-c11-u0094-s002
      start: 59
      end: 217
  - type: paragraph
    id: hb-c11-u0095
    text: Enligt lagen måste den som säljer bostaden berätta om de fel som han/hon känner till innan försäljningen
      av bostaden. Om det står klart att försäljaren har känt till fel i bostaden utan att berätta om
      detta för köparen, kan säljaren tvingas ersätta köparen för felet.
    sentences:
    - id: hb-c11-u0095-s001
      start: 0
      end: 117
    - id: hb-c11-u0095-s002
      start: 118
      end: 267
  - type: paragraph
    id: hb-c11-u0096
    text: Det kan också finnas dolda fel i bostaden. De är fel som ingen känner till. Dolda fel är ofta
      till exempel fuktproblem. Säljaren måste betala ut en ersättning till köparen ifall det i bostaden
      finns ett allvarligt fel, som skulle ha påverkat bostadsköpet ifall man känt till det.
    sentences:
    - id: hb-c11-u0096-s001
      start: 0
      end: 42
    - id: hb-c11-u0096-s002
      start: 43
      end: 75
    - id: hb-c11-u0096-s003
      start: 76
      end: 119
    - id: hb-c11-u0096-s004
      start: 120
      end: 279
  - type: paragraph
    id: hb-c11-u0097
    text: När du köper en bostad måste du också betala överlåtelseskatt (varainsiirtovero). Om du köper
      en bostadsaktie är överlåtelseskatten 1,5 procent av bostadens skuldfria pris. Om du köper en fastighet
      är skatten 3 procent av bostadens skuldfria pris.
    sentences:
    - id: hb-c11-u0097-s001
      start: 0
      end: 81
    - id: hb-c11-u0097-s002
      start: 82
      end: 172
    - id: hb-c11-u0097-s003
      start: 173
      end: 247
  - type: paragraph
    id: hb-c11-u0098
    text: Köpebrevet är ett kontrakt där t.ex. bostadens pris, bostadens storlek, bostadens skick och
      datumet då köparen får tillgång till bostaden finns inskrivet. Vanligen görs köpebrevet upp av banken
      eller bostadsförmedlaren. Köparen har rätt att läsa köpebrevet före dagen då köpet genomförs.
    sentences:
    - id: hb-c11-u0098-s001
      start: 0
      end: 154
    - id: hb-c11-u0098-s002
      start: 155
      end: 219
    - id: hb-c11-u0098-s003
      start: 220
      end: 287
- id: hb-c11-boendeproblem
  title: Flyttning, grannar och bostadsproblem
  blocks:
  - type: paragraph
    id: hb-c11-u0347
    text: 'När du flyttar i Finland från en bostad till en annan:'
    sentences:
    - id: hb-c11-u0347-s001
      start: 0
      end: 54
  - id: hb-c11-u0100
    type: list
    ordered: false
    items:
    - id: hb-c11-u0099
      text: Kom ihåg att göra flyttanmälan till Myndigheten för digitalisering och befolkningsdata (Digi-
        ja väestötietovirasto). Du kan göra flyttanmälan tidigast en månad före flyttdagen, men den bör
        göras senast en vecka efter att du har flyttat. Du kan göra anmälan på internet eller med en pappersblankett
        som du får hos Posti eller vid Myndigheten för digitalisering och befolkningsdatas serviceställe.
      sentences:
      - id: hb-c11-u0099-s001
        start: 0
        end: 117
      - id: hb-c11-u0099-s002
        start: 118
        end: 237
      - id: hb-c11-u0099-s003
        start: 238
        end: 396
    - id: hb-c11-u0101
      text: Om du bor i höghus eller radhus ska du alltid också komma ihåg att meddela husets disponent
        (isännöitsijä) att du flyttar.
      sentences:
      - id: hb-c11-u0101-s001
        start: 0
        end: 122
    - id: hb-c11-u0102
      text: Meddela din nya adress till alla instanser som skickar dig post. Vissa organisationer och
        företag får din nya adress direkt från befolkningsregistret. Du har ändå själv ansvaret för att
        dina fakturor skickas till rätt adress och betalas i tid.
      sentences:
      - id: hb-c11-u0102-s001
        start: 0
        end: 64
      - id: hb-c11-u0102-s002
        start: 65
        end: 150
      - id: hb-c11-u0102-s003
        start: 151
        end: 243
  - type: paragraph
    id: hb-c11-u0103
    text: I varje husbolag finns det ordningsregler, och alla boende ska följa dem. Då är det trivsamt
      och tryggt för alla att bo i huset. Ordningsreglerna finns ofta på husbolagets anslagstavla, eller
      så har de delats ut på papper till varje bostad. Om man inte hittar ordningsreglerna kan man begära
      att få dem av hyresvärden eller disponenten.
    sentences:
    - id: hb-c11-u0103-s001
      start: 0
      end: 73
    - id: hb-c11-u0103-s002
      start: 74
      end: 128
    - id: hb-c11-u0103-s003
      start: 129
      end: 240
    - id: hb-c11-u0103-s004
      start: 241
      end: 336
  - type: paragraph
    id: hb-c11-u0104
    text: Reglerna säger när höghusets ytterdörr är öppen och vilken tid det ska vara tyst i huset. Reglerna
      ger också den boende anvisningar för hur husbolagets gemensamma utrymmen, till exempel tvättstugan
      eller bastun, kan användas.
    sentences:
    - id: hb-c11-u0104-s001
      start: 0
      end: 89
    - id: hb-c11-u0104-s002
      start: 90
      end: 225
  - type: paragraph
    id: hb-c11-u0105
    text: Då det ska vara tyst i huset får man exempelvis inte spela hög musik eller renovera. Normalt
      liv, såsom att duscha eller spola i toaletten, är tillåtet också på natten. Om en granne upprepade
      gånger exempelvis duschar nattetid och ljudet av det är störande, kan man vänligt påpeka det för
      grannen.
    sentences:
    - id: hb-c11-u0105-s001
      start: 0
      end: 84
    - id: hb-c11-u0105-s002
      start: 85
      end: 168
    - id: hb-c11-u0105-s003
      start: 169
      end: 297
  - type: paragraph
    id: hb-c11-u0106
    text: Om en boende bryter mot ordningsreglerna kan hen få en varning. Om det störande beteendet fortsätter
      kan hyresavtalet för bostaden hävas eller ägarbostaden tas i besittning av husbolaget. Då är den
      boende tvungen att flytta ut.
    sentences:
    - id: hb-c11-u0106-s001
      start: 0
      end: 63
    - id: hb-c11-u0106-s002
      start: 64
      end: 187
    - id: hb-c11-u0106-s003
      start: 188
      end: 227
  - type: paragraph
    id: hb-c11-u0107
    text: Att ta hänsyn till grannarna innebär också att var och en ser till att de gemensamma utrymmena
      är prydliga. Gemensamma utrymmen är platser som alla i huset använder. Det kan vara gården, trappan,
      tvättstugan och platsen för sopor. På gården slänger alla sina sopor i ett gemensamt sopkärl.
    sentences:
    - id: hb-c11-u0107-s001
      start: 0
      end: 107
    - id: hb-c11-u0107-s002
      start: 108
      end: 165
    - id: hb-c11-u0107-s003
      start: 166
      end: 230
    - id: hb-c11-u0107-s004
      start: 231
      end: 289
  - type: paragraph
    id: hb-c11-u0108
    text: Ibland kan det uppstå meningsskiljaktigheter med grannarna. Vanliga orsaker till det är till
      exempel oväsen från en lägenhet eller rökning på balkongen. Det är bra att alltid försöka lösa meningsskiljaktigheter
      genom att vänligt prata med varandra. Om det inte hjälper att prata kan man kontakta husbolaget
      och be om hjälp för att lösa tvisten.
    sentences:
    - id: hb-c11-u0108-s001
      start: 0
      end: 59
    - id: hb-c11-u0108-s002
      start: 60
      end: 152
    - id: hb-c11-u0108-s003
      start: 153
      end: 248
    - id: hb-c11-u0108-s004
      start: 249
      end: 344
  - type: paragraph
    id: hb-c11-u0109
    text: Om problemen med en granne förvärras och inte heller husbolaget kan lösa frågan, kan grannskapsmedling
      vara till hjälp. Vid grannskapsmedling hjälper en utomstående, opartisk medlare parterna att hitta
      lösningar på meningsskiljaktigheterna.
    sentences:
    - id: hb-c11-u0109-s001
      start: 0
      end: 119
    - id: hb-c11-u0109-s002
      start: 120
      end: 240
  - type: paragraph
    id: hb-c11-u0110
    text: Enligt lag får hyresvärdar inte diskriminera någon till exempel på grund av etniskt ursprung,
      religion, medborgarskap eller handikapp när de väljer hyresgäster. En privat hyresvärd har rätt
      att välja hyresgästen till bostaden men utan diskriminering. Om du misstänker att du har blivit
      diskriminerad kan du fråga om råd till exempel hos diskrimineringsombudsmannens kundtjänst.
    sentences:
    - id: hb-c11-u0110-s001
      start: 0
      end: 160
    - id: hb-c11-u0110-s002
      start: 161
      end: 250
    - id: hb-c11-u0110-s003
      start: 251
      end: 377
  - type: paragraph
    id: hb-c11-u0111
    text: Du har rätt att se bostaden i förväg och bostadsförmedlaren kan inte kräva att få betalt för
      detta. Om du har problem som rör förmedlingsarvodet kan du kontakta Konsumentrådgivningen.
    sentences:
    - id: hb-c11-u0111-s001
      start: 0
      end: 99
    - id: hb-c11-u0111-s002
      start: 100
      end: 183
  - type: paragraph
    id: hb-c11-u0112
    text: Oftast betalar hyresvärden förmedlingsarvodet. Du själv betalar förmedlingsarvodet endast om
      du har ingått ett skriftligt uppdragsavtal med bostadsförmedlaren om att söka en bostad åt dig.
      Om du inte har ingått ett skriftligt uppdragsavtal får bostadsförmedlaren inte kräva dig på förmedlingsarvode.
      Om hen försöker göra detta kan du polisanmäla hen.
    sentences:
    - id: hb-c11-u0112-s001
      start: 0
      end: 46
    - id: hb-c11-u0112-s002
      start: 47
      end: 188
    - id: hb-c11-u0112-s003
      start: 189
      end: 299
    - id: hb-c11-u0112-s004
      start: 300
      end: 350
  - type: paragraph
    id: hb-c11-u0113
    text: Om du inte har en stadigvarande bostad och inte heller är officiell hyresgäst eller underhyresgäst,
      är du bostadslös. I Finland tillhandahåller välfärdsområdena tjänster för bostadslösa.
    sentences:
    - id: hb-c11-u0113-s001
      start: 0
      end: 117
    - id: hb-c11-u0113-s002
      start: 118
      end: 186
  - type: paragraph
    id: hb-c11-u0114
    text: Om du inte har en bostad, ta kontakt med socialservicen (sosiaalipalvelut) i området där du
      vistas. Kontaktuppgifterna hittar du på välfärdsområdenas webbplatser. Socialservicen hjälper dig
      när du söker bostad eller tillfällig inkvartering. En tillfällig inkvartering kan vara ett hem för
      bostadslösa, ett natthärbärge eller en bostad som är avsedd för bostadslösa.
    sentences:
    - id: hb-c11-u0114-s001
      start: 0
      end: 99
    - id: hb-c11-u0114-s002
      start: 100
      end: 162
    - id: hb-c11-u0114-s003
      start: 163
      end: 240
    - id: hb-c11-u0114-s004
      start: 241
      end: 365
  - type: paragraph
    id: hb-c11-u0115
    text: På kvällar och veckoslut ska du kontakta social- och krisjouren (sosiaali- ja kriisipäivystys).
      Kontaktuppgifterna hittar du på välfärdsområdenas webbplatser.
    sentences:
    - id: hb-c11-u0115-s001
      start: 0
      end: 95
    - id: hb-c11-u0115-s002
      start: 96
      end: 158
  - type: paragraph
    id: hb-c11-u0116
    text: Du kan också vända dig till kommunens rådgivningstjänst för invandrare. Många kommuner erbjuder
      rådgivning på flera olika språk.
    sentences:
    - id: hb-c11-u0116-s001
      start: 0
      end: 71
    - id: hb-c11-u0116-s002
      start: 72
      end: 128
- id: hb-c11-bostadsbidrag
  title: Bostadsbidrag
  blocks:
  - type: paragraph
    id: hb-c11-u0117
    text: Om du har en låg inkomst och du är stadigvarande bosatt i Finland kan du ha rätt till FPA:s
      bostadsbidrag. Du kan söka bidrag för hyran och till exempel vattenavgifterna och uppvärmningskostnaderna.
    sentences:
    - id: hb-c11-u0117-s001
      start: 0
      end: 106
    - id: hb-c11-u0117-s002
      start: 107
      end: 198
  - type: paragraph
    id: hb-c11-u0118
    text: Med stadigvarande boende avses att du har ditt egentliga hem i Finland och huvudsakligen också
      vistas i landet. För att kunna få bostadsbidrag måste du även ha rätt till FPA:s förmåner.
    sentences:
    - id: hb-c11-u0118-s001
      start: 0
      end: 111
    - id: hb-c11-u0118-s002
      start: 112
      end: 185
  - type: paragraph
    id: hb-c11-u0119
    text: 'FPA:s stöd för boende är följande:'
    sentences:
    - id: hb-c11-u0119-s001
      start: 0
      end: 34
  - id: hb-c11-u0121
    type: list
    ordered: false
    items:
    - id: hb-c11-u0120
      text: allmänt bostadsbidrag
      sentences:
      - id: hb-c11-u0120-s001
        start: 0
        end: 21
    - id: hb-c11-u0122
      text: bostadsbidrag för pensionstagare
      sentences:
      - id: hb-c11-u0122-s001
        start: 0
        end: 32
    - id: hb-c11-u0123
      text: bostadsunderstöd i samband med militärunderstöd för värnpliktiga och civiltjänstgörare.
      sentences:
      - id: hb-c11-u0123-s001
        start: 0
        end: 87
  - type: paragraph
    id: hb-c11-u0124
    text: Vanligtvis kan du få endast ett stöd för boende i taget.
    sentences:
    - id: hb-c11-u0124-s001
      start: 0
      end: 56
  - type: paragraph
    id: hb-c11-u0125
    text: Stöd kan betalas till en person eller till ett hushåll (ruokakunta). Till samma hushåll hör
      vanligtvis alla som stadigvarande bor i samma bostad. Vanligen består ett hushåll av ett äkta par,
      sambor eller en familj. Också en person kan vara ett hushåll. Bostadsbidraget beviljas gemensamt
      för hushållet på basis av en ansökan.
    sentences:
    - id: hb-c11-u0125-s001
      start: 0
      end: 68
    - id: hb-c11-u0125-s002
      start: 69
      end: 145
    - id: hb-c11-u0125-s003
      start: 146
      end: 214
    - id: hb-c11-u0125-s004
      start: 215
      end: 252
    - id: hb-c11-u0125-s005
      start: 253
      end: 325
  - type: paragraph
    id: hb-c11-u0126
    text: Beakta att om du delar bostad med till exempel en vän och ni har ett gemensamt hyresavtal så
      anses ni höra till samma hushåll. Om du däremot bor på samma adress som en annan person och båda
      har ett eget hyresavtal, måste du i ansökan klargöra om ni är i ett samboförhållande. Gör så även
      om du har ett underhyresavtal.
    sentences:
    - id: hb-c11-u0126-s001
      start: 0
      end: 126
    - id: hb-c11-u0126-s002
      start: 127
      end: 275
    - id: hb-c11-u0126-s003
      start: 276
      end: 318
  - type: paragraph
    id: hb-c11-u0127
    text: 'Följande kan få allmänt bostadsbidrag:'
    sentences:
    - id: hb-c11-u0127-s001
      start: 0
      end: 38
  - id: hb-c11-u0129
    type: list
    ordered: false
    items:
    - id: hb-c11-u0128
      text: barnfamiljer
      sentences:
      - id: hb-c11-u0128-s001
        start: 0
        end: 12
    - id: hb-c11-u0130
      text: gifta par och registrerade par
      sentences:
      - id: hb-c11-u0130-s001
        start: 0
        end: 30
    - id: hb-c11-u0131
      text: sambor
      sentences:
      - id: hb-c11-u0131-s001
        start: 0
        end: 6
    - id: hb-c11-u0132
      text: ensamboende eller
      sentences:
      - id: hb-c11-u0132-s001
        start: 0
        end: 17
    - id: hb-c11-u0133
      text: de som bor i kollektiv
      sentences:
      - id: hb-c11-u0133-s001
        start: 0
        end: 22
    - id: hb-c11-u0134
      text: studerande som bor med sitt eget barn eller med sin makas/makes barn eller som inte har rätt
        till studiestöd.
      sentences:
      - id: hb-c11-u0134-s001
        start: 0
        end: 109
  - type: paragraph
    id: hb-c11-u0135
    text: Hushållets tillgångar påverkar hur mycket bostadsbidrag ni kan få. Tillgångar är till exempel
      medel i banken.
    sentences:
    - id: hb-c11-u0135-s001
      start: 0
      end: 66
    - id: hb-c11-u0135-s002
      start: 67
      end: 109
  - type: paragraph
    id: hb-c11-u0136
    text: Bostadsbidrag kan beviljas för en fast bostad som ligger i Finland. I lagen fastställs vilka
      boendekostnader som kan godtas när stödet beräknas. Bostaden kan vara
    sentences:
    - id: hb-c11-u0136-s001
      start: 0
      end: 67
    - id: hb-c11-u0136-s002
      start: 68
      end: 144
    - id: hb-c11-u0136-s003
      start: 145
      end: 162
  - id: hb-c11-u0138
    type: list
    ordered: false
    items:
    - id: hb-c11-u0137
      text: en hyresbostad
      sentences:
      - id: hb-c11-u0137-s001
        start: 0
        end: 14
    - id: hb-c11-u0139
      text: en bostadsrättsbostad
      sentences:
      - id: hb-c11-u0139-s001
        start: 0
        end: 21
    - id: hb-c11-u0140
      text: en delägarbostad.
      sentences:
      - id: hb-c11-u0140-s001
        start: 0
        end: 17
  - type: paragraph
    id: hb-c11-u0141
    text: Du kan få stöd för till exempel hyran, vattenavgifterna och uppvärmningskostnaderna.
    sentences:
    - id: hb-c11-u0141-s001
      start: 0
      end: 84
  - type: paragraph
    id: hb-c11-u0142
    text: Bostadsbidrag beviljas för skäliga boendekostnader. I stora städer accepteras högre boendekostnader
      än på små orter.
    sentences:
    - id: hb-c11-u0142-s001
      start: 0
      end: 51
    - id: hb-c11-u0142-s002
      start: 52
      end: 116
  - type: paragraph
    id: hb-c11-u0143
    text: 'En del av boendekostnaderna måste du betala själv. För detta fastställs en bassjälvrisk. Bassjälvriskandelens
      storlek beror på:'
    sentences:
    - id: hb-c11-u0143-s001
      start: 0
      end: 50
    - id: hb-c11-u0143-s002
      start: 51
      end: 88
    - id: hb-c11-u0143-s003
      start: 89
      end: 127
  - id: hb-c11-u0145
    type: list
    ordered: false
    items:
    - id: hb-c11-u0144
      text: hur många vuxna och barn som hör till hushållet
      sentences:
      - id: hb-c11-u0144-s001
        start: 0
        end: 47
    - id: hb-c11-u0146
      text: hushållets bruttoinkomster (inkomster före skatt)
      sentences:
      - id: hb-c11-u0146-s001
        start: 0
        end: 49
  - type: paragraph
    id: hb-c11-u0147
    text: Om inkomsterna är mycket låga bortfaller bassjälvrisken.
    sentences:
    - id: hb-c11-u0147-s001
      start: 0
      end: 56
  - type: paragraph
    id: hb-c11-u0148
    text: 'Det finns övre gränser för boendeutgifterna, det vill säga det största belopp som beaktas som
      boendeutgifter enligt vilket du kan få stöd för boendet. Detta kallas boendeutgifternas maximibelopp
      (enimmäisasumismenot). De påverkas av:'
    sentences:
    - id: hb-c11-u0148-s001
      start: 0
      end: 150
    - id: hb-c11-u0148-s002
      start: 151
      end: 217
    - id: hb-c11-u0148-s003
      start: 218
      end: 233
  - id: hb-c11-u0150
    type: list
    ordered: false
    items:
    - id: hb-c11-u0149
      text: kommunen där bostaden är belägen
      sentences:
      - id: hb-c11-u0149-s001
        start: 0
        end: 32
    - id: hb-c11-u0151
      text: antalet vuxna och barn i hushållets storlek
      sentences:
      - id: hb-c11-u0151-s001
        start: 0
        end: 43
  - type: paragraph
    id: hb-c11-u0152
    text: Om bostaden är större eller dyrare än vad lagen om allmänt bostadsbidrag tillåter växer den
      andel av boendekostnaderna som du betalar själv.
    sentences:
    - id: hb-c11-u0152-s001
      start: 0
      end: 140
  - type: paragraph
    id: hb-c11-u0153
    text: Det allmänna bostadsbidraget är 70 procent av de godtagbara boendeutgifterna, med avdrag för
      bassjälvriskandelen. Om dina boendeutgifter är mindre än de godtagbara boendeutgifterna, beräknas
      stödbeloppet på grundval av de faktiska utgifterna.
    sentences:
    - id: hb-c11-u0153-s001
      start: 0
      end: 113
    - id: hb-c11-u0153-s002
      start: 114
      end: 242
  - type: paragraph
    id: hb-c11-u0154
    text: Om dina inkomster, boende- eller familjeförhållanden eller andra omständigheter ändras ska du
      omgående anmäla ändringen till Fpa. I Fpa:s beslut anges i detalj vilka omständigheter som bör anmälas.
    sentences:
    - id: hb-c11-u0154-s001
      start: 0
      end: 129
    - id: hb-c11-u0154-s002
      start: 130
      end: 197
  - type: paragraph
    id: hb-c11-u0155
    text: Om du är studerande, kan du vanligtvis inte få allmänt bostadsbidrag. Du kan däremot få studiestödets
      bostadstillägg, om du har rätt till studiestöd.
    sentences:
    - id: hb-c11-u0155-s001
      start: 0
      end: 69
    - id: hb-c11-u0155-s002
      start: 70
      end: 149
  - type: paragraph
    id: hb-c11-u0156
    text: 'Som studerande kan du få allmänt bostadsbidrag till exempel i följande situationer:'
    sentences:
    - id: hb-c11-u0156-s001
      start: 0
      end: 83
  - id: hb-c11-u0158
    type: list
    ordered: false
    items:
    - id: hb-c11-u0157
      text: Du bor med ditt barn eller med din makas/makes barn.
      sentences:
      - id: hb-c11-u0157-s001
        start: 0
        end: 52
    - id: hb-c11-u0159
      text: Du får någon förmån på grund av vilken du inte kan få studiestöd.
      sentences:
      - id: hb-c11-u0159-s001
        start: 0
        end: 65
    - id: hb-c11-u0160
      text: Du har avbrutit studierna eller har inte kvar några studiestödsmånader.
      sentences:
      - id: hb-c11-u0160-s001
        start: 0
        end: 71
    - id: hb-c11-u0161
      text: Dina studier har inte framskridit tillräckligt och FPA har dragit in ditt studiestöd.
      sentences:
      - id: hb-c11-u0161-s001
        start: 0
        end: 85
- id: hb-c11-ekonomi
  title: Den egna ekonomin och lån
  blocks:
  - type: paragraph
    id: hb-c11-u0162
    text: En persons ekonomi är i balans när utgifterna inte överstiger inkomsterna. Det skulle vara bra
      att ha som mål att också kunna sätta undan pengar efter att alla utgifter är betalda. Besparingarna
      fungerar som en buffert om inkomsterna tillfälligt blir lägre än vanligt. Dessutom gör besparingarna
      det möjligt att man i framtiden kan betala en större anskaffning på en gång.
    sentences:
    - id: hb-c11-u0162-s001
      start: 0
      end: 74
    - id: hb-c11-u0162-s002
      start: 75
      end: 180
    - id: hb-c11-u0162-s003
      start: 181
      end: 268
    - id: hb-c11-u0162-s004
      start: 269
      end: 372
  - type: paragraph
    id: hb-c11-u0163
    text: Ett bra sätt att balansera inkomster och utgifter är med hjälp av budgetering. Först räknar
      man hur mycket pengar man har till sitt förfogande till exempel under en månad eller en vecka. Efter
      det fördelar man beloppet mellan olika typer av utgifter. Först drar man av alla fasta, nödvändiga
      utgifter såsom hyra, läkemedel och nödvändiga fakturor. Det resterande beloppet fördelas mellan
      övriga utgifter. På så vis ser man hur mycket man kan spendera på en månad på till exempel mat och
      fritidsaktiviteter.
    sentences:
    - id: hb-c11-u0163-s001
      start: 0
      end: 78
    - id: hb-c11-u0163-s002
      start: 79
      end: 186
    - id: hb-c11-u0163-s003
      start: 187
      end: 250
    - id: hb-c11-u0163-s004
      start: 251
      end: 347
    - id: hb-c11-u0163-s005
      start: 348
      end: 404
    - id: hb-c11-u0163-s006
      start: 405
      end: 506
  - type: paragraph
    id: hb-c11-u0164
    text: Det är viktigt att se över sin konsumtion alltid när inkomsterna eller utgifterna förändras.
      Till exempel en låginkomsttagare kan bli befriad från barnens avgifter för småbarnspedagogik, men
      när inkomsterna ökar höjs också avgifterna. Då är man tvungen att se över sin budget.
    sentences:
    - id: hb-c11-u0164-s001
      start: 0
      end: 92
    - id: hb-c11-u0164-s002
      start: 93
      end: 234
    - id: hb-c11-u0164-s003
      start: 235
      end: 276
  - type: paragraph
    id: hb-c11-u0165
    text: När man fattar beslut är det viktigt att komma ihåg att lånade pengar inte är gratis. När man
      tar lån lovar man att sköta om de kommande betalningarna och ofta också om att betala ränta. Räntan
      är priset för de lånade pengarna. Ibland kan det vara motiverat att ta lån för en större anskaffning
      eller köpa en produkt på avbetalning. Det ska ändå alltid vara ett väl övervägt beslut. Innan man
      tar ett lån ska man alltid noggrant ta reda på villkoren för lånet och fundera över om man säkert
      kan betala tillbaka det.
    sentences:
    - id: hb-c11-u0165-s001
      start: 0
      end: 85
    - id: hb-c11-u0165-s002
      start: 86
      end: 186
    - id: hb-c11-u0165-s003
      start: 187
      end: 227
    - id: hb-c11-u0165-s004
      start: 228
      end: 332
    - id: hb-c11-u0165-s005
      start: 333
      end: 382
    - id: hb-c11-u0165-s006
      start: 383
      end: 515
  - type: paragraph
    id: hb-c11-u0166
    text: När man funderar på att ta ett lån ska man fundera över åtminstone hur stora återbetalningsbeloppen
      är och om man klarar av att betala dem under hela återbetalningstiden. Anskaffningar på kredit påverkar
      alltid den framtida konsumtionen. Dessutom är det bra att kontrollera vad räntan på lånet är. Om
      räntan är hög kan lånet i verkligheten bli mycket dyrt. Man ska också fundera på hur lång lånetid
      man väljer. En lång lånetid betyder mindre delbetalningar, men på grund av räntan blir totalpriset
      högre.
    sentences:
    - id: hb-c11-u0166-s001
      start: 0
      end: 170
    - id: hb-c11-u0166-s002
      start: 171
      end: 237
    - id: hb-c11-u0166-s003
      start: 238
      end: 297
    - id: hb-c11-u0166-s004
      start: 298
      end: 356
    - id: hb-c11-u0166-s005
      start: 357
      end: 410
    - id: hb-c11-u0166-s006
      start: 411
      end: 504
  - type: paragraph
    id: hb-c11-u0167
    text: Om man lånar pengar till exempelvis en kompis eller en släkting är det bra att skriftligt komma
      överens om återbetalningen av lånet och de övriga villkoren för det.
    sentences:
    - id: hb-c11-u0167-s001
      start: 0
      end: 164
  - type: paragraph
    id: hb-c11-u0168
    text: Det är vanligt att ta lån i Finland när det är väl övervägt och välgrundat. Till exempel bostäderna
      i Finland är så dyra att endast få kan köpa en bostad utan bostadslån. Likaså tar människor ofta
      lån för att till exempel köpa en bil. Ett lån är inte ett problem om man kan betala tillbaka det
      och återbetalningen inte påfrestar ekonomin för mycket.
    sentences:
    - id: hb-c11-u0168-s001
      start: 0
      end: 75
    - id: hb-c11-u0168-s002
      start: 76
      end: 170
    - id: hb-c11-u0168-s003
      start: 171
      end: 234
    - id: hb-c11-u0168-s004
      start: 235
      end: 349
  - type: paragraph
    id: hb-c11-u0169
    text: Att ta ett nytt lån för att betala gamla lån är på lång sikt ingen hållbar lösning. Om skulderna
      består av flera konsumtionskrediter med hög ränta kan det ändå vara bra att ta reda på om det är
      möjligt att få ett banklån med rimlig ränta eller en social kredit för att betala skulderna. Man
      ansöker om social kredit hos det egna välfärdsområdet. Garantistiftelsen i sin tur kan i vissa fall
      gå i borgen för banklån med rimlig ränta.
    sentences:
    - id: hb-c11-u0169-s001
      start: 0
      end: 83
    - id: hb-c11-u0169-s002
      start: 84
      end: 286
    - id: hb-c11-u0169-s003
      start: 287
      end: 345
    - id: hb-c11-u0169-s004
      start: 346
      end: 432
  - type: paragraph
    id: hb-c11-u0170
    text: Ibland kan det hända att förfallodagen för en faktura närmar sig, men det finns inte tillräckligt
      med pengar på kontot för att betala den. Då är det bra att genast kontakta den som skickat fakturan,
      till exempel elbolaget. När man förklarar situationen för bolaget är det vanligtvis möjligt att
      få extra tid på sig att betala. Det kan också vara möjligt att avtala om att betala fakturan i delar.
    sentences:
    - id: hb-c11-u0170-s001
      start: 0
      end: 138
    - id: hb-c11-u0170-s002
      start: 139
      end: 222
    - id: hb-c11-u0170-s003
      start: 223
      end: 326
    - id: hb-c11-u0170-s004
      start: 327
      end: 396
  - type: paragraph
    id: hb-c11-u0171
    text: Om man har lite pengar är det bra att börja med att betala de fakturor som är viktigast. Utgifter
      för boende betalas alltid först, eftersom en hyresskuld kan leda till att man förlorar sitt hem.
      Också elen kan stängas av om elräkningarna inte betalas.
    sentences:
    - id: hb-c11-u0171-s001
      start: 0
      end: 88
    - id: hb-c11-u0171-s002
      start: 89
      end: 194
    - id: hb-c11-u0171-s003
      start: 195
      end: 251
  - type: paragraph
    id: hb-c11-u0172
    text: När det gäller att hantera sin ekonomi är det bra att vara aktiv och be om hjälp genast när
      man behöver det. Det är mycket mer sannolikt att små svårigheter blir stora om man bara låter bli
      att betala en faktura eller försöker åtgärda situationen genom att ta konsumtionskrediter med hög
      ränta.
    sentences:
    - id: hb-c11-u0172-s001
      start: 0
      end: 108
    - id: hb-c11-u0172-s002
      start: 109
      end: 294
- id: hb-c11-skulder
  title: Betalningssvårigheter och skuldrådgivning
  blocks:
  - type: paragraph
    id: hb-c11-u0173
    text: Om du har en räkning som du inte kan betala, kontakta avsändaren direkt. Ofta kan du få betalningstiden
      förlängd. Då läggs vanligtvis en liten förseningsavgift på räkningen.
    sentences:
    - id: hb-c11-u0173-s001
      start: 0
      end: 72
    - id: hb-c11-u0173-s002
      start: 73
      end: 113
    - id: hb-c11-u0173-s003
      start: 114
      end: 173
  - type: paragraph
    id: hb-c11-u0174
    text: Om du inte betalar räkningen senast på förfallodagen eller inte har kommit överens om att förlänga
      betalningstiden, måste du betala påminnelse- och inkassokostnader samt dröjsmålsränta.
    sentences:
    - id: hb-c11-u0174-s001
      start: 0
      end: 185
  - type: paragraph
    id: hb-c11-u0175
    text: Om du inte har betalat en räkning senast på förfallodagen får du en betalningspåminnelse. Efter
      en eller två påminnelser kan räkningen övergå till en inkassobyrå. Inkassobyrån skickar dig genast
      ett betalningskrav. Om du inte kan betala räkningen på en gång, ska du kontakta inkassobyrån och
      komma överens om en betalningsplan för räkningen.
    sentences:
    - id: hb-c11-u0175-s001
      start: 0
      end: 89
    - id: hb-c11-u0175-s002
      start: 90
      end: 162
    - id: hb-c11-u0175-s003
      start: 163
      end: 214
    - id: hb-c11-u0175-s004
      start: 215
      end: 341
  - type: paragraph
    id: hb-c11-u0176
    text: Om du inte betalar räkningen eller kommer överens om en betalningsplan kan skulden slutligen
      gå till utmätning (ulosotto). Utmätning betyder att myndigheten har rätt att ta en del av dina inkomster
      för betalning av skulder. Utmätningsmyndigheten kan även sälja värdefull egendom som du har för
      att betala skulden.
    sentences:
    - id: hb-c11-u0176-s001
      start: 0
      end: 122
    - id: hb-c11-u0176-s002
      start: 123
      end: 223
    - id: hb-c11-u0176-s003
      start: 224
      end: 313
  - type: paragraph
    id: hb-c11-u0177
    text: Ofta behövs ett domstolsbeslut för utmätning. Vissa betalningar går emellertid direkt till utmätning.
      Sådana betalningar är till exempel skatter, hälsocentralsavgifter och dagvårdsavgifter.
    sentences:
    - id: hb-c11-u0177-s001
      start: 0
      end: 45
    - id: hb-c11-u0177-s002
      start: 46
      end: 101
    - id: hb-c11-u0177-s003
      start: 102
      end: 189
  - type: paragraph
    id: hb-c11-u0178
    text: Om du inte betalar en räkning eller en skuld, kan du få en betalningsanmärkning (maksuhäiriömerkintä)
      i kreditupplysningsregistret. Detta orsakar många svårigheter för dig. Hyresvärdar och banker kontrollerar
      ofta kredituppgifterna i kreditupplysningsregistret. Om du har en betalningsanmärkning, får du inte
      nödvändigtvis en hyresbostad, ett banklån eller ett kreditkort. Även arbetsgivaren kan i vissa situationer
      förutsätta att arbetstagaren inte har betalningsanmärkningar.
    sentences:
    - id: hb-c11-u0178-s001
      start: 0
      end: 131
    - id: hb-c11-u0178-s002
      start: 132
      end: 172
    - id: hb-c11-u0178-s003
      start: 173
      end: 261
    - id: hb-c11-u0178-s004
      start: 262
      end: 372
    - id: hb-c11-u0178-s005
      start: 373
      end: 477
  - type: paragraph
    id: hb-c11-u0179
    text: Hyresvärden har rätt att häva hyresavtalet om du inte betalar din hyra. Hyresvärden ska meddela
      hyresgästen om hävandet. I detta skede finns det vanligtvis ännu en möjlighet att komma överens
      om hyresbetalningen med hyresvärden. Om du inte betalar din hyra kan hyresvärden söka ett avhysningsbeslut
      i domstol. Det innebär att du måste flytta ut ur bostaden och betala de obetalda hyrorna.
    sentences:
    - id: hb-c11-u0179-s001
      start: 0
      end: 71
    - id: hb-c11-u0179-s002
      start: 72
      end: 120
    - id: hb-c11-u0179-s003
      start: 121
      end: 228
    - id: hb-c11-u0179-s004
      start: 229
      end: 309
    - id: hb-c11-u0179-s005
      start: 310
      end: 388
  - type: paragraph
    id: hb-c11-u0180
    text: Om du har svårigheter att betala hyran för din bostad ska du ta kontakt med hyresvärden.
    sentences:
    - id: hb-c11-u0180-s001
      start: 0
      end: 88
  - type: paragraph
    id: hb-c11-u0181
    text: Försök att komma överens om att flytta fram förfallodagen med din hyresvärd. Du kan även be
      om råd hos socialservicen på din ort. Kontrollera också om du till exempel har rätt till bostadsbidrag
      eller utkomststöd. Din rätt till bostadsbidrag och utkomststöd kan du få reda på hos FPA.
    sentences:
    - id: hb-c11-u0181-s001
      start: 0
      end: 76
    - id: hb-c11-u0181-s002
      start: 77
      end: 129
    - id: hb-c11-u0181-s003
      start: 130
      end: 213
    - id: hb-c11-u0181-s004
      start: 214
      end: 284
  - type: paragraph
    id: hb-c11-u0182
    text: Om du har problem med att betala räkningar och skulder, kontakta rättshjälpsbyråns ekonomi-
      och skuldrådgivning (talous- ja velkaneuvonta). Rådgivningen är kostnadsfri och ordnas av staten.
    sentences:
    - id: hb-c11-u0182-s001
      start: 0
      end: 139
    - id: hb-c11-u0182-s002
      start: 140
      end: 189
  - type: paragraph
    id: hb-c11-u0183
    text: 'Ekonomi- och skuldrådgivaren:'
    sentences:
    - id: hb-c11-u0183-s001
      start: 0
      end: 29
  - id: hb-c11-u0185
    type: list
    ordered: false
    items:
    - id: hb-c11-u0184
      text: utreder din ekonomiska situation med dig,
      sentences:
      - id: hb-c11-u0184-s001
        start: 0
        end: 41
    - id: hb-c11-u0186
      text: hjälper till att överväga olika lösningsalternativ och
      sentences:
      - id: hb-c11-u0186-s001
        start: 0
        end: 54
    - id: hb-c11-u0187
      text: hjälper till att utarbeta betalningsavtal.
      sentences:
      - id: hb-c11-u0187-s001
        start: 0
        end: 42
  - type: paragraph
    id: hb-c11-u0188
    text: Dessutom kan ekonomi- och skuldrådgivaren ge dig råd om hur du ansöker om ett skuldsaneringslån
      och skuldsanering.
    sentences:
    - id: hb-c11-u0188-s001
      start: 0
      end: 114
  - type: paragraph
    id: hb-c11-u0189
    text: Hos Takuusäätiö kan du också få hjälp med och råd om betalningen av skulder. Stiftelsen kan
      hjälpa dig att slå ihop dina skulder till ett lån. Du kan ansöka om lånegaranti vid Takuusäätiö
      om du behöver ett banklån för att betala dina skulder. Vid Takuusäätiö kan du även ansöka om ett
      litet lån, om du behöver pengar för en utgift av engångskaraktär, såsom en hushållsmaskin, möbler,
      hyresdeposition, reparation av bilen eller glasögon.
    sentences:
    - id: hb-c11-u0189-s001
      start: 0
      end: 76
    - id: hb-c11-u0189-s002
      start: 77
      end: 142
    - id: hb-c11-u0189-s003
      start: 143
      end: 242
    - id: hb-c11-u0189-s004
      start: 243
      end: 436
- id: hb-c11-konsumentskydd
  title: Konsumentskydd
  blocks:
  - type: paragraph
    id: hb-c11-u0190
    text: Alla som köper varor och tjänster är konsumenter. Konsumentskyddslagen tryggar konsumentens
      rättigheter i Finland. Du har rätt till gottgörelse till exempel då varan som du köpt har fel som
      inte du har orsakat. Du kan till exempel ersättas med en felfri vara eller få dina pengar tillbaka.
    sentences:
    - id: hb-c11-u0190-s001
      start: 0
      end: 49
    - id: hb-c11-u0190-s002
      start: 50
      end: 114
    - id: hb-c11-u0190-s003
      start: 115
      end: 210
    - id: hb-c11-u0190-s004
      start: 211
      end: 289
  - type: paragraph
    id: hb-c11-u0191
    text: Om en vara som du köpt har brister ska du först kontakt säljaren. Om du inte kan komma överens
      om saken med säljaren, ta då kontakt med konsumentrådgivningen.
    sentences:
    - id: hb-c11-u0191-s001
      start: 0
      end: 65
    - id: hb-c11-u0191-s002
      start: 66
      end: 158
- id: hb-c11-miljo
  title: Miljöansvar och naturskydd
  blocks:
  - type: paragraph
    id: hb-c11-u0192
    text: I Finland är det viktigt att spara energi. Genom att spara energi och vatten sparar man pengar,
      eftersom el- och vattenräkningarna blir lägre. Genom att spara energi skyddar människorna också
      miljön. Tanken är att alla människor ska använda el, energi och vatten sparsamt hemma. Ju mindre
      energi som förbrukas, desto bättre kan vi skydda jorden mot klimatförändringen.
    sentences:
    - id: hb-c11-u0192-s001
      start: 0
      end: 42
    - id: hb-c11-u0192-s002
      start: 43
      end: 142
    - id: hb-c11-u0192-s003
      start: 143
      end: 199
    - id: hb-c11-u0192-s004
      start: 200
      end: 278
    - id: hb-c11-u0192-s005
      start: 279
      end: 368
  - type: paragraph
    id: hb-c11-u0193
    text: Klimatförändringen innebär att temperaturen på jorden gradvis ökar. Klimatförändringen har många
      allvarliga konsekvenser för människornas och djurens liv på hela jordklotet. När temperaturen på
      jorden ökar blir det svårare och svårare att bedriva jordbruk. De extrema väderfenomenen blir kraftigare,
      vilket innebär att det på torra platser blir allt torrare och varmare och på andra platser fuktigare
      eller kallare. Förändringarna orsakar fara för både människorna, djuren och hela vår livsmiljö.
    sentences:
    - id: hb-c11-u0193-s001
      start: 0
      end: 67
    - id: hb-c11-u0193-s002
      start: 68
      end: 173
    - id: hb-c11-u0193-s003
      start: 174
      end: 256
    - id: hb-c11-u0193-s004
      start: 257
      end: 415
    - id: hb-c11-u0193-s005
      start: 416
      end: 496
  - type: paragraph
    id: hb-c11-u0194
    text: Sjukdomar sprider sig, och djurarter dör ut.
    sentences:
    - id: hb-c11-u0194-s001
      start: 0
      end: 44
  - type: paragraph
    id: hb-c11-u0195
    text: Naturen skyddas för att man vill bevara djur- och växtarter och skydda naturens mångfald mot
      påverkan från mänsklig verksamhet. Mångfald i naturen betyder att det finns så många olika arter
      av djur, växter och andra organismer som möjligt. Människans verksamhet orsakar förändringar i den
      naturliga miljön; förstöring, förorening, nedskräpning och övergödning samt utrotning av arter.
      Miljöskyddslagen förebygger förstöring av natur och miljö och motverkar miljöskador.
    sentences:
    - id: hb-c11-u0195-s001
      start: 0
      end: 127
    - id: hb-c11-u0195-s002
      start: 128
      end: 239
    - id: hb-c11-u0195-s003
      start: 240
      end: 384
    - id: hb-c11-u0195-s004
      start: 385
      end: 469
  - type: paragraph
    id: hb-c11-u0196
    text: I Finland skyddas naturen av finsk lag, EU-lagstiftning, statliga myndigheter och olika frivilligorganisationer.
      Miljöministeriet grundades i Finland redan år 1983. Det övervakar bland annat att naturresurserna
      utnyttjas hållbart och att naturens mångfald bevaras.
    sentences:
    - id: hb-c11-u0196-s001
      start: 0
      end: 112
    - id: hb-c11-u0196-s002
      start: 113
      end: 164
    - id: hb-c11-u0196-s003
      start: 165
      end: 264
  - type: paragraph
    id: hb-c11-u0197
    text: I Finland ska både vilda djur, husdjur och sällskapsdjur behandlas etiskt och korrekt. Djurskyddslagen
      främjar djurens välmående och en bra behandling av djuren i Finland. I lagen fastslås bland annat
      hur djur ska skötas, uppfödas och slaktas och i hurudana omständigheter djuren inte får hållas.
      Myndigheterna övervakar uppfödningen av produktionsdjur, alltså till exempel kor, svin och höns.
      I Finland hör hundar och katter till de vanligaste sällskapsdjuren. Både människor i städer och
      på landet har sådana.
    sentences:
    - id: hb-c11-u0197-s001
      start: 0
      end: 86
    - id: hb-c11-u0197-s002
      start: 87
      end: 171
    - id: hb-c11-u0197-s003
      start: 172
      end: 296
    - id: hb-c11-u0197-s004
      start: 297
      end: 393
    - id: hb-c11-u0197-s005
      start: 394
      end: 461
    - id: hb-c11-u0197-s006
      start: 462
      end: 511
- id: hb-c11-atervinning
  title: Avfall och återvinning
  blocks:
  - type: paragraph
    id: hb-c11-u0198
    text: Sortera dina sopor hemma innan du slänger dem i sopkärlet. I Finland källsorteras vanligtvis
      papper och kartong, glasförpackningar, metall, plast, blandavfall, farligt avfall, el- och elektronikapparater
      och batterier. När soporna sorteras rätt kan materialet användas för att tillverka nya produkter.
    sentences:
    - id: hb-c11-u0198-s001
      start: 0
      end: 58
    - id: hb-c11-u0198-s002
      start: 59
      end: 218
    - id: hb-c11-u0198-s003
      start: 219
      end: 301
  - type: paragraph
    id: hb-c11-u0199
    text: Anvisningarna för sorteringen skiljer sig något från varandra i olika delar av landet. Anvisningarna
      finns vanligtvis vid sopbehållarna vid ditt eget hus. Om inte kan du kontakta kommunen eller din
      hyresvärd. Kasta inte avfallet ut genom fönstret, i skogen eller på gatan.
    sentences:
    - id: hb-c11-u0199-s001
      start: 0
      end: 86
    - id: hb-c11-u0199-s002
      start: 87
      end: 154
    - id: hb-c11-u0199-s003
      start: 155
      end: 208
    - id: hb-c11-u0199-s004
      start: 209
      end: 272
  - type: paragraph
    id: hb-c11-u0200
    text: Sortera avfallet enligt material.
    sentences:
    - id: hb-c11-u0200-s001
      start: 0
      end: 33
  - type: paragraph
    id: hb-c11-u0201
    text: Lägg inte skräp, mat eller kemikaler i avloppet (WC:n). För alltid farligt avfall till insamlingsställe.
    sentences:
    - id: hb-c11-u0201-s001
      start: 0
      end: 55
    - id: hb-c11-u0201-s002
      start: 56
      end: 104
  - type: paragraph
    id: hb-c11-u0202
    text: Vid alla hus finns inte alltid samtliga insamlingskärl. Du får inte föra ditt eget avfall till
      insamlingskärl avsedda för ett annat hus. Du får inte heller lägga avfall från exempelvis ditt företag
      i sopkärlen avsedda för ditt eget hus.
    sentences:
    - id: hb-c11-u0202-s001
      start: 0
      end: 55
    - id: hb-c11-u0202-s002
      start: 56
      end: 136
    - id: hb-c11-u0202-s003
      start: 137
      end: 236
  - type: paragraph
    id: hb-c11-u0203
    text: I Finland anser man att det är viktigt att människorna sparar på naturresurser och skyddar miljön.
      Därför sorteras hushållens sopor i olika avfallskärl på gårdarna eller vid återvinningsstationer
      för att sedan transporteras bort. Efter sorteringen kan avfallens material användas på nytt, vilket
      sparar naturresurser och pengar. Samtidigt minskar mängden avfall som förs till avstjälpningsplatsen.
    sentences:
    - id: hb-c11-u0203-s001
      start: 0
      end: 98
    - id: hb-c11-u0203-s002
      start: 99
      end: 229
    - id: hb-c11-u0203-s003
      start: 230
      end: 328
    - id: hb-c11-u0203-s004
      start: 329
      end: 397
  - type: paragraph
    id: hb-c11-u0204
    text: Om människorna sorterar avfallet fel blir avfallshanteringen långsammare, vilket orsakar extra
      avgifter för samhället. Alla människor måste betala dessa avgifter. Också husbolaget måste betala
      extra avgifter till avfallsbolaget om avfallet är dåligt sorterat eller avfall har lämnats bredvid
      sopkärlen. Detta påverkar storleken på vederlagen och hyrorna.
    sentences:
    - id: hb-c11-u0204-s001
      start: 0
      end: 118
    - id: hb-c11-u0204-s002
      start: 119
      end: 162
    - id: hb-c11-u0204-s003
      start: 163
      end: 302
    - id: hb-c11-u0204-s004
      start: 303
      end: 354
  - type: paragraph
    id: hb-c11-u0205
    text: Bioavfall är bland annat matrester, fruktskal, kaffe- och tesump, äggskal, fiskrens och små
      ben. Bioavfallet komposteras och görs till mylla.
    sentences:
    - id: hb-c11-u0205-s001
      start: 0
      end: 96
    - id: hb-c11-u0205-s002
      start: 97
      end: 141
  - type: paragraph
    id: hb-c11-u0206
    text: I kartonginsamlingen sorteras matförpackningar av papp, papplådor och mjölk- och saftförpackningar.
      Förpackningarna ska vid behov sköljas, men inga våta förpackningar får slängas i kärlet. Förpackningarna
      och lådorna ska plattas till innan de slängs, så att kärlet inte fylls så snabbt. Av återvunnen
      kartong tillverkas ny papp och kartong.
    sentences:
    - id: hb-c11-u0206-s001
      start: 0
      end: 99
    - id: hb-c11-u0206-s002
      start: 100
      end: 188
    - id: hb-c11-u0206-s003
      start: 189
      end: 286
    - id: hb-c11-u0206-s004
      start: 287
      end: 340
  - type: paragraph
    id: hb-c11-u0207
    text: Tidningar och tidskrifter, reklampapper, kuvert, böcker utan pärmar och vitt skrivarpapper slängs
      i pappersinsamlingen. Av dessa tillverkas nytt papper.
    sentences:
    - id: hb-c11-u0207-s001
      start: 0
      end: 119
    - id: hb-c11-u0207-s002
      start: 120
      end: 152
  - type: paragraph
    id: hb-c11-u0208
    text: I plastinsamlingen kan till exempel askar, omslag, påsar och flaskor som använts till att förpacka
      livsmedel eller kosmetika slängas. Förpackningarna ska vara tomma och kan torkas rena. Av plasten
      tillverkas råmaterial till nya plastprodukter.
    sentences:
    - id: hb-c11-u0208-s001
      start: 0
      end: 133
    - id: hb-c11-u0208-s002
      start: 134
      end: 185
    - id: hb-c11-u0208-s003
      start: 186
      end: 243
  - type: paragraph
    id: hb-c11-u0209
    text: I glasinsamlingen slängs glasburkar och glasflaskor utan pant. I glasinsamlingen får man inte
      slänga till exempel dricksglas, fönsterglas eller spegelglas. Av återvunnet glas tillverkas nytt
      glas.
    sentences:
    - id: hb-c11-u0209-s001
      start: 0
      end: 62
    - id: hb-c11-u0209-s002
      start: 63
      end: 155
    - id: hb-c11-u0209-s003
      start: 156
      end: 196
  - type: paragraph
    id: hb-c11-u0210
    text: I metallinsamlingen slängs konservburkar, aluminiumformar och aluminiumfolie, hushållsartiklar
      av metall och små metallföremål som enkelt ryms i kärlet. Man får inte slänga batterier, sprayburkar
      eller färgburkar som inte är tomma i insamlingen. Metallen sorteras och används till att tillverka
      nya metallprodukter.
    sentences:
    - id: hb-c11-u0210-s001
      start: 0
      end: 152
    - id: hb-c11-u0210-s002
      start: 153
      end: 245
    - id: hb-c11-u0210-s003
      start: 246
      end: 315
  - type: paragraph
    id: hb-c11-u0211
    text: Blandavfall är allt avfall som inte kan sorteras i något av de andra kärlen. Blandavfallet bränns
      och producerar energi. Energin används till värme och el.
    sentences:
    - id: hb-c11-u0211-s001
      start: 0
      end: 76
    - id: hb-c11-u0211-s002
      start: 77
      end: 120
    - id: hb-c11-u0211-s003
      start: 121
      end: 155
  - type: paragraph
    id: hb-c11-u0212
    text: Det är mycket viktigt att sortera farligt avfall separat. Om farligt avfall slängs i blandavfallet
      kan giftiga ämnen hamna i naturen. Farligt avfall är till exempel lysrör, ackumulatorer och batterier,
      målarfärger och lim samt olika kemikalier. De måste föras till ett insamlingsställe för farligt
      avfall eller till en återvinningscentral. Batterier, lågenergilampor och lysrör kan föras till affärer
      som säljer dem.
    sentences:
    - id: hb-c11-u0212-s001
      start: 0
      end: 57
    - id: hb-c11-u0212-s002
      start: 58
      end: 133
    - id: hb-c11-u0212-s003
      start: 134
      end: 244
    - id: hb-c11-u0212-s004
      start: 245
      end: 339
    - id: hb-c11-u0212-s005
      start: 340
      end: 416
  - type: paragraph
    id: hb-c11-u0213
    text: Även el- och elektronikavfall, till exempel gamla hushållsmaskiner och datorer, ska sorteras
      separat. Gamla elapparater kan föras till en elaffär.
    sentences:
    - id: hb-c11-u0213-s001
      start: 0
      end: 101
    - id: hb-c11-u0213-s002
      start: 102
      end: 146
  - type: paragraph
    id: hb-c11-u0214
    text: Gamla läkemedel och mediciner ska föras till apoteket. Läkemedlen förs till apoteket i en genomskinlig,
      tät plastpåse. Tomma medicinburkar slängs enligt materialet i glas- eller plastinsamlingen.
    sentences:
    - id: hb-c11-u0214-s001
      start: 0
      end: 54
    - id: hb-c11-u0214-s002
      start: 55
      end: 118
    - id: hb-c11-u0214-s003
      start: 119
      end: 195
  - type: paragraph
    id: hb-c11-u0215
    text: Man kan spara på miljön och resurserna också genom att ge bort eller sälja saker som man inte
      längre behöver. Till exempel kläder, möbler och fungerande hushållsapparater i bra skick kan säljas
      på fysiska loppmarknader eller loppmarknader på internet. De kan också doneras till en återvinningscentral
      eller en loppmarknad som drivs av en välgörenhetsorganisation.
    sentences:
    - id: hb-c11-u0215-s001
      start: 0
      end: 109
    - id: hb-c11-u0215-s002
      start: 110
      end: 251
    - id: hb-c11-u0215-s003
      start: 252
      end: 363
  - type: paragraph
    id: hb-c11-u0216
    text: För en stor del av de dryckesflaskor och dryckesburkar som säljs i affärerna betalas en pant.
      När man returnerar en sådan tom flaska eller burk till affären får man en liten pant i gengäld.
      Olika företag använder de pantade flaskorna och burkarna på nytt.
    sentences:
    - id: hb-c11-u0216-s001
      start: 0
      end: 93
    - id: hb-c11-u0216-s002
      start: 94
      end: 189
    - id: hb-c11-u0216-s003
      start: 190
      end: 255
- id: hb-c11-allemansratten
  title: Allemansrätten
  blocks:
  - type: paragraph
    id: hb-c11-u0217
    text: Med allemansrätten avses alla människors möjlighet att fritt röra sig i den finländska naturen.
      Allemansrätten är en väsentlig del av den finländska kulturen och lagstiftningen.
    sentences:
    - id: hb-c11-u0217-s001
      start: 0
      end: 95
    - id: hb-c11-u0217-s002
      start: 96
      end: 177
  - type: paragraph
    id: hb-c11-u0218
    text: 'Du får:'
    sentences:
    - id: hb-c11-u0218-s001
      start: 0
      end: 7
  - id: hb-c11-u0220
    type: list
    ordered: false
    items:
    - id: hb-c11-u0219
      text: gå till fots, åka skidor eller cykla i naturen, såsom skogarna, naturängarna och vattendragen,
      sentences:
      - id: hb-c11-u0219-s001
        start: 0
        end: 94
    - id: hb-c11-u0221
      text: tillfälligt vistas i områden där det är tillåtet att röra sig – du kan till exempel tälta
        om du håller ett tillräckligt avstånd till andras bostäder,
      sentences:
      - id: hb-c11-u0221-s001
        start: 0
        end: 149
    - id: hb-c11-u0222
      text: plocka naturbär, svampar och växter som inte är fridlysta,
      sentences:
      - id: hb-c11-u0222-s001
        start: 0
        end: 58
    - id: hb-c11-u0223
      text: meta och pimpla (metning och pimpling är förbjudna i vissa vattendrag),
      sentences:
      - id: hb-c11-u0223-s001
        start: 0
        end: 71
    - id: hb-c11-u0224
      text: ägna dig åt båtliv, simma och färdas på isen.
      sentences:
      - id: hb-c11-u0224-s001
        start: 0
        end: 45
  - type: paragraph
    id: hb-c11-u0225
    text: 'Du får inte:'
    sentences:
    - id: hb-c11-u0225-s001
      start: 0
      end: 12
  - id: hb-c11-u0227
    type: list
    ordered: false
    items:
    - id: hb-c11-u0226
      text: störa andra eller orsaka olägenhet för andra eller miljön,
      sentences:
      - id: hb-c11-u0226-s001
        start: 0
        end: 58
    - id: hb-c11-u0228
      text: röra dig på gårdsplaner, planteringar och odlade åkrar,
      sentences:
      - id: hb-c11-u0228-s001
        start: 0
        end: 55
    - id: hb-c11-u0229
      text: störa djur eller skada fågelbon eller fågelungar,
      sentences:
      - id: hb-c11-u0229-s001
        start: 0
        end: 49
    - id: hb-c11-u0230
      text: fälla eller skada växande träd,
      sentences:
      - id: hb-c11-u0230-s001
        start: 0
        end: 31
    - id: hb-c11-u0231
      text: ta torra eller kullfallna träd, ris, mossa eller lav,
      sentences:
      - id: hb-c11-u0231-s001
        start: 0
        end: 53
    - id: hb-c11-u0232
      text: göra upp öppen eld,
      sentences:
      - id: hb-c11-u0232-s001
        start: 0
        end: 19
    - id: hb-c11-u0233
      text: störa hemfriden till exempel genom att slå läger alltför nära en bostad eller genom att föra
        oväsen,
      sentences:
      - id: hb-c11-u0233-s001
        start: 0
        end: 100
    - id: hb-c11-u0234
      text: skräpa ner i naturen,
      sentences:
      - id: hb-c11-u0234-s001
        start: 0
        end: 21
    - id: hb-c11-u0235
      text: köra ett motorfordon i terrängen,
      sentences:
      - id: hb-c11-u0235-s001
        start: 0
        end: 33
  - type: paragraph
    id: hb-c11-u0236
    text: I Finland måste hundar alltid vara kopplade i tätorter, det vill säga i tättbefolkade områden.
      I andra områden ska hundar i allmänhet vara kopplade under fåglarnas häckningstid från mars till
      augusti. Man får inte ta med sig hunden till lekplatser och allmänna badstränder ens fast den är
      kopplad.
    sentences:
    - id: hb-c11-u0236-s001
      start: 0
      end: 94
    - id: hb-c11-u0236-s002
      start: 95
      end: 200
    - id: hb-c11-u0236-s003
      start: 201
      end: 297
- id: hb-c11-naturens-sakerhet
  title: Säkerhet vid vatten och på is
  blocks:
  - type: paragraph
    id: hb-c11-u0237
    text: Finländarna rör sig mycket till sjöss. Finländarna är också aktiva paddlare och seglare. Säkerheten
      är viktig till sjöss. Följ väderleksrapporterna och använd alltid en flytväst i rätt storlek.
    sentences:
    - id: hb-c11-u0237-s001
      start: 0
      end: 38
    - id: hb-c11-u0237-s002
      start: 39
      end: 88
    - id: hb-c11-u0237-s003
      start: 89
      end: 121
    - id: hb-c11-u0237-s004
      start: 122
      end: 193
  - type: paragraph
    id: hb-c11-u0238
    text: På vintern fryser de flesta vattendrag till i Finland. På isen kan du till exempel promenera,
      åka skridskor eller skidor eller pimpla. Man är alltid utsatt för risker när man färdas på isen
      och det är viktigt att iaktta säkerheten. Ta alltid reda på isens tjockhet och hållbarhet innan
      du går ut på isen.
    sentences:
    - id: hb-c11-u0238-s001
      start: 0
      end: 54
    - id: hb-c11-u0238-s002
      start: 55
      end: 134
    - id: hb-c11-u0238-s003
      start: 135
      end: 231
    - id: hb-c11-u0238-s004
      start: 232
      end: 304
  - type: paragraph
    id: hb-c11-u0239
    text: 'Checklista för den som ska färdas på isen:'
    sentences:
    - id: hb-c11-u0239-s001
      start: 0
      end: 42
  - id: hb-c11-u0241
    type: list
    ordered: false
    items:
    - id: hb-c11-u0240
      text: Då isen fryser håller den inte genast för att gå på.
      sentences:
      - id: hb-c11-u0240-s001
        start: 0
        end: 52
    - id: hb-c11-u0242
      text: Isens tjocklek kan variera även på korta sträckor.
      sentences:
      - id: hb-c11-u0242-s001
        start: 0
        end: 50
    - id: hb-c11-u0243
      text: På våren är det mycket svårt att bedöma isens bärkraft och då är det bäst att undvika att
        färdas på isen.
      sentences:
      - id: hb-c11-u0243-s001
        start: 0
        end: 105
    - id: hb-c11-u0244
      text: Det viktigaste redskapet för den som färdas på isen är isdubbar. Utan dem är det mycket svårt
        att ta sig upp ur en vak.
      sentences:
      - id: hb-c11-u0244-s001
        start: 0
        end: 64
      - id: hb-c11-u0244-s002
        start: 65
        end: 119
    - id: hb-c11-u0245
      text: Om du inte är säker på att isen håller, gå inte ut på isen.
      sentences:
      - id: hb-c11-u0245-s001
        start: 0
        end: 59
- id: hb-c11-trafik
  title: Trafikregler och trafiksäkerhet
  blocks:
  - type: paragraph
    id: hb-c11-u0246
    text: Finland har högertrafik.
    sentences:
    - id: hb-c11-u0246-s001
      start: 0
      end: 24
  - type: paragraph
    id: hb-c11-u0247
    text: I Finland är det vanligt att människor förflyttar sig korta sträckor till fots. Städerna är
      planerade så att det är tryggt att gå. Det finns övergångsställen med jämna mellanrum för fotgängare
      som ska korsa gatan, och ofta finns det också trafikljus. På landsbygden finns det inte så ofta
      trottoarer längs vägarna. Då ska fotgängare gå längs den vänstra kanten av körbanan.
    sentences:
    - id: hb-c11-u0247-s001
      start: 0
      end: 79
    - id: hb-c11-u0247-s002
      start: 80
      end: 130
    - id: hb-c11-u0247-s003
      start: 131
      end: 250
    - id: hb-c11-u0247-s004
      start: 251
      end: 314
    - id: hb-c11-u0247-s005
      start: 315
      end: 373
  - type: paragraph
    id: hb-c11-u0248
    text: Ett annat bra sätt att förflytta sig är med cykel. I Finland cyklar en del till jobbet eller
      skolan också på vintern. Endast små barn får cykla på trottoaren. Övriga cyklar på en separat cykelbana
      eller ett separat cykelfält. Om sådana saknas cyklar man på körbanan. När man cyklar ska man använda
      cykelhjälm, och när det är mörkt ska cykeln ha en lykta.
    sentences:
    - id: hb-c11-u0248-s001
      start: 0
      end: 50
    - id: hb-c11-u0248-s002
      start: 51
      end: 117
    - id: hb-c11-u0248-s003
      start: 118
      end: 158
    - id: hb-c11-u0248-s004
      start: 159
      end: 225
    - id: hb-c11-u0248-s005
      start: 226
      end: 266
    - id: hb-c11-u0248-s006
      start: 267
      end: 354
  - type: paragraph
    id: hb-c11-u0249
    text: De största städerna i Finland har bra kollektivtrafik. Med kollektivtrafik avses bussar, lokaltåg,
      metro och spårvagn. Man kan köpa engångsbiljetter, seriebiljetter eller månadsbiljetter till kollektivtrafiken
      och använda den för att ta sig till jobbet eller skolan. I små städer och på landsbygden finns det
      färre kollektivtrafiklinjer och de trafikeras mer sällan.
    sentences:
    - id: hb-c11-u0249-s001
      start: 0
      end: 54
    - id: hb-c11-u0249-s002
      start: 55
      end: 118
    - id: hb-c11-u0249-s003
      start: 119
      end: 266
    - id: hb-c11-u0249-s004
      start: 267
      end: 366
  - type: paragraph
    id: hb-c11-u0250
    text: I Finland kan man ta sig till de flesta ställen med buss, tåg, flyg eller båt. En del av trafiken
      går endast sällan.
    sentences:
    - id: hb-c11-u0250-s001
      start: 0
      end: 78
    - id: hb-c11-u0250-s002
      start: 79
      end: 116
  - type: paragraph
    id: hb-c11-u0251
    text: Egen bil, bensin, försäkringsavgifter, skatter och bilservice är dyra i Finland. I de större
      städerna behöver man vanligtvis ingen egen bil. På mindre orter kan en egen bil ändå vara nödvändig.
    sentences:
    - id: hb-c11-u0251-s001
      start: 0
      end: 80
    - id: hb-c11-u0251-s002
      start: 81
      end: 140
    - id: hb-c11-u0251-s003
      start: 141
      end: 193
  - type: paragraph
    id: hb-c11-u0252
    text: När man kör med bil i trafiken måste man noggrant följa de trafikregler som gäller i Finland.
      Polisen övervakar bilisterna och ger böter om de bryter mot reglerna. Man får inte köra bil om man
      har druckit alkohol. Gränsvärdet för att få köra är 0,5 promille.
    sentences:
    - id: hb-c11-u0252-s001
      start: 0
      end: 93
    - id: hb-c11-u0252-s002
      start: 94
      end: 163
    - id: hb-c11-u0252-s003
      start: 164
      end: 213
    - id: hb-c11-u0252-s004
      start: 214
      end: 258
  - type: paragraph
    id: hb-c11-u0253
    text: Om du har en bil måste du teckna en trafikförsäkring (liikennevakuutus). Trafikförsäkringen
      tecknar du hos ett försäkringsbolag.
    sentences:
    - id: hb-c11-u0253-s001
      start: 0
      end: 72
    - id: hb-c11-u0253-s002
      start: 73
      end: 128
  - type: paragraph
    id: hb-c11-u0254
    text: I Finland måste bilen besiktigas och registreras. Besiktningar görs på besiktningsstationer.
      Registreringen kan göras till exempel på besiktningsstationer, vid försäkringsbolag och hos bilhandlare.
      Du kan även registrera bilen på Traficoms webbplats.
    sentences:
    - id: hb-c11-u0254-s001
      start: 0
      end: 49
    - id: hb-c11-u0254-s002
      start: 50
      end: 92
    - id: hb-c11-u0254-s003
      start: 93
      end: 197
    - id: hb-c11-u0254-s004
      start: 198
      end: 250
  - type: paragraph
    id: hb-c11-u0255
    text: Du kan köra i Finland endast om du har ett giltigt körkort.
    sentences:
    - id: hb-c11-u0255-s001
      start: 0
      end: 59
  - type: paragraph
    id: hb-c11-u0256
    text: I Finland accepteras alla körkort som är beviljade i stater som Finland har erkänt. Ett utländskt
      körkort accepteras inte om kortinnehavaren har bott i Finland vid den tidpunkt som kortet beviljades.
    sentences:
    - id: hb-c11-u0256-s001
      start: 0
      end: 83
    - id: hb-c11-u0256-s002
      start: 84
      end: 199
  - type: paragraph
    id: hb-c11-u0257
    text: Texten på körkortet ska vara skriven med latinska bokstäver eller så ska du ha med dig en översättning
      av körkortet till finska, svenska eller engelska. Du måste också uppfylla de ålders- och hälsokrav
      för körkort som gäller i Finland.
    sentences:
    - id: hb-c11-u0257-s001
      start: 0
      end: 152
    - id: hb-c11-u0257-s002
      start: 153
      end: 235
  - type: paragraph
    id: hb-c11-u0258
    text: Om du har ett körkort som beviljats i ett EU- eller EES-land, kan du köra med detta kort i Finland
      så länge kortet är giltigt. Du kan du byta ut kortet mot ett finländskt körkort om du bor stadigvarande
      i Finland eller har studerat i Finland i minst sex månader. Ett körkort som ger rätt att framföra
      personbil måste bytas mot ett finskt körkort inom två år från att dess giltighetstid har gått ut.
      Om kortets giltighetstid gått ut behöver du ett läkarutlåtande.
    sentences:
    - id: hb-c11-u0258-s001
      start: 0
      end: 126
    - id: hb-c11-u0258-s002
      start: 127
      end: 262
    - id: hb-c11-u0258-s003
      start: 263
      end: 398
    - id: hb-c11-u0258-s004
      start: 399
      end: 462
  - type: paragraph
    id: hb-c11-u0259
    text: Om du har ett körkort som utfärdats i ett land utanför EU som är anslutet till Genève- eller
      Wienkonventionerna om vägtrafik, kan du köra med detta kort högst två år i Finland. Med ett körkort
      som utfärdats i Hongkong, Macao eller Taiwan får du likaså köra bil i högst två år. Du kan byta
      ditt utländska körkort mot ett finskt körkort när du bor stadigvarande i Finland. När du har flyttat
      till Finland och bor här stadigvarande har du två år på dig att byta ditt körkort mot ett finskt
      körkort. Ditt körkort måste vara giltigt vid den tidpunkt när du byter det. Du behöver också ett
      läkarutlåtande. Om du inte byter ut ditt kort i tid eller ditt kort inte längre gäller, måste du
      avlägga förarexamen (teori- och körprov) i Finland.
    sentences:
    - id: hb-c11-u0259-s001
      start: 0
      end: 176
    - id: hb-c11-u0259-s002
      start: 177
      end: 276
    - id: hb-c11-u0259-s003
      start: 277
      end: 370
    - id: hb-c11-u0259-s004
      start: 371
      end: 495
    - id: hb-c11-u0259-s005
      start: 496
      end: 562
    - id: hb-c11-u0259-s006
      start: 563
      end: 599
    - id: hb-c11-u0259-s007
      start: 600
      end: 732
  - type: paragraph
    id: hb-c11-u0260
    text: Om du har ett körkort som utfärdats i ett land som inte är anslutet till Genève- eller Wienkonventionerna
      om vägtrafik, får du köra bil med detta körkort under ett års tid efter att ha blivit registrerad
      i befolkningsdatasystemet i Finland. Därefter måste du avlägga förarexamen i Finland om du vill
      fortsätta köra bil.
    sentences:
    - id: hb-c11-u0260-s001
      start: 0
      end: 240
    - id: hb-c11-u0260-s002
      start: 241
      end: 319
- id: hb-c11-flyttsaker
  title: Flyttsaker och bil från utlandet
  blocks:
  - type: paragraph
    id: hb-c11-u0261
    text: Vanligen behöver du inte betala tullavgift eller skatt på de föremål som du tar med dig till
      Finland som flyttsaker.
    sentences:
    - id: hb-c11-u0261-s001
      start: 0
      end: 116
  - type: paragraph
    id: hb-c11-u0262
    text: Om du flyttar till Finland från ett land utanför EU (eller från ett land utanför EU:s tull-
      och skatteområde) måste du dock göra en tulldeklaration för flyttsakerna till de finländska tullmyndigheterna.
      Flyttsakerna ska införas till Finland inom 12 månader efter flyttningen.
    sentences:
    - id: hb-c11-u0262-s001
      start: 0
      end: 202
    - id: hb-c11-u0262-s002
      start: 203
      end: 275
  - type: paragraph
    id: hb-c11-u0263
    text: Om du flyttar till Finland från ett land inom EU:s tull- och skatteområde behöver du inte göra
      en tulldeklaration.
    sentences:
    - id: hb-c11-u0263-s001
      start: 0
      end: 114
  - type: paragraph
    id: hb-c11-u0264
    text: Om du tar med dig en bil från ett land utanför EU (eller utanför EU:s tull- och skatteområde)
      ska du göra en tullklarering så snart bilen anländer till Finland.
    sentences:
    - id: hb-c11-u0264-s001
      start: 0
      end: 160
  - type: paragraph
    id: hb-c11-u0265
    text: Om du tar med dig en bil från ett land inom EU:s tull- och skatteområde behöver du inte göra
      en tullklarering.
    sentences:
    - id: hb-c11-u0265-s001
      start: 0
      end: 110
  - type: paragraph
    id: hb-c11-u0266
    text: 'Innan du kan köra bilen i Finland måste du:'
    sentences:
    - id: hb-c11-u0266-s001
      start: 0
      end: 43
  - id: hb-c11-u0268
    type: list
    ordered: false
    items:
    - id: hb-c11-u0267
      text: få ett förflyttningstillstånd om bilen inte har giltig registrering i ett EU- eller EES-land
      sentences:
      - id: hb-c11-u0267-s001
        start: 0
        end: 92
    - id: hb-c11-u0269
      text: se till att bilen har en trafikförsäkring som är giltig i Finland
      sentences:
      - id: hb-c11-u0269-s001
        start: 0
        end: 65
    - id: hb-c11-u0270
      text: göra en anmälan om ibruktagande till Skatteförvaltningen
      sentences:
      - id: hb-c11-u0270-s001
        start: 0
        end: 56
- id: hb-c11-brandsakerhet
  title: Brandsäkerhet och trygghet i hemmet
  blocks:
  - type: paragraph
    id: hb-c11-u0348
    text: Enligt Finlands lag ska det finnas en brandvarnare i alla bostäder.
    sentences:
    - id: hb-c11-u0348-s001
      start: 0
      end: 67
  - id: hb-c11-u0272
    type: list
    ordered: false
    items:
    - id: hb-c11-u0271
      text: Se till att det finns tillräckligt många brandvarnare i ditt hem. Brandvarnare säljs i varuhus
        och järnaffärer. En brandvarnare räcker till 60 kvadratmeter. Om ditt hem är till exempel 65 kvadratmeter
        stort behöver du två brandvarnare. Om ditt hem har fler än en våning måste du räkna ytan separat
        för varje våning. Det bör finnas en brandvarnare på varje våning.
      sentences:
      - id: hb-c11-u0271-s001
        start: 0
        end: 65
      - id: hb-c11-u0271-s002
        start: 66
        end: 111
      - id: hb-c11-u0271-s003
        start: 112
        end: 156
      - id: hb-c11-u0271-s004
        start: 157
        end: 235
      - id: hb-c11-u0271-s005
        start: 236
        end: 315
      - id: hb-c11-u0271-s006
        start: 316
        end: 363
    - id: hb-c11-u0273
      text: Kontrollera regelbundet att brandvarnaren fungerar. Byt batterier vid behov, gärna en gång
        per år.
      sentences:
      - id: hb-c11-u0273-s001
        start: 0
        end: 51
      - id: hb-c11-u0273-s002
        start: 52
        end: 98
    - id: hb-c11-u0274
      text: Det finns ofta en bastu i finländska hem. Även om du inte använder bastun får du aldrig placera
        något på bastuugnen, eftersom detta kan orsaka en brand. Torka till exempel inte tvätten ovanför
        eller i närheten av bastuugnen. Använd inte bastun som förråd. Stäng alltid av en elektrisk bastuugn
        efter användning. Avlägsna säkringen om du inte använder ett elektriskt bastuaggregat på en lång
        tid.
      sentences:
      - id: hb-c11-u0274-s001
        start: 0
        end: 41
      - id: hb-c11-u0274-s002
        start: 42
        end: 152
      - id: hb-c11-u0274-s003
        start: 153
        end: 224
      - id: hb-c11-u0274-s004
        start: 225
        end: 255
      - id: hb-c11-u0274-s005
        start: 256
        end: 311
      - id: hb-c11-u0274-s006
        start: 312
        end: 395
    - id: hb-c11-u0275
      text: När du går hemifrån, kom ihåg att kontrollera att spisen och ugnen och till exempel strykjärnet
        är avstängda.
      sentences:
      - id: hb-c11-u0275-s001
        start: 0
        end: 109
    - id: hb-c11-u0276
      text: Det är bra att ha en brandsläckare hemma. I vissa höghus finns det också en brandsläckare
        i trappuppgången. Ta reda på var den närmaste brandsläckaren finns.
      sentences:
      - id: hb-c11-u0276-s001
        start: 0
        end: 41
      - id: hb-c11-u0276-s002
        start: 42
        end: 107
      - id: hb-c11-u0276-s003
        start: 108
        end: 157
    - id: hb-c11-u0277
      text: Se till att du har en släckningsfilt hemma. Det är bra att förvara filten till exempel i närheten
        av spisen.
      sentences:
      - id: hb-c11-u0277-s001
        start: 0
        end: 43
      - id: hb-c11-u0277-s002
        start: 44
        end: 108
    - id: hb-c11-u0278
      text: Lämna inte mat på en het spis utan uppsikt. Var särskilt försiktig om du lagar mat på natten.
        Laga inte mat om du är berusad.
      sentences:
      - id: hb-c11-u0278-s001
        start: 0
        end: 43
      - id: hb-c11-u0278-s002
        start: 44
        end: 93
      - id: hb-c11-u0278-s003
        start: 94
        end: 125
    - id: hb-c11-u0279
      text: Förvara inte föremål på spisen. Barn, husdjur eller du själv kan av misstag vrida på spisen.
        Då kan sakerna som ligger på spisen fatta eld.
      sentences:
      - id: hb-c11-u0279-s001
        start: 0
        end: 31
      - id: hb-c11-u0279-s002
        start: 32
        end: 92
      - id: hb-c11-u0279-s003
        start: 93
        end: 139
    - id: hb-c11-u0280
      text: Om fett börjar brinna när du lagar mat, kväv elden med till exempel ett kastrullock eller
        med en släckningsfilt. Använd inte vatten.
      sentences:
      - id: hb-c11-u0280-s001
        start: 0
        end: 112
      - id: hb-c11-u0280-s002
        start: 113
        end: 132
    - id: hb-c11-u0281
      text: Kom ihåg att stänga av elapparater efter användning. Strykjärnet ska också kopplas loss från
        vägguttaget.
      sentences:
      - id: hb-c11-u0281-s001
        start: 0
        end: 52
      - id: hb-c11-u0281-s002
        start: 53
        end: 105
    - id: hb-c11-u0282
      text: Använd inte elapparater som är i dåligt skick eller vars sladd är trasig.
      sentences:
      - id: hb-c11-u0282-s001
        start: 0
        end: 73
    - id: hb-c11-u0283
      text: Om en elapparat börjar brinna, använd inte vatten. Kväv elden med till exempel en brandsläckare.
      sentences:
      - id: hb-c11-u0283-s001
        start: 0
        end: 50
      - id: hb-c11-u0283-s002
        start: 51
        end: 96
    - id: hb-c11-u0284
      text: Om du har elektriska värmeelement eller värmeaggregat hemma, lägg inte tyger, kläder eller
        något annat på dem.
      sentences:
      - id: hb-c11-u0284-s001
        start: 0
        end: 110
    - id: hb-c11-u0285
      text: Rök inte inomhus.
      sentences:
      - id: hb-c11-u0285-s001
        start: 0
        end: 17
    - id: hb-c11-u0286
      text: Lämna inte brinnande ljus utan uppsikt. Tänd inte ljus i närheten av till exempel gardinerna,
        ens om du själv är i rummet.
      sentences:
      - id: hb-c11-u0286-s001
        start: 0
        end: 39
      - id: hb-c11-u0286-s002
        start: 40
        end: 122
  - id: hb-c11-u0288
    type: list
    ordered: false
    items:
    - id: hb-c11-u0287
      text: Om ett vattenläckage uppstår i ditt hem, försök stänga vattenledningens avstängningsventil.
        Om du bor i höghus eller radhus, anmäl läckaget genast till journumret för husets servicebolag.
        Om du bor i villa, kontakta en jourhavande rörfirma.
      sentences:
      - id: hb-c11-u0287-s001
        start: 0
        end: 91
      - id: hb-c11-u0287-s002
        start: 92
        end: 187
      - id: hb-c11-u0287-s003
        start: 188
        end: 240
  - id: hb-c11-u0290
    type: list
    ordered: false
    items:
    - id: hb-c11-u0289
      text: Om du har ett säkerhetslås i ditt hem, lås det alltid då du inte är hemma.
      sentences:
      - id: hb-c11-u0289-s001
        start: 0
        end: 74
    - id: hb-c11-u0291
      text: Lås inte säkerhetslåset när du är hemma.
      sentences:
      - id: hb-c11-u0291-s001
        start: 0
        end: 40
    - id: hb-c11-u0292
      text: Om någon bryter in sig i ditt hem, ring nödnumret 112.
      sentences:
      - id: hb-c11-u0292-s001
        start: 0
        end: 54
  - type: paragraph
    id: hb-c11-u0293
    text: I Finland är husen täta för att det ska vara varmt inne på vintern. Täta hus tål inte fukt,
      utan den kan snabbt orsaka problem i väggar och golv. Därför får man inte använda så mycket vatten
      när man städar golv och väggar. Om de blir våta måste de torkas noggrant. I bostäderna finns ventilationsventiler
      som för ut fuktig luft. Ventilerna får inte stängas, utan måste hållas öppna och rena året om.
    sentences:
    - id: hb-c11-u0293-s001
      start: 0
      end: 67
    - id: hb-c11-u0293-s002
      start: 68
      end: 145
    - id: hb-c11-u0293-s003
      start: 146
      end: 222
    - id: hb-c11-u0293-s004
      start: 223
      end: 264
    - id: hb-c11-u0293-s005
      start: 265
      end: 328
    - id: hb-c11-u0293-s006
      start: 329
      end: 399
  - type: paragraph
    id: hb-c11-u0294
    text: Om det uppstår en brand i huset ska man genast ringa nödnumret. I höghus ska man inte lämna
      bostaden om det finns rök i trappuppgången. Man får inte använda hissen om det brinner i huset.
    sentences:
    - id: hb-c11-u0294-s001
      start: 0
      end: 63
    - id: hb-c11-u0294-s002
      start: 64
      end: 135
    - id: hb-c11-u0294-s003
      start: 136
      end: 187
  - type: paragraph
    id: hb-c11-u0295
    text: Det är viktigt att alla som bor i bostaden, också barnen, vet hur de ska göra om det uppstår
      en brand hemma. Det är också viktigt att det inte finns till exempel möbler framför balkongdörren,
      så att man vid behov enkelt kan gå ut genom den.
    sentences:
    - id: hb-c11-u0295-s001
      start: 0
      end: 108
    - id: hb-c11-u0295-s002
      start: 109
      end: 240
- id: hb-c11-nodsituationer
  title: Nödsituationer och 112
  blocks:
  - type: paragraph
    id: hb-c11-u0296
    text: I Finland är nödnumret 112.
    sentences:
    - id: hb-c11-u0296-s001
      start: 0
      end: 27
  - type: paragraph
    id: hb-c11-u0297
    text: Man får ringa nödnumret bara om det är fråga om en akut nödsituation. Man kan ringa nödnumret
      om någons liv, hälsa, egendom eller omgivning är i fara. Via nödnumret kan man kalla polisen, brandkåren,
      en ambulans eller en social myndighet till platsen. Nödcentralen avgör huruvida hjälp behövs till
      platsen och vilken myndighet som kommer för att hjälpa i vilken situation. Det kostar ingenting
      att ringa nödnumret.
    sentences:
    - id: hb-c11-u0297-s001
      start: 0
      end: 69
    - id: hb-c11-u0297-s002
      start: 70
      end: 150
    - id: hb-c11-u0297-s003
      start: 151
      end: 251
    - id: hb-c11-u0297-s004
      start: 252
      end: 372
    - id: hb-c11-u0297-s005
      start: 373
      end: 414
  - type: paragraph
    id: hb-c11-u0298
    text: 'Anvisningar för att ringa nödnumret:'
    sentences:
    - id: hb-c11-u0298-s001
      start: 0
      end: 36
  - id: hb-c11-u0300
    type: list
    ordered: false
    items:
    - id: hb-c11-u0299
      text: Berätta vad som hänt.
      sentences:
      - id: hb-c11-u0299-s001
        start: 0
        end: 21
    - id: hb-c11-u0301
      text: Svara på frågorna som ställs.
      sentences:
      - id: hb-c11-u0301-s001
        start: 0
        end: 29
    - id: hb-c11-u0302
      text: Uppge den exakta adressen och namnet på kommunen/staden där hjälp behövs.
      sentences:
      - id: hb-c11-u0302-s001
        start: 0
        end: 73
    - id: hb-c11-u0303
      text: Följ anvisningarna som ges.
      sentences:
      - id: hb-c11-u0303-s001
        start: 0
        end: 27
    - id: hb-c11-u0304
      text: Avsluta inte samtalet innan du får lov att göra det.
      sentences:
      - id: hb-c11-u0304-s001
        start: 0
        end: 52
  - type: paragraph
    id: hb-c11-u0305
    text: Man ska berätta för nödcentralen så exakt som möjligt från vilken adress man ringer. Då kommer
      hjälpen fram till rätt ställe. Med hjälp av tekniken kan nödcentralen spåra samtalet, men operatören
      vet inte till exempel från vilken bostad i ett höghus som samtalet kommer. Det måste man själv kunna
      berätta.
    sentences:
    - id: hb-c11-u0305-s001
      start: 0
      end: 84
    - id: hb-c11-u0305-s002
      start: 85
      end: 125
    - id: hb-c11-u0305-s003
      start: 126
      end: 270
    - id: hb-c11-u0305-s004
      start: 271
      end: 305
  - type: paragraph
    id: hb-c11-u0306
    text: Nödcentralen kan vid behov använda en tolk för samtalet. Om man behöver en tolk måste man genast
      i början av samtalet tydligt säga till vilket språk samtalet ska tolkas. Man får inte avsluta samtalet
      medan nödcentralsoperatören kopplar samtalet till tolktjänsten.
    sentences:
    - id: hb-c11-u0306-s001
      start: 0
      end: 56
    - id: hb-c11-u0306-s002
      start: 57
      end: 169
    - id: hb-c11-u0306-s003
      start: 170
      end: 263
  - type: paragraph
    id: hb-c11-u0307
    text: Man får inte ringa nödnumret i onödan.
    sentences:
    - id: hb-c11-u0307-s001
      start: 0
      end: 38
  - type: paragraph
    id: hb-c11-u0308
    text: Ring inte nödnumret
    sentences:
    - id: hb-c11-u0308-s001
      start: 0
      end: 19
  - id: hb-c11-u0310
    type: list
    ordered: false
    items:
    - id: hb-c11-u0309
      text: när det är fråga om ett vanligt sjukdomsfall, till exempel influensa. Då kan man ringa till
        exempel hälsovårdscentralen
      sentences:
      - id: hb-c11-u0309-s001
        start: 0
        end: 69
      - id: hb-c11-u0309-s002
        start: 70
        end: 119
    - id: hb-c11-u0311
      text: när du vill fråga någonting allmänt om sjukvården, trafiken eller brandsäkerheten. Då är det
        inte fråga om något nödfall och man får inte ringa nödnumret
      sentences:
      - id: hb-c11-u0311-s001
        start: 0
        end: 82
      - id: hb-c11-u0311-s002
        start: 83
        end: 153
    - id: hb-c11-u0312
      text: på grund av ett elavbrott eller en trafikstockning, om ingen är i fara. Nödcentralen ansvarar
        inte för sådana ärenden.
      sentences:
      - id: hb-c11-u0312-s001
        start: 0
        end: 71
      - id: hb-c11-u0312-s002
        start: 72
        end: 118
  - type: paragraph
    id: hb-c11-u0313
    text: Ring inte nödnumret om ärendet inte är brådskande. Du ska inte ringa nödnumret vid vanliga sjukdomsfall.
      Du ska inte heller ringa nödnumret om du vill fråga polisen (poliisi) till exempel om ett tillståndsärende.
      Onödiga samtal kan orsaka att hjälpen kommer för sent i verkliga nödsituationer. Du kan straffas
      för att ha missbrukat nödnumret.
    sentences:
    - id: hb-c11-u0313-s001
      start: 0
      end: 50
    - id: hb-c11-u0313-s002
      start: 51
      end: 104
    - id: hb-c11-u0313-s003
      start: 105
      end: 212
    - id: hb-c11-u0313-s004
      start: 213
      end: 293
    - id: hb-c11-u0313-s005
      start: 294
      end: 342
  - type: paragraph
    id: hb-c11-u0314
    text: Samtalet besvaras av en utbildad nödcentraloperatör. Han eller hon ställer dig frågor och bedömer
      hjälpbehovet. Därefter larmar han eller hon hjälp. Operatören berättar också vad du ska göra. Operatören
      kopplar inte samtalet vidare, så besvara frågorna noga.
    sentences:
    - id: hb-c11-u0314-s001
      start: 0
      end: 52
    - id: hb-c11-u0314-s002
      start: 53
      end: 111
    - id: hb-c11-u0314-s003
      start: 112
      end: 148
    - id: hb-c11-u0314-s004
      start: 149
      end: 191
    - id: hb-c11-u0314-s005
      start: 192
      end: 258
  - type: paragraph
    id: hb-c11-u0315
    text: Du kan ringa nödnumret gratis från alla telefoner. Du behöver inget riktnummer. Du kan ringa
      nödnumret utan riktnummer även om du har ett utländskt mobilabonnemang. Nödnumret 112 fungerar i
      alla EU-länder.
    sentences:
    - id: hb-c11-u0315-s001
      start: 0
      end: 50
    - id: hb-c11-u0315-s002
      start: 51
      end: 79
    - id: hb-c11-u0315-s003
      start: 80
      end: 164
    - id: hb-c11-u0315-s004
      start: 165
      end: 205
  - type: paragraph
    id: hb-c11-u0316
    text: Nödcentralen betjänar på finska, svenska och engelska. Om du inte kan något av dessa språk,
      kan ni använda en telefontolk. Börja med att berätta vilket språk du talar. Vänta tills nödcentralsoperatören
      kopplar in en tolk.
    sentences:
    - id: hb-c11-u0316-s001
      start: 0
      end: 54
    - id: hb-c11-u0316-s002
      start: 55
      end: 122
    - id: hb-c11-u0316-s003
      start: 123
      end: 167
    - id: hb-c11-u0316-s004
      start: 168
      end: 221
  - type: paragraph
    id: hb-c11-u0317
    text: Finland är ett tryggt land där inga allvarliga kriser eller störningar vanligen inträffar. I
      Finland har det dock sedan länge varit brukligt att för säkerhets skull vara förberedd på oväntade
      situationer. Sådana situationer kan till exempel vara elavbrott, avbrott i vattentjänsterna, stormar,
      översvämningar, terrängbränder och pandemier.
    sentences:
    - id: hb-c11-u0317-s001
      start: 0
      end: 90
    - id: hb-c11-u0317-s002
      start: 91
      end: 204
    - id: hb-c11-u0317-s003
      start: 205
      end: 339
  - type: paragraph
    id: hb-c11-u0318
    text: När du är förberedd vet du hur du ska göra om något oväntat inträffar.
    sentences:
    - id: hb-c11-u0318-s001
      start: 0
      end: 70
- id: hb-c11-bibliotek
  title: Bibliotek
  blocks:
  - type: paragraph
    id: hb-c11-u0319
    text: I Finland finns ett kommunalt bibliotek eller stadsbibliotek på alla orter. Biblioteket är en
      plats där du kan låna böcker, läsa tidningar, använda datorn, studera eller delta i olika evenemang.
      Biblioteken är öppna för alla och verksamheten är kostnadsfri.
    sentences:
    - id: hb-c11-u0319-s001
      start: 0
      end: 75
    - id: hb-c11-u0319-s002
      start: 76
      end: 194
    - id: hb-c11-u0319-s003
      start: 195
      end: 257
  - type: paragraph
    id: hb-c11-u0320
    text: På biblioteket kan det även finnas sagotimmar och spel för barn.
    sentences:
    - id: hb-c11-u0320-s001
      start: 0
      end: 64
  - type: paragraph
    id: hb-c11-u0321
    text: I de flesta biblioteken finns en läsesal. Läsesalen är ett tyst rum som passar för läsning eller
      till exempel tyst läxläsning.
    sentences:
    - id: hb-c11-u0321-s001
      start: 0
      end: 41
    - id: hb-c11-u0321-s002
      start: 42
      end: 126
  - type: paragraph
    id: hb-c11-u0322
    text: Du kan också få handledning i datoranvändningen och på vissa bibliotek ordnas finska språkcaféer.
    sentences:
    - id: hb-c11-u0322-s001
      start: 0
      end: 97
  - type: paragraph
    id: hb-c11-u0323
    text: I Finland finns även vetenskapsbibliotek och läroanstalternas bibliotek samt olika slags specialbibliotek.
      Användningen av dem kan vara begränsad, men oftast är de öppna för alla.
    sentences:
    - id: hb-c11-u0323-s001
      start: 0
      end: 106
    - id: hb-c11-u0323-s002
      start: 107
      end: 179
  - type: paragraph
    id: hb-c11-u0324
    text: För att låna material behöver du ett bibliotekskort. Ett sådant får du på biblioteket. Kom ihåg
      att ta med ett ID-kort med bild. Om du inte har en finländsk personbeteckning, kan du få ett bibliotekskort
      som är giltigt en bestämd tid.
    sentences:
    - id: hb-c11-u0324-s001
      start: 0
      end: 52
    - id: hb-c11-u0324-s002
      start: 53
      end: 86
    - id: hb-c11-u0324-s003
      start: 87
      end: 128
    - id: hb-c11-u0324-s004
      start: 129
      end: 234
  - type: paragraph
    id: hb-c11-u0325
    text: Bibliotekskortet är avgiftsfritt. Om du tappar bort kortet, måste du betala för ett nytt kort.
    sentences:
    - id: hb-c11-u0325-s001
      start: 0
      end: 33
    - id: hb-c11-u0325-s002
      start: 34
      end: 94
  - type: paragraph
    id: hb-c11-u0326
    text: Du kan även låna böcker på bokbussarna.
    sentences:
    - id: hb-c11-u0326-s001
      start: 0
      end: 39
  - type: paragraph
    id: hb-c11-u0327
    text: Lånetiden för böckerna är vanligtvis en månad. Kom ihåg att returnera eller förnya dina lån
      i tid. För försenade lån måste du betala en förseningsavgift. Avgiftens storlek beror på hur många
      böcker som är försenade och hur många dagar de är försenade.
    sentences:
    - id: hb-c11-u0327-s001
      start: 0
      end: 46
    - id: hb-c11-u0327-s002
      start: 47
      end: 98
    - id: hb-c11-u0327-s003
      start: 99
      end: 153
    - id: hb-c11-u0327-s004
      start: 154
      end: 251
  - type: paragraph
    id: hb-c11-u0328
    text: På biblioteket kan du låna böcker på klarspråk som är skrivna på lättläst finska. De är även
      lämpliga för studier i det finska språket.
    sentences:
    - id: hb-c11-u0328-s001
      start: 0
      end: 81
    - id: hb-c11-u0328-s002
      start: 82
      end: 135
  - type: paragraph
    id: hb-c11-u0329
    text: På biblioteket kan du även låna tidskrifter, e-böcker samt CD- och DVD-skivor.
    sentences:
    - id: hb-c11-u0329-s001
      start: 0
      end: 78
  - type: paragraph
    id: hb-c11-u0330
    text: Bibliotekets tjänster är kostnadsfria för klienten. Flerspråkiga biblioteket har material på
      över 80 språk. Böcker från Flerspråkiga biblioteket kan lånas från hela Finland.
    sentences:
    - id: hb-c11-u0330-s001
      start: 0
      end: 51
    - id: hb-c11-u0330-s002
      start: 52
      end: 107
    - id: hb-c11-u0330-s003
      start: 108
      end: 173
  - type: paragraph
    id: hb-c11-u0331
    text: I alla kommuner i Finland finns ett bibliotek med ett stort utbud barn- och ungdomsböcker. Barn
      kan med vårdnadshavarens tillstånd få ett eget bibliotekskort.
    sentences:
    - id: hb-c11-u0331-s001
      start: 0
      end: 90
    - id: hb-c11-u0331-s002
      start: 91
      end: 158
- id: hb-c11-fritid
  title: Offentliga fritidstjänster
  blocks:
  - type: paragraph
    id: hb-c11-u0332
    text: På fritiden kan människor utöva aktiviteter som de tycker om. I Finland har både barn och vuxna
      ofta fritidsintressen. Fritidsintressen kan vara både organiserad verksamhet och aktiviteter på
      egen hand. På fritiden använder människorna ofta också olika närtjänster. Sådana är till exempel
      bibliotek, motionstjänster, ungdomsgårdar och invånarhus. Också att besöka olika kulturevenemang
      är ett bra sätt att tillbringa fritiden.
    sentences:
    - id: hb-c11-u0332-s001
      start: 0
      end: 61
    - id: hb-c11-u0332-s002
      start: 62
      end: 118
    - id: hb-c11-u0332-s003
      start: 119
      end: 202
    - id: hb-c11-u0332-s004
      start: 203
      end: 265
    - id: hb-c11-u0332-s005
      start: 266
      end: 346
    - id: hb-c11-u0332-s006
      start: 347
      end: 426
  - type: paragraph
    id: hb-c11-u0333
    text: I Finland har staten som officiellt mål att alla barn och unga ska ha åtminstone en rolig hobby.
      Kommunerna ordnar olika typer av kostnadsfri hobbyverksamhet i samband med skoldagen. Dessa kostnadsfria
      hobbyer kan vara till exempel motions-, musik- eller konstklubbar. Kommunerna ordnar hobbyverksamhet
      för barn också på andra tider, men de kan vara avgiftsbelagda.
    sentences:
    - id: hb-c11-u0333-s001
      start: 0
      end: 96
    - id: hb-c11-u0333-s002
      start: 97
      end: 182
    - id: hb-c11-u0333-s003
      start: 183
      end: 268
    - id: hb-c11-u0333-s004
      start: 269
      end: 365
  - type: paragraph
    id: hb-c11-u0334
    text: Motion och idrott är populära hobbyer, och man kan utöva många idrotts- och motionsgrenar på
      egen hand. Till exempel kan man ta en joggingtur när det passar en själv bäst. Man kan också delta
      i ledd motionsverksamhet i en idrottsförening eller till exempel i kurser vid ett medborgarinstitut.
      Medborgarinstituten ordnar också olika kurser i bildkonst, handarbete och språk som många har som
      hobby att delta i. Föreningsverksamhet är en populär hobby i Finland.
    sentences:
    - id: hb-c11-u0334-s001
      start: 0
      end: 103
    - id: hb-c11-u0334-s002
      start: 104
      end: 171
    - id: hb-c11-u0334-s003
      start: 172
      end: 292
    - id: hb-c11-u0334-s004
      start: 293
      end: 409
    - id: hb-c11-u0334-s005
      start: 410
      end: 460
  - type: paragraph
    id: hb-c11-u0335
    text: I Finland förvaltar kommunerna många lokaler och tjänster som kan användas av alla kommuninvånare.
      Att använda dem är förmånligt eller kostnadsfritt. Utöver kommunerna förvaltar också olika föreningar
      lokaler och tjänster som är öppna för alla.
    sentences:
    - id: hb-c11-u0335-s001
      start: 0
      end: 98
    - id: hb-c11-u0335-s002
      start: 99
      end: 149
    - id: hb-c11-u0335-s003
      start: 150
      end: 244
  - type: paragraph
    id: hb-c11-u0336
    text: I Finland ordnar till exempel idrottsföreningar och privata företag olika typer av idrotts-
      och motionsverksamhet. Också kommunerna erbjuder många olika slags motionstjänster, till exempel
      förmånliga simhalls- och gymtjänster och olika former av gruppträning. Kommunerna förvaltar idrottsplaner
      och inomhushallar, som det ofta är möjligt att hyra för sin egen hobbygrupp.
    sentences:
    - id: hb-c11-u0336-s001
      start: 0
      end: 114
    - id: hb-c11-u0336-s002
      start: 115
      end: 259
    - id: hb-c11-u0336-s003
      start: 260
      end: 371
  - type: paragraph
    id: hb-c11-u0337
    text: Inom kommunernas motionstjänster, till exempel i simhallar, erbjuds i allmänhet sänkta priser
      för barn, pensionärer, studerande och arbetslösa. I en del simhallar är vissa tider reserverade
      endast för kvinnor. I simhallarna finns det också en bastu i anslutning till omklädnings- och tvättrummen.
      Det finns separata bastur för män och kvinnor, och man badar vanligtvis naken.
    sentences:
    - id: hb-c11-u0337-s001
      start: 0
      end: 143
    - id: hb-c11-u0337-s002
      start: 144
      end: 209
    - id: hb-c11-u0337-s003
      start: 210
      end: 296
    - id: hb-c11-u0337-s004
      start: 297
      end: 375
  - type: paragraph
    id: hb-c11-u0338
    text: I bostadsområden och byar finns invånarhus och -lokaler där många olika typer av verksamhet
      ordnas för invånarna i området. Lokalerna kan förvaltas av kommunen eller olika föreningar. Verksamheten
      kan vara till exempel klubbar och fria grupper. Det är ofta möjligt att hyra lokalerna för eget
      bruk, till exempel familjefester.
    sentences:
    - id: hb-c11-u0338-s001
      start: 0
      end: 123
    - id: hb-c11-u0338-s002
      start: 124
      end: 183
    - id: hb-c11-u0338-s003
      start: 184
      end: 244
    - id: hb-c11-u0338-s004
      start: 245
      end: 326
  - type: paragraph
    id: hb-c11-u0339
    text: På sina områden upprätthåller kommunerna också parker och andra grönområden, lekparker för barn
      samt allmänna badstränder. Dessa är platser som är öppna för alla och där människor fritt kan tillbringa
      tid. Även om områdena sköts och underhålls, ansvarar alla som använder dem för att de är prydliga
      och trivsamma. Därför är det viktigt att alla till exempel plockar upp sitt eget skräp.
    sentences:
    - id: hb-c11-u0339-s001
      start: 0
      end: 122
    - id: hb-c11-u0339-s002
      start: 123
      end: 205
    - id: hb-c11-u0339-s003
      start: 206
      end: 313
    - id: hb-c11-u0339-s004
      start: 314
      end: 386
  - type: paragraph
    id: hb-c11-u0340
    text: I Finland finns det många slags hobbyer för barn och unga. Barn och unga kan till exempel idrotta,
      dansa, spela musik, utöva bildkonst eller teater. En del hobbyer är avgiftsbelagda men det finns
      även gratis hobbyer.
    sentences:
    - id: hb-c11-u0340-s001
      start: 0
      end: 58
    - id: hb-c11-u0340-s002
      start: 59
      end: 148
    - id: hb-c11-u0340-s003
      start: 149
      end: 216
  - type: paragraph
    id: hb-c11-u0341
    text: Kommuner, organisationer, medborgarinstitut och privata organisationer ordnar ledd verksamhet
      för barn och unga.
    sentences:
    - id: hb-c11-u0341-s001
      start: 0
      end: 112
  - type: paragraph
    id: hb-c11-u0342
    text: Tjänsterna inom kommunernas ungdomsarbete är avsedda för barn och unga vuxna. Unga kan delta
      i olika klubbar och den öppna verksamheten på ungdomsgårdarna. Ungdomsgården är ett ställe där ungdomarna
      kan tillbringa tid och idka olika aktiviteter. På ungdomsgårdarna ordnas alltid också ledd verksamhet.
      Största delen av verksamheten på ungdomsgårdarna är gratis.
    sentences:
    - id: hb-c11-u0342-s001
      start: 0
      end: 77
    - id: hb-c11-u0342-s002
      start: 78
      end: 155
    - id: hb-c11-u0342-s003
      start: 156
      end: 245
    - id: hb-c11-u0342-s004
      start: 246
      end: 301
    - id: hb-c11-u0342-s005
      start: 302
      end: 361
  - type: paragraph
    id: hb-c11-u0343
    text: På ungdomsgården finns alltid en vuxen, oftast kommunens ungdomsarbetare eller ungdomsledare.
      Åldersgränserna på ungdomsgårdarna varierar. Verksamheten ordnas utifrån ungdomarnas egna önskemål
      och ungdomarna kan själv påverka innehållet.
    sentences:
    - id: hb-c11-u0343-s001
      start: 0
      end: 93
    - id: hb-c11-u0343-s002
      start: 94
      end: 138
    - id: hb-c11-u0343-s003
      start: 139
      end: 237
  - type: paragraph
    id: hb-c11-u0344
    text: Du får mer information om kommunens ungdomsarbete hos ungdomsväsendet i din hemkommun. Också
      många organisationer och församlingar bedriver ungdomsarbete.
    sentences:
    - id: hb-c11-u0344-s001
      start: 0
      end: 86
    - id: hb-c11-u0344-s002
      start: 87
      end: 154
  - type: paragraph
    id: hb-c11-u0345
    text: Folk i Finland är aktiva motionärer och olika motionshobbyer kan hjälpa dig att lära känna människor
      och få nya vänner. Ledd motion ordnas till exempel av olika idrottssällskap som ofta drivs med frivilligarbete.
    sentences:
    - id: hb-c11-u0345-s001
      start: 0
      end: 119
    - id: hb-c11-u0345-s002
      start: 120
      end: 212
  - type: paragraph
    id: hb-c11-u0346
    text: De flesta idrottsplatserna i Finland upprätthålls av kommunerna och de är tillgängliga för alla
      invånare. Du hittar mer information på din hemkommuns webbplats.
    sentences:
    - id: hb-c11-u0346-s001
      start: 0
      end: 105
    - id: hb-c11-u0346-s002
      start: 106
      end: 160
