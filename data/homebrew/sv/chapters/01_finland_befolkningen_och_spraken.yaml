schema_version: 1
id: hb-c01
language: sv
title: Finland, befolkningen och språken
sections:
- id: hb-c01-lage
  title: Finland i Norden
  blocks:
  - type: paragraph
    id: hb-c01-u0001
    text: Finland är ett land i norra Europa där största delen av ytan täcks av skogar och sjöar. Finland
      är ganska stort till ytan, men glest befolkat. Finland är också långt i nord-sydlig riktning, vilket
      innebär att naturförhållandena varierar mycket i olika delar av landet.
    sentences:
    - id: hb-c01-u0001-s001
      start: 0
      end: 87
    - id: hb-c01-u0001-s002
      start: 88
      end: 142
    - id: hb-c01-u0001-s003
      start: 143
      end: 268
  - type: paragraph
    id: hb-c01-u0002
    text: Finland ligger i Nordeuropa och hör till Norden. De övriga nordiska länderna är Sverige, Norge,
      Danmark och Island.
    sentences:
    - id: hb-c01-u0002-s001
      start: 0
      end: 48
    - id: hb-c01-u0002-s002
      start: 49
      end: 115
  - type: paragraph
    id: hb-c01-u0003
    text: Finlands grannländer är Ryssland, Norge, Sverige och Estland. Finland har en lång gemensam landgräns
      med Ryssland i öster. I norr delar Finland gräns med Norge. I väster har Finland en gemensam land-
      och sjögräns med Sverige. I söder på andra sidan Finska viken ligger Estland. Finland har ingen
      gemensam landgräns med Estland.
    sentences:
    - id: hb-c01-u0003-s001
      start: 0
      end: 61
    - id: hb-c01-u0003-s002
      start: 62
      end: 122
    - id: hb-c01-u0003-s003
      start: 123
      end: 160
    - id: hb-c01-u0003-s004
      start: 161
      end: 225
    - id: hb-c01-u0003-s005
      start: 226
      end: 277
    - id: hb-c01-u0003-s006
      start: 278
      end: 327
  - id: hb-c01-u0005
    type: list
    ordered: false
    items:
    - id: hb-c01-u0004
      text: Finlands tidszon är den östeuropeiska tiden EET (GMT +2).
      sentences:
      - id: hb-c01-u0004-s001
        start: 0
        end: 57
    - id: hb-c01-u0006
      text: Finlands areal är 338 432 km².
      sentences:
      - id: hb-c01-u0006-s001
        start: 0
        end: 30
    - id: hb-c01-u0007
      text: Den största sjön heter Saimen.
      sentences:
      - id: hb-c01-u0007-s001
        start: 0
        end: 30
- id: hb-c01-regioner
  title: Landskap, regioner och städer
  blocks:
  - type: paragraph
    id: hb-c01-u0008
    text: De olika områdena i Finland skiljer sig från varandra, vilket beror på olika naturförhållanden.
      Naturförhållandena har påverkat hur tätt människor bor och människornas verksamhet, till exempel
      jordbruket, industrin och byggandet.
    sentences:
    - id: hb-c01-u0008-s001
      start: 0
      end: 95
    - id: hb-c01-u0008-s002
      start: 96
      end: 229
  - type: paragraph
    id: hb-c01-u0009
    text: Nedan finns en kort beskrivning av olika områden i Finland. Indelningen baserar sig inte på
      de administrativa områdena, utan på variationerna när det gäller landskap och naturförhållanden.
    sentences:
    - id: hb-c01-u0009-s001
      start: 0
      end: 59
    - id: hb-c01-u0009-s002
      start: 60
      end: 188
  - type: paragraph
    id: hb-c01-u0010
    text: I Södra Finland är klimatet mildare än i de nordligare delarna av landet. Södra Finland är ett
      flackt område. Sett till klimatet och jordmånen är det Finlands bästa odlingsområde. Det finns fler
      arter av lövträd där än längre norrut i landet.
    sentences:
    - id: hb-c01-u0010-s001
      start: 0
      end: 73
    - id: hb-c01-u0010-s002
      start: 74
      end: 109
    - id: hb-c01-u0010-s003
      start: 110
      end: 179
    - id: hb-c01-u0010-s004
      start: 180
      end: 242
  - type: paragraph
    id: hb-c01-u0011
    text: Södra Finland är Finlands mest tätbefolkade område. Där ligger Finlands största städer, till
      exempel Finlands huvudstad Helsingfors. Helsingfors omges av huvudstadsregionen, som förutom Helsingfors
      inkluderar Esbo, Vanda och Grankulla. Andra städer i Södra Finland är bland annat Åbo, Björneborg,
      Kotka och Tavastehus. En del av området längs kusten i Södra Finland är tvåspråkig, det vill säga
      en del av befolkningen har finska som modersmål, en del svenska. Helsingfors har det största antalet
      svenskspråkiga invånare i Finland.
    sentences:
    - id: hb-c01-u0011-s001
      start: 0
      end: 51
    - id: hb-c01-u0011-s002
      start: 52
      end: 132
    - id: hb-c01-u0011-s003
      start: 133
      end: 235
    - id: hb-c01-u0011-s004
      start: 236
      end: 318
    - id: hb-c01-u0011-s005
      start: 319
      end: 459
    - id: hb-c01-u0011-s006
      start: 460
      end: 530
  - type: paragraph
    id: hb-c01-u0012
    text: Södra Finland har en mångsidig näringsstruktur, som omfattar lantbruk, industri och service.
      Där finns också flera hamnar med goda trafikförbindelser sjövägen ut i världen.
    sentences:
    - id: hb-c01-u0012-s001
      start: 0
      end: 92
    - id: hb-c01-u0012-s002
      start: 93
      end: 172
  - type: paragraph
    id: hb-c01-u0013
    text: I mellersta och östra Finland är vintrarna ofta kallare och har mer snö än i områden som ligger
      närmare kusten. I området finns många sjöar i olika storlekar, och i många av dem finns det öar
      och holmar. Sjöarna omges i allmänhet av barrskog.
    sentences:
    - id: hb-c01-u0013-s001
      start: 0
      end: 111
    - id: hb-c01-u0013-s002
      start: 112
      end: 203
    - id: hb-c01-u0013-s003
      start: 204
      end: 242
  - type: paragraph
    id: hb-c01-u0014
    text: I Insjöfinland finns det flera ganska stora städer, till exempel Tammerfors, Jyväskylä, Kuopio,
      Lahtis och Villmanstrand. På somrarna lockar sjöarna semesterfirare till Insjöfinland, och i området
      finns många sommarstugor. Bland annat turismen och metall- och skogsindustrin är viktiga näringar
      i området.
    sentences:
    - id: hb-c01-u0014-s001
      start: 0
      end: 121
    - id: hb-c01-u0014-s002
      start: 122
      end: 222
    - id: hb-c01-u0014-s003
      start: 223
      end: 305
  - type: paragraph
    id: hb-c01-u0015
    text: Klimatet i Österbotten på den finska västkusten är mildare än i inlandet på grund av närheten
      till havet. Österbotten är ett mycket flackt område. Flera älvar flyter genom de österbottniska
      åkerområdena, som det finns mängder av. Det finns mycket myrmarker särskilt i de norra delarna av
      området.
    sentences:
    - id: hb-c01-u0015-s001
      start: 0
      end: 105
    - id: hb-c01-u0015-s002
      start: 106
      end: 146
    - id: hb-c01-u0015-s003
      start: 147
      end: 229
    - id: hb-c01-u0015-s004
      start: 230
      end: 296
  - type: paragraph
    id: hb-c01-u0016
    text: De största städerna är Uleåborg, Vasa och Seinäjoki. Lantbruket och en mångsidig industri är
      viktiga näringar. Uleåborgsregionen är speciellt känd som ett centrum för teknikindustri. I en del
      kommuner i Österbotten är majoritetsspråket svenska.
    sentences:
    - id: hb-c01-u0016-s001
      start: 0
      end: 52
    - id: hb-c01-u0016-s002
      start: 53
      end: 110
    - id: hb-c01-u0016-s003
      start: 111
      end: 182
    - id: hb-c01-u0016-s004
      start: 183
      end: 244
  - type: paragraph
    id: hb-c01-u0017
    text: I området norr om Insjöfinland i de östra delarna av Finland är vintrarna kalla och mycket snörika.
      Terrängen är mer kuperad och det finns färre sjöar. De höga backarna som täcks av skog kallas skogklädda
      höjder (”vaara” på finska). Skogen består av barrskog.
    sentences:
    - id: hb-c01-u0017-s001
      start: 0
      end: 99
    - id: hb-c01-u0017-s002
      start: 100
      end: 151
    - id: hb-c01-u0017-s003
      start: 152
      end: 232
    - id: hb-c01-u0017-s004
      start: 233
      end: 259
  - type: paragraph
    id: hb-c01-u0018
    text: Befolkningen i området är gles. De största städerna är Joensuu och Kajana. De skogiga landskapen
      lockar turister, och turismen är en viktig näring i området. Också skogsindustrin och annan bioindustri
      och gruvindustrin och teknikindustrin är viktiga näringar.
    sentences:
    - id: hb-c01-u0018-s001
      start: 0
      end: 31
    - id: hb-c01-u0018-s002
      start: 32
      end: 74
    - id: hb-c01-u0018-s003
      start: 75
      end: 157
    - id: hb-c01-u0018-s004
      start: 158
      end: 259
  - type: paragraph
    id: hb-c01-u0019
    text: Den nordligaste delen av Finland är Lappland. I de nordligaste delarna av Lappland är klimatet
      så kallt att träden inte växer, och snön täcker marken i genomsnitt sju månader per år. På andra
      håll i Lappland består landskapet av barrskog och det finns mycket myrar. I Lappland finns det också
      höga, kala fjäll.
    sentences:
    - id: hb-c01-u0019-s001
      start: 0
      end: 45
    - id: hb-c01-u0019-s002
      start: 46
      end: 182
    - id: hb-c01-u0019-s003
      start: 183
      end: 265
    - id: hb-c01-u0019-s004
      start: 266
      end: 310
  - type: paragraph
    id: hb-c01-u0020
    text: Lappland är stort till ytan men det bor lite människor där. Den största staden är Rovaniemi.
      Turismen är en viktig näring, och särskilt på vintern kommer det turister från olika håll i världen
      för att besöka Jultomtens by. I Lappland ligger även samernas hembygdsområde.
    sentences:
    - id: hb-c01-u0020-s001
      start: 0
      end: 59
    - id: hb-c01-u0020-s002
      start: 60
      end: 92
    - id: hb-c01-u0020-s003
      start: 93
      end: 222
    - id: hb-c01-u0020-s004
      start: 223
      end: 270
  - type: paragraph
    id: hb-c01-u0021
    text: Längs kusten i Sydvästra Finland finns det skärgård. Kusten är full av vikar, uddar och små
      öar. Eftersom området ligger i söder och omges av hav, är vintrarna ganska milda och snöfattiga.
    sentences:
    - id: hb-c01-u0021-s001
      start: 0
      end: 52
    - id: hb-c01-u0021-s002
      start: 53
      end: 96
    - id: hb-c01-u0021-s003
      start: 97
      end: 188
  - type: paragraph
    id: hb-c01-u0022
    text: Ett av de stora skärgårdsområdena är Åland. Åland har självstyre, men är en del av Finland.
      Ålands huvudstad är Mariehamn. Viktiga näringar i skärgården är sjöfart och turism. Det enda officiella
      språket på Åland är svenska, och i övrigt är skärgården också delvis ett svenskspråkigt område.
    sentences:
    - id: hb-c01-u0022-s001
      start: 0
      end: 43
    - id: hb-c01-u0022-s002
      start: 44
      end: 91
    - id: hb-c01-u0022-s003
      start: 92
      end: 122
    - id: hb-c01-u0022-s004
      start: 123
      end: 175
    - id: hb-c01-u0022-s005
      start: 176
      end: 291
- id: hb-c01-natur
  title: Natur och friluftsliv
  blocks:
  - type: paragraph
    id: hb-c01-u0023
    text: Finland är ett glesbebyggt land med mycket skogar och sjöar samt orörd natur. Finländarna uppskattar
      naturen och vistas gärna i den. Många människor gillar till exempel fiske, terrängcykling, vinterbadande
      och vandring. Det är inte långt till skogen ens i huvudstaden. Städerna har också många parker och
      andra grönområden där man kan vistas. För finländarna är en snygg och ren natur och miljö viktiga.
      Att skräpa ner anses hänsynslöst och oartigt och man kan också bötfällas för det.
    sentences:
    - id: hb-c01-u0023-s001
      start: 0
      end: 77
    - id: hb-c01-u0023-s002
      start: 78
      end: 132
    - id: hb-c01-u0023-s003
      start: 133
      end: 219
    - id: hb-c01-u0023-s004
      start: 220
      end: 268
    - id: hb-c01-u0023-s005
      start: 269
      end: 342
    - id: hb-c01-u0023-s006
      start: 343
      end: 403
    - id: hb-c01-u0023-s007
      start: 404
      end: 485
  - id: hb-c01-u0028
    type: list
    ordered: false
    items:
    - id: hb-c01-u0027
      text: Finlands nationaldjur är björnen.
      sentences:
      - id: hb-c01-u0027-s001
        start: 0
        end: 33
- id: hb-c01-arstider
  title: Klimat och årstider
  blocks:
  - type: paragraph
    id: hb-c01-u0029
    text: Finland har fyra tydliga årstider. Klimatet varierar mycket i de olika delarna av landet. På
      Finlands sydvästkust varierar dygnsmedeltemperaturen från +17 grader Celsius i juli till –4 grader
      i februari, medan dygnsmedeltemperaturen i nordligaste Finland är cirka +14 °C i juli och –13 °C
      i februari.
    sentences:
    - id: hb-c01-u0029-s001
      start: 0
      end: 34
    - id: hb-c01-u0029-s002
      start: 35
      end: 89
    - id: hb-c01-u0029-s003
      start: 90
      end: 300
  - type: paragraph
    id: hb-c01-u0030
    text: I Finland kommer det regn och snö ganska jämnt under hela året. Hela årets nederbördsmängd är
      i allmänhet 500–650 millimeter. I öster och söder kommer det i genomsnitt aningen mer nederbörd
      än i väster och norr. Mest nederbörd kommer det på sommaren. Då regnar det ofta mycket på en gång.
      Flest dagar med nederbörd är det ändå på hösten och vintern.
    sentences:
    - id: hb-c01-u0030-s001
      start: 0
      end: 63
    - id: hb-c01-u0030-s002
      start: 64
      end: 125
    - id: hb-c01-u0030-s003
      start: 126
      end: 211
    - id: hb-c01-u0030-s004
      start: 212
      end: 250
    - id: hb-c01-u0030-s005
      start: 251
      end: 288
    - id: hb-c01-u0030-s006
      start: 289
      end: 349
  - type: paragraph
    id: hb-c01-u0031
    text: Till följd av klimatförändringen håller Finlands klimat redan på att förändras, och effekterna
      kommer att öka framöver. Temperaturerna stiger och nederbörden ökar, men å andra sidan blir perioderna
      med torka också fler. Perioderna med snö blir kortare särskilt i söder. Om det inte finns snö på
      marken som reflekterar ljuset är vintrarna mörkare.
    sentences:
    - id: hb-c01-u0031-s001
      start: 0
      end: 119
    - id: hb-c01-u0031-s002
      start: 120
      end: 219
    - id: hb-c01-u0031-s003
      start: 220
      end: 269
    - id: hb-c01-u0031-s004
      start: 270
      end: 346
  - type: paragraph
    id: hb-c01-u0032
    text: I norra Finland kan vintern vara kall och mycket snörik. Temperaturen kan ibland vara till och
      med –30 °C. I Södra Finland är det sällan så kallt. Till exempel i Helsingfors ligger temperaturen
      i januari mellan 0 °C och –10 °C den största delen av tiden. Hur lång vintern är varierar i olika
      delar av landet. I den norra delen av Finland, det vill säga Lappland, varar vintern ett halvår,
      medan Södra Finland har vinter en tredjedel av året, i allmänhet från slutet av november till slutet
      av mars. Den ljusa tiden av dygnet är kort på vintern, kortare i norr än i söder. På vintern utövar
      många gärna vintersporter, såsom skridskoåkning, längdåkning och utförsåkning.
    sentences:
    - id: hb-c01-u0032-s001
      start: 0
      end: 56
    - id: hb-c01-u0032-s008
      start: 57
      end: 106
    - id: hb-c01-u0032-s009
      start: 107
      end: 146
    - id: hb-c01-u0032-s003
      start: 147
      end: 254
    - id: hb-c01-u0032-s004
      start: 255
      end: 308
    - id: hb-c01-u0032-s005
      start: 309
      end: 498
    - id: hb-c01-u0032-s006
      start: 499
      end: 571
    - id: hb-c01-u0032-s007
      start: 572
      end: 668
  - type: paragraph
    id: hb-c01-u0033
    text: Våren är den kortaste av årstiderna i Finland. Den varar endast 1,5–2 månader och infaller i
      april–maj. På våren smälter snön och isen, och den ljusa delen av dygnet blir längre. Samtidigt
      börjar en ny växtsäsong. I Finland har växterna bara en växtsäsong, från våren till hösten. Människorna
      följer ofta ivrigt med hur våren framskrider, till exempel när vissa flyttfåglar återvänder till
      landet eller de första blommorna visar sig.
    sentences:
    - id: hb-c01-u0033-s001
      start: 0
      end: 46
    - id: hb-c01-u0033-s002
      start: 47
      end: 103
    - id: hb-c01-u0033-s003
      start: 104
      end: 178
    - id: hb-c01-u0033-s004
      start: 179
      end: 213
    - id: hb-c01-u0033-s005
      start: 214
      end: 280
    - id: hb-c01-u0033-s006
      start: 281
      end: 433
  - type: paragraph
    id: hb-c01-u0034
    text: Sommaren är en varm årstid, som varar i omkring två månader i norr och omkring fyra månader
      i söder. Sommarmånaderna är juni, juli och augusti. Den finska sommaren är ibland het och temperaturen
      stiger över +25 °C. Ibland kan sommaren vara sval och regnig. I Lappland skiner solen dygnet runt
      på sommaren, också på natten. Fenomenet kallas midnattssol. På sommaren vistas människorna mycket
      utomhus och njuter av ljuset och värmen.
    sentences:
    - id: hb-c01-u0034-s001
      start: 0
      end: 100
    - id: hb-c01-u0034-s002
      start: 101
      end: 143
    - id: hb-c01-u0034-s007
      start: 144
      end: 214
    - id: hb-c01-u0034-s008
      start: 215
      end: 256
    - id: hb-c01-u0034-s004
      start: 257
      end: 322
    - id: hb-c01-u0034-s005
      start: 323
      end: 352
    - id: hb-c01-u0034-s006
      start: 353
      end: 431
  - type: paragraph
    id: hb-c01-u0035
    text: Hösten varar omkring två månader i Finland. I söder börjar hösten i september och slutar när
      vintern börjar i slutet av november. I norr börjar hösten redan i slutet av augusti och slutar i
      mitten av oktober. Under hösten blir vädret kallare och den ljusa delen av dygnet blir kortare.
      Trädens löv och växterna vissnar så småningom bort. På hösten skördas åkrarna, och många människor
      plockar gärna bär och svamp i skogen.
    sentences:
    - id: hb-c01-u0035-s001
      start: 0
      end: 43
    - id: hb-c01-u0035-s002
      start: 44
      end: 129
    - id: hb-c01-u0035-s003
      start: 130
      end: 208
    - id: hb-c01-u0035-s004
      start: 209
      end: 285
    - id: hb-c01-u0035-s005
      start: 286
      end: 337
    - id: hb-c01-u0035-s006
      start: 338
      end: 422
  - type: paragraph
    id: hb-c01-u0036
    text: Ett av särdragen i klimatet i Finland jämfört med många andra länder är vintern. Man kan behöva
      vänja sig vid kylan, mörkret och halkan som kännetecknar den finska vintern. Livet fortsätter ändå
      som vanligt också på vintern. Även om särskilt rikliga mängder snö kan störa trafiken, är det mycket
      ovanligt att till exempel skolor stänger på vintern på grund av vädret.
    sentences:
    - id: hb-c01-u0036-s001
      start: 0
      end: 80
    - id: hb-c01-u0036-s002
      start: 81
      end: 172
    - id: hb-c01-u0036-s003
      start: 173
      end: 224
    - id: hb-c01-u0036-s004
      start: 225
      end: 367
  - type: paragraph
    id: hb-c01-u0037
    text: Den mörkaste månaden är december. På årets kortaste dag den 21 eller 22 december är den ljusa
      delen av dagen mindre än sex timmar lång i Helsingfors. I Lappland går solen inte upp alls på vintern,
      vilket kallas polarnatt. Polarnatten varar som kortast ett par dagar och blir längre ju längre norrut
      man kommer. På Finlands nordligaste ort Nuorgam går solen inte upp alls på över sju veckor.
    sentences:
    - id: hb-c01-u0037-s001
      start: 0
      end: 33
    - id: hb-c01-u0037-s002
      start: 34
      end: 149
    - id: hb-c01-u0037-s003
      start: 150
      end: 221
    - id: hb-c01-u0037-s004
      start: 222
      end: 310
    - id: hb-c01-u0037-s005
      start: 311
      end: 390
  - type: paragraph
    id: hb-c01-u0038
    text: Hösten börjar vanligen i slutet av augusti eller början av september. I september och oktober
      är det höstglöd i Finland. På många växter och träd blir löven, som varit gröna på sommaren, gula,
      orange och röda. Höstglöden gör naturen vacker och färggrann.
    sentences:
    - id: hb-c01-u0038-s001
      start: 0
      end: 69
    - id: hb-c01-u0038-s002
      start: 70
      end: 120
    - id: hb-c01-u0038-s003
      start: 121
      end: 209
    - id: hb-c01-u0038-s004
      start: 210
      end: 254
- id: hb-c01-befolkning
  title: Befolkning och urbanisering
  blocks:
  - type: paragraph
    id: hb-c01-u0039
    text: År 2023 bodde det omkring 5,6 miljoner människor i Finland. Största delen av befolkningen bor
      i städer eller nära städer. Minst människor bor det i norra Finland. I Finland bor det människor
      med många olika bakgrunder.
    sentences:
    - id: hb-c01-u0039-s001
      start: 0
      end: 59
    - id: hb-c01-u0039-s002
      start: 60
      end: 121
    - id: hb-c01-u0039-s003
      start: 122
      end: 162
    - id: hb-c01-u0039-s004
      start: 163
      end: 218
  - type: paragraph
    id: hb-c01-u0040
    text: I Finland bor det flest finskspråkiga människor, men också människor som talar många andra språk.
      Minoriteter i Finland är till exempel finlandssvenskar, samer, romer, judar, tatarer, personer som
      talar ryska och personer som talar karelska.
    sentences:
    - id: hb-c01-u0040-s001
      start: 0
      end: 97
    - id: hb-c01-u0040-s002
      start: 98
      end: 241
  - type: paragraph
    id: hb-c01-u0041
    text: År 2020 bodde 73 procent av invånarna i Finland i städer. Jämfört med många andra europeiska
      länder urbaniserades Finland sent. Den snabba urbaniseringen började i Finland först efter andra
      världskriget på 1950-talet.
    sentences:
    - id: hb-c01-u0041-s001
      start: 0
      end: 57
    - id: hb-c01-u0041-s002
      start: 58
      end: 127
    - id: hb-c01-u0041-s003
      start: 128
      end: 217
  - type: paragraph
    id: hb-c01-u0042
    text: Många av städerna i Finland är stora till ytan och har en rätt så liten stadskärna. Utanför
      stadskärnan är byggnaderna låga, och det finns också skog och åkrar på städernas områden. Även Finlands
      största städer är små jämfört med världsmetropolerna.
    sentences:
    - id: hb-c01-u0042-s001
      start: 0
      end: 83
    - id: hb-c01-u0042-s002
      start: 84
      end: 181
    - id: hb-c01-u0042-s003
      start: 182
      end: 249
  - type: paragraph
    id: hb-c01-u0043
    text: Urbaniseringen pågår fortfarande i Finland. När människorna koncentreras till städerna blir
      serviceproduktionen effektivare. Samtidigt har tillgången till service försämrats i de små kommunerna
      och utanför stadskärnorna.
    sentences:
    - id: hb-c01-u0043-s001
      start: 0
      end: 43
    - id: hb-c01-u0043-s002
      start: 44
      end: 124
    - id: hb-c01-u0043-s003
      start: 125
      end: 220
- id: hb-c01-sprak
  title: Nationalspråk och andra språk
  blocks:
  - type: paragraph
    id: hb-c01-u0044
    text: I Finland finns det två nationalspråk, finska och svenska. Omkring 85 procent av finländarna
      hade år 2023 finska som modersmål. De svenskspråkiga i Finland utgjorde omkring fem procent av befolkningen.
    sentences:
    - id: hb-c01-u0044-s001
      start: 0
      end: 58
    - id: hb-c01-u0044-s002
      start: 59
      end: 127
    - id: hb-c01-u0044-s003
      start: 128
      end: 201
  - type: paragraph
    id: hb-c01-u0045
    text: Svenskan som talas i Finland är finlandssvenska. Uttalet skiljer sig något från svenskan i Sverige.
    sentences:
    - id: hb-c01-u0045-s001
      start: 0
      end: 48
    - id: hb-c01-u0045-s002
      start: 49
      end: 99
  - type: paragraph
    id: hb-c01-u0046
    text: Andra språk som använts länge i Finland är de samiska språken, den finländska romanin, karelska
      språket och teckenspråken. De samiska språken är de språk som talas av ursprungsbefolkningen i Lappland,
      och de är officiella språk inom samernas hembygdsområde. I Finland talas många olika språk. Några
      vanliga språk är ryska, estniska, engelska, somaliska och arabiska.
    sentences:
    - id: hb-c01-u0046-s001
      start: 0
      end: 122
    - id: hb-c01-u0046-s002
      start: 123
      end: 257
    - id: hb-c01-u0046-s003
      start: 258
      end: 292
    - id: hb-c01-u0046-s004
      start: 293
      end: 366
  - type: paragraph
    id: hb-c01-u0047
    text: Finlandssvenskar är finländare som talar svenska som sitt modersmål. År 2023 fanns det omkring
      286 000 människor i Finland med svenska som modersmål. Finlandssvenskarna bor i huvudsak i Nyland,
      Österbotten, Åboland och på Åland.
    sentences:
    - id: hb-c01-u0047-s001
      start: 0
      end: 68
    - id: hb-c01-u0047-s002
      start: 69
      end: 149
    - id: hb-c01-u0047-s003
      start: 150
      end: 228
  - type: paragraph
    id: hb-c01-u0048
    text: I Finlands historia har det finska och det svenska språket länge levt sida vid sida. Det nuvarande
      Finlands område var länge en del av Sverige. Därför har Finland två nationalspråk. Finlandssvenskarna
      har en egen språklig och kulturell identitet och i Finland finns det svenskspråkiga skolor, universitet,
      tidningar, radiokanaler, teatrar och organisationer samt en svenskspråkig garnison.
    sentences:
    - id: hb-c01-u0048-s001
      start: 0
      end: 84
    - id: hb-c01-u0048-s002
      start: 85
      end: 143
    - id: hb-c01-u0048-s003
      start: 144
      end: 181
    - id: hb-c01-u0048-s004
      start: 182
      end: 389
- id: hb-c01-folkgrupper
  title: Folkgrupper och urfolk
  blocks:
  - type: paragraph
    id: hb-c01-u0049
    text: Finlands befolkning har under årtusenden blandat sig med människogrupper som kommit hit från
      olika väderstreck. Före det nationella uppvaknandet i början av 1800-talet ansåg man inte att det
      fanns ett enhetligt folk i Finland. Människor som bodde på olika håll i landet upplevde att de i
      huvudsak hörde till sin egen ort eller sitt eget område. Det finns fortfarande skillnader mellan
      olika områden i Finland när det gäller dialekter och seder och bruk.
    sentences:
    - id: hb-c01-u0049-s001
      start: 0
      end: 111
    - id: hb-c01-u0049-s002
      start: 112
      end: 226
    - id: hb-c01-u0049-s003
      start: 227
      end: 344
    - id: hb-c01-u0049-s004
      start: 345
      end: 453
  - type: paragraph
    id: hb-c01-u0050
    text: Samerna är den enda erkända ursprungsbefolkningen inom Europeiska unionen. Ursprungsbefolkning
      avser en människogrupp med starka rötter i de områden som den traditionellt har befolkat och i naturen.
      Gruppen har sina egna språk, seder och traditioner.
    sentences:
    - id: hb-c01-u0050-s001
      start: 0
      end: 74
    - id: hb-c01-u0050-s002
      start: 75
      end: 198
    - id: hb-c01-u0050-s003
      start: 199
      end: 250
  - type: paragraph
    id: hb-c01-u0051
    text: Liksom i många andra europeiska länder har också Finland en romsk minoritet. De första romerna
      kom till Finland för omkring femhundra år sedan. År 2023 fanns det uppskattningsvis 10 000–12 000
      romer i Finland.
    sentences:
    - id: hb-c01-u0051-s001
      start: 0
      end: 76
    - id: hb-c01-u0051-s002
      start: 77
      end: 143
    - id: hb-c01-u0051-s003
      start: 144
      end: 209
  - type: paragraph
    id: hb-c01-u0052
    text: Romerna har ett eget rikt kulturarv, såsom romsk musik, romska seder och bruk, den romska dräkten
      och traditionellt också handarbetskonst. Viktiga aspekter inom seder och bruk är respekt för de
      äldre, gemenskap och familjecentrering. Tidigare levde romerna i Finland ett kringresande liv. Numera
      bor största delen av dem i de största städerna i Finland.
    sentences:
    - id: hb-c01-u0052-s001
      start: 0
      end: 138
    - id: hb-c01-u0052-s002
      start: 139
      end: 233
    - id: hb-c01-u0052-s003
      start: 234
      end: 288
    - id: hb-c01-u0052-s004
      start: 289
      end: 353
  - type: paragraph
    id: hb-c01-u0053
    text: Tatarerna är ett turkfolk och det äldsta muslimska samfundet i Finland. Tatarerna kom till Finland
      ursprungligen från Ryssland i slutet av 1800-talet och början av 1900-talet främst som handelsmän.
    sentences:
    - id: hb-c01-u0053-s001
      start: 0
      end: 71
    - id: hb-c01-u0053-s002
      start: 72
      end: 197
  - type: paragraph
    id: hb-c01-u0054
    text: Judar flyttade till Finland ursprungligen från Ryssland på 1830-talet. De har två församlingar,
      en i Åbo och en i Helsingfors. I Helsingfors finns också ett judiskt daghem och en judisk samskola.
      De finska judarnas modersmål var på 1800-talet till stor del jiddisch och senare svenska. I dag
      talar de finska och flera andra språk som hemspråk.
    sentences:
    - id: hb-c01-u0054-s001
      start: 0
      end: 70
    - id: hb-c01-u0054-s002
      start: 71
      end: 126
    - id: hb-c01-u0054-s003
      start: 127
      end: 195
    - id: hb-c01-u0054-s004
      start: 196
      end: 285
    - id: hb-c01-u0054-s005
      start: 286
      end: 343
  - type: paragraph
    id: hb-c01-u0064
    text: Karelska språket är det språk som är närmast besläktat med finskan.
    sentences:
    - id: hb-c01-u0064-s001
      start: 0
      end: 67
  - type: paragraph
    id: hb-c01-u0055
    text: Personer som talade karelska placerades på olika håll i Finland efter andra världskriget, när
      deras gamla hembygder blev en del av Sovjetunionen till följd av kriget. Karelska talas numera i
      Finland och Ryssland. Personer som talar karelska hör i allmänhet till den ortodoxa kyrkan.
    sentences:
    - id: hb-c01-u0055-s001
      start: 0
      end: 166
    - id: hb-c01-u0055-s002
      start: 167
      end: 212
    - id: hb-c01-u0055-s003
      start: 213
      end: 282
  - type: paragraph
    id: hb-c01-u0056
    text: Under olika perioder i historien har ryssar och ryskspråkiga flyttat till Finland. Sovjetunionens
      fall år 1991 ökade inflyttningen betydligt, och både ryssar och ryskspråkiga flyttade till Finland
      på grund av till exempel arbete, studier eller familjen.
    sentences:
    - id: hb-c01-u0056-s001
      start: 0
      end: 82
    - id: hb-c01-u0056-s002
      start: 83
      end: 253
  - type: paragraph
    id: hb-c01-u0057
    text: Ryssarna och de ryskspråkiga i Finland har alltid varit en komplex folkgrupp. En del av de ryskspråkiga
      eller deras familjemedlemmar är ingermanländare, en del ester eller ukrainare, eller andra utan
      ryskt medborgarskap. År 2023 fanns det uppemot 100 000 ryskspråkiga personer i Finland.
    sentences:
    - id: hb-c01-u0057-s001
      start: 0
      end: 77
    - id: hb-c01-u0057-s002
      start: 78
      end: 220
    - id: hb-c01-u0057-s003
      start: 221
      end: 287
  - type: paragraph
    id: hb-c01-u0058
    text: År 2023 fanns det omkring 50 000 estnisktalande i Finland. Det estniska språket är släkt med
      finskan, och personer som kan finska kan förstå en del estniska och tvärtom. Efter Sovjetunionens
      fall flyttade estnisktalande till Finland i synnerhet av familjeskäl och i egenskap av ingermanländare.
      Efter att Estland anslöt sig till Europeiska unionen år 2004 har många ester flyttat till Finland
      för arbete. I Finland arbetar också många ester som bor permanent i Estland och kanske arbetar i
      både Finland och Estland. Dessutom har ester flyttat från Estland till Finland för att studera både
      före och efter att Estland gick med i EU.
    sentences:
    - id: hb-c01-u0058-s001
      start: 0
      end: 58
    - id: hb-c01-u0058-s002
      start: 59
      end: 169
    - id: hb-c01-u0058-s003
      start: 170
      end: 294
    - id: hb-c01-u0058-s004
      start: 295
      end: 404
    - id: hb-c01-u0058-s005
      start: 405
      end: 515
    - id: hb-c01-u0058-s006
      start: 516
      end: 631
  - type: paragraph
    id: hb-c01-u0059
    text: Det har också uppstått flera nyare etniska, språkliga, religiösa och kulturella minoritetsgrupper
      i Finland. Några av de större grupper som kommit från länder utanför Europa är till exempel somalier,
      kineser, irakier och indier. I Finland bor det många som talar arabiska från olika länder, och alla
      de största religionerna i världen finns numera representerade i Finland.
    sentences:
    - id: hb-c01-u0059-s001
      start: 0
      end: 108
    - id: hb-c01-u0059-s002
      start: 109
      end: 228
    - id: hb-c01-u0059-s003
      start: 229
      end: 372
- id: hb-c01-flyttning
  title: Ut- och invandring
  blocks:
  - type: paragraph
    id: hb-c01-u0060
    text: Tidigare var Finland ett fattigt land, som många flyttade ifrån till andra länder för att hitta
      arbete och få ett bättre liv. På 1800-talet flyttade finländare i synnerhet till Nordamerika. Efter
      andra världskriget började finländarna i allt högre grad flytta från landet till städerna. Många
      flyttade utomlands för arbete, eftersom det inte fanns arbete för alla i Finland. På 1960- och 1970-talen
      flyttade som mest tiotusentals finländare till Sverige varje år för att få arbete. Finländarna var
      länge den största gruppen nyanlända i Sverige.
    sentences:
    - id: hb-c01-u0060-s001
      start: 0
      end: 125
    - id: hb-c01-u0060-s002
      start: 126
      end: 189
    - id: hb-c01-u0060-s003
      start: 190
      end: 286
    - id: hb-c01-u0060-s004
      start: 287
      end: 374
    - id: hb-c01-u0060-s005
      start: 375
      end: 481
    - id: hb-c01-u0060-s006
      start: 482
      end: 544
  - type: paragraph
    id: hb-c01-u0061
    text: En större invandring till Finland började egentligen först efter kalla krigets slut i början
      av 1990-talet. Till följd av Sovjetunionens fall flyttade ryssar och ester samt också somaliska
      asylsökande till Finland.
    sentences:
    - id: hb-c01-u0061-s001
      start: 0
      end: 107
    - id: hb-c01-u0061-s002
      start: 108
      end: 214
  - type: paragraph
    id: hb-c01-u0062
    text: Olika världshändelser har under de senaste årtiondena fört fler människor till Finland från
      olika länder. Finland tog emot små mängder flyktingar på 1970- och 1980-talen först från Chile och
      sedan från Vietnam. Till följd av krigen som ledde till Jugoslaviens upplösning på 1990-talet kom
      det flyktingar från Balkanländerna.
    sentences:
    - id: hb-c01-u0062-s001
      start: 0
      end: 105
    - id: hb-c01-u0062-s002
      start: 106
      end: 210
    - id: hb-c01-u0062-s003
      start: 211
      end: 324
  - type: paragraph
    id: hb-c01-u0063
    text: I dag kommer en stor del av invandrarna till Finland på grund av arbete, studier eller familjen.
      Endast en liten del av de som flyttar till Finland är kvotflyktingar eller kommer till landet som
      asylsökande. År 2023 var de åtta största utländska nationaliteterna i Finland i storleksordning
      ester, ryssar, ukrainare, irakier, kineser, indier, filippinare och afghaner.
    sentences:
    - id: hb-c01-u0063-s001
      start: 0
      end: 96
    - id: hb-c01-u0063-s002
      start: 97
      end: 207
    - id: hb-c01-u0063-s003
      start: 208
      end: 368
