schema_version: 1
id: hb-c03
language: sv
title: Kultur, värderingar och traditioner
sections:
- id: hb-c03-varderingar
  title: Värderingar och olikheter
  blocks:
  - type: paragraph
    id: hb-c03-u0001
    text: Värderingar är något som människor eller människogrupper anser är viktiga och eftersträvar.
      Värderingar hjälper oss att förstå människors val och beteende. Exempel på värderingar är jämställdhet,
      likabehandling och världsfred. Dessa värderingar är tillstånd som människor och samhällen eftersträvar.
      Det finns också värderingar som beskriver hur man önskar att människan skulle bete sig. Sådana värderingar
      är till exempel artighet, ärlighet eller flit.
    sentences:
    - id: hb-c03-u0001-s001
      start: 0
      end: 91
    - id: hb-c03-u0001-s002
      start: 92
      end: 155
    - id: hb-c03-u0001-s003
      start: 156
      end: 226
    - id: hb-c03-u0001-s004
      start: 227
      end: 299
    - id: hb-c03-u0001-s005
      start: 300
      end: 387
    - id: hb-c03-u0001-s006
      start: 388
      end: 453
  - type: paragraph
    id: hb-c03-u0002
    text: Vad människan anser vara viktigt eller önskvärt förändras ofta under livets gång. Också ett
      helt samhälles värderingar kan förändras vid stora förändringar eller kriser. Människor som bor
      i samma samhälle har sinsemellan olika värderingar. Alla invånare i Finland anser inte att samma
      saker är viktiga eller baserar sitt liv på samma värderingar.
    sentences:
    - id: hb-c03-u0002-s001
      start: 0
      end: 81
    - id: hb-c03-u0002-s002
      start: 82
      end: 169
    - id: hb-c03-u0002-s003
      start: 170
      end: 239
    - id: hb-c03-u0002-s004
      start: 240
      end: 346
  - type: paragraph
    id: hb-c03-u0003
    text: I demokratiska samhällen som Finland diskuteras värderingar mycket. I sådana samhällen förekommer
      det samtidigt många olika synpunkter på vad som ska eftersträvas. Till exempel olika politiska partier
      och politiker har sinsemellan olika värderingar som styr deras beslut. Väljarna försöker välja ett
      parti eller en politiker vars värderingar motsvarar deras egna.
    sentences:
    - id: hb-c03-u0003-s001
      start: 0
      end: 67
    - id: hb-c03-u0003-s002
      start: 68
      end: 163
    - id: hb-c03-u0003-s003
      start: 164
      end: 271
    - id: hb-c03-u0003-s004
      start: 272
      end: 363
  - type: paragraph
    id: hb-c03-u0004
    text: I dagens samhälle är värderingarna också knutna till samhällets institutioner. Till exempel
      rättsväsendet upprätthåller värderingar likt jämställdhet och rättvisa och för armén är den nationella
      säkerheten en viktig värdering.
    sentences:
    - id: hb-c03-u0004-s001
      start: 0
      end: 78
    - id: hb-c03-u0004-s002
      start: 79
      end: 226
  - type: paragraph
    id: hb-c03-u0005
    text: De grundläggande värderingar i det finländska samhället som nämns i Finlands grundlag är frihet,
      mänskliga rättigheter och jämställdhet och jämlikhet. Jämlikhet innebär att alla människor är lika
      mycket värda. Ingen får diskrimineras av någon orsak som gäller hens person, till exempel nationellt
      ursprung, handikapp eller religion.
    sentences:
    - id: hb-c03-u0005-s001
      start: 0
      end: 150
    - id: hb-c03-u0005-s002
      start: 151
      end: 209
    - id: hb-c03-u0005-s003
      start: 210
      end: 332
  - type: paragraph
    id: hb-c03-u0006
    text: Målet är att alla människor ska ha möjlighet att få den vård de behöver, studera, få ett yrke
      och ha framgång i livet. Också många lagar säkerställer att dessa värderingar förverkligas. I praktiken
      kan en individs bakgrund eller egenskaper, såsom hudfärg, ålder eller kön, påverka hur jämlikheten
      uppnås.
    sentences:
    - id: hb-c03-u0006-s001
      start: 0
      end: 118
    - id: hb-c03-u0006-s002
      start: 119
      end: 185
    - id: hb-c03-u0006-s003
      start: 186
      end: 304
  - type: paragraph
    id: hb-c03-u0007
    text: I Finland är alla lika inför lagen. Tidigare var det inte alltid så. Till exempel på 1800-talet
      hade medlemmar av de högre stånden andra rättigheter än övriga. Adeln betalade till exempel inte
      skatt och personer som hörde till prästeståndet kunde inte dömas för brott på samma sätt som andra
      människor.
    sentences:
    - id: hb-c03-u0007-s001
      start: 0
      end: 35
    - id: hb-c03-u0007-s002
      start: 36
      end: 68
    - id: hb-c03-u0007-s003
      start: 69
      end: 159
    - id: hb-c03-u0007-s004
      start: 160
      end: 302
- id: hb-c03-tillit
  title: Tillit, jämlikhet och självständighet
  blocks:
  - type: paragraph
    id: hb-c03-u0008
    text: Social jämlikhet och likabehandling skapar tillit mellan människor. Denna tillit skapar i sin
      tur stabilitet och trygghet, men också en bättre ekonomisk konkurrenskraft, effektivitet och innovationsförmåga.
    sentences:
    - id: hb-c03-u0008-s001
      start: 0
      end: 67
    - id: hb-c03-u0008-s002
      start: 68
      end: 206
  - type: paragraph
    id: hb-c03-u0009
    text: Tilliten till andra än till exempel familjemedlemmar eller släktingar tar sig också uttryck
      i det att människorna i Finland aktivt deltar i föreningsverksamhet. Det finns mycket föreningar
      i Finland, och människorna är aktiva i dem för att uppnå gemensamma mål. Föreningsverksamheten i
      sin tur ökar tilliten mellan människorna ytterligare.
    sentences:
    - id: hb-c03-u0009-s001
      start: 0
      end: 160
    - id: hb-c03-u0009-s002
      start: 161
      end: 261
    - id: hb-c03-u0009-s003
      start: 262
      end: 339
  - type: paragraph
    id: hb-c03-u0010
    text: I den finländska kulturen framhävs individualism mer än i många andra kulturer. Individens frihet
      syns starkt i den finländska lagstiftningen.
    sentences:
    - id: hb-c03-u0010-s001
      start: 0
      end: 79
    - id: hb-c03-u0010-s002
      start: 80
      end: 142
  - type: paragraph
    id: hb-c03-u0011
    text: Finländarna värdesätter också sin integritet och privatsfär. Till exempel uppmuntras unga vuxna
      att bli självständiga och flytta hemifrån.
    sentences:
    - id: hb-c03-u0011-s001
      start: 0
      end: 60
    - id: hb-c03-u0011-s002
      start: 61
      end: 138
  - type: paragraph
    id: hb-c03-u0012
    text: Viktiga värderingar för många är också arbete och flit. Att arbeta är en viktig del av människans
      identitet, och flitiga och samvetsgranna arbetstagare uppskattas. Dessutom värdesätts sparsamhet
      och noggrannhet. Också ärlighet är en viktig värdering i Finland.
    sentences:
    - id: hb-c03-u0012-s001
      start: 0
      end: 55
    - id: hb-c03-u0012-s002
      start: 56
      end: 163
    - id: hb-c03-u0012-s003
      start: 164
      end: 211
    - id: hb-c03-u0012-s004
      start: 212
      end: 260
  - type: paragraph
    id: hb-c03-u0013
    text: Social jämlikhet, ärlighet och arbete är en del av de protestantiska värderingarna, som är välbekanta
      också i många andra länder i Nordeuropa.
    sentences:
    - id: hb-c03-u0013-s001
      start: 0
      end: 142
  - type: paragraph
    id: hb-c03-u0014
    text: Utbildning och bildning betraktas också som viktiga värderingar. Bildning bygger på de kunskaper
      och färdigheter man har fått genom sin utbildning. En bildad människa har goda kunskaper och omdömesförmåga,
      funktionsförmåga och förmåga till empati. I Finland värdesätts skola och utbildning samt att de
      är tillgängliga för alla. Att gå i skola och utbilda sig till ett yrke är viktiga steg mot ett gott
      liv. Läraryrket är populärt och respekterat i Finland.
    sentences:
    - id: hb-c03-u0014-s001
      start: 0
      end: 64
    - id: hb-c03-u0014-s002
      start: 65
      end: 147
    - id: hb-c03-u0014-s003
      start: 148
      end: 247
    - id: hb-c03-u0014-s004
      start: 248
      end: 327
    - id: hb-c03-u0014-s005
      start: 328
      end: 406
    - id: hb-c03-u0014-s006
      start: 407
      end: 456
  - type: paragraph
    id: hb-c03-u0015
    text: Viktigt för finländarna är att vistas i naturen, njuta av naturen och vackra landskap, naturens
      mångfald och naturskydd. I exempelvis skogslagstiftningen försöker man också beakta miljöskyddets
      perspektiv. Finlands natur och nationallandskap ingår i många finländares uppfattning om hur det
      är att vara finländare och vad som är värdefullt i Finland.
    sentences:
    - id: hb-c03-u0015-s001
      start: 0
      end: 120
    - id: hb-c03-u0015-s002
      start: 121
      end: 205
    - id: hb-c03-u0015-s003
      start: 206
      end: 350
  - type: paragraph
    id: hb-c03-u0016
    text: Många som bor i Finland lyfter fram en stark försvarsvilja som en viktig värdering. Försvarsvilja
      innebär en vilja att ta hand om och ta ansvar för den egna och den närmaste kretsens och det större
      samhällets säkerhet.
    sentences:
    - id: hb-c03-u0016-s001
      start: 0
      end: 83
    - id: hb-c03-u0016-s002
      start: 84
      end: 218
  - type: paragraph
    id: hb-c03-u0017
    text: Finland har varit en självständig stat i bara drygt 100 år, och i närhistorien finns krig som
      hotade denna självständighet. I Finland har många människor en ganska stark nationalkänsla, det
      vill säga en känsla av samhörighet och stolthet över det egna landet och dess traditioner. Om nationalkänslan
      är stark anser människan att det egna landet är värt att försvara.
    sentences:
    - id: hb-c03-u0017-s001
      start: 0
      end: 123
    - id: hb-c03-u0017-s002
      start: 124
      end: 280
    - id: hb-c03-u0017-s003
      start: 281
      end: 366
- id: hb-c03-seder
  title: Seder, personligt utrymme och samtal
  blocks:
  - type: paragraph
    id: hb-c03-u0018
    text: Sederna och bruken dikterar bland annat vad som enligt en viss människogrupp är hänsynsfullt
      och artigt beteende, hur man hälsar i olika situationer och hur man äter på ett välartat sätt. Seder
      och bruk styr också hur nära man brukar stå en annan person under en vanlig konversation, och hur
      öppet man visar sina känslor.
    sentences:
    - id: hb-c03-u0018-s001
      start: 0
      end: 187
    - id: hb-c03-u0018-s002
      start: 188
      end: 321
  - type: paragraph
    id: hb-c03-u0019
    text: När man pratar om typiska seder och bruk i Finland är det bra att komma ihåg att till exempel
      personer i olika åldrar, invånare på olika orter, personer som talar olika språk och yrkesutbildade
      inom olika branscher kan ha seder som skiljer sig från varandra. Kulturer är aldrig enhetliga, utan
      människornas sätt att fungera och deras uppfattningar om den egna kulturen varierar.
    sentences:
    - id: hb-c03-u0019-s001
      start: 0
      end: 258
    - id: hb-c03-u0019-s002
      start: 259
      end: 378
  - type: paragraph
    id: hb-c03-u0020
    text: Det finns ändå en del seder som ofta nämns som typiska i Finland. Med hjälp av dem kan man få
      en uppfattning om vad någon som kommer till Finland kan förvänta sig att möta i de flesta situationer.
    sentences:
    - id: hb-c03-u0020-s001
      start: 0
      end: 65
    - id: hb-c03-u0020-s002
      start: 66
      end: 196
  - type: paragraph
    id: hb-c03-u0021
    text: I Finland betyder artighet till exempel att var och en tillåts vara i lugn och ro och att man
      inte i onödan lägger sig i andras angelägenheter. Detta kan verka kallt eller likgiltigt. Det handlar
      ändå om att man i hög grad respekterar andras personliga utrymme, lugn och ro och privatliv.
    sentences:
    - id: hb-c03-u0021-s001
      start: 0
      end: 143
    - id: hb-c03-u0021-s002
      start: 144
      end: 183
    - id: hb-c03-u0021-s003
      start: 184
      end: 288
  - type: paragraph
    id: hb-c03-u0022
    text: Att respektera andras personliga utrymme innebär också att man i Finland vanligtvis inte går
      fysiskt så nära andra människor. Här är man van vid att ge andra utrymme till exempel vid busshållplatser,
      i bussen, i hissen, i köer eller vid samtal på tu man hand.
    sentences:
    - id: hb-c03-u0022-s001
      start: 0
      end: 125
    - id: hb-c03-u0022-s002
      start: 126
      end: 259
  - type: paragraph
    id: hb-c03-u0023
    text: Att ge andra utrymme hänger också samman med att man i en dialog låter den andra prata färdigt
      utan att avbryta. Det anses oartigt åtminstone vid mer officiellt umgänge att avbryta eller prata
      över andra. Att prata med vänner är mer avslappnat och att avbryta någon då kan snarare vara ett
      tecken på att samtalspartnern är entusiastisk över det som den andra säger och att hen njuter av
      att prata med hen.
    sentences:
    - id: hb-c03-u0023-s001
      start: 0
      end: 112
    - id: hb-c03-u0023-s002
      start: 113
      end: 204
    - id: hb-c03-u0023-s003
      start: 205
      end: 405
  - type: paragraph
    id: hb-c03-u0024
    text: Ofta anser människor som kommer från andra länder att finländarna är tysta och lugna. Många
      anser att kraftiga känslouttryck är en privat angelägenhet i Finland, och utanför hemmet beter sig
      människorna rätt så behärskat. Också när man som kund uträttar ärenden hos myndigheter förväntas
      man berätta om sitt ärende på ett lugnt sätt.
    sentences:
    - id: hb-c03-u0024-s001
      start: 0
      end: 85
    - id: hb-c03-u0024-s002
      start: 86
      end: 221
    - id: hb-c03-u0024-s003
      start: 222
      end: 333
  - type: paragraph
    id: hb-c03-u0025
    text: I Finland står man ut med också mycket långa stunder av tystnad, som ibland uppstår under ett
      samtal. Många som är vana vid en annan typ av samtalsstil kan uppleva att det här är besvärande
      och göra tolkningen att någonting är fel eller att samtalspartnern är arg.
    sentences:
    - id: hb-c03-u0025-s001
      start: 0
      end: 101
    - id: hb-c03-u0025-s002
      start: 102
      end: 264
  - type: paragraph
    id: hb-c03-u0026
    text: Människor som flyttat till Finland från andra länder tycker ofta att finländarna är blyga eller
      lite allvarsamma. I Finland i sin tur anser många att till exempel östfinnar är mer pratsamma och
      utåtriktade än västfinnar, som är mer behärskade och rättframma.
    sentences:
    - id: hb-c03-u0026-s001
      start: 0
      end: 113
    - id: hb-c03-u0026-s002
      start: 114
      end: 258
  - type: paragraph
    id: hb-c03-u0027
    text: Som i vilket land som helst finns det många sådana här stereotyper i Finland om människor som
      bor på olika håll i landet. För det mesta fungerar dessa uppfattningar som en grund för vänskapliga
      skämt och en tävling om vilken region eller stad, eller vilken regions eller stads invånare som
      är bäst och som representerar det genuina Finland.
    sentences:
    - id: hb-c03-u0027-s001
      start: 0
      end: 121
    - id: hb-c03-u0027-s002
      start: 122
      end: 340
  - type: paragraph
    id: hb-c03-u0028
    text: I konversationer går man ofta rakt på sak. Man lägger nödvändigtvis ingen tid på artigheter
      eller på att fråga om den andra har något nytt att berätta. Det här kan kännas ovänligt, men man
      menar oftast väl med det. Till exempel anses det vara en bra sak på arbetsplatser att i början av
      ett möte hoppa över artigheterna och snabbt gå till saken. På så sätt sparar man tid för alla som
      sitter i mötet.
    sentences:
    - id: hb-c03-u0028-s001
      start: 0
      end: 42
    - id: hb-c03-u0028-s002
      start: 43
      end: 151
    - id: hb-c03-u0028-s003
      start: 152
      end: 214
    - id: hb-c03-u0028-s004
      start: 215
      end: 345
    - id: hb-c03-u0028-s005
      start: 346
      end: 400
  - type: paragraph
    id: hb-c03-u0029
    text: Frågor om arbetskamraterna har något nytt att berätta gör man gärna på till exempel kaffe- eller
      lunchrasten. I Finland är man ganska regelorienterad och anser kanske aningen orubbligt att möten
      närmast är avsedda för att prata om arbetsrelaterade frågor.
    sentences:
    - id: hb-c03-u0029-s001
      start: 0
      end: 109
    - id: hb-c03-u0029-s002
      start: 110
      end: 255
- id: hb-c03-umgange
  title: Hälsningar, punktlighet och besök
  blocks:
  - type: paragraph
    id: hb-c03-u0030
    text: När man hälsar i Finland ser man varandra i ögonen och tar ofta varandra i hand. Om den andra
      är obekant kan man samtidigt presentera sig, med andra ord säga sitt namn. Att skaka hand hänger
      också samman med jämställdhet och likabehandling, det vill säga i Finland tar alla alla i hand,
      och det är inte viktigt vem som tar i hand först.
    sentences:
    - id: hb-c03-u0030-s001
      start: 0
      end: 80
    - id: hb-c03-u0030-s002
      start: 81
      end: 168
    - id: hb-c03-u0030-s003
      start: 169
      end: 336
  - type: paragraph
    id: hb-c03-u0031
    text: Handskakning används inte bara när man presenterar sig, utan också för att bekräfta avtal eller
      som ett tecken på att en tvist är löst. Genom att skaka hand kan man uttrycka förtroende och respekt
      för den andra. Handskakning är i Finland ett så etablerat sätt att hälsa och också bekräfta avtal
      att om någon vägrar att ta i hand kan det göra att den andra blir förvånad eller sårad. Att vägra
      skaka hand med en person av ett annat kön kan betraktas som oartigt.
    sentences:
    - id: hb-c03-u0031-s001
      start: 0
      end: 135
    - id: hb-c03-u0031-s002
      start: 136
      end: 211
    - id: hb-c03-u0031-s003
      start: 212
      end: 382
    - id: hb-c03-u0031-s004
      start: 383
      end: 461
  - type: paragraph
    id: hb-c03-u0032
    text: Att hälsa med en kram har under de senaste åren blivit vanligare bland vänner och bekanta. Kramen
      är ofta snabb och lätt. Kindpussar brukar man inte ge i Finland.
    sentences:
    - id: hb-c03-u0032-s001
      start: 0
      end: 90
    - id: hb-c03-u0032-s002
      start: 91
      end: 121
    - id: hb-c03-u0032-s003
      start: 122
      end: 162
  - type: paragraph
    id: hb-c03-u0033
    text: Punktlighet är viktig i Finland liksom i många andra länder i Nordeuropa. Människor förväntas
      komma i tid till avtalade möten. Möten börjar vanligtvis exakt på den angivna tiden. Det anses oartigt
      att komma för sent. Uppfattningen är att en person är respektlös mot den andra och slösar hens tid
      genom att komma för sent till ett avtalat möte. I Finland är man också i övrigt mycket medveten
      om klockslag och tidens gång. Ibland kan människor skynda sig och stressa över tiden i onödan.
    sentences:
    - id: hb-c03-u0033-s001
      start: 0
      end: 73
    - id: hb-c03-u0033-s002
      start: 74
      end: 126
    - id: hb-c03-u0033-s003
      start: 127
      end: 178
    - id: hb-c03-u0033-s004
      start: 179
      end: 216
    - id: hb-c03-u0033-s005
      start: 217
      end: 343
    - id: hb-c03-u0033-s006
      start: 344
      end: 421
    - id: hb-c03-u0033-s007
      start: 422
      end: 486
  - type: paragraph
    id: hb-c03-u0034
    text: När man i Finland till exempel besöker en läkare eller en myndighet, eller handlar i en affär
      måste man ofta stå i kö. På många ställen används system med könummer. När människorna ställer sig
      i kö tar de en lapp från en apparat. Allas ärenden sköts i nummerordning. Även om inga könummer
      används, väntar människorna på sin tur i den ordning de ställde sig i kö. Ett undantag är sjukhusens
      jour, där läkaren avgör i vilken ordning patienterna ska få vård. De mest akuta fallen får vård
      snabbast.
    sentences:
    - id: hb-c03-u0034-s001
      start: 0
      end: 118
    - id: hb-c03-u0034-s002
      start: 119
      end: 164
    - id: hb-c03-u0034-s003
      start: 165
      end: 229
    - id: hb-c03-u0034-s004
      start: 230
      end: 266
    - id: hb-c03-u0034-s005
      start: 267
      end: 362
    - id: hb-c03-u0034-s006
      start: 363
      end: 455
    - id: hb-c03-u0034-s007
      start: 456
      end: 495
  - type: paragraph
    id: hb-c03-u0035
    text: Att gå före i kön anses mycket oartigt, eftersom idén är att alla som köar är lika mycket värda.
      Om någon går före höjer hen sig över de andra och anser att de gemensamma reglerna inte gäller hen.
    sentences:
    - id: hb-c03-u0035-s001
      start: 0
      end: 96
    - id: hb-c03-u0035-s002
      start: 97
      end: 196
  - type: paragraph
    id: hb-c03-u0036
    text: Också i övrigt är likvärdighet viktig för människorna i Finland. I sederna och bruken tar den
      sig uttryck i bland annat det faktum att det i Finland inte längre är vanligt att säga ni. Människor
      tilltalas för det mesta med förnamnet, också chefer och lärare. Människor i ledande ställning ges
      ganska lite särbehandling i Finland.
    sentences:
    - id: hb-c03-u0036-s001
      start: 0
      end: 64
    - id: hb-c03-u0036-s002
      start: 65
      end: 184
    - id: hb-c03-u0036-s003
      start: 185
      end: 258
    - id: hb-c03-u0036-s004
      start: 259
      end: 329
  - type: paragraph
    id: hb-c03-u0037
    text: Många finländare uppskattar anspråkslöshet. Människor framhäver sig inte i gruppen, de talar
      inte högljutt och skryter inte. I Finland anses det vara välartat att ta hänsyn till och lyssna
      på andra. Också arbetsamhet och flit värdesätts högt.
    sentences:
    - id: hb-c03-u0037-s001
      start: 0
      end: 43
    - id: hb-c03-u0037-s002
      start: 44
      end: 124
    - id: hb-c03-u0037-s003
      start: 125
      end: 198
    - id: hb-c03-u0037-s004
      start: 199
      end: 242
  - type: paragraph
    id: hb-c03-u0038
    text: I Finland ska man alltid på förhand komma överens om besök hos andra, även hos goda vänner.
      Finländare lägger speciellt stort värde på sitt privatliv och sitt eget lugn.
    sentences:
    - id: hb-c03-u0038-s001
      start: 0
      end: 91
    - id: hb-c03-u0038-s002
      start: 92
      end: 169
  - type: paragraph
    id: hb-c03-u0039
    text: Finländare använder inte skor inomhus. Det är artigt att ta av sig skorna när du går in i någons
      hem. När du besöker ett finländskt hem, ta av dig skorna eller fråga om du kan ha dem på.
    sentences:
    - id: hb-c03-u0039-s001
      start: 0
      end: 38
    - id: hb-c03-u0039-s002
      start: 39
      end: 101
    - id: hb-c03-u0039-s003
      start: 102
      end: 186
- id: hb-c03-religion
  title: Religioner och religionslöshet
  blocks:
  - type: paragraph
    id: hb-c03-u0040
    text: Enligt Finlands grundlag har var och en rätt att höra till ett religiöst samfund och utöva sin
      egen religion. Trossamfunden och församlingarna har samlingslokaler såsom kyrkor, moskéer, bönelokaler,
      synagogor, rikets salar och tempel på olika orter i Finland. Det är möjligt att valfritt ansluta
      sig till religiösa samfund och också utträda ur dem.
    sentences:
    - id: hb-c03-u0040-s001
      start: 0
      end: 109
    - id: hb-c03-u0040-s002
      start: 110
      end: 259
    - id: hb-c03-u0040-s003
      start: 260
      end: 348
  - type: paragraph
    id: hb-c03-u0041
    text: Enligt lag har människorna också frihet att inte höra till något religiöst samfund och inte
      utöva någon religion. År 2022 hörde en knapp tredjedel av invånarna i Finland inte till något registrerat
      religiöst samfund. De är en heterogen människoskara, där en del inte har någon religiös övertygelse,
      medan andra har. De är dock inte medlemmar i något trossamfund som för register över sina medlemmar.
    sentences:
    - id: hb-c03-u0041-s001
      start: 0
      end: 113
    - id: hb-c03-u0041-s002
      start: 114
      end: 216
    - id: hb-c03-u0041-s003
      start: 217
      end: 315
    - id: hb-c03-u0041-s004
      start: 316
      end: 399
  - type: paragraph
    id: hb-c03-u0042
    text: I Finland upprätthålls ett register över religiösa samfund som baserar sig på religionsfrihetslagen,
      och de registrerade religiösa samfunden i sin tur för egna register över sina medlemmar. Om ett
      samfund är registrerat som ett religiöst samfund enligt lagen, är det möjligt för det att få understöd
      för sin verksamhet. Registreringen påverkar också till exempel samfundsmedlemmarnas rätt att få
      undervisning i sin religion enligt läroplanen i skolan.
    sentences:
    - id: hb-c03-u0042-s001
      start: 0
      end: 189
    - id: hb-c03-u0042-s002
      start: 190
      end: 319
    - id: hb-c03-u0042-s003
      start: 320
      end: 451
  - type: paragraph
    id: hb-c03-u0043
    text: I Finland finns det bland annat olika kristna utövare såsom lutheraner, ortodoxer, katoliker
      och pingstvänner samt utövare av andra världsreligioner såsom muslimer, hinduer, buddister och judar.
      En del människor är icke-religiösa. Dessutom finns det många människor som upplever att de är andliga,
      men inte hör till något organiserat trossamfund.
    sentences:
    - id: hb-c03-u0043-s001
      start: 0
      end: 194
    - id: hb-c03-u0043-s002
      start: 195
      end: 230
    - id: hb-c03-u0043-s003
      start: 231
      end: 346
  - type: paragraph
    id: hb-c03-u0044
    text: Majoriteten av invånarna i Finland, omkring 3,6 miljoner människor år 2023, hör till den evangelisk-lutherska
      kyrkan i Finland, som är en protestantisk, kristen kyrka. Den näst största kristna kyrkan i Finland
      är den ortodoxa kyrkan, till vilken omkring 53 000 personer hörde år 2023. Den ortodoxa kyrkan i
      Finland lyder under Konstantinopels patriarkat, som har sitt säte i Istanbul.
    sentences:
    - id: hb-c03-u0044-s001
      start: 0
      end: 167
    - id: hb-c03-u0044-s002
      start: 168
      end: 284
    - id: hb-c03-u0044-s003
      start: 285
      end: 384
  - type: paragraph
    id: hb-c03-u0045
    text: Den lutherska och den ortodoxa kyrkan har i Finland en särställning som baseras på lagen och
      med stöd av vilken dessa kyrkor tar ut skatt av sina medlemmar. Övriga religiösa samfund kan begära
      olika frivilliga donationer av sina medlemmar för att finansiera sin verksamhet.
    sentences:
    - id: hb-c03-u0045-s001
      start: 0
      end: 156
    - id: hb-c03-u0045-s002
      start: 157
      end: 273
  - type: paragraph
    id: hb-c03-u0046
    text: Kyrkorna använder skattepengarna för sin verksamhet och till förmån för sina medlemmar, till
      exempel för att erbjuda tjänster inom barn- och ungdomsarbete och underhålla kyrkobyggnader och
      begravningsplatser. Det är bra att veta att alla som bor i Finland har rätt att ta del av många
      av kyrkans tjänster. Vem som helst kan få hjälp genom kyrkans diakoniarbete, det vill säga hjälparbete,
      vid till exempel ekonomiska problem eller livskriser.
    sentences:
    - id: hb-c03-u0046-s001
      start: 0
      end: 208
    - id: hb-c03-u0046-s002
      start: 209
      end: 305
    - id: hb-c03-u0046-s003
      start: 306
      end: 442
  - type: paragraph
    id: hb-c03-u0047
    text: I Finland sysselsätter den lutherska kyrkan ett stort antal yrkesutbildade som arbetar med barn
      och unga och som ordnar mångsidig verksamhet för barn i olika åldrar, till exempel familjeklubbar
      och eftermiddagsklubbar för skolbarn.
    sentences:
    - id: hb-c03-u0047-s001
      start: 0
      end: 231
  - type: paragraph
    id: hb-c03-u0048
    text: Kyrkor ordnar olika religiösa ceremonier för sina medlemmar. Det kan vara gudstjänster, vigsel,
      dop eller begravning. För den som är medlem i församlingen är dessa ceremonier gratis.
    sentences:
    - id: hb-c03-u0048-s001
      start: 0
      end: 60
    - id: hb-c03-u0048-s002
      start: 61
      end: 117
    - id: hb-c03-u0048-s003
      start: 118
      end: 182
  - type: paragraph
    id: hb-c03-u0049
    text: Inom den lutherska kyrkan kan både kvinnor och män vara präster, kyrkoherdar och biskopar.
    sentences:
    - id: hb-c03-u0049-s001
      start: 0
      end: 90
  - type: paragraph
    id: hb-c03-u0050
    text: I Finland är staten religiöst neutral, och i landets grundlag hänvisas inte till exempel till
      det kristliga kulturarvet eller kristna värderingar. Staten och kyrkorna är separata aktörer.
    sentences:
    - id: hb-c03-u0050-s001
      start: 0
      end: 146
    - id: hb-c03-u0050-s002
      start: 147
      end: 187
  - type: paragraph
    id: hb-c03-u0051
    text: Inom den evangelisk-lutherska kyrkan i Finland finns olika väckelserörelser, till exempel gammallaestadianismen
      och pietismen. Dessa rörelser följer seder och värderingar som delvis skiljer sig från den konventionella
      evangelisk-lutherska traditionen. I Finland finns det också andra kristna kyrkor och samfund, såsom
      den katolska kyrkan och pingstförsamlingar. Alla kristna följer inte samma seder och tolkar inte
      Bibeln på samma sätt. Karakteristiskt för den finländska kristendomen är att den är måttfull till
      sina läror.
    sentences:
    - id: hb-c03-u0051-s001
      start: 0
      end: 126
    - id: hb-c03-u0051-s002
      start: 127
      end: 251
    - id: hb-c03-u0051-s003
      start: 252
      end: 361
    - id: hb-c03-u0051-s004
      start: 362
      end: 436
    - id: hb-c03-u0051-s005
      start: 437
      end: 524
  - type: paragraph
    id: hb-c03-u0052
    text: I Finland finns en skara muslimer som etniskt och nationellt sett samt ur perspektivet för religionsutövning
      är mycket brokig. De första muslimerna kom till Finland på 1800-talet. De var tatarer som flyttade
      från Ryssland. Muslimer började anlända till Finland i större mängder från och med början av 1990-talet,
      då Finland tog emot flyktingar från till exempel Somalia och Irak.
    sentences:
    - id: hb-c03-u0052-s001
      start: 0
      end: 126
    - id: hb-c03-u0052-s002
      start: 127
      end: 179
    - id: hb-c03-u0052-s003
      start: 180
      end: 222
    - id: hb-c03-u0052-s004
      start: 223
      end: 379
  - type: paragraph
    id: hb-c03-u0053
    text: Liksom kristendomen är islam internt brokig och omfattar flertalet olika skolor och riktningar.
      Av dessa finns många också i Finland.
    sentences:
    - id: hb-c03-u0053-s001
      start: 0
      end: 95
    - id: hb-c03-u0053-s002
      start: 96
      end: 133
  - type: paragraph
    id: hb-c03-u0054
    text: Minst 20 myndiga personer kan grunda ett religiöst samfund. Religiösa grupper måste inte registrera
      sig som samfund, utan de kan även verka utan att ha registrerat sig.
    sentences:
    - id: hb-c03-u0054-s001
      start: 0
      end: 59
    - id: hb-c03-u0054-s002
      start: 60
      end: 168
- id: hb-c03-religiositet
  title: Religion i vardagen och högtiderna
  blocks:
  - type: paragraph
    id: hb-c03-u0055
    text: Kristendomen och de lutherska kristna värderingarna har framför allt tidigare inverkat mycket
      på det finländska samhället, kulturen, människornas värderingar, vardagen och etikettsreglerna och
      konsten. Även många festtraditioner anknyter till religionen. Traditionerna syns särskilt i ritualer
      som hänför sig till livets gång eller årscykeln, till exempel bröllop och begravningar samt jul-
      och påskfirande.
    sentences:
    - id: hb-c03-u0055-s001
      start: 0
      end: 201
    - id: hb-c03-u0055-s002
      start: 202
      end: 254
    - id: hb-c03-u0055-s003
      start: 255
      end: 407
  - type: paragraph
    id: hb-c03-u0056
    text: I Finland, liksom i många andra europeiska länder, har samhället under lång tid blivit mer sekulärt.
      Det betyder att religion har fått mindre betydelse i människors vardag och i samhället. Med det
      menas att religionens betydelse har minskat i samhället och individens liv. Många anser inte att
      religiösa seder och bruk, värderingar och attityder är någon viktig del av deras liv och är inte
      intresserade av att föra dem vidare till nästa generation.
    sentences:
    - id: hb-c03-u0056-s001
      start: 0
      end: 100
    - id: hb-c03-u0056-s002
      start: 101
      end: 188
    - id: hb-c03-u0056-s003
      start: 189
      end: 272
    - id: hb-c03-u0056-s004
      start: 273
      end: 449
  - type: paragraph
    id: hb-c03-u0057
    text: Religionsutövandet syns inte särskilt mycket i vardagen i Finland. Man deltar ofta i verksamheten
      i religiösa samfund utifrån sina egna personliga förutsättningar när det känns som att det motsvarar
      ens egna behov och känns meningsfullt för en själv. Många går till exempel i kyrkan eller besöker
      andra platser avsedda för religionsutövande endast vid familjehögtider eller helger.
    sentences:
    - id: hb-c03-u0057-s001
      start: 0
      end: 66
    - id: hb-c03-u0057-s002
      start: 67
      end: 250
    - id: hb-c03-u0057-s003
      start: 251
      end: 381
  - type: paragraph
    id: hb-c03-u0058
    text: I skolor och daghem firas högtidsdagar enligt kalendern, till exempel jul och påsk, som har
      ett delvis religiöst och kristet ursprung. Att fira dessa högtider betraktas i allmänhet inte som
      egentligt religionsutövande. För en stor del är dessa fester en del av den lokala kulturtraditionen
      och deras religiösa budskap får mindre uppmärksamhet. Många högtider är dessutom en blandning av
      kristna och icke-kristna traditioner.
    sentences:
    - id: hb-c03-u0058-s001
      start: 0
      end: 134
    - id: hb-c03-u0058-s002
      start: 135
      end: 218
    - id: hb-c03-u0058-s003
      start: 219
      end: 343
    - id: hb-c03-u0058-s004
      start: 344
      end: 424
  - type: paragraph
    id: hb-c03-u0059
    text: På finländska arbetsplatser brukar man inte utöva religiösa seder eller ritualer. En del arbetsgivare
      har på arbetstagarnas önskemål ordnat till exempel en böneplats i arbetsplatsens lokaler. Bönestunden
      ska hållas i samband med övriga pauser under arbetsdagen.
    sentences:
    - id: hb-c03-u0059-s001
      start: 0
      end: 81
    - id: hb-c03-u0059-s002
      start: 82
      end: 191
    - id: hb-c03-u0059-s003
      start: 192
      end: 261
  - type: paragraph
    id: hb-c03-u0060
    text: I Finland har en del människor ett starkt band till sitt religiösa samfund. De följer dess traditioner,
      deltar i ceremonier och är med vid religiösa tillfällen. Andra i sin tur är inte särskilt starkt
      engagerade i något religiöst samfunds verksamhet. Ändå kan andlighet och religiös övertygelse vara
      viktiga för dem.
    sentences:
    - id: hb-c03-u0060-s001
      start: 0
      end: 75
    - id: hb-c03-u0060-s002
      start: 76
      end: 160
    - id: hb-c03-u0060-s003
      start: 161
      end: 250
    - id: hb-c03-u0060-s004
      start: 251
      end: 316
  - type: paragraph
    id: hb-c03-u0061
    text: Människors övertygelse uppstår på ett alltmer individuellt sätt. Många väljer delar från olika
      källor för sin andlighet. De kan välja delar från olika religiösa traditioner eller andra former
      av andlighet. Någon kan till exempel bekänna en kristen tro och i den inkludera idén om själavandring,
      trots att läran om själavandring inte hör till kristendomens dogmer. En annan i sin tur deltar i
      evenemang som ordnas av flera olika religiösa samfund, eftersom vart och ett av dem ger hen någonting
      meningsfullt i fråga andlighet.
    sentences:
    - id: hb-c03-u0061-s001
      start: 0
      end: 64
    - id: hb-c03-u0061-s002
      start: 65
      end: 120
    - id: hb-c03-u0061-s003
      start: 121
      end: 205
    - id: hb-c03-u0061-s004
      start: 206
      end: 363
    - id: hb-c03-u0061-s005
      start: 364
      end: 525
  - type: paragraph
    id: hb-c03-u0062
    text: Karakteristiskt för den finländska religiositeten är dessutom att andlig övertygelse ofta betraktas
      som en privat angelägenhet. Övertygelse är inte nödvändigtvis ett naturligt samtalsämne bland bekanta.
    sentences:
    - id: hb-c03-u0062-s001
      start: 0
      end: 127
    - id: hb-c03-u0062-s002
      start: 128
      end: 202
  - type: paragraph
    id: hb-c03-u0063
    text: I skolorna i Finland ordnas undervisning i åskådningsämnen, det vill säga religion eller livsåskådningskunskap.
      Skolornas undervisning i religion och livsåskådningskunskap regleras i Finlands lag om grundläggande
      utbildning. Religionsundervisningens uppgift är att ge eleverna en bred allmänbildning i religion
      och livsåskådning.
    sentences:
    - id: hb-c03-u0063-s001
      start: 0
      end: 111
    - id: hb-c03-u0063-s002
      start: 112
      end: 224
    - id: hb-c03-u0063-s003
      start: 225
      end: 329
  - type: paragraph
    id: hb-c03-u0064
    text: I Finland deltar största delen av eleverna i undervisningen i evangelisk-luthersk tro. Också
      elever som hör till religiösa minoriteter såsom ortodoxer, katoliker, muslimer och judar har rätt
      att få undervisning i sin egen religion enligt lärokursen.
    sentences:
    - id: hb-c03-u0064-s001
      start: 0
      end: 86
    - id: hb-c03-u0064-s002
      start: 87
      end: 249
  - type: paragraph
    id: hb-c03-u0065
    text: Religionsundervisningen i skolan är inte religionsutövande eller religiöst bindande. På religionslektionerna
      utövar man inte religiösa ritualer eller till exempel ber. I undervisningen lär man sig förutom
      om religionen som studeras också om andra religioner och övertygelser samt uppmuntrar eleverna att
      fundera över olika etiska frågor.
    sentences:
    - id: hb-c03-u0065-s001
      start: 0
      end: 84
    - id: hb-c03-u0065-s002
      start: 85
      end: 167
    - id: hb-c03-u0065-s003
      start: 168
      end: 337
  - type: paragraph
    id: hb-c03-u0066
    text: Livsåskådningskunskap lärs ut till elever som inte hör till något registrerat religionssamfund.
      Livsåskådningskunskap är ett tvärvetenskapligt, obundet åskådningsämne i grundskolan och gymnasiet
      som omfattar element från filosofin och samhälls-, religions- och kulturvetenskaperna.
    sentences:
    - id: hb-c03-u0066-s001
      start: 0
      end: 95
    - id: hb-c03-u0066-s002
      start: 96
      end: 281
- id: hb-c03-kalender
  title: Högtider och flaggdagar
  blocks:
  - type: paragraph
    id: hb-c03-u0067
    text: En del av högtiderna, till exempel jul och påsk, är allmänna lediga dagar. Då är också många
      butiker och ämbetsverk stängda. Ett sätt att fira en helgdag är att hissa flaggan. I Finland flaggar
      man på bestämda dagar som är intagna i kalendern. Både myndigheter och vanliga människor deltar
      i flaggdagarna. I Finland är flaggan något högtidligt.
    sentences:
    - id: hb-c03-u0067-s001
      start: 0
      end: 74
    - id: hb-c03-u0067-s002
      start: 75
      end: 124
    - id: hb-c03-u0067-s003
      start: 125
      end: 175
    - id: hb-c03-u0067-s004
      start: 176
      end: 243
    - id: hb-c03-u0067-s005
      start: 244
      end: 305
    - id: hb-c03-u0067-s006
      start: 306
      end: 344
  - type: paragraph
    id: hb-c03-u0068
    text: En stor del av de finländska festerna och traditionerna grundar sig på religionen. En del av
      traditionerna har kristen bakgrund medan andra har sina rötter i tiden då naturreligion var vanlig
      i Finland. I dag innebär traditionerna och festerna för många finländare framför allt fritid tillsammans
      med familj, släkt eller vänner.
    sentences:
    - id: hb-c03-u0068-s001
      start: 0
      end: 82
    - id: hb-c03-u0068-s002
      start: 83
      end: 202
    - id: hb-c03-u0068-s003
      start: 203
      end: 328
- id: hb-c03-vinterfester
  title: Nyår, trettondag och vintertraditioner
  blocks:
  - type: paragraph
    id: hb-c03-u0069
    text: Nyårsaftonen den 31 december är årets sista dag. Då ordnas fyrverkerier. Fyrverkeripjäser kan
      köpas i affären. För fyrverkerierna har man satt exakta tidsgränser.
    sentences:
    - id: hb-c03-u0069-s001
      start: 0
      end: 48
    - id: hb-c03-u0069-s002
      start: 49
      end: 72
    - id: hb-c03-u0069-s003
      start: 73
      end: 110
    - id: hb-c03-u0069-s004
      start: 111
      end: 162
  - type: paragraph
    id: hb-c03-u0070
    text: Trettondagen den 6 januari är julens sista dag. Då minns man de tre vise männen som kom med
      gåvor till Jesusbarnet.
    sentences:
    - id: hb-c03-u0070-s001
      start: 0
      end: 47
    - id: hb-c03-u0070-s002
      start: 48
      end: 115
  - type: paragraph
    id: hb-c03-u0071
    text: På vändagen den 14 februari kan man minnas sina vänner till exempel med blommor eller ett kort.
      I Finland firas vändagen inte med lika mycket pompa och ståt som till exempel i USA.
    sentences:
    - id: hb-c03-u0071-s001
      start: 0
      end: 95
    - id: hb-c03-u0071-s002
      start: 96
      end: 180
  - type: paragraph
    id: hb-c03-u0072
    text: Fastlagen inleder förberedelserna för påsken. På fastlagen åker man i Finland backe och äter
      fastlagsbullar som har bland annat grädde som fyllning.
    sentences:
    - id: hb-c03-u0072-s001
      start: 0
      end: 45
    - id: hb-c03-u0072-s002
      start: 46
      end: 148
- id: hb-c03-pask
  title: Påsk och Kristi himmelsfärdsdag
  blocks:
  - type: paragraph
    id: hb-c03-u0073
    text: Påsken infaller vid olika tidpunkter, men oftast firas påsk i mars eller april. Före påsken
      firas palmsöndagen. Då klär barn sig ut till häxor och går runt i grannskapet för att dela ut videkvistar
      som de dekorerat. Barnen får oftast en liten present, till exempel lite godis.
    sentences:
    - id: hb-c03-u0073-s001
      start: 0
      end: 79
    - id: hb-c03-u0073-s002
      start: 80
      end: 111
    - id: hb-c03-u0073-s003
      start: 112
      end: 215
    - id: hb-c03-u0073-s004
      start: 216
      end: 276
  - type: paragraph
    id: hb-c03-u0074
    text: På långfredagen minns man Jesu död i kyrkan. Söndagen är påskdagen och då minns man Jesu uppståndelse.
      Påskfirandet fortsätter ännu på måndagen som är annandag påsk. På påsken äter man ofta lamm, chokladägg
      och memma.
    sentences:
    - id: hb-c03-u0074-s001
      start: 0
      end: 44
    - id: hb-c03-u0074-s002
      start: 45
      end: 102
    - id: hb-c03-u0074-s003
      start: 103
      end: 165
    - id: hb-c03-u0074-s004
      start: 166
      end: 217
  - type: paragraph
    id: hb-c03-u0075
    text: På Kristi himmelsfärdsdag minns man Jesu himmelsfärd. Kristi himmelsfärdsdag firas 40 dagar
      efter påsken.
    sentences:
    - id: hb-c03-u0075-s001
      start: 0
      end: 53
    - id: hb-c03-u0075-s002
      start: 54
      end: 105
  - type: paragraph
    id: hb-c03-u0151
    text: Tio dagar efter Kristi himmelsfärdsdag firas pingsten. Det är också en kristen högtid och då
      firar man grundandet av den kristna kyrkan.
    sentences:
    - id: hb-c03-u0151-s001
      start: 0
      end: 54
    - id: hb-c03-u0151-s002
      start: 55
      end: 136
- id: hb-c03-valborg
  title: Valborg, första maj och morsdag
  blocks:
  - type: paragraph
    id: hb-c03-u0076
    text: Första maj är vårens och arbetarnas fest. I Finland firas Valborgsmässoafton och första maj
      på många olika sätt. Människorna samlas på picknick. På första maj äter man munkar och dricker mjöd,
      som liknar läsk. Många firar också med mousserande vin. Hemmen dekoreras med ballonger och serpentin.
      Studenterna tar på sig sina vita studentmössor. Arbetarna ordnar Valborgsmarscher.
    sentences:
    - id: hb-c03-u0076-s001
      start: 0
      end: 41
    - id: hb-c03-u0076-s002
      start: 42
      end: 112
    - id: hb-c03-u0076-s003
      start: 113
      end: 144
    - id: hb-c03-u0076-s004
      start: 145
      end: 209
    - id: hb-c03-u0076-s005
      start: 210
      end: 248
    - id: hb-c03-u0076-s006
      start: 249
      end: 294
    - id: hb-c03-u0076-s007
      start: 295
      end: 342
    - id: hb-c03-u0076-s008
      start: 343
      end: 377
  - type: paragraph
    id: hb-c03-u0077
    text: I Finland firas morsdag den andra söndagen i maj. Mammorna firas till exempel med presenter
      och blommor.
    sentences:
    - id: hb-c03-u0077-s001
      start: 0
      end: 49
    - id: hb-c03-u0077-s002
      start: 50
      end: 104
- id: hb-c03-midsommar
  title: Midsommar
  blocks:
  - type: paragraph
    id: hb-c03-u0078
    text: Midsommar firas i slutet av juni. Midsommar är en högtid som firas nära sommarsolståndet. Många
      finländare åker gärna till stugan på midsommaren. Stora midsommareldar hör till de finländska midsommartraditionerna.
      I södra Finland reser man ibland också midsommarstången.
    sentences:
    - id: hb-c03-u0078-s001
      start: 0
      end: 33
    - id: hb-c03-u0078-s002
      start: 34
      end: 89
    - id: hb-c03-u0078-s003
      start: 90
      end: 145
    - id: hb-c03-u0078-s004
      start: 146
      end: 213
    - id: hb-c03-u0078-s005
      start: 214
      end: 270
  - type: paragraph
    id: hb-c03-u0152
    text: I den kristna kalendern är midsommaren Johannes döparens födelsedag, men festen är mycket äldre
      än kristendomen. Redan för länge sedan firades ljusets och sommarens fest på årets längsta dag.
    sentences:
    - id: hb-c03-u0152-s001
      start: 0
      end: 112
    - id: hb-c03-u0152-s002
      start: 113
      end: 191
  - type: paragraph
    id: hb-c03-u0153
    text: På midsommaren tänds stora brasor på stränder och klippor. Brasorna är en gammal tradition som
      ursprungligen var till för att avvärja ondska. På midsommaren pryds dörrposterna med små björkar.
      Människor sysslar också lekfullt med midsommartrolldom. Syftet med den var tidigare att trygga en
      god skörd och ta reda på vem man skulle gifta sig med och när.
    sentences:
    - id: hb-c03-u0153-s001
      start: 0
      end: 58
    - id: hb-c03-u0153-s002
      start: 59
      end: 141
    - id: hb-c03-u0153-s003
      start: 142
      end: 192
    - id: hb-c03-u0153-s004
      start: 193
      end: 248
    - id: hb-c03-u0153-s005
      start: 249
      end: 353
- id: hb-c03-hostfester
  title: Alla helgons dag och farsdag
  blocks:
  - type: paragraph
    id: hb-c03-u0079
    text: Alla helgons dag firas i början av november. Då minns man sina avlidna. Människorna tänder ljus
      på sina anhörigas gravar. Samtidigt firas också Halloween. Alla helgons dag är emellertid inte en
      karneval som Halloween, utan en högtidlig och stilla fest.
    sentences:
    - id: hb-c03-u0079-s001
      start: 0
      end: 44
    - id: hb-c03-u0079-s002
      start: 45
      end: 71
    - id: hb-c03-u0079-s003
      start: 72
      end: 121
    - id: hb-c03-u0079-s004
      start: 122
      end: 154
    - id: hb-c03-u0079-s005
      start: 155
      end: 252
  - type: paragraph
    id: hb-c03-u0080
    text: Farsdag firas i Finland den andra söndagen i november. Far firas med många slags presenter.
    sentences:
    - id: hb-c03-u0080-s001
      start: 0
      end: 54
    - id: hb-c03-u0080-s002
      start: 55
      end: 91
- id: hb-c03-december
  title: Självständighetsdagen och julen
  blocks:
  - type: paragraph
    id: hb-c03-u0081
    text: Finland blev självständigt 1917. Det firas på självständighetsdagen den 6 december. Då tittar
      många finländare på självständighetsdagens mottagning med presidenten som värd på TV.
    sentences:
    - id: hb-c03-u0081-s001
      start: 0
      end: 32
    - id: hb-c03-u0081-s002
      start: 33
      end: 83
    - id: hb-c03-u0081-s003
      start: 84
      end: 179
  - type: paragraph
    id: hb-c03-u0082
    text: Julen är årets viktigaste fest i Finland. Då minns man Jesu födelse i kyrkan. Den egentliga
      dagen för firandet är julafton den 24 december. Många skaffar sig en julgran som pyntas. Julklapparna
      delas oftast ut på julafton. Till den finländska julen hör många slags festmat, såsom julskinka,
      rosoll som är en rödbetssallad, olika slags lådor, julstjärnor och pepparkakor. På julen sjunger
      man julsånger och umgås med familjen och andra nära och kära.
    sentences:
    - id: hb-c03-u0082-s001
      start: 0
      end: 41
    - id: hb-c03-u0082-s002
      start: 42
      end: 77
    - id: hb-c03-u0082-s003
      start: 78
      end: 139
    - id: hb-c03-u0082-s004
      start: 140
      end: 180
    - id: hb-c03-u0082-s005
      start: 181
      end: 222
    - id: hb-c03-u0082-s006
      start: 223
      end: 370
    - id: hb-c03-u0082-s007
      start: 371
      end: 449
- id: hb-c03-kulturdagar
  title: Runeberg, kvinnodagen och Minna Canths dag (19 mars)
  blocks:
  - type: paragraph
    id: hb-c03-u0083
    text: Den 5 februari firas Runebergsdagen. Då firas Finlands nationalskald Johan Ludvig Runeberg,
      som skrev orden till Finlands nationalsång som heter Vårt land. Han hade stort inflytande på finländsk
      litteratur och kultur. På Runebergsdagen äts runebergstårtor, en slags bakelse som skaldens hustru,
      Fredrika Runeberg, brukade baka.
    sentences:
    - id: hb-c03-u0083-s001
      start: 0
      end: 36
    - id: hb-c03-u0083-s002
      start: 37
      end: 155
    - id: hb-c03-u0083-s003
      start: 156
      end: 217
    - id: hb-c03-u0083-s004
      start: 218
      end: 327
  - type: paragraph
    id: hb-c03-u0084
    text: Den 8 mars firas den internationella kvinnodagen. Då ordnar många organisationer och andra grupper
      diskussionstillfällen och andra evenemang, där kvinnans ställning i det finska samhället och i världen
      behandlas. I Finland är kvinnodagen en vanlig arbetsdag.
    sentences:
    - id: hb-c03-u0084-s001
      start: 0
      end: 49
    - id: hb-c03-u0084-s002
      start: 50
      end: 212
    - id: hb-c03-u0084-s003
      start: 213
      end: 258
  - type: paragraph
    id: hb-c03-u0085
    text: I mars firas Minna Canths dag, eller jämställdhetens dag. Minna Canth var en finsk författare
      och samhällspåverkare. Hon främjade kvinnornas ställning i Finland bland annat genom att förbättra
      flickors möjligheter till utbildning.
    sentences:
    - id: hb-c03-u0085-s001
      start: 0
      end: 57
    - id: hb-c03-u0085-s002
      start: 58
      end: 116
    - id: hb-c03-u0085-s003
      start: 117
      end: 230
- id: hb-c03-ovriga-fester
  title: Årets andra traditioner
  blocks:
  - type: paragraph
    id: hb-c03-u0086
    text: I februari firas sportlov i finländska skolor. Då har barnen en vecka ledigt från skolan. Sportlovet
      har firats sedan 1930-talet. Ursprungligen var det meningen att barnen skulle få motion och kunna
      skida hela veckan. Nuförtiden skidas det mindre, men många far till exempel och skida slalom. Sportlovet
      firas olika veckor i olika delar av Finland, från mitten av februari framåt.
    sentences:
    - id: hb-c03-u0086-s001
      start: 0
      end: 46
    - id: hb-c03-u0086-s002
      start: 47
      end: 89
    - id: hb-c03-u0086-s003
      start: 90
      end: 129
    - id: hb-c03-u0086-s004
      start: 130
      end: 217
    - id: hb-c03-u0086-s005
      start: 218
      end: 292
    - id: hb-c03-u0086-s006
      start: 293
      end: 380
  - type: paragraph
    id: hb-c03-u0087
    text: I början av juni får skoleleverna i Finland sommarlov. Läsårets slut firas vid skolans vårfest,
      dit också föräldrarna är bjudna. På vårfesten sjungs ofta sommarpsalmen Den blomstertid nu kommer.
      Barnens sommarlov fortsätter till mitten av augusti och varar alltså ungefär tio veckor.
    sentences:
    - id: hb-c03-u0087-s001
      start: 0
      end: 54
    - id: hb-c03-u0087-s002
      start: 55
      end: 128
    - id: hb-c03-u0087-s003
      start: 129
      end: 194
    - id: hb-c03-u0087-s004
      start: 195
      end: 283
  - type: paragraph
    id: hb-c03-u0088
    text: I slutet av oktober firas Halloween, som är en ganska ny fest i Finland. Halloween är ursprungligen
      en irländsk-amerikansk fest. Nuförtiden går en del barn också i Finland från dörr till dörr utklädda
      i maskeraddräkter och ber om godis. Skolorna har också halloween-fester för barnen. En del ställer
      prydnadspumpor med ljus inuti i fönstren eller utanför dörren.
    sentences:
    - id: hb-c03-u0088-s001
      start: 0
      end: 72
    - id: hb-c03-u0088-s002
      start: 73
      end: 128
    - id: hb-c03-u0088-s003
      start: 129
      end: 236
    - id: hb-c03-u0088-s004
      start: 237
      end: 284
    - id: hb-c03-u0088-s005
      start: 285
      end: 362
  - type: paragraph
    id: hb-c03-u0089
    text: Under december firas lillajulsfester i skolor, på arbetsplatser, bland studerande och i föreningar.
      Julen firas i Finland vanligen inom familjen, men lillajulsfesterna firas tillsammans med arbets-
      och skolkamrater och andra grupper.
    sentences:
    - id: hb-c03-u0089-s001
      start: 0
      end: 99
    - id: hb-c03-u0089-s002
      start: 100
      end: 233
  - type: paragraph
    id: hb-c03-u0090
    text: Lillajulsfesterna är avslappnade och informella till sin karaktär. Vid dem bjuds första gången
      på julmat, framför allt risgrynsgröt och glögg. På vuxnas lillajulsfester klär man sig i festkläder,
      äter gott och dricker ofta alkohol. På barnens fester i skolor och hobbygrupper äter man gott och
      delar ut lillajulspresenter. Var och en hämtar ett litet paket och får sedan ett litet paket att
      ta med sig hem.
    sentences:
    - id: hb-c03-u0090-s001
      start: 0
      end: 66
    - id: hb-c03-u0090-s002
      start: 67
      end: 142
    - id: hb-c03-u0090-s003
      start: 143
      end: 231
    - id: hb-c03-u0090-s004
      start: 232
      end: 322
    - id: hb-c03-u0090-s005
      start: 323
      end: 406
  - type: paragraph
    id: hb-c03-u0091
    text: Några dagar före julen börjar skolornas jullov. I skolan firas först en julfest där barnen uppträder
      till exempel med sång. Barnen får julbetyg och sedan börjar jullovet som varar i cirka två veckor.
      Det är slutet på skolornas hösttermin. Efter lovet börjar vårterminen.
    sentences:
    - id: hb-c03-u0091-s001
      start: 0
      end: 47
    - id: hb-c03-u0091-s002
      start: 48
      end: 123
    - id: hb-c03-u0091-s003
      start: 124
      end: 199
    - id: hb-c03-u0091-s004
      start: 200
      end: 238
    - id: hb-c03-u0091-s005
      start: 239
      end: 270
  - type: paragraph
    id: hb-c03-u0092
    text: I dagens Finland firas åtminstone i större städer också andra fester, som invandrare hämtat
      med sig. Sådana fester är till exempel det kinesiska nyåret, det persiska eller kurdiska nyåret
      nowruz och muslimernas fastemånad ramadan. Under ramadan får vuxna muslimer inte äta eller dricka
      på dagen innan solen gått ner. Ramadan avslutas med den stora id-festen, då man samlas till festbord
      med vänner och släktingar.
    sentences:
    - id: hb-c03-u0092-s001
      start: 0
      end: 100
    - id: hb-c03-u0092-s002
      start: 101
      end: 230
    - id: hb-c03-u0092-s003
      start: 231
      end: 316
    - id: hb-c03-u0092-s004
      start: 317
      end: 413
- id: hb-c03-livets-fester
  title: Fester genom livet
  blocks:
  - type: paragraph
    id: hb-c03-u0093
    text: Till människans levnadslopp hör också många viktiga fester som inte är beroende av kalendern
      och som släkt, familj och vänner firar tillsammans.
    sentences:
    - id: hb-c03-u0093-s001
      start: 0
      end: 144
  - type: paragraph
    id: hb-c03-u0154
    text: Vid dopet får barnet ett namn och blir en del av församlingen.
    sentences:
    - id: hb-c03-u0154-s001
      start: 0
      end: 62
  - type: paragraph
    id: hb-c03-u0094
    text: Föräldrar som inte hör till kyrkan kan välja att ordna en namngivningsfest i stället, där familj
      och släktingar samlas för att fira det lilla barnet. Dopet eller namngivningsfesten ordnas hemma
      eller i kyrkan eller i någon annan festlokal och de närmaste släktingarna och vännerna bjuds in.
    sentences:
    - id: hb-c03-u0094-s001
      start: 0
      end: 149
    - id: hb-c03-u0094-s002
      start: 150
      end: 290
  - type: paragraph
    id: hb-c03-u0095
    text: Två faddrar utses åt barnet bland vännerna eller släktingarna. Ursprungligen var fadderns uppgift
      att vara en slags andlig förälder åt barnet och sköta om barnets kristna fostran. I dag tänker man
      mera att barnet är en särskilt viktig människa i fadderns liv och faddern följer barnets uppväxt.
    sentences:
    - id: hb-c03-u0095-s001
      start: 0
      end: 62
    - id: hb-c03-u0095-s002
      start: 63
      end: 179
    - id: hb-c03-u0095-s003
      start: 180
      end: 294
  - type: paragraph
    id: hb-c03-u0096
    text: I Finland kan barn konfirmera sig det år de fyller 15. Konfirmationen är en ceremoni som hålls
      i kyrkan. Där bekräftas den ungas kristna tro och medlemskapet i församlingen. Konfirmationen föregås
      av en skriftskola som innehåller religionsundervisning och som nuförtiden ofta hålls i form av ett
      sommarläger. En stor del av de unga deltar i skriftskollägret och konfirmationen för att det är
      roligt på lägret, för att föräldrarna förväntar sig att barnen ska göra det och för att det efter
      konfirmationen ordnas en fest hemma där den unga får presenter.
    sentences:
    - id: hb-c03-u0096-s001
      start: 0
      end: 54
    - id: hb-c03-u0096-s002
      start: 55
      end: 104
    - id: hb-c03-u0096-s003
      start: 105
      end: 173
    - id: hb-c03-u0096-s004
      start: 174
      end: 308
    - id: hb-c03-u0096-s005
      start: 309
      end: 553
  - type: paragraph
    id: hb-c03-u0097
    text: En del unga deltar vid samma ålder i ett Prometheus-läger som är ett religiöst och politiskt
      obundet livssynsläger. Lägrets syfte är att uppmuntra de unga till att utveckla sin egen livssyn.
      Efter lägret hålls en fest hemma där den unga får presenter.
    sentences:
    - id: hb-c03-u0097-s001
      start: 0
      end: 115
    - id: hb-c03-u0097-s002
      start: 116
      end: 190
    - id: hb-c03-u0097-s003
      start: 191
      end: 251
  - type: paragraph
    id: hb-c03-u0098
    text: När en ung människa gått igenom gymnasiet och klarat studentskrivningarna får hon avgångsbetyg
      från gymnasiet och ett studentbetyg. Med betyget kan hon ansöka om studieplats vid ett universitet
      eller en högskola. Studentexamen firas både i skolan och hemma hos studenten. I skolan får den unga
      sitt betyg och en studentmössa. Hemma väntar en kaffebjudning och presenter. Släktingar och vänner
      är inbjudna. De som utexamineras från yrkesskolor firar likadana fester.
    sentences:
    - id: hb-c03-u0098-s001
      start: 0
      end: 131
    - id: hb-c03-u0098-s002
      start: 132
      end: 212
    - id: hb-c03-u0098-s003
      start: 213
      end: 271
    - id: hb-c03-u0098-s004
      start: 272
      end: 325
    - id: hb-c03-u0098-s005
      start: 326
      end: 370
    - id: hb-c03-u0098-s006
      start: 371
      end: 405
    - id: hb-c03-u0098-s007
      start: 406
      end: 465
  - type: paragraph
    id: hb-c03-u0099
    text: I Finland firas framför allt barns födelsedagar. Barnen kan bjuda in sina kompisar på kalas.
      Många firar också med familj, släktingar och faddrar. På kalasen leker man, äter kaka och ger presenter.
      Även vuxna kan ordna kalas för att fira sin födelsedag, särskilt när de fyller jämna år som 50,
      60 eller 70.
    sentences:
    - id: hb-c03-u0099-s001
      start: 0
      end: 48
    - id: hb-c03-u0099-s002
      start: 49
      end: 92
    - id: hb-c03-u0099-s003
      start: 93
      end: 146
    - id: hb-c03-u0099-s004
      start: 147
      end: 197
    - id: hb-c03-u0099-s005
      start: 198
      end: 306
  - type: paragraph
    id: hb-c03-u0100
    text: När en människa dör ordnar släktingarna begravning i en kyrka, ett kapell eller någon annan
      lokal. Till begravningen kommer familj och släktingar, den dödas vänner och ibland också arbetskamrater.
      Efter den kyrkliga förrättningen samlas begravningsföljet till en minnesstund där man äter och dricker
      kaffe och minns den avlidne, alltså den som dött. I Finland kan begravningen ordnas enligt den religion
      som den avlidne hörde till. Begravningen kan också vara sekulär, om den avlidne inte hörde till
      något religiöst samfund.
    sentences:
    - id: hb-c03-u0100-s001
      start: 0
      end: 98
    - id: hb-c03-u0100-s002
      start: 99
      end: 196
    - id: hb-c03-u0100-s003
      start: 197
      end: 349
    - id: hb-c03-u0100-s004
      start: 350
      end: 431
    - id: hb-c03-u0100-s005
      start: 432
      end: 524
  - type: paragraph
    id: hb-c03-u0155
    text: Vid vigseln är ofta släktingar och vänner närvarande. Många ordnar en bröllopsfest efteråt där
      man äter, dansar och firar brudparet med olika programnummer. Till programmet hör ofta tal, lekar
      och uppträdanden. Brudparet får presenter. Bröllop är privata tillställningar dit man kan gå bara
      om man är bjuden. Eftersom det bjuds mat och dryck på bröllopsfesten kan det bli väldigt dyrt att
      ordna bröllop. Därför bjuder de flesta inte alla sina bekanta till bröllopet. Många par åker på
      bröllopsresa efter bröllopsfesten.
    sentences:
    - id: hb-c03-u0155-s001
      start: 0
      end: 53
    - id: hb-c03-u0155-s002
      start: 54
      end: 156
    - id: hb-c03-u0155-s003
      start: 157
      end: 210
    - id: hb-c03-u0155-s004
      start: 211
      end: 235
    - id: hb-c03-u0155-s005
      start: 236
      end: 308
    - id: hb-c03-u0155-s006
      start: 309
      end: 403
    - id: hb-c03-u0155-s007
      start: 404
      end: 466
    - id: hb-c03-u0155-s008
      start: 467
      end: 519
- id: hb-c03-matkultur
  title: Matkultur och matvanor
  blocks:
  - type: paragraph
    id: hb-c03-u0101
    text: Finländarnas matvanor har förändrats mycket under de senaste 50 åren. I affärerna finns ett
      brett utbud av råvaror från hela världen. I synnerhet utbudet av frukt och grönsaker har blivit
      mångsidigare. Människornas kost tar mycket mer än tidigare intryck från andra länder. Även utbudet
      av färdigmat och halvfabrikat har ökat, och för många är de en viktig del av vardagsmatlagningen.
    sentences:
    - id: hb-c03-u0101-s001
      start: 0
      end: 69
    - id: hb-c03-u0101-s002
      start: 70
      end: 133
    - id: hb-c03-u0101-s003
      start: 134
      end: 201
    - id: hb-c03-u0101-s004
      start: 202
      end: 273
    - id: hb-c03-u0101-s005
      start: 274
      end: 384
  - type: paragraph
    id: hb-c03-u0102
    text: Eftersom Finland tidigare var ett land med låg levnadsstandard, är många fortfarande noggranna
      med att inte laga för mycket mat, som sedan slängs. För att det inte ska uppstå något matsvinn är
      i synnerhet de äldre generationerna av den åsikten att man äter upp allt man har på tallriken. På
      matställen, där man själv får ta mat åt sig, tar man endast så mycket mat som man orkar äta.
    sentences:
    - id: hb-c03-u0102-s001
      start: 0
      end: 146
    - id: hb-c03-u0102-s002
      start: 147
      end: 287
    - id: hb-c03-u0102-s003
      start: 288
      end: 383
  - type: paragraph
    id: hb-c03-u0103
    text: I Finland lagar både männen och kvinnorna i hushållen mat och gör dagliga matinköp. Matlagning
      är en vanlig hobby, och människorna vill testa nya smaker och matlagningsmetoder. Olika länders
      kök och varierande mattrender kommer till finländarnas kännedom via internet, medier och resor och
      tack vare att Finland internationaliseras.
    sentences:
    - id: hb-c03-u0103-s001
      start: 0
      end: 83
    - id: hb-c03-u0103-s002
      start: 84
      end: 176
    - id: hb-c03-u0103-s003
      start: 177
      end: 332
  - type: paragraph
    id: hb-c03-u0104
    text: Att besöka torg och saluhallar eller små specialbutiker är mer sällsynt, men möjligt, i synnerhet
      i de större städerna. Torg är populära sommartid. På sommaren kan det dessutom ordnas torgevenemang
      för lokala producenter.
    sentences:
    - id: hb-c03-u0104-s001
      start: 0
      end: 119
    - id: hb-c03-u0104-s002
      start: 120
      end: 147
    - id: hb-c03-u0104-s003
      start: 148
      end: 221
  - type: paragraph
    id: hb-c03-u0105
    text: Förr åt människorna i Finland för det mesta potatis, men numera är ris och pasta vanliga. En
      vardagslunch är vanligtvis hälsosam och mångsidig, och på lunchrestaurangernas dagligen varierande
      matsedlar finns det ofta typiska finska maträtter.
    sentences:
    - id: hb-c03-u0105-s001
      start: 0
      end: 89
    - id: hb-c03-u0105-s002
      start: 90
      end: 242
  - type: paragraph
    id: hb-c03-u0106
    text: På restaurang äter man ofta till exempel pizza, hamburgare, sushi, pastarätter, kinesisk mat
      eller mat från Mellanöstern. I allmänhet beställer var och en i sällskapet en egen portion åt sig,
      och man delar vanligtvis inte på maten. Var och en betalar också ofta endast sin egen mat när man
      äter på restaurang.
    sentences:
    - id: hb-c03-u0106-s001
      start: 0
      end: 121
    - id: hb-c03-u0106-s002
      start: 122
      end: 231
    - id: hb-c03-u0106-s003
      start: 232
      end: 309
  - type: paragraph
    id: hb-c03-u0107
    text: Många är noggranna med att maten de äter är hälsosam, ekologisk och närproducerad. Många har
      minskat på användningen av fett och salt och ökat mängden frukt och grönsaker i sin kost.
    sentences:
    - id: hb-c03-u0107-s001
      start: 0
      end: 82
    - id: hb-c03-u0107-s002
      start: 83
      end: 182
  - type: paragraph
    id: hb-c03-u0108
    text: För många är det också viktigt att djuren som används till mat har behandlats väl. Många äter
      ingen animalisk mat alls, eftersom de inte vill skada djur eller eftersom de vill minska koldioxidutsläppen
      från matproduktionen. Veganismen och vegetarianismen har ökat i Finland under de senaste 20 åren.
      En vegansk kost innehåller inga animaliska produkter.
    sentences:
    - id: hb-c03-u0108-s001
      start: 0
      end: 82
    - id: hb-c03-u0108-s002
      start: 83
      end: 223
    - id: hb-c03-u0108-s003
      start: 224
      end: 299
    - id: hb-c03-u0108-s004
      start: 300
      end: 353
  - type: paragraph
    id: hb-c03-u0109
    text: Traditionell finsk mat har varit mild. Man använde lite kryddor, eftersom de måste hämtas långt
      ifrån och var dyra. Finland var länge ett fattigt land, där maten var anspråkslös och enkel. Typisk
      finsk mat var kött och fisk med kokt potatis.
    sentences:
    - id: hb-c03-u0109-s001
      start: 0
      end: 38
    - id: hb-c03-u0109-s002
      start: 39
      end: 115
    - id: hb-c03-u0109-s003
      start: 116
      end: 188
    - id: hb-c03-u0109-s004
      start: 189
      end: 241
  - type: paragraph
    id: hb-c03-u0110
    text: Den traditionella matkulturen i Finland är tudelad. I västra Finland har matkulturen inspirerats
      mycket av den svenska matkulturen och i östra Finland av den ryska. I norra Finland bedriver man
      dessutom renskötsel, och därför används ofta också renkött.
    sentences:
    - id: hb-c03-u0110-s001
      start: 0
      end: 51
    - id: hb-c03-u0110-s002
      start: 52
      end: 164
    - id: hb-c03-u0110-s003
      start: 165
      end: 253
  - type: paragraph
    id: hb-c03-u0111
    text: Ryska maträtter och matlagningsmetoder gör att den finska matkulturen skiljer sig från den i
      de övriga nordiska länderna. Finländarna använder gärna svamp i maten och lagar karelsk stek och
      karelska piroger. Även påskrätterna liknar de ryska, likaså bakverk med kvarg. Maträtter som är
      gemensamma med svenskarnas är till exempel ärtsoppa, pannkaka, köttbullar, kanelbullar och fastlagsbullar.
    sentences:
    - id: hb-c03-u0111-s001
      start: 0
      end: 121
    - id: hb-c03-u0111-s002
      start: 122
      end: 207
    - id: hb-c03-u0111-s003
      start: 208
      end: 268
    - id: hb-c03-u0111-s004
      start: 269
      end: 392
  - type: paragraph
    id: hb-c03-u0112
    text: På vintern är grönsakerna dyrare än på sommaren, eftersom många av dem importeras till Finland
      från utlandet. I dag finns nästan alla livsmedel tillgängliga året om, men många följer ändå skördesäsongen
      i sin matlagning.
    sentences:
    - id: hb-c03-u0112-s001
      start: 0
      end: 109
    - id: hb-c03-u0112-s002
      start: 110
      end: 220
  - type: paragraph
    id: hb-c03-u0113
    text: Skördesäsong betyder den tid då grönsaker, frukter och bär är som bäst och det finns mycket
      av dem. Också priset är lägre under skördesäsongen än annars. Om man till exempel vill köpa jordgubbar
      i juni finns det bra tillgång till finska bär och de är billigare. På vintern importeras jordgubbarna
      från utlandet och är därför mycket dyrare.
    sentences:
    - id: hb-c03-u0113-s001
      start: 0
      end: 99
    - id: hb-c03-u0113-s002
      start: 100
      end: 153
    - id: hb-c03-u0113-s003
      start: 154
      end: 261
    - id: hb-c03-u0113-s004
      start: 262
      end: 339
- id: hb-c03-vardagsmat
  title: Vardagsmat och måltider
  blocks:
  - type: paragraph
    id: hb-c03-u0114
    text: I den finska matkulturen är ingredienser från naturen viktiga, bland annat vilt, bär, fisk och
      svamp. Vilt, alltså till exempel älg och fåglar, jagas i jaktsällskap. Man måste ha tillstånd för
      att få jaga i Finland. Bär och svamp kan man plocka på sommaren och hösten.
    sentences:
    - id: hb-c03-u0114-s001
      start: 0
      end: 101
    - id: hb-c03-u0114-s002
      start: 102
      end: 165
    - id: hb-c03-u0114-s003
      start: 166
      end: 215
    - id: hb-c03-u0114-s004
      start: 216
      end: 268
  - type: paragraph
    id: hb-c03-u0115
    text: En del äter fisk, kött och potatis till vardags, medan andra lagar pastarätter eller köper hem
      sushi från en restaurang. I affären köper man fryspizza och portioner av färdigmat som värms i mikron.
      Typiska vardagsfavoriter är till exempel ugnslax, makaronilåda, köttbullar, köttfärssås, stekt fisk
      och soppor och olika gryt- och gröträtter som tillagas i ugnen.
    sentences:
    - id: hb-c03-u0115-s001
      start: 0
      end: 120
    - id: hb-c03-u0115-s002
      start: 121
      end: 197
    - id: hb-c03-u0115-s003
      start: 198
      end: 361
  - type: paragraph
    id: hb-c03-u0116
    text: Ett typiskt kännetecken för den finländska vardagsmaten är att äta tillsammans. I skolan får
      barnen gratis skolmat, som består av en varm lunchrätt. I daghemmen får barnen förutom lunch också
      frukost och mellanmål. En del av de vuxna som arbetar äter sin lunch i en matsal eller på en restaurang,
      medan andra har egen matsäck med sig. Den kan förvaras i kylskåpet på arbetsplatsen i väntan på
      lunchrasten. Många restauranger som serverar kvällsmat har vid lunchtid ett buffébord, där man själv
      får ta den mat man vill på tallriken.
    sentences:
    - id: hb-c03-u0116-s001
      start: 0
      end: 79
    - id: hb-c03-u0116-s002
      start: 80
      end: 148
    - id: hb-c03-u0116-s003
      start: 149
      end: 214
    - id: hb-c03-u0116-s004
      start: 215
      end: 334
    - id: hb-c03-u0116-s005
      start: 335
      end: 405
    - id: hb-c03-u0116-s006
      start: 406
      end: 531
  - type: paragraph
    id: hb-c03-u0117
    text: I Finland är det vanligt att äta gröt och bröd och dricka kaffe eller te till frukost. Många
      finländare gillar gröt och lagar olika slags gröt i mikron, på spisen eller i ugnen. Gröt lagas
      av till exempel havreflingor eller havregryn och vatten eller mjölk. I Finland bakas många olika
      slags bröd. Karakteristiskt för den finländska brödkulturen är den stora mängden och variationen
      av rågbröd.
    sentences:
    - id: hb-c03-u0117-s001
      start: 0
      end: 86
    - id: hb-c03-u0117-s002
      start: 87
      end: 177
    - id: hb-c03-u0117-s003
      start: 178
      end: 257
    - id: hb-c03-u0117-s004
      start: 258
      end: 297
    - id: hb-c03-u0117-s005
      start: 298
      end: 394
  - type: paragraph
    id: hb-c03-u0118
    text: På morgonen äter man frukost enligt vilken tid man vaknar. Lunch serveras tidigare än i många
      andra länder, omkring kl. 10.30–12. Lunchen består vanligtvis av varm mat, vilket innebär att många
      äter två varma måltider per dag. Lunchrasten är ganska kort både i skolorna och på arbetsplatserna.
      På grund av den tidiga lunchen äter många middag hemma redan kl. 17 eller 18. Dessutom är det vanligt
      att äta en lätt kvällsmåltid omkring kl. 20. I synnerhet för barnen är också mellanmålen mellan
      huvudmåltiderna viktiga.
    sentences:
    - id: hb-c03-u0118-s001
      start: 0
      end: 58
    - id: hb-c03-u0118-s002
      start: 59
      end: 129
    - id: hb-c03-u0118-s003
      start: 130
      end: 226
    - id: hb-c03-u0118-s004
      start: 227
      end: 293
    - id: hb-c03-u0118-s005
      start: 294
      end: 371
    - id: hb-c03-u0118-s006
      start: 372
      end: 440
    - id: hb-c03-u0118-s007
      start: 441
      end: 516
  - type: paragraph
    id: hb-c03-u0119
    text: Kranvattnet är drickbart överallt i Finland.
    sentences:
    - id: hb-c03-u0119-s001
      start: 0
      end: 44
  - type: paragraph
    id: hb-c03-u0120
    text: Att äta på restaurang är ofta dyrare i Finland än i andra länder. Också alkoholdrycker är dyra
      på restaurang. Du behöver inte lämna dricks, men du kan göra det om du vill tacka för en speciellt
      bra service.
    sentences:
    - id: hb-c03-u0120-s001
      start: 0
      end: 65
    - id: hb-c03-u0120-s002
      start: 66
      end: 109
    - id: hb-c03-u0120-s003
      start: 110
      end: 206
- id: hb-c03-festmat
  title: Festmat och drycker
  blocks:
  - type: paragraph
    id: hb-c03-u0121
    text: Finland har en rik tradition av festmat. På olika högtider lagar eller köper man maträtter,
      bakverk, drycker och delikatesser som är typiska för den aktuella högtiden.
    sentences:
    - id: hb-c03-u0121-s001
      start: 0
      end: 40
    - id: hb-c03-u0121-s002
      start: 41
      end: 167
  - type: paragraph
    id: hb-c03-u0122
    text: På många påskbord serveras lamm, ägg, memma, pasha och chokladägg. Äggen dekoreras och målas.
      Att måla ägg är ursprungligen en ortodox sed. Memma är en söt efterrätt av malt och rågmjöl som
      tillagas i ugn och äts med grädde och socker. Pasha är en efterrätt gjord av kvarg.
    sentences:
    - id: hb-c03-u0122-s001
      start: 0
      end: 66
    - id: hb-c03-u0122-s002
      start: 67
      end: 93
    - id: hb-c03-u0122-s003
      start: 94
      end: 139
    - id: hb-c03-u0122-s004
      start: 140
      end: 235
    - id: hb-c03-u0122-s005
      start: 236
      end: 273
  - type: paragraph
    id: hb-c03-u0123
    text: På valborg dricker man mjöd och äter munkar och struvor. Mjöd är en dryck som tillverkas genom
      jäsning av vatten, citron och socker och som många tillverkar hemma. Mjöd kan innehålla en liten
      mängd alkohol.
    sentences:
    - id: hb-c03-u0123-s001
      start: 0
      end: 56
    - id: hb-c03-u0123-s002
      start: 57
      end: 163
    - id: hb-c03-u0123-s003
      start: 164
      end: 206
  - type: paragraph
    id: hb-c03-u0124
    text: På midsommar firar många sommaren genom att grilla ute. På grillen grillas korv, kött och grönsaker.
      Kring midsommar kommer den första potatisen för säsongen till affärerna. De kokas och äts med smör
      och dill och sill.
    sentences:
    - id: hb-c03-u0124-s001
      start: 0
      end: 55
    - id: hb-c03-u0124-s002
      start: 56
      end: 100
    - id: hb-c03-u0124-s003
      start: 101
      end: 173
    - id: hb-c03-u0124-s004
      start: 174
      end: 218
  - type: paragraph
    id: hb-c03-u0125
    text: På sensommaren äter en del kräftor och ordnar kräftskiva för sina vänner. Traditionen med kräftskivor
      kommer från de svenskspråkiga kusttrakterna.
    sentences:
    - id: hb-c03-u0125-s001
      start: 0
      end: 73
    - id: hb-c03-u0125-s002
      start: 74
      end: 146
  - type: paragraph
    id: hb-c03-u0126
    text: Den traditionella finska julmaten är mångsidig och läcker. I risgrynsgröten läggs en skalad
      mandel. Enligt vissa traditioner får den som hittar mandeln i sin gröt lycka. Glögg, det vill säga
      en varm, kryddad saftdryck, serveras under julen med pepparkakor. Ibland innehåller glöggen också
      alkohol. På Luciadagen äter man saffransbullar formade som bokstaven s.
    sentences:
    - id: hb-c03-u0126-s001
      start: 0
      end: 58
    - id: hb-c03-u0126-s002
      start: 59
      end: 99
    - id: hb-c03-u0126-s003
      start: 100
      end: 169
    - id: hb-c03-u0126-s004
      start: 170
      end: 256
    - id: hb-c03-u0126-s005
      start: 257
      end: 297
    - id: hb-c03-u0126-s006
      start: 298
      end: 360
  - type: paragraph
    id: hb-c03-u0127
    text: På julbordet serveras de bästa traditionella delikatesserna. Många steker julskinkan själv hemma.
      Med den serveras kokt potatis och lådrätter, det vill säga rotsaksrätter tillagade i ugn, till exempel
      kålrots-, potatis- och morotslåda. Till julbordet hör också sillsallad, det vill säga en sallad
      gjord av kokta och hackade rotsaker. På julen äter man också mycket fisk och olika slags sillar,
      strömming, gravad lax samt lutfisk av torkad fisk, som enligt många är en av de bästa juldelikatesserna.
    sentences:
    - id: hb-c03-u0127-s001
      start: 0
      end: 60
    - id: hb-c03-u0127-s002
      start: 61
      end: 97
    - id: hb-c03-u0127-s003
      start: 98
      end: 235
    - id: hb-c03-u0127-s004
      start: 236
      end: 333
    - id: hb-c03-u0127-s005
      start: 334
      end: 498
  - type: paragraph
    id: hb-c03-u0128
    text: I februari finns det runebergstårtor och fastlagsbullar i affärerna. Runebergstårtorna smakar
      mandel och ovanpå dem finns hallonsylt. En fastlagsbulle är en stor, rund bulle skuren på mitten.
      Mellan halvorna finns vispgrädde och mandelmassa eller sylt. På fastlagen äter man också ärtsoppa.
      Andra delikatesser som hör början av vintern till är blinier, det vill säga plättar av bovetemjöl,
      som ingår i den ortodoxa fastlagstraditionen.
    sentences:
    - id: hb-c03-u0128-s001
      start: 0
      end: 68
    - id: hb-c03-u0128-s002
      start: 69
      end: 133
    - id: hb-c03-u0128-s003
      start: 134
      end: 191
    - id: hb-c03-u0128-s004
      start: 192
      end: 252
    - id: hb-c03-u0128-s005
      start: 253
      end: 290
    - id: hb-c03-u0128-s006
      start: 291
      end: 435
  - type: paragraph
    id: hb-c03-u0129
    text: I Finland dricker människorna vanligtvis vatten, mjölk eller ibland surmjölk till maten. Surmjölk
      är syrad mjölk.
    sentences:
    - id: hb-c03-u0129-s001
      start: 0
      end: 88
    - id: hb-c03-u0129-s002
      start: 89
      end: 113
  - type: paragraph
    id: hb-c03-u0156
    text: Man dricker kaffe på morgonen, dagen och kvällen, på jobbet och hemma, när det är fest och till
      vardags och på kafé eller till exempel utflykter i naturen. Kafferasten på arbetsplatsen är en trevlig
      social paus i arbetet. Under rasten kan man fråga arbetskamraterna om det hänt någonting nytt. Istället
      för kaffe kan man också dricka te eller någon annan dryck.
    sentences:
    - id: hb-c03-u0156-s001
      start: 0
      end: 155
    - id: hb-c03-u0156-s002
      start: 156
      end: 221
    - id: hb-c03-u0156-s003
      start: 222
      end: 293
    - id: hb-c03-u0156-s004
      start: 294
      end: 361
  - type: paragraph
    id: hb-c03-u0130
    text: I Finland har det länge tillverkats och druckits alkoholdrycker. Finlands klimat är för kallt
      för att odla vinrankor, men potatis och spannmål lyckas bra. Av dem görs starksprit. Många finländare
      dricker gärna också öl och vin.
    sentences:
    - id: hb-c03-u0130-s001
      start: 0
      end: 64
    - id: hb-c03-u0130-s002
      start: 65
      end: 154
    - id: hb-c03-u0130-s003
      start: 155
      end: 178
    - id: hb-c03-u0130-s004
      start: 179
      end: 227
  - type: paragraph
    id: hb-c03-u0131
    text: I Finland använder en del människor mycket alkohol. Både män och kvinnor dricker alkohol. I
      Finland är det inte en lika stor skam att vara full som i en del andra kulturer. Många finländare
      anser att de är mer sociala och avslappnade när de är fulla.
    sentences:
    - id: hb-c03-u0131-s001
      start: 0
      end: 51
    - id: hb-c03-u0131-s002
      start: 52
      end: 89
    - id: hb-c03-u0131-s003
      start: 90
      end: 172
    - id: hb-c03-u0131-s004
      start: 173
      end: 250
  - type: paragraph
    id: hb-c03-u0132
    text: Alkohol orsakar varje år många allvarliga hälsoproblem, sociala problem och dödsfall. Alkoholanvändningen
      har ändå minskat i Finland under de senaste åren. I synnerhet unga dricker mindre alkohol än de
      äldre åldersklasserna.
    sentences:
    - id: hb-c03-u0132-s001
      start: 0
      end: 85
    - id: hb-c03-u0132-s002
      start: 86
      end: 155
    - id: hb-c03-u0132-s003
      start: 156
      end: 224
  - type: paragraph
    id: hb-c03-u0133
    text: Alkoholdrycker är relativt dyra i Finland och köpet av dem begränsas med åldersgränser för unga
      personer. I mataffären säljs endast milda alkoholdrycker. Starka alkoholdrycker köper man i de statligt
      reglerade Alko-butikerna. Att köra bil under alkoholpåverkan är förbjudet enligt lag och det kan
      ge ett hårt straff.
    sentences:
    - id: hb-c03-u0133-s001
      start: 0
      end: 105
    - id: hb-c03-u0133-s002
      start: 106
      end: 153
    - id: hb-c03-u0133-s003
      start: 154
      end: 225
    - id: hb-c03-u0133-s004
      start: 226
      end: 316
- id: hb-c03-bastu
  title: Bastukultur
  blocks:
  - type: paragraph
    id: hb-c03-u0134
    text: Att bada bastu är för många som bor i Finland en viktig del av både vardag och fest. Bastutraditionen
      är en så viktig del av kulturen att den har upptagits på Unescos lista över mänsklighetens immateriella
      kulturarv. I bastun tvättar man sig, kopplar av och tillbringar tid med vänner, släktingar eller
      arbetskamrater. I Finland badar kvinnor och män i allmänhet var för sig. Om man badar tillsammans
      kan man använda baddräkt i bastun.
    sentences:
    - id: hb-c03-u0134-s001
      start: 0
      end: 84
    - id: hb-c03-u0134-s002
      start: 85
      end: 216
    - id: hb-c03-u0134-s003
      start: 217
      end: 318
    - id: hb-c03-u0134-s004
      start: 319
      end: 375
    - id: hb-c03-u0134-s005
      start: 376
      end: 435
  - type: paragraph
    id: hb-c03-u0135
    text: Många olika traditioner är förknippade med uppvärmningen av bastun och bastubadandet. Bastubad
      är en del av mångas högtidsfirande, till exempel jul eller midsommar. Lika väl är bastun någonting
      vardagligt. Det är vanligt att egnahemshus och bostäder har en egen bastu. I höghus kan det finnas
      en gemensam bastu, där man kan boka en bastutid.
    sentences:
    - id: hb-c03-u0135-s001
      start: 0
      end: 85
    - id: hb-c03-u0135-s002
      start: 86
      end: 164
    - id: hb-c03-u0135-s003
      start: 165
      end: 205
    - id: hb-c03-u0135-s004
      start: 206
      end: 268
    - id: hb-c03-u0135-s005
      start: 269
      end: 341
  - type: paragraph
    id: hb-c03-u0136
    text: I simhallar och många allmänna bastur finns separata bastur för män och kvinnor. I simhallar
      får man inte gå in i bastun med simbyxorna eller baddräkten på. Om du vill, kan du använda en handduk.
      I många blandbastur använd simbyxor eller baddräkt. I en blandbastu bastar män och kvinnor tillsammans.
    sentences:
    - id: hb-c03-u0136-s001
      start: 0
      end: 80
    - id: hb-c03-u0136-s002
      start: 81
      end: 156
    - id: hb-c03-u0136-s003
      start: 157
      end: 195
    - id: hb-c03-u0136-s004
      start: 196
      end: 247
    - id: hb-c03-u0136-s005
      start: 248
      end: 299
  - type: paragraph
    id: hb-c03-u0137
    text: Finländarna är vana med att vara nakna i bastun och bastubad är inte förknippat med något sexuellt.
    sentences:
    - id: hb-c03-u0137-s001
      start: 0
      end: 99
  - type: paragraph
    id: hb-c03-u0138
    text: Den finska bastuns historia går tusentals år bakåt i tiden. Det finska ordet för bastu, ”sauna”,
      är ett gammalt finskt ord.
    sentences:
    - id: hb-c03-u0138-s001
      start: 0
      end: 59
    - id: hb-c03-u0138-s002
      start: 60
      end: 123
  - type: paragraph
    id: hb-c03-u0139
    text: I den kalla Norden var bastun ofta det första man byggde när människorna flyttade till nya områden.
      Förutom för att bada har man också fött barn i bastun och använt den för olika slags ritualer. Bastun
      har varit en helig plats, vilket återspeglas på bastuupplevelsen än idag.
    sentences:
    - id: hb-c03-u0139-s001
      start: 0
      end: 99
    - id: hb-c03-u0139-s002
      start: 100
      end: 194
    - id: hb-c03-u0139-s003
      start: 195
      end: 275
  - id: hb-c03-u0141
    type: list
    ordered: false
    items:
    - id: hb-c03-u0140
      text: 'sauna (bastu): rum eller byggnad, där det finns en bastuugn eller ett bastuaggregat och som
        värms upp till en hög temperatur'
      sentences:
      - id: hb-c03-u0140-s001
        start: 0
        end: 124
    - id: hb-c03-u0142
      text: 'kiuas (bastuugn eller bastuaggregat): en ugn eller ett aggregat med stenar längst upp'
      sentences:
      - id: hb-c03-u0142-s001
        start: 0
        end: 85
    - id: hb-c03-u0143
      text: 'löyly (bad): vattenångan som stiger upp från stenarna när man kastar bad'
      sentences:
      - id: hb-c03-u0143-s001
        start: 0
        end: 72
    - id: hb-c03-u0144
      text: 'vasta eller vihta: ett knippe björkris som man klappar eller piskar kroppen med i bastun.
        I västra Finland kallas bastukvasten för vihta, och i östra Finland för vasta.'
      sentences:
      - id: hb-c03-u0144-s001
        start: 0
        end: 89
      - id: hb-c03-u0144-s002
        start: 90
        end: 168
    - id: hb-c03-u0145
      text: 'lauteet (lave): bänkarna i bastun som man sitter på.'
      sentences:
      - id: hb-c03-u0145-s001
        start: 0
        end: 52
- id: hb-c03-kulturliv
  title: Kulturliv
  blocks:
  - type: paragraph
    id: hb-c03-u0146
    text: I Finland visas filmerna oftast på originalspråket. Dessutom är de textade till finska och svenska.
      Ibland är filmer för barn dubbade till finska.
    sentences:
    - id: hb-c03-u0146-s001
      start: 0
      end: 51
    - id: hb-c03-u0146-s002
      start: 52
      end: 99
    - id: hb-c03-u0146-s003
      start: 100
      end: 146
  - type: paragraph
    id: hb-c03-u0147
    text: I de flesta städerna i Finland finns en teater. En del teatrar är professionella, andra är amatörteatrar.
      Föreställningsspråket är finska, men på vissa orter finns även svenskspråkiga teatrar.
    sentences:
    - id: hb-c03-u0147-s001
      start: 0
      end: 47
    - id: hb-c03-u0147-s002
      start: 48
      end: 105
    - id: hb-c03-u0147-s003
      start: 106
      end: 192
  - type: paragraph
    id: hb-c03-u0148
    text: I Finland finns det ett museum på nästan alla orter. De presenterar konst, historia, natur,
      någon person eller ett specialområde. Finländsk konst presenteras till exempel i Ateneum som hör
      till Nationalgalleriet och Esbo moderna konstmuseum (EMMA). Med Finlands kulturhistoria kan du bekanta
      dig till exempel på Finlands nationalmuseum i Helsingfors.
    sentences:
    - id: hb-c03-u0148-s001
      start: 0
      end: 52
    - id: hb-c03-u0148-s002
      start: 53
      end: 129
    - id: hb-c03-u0148-s003
      start: 130
      end: 248
    - id: hb-c03-u0148-s004
      start: 249
      end: 350
  - type: paragraph
    id: hb-c03-u0149
    text: I Finland finns många möjligheter att syssla med musik. På många orter finns medborgarinstitut
      som ordnar förmånlig musikundervisning. Dessutom erbjuder även privata musikskolor och -institut
      musikundervisning.
    sentences:
    - id: hb-c03-u0149-s001
      start: 0
      end: 55
    - id: hb-c03-u0149-s002
      start: 56
      end: 134
    - id: hb-c03-u0149-s003
      start: 135
      end: 210
  - type: paragraph
    id: hb-c03-u0150
    text: Medborgarinstitutens musikgrupper är öppna för alla. Du kan ansöka till musikskolorna genom
      ett inträdesprov.
    sentences:
    - id: hb-c03-u0150-s001
      start: 0
      end: 52
    - id: hb-c03-u0150-s002
      start: 53
      end: 109
