schema_version: 1
id: hb-c08
language: sv
title: Utbildning och lärande
sections:
- id: hb-c08-utveckling
  title: Utbildningssystemets utveckling
  blocks:
  - type: paragraph
    id: hb-c08-u0001
    text: Samhälleliga förändringar sker alltid av någon orsak. Vanligen ligger det ett behov eller en
      ideologi bakom dem. Det finländska utbildningssystemets uppkomst och utveckling har också påverkats
      av samhälleliga behov och ideologier. De första skolorna grundades i Finland för över 700 år sedan
      i anslutning till den katolska kyrkan. Då bodde nästan alla finländare på landsbygden och under
      en lång tid var skolgång möjlig endast för ett fåtal pojkar ur den övre samhällsklassen. De utbildades
      främst till präster.
    sentences:
    - id: hb-c08-u0001-s001
      start: 0
      end: 53
    - id: hb-c08-u0001-s002
      start: 54
      end: 112
    - id: hb-c08-u0001-s003
      start: 113
      end: 230
    - id: hb-c08-u0001-s004
      start: 231
      end: 330
    - id: hb-c08-u0001-s005
      start: 331
      end: 476
    - id: hb-c08-u0001-s006
      start: 477
      end: 511
  - type: paragraph
    id: hb-c08-u0002
    text: I många europeiska länder började reformationen på 1500-talet. Nya kyrkosamfund, till exempel
      det lutherska, separerade från den katolska kyrkan. Även Finland var tidigare ett katolskt land
      som i och med reformationen gick över till lutherdom. Reformationen ledde småningom till en ändrad
      syn på utbildning, eftersom den lutherska kyrkan betonade folkspråk och läskunnighet. Tanken var
      att alla i församlingen skulle må bra av att själv kunna läsa Bibeln.
    sentences:
    - id: hb-c08-u0002-s001
      start: 0
      end: 62
    - id: hb-c08-u0002-s002
      start: 63
      end: 145
    - id: hb-c08-u0002-s003
      start: 146
      end: 243
    - id: hb-c08-u0002-s004
      start: 244
      end: 374
    - id: hb-c08-u0002-s005
      start: 375
      end: 455
  - type: paragraph
    id: hb-c08-u0003
    text: I början av 1800-talet blev Finland en autonom del av Ryssland, vilket ändrade Finlands ställning.
      Det var ändå fortfarande kyrkan som skötte folkets utbildning ända till mitten av 1800-talet. Efter
      det började det finländska samhället ändras i allt snabbare takt.
    sentences:
    - id: hb-c08-u0003-s001
      start: 0
      end: 98
    - id: hb-c08-u0003-s002
      start: 99
      end: 192
    - id: hb-c08-u0003-s003
      start: 193
      end: 264
  - type: paragraph
    id: hb-c08-u0004
    text: I och med industrialiseringen skildes skolan från kyrkan. Arbetande föräldrar kunde inte längre
      sköta sina barn på dagtid, så det uppstod ett behov av att utveckla skolsystemet.
    sentences:
    - id: hb-c08-u0004-s001
      start: 0
      end: 57
    - id: hb-c08-u0004-s002
      start: 58
      end: 177
  - type: paragraph
    id: hb-c08-u0005
    text: Kommunerna började grunda folkskolor separat från kyrkan och dessa skolor spreds småningom till
      hela landet.
    sentences:
    - id: hb-c08-u0005-s001
      start: 0
      end: 108
  - type: paragraph
    id: hb-c08-u0006
    text: Vid sidan av folkskolorna fanns också läroverk, av vilka många var privata. I dem gick främst
      rikare familjers barn. Det tog flera tiotals år innan hela befolkningen omfattades av utbildningen,
      för särskilt på landsbygden var det många som inte förstod vikten av utbildning och som ställde
      sig misstroget till att skicka sina barn till skolan.
    sentences:
    - id: hb-c08-u0006-s001
      start: 0
      end: 75
    - id: hb-c08-u0006-s002
      start: 76
      end: 116
    - id: hb-c08-u0006-s003
      start: 117
      end: 343
  - type: paragraph
    id: hb-c08-u0007
    text: Först på 1900-talets sida började större delen av befolkningen stöda folkskolan och 1921 stiftades
      en lag om läroplikt i Finland. Det betydde att skolgång blev obligatoriskt för alla. Folkskolan
      utvidgades till att omfatta hela åldersklassen på 1920- och 1930-talet.
    sentences:
    - id: hb-c08-u0007-s001
      start: 0
      end: 129
    - id: hb-c08-u0007-s002
      start: 130
      end: 183
    - id: hb-c08-u0007-s003
      start: 184
      end: 266
  - type: paragraph
    id: hb-c08-u0008
    text: Gymnasieutbildning och studentexamen blev vanligare särskilt på 1950- och 1960-talet. I Finland
      började man eftersträva samhällelig jämlikhet och ekonomisk utveckling genom att bygga en välfärdsstat.
      Samtidigt föddes tanken på en enhetlig 9-årig grundskola. Under 1970-talet övergick man i hela landet
      från det gamla systemet med separat folkskola och läroverk till en grundskola som var gemensam för
      alla.
    sentences:
    - id: hb-c08-u0008-s001
      start: 0
      end: 85
    - id: hb-c08-u0008-s002
      start: 86
      end: 199
    - id: hb-c08-u0008-s003
      start: 200
      end: 257
    - id: hb-c08-u0008-s004
      start: 258
      end: 406
  - type: paragraph
    id: hb-c08-u0009
    text: Utvecklingen av utbildningssystemet var en viktig del av uppbyggnaden av välfärdssamhället i
      Finland. Höjningen av medborgarnas utbildningsnivå under de senaste hundra åren har bidragit till
      landets ekonomiska utveckling och uppkomsten av ett mer jämställt samhälle.
    sentences:
    - id: hb-c08-u0009-s001
      start: 0
      end: 101
    - id: hb-c08-u0009-s002
      start: 102
      end: 266
  - type: paragraph
    id: hb-c08-u0010
    text: I Finland kan man få en utbildning enligt utbildningssystemet på finska eller svenska. I de
      svenskspråkiga skolorna studerar man också finska. Studierna i finska inleds ofta redan i årskurs
      ett. I de finskspråkiga skolorna studerar man svenska oftast från och med årskurs sex.
    sentences:
    - id: hb-c08-u0010-s001
      start: 0
      end: 86
    - id: hb-c08-u0010-s002
      start: 87
      end: 142
    - id: hb-c08-u0010-s003
      start: 143
      end: 194
    - id: hb-c08-u0010-s004
      start: 195
      end: 276
  - type: paragraph
    id: hb-c08-u0011
    text: Bakgrunden till det finländska utbildningssystemet är en idé om kontinuerligt lärande. Med kontinuerligt
      lärande avses allt lärande som sker genom hela livet och som syftar till att utveckla individens
      kunskaper, färdigheter och förmågor i både det personliga livet och arbetslivet. Människan lär sig
      såväl i skolan som i livet, till exempel i vardagen och hobbyer.
    sentences:
    - id: hb-c08-u0011-s001
      start: 0
      end: 86
    - id: hb-c08-u0011-s002
      start: 87
      end: 282
    - id: hb-c08-u0011-s003
      start: 283
      end: 365
  - type: paragraph
    id: hb-c08-u0012
    text: Lärandet och studierna upphör inte när en person avlägger sin examen eller blir myndig. Det
      är bra att utveckla sig själv under hela livet, eftersom det omgivande samhället och arbetslivet
      hela tiden förändras. Med hjälp av utbildning kan vem som helst ha möjlighet att få en bättre ställning
      i samhället. Lärande och bildning är viktiga och användbara för det egna välbefinnandet.
    sentences:
    - id: hb-c08-u0012-s001
      start: 0
      end: 87
    - id: hb-c08-u0012-s002
      start: 88
      end: 210
    - id: hb-c08-u0012-s003
      start: 211
      end: 305
    - id: hb-c08-u0012-s004
      start: 306
      end: 381
  - type: paragraph
    id: hb-c08-u0013
    text: Lärande och utbildning hjälper människor att klara sig både i det föränderliga arbetslivet och
      i en värld som blir alltmer internationell. Finland klarar sig bättre i den internationella konkurrensen
      om samhället satsar på att utbilda befolkningen.
    sentences:
    - id: hb-c08-u0013-s001
      start: 0
      end: 138
    - id: hb-c08-u0013-s002
      start: 139
      end: 248
- id: hb-c08-smabarn
  title: Småbarnspedagogik
  blocks:
  - type: paragraph
    id: hb-c08-u0193
    text: Småbarnspedagogik är avsedd för barn under skolåldern. I Finland tillhandahåller kommunerna
      kommunal småbarnspedagogik bland annat i daghem. Dessutom finns det privata daghem.
    sentences:
    - id: hb-c08-u0193-s001
      start: 0
      end: 54
    - id: hb-c08-u0193-s002
      start: 55
      end: 140
    - id: hb-c08-u0193-s003
      start: 141
      end: 175
  - type: paragraph
    id: hb-c08-u0014
    text: Småbarnspedagogik är fostran, undervisning och omsorg som är pedagogiskt planerad och som har
      noga genomtänkta mål. Inom småbarnspedagogiken arbetar utbildade lärare inom småbarnspedagogik,
      socionomer och barnskötare.
    sentences:
    - id: hb-c08-u0014-s001
      start: 0
      end: 115
    - id: hb-c08-u0014-s002
      start: 116
      end: 217
  - type: paragraph
    id: hb-c08-u0015
    text: I Finland har ett barn rätt till småbarnspedagogik från början av den månad då barnet fyller
      nio månader. Vissa föräldrar tar dock hand om barnet längre hemma. I genomsnitt börjar barnen inom
      småbarnspedagogik när de är 1,5–2 år gamla.
    sentences:
    - id: hb-c08-u0015-s001
      start: 0
      end: 105
    - id: hb-c08-u0015-s002
      start: 106
      end: 159
    - id: hb-c08-u0015-s003
      start: 160
      end: 235
  - type: paragraph
    id: hb-c08-u0016
    text: Familjedagvård innebär att skötaren vårdar barnen i sitt eget hem. Vissa familjedagvårdare vårdar
      barnen hemma hos de barn som ingår i gruppen.
    sentences:
    - id: hb-c08-u0016-s001
      start: 0
      end: 66
    - id: hb-c08-u0016-s002
      start: 67
      end: 143
  - type: paragraph
    id: hb-c08-u0017
    text: Avgiften för småbarnspedagogik (varhaiskasvatusmaksu) beror på
    sentences:
    - id: hb-c08-u0017-s001
      start: 0
      end: 62
  - id: hb-c08-u0019
    type: list
    ordered: false
    items:
    - id: hb-c08-u0018
      text: familjens inkomster
      sentences:
      - id: hb-c08-u0018-s001
        start: 0
        end: 19
    - id: hb-c08-u0020
      text: familjens storlek och
      sentences:
      - id: hb-c08-u0020-s001
        start: 0
        end: 21
    - id: hb-c08-u0021
      text: på hur många timmar per vecka barnet deltar i småbarnspedagogik.
      sentences:
      - id: hb-c08-u0021-s001
        start: 0
        end: 64
  - type: paragraph
    id: hb-c08-u0022
    text: Man får syskonrabatt. Om familjen inkomster är mycket låga, kan småbarnspedagogiken vara kostnadsfri
      för familjen. Fråga mer i din kommuns rådgivningstjänster.
    sentences:
    - id: hb-c08-u0022-s001
      start: 0
      end: 21
    - id: hb-c08-u0022-s002
      start: 22
      end: 114
    - id: hb-c08-u0022-s003
      start: 115
      end: 159
  - type: paragraph
    id: hb-c08-u0023
    text: Du kan också leta upp en privat familjedagvårdare som vårdar barnen hemma hos sig, eller anställa
      en skötare i ditt eget hem. Om du anställer en skötare i ditt hem blir du en arbetsgivare, och du
      måste uppfylla en arbetsgivares skyldigheter. Familjen kan anställa en skötare i sitt hem även tillsammans
      med en annan familj.
    sentences:
    - id: hb-c08-u0023-s001
      start: 0
      end: 125
    - id: hb-c08-u0023-s002
      start: 126
      end: 241
    - id: hb-c08-u0023-s003
      start: 242
      end: 323
  - type: paragraph
    id: hb-c08-u0024
    text: Kommunen övervakar den privata småbarnspedagogiken.
    sentences:
    - id: hb-c08-u0024-s001
      start: 0
      end: 51
  - type: paragraph
    id: hb-c08-u0025
    text: Priserna för den privata småbarnspedagogiken varierar. Du kan emellertid få stöd för den från
      FPA. Då är den inte nödvändigtvis mycket dyrare än den kommunala småbarnspedagogiken. Vissa kommuner
      kan även erbjuda servicesedlar, med vilka du kan betala kostnaderna för privat vård, så att den
      är förmånlig för dig. Fråga mer vid din kommun.
    sentences:
    - id: hb-c08-u0025-s001
      start: 0
      end: 54
    - id: hb-c08-u0025-s002
      start: 55
      end: 98
    - id: hb-c08-u0025-s003
      start: 99
      end: 179
    - id: hb-c08-u0025-s004
      start: 180
      end: 312
    - id: hb-c08-u0025-s005
      start: 313
      end: 338
  - type: paragraph
    id: hb-c08-u0194
    text: Om barnet har en hemkommun i Finland , kan du ansöka om stöd för privat vård hos FPA. Producenten
      av småbarnspedagogik måste ha kommunens godkännande.
    sentences:
    - id: hb-c08-u0194-s001
      start: 0
      end: 85
    - id: hb-c08-u0194-s002
      start: 86
      end: 150
  - type: paragraph
    id: hb-c08-u0195
    text: Du kan ansöka om privatvårdsstöd (yksityisen hoidon tuki), om
    sentences:
    - id: hb-c08-u0195-s001
      start: 0
      end: 61
  - id: hb-c08-u0197
    type: list
    ordered: false
    items:
    - id: hb-c08-u0196
      text: ditt barn som är under skolåldern är i privat dagvård, eller
      sentences:
      - id: hb-c08-u0196-s001
        start: 0
        end: 60
    - id: hb-c08-u0198
      text: barnet har någon annan privat skötare.
      sentences:
      - id: hb-c08-u0198-s001
        start: 0
        end: 38
  - type: paragraph
    id: hb-c08-u0199
    text: Du kan inte ansöka om privatvårdsstöd om skötaren är en medlem i barnets familj eller om barnet
      och skötaren bor i samma hushåll. Du kan inte heller ansöka om privatvårdsstöd för den kommunala
      småbarnspedagogiken.
    sentences:
    - id: hb-c08-u0199-s001
      start: 0
      end: 129
    - id: hb-c08-u0199-s002
      start: 130
      end: 213
  - type: paragraph
    id: hb-c08-u0200
    text: Stödets storlek beror bland annat på familjens inkomster och kommunen som familjen bor i.
    sentences:
    - id: hb-c08-u0200-s001
      start: 0
      end: 89
  - type: paragraph
    id: hb-c08-u0201
    text: FPA betalar stödet direkt till skötaren eller producenten av småbarnspedagogik. Man måste betala
      skatt för privatvårdsstödet. Stödet betalas inte till utlandet.
    sentences:
    - id: hb-c08-u0201-s001
      start: 0
      end: 79
    - id: hb-c08-u0201-s002
      start: 80
      end: 125
    - id: hb-c08-u0201-s003
      start: 126
      end: 160
  - type: paragraph
    id: hb-c08-u0026
    text: Till småbarnspedagogiken hör mångsidig verksamhet, till exempel lekar, motion, utevistelse,
      musik, pyssel och utfärder. I dagen ingår också en vilostund. Målsättningen med verksamheten är
      att främja barnets utveckling och lärande. Barnet lär sig även sociala färdigheter. Barnet får stöd
      i att lära sig det finska eller svenska språket, om hans/hennes modersmål är ett annat språk. Om
      barnet behöver, kan hen även få specialundervisning.
    sentences:
    - id: hb-c08-u0026-s001
      start: 0
      end: 119
    - id: hb-c08-u0026-s002
      start: 120
      end: 153
    - id: hb-c08-u0026-s003
      start: 154
      end: 230
    - id: hb-c08-u0026-s004
      start: 231
      end: 271
    - id: hb-c08-u0026-s005
      start: 272
      end: 381
    - id: hb-c08-u0026-s006
      start: 382
      end: 437
  - type: paragraph
    id: hb-c08-u0027
    text: Daghemmet är ändå inte en skola. Barnen studerar inte skolämnen och har inte lektioner.
    sentences:
    - id: hb-c08-u0027-s001
      start: 0
      end: 32
    - id: hb-c08-u0027-s002
      start: 33
      end: 87
  - type: paragraph
    id: hb-c08-u0028
    text: 'Barnen äter tre måltider under dagen: frukost, lunch och mellanmål. Om ditt barn har en specialdiet
      ska du berätta om det för lärarna i småbarnspedagogiken.'
    sentences:
    - id: hb-c08-u0028-s001
      start: 0
      end: 67
    - id: hb-c08-u0028-s002
      start: 68
      end: 156
  - type: paragraph
    id: hb-c08-u0029
    text: I småbarnspedagogiken beaktas familjens religion eller livsåskådning.
    sentences:
    - id: hb-c08-u0029-s001
      start: 0
      end: 69
  - type: paragraph
    id: hb-c08-u0030
    text: Vanligen börjar dagen på daghemmet på morgonen och slutar på eftermiddagen. Vissa daghem har
      öppet dygnet runt med anledning av föräldrarnas arbete eller studier.
    sentences:
    - id: hb-c08-u0030-s001
      start: 0
      end: 75
    - id: hb-c08-u0030-s002
      start: 76
      end: 162
- id: hb-c08-forskola
  title: Förskoleundervisning
  blocks:
  - type: paragraph
    id: hb-c08-u0031
    text: När ett barn är sex år gammalt, det vill säga året innan läroplikten börjar, deltar hen i förskoleundervisning.
      Syftet med förskoleundervisningen är att främja barnets förutsättningar att växa, utvecklas och
      lära sig. Förskoleundervisningen pågår i ett år innan skolan börjar. Det är bindande att delta i
      förskoleundervisning eller annan verksamhet som uppnår målen för förskoleundervisningen. I talspråk
      kallas förskoleundervisningen ofta för förskola.
    sentences:
    - id: hb-c08-u0031-s001
      start: 0
      end: 111
    - id: hb-c08-u0031-s002
      start: 112
      end: 217
    - id: hb-c08-u0031-s003
      start: 218
      end: 276
    - id: hb-c08-u0031-s004
      start: 277
      end: 393
    - id: hb-c08-u0031-s005
      start: 394
      end: 453
  - type: paragraph
    id: hb-c08-u0032
    text: Huvudansvaret för genomförandet av förskoleundervisningen ligger på lärarna, som vanligtvis
      har en utbildning som lärare inom småbarnspedagogik eller som klasslärare. I förskolegrupperna arbetar
      också en annan lärare, barnskötare eller assistent. Förskolepersonalen diskuterar regelbundet barnets
      fostran och utveckling tillsammans med föräldrarna och vårdnadshavarna.
    sentences:
    - id: hb-c08-u0032-s001
      start: 0
      end: 166
    - id: hb-c08-u0032-s002
      start: 167
      end: 246
    - id: hb-c08-u0032-s003
      start: 247
      end: 368
  - type: paragraph
    id: hb-c08-u0033
    text: Förskoleundervisningen är avgiftsfri, och under förskoledagen får barnen en avgiftsfri varm
      måltid. Undervisning ges i allmänhet fyra timmar per dag. Också läromedlen är avgiftsfria. Om föräldrarna
      arbetar, deltar barnet vanligtvis i småbarnspedagogik på eftermiddagen efter förskoleundervisningen.
      Då betalar föräldrarna normal klientavgift för småbarnspedagogik för halva dagen.
    sentences:
    - id: hb-c08-u0033-s001
      start: 0
      end: 99
    - id: hb-c08-u0033-s002
      start: 100
      end: 149
    - id: hb-c08-u0033-s003
      start: 150
      end: 182
    - id: hb-c08-u0033-s004
      start: 183
      end: 298
    - id: hb-c08-u0033-s005
      start: 299
      end: 380
  - type: paragraph
    id: hb-c08-u0034
    text: Inom förskoleundervisningen får barnet färdigheter som hen kan använda för att lära sig nya
      saker. Förskoleundervisningen stärker barnets sociala färdigheter och självkänsla. Syftet är att
      ge barnen positiva upplevelser av lärande och främja deras språkliga utveckling. Barnen lär sig
      genom att leka och utforska tillsammans och med hjälp av fantasin.
    sentences:
    - id: hb-c08-u0034-s001
      start: 0
      end: 98
    - id: hb-c08-u0034-s002
      start: 99
      end: 174
    - id: hb-c08-u0034-s003
      start: 175
      end: 269
    - id: hb-c08-u0034-s004
      start: 270
      end: 351
  - type: paragraph
    id: hb-c08-u0035
    text: Lärarna inom förskoleundervisningen beaktar barnets utvecklingsnivå. Om det finns svårigheter
      när det gäller barnets utveckling eller lärande upptäcks det ofta redan i förskoleundervisningen.
      Barnets skolgång kan då stödjas ända från början.
    sentences:
    - id: hb-c08-u0035-s001
      start: 0
      end: 68
    - id: hb-c08-u0035-s002
      start: 69
      end: 191
    - id: hb-c08-u0035-s003
      start: 192
      end: 241
  - type: paragraph
    id: hb-c08-u0036
    text: I Finland ska barnen delta i förskoleundervisning under ett års tid innan läroplikten börjar.
      Vanligtvis börjar förskoleundervisningen det år då barnet fyller sex år. Förskoleundervisningen
      ordnas av kommunerna och är kostnadsfri för familjen. Förskoleundervisningen ges av högutbildade
      pedagoger inom småbarnspedagogik. Förskoleundervisning ges vanligtvis fyra timmar om dagen från
      måndag till fredag under skolans verksamhetstider. Barnet kan utöver förskoleundervisning delta
      även i småbarnspedagogik.
    sentences:
    - id: hb-c08-u0036-s001
      start: 0
      end: 93
    - id: hb-c08-u0036-s002
      start: 94
      end: 166
    - id: hb-c08-u0036-s003
      start: 167
      end: 243
    - id: hb-c08-u0036-s004
      start: 244
      end: 320
    - id: hb-c08-u0036-s005
      start: 321
      end: 433
    - id: hb-c08-u0036-s006
      start: 434
      end: 504
- id: hb-c08-grundskola
  title: Läroplikt och grundläggande utbildning
  blocks:
  - type: paragraph
    id: hb-c08-u0037
    text: Alla barn som bor permanent i Finland har läroplikt mellan 7 och 18 års ålder. Barn och unga
      deltar först i den grundläggande utbildningen, det vill säga årskurserna 1–9, eller inhämtar på
      annat sätt kunskaper som motsvarar den grundläggande utbildningens lärokurs. Efter den grundläggande
      utbildningen ska alla unga dessutom studera till exempel på en utbildning på andra stadiet, tills
      de utexamineras eller fyller 18 år. Det har ursprungligen föreskrivits om läroplikten i Finland
      redan år 1921.
    sentences:
    - id: hb-c08-u0037-s001
      start: 0
      end: 78
    - id: hb-c08-u0037-s002
      start: 79
      end: 265
    - id: hb-c08-u0037-s003
      start: 266
      end: 423
    - id: hb-c08-u0037-s004
      start: 424
      end: 498
  - type: paragraph
    id: hb-c08-u0038
    text: Barnets föräldrar eller vårdnadshavare ska se till att barnet fullgör sin läroplikt. Om vårdnadshavarna
      inte sörjer för barnets läroplikt, kan en domstol utdöma påföljder till dem. Största delen av barnen
      studerar i kommunala grundskolor, men det finns också privata skolor och statliga skolor.
    sentences:
    - id: hb-c08-u0038-s001
      start: 0
      end: 84
    - id: hb-c08-u0038-s002
      start: 85
      end: 180
    - id: hb-c08-u0038-s003
      start: 181
      end: 294
  - type: paragraph
    id: hb-c08-u0039
    text: Den grundläggande utbildningen, det vill säga grundskolan, omfattar årskurserna 1–9. Den grundläggande
      utbildningen är avgiftsfri för familjerna, eftersom den bekostas med skattemedel. Också alla läroböcker,
      läromedel och hjälpmedel är avgiftsfria.
    sentences:
    - id: hb-c08-u0039-s001
      start: 0
      end: 84
    - id: hb-c08-u0039-s002
      start: 85
      end: 184
    - id: hb-c08-u0039-s003
      start: 185
      end: 248
  - type: paragraph
    id: hb-c08-u0040
    text: Enligt lagen har eleverna också rätt till avgiftsfria tjänster inom elevhälsa. Elevhälsan omfattar
      till exempel tjänster av en skolhälsovårdare, psykolog och kurator. Dessa tjänster är tillgängliga
      under skoldagen i skolan eller närheten av den.
    sentences:
    - id: hb-c08-u0040-s001
      start: 0
      end: 78
    - id: hb-c08-u0040-s002
      start: 79
      end: 166
    - id: hb-c08-u0040-s003
      start: 167
      end: 245
  - type: paragraph
    id: hb-c08-u0041
    text: Syftet med den grundläggande utbildningen är bland annat att
    sentences:
    - id: hb-c08-u0041-s001
      start: 0
      end: 60
  - id: hb-c08-u0043
    type: list
    ordered: false
    items:
    - id: hb-c08-u0042
      text: ge barnen en allmänbildande utbildning
      sentences:
      - id: hb-c08-u0042-s001
        start: 0
        end: 38
    - id: hb-c08-u0044
      text: lära ut kunskaper och färdigheter som behövs i livet
      sentences:
      - id: hb-c08-u0044-s001
        start: 0
        end: 52
    - id: hb-c08-u0045
      text: förbättra barnens färdigheter i att lära sig
      sentences:
      - id: hb-c08-u0045-s001
        start: 0
        end: 44
    - id: hb-c08-u0046
      text: hjälpa barnen att växa upp till harmoniska individer
      sentences:
      - id: hb-c08-u0046-s001
        start: 0
        end: 52
    - id: hb-c08-u0047
      text: hjälpa barnen att växa upp till medlemmar i ett demokratiskt samhälle
      sentences:
      - id: hb-c08-u0047-s001
        start: 0
        end: 69
    - id: hb-c08-u0048
      text: lära barnen ett hållbart levnadssätt
      sentences:
      - id: hb-c08-u0048-s001
        start: 0
        end: 36
    - id: hb-c08-u0049
      text: lära barnen om demokratiska värden i det finländska samhället, till exempel likabehandling
        och jämställdhet
      sentences:
      - id: hb-c08-u0049-s001
        start: 0
        end: 107
    - id: hb-c08-u0050
      text: fostra barnen i mänskliga rättigheter och lära dem att respektera dem
      sentences:
      - id: hb-c08-u0050-s001
        start: 0
        end: 69
    - id: hb-c08-u0051
      text: lära barnen om olika kulturer på ett mångsidigt sätt
      sentences:
      - id: hb-c08-u0051-s001
        start: 0
        end: 52
    - id: hb-c08-u0052
      text: stödja barnen i att bygga upp en kulturell identitet.
      sentences:
      - id: hb-c08-u0052-s001
        start: 0
        end: 53
  - type: paragraph
    id: hb-c08-u0053
    text: Under de sex första åren undervisas barnen av en klasslärare, som undervisar dem i alla eller
      nästan alla läroämnen. I årskurserna 7–9 har eleverna olika lärare i alla läroämnen, det vill säga
      en ämneslärare, som är specialiserad på ett visst läroämne.
    sentences:
    - id: hb-c08-u0053-s001
      start: 0
      end: 116
    - id: hb-c08-u0053-s002
      start: 117
      end: 252
  - type: paragraph
    id: hb-c08-u0054
    text: Eleven får ett avgångsbetyg för den grundläggande utbildningen när hen med godkänt resultat
      har avlagt den grundläggande utbildningens lärokurs. Efter det kan hen söka till studier på andra
      stadiet, det vill säga en yrkesutbildning eller gymnasiestudier.
    sentences:
    - id: hb-c08-u0054-s001
      start: 0
      end: 144
    - id: hb-c08-u0054-s002
      start: 145
      end: 254
  - type: paragraph
    id: hb-c08-u0055
    text: Den grundläggande utbildningen inkluderar obligatoriska läroämnen som är gemensamma för alla
      och läroämnen som eleven själv kan välja. Syftet med de valfria läroämnena är att ge eleverna mer
      kunskaper och färdigheter inom områden som särskilt intresserar dem.
    sentences:
    - id: hb-c08-u0055-s001
      start: 0
      end: 134
    - id: hb-c08-u0055-s002
      start: 135
      end: 259
  - type: paragraph
    id: hb-c08-u0056
    text: Läroämnen som är gemensamma för alla är i årskurs 1–2 till exempel modersmål och litteratur
      och främmande språk, matematik, omgivningslära, religion eller livsåskådningskunskap, musik, gymnastik
      och slöjd. På gymnastiklektionerna har man gymnastik både ute och inne.
    sentences:
    - id: hb-c08-u0056-s001
      start: 0
      end: 205
    - id: hb-c08-u0056-s002
      start: 206
      end: 266
  - type: paragraph
    id: hb-c08-u0057
    text: Antalet läroämnen ökar i takt med att den grundläggande utbildningen framskrider. I årskurserna
      3–9 ges undervisning i förutom ovannämnda läroämnen också i bland annat historia, huslig ekonomi,
      kemi och fysik, biologi och geografi och hälsokunskap.
    sentences:
    - id: hb-c08-u0057-s001
      start: 0
      end: 81
    - id: hb-c08-u0057-s002
      start: 82
      end: 248
  - type: paragraph
    id: hb-c08-u0058
    text: Elever med invandrarbakgrund och tvåspråkiga elever kan få undervisning i sitt modersmål som
      en del av den grundläggande utbildningen. Inom religionsundervisningen finns det olika lärokurser,
      till exempel evangelisk-luthersk religion, ortodox religion eller islam. Utöver religionen som studeras
      lär man sig också om andra religioner och åskådningar. I lagen om grundläggande utbildning föreskrivs
      närmare om i vilket av skolans åskådningsämnen eleven ska eller kan delta i.
    sentences:
    - id: hb-c08-u0058-s001
      start: 0
      end: 134
    - id: hb-c08-u0058-s002
      start: 135
      end: 264
    - id: hb-c08-u0058-s003
      start: 265
      end: 350
    - id: hb-c08-u0058-s004
      start: 351
      end: 474
  - type: paragraph
    id: hb-c08-u0059
    text: Istället för religion kan eleverna studera livsåskådningskunskap i skolan, om de inte är medlemmar
      i något registrerat religiöst samfund. Också en del andra elever har möjlighet att delta i undervisningen
      i livsåskådningskunskap. Livsåskådningskunskap är ett tvärvetenskapligt åskådningsämne i grundskolan
      och gymnasiet som inte baserar sig på någon särskild samhällelig institution, religion eller åskådning.
    sentences:
    - id: hb-c08-u0059-s001
      start: 0
      end: 137
    - id: hb-c08-u0059-s002
      start: 138
      end: 229
    - id: hb-c08-u0059-s003
      start: 230
      end: 409
  - type: paragraph
    id: hb-c08-u0060
    text: Om elevens modersmål är finska, svenska eller samiska, studerar hen detta språk inom läroämnet
      ”modersmål och litteratur”. De elever som har något annat språk som modersmål och vars kunskaper
      i finska eller svenska inte räcker till för att studera läroämnet modersmål och litteratur kan studera
      lärokursen ”finska eller svenska som andraspråk och litteratur” (S2 eller R2). När eleven har tillräckligt
      starka språkkunskaper kan hen flytta till gruppen för undervisning i modersmål och litteratur.
    sentences:
    - id: hb-c08-u0060-s001
      start: 0
      end: 122
    - id: hb-c08-u0060-s002
      start: 123
      end: 373
    - id: hb-c08-u0060-s003
      start: 374
      end: 496
  - type: paragraph
    id: hb-c08-u0061
    text: I Finland styr lagen ordnandet av den grundläggande utbildningen. Dessutom ska skolorna och
      lärarna följa den läroplan som har utarbetats utifrån Utbildningsstyrelsens grunder för läroplanen.
      Samma grunder för läroplanen gäller alla skolor och elever.
    sentences:
    - id: hb-c08-u0061-s001
      start: 0
      end: 65
    - id: hb-c08-u0061-s002
      start: 66
      end: 191
    - id: hb-c08-u0061-s003
      start: 192
      end: 251
  - type: paragraph
    id: hb-c08-u0062
    text: I läroplanen för den grundläggande utbildningen betraktas eleven som en aktiv aktör. I skolan
      lär hen sig att sätta upp mål och lösa problem både självständigt och tillsammans med andra. Lärandet
      sker i växelverkan med övriga elever och med omgivningen. Läraren styr lärandet, uppmuntrar och
      ger stärkande respons.
    sentences:
    - id: hb-c08-u0062-s001
      start: 0
      end: 84
    - id: hb-c08-u0062-s002
      start: 85
      end: 186
    - id: hb-c08-u0062-s003
      start: 187
      end: 253
    - id: hb-c08-u0062-s004
      start: 254
      end: 314
  - type: paragraph
    id: hb-c08-u0063
    text: Målet är att elevernas arbete i skolan ska vara undersökande och kreativt. Undervisningsmetoderna
      kan variera. Digital kompetens, det vill säga färdigheter i att använda datorer och mobila enheter,
      blir allt viktigare i dagens samhälle. Dessa färdigheter är nödvändiga i vardagen och arbetslivet.
      Därför lär man ut dem också i skolan.
    sentences:
    - id: hb-c08-u0063-s001
      start: 0
      end: 74
    - id: hb-c08-u0063-s002
      start: 75
      end: 110
    - id: hb-c08-u0063-s003
      start: 111
      end: 236
    - id: hb-c08-u0063-s004
      start: 237
      end: 296
    - id: hb-c08-u0063-s005
      start: 297
      end: 334
  - type: paragraph
    id: hb-c08-u0064
    text: Grundskolorna och gymnasierna är i huvudsak offentliga i Finland. Det finns också privata skolor,
      men de är på samma sätt som de offentliga skolorna beroende av offentlig finansiering. I skolorna
      i Finland används inte skoluniform, och det finns nästan inga bestämmelser om hur eleverna ska klä
      sig. Pojkar och flickor går i samma skolor och samma klasser. I många skolor har man också blandade
      grupper på gymnastiklektionerna.
    sentences:
    - id: hb-c08-u0064-s001
      start: 0
      end: 65
    - id: hb-c08-u0064-s002
      start: 66
      end: 184
    - id: hb-c08-u0064-s003
      start: 185
      end: 299
    - id: hb-c08-u0064-s004
      start: 300
      end: 356
    - id: hb-c08-u0064-s005
      start: 357
      end: 427
  - type: paragraph
    id: hb-c08-u0065
    text: I skolorna rangordnas eleverna inte i klasserna eller inom läroämnena. Istället är målet att
      göra undervisningen individuell och uppmuntrande och stödja lärandet på många olika sätt. På lektionerna
      används mångsidiga arbetssätt, till exempel mycket grupparbeten och tillsammans med små skolelever
      lärande genom lek.
    sentences:
    - id: hb-c08-u0065-s001
      start: 0
      end: 70
    - id: hb-c08-u0065-s002
      start: 71
      end: 182
    - id: hb-c08-u0065-s003
      start: 183
      end: 315
  - type: paragraph
    id: hb-c08-u0066
    text: I skolorna i Finland, liksom i arbetslivet i Finland, är hierarkin låg. Lärarna och skolans
      rektor är lättillgängliga för både eleverna och föräldrarna. Rektorn är skolans pedagogiska ledare.
      Också hen har lärarutbildning och tidigare erfarenhet av att arbeta som lärare. Barnet deltar i
      utvärderingssamtal om skolarbetet som hålls mellan läraren och föräldrarna.
    sentences:
    - id: hb-c08-u0066-s001
      start: 0
      end: 71
    - id: hb-c08-u0066-s002
      start: 72
      end: 152
    - id: hb-c08-u0066-s003
      start: 153
      end: 191
    - id: hb-c08-u0066-s004
      start: 192
      end: 271
    - id: hb-c08-u0066-s005
      start: 272
      end: 363
- id: hb-c08-stod
  title: Elevens rättigheter och stöd
  blocks:
  - type: paragraph
    id: hb-c08-u0067
    text: I Finland har ett skolår 190 skoldagar. Skolåret, det vill säga läsåret, är indelat i två delar,
      en hösttermin och en vårtermin. Höstterminen börjar omkring mitten av augusti och slutar med en
      julfest före jul. Efter det har eleverna jullov. Vårterminen börjar i början av januari och slutar
      i början av juni. Vårterminen avslutas med skolavslutning, där eleverna och lärarna firar att läsåret
      är slut och sommaren börjar.
    sentences:
    - id: hb-c08-u0067-s001
      start: 0
      end: 39
    - id: hb-c08-u0067-s002
      start: 40
      end: 128
    - id: hb-c08-u0067-s003
      start: 129
      end: 210
    - id: hb-c08-u0067-s004
      start: 211
      end: 241
    - id: hb-c08-u0067-s005
      start: 242
      end: 309
    - id: hb-c08-u0067-s006
      start: 310
      end: 422
  - type: paragraph
    id: hb-c08-u0068
    text: Utöver jullovet och sommarlovet har eleverna under läsåret höstlov på hösten och vinterlov i
      februari–mars. Om en finsk högtidsdag infaller på en vardag, till exempel påsk, valborg, Kristi
      himmelsfärdsdag eller självständighetsdagen, är den en ledig dag från skolan
    sentences:
    - id: hb-c08-u0068-s001
      start: 0
      end: 107
    - id: hb-c08-u0068-s002
      start: 108
      end: 265
  - type: paragraph
    id: hb-c08-u0069
    text: I de lägre årskurserna är skoldagarna kortare än i de högre. I årskurserna 1–6 får eleverna
      20–25 timmar undervisning i veckan. I årskurserna 7–9 är timantalet per vecka i genomsnitt 29–30
      timmar. Mellan lektionerna tar man pauser, det vill säga raster. En lektion är i allmänhet 45 minuter
      lång. Mellan lektionerna har man 15–30 minuter långa raster, som eleverna tillbringar på skolan.
    sentences:
    - id: hb-c08-u0069-s001
      start: 0
      end: 60
    - id: hb-c08-u0069-s002
      start: 61
      end: 127
    - id: hb-c08-u0069-s003
      start: 128
      end: 196
    - id: hb-c08-u0069-s004
      start: 197
      end: 253
    - id: hb-c08-u0069-s005
      start: 254
      end: 296
    - id: hb-c08-u0069-s006
      start: 297
      end: 387
  - type: paragraph
    id: hb-c08-u0070
    text: I skolan får eleverna elevhandledning. Inom handledningen får eleven stöd för studierna och
      försöker man förebygga att problem uppstår i dem. Syftet med elevhandledningen är dessutom att vägleda
      eleverna i valet av fortsatta studier. Handledning i studiefärdigheter och valet av fortsatta studier
      ges i olika skeden av den grundläggande utbildningen för hela klasser eller en enskild elev i taget.
      Elevhandledaren, som är en lärare specialiserad på handledningsarbete, håller lektioner i elevhandledning.
    sentences:
    - id: hb-c08-u0070-s001
      start: 0
      end: 38
    - id: hb-c08-u0070-s002
      start: 39
      end: 141
    - id: hb-c08-u0070-s003
      start: 142
      end: 233
    - id: hb-c08-u0070-s004
      start: 234
      end: 397
    - id: hb-c08-u0070-s005
      start: 398
      end: 504
  - type: paragraph
    id: hb-c08-u0071
    text: Enligt lagen ska eleverna få tillräckligt stöd för lärandet och skolgången under hela grundskolan.
      Eleven kan behöva stöd till exempel för att hen har en sjukdom, funktionsnedsättning eller inlärningssvårighet.
      Om en elev behöver stöd, utreds hens situation tillsammans med eleven, vårdnadshavarna, skolan och
      sakkunniga. Vårdnadshavarnas samarbete med läraren är viktigt för att stödet ska kunna säkerställas.
    sentences:
    - id: hb-c08-u0071-s001
      start: 0
      end: 98
    - id: hb-c08-u0071-s002
      start: 99
      end: 210
    - id: hb-c08-u0071-s003
      start: 211
      end: 321
    - id: hb-c08-u0071-s004
      start: 322
      end: 410
  - type: paragraph
    id: hb-c08-u0072
    text: Eleverna kan få stöd för skolgången på olika sätt. Exempel på stödformer är stödundervisning,
      specialundervisning på deltid, tolknings- och assistenttjänster och särskilda hjälpmedel. Stöd erbjuds
      eleven endast och enbart för hens egen skull. Skolan och vårdnadshavarna beslutar tillsammans med
      sakkunniga om vilket stöd eleven behöver och när.
    sentences:
    - id: hb-c08-u0072-s001
      start: 0
      end: 50
    - id: hb-c08-u0072-s002
      start: 51
      end: 183
    - id: hb-c08-u0072-s003
      start: 184
      end: 242
    - id: hb-c08-u0072-s004
      start: 243
      end: 344
  - type: paragraph
    id: hb-c08-u0073
    text: Stödet är avsett att vara flexibelt och välplanerat. Stödet ska också anpassas enligt vad eleven
      behöver vid en viss tidpunkt. Ju tidigare man upptäcker att ett barn behöver stöd, desto bättre.
      Det är viktigt att stödet fortsätter när barnet senare övergår till en annan skola eller till fortsatta
      studier.
    sentences:
    - id: hb-c08-u0073-s001
      start: 0
      end: 52
    - id: hb-c08-u0073-s002
      start: 53
      end: 126
    - id: hb-c08-u0073-s003
      start: 127
      end: 193
    - id: hb-c08-u0073-s004
      start: 194
      end: 306
  - type: paragraph
    id: hb-c08-u0074
    text: Inom den grundläggande utbildningen bedömer läraren elevens lärande, kunskaper, arbete och uppförande
      och jämför dem med målen för läroplanen. Bedömningen av eleven baserar sig inte enbart på resultaten
      i prov som skrivits på lektionerna, utan läraren bedömer elevens lärande och arbete under hela läsåret
      med olika metoder. Hen ger bedömningsrespons till såväl eleven som vårdnadshavarna och föräldrarna.
    sentences:
    - id: hb-c08-u0074-s001
      start: 0
      end: 142
    - id: hb-c08-u0074-s002
      start: 143
      end: 324
    - id: hb-c08-u0074-s003
      start: 325
      end: 405
  - type: paragraph
    id: hb-c08-u0075
    text: I varje årskurs ges eleven ett läsårsbetyg när läsåret är slut. I nionde klass får eleven ett
      avgångsbetyg. Betyget kan bestå av siffror, verbal bedömning eller både och. Bedömningsskalan för
      siffervitsord är 4–10, där 4 är underkänt och 10 utmärkt. Utöver betyget får eleven och hens föräldrar
      information om bedömningen i till exempel samtal med läraren. Skolan ger en bedömning av elevens
      uppförande i skolan minst en gång per år.
    sentences:
    - id: hb-c08-u0075-s001
      start: 0
      end: 63
    - id: hb-c08-u0075-s002
      start: 64
      end: 107
    - id: hb-c08-u0075-s003
      start: 108
      end: 170
    - id: hb-c08-u0075-s004
      start: 171
      end: 249
    - id: hb-c08-u0075-s005
      start: 250
      end: 356
    - id: hb-c08-u0075-s006
      start: 357
      end: 433
  - type: paragraph
    id: hb-c08-u0076
    text: Om eleven i slutet av läsåret inte får ett godkänt vitsord i ett ämne, kan det hända att hen
      inte kan gå upp till nästa årskurs. I sådana fall är det möjligt att hen är tvungen att gå om samma
      klass. Ett annat alternativ är att eleven gör kompletterande uppgifter eller prov. Hen kan också
      övergå till att studera enligt ett eget studieprogram, som man kommer överens om separat. I samtliga
      fall diskuterar lärarna och rektorn först med elevens föräldrar och vårdnadshavare, sedan kommer
      de tillsammans överens om hur man ska gå vidare.
    sentences:
    - id: hb-c08-u0076-s001
      start: 0
      end: 128
    - id: hb-c08-u0076-s002
      start: 129
      end: 199
    - id: hb-c08-u0076-s003
      start: 200
      end: 275
    - id: hb-c08-u0076-s004
      start: 276
      end: 379
    - id: hb-c08-u0076-s005
      start: 380
      end: 536
  - type: paragraph
    id: hb-c08-u0077
    text: I Finland är samarbetet mellan skolan och elevens vårdnadshavare och föräldrar mycket viktigt.
      Barnets vårdnadshavare och föräldrar ansvarar alltid för barnets uppfostran. Skolan ansvarar för
      undervisningen och fostran av eleven under skoldagen. Barns och ungas skolarbete blir mest framgångsrikt
      när hemmet och skolan samarbetar. Då är det lättare att upptäcka och försöka lösa eventuella utmaningar
      och problem innan de blir för stora.
    sentences:
    - id: hb-c08-u0077-s001
      start: 0
      end: 94
    - id: hb-c08-u0077-s002
      start: 95
      end: 171
    - id: hb-c08-u0077-s003
      start: 172
      end: 245
    - id: hb-c08-u0077-s004
      start: 246
      end: 330
    - id: hb-c08-u0077-s005
      start: 331
      end: 437
  - type: paragraph
    id: hb-c08-u0078
    text: I skolan måste eleven ända från början ta ansvar för sina studier. För det behöver hen stöd
      och uppmuntran hemifrån. Det är viktigt att föräldrarna och vårdnadshavarna noggrant följer barnets
      studier och till exempel ser till att hen gör sina läxor.
    sentences:
    - id: hb-c08-u0078-s001
      start: 0
      end: 66
    - id: hb-c08-u0078-s002
      start: 67
      end: 116
    - id: hb-c08-u0078-s003
      start: 117
      end: 249
  - type: paragraph
    id: hb-c08-u0079
    text: I Finland samarbetar hemmen och skolorna på många olika sätt. I skolorna ordnas föräldramöten
      och dagar med öppet hus, då föräldrar och vårdnadshavare har möjlighet att ta del av skolans verksamhet.
      Det ordnas också gemensamma fester och utflykter som familjerna är välkomna att delta i. Lärarna
      håller kontakten med föräldrarna genom meddelanden och per e-post och telefon. Det är bra att delta
      i föräldramöten och föräldrasamtal. Genom dem kan man hålla sig uppdaterad om vad som händer i skolan
      och hur barnets lärande går.
    sentences:
    - id: hb-c08-u0079-s001
      start: 0
      end: 61
    - id: hb-c08-u0079-s002
      start: 62
      end: 198
    - id: hb-c08-u0079-s003
      start: 199
      end: 287
    - id: hb-c08-u0079-s004
      start: 288
      end: 374
    - id: hb-c08-u0079-s005
      start: 375
      end: 431
    - id: hb-c08-u0079-s006
      start: 432
      end: 526
  - type: paragraph
    id: hb-c08-u0080
    text: Skolan använder vanligtvis ett elektroniskt informationssystem, oftast Wilma. Wilma är det primära
      kommunikationsverktyget för lärarna och föräldrarna när det gäller eleven. Lärarna och föräldrarna
      träffas också personligen för att diskutera elevens skolgång. De kan tillsammans bestämma vilket
      som är det bästa sättet att hålla kontakten och samarbeta. Vid behov kan man be skolan om hjälp
      med att använda Wilma.
    sentences:
    - id: hb-c08-u0080-s001
      start: 0
      end: 77
    - id: hb-c08-u0080-s002
      start: 78
      end: 173
    - id: hb-c08-u0080-s003
      start: 174
      end: 259
    - id: hb-c08-u0080-s004
      start: 260
      end: 353
    - id: hb-c08-u0080-s005
      start: 354
      end: 413
  - type: paragraph
    id: hb-c08-u0081
    text: I Wilma följer läraren också upp barnets frånvaro från skolan. Föräldrarna ska meddela barnets
      alla frånvarotillfällen i Wilma. Om barnet har mycket frånvaro, är skolan skyldig att ingripa oavsett
      orsak till frånvaron.
    sentences:
    - id: hb-c08-u0081-s001
      start: 0
      end: 62
    - id: hb-c08-u0081-s002
      start: 63
      end: 127
    - id: hb-c08-u0081-s003
      start: 128
      end: 218
  - type: paragraph
    id: hb-c08-u0082
    text: Om föräldrarna och vårdnadshavarna inte är nöjda med skolans verksamhet, är det bra att först
      prata med elevens lärare. Föräldrarna kan vid behov kontakta skolans rektor. Om man misstänker att
      skolan inte följer lagar och författningar, kan man kontakta undervisningsanordnaren eller regionförvaltningsverket.
    sentences:
    - id: hb-c08-u0082-s001
      start: 0
      end: 119
    - id: hb-c08-u0082-s002
      start: 120
      end: 170
    - id: hb-c08-u0082-s003
      start: 171
      end: 309
  - type: paragraph
    id: hb-c08-u0083
    text: Alla grundskolor, gymnasier och yrkesläroanstalter i Finland har lunchrast mitt under skoldagen.
      Då får eleverna en avgiftsfri varm måltid i skolans matsal. Skolmat har serverats i de finländska
      skolorna ända sedan år 1948.
    sentences:
    - id: hb-c08-u0083-s001
      start: 0
      end: 96
    - id: hb-c08-u0083-s002
      start: 97
      end: 156
    - id: hb-c08-u0083-s003
      start: 157
      end: 223
  - type: paragraph
    id: hb-c08-u0084
    text: Om en elev följer en specialkost av etiska, religiösa eller hälsomässiga skäl, försöker skolan
      beakta den. Föräldrarna måste ändå i sådana fall diskutera specialkosten med läraren och skolkökets
      personal. Det är möjligt att skolan begär dokument, till exempel ett läkarintyg, om barnets kost.
    sentences:
    - id: hb-c08-u0084-s001
      start: 0
      end: 106
    - id: hb-c08-u0084-s002
      start: 107
      end: 204
    - id: hb-c08-u0084-s003
      start: 205
      end: 292
  - type: paragraph
    id: hb-c08-u0085
    text: När barnet går i grundskolan och har kort skolväg kan hen ända från början vanligtvis gå, cykla
      eller ta bussen på egen hand. Om vägen är längre, har elever inom förskoleundervisningen och den
      grundläggande utbildningen rätt till avgiftsfri skolskjuts, som ordnas av kommunen. En elev har
      rätt till skolskjuts till exempel om den dagliga sträckan mellan skolan och hemmet är över fem kilometer.
      Skolskjutsen är taxi- eller busstransport. Elevens vårdnadshavare ska ansöka om rätt till avgiftsfri
      skolskjuts hos skolan.
    sentences:
    - id: hb-c08-u0085-s001
      start: 0
      end: 125
    - id: hb-c08-u0085-s002
      start: 126
      end: 276
    - id: hb-c08-u0085-s003
      start: 277
      end: 394
    - id: hb-c08-u0085-s004
      start: 395
      end: 437
    - id: hb-c08-u0085-s005
      start: 438
      end: 518
  - type: paragraph
    id: hb-c08-u0086
    text: Eleverna ska uppföra sig sakligt mot lärare och andra elever. Alla skolor har ordningsregler.
      Med hjälp av dem bibehålls ordningen på skolan, förlöper studierna smidigt och blir skolgemenskapen
      trygg och trivsam. Det är bra om också skolvägen är så säker som möjligt.
    sentences:
    - id: hb-c08-u0086-s001
      start: 0
      end: 61
    - id: hb-c08-u0086-s002
      start: 62
      end: 93
    - id: hb-c08-u0086-s003
      start: 94
      end: 212
    - id: hb-c08-u0086-s004
      start: 213
      end: 267
  - type: paragraph
    id: hb-c08-u0087
    text: Skolorna har en elevvårdsplan som beskriver bland annat hur skolan följer upp elevernas och
      skolgemenskapens välbefinnande, hälsa och säkerhet. Planen inkluderar skolans handlingsprinciper
      för plötsliga kriser och hotfulla och farliga situationer.
    sentences:
    - id: hb-c08-u0087-s001
      start: 0
      end: 143
    - id: hb-c08-u0087-s002
      start: 144
      end: 247
  - type: paragraph
    id: hb-c08-u0088
    text: I skolorna accepteras inte diskriminering, mobbning, trakasserier eller våld. Mobbning innebär
      att en elev upprepade gånger orsakas skada eller dåligt mående. Förövarna kan vara någon eller några
      som den mobbade har svårt att försvara sig mot. Mobbning är medveten och förknippad med maktutövning.
      Eleven till exempel skräms, hotas, kallas vid öknamn eller skadas.
    sentences:
    - id: hb-c08-u0088-s001
      start: 0
      end: 77
    - id: hb-c08-u0088-s002
      start: 78
      end: 158
    - id: hb-c08-u0088-s003
      start: 159
      end: 243
    - id: hb-c08-u0088-s004
      start: 244
      end: 297
    - id: hb-c08-u0088-s005
      start: 298
      end: 364
  - type: paragraph
    id: hb-c08-u0089
    text: Det är också mobbning eller diskriminering om en elev upprepade gånger lämnas utanför gruppen.
      Vid mobbning är det ofta fråga om ett gruppfenomen. Om mobbningen sker i skolan eller på skolvägen,
      ska föräldrarna och barnet genast informera läraren och skolans rektor om det. Skolorna är skyldiga
      att ingripa i mobbning.
    sentences:
    - id: hb-c08-u0089-s001
      start: 0
      end: 94
    - id: hb-c08-u0089-s002
      start: 95
      end: 146
    - id: hb-c08-u0089-s003
      start: 147
      end: 273
    - id: hb-c08-u0089-s004
      start: 274
      end: 318
  - type: paragraph
    id: hb-c08-u0090
    text: Elever i årskurs ett och två eller i specialundervisning kan få delta i morgon- och eftermiddagsverksamhet
      för skolelever. Det ordnas verksamhet på många skolor före eller efter skoldagen. Eftermiddagsklubbar
      kan ordnas också i andra än skolans lokaler. Föräldrarna ska i förväg ansöka om en plats för sitt
      barn i morgon- eller eftermiddagsverksamhet. Antalet platser är begränsat. Kommunen kan ta ut en
      avgift för deltagande i verksamheten.
    sentences:
    - id: hb-c08-u0090-s001
      start: 0
      end: 122
    - id: hb-c08-u0090-s002
      start: 123
      end: 188
    - id: hb-c08-u0090-s003
      start: 189
      end: 253
    - id: hb-c08-u0090-s004
      start: 254
      end: 351
    - id: hb-c08-u0090-s005
      start: 352
      end: 381
    - id: hb-c08-u0090-s006
      start: 382
      end: 441
  - type: paragraph
    id: hb-c08-u0091
    text: Morgon- och eftermiddagsverksamheten är avsedd särskilt för barn med föräldrar som arbetar heltid.
      Med hjälp av verksamheten behöver barnet inte vara ensamt hemma på eftermiddagarna, utan får tillbringa
      dem i en trygg miljö tillsammans med handledare och andra barn. Målet är att stödja skolans och
      hemmets fostringsarbete. Inom verksamheten leker man, äter mellanmål och gör läxor. Barnen får ofta
      också kompisar där.
    sentences:
    - id: hb-c08-u0091-s001
      start: 0
      end: 98
    - id: hb-c08-u0091-s002
      start: 99
      end: 266
    - id: hb-c08-u0091-s003
      start: 267
      end: 323
    - id: hb-c08-u0091-s004
      start: 324
      end: 382
    - id: hb-c08-u0091-s005
      start: 383
      end: 418
  - type: paragraph
    id: hb-c08-u0092
    text: Många skolor ordnar klubbar efter skoldagen. Klubbarna är verksamhet utanför lektionstid som
      ger eleverna möjlighet att prova på olika hobbyer. Alla barn kan delta i klubbverksamheten. Klubbarna
      är frivilliga och kan vara motions-, konst- eller musikklubbar.
    sentences:
    - id: hb-c08-u0092-s001
      start: 0
      end: 44
    - id: hb-c08-u0092-s002
      start: 45
      end: 143
    - id: hb-c08-u0092-s003
      start: 144
      end: 184
    - id: hb-c08-u0092-s004
      start: 185
      end: 258
  - type: paragraph
    id: hb-c08-u0093
    text: När ett barn flyttar till Finland placeras hen i en årskurs inom den grundläggande utbildningen
      utifrån sin ålder och vilka kunskaper och färdigheter hen har. Barnet kan också få undervisning
      som förbereder hen för den grundläggande utbildningen. Både barn och unga i förskole- och grundskoleåldern
      som precis flyttat till landet och barn som är födda i Finland och vars föräldrar har flyttat till
      Finland från något annat land kan delta i förberedande undervisning.
    sentences:
    - id: hb-c08-u0093-s001
      start: 0
      end: 158
    - id: hb-c08-u0093-s002
      start: 159
      end: 246
    - id: hb-c08-u0093-s003
      start: 247
      end: 466
  - type: paragraph
    id: hb-c08-u0094
    text: Syftet med den förberedande undervisningen är att ge barnet nödvändiga kunskaper och färdigheter
      för att övergå till den allmänna grundläggande undervisningen. Den förberedande undervisningen främjar
      också barnets integration i Finland.
    sentences:
    - id: hb-c08-u0094-s001
      start: 0
      end: 159
    - id: hb-c08-u0094-s002
      start: 160
      end: 236
  - type: paragraph
    id: hb-c08-u0095
    text: Att studera undervisningsspråket är en viktig del av den förberedande undervisningen för de
      elever som ännu inte kan studera på finska eller svenska. Det är viktigt att föräldrarna uppmuntrar
      sina barn att använda finska eller svenska i skolan.
    sentences:
    - id: hb-c08-u0095-s001
      start: 0
      end: 149
    - id: hb-c08-u0095-s002
      start: 150
      end: 244
  - type: paragraph
    id: hb-c08-u0096
    text: När barnet deltar i undervisning som förbereder för grundläggande utbildning får hen ett individuellt
      studieprogram. I studieprogrammet antecknas vilka läroämnen barnet ska studera och i vilket tempo.
      Studieprogrammet utarbetas av skolans studiehandledare, barnets klasslärare, specialklasslärare
      eller lärare i finska som andra språk. De kan också utarbeta studieprogrammet tillsammans. De tar
      hänsyn till barnets kunskaper och tidigare studier.
    sentences:
    - id: hb-c08-u0096-s001
      start: 0
      end: 116
    - id: hb-c08-u0096-s002
      start: 117
      end: 200
    - id: hb-c08-u0096-s003
      start: 201
      end: 335
    - id: hb-c08-u0096-s004
      start: 336
      end: 387
    - id: hb-c08-u0096-s005
      start: 388
      end: 446
  - type: paragraph
    id: hb-c08-u0190
    text: Barn med funktionsnedsättning har rätt att gå i en närskola och få de stödåtgärder de behöver
      för sin skolgång. Stödåtgärderna kan vara hjälpmedel, en personlig assistent eller en tolk. Undervisningen
      kan också individualiseras, vilket betyder att man sätter upp egna, individuella mål för det handikappade
      barnets lärande som kan avvika från den allmänna läroplanen. Man kan också besluta att ett barn
      med funktionsnedsättning ska omfattas av förlängd läroplikt. Förlängd läroplikt betyder att barnet
      börjar skolan redan som 6-åring. För barnet fattas vid behov ett beslut om särskilt stöd (IP) som
      beskriver barnets behov av stöd och skolans stödåtgärder.
    sentences:
    - id: hb-c08-u0190-s001
      start: 0
      end: 111
    - id: hb-c08-u0190-s002
      start: 112
      end: 185
    - id: hb-c08-u0190-s003
      start: 186
      end: 367
    - id: hb-c08-u0190-s004
      start: 368
      end: 463
    - id: hb-c08-u0190-s005
      start: 464
      end: 534
    - id: hb-c08-u0190-s006
      start: 535
      end: 657
  - type: paragraph
    id: hb-c08-u0191
    text: I Finland kan studerande med funktionsnedsättning studera på vanliga läroanstalter med andra
      studerande inom till exempel integrationsutbildning, samhällsorientering eller olika utbildningar
      som leder till en examen. De kan vid behov studera också på specialläroanstalter, till exempel specialyrkesläroanstalter.
      På Dövas folkhögskola ordnas integrationsutbildning för hörselskadade. På Tillgänglighetsbiblioteket
      Celia finns läroböcker i form av talböcker för grundskolan, gymnasiet och yrkesstudier samt högskola.
    sentences:
    - id: hb-c08-u0191-s001
      start: 0
      end: 216
    - id: hb-c08-u0191-s002
      start: 217
      end: 312
    - id: hb-c08-u0191-s003
      start: 313
      end: 383
    - id: hb-c08-u0191-s004
      start: 384
      end: 515
- id: hb-c08-gymnasium
  title: Gymnasium och studentexamen
  blocks:
  - type: paragraph
    id: hb-c08-u0097
    text: Efter grundskolan fortsätter de unga sina studier på en utbildning på andra stadiet, det vill
      säga ett gymnasium eller en yrkesläroanstalt. Gymnasiestudierna är allmänbildande och ger de studerande
      färdigheter att inleda studier som leder till en högskoleexamen vid ett universitet eller en yrkeshögskola.
      Syftet med gymnasieutbildningen är bland annat att ge de studerande kunskaper och färdigheter som
      är nödvändiga för arbete och hobbyer. Utbildningen ger de studerande färdigheter för livslångt lärande
      och kontinuerlig utveckling av sig själva.
    sentences:
    - id: hb-c08-u0097-s001
      start: 0
      end: 139
    - id: hb-c08-u0097-s002
      start: 140
      end: 305
    - id: hb-c08-u0097-s003
      start: 306
      end: 441
    - id: hb-c08-u0097-s004
      start: 442
      end: 549
  - type: paragraph
    id: hb-c08-u0098
    text: Med ett avgångsbetyg från gymnasiet och ett studentexamensbetyg kan man söka till många olika
      slags fortsatta studier vid en högskola. I Finland är det möjligt att avlägga också en IB-examen
      på engelska, det vill säga en internationell studentexamen, varefter man kan söka till högskolor
      i Finland och många andra länder.
    sentences:
    - id: hb-c08-u0098-s001
      start: 0
      end: 134
    - id: hb-c08-u0098-s002
      start: 135
      end: 321
  - type: paragraph
    id: hb-c08-u0099
    text: Gymnasiets läsår följer i allmänhet samma tidsplan som grundskolans. I gymnasiet studerar man
      i varierande studerandegrupper. Studierna är indelade i studieperioder, och de studerande kan själva
      planera sin läsordning. Största delen av studierna är obligatoriska. Dessutom väljer den studerande
      studier enligt sina egna intressen.
    sentences:
    - id: hb-c08-u0099-s001
      start: 0
      end: 68
    - id: hb-c08-u0099-s002
      start: 69
      end: 125
    - id: hb-c08-u0099-s003
      start: 126
      end: 218
    - id: hb-c08-u0099-s004
      start: 219
      end: 263
    - id: hb-c08-u0099-s005
      start: 264
      end: 330
  - type: paragraph
    id: hb-c08-u0100
    text: Vanligtvis tar gymnasiestudierna tre år, men man kan också avlägga dess lärokurs långsammare
      eller snabbare. Studierna får i allmänhet inte ta mer än fyra år.
    sentences:
    - id: hb-c08-u0100-s001
      start: 0
      end: 108
    - id: hb-c08-u0100-s002
      start: 109
      end: 158
  - type: paragraph
    id: hb-c08-u0101
    text: I gymnasiet studerar man många olika läroämnen, till exempel modersmål och främmande språk,
      finska eller svenska som andraspråk, matematik, fysik, kemi, biologi, historia, religion eller livsåskådningskunskap,
      samhällslära, gymnastik, musik och bildkonst.
    sentences:
    - id: hb-c08-u0101-s001
      start: 0
      end: 255
  - type: paragraph
    id: hb-c08-u0102
    text: I gymnasiet får de studerande siffervitsord för de studieperioder de avlägger. Vitsordet visar
      hur väl den studerande har gått framåt under studieperioden och lärt sig nya saker. Det högsta vitsordet
      är 10 och det lägsta 4. Den studerande har rätt att försöka höja sina vitsord genom att göra om
      prov eller uppgifter. När den studerande har avlagt gymnasiets hela lärokurs får hen ett avgångsbetyg
      från gymnasiet.
    sentences:
    - id: hb-c08-u0102-s001
      start: 0
      end: 78
    - id: hb-c08-u0102-s002
      start: 79
      end: 178
    - id: hb-c08-u0102-s003
      start: 179
      end: 223
    - id: hb-c08-u0102-s004
      start: 224
      end: 317
    - id: hb-c08-u0102-s005
      start: 318
      end: 413
  - type: paragraph
    id: hb-c08-u0103
    text: Under gymnasiet avlägger de studerande studentexamen. Studentexamen är densamma i hela Finland.
      I den ingår prov i modersmål och litteratur, det andra inhemska språket, främmande språk, matematik
      och naturvetenskapliga och humanistisk-samhälleliga läroämnen, det vill säga realämnen. Realämnen
      är till exempel historia, fysik, biologi, psykologi, religion, filosofi, geografi och hälsokunskap.
      Istället för provet i modersmål kan den studerande också avlägga ett prov i läroämnet finska eller
      svenska som andraspråk.
    sentences:
    - id: hb-c08-u0103-s001
      start: 0
      end: 53
    - id: hb-c08-u0103-s002
      start: 54
      end: 95
    - id: hb-c08-u0103-s003
      start: 96
      end: 283
    - id: hb-c08-u0103-s004
      start: 284
      end: 393
    - id: hb-c08-u0103-s005
      start: 394
      end: 516
  - type: paragraph
    id: hb-c08-u0104
    text: Studentexamen ordnas två gånger per år, varje vår och höst. När en studerande avlägger studentexamen
      ska hen avlägga åtminstone fem prov. Det går också att avlägga fler.
    sentences:
    - id: hb-c08-u0104-s001
      start: 0
      end: 59
    - id: hb-c08-u0104-s002
      start: 60
      end: 137
    - id: hb-c08-u0104-s003
      start: 138
      end: 169
  - type: paragraph
    id: hb-c08-u0105
    text: För studentexamensproven får den studerande vitsord med bokstäver som härstammar från latinska
      vitsord. Bokstäverna från det högsta vitsordet till det lägsta är L, E, M, C, B och A och I för
      underkänt. Den studerande får ett studentexamensbetyg när hen har avlagt gymnasiets hela lärokurs
      och dessutom studentexamensproven.
    sentences:
    - id: hb-c08-u0105-s001
      start: 0
      end: 103
    - id: hb-c08-u0105-s002
      start: 104
      end: 201
    - id: hb-c08-u0105-s003
      start: 202
      end: 323
  - type: paragraph
    id: hb-c08-u0106
    text: På gymnasiet finns inga terminsavgifter. Utbildningen är alltså gratis. Du får skolböckerna
      eller digitala läromedel från skolan. Du får också låna en bärbar dator.
    sentences:
    - id: hb-c08-u0106-s001
      start: 0
      end: 40
    - id: hb-c08-u0106-s002
      start: 41
      end: 71
    - id: hb-c08-u0106-s003
      start: 72
      end: 129
    - id: hb-c08-u0106-s004
      start: 130
      end: 164
- id: hb-c08-yrkesutbildning
  title: Yrkesutbildning och lärande på arbetsplatsen
  blocks:
  - type: paragraph
    id: hb-c08-u0107
    text: Inom yrkesutbildningar studerar man ett yrke och de färdigheter som krävs för det i teori och
      praktik. De teoretiska studierna kopplas till praktiska arbetsuppgifter. Den som avlagt examen har
      utbildning och kompetens för ett visst yrke. Yrken som man utexamineras till efter avlagd grundexamen
      är till exempel frisör, närvårdare, busschaufför, bilmekaniker, kock, elmontör och IT-supporter.
      De populäraste utbildningsområdena är teknikområdet och hälso- och välfärdsområdet.
    sentences:
    - id: hb-c08-u0107-s001
      start: 0
      end: 102
    - id: hb-c08-u0107-s002
      start: 103
      end: 166
    - id: hb-c08-u0107-s003
      start: 167
      end: 237
    - id: hb-c08-u0107-s004
      start: 238
      end: 391
    - id: hb-c08-u0107-s005
      start: 392
      end: 475
  - type: paragraph
    id: hb-c08-u0108
    text: Studier på en yrkesläroanstalt är avgiftsfria för den unga. En studerande i läropliktsåldern,
      det vill säga under 18 år, får läroböckerna och i allmänhet också de arbetsredskap som behövs i
      yrket gratis från läroanstalten och en avgiftsfri lunchmåltid. Utbildningar för vuxna kan vara avgiftsbelagda.
    sentences:
    - id: hb-c08-u0108-s001
      start: 0
      end: 59
    - id: hb-c08-u0108-s002
      start: 60
      end: 252
    - id: hb-c08-u0108-s003
      start: 253
      end: 300
  - type: paragraph
    id: hb-c08-u0109
    text: Om en studerande inte har avlagt den grundläggande utbildningen i Finland, måste hen i allmänhet
      intyga att hen kan finska eller svenska tillräckligt väl för yrkesstudier.
    sentences:
    - id: hb-c08-u0109-s001
      start: 0
      end: 171
  - type: paragraph
    id: hb-c08-u0110
    text: En yrkesutbildning kan avläggas på många olika sätt, och det finns studiemöjligheter för både
      unga och vuxna. I Finland finns det specialyrkesläroanstalter och specialyrkesutbildningar för studerande
      som behöver regelbundet stöd för studierna på grund av till exempel inlärningssvårigheter, en skada
      eller en sjukdom.
    sentences:
    - id: hb-c08-u0110-s001
      start: 0
      end: 109
    - id: hb-c08-u0110-s002
      start: 110
      end: 317
  - type: paragraph
    id: hb-c08-u0111
    text: Exempel på yrkesexamina är yrkesinriktad grundexamen, yrkesexamen och specialyrkesexamen. De
      kan avläggas vid en läroanstalt, eller genom en läroavtalsutbildning eller en utbildning som grundar
      sig på utbildningsavtal. En studerande som avlagt yrkesinriktad grundexamen kan söka till fortsatta
      studier vid en yrkeshögskola eller ett universitet, eller avlägga en yrkes- eller specialyrkesexamen.
    sentences:
    - id: hb-c08-u0111-s001
      start: 0
      end: 89
    - id: hb-c08-u0111-s002
      start: 90
      end: 218
    - id: hb-c08-u0111-s003
      start: 219
      end: 395
  - type: paragraph
    id: hb-c08-u0112
    text: Inom alla yrkesexamina skaffar man kompetens också genom praktiska arbetsuppgifter på en arbetsplats.
      Kompetens enligt kraven på yrkesskicklighet visas genom bedömda prov på arbetsplatsen.
    sentences:
    - id: hb-c08-u0112-s001
      start: 0
      end: 101
    - id: hb-c08-u0112-s002
      start: 102
      end: 188
  - type: paragraph
    id: hb-c08-u0113
    text: Ett utbildningsavtal är ett arrangemang där den studerande skaffar kompetens på en arbetsplats
      genom praktiska arbetsuppgifter. Hen står inte i ett anställningsförhållande till arbetsplatsen
      och får ingen lön. Med ett utbildningsavtal kan man avlägga en del eller delar av en examen, eller
      en mindre helhet av en examen, men inte en hel examen.
    sentences:
    - id: hb-c08-u0113-s001
      start: 0
      end: 127
    - id: hb-c08-u0113-s002
      start: 128
      end: 209
    - id: hb-c08-u0113-s003
      start: 210
      end: 344
  - type: paragraph
    id: hb-c08-u0114
    text: En läroavtalsutbildning innebär att den studerande studerar ett yrke i ett anställningsförhållande
      på en arbetsplats samtidigt som hen arbetar. Den studerande ingår ett tidsbundet arbetsavtal med
      arbetsgivaren. Dessutom ingår utbildningsanordnaren, det vill säga läroanstalten, och arbetsgivaren
      ett avtal om ordnandet av läroavtalsutbildningen. Den studerande ska själv hitta en lämplig arbetsplats.
      För arbetsdagarna får den studerande normal lön. I studierna ingår också dagar med studier på läroanstalten.
    sentences:
    - id: hb-c08-u0114-s001
      start: 0
      end: 143
    - id: hb-c08-u0114-s002
      start: 144
      end: 210
    - id: hb-c08-u0114-s003
      start: 211
      end: 345
    - id: hb-c08-u0114-s004
      start: 346
      end: 400
    - id: hb-c08-u0114-s005
      start: 401
      end: 449
    - id: hb-c08-u0114-s006
      start: 450
      end: 509
  - type: paragraph
    id: hb-c08-u0115
    text: Som läroavtalsutbildning kan man studera en hel yrkesexamen, en del eller delar av en examen,
      eller en mindre helhet än en del av en examen. En läroavtalsutbildning pågår vanligtvis i 1–3 år.
      Längden beror på den studerandes tidigare kompetens. För den studerande utses en arbetsplatshandledare
      på arbetsplatsen som handleder och bedömer den studerandes framsteg och fungerar som kontaktperson
      till läroanstalten.
    sentences:
    - id: hb-c08-u0115-s001
      start: 0
      end: 140
    - id: hb-c08-u0115-s002
      start: 141
      end: 191
    - id: hb-c08-u0115-s003
      start: 192
      end: 244
    - id: hb-c08-u0115-s004
      start: 245
      end: 413
  - type: paragraph
    id: hb-c08-u0116
    text: Yrkesinriktad grundexamen är avsedd för personer som inte har tidigare kunskaper i yrket i fråga.
      Under studierna skaffar de studerande de kunskaper och färdigheter som behövs i yrket och för att
      kunna arbeta självständigt i det. Exempel på grundexamina är examina inom till exempel handel och
      förvaltning, teknikområdet, hälso- och välfärdsområdet, informationshantering och datakommunikation,
      konstområden och servicebranschen. I allmänhet avläggs en yrkesinriktad grundexamen på 2–3 år.
    sentences:
    - id: hb-c08-u0116-s001
      start: 0
      end: 97
    - id: hb-c08-u0116-s002
      start: 98
      end: 229
    - id: hb-c08-u0116-s003
      start: 230
      end: 429
    - id: hb-c08-u0116-s004
      start: 430
      end: 489
  - type: paragraph
    id: hb-c08-u0117
    text: Yrkesutbildningen baserar sig på grunderna för yrkesinriktad grundexamen som utarbetats av Utbildningsstyrelsen.
      Största delen av studierna är yrkesstudier, det vill säga inhämtande av de kunskaper och färdigheter
      och den kompetens som krävs för arbete inom respektive bransch. En del av studierna sker på en arbetsplats,
      eftersom yrkesinriktade grundexamina inkluderar mycket lärande i arbete.
    sentences:
    - id: hb-c08-u0117-s001
      start: 0
      end: 112
    - id: hb-c08-u0117-s002
      start: 113
      end: 277
    - id: hb-c08-u0117-s003
      start: 278
      end: 394
  - type: paragraph
    id: hb-c08-u0118
    text: I en grundexamen ingår också allmänbildande studier, det vill säga gemensamma examensdelar.
      En del av dem obligatoriska och en del valfria. Dessa examensdelar omfattar studier i modersmål
      och andra språk och informations- och kommunikationsteknik, matematik, fysik och kemi. De omfattar
      också bland annat gymnastik och studier i samhälls- och arbetslivsfärdigheter. De gemensamma examensdelarna
      är till nytta när man söker till fortsatta studier.
    sentences:
    - id: hb-c08-u0118-s001
      start: 0
      end: 91
    - id: hb-c08-u0118-s002
      start: 92
      end: 139
    - id: hb-c08-u0118-s003
      start: 140
      end: 274
    - id: hb-c08-u0118-s004
      start: 275
      end: 365
    - id: hb-c08-u0118-s005
      start: 366
      end: 446
  - type: paragraph
    id: hb-c08-u0119
    text: När studierna börjar gör skolan upp en personlig utvecklingsplan för kunnandet (PUK) för varje
      studerande. Den är den studerandes individuella studieplan. Om den studerande studerar inom specialundervisning,
      gör skolan också upp en individuell plan för hur undervisningen ska ordnas (IP) för hen.
    sentences:
    - id: hb-c08-u0119-s001
      start: 0
      end: 106
    - id: hb-c08-u0119-s002
      start: 107
      end: 154
    - id: hb-c08-u0119-s003
      start: 155
      end: 296
  - type: paragraph
    id: hb-c08-u0120
    text: Den studerande deltar aktivt i planeringen av sina studier och får studiehandledning under studiernas
      gång. Studiehandledningen är särskilt viktig för studerande som har studiesvårigheter eller utmaningar
      med livshanteringen. Studiehandledningen hjälper den studerande att slutföra sina studier, stöder
      hen och stärker utvecklingen av hens yrkesskicklighet.
    sentences:
    - id: hb-c08-u0120-s001
      start: 0
      end: 107
    - id: hb-c08-u0120-s002
      start: 108
      end: 225
    - id: hb-c08-u0120-s003
      start: 226
      end: 357
  - type: paragraph
    id: hb-c08-u0121
    text: Inom yrkesinriktade grundexamina bedöms den studerandes kunnande vanligtvis genom prov som genomförs
      på en arbetsplats under perioder av lärande i arbete. I proven visar den studerande i praktiken
      att hen kan utföra vissa arbetsuppgifter. Genom det visar hen hur väl hen uppnår den viktiga yrkesskicklighet
      eller -kompetens som fastställs i grunderna för examen.
    sentences:
    - id: hb-c08-u0121-s001
      start: 0
      end: 154
    - id: hb-c08-u0121-s002
      start: 155
      end: 238
    - id: hb-c08-u0121-s003
      start: 239
      end: 362
  - type: paragraph
    id: hb-c08-u0122
    text: För varje prov får den studerande ett intyg, som är en del av examensbetyget. Delarna i en yrkesexamen
      bedöms på skalan 1–5, där 5 är högst. Gemensamma examensdelar bedöms på skalan godkänd eller underkänd.
    sentences:
    - id: hb-c08-u0122-s001
      start: 0
      end: 77
    - id: hb-c08-u0122-s002
      start: 78
      end: 140
    - id: hb-c08-u0122-s003
      start: 141
      end: 206
  - type: paragraph
    id: hb-c08-u0123
    text: Det är möjligt att avlägga gymnasiets studentexamen och en yrkesinriktad grundexamen inom samma
      studier. Då pratar man om en dubbelexamen. Gymnasiestudierna avläggs ofta på ett vuxengymnasium
      så att man studerar gymnasieämnen två dagar i veckan. Läroämnena inom den yrkesinriktade grundexamen
      studeras tre dagar i veckan. En dubbelexamen avläggs i allmänhet på 3,5 år.
    sentences:
    - id: hb-c08-u0123-s001
      start: 0
      end: 104
    - id: hb-c08-u0123-s002
      start: 105
      end: 138
    - id: hb-c08-u0123-s003
      start: 139
      end: 245
    - id: hb-c08-u0123-s004
      start: 246
      end: 321
    - id: hb-c08-u0123-s005
      start: 322
      end: 368
  - type: paragraph
    id: hb-c08-u0124
    text: Du kan söka till yrkesutbildning i Finland när du har avlagt grundskolans lärokurs eller har
      motsvarande färdigheter som förvärvats på andra sätt. Utbildningsanordnaren bedömer om sökandens
      förutsättningar för att avlägga examen är tillräckliga.
    sentences:
    - id: hb-c08-u0124-s001
      start: 0
      end: 146
    - id: hb-c08-u0124-s002
      start: 147
      end: 245
- id: hb-c08-hux
  title: Utbildning som handleder för examensutbildning
  blocks:
  - type: paragraph
    id: hb-c08-u0125
    text: Under en Hux-utbildning, det vill säga en utbildning som handleder för examensutbildning, är
      det möjligt att förbättra sina studiefärdigheter eller kunskaper i studiespråket. Under Hux-utbildningen
      är det möjligt att höja vitsord från den grundläggande utbildningen, om det är nödvändigt för att
      få en utbildningsplats. Dessutom kan den studerande avlägga studier inom gymnasieutbildning och
      yrkesutbildning.
    sentences:
    - id: hb-c08-u0125-s001
      start: 0
      end: 174
    - id: hb-c08-u0125-s002
      start: 175
      end: 319
    - id: hb-c08-u0125-s003
      start: 320
      end: 408
  - type: paragraph
    id: hb-c08-u0126
    text: Hux-utbildningen pågår i högst ett år, och under den bekantar man sig med olika utbildningar.
      Från Hux-utbildningen är det möjligt att på ett flexibelt sätt direkt övergå till en yrkesutbildning
      eller ett gymnasium. Hux-utbildningar är avsedda för både unga i läropliktsåldern och vuxna. För
      att avlägga en sådan kan man få studiestöd från FPA. Utbildningen är avgiftsfri, och man ansöker
      via den gemensamma ansökan eller den kontinuerliga ansökan.
    sentences:
    - id: hb-c08-u0126-s001
      start: 0
      end: 93
    - id: hb-c08-u0126-s002
      start: 94
      end: 215
    - id: hb-c08-u0126-s003
      start: 216
      end: 287
    - id: hb-c08-u0126-s004
      start: 288
      end: 344
    - id: hb-c08-u0126-s005
      start: 345
      end: 448
- id: hb-c08-hogskolor
  title: Högskolor
  blocks:
  - type: paragraph
    id: hb-c08-u0127
    text: Högskolorna i Finland är yrkeshögskolor och universitet. Yrkeshögskolorna erbjuder praktisk
      högskoleutbildning för ett yrke. Vid yrkeshögskolorna bedrivs tillämpad forskning och utvecklingsarbete
      som stöder näringslivet och den offentliga sektorn.
    sentences:
    - id: hb-c08-u0127-s001
      start: 0
      end: 56
    - id: hb-c08-u0127-s002
      start: 57
      end: 124
    - id: hb-c08-u0127-s003
      start: 125
      end: 247
  - type: paragraph
    id: hb-c08-u0128
    text: Universiteten bedriver akademisk forskning som producerar ny kunskap och främjar vetenskapens,
      konstens, ekonomins och samhällets utveckling. Universitetsstudier är mer teoretiska än yrkeshögskolestudier
      och baserar sig på den vetenskapliga forskningen inom respektive område. Universitetsstudier förbereder
      de studerande för olika sakkunnig- och ledningsuppgifter.
    sentences:
    - id: hb-c08-u0128-s001
      start: 0
      end: 141
    - id: hb-c08-u0128-s002
      start: 142
      end: 276
    - id: hb-c08-u0128-s003
      start: 277
      end: 365
  - type: paragraph
    id: hb-c08-u0129
    text: Största delen av högskolorna är offentliga, och deras verksamhet upprätthålls i allmänhet med
      skattemedel. Kandidat-, magister- och doktorsstudier på finska och svenska är avgiftsfria för studerande
      som bor permanent i Finland. Studerande som kommer från länder utanför EU för att studera inom kandidat-
      och magisterprogram på engelska betalar i allmänhet en läsårsavgift för sina studier.
    sentences:
    - id: hb-c08-u0129-s001
      start: 0
      end: 106
    - id: hb-c08-u0129-s002
      start: 107
      end: 227
    - id: hb-c08-u0129-s003
      start: 228
      end: 389
  - type: paragraph
    id: hb-c08-u0130
    text: Man kan söka till en högskola om man har avlagt gymnasiets lärokurs eller en treårig yrkesutbildning.
      Också en motsvarande examen som avlagts utomlands duger om den ger behörighet att studera vid en
      högskola i det land där examen har avlagts.
    sentences:
    - id: hb-c08-u0130-s001
      start: 0
      end: 101
    - id: hb-c08-u0130-s002
      start: 102
      end: 242
  - type: paragraph
    id: hb-c08-u0131
    text: Varje utbildning har egna urvalskriterier som läroanstalterna följer när de väljer studerande.
      En del studerande väljs direkt på basis av betygen. Det är möjligt att bli antagen till en högskola
      också med hjälp av ett inträdesprov. Det är värt att förbereda sig väl för det, eftersom endast
      ett litet antal sökande antas till många utbildningar.
    sentences:
    - id: hb-c08-u0131-s001
      start: 0
      end: 94
    - id: hb-c08-u0131-s002
      start: 95
      end: 146
    - id: hb-c08-u0131-s003
      start: 147
      end: 231
    - id: hb-c08-u0131-s004
      start: 232
      end: 345
  - type: paragraph
    id: hb-c08-u0132
    text: Inträdesprovet kan vara skriftligt eller praktiskt. Ibland måste den sökande utföra förhandsuppgifter
      utöver inträdesprovet. Om en studerande vill avlägga högskolestudier på finska eller svenska, måste
      hen ha tillräckliga kunskaper i dessa språk. Många examina kan avläggas också på engelska. I sådana
      fall ska den studerande visa att hen har tillräckliga kunskaper i engelska.
    sentences:
    - id: hb-c08-u0132-s001
      start: 0
      end: 51
    - id: hb-c08-u0132-s002
      start: 52
      end: 124
    - id: hb-c08-u0132-s003
      start: 125
      end: 246
    - id: hb-c08-u0132-s004
      start: 247
      end: 292
    - id: hb-c08-u0132-s005
      start: 293
      end: 377
  - type: paragraph
    id: hb-c08-u0133
    text: Yrkeshögskolestudier omfattar arbetspraktik och ett examensarbete. I examensarbetet sätter sig
      den studerande grundligt in i ett specialområde och visar att hen kan tillämpa sina kunskaper.
    sentences:
    - id: hb-c08-u0133-s001
      start: 0
      end: 66
    - id: hb-c08-u0133-s002
      start: 67
      end: 189
  - type: paragraph
    id: hb-c08-u0134
    text: Inom vissa områden kan man också studera till en högre yrkeshögskoleexamen (högre YH), vilket
      tar 1–1,5 år. En högre yrkeshögskoleexamen är en examen på magisternivå avsedd för personer som
      redan är i arbetslivet. För att bli antagen till en högre yrkeshögskoleexamen krävs minst två års
      arbetslivserfarenhet inom branschen efter att den lägre examen avlades.
    sentences:
    - id: hb-c08-u0134-s001
      start: 0
      end: 107
    - id: hb-c08-u0134-s002
      start: 108
      end: 213
    - id: hb-c08-u0134-s003
      start: 214
      end: 359
  - type: paragraph
    id: hb-c08-u0135
    text: Vid yrkeshögskolorna är det möjligt att avlägga examina och kompletterande studier vid sidan
      av arbetet. En del studieprogram är planerade så att de inkluderar endast lite närundervisning.
      Utbildningen kan också ordnas endast kvällstid, och många kurser är distanskurser.
    sentences:
    - id: hb-c08-u0135-s001
      start: 0
      end: 104
    - id: hb-c08-u0135-s002
      start: 105
      end: 188
    - id: hb-c08-u0135-s003
      start: 189
      end: 271
  - type: paragraph
    id: hb-c08-u0136
    text: Största delen av universiteten i Finland är tvärvetenskapliga läroanstalter, det vill säga man
      kan avlägga studier inom många olika områden där. Några av universiteten har fokuserat på undervisning
      inom endast ett visst område. Vid dem kan man studera endast till exempel konstområden, teknik eller
      handelsvetenskap.
    sentences:
    - id: hb-c08-u0136-s001
      start: 0
      end: 144
    - id: hb-c08-u0136-s002
      start: 145
      end: 227
    - id: hb-c08-u0136-s003
      start: 228
      end: 316
  - type: paragraph
    id: hb-c08-u0137
    text: De studerande avlägger först en lägre högskoleexamen, det vill säga en kandidatexamen. Det tar
      i allmänhet cirka tre år. Efter det kan den studerande avlägga också en högre högskoleexamen, det
      vill säga en magisterexamen, vilket tar cirka två år.
    sentences:
    - id: hb-c08-u0137-s001
      start: 0
      end: 86
    - id: hb-c08-u0137-s002
      start: 87
      end: 120
    - id: hb-c08-u0137-s003
      start: 121
      end: 246
  - type: paragraph
    id: hb-c08-u0138
    text: När en studerande får studierätt för en kandidatexamen får hen i allmänhet också rätt att fortsätta
      med en magisterexamen inom samma område. Största delen av de som avlagt en kandidatexamen vid ett
      universitet avlägger också en magisterexamen. En sådan krävs för till exempel offentliga ämbeten
      och många sakkunniguppgifter.
    sentences:
    - id: hb-c08-u0138-s001
      start: 0
      end: 140
    - id: hb-c08-u0138-s002
      start: 141
      end: 243
    - id: hb-c08-u0138-s003
      start: 244
      end: 324
  - type: paragraph
    id: hb-c08-u0139
    text: Om en studerande är intresserad av en karriär som forskare och av vetenskaplig forskning, kan
      hen efter magisterstudierna söka till fortsatta studier för att avlägga en licentiat- eller doktorsexamen.
    sentences:
    - id: hb-c08-u0139-s001
      start: 0
      end: 200
  - type: paragraph
    id: hb-c08-u0140
    text: Om en person har avlagt en examen eller studier utomlands och ansöker om att fortsätta sina
      studier i Finland, är det läroanstalten eller högskolan som beslutar om antagningen som studerande.
      Läroanstalten eller högskolan bedömer i sådana fall den utländska utbildningen och den behörighet
      för fortsatta studier som den ger.
    sentences:
    - id: hb-c08-u0140-s001
      start: 0
      end: 191
    - id: hb-c08-u0140-s002
      start: 192
      end: 324
  - type: paragraph
    id: hb-c08-u0141
    text: När en person har fått studierätt i Finland bedömer läroanstalten eller högskolan huruvida den
      kompetens som hen skaffat utomlands kan räknas till godo för den utbildning som avläggs i Finland.
    sentences:
    - id: hb-c08-u0141-s001
      start: 0
      end: 193
  - type: paragraph
    id: hb-c08-u0142
    text: Yrkeshögskolan kan ordna avgiftsfri utbildning för invandrare med målet att ge den studerande
      tillräckliga språkkunskaper och andra färdigheter som behövs för att studera vid yrkeshögskolan.
      Under studierna tränar studeranden sig i det finska språket, på att läsa saktexter och på sina studiefärdigheter.
      Dessutom får studerandena information om utbildningsområdet, arbetsmöjligheter och studier som leder
      till examen. Språkkunkapskravet för dem som söker till förberedande utbildning är oftast finskakunskaper
      på nivån B1 eller B2.
    sentences:
    - id: hb-c08-u0142-s001
      start: 0
      end: 190
    - id: hb-c08-u0142-s002
      start: 191
      end: 304
    - id: hb-c08-u0142-s003
      start: 305
      end: 418
    - id: hb-c08-u0142-s004
      start: 419
      end: 532
- id: hb-c08-vuxna
  title: Vuxenutbildning och fritt bildningsarbete
  blocks:
  - type: paragraph
    id: hb-c08-u0143
    text: Många vuxengymnasier, medborgarinstitut och folkhögskolor erbjuder grundläggande utbildning
      för vuxna. Inom den kan vuxna avlägga antingen grundskolekurser eller enskilda kurser.
    sentences:
    - id: hb-c08-u0143-s001
      start: 0
      end: 102
    - id: hb-c08-u0143-s002
      start: 103
      end: 178
  - type: paragraph
    id: hb-c08-u0144
    text: Den grundläggande utbildningen för vuxna är avsedd särskilt för unga och vuxna som flyttat till
      Finland och som inte gått ut grundskolan, som endast gått lite i skolan eller vars avklarade grundskolestudier
      inte kan jämföras med studierna i Finland. Inom den grundläggande utbildningen studerar till exempel
      17–25-åriga nyanlända som på grund av sin ålder inte längre kan delta i undervisning som ordnas
      för barn och unga men som behöver ett avgångsbetyg för den grundläggande utbildningen och studiefärdigheter
      för att kunna fortsätta studera på andra stadiet.
    sentences:
    - id: hb-c08-u0144-s001
      start: 0
      end: 249
    - id: hb-c08-u0144-s002
      start: 250
      end: 561
  - type: paragraph
    id: hb-c08-u0145
    text: En annan viktig grupp som studerar inom den grundläggande utbildningen för vuxna är invandrade
      vuxna som på grund en svag grundutbildning behöver undervisning i särskilt läs- och skrivkunnighet,
      finska eller svenska och engelska samt matematik, eller som behöver ett avgångsbetyg för fortsatta
      studier.
    sentences:
    - id: hb-c08-u0145-s001
      start: 0
      end: 302
  - type: paragraph
    id: hb-c08-u0146
    text: Utbildningsstyrelsen har utfärdat egna grunder för läroplanen för den grundläggande utbildningen
      för vuxna. Läroämnena inom den grundläggande utbildningen för vuxna är till största delen desamma
      som inom den grundläggande utbildningen för barn. Den grundläggande utbildningen för vuxna är indelad
      i ett inledningsskede och ett slutskede. Inledningsskedet av undervisningen omfattar ett läskunnighetsskede,
      där läs- och skrivfärdighet är viktig. De viktigaste läroämnena i inledningsskedet är finska eller
      svenska, engelska och matematik.
    sentences:
    - id: hb-c08-u0146-s001
      start: 0
      end: 107
    - id: hb-c08-u0146-s002
      start: 108
      end: 244
    - id: hb-c08-u0146-s003
      start: 245
      end: 337
    - id: hb-c08-u0146-s004
      start: 338
      end: 444
    - id: hb-c08-u0146-s005
      start: 445
      end: 537
  - type: paragraph
    id: hb-c08-u0147
    text: I slutskedet studerar man över tio olika läroämnen. Att fullgöra slutskedet innebär att man
      avlagt grundskoleexamen i Finland. Undervisningsspråket är finska eller svenska. Undervisningen
      är avgiftsfri för de studerande.
    sentences:
    - id: hb-c08-u0147-s001
      start: 0
      end: 51
    - id: hb-c08-u0147-s002
      start: 52
      end: 126
    - id: hb-c08-u0147-s003
      start: 127
      end: 172
    - id: hb-c08-u0147-s004
      start: 173
      end: 220
  - type: paragraph
    id: hb-c08-u0148
    text: Vem som helst som har avlagt den grundläggande utbildningens lärokurs eller en motsvarande lärokurs
      kan söka till en gymnasieutbildning för vuxna. Den är avsedd för i huvudsak personer över 18 år.
    sentences:
    - id: hb-c08-u0148-s001
      start: 0
      end: 146
    - id: hb-c08-u0148-s002
      start: 147
      end: 196
  - type: paragraph
    id: hb-c08-u0149
    text: Gymnasieutbildning för vuxna ger färdigheter för fortsatta studier vid universitet och yrkeshögskolor
      och inom yrkesutbildning som baserar sig på gymnasiets lärokurs. Studierna vid ett vuxengymnasium
      ordnas som dags- eller kvällsundervisning och kan avläggas vid sidan av arbetet. Studierna kan bestå
      av närundervisning eller nätundervisning.
    sentences:
    - id: hb-c08-u0149-s001
      start: 0
      end: 166
    - id: hb-c08-u0149-s002
      start: 167
      end: 280
    - id: hb-c08-u0149-s003
      start: 281
      end: 342
  - type: paragraph
    id: hb-c08-u0150
    text: Vid ett vuxengymnasium kan man avlägga gymnasiets hela lärokurs och studentexamen. Man kan också
      studera lärokursen för ett eller flera gymnasieämnen eller enskilda studieperioder. Att avlägga
      enskilda studieperioder vid ett vuxengymnasium är avgiftsbelagt.
    sentences:
    - id: hb-c08-u0150-s001
      start: 0
      end: 82
    - id: hb-c08-u0150-s002
      start: 83
      end: 180
    - id: hb-c08-u0150-s003
      start: 181
      end: 257
  - type: paragraph
    id: hb-c08-u0151
    text: Vid vuxengymnasier följs grunderna för läroplanen för gymnasieutbildning för vuxna. Att avlägga
      en hel gymnasieutbildning tar 2–4 år. Undervisningsspråket är finska eller svenska. Det riktgivande
      kravet på språkkunskaper för gymnasieutbildning är B1.1.
    sentences:
    - id: hb-c08-u0151-s001
      start: 0
      end: 83
    - id: hb-c08-u0151-s002
      start: 84
      end: 133
    - id: hb-c08-u0151-s003
      start: 134
      end: 179
    - id: hb-c08-u0151-s004
      start: 180
      end: 252
  - type: paragraph
    id: hb-c08-u0152
    text: Yrkesexamen och specialyrkesexamen är avsedda för personer som genom arbete eller hobbyer redan
      har skaffat sig yrkeskunskaper inom branschen i fråga, eller som vill utveckla sin kompetens. När
      man avlägger en yrkesexamen visar man sin kompetens som fackman inom sin egen bransch. Inom specialyrkesexamen
      visar man sin förmåga att utföra de mest krävande uppgifterna inom branschen.
    sentences:
    - id: hb-c08-u0152-s001
      start: 0
      end: 189
    - id: hb-c08-u0152-s002
      start: 190
      end: 280
    - id: hb-c08-u0152-s003
      start: 281
      end: 382
  - type: paragraph
    id: hb-c08-u0153
    text: Den studerande kan avlägga sin examen genom prov och är inte tvungen att delta i utbildningen.
      Läroanstalterna anordnar också utbildning som förbereder för yrkes- och specialyrkesexamen. Det
      är ofta möjligt att delta i utbildningen vid sidan av arbetet.
    sentences:
    - id: hb-c08-u0153-s001
      start: 0
      end: 94
    - id: hb-c08-u0153-s002
      start: 95
      end: 186
    - id: hb-c08-u0153-s003
      start: 187
      end: 253
  - type: paragraph
    id: hb-c08-u0154
    text: Vid alla yrkeshögskolor finns också en öppen yrkeshögskola och vid universiteten ett öppet universitet.
      Vid dem kan vem som helst avlägga universitets- eller yrkeshögskolestudier utan inträdesprov. Det
      erbjuds både enskilda kurser och större helheter. Studierna är avgiftsbelagda. I vissa fall kan
      arbetsgivaren betala arbetstagarens studieavgifter.
    sentences:
    - id: hb-c08-u0154-s001
      start: 0
      end: 103
    - id: hb-c08-u0154-s002
      start: 104
      end: 197
    - id: hb-c08-u0154-s003
      start: 198
      end: 251
    - id: hb-c08-u0154-s004
      start: 252
      end: 280
    - id: hb-c08-u0154-s005
      start: 281
      end: 349
  - type: paragraph
    id: hb-c08-u0155
    text: Inom vissa områden kan man via en separat ansökan bli antagen för att avlägga en hel examen
      vid ett universitet eller en yrkeshögskola, om man först har avlagt en viss mängd studier inom området
      vid ett öppet universitet eller en öppen yrkeshögskola.
    sentences:
    - id: hb-c08-u0155-s001
      start: 0
      end: 250
  - type: paragraph
    id: hb-c08-u0156
    text: För vuxna i Finland finns det utöver yrkesinriktade studier och högskolestudier också ett stort
      utbud av studier inom det fria bildningsarbetet vid medborgarinstitut, folkhögskolor, studiecentraler
      och sommaruniversitet. De erbjuder många olika slags utbildningar som vem som helst kan delta i.
      Utbildningarna är i allmänhet avgiftsbelagda och ordnas på dagar, kvällar och helger. Kursutbudet
      omfattar till exempel olika språk, idrott och dans, hantverk, bildkonst, informationsteknik och
      digitala färdigheter, musik, teater och samhällsstudier. Vid folkhögskolorna består utbildningarna
      vanligtvis av heltidsstudier som pågår i ett läsår.
    sentences:
    - id: hb-c08-u0156-s001
      start: 0
      end: 220
    - id: hb-c08-u0156-s002
      start: 221
      end: 294
    - id: hb-c08-u0156-s003
      start: 295
      end: 380
    - id: hb-c08-u0156-s004
      start: 381
      end: 545
    - id: hb-c08-u0156-s005
      start: 546
      end: 639
  - type: paragraph
    id: hb-c08-u0157
    text: Med fritt bildningsarbete avses studier som vanligtvis inte leder till någon examen. Största
      delen av studierna är allmänbildande eller stöder hobbyer eller yrkeskunskaper. De ökar personens
      kompetens och välbefinnande. Samtidigt främjar studierna demokratin och förverkligandet av jämställdhet
      och är till nytta för hela samhället. Största delen av innehållet i studierna inom det fria bildningsarbetet
      fastställs inte officiellt någonstans, utan läroanstalterna får själva fritt planera hurdana kurser
      de erbjuder och vad som studeras på kurserna.
    sentences:
    - id: hb-c08-u0157-s001
      start: 0
      end: 84
    - id: hb-c08-u0157-s002
      start: 85
      end: 172
    - id: hb-c08-u0157-s003
      start: 173
      end: 219
    - id: hb-c08-u0157-s004
      start: 220
      end: 332
    - id: hb-c08-u0157-s005
      start: 333
      end: 549
  - type: paragraph
    id: hb-c08-u0158
    text: En del läroanstalter inom det fria bildningsarbetet erbjuder också kompletterande utbildning
      för arbetslivet, öppna universitetsstudier och föreläsningar för allmänheten. Många läroanstalter
      inom det fria bildningsarbetet ordnar undervisning i finska och svenska samt grundläggande utbildning
      för vuxna för nyanlända.
    sentences:
    - id: hb-c08-u0158-s001
      start: 0
      end: 170
    - id: hb-c08-u0158-s002
      start: 171
      end: 317
  - type: paragraph
    id: hb-c08-u0159
    text: Sysselsättningstjänsterna erbjuder arbetskraftsutbildning för personer i arbetsför ålder som
      är arbetslösa eller riskerar att bli arbetslösa. Målet är att öka deltagarnas yrkeskompetens och
      yrkesfärdigheter och förbättra deras sysselsättningsmöjligheter. Utbildningen är avgiftsfri.
    sentences:
    - id: hb-c08-u0159-s001
      start: 0
      end: 141
    - id: hb-c08-u0159-s002
      start: 142
      end: 254
    - id: hb-c08-u0159-s003
      start: 255
      end: 282
  - type: paragraph
    id: hb-c08-u0160
    text: Arbetskraftsutbildningar är utbildningar som ökar yrkeskompetensen, yrkesfärdigheterna och företagarfärdigheterna.
      Arbetskraftsutbildning kan ordnas tillsammans med arbetsgivare och företag. Sysselsättningstjänsterna
      kan bevilja stöd också för självständiga studier som den arbetssökande själv har hittat, men de
      måste främja sysselsättningen. Genom självständiga studier kan man avlägga till exempel en yrkesexamen
      eller delar av en examen.
    sentences:
    - id: hb-c08-u0160-s001
      start: 0
      end: 114
    - id: hb-c08-u0160-s002
      start: 115
      end: 190
    - id: hb-c08-u0160-s003
      start: 191
      end: 343
    - id: hb-c08-u0160-s004
      start: 344
      end: 441
  - type: paragraph
    id: hb-c08-u0161
    text: Yrkesutbildningar är grundexamen, yrkesexamen och specialyrkesexamen. Yrkesinriktad grundexamen
      kan avläggas av både unga och vuxna. Den är avsedd för personer som inte har tidigare kunskaper
      i yrket i fråga. Examen avläggs vid en läroanstalt eller som en läroavtalsutbildning.
    sentences:
    - id: hb-c08-u0161-s001
      start: 0
      end: 69
    - id: hb-c08-u0161-s002
      start: 70
      end: 132
    - id: hb-c08-u0161-s003
      start: 133
      end: 208
    - id: hb-c08-u0161-s004
      start: 209
      end: 277
  - type: paragraph
    id: hb-c08-u0162
    text: I vissa situationer kan studierna vid dessa läroanstalter dock vara kostnadsfria. Om till exempel
      utbildning i läs- och skrivkunnighet eller någon annan språkutbildning har godkänts till din integrationsplan,
      tas det inte ut någon avgift för studierna.
    sentences:
    - id: hb-c08-u0162-s001
      start: 0
      end: 81
    - id: hb-c08-u0162-s002
      start: 82
      end: 252
- id: hb-c08-finansiering
  title: Finansiering av studier
  blocks:
  - type: paragraph
    id: hb-c08-u0163
    text: Du kan få FPA:s studiestöd om du
    sentences:
    - id: hb-c08-u0163-s001
      start: 0
      end: 32
  - id: hb-c08-u0165
    type: list
    ordered: false
    items:
    - id: hb-c08-u0164
      text: har registrerat dig i befolkningsdatasystemet som en person som bor stadigvarande i Finland,
      sentences:
      - id: hb-c08-u0164-s001
        start: 0
        end: 92
    - id: hb-c08-u0166
      text: har det uppehållstillstånd som krävs och
      sentences:
      - id: hb-c08-u0166-s001
        start: 0
        end: 40
    - id: hb-c08-u0167
      text: om du vistas i Finland av någon annan orsak än studier.
      sentences:
      - id: hb-c08-u0167-s001
        start: 0
        end: 55
  - type: paragraph
    id: hb-c08-u0168
    text: Om du flyttar till Finland för att studera kan du inte få studiestöd. Till exempel utbytesstuderande
      får inte finskt studiestöd.
    sentences:
    - id: hb-c08-u0168-s001
      start: 0
      end: 69
    - id: hb-c08-u0168-s002
      start: 70
      end: 128
  - type: paragraph
    id: hb-c08-u0169
    text: Studiestödet består av studiepenningen, statsborgen för studielån och studiestödets bostadstillägg.
      Du ansöker om studiestöd hos FPA.
    sentences:
    - id: hb-c08-u0169-s001
      start: 0
      end: 99
    - id: hb-c08-u0169-s002
      start: 100
      end: 133
  - type: paragraph
    id: hb-c08-u0170
    text: Du kan få studiestöd om
    sentences:
    - id: hb-c08-u0170-s001
      start: 0
      end: 23
  - id: hb-c08-u0172
    type: list
    ordered: false
    items:
    - id: hb-c08-u0171
      text: du studerar vid gymnasiet
      sentences:
      - id: hb-c08-u0171-s001
        start: 0
        end: 25
    - id: hb-c08-u0173
      text: du studerar vid en yrkesläroanstalt eller avlägger yrkesinriktade tilläggsstudier
      sentences:
      - id: hb-c08-u0173-s001
        start: 0
        end: 81
    - id: hb-c08-u0174
      text: du studerar vid en högskola.
      sentences:
      - id: hb-c08-u0174-s001
        start: 0
        end: 28
  - type: paragraph
    id: hb-c08-u0175
    text: Du kan få studiepenning om du har fyllt 17 år. Du måste studera på heltid.
    sentences:
    - id: hb-c08-u0175-s001
      start: 0
      end: 46
    - id: hb-c08-u0175-s002
      start: 47
      end: 74
  - type: paragraph
    id: hb-c08-u0192
    text: Du kan arbeta vid sidan av studierna. Lönen som du får för ditt arbete kan minska ditt studiestöd.
    sentences:
    - id: hb-c08-u0192-s001
      start: 0
      end: 37
    - id: hb-c08-u0192-s002
      start: 38
      end: 98
  - type: paragraph
    id: hb-c08-u0176
    text: FPA betalar in studiepenningen på ditt konto månatligen. På studiepenningens belopp inverkar
      många omständigheter. På studiepenningens belopp inverkar bland annat din ålder, om du bor i ditt
      eget hem eller hos föräldrarna, om du är gift och om du har minderåriga barn.
    sentences:
    - id: hb-c08-u0176-s001
      start: 0
      end: 56
    - id: hb-c08-u0176-s002
      start: 57
      end: 114
    - id: hb-c08-u0176-s003
      start: 115
      end: 268
  - type: paragraph
    id: hb-c08-u0177
    text: Det är inte obligatoriskt att ta studielån. Du kan högst ta ut lån till ett visst maximibelopp.
      Du väljer själv hur mycket studielån du vill ta. Studielånet är ett lån för vilket finska staten
      beviljar statsgaranti. Du ansöker om lånet i banken när du har fått FPA:s beslut om statsgaranti.
      Du måste betala tillbaka studielånet när du har slutfört dina studier.
    sentences:
    - id: hb-c08-u0177-s001
      start: 0
      end: 43
    - id: hb-c08-u0177-s002
      start: 44
      end: 95
    - id: hb-c08-u0177-s003
      start: 96
      end: 144
    - id: hb-c08-u0177-s004
      start: 145
      end: 215
    - id: hb-c08-u0177-s005
      start: 216
      end: 290
    - id: hb-c08-u0177-s006
      start: 291
      end: 361
  - type: paragraph
    id: hb-c08-u0178
    text: Du kan få studiestödets bostadstillägg om du har rätt till studiestöd. Du kan få bostadstillägg
      för en hyresbostad eller en bostadsrättsbostad. Du kan endast få bostadstillägg för de månader då
      du studerar.
    sentences:
    - id: hb-c08-u0178-s001
      start: 0
      end: 70
    - id: hb-c08-u0178-s002
      start: 71
      end: 143
    - id: hb-c08-u0178-s003
      start: 144
      end: 206
  - type: paragraph
    id: hb-c08-u0179
    text: Skolresestödet (koulumatkatuki) ersätter kostnaderna för skolresor. Du kan få skolresestöd om
      du studerar och bor i Finland och har en lång skolresa.
    sentences:
    - id: hb-c08-u0179-s001
      start: 0
      end: 67
    - id: hb-c08-u0179-s002
      start: 68
      end: 149
  - type: paragraph
    id: hb-c08-u0180
    text: I vissa fall kan du ha rätt till skolresestöd om du studerar i gymnasiet eller vid en yrkesläroanstalt
      eller deltar i förberedande utbildning för dem. Du ska ha minst tio resedagar per månad och en tillräckligt
      lång skolresa för att få stöd. Fråga din skola om du har rätt till skolresestöd.
    sentences:
    - id: hb-c08-u0180-s001
      start: 0
      end: 150
    - id: hb-c08-u0180-s002
      start: 151
      end: 241
    - id: hb-c08-u0180-s003
      start: 242
      end: 291
  - type: paragraph
    id: hb-c08-u0181
    text: Om du studerar vid en högskola får du också måltidsstöd (ateriatuki). Du kan få måltidsstödet
      endast i läroanstalternas egna restauranger. Detta innebär att studeranden betalar mindre för måltiderna
      än andra som besöker restaurangen. Du behöver inte ansöka separat om måltidsstödet. Du behöver bara
      visa upp ditt studentkort när du betalar för måltiden.
    sentences:
    - id: hb-c08-u0181-s001
      start: 0
      end: 69
    - id: hb-c08-u0181-s002
      start: 70
      end: 138
    - id: hb-c08-u0181-s003
      start: 139
      end: 233
    - id: hb-c08-u0181-s004
      start: 234
      end: 282
    - id: hb-c08-u0181-s005
      start: 283
      end: 353
  - type: paragraph
    id: hb-c08-u0182
    text: Du har inte rätt till måltidsstöd om du är i Finland endast på arbetspraktik (työharjoittelu)
      som ingår i en utländsk examen.
    sentences:
    - id: hb-c08-u0182-s001
      start: 0
      end: 125
  - type: paragraph
    id: hb-c08-u0183
    text: Utländska studerande kan ansöka om olika penningunderstöd för finländska högskolor. Alla finländska
      högskolor har ett eget stipendiesystem för de studerande som kommer från länder utanför EU/EES-området
      och som har godkänts för att avlägga en kandidat- eller magisterexamen på engelska.
    sentences:
    - id: hb-c08-u0183-s001
      start: 0
      end: 83
    - id: hb-c08-u0183-s002
      start: 84
      end: 286
  - type: paragraph
    id: hb-c08-u0184
    text: Möjligheten till ett stipendium kan till exempel bero på hur framgångsrik du varit i dina studier.
      Stipendiet kan täcka hela läsårsavgiften eller en del av den. Vissa stipendier kan även täcka andra
      kostnader. Ibland krävs att du lyckas tillräckligt bra med dina studier för att du ska få ett stipendium.
      Du kan vanligtvis ansöka om ett stipendium samtidigt som du ansöker om en studieplats.
    sentences:
    - id: hb-c08-u0184-s001
      start: 0
      end: 98
    - id: hb-c08-u0184-s002
      start: 99
      end: 160
    - id: hb-c08-u0184-s003
      start: 161
      end: 209
    - id: hb-c08-u0184-s004
      start: 210
      end: 304
    - id: hb-c08-u0184-s005
      start: 305
      end: 391
  - type: paragraph
    id: hb-c08-u0185
    text: Om du är medborgare i ett EU- eller EES-land, Schweiz eller något av de nordiska länderna, har
      du rätt att jobba obegränsat under din studietid och du behöver inget särskilt tillstånd för det.
      Om du är medborgare i något annat land, har du med ditt uppehållstillstånd för studerande rätt att
      arbeta på vissa villkor.
    sentences:
    - id: hb-c08-u0185-s001
      start: 0
      end: 192
    - id: hb-c08-u0185-s002
      start: 193
      end: 316
  - type: paragraph
    id: hb-c08-u0186
    text: I Finland finns det olika sätt att finansiera vuxenstudier på. På vissa villkor kan man få olika
      typer av stöd, studielån och stipendier för sina studier. Många studier kan avläggas vid sidan av
      ett heltidsarbete. Då kan man arbeta som vanligt och studera på kvällar eller helger. Det är vanligt
      att i synnerhet högskolestuderande finansierar sina studier genom att ha ett deltidsarbete vid sidan
      av studierna. Många studerande arbetar hellre deltid vid sidan av studierna än tar studielån.
    sentences:
    - id: hb-c08-u0186-s001
      start: 0
      end: 62
    - id: hb-c08-u0186-s002
      start: 63
      end: 154
    - id: hb-c08-u0186-s003
      start: 155
      end: 213
    - id: hb-c08-u0186-s004
      start: 214
      end: 280
    - id: hb-c08-u0186-s005
      start: 281
      end: 410
    - id: hb-c08-u0186-s006
      start: 411
      end: 490
  - type: paragraph
    id: hb-c08-u0187
    text: Att avlägga en hel examen kostar i allmänhet ingenting om den studerande bor permanent i Finland.
      Om man flyttar från utlandet till Finland för att studera, är man vanligtvis tvungen att själv finansiera
      sina studier och sitt liv. Det är värt att fråga den högskola man ämnar söka till om eventuella
      stipendier. Även om examensstudier i huvudsak är avgiftsfria i Finland, kan enskilda kurser eller
      fortbildning kosta, och en del läroanstalter är helt avgiftsbelagda.
    sentences:
    - id: hb-c08-u0187-s001
      start: 0
      end: 97
    - id: hb-c08-u0187-s002
      start: 98
      end: 230
    - id: hb-c08-u0187-s003
      start: 231
      end: 311
    - id: hb-c08-u0187-s004
      start: 312
      end: 466
  - type: paragraph
    id: hb-c08-u0188
    text: En arbetslös kund hos sysselsättningstjänsterna kan på vissa villkor studera också med arbetslöshetsförmån.
      I sådana fall sker studierna inom en arbetskraftsutbildning, som man söker till via sysselsättningstjänsterna.
      Personer som studerar inom arbetskraftsutbildning har möjlighet att utöver arbetslöshetsförmån också
      få kostnadsersättning för studiedagarna.
    sentences:
    - id: hb-c08-u0188-s001
      start: 0
      end: 107
    - id: hb-c08-u0188-s002
      start: 108
      end: 218
    - id: hb-c08-u0188-s003
      start: 219
      end: 360
  - type: paragraph
    id: hb-c08-u0189
    text: Med en arbetslöshetsförmån kan en arbetssökande på vissa villkor också genomföra självständiga
      studier som hen själv har hittat. Då måste man komma överens om studierna i den sysselsättnings-
      eller integrationsplan som upprättas tillsammans med sysselsättningstjänsterna.
    sentences:
    - id: hb-c08-u0189-s001
      start: 0
      end: 128
    - id: hb-c08-u0189-s002
      start: 129
      end: 271
