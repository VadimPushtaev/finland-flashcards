schema_version: 1
id: hb-c05
language: sv
title: Grundläggande rättigheter, jämlikhet och skyldigheter
sections:
- id: hb-c05-grundlag
  title: Grundläggande och mänskliga rättigheter
  blocks:
  - type: paragraph
    id: hb-c05-u0001
    text: Finlands viktigaste lag är grundlagen. Ingen annan lag kan strida mot den. Finlands nuvarande
      reformerade grundlag trädde i kraft år 2000.
    sentences:
    - id: hb-c05-u0001-s001
      start: 0
      end: 38
    - id: hb-c05-u0001-s002
      start: 39
      end: 74
    - id: hb-c05-u0001-s003
      start: 75
      end: 138
  - type: paragraph
    id: hb-c05-u0002
    text: I en rättsstat respekteras lagarna och människornas grundläggande och mänskliga rättigheter.
      De grundläggande rättigheterna fastställs i grundlagen. Till de grundläggande rättigheterna hör
      bland annat rätten till likabehandling, frihet och personlig integritet. Grundläggande rättigheter
      är också till exempel rätt till avgiftsfri grundläggande utbildning och rätt till oundgänglig försörjning.
    sentences:
    - id: hb-c05-u0002-s001
      start: 0
      end: 92
    - id: hb-c05-u0002-s002
      start: 93
      end: 148
    - id: hb-c05-u0002-s003
      start: 149
      end: 261
    - id: hb-c05-u0002-s004
      start: 262
      end: 394
  - type: paragraph
    id: hb-c05-u0003
    text: De mänskliga rättigheterna fastställs i internationella avtal. Den allmänna förklaringen om
      de mänskliga rättigheterna antogs av Förenta nationerna år 1948. Finland har godkänt FN:s förklaring
      om de mänskliga rättigheterna och förbundit sig till dess principer.
    sentences:
    - id: hb-c05-u0003-s001
      start: 0
      end: 62
    - id: hb-c05-u0003-s002
      start: 63
      end: 156
    - id: hb-c05-u0003-s003
      start: 157
      end: 261
  - type: paragraph
    id: hb-c05-u0004
    text: 'Definitionen av de mänskliga rättigheterna fastställer att:'
    sentences:
    - id: hb-c05-u0004-s001
      start: 0
      end: 59
  - id: hb-c05-u0005
    type: list
    ordered: false
    items:
    - id: hb-c05-u0006
      text: de mänskliga rättigheterna är universella. Det betyder att de mänskliga rättigheterna gäller
        alla världens människor och att de är desamma överallt i världen
      sentences:
      - id: hb-c05-u0006-s001
        start: 0
        end: 42
      - id: hb-c05-u0006-s002
        start: 43
        end: 157
    - id: hb-c05-u0007
      text: de mänskliga rättigheterna är oförytterliga. Det betyder att man inte kan ta de mänskliga
        rättigheterna från någon. Inte ens människan själv kan ge bort sina mänskliga rättigheter
      sentences:
      - id: hb-c05-u0007-s001
        start: 0
        end: 44
      - id: hb-c05-u0007-s002
        start: 45
        end: 115
      - id: hb-c05-u0007-s003
        start: 116
        end: 179
    - id: hb-c05-u0008
      text: de mänskliga rättigheterna är odelbara. Det betyder att de mänskliga rättigheterna inte uppfylls
        om inte samtliga av dem uppfylls. Alla mänskliga rättigheter är lika viktiga och beroende av varandra
      sentences:
      - id: hb-c05-u0008-s001
        start: 0
        end: 39
      - id: hb-c05-u0008-s002
        start: 40
        end: 130
      - id: hb-c05-u0008-s003
        start: 131
        end: 198
    - id: hb-c05-u0009
      text: de mänskliga rättigheterna är fundamentala. Det betyder att de mänskliga rättigheterna är
        särskilt viktiga rättigheter. Om man kräver en rättighet för sig själv, måste man vara beredd
        att också ge den till andra.
      sentences:
      - id: hb-c05-u0009-s001
        start: 0
        end: 43
      - id: hb-c05-u0009-s002
        start: 44
        end: 119
      - id: hb-c05-u0009-s003
        start: 120
        end: 212
- id: hb-c05-friheter
  title: Grundläggande friheter och rättigheter
  blocks:
  - type: paragraph
    id: hb-c05-u0010
    text: De grundläggande rättigheterna gäller alla som bor och lever i Finland, inte bara finska medborgare.
    sentences:
    - id: hb-c05-u0010-s001
      start: 0
      end: 100
  - type: paragraph
    id: hb-c05-u0011
    text: 'Grundlagen garanterar alla följande grundläggande rättigheter:'
    sentences:
    - id: hb-c05-u0011-s001
      start: 0
      end: 62
  - id: hb-c05-u0012
    type: list
    ordered: false
    items:
    - id: hb-c05-u0013
      text: I Finland är lagen densamma för alla och alla är lika inför lagen. Ingen får utan godtagbart
        skäl särbehandlas på grund av kön, ålder, ursprung, språk, religion, övertygelse, åsikt, hälsotillstånd
        eller handikapp eller av någon annan orsak som gäller hens person.
      sentences:
      - id: hb-c05-u0013-s001
        start: 0
        end: 66
      - id: hb-c05-u0013-s002
        start: 67
        end: 263
    - id: hb-c05-u0014
      text: Alla har rätt till liv och till personlig frihet, integritet och trygghet. Ingen får dömas
        till döden eller torteras eller utsättas för någon annan behandling som kränker människovärdet.
      sentences:
      - id: hb-c05-u0014-s001
        start: 0
        end: 74
      - id: hb-c05-u0014-s002
        start: 75
        end: 186
    - id: hb-c05-u0015
      text: Ingen får dömas till straff på grund av en handling som inte var straffbar när den utfördes.
      sentences:
      - id: hb-c05-u0015-s001
        start: 0
        end: 92
    - id: hb-c05-u0016
      text: Var och en får själv välja bostadsort och röra sig fritt i Finland.
      sentences:
      - id: hb-c05-u0016-s001
        start: 0
        end: 67
    - id: hb-c05-u0017
      text: Var och en har rätt till skydd för privatlivet. Man får inte gå in i någons hem utan tillstånd.
        Man får inte läsa andra människors brev eller lyssna på någons samtal utan tillstånd.
      sentences:
      - id: hb-c05-u0017-s001
        start: 0
        end: 47
      - id: hb-c05-u0017-s002
        start: 48
        end: 95
      - id: hb-c05-u0017-s003
        start: 96
        end: 181
    - id: hb-c05-u0018
      text: I Finland råder religionsfrihet. Var och en har rätt att tro som de vill och utöva sin religion.
        Ingen är tvungen att höra till ett religiöst samfund eller delta i religionsutövning.
      sentences:
      - id: hb-c05-u0018-s001
        start: 0
        end: 32
      - id: hb-c05-u0018-s002
        start: 33
        end: 96
      - id: hb-c05-u0018-s003
        start: 97
        end: 182
    - id: hb-c05-u0019
      text: I Finland råder yttrandefrihet. Var och en får fritt säga sin åsikt.
      sentences:
      - id: hb-c05-u0019-s001
        start: 0
        end: 31
      - id: hb-c05-u0019-s002
        start: 32
        end: 68
    - id: hb-c05-u0020
      text: Var och en har rätt att ta del av offentliga handlingar. Handlingar som innehas av myndigheter
        är i princip offentliga, om det inte är nödvändigt att begränsa deras offentlighet.
      sentences:
      - id: hb-c05-u0020-s001
        start: 0
        end: 56
      - id: hb-c05-u0020-s002
        start: 57
        end: 178
    - id: hb-c05-u0021
      text: Var och en som enligt lagen har rösträtt har rätt att rösta i val. Den offentliga makten ska
        främja människors möjligheter att delta i samhällelig verksamhet och påverka beslutsfattande som
        rör dem.
      sentences:
      - id: hb-c05-u0021-s001
        start: 0
        end: 66
      - id: hb-c05-u0021-s002
        start: 67
        end: 198
    - id: hb-c05-u0022
      text: Vars och ens egendom är tryggad, det vill säga staten skyddar människors rätt att äga egendom.
      sentences:
      - id: hb-c05-u0022-s001
        start: 0
        end: 94
    - id: hb-c05-u0023
      text: Alla har rätt till avgiftsfri grundläggande utbildning. Alla har också rätt till utbildning
        efter den grundläggande utbildningen, enligt sin förmåga och sina behov. Vetenskapens, konstens
        och den högsta utbildningens frihet är tryggad.
      sentences:
      - id: hb-c05-u0023-s001
        start: 0
        end: 55
      - id: hb-c05-u0023-s002
        start: 56
        end: 164
      - id: hb-c05-u0023-s003
        start: 165
        end: 235
    - id: hb-c05-u0024
      text: Var och en har rätt att skaffa sig sin försörjning genom arbete eller näring som hen valt
        fritt.
      sentences:
      - id: hb-c05-u0024-s001
        start: 0
        end: 96
    - id: hb-c05-u0025
      text: Alla som inte kan skaffa sig den trygghet som behövs för ett människovärdigt liv har rätt
        till oundgänglig försörjning och omsorg. Alla har rätt till tillräckliga social-, hälsovårds-
        och sjukvårdstjänster.
      sentences:
      - id: hb-c05-u0025-s001
        start: 0
        end: 130
      - id: hb-c05-u0025-s002
        start: 131
        end: 206
    - id: hb-c05-u0026
      text: Alla har rätt att leva i en sund miljö och påverka beslut i frågor som gäller den egna livsmiljön.
      sentences:
      - id: hb-c05-u0026-s001
        start: 0
        end: 98
    - id: hb-c05-u0027
      text: Var och en har rätt att på behörigt sätt och utan ogrundat dröjsmål få sin sak behandlad av
        en domstol eller någon annan myndighet.
      sentences:
      - id: hb-c05-u0027-s001
        start: 0
        end: 131
    - id: hb-c05-u0028
      text: Det allmänna ska se till att de grundläggande fri- och rättigheterna och de mänskliga rättigheterna
        tillgodoses.
      sentences:
      - id: hb-c05-u0028-s001
        start: 0
        end: 112
  - type: paragraph
    id: hb-c05-u0029
    text: Människor får ordna möten och demonstrationer och delta i dem. För en demonstration behövs inget
      tillstånd från myndigheter. Den måste dock anmälas till polisen i förväg.
    sentences:
    - id: hb-c05-u0029-s001
      start: 0
      end: 62
    - id: hb-c05-u0029-s002
      start: 63
      end: 124
    - id: hb-c05-u0029-s003
      start: 125
      end: 170
  - type: paragraph
    id: hb-c05-u0030
    text: Var och en har också rätt att bilda och höra till föreningar.
    sentences:
    - id: hb-c05-u0030-s001
      start: 0
      end: 61
- id: hb-c05-jamstalldhet
  title: Jämställdhet mellan könen
  blocks:
  - type: paragraph
    id: hb-c05-u0031
    text: Grunden för det finländska samhället är likabehandling av medborgarna och jämställdhet mellan
      könen. Varje medlem i samhället ansvarar för att dessa värderingar förverkligas i samhället. Också
      lagstiftningen tryggar förverkligandet av dessa värderingar.
    sentences:
    - id: hb-c05-u0031-s001
      start: 0
      end: 100
    - id: hb-c05-u0031-s002
      start: 101
      end: 186
    - id: hb-c05-u0031-s003
      start: 187
      end: 253
  - type: paragraph
    id: hb-c05-u0032
    text: I finsk lagstiftning betyder jämställdhet jämställdhet mellan könen. Den omfattar också mångfalden
      av kön. Syftet med jämställdhetslagen är att säkerställa att ingen försätts i en annan ställning
      på grund av kön, könsidentitet eller könsuttryck.
    sentences:
    - id: hb-c05-u0032-s001
      start: 0
      end: 68
    - id: hb-c05-u0032-s002
      start: 69
      end: 106
    - id: hb-c05-u0032-s003
      start: 107
      end: 245
  - type: paragraph
    id: hb-c05-u0033
    text: Lagen om jämställdhet mellan kvinnor och män stiftades år 1987 i Finland. Enligt jämställdhetslagen
      är könen jämställda och ingen får diskrimineras på grund av kön, könsidentitet eller könsuttryck.
      Alla myndigheter, arbetsgivare och anordnare av utbildning och småbarnspedagogik är skyldiga att
      främja jämställdhet. Efterlevnaden av jämställdhetslagen övervakas i Finland av en jämställdhetsombudsman.
    sentences:
    - id: hb-c05-u0033-s001
      start: 0
      end: 73
    - id: hb-c05-u0033-s002
      start: 74
      end: 197
    - id: hb-c05-u0033-s003
      start: 198
      end: 315
    - id: hb-c05-u0033-s004
      start: 316
      end: 401
  - type: paragraph
    id: hb-c05-u0034
    text: Utöver att främja jämställdhet och förhindra diskriminering förbättrar jämställdhetslagen också
      kvinnornas ställning framför allt i arbetslivet. Enligt lagen får man till exempel inte avstå från
      att anställa en arbetstagare eller säga upp henne från arbetet om hon är gravid. När en arbetsgivare
      anställer nya arbetstagare ska valet göras utifrån arbetstagarnas meriter. En arbetstagare får inte
      väljas på grund av sitt kön. Man får inte heller till exempel betala högre lön till män bara för
      att de är män. Enligt lagen ska man betala lika lön för arbete som är att betrakta som lika eller
      likvärdigt oberoende av arbetstagarnas kön.
    sentences:
    - id: hb-c05-u0034-s001
      start: 0
      end: 144
    - id: hb-c05-u0034-s002
      start: 145
      end: 275
    - id: hb-c05-u0034-s003
      start: 276
      end: 370
    - id: hb-c05-u0034-s004
      start: 371
      end: 424
    - id: hb-c05-u0034-s005
      start: 425
      end: 507
    - id: hb-c05-u0034-s006
      start: 508
      end: 634
  - type: paragraph
    id: hb-c05-u0035
    text: 'I jämställdhetslagen betyder diskriminering att någon behandlas sämre än andra på grund av
      en orsak som beror på könet. Diskriminering kan ske på grund av:'
    sentences:
    - id: hb-c05-u0035-s001
      start: 0
      end: 119
    - id: hb-c05-u0035-s002
      start: 120
      end: 155
  - id: hb-c05-u0036
    type: list
    ordered: false
    items:
    - id: hb-c05-u0037
      text: kön
      sentences:
      - id: hb-c05-u0037-s001
        start: 0
        end: 3
    - id: hb-c05-u0038
      text: könsidentitet eller könsuttryck
      sentences:
      - id: hb-c05-u0038-s001
        start: 0
        end: 31
    - id: hb-c05-u0039
      text: en orsak som beror på graviditet eller förlossning
      sentences:
      - id: hb-c05-u0039-s001
        start: 0
        end: 50
    - id: hb-c05-u0040
      text: föräldraskap, det vill säga eftersom en person har barn eller är gravid
      sentences:
      - id: hb-c05-u0040-s001
        start: 0
        end: 71
    - id: hb-c05-u0041
      text: familjeansvar, det vill säga eftersom en person till exempel tar ut familjeledighet
      sentences:
      - id: hb-c05-u0041-s001
        start: 0
        end: 83
    - id: hb-c05-u0042
      text: någon annan omständighet som hänför sig till personens kön.
      sentences:
      - id: hb-c05-u0042-s001
        start: 0
        end: 59
  - type: paragraph
    id: hb-c05-u0043
    text: Också sexuella trakasserier eller trakasserier på grund av kön är diskriminering som är förbjuden
      enligt jämställdhetslagen.
    sentences:
    - id: hb-c05-u0043-s001
      start: 0
      end: 124
  - type: paragraph
    id: hb-c05-u0044
    text: Könsidentitet avser på vilket sätt en människa upplever sitt kön. Det är inte nödvändigtvis
      detsamma som det kön som tilldelats personen vid födseln. Könsuttryck avser hur könet lyfts fram
      med hjälp av till exempel beteende eller klädsel.
    sentences:
    - id: hb-c05-u0044-s001
      start: 0
      end: 65
    - id: hb-c05-u0044-s002
      start: 66
      end: 149
    - id: hb-c05-u0044-s003
      start: 150
      end: 238
  - type: paragraph
    id: hb-c05-u0045
    text: I Finland kan två personer av samma kön gifta sig med varandra.
    sentences:
    - id: hb-c05-u0045-s001
      start: 0
      end: 63
  - type: paragraph
    id: hb-c05-u0046
    text: I Finland är det vanligt att också kvinnor arbetar, även om de har barn. Ansvaret för att ta
      hand om barnen och hemmet hör till både kvinnan och mannen. En kvinna behöver inte sin makes eller
      sina föräldrars tillåtelse för att arbeta eller studera.
    sentences:
    - id: hb-c05-u0046-s001
      start: 0
      end: 72
    - id: hb-c05-u0046-s002
      start: 73
      end: 152
    - id: hb-c05-u0046-s003
      start: 153
      end: 248
  - type: paragraph
    id: hb-c05-u0047
    text: Kvinnor och män kan själva besluta vem de gifter sig med. Att tvinga någon till äktenskap är
      ett brott i Finland. Exempelvis föräldrarna har inte rätt att tvinga eller utöva påtryckningar på
      sitt barn att gifta sig. Både kvinnan och mannen har rätt att få skilsmässa. Man kan även få skilsmässa
      utan makens eller makans samtycke. Ingen har rätt att förhindra någon från att ta ut skilsmässa.
    sentences:
    - id: hb-c05-u0047-s001
      start: 0
      end: 57
    - id: hb-c05-u0047-s002
      start: 58
      end: 113
    - id: hb-c05-u0047-s003
      start: 114
      end: 215
    - id: hb-c05-u0047-s004
      start: 216
      end: 267
    - id: hb-c05-u0047-s005
      start: 268
      end: 329
    - id: hb-c05-u0047-s006
      start: 330
      end: 391
- id: hb-c05-likabehandling
  title: Likabehandling och diskriminering
  blocks:
  - type: paragraph
    id: hb-c05-u0048
    text: Likabehandling betyder att alla människor är lika mycket värda och att de har samma rättigheter
      oberoende av sina egenskaper. I finsk lagstiftning pratar man om likabehandling när man menar att
      alla är lika mycket värda oberoende av till exempel nationalitet, funktionsnedsättning, sexuell
      läggning eller någon annan omständighet som gäller dem som person. Syftet med diskrimineringslagen
      är att främja likabehandling och förebygga diskriminering.
    sentences:
    - id: hb-c05-u0048-s001
      start: 0
      end: 125
    - id: hb-c05-u0048-s002
      start: 126
      end: 356
    - id: hb-c05-u0048-s003
      start: 357
      end: 447
  - type: paragraph
    id: hb-c05-u0049
    text: Den nya diskrimineringslagen trädde i kraft år 2015. Syftet med lagen är att främja likabehandling
      och förebygga diskriminering. Lagen gör det också enklare att ingripa i diskriminering när sådan
      inträffar.
    sentences:
    - id: hb-c05-u0049-s001
      start: 0
      end: 52
    - id: hb-c05-u0049-s002
      start: 53
      end: 128
    - id: hb-c05-u0049-s003
      start: 129
      end: 206
  - type: paragraph
    id: hb-c05-u0050
    text: Enligt diskrimineringslagen ska alla människor i Finland ha samma möjligheter att studera, arbeta
      och ta del av tjänster. Enligt lagen ska myndigheterna främja likabehandling i all sin verksamhet.
    sentences:
    - id: hb-c05-u0050-s001
      start: 0
      end: 121
    - id: hb-c05-u0050-s002
      start: 122
      end: 196
  - type: paragraph
    id: hb-c05-u0051
    text: Lagen förbjuder diskriminering på grund av ålder, ursprung, nationalitet, språk, religion, övertygelse,
      åsikt, politisk verksamhet, fackföreningsverksamhet, familjeförhållanden, hälsotillstånd, funktionsnedsättning,
      sexuell läggning eller någon annan omständighet som gäller den enskilde som person. Ingen får hamna
      i en sämre ställning på grund av dessa orsaker. Efterlevnaden av diskrimineringslagen övervakas
      i Finland av en diskrimineringsombudsman.
    sentences:
    - id: hb-c05-u0051-s001
      start: 0
      end: 299
    - id: hb-c05-u0051-s002
      start: 300
      end: 363
    - id: hb-c05-u0051-s003
      start: 364
      end: 453
  - type: paragraph
    id: hb-c05-u0052
    text: Diskriminering betyder att en människa eller en grupp behandlas sämre än andra. Det är fråga
      om diskriminering också om en skenbart jämlik regel eller praxis i praktiken leder till att en människa
      eller en grupp försätts i en svagare ställning än andra och det inte finns någon godtagbar grund
      för regeln eller praxisen. Diskriminering kan i vissa fall vara ett brott.
    sentences:
    - id: hb-c05-u0052-s001
      start: 0
      end: 79
    - id: hb-c05-u0052-s002
      start: 80
      end: 320
    - id: hb-c05-u0052-s003
      start: 321
      end: 368
  - type: paragraph
    id: hb-c05-u0053
    text: Annorlunda behandling är ändå inte alltid diskriminering om den baserar sig på lagen eller det
      finns godtagbara skäl till den. I sådana fall pratar man om positiv särbehandling, som betyder att
      en människa eller en grupp får särskilt stöd. Positiv särbehandling kan vara till exempel integrationsutbildning
      för nyanlända eller sysselsättningsstöd för unga. Syftet med dessa är att jämna ut skillnaderna
      i fråga om människors möjligheter. Målet är att alla ska ha samma möjligheter att få utbildning,
      arbeta och delta i samhällslivet.
    sentences:
    - id: hb-c05-u0053-s001
      start: 0
      end: 126
    - id: hb-c05-u0053-s002
      start: 127
      end: 239
    - id: hb-c05-u0053-s003
      start: 240
      end: 356
    - id: hb-c05-u0053-s004
      start: 357
      end: 437
    - id: hb-c05-u0053-s005
      start: 438
      end: 533
  - type: paragraph
    id: hb-c05-u0054
    text: Diskrimineringslagen har sina rötter i Finlands grundlag och lagens syfte är att främja likabehandling
      och förbättra möjligheterna för dem som upplever diskriminering att åtgärda situationen.
    sentences:
    - id: hb-c05-u0054-s001
      start: 0
      end: 191
  - type: paragraph
    id: hb-c05-u0055
    text: 'Exempel på diskriminering:'
    sentences:
    - id: hb-c05-u0055-s001
      start: 0
      end: 26
  - id: hb-c05-u0056
    type: list
    ordered: false
    items:
    - id: hb-c05-u0057
      text: hyresvärden kräver att hyresgästen har finskt medborgarskap
      sentences:
      - id: hb-c05-u0057-s001
        start: 0
        end: 59
    - id: hb-c05-u0058
      text: arbetsgivaren kräver perfekta kunskaper i finska, även om detta inte behövs i arbetet.
      sentences:
      - id: hb-c05-u0058-s001
        start: 0
        end: 86
  - type: paragraph
    id: hb-c05-u0059
    text: Om jämlikhet och jämställdhet föreskrivs i diskrimineringslagen (yhdenvertaisuuslaki), lagen
      om jämställdhet mellan kvinnor och män (tasa-arvolaki) och i arbetsavtalslagen (työsopimuslaki).
      Enligt dessa ska anställda behandlas lika när det gäller anställning, arbetsförhållanden, anställningsvillkor,
      utbildning för personalen och avancemang i karriären. I Finland måste alla arbetsgivare främja jämlikhet
      och jämställdhet. Om det finns 30 eller fler arbetstagare på en arbetsplats, ska arbetsgivaren utarbeta
      en skriftlig jämställdhetsplan (tasa-arvosuunnitelma) och likabehandlingsplan (yhdenvertaisuussuunnitelma).
    sentences:
    - id: hb-c05-u0059-s001
      start: 0
      end: 189
    - id: hb-c05-u0059-s002
      start: 190
      end: 354
    - id: hb-c05-u0059-s003
      start: 355
      end: 423
    - id: hb-c05-u0059-s004
      start: 424
      end: 617
  - type: paragraph
    id: hb-c05-u0060
    text: Diskrimineringslagen förutsätter att alla arbetssökande behandlas lika. Arbetsgivaren måste
      välja den sökande som har de bästa meriterna för uppgiften. Arbetsgivaren ska också kunna bevisa
      att det finns godtagbara grunder för valet som anknyter till arbetets karaktär och att valet inte
      har varit diskriminerande. Man får inte kräva sådana egenskaper av arbetssökanden som inte är nödvändiga
      för att utföra arbetet. Arbetsgivaren får till exempel inte kräva att du ska behärska finska språket
      fullständigt om det inte är nödvändigt i arbetet.
    sentences:
    - id: hb-c05-u0060-s001
      start: 0
      end: 71
    - id: hb-c05-u0060-s002
      start: 72
      end: 151
    - id: hb-c05-u0060-s003
      start: 152
      end: 313
    - id: hb-c05-u0060-s004
      start: 314
      end: 415
    - id: hb-c05-u0060-s005
      start: 416
      end: 542
  - type: paragraph
    id: hb-c05-u0061
    text: Du har rätt till samma lagstadgade anställningsvillkor som en finsk arbetstagare.
    sentences:
    - id: hb-c05-u0061-s001
      start: 0
      end: 81
  - type: paragraph
    id: hb-c05-u0062
    text: Arbetsgivaren får inte diskriminera dig vid beslut om fördelning av arbetsuppgifter, möjligheter
      till avancemang eller upphävande av anställningen. Dessutom måste arbetsgivaren se till att du,
      om du har ett annat modersmål än finska eller svenska, får information om de viktigaste villkoren
      för anställningsförhållandet samt vägledning i dina arbetsuppgifter på ett språk som du förstår.
    sentences:
    - id: hb-c05-u0062-s001
      start: 0
      end: 147
    - id: hb-c05-u0062-s002
      start: 148
      end: 387
  - type: paragraph
    id: hb-c05-u0063
    text: Vilken lag som är tillämplig på internationella anställningsförhållanden beror på situationen.
      Det är fråga om ett internationellt anställningsförhållande när till exempel arbetsgivarens och
      arbetstagarens hemorter är belägna på olika staters territorium.
    sentences:
    - id: hb-c05-u0063-s001
      start: 0
      end: 94
    - id: hb-c05-u0063-s002
      start: 95
      end: 255
  - type: paragraph
    id: hb-c05-u0064
    text: Alla ska behandlas lika i samband med anställning och i fråga om arbetsförhållandena och lönesättningen,
      oavsett kön. En arbetstagare får inte särbehandlas i arbetslivet på grund av graviditet eller föräldraskap.
      Arbetstagaren har inte heller rätt att vägra arbetsuppgifter på grund av sitt kön.
    sentences:
    - id: hb-c05-u0064-s001
      start: 0
      end: 117
    - id: hb-c05-u0064-s002
      start: 118
      end: 212
    - id: hb-c05-u0064-s003
      start: 213
      end: 295
  - type: paragraph
    id: hb-c05-u0065
    text: Referenser – du kan lägga till namnen på personer som har lovat att rekommendera dig till arbetsuppgiften.
      Lägg till kontaktuppgifterna till dem. Kom ihåg att be personen om tillstånd för detta. Intervjuaren
      kan inte kontakta dina referenser utan ditt medgivande.
    sentences:
    - id: hb-c05-u0065-s001
      start: 0
      end: 106
    - id: hb-c05-u0065-s002
      start: 107
      end: 145
    - id: hb-c05-u0065-s003
      start: 146
      end: 194
    - id: hb-c05-u0065-s004
      start: 195
      end: 263
  - type: paragraph
    id: hb-c05-u0066
    text: Arbetsgivaren får inte fråga om din familj eller religion eller om du är politiskt aktiv.
    sentences:
    - id: hb-c05-u0066-s001
      start: 0
      end: 89
- id: hb-c05-rasism
  title: Rasism och hatbrott
  blocks:
  - type: paragraph
    id: hb-c05-u0067
    text: Vid ett hatbrott blir en människa, en grupp, en egendom, en institution eller en representant
      för dessa utsatt för ett brott på grund av en omständighet som förknippas med dem. Omständigheten
      kan vara till exempel etniskt ursprung, könsidentitet eller funktionsnedsättning. Motivet till hatbrottet
      är ofta en fördom eller hat mot en viss människogrupp.
    sentences:
    - id: hb-c05-u0067-s001
      start: 0
      end: 176
    - id: hb-c05-u0067-s002
      start: 177
      end: 273
    - id: hb-c05-u0067-s003
      start: 274
      end: 352
  - type: paragraph
    id: hb-c05-u0068
    text: Vilket brott som helst kan vara ett hatbrott. Det väsentliga är av vilken orsak brottet har
      begåtts. Ett hatbrott kan alltså vara till exempel misshandel, ärekränkning eller skadegörelse.
      Till exempel om någon krossar fönstren på en bil för att bilens ägare hör till en annan religion
      än skadegöraren, är det fråga om ett hatbrott. Egendomen behöver inte vara verklig, utan skadegörarens
      antagande om ett offer räcker. Om ett brott är ett hatbrott kan man få ett strängare straff än annars
      för samma brott.
    sentences:
    - id: hb-c05-u0068-s001
      start: 0
      end: 45
    - id: hb-c05-u0068-s002
      start: 46
      end: 100
    - id: hb-c05-u0068-s003
      start: 101
      end: 187
    - id: hb-c05-u0068-s004
      start: 188
      end: 331
    - id: hb-c05-u0068-s005
      start: 332
      end: 418
    - id: hb-c05-u0068-s006
      start: 419
      end: 506
  - type: paragraph
    id: hb-c05-u0069
    text: Rasism är en tankemodell där människogrupper definieras som mindre värda på basis av till exempel
      ursprung, hudfärg, nationalitet, modersmål eller religion. Rasistiska attityder kan ta sig uttryck
      i medvetna handlingar och ord, men de kan också vara omedvetna tankemodeller som styr beteendet.
      Rasism definieras på olika sätt i olika sammanhang.
    sentences:
    - id: hb-c05-u0069-s001
      start: 0
      end: 156
    - id: hb-c05-u0069-s002
      start: 157
      end: 293
    - id: hb-c05-u0069-s003
      start: 294
      end: 345
  - type: paragraph
    id: hb-c05-u0070
    text: Strukturell rasism är rasism som uppstår i samhällets och olika institutioners praxis, strukturer
      och regler. Den kan förekomma till exempel i arbetslivet och inom utbildning och tjänster. Strukturell
      rasism kan synas i form av diskriminerande handlingar, men också som tillvägagångssätt och processer
      som antingen direkt eller indirekt diskriminerar vissa människogrupper. Strukturell rasism kan visa
      sig också i till exempel vitsar eller reklaminslag. Ofta är det inte lätt att identifiera strukturell
      rasism, utan den kan vara omedveten. Det är inte alltid fråga om enskilda handlingar, utan om ett
      större fenomen som berör hela samhället.
    sentences:
    - id: hb-c05-u0070-s001
      start: 0
      end: 109
    - id: hb-c05-u0070-s002
      start: 110
      end: 188
    - id: hb-c05-u0070-s003
      start: 189
      end: 373
    - id: hb-c05-u0070-s004
      start: 374
      end: 453
    - id: hb-c05-u0070-s005
      start: 454
      end: 540
    - id: hb-c05-u0070-s006
      start: 541
      end: 642
  - type: paragraph
    id: hb-c05-u0071
    text: Rasism som dyker upp i interaktion kan visa sig i form av till exempel rop, öknamn, gester,
      utestängning, användning av rasistiska begrepp eller uttryck, eller mikroaggressioner. Mikroaggressioner
      är till exempel frågor eller kommentarer om utseende eller beteende som kan vara oavsiktliga och
      välmenande, men som ändå stärker och upprätthåller rasistiska eller diskriminerande stereotyper.
      De upprätthåller idén om att en person avviker från normen, det vill säga från hurdan en person
      som befinner sig i en viss ställning eller som talar ett visst språk förväntas vara.
    sentences:
    - id: hb-c05-u0071-s001
      start: 0
      end: 178
    - id: hb-c05-u0071-s002
      start: 179
      end: 390
    - id: hb-c05-u0071-s003
      start: 391
      end: 571
  - type: paragraph
    id: hb-c05-u0072
    text: Upprepad rasism som förekommer i interaktion och mikroaggressioner kan ge upphov till minoritetsstress.
      Den uppkommer till följd av upplevelser av diskriminering och rasism eller en rädsla för att sådana
      ska upprepas i olika situationer. Minoritetsstress försämrar människans välbefinnande. Den kan också
      leda till internaliserad rasism, det vill säga till att den som upplever rasism själv börjar tro
      att hen är på något sätt sämre än andra. Den kan påverka självkänslan och uppfattningen om den egna
      förmågan på ett negativt sätt. Internaliserad rasism uppkommer ofta till följd av att omgivningen
      inte ingriper i rasistiska situationer, utan tigande verkar acceptera rasismen.
    sentences:
    - id: hb-c05-u0072-s001
      start: 0
      end: 103
    - id: hb-c05-u0072-s002
      start: 104
      end: 237
    - id: hb-c05-u0072-s003
      start: 238
      end: 290
    - id: hb-c05-u0072-s004
      start: 291
      end: 442
    - id: hb-c05-u0072-s005
      start: 443
      end: 532
    - id: hb-c05-u0072-s006
      start: 533
      end: 679
  - type: paragraph
    id: hb-c05-u0073
    text: Rasism är alltid fel, även om den inte skulle uppfylla kännetecknen för diskriminering eller
      brott. Man kan ta upp beteende eller praxis som skapar ojämlikhet till exempel på arbetsplatsen
      med chefen, på läroanstalten med en lärare eller inom myndighetstjänster med myndigheten i fråga.
      Olika organisationer erbjuder också stödtjänster eller kamratstöd för personer som upplevt rasism.
    sentences:
    - id: hb-c05-u0073-s001
      start: 0
      end: 99
    - id: hb-c05-u0073-s002
      start: 100
      end: 286
    - id: hb-c05-u0073-s003
      start: 287
      end: 385
  - type: paragraph
    id: hb-c05-u0074
    text: Om du blir utsatt för ett rasistiskt brott, ska du anmäla ärendet till polisen. Be att polisen
      beaktar gärningsmannens rasistiska motiv.
    sentences:
    - id: hb-c05-u0074-s001
      start: 0
      end: 79
    - id: hb-c05-u0074-s002
      start: 80
      end: 136
- id: hb-c05-hjalp
  title: Hjälp vid diskriminering
  blocks:
  - type: paragraph
    id: hb-c05-u0075
    text: Om man upplever, misstänker eller blir vittne till diskriminering kan man kontakta jämställdhetsombudsmannen
      eller diskrimineringsombudsmannen, beroende på orsaken till diskrimineringen.
    sentences:
    - id: hb-c05-u0075-s001
      start: 0
      end: 186
  - type: paragraph
    id: hb-c05-u0076
    text: Om man anser att det har skett ett fel eller en försummelse inom till exempel familje- och socialtjänster,
      hälsovården, skolans eller någon annan myndighets verksamhet kan man kontakta Regionförvaltningsverket.
    sentences:
    - id: hb-c05-u0076-s001
      start: 0
      end: 210
  - type: paragraph
    id: hb-c05-u0077
    text: Om du blir utsatt för eller bevittnar diskriminering någonstans, kan du kontakta diskrimineringsombudsmannen
      (yhdenvertaisuusvaltuutettu). Du kan även polisanmäla diskriminering. Du kan kontakta diskrimineringsombudsmannen
      även på en annan persons eller på någon grupps vägnar.
    sentences:
    - id: hb-c05-u0077-s001
      start: 0
      end: 138
    - id: hb-c05-u0077-s002
      start: 139
      end: 178
    - id: hb-c05-u0077-s003
      start: 179
      end: 277
  - type: paragraph
    id: hb-c05-u0078
    text: Diskrimineringsombudsmannen är en självständig och oberoende myndighet, vars uppgift är att
      främja likabehandling och ingripa i diskriminering. Diskrimineringsombudsmannen kan ge anvisningar,
      råd och rekommendationer samt hjälpa med att åstadkomma en förlikning i diskrimineringsfall. Ombudsmannen
      kan även vid behov be den som misstänks för diskriminering om en redogörelse för händelsen. Dessutom
      kan diskrimineringsombudsmannen föra eller hjälpa med att föra ärendet till Diskriminerings- och
      jämställdhetsnämnden eller till domstol.
    sentences:
    - id: hb-c05-u0078-s001
      start: 0
      end: 143
    - id: hb-c05-u0078-s002
      start: 144
      end: 284
    - id: hb-c05-u0078-s003
      start: 285
      end: 389
    - id: hb-c05-u0078-s004
      start: 390
      end: 536
  - type: paragraph
    id: hb-c05-u0079
    text: Arbetsdiskriminering är ett brott. Om du misstänker att du blivit utsatt för arbetsdiskriminering
      kan du kontakta arbetarskyddsmyndigheterna (työsuojeluviranomaiset), diskrimineringsombudsmannen
      (yhdenvertaisuusvaltuutettu) eller ditt fackförbund.
    sentences:
    - id: hb-c05-u0079-s001
      start: 0
      end: 34
    - id: hb-c05-u0079-s002
      start: 35
      end: 247
  - type: paragraph
    id: hb-c05-u0080
    text: Vid problem kan du fråga om råd hos arbetarskyddsfullmäktige (työsuojeluvaltuutettu) eller den
      förtroendevalda (luottamusmies) på din arbetsplats. Arbetarskyddsfullmäktige övervakar de anställdas
      säkerhet. Den förtroendevalda övervakar att arbetsgivaren följer arbetslagstiftningen och kollektivavtalet
      på arbetsplatsen. Den förtroendevalda ger råd och kan vid behov också reda ut eventuella meningsskiljaktigheter.
    sentences:
    - id: hb-c05-u0080-s001
      start: 0
      end: 146
    - id: hb-c05-u0080-s002
      start: 147
      end: 205
    - id: hb-c05-u0080-s003
      start: 206
      end: 320
    - id: hb-c05-u0080-s004
      start: 321
      end: 415
  - type: paragraph
    id: hb-c05-u0081
    text: I Finland finns en lag om jämställdhet mellan kvinnor och män, som föreskriver att arbetsgivaren
      ska övervaka att jämställdhet uppnås på arbetsplatsen och att ingen diskrimineras på arbetsplatsen.
      Jämställdhetsombudsmannen (tasa-arvovaltuutettu) övervakar att lagen om jämställdhet mellan kvinnor
      och män följs. Om du misstänker att din arbetsgivare har diskriminerat dig på grund av ditt kön
      kan du be jämställdhetsombudsmannen om anvisningar och råd samt hjälp med att reda ut saken.
    sentences:
    - id: hb-c05-u0081-s001
      start: 0
      end: 196
    - id: hb-c05-u0081-s002
      start: 197
      end: 311
    - id: hb-c05-u0081-s003
      start: 312
      end: 485
- id: hb-c05-sprak
  title: Språkliga minoriteter och urfolk
  blocks:
  - type: paragraph
    id: hb-c05-u0082
    text: I Finland finns det två nationalspråk, finska och svenska. Omkring 85 procent av finländarna
      hade år 2023 finska som modersmål. De svenskspråkiga i Finland utgjorde omkring fem procent av befolkningen.
      Enligt grundlagen har den finskspråkiga och den svenskspråkiga befolkningen lika rättigheter till
      kultur- och samhällstjänster på sitt eget språk. Det finns många olika dialekter av svenska och
      finska. På olika håll i Finland talar man alltså finska och svenska på lite olika sätt.
    sentences:
    - id: hb-c05-u0082-s001
      start: 0
      end: 58
    - id: hb-c05-u0082-s002
      start: 59
      end: 127
    - id: hb-c05-u0082-s003
      start: 128
      end: 201
    - id: hb-c05-u0082-s004
      start: 202
      end: 348
    - id: hb-c05-u0082-s005
      start: 349
      end: 403
    - id: hb-c05-u0082-s006
      start: 404
      end: 483
  - type: paragraph
    id: hb-c05-u0083
    text: Andra språk som använts länge i Finland är de samiska språken, den finländska romanin, karelska
      språket och teckenspråken. De samiska språken är de språk som talas av ursprungsbefolkningen i Lappland,
      och de är officiella språk inom samernas hembygdsområde. I Finland talas många olika språk. Några
      vanliga språk är ryska, estniska, engelska, somaliska och arabiska.
    sentences:
    - id: hb-c05-u0083-s001
      start: 0
      end: 122
    - id: hb-c05-u0083-s002
      start: 123
      end: 257
    - id: hb-c05-u0083-s003
      start: 258
      end: 292
    - id: hb-c05-u0083-s004
      start: 293
      end: 366
  - type: paragraph
    id: hb-c05-u0084
    text: Det finns också många olika minoriteter i Finland. En del minoriteter har ett gemensamt språk,
      medan andra förenas av sin kultur, sin religion eller sitt etniska ursprung. Enligt Finlands grundlag
      har alla minoriteter i Finland rätt att bevara och utveckla sitt eget språk och sin egen kultur.
    sentences:
    - id: hb-c05-u0084-s001
      start: 0
      end: 50
    - id: hb-c05-u0084-s002
      start: 51
      end: 171
    - id: hb-c05-u0084-s003
      start: 172
      end: 293
  - type: paragraph
    id: hb-c05-u0085
    text: Samerna är den enda erkända ursprungsbefolkningen inom Europeiska unionen. Ursprungsbefolkning
      avser en människogrupp med starka rötter i de områden som den traditionellt har befolkat och i naturen.
      Gruppen har sina egna språk, seder och traditioner. Som ursprungsbefolkning har samerna rätt att
      bevara och utveckla sitt språk och sin kultur samt de traditionella näringar som hör till den i
      Finland. Samernas traditionella näringar är renskötsel, fiske och jakt, samlande och hantverk. Numera
      bor största delen av samerna i städer och arbetar inom samma branscher som övriga invånare i Finland.
      År 2023 bodde det omkring 10 000 samer i Finland.
    sentences:
    - id: hb-c05-u0085-s001
      start: 0
      end: 74
    - id: hb-c05-u0085-s002
      start: 75
      end: 198
    - id: hb-c05-u0085-s003
      start: 199
      end: 250
    - id: hb-c05-u0085-s004
      start: 251
      end: 400
    - id: hb-c05-u0085-s005
      start: 401
      end: 486
    - id: hb-c05-u0085-s006
      start: 487
      end: 595
    - id: hb-c05-u0085-s007
      start: 596
      end: 645
  - type: paragraph
    id: hb-c05-u0086
    text: 'Förutom i Finland finns det samer i Sverige, Norge och Ryssland. De talar flera olika samiska
      språk, varav tre används i Finland: nordsamiska, skoltsamiska och enaresamiska. Dagens samer är
      i huvudsak kristna, varav största delen hör till den evangelisk-lutherska kyrkan. Skolterna har
      traditionellt varit ortodoxa.'
    sentences:
    - id: hb-c05-u0086-s001
      start: 0
      end: 64
    - id: hb-c05-u0086-s002
      start: 65
      end: 173
    - id: hb-c05-u0086-s003
      start: 174
      end: 271
    - id: hb-c05-u0086-s004
      start: 272
      end: 315
  - type: paragraph
    id: hb-c05-u0087
    text: Samerna har självstyre i fråga om sitt språk och sin kultur i det samiska området, som omfattar
      vissa kommuner eller delar av kommuner i nordligaste Lappland. Över hälften av Finlands samer bor
      utanför det samiska området.
    sentences:
    - id: hb-c05-u0087-s001
      start: 0
      end: 158
    - id: hb-c05-u0087-s002
      start: 159
      end: 222
  - type: paragraph
    id: hb-c05-u0088
    text: Sametinget är samernas representativa självstyrelseorgan i Finland. Sametingets viktigaste uppgift
      är att verkställa det självstyre i fråga om språket och kulturen som tryggas för det i grundlagen
      och att säkerställa att samernas ursprungskultur bevaras och utvecklas. Enligt lag ska Finlands
      myndigheter förhandla med sametinget om alla åtgärder som kan inverka på samernas ställning.
    sentences:
    - id: hb-c05-u0088-s001
      start: 0
      end: 67
    - id: hb-c05-u0088-s002
      start: 68
      end: 268
    - id: hb-c05-u0088-s003
      start: 269
      end: 385
  - type: paragraph
    id: hb-c05-u0089
    text: Samernas kulturella och språkliga rättigheter rättigheter som gäller markägande har i det förflutna
      inte respekterats, och detta har orsakat samerna mycket lidande. Kampen för ett bättre förverkligande
      av rättigheterna fortsätter ännu i dag.
    sentences:
    - id: hb-c05-u0089-s001
      start: 0
      end: 164
    - id: hb-c05-u0089-s002
      start: 165
      end: 241
  - type: paragraph
    id: hb-c05-u0090
    text: De finska romernas modersmål är vanligtvis finska, men omkring en tredjedel av dem har åtminstone
      nöjaktiga muntliga kunskaper i romani. Barnen kan få undervisning i romani i skolan. Språket är
      släkt med sanskrit och hindi. Romerna i Finland är kristna och hör vanligtvis till den evangelisk-lutherska
      kyrkan eller till en pingstförsamling.
    sentences:
    - id: hb-c05-u0090-s001
      start: 0
      end: 136
    - id: hb-c05-u0090-s002
      start: 137
      end: 182
    - id: hb-c05-u0090-s003
      start: 183
      end: 223
    - id: hb-c05-u0090-s004
      start: 224
      end: 340
  - type: paragraph
    id: hb-c05-u0091
    text: Romerna har mött mycket trakasserier och fördomar i Finland till exempel i skolan och arbetslivet
      samt när det gäller boende. Romernas ställning som en historisk språklig och kulturell minoritet
      i Finland har gradvis förbättrats.
    sentences:
    - id: hb-c05-u0091-s001
      start: 0
      end: 125
    - id: hb-c05-u0091-s002
      start: 126
      end: 229
  - type: paragraph
    id: hb-c05-u0092
    text: I Finland betraktas teckenspråkiga personer som en språklig minoritet. I Finland används två
      nationella teckenspråk, det finska och det finlandssvenska teckenspråket. Teckenspråkiga personer
      kan vara döva, hörande eller ha nedsatt hörsel. Uppskattningsvis 5 500 personer använder det finska
      teckenspråket som modersmål. Om en teckenspråkig person behöver en tolk när hen ska uträtta olika
      ärenden, har hen en lagstadgad rätt att få kostnadsfri tolkning.
    sentences:
    - id: hb-c05-u0092-s001
      start: 0
      end: 70
    - id: hb-c05-u0092-s002
      start: 71
      end: 166
    - id: hb-c05-u0092-s003
      start: 167
      end: 238
    - id: hb-c05-u0092-s004
      start: 239
      end: 319
    - id: hb-c05-u0092-s005
      start: 320
      end: 453
  - type: paragraph
    id: hb-c05-u0093
    text: Ett av de stora skärgårdsområdena är Åland. Åland har självstyre, men är en del av Finland.
      Ålands huvudstad är Mariehamn. Viktiga näringar i skärgården är sjöfart och turism. Det enda officiella
      språket på Åland är svenska, och i övrigt är skärgården också delvis ett svenskspråkigt område.
    sentences:
    - id: hb-c05-u0093-s001
      start: 0
      end: 43
    - id: hb-c05-u0093-s002
      start: 44
      end: 91
    - id: hb-c05-u0093-s003
      start: 92
      end: 122
    - id: hb-c05-u0093-s004
      start: 123
      end: 175
    - id: hb-c05-u0093-s005
      start: 176
      end: 291
- id: hb-c05-delaktighet
  title: Rättigheter för personer med funktionsnedsättning
  blocks:
  - type: paragraph
    id: hb-c05-u0094
    text: 'Tillgänglighet: Beaktande av alla slags människor vid till exempel planering av den fysiska
      miljön. Tillgängliga byggnader och tillgänglig kollektivtrafik gör det möjligt för personer med
      funktionsnedsättning att arbeta, studera och delta i hobbyer.'
    sentences:
    - id: hb-c05-u0094-s001
      start: 0
      end: 99
    - id: hb-c05-u0094-s002
      start: 100
      end: 249
  - type: paragraph
    id: hb-c05-u0095
    text: 'Digital tillgänglighet: Webbplatser, information och tjänster ska vara lämpliga och tillgängliga
      för alla människor oberoende av deras funktionsförmåga.'
    sentences:
    - id: hb-c05-u0095-s001
      start: 0
      end: 152
  - type: paragraph
    id: hb-c05-u0096
    text: I Finland har personer med funktionsnedsättning samma rättigheter som alla andra. De har rätt
      att delta i samhället och beslutsfattande som rör dem på ett jämlikt sätt med övriga invånare. De
      har enligt lagen rätt också till tjänster som stöder funktionsförmågan, såsom mobilitetstjänster,
      assistans- och tolkningstjänster och olika hjälpmedel. Det är samhällets uppgift att säkerställa
      att det är möjligt för personer med funktionsnedsättning att delta i all verksamhet i samhället.
    sentences:
    - id: hb-c05-u0096-s001
      start: 0
      end: 81
    - id: hb-c05-u0096-s002
      start: 82
      end: 188
    - id: hb-c05-u0096-s003
      start: 189
      end: 344
    - id: hb-c05-u0096-s004
      start: 345
      end: 483
  - type: paragraph
    id: hb-c05-u0097
    text: En person med funktionsnedsättning har en fysisk, intellektuell eller sensorisk funktionsnedsättning
      som kan göra det svårare för hen att delta i samhället fullt ut och på ett jämlikt sätt. En person
      med utvecklingsstörning kan till exempel ha svårt att lära sig och förstå. En person med rörelsenedsättning
      har en funktionsnedsättning som påverkar rörligheten. En synskadad i sin tur har en funktionsnedsättning
      som påverkar synen och en hörselskadad en funktionsnedsättning som påverkar hörseln.
    sentences:
    - id: hb-c05-u0097-s001
      start: 0
      end: 189
    - id: hb-c05-u0097-s002
      start: 190
      end: 274
    - id: hb-c05-u0097-s003
      start: 275
      end: 361
    - id: hb-c05-u0097-s004
      start: 362
      end: 497
  - type: paragraph
    id: hb-c05-u0098
    text: Funktionsnedsättningar kan vara av olika grad från lindriga till svåra. En funktionsnedsättning
      kan vara medfödd eller bero på till exempel ett olycksfall eller en olycka. Den kan också vara en
      följd av en långvarig sjukdom, som påverkar hur personen klarar sig i vardagen.
    sentences:
    - id: hb-c05-u0098-s001
      start: 0
      end: 71
    - id: hb-c05-u0098-s002
      start: 72
      end: 171
    - id: hb-c05-u0098-s003
      start: 172
      end: 273
  - type: paragraph
    id: hb-c05-u0099
    text: Funktionsförmågan hos en person med funktionsnedsättning motsvarar på ett eller annat sätt inte
      vad som har definierats som normen i samhället. Personen kan inte alltid delta fullt ut i samhället
      i arbetslivet, inom studier eller på fritiden. Hen kanske behöver hjälpmedel eller annan sorts stöd
      för att sköta sina angelägenheter. Funktionsnedsättningen existerar därmed i förhållande till samhällets
      förväntningar.
    sentences:
    - id: hb-c05-u0099-s001
      start: 0
      end: 143
    - id: hb-c05-u0099-s002
      start: 144
      end: 242
    - id: hb-c05-u0099-s003
      start: 243
      end: 330
    - id: hb-c05-u0099-s004
      start: 331
      end: 415
  - type: paragraph
    id: hb-c05-u0100
    text: Delaktigheten för personer med funktionsnedsättning uppfylls inte alltid i Finland, trots att
      man arbetar för det inom lagstiftningen, statsförvaltningen och olika organisationer. Hinder för
      en jämlik delaktighet är till exempel
    sentences:
    - id: hb-c05-u0100-s001
      start: 0
      end: 179
    - id: hb-c05-u0100-s002
      start: 180
      end: 228
  - id: hb-c05-u0101
    type: list
    ordered: false
    items:
    - id: hb-c05-u0102
      text: kollektivtrafiken, som kan vara svår att använda för personer med rörelsenedsättning, eller
        syn- eller hörselskadade
      sentences:
      - id: hb-c05-u0102-s001
        start: 0
        end: 116
    - id: hb-c05-u0103
      text: arbetsplatser, hobbylokaler, utomhusområden eller lokaler med anknytning till studier som
        personer med funktionsnedsättning har svårt att ta sig till eller använda, eller som det inte
        är säkert för dem att röra sig i
      sentences:
      - id: hb-c05-u0103-s001
        start: 0
        end: 216
    - id: hb-c05-u0104
      text: information som inte finns i en tillgänglig form och som kan vara svår att hitta, läsa eller
        förstå
      sentences:
      - id: hb-c05-u0104-s001
        start: 0
        end: 99
    - id: hb-c05-u0105
      text: tjänster eller produkter som är svåra att använda
      sentences:
      - id: hb-c05-u0105-s001
        start: 0
        end: 49
    - id: hb-c05-u0106
      text: diskriminering till exempel inom tjänster eller vid arbetssökning.
      sentences:
      - id: hb-c05-u0106-s001
        start: 0
        end: 66
  - type: paragraph
    id: hb-c05-u0107
    text: En jämlik delaktighet för personer med funktionsnedsättning främjas i Finland genom till exempel
      lagen om funktionshinderservice, säkerställande av tillgänglighet, stöd för kommunikation och beslutsfattande
      och positiv särbehandling. Med positiv särbehandling avses särskilda åtgärder för att förbättra
      ställningen och förhållandena för personer med funktionsnedsättning inom till exempel utbildning,
      antagning av studerande eller rekrytering.
    sentences:
    - id: hb-c05-u0107-s001
      start: 0
      end: 233
    - id: hb-c05-u0107-s002
      start: 234
      end: 443
  - type: paragraph
    id: hb-c05-u0108
    text: Finland har förbundit sig att följa FN:s konvention om rättigheter för personer med funktionsnedsättning,
      som är ett rättsligt bindande internationellt avtal. Det mest centrala i avtalet är jämlikheten
      för personer med funktionsnedsättning med den övriga befolkningen och deras möjlighet att delta
      i all verksamhet i samhället.
    sentences:
    - id: hb-c05-u0108-s001
      start: 0
      end: 158
    - id: hb-c05-u0108-s002
      start: 159
      end: 327
  - type: paragraph
    id: hb-c05-u0109
    text: I FN:s konvention om rättigheter för personer med funktionsnedsättning ökas medvetenheten om
      rättigheterna för personer med funktionsnedsättning och fastställs till exempel att
    sentences:
    - id: hb-c05-u0109-s001
      start: 0
      end: 176
  - id: hb-c05-u0110
    type: list
    ordered: false
    items:
    - id: hb-c05-u0111
      text: diskriminering på grund av funktionsnedsättning är förbjuden
      sentences:
      - id: hb-c05-u0111-s001
        start: 0
        end: 60
    - id: hb-c05-u0112
      text: personer med funktionsnedsättning har rätt att uttrycka sig själva och delta i det samhälleliga
        och politiska livet, till exempel genom att rösta och organisera sig politiskt
      sentences:
      - id: hb-c05-u0112-s001
        start: 0
        end: 174
    - id: hb-c05-u0113
      text: personer med funktionsnedsättning har rätt till de stödtjänster och hjälpmedel de behöver
      sentences:
      - id: hb-c05-u0113-s001
        start: 0
        end: 89
    - id: hb-c05-u0114
      text: personer med funktionsnedsättning har rätt att få utbildning och en möjlighet att delta i
        arbetslivet på ett jämlikt sätt utan diskriminering
      sentences:
      - id: hb-c05-u0114-s001
        start: 0
        end: 141
    - id: hb-c05-u0115
      text: personer med funktionsnedsättning har rätt till så självständig personlig mobilitet som möjligt
      sentences:
      - id: hb-c05-u0115-s001
        start: 0
        end: 95
    - id: hb-c05-u0116
      text: personer med funktionsnedsättning ska inkluderas i planeringen och beslutsfattandet i alla
        frågor som rör dem.
      sentences:
      - id: hb-c05-u0116-s001
        start: 0
        end: 110
  - type: paragraph
    id: hb-c05-u0117
    text: En studerande med funktionsnedsättning kan få stöd, hjälp och rimliga anpassningar för studierna.
      En gravt handikappad studerande kan till exempel ha rätt till en personlig assistent, som hjälper
      hen att röra sig på läroanstalten, i matsalen eller med att göra anteckningar. Hörselskadade samt
      syn- och hörselskadade studerande har rätt till teckenspråkig tolkning.
    sentences:
    - id: hb-c05-u0117-s001
      start: 0
      end: 97
    - id: hb-c05-u0117-s002
      start: 98
      end: 274
    - id: hb-c05-u0117-s003
      start: 275
      end: 365
  - type: paragraph
    id: hb-c05-u0118
    text: På arbetsplatserna ska arbetsgivarna vid behov göra anpassningsarrangemang för arbetstagare
      med funktionsnedsättning. Rimliga anpassningar betyder att man skaffar hjälpmedel till arbetsplatsen
      eller att arbetsuppgifterna och arbetstiderna omorganiseras. Till exempel med en partiellt arbetsför
      person kan man komma överens om deltidsarbete eller andra arrangemang. En person är partiellt arbetsför
      om hen har tillgång till endast en del av sin arbetsförmåga på grund av en sjukdom eller en funktionsnedsättning
      och vill delta i arbetslivet.
    sentences:
    - id: hb-c05-u0118-s001
      start: 0
      end: 117
    - id: hb-c05-u0118-s002
      start: 118
      end: 253
    - id: hb-c05-u0118-s003
      start: 254
      end: 364
    - id: hb-c05-u0118-s004
      start: 365
      end: 540
  - type: paragraph
    id: hb-c05-u0119
    text: Arbetsutrymmena kan ändras om så att arbetstagare med funktionsnedsättning kan både röra sig
      i dem obehindrat och arbeta i dem utan problem. Dessutom kan man göra anpassningar för att säkerställa
      att arbetstagaren får nödvändig information i tillgängligt format i arbetet. Arbetsgivaren kan få
      ekonomiskt stöd för lönekostnaderna för en partiellt arbetsför eller handikappad arbetstagare eller
      för att ordna arbetsförhållandena.
    sentences:
    - id: hb-c05-u0119-s001
      start: 0
      end: 140
    - id: hb-c05-u0119-s002
      start: 141
      end: 272
    - id: hb-c05-u0119-s003
      start: 273
      end: 428
  - type: paragraph
    id: hb-c05-u0120
    text: När arbetsgivaren fattar beslut om vem som ska anställas får beslutet inte påverkas av att en
      person med funktionsnedsättning behöver anpassningar för att kunna arbeta på arbetsplatsen. Om arbetsgivaren
      trots begäran inte gör anpassningar, ska arbetstagaren få en skriftlig motivering om det. Arbetstagaren
      kan också kontakta arbetarskyddsmyndigheten om man inte går framåt i frågan på arbetsplatsen.
    sentences:
    - id: hb-c05-u0120-s001
      start: 0
      end: 185
    - id: hb-c05-u0120-s002
      start: 186
      end: 292
    - id: hb-c05-u0120-s003
      start: 293
      end: 400
- id: hb-c05-barn
  title: Barns rättigheter
  blocks:
  - type: paragraph
    id: hb-c05-u0121
    text: Alla barn under 18 år har också en eller två vårdnadshavare. Vårdnadshavarna är i allmänhet
      barnets föräldrar. Ibland kan vårdnadshavaren vara någon annan. Vårdnadshavaren beslutar om barnets
      omsorg, uppfostran, boendeort och andra viktiga frågor. Enligt finsk lag måste man ändå lyssna på
      barnets önskemål i frågor som rör hen. Barnet ska ha en trygg livsmiljö och positiva och nära relationer
      till andra människor. Vårdnadshavaren är skyldig att se till barnets välbefinnande och harmoniska
      utveckling.
    sentences:
    - id: hb-c05-u0121-s001
      start: 0
      end: 60
    - id: hb-c05-u0121-s002
      start: 61
      end: 110
    - id: hb-c05-u0121-s003
      start: 111
      end: 155
    - id: hb-c05-u0121-s004
      start: 156
      end: 247
    - id: hb-c05-u0121-s005
      start: 248
      end: 328
    - id: hb-c05-u0121-s006
      start: 329
      end: 416
    - id: hb-c05-u0121-s007
      start: 417
      end: 504
  - type: paragraph
    id: hb-c05-u0122
    text: Förenta nationernas (FN:s) barnkonvention är ett internationellt avtal där länderna tillsammans
      har kommit överens om alla rättigheter som gäller barn. Nästan alla världens länder har förbundit
      sig att följa avtalet, också Finland.
    sentences:
    - id: hb-c05-u0122-s001
      start: 0
      end: 151
    - id: hb-c05-u0122-s002
      start: 152
      end: 231
  - type: paragraph
    id: hb-c05-u0123
    text: Barnkonventionen är omfattande. En del av rättigheterna i den är allmänna mänskliga rättigheter
      som gäller alla människor. Andra är rättigheter som gäller särskilt barn och som garanterar deras
      utveckling och skydd. Länderna är skyldiga att se till att både barn och vuxna är medvetna om barnens
      rättigheter.
    sentences:
    - id: hb-c05-u0123-s001
      start: 0
      end: 31
    - id: hb-c05-u0123-s002
      start: 32
      end: 122
    - id: hb-c05-u0123-s003
      start: 123
      end: 215
    - id: hb-c05-u0123-s004
      start: 216
      end: 308
  - type: paragraph
    id: hb-c05-u0124
    text: Enligt konventionen har alla barn rätt till skydd och omsorg. Barn är alla som är under 18 år.
      Vuxna är skyldiga att se till att barnens rättigheter tillgodoses. Barn ska skyddas från allt som
      hotar deras rättigheter.
    sentences:
    - id: hb-c05-u0124-s001
      start: 0
      end: 61
    - id: hb-c05-u0124-s002
      start: 62
      end: 94
    - id: hb-c05-u0124-s003
      start: 95
      end: 161
    - id: hb-c05-u0124-s004
      start: 162
      end: 217
  - type: paragraph
    id: hb-c05-u0125
    text: 'De viktigaste idéerna i barnkonventionen sammanfattas i följande fyra allmänna principer:'
    sentences:
    - id: hb-c05-u0125-s001
      start: 0
      end: 89
  - id: hb-c05-u0126
    type: list
    ordered: false
    items:
    - id: hb-c05-u0127
      text: 'Icke-diskriminering: Principen om icke-diskriminering innebär att barns rättigheter gäller
        alla barn. Inget barns rättigheter får begränsas på grund av till exempel hens eller hens föräldrars
        kön, språk, religion eller någon annan omständighet.'
      sentences:
      - id: hb-c05-u0127-s001
        start: 0
        end: 101
      - id: hb-c05-u0127-s002
        start: 102
        end: 244
    - id: hb-c05-u0128
      text: 'Barnets bästa: Barnets bästa ska alltid stå i främsta rummet. Med det avses framför allt
        att alla myndigheter i första hand ska beakta barnens bästa när de fattar beslut som rör barn.'
      sentences:
      - id: hb-c05-u0128-s001
        start: 0
        end: 61
      - id: hb-c05-u0128-s002
        start: 62
        end: 183
    - id: hb-c05-u0129
      text: 'Rätt till liv: Alla barn har rätt till liv, överlevnad och utveckling. Det innebär till exempel
        att alla barn har lika rättigheter till den hälsovård de behöver.'
      sentences:
      - id: hb-c05-u0129-s001
        start: 0
        end: 70
      - id: hb-c05-u0129-s002
        start: 71
        end: 161
    - id: hb-c05-u0130
      text: 'Rätt att uttrycka sin åsikt och få den respekterad: Barn har rätt att få sina åsikter beaktade.
        Om ett barn har förmågan att bilda sig en uppfattning om en fråga som gäller hen, har hen rätt
        att uttrycka denna uppfattning. Barnets åsikter ska beaktas utifrån hens ålder och utvecklingsnivå.'
      sentences:
      - id: hb-c05-u0130-s001
        start: 0
        end: 95
      - id: hb-c05-u0130-s002
        start: 96
        end: 222
      - id: hb-c05-u0130-s003
        start: 223
        end: 290
- id: hb-c05-religion
  title: Religionsfrihet och barnets religion
  blocks:
  - type: paragraph
    id: hb-c05-u0131
    text: I Finland råder religionsfrihet. Alla som bor i Finland har rätt att själva välja sin religion
      och utöva den. Om man inte vill, måste man inte välja någon religion alls. Ingen kan heller mot
      sin vilja tvingas att delta i religionsutövande.
    sentences:
    - id: hb-c05-u0131-s001
      start: 0
      end: 32
    - id: hb-c05-u0131-s002
      start: 33
      end: 109
    - id: hb-c05-u0131-s003
      start: 110
      end: 169
    - id: hb-c05-u0131-s004
      start: 170
      end: 239
  - type: paragraph
    id: hb-c05-u0132
    text: Minst 20 myndiga personer kan grunda ett religiöst samfund. Religiösa grupper måste inte registrera
      sig som samfund, utan de kan även verka utan att ha registrerat sig.
    sentences:
    - id: hb-c05-u0132-s001
      start: 0
      end: 59
    - id: hb-c05-u0132-s002
      start: 60
      end: 168
  - type: paragraph
    id: hb-c05-u0133
    text: Föräldrarna bestämmer barnets religion. Om föräldrarna inte är överens, registreras barnet inte
      i något trossamfund. Om en domstol har utsett en av föräldrarna som ensam vårdnadshavare kan denne
      på egen hand fatta beslut om barnets religion.
    sentences:
    - id: hb-c05-u0133-s001
      start: 0
      end: 39
    - id: hb-c05-u0133-s002
      start: 40
      end: 116
    - id: hb-c05-u0133-s003
      start: 117
      end: 241
  - type: paragraph
    id: hb-c05-u0134
    text: Nät ett barn har fyllt tolv år kan hen inte anslutas till ett religiöst samfund utan barnets
      samtycke. Barnets tillstånd behövs också för utträde ur ett trossamfund.
    sentences:
    - id: hb-c05-u0134-s001
      start: 0
      end: 102
    - id: hb-c05-u0134-s002
      start: 103
      end: 165
  - type: paragraph
    id: hb-c05-u0135
    text: En myndig person, alltså en person som har fyllt 18 år, får själv besluta om sin religion.
    sentences:
    - id: hb-c05-u0135-s001
      start: 0
      end: 90
- id: hb-c05-sexualitet
  title: Sexuella rättigheter och kroppslig integritet
  blocks:
  - type: paragraph
    id: hb-c05-u0136
    text: En trygg sexualitet och skyddandet av den är förknippad med sexuella rättigheter. Med sexuella
      rättigheter avses en människas rätt att bestämma över sådant som rör hens sexualitet och få information
      om sexualitet. Det är viktigt för välbefinnandet och ett harmoniskt liv att de sexuella rättigheterna
      uppfylls. De främjar också jämställdhet mellan könen.
    sentences:
    - id: hb-c05-u0136-s001
      start: 0
      end: 81
    - id: hb-c05-u0136-s002
      start: 82
      end: 213
    - id: hb-c05-u0136-s003
      start: 214
      end: 310
    - id: hb-c05-u0136-s004
      start: 311
      end: 354
  - type: paragraph
    id: hb-c05-u0137
    text: Sexuella rättigheter avser individens rätt att själv bestämma över ssådant som rör hens sexualitet.
      De sexuella rättigheterna anknyter till självbestämmanderätten, det vill säga till det faktum att
      människan har rätt att bestämma över sitt liv och göra egna val. Var och en i Finland har rätt att
      bestämma över sin egen sexualitet och sin egen kropp också i kärleksrelationer och äktenskapet.
      De sexuella rättigheterna tillhör alla oavsett kön, etnisk bakgrund, sexuell läggning och hälsotillstånd.
    sentences:
    - id: hb-c05-u0137-s001
      start: 0
      end: 99
    - id: hb-c05-u0137-s002
      start: 100
      end: 262
    - id: hb-c05-u0137-s003
      start: 263
      end: 392
    - id: hb-c05-u0137-s004
      start: 393
      end: 498
  - type: paragraph
    id: hb-c05-u0138
    text: Om de sexuella rättigheterna inte uppfylls, uppfylls inte heller de övriga mänskliga rättigheterna,
      och de sexuella rättigheterna kan inte uppfyllas utan att de övriga rättigheterna uppfylls. Till
      exempel tillräcklig hälsovård, föda och en bostad samt en trygg livsmiljö är alla förutsättningar
      för att en människa ska kunna leva ut sin sexualitet på ett säkert och tillfredsställande sätt.
    sentences:
    - id: hb-c05-u0138-s001
      start: 0
      end: 191
    - id: hb-c05-u0138-s002
      start: 192
      end: 390
  - type: paragraph
    id: hb-c05-u0139
    text: Kvinnor har historiskt sett haft mindre social, politisk och ekonomisk makt än män. Ojämställdheten
      mellan könen har varit ett hinder för skyddandet av de sexuella rättigheterna. Jämställdheten i
      samhället ökar när faktorer som hänger samman med de sexuella rättigheterna uppfylls. Dessa kan
      vara bland annat rätt att bestämma över sin kropp, om äktenskap och familj samt möjlighet att utbilda
      sig och vara ekonomiskt självständig.
    sentences:
    - id: hb-c05-u0139-s001
      start: 0
      end: 83
    - id: hb-c05-u0139-s002
      start: 84
      end: 178
    - id: hb-c05-u0139-s003
      start: 179
      end: 281
    - id: hb-c05-u0139-s004
      start: 282
      end: 431
  - type: paragraph
    id: hb-c05-u0140
    text: Alla har rätt att njuta av sexualitet enligt den egna sexuella läggningen och rätt till ett
      tryggt sexualliv. Var och en har också rätt att uttrycka sin sexuella läggning och sitt kön på önskat
      sätt. En förutsättning för sexualliv är samtycke. Man får aldrig pressa eller tvinga någon till
      sexuellt umgänge.
    sentences:
    - id: hb-c05-u0140-s001
      start: 0
      end: 109
    - id: hb-c05-u0140-s002
      start: 110
      end: 199
    - id: hb-c05-u0140-s003
      start: 200
      end: 243
    - id: hb-c05-u0140-s004
      start: 244
      end: 307
  - type: paragraph
    id: hb-c05-u0141
    text: Alla har rätt till åldersanpassad och högklassig sexualundervisning som ger mångsidig information
      om sexualitet och sexuella rättigheter. Sexualundervisningen ska basera sig på de mänskliga rättigheterna,
      jämställdhet mellan könen och en positiv uppfattning om sexualitet. Den ska beakta könsminoriteter
      och sexuella minoriteter och personer med funktionsnedsättning.
    sentences:
    - id: hb-c05-u0141-s001
      start: 0
      end: 137
    - id: hb-c05-u0141-s002
      start: 138
      end: 272
    - id: hb-c05-u0141-s003
      start: 273
      end: 367
  - type: paragraph
    id: hb-c05-u0142
    text: Alla har rätt till kroppslig integritet och rätt att bestämma om sina relationer och om de vill
      gifta sig. Människor ska skyddas från sexuella trakasserier, våldtäkt och allt annat könsrelaterat
      våld. Om man blir utsatt för sexuellt våld har man rätt att få hjälp och stöd för det. Alla har
      rätt att använda preventivmedel och metoder och preparat avsedda för att förebygga könssjukdomar.
      Ländernas lagstiftning har en viktig roll i att säkerställa skyddet.
    sentences:
    - id: hb-c05-u0142-s001
      start: 0
      end: 106
    - id: hb-c05-u0142-s002
      start: 107
      end: 200
    - id: hb-c05-u0142-s003
      start: 201
      end: 281
    - id: hb-c05-u0142-s004
      start: 282
      end: 388
    - id: hb-c05-u0142-s005
      start: 389
      end: 457
  - type: paragraph
    id: hb-c05-u0143
    text: Alla har rätt till trygga förlossningar, graviditetsprevention, säkra aborter, behandling av
      könssjukdomar och andra tjänster inom sexuell och reproduktiv hälsa. Tjänsterna ska vara tillgängliga
      för alla oberoende av bostadsort och ekonomisk situation.
    sentences:
    - id: hb-c05-u0143-s001
      start: 0
      end: 161
    - id: hb-c05-u0143-s002
      start: 162
      end: 252
  - type: paragraph
    id: hb-c05-u0144
    text: Alla har rätt att bli sedda och hörda i samhället precis som de är. Alla har rätt att uttrycka
      sina åsikter utan att behöva vara rädda för diskriminering, trakasserier eller våld. Alla får definiera
      eller låta bli att definiera sin sexuella läggning och sin könsidentitet.
    sentences:
    - id: hb-c05-u0144-s001
      start: 0
      end: 67
    - id: hb-c05-u0144-s002
      start: 68
      end: 179
    - id: hb-c05-u0144-s003
      start: 180
      end: 272
  - type: paragraph
    id: hb-c05-u0145
    text: Alla har rätt att fatta individuella beslut om sin sexualitet utan att behöva vara rädda för
      förföljelse, frihetsberövning eller sociala påtryckningar. Tjänsterna inom sexuell hälsa ska vara
      konfidentiella, det vill säga ingen utomstående får komma över klientens uppgifter.
    sentences:
    - id: hb-c05-u0145-s001
      start: 0
      end: 151
    - id: hb-c05-u0145-s002
      start: 152
      end: 274
  - type: paragraph
    id: hb-c05-u0146
    text: Alla har rätt att delta i och påverka uppfyllandet av de egna och andras sexuella rättigheter
      och beslutsfattande som rör dem i samhället. Detta omfattar å ena sidan beslut om den egna kroppen
      och å andra sidan möjlighet att påverka det politiska beslutsfattandet.
    sentences:
    - id: hb-c05-u0146-s001
      start: 0
      end: 138
    - id: hb-c05-u0146-s002
      start: 139
      end: 264
  - type: paragraph
    id: hb-c05-u0147
    text: En persons kläder, smink, hår och gester är tecken på hens personliga stil och för många också
      en del av deras könsuttryck. De är aldrig en inbjudan till beröring, rop eller visslingar.
    sentences:
    - id: hb-c05-u0147-s001
      start: 0
      end: 123
    - id: hb-c05-u0147-s002
      start: 124
      end: 185
  - type: paragraph
    id: hb-c05-u0148
    text: Beröring, sexuellt anspelande prat eller meddelanden och bilder som är icke-önskvärda och som
      sker utan tillstånd är sexuella trakasserier. Sexuella trakasserier är ett brott i Finland och kan
      leda till böter eller i värsta fall fängelsestraff. Var och en har rätt att röra sig på offentliga
      platser, till exempel på stan, utan att bli trakasserad eller ofredad.
    sentences:
    - id: hb-c05-u0148-s001
      start: 0
      end: 139
    - id: hb-c05-u0148-s002
      start: 140
      end: 244
    - id: hb-c05-u0148-s003
      start: 245
      end: 362
  - type: paragraph
    id: hb-c05-u0149
    text: Alla är skyldiga att respektera andras sexuella gränser och begär och önskemål i fråga om sexualiteten.
      I Finland anser man att en människa är skyldig att säkerställa att den andra samtycker till beröring
      och olika sexuella handlingar. Samtycket kan ges i ord, men också uttryckas med gester eller handlingar.
      Samtycke till sexuella handlingar behövs också mellan personer i ett äktenskap och ett parförhållande.
      Det borde inte heller endast vara fråga om att alla parter samtycker till sex. Att respektera den
      andra handlar också om att säkerställa att alla parter upplever att sexet är njutningsfullt.
    sentences:
    - id: hb-c05-u0149-s001
      start: 0
      end: 103
    - id: hb-c05-u0149-s002
      start: 104
      end: 235
    - id: hb-c05-u0149-s003
      start: 236
      end: 309
    - id: hb-c05-u0149-s004
      start: 310
      end: 412
    - id: hb-c05-u0149-s005
      start: 413
      end: 491
    - id: hb-c05-u0149-s006
      start: 492
      end: 603
  - type: paragraph
    id: hb-c05-u0150
    text: Om man är osäker på om man har fått den andras samtycke till en handling, är det bra att fråga
      rakt ut. Samtycke till sexuella handlingar kan tas tillbaka när som helst, till exempel mitt under
      ett samlag. Sex utan samtycke är våldtäkt, som är ett brott som kan ge fängelsestraff.
    sentences:
    - id: hb-c05-u0150-s001
      start: 0
      end: 103
    - id: hb-c05-u0150-s002
      start: 104
      end: 205
    - id: hb-c05-u0150-s003
      start: 206
      end: 280
  - type: paragraph
    id: hb-c05-u0151
    text: Kroppslig självbestämmanderätt betyder att var och en har makt att fatta självständiga beslut
      om sin egen kropp utan våld eller tvång. Det innebär makt att bestämma när och med vem man vill
      ha en relation eller sex, eller om man överhuvudtaget vill ha dessa. Om en person säger nej, betyder
      det alltid att hen inte vill. Till självbestämmanderätten hör också makt att bestämma när man vill
      ha barn, med vem och om man överhuvudtaget vill ha barn.
    sentences:
    - id: hb-c05-u0151-s001
      start: 0
      end: 134
    - id: hb-c05-u0151-s002
      start: 135
      end: 258
    - id: hb-c05-u0151-s003
      start: 259
      end: 320
    - id: hb-c05-u0151-s004
      start: 321
      end: 446
  - type: paragraph
    id: hb-c05-u0152
    text: Med kvinnlig könsstympning eller omskärelse avses en åtgärd där en del av de yttre könsorganen
      avlägsnas eller på annat sätt skadas. Ibland avlägsnas de yttre könsorganen helt och hållet och
      slidans öppning sys så gott som ihop. I Finland är kvinnlig könsstympning i alla former ett brott.
    sentences:
    - id: hb-c05-u0152-s001
      start: 0
      end: 132
    - id: hb-c05-u0152-s002
      start: 133
      end: 228
    - id: hb-c05-u0152-s003
      start: 229
      end: 289
  - type: paragraph
    id: hb-c05-u0153
    text: Könsstympning av flickor bryter mot barns kroppsliga integritet och kan ge flera års fängelsestraff.
      I Finland är alla som arbetar med barn enligt lag skyldiga att göra en anmälan till myndigheterna
      om de misstänker att till exempel en förälder eller släkting till en flicka planerar att tvinga
      henne att genomgå könsstympning.
    sentences:
    - id: hb-c05-u0153-s001
      start: 0
      end: 100
    - id: hb-c05-u0153-s002
      start: 101
      end: 327
  - type: paragraph
    id: hb-c05-u0154
    text: Till exempel anställda på skolor, daghem och rådgivningar är skyldiga att göra en anmälan, men
      vem som helst kan göra det. Anmälan är en barnskyddsanmälan och går till de sociala myndigheterna.
      Dessutom görs en brottsanmälan.
    sentences:
    - id: hb-c05-u0154-s001
      start: 0
      end: 122
    - id: hb-c05-u0154-s002
      start: 123
      end: 193
    - id: hb-c05-u0154-s003
      start: 194
      end: 225
  - type: paragraph
    id: hb-c05-u0155
    text: Könsstympning av flickor är ett brott i Finland. Man kan få ett flerårigt fängelsestraff för
      det. Det är likaså brottsligt att ta flickan utomlands för könsstympning.
    sentences:
    - id: hb-c05-u0155-s001
      start: 0
      end: 48
    - id: hb-c05-u0155-s002
      start: 49
      end: 97
    - id: hb-c05-u0155-s003
      start: 98
      end: 166
- id: hb-c05-reproduktion
  title: Självbestämmande och reproduktiv hälsa
  blocks:
  - type: paragraph
    id: hb-c05-u0156
    text: Fram till graviditetsvecka 12+0 kan du kan du i Finland få abort med ditt eget beslut. Då behöver
      du inget tillstånd för aborten och du behöver inte heller motivera ditt beslut på något sätt.
    sentences:
    - id: hb-c05-u0156-s001
      start: 0
      end: 86
    - id: hb-c05-u0156-s002
      start: 87
      end: 191
  - type: paragraph
    id: hb-c05-u0157
    text: I många situationer kan du få en abort också efter den första trimestern.
    sentences:
    - id: hb-c05-u0157-s001
      start: 0
      end: 73
  - type: paragraph
    id: hb-c05-u0158
    text: 'I graviditetsvecka 12+1–20+0 kan abort göras med ett särskilt tillstånd från Valvira. Valvira
      är tillstånds- och tillsynsverket för social- och hälsovården. Ange i din ansökan varför aborten
      inte gjordes tidigare. I Finlands lag föreskrivs grunderna på vilka du kan få abort under denna
      period. Du kan få en abort i graviditetsvecka 12–20 om du befinner dig någon av följande situationer:'
    sentences:
    - id: hb-c05-u0158-s001
      start: 0
      end: 85
    - id: hb-c05-u0158-s002
      start: 86
      end: 156
    - id: hb-c05-u0158-s003
      start: 157
      end: 213
    - id: hb-c05-u0158-s004
      start: 214
      end: 294
    - id: hb-c05-u0158-s005
      start: 295
      end: 388
  - id: hb-c05-u0159
    type: list
    ordered: false
    items:
    - id: hb-c05-u0160
      text: Att få barnet skulle vara avsevärt betungande för dig,
      sentences:
      - id: hb-c05-u0160-s001
        start: 0
        end: 54
    - id: hb-c05-u0161
      text: du eller den andra föräldern har en sjukdom som gör det svårare att sköta barnet,
      sentences:
      - id: hb-c05-u0161-s001
        start: 0
        end: 81
    - id: hb-c05-u0162
      text: graviditeten har inletts till följd av ett sexualbrott
      sentences:
      - id: hb-c05-u0162-s001
        start: 0
        end: 54
    - id: hb-c05-u0163
      text: det finns skäl att förmoda att fostret har en svår sjukdom eller kroppsskada,
      sentences:
      - id: hb-c05-u0163-s001
        start: 0
        end: 77
    - id: hb-c05-u0164
      text: du var under sjutton år eller över fyrtio år när graviditeten började eller
      sentences:
      - id: hb-c05-u0164-s001
        start: 0
        end: 75
    - id: hb-c05-u0165
      text: du har redan fött fyra barn.
      sentences:
      - id: hb-c05-u0165-s001
        start: 0
        end: 28
  - type: paragraph
    id: hb-c05-u0166
    text: Om fostret har en svår sjukdom eller kroppsskada kan du få abort fram till graviditetsvecka
      24+0. För detta behöver du ett tillstånd från Valvira.
    sentences:
    - id: hb-c05-u0166-s001
      start: 0
      end: 97
    - id: hb-c05-u0166-s002
      start: 98
      end: 146
  - type: paragraph
    id: hb-c05-u0167
    text: Om graviditeten utgör en fara för din hälsa, finns det ingen tidsgräns för aborten. Då behöver
      du tillstånd från två läkare.
    sentences:
    - id: hb-c05-u0167-s001
      start: 0
      end: 83
    - id: hb-c05-u0167-s002
      start: 84
      end: 124
  - type: paragraph
    id: hb-c05-u0168
    text: Om du är minderårig och vill göra abort behöver du inte tillstånd av dina föräldrar. Det är
      dock ofta bra att diskutera saken med föräldrarna. Om du emellertid inte vill göra det har de yrkesutbildade
      personerna inom hälsovården tystnadsplikt.
    sentences:
    - id: hb-c05-u0168-s001
      start: 0
      end: 84
    - id: hb-c05-u0168-s002
      start: 85
      end: 142
    - id: hb-c05-u0168-s003
      start: 143
      end: 243
  - type: paragraph
    id: hb-c05-u0204
    text: Om du behöver p-piller behöver du ett recept från läkaren. Med receptet kan du hämta ut dina
      piller på apoteket. Boka en tid hos läkaren för att få receptet.
    sentences:
    - id: hb-c05-u0204-s001
      start: 0
      end: 58
    - id: hb-c05-u0204-s002
      start: 59
      end: 112
    - id: hb-c05-u0204-s003
      start: 113
      end: 157
  - type: paragraph
    id: hb-c05-u0169
    text: Du behöver inte ha vårdnadshavarens tillstånd för receptet om du är minderårig. Vissa områden
      erbjuder unga kostnadsfria preventivmedel. Du kan fråga om detta på social- och hälsocentralen eller
      av hälsovårdaren på din skola.
    sentences:
    - id: hb-c05-u0169-s001
      start: 0
      end: 79
    - id: hb-c05-u0169-s002
      start: 80
      end: 136
    - id: hb-c05-u0169-s003
      start: 137
      end: 225
  - type: paragraph
    id: hb-c05-u0170
    text: Också papperslösa och asylsökande har rätt att få behandling för könssjukdomar. Om du vistas
      i Finland utan uppehållstillstånd kan du emellertid bli tvungen att betala för vården.
    sentences:
    - id: hb-c05-u0170-s001
      start: 0
      end: 79
    - id: hb-c05-u0170-s002
      start: 80
      end: 179
  - type: paragraph
    id: hb-c05-u0171
    text: Fundera noga på om omskärelse behövs. Om pojken är gammal nog för att säga sin åsikt ska han
      tillfrågas om han samtycker till operationen. Operationen får inte göras om pojken motsätter sig.
      Om pojken har två vårdnadshavare måste båda ge sitt skriftliga samtycke till operationen.
    sentences:
    - id: hb-c05-u0171-s001
      start: 0
      end: 37
    - id: hb-c05-u0171-s002
      start: 38
      end: 138
    - id: hb-c05-u0171-s003
      start: 139
      end: 190
    - id: hb-c05-u0171-s004
      start: 191
      end: 280
  - type: paragraph
    id: hb-c05-u0172
    text: Om det inte finns några medicinska skäl till omskärelsen kan den inte utföras inom den offentliga
      hälsovården. Då måste du betala för operationen själv.
    sentences:
    - id: hb-c05-u0172-s001
      start: 0
      end: 110
    - id: hb-c05-u0172-s002
      start: 111
      end: 152
  - type: paragraph
    id: hb-c05-u0173
    text: Endast en läkare får utföra operationen. Den ska göras i steril miljö. Läkaren ska se till att
      patienten får smärtlindring.
    sentences:
    - id: hb-c05-u0173-s001
      start: 0
      end: 40
    - id: hb-c05-u0173-s002
      start: 41
      end: 70
    - id: hb-c05-u0173-s003
      start: 71
      end: 123
- id: hb-c05-skyldigheter
  title: Individens skyldigheter
  blocks:
  - type: paragraph
    id: hb-c05-u0174
    text: Alla som bor i Finland har enligt lagen också skyldigheter.
    sentences:
    - id: hb-c05-u0174-s001
      start: 0
      end: 59
  - id: hb-c05-u0175
    type: list
    ordered: false
    items:
    - id: hb-c05-u0176
      text: Den viktigaste skyldigheten för alla som bor i Finland är att följa Finlands lag.
      sentences:
      - id: hb-c05-u0176-s001
        start: 0
        end: 81
    - id: hb-c05-u0177
      text: Alla måste betala skatt till staten på inkomster, egendom och arv. Människorna betalar också
        skatt på tjänster, produkter och många förmåner.
      sentences:
      - id: hb-c05-u0177-s001
        start: 0
        end: 66
      - id: hb-c05-u0177-s002
        start: 67
        end: 141
    - id: hb-c05-u0178
      text: Föräldrar är skyldiga att ta hand om sina minderåriga barn.
      sentences:
      - id: hb-c05-u0178-s001
        start: 0
        end: 59
    - id: hb-c05-u0179
      text: Alla är skyldiga att hjälpa om någon behöver hjälp vid till exempel en olycka.
      sentences:
      - id: hb-c05-u0179-s001
        start: 0
        end: 78
    - id: hb-c05-u0180
      text: Var och en är skyldig att vittna i domstol om en domstol kallar en som vittne.
      sentences:
      - id: hb-c05-u0180-s001
        start: 0
        end: 78
    - id: hb-c05-u0181
      text: Alla har ansvar för naturen och dess mångfald och för miljön och kulturarvet.
      sentences:
      - id: hb-c05-u0181-s001
        start: 0
        end: 77
  - type: paragraph
    id: hb-c05-u0182
    text: Enligt läropliktslagen ska alla barn både delta i undervisning enligt lagen om grundläggande
      utbildning eller på annat sätt få kunskaper som motsvarar den grundläggande utbildningens lärokurs
      och studera på till exempel en utbildning på andra stadiet tills de utexamineras eller fyller 18
      år.
    sentences:
    - id: hb-c05-u0182-s001
      start: 0
      end: 292
  - type: paragraph
    id: hb-c05-u0183
    text: Många grundläggande rättigheter gäller alla oavsett ålder. En del rättigheter och skyldigheter,
      till exempel rätten att rösta i val, gäller bara myndiga personer, det vill säga personer över 18
      år. Andra rättigheter och skyldigheter gäller yngre personer. Till exempel en 15-åring får själv
      bestämma hur hen använder pengar som hen förtjänat genom att arbeta.
    sentences:
    - id: hb-c05-u0183-s001
      start: 0
      end: 58
    - id: hb-c05-u0183-s002
      start: 59
      end: 197
    - id: hb-c05-u0183-s003
      start: 198
      end: 255
    - id: hb-c05-u0183-s004
      start: 256
      end: 359
- id: hb-c05-medborgarskap
  title: Rättigheter och skyldigheter som följer av medborgarskap
  blocks:
  - type: paragraph
    id: hb-c05-u0184
    text: Finska medborgare har vissa rättigheter och skyldigheter som utlänningar bosatta i Finland inte
      nödvändigtvis har.
    sentences:
    - id: hb-c05-u0184-s001
      start: 0
      end: 114
  - type: paragraph
    id: hb-c05-u0185
    text: Rättigheter
    sentences:
    - id: hb-c05-u0185-s001
      start: 0
      end: 11
  - id: hb-c05-u0186
    type: list
    ordered: false
    items:
    - id: hb-c05-u0187
      text: rätt att få finskt pass
      sentences:
      - id: hb-c05-u0187-s001
        start: 0
        end: 23
    - id: hb-c05-u0205
      text: En finsk medborgare kan inte hindras från att komma till Finland, hen kan inte förvisas från
        Finland
      sentences:
      - id: hb-c05-u0205-s001
        start: 0
        end: 100
    - id: hb-c05-u0188
      text: rätt att rösta i presidentval, riksdagsval och folkomröstningar då man fyllt 18 år.
      sentences:
      - id: hb-c05-u0188-s001
        start: 0
        end: 83
    - id: hb-c05-u0189
      text: rätt att ställa upp som kandidat i riksdagsval då man fyllt 18 år.
      sentences:
      - id: hb-c05-u0189-s001
        start: 0
        end: 66
    - id: hb-c05-u0190
      text: möjlighet att bli utnämnd till sådana statliga ämbeten för vilka det krävs finskt medborgarskap
      sentences:
      - id: hb-c05-u0190-s001
        start: 0
        end: 95
    - id: hb-c05-u0191
      text: EU-medborgarnas rättigheter som rätten att fritt röra sig och arbeta inom EU:s område och
        rätten att rösta och ställa upp som kandidat i EU-val
      sentences:
      - id: hb-c05-u0191-s001
        start: 0
        end: 143
  - type: paragraph
    id: hb-c05-u0192
    text: Utomlands får finska medborgare hjälp på Finlands ambassader och konsulat.
    sentences:
    - id: hb-c05-u0192-s001
      start: 0
      end: 74
  - type: paragraph
    id: hb-c05-u0193
    text: Även om du inte är finsk medborgare kan du ha rösträtt i vissa val.
    sentences:
    - id: hb-c05-u0193-s001
      start: 0
      end: 67
  - type: paragraph
    id: hb-c05-u0194
    text: Skyldigheter
    sentences:
    - id: hb-c05-u0194-s001
      start: 0
      end: 12
  - id: hb-c05-u0195
    type: list
    ordered: false
    items:
    - id: hb-c05-u0196
      text: Finska medborgare har skyldighet att delta i landets försvar eller bistå i det. Män som har
        fyllt 18 år har värnplikt (asevelvollisuus).
      sentences:
      - id: hb-c05-u0196-s001
        start: 0
        end: 79
      - id: hb-c05-u0196-s002
        start: 80
        end: 136
    - id: hb-c05-u0197
      text: Finska medborgare har skyldighet att följa Finlands lagar även annanstans än i Finland. Finska
        medborgare kan i Finland dömas för brott som begåtts utomlands.
      sentences:
      - id: hb-c05-u0197-s001
        start: 0
        end: 87
      - id: hb-c05-u0197-s002
        start: 88
        end: 158
- id: hb-c05-forsvar
  title: Försvarsplikt, beväringstjänst och civiltjänst
  blocks:
  - type: paragraph
    id: hb-c05-u0198
    text: Av skyldigheten att försvara landet följer att alla finländska män i åldern 18–60 år har värnplikt.
      Det betyder att de måste göra antingen beväringstjänst, det vill säga militärtjänst, eller civiltjänst.
      Civiltjänst är ett alternativ för dem som inte vill göra militärtjänst.
    sentences:
    - id: hb-c05-u0198-s001
      start: 0
      end: 99
    - id: hb-c05-u0198-s002
      start: 100
      end: 203
    - id: hb-c05-u0198-s003
      start: 204
      end: 275
  - type: paragraph
    id: hb-c05-u0199
    text: Beväringstjänstens, det vill säga arméutbildningens, längd är cirka sex månader till ett år.
      Efter beväringstjänsten hör den som slutfört den till reserven och kallas regelbundet till repetitionsövningar.
      I civiltjänstgöringen ingår en utbildningsperiod på en månad och en arbetstjänst på knappt ett år.
    sentences:
    - id: hb-c05-u0199-s001
      start: 0
      end: 92
    - id: hb-c05-u0199-s002
      start: 93
      end: 204
    - id: hb-c05-u0199-s003
      start: 205
      end: 303
  - type: paragraph
    id: hb-c05-u0200
    text: Av de män som kallades in i armén år 2023 valde 75 procent beväringstjänst och 1,6 procent civiltjänst.
      Resten antingen befriades från tjänstgöring på grund av hälsoskäl eller andra skäl, eller så flyttades
      deras tjänstgöring till en senare tidpunkt.
    sentences:
    - id: hb-c05-u0200-s001
      start: 0
      end: 103
    - id: hb-c05-u0200-s002
      start: 104
      end: 250
  - type: paragraph
    id: hb-c05-u0201
    text: Om en värnpliktig vägrar att göra antingen beväringstjänst eller civiltjänst, eller vägrar att
      slutföra en påbörjad tjänstgöring, döms hen för vägran att fullgöra värnplikt eller civiltjänst.
      Domens längd är hälften av den kvarvarande tjänstgöringstiden. Numera avtjänas straff för vägran
      i allmänhet som övervakningsstraff, det vill säga husarrest, i stället för i fängelse.
    sentences:
    - id: hb-c05-u0201-s001
      start: 0
      end: 191
    - id: hb-c05-u0201-s002
      start: 192
      end: 254
    - id: hb-c05-u0201-s003
      start: 255
      end: 375
  - type: paragraph
    id: hb-c05-u0202
    text: Om en man får finskt medborgarskap när han är under 30 år, måste han göra antingen beväringstjänst
      eller civiltjänst. Kvinnor har inte värnplikt, men kan göra frivillig värnplikt om de vill. År 2024
      ansökte 1 555 kvinnor om frivillig värnplikt.
    sentences:
    - id: hb-c05-u0202-s001
      start: 0
      end: 117
    - id: hb-c05-u0202-s002
      start: 118
      end: 190
    - id: hb-c05-u0202-s003
      start: 191
      end: 244
  - type: paragraph
    id: hb-c05-u0203
    text: Finlands försvar bygger på värnplikten och den värnpliktsarmé som reservisterna som fullgjort
      beväringstjänst bildar. Det finns ingen yrkesarmé i Finland.
    sentences:
    - id: hb-c05-u0203-s001
      start: 0
      end: 117
    - id: hb-c05-u0203-s002
      start: 118
      end: 154
