schema_version: 1
id: hb-c02
language: sv
title: Finlands historia
sections:
- id: hb-c02-forhistoria
  title: Förhistoria och medeltid
  blocks:
  - type: paragraph
    id: hb-c02-u0001
    text: Finland har varit bebott sedan istiden, från cirka år 8800 före tideräkningen. Bosättningen
      utvecklades först vid vattendrag och det finländska territoriet har alltid använts för livlig handelstrafik.
      Namnet på Finlands äldsta stad, Åbo (Turku), betyder handelsplats.
    sentences:
    - id: hb-c02-u0001-s001
      start: 0
      end: 78
    - id: hb-c02-u0001-s002
      start: 79
      end: 200
    - id: hb-c02-u0001-s003
      start: 201
      end: 267
  - type: paragraph
    id: hb-c02-u0002
    text: De första skriftliga källorna om Finland är från 1100–1200-talen. Då anslöts Finlands territorium
      med hjälp av korståg till påven i Roms maktkrets och det medeltida nätverket av hansaköpmän.
    sentences:
    - id: hb-c02-u0002-s001
      start: 0
      end: 65
    - id: hb-c02-u0002-s002
      start: 66
      end: 190
  - type: paragraph
    id: hb-c02-u0003
    text: Den katolska kyrkan kom till Finland via Sverige och den ortodoxa kyrkan från Novgorod i öster,
      nuvarande Rysslands område. Nöteborgsfreden 1323 avslutade kriget mellan Sverige och Novgorod om
      herraväldet i området. Med freden etablerades den katolska tron i Finlands västra delar och den
      ortodoxa tron i landets östra delar. Denna gräns mellan religionerna finns fortfarande, men med
      reformationen byttes den katolska tron till den lutherska.
    sentences:
    - id: hb-c02-u0003-s001
      start: 0
      end: 123
    - id: hb-c02-u0003-s002
      start: 124
      end: 215
    - id: hb-c02-u0003-s003
      start: 216
      end: 325
    - id: hb-c02-u0003-s004
      start: 326
      end: 443
  - type: paragraph
    id: hb-c02-u0004
    text: Under det svenska styret fanns det på Finlands område människogrupper som kommit från olika
      håll vid olika tidpunkter. De levde i små samhällen och bildade inget enhetligt folk eller någon
      enhetlig stat. Sverige införlivade delar av det område som i dag kallas Finland med sitt rike under
      1100–1300-talen.
    sentences:
    - id: hb-c02-u0004-s001
      start: 0
      end: 118
    - id: hb-c02-u0004-s002
      start: 119
      end: 203
    - id: hb-c02-u0004-s003
      start: 204
      end: 305
  - type: paragraph
    id: hb-c02-u0005
    text: Under det svenska styret spred sig den katolska kristendomen till Finland. Finland var en del
      av det svenska riket i över 600 år. De förändringar, till exempel reformationen och upplysningen,
      som skedde i Sverige och övriga Europa under dessa århundraden syntes också i Finland. När Sverige
      låg i krig måste också Finland skicka soldater till de svenska trupperna.
    sentences:
    - id: hb-c02-u0005-s001
      start: 0
      end: 74
    - id: hb-c02-u0005-s002
      start: 75
      end: 129
    - id: hb-c02-u0005-s003
      start: 130
      end: 278
    - id: hb-c02-u0005-s004
      start: 279
      end: 364
  - type: paragraph
    id: hb-c02-u0006
    text: I det medeltida Finland byggdes flera slott för att försvara området mot ryssarna. Två av dem
      var Tavastehus slott och Viborgs slott. Under medeltiden grundades också de första städerna i Finland,
      bland annat Åbo och Borgå.
    sentences:
    - id: hb-c02-u0006-s001
      start: 0
      end: 82
    - id: hb-c02-u0006-s002
      start: 83
      end: 133
    - id: hb-c02-u0006-s003
      start: 134
      end: 223
  - type: paragraph
    id: hb-c02-u0007
    text: Innan kristendomen kom till Finland utövades här hednisk religion. Det var en polyteistisk religion,
      det vill säga människorna trodde på många gudar. Man tillbad också avlidna och djur, till exempel
      björnen. I samhällena fanns siare, som botade sjuka och tryggade en god skörd. I skogarna och på
      kärren fanns heliga platser där människor offrade åt gudarna och dit de förde mat åt naturväsendena.
    sentences:
    - id: hb-c02-u0007-s001
      start: 0
      end: 66
    - id: hb-c02-u0007-s002
      start: 67
      end: 149
    - id: hb-c02-u0007-s003
      start: 150
      end: 207
    - id: hb-c02-u0007-s004
      start: 208
      end: 277
    - id: hb-c02-u0007-s005
      start: 278
      end: 396
- id: hb-c02-sverige
  title: Svenskt styre, reformation och upplysning
  blocks:
  - type: paragraph
    id: hb-c02-u0008
    text: 'Stånd: En grupp människor i Finlands historia som fastställdes enligt människornas rättigheter,
      skyldigheter, ställning och ofta också härkomst. De olika stånden var adeln, prästerskapet, borgare
      och bönder. Största delen av människorna hörde inte till något stånd och hade inte likadana rättigheter
      som de som hörde till något av stånden.'
    sentences:
    - id: hb-c02-u0008-s001
      start: 0
      end: 144
    - id: hb-c02-u0008-s002
      start: 145
      end: 207
    - id: hb-c02-u0008-s003
      start: 208
      end: 339
  - type: paragraph
    id: hb-c02-u0009
    text: Från Finland deltog man under det svenska styret i den svenska ståndsriksdagen. Ståndsriksdagen
      var en lagstiftande riksdag som tillkommit i Sverige på 1500-talet. Stånden representerade ändå
      bara de högre samhällsklasserna och den del av befolkningen som klarade sig bäst. Största delen
      av befolkningen hörde inte till något stånd.
    sentences:
    - id: hb-c02-u0009-s001
      start: 0
      end: 79
    - id: hb-c02-u0009-s002
      start: 80
      end: 163
    - id: hb-c02-u0009-s003
      start: 164
      end: 273
    - id: hb-c02-u0009-s004
      start: 274
      end: 332
  - type: paragraph
    id: hb-c02-u0010
    text: Till följd av reformationen övergick man i en del av Europa på 1500-talet från katolicismen
      till protestantisk tro. I Sverige och den östra delen av riket, Finland, innebar detta lutherdom,
      som är en inriktning inom den protestantiska kristendomen. Bakgrunden till reformationen var både
      försök att förnya kyrkans läror och politiska orsaker. Genom reformationen ökade den svenska kungens
      makt, när han blev kyrkans överhuvud istället för påven. Dessutom övergick en stor del av kyrkans
      betydande egendom till staten.
    sentences:
    - id: hb-c02-u0010-s001
      start: 0
      end: 115
    - id: hb-c02-u0010-s002
      start: 116
      end: 248
    - id: hb-c02-u0010-s003
      start: 249
      end: 342
    - id: hb-c02-u0010-s004
      start: 343
      end: 445
    - id: hb-c02-u0010-s005
      start: 446
      end: 517
  - type: paragraph
    id: hb-c02-u0011
    text: Reformationen var av stor betydelse för det finska språkets utveckling. Micael Agricola, som
      var biskop i Åbo, skrev den första finska ABC-boken och skapade grunderna för det finska skriftspråket.
      Agricola översatte också Nya testamentet till finska.
    sentences:
    - id: hb-c02-u0011-s001
      start: 0
      end: 71
    - id: hb-c02-u0011-s002
      start: 72
      end: 196
    - id: hb-c02-u0011-s003
      start: 197
      end: 250
  - type: paragraph
    id: hb-c02-u0012
    text: 1523 Gustav Vasa blev kung över Sverige och lösgjorde Sverige från den medeltida nordiska unionen.
    sentences:
    - id: hb-c02-u0012-s001
      start: 0
      end: 98
  - type: paragraph
    id: hb-c02-u0013
    text: 1543 Den första finskspråkiga ABC-boken (Aapinen) ges ut i Finland
    sentences:
    - id: hb-c02-u0013-s001
      start: 0
      end: 66
  - type: paragraph
    id: hb-c02-u0014
    text: 1550 Helsingfors grundas för att konkurrera med Tallinn om handeln på Östersjön
    sentences:
    - id: hb-c02-u0014-s001
      start: 0
      end: 79
  - type: paragraph
    id: hb-c02-u0015
    text: 1640 I Åbo grundas Finlands första universitet
    sentences:
    - id: hb-c02-u0015-s001
      start: 0
      end: 46
  - type: paragraph
    id: hb-c02-u0016
    text: I slutet av 1600-talet inleddes en period i Europa som kallades upplysningen. Under upplysningen
      ville man minska den enväldige kungens makt och kyrkans stora inflytande. Man började ägna uppmärksamhet
      åt mänskliga rättigheter och ville göra staten till en rättsstat. I en rättsstat har alla människor
      mänskliga rättigheter, politiska rättigheter och rätt att delta i samhället. I Sverige till exempel
      förbjöd man tortyr som förhörsmetod. Viktiga mål under upplysningen var rösträtt, yttrandefrihet
      och religionsfrihet.
    sentences:
    - id: hb-c02-u0016-s001
      start: 0
      end: 77
    - id: hb-c02-u0016-s002
      start: 78
      end: 170
    - id: hb-c02-u0016-s003
      start: 171
      end: 267
    - id: hb-c02-u0016-s004
      start: 268
      end: 378
    - id: hb-c02-u0016-s005
      start: 379
      end: 438
    - id: hb-c02-u0016-s006
      start: 439
      end: 519
  - type: paragraph
    id: hb-c02-u0017
    text: Samtidigt som man i Europa diskuterade mänskliga rättigheter utövade många europeiska länder
      kolonialism. Kolonialism innebär att ett land erövrar hela länder eller områden i andra världsdelar
      och utnyttjar deras resurser, såsom arbetskraft och naturresurser. Inom kolonialismen påverkar man
      också de lokala sederna, till exempel språket, religionen och utbildningen, i de erövrade länderna
      eller områdena.
    sentences:
    - id: hb-c02-u0017-s001
      start: 0
      end: 105
    - id: hb-c02-u0017-s002
      start: 106
      end: 259
    - id: hb-c02-u0017-s003
      start: 260
      end: 406
  - type: paragraph
    id: hb-c02-u0018
    text: Den kraftiga utvecklingen och blomstringen i de länder som deltog i kolonialismen skedde delvis
      på koloniernas bekostnad. Länderna som deltog i koloniseringen, till exempel Sverige och därmed
      också Finland, drog nytta av naturresurserna, råvarorna och produkterna i kolonierna samt handeln
      med dem. Produkter och råvaror som förts från kolonierna och som såldes på den internationella marknaden
      hade ofta producerats genom slavarbete.
    sentences:
    - id: hb-c02-u0018-s001
      start: 0
      end: 121
    - id: hb-c02-u0018-s002
      start: 122
      end: 298
    - id: hb-c02-u0018-s003
      start: 299
      end: 434
- id: hb-c02-autonomi
  title: Autonomin och industrialiseringen
  blocks:
  - type: paragraph
    id: hb-c02-u0019
    text: Finland blev en del av det ryska riket år 1809, då Sverige förlorade ett krig som det förde
      mot Ryssland. Under det ryska styret fortsatte utvecklingen av det finska samhället. Den ryska kejsaren
      beviljade Finland autonomi, det vill säga självstyre. Finland fick till exempel behålla sina gamla
      lagar från den svenska tiden och den lutherska tron. Finland fick också ordna egna lagstiftande
      lantdagar.
    sentences:
    - id: hb-c02-u0019-s001
      start: 0
      end: 105
    - id: hb-c02-u0019-s002
      start: 106
      end: 176
    - id: hb-c02-u0019-s003
      start: 177
      end: 249
    - id: hb-c02-u0019-s004
      start: 250
      end: 347
    - id: hb-c02-u0019-s005
      start: 348
      end: 401
  - type: paragraph
    id: hb-c02-u0020
    text: 1812 Helsingfors blir huvudstad
    sentences:
    - id: hb-c02-u0020-s001
      start: 0
      end: 31
  - type: paragraph
    id: hb-c02-u0021
    text: 1827 Den gamla huvudstaden Åbo förstörs i en brand och Helsingfors får en allt viktigare ställning
    sentences:
    - id: hb-c02-u0021-s001
      start: 0
      end: 98
  - type: paragraph
    id: hb-c02-u0022
    text: 1860 Finland inför en egen valuta, mark
    sentences:
    - id: hb-c02-u0022-s001
      start: 0
      end: 39
  - type: paragraph
    id: hb-c02-u0023
    text: 1800-talet var en period av stora förändringar i Europa. Europa industrialiserades och man började
      tillverka varor genom massproduktion. För det behövdes mycket arbetskraft och råvaror. Människorna
      flyttade till städerna och utomlands för att arbeta.
    sentences:
    - id: hb-c02-u0023-s001
      start: 0
      end: 56
    - id: hb-c02-u0023-s002
      start: 57
      end: 136
    - id: hb-c02-u0023-s003
      start: 137
      end: 185
    - id: hb-c02-u0023-s004
      start: 186
      end: 250
  - type: paragraph
    id: hb-c02-u0024
    text: Finlands folkmängd ökade från omkring en miljon till över tre miljoner. Samtidigt utvecklades
      jordbruksproduktionen, även om jordbruket producerade tillräckligt med mat för människorna i bara
      en del av landet. I Finland tog industrialiseringen fart först på 1880-talet, när pappersindustrin
      utvecklades. Från Finland exporterades främst produkter från skogsindustrin.
    sentences:
    - id: hb-c02-u0024-s001
      start: 0
      end: 71
    - id: hb-c02-u0024-s002
      start: 72
      end: 209
    - id: hb-c02-u0024-s003
      start: 210
      end: 303
    - id: hb-c02-u0024-s004
      start: 304
      end: 367
  - type: paragraph
    id: hb-c02-u0025
    text: Under industrialiseringen i Europa påverkades samhällsutvecklingen av bland annat socialismen.
      Ideologin strävade efter att förbättra arbetarnas ställning. Socialisterna motsatte sig det kapitalistiska
      ekonomiska systemet, där privatpersoner ägde alla fabriker och maskiner. Viktiga frågor var medborgarnas
      jämlikhet, social rättvisa och kvinnornas rösträtt. Fackförbund och socialistiska partier grundades
      runt om i Europa. I Finland fanns det ännu i slutet av 1800-talet endast lite fabriksarbetare, eftersom
      industristäderna var små. På landsbygden hade de fattiga det dåligt ställt.
    sentences:
    - id: hb-c02-u0025-s001
      start: 0
      end: 94
    - id: hb-c02-u0025-s002
      start: 95
      end: 155
    - id: hb-c02-u0025-s003
      start: 156
      end: 274
    - id: hb-c02-u0025-s004
      start: 275
      end: 358
    - id: hb-c02-u0025-s005
      start: 359
      end: 424
    - id: hb-c02-u0025-s006
      start: 425
      end: 536
    - id: hb-c02-u0025-s007
      start: 537
      end: 586
  - type: paragraph
    id: hb-c02-u0026
    text: Under det ryska styret var det länge lugnt i Finland. Människorna var nöjda när det inte förekom
      några krig och samhället utvecklades. I Finland byggdes landsvägar, järnvägar och fabriker. Dessutom
      startades många skolor i Finland där folket lärde sig läsa och skriva. Vanliga människor diskuterade
      politik, startade organisationer och försökte påverka i samhällsfrågor.
    sentences:
    - id: hb-c02-u0026-s001
      start: 0
      end: 53
    - id: hb-c02-u0026-s002
      start: 54
      end: 134
    - id: hb-c02-u0026-s003
      start: 135
      end: 188
    - id: hb-c02-u0026-s004
      start: 189
      end: 268
    - id: hb-c02-u0026-s005
      start: 269
      end: 370
- id: hb-c02-nationalitet
  title: Nationell identitet och demokratisering
  blocks:
  - type: paragraph
    id: hb-c02-u0027
    text: 1800-talet var också nationalismens eller nationalitetsidén århundrade. Enligt nationalitetsidén
      har varje folk ett eget språk, en egen religion och en egen historia, och varje folk borde vara
      en egen självständig stat. Länderna i Europa har dock bildats av många olika folk. Till följd av
      nationalismen förekom det uppror och oroligheter i många europeiska länder. Också i Finland började
      många anse att finländarna var ett eget folk.
    sentences:
    - id: hb-c02-u0027-s001
      start: 0
      end: 71
    - id: hb-c02-u0027-s002
      start: 72
      end: 219
    - id: hb-c02-u0027-s003
      start: 220
      end: 275
    - id: hb-c02-u0027-s004
      start: 276
      end: 365
    - id: hb-c02-u0027-s005
      start: 366
      end: 435
  - type: paragraph
    id: hb-c02-u0028
    text: Under ryska väldet föddes nationalistiska idéer i Finland först bland de bildade svenskspråkiga
      klasserna. De blev intresserade av finska språket och finsk kultur och framställde finländarna som
      ett folk med en gemensam historia och kultur. Den ryska förvaltningen stödde det nationella uppvaknandet
      och förbättrandet av det finska språkets ställning. I Ryssland tänkte de att nationalkänslan skulle
      fjärma finländarna från Sverige och svenskheten och föra dem närmare Ryssland. Finskspråkiga skolor
      började grundas i städerna på 1860-talet.
    sentences:
    - id: hb-c02-u0028-s001
      start: 0
      end: 106
    - id: hb-c02-u0028-s002
      start: 107
      end: 240
    - id: hb-c02-u0028-s003
      start: 241
      end: 351
    - id: hb-c02-u0028-s004
      start: 352
      end: 478
    - id: hb-c02-u0028-s005
      start: 479
      end: 541
  - type: paragraph
    id: hb-c02-u0029
    text: Nationalisterna kom att tvista om det finska och svenska språkets ställning i Finland. En del
      ville bevara svenska språkets ställning i Finland medan andra ville att finska skulle vara det enda
      språket. Språkstriden skapade de första partierna i Finland på 1860-talet. I och med stridigheterna
      blev finska det andra officiella språket i Finland i början av 1900-talet.
    sentences:
    - id: hb-c02-u0029-s001
      start: 0
      end: 86
    - id: hb-c02-u0029-s002
      start: 87
      end: 202
    - id: hb-c02-u0029-s003
      start: 203
      end: 268
    - id: hb-c02-u0029-s004
      start: 269
      end: 368
  - type: paragraph
    id: hb-c02-u0030
    text: 1906 Allmän och lika rösträtt, även för kvinnor
    sentences:
    - id: hb-c02-u0030-s001
      start: 0
      end: 47
  - type: paragraph
    id: hb-c02-u0031
    text: I början av 1900-talet ersattes Finlands lantdagar av en riksdag. År 1907 hölls det första riksdagsvalet,
      där alla finländare över 24 år fick rösta. Reformen var ett stort steg framåt. I valet fick arbetarna,
      de fattiga på landsbygden och kvinnorna möjlighet att för första gången påverka politiken i Finland.
    sentences:
    - id: hb-c02-u0031-s001
      start: 0
      end: 65
    - id: hb-c02-u0031-s002
      start: 66
      end: 148
    - id: hb-c02-u0031-s003
      start: 149
      end: 184
    - id: hb-c02-u0031-s004
      start: 185
      end: 309
  - type: paragraph
    id: hb-c02-u0032
    text: Finland var det tredje landet i världen och det första i Europa att ge kvinnor rösträtt. Finland
      var det första landet i världen att ge alla kvinnor rätt att kandidera i val. I valet år 1907 valdes
      19 kvinnor in i Finlands riksdag. De var världens första kvinnliga riksdagsledamöter.
    sentences:
    - id: hb-c02-u0032-s001
      start: 0
      end: 88
    - id: hb-c02-u0032-s002
      start: 89
      end: 174
    - id: hb-c02-u0032-s003
      start: 175
      end: 231
    - id: hb-c02-u0032-s004
      start: 232
      end: 283
- id: hb-c02-sjalvstandighet
  title: Självständigheten och inbördeskriget
  blocks:
  - type: paragraph
    id: hb-c02-u0033
    text: Från 1899 och framåt tog Ryssland ett hårdare grepp om storfurstendömet Finland. Finland deltog
      inte i första världskriget, men nationalismen hade inverkan även i det finska området. Finland fick
      en egen lantdag 1906 och det första valet ordnades 1907. Finland förklarade sig självständigt den
      6 december 1917 och bolsjevikregeringen som tog makten i samband med oktoberrevolutionen i Ryssland
      erkände självständigheten den 31 december 1917.
    sentences:
    - id: hb-c02-u0033-s001
      start: 0
      end: 80
    - id: hb-c02-u0033-s002
      start: 81
      end: 182
    - id: hb-c02-u0033-s003
      start: 183
      end: 252
    - id: hb-c02-u0033-s004
      start: 253
      end: 441
  - type: paragraph
    id: hb-c02-u0034
    text: Först i det självständiga Finland var människorna av mycket olika åsikt om hur staten skulle
      styras och utvecklas. Socialisterna ville göra omfattande samhällsreformer för att förbättra förhållandena
      för arbetarna och den fattiga landsbygdsbefolkningen och utveckla demokratin i kommunerna. Högern
      motsatte sig reformerna och var rädd för socialismens inflytande i Finland.
    sentences:
    - id: hb-c02-u0034-s001
      start: 0
      end: 114
    - id: hb-c02-u0034-s002
      start: 115
      end: 290
    - id: hb-c02-u0034-s003
      start: 291
      end: 373
  - type: paragraph
    id: hb-c02-u0035
    text: Inte förrän i det självständiga Finland blev förhållandena i samhället utmanande på grund av
      bland annat livsmedelsbrist, arbetslöshet och betydande politiska meningsskiljaktigheter. Dessa
      faktorer bidrog till uppkomsten av inbördeskriget. Kriget bröt ut i januari 1918.
    sentences:
    - id: hb-c02-u0035-s001
      start: 0
      end: 182
    - id: hb-c02-u0035-s002
      start: 183
      end: 239
    - id: hb-c02-u0035-s003
      start: 240
      end: 270
  - type: paragraph
    id: hb-c02-u0036
    text: I kriget stred de röda och de vita mot varandra. De röda var arbetare och fattiga från landsbygden
      som hörde till den politiska vänstern. De vita var bönder, tjänstemän och lärare som var anhängare
      av högerpolitik. Alla medborgare var ändå inte knutna till de röda eller de vita, utan mångas politiska
      ståndpunkt låg mellan dessa två.
    sentences:
    - id: hb-c02-u0036-s001
      start: 0
      end: 48
    - id: hb-c02-u0036-s002
      start: 49
      end: 137
    - id: hb-c02-u0036-s003
      start: 138
      end: 214
    - id: hb-c02-u0036-s004
      start: 215
      end: 334
  - type: paragraph
    id: hb-c02-u0037
    text: Finlands ställning under självständighetens tidiga år var skör. Snart efter att landet hade
      blivit självständigt utbröt ett blodigt inbördeskrig i Finland. Kriget bekämpades mellan den röda
      arbetarrörelsen och vita regeringsstyrkor. De vita fick stöd av Tyskland och de röda av Ryssland.
      Kriget slutade med de vitas seger.
    sentences:
    - id: hb-c02-u0037-s001
      start: 0
      end: 63
    - id: hb-c02-u0037-s002
      start: 64
      end: 155
    - id: hb-c02-u0037-s003
      start: 156
      end: 232
    - id: hb-c02-u0037-s004
      start: 233
      end: 287
    - id: hb-c02-u0037-s005
      start: 288
      end: 322
  - type: paragraph
    id: hb-c02-u0038
    text: I kriget dog omkring 37 000 människor i strider, fångläger och avrättningar. En stor del av
      de som dog hörde till de röda.
    sentences:
    - id: hb-c02-u0038-s001
      start: 0
      end: 76
    - id: hb-c02-u0038-s002
      start: 77
      end: 122
- id: hb-c02-demokrati
  title: Republik och demokrati mellan krigen
  blocks:
  - type: paragraph
    id: hb-c02-u0039
    text: I självständighetsförklaringen år 1917 hade man bestämt att Finland skulle vara en republik.
      År 1919 efter inbördeskriget bekräftade riksdagen Finlands grundlag. Enligt den blev Finland en
      republik.
    sentences:
    - id: hb-c02-u0039-s001
      start: 0
      end: 92
    - id: hb-c02-u0039-s002
      start: 93
      end: 161
    - id: hb-c02-u0039-s003
      start: 162
      end: 198
  - type: paragraph
    id: hb-c02-u0040
    text: Efter inbördeskriget år 1918 var folket djupt splittrat, även om inte alla varit anhängare av
      antingen de röda eller de vita under kriget. Kriget påverkade livet på olika sätt på olika håll
      i landet beroende på hur stort understöd de röda eller de vita hade haft på orten i fråga. Till
      exempel Tammerfors var en starkt röd stad och drabbades särskilt hårt av kriget.
    sentences:
    - id: hb-c02-u0040-s001
      start: 0
      end: 138
    - id: hb-c02-u0040-s002
      start: 139
      end: 280
    - id: hb-c02-u0040-s003
      start: 281
      end: 366
  - type: paragraph
    id: hb-c02-u0041
    text: Parterna i kriget var länge misstänksamma mot varandra. De röda var i egenskap av förlorare
      bittra över att krigets händelser ofta beskrevs ur de vitas synvinkel när de diskuterades i offentligheten.
      De vita ansåg att de stred för Finlands frihet och självständighet. Enligt de röda hade det varit
      fråga om ett klasskrig, där den fattiga samhällsklassen försökte få en jämlik ställning med dem
      som hade det bättre ställt i samhället.
    sentences:
    - id: hb-c02-u0041-s001
      start: 0
      end: 55
    - id: hb-c02-u0041-s002
      start: 56
      end: 199
    - id: hb-c02-u0041-s003
      start: 200
      end: 267
    - id: hb-c02-u0041-s004
      start: 268
      end: 433
  - type: paragraph
    id: hb-c02-u0042
    text: Efter kriget genomfördes många reformer inom politiken i syfte att förbättra de fattigas ställning.
      Till exempel lagarna om läroplikt och progressiv beskattning stiftades under den här tiden. Stabiliteten
      i samhället förbättrades också av att man kunde utveckla Finland utifrån de reformer som genomförts
      redan tidigare. Dessa var bland annat allmän och lika rösträtt och arbetstidslagen om åtta timmars
      arbetsdag som hade trätt i kraft år 1917.
    sentences:
    - id: hb-c02-u0042-s001
      start: 0
      end: 99
    - id: hb-c02-u0042-s002
      start: 100
      end: 191
    - id: hb-c02-u0042-s003
      start: 192
      end: 320
    - id: hb-c02-u0042-s004
      start: 321
      end: 445
  - type: paragraph
    id: hb-c02-u0043
    text: Det politiska samarbetet mellan de olika parterna var inte enkelt, men i arbetet i de demokratiska
      institutionerna var man tvungen att lära sig att göra kompromisser. Det gemensamma beslutsfattandet
      underlättades också av de politiska mittengrupperingarna, som hade mer moderata ståndpunkter än
      den strikta höger- eller vänsterpolitiken. Samtidigt ökade tilliten till att det var möjligt att
      göra förändringar på ett demokratiskt sätt.
    sentences:
    - id: hb-c02-u0043-s001
      start: 0
      end: 166
    - id: hb-c02-u0043-s002
      start: 167
      end: 337
    - id: hb-c02-u0043-s003
      start: 338
      end: 435
  - type: paragraph
    id: hb-c02-u0044
    text: På 1930-talet drabbades hela världen av en svår ekonomisk depression, då det blev brist på allt,
      också mat. Ländernas ekonomi försvagades kraftigt och arbetslösheten ökade. Extremhögern fick makt
      i många länder, eftersom den lovade att lyfta Europa ur depressionen. Extremhögerns anhängare motsatte
      sig demokrati och ville ha en stark ledare för staten. Efter depressionen förbättrades levnadsförhållandena
      mycket, men flera europeiska länder hade blivit diktaturer ledda av extremhögern. Finland förblev
      ändå en demokrati.
    sentences:
    - id: hb-c02-u0044-s001
      start: 0
      end: 107
    - id: hb-c02-u0044-s002
      start: 108
      end: 172
    - id: hb-c02-u0044-s003
      start: 173
      end: 265
    - id: hb-c02-u0044-s004
      start: 266
      end: 353
    - id: hb-c02-u0044-s005
      start: 354
      end: 488
    - id: hb-c02-u0044-s006
      start: 489
      end: 523
  - type: paragraph
    id: hb-c02-u0045
    text: I Finland förekom både höger- och vänsterextremism. På grund av extremhögerns påtryckningar
      förbjöds kommunistisk verksamhet i lag år 1930. Därför verkade de finländska kommunisterna i hemlighet.
      En del av dem försökte organisera sig för en ny arbetarrevolution.
    sentences:
    - id: hb-c02-u0045-s001
      start: 0
      end: 51
    - id: hb-c02-u0045-s002
      start: 52
      end: 139
    - id: hb-c02-u0045-s003
      start: 140
      end: 195
    - id: hb-c02-u0045-s004
      start: 196
      end: 262
- id: hb-c02-krigen
  title: Vinterkriget, fortsättningskriget och Lapplandskriget
  blocks:
  - type: paragraph
    id: hb-c02-u0046
    text: Den fredliga utvecklingen i samhället avbröts när Sovjetunionen anföll Finland hösten 1939.
      Bakgrunden till anfallet var de landavträdelser som Sovjetunionen krävde och som Finland inte gick
      med på. Detta krig kallas vinterkriget.
    sentences:
    - id: hb-c02-u0046-s001
      start: 0
      end: 91
    - id: hb-c02-u0046-s002
      start: 92
      end: 198
    - id: hb-c02-u0046-s003
      start: 199
      end: 230
  - type: paragraph
    id: hb-c02-u0047
    text: Även om bara två årtionden hade gått sedan inbördeskriget, stred finländarna nu sida vid sida
      mot Sovjetunionen. Finländarnas gemensamma mål var att bevara sin självständighet. Man ville glömma
      de gamla meningsskiljaktigheterna, och i medierna lyftes det finska folkets enighet fram. Det gav
      människorna kraft att överleva kriget.
    sentences:
    - id: hb-c02-u0047-s001
      start: 0
      end: 112
    - id: hb-c02-u0047-s002
      start: 113
      end: 176
    - id: hb-c02-u0047-s003
      start: 177
      end: 283
    - id: hb-c02-u0047-s004
      start: 284
      end: 330
  - type: paragraph
    id: hb-c02-u0048
    text: Under andra världskriget utkämpade Finland två krig mot Sovjetunionen, vinterkriget och fortsättningskriget.
      I fortsättningskriget stred Finland vid Tysklands sida för att försöka vinna tillbaka de landområden
      som gått förlorade i vinterkriget. Efter det utkämpade Finland ännu Lapplandskriget mot sin tidigare
      allierade Tyskland.
    sentences:
    - id: hb-c02-u0048-s001
      start: 0
      end: 108
    - id: hb-c02-u0048-s002
      start: 109
      end: 244
    - id: hb-c02-u0048-s003
      start: 245
      end: 330
  - type: paragraph
    id: hb-c02-u0049
    text: Som en följd av krigen förlorade Finland stora områden till Sovjetunionen. Människorna som bodde
      i dessa områden blev tvungna att lämna sina hem och evakuerades till andra ställen i Finland. Där
      var lokalbefolkningen länge misstänksam mot invandrarna på grund av deras annorlunda seder, dialekter
      och religion. De som evakuerades var också tvungna att lämna kvar en stor del av sin egendom på
      den gamla hemorten.
    sentences:
    - id: hb-c02-u0049-s001
      start: 0
      end: 74
    - id: hb-c02-u0049-s002
      start: 75
      end: 190
    - id: hb-c02-u0049-s003
      start: 191
      end: 310
    - id: hb-c02-u0049-s004
      start: 311
      end: 412
  - type: paragraph
    id: hb-c02-u0050
    text: Finland tvingades också betala stora krigsskadestånd till Sovjetunionen. Dessutom brände Finlands
      tidigare allierade tyskarna, som i slutet av kriget blivit fiender, en stor del av Lappland när
      de drevs ut ur Finland under Lapplandskriget. Återuppbyggnaden tog lång tid.
    sentences:
    - id: hb-c02-u0050-s001
      start: 0
      end: 72
    - id: hb-c02-u0050-s002
      start: 73
      end: 239
    - id: hb-c02-u0050-s003
      start: 240
      end: 270
  - type: paragraph
    id: hb-c02-u0051
    text: Dessa krig har stor betydelse för finländarna. I krigen dog uppemot 100 000 soldater. Krigen
      sammanförde folket, och Finland förblev en självständig stat. Krigsupplevelserna förenade de generationer
      som var med om krigen. De arbetade för sitt land och levde under hårda och fattiga förhållanden
      efter kriget. Många led på grund av traumatiska krigshändelser.
    sentences:
    - id: hb-c02-u0051-s001
      start: 0
      end: 46
    - id: hb-c02-u0051-s002
      start: 47
      end: 85
    - id: hb-c02-u0051-s003
      start: 86
      end: 154
    - id: hb-c02-u0051-s004
      start: 155
      end: 221
    - id: hb-c02-u0051-s005
      start: 222
      end: 308
    - id: hb-c02-u0051-s006
      start: 309
      end: 358
  - type: paragraph
    id: hb-c02-u0052
    text: 1939–1940 blir Finland inblandat i andra världskriget när vinterkriget mellan Finland och Sovjetunionen
      utbryter
    sentences:
    - id: hb-c02-u0052-s001
      start: 0
      end: 112
  - type: paragraph
    id: hb-c02-u0053
    text: 1941–1944 Andra världskriget fortsätter med fortsättningskriget mellan Finland och Sovjetunionen
    sentences:
    - id: hb-c02-u0053-s001
      start: 0
      end: 96
  - type: paragraph
    id: hb-c02-u0054
    text: Först klarade sig Finland bra i kriget och erövrade fler områden. Men sedan blev det slut med
      Finlands bundsförvant Tysklands framgångar i Europa. Tyskland hade under andra världskriget erövrat
      en stor del av Europa, men det stora anfallet mot Sovjetunionen misslyckades och Tyskland måste
      retirera. Sovjetunionen anföll Finland och hösten 1944 slöt man fred. Finland måste igen överlåta
      områden åt Sovjetunionen, betala krigsskadestånd och driva ut de tyska trupper som fanns i landet.
      Kriget mot de tyska trupperna kallas lapplandskriget. I det kriget brände tyskarna en stor del av
      Lappland när de lämnade Finland.
    sentences:
    - id: hb-c02-u0054-s001
      start: 0
      end: 65
    - id: hb-c02-u0054-s002
      start: 66
      end: 146
    - id: hb-c02-u0054-s003
      start: 147
      end: 299
    - id: hb-c02-u0054-s004
      start: 300
      end: 359
    - id: hb-c02-u0054-s005
      start: 360
      end: 486
    - id: hb-c02-u0054-s006
      start: 487
      end: 540
    - id: hb-c02-u0054-s007
      start: 541
      end: 617
- id: hb-c02-ateruppbyggnad
  title: Återuppbyggnad och kalla kriget
  blocks:
  - type: paragraph
    id: hb-c02-u0055
    text: Finland förlorade kriget och var därför tvunget att betala ett tungt krigsskadestånd till Sovjetunionen
      i form av varor. Som krigsskadestånd levererade man till exempel tåg, fartyg och råvaror. Finland
      finansierade tillverkningen av varorna med lån och understöd. I och med produktionen av krigsskadeståndet
      utvecklades Finland från ett jordbruksland till ett industriland. I takt med industrialiseringen
      började flyttrörelsen från landsbygden till städerna.
    sentences:
    - id: hb-c02-u0055-s001
      start: 0
      end: 120
    - id: hb-c02-u0055-s002
      start: 121
      end: 193
    - id: hb-c02-u0055-s003
      start: 194
      end: 263
    - id: hb-c02-u0055-s004
      start: 264
      end: 373
    - id: hb-c02-u0055-s005
      start: 374
      end: 458
  - type: paragraph
    id: hb-c02-u0056
    text: Efter krigen präglades politiken först av försiktighet och oro över att Sovjetunionen skulle
      ockupera landet. Kommunistisk politisk verksamhet var tillåten igen och man var också rädd för en
      kommunistisk revolution. Men spänningen minskade så småningom när förhållandena stabiliserades.
      När också förhållandet till Sovjet stabiliserades lärde sig finländarna hur det lönar sig att handla
      som granne till en inflytelserik stormakt. År 1948 slöt Finland och Sovjet VSB-pakten, det vill
      säga Vänskaps-, samarbets- och biståndspakten. Pakten gav Finland ekonomiska fördelar, men innebar
      också att Finland i både inrikes- och utrikespolitiken måste handla så att man inte irriterade Sovjet.
      Finland var officiellt ett självständigt och neutralt land, men i verkligheten måste man beakta
      Sovjets intressen i sin politik.
    sentences:
    - id: hb-c02-u0056-s001
      start: 0
      end: 109
    - id: hb-c02-u0056-s002
      start: 110
      end: 215
    - id: hb-c02-u0056-s003
      start: 216
      end: 286
    - id: hb-c02-u0056-s004
      start: 287
      end: 430
    - id: hb-c02-u0056-s005
      start: 431
      end: 530
    - id: hb-c02-u0056-s006
      start: 531
      end: 685
    - id: hb-c02-u0056-s007
      start: 686
      end: 814
  - type: paragraph
    id: hb-c02-u0057
    text: 1952 OS i Helsingfors
    sentences:
    - id: hb-c02-u0057-s001
      start: 0
      end: 21
  - type: paragraph
    id: hb-c02-u0058
    text: Efter andra världskriget tvingades Finland hålla samma linje som Sovjetunionen i sin utrikespolitik
      för att undvika ockupation. Officiellt var Finland ett neutralt land, men i verkligheten måste det
      i sin politik också beakta Sovjetunionens intressen. Å andra sidan förblev Finland ett självständigt
      land och drog ekonomisk nytta av handeln med Sovjetunionen.
    sentences:
    - id: hb-c02-u0058-s001
      start: 0
      end: 127
    - id: hb-c02-u0058-s002
      start: 128
      end: 251
    - id: hb-c02-u0058-s003
      start: 252
      end: 359
  - type: paragraph
    id: hb-c02-u0059
    text: Efter krigen utvecklades Finlands industri och ekonomin växte kraftigt. Den politiska viljan
      att bygga upp Finland till ett ännu bättre, mer jämlikt och tryggare land var stark. Samtliga partier
      antog som sitt politiska mål att bygga upp en välfärdsstat. En viktig förutsättning för uppbyggnaden
      var tillräcklig ekonomisk tillväxt. Människorna förenades av att de upplevt svåra levnadsförhållanden,
      vilket gjorde att alla förband sig till att utveckla samhället.
    sentences:
    - id: hb-c02-u0059-s001
      start: 0
      end: 71
    - id: hb-c02-u0059-s002
      start: 72
      end: 177
    - id: hb-c02-u0059-s003
      start: 178
      end: 254
    - id: hb-c02-u0059-s004
      start: 255
      end: 331
    - id: hb-c02-u0059-s005
      start: 332
      end: 462
  - type: paragraph
    id: hb-c02-u0060
    text: Så småningom blev Finland en välfärdsstat, där staten och kommunerna gavs en viktig roll i att
      säkerställa medborgarnas levnadsstandard och försörjning. Det faktum att alla medborgare erbjöds
      tjänster och social trygghet som tillhandahölls med skattemedel fick människorna att lita på det
      demokratiska beslutsfattandet och samhället och dess institutioner.
    sentences:
    - id: hb-c02-u0060-s001
      start: 0
      end: 152
    - id: hb-c02-u0060-s002
      start: 153
      end: 356
- id: hb-c02-valfard
  title: Välfärdsstatens framväxt
  blocks:
  - type: paragraph
    id: hb-c02-u0061
    text: Ännu i slutet av 1800-talet var det främst familjen, bygemenskapen och enskilda förmögna välgörare
      samt framför allt kyrkan som tog hand om fattiga och sjuka i Finland. Sedan överfördes ansvaret
      för landsbygdens fattiga allt mer från kyrkan till kommunerna. De fattiga arbetarna fick ekonomisk
      hjälp bara om de samtidigt förband sig att arbeta för en gård, en kommun eller en församling.
    sentences:
    - id: hb-c02-u0061-s001
      start: 0
      end: 168
    - id: hb-c02-u0061-s002
      start: 169
      end: 257
    - id: hb-c02-u0061-s003
      start: 258
      end: 387
  - type: paragraph
    id: hb-c02-u0062
    text: Under industrialiseringen i slutet av 1800-talet blev det allmän diskussion om fabriksarbetarnas
      usla villkor och fattigdom. Det lilla socialskydd fabriksarbetarna hade sköttes främst av arbetsgivarna
      och småningom även av medborgarorganisationer. På fabriksorter ägde och administrerade fabriksägaren
      också arbetarnas bostäder, daghem och åldringsvård. Fabriken påverkade hela arbetarnas livsmiljö
      och knöt dem tätt till arbetsgivaren.
    sentences:
    - id: hb-c02-u0062-s001
      start: 0
      end: 124
    - id: hb-c02-u0062-s002
      start: 125
      end: 247
    - id: hb-c02-u0062-s003
      start: 248
      end: 353
    - id: hb-c02-u0062-s004
      start: 354
      end: 436
  - type: paragraph
    id: hb-c02-u0063
    text: Samhällsaktiviteten i organisationerna var viktig för demokratins utveckling i Finland. Till
      de första stora folkrörelserna i Finland hörde nykterhetsrörelsen, gymnastik- och idrottsrörelsen,
      arbetar- och fackföreningsrörelserna samt ungdomsföreningar. Folkrörelserna och samhällsaktiviteten
      hjälpte till att förena finländarna som nation. De utbildade och upplyste finländarna, skapade nationalkänsla
      och lärde människorna att sköta gemensamma ärenden. Allt detta behövdes när Finland blev en självständig
      stat 1917.
    sentences:
    - id: hb-c02-u0063-s001
      start: 0
      end: 87
    - id: hb-c02-u0063-s002
      start: 88
      end: 252
    - id: hb-c02-u0063-s003
      start: 253
      end: 339
    - id: hb-c02-u0063-s004
      start: 340
      end: 453
    - id: hb-c02-u0063-s005
      start: 454
      end: 517
  - type: paragraph
    id: hb-c02-u0064
    text: Grunden till den finska välfärden är heltäckande tjänster inom social- och utkomstskydd. Socialskyddssystemet,
      en struktur av sociala förmåner och understöd, utvecklades senare i Finland än i de övriga nordiska
      länderna. År 1895 stiftades en lag om arbetsolycksfallsförsäkring. Det var första steget i utvecklandet
      av finsk socialförsäkring, men var också länge den enda formen av socialförsäkring i Finland. Lagen
      fastslog att arbetstagaren skulle betalas ersättning i fall av arbetsolycka eller yrkessjukdom.
      Den tidens finska socialförsäkring var internationellt sett gammalmodig, men i den oeniga politiska
      atmosfär som härskade var det mycket svårt att införa försäkringar för ålderdom, arbetsoförmåga
      eller sjukdom.
    sentences:
    - id: hb-c02-u0064-s001
      start: 0
      end: 88
    - id: hb-c02-u0064-s002
      start: 89
      end: 220
    - id: hb-c02-u0064-s003
      start: 221
      end: 277
    - id: hb-c02-u0064-s004
      start: 278
      end: 408
    - id: hb-c02-u0064-s005
      start: 409
      end: 510
    - id: hb-c02-u0064-s006
      start: 511
      end: 721
  - type: paragraph
    id: hb-c02-u0065
    text: Även om socialministeriet, som skulle ansvara för socialskyddet, grundades vid samma tid som
      Finland blev självständigt 1917, började man skapa omfattande offentliga stödsystem i Finland först
      i slutet av 1930-talet. Den första folkpensionslagen godkändes 1937. Lagen gav de försäkrade folkpension,
      det vill säga ekonomisk hjälp för ålderdomen och vid arbetsoförmåga. Samma år grundades Folkpensionsanstalten
      FPA (på finska Kela), vars uppgift var att betala folkpensionen.
    sentences:
    - id: hb-c02-u0065-s001
      start: 0
      end: 216
    - id: hb-c02-u0065-s002
      start: 217
      end: 261
    - id: hb-c02-u0065-s003
      start: 262
      end: 367
    - id: hb-c02-u0065-s004
      start: 368
      end: 473
  - type: paragraph
    id: hb-c02-u0066
    text: Den ursprungliga målsättningen med att göra Finland till en välfärdsstat var att minska fattigdomen
      och garantera en daglig utkomst för alla finländare. Man ansåg att detta skulle stabilisera samhället
      och dess utveckling och minska stödet för alla slags extrema rörelser. Tanken var också att mindre
      inkomstskillnader skulle göra människorna mer jämlika. Det skulle leda till att Finlands folk skulle
      vara enigare och alla skulle vilja arbeta för att utveckla landet. Det skulle vara lättare för olika
      befolkningsgrupper, till exempel rika och fattiga och grupper med olika politiska uppfattningar,
      att leva i fred med varandra.
    sentences:
    - id: hb-c02-u0066-s001
      start: 0
      end: 152
    - id: hb-c02-u0066-s002
      start: 153
      end: 272
    - id: hb-c02-u0066-s003
      start: 273
      end: 355
    - id: hb-c02-u0066-s004
      start: 356
      end: 468
    - id: hb-c02-u0066-s005
      start: 469
      end: 629
  - type: paragraph
    id: hb-c02-u0067
    text: Under 1960- och 1970-talet utvecklades Finland småningom till en nordisk välfärdsstat. Sverige
      var ett modelland i fråga om välfärden och påverkade Finland mycket. Staten tog allt mer ansvar
      för medborgarnas välfärd. Medborgarna fick fler inkomstöverföringar från staten, till exempel moderskapspenning
      och sjukpenning samt ersättningar för läkemedelsutgifter och läkararvoden. Det satsades på utbildning
      och sjukvård genom att det byggdes nya sjukhus och skolor och läkarutbildningen utvidgades.
    sentences:
    - id: hb-c02-u0067-s001
      start: 0
      end: 86
    - id: hb-c02-u0067-s002
      start: 87
      end: 163
    - id: hb-c02-u0067-s003
      start: 164
      end: 216
    - id: hb-c02-u0067-s004
      start: 217
      end: 377
    - id: hb-c02-u0067-s005
      start: 378
      end: 496
  - type: paragraph
    id: hb-c02-u0068
    text: Välfärdsstaten utvecklades ur jämlikhetsperspektiv. På 1970-talet började alla barn oberoende
      av samhällsklass gå samma kostnadsfria grundskola. De som studerade vid universitet, högskolor eller
      andra stadiets läroanstalter började få studiestöd, det vill säga ekonomiskt stöd för livet under
      studietiden. Tack vare studiestödet hade barndomsfamiljens tillgångar inte längre så stor betydelse
      för om en ung vuxen hade ekonomisk möjlighet att utbilda sig till det yrke hen ville.
    sentences:
    - id: hb-c02-u0068-s001
      start: 0
      end: 51
    - id: hb-c02-u0068-s002
      start: 52
      end: 144
    - id: hb-c02-u0068-s003
      start: 145
      end: 305
    - id: hb-c02-u0068-s004
      start: 306
      end: 478
- id: hb-c02-utbildning
  title: Utbildning för hela befolkningen
  blocks:
  - type: paragraph
    id: hb-c02-u0069
    text: Först på 1900-talets sida började större delen av befolkningen stöda folkskolan och 1921 stiftades
      en lag om läroplikt i Finland. Det betydde att skolgång blev obligatoriskt för alla. Folkskolan
      utvidgades till att omfatta hela åldersklassen på 1920- och 1930-talet.
    sentences:
    - id: hb-c02-u0069-s001
      start: 0
      end: 129
    - id: hb-c02-u0069-s002
      start: 130
      end: 183
    - id: hb-c02-u0069-s003
      start: 184
      end: 266
  - type: paragraph
    id: hb-c02-u0070
    text: Gymnasieutbildning och studentexamen blev vanligare särskilt på 1950- och 1960-talet. I Finland
      började man eftersträva samhällelig jämlikhet och ekonomisk utveckling genom att bygga en välfärdsstat.
      Samtidigt föddes tanken på en enhetlig 9-årig grundskola. Under 1970-talet övergick man i hela landet
      från det gamla systemet med separat folkskola och läroverk till en grundskola som var gemensam för
      alla.
    sentences:
    - id: hb-c02-u0070-s001
      start: 0
      end: 85
    - id: hb-c02-u0070-s002
      start: 86
      end: 199
    - id: hb-c02-u0070-s003
      start: 200
      end: 257
    - id: hb-c02-u0070-s004
      start: 258
      end: 406
- id: hb-c02-omvandling
  title: Från jordbruk till industri och informationssamhälle
  blocks:
  - type: paragraph
    id: hb-c02-u0071
    text: På 1960-talet började Finland gå från ett jordbruksdominerat land till ett industri- och servicesamhälle.
      Arbetstillfällena på landsbygden minskade när användningen av jordbruksmaskiner ökade. Människorna
      flyttade till städerna. Där fanns det arbete inom industrin, servicebranschen och handels- och transportbranschen.
    sentences:
    - id: hb-c02-u0071-s001
      start: 0
      end: 105
    - id: hb-c02-u0071-s002
      start: 106
      end: 192
    - id: hb-c02-u0071-s003
      start: 193
      end: 228
    - id: hb-c02-u0071-s004
      start: 229
      end: 319
  - type: paragraph
    id: hb-c02-u0072
    text: Idén om en enhetlig nioårig grundskola som alla barn skulle få gå i föddes. På 1970-talet övergick
      finländarna till en sådan ny grundskola. När utbildningssystemet utvecklades blev samhället mer
      jämlikt och Finland utvecklades ekonomiskt.
    sentences:
    - id: hb-c02-u0072-s001
      start: 0
      end: 75
    - id: hb-c02-u0072-s002
      start: 76
      end: 139
    - id: hb-c02-u0072-s003
      start: 140
      end: 238
  - type: paragraph
    id: hb-c02-u0073
    text: Det räckte ändå inte arbete och bostäder till alla, och många flyttade utomlands för att arbeta.
      Över 400 000 finländare flyttade till Sverige på 1960- och 1970-talen. En del återvände hem när
      sysselsättningsläget blev bättre i Finland, men andra stannade kvar i Sverige. Fram till 2010-talet
      var finländarna den största invandrargruppen i Sverige.
    sentences:
    - id: hb-c02-u0073-s001
      start: 0
      end: 96
    - id: hb-c02-u0073-s002
      start: 97
      end: 167
    - id: hb-c02-u0073-s003
      start: 168
      end: 271
    - id: hb-c02-u0073-s004
      start: 272
      end: 348
  - type: paragraph
    id: hb-c02-u0074
    text: Finland blev ett lika rikt och välmående land som de övriga nordiska länderna, trots att skillnaden
      jämfört med till exempel Sverige var stor ännu på 1950-talet. Vid den tiden var Finland ett fattigare
      och mindre utvecklat land än sina grannar som precis hade överlevt krig och betalat stora krigsskadestånd.
    sentences:
    - id: hb-c02-u0074-s001
      start: 0
      end: 161
    - id: hb-c02-u0074-s002
      start: 162
      end: 308
  - type: paragraph
    id: hb-c02-u0075
    text: 'Ekonomin växte kraftigt under uppgången på 1980-talet. Utbildningsnivån steg också i häpnadsväckande
      takt. Finländarna blev så småningom konsumenter som hade råd att köpa också annat än bara det allra
      nödvändigaste: kläder, möbler, utlandsresor och bilar. Samtidigt steg bostadspriserna.'
    sentences:
    - id: hb-c02-u0075-s001
      start: 0
      end: 54
    - id: hb-c02-u0075-s002
      start: 55
      end: 106
    - id: hb-c02-u0075-s003
      start: 107
      end: 255
    - id: hb-c02-u0075-s004
      start: 256
      end: 287
  - type: paragraph
    id: hb-c02-u0076
    text: Så småningom blev ekonomin överhettad. Priserna blev för höga och till sist kraschade allt.
      Det ledde i början av 1990-talet till en lågkonjunktur, som var särskilt svår i Finland. Arbetslösheten
      var hög, och banker och företag gick i konkurs. Man blev tvungen att minska på välfärdsstatens tjänster
      till medborgarna. Finländarna drabbades hårt av nedgången. Finska staten var tvungen att ta stora
      lån för att landet skulle klara sig ur lågkonjunkturen.
    sentences:
    - id: hb-c02-u0076-s001
      start: 0
      end: 38
    - id: hb-c02-u0076-s002
      start: 39
      end: 91
    - id: hb-c02-u0076-s003
      start: 92
      end: 180
    - id: hb-c02-u0076-s004
      start: 181
      end: 243
    - id: hb-c02-u0076-s005
      start: 244
      end: 317
    - id: hb-c02-u0076-s006
      start: 318
      end: 358
    - id: hb-c02-u0076-s007
      start: 359
      end: 453
  - type: paragraph
    id: hb-c02-u0077
    text: På 1990-talet gick man från ett industri- och servicesamhälle till ett informationssamhälle.
      Informationstekniken och kommunikationstekniken utvecklades, användningen av internet blev vanligare
      och mobiltelefonerna blev en viktig exportprodukt för finländarna. Finländska företag internationaliserades.
    sentences:
    - id: hb-c02-u0077-s001
      start: 0
      end: 92
    - id: hb-c02-u0077-s002
      start: 93
      end: 260
    - id: hb-c02-u0077-s003
      start: 261
      end: 302
  - type: paragraph
    id: hb-c02-u0078
    text: Också Sovjetunionens upplösning år 1991 påverkade den ekonomiska krisen eftersom en stor del
      av Finlands export gått till Sovjetunionen. Finska staten tog mycket lån för att klara den ekonomiska
      krisen.
    sentences:
    - id: hb-c02-u0078-s001
      start: 0
      end: 136
    - id: hb-c02-u0078-s002
      start: 137
      end: 202
- id: hb-c02-eu-nato
  title: Finland i EU och Nato
  blocks:
  - type: paragraph
    id: hb-c02-u0079
    text: Politiskt fortsatte Finland på sin neutrala och försiktiga linje fram till Sovjetunionens fall
      år 1991. Efter det stärkte Finland snabbt sina relationer med Västeuropa och Europeiska gemenskapen.
      År 1995 blev Finland medlem i Europeiska unionen EU.
    sentences:
    - id: hb-c02-u0079-s001
      start: 0
      end: 103
    - id: hb-c02-u0079-s002
      start: 104
      end: 195
    - id: hb-c02-u0079-s003
      start: 196
      end: 248
  - type: paragraph
    id: hb-c02-u0080
    text: I Finland används i dag valutan euro, som är den gemensamma valutan i euroområdet. I Finlands
      lagstiftning ska de direktiv och förordningar som utfärdas i EU beaktas. Som medlem i EU deltar
      Finland i Europas gemensamma utrikespolitik och ekonomiska politik. Också inom säkerhetspolitiken
      samarbetar Finland i hög grad med övriga EU-länder.
    sentences:
    - id: hb-c02-u0080-s001
      start: 0
      end: 82
    - id: hb-c02-u0080-s002
      start: 83
      end: 166
    - id: hb-c02-u0080-s003
      start: 167
      end: 257
    - id: hb-c02-u0080-s004
      start: 258
      end: 339
  - type: paragraph
    id: hb-c02-u0081
    text: Finland gick med i Europeiska unionen år 1995. År 2000 valdes Tarja Halonen till president i
      Finland. Hon var Finlands första kvinnliga president. Den gemensamma valutan euro togs i bruk i
      Finland 2002 och den finska marken slopades.
    sentences:
    - id: hb-c02-u0081-s001
      start: 0
      end: 46
    - id: hb-c02-u0081-s002
      start: 47
      end: 101
    - id: hb-c02-u0081-s003
      start: 102
      end: 146
    - id: hb-c02-u0081-s004
      start: 147
      end: 233
  - type: paragraph
    id: hb-c02-u0082
    text: År 2023 anslöt sig Finland till Nordatlantiska fördragsorganisationen Nato.
    sentences:
    - id: hb-c02-u0082-s001
      start: 0
      end: 75
  - type: paragraph
    id: hb-c02-u0083
    text: Den mest betydande effekten av medlemskapet är att Finland blev en del av Natos gemensamma försvar.
      Finland omfattas nu också av Natos säkerhetsgarantier. Enligt säkerhetsgarantierna är vart och ett
      av Natos medlemsländer skyldigt att hjälpa en allierad som blir föremål för angrepp.
    sentences:
    - id: hb-c02-u0083-s001
      start: 0
      end: 99
    - id: hb-c02-u0083-s002
      start: 100
      end: 154
    - id: hb-c02-u0083-s003
      start: 155
      end: 283
  - type: paragraph
    id: hb-c02-u0084
    text: Att Finland anslöt sig till Nato innebar också att landet inte längre är ett militärt neutralt
      land. I praktiken hade Finland redan länge samarbetat med Nato genom att till exempel delta i olika
      militära samövningar.
    sentences:
    - id: hb-c02-u0084-s001
      start: 0
      end: 100
    - id: hb-c02-u0084-s002
      start: 101
      end: 216
- id: hb-c02-utmaningar
  title: Ett föränderligt samhälle
  blocks:
  - type: paragraph
    id: hb-c02-u0085
    text: Det självständiga Finland fyllde hundra år 2017. På drygt hundra år har Finland genomgått stora
      förändringar. Ett jordbruksdominerat, fattigt land utvecklades till ett välmående, modernt samhälle.
      Finland blev en liberal demokrati, vars grundlag skyddar alla människors rättigheter. Finland är
      också en nordisk välfärdsstat, som garanterar grundläggande livsförutsättningar för alla sina invånare.
    sentences:
    - id: hb-c02-u0085-s001
      start: 0
      end: 48
    - id: hb-c02-u0085-s002
      start: 49
      end: 109
    - id: hb-c02-u0085-s003
      start: 110
      end: 196
    - id: hb-c02-u0085-s004
      start: 197
      end: 282
    - id: hb-c02-u0085-s005
      start: 283
      end: 397
  - type: paragraph
    id: hb-c02-u0086
    text: Även om förhållandena är goda, har Finland ändå olika utmaningar att lösa i dag och framöver
      i en värld som ständigt förändras. En av utmaningarna är en försämrad demografisk försörjningskvot.
      Med det avses att det i landet föds färre barn än tidigare, samtidigt som människorna lever allt
      längre. I Finland, liksom i övriga industriländer, finns det allt fler äldre och allt färre människor
      i arbetsför ålder i förhållande till befolkningen som helhet.
    sentences:
    - id: hb-c02-u0086-s001
      start: 0
      end: 127
    - id: hb-c02-u0086-s002
      start: 128
      end: 192
    - id: hb-c02-u0086-s003
      start: 193
      end: 297
    - id: hb-c02-u0086-s004
      start: 298
      end: 453
  - type: paragraph
    id: hb-c02-u0087
    text: Välfärdsstaten finansieras i huvudsak med skattemedel och därför är det av avgörande betydelse
      att det finns tillräckligt med skattebetalare. Man måste fundera på hur man i framtiden ska kunna
      erbjuda goda utbildnings-, social- och hälsovårdstjänster i Finland, när det finns allt färre människor
      i arbetsför ålder och skattebetalare och allt fler som är i behov av tjänster.
    sentences:
    - id: hb-c02-u0087-s001
      start: 0
      end: 141
    - id: hb-c02-u0087-s002
      start: 142
      end: 375
  - type: paragraph
    id: hb-c02-u0088
    text: En annan utmaning för Finland är att trygga en hållbar utveckling. Hållbar utveckling är lokal,
      regional och global utveckling som garanterar goda levnadsvillkor för nuvarande och kommande generationer.
      Hållbar utveckling är att minska fattigdom, minska ekonomisk ojämlikhet och skydda miljön globalt.
    sentences:
    - id: hb-c02-u0088-s001
      start: 0
      end: 66
    - id: hb-c02-u0088-s002
      start: 67
      end: 202
    - id: hb-c02-u0088-s003
      start: 203
      end: 301
  - type: paragraph
    id: hb-c02-u0089
    text: I Finland tillämpas FN:s handlingsprogram för hållbar utveckling, Agenda 2030. Det syftar till
      att bekämpa extrem fattigdom och till att skapa ett hållbart samhälle där miljön, ekonomin och människan
      beaktas på ett jämlikt sätt.
    sentences:
    - id: hb-c02-u0089-s001
      start: 0
      end: 78
    - id: hb-c02-u0089-s002
      start: 79
      end: 228
  - type: paragraph
    id: hb-c02-u0090
    text: Det finns ändå jobb kvar att göra. Målet är att konsumera mindre och mer ansvarsfullt och producera
      mindre avfall. Det är viktigt att minska koldioxidavtrycket från jordbruket, industrin och energiproduktionen
      och minska ojämlikheten mellan människorna.
    sentences:
    - id: hb-c02-u0090-s001
      start: 0
      end: 34
    - id: hb-c02-u0090-s002
      start: 35
      end: 114
    - id: hb-c02-u0090-s003
      start: 115
      end: 253
  - type: paragraph
    id: hb-c02-u0091
    text: Åtgärderna för att bromsa klimatförändringen måste ökas och effektiviseras. Finlands nordliga
      läge skyddar landet från de värsta extrema väderfenomenen som orsakas av klimatförändringen. Ändå
      lider naturen och näringarna av klimatförändringen, i synnerhet i Lappland. Det är också viktigt
      att vidta brådskande åtgärder för att stoppa förlusten av biologisk mångfald.
    sentences:
    - id: hb-c02-u0091-s001
      start: 0
      end: 75
    - id: hb-c02-u0091-s002
      start: 76
      end: 186
    - id: hb-c02-u0091-s003
      start: 187
      end: 267
    - id: hb-c02-u0091-s004
      start: 268
      end: 366
