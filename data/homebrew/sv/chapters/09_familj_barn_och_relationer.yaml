schema_version: 1
id: hb-c09
language: sv
title: Familj, barn och relationer
sections:
- id: hb-c09-forandring
  title: Familjer förr och nu
  blocks:
  - type: paragraph
    id: hb-c09-u0001
    text: Ofta har man den uppfattningen att en familj är detsamma som en barnfamilj, som består av föräldrar
      och minst ett barn. En sådan familj kallas i Finland för kärnfamilj. I Finland finns det också många
      andra slags familjer. Uppfattningen om hurdana de finländska familjerna är förändras hela tiden.
      Nuförtiden finns det i barnfamiljerna oftast ett eller två barn. Man får barn senare än tidigare.
      Det finns också många människor och par som inte har barn. Av dem är många frivilligt barnlösa.
      Andra i sin tur kan inte få barn även om de skulle vilja.
    sentences:
    - id: hb-c09-u0001-s001
      start: 0
      end: 119
    - id: hb-c09-u0001-s002
      start: 120
      end: 168
    - id: hb-c09-u0001-s003
      start: 169
      end: 222
    - id: hb-c09-u0001-s004
      start: 223
      end: 297
    - id: hb-c09-u0001-s005
      start: 298
      end: 362
    - id: hb-c09-u0001-s006
      start: 363
      end: 395
    - id: hb-c09-u0001-s007
      start: 396
      end: 454
    - id: hb-c09-u0001-s008
      start: 455
      end: 491
    - id: hb-c09-u0001-s009
      start: 492
      end: 549
  - type: paragraph
    id: hb-c09-u0002
    text: I det finska språket finns det olika ord för ”familj” och ”släkt”. Med dem avses olika saker,
      även om de hänger samman med varandra. Med familj avses i allmänhet familjemedlemmar som bor tillsammans
      eller en helhet bestående av föräldrar och barn. Släkt i sin tur betyder en större grupp av släktingar
      bestående av bland annat far- och morföräldrar, fastrar, mostrar, farbröder, morbröder och kusiner.
    sentences:
    - id: hb-c09-u0002-s001
      start: 0
      end: 66
    - id: hb-c09-u0002-s002
      start: 67
      end: 132
    - id: hb-c09-u0002-s003
      start: 133
      end: 247
    - id: hb-c09-u0002-s004
      start: 248
      end: 401
  - type: paragraph
    id: hb-c09-u0003
    text: Att familjerna blivit mindre beror delvis på att man i dag har bättre möjlighet att bestämma
      hur många barn man vill ha. Graviditetsprevention blev lättillgänglig på 1960-talet, och man började
      tala om familjeplanering. Det betyder att par själva kan påverka antalet barn när de använder preventivmedel.
      En bidragande orsak till att familjeplanering blivit vanligare är också att kvinnornas ställning
      har förbättrats.
    sentences:
    - id: hb-c09-u0003-s001
      start: 0
      end: 120
    - id: hb-c09-u0003-s002
      start: 121
      end: 219
    - id: hb-c09-u0003-s003
      start: 220
      end: 303
    - id: hb-c09-u0003-s004
      start: 304
      end: 417
  - type: paragraph
    id: hb-c09-u0004
    text: Urbaniseringen har kraftigt bidragit till att kulturen och familjerna har förändrats. Urbaniseringen
      skedde på 1900-talet i Finland, när många människor flyttade från landet till städerna för att söka
      arbete. År 1920 försörjde sig 70 procent av Finlands befolkning på jordbruk, men år 1975 var andelen
      bara 15 procent.
    sentences:
    - id: hb-c09-u0004-s001
      start: 0
      end: 85
    - id: hb-c09-u0004-s002
      start: 86
      end: 208
    - id: hb-c09-u0004-s003
      start: 209
      end: 318
  - type: paragraph
    id: hb-c09-u0005
    text: När folk flyttade till städerna fick de lönearbete, vanligtvis på en fabrik eller inom servicebranschen.
      Tack vare lönearbetet var de inte längre beroende av sina släktingar. Tidigare ansvarade familjen
      och släkten för det ekonomiska och sociala stödet. I och med urbaniseringen och välfärdsstatens
      utveckling övergick ansvaret från släkten till staten. Målet är att alla människor med hjälp av
      lönearbete och de stöd som staten beviljar ska ha möjlighet att klara sig, även om de inte skulle
      få hjälp av släktingar eller vänner.
    sentences:
    - id: hb-c09-u0005-s001
      start: 0
      end: 104
    - id: hb-c09-u0005-s002
      start: 105
      end: 174
    - id: hb-c09-u0005-s003
      start: 175
      end: 253
    - id: hb-c09-u0005-s004
      start: 254
      end: 353
    - id: hb-c09-u0005-s005
      start: 354
      end: 529
  - type: paragraph
    id: hb-c09-u0006
    text: Ogifta kvinnor fick rätt att bestämma över sina egna angelägenheter först i slutet av 1800-talet.
      Gifta kvinnor frigjordes helt och hållet från makens förmyndarskap år 1930.
    sentences:
    - id: hb-c09-u0006-s001
      start: 0
      end: 97
    - id: hb-c09-u0006-s002
      start: 98
      end: 173
  - type: paragraph
    id: hb-c09-u0007
    text: Äktenskap ingicks länge av förnuftsskäl, och släkten hade inflytande på valet av make. Redan
      på 1700-talet föreskrevs ändå att både mannen och kvinnan måste ge sitt frivilliga samtycke till
      äktenskapet. Mot slutet av 1800-talet började uppfattningen om att äktenskapet ska bygga på kärlek
      bli vanligare. Det var möjligt att vara ogift, men tidigare kunde det hända att kvinnor som förblev
      ogifta föraktades. Skilsmässor var ovanliga före andra världskriget, även om den lutherska kyrkan
      redan från början har möjliggjort skilsmässa i vissa fall.
    sentences:
    - id: hb-c09-u0007-s001
      start: 0
      end: 86
    - id: hb-c09-u0007-s002
      start: 87
      end: 202
    - id: hb-c09-u0007-s003
      start: 203
      end: 303
    - id: hb-c09-u0007-s004
      start: 304
      end: 407
    - id: hb-c09-u0007-s005
      start: 408
      end: 545
  - type: paragraph
    id: hb-c09-u0008
    text: 'Nedan finns en lista över viktiga lagar som gav kvinnor i Finland samma rättigheter som män:'
    sentences:
    - id: hb-c09-u0008-s001
      start: 0
      end: 92
  - id: hb-c09-u0010
    type: list
    ordered: false
    items:
    - id: hb-c09-u0009
      text: '1878: lika arvsrätt som för män'
      sentences:
      - id: hb-c09-u0009-s001
        start: 0
        end: 31
    - id: hb-c09-u0011
      text: '1906: rätt att rösta och kandidera i riksdagsval'
      sentences:
      - id: hb-c09-u0011-s001
        start: 0
        end: 48
    - id: hb-c09-u0012
      text: '1919: rätt att utöva en näring utan makens samtycke'
      sentences:
      - id: hb-c09-u0012-s001
        start: 0
        end: 51
    - id: hb-c09-u0013
      text: '1921: lagen om läroplikt, som garanterade både flickor och pojkar rätt att lära sig'
      sentences:
      - id: hb-c09-u0013-s001
        start: 0
        end: 83
    - id: hb-c09-u0014
      text: '1922: rätt att själv ingå arbetsavtal utan maken'
      sentences:
      - id: hb-c09-u0014-s001
        start: 0
        end: 48
    - id: hb-c09-u0015
      text: '1930: äktenskapslagen, som gjorde mannen och kvinnan jämställda i äktenskapet.'
      sentences:
      - id: hb-c09-u0015-s001
        start: 0
        end: 78
  - type: paragraph
    id: hb-c09-u0016
    text: Nuförtiden bestämmer både kvinnor och män själva hur de gör för att kombinera arbete och familjeliv.
      Någotsånär lika stor andel kvinnor och män förvärvsarbetar. Detta gäller också mammorna, med undantag
      av mammor med riktigt små barn. Männen i sin tur ansvarar i lika hög grad för hushållsarbetet och
      barnskötseln som kvinnorna, även om dessa sysslor i det praktiska livet inte alltid fördelas lika.
    sentences:
    - id: hb-c09-u0016-s001
      start: 0
      end: 100
    - id: hb-c09-u0016-s002
      start: 101
      end: 160
    - id: hb-c09-u0016-s003
      start: 161
      end: 234
    - id: hb-c09-u0016-s004
      start: 235
      end: 399
  - type: paragraph
    id: hb-c09-u0017
    text: I jordbrukssamhället utfördes många arbeten nära den egna gården. Barnen deltog i arbetet, och
      mammorna såg efter barnen vid sidan av sina sysslor. Också till exempel far- och morföräldrar som
      bodde i samma hushåll deltog i skötseln av barnen. Att kombinera arbete och familjeliv gick av sig
      själv.
    sentences:
    - id: hb-c09-u0017-s001
      start: 0
      end: 65
    - id: hb-c09-u0017-s002
      start: 66
      end: 147
    - id: hb-c09-u0017-s003
      start: 148
      end: 243
    - id: hb-c09-u0017-s004
      start: 244
      end: 298
  - type: paragraph
    id: hb-c09-u0018
    text: I och med industrialiseringen från och med mitten av 1800-talet blev det vanligare att kvinnor
      arbetade i fabriker i städerna. I de högre samhällsklasserna började unga kvinnor i sin tur i allt
      högre grad arbeta som till exempel lärare eller sjuksköterskor. Under 1900-talet blev det vanligare
      att gifta kvinnor arbetade utanför hemmet.
    sentences:
    - id: hb-c09-u0018-s001
      start: 0
      end: 126
    - id: hb-c09-u0018-s002
      start: 127
      end: 257
    - id: hb-c09-u0018-s003
      start: 258
      end: 336
  - type: paragraph
    id: hb-c09-u0019
    text: Under krigsåren 1939–1944 var männen vid fronten och kvinnorna utförde också männens arbete
      i fabrikerna och på lantgårdarna. Många kvinnor fortsatte med arbetet också efter kriget. I och
      med urbaniseringen och industrialiseringen var det redan på 1970-talet mycket vanligt att kvinnor
      förvärvsarbetade. Kommunerna började ordna dagvård för en del barn, vilket gjorde det lättare för
      kvinnor att arbeta.
    sentences:
    - id: hb-c09-u0019-s001
      start: 0
      end: 125
    - id: hb-c09-u0019-s002
      start: 126
      end: 181
    - id: hb-c09-u0019-s003
      start: 182
      end: 303
    - id: hb-c09-u0019-s004
      start: 304
      end: 403
  - type: paragraph
    id: hb-c09-u0020
    text: Att kvinnorna förvärvsarbetade påverkade hela familjen, när allt fler mammor arbetade utanför
      hemmet. Arbetet gav kvinnorna självständighet och egna pengar. När det blev vanligare att kvinnor
      utbildade sig och förvärvsarbetade fick de fler möjligheter att påverka sina egna och familjens
      angelägenheter.
    sentences:
    - id: hb-c09-u0020-s001
      start: 0
      end: 101
    - id: hb-c09-u0020-s002
      start: 102
      end: 156
    - id: hb-c09-u0020-s003
      start: 157
      end: 303
  - type: paragraph
    id: hb-c09-u0021
    text: Under de senaste hundra åren har samhället i Finland förändrats och blivit mer individuellt,
      liberalt och sekulariserat. I det jordbruksdominerade samhället var släkten, bygemenskapen och religionen
      kärnan i livet, och livet styrdes av starka moralregler. När människorna började arbeta i fabriker
      och på kontor och flyttade till städerna började fokus ligga mer på individen och hens val. När
      både kvinnor och män allt oftare hade ett lönearbete utanför hemmet, tog välfärdsstaten mer ansvar
      för att ta hand om de sjuka, de äldre och barnen. Människorna var inte längre lika beroende av stödet
      från släkten.
    sentences:
    - id: hb-c09-u0021-s001
      start: 0
      end: 120
    - id: hb-c09-u0021-s002
      start: 121
      end: 255
    - id: hb-c09-u0021-s003
      start: 256
      end: 389
    - id: hb-c09-u0021-s004
      start: 390
      end: 542
    - id: hb-c09-u0021-s005
      start: 543
      end: 608
  - type: paragraph
    id: hb-c09-u0022
    text: Nuförtiden är människorna i Finland vana vid att var och en får göra individuella val i sitt
      liv. Även om människorna inte längre har samma skyldighet att ta hand om sina släktingar, ansvarar
      individerna för andra genom att bidra till att upprätthålla välfärdssamhället. Det sker genom att
      betala skatter och till exempel utföra frivilligarbete. Tankesättet som framhäver individens friheter
      är också förknippat med att alla har samma rättigheter. Därför är det till exempel inte accepterat
      att favorisera släktingar i offentligt beslutsfattande.
    sentences:
    - id: hb-c09-u0022-s001
      start: 0
      end: 97
    - id: hb-c09-u0022-s002
      start: 98
      end: 270
    - id: hb-c09-u0022-s003
      start: 271
      end: 345
    - id: hb-c09-u0022-s004
      start: 346
      end: 447
    - id: hb-c09-u0022-s005
      start: 448
      end: 546
  - type: paragraph
    id: hb-c09-u0023
    text: Också i Finland är alla en del av en familj och en släkt och andra typer av grupper, till exempel
      en arbetsgemenskap, ett lokalsamhälle och i ett bredare perspektiv samhället. Som medlemmar i dessa
      grupper upplever människorna en känsla av gemenskap och tillhörighet. Var och en har också moraliska
      skyldigheter som en del av grupperna.
    sentences:
    - id: hb-c09-u0023-s001
      start: 0
      end: 175
    - id: hb-c09-u0023-s002
      start: 176
      end: 267
    - id: hb-c09-u0023-s003
      start: 268
      end: 336
  - type: paragraph
    id: hb-c09-u0024
    text: 'Individens frihet att göra egna val reflekteras också i de mänskliga relationerna: Alla oavsett
      kön får själva välja sin livskamrat. Också de unga bestämmer själva över sina kärleksrelationer
      och behöver inte be sina föräldrar eller andra släktingar om lov. Många finländare diskuterar visserligen
      sina beslut med släktingar, men människor respekterar vanligen familjens och individens privatliv.
      Släktingarna accepterar ändå inte alltid de val som en medlem av släkten gör. Det kan förstöra relationerna
      mellan släktingar också i Finland.'
    sentences:
    - id: hb-c09-u0024-s001
      start: 0
      end: 132
    - id: hb-c09-u0024-s002
      start: 133
      end: 257
    - id: hb-c09-u0024-s003
      start: 258
      end: 396
    - id: hb-c09-u0024-s004
      start: 397
      end: 474
    - id: hb-c09-u0024-s005
      start: 475
      end: 539
  - type: paragraph
    id: hb-c09-u0025
    text: Individens rätt till sina egna beslut och de förändrade idéerna om familj och parförhållanden
      har med tiden förändrat familjerna. Det är vanligt att människor har flera partner under sitt liv.
      Dessutom sällskapar människor ofta länge innan de flyttar ihop eller gifter sig. Ett fungerande
      parförhållande och kärlek anses vara viktiga grunder för lycka och lycka en viktig grund för familjen.
    sentences:
    - id: hb-c09-u0025-s001
      start: 0
      end: 129
    - id: hb-c09-u0025-s002
      start: 130
      end: 192
    - id: hb-c09-u0025-s003
      start: 193
      end: 273
    - id: hb-c09-u0025-s004
      start: 274
      end: 391
  - type: paragraph
    id: hb-c09-u0026
    text: På 1800-talet föddes kvinnosaksrörelsen i Europa och Förenta staterna. Den strävade till att
      främja likställdhet mellan kvinnor och män. I Finland fastslogs år 1864 en lag som befriade ogifta
      kvinnor från förmyndarskap. De fick alltså börja bestämma om sina egna angelägenheter. Men gifta
      kvinnor var fortfarande underställda sin mans förmyndarskap.
    sentences:
    - id: hb-c09-u0026-s001
      start: 0
      end: 70
    - id: hb-c09-u0026-s002
      start: 71
      end: 136
    - id: hb-c09-u0026-s003
      start: 137
      end: 219
    - id: hb-c09-u0026-s004
      start: 220
      end: 278
    - id: hb-c09-u0026-s005
      start: 279
      end: 349
  - type: paragraph
    id: hb-c09-u0027
    text: Enligt Finlands lag är föräldrarna förpliktade att ta hand om sina minderåriga barn ekonomiskt
      och gifta par om varandra. Familjemedlemmarnas underhållsskyldighet sträcker sig inte till släktingar,
      till exempel vuxna syskon eller mor- eller farföräldrar. I Finland utgår man alltså inte från att
      enskilda människor tar hand om sådana släktingar som har det dåligt ställt ekonomiskt. Stödet kommer
      från samhället i form av den sociala tryggheten.
    sentences:
    - id: hb-c09-u0027-s001
      start: 0
      end: 121
    - id: hb-c09-u0027-s002
      start: 122
      end: 254
    - id: hb-c09-u0027-s003
      start: 255
      end: 382
    - id: hb-c09-u0027-s004
      start: 383
      end: 445
- id: hb-c09-familjeformer
  title: Olika familjeformer
  blocks:
  - type: paragraph
    id: hb-c09-u0028
    text: Den vanligaste typen av barnfamilj i Finland är kärnfamiljen, det vill säga två föräldrar och
      deras gemensamma barn. Av föräldrarna i barnfamiljerna är största delen gifta med varandra. Andelen
      familjer där föräldrarna inte är gifta har ändå ökat i jämn takt. Endast en mycket liten del av
      människorna i Finland lever i familjer som består av fler än två generationer. Det innebär en familj
      där minst en far- eller morförälder bor tillsammans med sina barn och barnbarn.
    sentences:
    - id: hb-c09-u0028-s001
      start: 0
      end: 116
    - id: hb-c09-u0028-s002
      start: 117
      end: 185
    - id: hb-c09-u0028-s003
      start: 186
      end: 259
    - id: hb-c09-u0028-s004
      start: 260
      end: 368
    - id: hb-c09-u0028-s005
      start: 369
      end: 470
  - type: paragraph
    id: hb-c09-u0029
    text: När man pratar om familjer tänker man ofta på barnfamiljer. Det är ändå vanligt att en familj
      består av bara två vuxna. Alla par vill inte ha barn, och många är nöjda med sitt liv utan barn.
    sentences:
    - id: hb-c09-u0029-s001
      start: 0
      end: 59
    - id: hb-c09-u0029-s002
      start: 60
      end: 119
    - id: hb-c09-u0029-s003
      start: 120
      end: 190
  - type: paragraph
    id: hb-c09-u0030
    text: En del par får inga barn, även om de skulle vilja. För dem finns det fertilitetsbehandlingar
      som ökar sannolikheten att bli gravid och få barn. Par kan också överväga att adoptera ett barn.
      Ett adoptivbarn är biologiskt sett någon annans barn, men genom adoption, det vill säga att personen
      blir att betrakta som barn till de som adopterar, får hen nya föräldrar. I Finland adopteras barn
      ofta från utlandet. Adoptionsprocessen är fastställd i lag. Den börjar med en lagstadgad adoptionsrådgivning,
      där familjens livssituation kartläggs.
    sentences:
    - id: hb-c09-u0030-s001
      start: 0
      end: 50
    - id: hb-c09-u0030-s002
      start: 51
      end: 143
    - id: hb-c09-u0030-s003
      start: 144
      end: 189
    - id: hb-c09-u0030-s004
      start: 190
      end: 363
    - id: hb-c09-u0030-s005
      start: 364
      end: 408
    - id: hb-c09-u0030-s006
      start: 409
      end: 448
    - id: hb-c09-u0030-s007
      start: 449
      end: 537
  - type: paragraph
    id: hb-c09-u0031
    text: Man kan erbjuda ett barn eller en ung person ett hem också genom att bli familjehemsförälder.
      En familjehemsförälder öppnar sitt hem för ett barn som det av någon orsak inte är tryggt för att
      bo hos sina föräldrar. Barnet tas om hand av familjehemsföräldrarna tills vidare, ibland tills hen
      blir myndig.
    sentences:
    - id: hb-c09-u0031-s001
      start: 0
      end: 93
    - id: hb-c09-u0031-s002
      start: 94
      end: 214
    - id: hb-c09-u0031-s003
      start: 215
      end: 303
  - type: paragraph
    id: hb-c09-u0032
    text: När det finns barn i en familj men bara en vuxen, pratar man om en familj med en förälder. En
      ensamförsörjare är i allmänhet skild, änka eller änkling. Ibland har ensamförsörjaren skaffat barn
      på egen hand, det vill säga familjen har alltid bestått av bara en förälder. Kvinnor som bor ensamma
      kan i Finland få fertilitetsbehandling med spermier utan make.
    sentences:
    - id: hb-c09-u0032-s001
      start: 0
      end: 90
    - id: hb-c09-u0032-s002
      start: 91
      end: 151
    - id: hb-c09-u0032-s003
      start: 152
      end: 269
    - id: hb-c09-u0032-s004
      start: 270
      end: 356
  - type: paragraph
    id: hb-c09-u0033
    text: I familjer med en förälder bor en förälder med barnen utan make eller maka. Föräldern kan då
      ha antingen ensam eller gemensam vårdnad om barnet. Som ensamstående förälder har man själv ansvaret
      för fostran av barnet. Om föräldrarna däremot har gemensam vårdnad (yhteishuoltaja) kommer föräldrarna
      tillsammans överens om barnets angelägenheter.
    sentences:
    - id: hb-c09-u0033-s001
      start: 0
      end: 75
    - id: hb-c09-u0033-s002
      start: 76
      end: 144
    - id: hb-c09-u0033-s003
      start: 145
      end: 216
    - id: hb-c09-u0033-s004
      start: 217
      end: 343
  - type: paragraph
    id: hb-c09-u0034
    text: Det kan vara utmanande för en ensamförsörjare att kombinera barnomsorg och förvärvsarbete. Den
      ekonomiska situationen kan vara tuff, och det kan ibland vara psykiskt tungt att ensam ta hand om
      ett barn. Finska staten stöder ensamförsörjare, så att familjerna med en förälder inte ska vara
      i en svagare ställning än andra. Till exempel en del av FPA:s stöd innehåller ett ensamförsörjartillägg,
      det vill säga stödet för familjer med en förälder är lite högre än för familjer med två föräldrar.
    sentences:
    - id: hb-c09-u0034-s001
      start: 0
      end: 90
    - id: hb-c09-u0034-s002
      start: 91
      end: 202
    - id: hb-c09-u0034-s003
      start: 203
      end: 321
    - id: hb-c09-u0034-s004
      start: 322
      end: 492
  - type: paragraph
    id: hb-c09-u0035
    text: I Finland är det vanligt att människor som skilt sig hittar en ny partner, flyttar ihop och
      ofta också gifter sig på nytt. Med bonusfamilj avses en familj där det finns barn från den ena eller
      båda föräldrarnas tidigare förhållanden. I en bonusfamilj kan det också finnas gemensamma barn.
      Ofta kan barnen i en bonusfamilj ha två hem. Då bor barnen hos den andra föräldern en del av tiden.
    sentences:
    - id: hb-c09-u0035-s001
      start: 0
      end: 122
    - id: hb-c09-u0035-s002
      start: 123
      end: 233
    - id: hb-c09-u0035-s003
      start: 234
      end: 288
    - id: hb-c09-u0035-s004
      start: 289
      end: 333
    - id: hb-c09-u0035-s005
      start: 334
      end: 388
  - type: paragraph
    id: hb-c09-u0036
    text: I Finland kallas familjer med personer som hör till en sexuell minoritet eller en könsminoritet
      för regnbågsfamiljer. Regnbågen är en symbol för sexuella minoriteter och könsminoriteter. Det finns
      olika slags regnbågsfamiljer. I en familj kan det finnas till exempel två mammor och barn.
    sentences:
    - id: hb-c09-u0036-s001
      start: 0
      end: 117
    - id: hb-c09-u0036-s002
      start: 118
      end: 186
    - id: hb-c09-u0036-s003
      start: 187
      end: 226
    - id: hb-c09-u0036-s004
      start: 227
      end: 287
  - type: paragraph
    id: hb-c09-u0037
    text: Regnbågsfamiljer får barn på olika sätt. I Finland kan också lesbiska par få fertilitetsbehandlingar
      med donerade spermier. Den ena makan kan ha barn från ett tidigare förhållande. Man kan också få
      barn med till exempel en vän eller ett annat par så att fler än två vuxna deltar i barnets uppfostran.
    sentences:
    - id: hb-c09-u0037-s001
      start: 0
      end: 40
    - id: hb-c09-u0037-s002
      start: 41
      end: 123
    - id: hb-c09-u0037-s003
      start: 124
      end: 180
    - id: hb-c09-u0037-s004
      start: 181
      end: 300
  - type: paragraph
    id: hb-c09-u0038
    text: I Finland har det länge arbetats för att sexuella minoriteter och regnbågsfamiljer ska ha samma
      rättigheter som familjer som består av en man och en kvinna. Människornas attityder har så småningom
      blivit mer accepterande. Den jämställda äktenskapslagen som trädde i kraft år 2017 har förbättrat
      rättigheterna för regnbågsfamiljer och de barn som lever i sådana inför lagen.
    sentences:
    - id: hb-c09-u0038-s001
      start: 0
      end: 156
    - id: hb-c09-u0038-s002
      start: 157
      end: 221
    - id: hb-c09-u0038-s003
      start: 222
      end: 373
  - type: paragraph
    id: hb-c09-u0039
    text: Föräldrapartnerskap innebär att två personer beslutar sig för att bli föräldrar tillsammans
      utan att vara i ett parförhållande. Barnet bor ofta turvist hos båda föräldrarna.
    sentences:
    - id: hb-c09-u0039-s001
      start: 0
      end: 127
    - id: hb-c09-u0039-s002
      start: 128
      end: 173
  - type: paragraph
    id: hb-c09-u0040
    text: Ibland har föräldrapartnerna varit vänner redan innan de bestämmer sig för att bli föräldrar
      tillsammans. Ibland söker personer som bor ensamma och som vill ha barn å andra sidan avsiktligt
      efter en annan person i samma situation. Tanken är inte att hitta en romantisk partner, utan endast
      att uppfostra ett barn tillsammans. Föräldrapartnerskap är ännu ganska ovanligt, men en familjeform
      som blivit lite vanligare på senare tid.
    sentences:
    - id: hb-c09-u0040-s001
      start: 0
      end: 105
    - id: hb-c09-u0040-s002
      start: 106
      end: 230
    - id: hb-c09-u0040-s003
      start: 231
      end: 325
    - id: hb-c09-u0040-s004
      start: 326
      end: 430
  - type: paragraph
    id: hb-c09-u0041
    text: Det är vanligt att till exempel studerande bor själva i små enrummare. Förut var det vanligare
      att studerande bodde i gemensamma bostäder, där de delade kök och badrum med andra boende. En del
      väljer ändå att flytta ihop med kompisar. Att dela lägenhet kan till exempel göra det möjligt att
      bo i ett bostadsområde där det skulle vara för dyrt att bo på egen hand. Det ger också de boende
      en känsla av gemenskap.
    sentences:
    - id: hb-c09-u0041-s001
      start: 0
      end: 70
    - id: hb-c09-u0041-s002
      start: 71
      end: 185
    - id: hb-c09-u0041-s003
      start: 186
      end: 234
    - id: hb-c09-u0041-s004
      start: 235
      end: 363
    - id: hb-c09-u0041-s005
      start: 364
      end: 411
  - type: paragraph
    id: hb-c09-u0042
    text: Förutom unga bor också vuxna som inte har någon partner eller hemmaboende barn ensamma. I synnerhet
      äldre kvinnor bor ofta själva efter att deras make dött. Även om en person bor ensam, har hen i
      allmänhet närstående, till exempel föräldrar, vuxna barn, andra släktingar eller viktiga vänner.
      Att bo själv kan också vara förknippat med ensamhet.
    sentences:
    - id: hb-c09-u0042-s001
      start: 0
      end: 87
    - id: hb-c09-u0042-s002
      start: 88
      end: 156
    - id: hb-c09-u0042-s003
      start: 157
      end: 292
    - id: hb-c09-u0042-s004
      start: 293
      end: 345
  - type: paragraph
    id: hb-c09-u0043
    text: Gifta makar av samma kön har rätt att adoptera ett barn och rätt till adoption inom familjen.
      Adoption inom familjen betyder att makan/maken adopterar sin makas/makes barn och blir officiellt
      barnets andra förälder. I Finland kan ett barn ha högst två juridiska föräldrar.
    sentences:
    - id: hb-c09-u0043-s001
      start: 0
      end: 93
    - id: hb-c09-u0043-s002
      start: 94
      end: 215
    - id: hb-c09-u0043-s003
      start: 216
      end: 272
- id: hb-c09-kon
  title: Jämställdhet i familjens vardag
  blocks:
  - type: paragraph
    id: hb-c09-u0044
    text: Familjerna har en viktig roll när det gäller att öka jämställdheten. Den interna arbetsfördelningen
      i familjerna är i sig en jämställdhetsfråga. Dessutom har den betydelse för till exempel könens
      ställning på arbetsmarknaden. Å andra sidan har det stor betydelse för jämställdheten hur barnen
      uppfostras och huruvida flickor och pojkar behandlas på samma sätt i familjerna. De attityder och
      handlingsmönster som människor lärt sig som barn påverkar hur de agerar senare i livet.
    sentences:
    - id: hb-c09-u0044-s001
      start: 0
      end: 68
    - id: hb-c09-u0044-s002
      start: 69
      end: 144
    - id: hb-c09-u0044-s003
      start: 145
      end: 225
    - id: hb-c09-u0044-s004
      start: 226
      end: 373
    - id: hb-c09-u0044-s005
      start: 374
      end: 478
  - type: paragraph
    id: hb-c09-u0045
    text: Med stereotyp avses en förenklad och generaliserande uppfattning om hurdana vissa personer eller
      fenomen är. En stereotyp fokuserar på en viss egenskap, till exempel könet, nationaliteten eller
      åldern, hos en person. En stereotyp är alltså en generalisering av hurdana till exempel alla kvinnor,
      alla finländare eller alla tonåringar är.
    sentences:
    - id: hb-c09-u0045-s001
      start: 0
      end: 108
    - id: hb-c09-u0045-s002
      start: 109
      end: 216
    - id: hb-c09-u0045-s003
      start: 217
      end: 337
  - type: paragraph
    id: hb-c09-u0046
    text: Stereotyper om kön är mycket vanliga och syns inom många områden av livet. Människor har generaliserande
      uppfattningar om hurdana kvinnor och män är till sin natur och hur de beter sig. Stereotyper kan
      också gälla till exempel hurdana kläder kvinnor och män använder eller hurdana filmer de tycker
      om.
    sentences:
    - id: hb-c09-u0046-s001
      start: 0
      end: 74
    - id: hb-c09-u0046-s002
      start: 75
      end: 185
    - id: hb-c09-u0046-s003
      start: 186
      end: 301
  - type: paragraph
    id: hb-c09-u0047
    text: Utifrån stereotyper och andra föreställningar skapas normer i samhället. Normer är förväntningar
      om hurdana människor ska vara och hur de ska bete sig. Den könsnorm som råder i ett samhälle bestämmer
      alltså hurdant beteende som anses vara lämpligt för kvinnor och män.
    sentences:
    - id: hb-c09-u0047-s001
      start: 0
      end: 72
    - id: hb-c09-u0047-s002
      start: 73
      end: 151
    - id: hb-c09-u0047-s003
      start: 152
      end: 268
  - type: paragraph
    id: hb-c09-u0048
    text: En stereotyp om kvinnor kan vara ett antagande om att alla kvinnor är intresserade av sitt utseende
      och använder smink för att se vackrare ut. På motsvarande sätt kan en könsnorm bestämma att en kvinna
      måste använda smink och ta hand om sitt utseende. Då accepteras hon i samhället som en kvinna som
      följer normen.
    sentences:
    - id: hb-c09-u0048-s001
      start: 0
      end: 142
    - id: hb-c09-u0048-s002
      start: 143
      end: 251
    - id: hb-c09-u0048-s003
      start: 252
      end: 314
  - type: paragraph
    id: hb-c09-u0049
    text: Könsnormer skapar oskrivna regler för hur kvinnor och män ska bete sig. Brott mot dessa regler
      åtföljs ofta av någon form av socialt straff. Straffet kan vara lindrigt, till exempel förvåning,
      skratt eller ogillande. Det kan också vara strängare, till exempel skymf, diskriminering, utestängning
      från gemenskapen eller i extremfall till och med våld. Därför försöker människor i allmänhet agera
      i enlighet med normen.
    sentences:
    - id: hb-c09-u0049-s001
      start: 0
      end: 71
    - id: hb-c09-u0049-s002
      start: 72
      end: 140
    - id: hb-c09-u0049-s003
      start: 141
      end: 216
    - id: hb-c09-u0049-s004
      start: 217
      end: 350
    - id: hb-c09-u0049-s005
      start: 351
      end: 417
  - type: paragraph
    id: hb-c09-u0050
    text: Det finns ändå fortfarande många könsstereotyper och könsnormer i Finland som påverkar människors
      beteende. De har ofta negativa följder som försämrar människornas välbefinnande och utgör hinder
      för jämställdheten i praktiken.
    sentences:
    - id: hb-c09-u0050-s001
      start: 0
      end: 107
    - id: hb-c09-u0050-s002
      start: 108
      end: 226
  - type: paragraph
    id: hb-c09-u0051
    text: Könsstereotyper och könsnormer förändras över tid. De kan också vara olika i olika gemenskaper
      i Finland. Hur allvarliga de sociala straffen för brott mot normerna är varierar också. Många gånger
      upplever människor till exempel att det är lättare att bryta mot normer i de stora städerna än på
      små orter.
    sentences:
    - id: hb-c09-u0051-s001
      start: 0
      end: 50
    - id: hb-c09-u0051-s002
      start: 51
      end: 105
    - id: hb-c09-u0051-s003
      start: 106
      end: 182
    - id: hb-c09-u0051-s004
      start: 183
      end: 304
  - type: paragraph
    id: hb-c09-u0052
    text: Enligt en traditionell könsstereotyp tar kvinnorna hand om hushållsarbetet och barnen, medan
      männen försörjer familjen genom att arbeta utanför hemmet. Dessa stereotyper påverkar fortfarande
      arbetsfördelningen i familjerna också i Finland. Arbetsfördelningen har ändå blivit mer jämställd.
    sentences:
    - id: hb-c09-u0052-s001
      start: 0
      end: 151
    - id: hb-c09-u0052-s002
      start: 152
      end: 239
    - id: hb-c09-u0052-s003
      start: 240
      end: 289
  - type: paragraph
    id: hb-c09-u0053
    text: Statistiken visar att kvinnor fortfarande ägnar mer tid åt hushållsarbete än män. Männen i sin
      tur ägnar fortfarande mer tid åt förvärvsarbete än kvinnor. Kvinnorna ägnar ändå mindre tid åt hushållsarbete
      nuförtiden än för 30 år sedan. Männen i sin tur ägnar i dag mer tid åt hushållsarbete, i synnerhet
      barnskötsel och matlagning.
    sentences:
    - id: hb-c09-u0053-s001
      start: 0
      end: 81
    - id: hb-c09-u0053-s002
      start: 82
      end: 154
    - id: hb-c09-u0053-s003
      start: 155
      end: 235
    - id: hb-c09-u0053-s004
      start: 236
      end: 331
  - type: paragraph
    id: hb-c09-u0054
    text: Många familjer strävar efter att dela lika på hushållsarbetet och barnskötseln. Det främjar
      familjens välbefinnande. Å andra sidan anser man också att båda makarna ansvarar för att försörja
      familjen. På så vis klarar sig familjens ekonomi bättre om den ena maken skulle bli arbetslös eller
      sjuk. Både kvinnor och män känner mindre press när de inte ensamma ansvarar för å ena sidan hushållsarbetet
      och å andra sidan för att försörja familjen.
    sentences:
    - id: hb-c09-u0054-s001
      start: 0
      end: 79
    - id: hb-c09-u0054-s002
      start: 80
      end: 116
    - id: hb-c09-u0054-s003
      start: 117
      end: 199
    - id: hb-c09-u0054-s004
      start: 200
      end: 295
    - id: hb-c09-u0054-s005
      start: 296
      end: 442
  - type: paragraph
    id: hb-c09-u0055
    text: Könsstereotyper och könsnormer när det gäller arbetsfördelning är numera mindre starka än tidigare.
      Många anser i dag att också män kan vara omvårdande och att också kvinnor kan vara ambitiösa i sina
      karriärer. De könsnormer som gäller arbetsfördelningen inom familjerna syns ändå i dag till exempel
      i det att många fortfarande anser att det framför allt är mammans uppgift att ta hand om alldeles
      små spädbarn.
    sentences:
    - id: hb-c09-u0055-s001
      start: 0
      end: 99
    - id: hb-c09-u0055-s002
      start: 100
      end: 210
    - id: hb-c09-u0055-s003
      start: 211
      end: 411
  - type: paragraph
    id: hb-c09-u0056
    text: Barn tillägnar sig könsstereotyper och könsnormer redan när de är små. De attityder som en person
      tillägnat sig som barn har stor betydelse för vad hen anser om kön och jämställdhet som vuxen. I
      Finland strävar man efter att fostra barn i jämställdhet till exempel inom småbarnspedagogiken och
      i skolan. Ett barns kön ska inte definiera hurdan hen får vara och vad hen kan göra.
    sentences:
    - id: hb-c09-u0056-s001
      start: 0
      end: 70
    - id: hb-c09-u0056-s002
      start: 71
      end: 192
    - id: hb-c09-u0056-s003
      start: 193
      end: 303
    - id: hb-c09-u0056-s004
      start: 304
      end: 378
  - type: paragraph
    id: hb-c09-u0057
    text: En jämställd barnuppfostran kräver att de vuxna ägnar uppmärksamhet åt sitt beteende och sina
      attityder. Vuxna styr ofta obemärkt barn att bete sig enligt könsstereotyper och könsnormer. De
      kanske ger en flicka en docka och en pojke en leksaksbil utan att de tänker på det. På så sätt lär
      sig barnen att tänka att vissa saker av naturen hör till kvinnor och andra till män.
    sentences:
    - id: hb-c09-u0057-s001
      start: 0
      end: 104
    - id: hb-c09-u0057-s002
      start: 105
      end: 186
    - id: hb-c09-u0057-s003
      start: 187
      end: 273
    - id: hb-c09-u0057-s004
      start: 274
      end: 373
  - type: paragraph
    id: hb-c09-u0058
    text: Barns tankesätt påverkas av om de vuxna delar in vissa lekar, leksaker och kläder som typiska
      för flickor eller pojkar. En sådan indelning styr barnen att tillägna sig de könsstereotyper och
      könsnormer som människorna i samhället delar. Det kan i sin tur påverka till exempel vilket yrke
      de börjar studera till i framtiden.
    sentences:
    - id: hb-c09-u0058-s001
      start: 0
      end: 119
    - id: hb-c09-u0058-s002
      start: 120
      end: 236
    - id: hb-c09-u0058-s003
      start: 237
      end: 323
  - type: paragraph
    id: hb-c09-u0059
    text: Det är också skadligt för ett barns välbefinnande om hen upplever att hen är fel på något sätt.
      Vuxna kanske säger till en pojke att det inte är passande för honom att klä sig i en prinsessklänning.
      Nuförtiden strävar man i Finland till exempel inom småbarnspedagogiken efter att barnen fritt ska
      få uttrycka sig och prova på olika roller. Barnen måste få uppleva att de får vara precis som de
      är och tycka om precis de saker de tycker om.
    sentences:
    - id: hb-c09-u0059-s001
      start: 0
      end: 95
    - id: hb-c09-u0059-s002
      start: 96
      end: 198
    - id: hb-c09-u0059-s003
      start: 199
      end: 339
    - id: hb-c09-u0059-s004
      start: 340
      end: 439
  - type: paragraph
    id: hb-c09-u0060
    text: Det är ganska enkelt för vuxna att märka om de erbjuder barn leksaker utifrån deras kön. Det
      finns ändå också beteenden som det är svårare att lägga märke till. Vuxna kan till exempel oftare
      be flickor att hjälpa till med hushållssysslorna. De kanske låter pojkar springa och skrika, men
      uppmanar flickor att lugna ner sig och bete sig behärskat.
    sentences:
    - id: hb-c09-u0060-s001
      start: 0
      end: 88
    - id: hb-c09-u0060-s002
      start: 89
      end: 160
    - id: hb-c09-u0060-s003
      start: 161
      end: 240
    - id: hb-c09-u0060-s004
      start: 241
      end: 346
  - type: paragraph
    id: hb-c09-u0061
    text: När vuxna förväntar sig olika beteende av flickor och pojkar stärker de könsnormerna. Ofta lär
      sig flickorna ända från små att ta mer hänsyn till andra och ge andra mer utrymme. Pojkar i sin
      tur lär sig att ta risker och vara självsäkra. Dessa beteendemönster som man lär sig i barndomen
      inverkar på jämställdheten mellan könen i årtionden framöver.
    sentences:
    - id: hb-c09-u0061-s001
      start: 0
      end: 85
    - id: hb-c09-u0061-s002
      start: 86
      end: 177
    - id: hb-c09-u0061-s003
      start: 178
      end: 237
    - id: hb-c09-u0061-s004
      start: 238
      end: 349
- id: hb-c09-samlevnad
  title: Civilstånd och samboförhållande
  blocks:
  - type: paragraph
    id: hb-c09-u0062
    text: Civilstånd är en uppgift som införs i Finlands befolkningsdatasystem. Civilståndet anger om
      en person officiellt är i ett parförhållande eller inte. En persons civilstånd kan vara gift, ogift,
      skild, änka eller änkling, eller i registrerat parförhållande.
    sentences:
    - id: hb-c09-u0062-s001
      start: 0
      end: 69
    - id: hb-c09-u0062-s002
      start: 70
      end: 148
    - id: hb-c09-u0062-s003
      start: 149
      end: 255
  - type: paragraph
    id: hb-c09-u0063
    text: I Finland är det vanligt att par inte ingår äktenskap, även om de är tillsammans i ett stadigvarande
      förhållande. Om två makar inte är gifta men bor tillsammans, har de ett samboförhållande. Då är
      de sambor med varandra. Samboförhållande är inte ett officiellt civilstånd, det vill säga det anges
      inte i befolkningsdatasystemet.
    sentences:
    - id: hb-c09-u0063-s001
      start: 0
      end: 113
    - id: hb-c09-u0063-s002
      start: 114
      end: 190
    - id: hb-c09-u0063-s003
      start: 191
      end: 220
    - id: hb-c09-u0063-s004
      start: 221
      end: 328
  - type: paragraph
    id: hb-c09-u0064
    text: Inget skriftligt avtal ingås om ett samboförhållande. Inför lagen har sambor inte samma rättigheter
      och skyldigheter som gifta par. Sambor är inte underhållsskyldiga gentemot varandra, det vill säga
      den ena maken behöver inte försörja den andra om hen till exempel blir arbetslös. Om den ena maken
      dör, ärver inte den andra hen, om det inte finns ett testamente över arvet. Samborna kommer tillsammans
      överens om hur de delar på familjens inkomster och utgifter.
    sentences:
    - id: hb-c09-u0064-s001
      start: 0
      end: 53
    - id: hb-c09-u0064-s002
      start: 54
      end: 131
    - id: hb-c09-u0064-s003
      start: 132
      end: 280
    - id: hb-c09-u0064-s004
      start: 281
      end: 373
    - id: hb-c09-u0064-s005
      start: 374
      end: 462
  - type: paragraph
    id: hb-c09-u0065
    text: Barnets ställning är så gott som densamma oavsett om hens föräldrar är gifta eller inte. Barnet
      kan få vilket som helst av föräldrarnas efternamn och har rätt att ärva sina föräldrar och få familjepension
      om den ena föräldern dör. Båda föräldrarna är skyldiga att försörja sitt barn, även om de inte skulle
      vara gifta.
    sentences:
    - id: hb-c09-u0065-s001
      start: 0
      end: 88
    - id: hb-c09-u0065-s002
      start: 89
      end: 230
    - id: hb-c09-u0065-s003
      start: 231
      end: 318
  - type: paragraph
    id: hb-c09-u0066
    text: Ni kan ta ett gemensamt efternamn om
    sentences:
    - id: hb-c09-u0066-s001
      start: 0
      end: 36
  - id: hb-c09-u0068
    type: list
    ordered: false
    items:
    - id: hb-c09-u0067
      text: ni har gemensamma barn eller
      sentences:
      - id: hb-c09-u0067-s001
        start: 0
        end: 28
    - id: hb-c09-u0069
      text: om ni har bott tillsammans minst fem år.
      sentences:
      - id: hb-c09-u0069-s001
        start: 0
        end: 40
  - type: paragraph
    id: hb-c09-u0070
    text: Om ni bor stadigvarande tillsammans i samma bostad, hör ni till samma hushåll. Detta har betydelse
      om ni till exempel ansöker om bostadsbidrag från FPA.
    sentences:
    - id: hb-c09-u0070-s001
      start: 0
      end: 78
    - id: hb-c09-u0070-s002
      start: 79
      end: 152
  - type: paragraph
    id: hb-c09-u0071
    text: Ett samboförhållande upphör när parterna inte längre bor på samma adress. Upphörandet av samboförhållandet
      kan påverka till exempel de stöd som FPA betalar och barnens dagvårdsavgifter. Du ska själv meddela
      att samboförhållandet har upphört.
    sentences:
    - id: hb-c09-u0071-s001
      start: 0
      end: 73
    - id: hb-c09-u0071-s002
      start: 74
      end: 185
    - id: hb-c09-u0071-s003
      start: 186
      end: 241
  - type: paragraph
    id: hb-c09-u0072
    text: I ett samboförhållande behåller vardera part sin egen egendom. När samboförhållandet upphör
      delas egendomen vanligtvis så att båda parterna får sin egen egendom.
    sentences:
    - id: hb-c09-u0072-s001
      start: 0
      end: 62
    - id: hb-c09-u0072-s002
      start: 63
      end: 161
  - type: paragraph
    id: hb-c09-u0073
    text: Om samborna förvärvar egendom tillsammans ska båda parterna antecknas som köpare och alla kvitton
      sparas. Då delas denna egendom jämnt om samboförhållandet upphör. Om bara en av parterna står som
      köpare är denne ägare till egendomen när samboförhållandet upphör.
    sentences:
    - id: hb-c09-u0073-s001
      start: 0
      end: 105
    - id: hb-c09-u0073-s002
      start: 106
      end: 163
    - id: hb-c09-u0073-s003
      start: 164
      end: 262
  - type: paragraph
    id: hb-c09-u0074
    text: Sambor kan ha sådan egendom om vars ägande de inte har en överenskommelse. Då utgår man ifrån
      att båda äger en lika stor andel och denna egendom delas på hälft.
    sentences:
    - id: hb-c09-u0074-s001
      start: 0
      end: 74
    - id: hb-c09-u0074-s002
      start: 75
      end: 160
  - type: paragraph
    id: hb-c09-u0075
    text: I vissa fall kan den ena sambon få jämkning av den andra sambon när paret skiljer sig. En sambo
      kan få jämkning om han eller hon till exempel genom arbete hjälpt den andra sambon att utöka sin
      egendom och för att det därför skulle vara orättvist att fördela egendomen enbart baserat på ägarskapet.
    sentences:
    - id: hb-c09-u0075-s001
      start: 0
      end: 86
    - id: hb-c09-u0075-s002
      start: 87
      end: 297
  - type: paragraph
    id: hb-c09-u0076
    text: Sambor kan dock upprätta ett testamente (testamentti) för det fall att någon avlider. Genom
      testamente kan de säkerställa att en viss egendom, till exempel den gemensamma bostaden, ärvs av
      sambon. Sambor kan även upprätta ett skriftligt avtal om hur egendomen ska fördelas om paret går
      isär. Om du vill upprätta ett avtal eller ett testamente för fördelning av egendomen i ett samboförhållande,
      kan du be om råd till exempel vid rättshjälpsbyrån eller av en jurist.
    sentences:
    - id: hb-c09-u0076-s001
      start: 0
      end: 85
    - id: hb-c09-u0076-s002
      start: 86
      end: 196
    - id: hb-c09-u0076-s003
      start: 197
      end: 291
    - id: hb-c09-u0076-s004
      start: 292
      end: 465
- id: hb-c09-aktenskap
  title: Äktenskap och vigsel
  blocks:
  - type: paragraph
    id: hb-c09-u0077
    text: År 2023 var uppemot två miljoner av invånarna i Finland gifta. De hade alltså ingått äktenskap
      och var varandras makar. Äktenskap är ett förhållande mellan två människor som regleras i lag. Enligt
      lagen har makar rättigheter och skyldigheter. Makarna är jämlika i äktenskapet, det vill säga de
      har samma rättigheter och skyldigheter.
    sentences:
    - id: hb-c09-u0077-s001
      start: 0
      end: 62
    - id: hb-c09-u0077-s002
      start: 63
      end: 119
    - id: hb-c09-u0077-s003
      start: 120
      end: 189
    - id: hb-c09-u0077-s004
      start: 190
      end: 242
    - id: hb-c09-u0077-s005
      start: 243
      end: 333
  - type: paragraph
    id: hb-c09-u0078
    text: 'Du kan gifta dig om du:'
    sentences:
    - id: hb-c09-u0078-s001
      start: 0
      end: 23
  - id: hb-c09-u0080
    type: list
    ordered: false
    items:
    - id: hb-c09-u0079
      text: är minst 18 år gammal
      sentences:
      - id: hb-c09-u0079-s001
        start: 0
        end: 21
    - id: hb-c09-u0081
      text: inte är gift eller i registrerat parförhållande sedan tidigare.
      sentences:
      - id: hb-c09-u0081-s001
        start: 0
        end: 63
  - type: paragraph
    id: hb-c09-u0082
    text: Även samkönade par kan gifta sig i Finland.
    sentences:
    - id: hb-c09-u0082-s001
      start: 0
      end: 43
  - type: paragraph
    id: hb-c09-u0083
    text: Nära släktingar får inte gifta sig enligt Finlands lag.
    sentences:
    - id: hb-c09-u0083-s001
      start: 0
      end: 55
  - type: paragraph
    id: hb-c09-u0084
    text: Äktenskapet är alltid ett frivilligt val som ingen kan tvingas till. Till exempel föräldrarna
      får inte tvinga sitt barn att gifta sig. Att tvinga någon till äktenskap är ett brott i Finland.
    sentences:
    - id: hb-c09-u0084-s001
      start: 0
      end: 68
    - id: hb-c09-u0084-s002
      start: 69
      end: 134
    - id: hb-c09-u0084-s003
      start: 135
      end: 190
  - type: paragraph
    id: hb-c09-u0085
    text: I Finland kan kvinnor och män själva besluta vem de ska gifta sig med. Man behöver inte be om
      tillstånd från till exempel släktingar.
    sentences:
    - id: hb-c09-u0085-s001
      start: 0
      end: 70
    - id: hb-c09-u0085-s002
      start: 71
      end: 133
  - type: paragraph
    id: hb-c09-u0086
    text: Det har gjorts ändringar i Finlands äktenskapslag genom tiderna. Sedan 2017 är äktenskapslagen
      i Finland jämlik. Det betyder att också par av samma kön kan ingå äktenskap. Innan det här kunde
      manliga par och kvinnliga par bara registrera sitt parförhållande. Ett registrerat partnerskap var
      ett äktenskapslikt avtal där makarna ändå inte hade alla de rättigheter som makarna i ett äktenskap
      hade.
    sentences:
    - id: hb-c09-u0086-s001
      start: 0
      end: 64
    - id: hb-c09-u0086-s002
      start: 65
      end: 112
    - id: hb-c09-u0086-s003
      start: 113
      end: 171
    - id: hb-c09-u0086-s004
      start: 172
      end: 258
    - id: hb-c09-u0086-s005
      start: 259
      end: 396
  - type: paragraph
    id: hb-c09-u0087
    text: Enligt lag kan en person gifta sig om det inte finns något hinder för hen att ingå äktenskap.
      Innan ett par kan gifta sig utreder en myndighet om det finns hinder för äktenskapet. Om det inte
      finns några hinder, får paret ett intyg om hindersprövning.
    sentences:
    - id: hb-c09-u0087-s001
      start: 0
      end: 93
    - id: hb-c09-u0087-s002
      start: 94
      end: 179
    - id: hb-c09-u0087-s003
      start: 180
      end: 251
  - type: paragraph
    id: hb-c09-u0088
    text: Förlovning är ett frivilligt och fritt avtal om att ett par senare ska gifta sig. En förlovning
      är inte ett juridiskt avtal och förpliktar inte någon till någonting inför lagen. Lagen kräver inte
      att en förlovning har en viss längd före äktenskapet. Som tecken på förlovningen skaffar par ofta
      förlovningsringar.
    sentences:
    - id: hb-c09-u0088-s001
      start: 0
      end: 81
    - id: hb-c09-u0088-s002
      start: 82
      end: 177
    - id: hb-c09-u0088-s003
      start: 178
      end: 249
    - id: hb-c09-u0088-s004
      start: 250
      end: 312
  - type: paragraph
    id: hb-c09-u0089
    text: Par kan fritt bryta en förlovning om den ena eller båda parterna vill det. Man behöver inte
      meddela myndigheterna om att man bryter förlovningen.
    sentences:
    - id: hb-c09-u0089-s001
      start: 0
      end: 74
    - id: hb-c09-u0089-s002
      start: 75
      end: 145
  - type: paragraph
    id: hb-c09-u0090
    text: En borgerlig vigsel kan ske antingen på ett verksamhetsställe för Myndigheten för digitalisering
      och befolkningsdata eller i en tingsrätt. Paret vigs av en tjänsteman med vigselrätt. Tjänstemannen
      kan komma för att viga par också på andra ställen, men det är avgiftsbelagt.
    sentences:
    - id: hb-c09-u0090-s001
      start: 0
      end: 138
    - id: hb-c09-u0090-s002
      start: 139
      end: 182
    - id: hb-c09-u0090-s003
      start: 183
      end: 273
  - type: paragraph
    id: hb-c09-u0091
    text: En kyrklig vigsel kan förrättas av en präst inom den evangelisk-lutherska eller den ortodoxa
      kyrkan. En kyrklig vigsel kan förrättas också av en annan representant för ett religiöst samfund
      registrerat i Finland som Myndigheten för digitalisering och befolkningsdata har beviljat vigselrätt.
      Ett äktenskap som ingåtts inom ett religiöst samfund är officiellt endast om paret vigs av en person
      med officiell vigselrätt. Dessutom måste en prövning av hinder för äktenskapet ha gjorts före vigseln.
    sentences:
    - id: hb-c09-u0091-s001
      start: 0
      end: 100
    - id: hb-c09-u0091-s002
      start: 101
      end: 291
    - id: hb-c09-u0091-s003
      start: 292
      end: 418
    - id: hb-c09-u0091-s004
      start: 419
      end: 495
  - type: paragraph
    id: hb-c09-u0092
    text: Båda makarna måste vara på plats vid vigseltillfället. Dessutom ska minst två vittnen som har
      fyllt 15 år vara på plats.
    sentences:
    - id: hb-c09-u0092-s001
      start: 0
      end: 54
    - id: hb-c09-u0092-s002
      start: 55
      end: 120
  - type: paragraph
    id: hb-c09-u0093
    text: Alla har rätt till borgerlig vigsel, även de som tillhör ett trossamfund.
    sentences:
    - id: hb-c09-u0093-s001
      start: 0
      end: 73
  - type: paragraph
    id: hb-c09-u0094
    text: När ett par gifter sig kan de om de vill ta ett gemensamt efternamn. Det var länge vanligt att
      kvinnan tog mannens efternamn. Namnlagen, som var i kraft från år 1930 till år 1986, gjorde detta
      obligatoriskt. I dag är det möjligt för mannen att ta kvinnans efternamn. Båda kan också behålla
      sina efternamn, eller så kan paret ta ett helt nytt, gemensamt efternamn. Om de vill kan den ena
      eller båda makarna kombinera sitt eget namn med den andras namn.
    sentences:
    - id: hb-c09-u0094-s001
      start: 0
      end: 68
    - id: hb-c09-u0094-s002
      start: 69
      end: 125
    - id: hb-c09-u0094-s003
      start: 126
      end: 207
    - id: hb-c09-u0094-s004
      start: 208
      end: 266
    - id: hb-c09-u0094-s005
      start: 267
      end: 363
    - id: hb-c09-u0094-s006
      start: 364
      end: 451
- id: hb-c09-makar
  title: Makars rättigheter, egendom och skulder
  blocks:
  - type: paragraph
    id: hb-c09-u0095
    text: Vardera maken har rätt att själv besluta om sitt deltagande i förvärvsarbete samt i samhällelig
      och annan verksamhet utanför familjen.
    sentences:
    - id: hb-c09-u0095-s001
      start: 0
      end: 134
  - type: paragraph
    id: hb-c09-u0096
    text: Vardera maken ska efter förmåga bidra till familjens gemensamma hushåll och makarnas underhåll.
      Om den ena maken inte förvärvsarbetar ska den förmögnare maken stå för kostnader för till exempel
      mat och kläder.
    sentences:
    - id: hb-c09-u0096-s001
      start: 0
      end: 95
    - id: hb-c09-u0096-s002
      start: 96
      end: 209
  - type: paragraph
    id: hb-c09-u0097
    text: Enligt lagen har varje människa sexuell självbestämmanderätt i äktenskapet och alla parförhållanden.
      Om en person tvingar en annan till könsumgänge, är det fråga om våldtäkt. Det är ett brott i äktenskapet
      och också utanför det. Också våld i parrelationer är ett brott i Finland. Man får aldrig slå eller
      skada sin make på något sätt.
    sentences:
    - id: hb-c09-u0097-s001
      start: 0
      end: 100
    - id: hb-c09-u0097-s002
      start: 101
      end: 174
    - id: hb-c09-u0097-s003
      start: 175
      end: 228
    - id: hb-c09-u0097-s004
      start: 229
      end: 279
    - id: hb-c09-u0097-s005
      start: 280
      end: 334
  - type: paragraph
    id: hb-c09-u0098
    text: Man har rätt att få information om sin makes hälsotillstånd av till exempel en läkare endast
      med makens samtycke. En make kan bestämma om sin mans eller hustrus vård endast under exceptionella
      omständigheter.
    sentences:
    - id: hb-c09-u0098-s001
      start: 0
      end: 113
    - id: hb-c09-u0098-s002
      start: 114
      end: 208
  - type: paragraph
    id: hb-c09-u0099
    text: Makarna i ett äktenskap kan ha gemensam egendom, men också egen egendom. Den ena maken kan till
      exempel inte sälja den andra makens egendom. Den ena maken kan inte heller sälja det gemensamma
      hemmet eller lösöre utan den andras lov.
    sentences:
    - id: hb-c09-u0099-s001
      start: 0
      end: 72
    - id: hb-c09-u0099-s002
      start: 73
      end: 140
    - id: hb-c09-u0099-s003
      start: 141
      end: 232
  - type: paragraph
    id: hb-c09-u0100
    text: Vardera maken ansvarar ensam för den skuld som de har tagit före äktenskapet eller under det.
      Om den ena maken har tagit lån för att försörja familjen, till exempel för att köpa mat, ansvarar
      båda makarna för denna skuld. Om makarna vill, kan de åta sig gemensamma skulder. Då måste de också
      återbetala skulderna tillsammans.
    sentences:
    - id: hb-c09-u0100-s001
      start: 0
      end: 93
    - id: hb-c09-u0100-s002
      start: 94
      end: 221
    - id: hb-c09-u0100-s003
      start: 222
      end: 273
    - id: hb-c09-u0100-s004
      start: 274
      end: 325
  - type: paragraph
    id: hb-c09-u0101
    text: Makarnas ekonomiska ställning sinsemellan tryggas genom giftorätten. Giftorätt betyder att makarnas
      hela egendom räknas ihop och delas på hälften mellan båda vid en skilsmässa. Om den ena maken dör,
      räknas den döda makens och änkans eller änklingens egendomar ihop och delas före arvskiftet. Giftorätten
      kan inte upphävas genom testamente, men den kan upphävas eller begränsas med ett äktenskapsförord.
    sentences:
    - id: hb-c09-u0101-s001
      start: 0
      end: 68
    - id: hb-c09-u0101-s002
      start: 69
      end: 176
    - id: hb-c09-u0101-s003
      start: 177
      end: 291
    - id: hb-c09-u0101-s004
      start: 292
      end: 402
  - type: paragraph
    id: hb-c09-u0102
    text: Giftorätten träder i kraft först när ett äktenskap upphör. Under äktenskapet hör en egendom
      till den make i vars namn den står. Makarna är ändå skyldiga att förvalta den egendom som omfattas
      av giftorätten på ett sådant sätt att dess värde inte minskar i onödan.
    sentences:
    - id: hb-c09-u0102-s001
      start: 0
      end: 58
    - id: hb-c09-u0102-s002
      start: 59
      end: 127
    - id: hb-c09-u0102-s003
      start: 128
      end: 262
  - type: paragraph
    id: hb-c09-u0103
    text: Om makarna vill hålla sina egendomar åtskilda, kan de upprätta ett äktenskapsförord. I ett äktenskapsförord
      kan man avtala om att giftorätten inte gäller eller att den till exempel gäller endast en del av
      makarnas egendom. Med ett äktenskapsförord kommer makarna alltså överens om hur deras egendom ska
      delas om den ena dör eller det blir skilsmässa.
    sentences:
    - id: hb-c09-u0103-s001
      start: 0
      end: 84
    - id: hb-c09-u0103-s002
      start: 85
      end: 222
    - id: hb-c09-u0103-s003
      start: 223
      end: 350
  - type: paragraph
    id: hb-c09-u0104
    text: Äktenskapsförord är frivilligt. Med äktenskapsförord kan makarna utesluta giftorätten till den
      andras egendom antingen helt eller delvis om de skiljer sig eller om den ena av makarna dör. Äktenskapsförord
      kan upprättas före äktenskapet eller under det. Båda makarna ska underteckna äktenskapsförordet
      och två ojäviga vittnen ska vidimera underskrifterna. För att äktenskapsförordet ska träda i kraft,
      måste det registreras hos Myndigheten för digitalisering och befolkningsdata.
    sentences:
    - id: hb-c09-u0104-s001
      start: 0
      end: 31
    - id: hb-c09-u0104-s002
      start: 32
      end: 187
    - id: hb-c09-u0104-s003
      start: 188
      end: 252
    - id: hb-c09-u0104-s004
      start: 253
      end: 354
    - id: hb-c09-u0104-s005
      start: 355
      end: 478
  - type: paragraph
    id: hb-c09-u0105
    text: Vanligtvis delas egendomen vid skilsmässa jämnt mellan makarna. I undantagsfall delas egendomen
      inte jämnt. Då kan bodelningen jämkas. Detta betyder att man i situationen beaktar vad som är rimligt.
      Om äktenskapet till exempel har varat under fem år delas egendomen inte nödvändigtvis jämnt.
    sentences:
    - id: hb-c09-u0105-s001
      start: 0
      end: 63
    - id: hb-c09-u0105-s002
      start: 64
      end: 107
    - id: hb-c09-u0105-s003
      start: 108
      end: 134
    - id: hb-c09-u0105-s004
      start: 135
      end: 198
    - id: hb-c09-u0105-s005
      start: 199
      end: 291
  - type: paragraph
    id: hb-c09-u0106
    text: Bodelningen kan jämkas endast om någon av makarna separat kräver det.
    sentences:
    - id: hb-c09-u0106-s001
      start: 0
      end: 69
- id: hb-c09-skilsmassa
  title: Skilsmässa och bodelning
  blocks:
  - type: paragraph
    id: hb-c09-u0107
    text: Skilsmässa betyder att ett äktenskap upplöses. Makarna kan ansöka om skilsmässa tillsammans,
      eller så kan den ena maken ansöka på egen hand. För en skilsmässa behövs inte bådas samtycke och
      inga särskilda förklaringar. Man ansöker om skilsmässa skriftligt hos en tingsrätt. Rätten utreder
      inte varför makarna ansöker om skilsmässa.
    sentences:
    - id: hb-c09-u0107-s001
      start: 0
      end: 46
    - id: hb-c09-u0107-s002
      start: 47
      end: 140
    - id: hb-c09-u0107-s003
      start: 141
      end: 218
    - id: hb-c09-u0107-s004
      start: 219
      end: 273
    - id: hb-c09-u0107-s005
      start: 274
      end: 331
  - type: paragraph
    id: hb-c09-u0108
    text: Ansökan om skilsmässa görs i två steg. Först lämnar man in skilsmässoansökan. Efter betänketiden
      fullföljer man sin ansökan med en ny ansökan. Domstolen dömer till skilsmässa först efter att den
      andra ansökan har lämnats in. Parterna döms till skilsmässa även om den andra parten motsätter sig
      det.
    sentences:
    - id: hb-c09-u0108-s001
      start: 0
      end: 38
    - id: hb-c09-u0108-s002
      start: 39
      end: 77
    - id: hb-c09-u0108-s003
      start: 78
      end: 142
    - id: hb-c09-u0108-s004
      start: 143
      end: 224
    - id: hb-c09-u0108-s005
      start: 225
      end: 298
  - type: paragraph
    id: hb-c09-u0109
    text: När den första ansökan om skilsmässa har lämnats in börjar en sex månader lång betänketid. Betänketiden
      är obligatorisk, förutom om du och din maka/make har bott på skilda adresser de senaste två åren.
    sentences:
    - id: hb-c09-u0109-s001
      start: 0
      end: 90
    - id: hb-c09-u0109-s002
      start: 91
      end: 201
  - type: paragraph
    id: hb-c09-u0110
    text: Om du och din maka/make ansöker om skilsmässa tillsammans, börjar betänketiden direkt när er
      gemensamma ansökan har kommit in hos tingsrätten.
    sentences:
    - id: hb-c09-u0110-s001
      start: 0
      end: 142
  - type: paragraph
    id: hb-c09-u0111
    text: Om en av makarna ensam ansöker om skilsmässa, börjar betänketiden från den dag då ansökan delges
      den andra makan. Tingsrätten ser till att ansökan delges den andra makan.
    sentences:
    - id: hb-c09-u0111-s001
      start: 0
      end: 113
    - id: hb-c09-u0111-s002
      start: 114
      end: 170
  - type: paragraph
    id: hb-c09-u0112
    text: Det är viktigt att lämna in den andra ansökan om skilsmässa inom ett år efter att betänketiden
      började. I annat fall förfaller ärendet.
    sentences:
    - id: hb-c09-u0112-s001
      start: 0
      end: 103
    - id: hb-c09-u0112-s002
      start: 104
      end: 135
  - type: paragraph
    id: hb-c09-u0113
    text: I samband med en skilsmässa görs en avvittring av egendom, det vill säga parets egendom delas
      enligt antingen äktenskapslagen eller ett äktenskapsförord. Ibland uppstår det bråk om egendom eller
      barnen vid en skilsmässa. Då kan paret behöva juridisk hjälp.
    sentences:
    - id: hb-c09-u0113-s001
      start: 0
      end: 153
    - id: hb-c09-u0113-s002
      start: 154
      end: 220
    - id: hb-c09-u0113-s003
      start: 221
      end: 256
  - type: paragraph
    id: hb-c09-u0114
    text: Nuförtiden är skilsmässor vanliga i Finland, och människor är inte tvungna att stanna i ett
      olyckligt äktenskap. En skilsmässa är ingen skam i Finland. Det är också vanligt att människor gifter
      sig på nytt med en ny partner.
    sentences:
    - id: hb-c09-u0114-s001
      start: 0
      end: 112
    - id: hb-c09-u0114-s002
      start: 113
      end: 151
    - id: hb-c09-u0114-s003
      start: 152
      end: 224
  - type: paragraph
    id: hb-c09-u0115
    text: Bodelningen vid skilsmässa kan vara en komplicerad process. Ni kan tillsammans komma överens
      om hur ni delar era tillgångar och skulder. Ni kan också be om hjälp av en jurist.
    sentences:
    - id: hb-c09-u0115-s001
      start: 0
      end: 59
    - id: hb-c09-u0115-s002
      start: 60
      end: 136
    - id: hb-c09-u0115-s003
      start: 137
      end: 175
  - type: paragraph
    id: hb-c09-u0116
    text: Om ni har bolån är det viktigt att komma överens om hur ni delar lånet. Ni kan också tillsammans
      bestämma vem av er som får bo kvar i det gemensamma hemmet tills vidare.
    sentences:
    - id: hb-c09-u0116-s001
      start: 0
      end: 71
    - id: hb-c09-u0116-s002
      start: 72
      end: 169
  - type: paragraph
    id: hb-c09-u0117
    text: Om ni inte kan komma överens om hur ni ska dela upp egendomen, kan vem som helst av makarna
      kräva egendomsfördelning, det vill säga bodelning (ositus). Bodelningen kan göras direkt när man
      har lämnat in den första skilsmässoansökan. Man behöver alltså inte vänta tills betänketiden på
      sex månader har gått ut.
    sentences:
    - id: hb-c09-u0117-s001
      start: 0
      end: 151
    - id: hb-c09-u0117-s002
      start: 152
      end: 232
    - id: hb-c09-u0117-s003
      start: 233
      end: 309
  - type: paragraph
    id: hb-c09-u0118
    text: När ni kräver bodelning förordnar tingsrätten en bodelningsman som delar egendomen. Bodelningsmannen
      tar betalt för arbetet.
    sentences:
    - id: hb-c09-u0118-s001
      start: 0
      end: 83
    - id: hb-c09-u0118-s002
      start: 84
      end: 124
  - type: paragraph
    id: hb-c09-u0119
    text: När bodelningen inleds ska man utreda hur mycket egendom och skulder vardera maka har.
    sentences:
    - id: hb-c09-u0119-s001
      start: 0
      end: 86
  - type: paragraph
    id: hb-c09-u0120
    text: Om du eller din maka/make kommer från något annat land än Finland kan vissa rättsliga frågor
      påverkas av lagarna i ett annat land.
    sentences:
    - id: hb-c09-u0120-s001
      start: 0
      end: 130
  - type: paragraph
    id: hb-c09-u0121
    text: Du kan be om råd av en jurist som har erfarenhet av denna typ av ärenden.
    sentences:
    - id: hb-c09-u0121-s001
      start: 0
      end: 73
  - type: paragraph
    id: hb-c09-u0122
    text: Om ditt äktenskap slutar med skilsmässa, ändras inte ditt efternamn. Om du vill kan du ta ett
      annat efternamn. Du kan till exempel ta vilket som helst namn som du har haft tidigare.
    sentences:
    - id: hb-c09-u0122-s001
      start: 0
      end: 68
    - id: hb-c09-u0122-s002
      start: 69
      end: 110
    - id: hb-c09-u0122-s003
      start: 111
      end: 181
  - type: paragraph
    id: hb-c09-u0123
    text: När ni överväger skilsmässa och behöver hjälp med att komma överens om saker och ting, kan ni
      ansöka om medling i familjefrågor (perheasioiden sovittelu). Medling kan ofta vara nyttig och hjälpa
      er att komma överens i olika frågor utan rättegång. Man kan till exempel prata om barnens situation
      i medlingen.
    sentences:
    - id: hb-c09-u0123-s001
      start: 0
      end: 154
    - id: hb-c09-u0123-s002
      start: 155
      end: 246
    - id: hb-c09-u0123-s003
      start: 247
      end: 307
  - type: paragraph
    id: hb-c09-u0124
    text: Vid problem i parförhållandet kan du söka hjälp till exempel hos fostrings- och familjerådgivningen
      (kasvatus- ja perheneuvonta) eller social- och hälsocentralen (sosiaali- ja terveyskeskus).
    sentences:
    - id: hb-c09-u0124-s001
      start: 0
      end: 191
  - type: paragraph
    id: hb-c09-u0125
    text: Vid en skilsmässa kan det uppstå frågor kring uppehållstillståndet, egendomen, underhållsbidraget
      eller barnets boende, vårdnad och umgänge. I juridiska ärenden får du hjälp av en jurist. Hen ger
      dig råd och ser till att dina rättigheter tillvaratas. Du kan vända dig till en jurist även om det
      uppstår tvister i samband med skilsmässan.
    sentences:
    - id: hb-c09-u0125-s001
      start: 0
      end: 140
    - id: hb-c09-u0125-s002
      start: 141
      end: 187
    - id: hb-c09-u0125-s003
      start: 188
      end: 250
    - id: hb-c09-u0125-s004
      start: 251
      end: 337
  - type: paragraph
    id: hb-c09-u0126
    text: Juridisk rådgivning erbjuds av advokatbyråer, juridiska byråer och statens rättshjälpsbyråer,
      där offentliga rättsbiträden arbetar.
    sentences:
    - id: hb-c09-u0126-s001
      start: 0
      end: 131
  - type: paragraph
    id: hb-c09-u0127
    text: Juristtjänsterna är avgiftsbelagda men om du har låg eller medelhög inkomst, kan du få gratis
      eller delvis ersättningsgill juridisk hjälp vid statens rättshjälpsbyrå. Den offentliga rättshjälpen
      finns även tillgänglig på engelska och vid behov kan man använda tolktjänster. Offentlig rättshjälp
      söks vid statens rättshjälpsbyråer.
    sentences:
    - id: hb-c09-u0127-s001
      start: 0
      end: 166
    - id: hb-c09-u0127-s002
      start: 167
      end: 273
    - id: hb-c09-u0127-s003
      start: 274
      end: 330
  - type: paragraph
    id: hb-c09-u0128
    text: Om du har en rättsskyddsförsäkring som ersätter dina utgifter, kan du inte få offentlig rättshjälp.
      Ofta ingår rättsskyddsförsäkringen i hemförsäkringen.
    sentences:
    - id: hb-c09-u0128-s001
      start: 0
      end: 99
    - id: hb-c09-u0128-s002
      start: 100
      end: 153
- id: hb-c09-vardnad
  title: Barnets boende, vårdnad och umgänge
  blocks:
  - type: paragraph
    id: hb-c09-u0129
    text: 'Om familjen har barn under 18 år och äktenskapet slutar ska föräldrarna i samband med skilsmässan
      komma överens om följande:'
    sentences:
    - id: hb-c09-u0129-s001
      start: 0
      end: 124
  - id: hb-c09-u0131
    type: list
    ordered: false
    items:
    - id: hb-c09-u0130
      text: Var ska barnet bo?
      sentences:
      - id: hb-c09-u0130-s001
        start: 0
        end: 18
    - id: hb-c09-u0132
      text: Vem är barnets vårdnadshavare?
      sentences:
      - id: hb-c09-u0132-s001
        start: 0
        end: 30
    - id: hb-c09-u0133
      text: Hur ordnas umgänget?
      sentences:
      - id: hb-c09-u0133-s001
        start: 0
        end: 20
    - id: hb-c09-u0134
      text: Underhållsbidrag.
      sentences:
      - id: hb-c09-u0134-s001
        start: 0
        end: 17
  - type: paragraph
    id: hb-c09-u0135
    text: När föräldrarna har kommit överens om barnets boende, vårdnad, umgängesrätt och underhållsbidrag
      kan barnatillsyningsmannen (lastenvalvoja) på din ort bekräfta avtalet. När barnatillsyningsmannen
      bekräftar avtalet är det lika officiellt som ett domstolsbeslut.
    sentences:
    - id: hb-c09-u0135-s001
      start: 0
      end: 168
    - id: hb-c09-u0135-s002
      start: 169
      end: 260
  - type: paragraph
    id: hb-c09-u0136
    text: Om ni inte kan komma överens om boende, vårdnad, umgänge och underhåll kan ni ansöka om medling
      i familjefrågor (perheasioiden sovittelu). Om ni inte får fram ett avtal där heller, måste ni låta
      tingsrätten lösa tvisten. Domstolen tar hänsyn till barnets intressen och dess egna önskemål.
    sentences:
    - id: hb-c09-u0136-s001
      start: 0
      end: 138
    - id: hb-c09-u0136-s002
      start: 139
      end: 220
    - id: hb-c09-u0136-s003
      start: 221
      end: 288
  - type: paragraph
    id: hb-c09-u0137
    text: Låt alltid barnets intressen gå först när ni beslutar om boendet.
    sentences:
    - id: hb-c09-u0137-s001
      start: 0
      end: 65
  - type: paragraph
    id: hb-c09-u0138
    text: Officiellt kan ett barn bara bo på ett ställe. Vid skilsmässa kommer man överens om hos vilken
      förälder barnet har sin officiella adress.
    sentences:
    - id: hb-c09-u0138-s001
      start: 0
      end: 46
    - id: hb-c09-u0138-s002
      start: 47
      end: 137
  - type: paragraph
    id: hb-c09-u0139
    text: I praktiken kan barnet dock bo en del av tiden hos sin andra förälder.
    sentences:
    - id: hb-c09-u0139-s001
      start: 0
      end: 70
  - type: paragraph
    id: hb-c09-u0140
    text: Barnbidraget betalas till den förälder hos vilken barnet bor officiellt. Barnets officiella
      adress påverkar också till exempel FPA:s bostadsbidrag.
    sentences:
    - id: hb-c09-u0140-s001
      start: 0
      end: 72
    - id: hb-c09-u0140-s002
      start: 73
      end: 147
  - type: paragraph
    id: hb-c09-u0141
    text: Vårdnaden om ett barn innebär
    sentences:
    - id: hb-c09-u0141-s001
      start: 0
      end: 29
  - id: hb-c09-u0143
    type: list
    ordered: false
    items:
    - id: hb-c09-u0142
      text: att man tar hand om barnet
      sentences:
      - id: hb-c09-u0142-s001
        start: 0
        end: 26
    - id: hb-c09-u0144
      text: att man uppfostrar barnet
      sentences:
      - id: hb-c09-u0144-s001
        start: 0
        end: 25
    - id: hb-c09-u0145
      text: att man tar hand om och beslutar om barnets angelägenheter.
      sentences:
      - id: hb-c09-u0145-s001
        start: 0
        end: 59
  - type: paragraph
    id: hb-c09-u0146
    text: När ett äktenskap slutar beslutar barnets föräldrar hur vårdnaden ska ordnas. Föräldrarna kan
      komma överens om gemensam vårdnad eller om att den ena föräldern har ensam vårdnad. Vårdnaden är
      inte beroende av vem barnet bor med.
    sentences:
    - id: hb-c09-u0146-s001
      start: 0
      end: 77
    - id: hb-c09-u0146-s002
      start: 78
      end: 177
    - id: hb-c09-u0146-s003
      start: 178
      end: 227
  - type: paragraph
    id: hb-c09-u0147
    text: När båda föräldrarna är barnets vårdnadshavare, alltså när de har gemensam vårdnad, beslutar
      de många saker tillsammans. Dessa är barnets
    sentences:
    - id: hb-c09-u0147-s001
      start: 0
      end: 120
    - id: hb-c09-u0147-s002
      start: 121
      end: 137
  - id: hb-c09-u0149
    type: list
    ordered: false
    items:
    - id: hb-c09-u0148
      text: namn
      sentences:
      - id: hb-c09-u0148-s001
        start: 0
        end: 4
    - id: hb-c09-u0150
      text: bostadsort
      sentences:
      - id: hb-c09-u0150-s001
        start: 0
        end: 10
    - id: hb-c09-u0151
      text: fostran
      sentences:
      - id: hb-c09-u0151-s001
        start: 0
        end: 7
    - id: hb-c09-u0152
      text: språk
      sentences:
      - id: hb-c09-u0152-s001
        start: 0
        end: 5
    - id: hb-c09-u0153
      text: religion
      sentences:
      - id: hb-c09-u0153-s001
        start: 0
        end: 8
    - id: hb-c09-u0154
      text: utbildning
      sentences:
      - id: hb-c09-u0154-s001
        start: 0
        end: 10
    - id: hb-c09-u0155
      text: hälsovård
      sentences:
      - id: hb-c09-u0155-s001
        start: 0
        end: 9
    - id: hb-c09-u0156
      text: disponering av barnets egendom
      sentences:
      - id: hb-c09-u0156-s001
        start: 0
        end: 30
  - type: paragraph
    id: hb-c09-u0157
    text: Också till exempel för en passansökan behövs båda föräldrarnas samtycke.
    sentences:
    - id: hb-c09-u0157-s001
      start: 0
      end: 72
  - type: paragraph
    id: hb-c09-u0158
    text: När föräldrarna har gemensam vårdnad måste de kunna komma överens om saker med varandra. Det
      viktigaste är att föräldrarna tänker på barnets bästa när de fattar beslut.
    sentences:
    - id: hb-c09-u0158-s001
      start: 0
      end: 88
    - id: hb-c09-u0158-s002
      start: 89
      end: 168
  - type: paragraph
    id: hb-c09-u0159
    text: Barnet har rätt att ha kontakt med båda sina föräldrar efter skilsmässan. Han eller hon har
      också rätt att träffa den förälder som han eller hon inte bor med.
    sentences:
    - id: hb-c09-u0159-s001
      start: 0
      end: 73
    - id: hb-c09-u0159-s002
      start: 74
      end: 158
  - type: paragraph
    id: hb-c09-u0160
    text: Umgängesrätten kan till exempel innebära att barnet bor hos den ena föräldern och träffar den
      andra föräldern vartannat veckoslut och dessutom vissa tider under loven. Om barnet är mycket litet
      kan umgänget ordnas bara över dagen.
    sentences:
    - id: hb-c09-u0160-s001
      start: 0
      end: 167
    - id: hb-c09-u0160-s002
      start: 168
      end: 230
  - type: paragraph
    id: hb-c09-u0161
    text: Umgängesrätten kan också vara så omfattande att barnet bor lika mycket hos båda föräldrarna.
      Officiellt kan barnet dock bara ha en adress. Låt alltid barnets intressen gå först när ni fattar
      beslut.
    sentences:
    - id: hb-c09-u0161-s001
      start: 0
      end: 92
    - id: hb-c09-u0161-s002
      start: 93
      end: 138
    - id: hb-c09-u0161-s003
      start: 139
      end: 198
  - type: paragraph
    id: hb-c09-u0162
    text: Vid problem med umgänget kan du kontakta barnatillsyningsmannen. Barnatillsyningsmannen ordnar
      ett möte med föräldrarna.
    sentences:
    - id: hb-c09-u0162-s001
      start: 0
      end: 64
    - id: hb-c09-u0162-s002
      start: 65
      end: 120
  - type: paragraph
    id: hb-c09-u0163
    text: Om du misstänker att barnets hälsa eller säkerhet äventyras när barnet träffar den andra föräldern
      ska du meddela detta till socialmyndigheter. Om misstanken är befogad, kan det beslutas att umgänget
      ska ske under socialmyndigheters uppsikt.
    sentences:
    - id: hb-c09-u0163-s001
      start: 0
      end: 143
    - id: hb-c09-u0163-s002
      start: 144
      end: 241
- id: hb-c09-underhall
  title: Barnets underhåll
  blocks:
  - type: paragraph
    id: hb-c09-u0164
    text: Barnets underhåll (elatus) innebär att föräldern tillgodoser de behov som ett barn under 18
      år har samt ser till att barnet får den vård och utbildning som det behöver.
    sentences:
    - id: hb-c09-u0164-s001
      start: 0
      end: 168
  - type: paragraph
    id: hb-c09-u0165
    text: Om barnet har två föräldrar, bär båda föräldrarna ansvaret för barnets underhåll, även om de
      inte bor tillsammans. När föräldrarna skiljer sig måste de komma överens om barnets underhåll samt
      om eventuellt underhållsbidrag (elatusapu). Den förälder som inte bor med barnet betalar underhållsbidrag
      till den förälder hos vilken barnet bor.
    sentences:
    - id: hb-c09-u0165-s001
      start: 0
      end: 114
    - id: hb-c09-u0165-s002
      start: 115
      end: 235
    - id: hb-c09-u0165-s003
      start: 236
      end: 338
  - type: paragraph
    id: hb-c09-u0166
    text: Underhållsbidragets belopp beräknas utifrån barnets underhållsbehov och föräldrarnas underhållsförmåga.
      Med barnets underhållsbehov avses det penningbelopp som försörjningen av barnet kostar varje månad.
      I beloppet ingår till exempel utgifter för mat och kläder samt eventuella avgifter för småbarnspedagogik.
      Barnets underhållsbehov delas mellan föräldrarna enligt deras underhållsförmåga. Underhållsförmågan
      beräknas genom att dra av skatter och övriga obligatoriska utgifter av inkomsterna. Du kan be barnatillsyningsmannen
      (lastenvalvoja) om hjälp med att beräkna underhållsbidraget.
    sentences:
    - id: hb-c09-u0166-s001
      start: 0
      end: 103
    - id: hb-c09-u0166-s002
      start: 104
      end: 203
    - id: hb-c09-u0166-s003
      start: 204
      end: 309
    - id: hb-c09-u0166-s004
      start: 310
      end: 390
    - id: hb-c09-u0166-s005
      start: 391
      end: 493
    - id: hb-c09-u0166-s006
      start: 494
      end: 587
  - type: paragraph
    id: hb-c09-u0167
    text: Ibland betalar den andra föräldern underhållsbidrag, även om barnet bor lika mycket eller nästa
      lika mycket med båda sina föräldrar. Det kan till exempel handla om en situation där den andra föräldern
      har en bättre underhållsförmåga eller hen betalar en mindre del av barnets levnadskostnader.
    sentences:
    - id: hb-c09-u0167-s001
      start: 0
      end: 132
    - id: hb-c09-u0167-s002
      start: 133
      end: 293
  - type: paragraph
    id: hb-c09-u0168
    text: I vissa situationer kan den förälder som bor med barnet ansöka om underhållsstöd från FPA.
    sentences:
    - id: hb-c09-u0168-s001
      start: 0
      end: 90
  - type: paragraph
    id: hb-c09-u0169
    text: 'Du kan ansöka om underhållsstöd från FPA i följande situationer:'
    sentences:
    - id: hb-c09-u0169-s001
      start: 0
      end: 64
  - id: hb-c09-u0171
    type: list
    ordered: false
    items:
    - id: hb-c09-u0170
      text: Du har rätt att få underhållsbidrag från den andra föräldern, men hen har inte betalat det.
      sentences:
      - id: hb-c09-u0170-s001
        start: 0
        end: 91
    - id: hb-c09-u0172
      text: Inget underhållsbidrag har fastställts, eftersom den andra föräldern har små inkomster.
      sentences:
      - id: hb-c09-u0172-s001
        start: 0
        end: 87
    - id: hb-c09-u0173
      text: Underhållsbidraget har inte kunnat bekräftas samtidigt som föräldraskapet bekräftades.
      sentences:
      - id: hb-c09-u0173-s001
        start: 0
        end: 86
    - id: hb-c09-u0174
      text: Det fastställda underhållsbidraget är mindre än underhållsstödet, eftersom den andra föräldern
        har små inkomster.
      sentences:
      - id: hb-c09-u0174-s001
        start: 0
        end: 113
    - id: hb-c09-u0175
      text: Du har adopterat ett barn ensam.
      sentences:
      - id: hb-c09-u0175-s001
        start: 0
        end: 32
    - id: hb-c09-u0176
      text: Barnet har fötts utom äktenskapet, fadern har inte fastställts och barnet har inte två underhållsskyldiga
        föräldrar.
      sentences:
      - id: hb-c09-u0176-s001
        start: 0
        end: 116
  - type: paragraph
    id: hb-c09-u0177
    text: Du kan få underhållsstöd om ditt barn är stadigvarande bosatt i Finland eller vistas tillfälligt
      utomlands i högst sex månader. Du kan även få underhållsstöd om du har flyttat till Finland från
      ett annat EU- eller EES-land eller Schweiz för att arbeta. Då måste barnet vara med dig i Finland
      och bo med dig.
    sentences:
    - id: hb-c09-u0177-s001
      start: 0
      end: 127
    - id: hb-c09-u0177-s002
      start: 128
      end: 252
    - id: hb-c09-u0177-s003
      start: 253
      end: 307
- id: hb-c09-foraldraskap
  title: Föräldraskap och registrering vid födseln
  blocks:
  - type: paragraph
    id: hb-c09-u0178
    text: I Finland kan ett barn officiellt ha en eller två föräldrar, det vill säga mammor eller pappor.
      Det officiella föräldraskapet baserar sig ofta på det biologiska föräldraskapet, men ibland kan
      den officiella föräldern vara någon annan än barnets biologiska förälder. Så kan det vara till exempel
      om ett barn i en regnbågsfamilj officiellt har två mammor, eller om föräldraskapet för barnet har
      överförts till en adoptivförälder eller adoptivföräldrar genom adoption.
    sentences:
    - id: hb-c09-u0178-s001
      start: 0
      end: 95
    - id: hb-c09-u0178-s002
      start: 96
      end: 265
    - id: hb-c09-u0178-s003
      start: 266
      end: 465
  - type: paragraph
    id: hb-c09-u0179
    text: Det officiella föräldraskapet som fastställs i lag motsvarar inte alltid den verklighet som
      familjen lever i. Numera anser man i Finland att föräldraskap ofta handlar mer om de känslomässiga
      banden mellan familjemedlemmarna och det liv de delar snarare än enbart om det biologiska eller
      officiella föräldraskapet. I praktiken innebär föräldraskap att man tar hand om och uppfostrar ett
      barn, ser till hens behov och älskar hen.
    sentences:
    - id: hb-c09-u0179-s001
      start: 0
      end: 109
    - id: hb-c09-u0179-s002
      start: 110
      end: 313
    - id: hb-c09-u0179-s003
      start: 314
      end: 427
  - type: paragraph
    id: hb-c09-u0180
    text: Enligt finländsk lag är en person som är under 18 år ett barn. Personer under 18 år ska ha minst
      en vårdnadshavare. Vanligtvis är barnets föräldrar dess vårdnadshavare.
    sentences:
    - id: hb-c09-u0180-s001
      start: 0
      end: 62
    - id: hb-c09-u0180-s002
      start: 63
      end: 115
    - id: hb-c09-u0180-s003
      start: 116
      end: 168
  - type: paragraph
    id: hb-c09-u0181
    text: Om ett barn föds inom äktenskap är båda föräldrarna tillsammans barnets vårdnadshavare.
    sentences:
    - id: hb-c09-u0181-s001
      start: 0
      end: 87
  - type: paragraph
    id: hb-c09-u0182
    text: Kvinnan som har fött barnet är barnets vårdnadshavare om föräldrarna inte är gifta och faderskap
      eller moderskap inte har erkänts. Detta innebär att modern ensam bestämmer om alla barnets angelägenheter
      även om föräldrarna skulle bo tillsammans.
    sentences:
    - id: hb-c09-u0182-s001
      start: 0
      end: 130
    - id: hb-c09-u0182-s002
      start: 131
      end: 245
  - type: paragraph
    id: hb-c09-u0183
    text: Om barnets mamma är gift med en man, betraktas maken automatiskt som pappa till barnet. Om ett
      par inte är gifta, är situationen en annan. Då måste mannen erkänna faderskapet. Det betyder att
      mannen officiellt meddelar att han är pappa till barnet. Faderskapet kan erkännas på rådgivningsbyrån
      under graviditeten eller hos en barnatillsyningsman efter att barnet fötts. Först efter att pappan
      erkänt faderskapet kan han bli barnets vårdnadshavare och barnet till exempel få pappans efternamn.
    sentences:
    - id: hb-c09-u0183-s001
      start: 0
      end: 87
    - id: hb-c09-u0183-s002
      start: 88
      end: 138
    - id: hb-c09-u0183-s003
      start: 139
      end: 175
    - id: hb-c09-u0183-s004
      start: 176
      end: 248
    - id: hb-c09-u0183-s005
      start: 249
      end: 369
    - id: hb-c09-u0183-s006
      start: 370
      end: 492
  - type: paragraph
    id: hb-c09-u0184
    text: Om en gravid kvinna har blivit gravid med hjälp av fertilitetsbehandlingar och mammans kvinnliga
      partner, det vill säga barnets andra mamma, har deltagit i behandlingarna, kan den andra mammans
      moderskap i allmänhet erkännas på rådgivningsbyrån redan innan barnet föds. Moderskapet måste erkännas
      separat även om mammorna skulle vara gifta med varandra.
    sentences:
    - id: hb-c09-u0184-s001
      start: 0
      end: 269
    - id: hb-c09-u0184-s002
      start: 270
      end: 353
  - type: paragraph
    id: hb-c09-u0421
    text: 'I Finland finns en moderskapslag enligt vilken ett barn kan ha två mödrar. Kvinnan som har
      fött barnet är alltid barnets mor. För barnet kan ytterligare en mor fastställas om:'
    sentences:
    - id: hb-c09-u0421-s001
      start: 0
      end: 74
    - id: hb-c09-u0421-s002
      start: 75
      end: 125
    - id: hb-c09-u0421-s003
      start: 126
      end: 175
  - id: hb-c09-u0423
    type: list
    ordered: false
    items:
    - id: hb-c09-u0422
      text: barnet föds till följd av fertilitetsbehandling till modern och moderns kvinnliga partner
        eller make
      sentences:
      - id: hb-c09-u0422-s001
        start: 0
        end: 100
    - id: hb-c09-u0424
      text: båda föräldrarna har samtyckt till fertilitetsbehandlingen och
      sentences:
      - id: hb-c09-u0424-s001
        start: 0
        end: 62
    - id: hb-c09-u0425
      text: ingen fader kan fastställas för barnet.
      sentences:
      - id: hb-c09-u0425-s001
        start: 0
        end: 39
  - type: paragraph
    id: hb-c09-u0426
    text: Moderskap måste erkännas och fastställas även när föräldrarna är gifta.
    sentences:
    - id: hb-c09-u0426-s001
      start: 0
      end: 71
  - type: paragraph
    id: hb-c09-u0427
    text: Du kan erkänna moderskapet före barnets födelse på mödrarådgivningen. Myndigheten för digitalisering
      och befolkningsdata fastställer ditt moderskap efter barnets födelse.
    sentences:
    - id: hb-c09-u0427-s001
      start: 0
      end: 69
    - id: hb-c09-u0427-s002
      start: 70
      end: 170
  - type: paragraph
    id: hb-c09-u0428
    text: Du kan också erkänna moderskapet efter barnets födelse hos barnatillsyningsmannen på din ort.
      Barnatillsyningsmannen utreder moderskapet, varefter Myndigheten för digitalisering och befolkningsdata
      fastställer det.
    sentences:
    - id: hb-c09-u0428-s001
      start: 0
      end: 93
    - id: hb-c09-u0428-s002
      start: 94
      end: 214
  - type: paragraph
    id: hb-c09-u0429
    text: När moderskapet har fastställts
    sentences:
    - id: hb-c09-u0429-s001
      start: 0
      end: 31
  - id: hb-c09-u0431
    type: list
    ordered: false
    items:
    - id: hb-c09-u0430
      text: kan barnet ges endera moderns efternamn eller mödrarnas gemensamma efternamn
      sentences:
      - id: hb-c09-u0430-s001
        start: 0
        end: 76
    - id: hb-c09-u0432
      text: båda mödrarna måste bidra till barnets underhåll
      sentences:
      - id: hb-c09-u0432-s001
        start: 0
        end: 48
    - id: hb-c09-u0433
      text: mödrarna får agera som barnets vårdnadshavare antingen tillsammans eller var för sig
      sentences:
      - id: hb-c09-u0433-s001
        start: 0
        end: 84
    - id: hb-c09-u0434
      text: barnet har arvsrätt till båda sina mödrar och deras släkt.
      sentences:
      - id: hb-c09-u0434-s001
        start: 0
        end: 58
  - type: paragraph
    id: hb-c09-u0185
    text: När faderskapet har fastställts
    sentences:
    - id: hb-c09-u0185-s001
      start: 0
      end: 31
  - id: hb-c09-u0187
    type: list
    ordered: false
    items:
    - id: hb-c09-u0186
      text: kan barnet ges faderns efternamn
      sentences:
      - id: hb-c09-u0186-s001
        start: 0
        end: 32
    - id: hb-c09-u0188
      text: kan fadern vara barnets vårdnadshavare antingen tillsammans med barnets mor eller ensam. Vårdnadshavaren
        (huoltaja) är den person som ansvarar för vården och uppfostran av barnet.
      sentences:
      - id: hb-c09-u0188-s001
        start: 0
        end: 88
      - id: hb-c09-u0188-s002
        start: 89
        end: 179
    - id: hb-c09-u0189
      text: är fadern förpliktad att delta i underhåll av barnet
      sentences:
      - id: hb-c09-u0189-s001
        start: 0
        end: 52
    - id: hb-c09-u0190
      text: har barnet rätt att ärva sin far och släkten på sin fars sida och tvärtom
      sentences:
      - id: hb-c09-u0190-s001
        start: 0
        end: 73
    - id: hb-c09-u0191
      text: har barnet rätt till familjepension om fadern dör.
      sentences:
      - id: hb-c09-u0191-s001
        start: 0
        end: 50
  - type: paragraph
    id: hb-c09-u0192
    text: Om fadern inte erkänner sitt faderskap kan modern väcka talan för fastställande av faderskapet.
    sentences:
    - id: hb-c09-u0192-s001
      start: 0
      end: 95
  - type: paragraph
    id: hb-c09-u0193
    text: Ett barns födelse registreras i befolkningsdatasystemet på sjukhuset när barnet föds. I samband
      med detta får barnet också ett personnummer. Detta görs om
    sentences:
    - id: hb-c09-u0193-s001
      start: 0
      end: 85
    - id: hb-c09-u0193-s002
      start: 86
      end: 140
    - id: hb-c09-u0193-s003
      start: 141
      end: 154
  - id: hb-c09-u0195
    type: list
    ordered: false
    items:
    - id: hb-c09-u0194
      text: modern har en hemkommun i Finland och
      sentences:
      - id: hb-c09-u0194-s001
        start: 0
        end: 37
    - id: hb-c09-u0196
      text: modern har en finsk personbeteckning.
      sentences:
      - id: hb-c09-u0196-s001
        start: 0
        end: 37
  - type: paragraph
    id: hb-c09-u0197
    text: Om modern inte är registrerad i Finland kan sjukhuset inte registrera barnets födelse. I detta
      fall ska du be om anvisningar vid Myndigheten för digitalisering och befolkningsdata.
    sentences:
    - id: hb-c09-u0197-s001
      start: 0
      end: 86
    - id: hb-c09-u0197-s002
      start: 87
      end: 180
  - type: paragraph
    id: hb-c09-u0198
    text: I Finland finns en namnlag. Enligt den ska alla som har en hemort i Finland ha ett efternamn
      och 1–4 förnamn. Förnamnen ska vara förenliga med lagen. Till exempel får syskon inte ha samma namn
      som första namn.
    sentences:
    - id: hb-c09-u0198-s001
      start: 0
      end: 27
    - id: hb-c09-u0198-s002
      start: 28
      end: 109
    - id: hb-c09-u0198-s003
      start: 110
      end: 149
    - id: hb-c09-u0198-s004
      start: 150
      end: 209
  - type: paragraph
    id: hb-c09-u0199
    text: Barnet får sitt efternamn av sina föräldrar.
    sentences:
    - id: hb-c09-u0199-s001
      start: 0
      end: 44
  - id: hb-c09-u0201
    type: list
    ordered: false
    items:
    - id: hb-c09-u0200
      text: Om föräldrarna har samma efternamn eller efternamnskombination får barnet detta namn som efternamn.
      sentences:
      - id: hb-c09-u0200-s001
        start: 0
        end: 99
    - id: hb-c09-u0202
      text: Om ett barn endast har en förälder får barnet denna förälders efternamn.
      sentences:
      - id: hb-c09-u0202-s001
        start: 0
        end: 72
    - id: hb-c09-u0203
      text: Om föräldrarna har gemensamma barn sedan tidigare, ska minderåriga syskon ha samma efternamn.
      sentences:
      - id: hb-c09-u0203-s001
        start: 0
        end: 93
    - id: hb-c09-u0204
      text: Om föräldrarna har separerat, bestämmer barnets vårdnadshavare vilket namn barnet får.
      sentences:
      - id: hb-c09-u0204-s001
        start: 0
        end: 86
    - id: hb-c09-u0205
      text: Om föräldrarna inte kommer överens om barnets efternamn, får barnet moderns efternamn.
      sentences:
      - id: hb-c09-u0205-s001
        start: 0
        end: 86
  - type: paragraph
    id: hb-c09-u0206
    text: Om föräldrarna har olika efternamn avgörs barnets efternamn enligt situationen.
    sentences:
    - id: hb-c09-u0206-s001
      start: 0
      end: 79
  - id: hb-c09-u0208
    type: list
    ordered: false
    items:
    - id: hb-c09-u0207
      text: Om föräldrarna är gifta kan de välja endera makens efternamn eller efternamnskombination till
        barnet.
      sentences:
      - id: hb-c09-u0207-s001
        start: 0
        end: 101
    - id: hb-c09-u0209
      text: Om föräldrarna inte är gifta kan barnet få valfri förälders efternamn om faderskapet eller
        den icke-födande moderns moderskap har fastställts. Om föräldraskapet inte har fastställts får
        barnet moderns efternamn.
      sentences:
      - id: hb-c09-u0209-s001
        start: 0
        end: 142
      - id: hb-c09-u0209-s002
        start: 143
        end: 211
    - id: hb-c09-u0210
      text: Föräldrarnas första gemensamma barn kan ges en kombination av föräldrarnas efternamn eller
        det andra namnet i ena förälderns efternamnskombination.
      sentences:
      - id: hb-c09-u0210-s001
        start: 0
        end: 147
  - type: paragraph
    id: hb-c09-u0211
    text: När barnet föds måste man registrera dess modersmål. Ditt barn kan i befolkningsdatasystemet
      endast ha ett språk som modersmål. Du kan ändra språket senare om du vill.
    sentences:
    - id: hb-c09-u0211-s001
      start: 0
      end: 52
    - id: hb-c09-u0211-s002
      start: 53
      end: 127
    - id: hb-c09-u0211-s003
      start: 128
      end: 167
- id: hb-c09-uppfostran
  title: Barnets bästa, uppfostran och självständighet
  blocks:
  - type: paragraph
    id: hb-c09-u0212
    text: Med uppfattning om barn avses hurdana barn anses vara. Det handlar också om hurdan relationen
      mellan barn och vuxna anses vara. En hurdan uppfattning om barn som råder i samhället tar sig uttryck
      i hur barn behandlas i vardagen. Dessutom syns samhällets uppfattning om barn i till exempel de
      lagar som gäller barn och i skolornas läroplaner.
    sentences:
    - id: hb-c09-u0212-s001
      start: 0
      end: 54
    - id: hb-c09-u0212-s002
      start: 55
      end: 127
    - id: hb-c09-u0212-s003
      start: 128
      end: 228
    - id: hb-c09-u0212-s004
      start: 229
      end: 341
  - type: paragraph
    id: hb-c09-u0213
    text: I Finland betraktas barn som aktiva aktörer. Barn är alltså inte bara föremål för de vuxnas
      beskydd och beslut, utan de har egna tankar och åsikter som de vuxna ska respektera. Föräldrarna
      och samhället ska främja barnens växande till självständiga individer som fattar ansvarsfulla beslut.
    sentences:
    - id: hb-c09-u0213-s001
      start: 0
      end: 44
    - id: hb-c09-u0213-s002
      start: 45
      end: 176
    - id: hb-c09-u0213-s003
      start: 177
      end: 290
  - type: paragraph
    id: hb-c09-u0214
    text: Å andra sidan ska det unika med barn och barndomen också skyddas. Ibland kan kravet på att lyssna
      på barnets åsikter och kravet på att skydda barnet stå i strid med varandra. Då ska de vuxna bedöma
      vad som sist och slutligen är det bästa för barnet.
    sentences:
    - id: hb-c09-u0214-s001
      start: 0
      end: 65
    - id: hb-c09-u0214-s002
      start: 66
      end: 174
    - id: hb-c09-u0214-s003
      start: 175
      end: 249
  - type: paragraph
    id: hb-c09-u0215
    text: Den finländska uppfattningen om barn är också förknippad med en idé om vikten av lek. Genom
      lek lär sig barnen viktiga färdigheter, men leken i sig är också viktig. Leken ger barnen glädje
      och är en viktig del av att vara barn. Alla barn har rätt att leka.
    sentences:
    - id: hb-c09-u0215-s001
      start: 0
      end: 85
    - id: hb-c09-u0215-s002
      start: 86
      end: 164
    - id: hb-c09-u0215-s003
      start: 165
      end: 227
    - id: hb-c09-u0215-s004
      start: 228
      end: 256
  - type: paragraph
    id: hb-c09-u0216
    text: Föräldraidealet, det vill säga idén om hur en bra förälder är, har förändrats med tiden. I dag
      anser man i Finland generellt att en bra förälder framför allt är kärleksfull och tålmodig. Hen
      tillbringar mycket tid tillsammans med barnet. Förr var det vanligare att framhäva lydnad och förälderns
      auktoritet. Numera försöker föräldrarna diskutera mer med sina barn och förklara varför saker och
      ting görs på ett visst sätt.
    sentences:
    - id: hb-c09-u0216-s001
      start: 0
      end: 88
    - id: hb-c09-u0216-s002
      start: 89
      end: 186
    - id: hb-c09-u0216-s003
      start: 187
      end: 237
    - id: hb-c09-u0216-s004
      start: 238
      end: 307
    - id: hb-c09-u0216-s005
      start: 308
      end: 422
  - type: paragraph
    id: hb-c09-u0217
    text: Det finns många sätt att vara en bra förälder. Ur barnets perspektiv är det viktigaste att hen
      känner sig älskad och uppskattad som hen är. Barnet känner sig tryggt och hens basbehov tillgodoses.
    sentences:
    - id: hb-c09-u0217-s001
      start: 0
      end: 46
    - id: hb-c09-u0217-s002
      start: 47
      end: 139
    - id: hb-c09-u0217-s003
      start: 140
      end: 195
  - type: paragraph
    id: hb-c09-u0218
    text: Aga betyder att en förälder eller någon annan använder våld för att straffa ett barn eller för
      att få barnet att uppföra sig på ett visst sätt. Alla former av aga är förbjudna i lag i Finland.
      Aga är både fysisk bestraffning och psykiskt våld som används som straff. Fysisk bestraffning innebär
      allt som syftar till att orsaka barnet smärta, till exempel att slå, dra i håret, knäppa på fingrarna
      eller, om det är fråga om en baby, skaka den. Psykiskt våld kan vara till exempel att hota med våld,
      håna eller medvetet ignorera barnet.
    sentences:
    - id: hb-c09-u0218-s001
      start: 0
      end: 143
    - id: hb-c09-u0218-s002
      start: 144
      end: 192
    - id: hb-c09-u0218-s003
      start: 193
      end: 266
    - id: hb-c09-u0218-s004
      start: 267
      end: 442
    - id: hb-c09-u0218-s005
      start: 443
      end: 534
  - type: paragraph
    id: hb-c09-u0219
    text: Aga är skadlig för barnets utveckling. De negativa följderna för barn av också lindriga former
      av aga har påvisats på ett omfattande och övertygande sätt i undersökningar på olika håll i världen.
      Det kan verka som att aga fungerar och förändrar barnets beteende, eftersom det orsakar barnet omedelbar
      smärta och rädsla. På lång sikt ökar ändå agan barnets aggressivitet, rädslor och beteendestörningar.
      Den är därmed i alla sina former en ineffektiv och skadlig uppfostringsmetod. Barn som har upplevt
      aga växer upp till vuxna som mår sämre, är sjukare och mer våldsamma än barn som inte har agats.
    sentences:
    - id: hb-c09-u0219-s001
      start: 0
      end: 38
    - id: hb-c09-u0219-s002
      start: 39
      end: 195
    - id: hb-c09-u0219-s003
      start: 196
      end: 319
    - id: hb-c09-u0219-s004
      start: 320
      end: 402
    - id: hb-c09-u0219-s005
      start: 403
      end: 480
    - id: hb-c09-u0219-s006
      start: 481
      end: 598
  - type: paragraph
    id: hb-c09-u0220
    text: Att sätta gränser för barn kan ibland vara utmanande. Alla föräldrar måste lära sig olika sätt
      för att styra och vid behov begränsa barnet utan våld. Det är bra för föräldrarna att lära sig att
      identifiera de känslor som kan få dem att aga sitt barn. Nuförtiden anser man att barn lär sig att
      respektera vuxna som tydligt berättar för dem hurdant beteende som är acceptabelt och inte. En bra
      förälder är konsekvent och rättvis. Hen lyssnar på barnet och motiverar varför hen vill att saker
      och ting ska göras på ett visst sätt.
    sentences:
    - id: hb-c09-u0220-s001
      start: 0
      end: 53
    - id: hb-c09-u0220-s002
      start: 54
      end: 149
    - id: hb-c09-u0220-s003
      start: 150
      end: 250
    - id: hb-c09-u0220-s004
      start: 251
      end: 384
    - id: hb-c09-u0220-s005
      start: 385
      end: 427
    - id: hb-c09-u0220-s006
      start: 428
      end: 527
  - type: paragraph
    id: hb-c09-u0221
    text: I Finland värdesätter man generellt i hög grad att människor är självständiga och klarar sig
      själva. Det gäller också barnen. Också små barn uppmuntras att göra saker själva, till exempel ta
      på sig ytterkläderna. Ibland kräver det tålamod av de vuxna. I Finland anser man ändå att det är
      viktigt att barnen lär sig att ta ansvar för det som rör dem. Barnen får erfarenheter av framgång
      när de lär sig att göra saker på egen hand.
    sentences:
    - id: hb-c09-u0221-s001
      start: 0
      end: 100
    - id: hb-c09-u0221-s002
      start: 101
      end: 125
    - id: hb-c09-u0221-s003
      start: 126
      end: 212
    - id: hb-c09-u0221-s004
      start: 213
      end: 251
    - id: hb-c09-u0221-s005
      start: 252
      end: 349
    - id: hb-c09-u0221-s006
      start: 350
      end: 429
  - type: paragraph
    id: hb-c09-u0222
    text: I Finland är det också vanligt att barn rör sig utomhus på egen hand redan i ganska ung ålder.
      Det är till exempel mycket vanligt att sjuåriga förstaklassare går själva till skolan. Detta hänger
      samman med att man värdesätter barns självständighet, men en trygg miljö och det faktum att största
      delen av barnen går i skola nära hemmet gör det möjligt för dem att röra sig på egen hand. Det är
      dock viktigt att lära barnen hur man rör sig tryggt i trafiken, innan de får röra sig utomhus på
      egen hand.
    sentences:
    - id: hb-c09-u0222-s001
      start: 0
      end: 94
    - id: hb-c09-u0222-s002
      start: 95
      end: 181
    - id: hb-c09-u0222-s003
      start: 182
      end: 385
    - id: hb-c09-u0222-s004
      start: 386
      end: 500
  - type: paragraph
    id: hb-c09-u0223
    text: Ibland kan det också hända att man förväntar sig för mycket självständighet och egna initiativ
      av barnen. Man måste komma ihåg att barn är individer. En del barn är redo för självständighet redan
      i yngre ålder, medan andra behöver mer tid. De vuxna har till uppgift att säkerställa att de inte
      kräver mer av barnet än hen är redo för.
    sentences:
    - id: hb-c09-u0223-s001
      start: 0
      end: 105
    - id: hb-c09-u0223-s002
      start: 106
      end: 149
    - id: hb-c09-u0223-s003
      start: 150
      end: 239
    - id: hb-c09-u0223-s004
      start: 240
      end: 334
  - type: paragraph
    id: hb-c09-u0224
    text: I Finland vistas barnen utomhus oavsett väder och årstid. Till exempel i daghemmen tillbringar
      man i allmänhet mycket tid utomhus och kan till exempel göra skogsutfärder. Barnen ska ha lämpliga
      utomhuskläder för olika väder. Att barnen blivit smutsiga när de lekt ute anses vara ett tecken
      på att de haft roligt.
    sentences:
    - id: hb-c09-u0224-s001
      start: 0
      end: 57
    - id: hb-c09-u0224-s002
      start: 58
      end: 170
    - id: hb-c09-u0224-s003
      start: 171
      end: 224
    - id: hb-c09-u0224-s004
      start: 225
      end: 312
  - type: paragraph
    id: hb-c09-u0225
    text: Vänskapsförhållanden skapas till exempel på daghemmet, i skolan och inom hobbyer. Barnen träffar
      ofta sina vänner också på kvällar och helger och leker tillsammans inne och ute. Föräldrar till
      små barn kommer vanligtvis överens om lekträffar med föräldrarna till barnens vänner, men i skolåldern
      börjar barnen själva ordna med vem de träffar.
    sentences:
    - id: hb-c09-u0225-s001
      start: 0
      end: 81
    - id: hb-c09-u0225-s002
      start: 82
      end: 177
    - id: hb-c09-u0225-s003
      start: 178
      end: 342
  - type: paragraph
    id: hb-c09-u0226
    text: I Finland är det vanligt att barn och unga sover över hos varandra. Då åker barnet över till
      en vän på kvällen och sover där en natt. Man kommer överens om att sova över med föräldrarna, så
      att situationen är trygg för barnet och föräldrarna vet var barnet befinner sig och med vem. När
      de sover över hos varandra stärker barn och unga sina vänskapsförhållanden.
    sentences:
    - id: hb-c09-u0226-s001
      start: 0
      end: 67
    - id: hb-c09-u0226-s002
      start: 68
      end: 133
    - id: hb-c09-u0226-s003
      start: 134
      end: 282
    - id: hb-c09-u0226-s004
      start: 283
      end: 362
  - type: paragraph
    id: hb-c09-u0227
    text: När ett barn kommer in i puberteten börjar hen så småningom frigöra sig från sina föräldrar.
      Föräldrarna ska ge den unga utrymme och möjlighet att utvecklas till en självständig individ. När
      en ung person känner att man litar på hen och låter hen ta ansvar, lär hen sig att agera på ett
      ansvarsfullt sätt. Samtidigt behöver den unga ändå fortfarande sina föräldrar och de gränser de
      sätter.
    sentences:
    - id: hb-c09-u0227-s001
      start: 0
      end: 92
    - id: hb-c09-u0227-s002
      start: 93
      end: 186
    - id: hb-c09-u0227-s003
      start: 187
      end: 305
    - id: hb-c09-u0227-s004
      start: 306
      end: 390
  - type: paragraph
    id: hb-c09-u0228
    text: I Finland anser man att självbestämmanderätten också gäller barn, i den mån det är möjligt med
      tanke på deras ålder. I takt med att barnet växer ökar också självbestämmanderätten. En ung person
      har rätt att till exempel själv bestämma hurdana kläder hen använder, vem som är hens vänner och
      vad hen studerar.
    sentences:
    - id: hb-c09-u0228-s001
      start: 0
      end: 116
    - id: hb-c09-u0228-s002
      start: 117
      end: 179
    - id: hb-c09-u0228-s003
      start: 180
      end: 308
  - type: paragraph
    id: hb-c09-u0229
    text: Det är bra om föräldrarna ger den unga mer frihet i takt med att hen växer och visar att hen
      kan ta ansvar för sig själv. Till exempel kan tiden när den unga ska vara hemma på kvällen vara
      senare ju äldre hen är.
    sentences:
    - id: hb-c09-u0229-s001
      start: 0
      end: 121
    - id: hb-c09-u0229-s002
      start: 122
      end: 212
  - type: paragraph
    id: hb-c09-u0230
    text: Man kan inte kräva att den unga berättar allt om sitt liv för sina föräldrar. Det är ändå viktigt
      att föräldrarna visar intresse för den unga och hens liv. Då känner den unga att hen kan diskutera
      med sina föräldrar om hen vill. I bästa fall är familjen ett tryggt stöd och en stadig grund för
      den unga när hen ska bygga upp sitt eget liv.
    sentences:
    - id: hb-c09-u0230-s001
      start: 0
      end: 77
    - id: hb-c09-u0230-s002
      start: 78
      end: 155
    - id: hb-c09-u0230-s003
      start: 156
      end: 228
    - id: hb-c09-u0230-s004
      start: 229
      end: 339
  - type: paragraph
    id: hb-c09-u0231
    text: I Finland är kroppslig bestraffning av barn förbjuden. Barn får inte underkuvas eller bestraffas
      fysiskt till exempel genom att slå eller ta dem i håret. Det här är stadgat i lagen angående vårdnad
      om barn och umgängesrätt, som trädde i kraft 1984. Allt våld mot barn är ett brott.
    sentences:
    - id: hb-c09-u0231-s001
      start: 0
      end: 54
    - id: hb-c09-u0231-s002
      start: 55
      end: 153
    - id: hb-c09-u0231-s003
      start: 154
      end: 248
    - id: hb-c09-u0231-s004
      start: 249
      end: 281
  - type: paragraph
    id: hb-c09-u0232
    text: Det är viktigt att sätta upp tydliga gränser och regler för barn och unga. Man kan till exempel
      komma överens om gemensamma regler med andra föräldrar. Det är viktigt att komma ihåg att man inte
      får ge tobak eller alkohol till barn under 18 år.
    sentences:
    - id: hb-c09-u0232-s001
      start: 0
      end: 74
    - id: hb-c09-u0232-s002
      start: 75
      end: 151
    - id: hb-c09-u0232-s003
      start: 152
      end: 244
  - type: paragraph
    id: hb-c09-u0233
    text: När en person fyller 18 år är han eller hon enligt lagen myndig. Då är den unga en myndig samhällsmedlem
      som har rätt att besluta om sitt eget liv. Också barn under 18 har rätt att fatta beslut i vissa
      ärenden.
    sentences:
    - id: hb-c09-u0233-s001
      start: 0
      end: 64
    - id: hb-c09-u0233-s002
      start: 65
      end: 147
    - id: hb-c09-u0233-s003
      start: 148
      end: 210
- id: hb-c09-tolv
  title: Barnets rättigheter vid tolv års ålder
  blocks:
  - id: hb-c09-u0235
    type: list
    ordered: false
    items:
    - id: hb-c09-u0234
      text: 'Rättighet: Barnets för- eller efternamn kan inte bytas utan barnets tillstånd. Barnet kan
        inte anslutas till ett trossamfund utan barnets tillstånd. Barnets tillstånd behövs också för
        utträde ur ett trossamfund. Om barnets föräldrar skiljer sig, har barnet rätt att träffa båda
        sina föräldrar. Barnets åsikt ska beaktas senast när barnet ät tolv år gammalt. Om barnet inte
        vill träffa någon av föräldrarna har hen rätt att säga sin åsikt. Barnets åsikt ska beaktas också
        när man fattar beslut om hos vilken förälder barnet ska bo. Om det finns problem i familjen kan
        barnet själv be om vård utom hemmet. Vård utom hemmet betyder att barnet bor någon annanstans
        än hos sina föräldrar.'
      sentences:
      - id: hb-c09-u0234-s001
        start: 0
        end: 78
      - id: hb-c09-u0234-s002
        start: 79
        end: 148
      - id: hb-c09-u0234-s003
        start: 149
        end: 211
      - id: hb-c09-u0234-s004
        start: 212
        end: 293
      - id: hb-c09-u0234-s005
        start: 294
        end: 357
      - id: hb-c09-u0234-s006
        start: 358
        end: 438
      - id: hb-c09-u0234-s007
        start: 439
        end: 530
      - id: hb-c09-u0234-s008
        start: 531
        end: 603
      - id: hb-c09-u0234-s009
        start: 604
        end: 683
  - type: paragraph
    id: hb-c09-u0236
    text: Det är fråga om barnkapning när
    sentences:
    - id: hb-c09-u0236-s001
      start: 0
      end: 31
  - id: hb-c09-u0238
    type: list
    ordered: false
    items:
    - id: hb-c09-u0237
      text: ett barn under 16 år som är bosatt i Finland förs utomlands utan vårdnadshavarens tillstånd
      sentences:
      - id: hb-c09-u0237-s001
        start: 0
        end: 91
    - id: hb-c09-u0239
      text: ett barn som förts utomlands inte har lämnats tillbaka till Finland vid avtalad tidpunkt.
      sentences:
      - id: hb-c09-u0239-s001
        start: 0
        end: 89
  - type: paragraph
    id: hb-c09-u0240
    text: I Finland är barnkapning ett brott. Ta kontakt med polisen på din hemort.
    sentences:
    - id: hb-c09-u0240-s001
      start: 0
      end: 35
    - id: hb-c09-u0240-s002
      start: 36
      end: 73
- id: hb-c09-flersprakighet
  title: Familjens roller och barnets språk
  blocks:
  - type: paragraph
    id: hb-c09-u0241
    text: När en familj flyttar till Finland från ett annat land måste familjemedlemmarna lära sig många
      nya saker om Finland och den nya omgivningen. Det är viktigt att föräldrarna känner till kulturen,
      värderingarna och samhället i Finland. Då vet de hur man i allmänhet gör i landet. Denna kunskap
      och förståelse hjälper familjen att må bra och integrera sig i det nya landet. Det är också lättare
      för föräldrarna att hjälpa sina barn att klara sig i Finland.
    sentences:
    - id: hb-c09-u0241-s001
      start: 0
      end: 140
    - id: hb-c09-u0241-s002
      start: 141
      end: 232
    - id: hb-c09-u0241-s003
      start: 233
      end: 276
    - id: hb-c09-u0241-s004
      start: 277
      end: 369
    - id: hb-c09-u0241-s005
      start: 370
      end: 452
  - type: paragraph
    id: hb-c09-u0242
    text: När familjen flyttar till Finland är det bra om barnen snabbt kan börja i skolan eller småbarnspedagogik.
      Där lär barnet sig finska eller svenska och får kompisar i samma ålder. Under tiden som barnen är
      i småbarnspedagogik eller skolan har föräldrarna tid att arbeta, söka arbete, studera och sköta
      sina egna och familjens angelägenheter.
    sentences:
    - id: hb-c09-u0242-s001
      start: 0
      end: 105
    - id: hb-c09-u0242-s002
      start: 106
      end: 177
    - id: hb-c09-u0242-s003
      start: 178
      end: 339
  - type: paragraph
    id: hb-c09-u0243
    text: I det nya landet kan de interna rollerna inom familjen ibland förändras. Alla familjemedlemmarna
      går igenom samma saker i det nya landet, men var och en hanterar dem i sin egen takt. Barnen kanske
      anpassar sig snabbare än föräldrarna. När barnen hela tiden tar till sig nya värderingar och vanor
      kan det leda till spänningar och bråk i familjen. Det är viktigt att föräldrarna diskuterar med
      varandra och med barnen om dessa och de känslor som den nya omgivningen väcker. Med tiden är det
      möjligt att hitta ett sätt för alla familjemedlemmar att leva i Finland.
    sentences:
    - id: hb-c09-u0243-s001
      start: 0
      end: 72
    - id: hb-c09-u0243-s002
      start: 73
      end: 182
    - id: hb-c09-u0243-s003
      start: 183
      end: 234
    - id: hb-c09-u0243-s004
      start: 235
      end: 345
    - id: hb-c09-u0243-s005
      start: 346
      end: 471
    - id: hb-c09-u0243-s006
      start: 472
      end: 561
  - type: paragraph
    id: hb-c09-u0244
    text: Också parförhållandet kan få överraskande utmaningar, när hela familjen ställs inför nya omständigheter.
      Mannens och kvinnans roller kan vara annorlunda i Finland än i det gamla hemlandet. Om den ena maken
      är född i Finland, har bott längre i Finland eller annars kan det nya språket bättre än den andra,
      kan hen hjälpa och stödja sin partner. Det är ändå viktigt att båda är aktiva och lär sig språket,
      så att den ena inte blir för beroende av den andra. Det stärker också parförhållandet.
    sentences:
    - id: hb-c09-u0244-s001
      start: 0
      end: 104
    - id: hb-c09-u0244-s002
      start: 105
      end: 188
    - id: hb-c09-u0244-s003
      start: 189
      end: 343
    - id: hb-c09-u0244-s004
      start: 344
      end: 455
    - id: hb-c09-u0244-s005
      start: 456
      end: 490
  - type: paragraph
    id: hb-c09-u0245
    text: Ibland har en människa varit tvungen att flytta till ett nytt land på egen hand. Då har hen
      ingen välbekant och trygg familj eller släkt runt omkring sig. Det är vanligt att det tar tid för
      en människa att anpassa sig till stora förändringar både på ett personligt plan och inom familjen.
    sentences:
    - id: hb-c09-u0245-s001
      start: 0
      end: 80
    - id: hb-c09-u0245-s002
      start: 81
      end: 154
    - id: hb-c09-u0245-s003
      start: 155
      end: 288
  - type: paragraph
    id: hb-c09-u0246
    text: När en familj flyttar till Finland är det viktigt att alla familjemedlemmar lär sig finska eller
      svenska. Det är viktigt att föräldrarna uppmuntrar barnet att prata finska eller svenska i skolan.
      Ibland kanske föräldrarna tänker att barnet lär sig finska eller svenska snabbare om hela familjen
      pratar det nya språket hemma. De kanske tänker att barnen inte har någon nytta av att kunna föräldrarnas
      språk i Finland.
    sentences:
    - id: hb-c09-u0246-s001
      start: 0
      end: 105
    - id: hb-c09-u0246-s002
      start: 106
      end: 195
    - id: hb-c09-u0246-s003
      start: 196
      end: 324
    - id: hb-c09-u0246-s004
      start: 325
      end: 416
  - type: paragraph
    id: hb-c09-u0247
    text: Forskning visar ändå att det är lättare för barn att lära sig ett nytt språk om de kan sitt
      modersmål bra. Modersmålet är människans känslospråk. Därför är det viktigt för växelverkan mellan
      föräldrarna och barnet att föräldrarna pratar med barnet på det språk som de själva kan bäst. Modersmålet
      är också en del av människans identitet och kultur. Alla barn har rätt att lära sig sitt eget språk
      och vara stolta över det. Att kunna sitt modersmål hjälper en också att hålla kontakten med släktingar
      och vänner.
    sentences:
    - id: hb-c09-u0247-s001
      start: 0
      end: 106
    - id: hb-c09-u0247-s002
      start: 107
      end: 145
    - id: hb-c09-u0247-s003
      start: 146
      end: 284
    - id: hb-c09-u0247-s004
      start: 285
      end: 348
    - id: hb-c09-u0247-s005
      start: 349
      end: 422
    - id: hb-c09-u0247-s006
      start: 423
      end: 511
  - type: paragraph
    id: hb-c09-u0248
    text: I en familj kan man använda många olika språk. Barnen kan lära sig många språk samtidigt, och
      ett barn kan ha fler än ett modersmål. Det viktigaste är att man pratar så mycket som möjligt med
      barnet och läser för det, oavsett språk.
    sentences:
    - id: hb-c09-u0248-s001
      start: 0
      end: 46
    - id: hb-c09-u0248-s002
      start: 47
      end: 132
    - id: hb-c09-u0248-s003
      start: 133
      end: 232
  - type: paragraph
    id: hb-c09-u0249
    text: Enligt Finlands grundlag har alla som bor i Finland rätt att bevara och utveckla sitt språk
      och sin kultur. Det är möjligt att få undervisning i sitt modersmål också i skolan.
    sentences:
    - id: hb-c09-u0249-s001
      start: 0
      end: 107
    - id: hb-c09-u0249-s002
      start: 108
      end: 175
- id: hb-c09-radgivning
  title: Rådgivning och stöd när familjen får barn
  blocks:
  - type: paragraph
    id: hb-c09-u0250
    text: En mödrarådgivning är en hälsovårdstjänst där mamman och hela familjen får vägledning och råd.
      På mödrarådgivningen följer man upp den gravida kvinnans och fostrets välbefinnande. Dessutom får
      hela familjen stöd med att förbereda sig för den nya babyn.
    sentences:
    - id: hb-c09-u0250-s001
      start: 0
      end: 94
    - id: hb-c09-u0250-s002
      start: 95
      end: 179
    - id: hb-c09-u0250-s003
      start: 180
      end: 252
  - type: paragraph
    id: hb-c09-u0251
    text: Efter att barnet fötts följer en hälsovårdare på rådgivningsbyrån upp hur barnet växer och utvecklas.
      Hälsovårdaren diskuterar också med familjen om sådant som gäller barnet. Rådgivningsbyrån är avgiftsfri,
      och alla familjer kan gå dit.
    sentences:
    - id: hb-c09-u0251-s001
      start: 0
      end: 101
    - id: hb-c09-u0251-s002
      start: 102
      end: 174
    - id: hb-c09-u0251-s003
      start: 175
      end: 236
  - type: paragraph
    id: hb-c09-u0252
    text: För föräldrar som väntar sitt första barn ordnar rådgivningsbyrån en familjeförberedelsekurs.
      På kursen berättar hälsovårdare om hur man ska ta hand om babyn och om livet med en baby.
    sentences:
    - id: hb-c09-u0252-s001
      start: 0
      end: 93
    - id: hb-c09-u0252-s002
      start: 94
      end: 183
  - type: paragraph
    id: hb-c09-u0253
    text: Mammor som är permanent bosatta i Finland kan ansöka om moderskapsunderstöd hos FPA. Moderskapsunderstödet
      kan fås antingen i form av en moderskapsförpackning eller i pengar. Moderskapsförpackningen innehåller
      saker som babyn behöver de första månaderna, till exempel kläder, en åkpåse och produkter för babyvård.
      Allt är packat i en stor låda som kan användas som babyns första säng.
    sentences:
    - id: hb-c09-u0253-s001
      start: 0
      end: 84
    - id: hb-c09-u0253-s002
      start: 85
      end: 174
    - id: hb-c09-u0253-s003
      start: 175
      end: 313
    - id: hb-c09-u0253-s004
      start: 314
      end: 384
  - type: paragraph
    id: hb-c09-u0254
    text: Staten började dela ut moderskapsunderstöd till mindre bemedlade mammor på 1930-talet. Med hjälp
      av det fick mammor och babyer tillgång till hälsovård och barndödligheten började minska. Från och
      med år 1949 har alla mammor i Finland fått understödet.
    sentences:
    - id: hb-c09-u0254-s001
      start: 0
      end: 86
    - id: hb-c09-u0254-s002
      start: 87
      end: 186
    - id: hb-c09-u0254-s003
      start: 187
      end: 251
  - type: paragraph
    id: hb-c09-u0255
    text: I Finland föder så gott som alla mammor på ett förlossningssjukhus. Där hjälper en barnmorska
      mamman under förlossningen. En barnmorska är en sjukskötare som är specialiserad på förlossningar.
      Det är vanligt att också babyns andra förälder är med vid förlossningen.
    sentences:
    - id: hb-c09-u0255-s001
      start: 0
      end: 67
    - id: hb-c09-u0255-s002
      start: 68
      end: 121
    - id: hb-c09-u0255-s003
      start: 122
      end: 192
    - id: hb-c09-u0255-s004
      start: 193
      end: 265
  - type: paragraph
    id: hb-c09-u0256
    text: I Finland är könsstympning av flickor och kvinnor ett brott. Det är också förbjudet i lag att
      stänga slidans öppning på nytt efter en förlossning.
    sentences:
    - id: hb-c09-u0256-s001
      start: 0
      end: 60
    - id: hb-c09-u0256-s002
      start: 61
      end: 146
  - type: paragraph
    id: hb-c09-u0257
    text: I Finland är könsstympning av flickor ett allvarligt brott, som kan ge flera års fängelsestraff.
      En finsk medborgare eller en flicka som bor här permanent får inte könsstympas i Finland eller något
      annat land. En vuxen får alltså inte ta med sig en flicka från Finland till ett annat land för att
      tvinga henne att genomgå könsstympning.
    sentences:
    - id: hb-c09-u0257-s001
      start: 0
      end: 96
    - id: hb-c09-u0257-s002
      start: 97
      end: 209
    - id: hb-c09-u0257-s003
      start: 210
      end: 336
  - type: paragraph
    id: hb-c09-u0258
    text: Omskärelse av pojkar är inte förbjuden i lag i Finland, men utförs inte inom den offentliga
      hälsovården utan medicinsk orsak. Endast legitimerade läkare får utföra omskärelse.
    sentences:
    - id: hb-c09-u0258-s001
      start: 0
      end: 125
    - id: hb-c09-u0258-s002
      start: 126
      end: 175
  - type: paragraph
    id: hb-c09-u0259
    text: Vanligen måste du vara stadigvarande bosatt i Finland eller arbeta i Finland för att kunna få
      stöd. Barnets medborgarskap påverkar inte huruvida du får stöd eller inte. Föräldrarnas uppehållstillstånd
      däremot kan påverka vilka stöd familjen kan få.
    sentences:
    - id: hb-c09-u0259-s001
      start: 0
      end: 99
    - id: hb-c09-u0259-s002
      start: 100
      end: 168
    - id: hb-c09-u0259-s003
      start: 169
      end: 248
  - type: paragraph
    id: hb-c09-u0260
    text: Om du bor i Finland kan du ha rätt till moderskapsunderstöd. Moderskapsunderstödet är antingen
      en moderskapsförpackning eller ett fast skattefritt belopp, du väljer vilket alternativ du vill
      ha. Moderskapsförpackningen innehåller babykläder och vårdartiklar.
    sentences:
    - id: hb-c09-u0260-s001
      start: 0
      end: 60
    - id: hb-c09-u0260-s002
      start: 61
      end: 194
    - id: hb-c09-u0260-s003
      start: 195
      end: 258
  - type: paragraph
    id: hb-c09-u0261
    text: Du har rätt till moderskapsunderstöd då
    sentences:
    - id: hb-c09-u0261-s001
      start: 0
      end: 39
  - id: hb-c09-u0263
    type: list
    ordered: false
    items:
    - id: hb-c09-u0262
      text: graviditeten varat i cirka fem månader,
      sentences:
      - id: hb-c09-u0262-s001
        start: 0
        end: 39
    - id: hb-c09-u0264
      text: du har gjort en läkarundersökning före utgången av den fjärde graviditetsmånaden och
      sentences:
      - id: hb-c09-u0264-s001
        start: 0
        end: 84
    - id: hb-c09-u0265
      text: du bor stadigvarande i Finland.
      sentences:
      - id: hb-c09-u0265-s001
        start: 0
        end: 31
- id: hb-c09-foraldraledighet
  title: Graviditetsledighet och föräldraledighet
  blocks:
  - type: paragraph
    id: hb-c09-u0266
    text: Du kan gå på graviditetsledighet 14–30 vardagar före det beräknade förlossningsdatumet. Då får
      du graviditetspenning. Den betalas i 40 vardagar, alltså ungefär 1,5 månader.
    sentences:
    - id: hb-c09-u0266-s001
      start: 0
      end: 87
    - id: hb-c09-u0266-s002
      start: 88
      end: 117
    - id: hb-c09-u0266-s003
      start: 118
      end: 172
  - type: paragraph
    id: hb-c09-u0267
    text: 'Du kan få graviditetspenning om följande villkor uppfylls:'
    sentences:
    - id: hb-c09-u0267-s001
      start: 0
      end: 58
  - id: hb-c09-u0269
    type: list
    ordered: false
    items:
    - id: hb-c09-u0268
      text: Du är den förälder som ska föda barnet och graviditeten har varat i 154 dagar.
      sentences:
      - id: hb-c09-u0268-s001
        start: 0
        end: 78
    - id: hb-c09-u0270
      text: Du är borta från ditt arbete.
      sentences:
      - id: hb-c09-u0270-s001
        start: 0
        end: 29
    - id: hb-c09-u0271
      text: Du har rätt till FPA:s stöd.
      sentences:
      - id: hb-c09-u0271-s001
        start: 0
        end: 28
  - type: paragraph
    id: hb-c09-u0272
    text: Du kan få graviditetspenning också om du är studerande eller arbetslös.
    sentences:
    - id: hb-c09-u0272-s001
      start: 0
      end: 71
  - type: paragraph
    id: hb-c09-u0273
    text: Efter graviditetspenningperioden kan du vara föräldraledig och få föräldrapenning.
    sentences:
    - id: hb-c09-u0273-s001
      start: 0
      end: 82
  - type: paragraph
    id: hb-c09-u0274
    text: 'Du kan få föräldrapenning från FPA om följande villkor uppfylls:'
    sentences:
    - id: hb-c09-u0274-s001
      start: 0
      end: 64
  - id: hb-c09-u0276
    type: list
    ordered: false
    items:
    - id: hb-c09-u0275
      text: Du vårdar ett barn som är under två år eller ett adoptivbarn som tagits i vård för mindre
        än två år sedan hemma.
      sentences:
      - id: hb-c09-u0275-s001
        start: 0
        end: 112
    - id: hb-c09-u0277
      text: Du arbetar inte.
      sentences:
      - id: hb-c09-u0277-s001
        start: 0
        end: 16
    - id: hb-c09-u0278
      text: Du har rätt till FPA:s stöd.
      sentences:
      - id: hb-c09-u0278-s001
        start: 0
        end: 28
  - type: paragraph
    id: hb-c09-u0279
    text: Om du är den förälder som ska föda barnet kan du få föräldrapenning direkt efter att graviditetspenningperioden
      har upphört, även om barnet inte skulle ha fötts ännu.
    sentences:
    - id: hb-c09-u0279-s001
      start: 0
      end: 166
  - type: paragraph
    id: hb-c09-u0280
    text: Om du är den förälder som inte ska föda barnet kan du inleda föräldrapenningperioden så fort
      barnet har fötts.
    sentences:
    - id: hb-c09-u0280-s001
      start: 0
      end: 110
  - type: paragraph
    id: hb-c09-u0281
    text: Föräldrarna kan få föräldrapenning för sammanlagt 320 vardagar, alltså ungefär 13 månader. Vardera
      föräldern har rätt till hälften av föräldrapenningdagarna, alltså 160 dagar.
    sentences:
    - id: hb-c09-u0281-s001
      start: 0
      end: 90
    - id: hb-c09-u0281-s002
      start: 91
      end: 175
  - type: paragraph
    id: hb-c09-u0282
    text: Om du är barnets enda vårdnadshavare, kan du använda alla 320 vardagar och få föräldrapenning
      under en längre period.
    sentences:
    - id: hb-c09-u0282-s001
      start: 0
      end: 117
  - type: paragraph
    id: hb-c09-u0283
    text: Om familjen får tvillingar kan ni få föräldrapenning för ytterligare 84 vardagar.
    sentences:
    - id: hb-c09-u0283-s001
      start: 0
      end: 81
  - type: paragraph
    id: hb-c09-u0284
    text: Du kan få föräldrapenning flexibelt när du vill fram till dess att barnet fyller två år.
    sentences:
    - id: hb-c09-u0284-s001
      start: 0
      end: 88
  - type: paragraph
    id: hb-c09-u0285
    text: Du kan överlåta högst 63 vardagar av din föräldrapenningkvot på 160 vardagar till barnets andra
      förälder.
    sentences:
    - id: hb-c09-u0285-s001
      start: 0
      end: 105
  - type: paragraph
    id: hb-c09-u0286
    text: Beloppet på föräldradagpenningen beror på din årsinkomst. Föräldrapenningen är alltid mindre
      än lönen.
    sentences:
    - id: hb-c09-u0286-s001
      start: 0
      end: 57
    - id: hb-c09-u0286-s002
      start: 58
      end: 102
  - type: paragraph
    id: hb-c09-u0435
    text: Om du inte har några inkomster, får du föräldrapenningens minimibelopp.
    sentences:
    - id: hb-c09-u0435-s001
      start: 0
      end: 71
  - type: paragraph
    id: hb-c09-u0287
    text: Ta i god tid reda på om din arbetsgivare betalar ut lön för föräldraledigheten. Du behöver denna
      uppgift till din ansökan om föräldrapenning. Om du får lön för föräldraledigheten, betalar FPA föräldrapenningen
      för denna period till din arbetsgivare.
    sentences:
    - id: hb-c09-u0287-s001
      start: 0
      end: 79
    - id: hb-c09-u0287-s002
      start: 80
      end: 141
    - id: hb-c09-u0287-s003
      start: 142
      end: 249
  - type: paragraph
    id: hb-c09-u0288
    text: Om du tar hand om barnet under en del av dagen och har ett deltidsarbete samtidigt, kan du ansöka
      om partiell föräldrapenning. Din dagliga arbetstid får vara högst fem timmar om dagen. Om du har
      en anställning, måste du ha ett avtal om deltidsarbete med din arbetsgivare.
    sentences:
    - id: hb-c09-u0288-s001
      start: 0
      end: 126
    - id: hb-c09-u0288-s002
      start: 127
      end: 184
    - id: hb-c09-u0288-s003
      start: 185
      end: 271
  - type: paragraph
    id: hb-c09-u0289
    text: Föräldrarna kan också arbeta deltid och sköta barnet växelvis eller samtidigt. För denna tid
      betalar FPA partiell föräldrapenning till båda föräldrarna.
    sentences:
    - id: hb-c09-u0289-s001
      start: 0
      end: 78
    - id: hb-c09-u0289-s002
      start: 79
      end: 152
- id: hb-c09-vardledighet
  title: Vårdledighet och stöd för vård i hemmet
  blocks:
  - type: paragraph
    id: hb-c09-u0290
    text: Om du tar hand om ditt barn hemma, har du rätt att ta ut oavlönad vårdledighet från ditt arbete
      ända tills barnet fyller tre år.
    sentences:
    - id: hb-c09-u0290-s001
      start: 0
      end: 128
  - type: paragraph
    id: hb-c09-u0291
    text: Om du ska vara vårdledig kan du ansöka om hemvårdsstöd hos FPA. Du kan ansöka om hemvårdsstöd
      även om du inte har ett jobb.
    sentences:
    - id: hb-c09-u0291-s001
      start: 0
      end: 63
    - id: hb-c09-u0291-s002
      start: 64
      end: 123
  - type: paragraph
    id: hb-c09-u0292
    text: 'Du kan få hemvårdsstöd om alla dessa villkor uppfylls:'
    sentences:
    - id: hb-c09-u0292-s001
      start: 0
      end: 54
  - id: hb-c09-u0294
    type: list
    ordered: false
    items:
    - id: hb-c09-u0293
      text: Barnet är inte på daghem (eller i annan småbarnspedagogik).
      sentences:
      - id: hb-c09-u0293-s001
        start: 0
        end: 59
    - id: hb-c09-u0295
      text: Föräldern eller någon annan (t.ex. en släkting) vårdar barnet.
      sentences:
      - id: hb-c09-u0295-s001
        start: 0
        end: 62
    - id: hb-c09-u0296
      text: Det har gått 160 vardagar (ungefär sex månader) sedan barnet föddes.
      sentences:
      - id: hb-c09-u0296-s001
        start: 0
        end: 68
    - id: hb-c09-u0297
      text: För barnet betalas ingen föräldrapenning eller partiell föräldrapenning.
      sentences:
      - id: hb-c09-u0297-s001
        start: 0
        end: 72
  - type: paragraph
    id: hb-c09-u0298
    text: 'Också ett av följande krav måste uppfyllas:'
    sentences:
    - id: hb-c09-u0298-s001
      start: 0
      end: 43
  - id: hb-c09-u0300
    type: list
    ordered: false
    items:
    - id: hb-c09-u0299
      text: Barnet bor stadigvarande i Finland eller
      sentences:
      - id: hb-c09-u0299-s001
        start: 0
        end: 40
    - id: hb-c09-u0301
      text: Barnet bor tillfälligt i Finland och minst en av föräldrarna arbetar i Finland och har en
        arbetspensionsförsäkring.
      sentences:
      - id: hb-c09-u0301-s001
        start: 0
        end: 115
  - type: paragraph
    id: hb-c09-u0302
    text: Du kan få hemvårdsstöd samtidigt för flera barn under skolåldern, så länge barnen inte är på
      daghem (eller i annan småbarnspedagogik). Stödet upphör när familjens yngsta barn fyller tre år.
    sentences:
    - id: hb-c09-u0302-s001
      start: 0
      end: 134
    - id: hb-c09-u0302-s002
      start: 135
      end: 189
  - type: paragraph
    id: hb-c09-u0303
    text: Hemvårdsstödet är skattepliktigt.
    sentences:
    - id: hb-c09-u0303-s001
      start: 0
      end: 33
  - type: paragraph
    id: hb-c09-u0304
    text: Hemvårdsstöd kan i vissa fall även betalas när barnet bor i ett annat land.
    sentences:
    - id: hb-c09-u0304-s001
      start: 0
      end: 75
  - type: paragraph
    id: hb-c09-u0305
    text: Du kan få hemvårdsstöd från Finland om
    sentences:
    - id: hb-c09-u0305-s001
      start: 0
      end: 38
  - id: hb-c09-u0307
    type: list
    ordered: false
    items:
    - id: hb-c09-u0306
      text: du arbetar i Finland men ditt barn bor i ett annat EU- eller EES-land eller
      sentences:
      - id: hb-c09-u0306-s001
        start: 0
        end: 75
    - id: hb-c09-u0308
      text: du flyttar tillfälligt utomlands. FPA bedömer om flytten är tillfällig eller permanent.
      sentences:
      - id: hb-c09-u0308-s001
        start: 0
        end: 33
      - id: hb-c09-u0308-s002
        start: 34
        end: 87
  - type: paragraph
    id: hb-c09-u0309
    text: Flexibel vårdpenning och partiell vårdpenning är avsedda för föräldrar som arbetar på deltid
      på grund av vård av barn.
    sentences:
    - id: hb-c09-u0309-s001
      start: 0
      end: 118
  - type: paragraph
    id: hb-c09-u0310
    text: Föräldrarna kan få flexibel vårdpenning eller partiell vårdpenning samtidigt om båda föräldrarna
      arbetar på deltid och tar hand om barnet under olika tider.
    sentences:
    - id: hb-c09-u0310-s001
      start: 0
      end: 156
  - type: paragraph
    id: hb-c09-u0311
    text: Vårdpenning betalas bara för ett barn i taget och är skattepliktig inkomst.
    sentences:
    - id: hb-c09-u0311-s001
      start: 0
      end: 75
  - type: paragraph
    id: hb-c09-u0312
    text: Du kan få flexibel vårdpenning om
    sentences:
    - id: hb-c09-u0312-s001
      start: 0
      end: 33
  - id: hb-c09-u0314
    type: list
    ordered: false
    items:
    - id: hb-c09-u0313
      text: du bor med barnet i Finland
      sentences:
      - id: hb-c09-u0313-s001
        start: 0
        end: 27
    - id: hb-c09-u0315
      text: barnet är under tre år
      sentences:
      - id: hb-c09-u0315-s001
        start: 0
        end: 22
    - id: hb-c09-u0316
      text: du arbetar högst 30 timmar i veckan
      sentences:
      - id: hb-c09-u0316-s001
        start: 0
        end: 35
    - id: hb-c09-u0317
      text: barnet inte är på daghem (eller i annan småbarnspedagogik) på heltid.
      sentences:
      - id: hb-c09-u0317-s001
        start: 0
        end: 69
  - type: paragraph
    id: hb-c09-u0318
    text: Barnet kan vara på daghem eller i annan småbarnspedagogik på deltid.
    sentences:
    - id: hb-c09-u0318-s001
      start: 0
      end: 68
  - type: paragraph
    id: hb-c09-u0319
    text: Du kan få partiell vårdpenning om
    sentences:
    - id: hb-c09-u0319-s001
      start: 0
      end: 33
  - id: hb-c09-u0321
    type: list
    ordered: false
    items:
    - id: hb-c09-u0320
      text: du bor med barnet i Finland
      sentences:
      - id: hb-c09-u0320-s001
        start: 0
        end: 27
    - id: hb-c09-u0322
      text: barnet går i åk 1 eller 2 i grundskolan
      sentences:
      - id: hb-c09-u0322-s001
        start: 0
        end: 39
    - id: hb-c09-u0323
      text: du arbetar högst 30 timmar i veckan.
      sentences:
      - id: hb-c09-u0323-s001
        start: 0
        end: 36
  - type: paragraph
    id: hb-c09-u0324
    text: Du kan inte få flexibel eller partiell vårdpenning om du får föräldradagpenning och/eller hemvårdsstöd
      och själv tar hand om dina barn.
    sentences:
    - id: hb-c09-u0324-s001
      start: 0
      end: 135
- id: hb-c09-barnbidrag
  title: Barnbidrag
  blocks:
  - type: paragraph
    id: hb-c09-u0325
    text: FPA betalar ut barnbidrag för alla barn varje månad. Syftet med barnbidraget är att stödja familjens
      ekonomi. FPA betalar ut barnbidrag fram till slutet av den månad då barnet fyller 17 år.
    sentences:
    - id: hb-c09-u0325-s001
      start: 0
      end: 52
    - id: hb-c09-u0325-s002
      start: 53
      end: 109
    - id: hb-c09-u0325-s003
      start: 110
      end: 189
  - type: paragraph
    id: hb-c09-u0326
    text: FPA betalar ut barnbidrag för varje barn som bor stadigvarande i Finland.
    sentences:
    - id: hb-c09-u0326-s001
      start: 0
      end: 73
  - type: paragraph
    id: hb-c09-u0327
    text: En förälder som bor ensam med ett eller flera barn kan få förhöjt barnbidrag.
    sentences:
    - id: hb-c09-u0327-s001
      start: 0
      end: 77
  - type: paragraph
    id: hb-c09-u0328
    text: På barnbidraget betalas ingen skatt.
    sentences:
    - id: hb-c09-u0328-s001
      start: 0
      end: 36
  - type: paragraph
    id: hb-c09-u0329
    text: I vissa situationer kan barnbidrag också betalas om familjen vistas utomlands. Det kan också
      betalas för ett barn som är bosatt utomlands (om barnets förälder arbetar i Finland).
    sentences:
    - id: hb-c09-u0329-s001
      start: 0
      end: 78
    - id: hb-c09-u0329-s002
      start: 79
      end: 178
- id: hb-c09-familjetjanster
  title: Förebyggande tjänster och hemservice
  blocks:
  - type: paragraph
    id: hb-c09-u0330
    text: Föräldrarna ansvarar för omsorgen om och uppfostran av barnet. De har dock rätt att få hjälp
      av samhället om de behöver. I Finland bedriver myndigheterna mycket förebyggande arbete med barn
      och familjer. Det betyder att samhället försöker stödja barn, föräldrar och familjer redan innan
      problemen blir stora. Ibland behöver familjer mer stöd i svåra livssituationer.
    sentences:
    - id: hb-c09-u0330-s001
      start: 0
      end: 62
    - id: hb-c09-u0330-s002
      start: 63
      end: 120
    - id: hb-c09-u0330-s003
      start: 121
      end: 203
    - id: hb-c09-u0330-s004
      start: 204
      end: 308
    - id: hb-c09-u0330-s005
      start: 309
      end: 366
  - type: paragraph
    id: hb-c09-u0331
    text: Familjer kan ta del av många olika slags tjänster som kan underlätta vardagen och förhindra
      problem. Man kan få hjälp och stöd hos till exempel rådgivningsbyråerna, skolan, olika organisationer
      och föreningar eller församlingen och andra religiösa samfund.
    sentences:
    - id: hb-c09-u0331-s001
      start: 0
      end: 100
    - id: hb-c09-u0331-s002
      start: 101
      end: 256
  - type: paragraph
    id: hb-c09-u0332
    text: Om stödet som ges via de tjänster som är gemensamma för alla inte är tillräckligt, kan man få
      hjälp via socialtjänsterna för barnfamiljer. Dessa tjänster omfattar bland annat handledning och
      rådgivning, ekonomiskt stöd, hemservice och en stödperson eller en stödfamilj. Barnets skolgång
      och hobbyer kan också stödjas. Genom att vara klient hos barnskyddet får man dessutom mer stöd.
    sentences:
    - id: hb-c09-u0332-s001
      start: 0
      end: 138
    - id: hb-c09-u0332-s002
      start: 139
      end: 269
    - id: hb-c09-u0332-s003
      start: 270
      end: 317
    - id: hb-c09-u0332-s004
      start: 318
      end: 382
  - type: paragraph
    id: hb-c09-u0333
    text: Hemservice innebär att familjen får hembesök av en yrkesperson som hjälper till med hushållssysslor,
      till exempel städning, inköp eller barnomsorg. Man kan få hemservice om familjen behöver särskilt
      stöd. Det kan vara aktuellt till exempel om den ena föräldern blir allvarligt sjuk.
    sentences:
    - id: hb-c09-u0333-s001
      start: 0
      end: 147
    - id: hb-c09-u0333-s002
      start: 148
      end: 204
    - id: hb-c09-u0333-s003
      start: 205
      end: 282
  - type: paragraph
    id: hb-c09-u0334
    text: En stödperson hjälper barnet med till exempel hobbyer och läxor. En stödfamilj är en vanlig
      familj som barnet ibland kan bo hos, till exempel en helg per månad.
    sentences:
    - id: hb-c09-u0334-s001
      start: 0
      end: 64
    - id: hb-c09-u0334-s002
      start: 65
      end: 160
  - type: paragraph
    id: hb-c09-u0335
    text: Utgångspunkten är att man försöker hjälpa barnet på ett sådant sätt att hen kan bo hemma med
      sin familj. Om barnets eller familjens situation kräver utomstående hjälp, försöker man alltid tillämpa
      lindrigast möjliga metod. Inom barnskyddet kallas dessa tjänster för stödåtgärder inom öppenvården.
      Stödåtgärderna är alltid frivilliga och bygger på samarbete med familjen. Nuförtiden kan man ta
      del av många av stödåtgärderna utan att vara klient hos barnskyddet.
    sentences:
    - id: hb-c09-u0335-s001
      start: 0
      end: 104
    - id: hb-c09-u0335-s002
      start: 105
      end: 222
    - id: hb-c09-u0335-s003
      start: 223
      end: 296
    - id: hb-c09-u0335-s004
      start: 297
      end: 370
    - id: hb-c09-u0335-s005
      start: 371
      end: 461
  - type: paragraph
    id: hb-c09-u0336
    text: Om familjen har fått en baby, om en vuxen person i familjen är utmattad eller om familjen befinner
      sig i någon annan särskild situation kan man ansöka om hemservice. Hemservicen för barnfamiljer
      är praktisk hjälp i hushållsarbeten eller barnpassning som är avsedd att underlätta familjens vardag
      och barnfostran. Barnfamiljer kan ansöka om hemservice tillfälligt eller regelbundet om familjens
      situation kräver detta. Hemservicen är vanligtvis avgiftsbelagd. Familjens inkomster påverkar avgiften
      och dess storlek.
    sentences:
    - id: hb-c09-u0336-s001
      start: 0
      end: 165
    - id: hb-c09-u0336-s002
      start: 166
      end: 312
    - id: hb-c09-u0336-s003
      start: 313
      end: 417
    - id: hb-c09-u0336-s004
      start: 418
      end: 458
    - id: hb-c09-u0336-s005
      start: 459
      end: 514
  - type: paragraph
    id: hb-c09-u0337
    text: Om du har problem med att betala räkningar, kan du få hjälp med och rådgivning om ekonomin.
      Om din inkomst minskar ska du ta reda på din rätt att få till exempel bostadsbidrag. Om dina inkomster
      och tillgångar inte räcker till den nödvändiga dagliga försörjningen, till exempel mat och läkemedel,
      kan du ha rätt till grundläggande utkomststöd.
    sentences:
    - id: hb-c09-u0337-s001
      start: 0
      end: 91
    - id: hb-c09-u0337-s002
      start: 92
      end: 176
    - id: hb-c09-u0337-s003
      start: 177
      end: 343
  - type: paragraph
    id: hb-c09-u0338
    text: Om ett barn eller en ung har problem i skolan eller med studierna är det bra att diskutera situationen
      med skolans eller läroanstaltens studievägledare. I skolan arbetar även en psykolog eller en kurator.
      Hen hjälper elever som har svårigheter i skolan.
    sentences:
    - id: hb-c09-u0338-s001
      start: 0
      end: 152
    - id: hb-c09-u0338-s002
      start: 153
      end: 204
    - id: hb-c09-u0338-s003
      start: 205
      end: 253
  - type: paragraph
    id: hb-c09-u0339
    text: Om ett barn eller en ung blir mobbad i skolan är det skolans skyldighet att ingripa i detta.
      Berätta om mobbning för läraren eller rektorn. Ibland kan mobbning även vara ett brott enligt lagen,
      som kan anmälas till polisen. Till exempel fysiskt våld eller stjälande är brott.
    sentences:
    - id: hb-c09-u0339-s001
      start: 0
      end: 92
    - id: hb-c09-u0339-s002
      start: 93
      end: 139
    - id: hb-c09-u0339-s003
      start: 140
      end: 223
    - id: hb-c09-u0339-s004
      start: 224
      end: 275
  - type: paragraph
    id: hb-c09-u0340
    text: Om en ung har problem med alkohol, droger eller spelande, kan hen få hjälp vid ungdomsstationen
      (nuorisoasema). Ungdomsstationer finns i många städer. Den unga kan komma till ungdomsstationen
      ensam eller med sina föräldrar.
    sentences:
    - id: hb-c09-u0340-s001
      start: 0
      end: 111
    - id: hb-c09-u0340-s002
      start: 112
      end: 150
    - id: hb-c09-u0340-s003
      start: 151
      end: 223
  - type: paragraph
    id: hb-c09-u0341
    text: Brott har påföljder för personer under 15 år. Personen är skyldig att ersätta de skador som
      hen orsakat. Polisen anmäler brott som begåtts av barn under 18 år till föräldrarna och barnskyddsmyndigheten.
    sentences:
    - id: hb-c09-u0341-s001
      start: 0
      end: 45
    - id: hb-c09-u0341-s002
      start: 46
      end: 104
    - id: hb-c09-u0341-s003
      start: 105
      end: 202
- id: hb-c09-barnskydd
  title: Barnskydd och vård utom hemmet
  blocks:
  - type: paragraph
    id: hb-c09-u0342
    text: I Finland föreskriver barnskyddslagen hurdant barnskyddet ska vara. Syftet med barnskyddet är
      att säkerställa att barn har en trygg uppväxtmiljö och kan växa upp på ett harmoniskt sätt. Barnskyddslagen
      gäller alla barn som bor i Finland. Barnskyddsmyndigheterna är experter på socialarbete, och deras
      arbete baserar sig på lagen.
    sentences:
    - id: hb-c09-u0342-s001
      start: 0
      end: 67
    - id: hb-c09-u0342-s002
      start: 68
      end: 185
    - id: hb-c09-u0342-s003
      start: 186
      end: 237
    - id: hb-c09-u0342-s004
      start: 238
      end: 329
  - type: paragraph
    id: hb-c09-u0343
    text: Utgångspunkten för barnskyddet är alltid barnets intresse. Det betyder att de anställda i alla
      beslut som gäller barnet ska bedöma vilken den bästa lösningen är för just det här barnet i den
      här livssituationen.
    sentences:
    - id: hb-c09-u0343-s001
      start: 0
      end: 58
    - id: hb-c09-u0343-s002
      start: 59
      end: 211
  - type: paragraph
    id: hb-c09-u0344
    text: Om en familj behöver hjälp i en svår livssituation, kan den själv be om hjälp hos barnskyddet.
      Likaså ska man be om hjälp om någon skadar ett barn allvarligt. Barnskyddet har skyldighet att ingripa
      också på eget initiativ, om föräldrarna inte kan ta hand om sitt barn eller om barnet på något sätt
      är hotat.
    sentences:
    - id: hb-c09-u0344-s001
      start: 0
      end: 94
    - id: hb-c09-u0344-s002
      start: 95
      end: 158
    - id: hb-c09-u0344-s003
      start: 159
      end: 307
  - type: paragraph
    id: hb-c09-u0345
    text: Om det ser ut att finnas allvarliga problem i en familj och ett barns välbefinnande är i fara,
      kan också en person utanför familjen göra en barnskyddsanmälan. Anmälan görs till välfärdsområdets
      socialvårdstjänster och kan göras per telefon, skriftligt eller genom att besöka byrån.
    sentences:
    - id: hb-c09-u0345-s001
      start: 0
      end: 158
    - id: hb-c09-u0345-s002
      start: 159
      end: 281
  - type: paragraph
    id: hb-c09-u0346
    text: Till exempel anställda inom småbarnspedagogiken och skolan är skyldiga att göra en barnskyddsanmälan
      om de misstänker att ett barn behöver hjälp eller om någon måste ingripa i en situation. Dessutom
      kan vem som helst göra en barnskyddsanmälan till de sociala myndigheterna. Anmälan kan också göras
      anonymt.
    sentences:
    - id: hb-c09-u0346-s001
      start: 0
      end: 189
    - id: hb-c09-u0346-s002
      start: 190
      end: 273
    - id: hb-c09-u0346-s003
      start: 274
      end: 306
  - type: paragraph
    id: hb-c09-u0347
    text: Anmälningar till barnskyddet görs till exempel om ett barn använder rusmedel, är självdestruktivt,
      kontinuerligt missköter skolan eller om det finns en misstanke om att barnet till exempel blir slaget.
    sentences:
    - id: hb-c09-u0347-s001
      start: 0
      end: 201
  - type: paragraph
    id: hb-c09-u0348
    text: Om en barnskyddsanmälan har gjorts om en familj, är den sociala myndigheten skyldig att utreda
      huruvida barnet eller den unga behöver skydd, hjälp eller stöd. I allmänhet diskuterar myndigheterna
      saken först med familjen. I samtalet kan en tolk användas som hjälp. En socialarbetare träffar också
      barnet utan föräldrarna.
    sentences:
    - id: hb-c09-u0348-s001
      start: 0
      end: 158
    - id: hb-c09-u0348-s002
      start: 159
      end: 221
    - id: hb-c09-u0348-s003
      start: 222
      end: 264
    - id: hb-c09-u0348-s004
      start: 265
      end: 321
  - type: paragraph
    id: hb-c09-u0349
    text: Utifrån samtalen bedömer myndigheterna huruvida familjen behöver stöd. De gör tillsammans upp
      en plan för barnet och familjen där man skriver in vad familjen behöver hjälp med och hur hjälpen
      ser ut. Den kan bestå av till exempel rådgivning, handledning och samtalshjälp. En stödperson eller
      stödfamilj kan utses för familjen som kan tillbringa tid med familjens barn och på så sätt stödja
      både barnen och föräldrarna. Inom barnskyddsarbetet är det i de flesta fall fråga om öppenvårdstjänster,
      det vill säga barnet kan fortsätta att bo hemma hos föräldrarna.
    sentences:
    - id: hb-c09-u0349-s001
      start: 0
      end: 70
    - id: hb-c09-u0349-s002
      start: 71
      end: 199
    - id: hb-c09-u0349-s003
      start: 200
      end: 271
    - id: hb-c09-u0349-s004
      start: 272
      end: 418
    - id: hb-c09-u0349-s005
      start: 419
      end: 559
  - type: paragraph
    id: hb-c09-u0350
    text: Vård utom hemmet betyder att ett barn placeras tillfälligt att bo någon annanstans än hos sina
      föräldrar eller vårdnadshavare. Om barnet är i omedelbar fara, kan hen placeras brådskande utanför
      hemmet. Orsaker till placeringen kan vara till exempel allvarlig utmattning hos föräldrarna, allvarliga
      utmaningar med uppfostran, en allvarlig långtidssjukdom eller mentala problem i familjen, problematisk
      användning av rusmedel eller familjevåld.
    sentences:
    - id: hb-c09-u0350-s001
      start: 0
      end: 126
    - id: hb-c09-u0350-s002
      start: 127
      end: 201
    - id: hb-c09-u0350-s003
      start: 202
      end: 442
  - type: paragraph
    id: hb-c09-u0351
    text: En placering betyder inte nödvändigtvis omhändertagande. Ett omhändertagande kan göras om ingenting
      annat hjälper. Det innebär att myndigheterna övertar ansvaret för omsorgen om och uppfostran av
      barnet. Omhändertagande är myndigheternas sista alternativ för att skydda ett barn.
    sentences:
    - id: hb-c09-u0351-s001
      start: 0
      end: 56
    - id: hb-c09-u0351-s002
      start: 57
      end: 114
    - id: hb-c09-u0351-s003
      start: 115
      end: 203
    - id: hb-c09-u0351-s004
      start: 204
      end: 279
  - type: paragraph
    id: hb-c09-u0352
    text: Om ett barn placeras utanför hemmet, tar välfärdsområdets barnskyddsmyndigheter hand om hen.
      Barnet placeras att bo i ett familjehem eller på ett barn- eller ungdomshem. En placering är alltid
      tillfällig. Myndigheterna utvärderar regelbundet huruvida barnet kan återvända hem till sin familj.
      Om situationen hemma lugnar sig snabbt, kan vården utom hemmet bli kortvarig. Ibland är ändå familjens
      problem långvariga. Då kan vården utom hemmet eller omhändertagandet fortsätta tills barnet blir
      myndigt och flyttar till en egen bostad.
    sentences:
    - id: hb-c09-u0352-s001
      start: 0
      end: 92
    - id: hb-c09-u0352-s002
      start: 93
      end: 169
    - id: hb-c09-u0352-s003
      start: 170
      end: 204
    - id: hb-c09-u0352-s004
      start: 205
      end: 292
    - id: hb-c09-u0352-s005
      start: 293
      end: 370
    - id: hb-c09-u0352-s006
      start: 371
      end: 415
    - id: hb-c09-u0352-s007
      start: 416
      end: 533
  - type: paragraph
    id: hb-c09-u0353
    text: Målet för barnskyddet är alltid att barnet ska kunna bo hemma hos sina föräldrar. Också under
      vård utom hemmet eller ett omhändertagande arbetar barnskyddsmyndigheterna tillsammans med familjen.
      Tanken är att hjälpa familjen så att det är tryggt för barnet att återvända hem.
    sentences:
    - id: hb-c09-u0353-s001
      start: 0
      end: 81
    - id: hb-c09-u0353-s002
      start: 82
      end: 194
    - id: hb-c09-u0353-s003
      start: 195
      end: 275
- id: hb-c09-vald
  title: Våld i nära relationer
  blocks:
  - type: paragraph
    id: hb-c09-u0354
    text: Våld är ett brott i Finland. Trots det förekommer det våld i en del familjer. Med våld i nära
      relationer avses våld där förövaren och offret har en nära relation till varandra. Offret är maken,
      partnern, den tidigare maken, ett barn, ett syskon, en släkting eller någon annan närstående.
    sentences:
    - id: hb-c09-u0354-s001
      start: 0
      end: 28
    - id: hb-c09-u0354-s002
      start: 29
      end: 77
    - id: hb-c09-u0354-s003
      start: 78
      end: 176
    - id: hb-c09-u0354-s004
      start: 177
      end: 287
  - type: paragraph
    id: hb-c09-u0419
    text: Våld i nära relationer är våld som sker inom familjen.
    sentences:
    - id: hb-c09-u0419-s001
      start: 0
      end: 54
  - type: paragraph
    id: hb-c09-u0420
    text: Det påverkar alla familjemedlemmar, inte bara den som utsätts för våldet.
    sentences:
    - id: hb-c09-u0420-s001
      start: 0
      end: 73
  - type: paragraph
    id: hb-c09-u0355
    text: Fysiskt våld är ofta lätt att känna igen som våld. Det kan vara till exempel slag, knuffar eller
      slag med föremål. Psykiskt våld är också våld. Det kan vara att förövaren till exempel skäller på
      och förödmjukar offret, övervakar vad hen gör eller begränsar hens sociala relationer.
    sentences:
    - id: hb-c09-u0355-s001
      start: 0
      end: 50
    - id: hb-c09-u0355-s002
      start: 51
      end: 114
    - id: hb-c09-u0355-s003
      start: 115
      end: 143
    - id: hb-c09-u0355-s004
      start: 144
      end: 281
  - type: paragraph
    id: hb-c09-u0356
    text: Våld kan också vara ekonomiskt. Ekonomiskt våld kan vara till exempel att den ena maken på egen
      hand fattar alla ekonomiska beslut i familjen eller att den andra inte har tillgång till några egna
      pengar alls. Att pressa eller tvinga någon till sex i sin tur är sexuellt våld. Sex utan samtycke
      är ett brott också när offret och förövaren är gifta med varandra.
    sentences:
    - id: hb-c09-u0356-s001
      start: 0
      end: 31
    - id: hb-c09-u0356-s002
      start: 32
      end: 208
    - id: hb-c09-u0356-s003
      start: 209
      end: 275
    - id: hb-c09-u0356-s004
      start: 276
      end: 360
  - type: paragraph
    id: hb-c09-u0357
    text: Typiskt för våld i nära relationer är att det först börjar med psykiskt våld, det vill säga
      med till exempel ett kontrollerande beteende. Med tiden blir våldet ofta allvarligare och börjar
      inkludera också fysiskt våld.
    sentences:
    - id: hb-c09-u0357-s001
      start: 0
      end: 137
    - id: hb-c09-u0357-s002
      start: 138
      end: 218
  - type: paragraph
    id: hb-c09-u0358
    text: Om det förekommer våld i familjen är det viktigt att anmäla det till polisen. Tyvärr anmäls
      endast en liten del av alla fall med våld i nära relationer till polisen. Folk tänker ofta att våld
      i familjen är en privatsak. Därför tiger de. Våld är ändå alltid en straffbar handling, även om
      den sker inom familjen.
    sentences:
    - id: hb-c09-u0358-s001
      start: 0
      end: 77
    - id: hb-c09-u0358-s002
      start: 78
      end: 165
    - id: hb-c09-u0358-s003
      start: 166
      end: 219
    - id: hb-c09-u0358-s004
      start: 220
      end: 236
    - id: hb-c09-u0358-s005
      start: 237
      end: 311
  - type: paragraph
    id: hb-c09-u0359
    text: Att fysiskt aga och misshandla ett barn kan orsaka allvarliga skador, till och med dödsfall.
      Barnet kan få svåra trauman av det som skadar hens mentala och sociala utveckling. Om ett barn faller
      offer för våld, kan hen känna mycket hat och rädsla och förlora tilliten till vuxna. Om barnet tar
      modell av en vuxen som beter sig våldsamt, kan det ge problem genom hela livet.
    sentences:
    - id: hb-c09-u0359-s001
      start: 0
      end: 92
    - id: hb-c09-u0359-s002
      start: 93
      end: 175
    - id: hb-c09-u0359-s003
      start: 176
      end: 279
    - id: hb-c09-u0359-s004
      start: 280
      end: 373
  - type: paragraph
    id: hb-c09-u0360
    text: Om en förälder eller ett syskon utnyttjar ett barn sexuellt, är det fråga om särskilt allvarligt
      sexuellt våld och incest. Det orsakar allvarliga trauman och problem för barnets utveckling.
    sentences:
    - id: hb-c09-u0360-s001
      start: 0
      end: 122
    - id: hb-c09-u0360-s002
      start: 123
      end: 189
  - type: paragraph
    id: hb-c09-u0361
    text: Ett barn är aldrig skyldigt till det utnyttjande som hen utsätts för, utan ansvaret ligger alltid
      hos den vuxne. Det är särskilt svårt för barn att berätta om utnyttjande om förövaren är en familjemedlem.
      Övriga familjemedlemmar är skyldiga att ingripa om de misstänker att det förekommer utnyttjande
      inom familjen.
    sentences:
    - id: hb-c09-u0361-s001
      start: 0
      end: 112
    - id: hb-c09-u0361-s002
      start: 113
      end: 204
    - id: hb-c09-u0361-s003
      start: 205
      end: 315
  - type: paragraph
    id: hb-c09-u0362
    text: Användning av våld eller hot om våld påverkar alltid barnen, även om våldet inte skulle rikta
      sig mot dem. Våld mellan föräldrarna ger direkta och indirekta psykiska konsekvenser för barnet.
      Redan en upplevelse av våld kan göra att känslan av trygghet försvinner och sätta livslånga spår
      i barnet.
    sentences:
    - id: hb-c09-u0362-s001
      start: 0
      end: 106
    - id: hb-c09-u0362-s002
      start: 107
      end: 190
    - id: hb-c09-u0362-s003
      start: 191
      end: 297
  - type: paragraph
    id: hb-c09-u0363
    text: Barn kan uppleva att till exempel våld mot mamman är mer skrämmande än våld som de själva utsätts
      för. Även om barnen inte skulle se våldet, kan de känna den spända stämningen i familjen.
    sentences:
    - id: hb-c09-u0363-s001
      start: 0
      end: 102
    - id: hb-c09-u0363-s002
      start: 103
      end: 187
  - type: paragraph
    id: hb-c09-u0364
    text: Våld och rädsla för våld kan ge barnet ångest, glädjelöshet och sömnsvårigheter. Barnets fysiska
      och mentala hälsa och utveckling kan äventyras. Barn som upplevt våld har ofta inlärnings- och koncentrationssvårigheter
      i skolan.
    sentences:
    - id: hb-c09-u0364-s001
      start: 0
      end: 80
    - id: hb-c09-u0364-s002
      start: 81
      end: 144
    - id: hb-c09-u0364-s003
      start: 145
      end: 227
  - type: paragraph
    id: hb-c09-u0365
    text: Skyddsåldersgränsen för sexuellt umgänge är 16 år. Det betyder att sexuellt umgänge med ett
      barn under 16 år är ett brott. Ett sexuellt förhållande mellan ungdomar som befinner på samma stadium
      i utvecklingen är dock inte ett brott. Köp av sexuella tjänster av ett barn under 18 år är ett brott.
    sentences:
    - id: hb-c09-u0365-s001
      start: 0
      end: 50
    - id: hb-c09-u0365-s002
      start: 51
      end: 122
    - id: hb-c09-u0365-s003
      start: 123
      end: 232
    - id: hb-c09-u0365-s004
      start: 233
      end: 295
  - type: paragraph
    id: hb-c09-u0366
    text: De vuxna måste skydda barn från sexuella trakasserier. Ingen får locka eller tvinga ett barn
      till sexuella handlingar.
    sentences:
    - id: hb-c09-u0366-s001
      start: 0
      end: 54
    - id: hb-c09-u0366-s002
      start: 55
      end: 118
- id: hb-c09-heder
  title: Hedersrelaterat våld och tvångsäktenskap
  blocks:
  - type: paragraph
    id: hb-c09-u0367
    text: Hedersrelaterat våld är våld som i allmänhet sker inom den egna familjen, släkten eller gemenskapen.
      Det hänger samman med ett försvar av familjens eller gemenskapens heder. Att bevara hedern innebär
      att en människa får respekt från andra och inte behöver skämmas. Släkten, familjen eller gemenskapen
      upplever att hedern är hela familjens eller släktens angelägenhet. När en individs gärningar bryter
      mot gemenskapens regler och seder försöker de övriga att återställa hedern genom att bruka våld
      eller hota med våld.
    sentences:
    - id: hb-c09-u0367-s001
      start: 0
      end: 100
    - id: hb-c09-u0367-s002
      start: 101
      end: 173
    - id: hb-c09-u0367-s003
      start: 174
      end: 264
    - id: hb-c09-u0367-s004
      start: 265
      end: 367
    - id: hb-c09-u0367-s005
      start: 368
      end: 517
  - type: paragraph
    id: hb-c09-u0368
    text: Ofta är hedersrelaterat våld förknippat med situationer där en familj eller släkt upplever att
      någon i familjen har brutit mot normerna i gemenskapen. En sådan situation kan vara till exempel
      om en ung person tillbringar tid med kompisar som familjen inte tycker att är lämpliga eller som
      klär sig på ett sätt som familjen inte godkänner.
    sentences:
    - id: hb-c09-u0368-s001
      start: 0
      end: 150
    - id: hb-c09-u0368-s002
      start: 151
      end: 338
  - type: paragraph
    id: hb-c09-u0369
    text: Hedersrelaterat våld förekommer först och främst i gemenskapsorienterade kulturer och samfund,
      där män har mycket mer makt än kvinnor. Det förekommer också i Finland. Det är ofta flickor och
      kvinnor och personer som hör till sexuella minoriteter eller könsminoriteter som faller offer för
      våldet. Också pojkar och män kan utsättas för hedersrelaterat våld. De kan också till exempel pressas
      att använda våld mot andra.
    sentences:
    - id: hb-c09-u0369-s001
      start: 0
      end: 134
    - id: hb-c09-u0369-s002
      start: 135
      end: 166
    - id: hb-c09-u0369-s003
      start: 167
      end: 296
    - id: hb-c09-u0369-s004
      start: 297
      end: 356
    - id: hb-c09-u0369-s005
      start: 357
      end: 418
  - type: paragraph
    id: hb-c09-u0370
    text: Hedersrelaterat våld kan vara psykiskt eller fysiskt. Det kan vara att offret till exempel blir
      utsatt för påtryckningar, tvingas att gifta sig, inte får röra sig eller klä sig som hen vill, eller
      att man styr vem hen sällskapar med eller vilka hobbyer hen har. Andra former av våld kan vara hot
      om att skicka personen tillbaka till det gamla hemlandet och andra hot, samt könsstympning av flickor
      och kvinnor eller förhindrande av skilsmässa.
    sentences:
    - id: hb-c09-u0370-s001
      start: 0
      end: 53
    - id: hb-c09-u0370-s002
      start: 54
      end: 261
    - id: hb-c09-u0370-s003
      start: 262
      end: 443
  - type: paragraph
    id: hb-c09-u0371
    text: Enligt Finlands lag är hedersrelaterat våld ett brott. Ibland är det svårt för offret att känna
      igen våldet i synnerhet i det inledande skedet. Till exempel kanske påtryckningar till en början
      inte känns som våld. Det är ändå bra att söka hjälp redan när situationen ännu inte är så allvarlig.
    sentences:
    - id: hb-c09-u0371-s001
      start: 0
      end: 54
    - id: hb-c09-u0371-s002
      start: 55
      end: 143
    - id: hb-c09-u0371-s003
      start: 144
      end: 213
    - id: hb-c09-u0371-s004
      start: 214
      end: 293
  - type: paragraph
    id: hb-c09-u0372
    text: Med tvångsäktenskap avses en situation där den ena eller båda makarna inte fritt har kunnat
      påverka äktenskapet eller ingåendet av en äktenskapsliknande relation eller valet av make. Man kan
      tvinga någon in i äktenskap genom att till exempel utöva påtryckningar eller utpressning, utöva
      våld eller hota med våld. Man kan också hota med uteslutning från familjen eller gemenskapen.
    sentences:
    - id: hb-c09-u0372-s001
      start: 0
      end: 182
    - id: hb-c09-u0372-s002
      start: 183
      end: 312
    - id: hb-c09-u0372-s003
      start: 313
      end: 380
  - type: paragraph
    id: hb-c09-u0373
    text: I synnerhet flickor och kvinnor blir tvingade att gifta sig, men också pojkar och män. Ofta
      är den ena eller båda personerna som tvingas in i äktenskap minderåriga. Personer under 18 år kan
      inte officiellt ingå äktenskap i Finland. Ett barn kan dock föras till ett annat land för att ingå
      äktenskap, eller så kan äktenskapet ingås endast med hjälp av religiösa ceremonier utan någon officiell
      vigsel.
    sentences:
    - id: hb-c09-u0373-s001
      start: 0
      end: 86
    - id: hb-c09-u0373-s002
      start: 87
      end: 164
    - id: hb-c09-u0373-s003
      start: 165
      end: 231
    - id: hb-c09-u0373-s004
      start: 232
      end: 400
  - type: paragraph
    id: hb-c09-u0374
    text: Att tvinga någon in i äktenskap är ett brott i Finland. Enligt finsk lagstiftning är tvångsäktenskap
      en form av människohandel. Om barnets vårdnadshavare inte försöker förhindra ett tvångsäktenskap
      för sitt barn kan också de dömas för brott.
    sentences:
    - id: hb-c09-u0374-s001
      start: 0
      end: 55
    - id: hb-c09-u0374-s002
      start: 56
      end: 127
    - id: hb-c09-u0374-s003
      start: 128
      end: 241
  - type: paragraph
    id: hb-c09-u0375
    text: Hjälpsystemet för offer för människohandel ger stöd till offer för tvångsäktenskap och information
      om tvångsäktenskap och andra former av människohandel.
    sentences:
    - id: hb-c09-u0375-s001
      start: 0
      end: 153
- id: hb-c09-skydd
  title: Skydd, hjälp och besöksförbud
  blocks:
  - type: paragraph
    id: hb-c09-u0376
    text: Ett skyddshem är ett ställe där personer som upplevt våld i nära relationer eller hot om sådant
      får hjälp och trygghet. En person kan gå till ett skyddshem om hen inte kan gå till sitt eget hem
      på grund av till exempel våld, hot eller rädsla. Skyddshemmet är hemlikt och har anställda på plats
      dygnet runt. De anställda hjälper till att lösa krisen. Ett skyddshem är avsett som ett tillfälligt
      ställe att bo på, men hur länge en person bor där beror på det individuella behovet. Skyddshemmens
      tjänster är avgiftsfria.
    sentences:
    - id: hb-c09-u0376-s001
      start: 0
      end: 119
    - id: hb-c09-u0376-s002
      start: 120
      end: 242
    - id: hb-c09-u0376-s003
      start: 243
      end: 306
    - id: hb-c09-u0376-s004
      start: 307
      end: 349
    - id: hb-c09-u0376-s005
      start: 350
      end: 478
    - id: hb-c09-u0376-s006
      start: 479
      end: 517
  - type: paragraph
    id: hb-c09-u0377
    text: Man kan gå till ett skyddshem alltid när det inte är tryggt att vara där hemma. Det behöver
      alltså inte förekomma fysiskt våld i hemmet. Också psykiskt våld, till exempel mycket kontrollerande
      beteende eller hot om våld, kan vara en orsak till att söka skydd.
    sentences:
    - id: hb-c09-u0377-s001
      start: 0
      end: 79
    - id: hb-c09-u0377-s002
      start: 80
      end: 136
    - id: hb-c09-u0377-s003
      start: 137
      end: 259
  - type: paragraph
    id: hb-c09-u0378
    text: Skyddshemmens tjänster är till för alla kön. Man kan också ta med sig barnen till skyddshemmet.
      Till skyddshemmen kan man ringa när som helst, också på natten.
    sentences:
    - id: hb-c09-u0378-s001
      start: 0
      end: 44
    - id: hb-c09-u0378-s002
      start: 45
      end: 95
    - id: hb-c09-u0378-s003
      start: 96
      end: 159
  - type: paragraph
    id: hb-c09-u0379
    text: Ett mödrahem är en plats dit en mamma kan komma med sin baby om hon är i en svår livssituation
      eller om hon är helt ensam. Ett mödrahem är avsett främst för gravida mammor och mammor med små
      babyer. Också den andra föräldern eller mammans partner kan bo på mödrahemmet. På mödrahemmet får
      man i en trygg miljö öva på att ta hand om babyn och på vardagen med en baby.
    sentences:
    - id: hb-c09-u0379-s001
      start: 0
      end: 122
    - id: hb-c09-u0379-s002
      start: 123
      end: 198
    - id: hb-c09-u0379-s003
      start: 199
      end: 269
    - id: hb-c09-u0379-s004
      start: 270
      end: 366
  - type: paragraph
    id: hb-c09-u0380
    text: Om du behöver brådskande hjälp av polisen, ring nödnumret 112. Du ska ringa nödnumret endast
      i brådskande fall där livet, hälsan, egendomen eller miljön är i fara.
    sentences:
    - id: hb-c09-u0380-s001
      start: 0
      end: 62
    - id: hb-c09-u0380-s002
      start: 63
      end: 163
  - type: paragraph
    id: hb-c09-u0381
    text: Nollalinja är en hjälptelefon som du kan ringa om du har blivit utsatt för våld i familjen eller
      sexuellt våld eller hot om våld. Du kan ringa när som helst. Medarbetarna pratar finska, svenska
      och engelska.
    sentences:
    - id: hb-c09-u0381-s001
      start: 0
      end: 129
    - id: hb-c09-u0381-s002
      start: 130
      end: 157
    - id: hb-c09-u0381-s003
      start: 158
      end: 207
  - type: paragraph
    id: hb-c09-u0382
    text: Nollalinja erbjuder också tolktjänst. Tolkningsspråken är ryska, ukrainska, spanska, farsi,
      arabiska, somali, dari, sorani och thai.
    sentences:
    - id: hb-c09-u0382-s001
      start: 0
      end: 37
    - id: hb-c09-u0382-s002
      start: 38
      end: 132
  - type: paragraph
    id: hb-c09-u0383
    text: Samtal till Nollalinja är kostnadsfria och de syns inte i telefonräkningen. Du behöver inte
      uppge ditt namn när du ringer. Nollalinja är avsedd för både kvinnor och män.
    sentences:
    - id: hb-c09-u0383-s001
      start: 0
      end: 75
    - id: hb-c09-u0383-s002
      start: 76
      end: 122
    - id: hb-c09-u0383-s003
      start: 123
      end: 169
  - type: paragraph
    id: hb-c09-u0384
    text: På många orter finns ett SERI-stödcenter (SERI-tukikeskus) som är avsett för offer för sexuellt
      våld. SERI-stödcentret hjälper och ger råd till offer för sexuellt våld. Centret erbjuder bland
      annat medicinsk undersökning och psykologhjälp. Stödcentret betjänar alla, oavsett kön. Tjänsterna
      är kostnadsfria. Du kan uppsöka SERI-stödcentret på egen hand, men det rekommenderas att du ringer
      i förväg.
    sentences:
    - id: hb-c09-u0384-s001
      start: 0
      end: 101
    - id: hb-c09-u0384-s002
      start: 102
      end: 168
    - id: hb-c09-u0384-s003
      start: 169
      end: 239
    - id: hb-c09-u0384-s004
      start: 240
      end: 279
    - id: hb-c09-u0384-s005
      start: 280
      end: 307
    - id: hb-c09-u0384-s006
      start: 308
      end: 399
  - type: paragraph
    id: hb-c09-u0385
    text: Du kan också alltid söka hjälp vid social- och hälsocentralen.
    sentences:
    - id: hb-c09-u0385-s001
      start: 0
      end: 62
  - type: paragraph
    id: hb-c09-u0386
    text: Om någon upprepade gånger hotar eller trakasserar dig och du vill ha skydd, kan du ansöka om
      besöksförbud (lähestymiskielto) för denna person. Besöksförbudet innebär att personen inte får ta
      kontakt med dig. Du kan ansöka om besöksförbud hos polisen eller i tingsrätten. Du kan fråga om
      råd vid socialbyrån eller rättshjälpsbyrån i din hemkommun. Om du har bevis på hot och trakasserier
      är det bra att spara dem.
    sentences:
    - id: hb-c09-u0386-s001
      start: 0
      end: 142
    - id: hb-c09-u0386-s002
      start: 143
      end: 207
    - id: hb-c09-u0386-s003
      start: 208
      end: 270
    - id: hb-c09-u0386-s004
      start: 271
      end: 346
    - id: hb-c09-u0386-s005
      start: 347
      end: 412
- id: hb-c09-dodsfall
  title: Dödsfall, obduktion och organdonation
  blocks:
  - type: paragraph
    id: hb-c09-u0387
    text: När en människa avlider måste familjen och släkten trots sorgen ta itu med många olika saker.
      Om dödsfallet har inträffat hemma, ska man i allmänhet ringa nödcentralen, som hänvisar ärendet
      till en läkare eller till polisen. Läkaren konstaterar dödsfallet och avgör om orsaken till det
      är klar eller om en obduktion ska göras av den avlidne. Om dödsfallet är plötsligt eller inträffar
      på natten eller på en helg, meddelar man i allmänhet polisen om det.
    sentences:
    - id: hb-c09-u0387-s001
      start: 0
      end: 93
    - id: hb-c09-u0387-s002
      start: 94
      end: 224
    - id: hb-c09-u0387-s003
      start: 225
      end: 341
    - id: hb-c09-u0387-s004
      start: 342
      end: 453
  - type: paragraph
    id: hb-c09-u0388
    text: Dödsfall konstateras alltid av läkare. Läkaren ger familjen begravningstillstånd. Läkaren skickar
      också information om dödsfallet till befolkningsdatasystemet. Myndigheterna, såsom FPA, och till
      exempel den avlidnes bank och arbetspensionsförsäkringsbolag får informationen från befolkningsdatasystemet,
      men ofta är det ändå bra att kontakta dessa aktörer. De närstående ska meddela om dödsfallet till
      den avlidnes eventuella arbetsgivare, till husbolagets disponent och hyresvärden och till bland
      annat elbolaget och telefonbolaget.
    sentences:
    - id: hb-c09-u0388-s001
      start: 0
      end: 38
    - id: hb-c09-u0388-s002
      start: 39
      end: 81
    - id: hb-c09-u0388-s003
      start: 82
      end: 159
    - id: hb-c09-u0388-s004
      start: 160
      end: 356
    - id: hb-c09-u0388-s005
      start: 357
      end: 533
  - type: paragraph
    id: hb-c09-u0389
    text: En dödsattest är ett dokument som anger orsaken till ett dödsfall. Ibland skriver läkaren dödsattesten
      först månader efter dödsfallet. Familjen behöver inte dödsattesten när de uträttar ärenden hos olika
      myndigheter. Dödsattesten behövs närmast om familjen måste sköta livförsäkringsärenden för den avlidne.
    sentences:
    - id: hb-c09-u0389-s001
      start: 0
      end: 66
    - id: hb-c09-u0389-s002
      start: 67
      end: 134
    - id: hb-c09-u0389-s003
      start: 135
      end: 216
    - id: hb-c09-u0389-s004
      start: 217
      end: 307
  - type: paragraph
    id: hb-c09-u0390
    text: Om dödsorsaken inte är klar, ska den avlidne obduceras. Vid en obduktion tar läkaren reda på
      varför personen dog. Kroppen kan inte begravas innan dödsorsaken har utretts. En obduktion kan vara
      medicinsk eller rättsmedicinsk.
    sentences:
    - id: hb-c09-u0390-s001
      start: 0
      end: 55
    - id: hb-c09-u0390-s002
      start: 56
      end: 113
    - id: hb-c09-u0390-s003
      start: 114
      end: 170
    - id: hb-c09-u0390-s004
      start: 171
      end: 224
  - type: paragraph
    id: hb-c09-u0391
    text: En medicinsk utredning av dödsorsak utförs av en läkare. En sådan görs om en människas död beror
      på en sjukdom. Då är en utredning av dödsorsaken till allmän nytta för hälso- och sjukvården. Familjen
      måste ge sitt tillstånd till medicinsk obduktion. Den kan inte göras utan tillstånd.
    sentences:
    - id: hb-c09-u0391-s001
      start: 0
      end: 56
    - id: hb-c09-u0391-s002
      start: 57
      end: 111
    - id: hb-c09-u0391-s003
      start: 112
      end: 190
    - id: hb-c09-u0391-s004
      start: 191
      end: 249
    - id: hb-c09-u0391-s005
      start: 250
      end: 284
  - type: paragraph
    id: hb-c09-u0392
    text: Polisen ansvarar för rättsmedicinska utredningar av dödsorsak. Polisen beordrar att en rättsmedicinsk
      obduktion ska utföras om ett dödsfall inte beror på en sjukdom, om det har inträffat plötsligt eller
      om dödsfallet har inträffat i samband med en olycka, ett brott eller självmord. Polisen behöver
      inte familjens tillstånd och familjen kan inte vägra obduktionen.
    sentences:
    - id: hb-c09-u0392-s001
      start: 0
      end: 62
    - id: hb-c09-u0392-s002
      start: 63
      end: 282
    - id: hb-c09-u0392-s003
      start: 283
      end: 364
  - type: paragraph
    id: hb-c09-u0393
    text: Organdonation innebär att en människa ger organen och vävnaderna i sin kropp till andra människor
      efter sin död. De donerade organen kan rädda en annan människas liv eller förbättra någons hälsa.
    sentences:
    - id: hb-c09-u0393-s001
      start: 0
      end: 112
    - id: hb-c09-u0393-s002
      start: 113
      end: 195
  - type: paragraph
    id: hb-c09-u0394
    text: Enligt finsk lag är varje människa organdonator om hen inte har motsatt sig det medan hen levde.
      Om man överväger organdonation, försöker läkaren ta reda på vad den avlidnes vilja skulle ha varit
      i frågan. Man antar ändå att personen skulle ha samtyckt till organdonation om man inte känner till
      att hen varit emot det. Om en person vill kan hen göra upp ett organdonationstestamente före sin
      död. Av det framgår personens vilja tydligt. Familjen kan inte vägra organdonation om personen själv
      har önskat donera sina organ.
    sentences:
    - id: hb-c09-u0394-s001
      start: 0
      end: 96
    - id: hb-c09-u0394-s002
      start: 97
      end: 205
    - id: hb-c09-u0394-s003
      start: 206
      end: 319
    - id: hb-c09-u0394-s004
      start: 320
      end: 397
    - id: hb-c09-u0394-s005
      start: 398
      end: 437
    - id: hb-c09-u0394-s006
      start: 438
      end: 523
  - type: paragraph
    id: hb-c09-u0395
    text: Man kan också testamentera sin kropp till medicinsk forskning. Då måste man underteckna ett
      avtal där man förbinder sig att ge sin kropp till undervisningsbruk efter döden.
    sentences:
    - id: hb-c09-u0395-s001
      start: 0
      end: 62
    - id: hb-c09-u0395-s002
      start: 63
      end: 172
- id: hb-c09-begravning
  title: Begravning och stöd efter dödsfall
  blocks:
  - type: paragraph
    id: hb-c09-u0396
    text: I Finland är det vanligt att begravningar ordnas först flera veckor efter ett dödsfall. Det
      tar tid att ta hand om alla praktiska arrangemang och ordna med begravningen, och dessutom kan det
      vara rusning på begravningsplatserna. Den avlidne, det vill säga den som dött, kan dock begravas
      också snabbare, om dödsorsaken har utretts och en läkare har gett begravningstillstånd.
    sentences:
    - id: hb-c09-u0396-s001
      start: 0
      end: 87
    - id: hb-c09-u0396-s002
      start: 88
      end: 228
    - id: hb-c09-u0396-s003
      start: 229
      end: 375
  - type: paragraph
    id: hb-c09-u0397
    text: Var och en får ordna en sådan begravning som den vill för den anhörige, men i mån av möjlighet
      ska den avlidnes önskemål uppfyllas. Människor som hör till olika religioner har olika begravningstraditioner.
      I Finland finns det många olika begravningsbyråer som erbjuder hjälp. Begravningsbyråer är företag
      som ordnar begravningar. Man kan också själv ordna begravningen.
    sentences:
    - id: hb-c09-u0397-s001
      start: 0
      end: 131
    - id: hb-c09-u0397-s002
      start: 132
      end: 205
    - id: hb-c09-u0397-s003
      start: 206
      end: 275
    - id: hb-c09-u0397-s004
      start: 276
      end: 329
    - id: hb-c09-u0397-s005
      start: 330
      end: 369
  - type: paragraph
    id: hb-c09-u0398
    text: I Finland bestämmer den avlidne själv eller familjen vad som ska hända med kroppen efter döden.
      Den avlidne kan begravas i en kista eller så kan kroppen brännas. Kistbegravningar är vanliga i
      Finland. I en kista får en människa begravas endast på begravningsplatser som har behörigt tillstånd.
    sentences:
    - id: hb-c09-u0398-s001
      start: 0
      end: 95
    - id: hb-c09-u0398-s002
      start: 96
      end: 161
    - id: hb-c09-u0398-s003
      start: 162
      end: 200
    - id: hb-c09-u0398-s004
      start: 201
      end: 293
  - type: paragraph
    id: hb-c09-u0399
    text: Kremering har blivit vanligare de senaste årtiondena. Det är det förmånligaste begravningssättet.
      När den avlidne har kremerats, förs askan i ett särskilt kärl, en askurna, till en begravningsplats
      för att begravas. På begravningsplatser finns ett särskilt område, en urnlund, där urnan kan begravas
      eller askan spridas på marken.
    sentences:
    - id: hb-c09-u0399-s001
      start: 0
      end: 53
    - id: hb-c09-u0399-s002
      start: 54
      end: 97
    - id: hb-c09-u0399-s003
      start: 98
      end: 215
    - id: hb-c09-u0399-s004
      start: 216
      end: 330
  - type: paragraph
    id: hb-c09-u0400
    text: Om den avlidne eller den avlidnes familj vill kan askan också spridas någon annanstans, till
      exempel på familjens egen mark eller i havet. Om familjen vill sprida askan på någon annans mark
      eller vattenområde, måste man be om tillstånd av den som äger marken eller vattenområdet. All aska
      måste dessutom spridas på ett och samma ställe, man får med andra ord inte dela på den.
    sentences:
    - id: hb-c09-u0400-s001
      start: 0
      end: 138
    - id: hb-c09-u0400-s002
      start: 139
      end: 279
    - id: hb-c09-u0400-s003
      start: 280
      end: 376
  - type: paragraph
    id: hb-c09-u0401
    text: I Finland är majoriteten av begravningsplatserna begravningsplatser som upprätthålls av den
      evangelisk-lutherska kyrkan. På dem får dock också personer som hör till andra trossamfund begravas.
      På de flesta begravningsplatser finns det separata områden för avlidna som har varit medlemmar i
      något annat trossamfund eller inte varit medlemmar i något samfund alls.
    sentences:
    - id: hb-c09-u0401-s001
      start: 0
      end: 120
    - id: hb-c09-u0401-s002
      start: 121
      end: 192
    - id: hb-c09-u0401-s003
      start: 193
      end: 362
  - type: paragraph
    id: hb-c09-u0402
    text: Kommunerna kan också ha egna begravningsplatser för olika religiösa samfund, till exempel en
      ortodox, muslimsk eller judisk begravningsplats. Olika religiösa eller icke-religiösa samfund kan
      ha egna privata begravningsplatser. Det egna religiösa samfundet eller begravningsbyråerna ger information
      om begravningsplatser och de praktiska arrangemangen.
    sentences:
    - id: hb-c09-u0402-s001
      start: 0
      end: 141
    - id: hb-c09-u0402-s002
      start: 142
      end: 226
    - id: hb-c09-u0402-s003
      start: 227
      end: 351
  - type: paragraph
    id: hb-c09-u0403
    text: Om en utlänning avlider i Finland och familjen vill transportera den avlidnes kropp eller aska
      till ett annat land för att begravas, ska de kontakta destinationslandets ambassad i Finland. En
      del länders ambassader hjälper familjer att transportera avlidna anhöriga. Familjen betalar själv
      transporten.
    sentences:
    - id: hb-c09-u0403-s001
      start: 0
      end: 188
    - id: hb-c09-u0403-s002
      start: 189
      end: 266
    - id: hb-c09-u0403-s003
      start: 267
      end: 302
  - type: paragraph
    id: hb-c09-u0404
    text: När en närstående person avlider, kan du få hjälp och stöd i sorgen vid social- och hälsocentralen
      (sosiaali- ja terveyskeskus) eller familjerådgivningen (perheneuvola) i ditt område, i MIELI ry:s
      kristelefon eller hos församlingarna.
    sentences:
    - id: hb-c09-u0404-s001
      start: 0
      end: 234
  - type: paragraph
    id: hb-c09-u0405
    text: Du får hjälp på finska och svenska och på de flesta ställena även på engelska. Du kan även ta
      hjälp av en tolk. Mieli ry:s kristelefon betjänar på finska, svenska, engelska, ukrainska och ryska.
    sentences:
    - id: hb-c09-u0405-s001
      start: 0
      end: 78
    - id: hb-c09-u0405-s002
      start: 79
      end: 111
    - id: hb-c09-u0405-s003
      start: 112
      end: 194
  - type: paragraph
    id: hb-c09-u0406
    text: När en person som är medborgare i något annat land avlider i Finland utreds dödsorsaken enligt
      finsk lag. En myndighet eller ett sjukhus anmäler dödsfallet till beskickningen i den avlidnes ursprungsland.
      Beskickningen eller utrikesministeriet i den avlidnes ursprungsland meddelar informationen till
      den avlidnes närstående.
    sentences:
    - id: hb-c09-u0406-s001
      start: 0
      end: 105
    - id: hb-c09-u0406-s002
      start: 106
      end: 204
    - id: hb-c09-u0406-s003
      start: 205
      end: 325
  - type: paragraph
    id: hb-c09-u0407
    text: Om ingen nära anhörig ser till att den avlidna personen blir begraven, kremerad eller transporterad
      till hemlandet kan beskickningen kontakta de lokala myndigheterna. I detta fall begravs eller kremeras
      kroppen enligt finsk praxis.
    sentences:
    - id: hb-c09-u0407-s001
      start: 0
      end: 166
    - id: hb-c09-u0407-s002
      start: 167
      end: 231
  - type: paragraph
    id: hb-c09-u0408
    text: Ibland kan en avliden person ha rätt till begravningsbidrag baserat på sin sista anställning
      eller sitt medlemskap i ett fackförbund. Fråga den sista arbetsgivaren eller fackförbundet om detta.
      För begravningskostnaderna för en medellös person kan du ansöka om utkomststöd (toimeentulotuki)
      hos FPA och socialtjänsterna i ditt område.
    sentences:
    - id: hb-c09-u0408-s001
      start: 0
      end: 133
    - id: hb-c09-u0408-s002
      start: 134
      end: 193
    - id: hb-c09-u0408-s003
      start: 194
      end: 334
  - type: paragraph
    id: hb-c09-u0409
    text: 'Efter en persons bortgång kan maka/make och barn få familjepension. Syftet med familjepensionen
      är att trygga änkans/änklingens och barnens uppehälle. I Finland finns två olika familjepensioner:
      FPA:s familjepension och familjepensionen från arbetspensionssystemet. Om den avlidna har arbetat
      som anställd eller företagare i Finland kan änkan/änklingen och barnen få familjepension från arbetspensionssystemet.'
    sentences:
    - id: hb-c09-u0409-s001
      start: 0
      end: 67
    - id: hb-c09-u0409-s002
      start: 68
      end: 150
    - id: hb-c09-u0409-s003
      start: 151
      end: 265
    - id: hb-c09-u0409-s004
      start: 266
      end: 410
  - type: paragraph
    id: hb-c09-u0410
    text: Om en person har bott eller arbetat länge i ett annat land innan hen flyttade till Finland kan
      änkan/änklingen och barnen ha rätt till familjepension även från detta land. Ta reda på villkoren
      för familjepension från Finland eller ursprungslandet.
    sentences:
    - id: hb-c09-u0410-s001
      start: 0
      end: 171
    - id: hb-c09-u0410-s002
      start: 172
      end: 247
- id: hb-c09-arv
  title: Arv, testamente och bouppteckning
  blocks:
  - type: paragraph
    id: hb-c09-u0411
    text: När en människa avlider, lämnar hen ofta efter sig egendom, till exempel pengar eller en bostad.
      Den avlidnes egendom kallas arv. Enligt lagen delas arvet mellan arvingarna. Arvingar är enligt
      lagen i första hand den avlidnes barn, eller om något av barnet har dött, barnbarnen, deras barn
      och så vidare. Om den avlidne inte har några barn, är maken eller makan, föräldrarna, syskonen,
      syskonens barn, far- och morföräldrarna eller i sista hand mostrar och fastrar, morbröder och farbröder
      arvingar. Den avlidnes kusiner är inte arvingar.
    sentences:
    - id: hb-c09-u0411-s001
      start: 0
      end: 96
    - id: hb-c09-u0411-s002
      start: 97
      end: 129
    - id: hb-c09-u0411-s003
      start: 130
      end: 173
    - id: hb-c09-u0411-s004
      start: 174
      end: 304
    - id: hb-c09-u0411-s005
      start: 305
      end: 499
    - id: hb-c09-u0411-s006
      start: 500
      end: 538
  - type: paragraph
    id: hb-c09-u0412
    text: Före sin död kan en människa också upprätta ett testamente, där hen förordnar hur hens egendom
      ska delas. Finlands lag förskriver ändå att den avlidnes barn har rätt till åtminstone hälften av
      det belopp som de enligt lag skulle få om det inte fanns något testamente. Detta är fallet även
      om den avlidne genom testamente skulle förordna sin egendom till någon annan.
    sentences:
    - id: hb-c09-u0412-s001
      start: 0
      end: 105
    - id: hb-c09-u0412-s002
      start: 106
      end: 267
    - id: hb-c09-u0412-s003
      start: 268
      end: 366
  - type: paragraph
    id: hb-c09-u0413
    text: I Finland har det funnits lika arvsrätt sedan år 1878. Lika arvsrätt betyder att kvinnor och
      män har samma rätt till arv. Om en avliden person inte har några arvingar och inte har upprättat
      något testamente, går hens egendom till staten.
    sentences:
    - id: hb-c09-u0413-s001
      start: 0
      end: 54
    - id: hb-c09-u0413-s002
      start: 55
      end: 121
    - id: hb-c09-u0413-s003
      start: 122
      end: 237
  - type: paragraph
    id: hb-c09-u0414
    text: När ett arv delas ordnas en bouppteckning. En bouppteckning är en tillställning där man utreder
      den avlidnes tillgångar och skulder. Tillställningen ordnas vanligtvis av den avlidnes änka eller
      änkling eller barn. Den måste ordnas inom tre månader efter dödsfallet och samtliga av den avlidnes
      arvingar ska bjudas in till den.
    sentences:
    - id: hb-c09-u0414-s001
      start: 0
      end: 42
    - id: hb-c09-u0414-s002
      start: 43
      end: 132
    - id: hb-c09-u0414-s003
      start: 133
      end: 213
    - id: hb-c09-u0414-s004
      start: 214
      end: 326
  - type: paragraph
    id: hb-c09-u0415
    text: Vid bouppteckningen gör man upp en förteckning över den avlidnes egendom, det vill säga dödsboet.
      Förteckningen över den avlidnes egendom kallas för en bouppteckningshandling. Handlingen kan upprättas
      av en anställd person, till exempel en advokat, eller någon av arvingarna. I bouppteckningshandlingen
      antecknas den avlidnes förmögenhet och skulder, uppgifter om hens arvingar och innehållet i testamentet,
      om ett sådant finns.
    sentences:
    - id: hb-c09-u0415-s001
      start: 0
      end: 97
    - id: hb-c09-u0415-s002
      start: 98
      end: 175
    - id: hb-c09-u0415-s003
      start: 176
      end: 275
    - id: hb-c09-u0415-s004
      start: 276
      end: 428
  - type: paragraph
    id: hb-c09-u0416
    text: Arvingarna ansvarar inte för skulder som den avlidne lämnar efter sig, så länge som skulderna
      är korrekt antecknade i bouppteckningen.
    sentences:
    - id: hb-c09-u0416-s001
      start: 0
      end: 134
  - type: paragraph
    id: hb-c09-u0417
    text: Vem som ärver egendom efter en avliden person fastställs i lagen. Du kan även själv påverka
      till vilka personer din egendom fördelas. Du kan skriva ett testamente, som är en skriftlig redogörelse
      över vem som ärver dina ägodelar efter din bortgång. Ett testamente ska innehålla vissa punkter
      och det ska alltid undertecknas av två ojäviga vittnen. Annars är testamentet inte legitimt. Det
      är alltså tillrådligt att ta hjälp av en jurist när du ska skriva testamente.
    sentences:
    - id: hb-c09-u0417-s001
      start: 0
      end: 65
    - id: hb-c09-u0417-s002
      start: 66
      end: 133
    - id: hb-c09-u0417-s003
      start: 134
      end: 248
    - id: hb-c09-u0417-s004
      start: 249
      end: 347
    - id: hb-c09-u0417-s005
      start: 348
      end: 384
    - id: hb-c09-u0417-s006
      start: 385
      end: 466
  - type: paragraph
    id: hb-c09-u0418
    text: I Finland finns det två arvsskatteklasser. Den avlidnes närmaste släktingar, till exempel barn,
      barnbarn och make eller maka, betalar mindre skatt på sina respektive arv. Om arvingen är mer avlägset
      släkt eller inte alls släkt med den avlidne, är skatten högre. Skatteprocenten är också högre ju
      större arvet är.
    sentences:
    - id: hb-c09-u0418-s001
      start: 0
      end: 42
    - id: hb-c09-u0418-s002
      start: 43
      end: 170
    - id: hb-c09-u0418-s003
      start: 171
      end: 261
    - id: hb-c09-u0418-s004
      start: 262
      end: 312
