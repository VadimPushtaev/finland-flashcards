schema_version: 1
id: hb-c04
language: sv
title: Demokrati, förvaltning och påverkan
sections:
- id: hb-c04-demokrati
  title: Demokrati och folkstyre
  blocks:
  - type: paragraph
    id: hb-c04-u0001
    text: Finland är en demokratisk stat. Det betyder att folket i Finland har makt att bestämma hur staten
      ska styras. Demokratin i Finland är en representativ demokrati, det vill säga medborgarna väljer
      representanter för sig själva som fattar beslut för dem. Representanterna väljs i rättvisa och fria
      val. De beslutsfattare som utsetts genom val ska lyssna på väljarnas åsikter, eftersom väljarna
      annars kanske inte röstar på dem i följande val.
    sentences:
    - id: hb-c04-u0001-s001
      start: 0
      end: 31
    - id: hb-c04-u0001-s002
      start: 32
      end: 109
    - id: hb-c04-u0001-s003
      start: 110
      end: 251
    - id: hb-c04-u0001-s004
      start: 252
      end: 299
    - id: hb-c04-u0001-s005
      start: 300
      end: 439
  - type: paragraph
    id: hb-c04-u0002
    text: Demokrati är ett statsskick där medborgarna påverkar hurdana beslut som fattas i gemensamma
      frågor, vem som fattar besluten och vad statens pengar används till. Könet eller samhällsställningen
      har ingen betydelse för vem som får påverka i olika frågor.
    sentences:
    - id: hb-c04-u0002-s001
      start: 0
      end: 160
    - id: hb-c04-u0002-s002
      start: 161
      end: 252
  - type: paragraph
    id: hb-c04-u0003
    text: Medborgarna väljer beslutsfattare med hjälp av val. Beslutsfattarna fattar beslut om landets
      angelägenheter genom att diskutera, rösta och göra kompromisser.
    sentences:
    - id: hb-c04-u0003-s001
      start: 0
      end: 51
    - id: hb-c04-u0003-s002
      start: 52
      end: 157
  - type: paragraph
    id: hb-c04-u0004
    text: En demokrati kan vara direkt, deltagande eller representativ. Med direkt demokrati avses till
      exempel att en fråga avgörs genom ett massmöte eller en folkomröstning. Beslutet baserar sig direkt
      på medborgarnas åsikt. Majoritetens åsikt vinner. När en medborgare deltar i en omröstning kan hen
      direkt påverka resultatet av den.
    sentences:
    - id: hb-c04-u0004-s001
      start: 0
      end: 61
    - id: hb-c04-u0004-s002
      start: 62
      end: 165
    - id: hb-c04-u0004-s003
      start: 166
      end: 216
    - id: hb-c04-u0004-s004
      start: 217
      end: 243
    - id: hb-c04-u0004-s005
      start: 244
      end: 326
  - type: paragraph
    id: hb-c04-u0005
    text: Direkt demokrati är svår att genomföra på statlig nivå, eftersom människorna är många. I en
      direkt demokrati borde varje medborgare ägna mycket tid åt att bestämma om gemensamma angelägenheter
      genom att delta i möten, omröstningar och olika val. Därför avgörs endast en del frågor i många
      demokratiska länder med hjälp av direkt folkstyre. I Finland ordnades till exempel en rådgivande
      folkomröstning år 1994 om huruvida Finland borde gå med i Europeiska unionen eller inte.
    sentences:
    - id: hb-c04-u0005-s001
      start: 0
      end: 86
    - id: hb-c04-u0005-s002
      start: 87
      end: 245
    - id: hb-c04-u0005-s003
      start: 246
      end: 339
    - id: hb-c04-u0005-s004
      start: 340
      end: 474
  - type: paragraph
    id: hb-c04-u0006
    text: Deltagande demokrati betyder olika sätt för människor att på ett friare sätt delta i det gemensamma
      beslutsfattandet. Deltagande demokrati är till exempel medborgarverksamhet eller att kommunen ordnar
      en invånarpanel, dit alla invånare i kommunen bjuds in för att diskutera en fråga som det ska fattas
      beslut i. Panelen fattar inget direkt beslut, men politikerna lyssnar på den och tar invånarnas
      synpunkter i beaktande när de fattar beslutet.
    sentences:
    - id: hb-c04-u0006-s001
      start: 0
      end: 117
    - id: hb-c04-u0006-s002
      start: 118
      end: 311
    - id: hb-c04-u0006-s003
      start: 312
      end: 444
  - type: paragraph
    id: hb-c04-u0007
    text: I demokratiska stater tillämpas i allmänhet representativ demokrati, som kan kompletteras med
      direkt och deltagande demokrati. Så är fallet också i Finland. I Finland hålls regelbundet val,
      där medborgarna väljer representanter för sig. Representanterna bedriver politiskt arbete i samhället
      och representerar vanliga medborgare.
    sentences:
    - id: hb-c04-u0007-s001
      start: 0
      end: 126
    - id: hb-c04-u0007-s002
      start: 127
      end: 156
    - id: hb-c04-u0007-s003
      start: 157
      end: 236
    - id: hb-c04-u0007-s004
      start: 237
      end: 329
  - type: paragraph
    id: hb-c04-u0008
    text: När en kandidat får tillräckligt många röster i ett val blir hen vald. Då får hen fullmakt från
      folket att fatta beslut i gemensamma frågor för andras räkning. Väljarna överlåter alltså en del
      av sin makt till personen. Med hjälp av val väljer finländarna till exempel medlemmar i riksdagen,
      det vill säga riksdagsledamöter, ledamöter i kommunfullmäktige, som fattar beslut i kommunerna,
      och ledamöter i välfärdsområdesfullmäktige, som fattar beslut i välfärdsområdena.
    sentences:
    - id: hb-c04-u0008-s001
      start: 0
      end: 70
    - id: hb-c04-u0008-s002
      start: 71
      end: 159
    - id: hb-c04-u0008-s003
      start: 160
      end: 219
    - id: hb-c04-u0008-s004
      start: 220
      end: 469
  - type: paragraph
    id: hb-c04-u0009
    text: I en representativ demokrati arbetar representanterna på heltid eller deltid och beslutar om
      gemensamma frågor för medborgarnas räkning. Då kan de övriga medborgarna fokusera på sina egna arbeten.
    sentences:
    - id: hb-c04-u0009-s001
      start: 0
      end: 136
    - id: hb-c04-u0009-s002
      start: 137
      end: 196
  - type: paragraph
    id: hb-c04-u0010
    text: En representant får fatta självständiga beslut och är inte tvungen att följa väljarnas vilja.
      Väljarna är ändå intresserade av hur representanterna sköter sitt arbete och hurdana beslut de fattar.
      Till exempel republikens president, ministrar och riksdagsledamöter måste ofta motivera sina beslut
      för väljarna. Mediernas uppgift är att följa och rapportera om hur representanterna använder makten
      de fått.
    sentences:
    - id: hb-c04-u0010-s001
      start: 0
      end: 93
    - id: hb-c04-u0010-s002
      start: 94
      end: 196
    - id: hb-c04-u0010-s003
      start: 197
      end: 310
    - id: hb-c04-u0010-s004
      start: 311
      end: 405
  - type: paragraph
    id: hb-c04-u0011
    text: Politiska beslutsfattare måste sätta sig in i komplicerade frågor på kort tid. Statens och kommunernas
      medel är begränsade. Besluten om till vad de gemensamma pengarna ska användas och hur mycket måste
      vara sådana att politikerna kan motivera dem för sina väljare och uppbackare. Om en representant
      vill att väljarna ska rösta på hen på nytt i nästa val, måste hen försöka uppfylla de löften som
      hen har gett väljarna.
    sentences:
    - id: hb-c04-u0011-s001
      start: 0
      end: 78
    - id: hb-c04-u0011-s002
      start: 79
      end: 123
    - id: hb-c04-u0011-s003
      start: 124
      end: 279
    - id: hb-c04-u0011-s004
      start: 280
      end: 418
  - type: paragraph
    id: hb-c04-u0012
    text: I en del länder sker valfusk av olika orsaker, och röstantalen eller valresultatet kan mycket
      väl förfalskas. Storskaligt valfusk är mer sannolikt i instabila samhällen. I Finland är förrättande
      av val mycket noggrant reglerat och övervakat. Resultaten är tillförlitliga, och också den part
      som förlorat i ett val accepterar valresultatet.
    sentences:
    - id: hb-c04-u0012-s001
      start: 0
      end: 109
    - id: hb-c04-u0012-s002
      start: 110
      end: 169
    - id: hb-c04-u0012-s003
      start: 170
      end: 241
    - id: hb-c04-u0012-s004
      start: 242
      end: 339
  - type: paragraph
    id: hb-c04-u0013
    text: I en demokrati måste människorna välja mellan olika alternativ, i såväl val som annat beslutsfattande.
      I ett val måste det finnas åtminstone två alternativ.
    sentences:
    - id: hb-c04-u0013-s001
      start: 0
      end: 102
    - id: hb-c04-u0013-s002
      start: 103
      end: 156
  - type: paragraph
    id: hb-c04-u0014
    text: I ett val får de partier som får flest röster av väljarna flest representanter. Det betyder
      ändå inte att majoriteten fram till nästa val skulle ha rätt att diskriminera eller förtrycka minoriteten,
      det vill säga dem som är av en annan åsikt än majoriteten. I ett samhälle och en rättsstat som representerar
      en liberal demokrati ska makten användas på ett sådant sätt att de grundläggande och mänskliga rättigheterna
      och individens friheter tas i beaktande. Alla människor ska behandlas jämlikt och i enlighet med
      de grundläggande rättigheter som föreskrivs i grundlagen.
    sentences:
    - id: hb-c04-u0014-s001
      start: 0
      end: 79
    - id: hb-c04-u0014-s002
      start: 80
      end: 257
    - id: hb-c04-u0014-s003
      start: 258
      end: 457
    - id: hb-c04-u0014-s004
      start: 458
      end: 571
  - type: paragraph
    id: hb-c04-u0015
    text: Yttrandefrihet innebär till exempel att en person kan kritisera politiska beslutsfattare och
      makthavare om hen inte är nöjd med deras arbete. I Finland förs hela tiden livliga diskussioner
      i samhällsfrågor i till exempel tidningar och sociala medier. Vem som helst som bor i Finland kan
      delta i diskussionerna och skriva vad hen tycker i frågorna eller om beslutsfattarna. Man kan också
      kontakta politiker direkt för att berätta om sina tankar. Människorna kan kritisera politikernas
      arbete utan att bli föremål för påtryckningar eller hot. Också osakliga åsikter får framföras, men
      hatretorik regleras i lagstiftningen, och till exempel att hota människor är olagligt.
    sentences:
    - id: hb-c04-u0015-s001
      start: 0
      end: 141
    - id: hb-c04-u0015-s002
      start: 142
      end: 250
    - id: hb-c04-u0015-s003
      start: 251
      end: 372
    - id: hb-c04-u0015-s004
      start: 373
      end: 444
    - id: hb-c04-u0015-s005
      start: 445
      end: 540
    - id: hb-c04-u0015-s006
      start: 541
      end: 669
  - type: paragraph
    id: hb-c04-u0016
    text: Diskussion är en viktig aspekt i en demokrati. Politiker från olika partier diskuterar och förhandlar
      sinsemellan och med tjänstemän, experter, medborgarorganisationer och andra aktörer i medborgarsamhället,
      med företag och andra instanser när de fattar beslut i gemensamma frågor.
    sentences:
    - id: hb-c04-u0016-s001
      start: 0
      end: 46
    - id: hb-c04-u0016-s002
      start: 47
      end: 281
  - type: paragraph
    id: hb-c04-u0017
    text: Alla människor som är intresserade av gemensamma frågor och följer vad som sker inom politiken
      och i samhället behövs i diskussionen. Av väljarna får politikerna viktig information om vad som
      inte fungerar i samhället och hur problemen skulle kunna åtgärdas. Frågor som politikerna beslutar
      om påverkar ofta vardagen för alla som bor i Finland.
    sentences:
    - id: hb-c04-u0017-s001
      start: 0
      end: 133
    - id: hb-c04-u0017-s002
      start: 134
      end: 258
    - id: hb-c04-u0017-s003
      start: 259
      end: 344
- id: hb-c04-maktfordelning
  title: Grundlagen och maktfördelningen
  blocks:
  - type: paragraph
    id: hb-c04-u0018
    text: Grundlagen är grunden för all lagstiftning och allt utövande av offentlig makt i Finland. I
      grundlagen föreskrivs om hur staten är organiserad, vilken makt som hör till vilken aktör i Finland
      och hur till exempel lagar stiftas i landet.
    sentences:
    - id: hb-c04-u0018-s001
      start: 0
      end: 89
    - id: hb-c04-u0018-s002
      start: 90
      end: 236
  - type: paragraph
    id: hb-c04-u0019
    text: I Finland är makten indelad i lagstiftande makt, verkställande makt och domsrätt. Den lagstiftande
      makten, det vill säga makten att stifta lagar, utövas av riksdagen. Den verkställande makten, det
      vill säga makten att tillämpa lagar i praktiken, utövas av presidenten och regeringen. Regeringen
      ser till exempel till att ministerierna och de myndigheter som lyder under dem fattar beslut i enlighet
      med lagarna. Domsrätten, det vill säga makten att bedöma huruvida någon har agerat i enlighet med
      lagen i ett enskilt fall, verkställs av domstolarna.
    sentences:
    - id: hb-c04-u0019-s001
      start: 0
      end: 81
    - id: hb-c04-u0019-s002
      start: 82
      end: 166
    - id: hb-c04-u0019-s003
      start: 167
      end: 283
    - id: hb-c04-u0019-s004
      start: 284
      end: 411
    - id: hb-c04-u0019-s005
      start: 412
      end: 549
  - type: paragraph
    id: hb-c04-u0020
    text: I Finland beslutar riksdagen, regeringen och presidenten om frågor som rör hela landet.
    sentences:
    - id: hb-c04-u0020-s001
      start: 0
      end: 87
- id: hb-c04-riksdagen
  title: Riksdagens uppgifter
  blocks:
  - type: paragraph
    id: hb-c04-u0021
    text: Finlands parlament kallas riksdag. Riksdagen har 200 riksdagsledamöter, som utses genom val.
      Finlands riksdag är en enkammarriksdag.
    sentences:
    - id: hb-c04-u0021-s001
      start: 0
      end: 34
    - id: hb-c04-u0021-s002
      start: 35
      end: 92
    - id: hb-c04-u0021-s003
      start: 93
      end: 132
  - type: paragraph
    id: hb-c04-u0022
    text: Riksdagens uppgifter är att
    sentences:
    - id: hb-c04-u0022-s001
      start: 0
      end: 27
  - id: hb-c04-u0024
    type: list
    ordered: false
    items:
    - id: hb-c04-u0023
      text: stifta Finlands lagar
      sentences:
      - id: hb-c04-u0023-s001
        start: 0
        end: 21
    - id: hb-c04-u0025
      text: besluta om statens budget
      sentences:
      - id: hb-c04-u0025-s001
        start: 0
        end: 25
    - id: hb-c04-u0026
      text: godkänna internationella avtal som gäller Finland
      sentences:
      - id: hb-c04-u0026-s001
        start: 0
        end: 49
    - id: hb-c04-u0027
      text: övervaka regeringens och ministrarnas arbete.
      sentences:
      - id: hb-c04-u0027-s001
        start: 0
        end: 45
  - type: paragraph
    id: hb-c04-u0028
    text: Riksdagen stiftar lagarna i Finland. Vanligtvis lämnar regeringen förslag till nya lagar till
      riksdagen. Också en enskild riksdagsledamot kan göra lagmotioner, eller så kan ett lagförslag komma
      till riksdagen via ett medborgarinitiativ.
    sentences:
    - id: hb-c04-u0028-s001
      start: 0
      end: 36
    - id: hb-c04-u0028-s002
      start: 37
      end: 104
    - id: hb-c04-u0028-s003
      start: 105
      end: 236
  - type: paragraph
    id: hb-c04-u0029
    text: Riksdagen diskuterar lagmotionen eller regeringens lagproposition och behandlar ärendet i olika
      utskott. Till sist röstar riksdagsledamöterna om huruvida de understöder lagen. Om riksdagen godkänner
      lagen, stadfäster presidenten den med sin underskrift. Myndigheterna informerar om lagändringen,
      och medierna rapporterar om den nya lagen, dess syfte och innehåll. På så sätt får medborgarna aktuell
      information om nya lagar.
    sentences:
    - id: hb-c04-u0029-s001
      start: 0
      end: 104
    - id: hb-c04-u0029-s002
      start: 105
      end: 175
    - id: hb-c04-u0029-s003
      start: 176
      end: 253
    - id: hb-c04-u0029-s004
      start: 254
      end: 363
    - id: hb-c04-u0029-s005
      start: 364
      end: 424
  - type: paragraph
    id: hb-c04-u0030
    text: Riksdagen godkänner också regeringens förslag till statens budget. Budgeten är en plan över
      hur statens skattepengar och övriga intäkter ska användas. Regeringen förhandlar om budgeten varje
      år och gör ett budgetförslag till riksdagen. Riksdagen övervakar förverkligandet av budgeten.
    sentences:
    - id: hb-c04-u0030-s001
      start: 0
      end: 66
    - id: hb-c04-u0030-s002
      start: 67
      end: 150
    - id: hb-c04-u0030-s003
      start: 151
      end: 235
    - id: hb-c04-u0030-s004
      start: 236
      end: 284
  - type: paragraph
    id: hb-c04-u0031
    text: Riksdagen måste hålla sig uppdaterad om vad som beslutas i Europeiska unionen. Riksdagen berättar
      för regeringen vad Finland anser om de ärenden som behandlas i EU. Finlands lagar och EU:s rättsakter
      kan inte stå i strid med varandra. Finland måste ta EU:s rättsakter i beaktande, eftersom Finland
      är medlem i EU.
    sentences:
    - id: hb-c04-u0031-s001
      start: 0
      end: 78
    - id: hb-c04-u0031-s002
      start: 79
      end: 164
    - id: hb-c04-u0031-s003
      start: 165
      end: 234
    - id: hb-c04-u0031-s004
      start: 235
      end: 313
- id: hb-c04-regeringen
  title: Regeringen och parlamentarismen
  blocks:
  - type: paragraph
    id: hb-c04-u0032
    text: Statsministern och de övriga ministrarna bildar Finlands statsråd. I vardagsspråk används ofta
      ordet regering för statsrådet. Ministrarnas antal varierar, men under de senaste årtiondena har
      Finlands regering bestått av 15–20 ministrar. Exempel på ministrar är inrikesminister, utrikesminister,
      undervisningsminister och justitieminister.
    sentences:
    - id: hb-c04-u0032-s001
      start: 0
      end: 66
    - id: hb-c04-u0032-s002
      start: 67
      end: 125
    - id: hb-c04-u0032-s003
      start: 126
      end: 236
    - id: hb-c04-u0032-s004
      start: 237
      end: 338
  - type: paragraph
    id: hb-c04-u0033
    text: I allmänhet blir den partiordförande som hade mest framgång i valet statsminister. Hen diskuterar
      med de övriga partierna och väljer vilka partier som ska börja bilda regering. I Finland är det
      vanligt att det finns flera partier i regeringen. Efter det utarbetar dessa partier tillsammans
      ett regeringsprogram. Det berättar om regeringens politiska mål och åtgärder under regeringens mandatperiod.
    sentences:
    - id: hb-c04-u0033-s001
      start: 0
      end: 82
    - id: hb-c04-u0033-s002
      start: 83
      end: 176
    - id: hb-c04-u0033-s003
      start: 177
      end: 243
    - id: hb-c04-u0033-s004
      start: 244
      end: 311
    - id: hb-c04-u0033-s005
      start: 312
      end: 398
  - type: paragraph
    id: hb-c04-u0034
    text: När regeringsprogrammet är färdigt utser riksdagen officiellt en statsminister genom omröstning.
      Regeringspartierna beslutar om vem från respektive parti som ska bli minister. När statsministern
      och övriga ministrar har utsetts utnämner presidenten dem för deras uppgifter. Riksdagen godkänner
      ännu genom omröstning statsrådets sammansättning och regeringsprogrammet.
    sentences:
    - id: hb-c04-u0034-s001
      start: 0
      end: 96
    - id: hb-c04-u0034-s002
      start: 97
      end: 175
    - id: hb-c04-u0034-s003
      start: 176
      end: 273
    - id: hb-c04-u0034-s004
      start: 274
      end: 367
  - type: paragraph
    id: hb-c04-u0035
    text: Ministrarna leder ministeriernas arbete. Ministerierna bereder och verkställer de ärenden som
      regeringen beslutar om. Exempel på ministerier är försvarsministeriet, social- och hälsovårdsministeriet
      och inrikesministeriet. Flera statliga ämbetsverk och inrättningar lyder under och styrs av ministerierna.
      Till exempel Migrationsverket är ett ämbetsverk som lyder under inrikesministeriet. Tillsammans
      med ministerierna bildar statens ämbetsverk och inrättningar statens centralförvaltning.
    sentences:
    - id: hb-c04-u0035-s001
      start: 0
      end: 40
    - id: hb-c04-u0035-s002
      start: 41
      end: 117
    - id: hb-c04-u0035-s003
      start: 118
      end: 222
    - id: hb-c04-u0035-s004
      start: 223
      end: 305
    - id: hb-c04-u0035-s005
      start: 306
      end: 389
    - id: hb-c04-u0035-s006
      start: 390
      end: 490
  - type: paragraph
    id: hb-c04-u0036
    text: Regeringen bereder ärenden som riksdagen behandlar. Till exempel om regeringspartierna har beslutat
      att en ny nationalpark ska inrättas i Finland, börjar miljöministeriet bereda ärendet. Ministeriet
      undersöker var den nya nationalparken ska inrättas och lyssnar på andra myndigheters och medborgarorganisationers
      åsikter, information och erfarenheter i frågan. Under regeringens ledning utarbetar ministeriet
      ett förslag, där det motiverar varför det valda området skulle vara det bästa för den nya nationalparken
      och hurdana konsekvenser förslaget skulle ha. Efter det överförs ärendet till riksdagen för beslut.
    sentences:
    - id: hb-c04-u0036-s001
      start: 0
      end: 51
    - id: hb-c04-u0036-s002
      start: 52
      end: 186
    - id: hb-c04-u0036-s003
      start: 187
      end: 360
    - id: hb-c04-u0036-s004
      start: 361
      end: 559
    - id: hb-c04-u0036-s005
      start: 560
      end: 613
  - type: paragraph
    id: hb-c04-u0037
    text: När riksdagen beslutar någonting, verkställer regeringen beslutet. När riksdagen till exempel
      utfärdar en lag om inrättande av en ny nationalpark, börjar de myndigheter som ansvarar för nationalparkerna
      förbereda de praktiska åtgärderna i ärendet. Dessa åtgärder är till exempel att ordna med informationstavlor
      för nationalparkens besökare. Miljöministeriet och jord- och skogsbruksministeriet övervakar att
      myndigheterna ordnar med alla tjänster som lagen föreskriver i den nya nationalparken.
    sentences:
    - id: hb-c04-u0037-s001
      start: 0
      end: 66
    - id: hb-c04-u0037-s002
      start: 67
      end: 247
    - id: hb-c04-u0037-s003
      start: 248
      end: 341
    - id: hb-c04-u0037-s004
      start: 342
      end: 495
  - type: paragraph
    id: hb-c04-u0038
    text: Regeringen ansvarar för sitt arbete inför riksdagen, det vill säga regeringen och ministrarna
      måste ha riksdagens förtroende. Riksdagen måste alltså vara övertygad om att regeringen och alla
      ministrarna utför sitt arbete väl och på ett tillförlitligt sätt. Om riksdagen inte är övertygad
      om det, kan hela regeringen falla. Om regeringen faller, måste det kanske hållas ett nytt riksdagsval
      i förtid i landet. Det är ändå mycket sällsynt. I Finland har regeringarna varit långvariga de senaste
      årtiondena.
    sentences:
    - id: hb-c04-u0038-s001
      start: 0
      end: 125
    - id: hb-c04-u0038-s002
      start: 126
      end: 256
    - id: hb-c04-u0038-s003
      start: 257
      end: 322
    - id: hb-c04-u0038-s004
      start: 323
      end: 408
    - id: hb-c04-u0038-s005
      start: 409
      end: 437
    - id: hb-c04-u0038-s006
      start: 438
      end: 504
  - type: paragraph
    id: hb-c04-u0039
    text: De riksdagspartier som inte ingår i regeringen bildar opposition. Oppositionen har som uppgift
      att utmana regeringen och lägga fram alternativ till den politik som regeringen driver. Om oppositionen
      anser att riksdagen inte kan lita på regeringens arbete, kan den kräva en omröstning om regeringens
      förtroende.
    sentences:
    - id: hb-c04-u0039-s001
      start: 0
      end: 65
    - id: hb-c04-u0039-s002
      start: 66
      end: 182
    - id: hb-c04-u0039-s003
      start: 183
      end: 310
  - type: paragraph
    id: hb-c04-u0040
    text: I Finland är regeringarna i allmänhet majoritetsregeringar. Det betyder att majoriteten av riksdagsledamöterna
      hör till regeringspartierna. På så vis får regeringen vid en omröstning nästan alltid riksdagens
      förtroende och får igenom sina förslag i omröstningar.
    sentences:
    - id: hb-c04-u0040-s001
      start: 0
      end: 59
    - id: hb-c04-u0040-s002
      start: 60
      end: 139
    - id: hb-c04-u0040-s003
      start: 140
      end: 262
- id: hb-c04-presidenten
  title: Republikens president
  blocks:
  - type: paragraph
    id: hb-c04-u0041
    text: Finland är till sitt statsskick en konstitutionell republik. Finlands statsöverhuvud är republikens
      president, som utses genom val.
    sentences:
    - id: hb-c04-u0041-s001
      start: 0
      end: 60
    - id: hb-c04-u0041-s002
      start: 61
      end: 131
  - type: paragraph
    id: hb-c04-u0042
    text: Den största makten i Finland utövas av statsministern och riksdagen. De har mer makt än republikens
      president. Presidentens makt har minskats i Finland sedan 1980-talet. Finlands president är ändå
      landets mest synliga ledare.
    sentences:
    - id: hb-c04-u0042-s001
      start: 0
      end: 68
    - id: hb-c04-u0042-s002
      start: 69
      end: 110
    - id: hb-c04-u0042-s003
      start: 111
      end: 169
    - id: hb-c04-u0042-s004
      start: 170
      end: 225
  - type: paragraph
    id: hb-c04-u0043
    text: I Finland har republikens president som uppgift att
    sentences:
    - id: hb-c04-u0043-s001
      start: 0
      end: 51
  - id: hb-c04-u0045
    type: list
    ordered: false
    items:
    - id: hb-c04-u0044
      text: leda Finlands utrikespolitik i samarbete med statsrådet
      sentences:
      - id: hb-c04-u0044-s001
        start: 0
        end: 55
    - id: hb-c04-u0046
      text: stadfästa de lagar som riksdagen stiftar
      sentences:
      - id: hb-c04-u0046-s001
        start: 0
        end: 40
    - id: hb-c04-u0047
      text: utnämna de högsta ämbetsmännen för deras uppgifter
      sentences:
      - id: hb-c04-u0047-s001
        start: 0
        end: 50
    - id: hb-c04-u0048
      text: vara överbefälhavare för Finlands försvarsmakt.
      sentences:
      - id: hb-c04-u0048-s001
        start: 0
        end: 47
- id: hb-c04-lokalforvaltning
  title: Kommuner och välfärdsområden
  blocks:
  - type: paragraph
    id: hb-c04-u0049
    text: Utöver centralförvaltningen har staten också en regionförvaltning. Vid regionförvaltningens
      ämbetsverk och centraler hanteras till exempel miljöfrågor, säkerheten inom landet och trafikens
      funktion.
    sentences:
    - id: hb-c04-u0049-s001
      start: 0
      end: 66
    - id: hb-c04-u0049-s002
      start: 67
      end: 198
  - type: paragraph
    id: hb-c04-u0050
    text: I statens lokalförvaltning ingår i sin tur bland annat polisinrättningarna.
    sentences:
    - id: hb-c04-u0050-s001
      start: 0
      end: 75
  - type: paragraph
    id: hb-c04-u0051
    text: Också välfärdsområdena, som är självständiga aktörer, är en del av regionförvaltningen. Kommunerna
      å andra sidan är de viktigaste aktörerna inom lokalförvaltningen.
    sentences:
    - id: hb-c04-u0051-s001
      start: 0
      end: 87
    - id: hb-c04-u0051-s002
      start: 88
      end: 164
  - type: paragraph
    id: hb-c04-u0052
    text: Välfärdsområdena ansvarar för social- och hälsovårdstjänsterna och räddningsväsendet i sina
      respektive områden. I Finland finns det 21 välfärdsområden. Helsingfors hör inte till något välfärdsområde,
      utan producerar själv sina social- och hälsovårdstjänster och räddningsväsendets tjänster.
    sentences:
    - id: hb-c04-u0052-s001
      start: 0
      end: 111
    - id: hb-c04-u0052-s002
      start: 112
      end: 151
    - id: hb-c04-u0052-s003
      start: 152
      end: 290
  - type: paragraph
    id: hb-c04-u0053
    text: I ett välfärdsområde fattas besluten av välfärdsområdesfullmäktige. Ledamöterna i välfärdsområdesfullmäktige
      utses genom val. Välfärdsområdena får sin finansiering från staten.
    sentences:
    - id: hb-c04-u0053-s001
      start: 0
      end: 67
    - id: hb-c04-u0053-s002
      start: 68
      end: 125
    - id: hb-c04-u0053-s003
      start: 126
      end: 176
  - type: paragraph
    id: hb-c04-u0054
    text: Det finns cirka 300 kommuner i Finland. Kommunerna beslutar i mycket hög grad själva om sina
      angelägenheter och sin ekonomi. Kommunerna har rätt att ta ut skatt av invånarna. Utöver kommunalskatten
      får kommunerna också pengar från staten för att ordna tjänster.
    sentences:
    - id: hb-c04-u0054-s001
      start: 0
      end: 39
    - id: hb-c04-u0054-s002
      start: 40
      end: 124
    - id: hb-c04-u0054-s003
      start: 125
      end: 174
    - id: hb-c04-u0054-s004
      start: 175
      end: 261
  - type: paragraph
    id: hb-c04-u0055
    text: Var och en som är permanent bosatt i Finland är invånare i en kommun. Kommunen erbjuder sina
      invånare mycket basservice. Kommunen ansvarar för till exempel skolorna, småbarnspedagogiken, biblioteken
      och olika motions- och idrottstjänster. Kommunen planerar också gator, bostäder och parkområden
      och sörjer för vatten- och eltillgången och renhållningen.
    sentences:
    - id: hb-c04-u0055-s001
      start: 0
      end: 69
    - id: hb-c04-u0055-s002
      start: 70
      end: 120
    - id: hb-c04-u0055-s003
      start: 121
      end: 238
    - id: hb-c04-u0055-s004
      start: 239
      end: 353
  - type: paragraph
    id: hb-c04-u0056
    text: I en kommun fattas besluten demokratiskt i kommunfullmäktige. Ledamöterna i kommunfullmäktige
      utses i ett kommunalval. Fullmäktige i sin tur utser medlemmar i kommunstyrelsen, som har som uppgift
      att bereda fullmäktiges beslut och verkställa dem.
    sentences:
    - id: hb-c04-u0056-s001
      start: 0
      end: 61
    - id: hb-c04-u0056-s002
      start: 62
      end: 118
    - id: hb-c04-u0056-s003
      start: 119
      end: 246
  - type: paragraph
    id: hb-c04-u0057
    text: Kommunfullmäktige utser också nämnder. Exempel på nämnder är bildningsnämnden, som ansvarar
      för utbildnings- och kulturfrågor, och centralvalnämnden, som ansvarar för förrättandet av val i
      kommunens område. Nämnderna bereder ärenden för kommunfullmäktige, som fattar besluten. Medlemmarna
      i nämnderna är kommunfullmäktigeledamöter eller kommuninvånare som utsetts av partierna.
    sentences:
    - id: hb-c04-u0057-s001
      start: 0
      end: 38
    - id: hb-c04-u0057-s002
      start: 39
      end: 206
    - id: hb-c04-u0057-s003
      start: 207
      end: 276
    - id: hb-c04-u0057-s004
      start: 277
      end: 377
  - type: paragraph
    id: hb-c04-u0058
    text: I Helsingfors och på Åland ordnas inget välfärdsområdesval, eftersom Helsingfors stad och Åland
      ordnar tjänsterna själva.
    sentences:
    - id: hb-c04-u0058-s001
      start: 0
      end: 121
- id: hb-c04-internationellt
  title: EU och internationellt samarbete
  blocks:
  - type: paragraph
    id: hb-c04-u0059
    text: Europeiska unionen (EU) är en politisk och ekonomisk sammanslutning av stater. År 2024 bestod
      den av 27 stater. Syftet med den är att främja fred och medborgarnas välfärd och förbättra handeln
      och ekonomin i Europa. Medlemsländerna i EU är självständiga stater. De måste ändå följa unionens
      beslut och bestämmelser.
    sentences:
    - id: hb-c04-u0059-s001
      start: 0
      end: 78
    - id: hb-c04-u0059-s002
      start: 79
      end: 111
    - id: hb-c04-u0059-s003
      start: 112
      end: 215
    - id: hb-c04-u0059-s004
      start: 216
      end: 261
    - id: hb-c04-u0059-s005
      start: 262
      end: 315
  - type: paragraph
    id: hb-c04-u0060
    text: Europeiska unionens grundläggande värden är respekt för människans värdighet och de mänskliga
      rättigheterna, frihet, demokrati, jämställdhet och rättsstatsprincipen.
    sentences:
    - id: hb-c04-u0060-s001
      start: 0
      end: 165
  - type: paragraph
    id: hb-c04-u0061
    text: Finland blev medlem i EU år 1995. Då överfördes en del av det politiska beslutsfattandet i Finland
      till Europeiska unionen. EU-medlemskapet underlättar samarbetet med andra länder inom till exempel
      handeln. Inom EU får människor, varor och tjänster röra sig fritt. Finländska politiker deltar i
      alla viktiga beslut om utvecklingen av EU. Samtidigt lyfter de upp frågor som är viktiga för finländarna.
    sentences:
    - id: hb-c04-u0061-s001
      start: 0
      end: 33
    - id: hb-c04-u0061-s002
      start: 34
      end: 123
    - id: hb-c04-u0061-s003
      start: 124
      end: 206
    - id: hb-c04-u0061-s004
      start: 207
      end: 264
    - id: hb-c04-u0061-s005
      start: 265
      end: 337
    - id: hb-c04-u0061-s006
      start: 338
      end: 400
  - type: paragraph
    id: hb-c04-u0062
    text: I EU fattas besluten av Europaparlamentet och ministerrådet. Medlemmarna i Europaparlamentet
      väljs genom val i varje medlemsland. Parlamentet representerar därför EU-ländernas medborgare. Ministerrådet
      i sin tur består av ministrar från EU:s medlemsländer. Det representerar därför de nationella regeringarna.
      Parlamentet och ministerrådet stiftar största delen av lagarna genom en medbeslutandeprocedur, där
      parlamentet har en jämlik ställning med ministerrådet. Ministerrådet ansvarar dock för till exempel
      EU:s utrikes- och säkerhetspolitik.
    sentences:
    - id: hb-c04-u0062-s001
      start: 0
      end: 60
    - id: hb-c04-u0062-s002
      start: 61
      end: 129
    - id: hb-c04-u0062-s003
      start: 130
      end: 187
    - id: hb-c04-u0062-s004
      start: 188
      end: 256
    - id: hb-c04-u0062-s005
      start: 257
      end: 309
    - id: hb-c04-u0062-s006
      start: 310
      end: 463
    - id: hb-c04-u0062-s007
      start: 464
      end: 544
  - type: paragraph
    id: hb-c04-u0063
    text: Europeiska kommissionen i sin tur representerar själva unionen. Kommissionen gör lagförslag
      och förslag till EU:s budget. Kommissionen verkställer också de beslut som parlamentet och ministerrådet
      fattar. I kommissionen arbetar tjänstemän som utnämnts av medlemsländerna.
    sentences:
    - id: hb-c04-u0063-s001
      start: 0
      end: 63
    - id: hb-c04-u0063-s002
      start: 64
      end: 121
    - id: hb-c04-u0063-s003
      start: 122
      end: 204
    - id: hb-c04-u0063-s004
      start: 205
      end: 271
  - type: paragraph
    id: hb-c04-u0064
    text: Utöver Europeiska unionen hör Finland också till Nato och Förenta nationerna (FN). Finland är
      också medlem i många olika slags andra internationella organisationer. Genom dem kan Finland påverka
      internationellt och främja sina utrikespolitiska mål. Till exempel i FN har Finland försökt främja
      fred runt om i världen genom fredsbevarande insatser.
    sentences:
    - id: hb-c04-u0064-s001
      start: 0
      end: 82
    - id: hb-c04-u0064-s002
      start: 83
      end: 164
    - id: hb-c04-u0064-s003
      start: 165
      end: 248
    - id: hb-c04-u0064-s004
      start: 249
      end: 347
  - type: paragraph
    id: hb-c04-u0065
    text: Finland blev medlem i Nordatlantiska fördragsorganisationen Nato år 2023. Nato är en politisk
      och militär allians med målet att främja säkerhet och frihet i sina medlemsländer. År 2024 var 32
      länder medlemmar i Nato. Största delen av medlemsländerna ligger i Europa, förutom Förenta staterna
      och Kanada.
    sentences:
    - id: hb-c04-u0065-s001
      start: 0
      end: 73
    - id: hb-c04-u0065-s002
      start: 74
      end: 176
    - id: hb-c04-u0065-s003
      start: 177
      end: 216
    - id: hb-c04-u0065-s004
      start: 217
      end: 303
  - type: paragraph
    id: hb-c04-u0066
    text: Finland har varit medlem i Förenta nationerna sedan år 1955. FN grundades år 1945 efter andra
      världskriget. Syftet var att främja samarbetet mellan världens länder så att det aldrig mer skulle
      bli ett världskrig. I dag är nästan alla länder i världen medlemmar i FN. År 2024 var antalet medlemsländer
      sammanlagt 193.
    sentences:
    - id: hb-c04-u0066-s001
      start: 0
      end: 60
    - id: hb-c04-u0066-s002
      start: 61
      end: 107
    - id: hb-c04-u0066-s003
      start: 108
      end: 212
    - id: hb-c04-u0066-s004
      start: 213
      end: 266
    - id: hb-c04-u0066-s005
      start: 267
      end: 316
  - type: paragraph
    id: hb-c04-u0067
    text: Finland har undertecknat många internationella avtal som landet ska följa. Avtalen kan vara
      bilaterala, det vill säga avtal som Finland har ingått med ett annat land. Avtalen kan också vara
      multilaterala, det vill säga avtal som ett antal länder har slutit tillsammans.
    sentences:
    - id: hb-c04-u0067-s001
      start: 0
      end: 74
    - id: hb-c04-u0067-s002
      start: 75
      end: 166
    - id: hb-c04-u0067-s003
      start: 167
      end: 269
  - type: paragraph
    id: hb-c04-u0068
    text: Exempel på internationella avtal är konventionerna om de mänskliga rättigheterna. En del av
      konventionerna om de mänskliga rättigheterna gäller alla människors rättigheter, andra i sin tur
      fokuserar särskilt på till exempel rättigheterna för barn eller personer med funktionsnedsättning.
      Andra internationella avtal är klimatavtal, där världens länder har kommit överens om hur de ska
      försöka bromsa den globala uppvärmningen.
    sentences:
    - id: hb-c04-u0068-s001
      start: 0
      end: 81
    - id: hb-c04-u0068-s002
      start: 82
      end: 287
    - id: hb-c04-u0068-s003
      start: 288
      end: 426
- id: hb-c04-valsystemet
  title: Val, valhemlighet och proportionellt valsätt
  blocks:
  - type: paragraph
    id: hb-c04-u0069
    text: 'I Finland hålls flera olika allmänna val:'
    sentences:
    - id: hb-c04-u0069-s001
      start: 0
      end: 41
  - id: hb-c04-u0071
    type: list
    ordered: false
    items:
    - id: hb-c04-u0070
      text: riksdagsval vart fjärde år
      sentences:
      - id: hb-c04-u0070-s001
        start: 0
        end: 26
    - id: hb-c04-u0072
      text: välfärdsområdes- och kommunalval vart fjärde år
      sentences:
      - id: hb-c04-u0072-s001
        start: 0
        end: 47
    - id: hb-c04-u0073
      text: presidentval vart sjätte år
      sentences:
      - id: hb-c04-u0073-s001
        start: 0
        end: 27
    - id: hb-c04-u0074
      text: Europaparlamentsval vart femte år.
      sentences:
      - id: hb-c04-u0074-s001
        start: 0
        end: 34
  - type: paragraph
    id: hb-c04-u0075
    text: Dessutom kan det ordnas statliga, regionala eller kommunala rådgivande folkomröstningar i Finland.
      Rådgivande folkomröstningar ordnas sällan.
    sentences:
    - id: hb-c04-u0075-s001
      start: 0
      end: 98
    - id: hb-c04-u0075-s002
      start: 99
      end: 141
  - type: paragraph
    id: hb-c04-u0076
    text: Finska medborgare som är permanent bosatta i Finland och som senast på valdagen fyller 18 år
      kan rösta i alla val i Finland. Utlandsfinländare, det vill säga finska medborgare som är permanent
      bosatta utomlands, har rösträtt i riksdagsval och presidentval och ofta också i Europaparlamentsval.
      Utlandsfinländare har inte rösträtt i välfärdsområdes- och kommunalval.
    sentences:
    - id: hb-c04-u0076-s001
      start: 0
      end: 124
    - id: hb-c04-u0076-s002
      start: 125
      end: 293
    - id: hb-c04-u0076-s003
      start: 294
      end: 365
  - type: paragraph
    id: hb-c04-u0077
    text: Medborgare i andra länder som är permanent bosatta i Finland kan på vissa villkor rösta i välfärdsområdes-
      och kommunalval och Europaparlamentsval.
    sentences:
    - id: hb-c04-u0077-s001
      start: 0
      end: 147
  - type: paragraph
    id: hb-c04-u0078
    text: I val kan man rösta antingen på den egentliga valdagen eller på förhand. Om man röstar på förhand,
      kan man rösta på vilket allmänt förhandsröstningsställe som helst i Finland eller utomlands. Det
      finns röstningsställen i många offentliga lokaler, såsom bibliotek, kommunhus och köpcentrum. Om
      en väljare befinner sig utomlands, kan hen rösta på ett allmänt förhandsröstningsställe i det aktuella
      landet eller per brev.
    sentences:
    - id: hb-c04-u0078-s001
      start: 0
      end: 72
    - id: hb-c04-u0078-s002
      start: 73
      end: 191
    - id: hb-c04-u0078-s003
      start: 192
      end: 289
    - id: hb-c04-u0078-s004
      start: 290
      end: 418
  - type: paragraph
    id: hb-c04-u0079
    text: Om man röstar på valdagen, kan man rösta bara på det ställe som anges i meddelandet om rösträtt.
      Man kan inte rösta på valdagen om man redan röstat på förhand.
    sentences:
    - id: hb-c04-u0079-s001
      start: 0
      end: 96
    - id: hb-c04-u0079-s002
      start: 97
      end: 159
  - type: paragraph
    id: hb-c04-u0080
    text: Till röstningsstället ska man ha med sig ett giltigt identitetsbevis med foto, till exempel
      sitt pass.
    sentences:
    - id: hb-c04-u0080-s001
      start: 0
      end: 102
  - type: paragraph
    id: hb-c04-u0081
    text: I Finland råder valhemlighet. Det betyder att man inte behöver berätta för någon vilken kandidat
      man röstar på. När en person går för att rösta ser ingen annan vem hen röstar på. Om man vill kan
      man naturligtvis avslöja sin kandidat för andra.
    sentences:
    - id: hb-c04-u0081-s001
      start: 0
      end: 29
    - id: hb-c04-u0081-s002
      start: 30
      end: 111
    - id: hb-c04-u0081-s003
      start: 112
      end: 178
    - id: hb-c04-u0081-s004
      start: 179
      end: 243
  - type: paragraph
    id: hb-c04-u0082
    text: På röstningsstället kontrollerar valfunktionärerna väljarens identitetsbevis. På så vis säkerställs
      att väljaren har rösträtt i valet i fråga och att var och en röstar bara en gång.
    sentences:
    - id: hb-c04-u0082-s001
      start: 0
      end: 77
    - id: hb-c04-u0082-s002
      start: 78
      end: 181
  - type: paragraph
    id: hb-c04-u0083
    text: Efter det går väljaren till ett valbås, dit inga andra får komma samtidigt. Ingen annan ser
      in i valbåset. I båset skriver personen numret på sin kandidat på valsedeln. Man får inte skriva
      någonting annat än numret på sedeln. Vid behov får väljaren ta hjälp av ett valbiträde för att skriva
      numret.
    sentences:
    - id: hb-c04-u0083-s001
      start: 0
      end: 75
    - id: hb-c04-u0083-s002
      start: 76
      end: 106
    - id: hb-c04-u0083-s003
      start: 107
      end: 168
    - id: hb-c04-u0083-s004
      start: 169
      end: 225
    - id: hb-c04-u0083-s005
      start: 226
      end: 298
  - type: paragraph
    id: hb-c04-u0084
    text: Till sist stämplar en valfunktionär valsedeln, och väljaren lägger den stämplade sedeln i en
      valurna. Valurnan är en stängd låda. På detta sätt får ingen veta vem väljaren har röstat på.
    sentences:
    - id: hb-c04-u0084-s001
      start: 0
      end: 101
    - id: hb-c04-u0084-s002
      start: 102
      end: 129
    - id: hb-c04-u0084-s003
      start: 130
      end: 186
  - type: paragraph
    id: hb-c04-u0085
    text: När röstningstiden är slut, räknas antalet röster som kandidaterna fått på basis av valsedlarna.
      Endast stämplade sedlar godkänns. När förhandsrösterna räknas separeras valkuverten från följebreven
      innan de öppnas. På så vis vet ingen vilken valsedel som hör till vilken väljare.
    sentences:
    - id: hb-c04-u0085-s001
      start: 0
      end: 96
    - id: hb-c04-u0085-s002
      start: 97
      end: 130
    - id: hb-c04-u0085-s003
      start: 131
      end: 214
    - id: hb-c04-u0085-s004
      start: 215
      end: 279
  - type: paragraph
    id: hb-c04-u0086
    text: Syftet med valhemligheten är att förhindra att någon köper eller säljer röster i ett val. Väljare
      kan inte hotas till eller tvingas att rösta på en viss kandidat.
    sentences:
    - id: hb-c04-u0086-s001
      start: 0
      end: 89
    - id: hb-c04-u0086-s002
      start: 90
      end: 162
  - type: paragraph
    id: hb-c04-u0087
    text: I Finland tillämpas ett proportionellt valsätt vid riksdagsval, välfärdsområdes- och kommunalval
      och Europaparlamentsval. Det innebär att i varje valkrets blir det antal kandidater från varje parti
      valt som motsvarar partiets andel av alla avgivna röster i valkretsen. Om ett parti med andra ord
      får 20 procent av de avgivna rösterna, får det i stort sett 20 procent av platserna. I riksdagsval
      är valkretsarna stora, och från varje valkrets väljs flera representanter. Vid välfärdsområdesval
      utgörs valkretsen av välfärdsområdet och vid kommunalval av kommunen. Vid Europaparlamentsval utgör
      hela landet valkretsen.
    sentences:
    - id: hb-c04-u0087-s001
      start: 0
      end: 121
    - id: hb-c04-u0087-s002
      start: 122
      end: 268
    - id: hb-c04-u0087-s003
      start: 269
      end: 380
    - id: hb-c04-u0087-s004
      start: 381
      end: 469
    - id: hb-c04-u0087-s005
      start: 470
      end: 562
    - id: hb-c04-u0087-s006
      start: 563
      end: 616
  - type: paragraph
    id: hb-c04-u0088
    text: När man röstar på en kandidat för ett parti, går rösten i första hand till partiet. Partiets
      alla kandidater drar nytta av den avgivna rösten, även om just den egna kandidaten inte skulle bli
      vald.
    sentences:
    - id: hb-c04-u0088-s001
      start: 0
      end: 83
    - id: hb-c04-u0088-s002
      start: 84
      end: 197
  - type: paragraph
    id: hb-c04-u0089
    text: Utifrån väljarnas röster bestäms också vilka av partiets kandidater som sist och slutligen blir
      valda. Väljarna kan alltså påverka både vilka partier som får flest representantplatser i valet
      och vilka av partiets kandidater som blir valda.
    sentences:
    - id: hb-c04-u0089-s001
      start: 0
      end: 102
    - id: hb-c04-u0089-s002
      start: 103
      end: 240
  - type: paragraph
    id: hb-c04-u0090
    text: Som en följd av det proportionella valsättet har Finland ett flerpartisystem. Ett parti kan
      få en representant också med en ganska liten andel röster.
    sentences:
    - id: hb-c04-u0090-s001
      start: 0
      end: 77
    - id: hb-c04-u0090-s002
      start: 78
      end: 150
  - type: paragraph
    id: hb-c04-u0091
    text: Valdeltagandet anger hur stor del av de röstberättigade som röstat i ett val. Det är viktigt
      men frivilligt att rösta. I Finland varierar valdeltagandet från val till val.
    sentences:
    - id: hb-c04-u0091-s001
      start: 0
      end: 77
    - id: hb-c04-u0091-s002
      start: 78
      end: 118
    - id: hb-c04-u0091-s003
      start: 119
      end: 171
  - type: paragraph
    id: hb-c04-u0092
    text: Det kan finnas många orsaker till att en röstberättigad inte röstar i ett val. Någon kanske
      tänker att en röst inte har någon inverkan i valet. Ibland kan ändå en röst vara avgörande. Om man
      inte röstar och säger sin åsikt om vilken av kandidaterna som borde bli vald, ställer man sig frivilligt
      utanför det demokratiska beslutsfattandet.
    sentences:
    - id: hb-c04-u0092-s001
      start: 0
      end: 78
    - id: hb-c04-u0092-s002
      start: 79
      end: 143
    - id: hb-c04-u0092-s003
      start: 144
      end: 183
    - id: hb-c04-u0092-s004
      start: 184
      end: 338
  - type: paragraph
    id: hb-c04-u0093
    text: Forskning visar att äldre, höginkomsttagare och högutbildade röstar oftare än unga, låginkomsttagare
      och lågutbildade. Kvinnornas valdeltagande är i Finland aningen högre än männens. Skillnaderna i
      valdeltagande inverkar på vems röst som hörs i det samhälleliga beslutsfattandet.
    sentences:
    - id: hb-c04-u0093-s001
      start: 0
      end: 118
    - id: hb-c04-u0093-s002
      start: 119
      end: 182
    - id: hb-c04-u0093-s003
      start: 183
      end: 279
- id: hb-c04-rostratt
  title: Rösträtt och valbarhet
  blocks:
  - type: paragraph
    id: hb-c04-u0094
    text: 'Du kan rösta i kommunalval om du fyller 18 år senast på valdagen. Dessutom krävs att du fyller
      ett av följande villkor:'
    sentences:
    - id: hb-c04-u0094-s001
      start: 0
      end: 65
    - id: hb-c04-u0094-s002
      start: 66
      end: 119
  - id: hb-c04-u0096
    type: list
    ordered: false
    items:
    - id: hb-c04-u0095
      text: Du är medborgare i Finland, ett annat EU-land, Island eller Norge och har en hemkommun i Finland.
      sentences:
      - id: hb-c04-u0095-s001
        start: 0
        end: 97
    - id: hb-c04-u0097
      text: Du är medborgare i ett annat land och din hemkommun har varit i Finland i minst två år.
      sentences:
      - id: hb-c04-u0097-s001
        start: 0
        end: 87
  - type: paragraph
    id: hb-c04-u0098
    text: I kommunalval har du rösträtt i den kommun som är registrerad som din hemkommun i befolkningsdatasystemet
      i Finland den 51:a dagen före valdagen. Om din hemkommun ändras efter detta förblir din rösträtt
      i den kommun som var din hemkommun 51 dagar före valet. Du kan endast rösta på en kandidat från
      denna kommun.
    sentences:
    - id: hb-c04-u0098-s001
      start: 0
      end: 145
    - id: hb-c04-u0098-s002
      start: 146
      end: 258
    - id: hb-c04-u0098-s003
      start: 259
      end: 312
  - type: paragraph
    id: hb-c04-u0099
    text: 'Du kan rösta i välfärdsområdesval om du fyller 18 år senast på valdagen. Dessutom krävs att
      du fyller ett av följande villkor:'
    sentences:
    - id: hb-c04-u0099-s001
      start: 0
      end: 72
    - id: hb-c04-u0099-s002
      start: 73
      end: 126
  - id: hb-c04-u0101
    type: list
    ordered: false
    items:
    - id: hb-c04-u0100
      text: Du är medborgare i Finland, ett annat EU-land, Island eller Norge och har en hemkommun i Finland.
      sentences:
      - id: hb-c04-u0100-s001
        start: 0
        end: 97
    - id: hb-c04-u0102
      text: Du är medborgare i ett annat land och din hemkommun har varit i Finland i minst två år.
      sentences:
      - id: hb-c04-u0102-s001
        start: 0
        end: 87
  - type: paragraph
    id: hb-c04-u0103
    text: Du har rösträtt i det välfärdsområde i vilket din hemkommun ingår.
    sentences:
    - id: hb-c04-u0103-s001
      start: 0
      end: 66
  - type: paragraph
    id: hb-c04-u0104
    text: Du kan rösta i riksdagsval om du är finsk medborgare och fyller 18 år senast på valdagen. Även
      utomlands bosatta finska medborgare har rösträtt.
    sentences:
    - id: hb-c04-u0104-s001
      start: 0
      end: 89
    - id: hb-c04-u0104-s002
      start: 90
      end: 144
  - type: paragraph
    id: hb-c04-u0105
    text: I riksdagsval måste en kandidat också vara en myndig finsk medborgare. I allmänhet hör kandidaterna
      till politiska partier. Det finns inga begränsningar för hur många gånger samma kandidat kan bli
      vald till riksdagen i på varandra följande val.
    sentences:
    - id: hb-c04-u0105-s001
      start: 0
      end: 70
    - id: hb-c04-u0105-s002
      start: 71
      end: 123
    - id: hb-c04-u0105-s003
      start: 124
      end: 244
  - type: paragraph
    id: hb-c04-u0106
    text: Vid riksdagsval är Finland indelat i 13 valkretsar. När en person röstar i ett riksdagsval,
      kan hen rösta endast på kandidater i sin egen valkrets. Till exempel invånarna i Jyväskylä röstar
      på en kandidat i Mellersta Finlands valkrets. Med detta arrangemang vill man säkerställa att representanter
      från olika håll i landet väljs in i riksdagen.
    sentences:
    - id: hb-c04-u0106-s001
      start: 0
      end: 51
    - id: hb-c04-u0106-s002
      start: 52
      end: 147
    - id: hb-c04-u0106-s003
      start: 148
      end: 235
    - id: hb-c04-u0106-s004
      start: 236
      end: 344
  - type: paragraph
    id: hb-c04-u0107
    text: Man kan ställa upp som kandidat om man har rösträtt i välfärdsområdesvalet. Personer som arbetar
      med vissa ledningsuppgifter inom välfärdsområdet kan ändå inte kandidera. Kandidaterna hör vanligtvis
      till något politiskt parti, men det finns också obundna kandidater.
    sentences:
    - id: hb-c04-u0107-s001
      start: 0
      end: 75
    - id: hb-c04-u0107-s002
      start: 76
      end: 170
    - id: hb-c04-u0107-s003
      start: 171
      end: 266
  - type: paragraph
    id: hb-c04-u0108
    text: I kommunfullmäktige beslutar man om kommunala frågor. Ledamöterna i kommunfullmäktige väljs
      i ett kommunalval. Fullmäktiges storlek beror på antalet invånare i kommunen. Om kommunen har många
      invånare, finns det fler ledamöter i kommunfullmäktige.
    sentences:
    - id: hb-c04-u0108-s001
      start: 0
      end: 53
    - id: hb-c04-u0108-s002
      start: 54
      end: 110
    - id: hb-c04-u0108-s003
      start: 111
      end: 169
    - id: hb-c04-u0108-s004
      start: 170
      end: 247
  - type: paragraph
    id: hb-c04-u0109
    text: Kommunalvalet hålls samtidigt som välfärdsområdesvalet. I båda valen kan en röstberättigad alltså
      rösta på två olika kandidater samtidigt, en i välfärdsområdesvalet och en i kommunalvalet. Om samma
      kandidat ställer upp i båda valen, kan väljaren välja att rösta på samma kandidat i båda valen.
    sentences:
    - id: hb-c04-u0109-s001
      start: 0
      end: 55
    - id: hb-c04-u0109-s002
      start: 56
      end: 188
    - id: hb-c04-u0109-s003
      start: 189
      end: 293
  - type: paragraph
    id: hb-c04-u0110
    text: Man kan kandidera i kommunalvalet om man är invånare i en kommun och har rösträtt i kommunalvalet.
      Man behöver alltså inte vara finsk medborgare.
    sentences:
    - id: hb-c04-u0110-s001
      start: 0
      end: 98
    - id: hb-c04-u0110-s002
      start: 99
      end: 145
  - type: paragraph
    id: hb-c04-u0111
    text: Presidenten väljs i presidentval. Presidentval förrättas vart sjätte år. Samma person kan väljas
      till president för högst två mandatperioder i följd.
    sentences:
    - id: hb-c04-u0111-s001
      start: 0
      end: 33
    - id: hb-c04-u0111-s002
      start: 34
      end: 72
    - id: hb-c04-u0111-s003
      start: 73
      end: 149
  - type: paragraph
    id: hb-c04-u0112
    text: Presidentvalet har vanligen två steg. Om ingen av kandidaterna får mer än hälften av de givna
      rösterna vid första valomgången, förrättas en andra valomgång. I den andra valomgången kandiderar
      de två kandidater som fick flest röster vid första valomgången. Den person som får flest röster
      vid andra valomgången väljs till president.
    sentences:
    - id: hb-c04-u0112-s001
      start: 0
      end: 37
    - id: hb-c04-u0112-s002
      start: 38
      end: 156
    - id: hb-c04-u0112-s003
      start: 157
      end: 255
    - id: hb-c04-u0112-s004
      start: 256
      end: 331
  - type: paragraph
    id: hb-c04-u0113
    text: Du kan rösta i presidentval om du är finsk medborgare och fyller 18 år senast på valdagen. Även
      utomlands bosatta finska medborgare har rösträtt.
    sentences:
    - id: hb-c04-u0113-s001
      start: 0
      end: 90
    - id: hb-c04-u0113-s002
      start: 91
      end: 145
  - type: paragraph
    id: hb-c04-u0114
    text: Republikens president ska vara infödd finsk medborgare. Kandidaterna nomineras oftast av olika
      partier, men ibland finns det också kandidater som nomineras av valmansföreningar utanför partierna.
    sentences:
    - id: hb-c04-u0114-s001
      start: 0
      end: 55
    - id: hb-c04-u0114-s002
      start: 56
      end: 195
  - type: paragraph
    id: hb-c04-u0115
    text: EU-parlamentet är Europeiska unionens representativa organ. Ledamöterna i EU-parlamentet är
      representanter som utsetts genom val i medlemsländerna. Finland väljer egna representanter till
      EU-parlamentet i Europaparlamentsvalet. Sammanlagt väljs 720 ledamöter från alla EU-länder till
      Europaparlamentet. Antalet ledamöter som väljs i Finland varierar. I valet år 2024 valdes 15 ledamöter
      från Finland.
    sentences:
    - id: hb-c04-u0115-s001
      start: 0
      end: 59
    - id: hb-c04-u0115-s002
      start: 60
      end: 147
    - id: hb-c04-u0115-s003
      start: 148
      end: 227
    - id: hb-c04-u0115-s004
      start: 228
      end: 302
    - id: hb-c04-u0115-s005
      start: 303
      end: 350
    - id: hb-c04-u0115-s006
      start: 351
      end: 400
  - type: paragraph
    id: hb-c04-u0116
    text: 'Du kan rösta i Europaparlamentsvalet om du uppfyller något av följande villkor:'
    sentences:
    - id: hb-c04-u0116-s001
      start: 0
      end: 79
  - id: hb-c04-u0118
    type: list
    ordered: false
    items:
    - id: hb-c04-u0117
      text: Du är finsk medborgare och fyller 18 år senast på valdagen.
      sentences:
      - id: hb-c04-u0117-s001
        start: 0
        end: 59
    - id: hb-c04-u0119
      text: Du är medborgare i ett annat EU-land och fyller 18 år senast på valdagen. Dessutom ska du
        ha hemkommun i Finland den 51:a dagen före valdagen. Du måste också anmäla dig till rösträttsregistret
        i Finland. Anmälningen ska göras till Myndigheten för digitalisering och befolkningsdata senast
        den 80:e dagen före valdagen.
      sentences:
      - id: hb-c04-u0119-s001
        start: 0
        end: 73
      - id: hb-c04-u0119-s002
        start: 74
        end: 142
      - id: hb-c04-u0119-s003
        start: 143
        end: 203
      - id: hb-c04-u0119-s004
        start: 204
        end: 318
  - type: paragraph
    id: hb-c04-u0120
    text: I samma val kan du rösta i endast ett EU-land.
    sentences:
    - id: hb-c04-u0120-s001
      start: 0
      end: 46
  - type: paragraph
    id: hb-c04-u0121
    text: Kandidaterna i Europaparlamentsvalet representerar olika partier, på samma sätt som i riksdagsvalet.
      Hela Finland är en och samma valkrets, det vill säga man kan rösta på samma kandidater överallt
      i Finland. Man kan ställa upp som kandidat om man är finsk medborgare eller medborgare i ett annat
      EU-land, det vill säga om man har rösträtt i Europaparlamentsvalet. Kandidaterna nomineras av ett
      politiskt parti eller en valmansförening.
    sentences:
    - id: hb-c04-u0121-s001
      start: 0
      end: 100
    - id: hb-c04-u0121-s002
      start: 101
      end: 207
    - id: hb-c04-u0121-s003
      start: 208
      end: 363
    - id: hb-c04-u0121-s004
      start: 364
      end: 435
- id: hb-c04-partisystem
  title: Politiska partier och ideologier
  blocks:
  - type: paragraph
    id: hb-c04-u0122
    text: De viktigaste indelningarna för att skilja partierna åt är indelningen i högerpartier och vänsterpartier
      samt konservativa och liberala partier. Dessutom skiljer sig partierna från varandra i fråga om
      till exempel inställningen till lantbruk och upprätthållande av servicen i glesbygden, inställningen
      till invandring samt hur viktiga de anser att miljöskydd och bromsandet av klimatförändringen är.
    sentences:
    - id: hb-c04-u0122-s001
      start: 0
      end: 144
    - id: hb-c04-u0122-s002
      start: 145
      end: 399
  - type: paragraph
    id: hb-c04-u0123
    text: De partier som har ledamöter i riksdagen får ekonomiskt stöd av staten. Partierna och kandidaterna
      får också bidrag för sina valkampanjer. De som utses till riksdagsledamöter och ersättare för riksdagsledamöter
      ska dock göra en anmälan där de berättar vem de fått finansiering av.
    sentences:
    - id: hb-c04-u0123-s001
      start: 0
      end: 71
    - id: hb-c04-u0123-s002
      start: 72
      end: 138
    - id: hb-c04-u0123-s003
      start: 139
      end: 280
  - type: paragraph
    id: hb-c04-u0124
    text: Politiska partier är organisationer vars verksamhetsidé är att utveckla samhället i den riktning
      partiets medlemmar vill. Partiet ska ha ett partiprogram. Det är ett dokument där partiets viktigaste
      principer och mål finns inskrivna. Programmet anger också hur partiet vill påverka det finländska
      samhället och de politiska besluten.
    sentences:
    - id: hb-c04-u0124-s001
      start: 0
      end: 121
    - id: hb-c04-u0124-s002
      start: 122
      end: 154
    - id: hb-c04-u0124-s003
      start: 155
      end: 233
    - id: hb-c04-u0124-s004
      start: 234
      end: 333
  - type: paragraph
    id: hb-c04-u0125
    text: I Finland kan vem som helst höra till ett politiskt parti. Medlemskap i ett parti får inte vara
      en grund för att till exempel som arbetssökande inte bli vald till en anställning. Ett viktigt sätt
      för samhällelig påverkan är att själv kandidera i val. Kandidater är i allmänhet medlemmar i ett
      parti. Det är ändå möjligt att ställa upp också som obunden kandidat eller som kandidat för en valmansförening.
    sentences:
    - id: hb-c04-u0125-s001
      start: 0
      end: 58
    - id: hb-c04-u0125-s002
      start: 59
      end: 178
    - id: hb-c04-u0125-s003
      start: 179
      end: 250
    - id: hb-c04-u0125-s004
      start: 251
      end: 299
    - id: hb-c04-u0125-s005
      start: 300
      end: 404
  - type: paragraph
    id: hb-c04-u0126
    text: Finland har ett flerpartisystem, det vill säga det finns många olika partier. Stödet för partierna
      varierar från val till val. I allmänhet har inget enskilt parti absolut majoritet i riksdagen. Partierna
      måste samarbeta med varandra. Därför är det viktigt att kunna förhandla och göra kompromisser inom
      finländsk politik.
    sentences:
    - id: hb-c04-u0126-s001
      start: 0
      end: 77
    - id: hb-c04-u0126-s002
      start: 78
      end: 126
    - id: hb-c04-u0126-s003
      start: 127
      end: 193
    - id: hb-c04-u0126-s004
      start: 194
      end: 233
    - id: hb-c04-u0126-s005
      start: 234
      end: 321
  - type: paragraph
    id: hb-c04-u0127
    text: År 2024 fanns det 16 registrerade partier i Finland varav nio hade ledamöter i riksdagen. De
      övriga partierna var små. Deras mål var att få en riksdagsplats i valet.
    sentences:
    - id: hb-c04-u0127-s001
      start: 0
      end: 89
    - id: hb-c04-u0127-s002
      start: 90
      end: 118
    - id: hb-c04-u0127-s003
      start: 119
      end: 165
  - type: paragraph
    id: hb-c04-u0128
    text: I Finland finansierar staten, det vill säga skattebetalarna, partiernas verksamhet. Bidraget
      från staten räcker till för att betala endast en del av partiernas kostnader. Partierna får dessutom
      pengar genom till exempel medlemsavgifter. Ett parti får ekonomiskt bidrag från staten enligt hur
      många riksdagsledamöter det har i riksdagen. Stora partier som har stor framgång i val får alltså
      mer pengar än små partier.
    sentences:
    - id: hb-c04-u0128-s001
      start: 0
      end: 83
    - id: hb-c04-u0128-s002
      start: 84
      end: 170
    - id: hb-c04-u0128-s003
      start: 171
      end: 236
    - id: hb-c04-u0128-s004
      start: 237
      end: 336
    - id: hb-c04-u0128-s005
      start: 337
      end: 416
  - type: paragraph
    id: hb-c04-u0129
    text: Partierna och kandidaterna får också annan finansiering till exempel inför val. En del av finansieringen
      är bidrag från privatpersoner, företag eller organisationer. Kandidaterna får inte ta emot bidrag
      av givare som inte kan utredas. Det maximala beloppet från en och samma uppbackare är reglerat i
      lag. Statens revisionsverk övervakar partifinansieringen.
    sentences:
    - id: hb-c04-u0129-s001
      start: 0
      end: 79
    - id: hb-c04-u0129-s002
      start: 80
      end: 165
    - id: hb-c04-u0129-s003
      start: 166
      end: 234
    - id: hb-c04-u0129-s004
      start: 235
      end: 304
    - id: hb-c04-u0129-s005
      start: 305
      end: 357
  - type: paragraph
    id: hb-c04-u0130
    text: Den traditionellt sett viktigaste faktorn som skiljer partierna åt har varit indelningen i höger
      och vänster. Vänsterpartierna har förespråkat socialism eller socialdemokrati, arbetarnas rättigheter
      och en stark stat, som erbjuder människorna olika tjänster och får sin finansiering genom de skatter
      som enskilda individer och företag betalar. Vänstern har varit beredd att acceptera höga skatter,
      eftersom man enligt deras uppfattning kan bygga och upprätthålla ett jämställt samhälle där alla
      människor tas om hand med hjälp av skatter.
    sentences:
    - id: hb-c04-u0130-s001
      start: 0
      end: 109
    - id: hb-c04-u0130-s002
      start: 110
      end: 343
    - id: hb-c04-u0130-s003
      start: 344
      end: 538
  - type: paragraph
    id: hb-c04-u0131
    text: Högerpartierna har förespråkat kapitalism, fri marknadsekonomi och lägre skatter. Högern vill
      att staten har en mindre roll i samhället och att individens eget ansvar för sitt liv är större.
      Högern driver också egenföretagarnas och företagens intressen. I samhället har företagen en viktig
      roll i skapandet av ekonomisk tillväxt och arbetsplatser.
    sentences:
    - id: hb-c04-u0131-s001
      start: 0
      end: 81
    - id: hb-c04-u0131-s002
      start: 82
      end: 190
    - id: hb-c04-u0131-s003
      start: 191
      end: 253
    - id: hb-c04-u0131-s004
      start: 254
      end: 347
  - type: paragraph
    id: hb-c04-u0132
    text: Man kan också göra andra indelningar av partierna. I dag skiljer i synnerhet konservatismen
      och liberalismen människor åt. Konservatismen är förknippad med traditionella värderingar och måttliga,
      det vill säga små, reformer i samhället. Nuförtiden är de konservativa ofta nationellt sinnade,
      det vill säga de försöker framhäva Finlands nationella intresse i sina beslut. Många konservativa
      förespråkar också en strikt reglering av invandringen.
    sentences:
    - id: hb-c04-u0132-s001
      start: 0
      end: 50
    - id: hb-c04-u0132-s002
      start: 51
      end: 122
    - id: hb-c04-u0132-s003
      start: 123
      end: 236
    - id: hb-c04-u0132-s004
      start: 237
      end: 370
    - id: hb-c04-u0132-s005
      start: 371
      end: 444
  - type: paragraph
    id: hb-c04-u0133
    text: Liberalismen i sin tur är förknippad med stor individuell och ekonomisk frihet, liberala värderingar
      och mänskliga rättigheter. För liberaler är till exempel kvinnors rättigheter och rättigheterna
      för könsminoriteter och sexuella minoriteter ofta viktiga. Liberaler betonar internationellt samarbete
      och Finlands internationella ansvar. Liberaler förhåller sig också i allmänhet mer positivt till
      invandring än konservativa.
    sentences:
    - id: hb-c04-u0133-s001
      start: 0
      end: 127
    - id: hb-c04-u0133-s002
      start: 128
      end: 255
    - id: hb-c04-u0133-s003
      start: 256
      end: 336
    - id: hb-c04-u0133-s004
      start: 337
      end: 424
  - type: paragraph
    id: hb-c04-u0134
    text: I Finland har det traditionellt varit viktigt för väljarna huruvida en kandidat driver landsbygdens
      eller städernas frågor. Viktiga frågor för stadsbor är ofta globala nätverk och ett nära internationellt
      samarbete med till exempel Europeiska unionen.
    sentences:
    - id: hb-c04-u0134-s001
      start: 0
      end: 123
    - id: hb-c04-u0134-s002
      start: 124
      end: 251
  - type: paragraph
    id: hb-c04-u0135
    text: Ur landsbygdens synvinkel är bevarande av servicen i glesbygden och inhemsk jordbruksproduktion
      viktigare. I det perspektivet är det möjligt att beroendet av andra länder betraktas som någonting
      negativt som tar arbetsplatser från Finland, gör det svårare att idka jordbruk och orsakar instabilitet
      i samhället.
    sentences:
    - id: hb-c04-u0135-s001
      start: 0
      end: 106
    - id: hb-c04-u0135-s002
      start: 107
      end: 311
  - type: paragraph
    id: hb-c04-u0136
    text: För många väljare är det också av betydelse huruvida partiet anser att ekonomisk tillväxt eller
      natur- och miljöskydd är viktigare. Ekonomisk tillväxt kan förstöra miljön, men å andra sidan kan
      den skapa välstånd och arbetsplatser i samhället.
    sentences:
    - id: hb-c04-u0136-s001
      start: 0
      end: 131
    - id: hb-c04-u0136-s002
      start: 132
      end: 243
- id: hb-c04-partier
  title: Partierna i riksdagsvalet 2023
  blocks:
  - type: paragraph
    id: hb-c04-u0137
    text: Nedan presenteras de partier som fick minst en riksdagsledamot i riksdagsvalet år 2023. Partierna
      presenteras i storleksordning utifrån deras genomsnittliga stöd i riksdagsvalen åren 2003–2023.
    sentences:
    - id: hb-c04-u0137-s001
      start: 0
      end: 87
    - id: hb-c04-u0137-s002
      start: 88
      end: 193
  - type: paragraph
    id: hb-c04-u0138
    text: Samlingspartiet är ett högerparti. Traditionellt har det varit ett parti för den ekonomiska
      eliten och den utbildade högre samhällsklassen. Det har en stark ställning i huvudstadsregionen,
      men är också ett av Finlands största partier. En del av samlingspartiets politiker har liberala
      värderingar, andra konservativa.
    sentences:
    - id: hb-c04-u0138-s001
      start: 0
      end: 34
    - id: hb-c04-u0138-s002
      start: 35
      end: 139
    - id: hb-c04-u0138-s003
      start: 140
      end: 234
    - id: hb-c04-u0138-s004
      start: 235
      end: 317
  - type: paragraph
    id: hb-c04-u0139
    text: Samlingspartiets grundläggande värderingar är bland annat frihet, ansvar, säkerhet och jämlika
      möjligheter. För samlingspartiet är företagarnas intressen viktiga. Man vill uppmuntra människor
      att vara företagsamma och starta egna företag. Därför anser partiet till exempel att de skatter
      som företagen betalar borde sänkas. Statens roll ska vara mindre än enligt vänsterpartierna. Samlingspartiet
      ställer sig positivt till EU.
    sentences:
    - id: hb-c04-u0139-s001
      start: 0
      end: 107
    - id: hb-c04-u0139-s002
      start: 108
      end: 162
    - id: hb-c04-u0139-s003
      start: 163
      end: 238
    - id: hb-c04-u0139-s004
      start: 239
      end: 323
    - id: hb-c04-u0139-s005
      start: 324
      end: 380
    - id: hb-c04-u0139-s006
      start: 381
      end: 426
  - type: paragraph
    id: hb-c04-u0140
    text: Finlands Socialdemokratiska Parti, SDP, har länge varit ett stort parti som ofta sitter i regeringen.
      SDP, Centern och Samlingspartiet är Finlands äldsta och traditionellt sett största partier. SDP
      har varit ett vänsterorientart parti för industriarbetare och lönearbetare i städerna. Dess ideologi
      är socialdemokratin med utgångspunkt i socialismen, och partiet är inte lika vänsterorienterat som
      Vänsterförbundet. SDP är till sina värderingar ett liberalt parti.
    sentences:
    - id: hb-c04-u0140-s001
      start: 0
      end: 101
    - id: hb-c04-u0140-s002
      start: 102
      end: 193
    - id: hb-c04-u0140-s003
      start: 194
      end: 284
    - id: hb-c04-u0140-s004
      start: 285
      end: 415
    - id: hb-c04-u0140-s005
      start: 416
      end: 464
  - type: paragraph
    id: hb-c04-u0141
    text: Viktiga frågor för SDP är bevarande av välfärdssamhället och social rättvisa. Partiet vill arbeta
      för ett jämställt och solidariskt samhälle. Det motsätter sig en okontrollerad marknadsekonomi.
    sentences:
    - id: hb-c04-u0141-s001
      start: 0
      end: 77
    - id: hb-c04-u0141-s002
      start: 78
      end: 141
    - id: hb-c04-u0141-s003
      start: 142
      end: 193
  - type: paragraph
    id: hb-c04-u0142
    text: Centern i Finland, det vill säga Centerpartiet, har traditionellt varit det populäraste partiet
      på landsbygden i Finland. Det har dock tappat stöd till förmån för i synnerhet Sannfinländarna.
      Centerpartiet definierar sig självt som mer högerorienterat än vänsterorienterat. En del av partiets
      politiker förespråkar liberala värderingar, andra konservativa.
    sentences:
    - id: hb-c04-u0142-s001
      start: 0
      end: 121
    - id: hb-c04-u0142-s002
      start: 122
      end: 191
    - id: hb-c04-u0142-s003
      start: 192
      end: 273
    - id: hb-c04-u0142-s004
      start: 274
      end: 356
  - type: paragraph
    id: hb-c04-u0143
    text: Centerpartiet driver landsbygdens intressen, till exempel statens och EU:s ekonomiska stöd till
      jordbrukare. Centerpartiet strävar efter att tjänster och arbetsplatser ska bevaras i hela Finland.
      Finland är ett glest befolkat land, och att erbjuda tjänster på landsbygden är ofta dyrt. För Centerpartiet
      är det ändå viktigt att människorna är i en jämlik ställning sinsemellan oberoende av var de bor.
      Också Centerpartiet driver företagarnas intressen. Det strävar efter att det ska vara lättare för
      företag att sysselsätta människor. Centerpartiet betonar också vikten av Finlands säkerhet och självförsörjning.
    sentences:
    - id: hb-c04-u0143-s001
      start: 0
      end: 108
    - id: hb-c04-u0143-s002
      start: 109
      end: 195
    - id: hb-c04-u0143-s003
      start: 196
      end: 285
    - id: hb-c04-u0143-s004
      start: 286
      end: 401
    - id: hb-c04-u0143-s005
      start: 402
      end: 452
    - id: hb-c04-u0143-s006
      start: 453
      end: 534
    - id: hb-c04-u0143-s007
      start: 535
      end: 612
  - type: paragraph
    id: hb-c04-u0144
    text: Sannfinländarna är ett nationalistiskt parti. Sannfinländarna var tidigare ett litet parti,
      men från och med riksdagsvalet år 2011 har det fått mycket röster och etablerat sin ställning som
      ett av de stora partierna. Tidigare hade Sannfinländarna anhängare både från högern och vänstern,
      men partiet har blivit klart mer högerorienterat. Till sina värderingar är Sannfinländarna mycket
      konservativa.
    sentences:
    - id: hb-c04-u0144-s001
      start: 0
      end: 45
    - id: hb-c04-u0144-s002
      start: 46
      end: 216
    - id: hb-c04-u0144-s003
      start: 217
      end: 337
    - id: hb-c04-u0144-s004
      start: 338
      end: 399
  - type: paragraph
    id: hb-c04-u0145
    text: I sin politik lyfter Sannfinländarna fram vikten av att bevara den finländska identiteten och
      finländska kulturen. Sannfinländarna vill minska invandringen till Finland och förhåller sig kritiska
      till EU. Det är också viktigt för partiet att främja finländskt arbete och företagande.
    sentences:
    - id: hb-c04-u0145-s001
      start: 0
      end: 114
    - id: hb-c04-u0145-s002
      start: 115
      end: 204
    - id: hb-c04-u0145-s003
      start: 205
      end: 283
  - type: paragraph
    id: hb-c04-u0146
    text: Vänsterförbundet är ett vänsterparti. Vänsterförbundet har traditionellt varit ett parti för
      den lågavlönade arbetarbefolkningen, men nuförtiden är det framför allt unga som röstar på det.
      Vänsterförbundet är ett mycket liberalt parti.
    sentences:
    - id: hb-c04-u0146-s001
      start: 0
      end: 37
    - id: hb-c04-u0146-s002
      start: 38
      end: 188
    - id: hb-c04-u0146-s003
      start: 189
      end: 235
  - type: paragraph
    id: hb-c04-u0147
    text: Vänsterförbundets grundläggande värderingar är jämlikhet, rättvisa, frihet och ekologisk hållbarhet.
      Enligt Vänsterförbundet bör välfärdssamhället utvecklas och kapitalismen begränsas. Partiets mål
      är en ekologiskt hållbar välfärdsstat där alla kan delta i beslutsfattandet. Partiet vill främja
      likabehandling och feminism och miljöskydd.
    sentences:
    - id: hb-c04-u0147-s001
      start: 0
      end: 100
    - id: hb-c04-u0147-s002
      start: 101
      end: 184
    - id: hb-c04-u0147-s003
      start: 185
      end: 274
    - id: hb-c04-u0147-s004
      start: 275
      end: 338
  - type: paragraph
    id: hb-c04-u0148
    text: Viktiga frågor för De Gröna är miljöskydd och bromsande av klimatförändringen. I synnerhet unga
      högutbildade stadsbor röstar på De Gröna. Största delen av De Grönas anhängare är rätt så vänsterorienterade,
      men partiet har också mer högerorienterade anhängare. De Gröna är ett mycket liberalt parti.
    sentences:
    - id: hb-c04-u0148-s001
      start: 0
      end: 78
    - id: hb-c04-u0148-s002
      start: 79
      end: 137
    - id: hb-c04-u0148-s003
      start: 138
      end: 259
    - id: hb-c04-u0148-s004
      start: 260
      end: 298
  - type: paragraph
    id: hb-c04-u0149
    text: Utöver miljöskyddet betonar De Gröna också jämställdhet och mänskliga rättigheter i sin politik.
      De Gröna försöker främja en rättvis övergång till en ekologiskt hållbar ekonomi. De Grönas mål är
      ett ekologiskt och socialt hållbart samhälle, där alla kan leva det liv som de själva vill. Också
      rättigheterna för olika minoriteter är viktiga för partiet.
    sentences:
    - id: hb-c04-u0149-s001
      start: 0
      end: 96
    - id: hb-c04-u0149-s002
      start: 97
      end: 177
    - id: hb-c04-u0149-s003
      start: 178
      end: 286
    - id: hb-c04-u0149-s004
      start: 287
      end: 352
  - type: paragraph
    id: hb-c04-u0150
    text: Svenska folkpartiet i Finland, SFP, är ett parti för i synnerhet den svensktalande befolkningen
      i Finland. Det förespråkar tvåspråkighet och strävar efter att främja och upprätthålla tjänster
      på svenska. SFP är ett litet parti, men sitter ändå nästan alltid i Finlands regering. SFP och svenskspråkigheten
      är också en viktig länk för Finland till det nordiska samarbetet och den nordiska kulturen. Största
      delen av SFP-politikerna är rätt så högerorienterade i ekonomiska frågor. SFP är ett liberalt parti.
    sentences:
    - id: hb-c04-u0150-s001
      start: 0
      end: 106
    - id: hb-c04-u0150-s002
      start: 107
      end: 203
    - id: hb-c04-u0150-s003
      start: 204
      end: 278
    - id: hb-c04-u0150-s004
      start: 279
      end: 397
    - id: hb-c04-u0150-s005
      start: 398
      end: 479
    - id: hb-c04-u0150-s006
      start: 480
      end: 506
  - type: paragraph
    id: hb-c04-u0151
    text: Eftersom så många finlandssvenskar understöder SFP, finns det flera olika inriktningar inom
      partiet. Inom partiet finns det till exempel å ena sidan en urban inriktning och å andra sidan en
      mer jordbruksbetonad inriktning. Partiet understöder Europeiska unionen och en stark europeisk enighet.
      SFP eftersträvar ett öppet och tolerant samhälle och betonar individens frihet och ansvar. SFP förhåller
      sig positivt till invandring, kulturell mångfald och minoriteters rättigheter.
    sentences:
    - id: hb-c04-u0151-s001
      start: 0
      end: 100
    - id: hb-c04-u0151-s002
      start: 101
      end: 222
    - id: hb-c04-u0151-s003
      start: 223
      end: 293
    - id: hb-c04-u0151-s004
      start: 294
      end: 384
    - id: hb-c04-u0151-s005
      start: 385
      end: 477
  - type: paragraph
    id: hb-c04-u0152
    text: Kristdemokraterna i Finland, KD, anser att det är viktigt att beakta kristna värderingar i beslutsfattandet.
      Politiken bygger på kristendomen. Kristdemokraterna är ett litet parti. Inom den ekonomiska politiken
      är partiet på samma sätt som Centerpartiet aningen mer högerorienterat än vänsterorienterat. Partiet
      har konservativa värderingar.
    sentences:
    - id: hb-c04-u0152-s001
      start: 0
      end: 108
    - id: hb-c04-u0152-s002
      start: 109
      end: 142
    - id: hb-c04-u0152-s003
      start: 143
      end: 180
    - id: hb-c04-u0152-s004
      start: 181
      end: 303
    - id: hb-c04-u0152-s005
      start: 304
      end: 341
  - type: paragraph
    id: hb-c04-u0153
    text: Viktiga värderingar för kristdemokraterna är människovärdet, familjens betydelse och stärkande
      av närsamhällen. Kristdemokraterna eftersträvar ett samhälle där ekonomin och välfärden bygger på
      företagsamhet och ansvar. Rättvisa, hälsa och utbildning är andra viktiga teman. Kristdemokraterna
      motsätter sig abort och rätten att ingå äktenskap för personer av samma kön.
    sentences:
    - id: hb-c04-u0153-s001
      start: 0
      end: 111
    - id: hb-c04-u0153-s002
      start: 112
      end: 218
    - id: hb-c04-u0153-s003
      start: 219
      end: 273
    - id: hb-c04-u0153-s004
      start: 274
      end: 368
  - type: paragraph
    id: hb-c04-u0154
    text: Rörelse Nu är ett litet parti. Det har som mål att förnya politiken och ekonomin i Finland.
      Det vill inte förbinda sig till de traditionella partiernas ideologier. Dess politiker är ändå till
      största delen ekonomiskt högerorienterade. Till sina värderingar är partiet först och främst rätt
      så konservativt.
    sentences:
    - id: hb-c04-u0154-s001
      start: 0
      end: 30
    - id: hb-c04-u0154-s002
      start: 31
      end: 91
    - id: hb-c04-u0154-s003
      start: 92
      end: 163
    - id: hb-c04-u0154-s004
      start: 164
      end: 234
    - id: hb-c04-u0154-s005
      start: 235
      end: 306
  - type: paragraph
    id: hb-c04-u0155
    text: Rörelse Nu anser att företagsamhet och utveckling av marknadsekonomin är viktiga. Partiet vill
      främja öppenhet och individens frihet. Också främjande av ekonomisk tillväxt och säkerhet hör till
      partiets mål.
    sentences:
    - id: hb-c04-u0155-s001
      start: 0
      end: 81
    - id: hb-c04-u0155-s002
      start: 82
      end: 133
    - id: hb-c04-u0155-s003
      start: 134
      end: 207
- id: hb-c04-paverkan
  title: Medborgarengagemang och påverkan
  blocks:
  - type: paragraph
    id: hb-c04-u0156
    text: Delaktighet i samhället är ett av målen för integrationen. Delaktighet innebär att en person
      kan fatta beslut om sitt liv och att hen upplever sig vara en del av en gemenskap. Delaktighet är
      också att personen om hen vill kan påverka på bredare front i sin omgivning och i samhället.
    sentences:
    - id: hb-c04-u0156-s001
      start: 0
      end: 58
    - id: hb-c04-u0156-s002
      start: 59
      end: 175
    - id: hb-c04-u0156-s003
      start: 176
      end: 283
  - type: paragraph
    id: hb-c04-u0157
    text: I Finland garanterar bland annat yttrandefriheten och mötes- och föreningsfriheten mångsidiga
      möjligheter för alla att delta och påverka. Man kan påverka genom att till exempel rösta, kontakta
      politiker eller delta i demonstrationer. I Finland finns det också officiella påverkansmetoder med
      vilka vanliga medborgare kan lyfta fram frågor som de upplever vara viktiga till politisk behandling.
      Sådana metoder är till exempel medborgarinitiativ och invånarinitiativ.
    sentences:
    - id: hb-c04-u0157-s001
      start: 0
      end: 137
    - id: hb-c04-u0157-s002
      start: 138
      end: 233
    - id: hb-c04-u0157-s003
      start: 234
      end: 393
    - id: hb-c04-u0157-s004
      start: 394
      end: 465
  - type: paragraph
    id: hb-c04-u0158
    text: I Finland finns ett mål om att alla som bor i Finland ska kunna uppleva delaktighet i samhället.
      Delaktighet är en känsla av att höra till. När en människa upplever delaktighet, känner hen sig
      uppskattad och jämlik med andra. Hen vågar lita på såväl sig själv och sina möjligheter som på andra
      människor. Känslan av delaktighet ger livet mening och ökar välbefinnandet.
    sentences:
    - id: hb-c04-u0158-s001
      start: 0
      end: 96
    - id: hb-c04-u0158-s002
      start: 97
      end: 139
    - id: hb-c04-u0158-s003
      start: 140
      end: 225
    - id: hb-c04-u0158-s004
      start: 226
      end: 304
    - id: hb-c04-u0158-s005
      start: 305
      end: 369
  - type: paragraph
    id: hb-c04-u0159
    text: Delaktigheten har olika dimensioner. Delaktighet i sitt eget liv betyder att en människa kan
      påverka och själv fatta beslut om sitt liv. Dessa beslut kan vara såväl små och dagliga som större
      beslut om hur hen vill leva sitt liv.
    sentences:
    - id: hb-c04-u0159-s001
      start: 0
      end: 36
    - id: hb-c04-u0159-s002
      start: 37
      end: 136
    - id: hb-c04-u0159-s003
      start: 137
      end: 229
  - type: paragraph
    id: hb-c04-u0160
    text: Delaktighet innebär dessutom att höra till olika gemenskaper. Gemenskaperna kan vara små, såsom
      den egna familjen eller vänkretsen. Gemenskaper kan också vara till exempel människorna i ens bostadsområde,
      arbetskamrater, hobbygrupper eller föreningar. En människa upplever delaktighet när hen känner att
      hen är en del av en gemenskap som är viktig för hen.
    sentences:
    - id: hb-c04-u0160-s001
      start: 0
      end: 61
    - id: hb-c04-u0160-s002
      start: 62
      end: 131
    - id: hb-c04-u0160-s003
      start: 132
      end: 251
    - id: hb-c04-u0160-s004
      start: 252
      end: 356
  - type: paragraph
    id: hb-c04-u0161
    text: Delaktighet är förknippad med upplevelsen av att man får skapa och dela det gemensamma bästa
      och njuta av det tillsammans med andra. Det gemensamma bästa kan vara till exempel gemensamma utrymmen
      och en trivsam livsmiljö, konst eller i ett större perspektiv samhället och tjänsterna det erbjuder.
      En människa kan bidra till att skapa det gemensamma bästa genom att till exempel arbeta och betala
      skatt. Hen kan också delta i frivilligverksamhet eller till exempel ansvara för husbolagets gemensamma
      blomrabatt, som skänker alla som bor i grannskapet glädje.
    sentences:
    - id: hb-c04-u0161-s001
      start: 0
      end: 132
    - id: hb-c04-u0161-s002
      start: 133
      end: 296
    - id: hb-c04-u0161-s003
      start: 297
      end: 402
    - id: hb-c04-u0161-s004
      start: 403
      end: 557
  - type: paragraph
    id: hb-c04-u0162
    text: Delaktighet är också att man kan påverka frågor som är viktiga för en i sin livsmiljö eller
      sin gemenskap, eller om man vill på bredare front i samhället. Påverkan innebär att man försöker
      förändra saker och ting. Genom att påverka har man möjlighet att göra så att världen bättre stämmer
      överens med ens egna värderingar och önskemål.
    sentences:
    - id: hb-c04-u0162-s001
      start: 0
      end: 154
    - id: hb-c04-u0162-s002
      start: 155
      end: 213
    - id: hb-c04-u0162-s003
      start: 214
      end: 335
  - type: paragraph
    id: hb-c04-u0163
    text: I Finland kan vem som helst påverka samhällsfrågor och politiken på många olika sätt. I Finland
      har medborgarengagemanget långa traditioner. Medborgarengagemang avser medborgarnas aktivitet för
      att främja olika samhällsfrågor.
    sentences:
    - id: hb-c04-u0163-s001
      start: 0
      end: 85
    - id: hb-c04-u0163-s002
      start: 86
      end: 140
    - id: hb-c04-u0163-s003
      start: 141
      end: 226
  - type: paragraph
    id: hb-c04-u0164
    text: I Finland fanns det många stora folkrörelser, till exempel kvinnorörelsen och arbetarrörelsen,
      på 1900-talet. De bidrog på ett betydande sätt till utvecklingen av ett demokratiskt samhälle. Inom
      folkrörelserna har vanliga finländare lärt sig hur man kan hantera gemensamma frågor och fått möjlighet
      att påverka hur välfärdssamhället byggts upp. Många finländska politiker har i början av sina karriärer
      varit verksamma i medborgarorganisationer eller på annat sätt varit aktiva inom samhällelig verksamhet.
    sentences:
    - id: hb-c04-u0164-s001
      start: 0
      end: 109
    - id: hb-c04-u0164-s002
      start: 110
      end: 189
    - id: hb-c04-u0164-s003
      start: 190
      end: 344
    - id: hb-c04-u0164-s004
      start: 345
      end: 506
  - type: paragraph
    id: hb-c04-u0165
    text: Enligt Finlands grundlag har den offentliga makten som uppgift att främja individens möjligheter
      att delta i samhällelig verksamhet och påverka beslut som gäller hen själv. Man kan påverka på många
      olika sätt, både på officiella vägar och genom fri verksamhet.
    sentences:
    - id: hb-c04-u0165-s001
      start: 0
      end: 172
    - id: hb-c04-u0165-s002
      start: 173
      end: 260
  - type: paragraph
    id: hb-c04-u0166
    text: Ett annat sätt att påverka är att kontakta politiker direkt, till exempel ledamöter i kommunfullmäktige
      eller välfärdsområdesfullmäktige, riksdagsledamöter eller ministrar. För dem kan man berätta vilka
      politiska frågor som borde ägnas särskild uppmärksamhet eller hurdana förändringar som skulle behövas
      i samhället. Till politiker kan man till exempel skicka e-post. Politikernas e-postadresser finns
      på internet. Man kan också träffa dem på olika evenemang, i synnerhet före val.
    sentences:
    - id: hb-c04-u0166-s001
      start: 0
      end: 172
    - id: hb-c04-u0166-s002
      start: 173
      end: 317
    - id: hb-c04-u0166-s003
      start: 318
      end: 368
    - id: hb-c04-u0166-s004
      start: 369
      end: 415
    - id: hb-c04-u0166-s005
      start: 416
      end: 482
  - type: paragraph
    id: hb-c04-u0167
    text: Man kan själv kandidera i val. I riksdags-, välfärdsområdes- och kommunalval kan alla valbara
      ställa upp som kandidater. Valbara är med vissa undantag alla som har rösträtt i valet i fråga.
      Man ställer i allmänhet upp som kandidat för ett parti. Att vara kandidat i ett val är ett sätt
      att lyfta upp frågor som är viktiga för en själv till allmän diskussion, även om man inte skulle
      bli vald just den gången.
    sentences:
    - id: hb-c04-u0167-s001
      start: 0
      end: 30
    - id: hb-c04-u0167-s002
      start: 31
      end: 120
    - id: hb-c04-u0167-s003
      start: 121
      end: 189
    - id: hb-c04-u0167-s004
      start: 190
      end: 245
    - id: hb-c04-u0167-s005
      start: 246
      end: 408
  - type: paragraph
    id: hb-c04-u0168
    text: Man kan delta i medborgardebatten också utanför politiken. Man kan publicera insändare i tidningar
      eller sociala medier om man vill väcka debatt kring missförhållanden i samhället, det vill säga
      sådant som kunde förbättras. För att hålla en fråga aktuell kan man starta till exempel en grupp
      på sociala medier för att diskutera och ordna evenemang för allmänheten kring temat, till exempel
      demonstrationer eller diskussionstillfällen. Dessa är exempel på samhällelig medborgarverksamhet.
    sentences:
    - id: hb-c04-u0168-s001
      start: 0
      end: 58
    - id: hb-c04-u0168-s002
      start: 59
      end: 223
    - id: hb-c04-u0168-s003
      start: 224
      end: 434
    - id: hb-c04-u0168-s004
      start: 435
      end: 487
  - type: paragraph
    id: hb-c04-u0169
    text: En demonstration är när en skara människor samlas för att offentligt uttrycka sin åsikt i en
      fråga. En demonstration kan till exempel understödja eller motsätta sig ett nytt lagförslag. I en
      demonstration kan endast några människor delta eller så kan det vara en massdemonstration med tusentals
      deltagare. En demonstration kan vara ett tåg eller så kan demonstranterna till exempel samlas framför
      riksdagshuset, om de vill säkerställa att riksdagsledamöterna hör deras budskap. Det behövs inget
      tillstånd för en demonstration, men polisen ska informeras om den senast 24 timmar i förväg.
    sentences:
    - id: hb-c04-u0169-s001
      start: 0
      end: 99
    - id: hb-c04-u0169-s002
      start: 100
      end: 185
    - id: hb-c04-u0169-s003
      start: 186
      end: 305
    - id: hb-c04-u0169-s004
      start: 306
      end: 477
    - id: hb-c04-u0169-s005
      start: 478
      end: 587
  - type: paragraph
    id: hb-c04-u0170
    text: Medborgare kan också göra en namninsamling där de till exempel motsätter sig en lag. Man försöker
      få så många medborgare som möjligt som är av samma åsikt att skriva under namninsamlingen, som sedan
      överlämnas till den minister som ansvarar för frågan. På så vis får ministern veta att man vill
      ändra lagen och att ändringen har ett starkt understöd. Namninsamlingar kan innehålla från några
      tusen till över hundratusen namn.
    sentences:
    - id: hb-c04-u0170-s001
      start: 0
      end: 84
    - id: hb-c04-u0170-s002
      start: 85
      end: 252
    - id: hb-c04-u0170-s003
      start: 253
      end: 350
    - id: hb-c04-u0170-s004
      start: 351
      end: 425
  - type: paragraph
    id: hb-c04-u0171
    text: I Finland finns en lag som heter lagen om medborgarinitiativ. Enligt lagen kan vilken finsk
      medborgare som helst väcka ett medborgarinitiativ. Ett medborgarinitiativ kan innehålla ett lagförslag
      eller ett förslag till lagberedning. Ett initiativ kan gälla också ändring eller upphävande av en
      gällande lag. För förslaget samlar man in namn från röstberättigade finska medborgare som understöder
      initiativet.
    sentences:
    - id: hb-c04-u0171-s001
      start: 0
      end: 61
    - id: hb-c04-u0171-s002
      start: 62
      end: 142
    - id: hb-c04-u0171-s003
      start: 143
      end: 231
    - id: hb-c04-u0171-s004
      start: 232
      end: 306
    - id: hb-c04-u0171-s005
      start: 307
      end: 407
  - type: paragraph
    id: hb-c04-u0172
    text: En motsvarande direkt påverkansmetod inom kommunalpolitiken är invånarinitiativ. Enligt lagen
      kan varje kommuninvånare väcka ett initiativ om en aktuell fråga eller ett aktuellt problem som
      gäller kommunens verksamhet. Vanligtvis försöker man med ett invånarinitiativ främja en större grupps
      intressen. Kommunens beslutsfattare behandlar alla initiativ vid sina sammanträden.
    sentences:
    - id: hb-c04-u0172-s001
      start: 0
      end: 80
    - id: hb-c04-u0172-s002
      start: 81
      end: 218
    - id: hb-c04-u0172-s003
      start: 219
      end: 302
    - id: hb-c04-u0172-s004
      start: 303
      end: 375
  - type: paragraph
    id: hb-c04-u0173
    text: Varje invånare i ett välfärdsområde kan väcka ett initiativ till välfärdsområdet i frågor som
      gäller områdets verksamhet. Initiativ kan väckas också av till exempel en kommun i välfärdsområdet.
    sentences:
    - id: hb-c04-u0173-s001
      start: 0
      end: 121
    - id: hb-c04-u0173-s002
      start: 122
      end: 193
  - type: paragraph
    id: hb-c04-u0174
    text: Det är möjligt att väcka medborgarinitiativ också på EU-nivå. Genom ett europeiskt medborgarinitiativ
      ber man Europeiska kommissionen att göra ett förslag till rättsakt i en fråga som hör till EU:s
      befogenheter. Ett initiativ ska ha minst en miljon undertecknare från minst sju EU-länder. Genom
      att väcka ett initiativ kan medborgarna direkt delta i utvecklingen av Europeiska unionens lagstiftning.
    sentences:
    - id: hb-c04-u0174-s001
      start: 0
      end: 61
    - id: hb-c04-u0174-s002
      start: 62
      end: 211
    - id: hb-c04-u0174-s003
      start: 212
      end: 288
    - id: hb-c04-u0174-s004
      start: 289
      end: 399
  - type: paragraph
    id: hb-c04-u0175
    text: Påverkan är mest effektiv när en individ eller en grupp har en klar uppfattning om vad de vill
      åstadkomma med sin verksamhet. En viktig del av att påverka är att man får andra människor övertygade
      om ens mål. Det är lättare om man tydligt kan förklara vilken fråga man vill ha förändring i.
    sentences:
    - id: hb-c04-u0175-s001
      start: 0
      end: 125
    - id: hb-c04-u0175-s002
      start: 126
      end: 208
    - id: hb-c04-u0175-s003
      start: 209
      end: 290
  - type: paragraph
    id: hb-c04-u0176
    text: Viljan att påverka kan uppkomma när man upptäcker ett missförhållande i sin omgivning eller
      i samhället som man vill åtgärda. Påverkan kan starta också med en ny idé som man vill lyfta upp
      till allmän diskussion. Målet för påverkan kan vara litet, till exempel en ny klätterställning i
      en närliggande lekpark.
    sentences:
    - id: hb-c04-u0176-s001
      start: 0
      end: 125
    - id: hb-c04-u0176-s002
      start: 126
      end: 212
    - id: hb-c04-u0176-s003
      start: 213
      end: 309
  - type: paragraph
    id: hb-c04-u0177
    text: Målet för påverkan kan också vara stort. Till exempel ändringen av äktenskapslagen i Finland
      för att den skulle bli mer jämställd startade med ett medborgarinitiativ. Initiativet samlade det
      nödvändiga antalet namn och lades fram för riksdagen. Riksdagen godkände den nya lagen och den trädde
      i kraft. I och med den nya äktenskapslagen kan också par av samma kön gifta sig.
    sentences:
    - id: hb-c04-u0177-s001
      start: 0
      end: 40
    - id: hb-c04-u0177-s002
      start: 41
      end: 166
    - id: hb-c04-u0177-s003
      start: 167
      end: 244
    - id: hb-c04-u0177-s004
      start: 245
      end: 301
    - id: hb-c04-u0177-s005
      start: 302
      end: 373
  - type: paragraph
    id: hb-c04-u0178
    text: De unga har många möjligheter att påverka. Att till exempel delta i skolans eller läroanstaltens
      elevverksamhet är ett lätt sätt att börja. I alla kommuner finns ett ungdomsråd som representerar
      ungdomarna i det kommunala beslutsfattandet.
    sentences:
    - id: hb-c04-u0178-s001
      start: 0
      end: 42
    - id: hb-c04-u0178-s002
      start: 43
      end: 139
    - id: hb-c04-u0178-s003
      start: 140
      end: 239
  - type: paragraph
    id: hb-c04-u0179
    text: Många medborgarorganisationer och föreningar ordnar verksamhet för ungdomar. Via medborgarorganisationer
      kan den unga lyfta fram frågor som är viktiga för hen och främja många samhällsfrågor.
    sentences:
    - id: hb-c04-u0179-s001
      start: 0
      end: 76
    - id: hb-c04-u0179-s002
      start: 77
      end: 191
- id: hb-c04-foreningar
  title: Föreningar och frivilligverksamhet
  blocks:
  - type: paragraph
    id: hb-c04-u0180
    text: Föreningsverksamhet är medborgarverksamhet där människor organiserar sig för en gemensam sak.
      Föreningsverksamhet är mycket populär i Finland. Det finns många olika slags föreningar, det vill
      säga organisationer och stiftelser, i landet. Organisationer kan bedriva påverkansarbete för att
      främja en idé eller förbättra situationen för en grupp människor. De kan också till exempel erbjuda
      människor motions-, idrotts-, kultur- eller socialtjänster.
    sentences:
    - id: hb-c04-u0180-s001
      start: 0
      end: 93
    - id: hb-c04-u0180-s002
      start: 94
      end: 142
    - id: hb-c04-u0180-s003
      start: 143
      end: 237
    - id: hb-c04-u0180-s004
      start: 238
      end: 354
    - id: hb-c04-u0180-s005
      start: 355
      end: 448
  - type: paragraph
    id: hb-c04-u0181
    text: Inom medborgarverksamheten deltar människor aktivt i utvecklingen av sitt samhälle, lär sig
      nya saker och arbetar tillsammans. Medborgarverksamhet bedrivs ofta i föreningar, det vill säga
      organisationer. År 2024 fanns det omkring 108 000 registrerade föreningar och omkring 2 700 stiftelser
      i Finland. Utöver dessa finns det också mängder av olika oregistrerade grupper, klubbar och andra
      sammanslutningar i landet.
    sentences:
    - id: hb-c04-u0181-s001
      start: 0
      end: 126
    - id: hb-c04-u0181-s002
      start: 127
      end: 203
    - id: hb-c04-u0181-s003
      start: 204
      end: 301
    - id: hb-c04-u0181-s004
      start: 302
      end: 415
  - type: paragraph
    id: hb-c04-u0182
    text: Syftet med föreningarnas verksamhet är inte att eftersträva vinst, utan den ger många fördelar
      för de människor som är verksamma i organisationerna och för hela samhället. Många organisationer
      försöker främja en idé, en fråga eller en viss grupps intressen i samhället. Idén kan vara politisk,
      religiös eller basera sig mer allmänt på värderingar. Organisationer kan till exempel bedriva kommunikations-
      och påverkansarbete för att försöka främja frågor som de anser vara viktiga i samhället.
    sentences:
    - id: hb-c04-u0182-s001
      start: 0
      end: 171
    - id: hb-c04-u0182-s002
      start: 172
      end: 269
    - id: hb-c04-u0182-s003
      start: 270
      end: 347
    - id: hb-c04-u0182-s004
      start: 348
      end: 492
  - type: paragraph
    id: hb-c04-u0183
    text: En del föreningar och stiftelser producerar också tjänster. En del av tjänsterna produceras
      i samarbete med en kommun, ett välfärdsområde eller staten. Organisationerna erbjuder tjänster inom
      i synnerhet motion och idrott, kultur och hobbyverksamhet, men också utbildning och social- och
      hälsovårdstjänster.
    sentences:
    - id: hb-c04-u0183-s001
      start: 0
      end: 59
    - id: hb-c04-u0183-s002
      start: 60
      end: 151
    - id: hb-c04-u0183-s003
      start: 152
      end: 307
  - type: paragraph
    id: hb-c04-u0184
    text: I Finland har alla människor mötes- och föreningsfrihet. Det betyder att alla har rätt att höra
      till föreningar, delta i föreningars verksamhet och bilda föreningar. I Finland är det vanligt att
      människor är medlemmar i många olika organisationer samtidigt och deltar i deras verksamhet på olika
      sätt.
    sentences:
    - id: hb-c04-u0184-s001
      start: 0
      end: 56
    - id: hb-c04-u0184-s002
      start: 57
      end: 165
    - id: hb-c04-u0184-s003
      start: 166
      end: 301
  - type: paragraph
    id: hb-c04-u0185
    text: I Finland styrs organisationernas verksamhet av till exempel föreningslagen. Den säger hur beslut
      fattas i organisationer och hur ansvaret för en förenings verksamhet och ekonomi är fördelat. I
      övrigt försöker den offentliga förvaltningen undvika att styra organisationernas verksamhet, utan
      respekterar deras makt att själva bestämma över sin verksamhet.
    sentences:
    - id: hb-c04-u0185-s001
      start: 0
      end: 76
    - id: hb-c04-u0185-s002
      start: 77
      end: 191
    - id: hb-c04-u0185-s003
      start: 192
      end: 355
  - type: paragraph
    id: hb-c04-u0186
    text: I en organisation kan man vara med som vanlig medlem eller delta i verksamheten i organisationens
      styrelse. Genom att vara aktiv i en organisation lär man sig samtidigt spelreglerna i det finländska
      samhället. Att vara aktiv i en organisation innebär också att man har något meningsfullt att göra.
      Samtidigt lär man känna andra människor som är intresserade av samma saker.
    sentences:
    - id: hb-c04-u0186-s001
      start: 0
      end: 107
    - id: hb-c04-u0186-s002
      start: 108
      end: 209
    - id: hb-c04-u0186-s003
      start: 210
      end: 297
    - id: hb-c04-u0186-s004
      start: 298
      end: 373
  - type: paragraph
    id: hb-c04-u0187
    text: Många organisationer erbjuder möjligheter att delta i frivilligverksamhet. Frivilligarbete utförs
      utan lön. Arbetet utförs ofta till exempel ett par gånger i veckan eller då och då. Människor deltar
      i frivilligverksamhet för sitt eget nöjes skull och för att de vill arbeta för en fråga som är viktig
      för dem. Organisations- och frivilligverksamhet är en populär hobby i Finland.
    sentences:
    - id: hb-c04-u0187-s001
      start: 0
      end: 74
    - id: hb-c04-u0187-s002
      start: 75
      end: 107
    - id: hb-c04-u0187-s003
      start: 108
      end: 181
    - id: hb-c04-u0187-s004
      start: 182
      end: 309
    - id: hb-c04-u0187-s005
      start: 310
      end: 379
  - type: paragraph
    id: hb-c04-u0188
    text: Organisationer kan se olika ut när det kommer till mål, verksamhet och ekonomi. En organisations
      anställda kan ha mycket krävande yrkesuppgifter, och dess finansiering kan vara flera miljoner euro
      per år. Många organisationer är ändå små och drivs i huvudsak med frivilliga krafter, ofta lokalt.
    sentences:
    - id: hb-c04-u0188-s001
      start: 0
      end: 79
    - id: hb-c04-u0188-s002
      start: 80
      end: 204
    - id: hb-c04-u0188-s003
      start: 205
      end: 295
  - type: paragraph
    id: hb-c04-u0189
    text: 'I Finland finns det till exempel:'
    sentences:
    - id: hb-c04-u0189-s001
      start: 0
      end: 33
  - id: hb-c04-u0191
    type: list
    ordered: false
    items:
    - id: hb-c04-u0190
      text: idrotts- och motionsorganisationer
      sentences:
      - id: hb-c04-u0190-s001
        start: 0
        end: 34
    - id: hb-c04-u0192
      text: konst-, bildnings- och kulturföreningar
      sentences:
      - id: hb-c04-u0192-s001
        start: 0
        end: 39
    - id: hb-c04-u0193
      text: miljöorganisationer
      sentences:
      - id: hb-c04-u0193-s001
        start: 0
        end: 19
    - id: hb-c04-u0194
      text: social- och hälsovårdsorganisationer
      sentences:
      - id: hb-c04-u0194-s001
        start: 0
        end: 36
    - id: hb-c04-u0195
      text: fackföreningar och företagarorganisationer
      sentences:
      - id: hb-c04-u0195-s001
        start: 0
        end: 42
    - id: hb-c04-u0196
      text: politiska föreningar
      sentences:
      - id: hb-c04-u0196-s001
        start: 0
        end: 20
    - id: hb-c04-u0197
      text: människorätts- och jämställdhetsorganisationer
      sentences:
      - id: hb-c04-u0197-s001
        start: 0
        end: 46
    - id: hb-c04-u0198
      text: föreningar för kulturell mångfald
      sentences:
      - id: hb-c04-u0198-s001
        start: 0
        end: 33
    - id: hb-c04-u0199
      text: stadsdels- och byföreningar.
      sentences:
      - id: hb-c04-u0199-s001
        start: 0
        end: 28
  - type: paragraph
    id: hb-c04-u0200
    text: På många orter finns det också föreningar som bildats av nyanlända och som erbjuder samvaro,
      stöd och verksamhet för till exempel människor som flyttat till Finland från ett visst land eller
      ett visst område. Dessa föreningar kan vara bra ställen för kamratstöd från andra människor som
      flyttat till landet. I dem kan man till exempel fira högtider som hör till den egna kulturen tillsammans
      med andra.
    sentences:
    - id: hb-c04-u0200-s001
      start: 0
      end: 208
    - id: hb-c04-u0200-s002
      start: 209
      end: 307
    - id: hb-c04-u0200-s003
      start: 308
      end: 402
  - type: paragraph
    id: hb-c04-u0201
    text: Det lönar sig att registrera sin förening. Då är föreningen en juridisk person vars medlemmar
      inte personligen bär ansvar för föreningens verksamhet. En registrerad förening kan ansöka om finansiering
      och bidrag samt samarbeta med andra föreningar och myndigheter. Föreningen registreras med anmälan
      till Patent- och registerstyrelsen.
    sentences:
    - id: hb-c04-u0201-s001
      start: 0
      end: 42
    - id: hb-c04-u0201-s002
      start: 43
      end: 149
    - id: hb-c04-u0201-s003
      start: 150
      end: 264
    - id: hb-c04-u0201-s004
      start: 265
      end: 335
  - type: paragraph
    id: hb-c04-u0202
    text: Också utlänningar, d.v.s. personer som inte har finskt medborgarskap, kan grunda en registrerad
      förening. I detta fall ska både ordföranden och vice ordföranden ha sin hemort i Finland.
    sentences:
    - id: hb-c04-u0202-s001
      start: 0
      end: 105
    - id: hb-c04-u0202-s002
      start: 106
      end: 185
  - type: paragraph
    id: hb-c04-u0203
    text: Om ordföranden eller vice ordföranden har sin hemort utomlands kan föreningen ansöka om dispens
      hos patent- och registerstyrelsen.
    sentences:
    - id: hb-c04-u0203-s001
      start: 0
      end: 130
  - type: paragraph
    id: hb-c04-u0204
    text: Föreningar bedriver sin verksamhet vanligen ett år i taget. De planerar sin verksamhet och sin
      ekonomi ett år fram i tiden. Ekonomin och bokföringen ska granskas i slutet av perioden.
    sentences:
    - id: hb-c04-u0204-s001
      start: 0
      end: 59
    - id: hb-c04-u0204-s002
      start: 60
      end: 123
    - id: hb-c04-u0204-s003
      start: 124
      end: 183
  - type: paragraph
    id: hb-c04-u0205
    text: I en förening är det medlemmarna som har makten. De viktigaste besluten fattas på föreningsmöten
      som är öppna för alla medlemmar.
    sentences:
    - id: hb-c04-u0205-s001
      start: 0
      end: 48
    - id: hb-c04-u0205-s002
      start: 49
      end: 129
  - type: paragraph
    id: hb-c04-u0206
    text: För föreningen väljs en styrelse på föreningsmötet dit alla föreningsmedlemmar sammankallas.
      Styrelsen ska bestå av minst ordföranden och två medlemmar. Styrelsens storlek kan föreskrivas i
      stadgarna. Styrelsen har som uppgift att sköta ärenden enligt lagar, föreningens stadgar och föreningens
      beslut.
    sentences:
    - id: hb-c04-u0206-s001
      start: 0
      end: 92
    - id: hb-c04-u0206-s002
      start: 93
      end: 152
    - id: hb-c04-u0206-s003
      start: 153
      end: 200
    - id: hb-c04-u0206-s004
      start: 201
      end: 302
  - type: paragraph
    id: hb-c04-u0207
    text: Föreningen upplöses när merparten av medlemmarna fattar beslut om detta på föreningens möte.
    sentences:
    - id: hb-c04-u0207-s001
      start: 0
      end: 92
  - type: paragraph
    id: hb-c04-u0208
    text: Om du får utkomstskydd för arbetslösa ska du på förhand fråga sysselsättningstjänsterna i din
      kommun huruvida frivilligarbetet påverkar utbetalningen av utkomstskyddet för arbetslösa. I vissa
      fall kan frivilligarbetet inkluderas i din integrationsplan.
    sentences:
    - id: hb-c04-u0208-s001
      start: 0
      end: 183
    - id: hb-c04-u0208-s002
      start: 184
      end: 252
- id: hb-c04-medier
  title: Medier, pressfrihet och publicistiskt ansvar
  blocks:
  - type: paragraph
    id: hb-c04-u0209
    text: I Finland ger grundlagen människor yttrandefrihet. Dessutom har människorna rätt att själva
      bestämma vad de tycker i olika frågor, det vill säga de har åsiktsfrihet. Alla människor har denna
      frihet och också medierna, det vill säga tv, radio, tidningar, internettjänster och andra massmedier.
    sentences:
    - id: hb-c04-u0209-s001
      start: 0
      end: 50
    - id: hb-c04-u0209-s002
      start: 51
      end: 165
    - id: hb-c04-u0209-s003
      start: 166
      end: 292
  - type: paragraph
    id: hb-c04-u0210
    text: Medierna är en viktig del av demokratin. De förväntas ge människor tillförlitlig information
      om samhället. Med hjälp av medierna får människor information om samhälleliga beslut och diskussioner.
      De lyfter fram problem och missbruk i beslutsfattandet och förvaltningen. Dessutom följer och kritiserar
      medierna vad politikerna och andra makthavare gör och säger. I Finland får journalister fritt kritisera
      politikernas beslut och uttalanden.
    sentences:
    - id: hb-c04-u0210-s001
      start: 0
      end: 40
    - id: hb-c04-u0210-s002
      start: 41
      end: 106
    - id: hb-c04-u0210-s003
      start: 107
      end: 195
    - id: hb-c04-u0210-s004
      start: 196
      end: 269
    - id: hb-c04-u0210-s005
      start: 270
      end: 361
    - id: hb-c04-u0210-s006
      start: 362
      end: 440
  - type: paragraph
    id: hb-c04-u0211
    text: Medierna har mycket makt när de väljer vilka frågor de ger publicitet och på vilket sätt de
      behandlar dem. På det sättet påverkar de människors åsikter och uppfattningen om hurdana frågor
      som är värda att ta upp i samhällsdebatten.
    sentences:
    - id: hb-c04-u0211-s001
      start: 0
      end: 106
    - id: hb-c04-u0211-s002
      start: 107
      end: 231
  - type: paragraph
    id: hb-c04-u0212
    text: I dag har de traditionella mediernas makt att välja vilka frågor som tas upp till offentlig
      debatt ändå minskat. Med traditionella medier avses till exempel tidningar och tv-kanaler. I dessa
      väljer redaktionen och huvudredaktören vad de rapporterar om och på vilket sätt. Vid sidan av traditionella
      medier har de sociala medierna seglat upp.
    sentences:
    - id: hb-c04-u0212-s001
      start: 0
      end: 112
    - id: hb-c04-u0212-s002
      start: 113
      end: 182
    - id: hb-c04-u0212-s003
      start: 183
      end: 271
    - id: hb-c04-u0212-s004
      start: 272
      end: 341
  - type: paragraph
    id: hb-c04-u0213
    text: I sociala medier kan vem som helst publicera sina åsikter om vilket ämne som helst. Inlägg från
      vanliga människor kan snabbt sprida sig till tusentals eller till och med miljontals människor runt
      om i världen. Detta är på många sätt en bra sak för demokratin, eftersom det ger alla möjlighet
      att delta i samhällsdebatten. Risken är ändå att det är svårt att veta vad som är sant och inte
      när vem som helst kan skriva vad som helst.
    sentences:
    - id: hb-c04-u0213-s001
      start: 0
      end: 83
    - id: hb-c04-u0213-s002
      start: 84
      end: 209
    - id: hb-c04-u0213-s003
      start: 210
      end: 321
    - id: hb-c04-u0213-s004
      start: 322
      end: 431
  - type: paragraph
    id: hb-c04-u0214
    text: Pressfrihet betyder att medier och journalister har frihet att utföra sitt arbete och rapportera
      om allt som händer i samhället. Pressfriheten är på olika sätt begränsad eller hotad i stora delar
      av världen. Staten kan begränsa pressfriheten genom att till exempel utöva påtryckningar mot medierna
      för att de inte ska publicera material som kritiserar beslutsfattarnas handlingar. I en del länder
      kan journalister bli fängslade eller till och med dödade om de enligt beslutsfattarna skriver om
      fel saker.
    sentences:
    - id: hb-c04-u0214-s001
      start: 0
      end: 128
    - id: hb-c04-u0214-s002
      start: 129
      end: 207
    - id: hb-c04-u0214-s003
      start: 208
      end: 380
    - id: hb-c04-u0214-s004
      start: 381
      end: 504
  - type: paragraph
    id: hb-c04-u0215
    text: Också hot och trakasserier mot journalister från vanliga människor kan äventyra pressfriheten.
      Till exempel hot mot journalister i diskussionsforum på internet kan påverka vilka ämnen journalisterna
      vågar skriva om och på vilket sätt. Då pratar man om självcensur.
    sentences:
    - id: hb-c04-u0215-s001
      start: 0
      end: 94
    - id: hb-c04-u0215-s002
      start: 95
      end: 234
    - id: hb-c04-u0215-s003
      start: 235
      end: 264
  - type: paragraph
    id: hb-c04-u0216
    text: Internationella jämförelser visar att pressfriheten i Finland är bland de bästa i världen. Jämfört
      med de flesta andra länder kan finländska journalister skriva mycket fritt om vilka ämnen som helst.
      De behöver i allmänhet inte heller vara rädda för sin säkerhet. Det är ändå viktigt att man också
      i Finland ägnar uppmärksamhet åt till exempel trakasserier mot journalister i sociala medier. Det
      är viktigt att värna om pressfriheten för att skydda demokratin och ett öppet samhälle.
    sentences:
    - id: hb-c04-u0216-s001
      start: 0
      end: 90
    - id: hb-c04-u0216-s002
      start: 91
      end: 199
    - id: hb-c04-u0216-s003
      start: 200
      end: 263
    - id: hb-c04-u0216-s004
      start: 264
      end: 391
    - id: hb-c04-u0216-s005
      start: 392
      end: 483
  - type: paragraph
    id: hb-c04-u0217
    text: I Finland har enskilda individer och medierna yttrandefrihet. Yttrandefrihet betyder ändå inte
      att journalister eller enskilda individer kan publicera precis vad som helst.
    sentences:
    - id: hb-c04-u0217-s001
      start: 0
      end: 61
    - id: hb-c04-u0217-s002
      start: 62
      end: 172
  - type: paragraph
    id: hb-c04-u0218
    text: Grundlagen tryggar varje individs ära och privatliv. Också medierna måste respektera dessa.
      Ärekränkning eller ogrundad publicering av information om människors privatliv är inte tillåten.
      Ibland är det svårt att avgöra om det är motiverat att skriva om till exempel en politikers eller
      någon annan offentlig persons privatliv eller om det kränker personens integritet. Om informationen
      kan vara av samhällelig betydelse är yttrandefriheten i allmänhet en starkare princip.
    sentences:
    - id: hb-c04-u0218-s001
      start: 0
      end: 52
    - id: hb-c04-u0218-s002
      start: 53
      end: 91
    - id: hb-c04-u0218-s003
      start: 92
      end: 188
    - id: hb-c04-u0218-s004
      start: 189
      end: 369
    - id: hb-c04-u0218-s005
      start: 370
      end: 473
  - type: paragraph
    id: hb-c04-u0219
    text: Det är viktigt att komma ihåg att lagar också gäller i sociala medier. Man kan hamna att stå
      till svars för sina texter om de bryter mot lagen. Till exempel rasistisk text kan leda till åtal
      för hets mot folkgrupp.
    sentences:
    - id: hb-c04-u0219-s001
      start: 0
      end: 70
    - id: hb-c04-u0219-s002
      start: 71
      end: 143
    - id: hb-c04-u0219-s003
      start: 144
      end: 214
  - type: paragraph
    id: hb-c04-u0220
    text: I Finland regleras mediernas verksamhet av lagen och dessutom av Journalistreglerna. Journalistreglerna
      är ett gemensamt avtal för mediebranschen om att alla medier som förbundit sig till reglerna ska
      utföra sitt arbete på ett etiskt sätt. Syftet med reglerna är att styra mediernas arbete och försvara
      publiceringsfriheten. En stor del av de journalistiska medierna i Finland har förbundit sig till
      dessa regler.
    sentences:
    - id: hb-c04-u0220-s001
      start: 0
      end: 84
    - id: hb-c04-u0220-s002
      start: 85
      end: 239
    - id: hb-c04-u0220-s003
      start: 240
      end: 324
    - id: hb-c04-u0220-s004
      start: 325
      end: 413
  - type: paragraph
    id: hb-c04-u0221
    text: Opinionsnämnden för massmedier, ONM, utvärderar god journalistisk sed genom att tolka Journalistreglerna.
      ONM är ett samarbetsorgan som grundats av medieutgivare och journalister. Om man misstänker att
      ett medium har agerat i strid med Journalistreglerna, kan man klaga hos ONM. Om organet tar upp
      ärendet till behandling, ger det antingen ett friande eller ett fällande beslut. ONM är ingen domstol
      och utdömer inga straff, men medierna tar dess beslut på allvar.
    sentences:
    - id: hb-c04-u0221-s001
      start: 0
      end: 105
    - id: hb-c04-u0221-s002
      start: 106
      end: 179
    - id: hb-c04-u0221-s003
      start: 180
      end: 278
    - id: hb-c04-u0221-s004
      start: 279
      end: 378
    - id: hb-c04-u0221-s005
      start: 379
      end: 464
  - type: paragraph
    id: hb-c04-u0222
    text: Rundradion, eller Yle, är ett mediebolag som bedriver allmännyttig verksamhet i Finland och
      vars verksamhet regleras av lagen om Rundradion Ab. Yles verksamhet finansieras med offentliga medel.
      Alla vars inkomster överskrider en viss gräns betalar Yle-skatt. Yles tjänster är avgiftsfria för
      användarna.
    sentences:
    - id: hb-c04-u0222-s001
      start: 0
      end: 143
    - id: hb-c04-u0222-s002
      start: 144
      end: 193
    - id: hb-c04-u0222-s003
      start: 194
      end: 258
    - id: hb-c04-u0222-s004
      start: 259
      end: 303
  - type: paragraph
    id: hb-c04-u0223
    text: Yles utbud omfattar nyheter, aktualitetsprogram, kultur, konst, idrottsprogram och underhållning.
      Yle har tv- och radiokanaler, streamingtjänsten Arenan på internet och en nyhetssajt, flera sociala
      mediekanaler och annat webbinnehåll.
    sentences:
    - id: hb-c04-u0223-s001
      start: 0
      end: 97
    - id: hb-c04-u0223-s002
      start: 98
      end: 234
  - type: paragraph
    id: hb-c04-u0224
    text: Yle har en särskild uppgift i att stödja demokratin och allas möjligheter att påverka. Yle erbjuder
      innehåll på finska och svenska, men också på till exempel teckenspråk, samiska, engelska och ryska.
      Dessutom sänder Yle nyheter på lätt språk på både finska och svenska. Enligt lagen är bolaget skyldigt
      att stödja bevarandet av det finländska kulturarvet, tolerans, jämlikhet, jämställdhet och kulturell
      mångfald.
    sentences:
    - id: hb-c04-u0224-s001
      start: 0
      end: 86
    - id: hb-c04-u0224-s002
      start: 87
      end: 199
    - id: hb-c04-u0224-s003
      start: 200
      end: 269
    - id: hb-c04-u0224-s004
      start: 270
      end: 413
  - type: paragraph
    id: hb-c04-u0225
    text: Även om riksdagen beslutar om Yles finansiering och uppdrag, bestämmer politikerna inte direkt
      om Yles verksamhet. Yle har samma journalistiska frihet som vilket medium som helst. Till exempel
      Yles nyhetsredaktion bestämmer själv vilka ämnen den ska rapportera om och på vilket sätt. I sin
      nyhetsrapportering strävar bolaget efter att vara jämlikt och opartiskt, och rapporteringen representerar
      inte något visst partis åsikter.
    sentences:
    - id: hb-c04-u0225-s001
      start: 0
      end: 114
    - id: hb-c04-u0225-s002
      start: 115
      end: 179
    - id: hb-c04-u0225-s003
      start: 180
      end: 283
    - id: hb-c04-u0225-s004
      start: 284
      end: 428
  - type: paragraph
    id: hb-c04-u0226
    text: Tidningar är mycket populära i Finland. År 2023 läste 96 procent av finländarna över 15 år tidningar
      antingen i pappersform eller på nätet. I Finland finns det ett tjugotal tidningar som utkommer varje
      dag eller nästan varje dag och dessutom omkring hundra tidningar som utkommer en eller ett par gånger
      i veckan. Några tidningar läses i hela Finland, och därtill finns det ett antal tidningar som läses
      i ett eller några landskap. Många av tidningarna är små lokaltidningar.
    sentences:
    - id: hb-c04-u0226-s001
      start: 0
      end: 39
    - id: hb-c04-u0226-s002
      start: 40
      end: 139
    - id: hb-c04-u0226-s003
      start: 140
      end: 313
    - id: hb-c04-u0226-s004
      start: 314
      end: 431
    - id: hb-c04-u0226-s005
      start: 432
      end: 475
  - type: paragraph
    id: hb-c04-u0227
    text: Tidningsläsningen har flyttat till nätet överallt i världen, också i Finland. I landet i dag
      läses tidningarnas nyheter på nätet i klart större utsträckning än tryckta tidningar. Många tidningar
      publicerar nyhetsinnehåll också i sociala medier. Många i Finland tycker ändå fortfarande om att
      få en papperstidning hem på morgonen.
    sentences:
    - id: hb-c04-u0227-s001
      start: 0
      end: 77
    - id: hb-c04-u0227-s002
      start: 78
      end: 178
    - id: hb-c04-u0227-s003
      start: 179
      end: 244
    - id: hb-c04-u0227-s004
      start: 245
      end: 329
  - type: paragraph
    id: hb-c04-u0228
    text: Tidningarna ägs i allmänhet av privata mediebolag. I Finland är de flesta tidningar inte politiskt
      bundna, utan bestämmer själva sin linje i olika samhällsfrågor. Det finns också politiska tidningar,
      men deras antal har minskat under de senaste årtiondena. De senaste åren har tidningsägandet koncentrerats
      till stora mediebolag. Denna utveckling kan begränsa vilka frågor medierna rapporterar om.
    sentences:
    - id: hb-c04-u0228-s001
      start: 0
      end: 50
    - id: hb-c04-u0228-s002
      start: 51
      end: 162
    - id: hb-c04-u0228-s003
      start: 163
      end: 256
    - id: hb-c04-u0228-s004
      start: 257
      end: 329
    - id: hb-c04-u0228-s005
      start: 330
      end: 397
  - type: paragraph
    id: hb-c04-u0229
    text: Medierna utövar samtidigt en betydande makt när de väljer vad de lyfter fram i offentligheten
      och hur de behandlar olika frågor. Därför kallas medierna också den fjärde statsmakten. De lyfter
      fram missförhållanden och missbruk och ger dem mycket synlighet om de vill.
    sentences:
    - id: hb-c04-u0229-s001
      start: 0
      end: 128
    - id: hb-c04-u0229-s002
      start: 129
      end: 181
    - id: hb-c04-u0229-s003
      start: 182
      end: 267
- id: hb-c04-kallkritik
  title: Källkritik och mediekunnighet
  blocks:
  - type: paragraph
    id: hb-c04-u0230
    text: Kritisk mediekunnighet betyder att en människa kan granska medieinnehåll kritiskt. Medieinnehåll
      är både innehåll i traditionella medier, såsom tidningsartiklar och tv-nyheter, samt till exempel
      blogginlägg, inlägg på sociala medier och olika videor som sprids på internet. Kritisk betyder i
      fråga om mediekunnighet inte en negativ inställning eller motstånd. Det betyder att man är intresserad
      av att förstå medieinnehåll och varför man berättar om olika saker på ett visst sätt. En mediekunnig
      person kan kritiskt granska också såväl sin egen som andras aktivitet i olika medier.
    sentences:
    - id: hb-c04-u0230-s001
      start: 0
      end: 82
    - id: hb-c04-u0230-s002
      start: 83
      end: 273
    - id: hb-c04-u0230-s003
      start: 274
      end: 359
    - id: hb-c04-u0230-s004
      start: 360
      end: 480
    - id: hb-c04-u0230-s005
      start: 481
      end: 581
  - type: paragraph
    id: hb-c04-u0231
    text: Nuförtiden är i synnerhet internet och sociala medier fulla av olika slags innehåll, inklusive
      nyheter och påståenden som framställs som fakta. Det kan vara svårt att bedöma vilken information
      som är sann och vilka källor som är pålitliga. Många aktörer vill få människor att tro på just deras
      version av olika saker och händelser.
    sentences:
    - id: hb-c04-u0231-s001
      start: 0
      end: 143
    - id: hb-c04-u0231-s002
      start: 144
      end: 239
    - id: hb-c04-u0231-s003
      start: 240
      end: 331
  - type: paragraph
    id: hb-c04-u0232
    text: Med hjälp av nyheter och sociala medieinnehåll försöker man vädja till folks känslor, eftersom
      sådana texter enklast får uppmärksamhet och flest klick. Uppmärksamheten för i sin tur med sig makt
      och pengar via annonsörer. När man följer olika medier är det bra att vara uppmärksam på hur de
      försöker påverka människors tankar genom att vädja till känslorna.
    sentences:
    - id: hb-c04-u0232-s001
      start: 0
      end: 151
    - id: hb-c04-u0232-s002
      start: 152
      end: 221
    - id: hb-c04-u0232-s003
      start: 222
      end: 357
  - type: paragraph
    id: hb-c04-u0233
    text: Det finns inte nödvändigtvis alltid en enda entydig sanning om vissa saker. Olika människors
      upplevelser av samma händelse kan skilja sig mycket från varandra. I sådana fall kan det hända att
      två olika beskrivningar av en händelse till viss del kan vara sanna båda två. Ofta baserar sig ändå
      en del beskrivningar i högre grad på objektiva fakta än andra. Till exempel en bedömning av en expert
      som forskat i ett ämne är en pålitligare informationskälla än en vanlig människas personliga åsikt.
    sentences:
    - id: hb-c04-u0233-s001
      start: 0
      end: 75
    - id: hb-c04-u0233-s002
      start: 76
      end: 159
    - id: hb-c04-u0233-s003
      start: 160
      end: 269
    - id: hb-c04-u0233-s004
      start: 270
      end: 354
    - id: hb-c04-u0233-s005
      start: 355
      end: 493
  - type: paragraph
    id: hb-c04-u0234
    text: I synnerhet i sociala medier sprids också mycket innehåll som är fullständigt falskt. Den som
      sprider innehållet kan avsiktligt lägga fram felaktiga påståenden och försöka få människor att tro
      att de är sanna. Syftet kan vara att till exempel väcka hat eller misstro mot någon person eller
      människogrupp.
    sentences:
    - id: hb-c04-u0234-s001
      start: 0
      end: 85
    - id: hb-c04-u0234-s002
      start: 86
      end: 209
    - id: hb-c04-u0234-s003
      start: 210
      end: 304
  - type: paragraph
    id: hb-c04-u0235
    text: Det har länge varit möjligt att redigera bilder. Äkta bilder används också på ett vilseledande
      sätt så att en bild kan vara tagen i en helt annan situation och på en helt annan plats än vad som
      påstås.
    sentences:
    - id: hb-c04-u0235-s001
      start: 0
      end: 48
    - id: hb-c04-u0235-s002
      start: 49
      end: 201
  - type: paragraph
    id: hb-c04-u0236
    text: Tekniken utvecklas hela tiden och gör det allt lättare att sprida falsk information. I dag är
      det till exempel med hjälp av artificiell intelligens möjligt att producera videor som ser väldigt
      äkta ut och där en person ser ut att göra något som hen aldrig har gjort i verkligheten. Också människors
      röst och sätt att prata kan kopieras så att det är nästan omöjligt att skilja slutresultatet från
      verkligheten. I takt med att falskt innehåll på internet blir allt mer trovärdigt blir det allt
      viktigare att var och en kan granska medieinnehåll kritiskt och agera ansvarsfullt.
    sentences:
    - id: hb-c04-u0236-s001
      start: 0
      end: 84
    - id: hb-c04-u0236-s002
      start: 85
      end: 281
    - id: hb-c04-u0236-s003
      start: 282
      end: 410
    - id: hb-c04-u0236-s004
      start: 411
      end: 576
  - type: paragraph
    id: hb-c04-u0237
    text: Innan sociala medier blev vanliga fick människor information om världshändelser i huvudsak via
      tv, radio och tidningar. Också i dessa traditionella mediekanaler kan det av misstag spridas felaktig
      information, och journalister är inte alltid opartiska. Redaktionerna strävar ändå efter att säkerställa
      att informationen är korrekt innan den publiceras och åtgärdar fel i efterhand när de upptäcks.
    sentences:
    - id: hb-c04-u0237-s001
      start: 0
      end: 119
    - id: hb-c04-u0237-s002
      start: 120
      end: 252
    - id: hb-c04-u0237-s003
      start: 253
      end: 397
  - type: paragraph
    id: hb-c04-u0238
    text: I Finland har människor i allmänhet ett starkt förtroende för traditionella medier, i synnerhet
      Yles och andra stora mediebolags nyheter.
    sentences:
    - id: hb-c04-u0238-s001
      start: 0
      end: 137
  - type: paragraph
    id: hb-c04-u0239
    text: I fråga om andra än traditionella medier krävs det ofta mer arbete av en människa att bedöma
      om information är tillförlitlig. Det är värt att ställa sig skeptisk särskilt till information som
      publicerats av någon som man inte vet så mycket om. Det är också viktigt att försöka ta reda på
      om informationen är korrekt innan man själv delar den vidare i sociala medier.
    sentences:
    - id: hb-c04-u0239-s001
      start: 0
      end: 125
    - id: hb-c04-u0239-s002
      start: 126
      end: 243
    - id: hb-c04-u0239-s003
      start: 244
      end: 366
  - type: paragraph
    id: hb-c04-u0240
    text: 'Alltid när man stöter på en nyhet eller ny information i vilket medium som helst är det bra
      att ställa sig följande frågor:'
    sentences:
    - id: hb-c04-u0240-s001
      start: 0
      end: 123
  - id: hb-c04-u0242
    type: list
    ordered: false
    items:
    - id: hb-c04-u0241
      text: Vem sprider informationen? Representerar informationsspridaren ett företag, ett parti, en
        organisation eller staten?
      sentences:
      - id: hb-c04-u0241-s001
        start: 0
        end: 26
      - id: hb-c04-u0241-s002
        start: 27
        end: 116
    - id: hb-c04-u0243
      text: Vad baserar sig informationen på? Är den som publicerar informationen en expert på ämnet eller
        baserar den sig på vetenskapliga fakta som producerats av en pålitlig källa? Ligger en ögonvittnesskildring
        eller en anonym persons berättelse bakom nyheten? Är det fråga om en åsikt eller ett antagande?
      sentences:
      - id: hb-c04-u0243-s001
        start: 0
        end: 33
      - id: hb-c04-u0243-s002
        start: 34
        end: 171
      - id: hb-c04-u0243-s003
        start: 172
        end: 252
      - id: hb-c04-u0243-s004
        start: 253
        end: 298
    - id: hb-c04-u0244
      text: Vilket syfte och motiv har den som publicerar informationen? Försöker hen få människor att
        tänka eller känna på ett visst sätt om ett ämne? Drar hen nytta av att människor tror på informationen?
      sentences:
      - id: hb-c04-u0244-s001
        start: 0
        end: 60
      - id: hb-c04-u0244-s002
        start: 61
        end: 139
      - id: hb-c04-u0244-s003
        start: 140
        end: 194
  - type: paragraph
    id: hb-c04-u0245
    text: Det är bra att alltid försöka hitta flera källor om ett ämne. Om många olika aktörer berättar
      om samma sak på någotsånär samma sätt, är det mer sannolikt att det är sant. Det är också värt att
      kontrollera när informationen ursprungligen har publicerats och om det redan finns nyare information
      i ämnet.
    sentences:
    - id: hb-c04-u0245-s001
      start: 0
      end: 61
    - id: hb-c04-u0245-s002
      start: 62
      end: 170
    - id: hb-c04-u0245-s003
      start: 171
      end: 302
  - type: paragraph
    id: hb-c04-u0246
    text: Ibland kan det också vara svårt att se om till exempel en rekommendation om en produkt som publicerats
      på sociala medier är en ärlig åsikt eller betald reklam. I Finland kräver lagen att kommersiella
      meddelanden enkelt ska kunna kännas igen som sådana. Kommersiella meddelanden är alla meddelanden
      som syftar till att få människor att köpa någonting. Det gäller ändå endast meddelanden som producerats
      i Finland.
    sentences:
    - id: hb-c04-u0246-s001
      start: 0
      end: 159
    - id: hb-c04-u0246-s002
      start: 160
      end: 252
    - id: hb-c04-u0246-s003
      start: 253
      end: 350
    - id: hb-c04-u0246-s004
      start: 351
      end: 412
