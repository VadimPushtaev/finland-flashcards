03C/a>\u003C/li>\n    \u003Cli class=\"[&amp;_svg]:size-6\">\n     \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n      \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n     \u003C/svg>\n    \u003C/li>\n    \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat\">Valtiopäiväasiat\u003C/a>\u003C/li>\n    \u003Cli class=\"[&amp;_svg]:size-6\">\n     \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n      \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n     \u003C/svg>\n    \u003C/li>\n    \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/HE%2054%2F2026%20vp\">HE 54/2026 vp\u003C/a>\u003C/li>\n    \u003Cli class=\"[&amp;_svg]:size-6\">\n     \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n      \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n     \u003C/svg>\n    \u003C/li>\n    \u003Cli class=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Asiakirjat\u003C/span>\u003C/li>\n   \u003C/ol>\n  \u003C/div>\n \u003C/div>\n \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n  \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">24.4.2026 | 16:18\u003C/span>\n \u003C/div>\n \u003Cdiv class=\"PoytakirjaAsiakohta Eduskunnanpoytakirja2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Pöytäkirjan asiakohta\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;PTK&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">41\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"YhteisoTeksti\">Täysistunto&nbsp;\u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Torstai 23.4.2026 klo 16.00—20.58\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv class=\"Asiakohta 234495\">\n   \u003Ch2>\u003Cspan class=\"KohtaNumeroTeksti\">5.&nbsp; \u003C/span>\u003Cspan class=\"KohtaNimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/span>\u003C/span>\u003C/h2>\n   \u003Cdiv class=\"edk-viite b-margin\">\n    \u003Cdiv class=\"KohtaAsia\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%2054%2F2026%20vp\">HE 54/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Toimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Lähetekeskustelu\u003C/div>\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Lähetekeskustelua varten esitellään päiväjärjestyksen \u003Cspan class=\"HarvaKursiiviTeksti\">5.\u003C/span> asia. Puhemiesneuvosto ehdottaa, että asia lähetetään hallintovaliokuntaan.&nbsp;\u003C/p>\n      \u003Cp class=\"edk-KappaleKooste\">Keskusteluun varataan tässä vaiheessa enintään 45 minuuttia. Jos puhujalistaa ei tässä ajassa ehditä käydä loppuun, asian käsittely keskeytetään ja sitä jatketaan muiden asiakohtien jälkeen. — Tämän esittelee meille ministeri Rantanen. Olkaa hyvä. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"KeskusteluToimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Keskustelu\u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.01\">18.01&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"AsemaTeksti\">Sisäministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Mari&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.01Rantanen\">Rantanen&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(esittelypuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Nyt käsiteltävässä hallituksen esityksessä ehdotetaan muutettavaksi kansalaisuuslakia ja eräitä muita siihen liittyviä lakeja. Ehdotetut lait on tarkoitettu tulemaan voimaan vuoden 2027 alussa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Esityksessä ehdotetaan, että hakemuksen perusteella myönnettävälle kansalaisuudelle lisättäisiin uusi yhteiskuntatietoa koskeva edellytys. Jatkossa hakijalta vaadittaisiin sen osoittamista, että hänellä on riittävät tiedot suomalaisesta yhteiskunnasta. Lähtökohtaisesti yhteiskuntatieto osoitettaisiin suomen- tai ruotsinkielisellä kansalaisuuskokeella. Edellytyksen voisi täyttää myös ylioppilas- tai korkeakoulututkinnolla, joka on suoritettu Suomessa suomeksi tai ruotsiksi. Yhteiskuntataitoedellytys olisi kielitaitoedellytyksestä erillinen. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuskoe otettaisiin ehdotuksen mukaan käyttöön vuoden 27 alkupuolella. Kokeeseen liittyvistä viranomaistehtävistä vastaisi Maahanmuuttovirasto. Virasto tekisi sopimukset kokeen laatimisesta ja järjestämisestä muiden toimijoiden kanssa. Kokeen oppimateriaalin ja kysymysten laatimisesta huolehtisi yliopistollinen toimija. Kansalaisuuskokeessa testattaisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Kokeen kysymykset koskisivat Suomen keskeistä lainsäädäntöä, perus- ja ihmisoikeuksia, yhdenvertaisuutta, sukupuolten tasa-arvoa, Suomen historiaa ja kulttuuria sekä muita oppimateriaalin keskeisiä tietoja. Kansalaisuuskoe olisi sähköisesti suoritettava monivalintakoe. Koe suoritettaisiin koetilaisuuden järjestäjän valvomassa koetilaisuudessa, joita järjestettäisiin useamman kerran vuodessa eri puolilla Suomea. Kokeen hyväksytty suoritus edellyttäisi sitä, että valtaosa kokeen vastauksista olisi valittu oikein. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hallitusohjelmassa on useita kansalaisuuslain muuttamista koskevia kirjauksia, joista yksi koskee kansalaisuuskokeen käyttöönottoa. Uuden yhteiskuntaedellytyksen ja kansalaisuuskokeen taustalla on ajatus siitä, että Suomessa asuvilta voidaan kansalaisuuden saamista varten edellyttää kotoutumista. Uusi edellytys täydentäisi nykyisiä kansalaisuuden saamisen edellytyksiä. Se ilmentäisi ajatusta maan keskeisten olosuhteiden tuntemisesta ennen kansalaisuuden saamista. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Useilla muilla mailla on jo käytössään kansalaisuuskoe. Noin puolet EU-maista edellyttää yhteiskuntatiedon osoittamista kansalaisuuskokeella tai jollakin muulla tavalla. Myös esimerkiksi Yhdysvalloissa ja Kanadassa on käytössä kansalaisuuskoe. Pohjoismaista tämä on käytössä Tanskassa ja Norjassa, ja Ruotsikin on ottamassa kansalaisuuskokeen käyttöön. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuskokeen käyttöönottoa selvitettiin poikkihallinnollisessa työryhmässä. Työryhmän selvityksen mukaan kansalaisuuskokeella voitaisiin vahvistaa kotoutumista mittaamalla kokeeseen osallistuvan tietämystä suomalaisesta yhteiskunnasta. Kansalaisuuskoe toimisi johdonmukaisena jatkumona kaikelle sille yhteiskuntatiedolle, jota maahanmuuttajat saavat erilaisissa koulutuksissa ja muutoinkin omaksuvat maassa oleskelunsa aikana. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tulevan kansalaisuuskokeen kysymykset perustuisivat kansalaisuuskokeen oppimateriaaliin. Oppimateriaali vastaisi sisällöltään ja laajuudeltaan valtakunnallista oppimateriaalia, joka on jo käytössä kuntien järjestämässä yhteiskuntaorientaatiossa. Kansalaisuuskoe olisi siten tietopohjainen koe, johon voisi valmistautua kokeen oppimateriaalia opiskelemalla. Uusi koejärjestelmä toteutettaisiin muutoinkin kokonaisuudessaan luotettavalla, laadukkaalla ja oikeudenmukaisella tavalla. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuden hakemisesta kiinnostuneen henkilön olisi siis jatkossa käytävä suorittamassa kansalaisuuskoe ennen kuin hän tekisi kansalaisuushakemuksen. Siten tarkoituksena on korostaa suomalaisen yhteiskunnan tuntemuksen merkitystä ennen kansalaisuuden myöntämistä. Yhteiskunnan kannalta toivottava vaikutus olisi, että kansalaistetulla henkilöllä olisi entistä paremmat valmiudet suomalaisessa yhteiskunnassa toimimiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaistamisen edellytysten muutokset vaikuttavat laajasti kansalaisuuden hakijoihin ja saamisen mahdollisuuteen. Vuonna 2025 kansalaisuushakemuksen teki yhteensä yli 11&nbsp;000 henkilöä. Lähtökohtana on se, että jatkossa kansalaisuuskokeen suorittamista vaadittaisiin työikäisiltä aikuisilta, jotka haluaisivat myöhemmin hakea kansalaisuutta. Alle 18-vuotiaiden ja yli 65-vuotiaiden ei sen sijaan tarvitsisi koetta tehdä. Eri muutokset voivat yhdessä vaikuttaa siten, että hakemuksia tehdään aiempaa vähemmän, jos mahdolliset hakijat muutosten tultua voimaan arvioivat, että he eivät täytä kansalaistamisen edellytyksiä. Tämä koskee myös kansalaisuuskokeen suorittamista. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuskokeen käyttöönotosta seuraisi lisäksi uusia tehtäviä etenkin Maahanmuuttovirastolle, joka vastaisi kokeeseen liittyvistä viranomaistehtävistä. Kokeen laatimisesta ja järjestämisestä virasto tekisi sopimukset muiden toimijoiden kanssa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kansalaisuuslain muutoksia on toteutettu kolmessa eri vaiheessa. Tässä esityksessä ehdotetaan uutta yhteiskuntatietoedellytystä ja kansalaisuuskokeen käyttöönottoa. Kokonaisuuteen kuuluvat myös jo tehdyt asumisajan pidentämisen sekä nuhteettomuus- ja toimeentuloedellytysten tiukentaminen. Kaikki nämä muutokset tulevat yhdessä vaikuttamaan siihen, millä tavoin kansalaisuuden voi jatkossa saada hakemuksen perusteella. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Täällä nyt edustaja Nikkanen haluaa käyttää vastauspuheenvuoron. [Juho Eerola: Kai me nyt muutkin debatoidaan!] — Okei, otetaan muutama vastauspuheenvuoro. Elikkä kaikki, jotka haluavat käyttää vastauspuheenvuoron, nousevat seisomaan ja painavat V-painiketta. Seitsemän henkilöä, nyt laitetaan V-painike kiinni. — Ja siellä vaikka edustaja Nikkanen aloittaa. — Mikrofoni päälle. [Saku Nikkanen: Aloitetaan alusta.] &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.08\">18.08&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Saku&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.08Nikkanen\">Nikkanen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Hallituksen esityksen lähtökohta on perusteltu. Suomen kansalaisilla on merkittävä oikeudellinen asema, ja näin ollen on kohtuullista, että sen saaminen edellyttää riittävää tietotaitoa suomalaisen yhteiskunnan perusperiaatteista, oikeuksista ja velvollisuuksista. Ajatus siitä, että kansalaisuus heijastaa onnistunutta kotoutumista, on hyvä ja kannatettava. Ehdotus yhteiskuntaosaamisen edellytyksestä ja sitä osoittavasta kansalaisuuskokeesta voi parhaimmillaan tukea aktiivista kansalaisuutta ja vahvistaa osallisuutta. Myönteistä on myös se, että osaaminen voitaisiin tietyin edellytyksin osoittaa myös Suomessa suoritetuilla opinnoilla, eli tunnistetaan erilaisia kotoutumisen polkuja. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Maahanmuuttoviraston vastuurooli koejärjestelmän hallinnoitsijana on luonteva, mutta uuden järjestelmän luominen edellyttää huolellista valmistelua, riittäviä resursseja ja selkeitä takeita toteutuvasta oikeusturvasta. Jatkovalmistelulla on hyvä varmistaa, että uudistus tukee aidosti kotoutumista, on oikeudenmukainen ja vahvistaa luottamusta suomalaisen yhteiskunnan avoimuuteen ja oikeusvaltioperiaatteeseen. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Seppänen. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.09\">18.09&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Sara&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.09Seppänen\">Seppänen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Suomen kansalaisuus on onnistuneen kotoutumisen päätepiste, ei lähtöruutu. Jatkossa kansalaisuuden saaminen edellyttää riittävää yhteiskuntaosaamista, joka osoitetaan kansalaisuuskokeella tai Suomessa suoritetuilla opinnoilla. Kyse ei ole siis rangaistuksesta vaan vastuusta. On kohtuullista edellyttää, että Suomen kansalaiseksi hakeva tuntee yhteiskuntamme perusperiaatteet, oikeudet ja omat velvollisuudet. Tämä vaatimus on erillinen kielitaidosta ja vastaa käytäntöjä hyvin monissa muissa EU-maissa sekä Pohjoismaissa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Viime vuosikymmeninä kansalaisuuden ehtoja on löysennetty, mutta seurauksena on syntynyt epätasapaino oikeuksien ja vastuiden välillä. Nyt palataan järkevään linjaan: kansalaisuus myönnetään osoituksena aidosta sitoutumisesta Suomeen. Väitteet siitä, että tiukennukset karkottaisivat osaajia, eivät kestä tarkastelua. Kansainväliset esimerkit osoittavat, että menestyvät maat yhdistävät vetovoiman ja vaativat kansalaisuusehdot. Tämä uudistus vahvistaa nimenomaan kotoutumista, kansalaisuuden arvoa ja luottamusta meidän omaan yhteiskuntaamme. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Strandman. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.11\">18.11&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Jaana&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.11Strandman\">Strandman&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Kunnioitettu ministeri! Suomen kansalaisuus on ansaittava ja osoitettava. Se on yhteiskunnan keskeinen sopimus, joka määrittää oikeudet ja velvollisuudet. Esityksessä ehdotetaan kansalaisuuskoetta, jonka avulla varmistetaan, että hakijalla on riittävä ymmärrys suomalaisesta yhteiskunnasta, laeista, asetuksista ja suomalaisesta elämäntavasta sekä suomen kielestä. Koe mittaa tietoja muun muassa päätöksenteosta, oikeusjärjestelmästä sekä perusoikeuksista. Tavoitteena on vahvistaa sitä, että kansalaisuus perustuu todelliseen tietoon yhteiskuntamme toiminnasta. Kansalaisuuden myöntämisen tulee edellyttää sitoutumista yhteisiin sääntöihin ja kykyä toimia osana yhteiskuntaa. Monissa maissa vastaava koe on käytössä, ja Suomi yhtyy tähän kansainväliseen linjaan. Tarkoitus on lisätä kansalaisuuden painoarvoa ja varmistaa, että sen saavat henkilöt ovat perehtyneet yhteiskuntaamme riittävällä tasolla. Suomessa eletään, asutaan, yritetään ja tehdään työtä. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Seuraavaksi edustaja Hänninen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.12\">18.12&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.12Hänninen\">Hänninen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitos, arvoisa puhemies ja kunnioitettu ministeri! Kiitän teitä tästä tärkeästä, arvokkaasta ja merkittävästä työstä, mitä olette tehneet tämänkin asian edistämisessä. Yhteiskunnan turvallisuus rakentuu pitkälti luottamuksesta, luottamuksesta siihen, että samassa yhteiskunnassa elävät ihmiset tuntevat ja noudattavat yhteisiä sääntöjä. Kansalaisuuskoe vahvistaa tätä perustaa. Se tukee kotoutumista, ehkäisee eriytymistä ja on samalla ennalta ehkäisevää turvallisuuspolitiikkaa. On myös todettava, ettei Suomi ole tässä poikkeus. Kansalaisuuden edellytyksiin kuuluva yhteiskuntatiedon osoittaminen on käytössä monissa muissa Euroopan maissa. On perusteltua, että myös Suomessa kansalaisuuden saavuttaminen edellyttää ymmärrystä suomalaisesta demokratiasta, oikeusvaltiosta ja yhteisistä arvoista. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Eerola. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.13\">18.13&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juho&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.13Eerola\">Eerola&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Kiitokset tosiaan ministerille. Tänä aamuna luin Kymen Sanomat -nimistä lehteä, ja siinä oli pohjustettu tätä kansalaisuuskoetta julkaisemalla vastaava Tanskassa käytössä oleva testi, toki onneksi suomen kielelle käännettynä. Siinä oli 46 kysymystä, ja muistaakseni 35 piti saada oikein, ja huvikseni sitten testasin itse tätä testiä. Vaikka en edes asu Tanskassa, niin tiesin varmasti oikein 30 niistä kysymyksistä, ja loput 16 sitten koetin arvata sopivasti. Just ne viisi, itse asiassa kuusi, meni läpi, joten olisin jopa minä saanut Tanskan kansalaisuuden sen kokeen perusteella. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nyt kun julkisuudessa tästä on keskusteltu ja nettipalstoilla jotkut ovat kritisoineet, että tämä on liian vaikea ja että kaikki suomalaisetkaan eivät läpäisisi tätä, niin jos minä, Suomessa asuva peruspersu, saisin Tanskan kansalaisuuden tämmöisen kokeen perusteella, niin ihmettelen suuresti, jos täällä Suomessa vuosia asunut maahanmuuttaja ei halutessaan vastaavia tietoja Suomesta hankkisi. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Lahdenperä. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.14\">18.14&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Milla&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.14Lahdenperä\">Lahdenperä&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Kiitos ministerille tämän esityksen eduskuntaan tuomisesta. Kansalaisuus on side yhteiskuntaan, oikeuksia ja velvollisuuksia ja ennen kaikkea luottamusta. On vaikea perustella tätä järjestelmää, jossa kansalaisuuden saisi ilman, että ymmärtää yhteiskunnan pelisääntöjä, oikeuksia ja velvollisuuksia. Se ei ole reilua meidän yhteiskuntaa kohtaan eikä myöskään niitä kohtaan, jotka ovat tehneet työn kotoutuakseen, oppiakseen kielen ja rakentaakseen elämää Suomeen. Tämä esitys tuo selkeyttä. Kansalaisuus ei ole vain oleskelun kestoa vaan myös osoitus siitä, että ihminen kykenee toimimaan osana suomalaista yhteiskuntaa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tämän uudistuksen rinnalla on hyvä huolehtia toimivasta kotoutumisesta, saavutettavasta koulutuksesta ja siitä, että jokaisella on todella mahdollisuus täyttää nämä vaatimukset. Tässä esityksessä on oikein oikea suunta. — Kiitos vielä ministerille. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Rasinkangas. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.15\">18.15&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Merja&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.15Rasinkangas\">Rasinkangas&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kunnioitettu ministeri! Suomen kansalaisuutta ei tule antaa löysin kriteerein vaan hyvin tiukin ehdoin. Jo aiemmin kansalaisuuteen vaadittua asumisaikaa pidennettiin viidestä vuodesta kahdeksaan vuoteen. Lisäksi toimeentulo- ja nuhteettomuusvaatimuksia tiukennettiin, jotta Suomen passia ei anneta varattomille rikollisille. Nyt käsittelyssä olevalla esityksellä kansalaisuuden vaatimuksiin lisätään kansalaisuuskoe, jolla mitataan tietoja suomalaisen yhteiskunnan toiminnasta ja perusperiaatteista sekä yksilön oikeuksista ja velvollisuuksista. Samalla tällä halutaan vaikuttaa kotoutumiseen suomalaiseen lainsäädäntöön, kulttuuriin ja arvoihin. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomen passi on edelleen yksi maailman arvostetuimmista, ja näillä kansalaisuuslain muutoksilla varmistetaan, että arvostus saadaan pidettyä. — Kiitos sisäministeri Rantaselle erinomaisesta esityksestä. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Sitten seuraavaksi edustaja Elomaa. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.16\">18.16&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Ritva&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.16Elomaa\">Elomaa&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Käsittelyssä oleva hallituksen esitys on tärkeä. Perussuomalaiset ovat pitkään vaatineet, että Suomen kansalaisuus ei ole pelkkä hallinnollinen toimenpide vaan merkityksellinen side yksilön ja yhteiskunnan välillä, side, joka edellyttää aitoa kotoutumista ja sitoutumista suomalaiseen yhteiskuntaan. Kansalaisuuskokeesta on tehtävä aito mittari, ei muodollisuus. Kokeen sisällön on oltava vaativa ja merkityksellinen. Hakijan on todella osoitettava tuntevansa suomalaisen oikeusvaltion periaatteet, demokratian pelisäännöt, naisten aseman suomalaisessa yhteiskunnassa sekä kansalaisen oikeudet ja velvollisuudet. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Suomen passi on yksi maailman vahvimmista matkustusasiakirjoista, joka avaa ovet paitsi Suomen myös koko Euroopan unionin työmarkkinoille. Sen on oltava palkinto, joka ei ole koskaan alennusmyynnissä. Kiitos, ministeri Rantanen, hyvää työtä. 80-luvulla matkustin paljon urheilun takia Kanadaan, USA:han, joka puolelle. Oli hienoa mennä tullin läpi, kun huomasi, että Suomen passia arvostetaan. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Mennään nyt puhujalistalle. Kaikki saavat toki puheenvuoron, ja keritään varmaan näitä ottaa tässä. — Edustaja Garedew on poissa, joten seuraavaksi edustaja Strandman.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.18\">18.18&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Jaana&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.18Strandman\">Strandman&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies, kunnioitettu sisäministeri! On Suomen onni, että meillä on perussuomalainen sisäministeri. Kiitos ministerille näistä tänä hallituskautena tehdyistä maahanmuuton kiristyksistä, jotka luovat maahamme turvallisuutta ja oikeudenmukaisuutta. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tässä esityksessä otetaan käyttöön kansalaisuuskoe, jolla varmistetaan, että Suomen kansalaisuuden saava henkilö tuntee yhteiskuntamme perusperiaatteet, oikeudet ja velvollisuudet. Kansalaisuus on osoitus sitoutumisesta suomalaiseen yhteiskuntaan, lakien ja asetuksien noudattamiseen sekä suomalaiseen elämäntapaan ja suomen kielen osaamiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Viime vuosina kansalaisuuden ehtoja on kevennetty liikaa. Tämän seurauksena kansalaisuus on voitu myöntää myös henkilöille, joiden kiinnittyminen yhteiskuntaan on jäänyt heikoksi. Nyt suuntaa korjataan. Kansalaisuus tulee nähdä päätepisteenä onnistuneelle kotoutumiselle, ja tästä kotoutumisesta on vastuussa maahantulija. On perusteltua edellyttää, että hakija hallitsee kielen lisäksi keskeiset tiedot yhteiskunnastamme. Kun Suomeen tullaan, täällä opetellaan kieli, lait ja kulttuuri. Tämä on keskeinen osa Suomeen tuloa, ja esitys vahvistaa Suomen kansalaisuuden arvoa ja merkitystä. Suomen kansalaisuus on ansaittava ja osoitettava. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa sisäministeri, kysyn kansalaisuuskokeen suorittamisesta: kuinka se käytännössä luotettavasti tehdään ja suoritetaan, ja mitä tapahtuu, jos henkilö ei saa suoritettua koetta? — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Hänninen. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.20\">18.20&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.20Hänninen\">Hänninen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomen kansalaisuus on yksi yhteiskuntamme vahvimmista siteistä. Se ei ole pelkkä hallinnollinen päätös vaan luottamuksen osoitus. Se on lupaus siitä, että kansalaisuuden saanut henkilö sitoutuu Suomen lakeihin, arvoihin ja yhteisiin pelisääntöihin. Tässä hallituksen esityksessä lähdetään liikkeelle oikeasta ja tarpeellisesta perusajatuksesta: Kansalaisuus ei ole automaatio. Se on onnistuneen kotoutumisen tulos. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tämä hallitus on vakaasti ja harkitusti päivittänyt kansalaisuuteen liittyviä ehtoja seuraamaan tämän päivän tilannekuvaa. Olemme päättäneet asumisajan pidentämisestä sekä nuhteettomuus‑ ja toimeentuloedellytysten tiukentamisesta. Nyt käsiteltävä kansalaisuuskokeeseen liittyvä lainmuutos täydentää tätä kokonaisuutta loogisesti ja vastuullisesti. Se varmistaa, että Suomen kansalaisuuden saavalla on perustiedot siitä, miten suomalainen yhteiskunta toimii, mitä oikeuksia kansalaisella on sekä mitä velvollisuuksia niihin liittyy. Tämä on tärkeä osa kansalaisuuteen sitoutumista. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Yhteiskunnan turvallisuus rakentuu pitkälti luottamuksesta — luottamuksesta siihen, että samassa yhteiskunnassa elävät ihmiset tuntevat ja noudattavat yhteisiä sääntöjä. Kansalaisuuskoe vahvistaa tätä perustaa. Se tukee kotoutumista, ehkäisee eriytymistä ja on samalla ennaltaehkäisevää turvallisuuspolitiikkaa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On myös todettava, ettei Suomi ole tässä poikkeus. Kansalaisuuden edellytyksiin kuuluva yhteiskuntatiedon osoittaminen on käytössä monissa muissa Euroopan maissa. On perusteltua, että myös Suomessa kansalaisuuden saavuttaminen edellyttää ymmärrystä suomalaisesta demokratiasta, oikeusvaltiosta ja yhteisistä arvoista. Vain siten voimme suojata sisäistä turvallisuuttamme kuormittumiselta tässä ajassa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tässä esityksessä ei ole kyse siitä, että jotakuta syrjittäisiin tai poljettaisiin tai kansalaisuuden ehtoja tiukennettaisiin kohtuuttomasti. Kansalaisuuden saamisen tulee olla osoitus suomalaisen kulttuurin kunnioittamisesta. Se ei ole itsestäänselvyys. Siksi tämä esitys ei sulje ketään ulos, mutta se tekee selväksi, että Suomen kansalaisuus merkitsee vastuuta, omaa halua ja tahtoa yhdistää yhteisiä pelisääntöjä. Jokainen voi omilla toimillaan yhä tavoitella kansalaisuutta. Se on viesti, joka vahvistaa sekä suomalaisuutta että yhteiskuntamme kestävyyttä. Se on viesti, joka tänä päivänä on yhteiskuntamme tulevaisuuden kannalta kriittisen tärkeä. — Kiitos, arvoisa puhemies. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Rintamäki.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.25\">18.25&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Anne&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.25Rintamäki\">Rintamäki&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Arvon ministeri! Tässä se nyt on: hartaudella odottamamme hallituksen esitys kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi, jonka tarkoituksena on lisätä kansalaistamisen edellytykseksi niin sanotun kansalaisuuskokeen läpäiseminen. Kansalaisuuskokeella varmistetaan riittävä yhteiskuntaosaamisen taso ennen kuin voi saada itselleen Suomen kansalaisuuteen liittyviä oikeuksia. On hyvä sisäistää, että oikeuksien rinnalla siirtyvät myös kansalaisuuden tuomat vastuut ja velvoitteet. Tuoreilla Suomen kansalaisilla täytyy olla peruskäsitys siitä, miten suomalainen yhteiskunta toimii. Perussuomalainen näkökulma, jossa kansalaisuus on palkinto onnistuneesta kotoutumisesta, ei suinkaan automaattinen lahja, toteutuu tässä hallituksen esityksessä. Jo aikaisemmin kansalaisuuden saamisen ehtoja on kiristetty esimerkiksi asumisajan vaatimusta pidentämällä sekä toimeentulo- ja nuhteettomuusehtoja kiristämällä. Tämä kolmas osa on jatkoa tälle samaiselle sarjalle.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! On vain oikeus ja kohtuus, että Suomen arvokkaan kansalaisuuden saamiseksi ulkomaalaisen tulee osoittaa sitoutumista yhteiskuntaamme ja sen perusarvoihin. Tämän voi osoittaa esimerkiksi näkemällä sen vaivan, että hankkii ne tiedot ja taidot, joita yhteiskunnan täysivaltaiselta jäseneltä voidaan edellyttää. Nämä nyt tuotavat edellytykset ovat erillisiä kielitaitoedellytyksistä, joita tietysti myös jatkossa edellytetään näiden lisäksi. Suomen kieli, tai rannikkoalueilla ruotsin kieli, on luonnollisesti yksi tärkeimmistä yksittäisistä avaimista suomalaisen yhteiskunnan ymmärtämiseen. Pelkkää yhteiskuntatiedon osaamista ei siis tietenkään sellaisenaan voi pitää ainoana kotoutumisen edellytyksenä esimerkiksi hakijan työllistymisen tai yhteiskunnalliseen toimintaan osallistumisen näkökulmasta. Täytyy muistaa ne muutkin osat, joita tähän liittyy. On kuitenkin hyvä tiedostaa, että meille tänne Suomeen saapuu paljon ihmisiä, jotka ovat lähtöisin aivan toisenlaisista kulttuureista. Se, mikä meillä ei ole lainkaan hyväksyttyä, on täysin normaalia jossain muualla. Esimerkiksi naisten asema on monessa muussa kulttuurissa erittäin surkea, ja tätä kehitystä emme Suomeen halua. Lisäksi rituaaliteurastaminen ei kuulu Suomen rajojen sisäpuolelle. Se on hyvä alleviivata myös tänne tulijoille. Kaikenlaisia tapoja ei pidäkään suvaita.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomi ei muutu näillä toimenpiteillä kansainväliseksi kummajaiseksi tai ei-houkuttelevaksi paikaksi ulkomaalaisille osaajille. Monessa muussakin, jopa Pohjoismaissa, on käytössä kansalaisuuskokeita, ja silti nämä maat ovat houkuttelevia kansainvälisille osaajille. Suomi ei ole sen houkuttelevampi ulkomaalaisten koulutettujen asiantuntijoiden parissa, vaikka alkaisimme erottautumaan yleispohjoismaisesta tiukentuvasta kansalaisuuspolitiikasta. Se houkuttelevuus tulee aivan jostain muualta kaikilla osaajilla, ja Suomeen töihin tulevilla ei ole aikomustakaan hankkia kansalaisuutta. Pitää muistaa sekin, että Suomi on verottamisessa maailman kärkeä, mikä osaltaan on suurempi este osaajien rekrytoinnissa maahamme. Muissa Länsi-Euroopan maissa on havaittu, että kansalaisuutta hakevat kaikista aktiivisimmin humanitäärisin ja perheperustein muuttaneet yksilöt, eivät niin sanotut osaajat. Meillä koto-Suomessakin on löysien ehtojen vuoksi kansalaistettu sellaista porukkaa, joka elää tulonsiirtojen varassa, ei osaa kunnolla suomea eikä osaa elää täällä meidän tapojemme ja sääntöjemme mukaisesti.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomalaisesta passista ja kansalaisuudesta on vuosien saatossa tullut melkein jakotavaraa. Tämä kehitys on onneksi pysäytetty, ja Suomen kansalaisuus on palautettu sille kuuluvaan arvoon. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Antikainen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.30\">18.30&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Sanna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.30Antikainen\">Antikainen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitos, arvoisa rouva puhemies! Nyt ei tosiaan enää lennätellä Isis-äitejä Suomeen veronmaksajien piikkiin, käytetä aikaa katujengiongelmien kieltämiseen ja näin edelleen. Tämä siksi, koska onneksi meillä on sisäministerinä perussuomalainen Mari Rantanen. Vihdoin Suomen kansalaisuus saa sille kuuluvan arvonsa. Suomen passi siirretään ”saa ottaa” ‑korista ”vain kokeen läpäisseille” ‑koriin. Enää sitä ei jaella alelaarista kaikille halukkaille, vaan se on palkinto. Se on palkinto niille, jotka haluavat olla suomalaisia ja jotka haluavat kotoutua Suomeen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Tällä hetkellä yhteiskunta- tai kansalaistiedon osoittaminen on monessa valtiossa edellytys kansalaisuuden saamiselle. Esimerkiksi Euroopan muuttoliikeverkoston vuonna 2020 julkaiseman tutkimuksen mukaan noin puolet EU-maista edellytti kansalaistamista varten yhteiskuntatiedon osoittamista. Osana sisäministeriön työryhmän työskentelyä teetettiin vielä edellä mainittua tutkimusta ajankohtaisempi kysely Euroopan muuttoliikeverkoston kautta. Kysely lähetettiin 32 maalle, joista 21 antoi vastauksen. Vastauksen antaneista maista ainoastaan kolmella — siis kolmella — ei ollut käytössä kansalaisuuskoetta, minkä lisäksi yksi näistä maista oli Ruotsi, jossa edellä mainitun kaltaista suunnitellaan juuri nyt tällä hetkellä. Jos siis Suomi ei ottaisi nyt pian kansalaisuuskoetta käyttöön, jäisimme eurooppalaisella tasolla poikkeukseksi.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Eräissä tutkimuksissa on käsitelty kansalaisuuden saamiselle asetettavia edellytyksiä, mukaan lukien yhteiskuntatietoedellytys ja kansalaisuuskoe. Tutkimuksen aiheisiin on kuulunut muun muassa se, mitä vaikutusta kansalaisuudelle asetettavilla vaatimuksilla on ollut kansalaisuuden hakemiseen ja sen saamiseen. Kansalaisuuden saamiselle asetettavilla edellytyksillä on havaittu olevan yhteyttä kotoutumiseen, siis positiivisessa mielessä. Ja nimenomaisesti tässä salissa, jopa siellä vasemmalla laidalla, on puhuttu kotoutumisen puolesta ja vaadittu sitä. No, nyt tässä teille esitys, joka lisää kotoutumista. Voisi luulla kaikkien kannattavan sitä, vaan ei. Vihreäthän viestivät tästä jo aiemmin, että kansalaisuuskoe kuulemma murentaa ihmisoikeuksia. Näin he tekivät eräässä somepostauksessaan. Tämä vihreitten somepostaus oli jälleen hyvä osoitus siitä, millaista vihreää pajunköyttä kyseinen puolue koettaa syöttää tuon tuosta. Edelläkin mainittu tutkimus jo osoittaa sen täysin vääräksi.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Haluan kiittää sisäministeri Mari Rantasta isänmaallisesta työstä. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Hopsu.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.34\">18.34&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Inka&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.34Hopsu\">Hopsu&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vihr&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Maahanmuuttajien perehtyminen suomalaiseen yhteiskuntaan on tärkeää. Riittävät ja laadukkaat resurssit kotoutumiseen ovat tärkeitä tämän yhteiskuntatiedon saavuttamiseksi. Valitettavasti juuri kotoutumistyöstä on kunnilta leikattu. Järjestötyö, tukiperheet, arjen kulttuuriin tutustuminen ovat tärkeitä. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Työskennellessäni opettajana useat maahanmuuttajaperheet kysyivät hyvin arkeen liittyvissä asioissa tukea. Esimerkiksi veroilmoituksen täyttäminen oli sellainen, joka ei ole tuttu, ja varsinkin kun se ilmoitus on vieraalla kielellä, niin olisihan sille syytä, että olisi joku taho, joka voisi opastaa tässä ja tämäntyyppisissä arjen asioissa. [Sanna Antikaisen välihuuto] Opettajan ammattitehtävään ei tämä kuulu, mutta totta kai suomalaisena kansalaisena halusin, että se veroilmoitus tulee oikein täytettyä, ja siinä autoin. Mutta tämäntyyppiset opit, tämäntyyppinen tuki olisivat niitä, jotka varmistaisivat sen, että kotoutuminen onnistuu. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Suomen kansalaisuuden ehdot ovat jo nyt tiukat, ja muuhun... [Sanna Antikainen: Ei pidä paikkaansa!] — Anteeksi, jos täällä voisi huutelua olla vähemmän, niin voin keskittyä paremmin.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Annetaan edustaja Hopsun puhua kaikessa rauhassa. &nbsp;\u003C/p>\n       \u003C/div>\n       \u003Cp class=\"edk-KappaleKooste\">Joo. — Suomen kansalaisuuden ehdot ovat nyt tiukat, ja meillä on ruuhkaa kansalaisuushakemusten käsittelyssä. Tämä jono on pitkä, Migrin mukaan normaalitilanteessa 34 kuukautta. Aiemmin tästä käsittelyajasta sai arvion Migriltä, siitä, kuinka kauan käsittelyyn ja päätökseen on menossa aikaa. Nykyisin tätä tietoa ei enää hakijoille anneta. Tiedossa on, että yli kymmenen vuotta Suomessa jo asuneet, myös perheelliset, odottavat yhä näitä kansalaisuuspäätöksiä. Näin pitkät odotusajat eivät todellakaan ole kohtuullisia, jos elämä on jo tänne rakennettu. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Esimerkiksi Kauppakamari nosti lausunnossaan tästä esityksestä esiin, että on riskinä, että tästä syntyy prosessiin jälleen uusi pullonkaula. Haluaisin muistuttaa hallituspuolueita myös siitä, että juuri kehysriihen yhteydessä tuotiin esitys siitä, että valtionhallinnosta leikataan 60 miljoonaa euroa lisäsäästöjä jo aiemmin tehtyjen säästöjen päälle. Mutta tämä on selvästi hallituksen valinta, että tätä byrokratiaa halutaan lisätä, vaikka aika usea näistä lausunnonantajista toteaa, että jo nämä aiemmin lainsäädäntöön tehdyt muutokset, joissa on pidennettyä asumisaikaa, kielivelvoitteiden pidentämistä, tulorajoja, todennäköisesti täyttävät jo kaikki nämä hallituksen esityksessä asetetut tavoitteet. Esimerkiksi Suomen Asianajajat nosti esiin, että tämä muutos on todennäköisesti aivan tarpeeton. Jyväskylän yliopisto huomautti lausunnossaan esityksen pohjautuvan hyvin ohueen tutkimustietoon. Yliopisto epäilee, onko koe oikeasti vastaus kotoutumisen ongelmiin, vai onko kyse enemmän symbolisesta eleestä. Ja tässä taloustilanteessa mielestäni tällaisiin symbolisiin eleisiin ei pitäisi satsata vaan ennemmin siihen aitoon kielen oppimiseen, aitoon kotoutumiseen. Niitä resursseja ja keinoja sen saavuttamiseen ei tule. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta sen verran positiivistakin palautetta pitää antaa, että on hyvä, että tässä esityksessä on päädytty siihen, että tämä koe mittaa yleistietoa, ei arvoja. Yhteiskunnan tällaiset perusperiaatteet, oikeudet ja velvollisuudet ovat hyviä tietää, ja näiden kautta näiden kansalaisuutta hakevien ihmisten osallisuus meidän suomalaisessa yhteiskunnassa voi vahvistua. Siksi meidän pitää varmistaa, että hakijoilla on hyvät edellytykset nämä tiedot ja taidot saada. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Eerola.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.38\">18.38&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juho&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.38Eerola\">Eerola&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Tosiaan kiitokset jälleen kerran ministeri Rantaselle tästä mainiosta maahanmuuttopolitiikkaa kiristävästä esityksestä. Kyllä tässä taas on... [Puhujan mikrofoni sulkeutuu] — Hävisikö mikrofoni? No, nyt tuli mikrofonin ääni takaisin. Otetaan vettä, niin tulee itsellenikin. [Puhuja juo vettä] Hyvä. — Tässä on positiivisia kaikuja. Muistan, kun silloin vuonna 2010 sitä Nuivaa Vaalimanifestia tehtiin, ja tämä kyllä haisee positiivisesti siltä, kuten tällä vaalikaudella useatkin ministeri Rantasen tänne tuomat esitykset ovat tehneet.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Julkisuudessa — ja tuossa edelläkin edustaja Hopsu, joka juuri poistui salista — on kritisoitu uutta kansalaisuuslakia ja siihen liittyvää koetta, ja erityisesti erinäköisissä nettikeskusteluissa on tätä kritisoitu. Mutta kuten äsken tuossa debatissakin kerroin, niin tänään aamulla sattumalta Kymen Sanomat ‑nimisessä aviisissa oli pohjustettu tätä keskustelua ja nyt muutenkin tätä esillä olevaa lakiesitystä ja siihen oli laitettu malliksi — tämähän on siis aika monessakin Euroopan maassa käytössä, ja yksi niistä maista tosiaan on Tanska, jossa tämä on ollut jo käytössä — viime syksystä, marraskuusta, käytössä ollut Tanskan kansalaisuuskoe eli ihan vastaava, mikä on tänne Suomeen nytten siis tulossa. Toki se oli siinä sitten suomen kielellä. Minä päätin ihan kokeeksi itse siis tehdä sen testin. Siinä oli 46 kysymystä, ja 35 oli sitten Tanskassa pitänyt saada oikein, että saa Tanskan kansalaisuuden. Ja vaikka minä en ole siis koskaan asunut Tanskassa enkä ole muutenkaan, mitä nyt Pohjoismaiden neuvoston tähden, siellä paljon käynyt, niin minun ihan tällaisilla perustiedoillani 30 kysymystä niistä 46:sta tiesin oikein. Loppuja 16:ta, mitä en tiennyt, kokeilin arvata, ja silleen suht sopivasti kuusi kappaletta niistäkin meni sitten ihan tsägällä oikein, niin että hahaa, olisin Tanskan kansalainen. Toki siellä Tanskassa se pitää suorittaa sitten tanskan kielellä, joka on minulle umuligt. Mutta jos olisin saanut suomen kielellä sen tehdä, niin olisin läpäissyt tämän Tanskan kansalaisuuskokeen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Eli nyt niille henkilöille — edustaja Hopsulle, joka siis poistui jo salista, ja muillekin — ketkä tätä ovat kritisoineet, kyllä sanon, että se voisi minun puolestani olla vaikka huomattavasti vaikeampi. Kyllä jokainen sellainen maahanmuuttaja, joka täällä Suomessa useamman vuoden asuu, tietää tämäntyyppiset perustiedot, kuka nyt on kova urheilija tai kuka on kultalevyn voittanut laulaja täällä. Jos pikkasenkin lukee lehtiä ja seuraa mediaa, niin tämäntyyppiset tiedot oppii, entiset pääministerit ynnä muut. Ei ole liian mahdoton, minun puolestani voisi olla vaikeampi. Toki jos minä sinne Tanskaan muuttaisin ja sitten jossain suomalaisyhteisössä siellä vain rypisin koko sen aikani, niin enhän minä siitä Tanskan kulttuurista ja menosta mitään oppisi, mutta se olisi sitten ihan oma häpeä, enkä ansaitsisi sitten sitä Tanskan kansalaisuutta. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">No niin, kiitoksia. — Edustaja Lehtinen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.42\">18.42&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Rami&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.42Lehtinen\">Lehtinen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Jos miettii, mistä lähdettiin, kun tämä hallitus aloitti, niin tilanne oli se, että viisi vuotta Suomessa oleskelemalla, välttämättä tekemättä yhtään mitään, kävi kumartamassa kansalaisuuden. Tämä oli se lähtökohta, kun tämä hallitus aloitti. Aika pitkälle ollaan tultu siitä: ensinnäkin ei riitä viisi vuotta, vaan vaaditaan kahdeksan vuotta, pitää olla myöskin nuhteeton, huomattavasti enemmän kuin aikaisemmin, ja pitää olla myöskin osoittaa, että pystyy itse huolehtimaan omasta toimeentulostaan. Nämä on siis jo tehty, ja nyt tulee tämä kolmas vaihe, jossa pitää osoittaa myöskin, että tuntee suomalaista kulttuuria ja historiaa ja meidän tapoja toimia tässä maassa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Täällä on käyty keskustelua siitä, että kansalaisuuden tiukentaminen merkittävästi vähentäisi erityisosaajien tulemista maahan. Kysyisinkin tästä ministeriltä, miten te sen näette, koska on ymmärtääkseni useita vastaavanlaisiakin näkökulmia, että niihin maihin, joissa on tiukempi kansalaisuuslainsäädäntö, se jopa houkuttelee osaajia. Itsekin olen monta kertaa käyttänyt puheenvuoroa siitä, että uskon, että ne aidosti erityisosaajat, jotka voivat valita minkä tahansa maan maailmasta, haluavat tulla Suomeen juuri siksi, että täällä on turvallista ja puhdasta ja tämä yhteiskunta on luotettava. Tämä on se merkittävä riski, mikä voidaan menettää, jos me ei onnistuta tässä maahanmuuton asiassa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Se vielä, miksi kansalaisuus on merkityksellinen, niin se on merkityksellinen siitä syystä, että sinä päivänä, kun kansalaisuus myönnetään, kaikki ulkomaalaislain suomat toimet, joita viranomaiset voivat tehdä, elikkä sen soveltaminen, loppuvat samana päivänä. Ei voida enää karkottaa eikä käännyttää, jos sitten rupeaa hölmöilemään. Siksi tällä on kansakuntana meille iso merkitys. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Sitten mitä tulee tähän edustaja Hopsun esiin tuomaan kuntien kotouttamiseen, niin valiokuntakäsittelyssä on tullut useita kertoja esiin se, että siellä saatetaan makuuttaa kymmenen kuukauttakin kotona ennen kuin ensimmäistäkään kotouttamistoimea tehdään, ja vielä jopa sanotaan, että älä nyt vain itse rupea mitään tekemään, katso kun me kotoutetaan sinut tänne Suomeen. Siinähän passivoituisi kaikkein aktiivisinkin ihminen, joka aidosti haluaisi tähän yhteiskuntaan integroitua. Eli tämä järjestelmä passivoi jo itsessään, ja siksikin tätä pitää muuttaa. Ei tässä ole mitään järkeä. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">No, mitä tulee näihin ruuhkiin, että kansalaisuuden saaminen kestää pidempään, niin ymmärtääkseni lähes kaikki, jotka kansalaisuutta hakevat, ovat pysyvällä oleskeluluvalla, eli ei heitä tästä maasta pois potkita. Eli ainut pelko, mikä on, on se, että he rupeavat sitten hölmöilemään siinä välissä ennen kuin kansalaisuuden saa. Se on se riski, jos ikään kuin jännittää, mitä tässä pitkässä prosessissa tapahtuu. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Aito kotoutuminen lähtee siitä, että ihminen itse aidosti haluaa tehdä ne asiat, joita tämä yhteiskunta edellyttää kansalaisuuden saamiseksi, ja sitä me tullaan jatkossakin vaatimaan. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Vigelius poissa. — Ministerille puheenvuoro. Riittääkö kolme minuuttia? [Mari Rantanen: Minä yritän!] — Selvä, viisikin käy.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"18.45\">18.45&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"AsemaTeksti\">Sisäministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Mari&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"18.45Rantanen\">Rantanen&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kiitän tästä keskustelusta liittyen kansalaisuuskokeeseen. — Kuten tuossa aluksi sanoin, tämä on nyt se viimeinen palanen, joka tällä hallituskaudella tehdään. Tätä kansalaisuuttahan on todella aikaisemmin kiristetty; asumisaikavaatimusta, ja toisessa vaiheessa oli nuhteettomuus ja toimeentuloedellytys. Aivan kuten tässä edustaja Lehtinen kuvasi, aiemmin riitti käytännössä viisi vuotta asumista Suomessa, ja jos puhutaan kansainvälistä suojelua saavista eli turvapaikkaa nauttivista, niin heillä riitti neljä vuotta. Aiemmin toimeentuloedellytykseksi riitti myös se, että toimeentulona esitti sosiaaliturvan, mitä Kela maksaa, ja tämä ei enää tietenkään käy. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tämä esitys on oikeastaan jatkumoa ja peilaa siihen hallituksen isoon linjaan, jossa nimenomaisesti, kun puhutaan kotoutumisesta, se näkyy kautta linjan. Me emme enää jaa mitään lupia tai kansalaisuuksia automaattisesti, vaan me pyrimme siihen, että jotta voit saada lisää oikeuksia, niin siihen liittyy velvollisuuksia, ja tämä kotoutumisen velvoite on nyt kyllä läpileikkaava tässä, ja niin myös kansalaisuudessa. On tietysti aivan selvää, että valtion tulee arvostaa omaa kansalaisuuttaan niin korkealle, että sinne on tehty sellaiset edellytykset, että tosiasiassa ihminen osallistuu myös tämän kyseisen yhteiskunnan toimintaan. Minusta tämä on ihan keskeinen asia, mitä itseään arvostavan valtion tulee tehdä, mutta myös huomioida sitten muun muassa vaikka turvallisuuskysymykset. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On myös esitetty kritiikkiä, että nyt on liian vaikeata saada kansalaisuutta, mutta sanoisin näin, että tämän kauden muutoksista, nyt tämä kansalaisuuskoe mukaan lukien, minä ajattelen niin, että kun henkilö opettelee kielen ja suomalaisen yhteiskunnan toiminnan, ei tee rikoksia, ei anna vääriä tietoja viranomaisille ja käy töissä, niin hänellä ei ole mitään hätää. Minusta nämä edellytykset ovat aivan perusasioita, jotka olisi pitänyt tietenkin hoitaa aikaa sitten. On hyvä huomata, että 20 vuoteen Suomessa ei ole kansalaisuuslakia tällä tavoin muutettu. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mitä tulee kotoutumiseen, niin tähän kokonaisuuteen menemättä sen syvemmälle, hallitus on tänään antanut hallituksen esityksen myös kotoutumislain muutoksista, jotka tukevat tätä samaa asiaa, eli että pyritään siihen, että kieli ja yhteiskuntaoppi ovat ne keskeiset asiat, ja samalla kun yhteiskunta auttaa alkuun, edellytämme maahanmuuttajalta omaa vastuuta ja myös velvollisuuksia osallistua näihin palveluihin. Eli käytännössä katsoen kaikki nämä hallituksen esitykset tukevat toisiaan, ja näinhän sen pitää ollakin. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Täällä kysyttiin, miten tämä mahdollisesti vaikuttaa sellaisiin osaajiin, jotka ovat korkeakoulutettuja, mutta minä en näe sellaista ongelmaa tässä oikeastaan laisinkaan, koska meidän keskeisillä verrokkimailla joko on tämä kansalaisuuskoe tai heille on se juuri tulossa, eli käytännössä katsoen kansalaisuuden edellytyksistä pidetään myös muissa maissa huolta, ja siinä mielessä Suomi kilpailee tai on kilpailematta joillain muilla asioilla, kuten esimerkiksi verotuksella, joka täällä jo todettiin. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Sitten kysyttiin sitä, mitä tapahtuu, jos ei tätä koetta hyväksytysti suorita. No, silloin ei ole kansalaisuuden edellytyksiä. Kansalaisuus myönnetään siinä kohtaa, kun kaikki edellytykset täyttyvät. Tämä on yksi edellytys, ja jos et sitä suorita, niin silloin kansalaisuutta ei voi saada. On hyvä huomata, mikä jäi ehkä tuossa alussa sanomatta ja mikä oikeastaan liittyy tähänkin, että tämä on tarkoitus tehdä sillä tavalla, että totta kai alkukustannukset tulevat tämän järjestelmän rakentamisen myötä mutta jatkossa kustannuksista vastaavat kansalaisuuskokeen tekijät, eli heiltä otetaan osallistumismaksulla tämän lain kustannukset. Siinä mielessä tietysti se varmasti myös osittain katsoo sen, että siellä ei aivan viikoittain käydä kokeilemassa. Totean vielä sen, että on tietysti selvää, ettei tässä voi olla sellaista tilannetta, että meillä on samat kysymykset, jotka pyörivät viikkotolkulla, vaan siinä täytyy olla iso määrä kysymyksiä, joista sitten kulloinkin arvotaan ja valitaan kuhunkin koetilaisuuteen kysymykset, jolloinka se myös vähentää sitä väärinkäytösten riskiä, niin että ei voi kysyä viime viikolla olleelta kaverilta, mitä siellä kysyttiin. — Kiitos.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv id=\"PaatoksentekoToimenpide\" class=\"PaatoksentekoToimenpide\">\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cp class=\"edk-KappaleKooste\">Keskustelu päättyi.&nbsp;\u003C/p>\n     \u003Cp class=\"edk-KappaleKooste\">Asia lähetettiin hallintovaliokuntaan.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cspan class=\"edk-EduskuntaTunnus\">\u003C/span>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-22863",nav:"\u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Muut esitysmuodot\u003C/span>\n\u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n \u003Cli>\u003Ca href=\"/pdf/PTK+41/2026+5\" class=\"navilink\">Asiakirjan painoasu (PDF)\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"/riksdagshandlingar/PR+41/2026+5\" class=\"navilink\">Dokumentet på svenska\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/PTK%2041%2F2026%20vp?asiakirjatyyppikoodi=PTKPS\" class=\"navilink\">Pöytäkirjan pääsivu\u003C/a>\u003C/li>\n\u003C/ul>\n\u003Cul id=\"AsiaKohtaPuheenvuorot\" class=\"navbar-nav nav t-margin\">\n \u003Cli>\u003Ca href=\"#PuheenjohtajaRepliikki\">Puhemiehen esittely\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.01Rantanen\">18.01 Sisäministeri Mari Rantanen\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.08Nikkanen\">18.08 Saku Nikkanen sd\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.09Sepp%C3%A4nen\">18.09 Sara Seppänen ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.11Strandman\">18.11 Jaana Strandman ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.12H%C3%A4nninen\">18.12 Juha Hänninen kok\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.13Eerola\">18.13 Juho Eerola ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.14Lahdenper%C3%A4\">18.14 Milla Lahdenperä kok\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.15Rasinkangas\">18.15 Merja Rasinkangas ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.16Elomaa\">18.16 Ritva Elomaa ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.18Strandman\">18.18 Jaana Strandman ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.20H%C3%A4nninen\">18.20 Juha Hänninen kok\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.25Rintam%C3%A4ki\">18.25 Anne Rintamäki ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.30Antikainen\">18.30 Sanna Antikainen ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.34Hopsu\">18.34 Inka Hopsu vihr\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.38Eerola\">18.38 Juho Eerola ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.42Lehtinen\">18.42 Rami Lehtinen ps\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#18.45Rantanen\">18.45 Sisäministeri Mari Rantanen\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#PaatoksentekoToimenpide\">Päätös\u003C/a>\u003C/li>\n\u003C/ul>"},uses:{params:["edktunnus"]}}],
