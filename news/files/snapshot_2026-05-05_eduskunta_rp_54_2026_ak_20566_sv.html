myndigheternas verksamhet. Med tanke på detta kunde man till viss del anse att det inte längre är ändamålsenligt att påvisa språkkunskaperna separat i naturalisationsskedet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Å andra sidan genomgår inte alla som ansöker om medborgarskap sluttestningen inom integrationsutbildningen, och en del av sökandena har till exempel beviljats permanent uppehållstillstånd utan villkor om språkkunskaper. Således skulle man i det ovan beskrivna alternativet inte nödvändigtvis ha kunnat anta att den sökande skulle ha haft en viss kunskapsnivå inom de olika delområdena av språket, som bedöms till exempel med en allmän språkexamen. I detta alternativ skulle deltagarens språkkunskaper inte ha bedömts särskilt omfattande eller noggrant eftersom ett skriftligt medborgarskapsprov som består av flervalsfrågor inte mäter till exempel förmågan att producera språket. Betydelsen av tal, skrivande och hörförståelse skulle ha minskat betydligt. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Dessutom skulle det ha varit utmanande att kombinera bedömningen av två mycket olika kunskapsområden, språkkunskap och samhällskunskap. Som grund för bedömningen av språkkunskaper har man till exempel utvecklat den gemensamma europeiska referensramen för språk, och de språkkunskaper som krävs för naturalisation beskrivs med hjälp av olika kunskapsnivåer. Det har inte utvecklats någon motsvarande allmänt vedertagen bedömningsram för att mäta samhällskunskap. Således kan två olika kunskapsområden inte kombineras i samma bedömning så att resultatet blir en motiverad gemensam bedömning av både språkkunskaperna och behärskandet av samhällskunskap. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Även om det att språkkunskapsvillkoret ersätts med ett samhällskunskapsvillkor i sig skulle ha genomfört målet för det nya villkoret för naturalisation, skulle språkkunskapernas betydelse som ett villkor för naturalisation ha inskränkts på ett sätt som inte kan anses vara ändamålsenligt med tanke på den integration som förutsätts för medborgarskap. Därmed ansågs det att språkkunskapsvillkoret ersätts med samhällskunskapsvillkoret inte vara ett motiverat alternativ. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I ett annat alternativ som bedömdes skulle språkkunskapsvillkoret och samhällskunskapsvillkoret ha slagits ihop till ett nytt villkor för naturalisation. Då skulle det i lagen ha införts ett nytt villkor som skulle ha omfattat både språkkunskaper och samhällskunskaper. Språkkunskapsvillkoret skulle inte heller i detta alternativ ha bibehållits som ett separat villkor för naturalisation. Uppfyllandet av villkoret skulle ha påvisats med ett medborgarskapsprov i två delar som skulle ha innehållit delar som mäter både språkkunskaperna och samhällskunskaperna. Provet skulle ha avlagts antingen på finska eller svenska och nivån på språkkunskaperna skulle ha kunnat motsvara nivån på språkkunskaperna enligt gällande lag. För att uppfylla det nya villkoret skulle det ha krävts att båda delarna av provet avläggs med godkänt resultat. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det nya kombinerade villkoret skulle ha motsvarat till exempel de ändringar som planeras i Sverige, vilka innebär att förvärv av medborgarskap i landet förutsätter avläggande av ett medborgarskapsprov avsett för att påvisa språkkunskaper och samhällskunskaper eller att den sökande har avlagt någon annan utbildning som kan jämställas med medborgarskapsprovet. Även i detta alternativ skulle antalet villkor för naturalisation ha bibehållits oförändrat eftersom det gällande språkkunskapsvillkoret skulle ha ersatts med ett kombinerat språkkunskaps- och samhällskunskapsvillkor. Situationen i Finland skiljer sig emellertid från situationen i Sverige genom att språkkunskapsvillkoret redan är ett villkor för att förvärva finskt medborgarskap. Uppfyllandet av villkoret påvisas av hävs bland annat genom en allmän språkexamen. Därför är det i Finland inte längre nödvändigt att utveckla ett nytt provsystem för att påvisa kunskaper i finska eller svenska. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ett sådant medborgarskapsprov avsett för att påvisa samhällskunskap som föreslås i denna proposition medför i vilket fall som helst i betydande grad nya uppgifter för Migrationsverket och andra aktörer. Att inkludera delar avsedda för bedömning av språkkunskaperna i medborgarskapsprovet skulle göra det nya provsystemet betydligt tyngre än det föreslagna. Införandet av ett medborgarskapsprov som är avsett enbart för att testa samhällskunskap kan antas orsaka klart mindre kostnader. Förslagen i denna proposition om den samhällskunskap som krävs för medborgarskap och om det medborgarskapsprov som är avsett att påvisa kunskapen kan ur denna synvinkel anses vara motiverade. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lagstiftning och andra handlingsmodeller i utlandet\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Nedanstående sammanställning av medborgarskapsprov i andra länder grundar sig till stor del på arbetsgruppens utredning om införandet av medborgarskapsprovet (s. 30–43) och svaren på en enkät som genomfördes via det europeiska migrationsnätverket\u003Cspan class=\"AlaviiteKooste\"> Ad-Hoc Query on 2024.5 Citizenship tests as part of naturalisation process (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://home-affairs.ec.europa.eu/document/download/5e80dc8e-541a-4514-a1ec-798d68ce185f_en\">https://home-affairs.ec.europa.eu/document/download/5e80dc8e-541a-4514-a1ec-798d68ce185f_en\u003C/a>\u003C/span>\u003C/span>\u003C/span>. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ett medborgarskapsprov som avläggs på landets språk har också samband med vilken nivå av språkkunskaper som krävs för medborgarskap. I de länder som granskats nedan förutsätts i allmänhet språkkunskaper som ligger på nivå B1 på skalan i den gemensamma europeiska referensramen för språk (CEFR)\u003Cspan class=\"AlaviiteTeksti\"> I den gemensamma europeiska referensram för språkinlärning, undervisning och bedömning som utvecklats av Europarådet har sex nivåer av språkkunskaper definierats och beskrivits på skalan A1–C2. \u003C/span>. B1-nivå på skalan innebär en självständig språkanvändare som med sina språkkunskaper kan klara av de flesta situationer i språkområdet. &nbsp;\u003C/p>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sverige\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I Sverige finns det ännu inget krav på språkkunskaper eller medborgarskapsprov, men införandet av dessa har utretts.\u003Cspan class=\"AlaviiteKooste\"> Krav på kunskaper i svenska och samhällskunskap för svenskt medborgarskap (SOU 2021:2, ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\">https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Den nivå av språkkunskaper som krävs för medborgarskap är B1 vad gäller att förstå språket och A2 vad gäller att producera språket. I fråga om att producera språket räcker det således med en lägre nivå på språkkunskaperna.\u003Cspan class=\"AlaviiteTeksti\"> A2-nivå innebär en språkanvändare på basnivå vars språkkunskaper räcker till för socialt umgänge och att berätta saker i korthet. \u003C/span> Språkförståelse omfattar att text- och hörförståelse medan språkproduktion inbegriper att skriva och tala. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet genomförs som ett digitalt prov i Sverige. Frågorna i medborgarskapsprovet gäller kunskaper om samhället och omfattar ämnen som demokrati, geografi, historia, traditioner, arbetsmarknad och mänskliga rättigheter. Enligt en nyare utredning\u003Cspan class=\"AlaviiteKooste\"> Skärpta krav för svenskt medborgarskap (SOU 2025:1, ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/98678c2a40d64ccd9f16e6017923bbce/sou-20251-skarpta-krav-for-svenskt-medborgarskap.pdf\">https://www.regeringen.se/contentassets/98678c2a40d64ccd9f16e6017923bbce/sou-20251-skarpta-krav-for-svenskt-medborgarskap.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> av villkoren för naturalisation borde medborgarskapsprovet utökas med ämnen som berör mediernas roll i samhället och barnets rättigheter som en del av de mänskliga rättigheterna. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I Sverige krävs ett medborgarskapsprov av 16–66-åringar. Utöver att avlägga provet kan uppfyllandet av villkoret också påvisas på andra sätt, till exempel med vissa skol- och kursintyg. Undantag från kravet kan göras bland annat på grundval av en funktionsnedsättning. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det allmänna ansvaret för genomförandet av provet ankommer på Universitets- och högskolerådet (UHR).\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\">https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Universitets- och högskolerådet ansvarar bland annat för att utveckla provet och för att fatta beslut som gäller resultaten. Skolverket ansvarar i sin tur för att ta fram en bok i samhällslära som fungerar som läromedel för provet och som frågorna i provet baserar sig på. Deltagaravgiften har tidigare planerats uppgå till 500 svenska kronor (45 euro). &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Norge\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För att förvärva medborgarskap i Norge krävs muntliga språkkunskaper på B1-nivå. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I Norge utgörs medborgarskapsprovet av ett digitalt flervalsprov. Frågorna i provet baserar sig på läroplanen för samhällslära för vuxna invandrare. Läromedel för att förbereda sig för provet finns på en webbplats\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://samfunnskunnskap.no/en/index.html\">https://samfunnskunnskap.no/en/index.html\u003C/a>\u003C/span>\u003C/span>\u003C/span> som behandlar bland annat Norges arbetsmarknad och historia. Minst 24 av de 32 frågorna i medborgarskapsprovet måste besvaras korrekt. En godkänd prestation förutsätter således att 75&nbsp;procent av svaren är korrekta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det norska medborgarskapsprovet gäller 16–67-åringar. Medborgarskapsprovet kan ersättas med ett samhällstest på norska som bland annat förutsätts för att få permanent uppehållstillstånd. Nordiska medborgare som förstår norska eller samiska är befriade från språk- och medborgarskapsprovet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I Norge förvaltas medborgarskapsprovet av utbildningsverket (Direktoratet for høyere utdanning og kompetanse).\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://prove.hkdir.no/\">https://prove.hkdir.no/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Medborgarskapsprovet avläggs vid ett provcenter i hemkommunen där deltagaren använder provcentrets dator. Kommunerna bestämmer deltagaravgiften för medborgarskapsprovet, som varierar mellan 300 och 1&nbsp;800 norska kronor (28–170 euro). Ändring i provresultatet kan sökas på grund av ett tekniskt fel inom tre veckor efter att provet har avlagts. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Danmark\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I Danmark krävs språkkunskaper på nivå B2 för danskt medborgarskap\u003Cspan class=\"AlaviiteTeksti\"> Nivån är högre än B1. B2-nivå innebär en självständig språkanvändare som kan kommunicera oklanderligt med infödda språktalare. \u003C/span>. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Frågorna i medborgarskapsprovet handlar om det danska samhället och Danmarks kultur och historia. Det finns en lärobok för att förbereda sig för provet\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://danskogproever.dk/media/4vbfd0ac/laeremateriale-til-medborgerskabsproeven.pdf\">https://danskogproever.dk/media/4vbfd0ac/laeremateriale-til-medborgerskabsproeven.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span>. Provet består av flervalsfrågor samt frågor på vilka man svarar ja eller nej. Av de 45 frågorna i provet ska minst 36 besvaras rätt. För en godkänd prestation förutsätts således att 80 procent av svaren är korrekta. Fem av frågorna handlar om värderingar i samhället, och minst fyra av dessa frågor måste besvaras korrekt. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Barn under 12 år som ansöker om medborgarskap är befriade från medborgarskapsprovet. Svensk- och norskspråkiga sökande kan uppvisa ett intyg över att de gått i grundskola på svenska eller norska. Undantag från medborgarskapsprovet kan göras på grundval av sjukdom eller nedsatt funktionsförmåga, om personen inte skäligen kan förväntas klara provet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Provet utarbetas av styrelsen för internationell rekrytering och integration (Styrelsen for International Integration og Rekruttering, SIRI).\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://danskogproever.dk/borger/indfoedsretsproeve-statsborgerskab/forberedelse-til-indfoedsretsproeven/ \\l accordion-tidligere-indfodsretsprover\">https://danskogproever.dk/borger/indfoedsretsproeve-statsborgerskab/forberedelse-til-indfoedsretsproeven/#accordion-tidligere-indfodsretsprover\u003C/a>\u003C/span>\u003C/span>\u003C/span> Medborgarskapsprovet kan avläggas vid ett språkcenter.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://danskogproever.dk/sprogcenter/sprogcentre/\">https://danskogproever.dk/sprogcenter/sprogcentre/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Avgiften för deltagande i provet är 874 danska kronor (129 euro). &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Island\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För isländskt medborgarskap krävs språkkunskaper på A2-nivå. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Island har inget medborgarskapsprov.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tyskland\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För att förvärva tyskt medborgarskap krävs språkkunskaper på B1-nivå.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.xn--einbrgerung-whb.de/fragebogen.php\">https://www.xn--einbrgerung-whb.de/fragebogen.php\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Frågorna i medborgarskapsprovet handlar om livet i en demokrati, historia och samhälle. Man kan förbereda sig för provet med hjälp av frågor på migrationsverkets webbplats. Det är fråga om ett flervalsprov som skrivs på papper. Av de 33 frågorna i provet ska 17 besvaras rätt. En godkänd prestation förutsätter således att 52&nbsp;procent av svaren är korrekta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet gäller inte personer under 16 år. Personer om har avlagt avgångsexamen vid en tysk skola behöver inte delta i provet. Undantag från kravet kan göras på grundval av fysisk eller psykisk sjukdom, funktionsnedsättning eller ålder.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Einbuergerung/einbuergerung-node.html\">https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Einbuergerung/einbuergerung-node.html\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet förvaltas av det federala migrationsverket. Institutionen för utveckling av utbildningens kvalitet, som verkar i anslutning till Humboldt-universitetet i Berlin, sörjer för den tekniska utvecklingen av urvalet av uppgifter i provet. Medborgarskapsprovet kan avläggas vid ett provcenter. Det kostar 25 euro att delta i provet. Deltagarnas identitet kontrolleras innan provtillfället inleds. Minst en övervakare finns på plats. Om en examinand handlar bedrägligt eller försöker fuska, bedöms inte personens prov. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Österrike\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För att förvärva österrikiskt medborgarskap krävs språkkunskaper på B1-nivå.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.staatsbuergerschaft.gv.at/index.php?id=5\">https://www.staatsbuergerschaft.gv.at/index.php?id=5\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Frågorna i medborgarskapsprovet handlar framför allt om samhälle och historia. Läromedel för att förbereda sig för provet finns avgiftsfritt på en webbplats.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.staatsbuergerschaft.gv.at/index.php?id=6\">https://www.staatsbuergerschaft.gv.at/index.php?id=6\u003C/a>\u003C/span>\u003C/span>\u003C/span> Provet har genomförts i form av ett skriftligt flervalsprov. Minst nio av de 18 frågorna måste besvaras korrekt. För en godkänd prestation förutsätts således att 50 procent av svaren är korrekta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Personer under 14 år behöver inte avlägga medborgarskapsprovet. I stället för medborgarskapsprovet kan man lägga fram en utredning över en avlagd kurs i historia och samhällsvetenskaper i årskurs 8. En sökande kan befrias från medborgarskapsprovet på grundval av hälsotillstånd eller funktionsnedsättning, om personen har visat upp ett läkarintyg över grunden för befrielsen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Förbundsländerna svarar för anordnandet av provet. Allmänna frågor om till exempel hela landets historia utarbetas av centralkommittén. Provet förnyades för några år sedan i samarbete med utbildningsavdelningen vid universitetet i Wien och andra sakkunniga.\u003Cspan class=\"AlaviiteKooste\"> Pathways to Citizenship for Foreigners in Austria, s. 44–46 (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://publications.iom.int/books/pathways-citizenship-foreigners-austria\">https://publications.iom.int/books/pathways-citizenship-foreigners-austria\u003C/a>\u003C/span>\u003C/span>\u003C/span> Det tas inte ut någon avgift för att avlägga medborgarskapsprovet. I provet kan användas olika blanketter för att säkerställa att varje deltagare besvarar frågorna självständigt. Vid provtillfället övervakas också att deltagarna genomför provet utan utomstående hjälp eller förbjudna hjälpmedel. Användning av förbjudna metoder i provet leder till att prestationen underkänns. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Nederländerna\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För att förvärva nederländskt medborgarskap krävs språkkunskaper på A2-nivå.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://ind.nl/en/dutch-citizenship/becoming-a-dutch-national-through-naturalisation \\l requirements\">https://ind.nl/en/dutch-citizenship/becoming-a-dutch-national-through-naturalisation#requirements\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I medborgarskapsprovet testas kännedomen om samhället. Provet har genomförts som ett flerurvalsprov. Man kan förbereda sig för provet genom övningsprov eller genom att delta i avgiftsbelagd integrationsutbildning. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">En sökande som har bott i Nederländerna i minst åtta år i 5–16 års ålder eller som har avlagt en examen i Nederländerna kan befrias från medborgarskapsprovet. Undantag från villkoret kan dessutom göras av medicinska skäl.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://ind.nl/en/living-in-the-netherlands-with-a-residence-permit/civic-integration-for-more-secure-residence-permit-and-naturalisation\">https://ind.nl/en/living-in-the-netherlands-with-a-residence-permit/civic-integration-for-more-secure-residence-permit-and-naturalisation\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet förvaltas i Nederländerna av utbildningsverket. Institutionen för bedömning av kunskaperna ansvarar för att utarbeta frågorna i provet. Provet kan avläggas på sex olika orter. Deltagaravgiften för medborgarskapsprovet är 50 euro.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://inburgeren.nl/en/paying-for-integration/\">https://inburgeren.nl/en/paying-for-integration/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Om en examinand agerar bedrägligt vid provtillfället eller orsakar störningar, ogiltigförklaras personens provresultat och dessutom får personen inte delta i medborgarskapsprovet under följande år. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Frankrike\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Tidigare har den språknivå som krävs för franskt medborgarskap varit B1, men i början av 2026 har nivån höjts till B2.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Les-procedures-d-acces-a-la-nationalite-francaise\">https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Les-procedures-d-acces-a-la-nationalite-francaise\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Dessutom har ett nytt medborgarskapsprov nyligen tagits i bruk i Frankrike. Provet innehåller 40 flervalsfrågor, på vilka man ska välja rätt svar bland fyra alternativ. Frågorna handlar om republikens principer och värderingar, institutioner och politiska system, rättigheter och skyldigheter, historia, geografi och kultur samt livet i det franska samhället. Provet avläggs elektroniskt inom 45 minuter. För en godkänd prestation förutsätts att 32 (80 %) av svaren är korrekta. Tidigare genomfördes medborgarskapsprovet i form av en intervju som genomfördes av polisen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Man kan förbereda sig för medborgarskapsprovet genom att bekanta sig med den franska medborgarens rättigheter och skyldigheter samt med hjälp av en medborgarbok\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Le-livret-du-citoyen\">https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Le-livret-du-citoyen\u003C/a>\u003C/span>\u003C/span>\u003C/span> och övningsfrågor. Materialet finns allmänt tillgängligt på webbplatsen. Om medborgarskapsprovet inte kan avläggas på grund av en funktionsnedsättning eller hälsotillståndet, ska ett läkarintyg lämnas in. Om medborgarskapet har förvärvats genom bedrägligt förfarande, kan beslut om förlust av medborgarskap fattas inom två år från det att saken upptäcktes. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förenade kungariket\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För medborgarskap i Förenade kungariket krävs språkkunskaper på B1-nivå.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.gov.uk/english-language\">https://www.gov.uk/english-language\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ämnen i medborgarskapsprovet är bland annat samhälle, historia, offentlig förvaltning, grundlagen och värderingar. Det läromedel som används för provet är en handbok som också finns som ljudfil. Dessutom kan man förbereda sig för provet med hjälp av övningsfrågor på en webbplats. Provet har genomförts som ett flervalsprov, vars frågor väljs slumpmässigt i provsituationen. 18 av de 24 frågorna i provet ska besvaras korrekt. En godkänd prestation förutsätter således att 75&nbsp;procent av svaren är korrekta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Medborgarskapsprov krävs av personer i åldern 18–65 år. Provet behöver dock inte avläggas för att förvärva medborgarskap om en person redan har avlagt provet för att få permanent uppehållstillstånd. Undantag från villkoret kan göras på grund av nedsatt funktionsförmåga till följd av en långvarig fysisk eller psykisk sjukdom, om sökanden har lagt fram ett läkarintyg om grunden för undantaget. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Provet kan avläggas vid över 30 provcenter. Avgiften för deltagande i provet är 50 pund (58 euro). &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förenta staterna\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För medborgarskap i Förenta staterna krävs muntliga och skriftliga kunskaper i engelska.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.uscis.gov/citizenship/learn-about-citizenship/the-naturalization-interview-and-test\">https://www.uscis.gov/citizenship/learn-about-citizenship/the-naturalization-interview-and-test\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Frågorna i medborgarskapsprovet handlar om landets historia och förvaltning. Provet avläggs muntligt och man kan förbereda sig för provet med hjälp av en bok eller övningsfrågor på Medborgar- och Migrationsverkets webbplats. Materialet finns på olika språk. Provet innehåller 20 frågor, varav tolv måste besvaras korrekt.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/2025-civics-test\">https://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/2025-civics-test\u003C/a>\u003C/span>\u003C/span>\u003C/span> En godkänd prestation förutsätter således att 60&nbsp;procent av svaren är korrekta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Undantag från kravet på att avlägga medborgarskapsprovet kan göras på basis av sökandens ålder, boende i landet eller nedsatt funktionsförmåga.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.11&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kanada\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">För att förvärva kanadensiskt medborgarskap krävs muntliga kunskaper i engelska eller franska, vilket innebär att man kan tala och förstå vad som talas på det ena av dessa språk. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Frågorna i medborgarskapsprovet handlar om medborgarnas rättigheter och skyldigheter samt om landets historia, geografi, ekonomi, lagar och symboler. Man kan förbereda sig för provet med hjälp av en avgiftsfri bok. Provet består av flervalsfrågor och rätt/fel-frågor. Av de sammanlagt 20 frågorna ska minst 15 besvaras rätt. En godkänd prestation förutsätter således att 75&nbsp;procent av svaren är korrekta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Medborgarskapsprov krävs av personer i åldern 18–54 år. För icke läs- och skrivkunniga används ett muntligt prov. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.12&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sammanfattning av medborgarskapsproven i olika länder\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Största delen av de jämförelseländer som behandlats ovan använder sig av ett medborgarskapsprov. Frågorna i medborgarskapsproven handlar i de olika länderna ofta inte endast om samhället, utan också om landets historia, geografi och kultur samt om medborgarnas rättigheter och skyldigheter. I de flesta länder har medborgarskapsprovet genomförts i form av ett flervalsprov. De läromedel som används för att förbereda sig för provet finns i många länder avgiftsfritt tillgängliga på webbplatsen för den aktör som sörjer för medborgarskapsprovet. I en del länder finns det också övningsfrågor på webbplatsen. Antalet frågor i medborgarskapsprovet varierar i jämförelseländerna mellan 20 och 45. För en godkänd prestation krävs i de olika länderna att 50–80 procent av svaren är korrekta. Medeltalet för den nedre gränsen för en godkänd prestation är 68&nbsp;procent i de länder som granskats. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I de flesta jämförelseländer är utgångspunkten att det för att förvärva medborgarskap krävs att vuxna sökande avlägger ett medborgarskapsprov. I vissa länder gäller förutsättningen även personer under 18 år. Å andra sidan krävs det inte nödvändigtvis att personer som uppnått en viss ålder avlägger ett medborgarskapsprov. Medborgarskapsprovet kan i de olika länderna också ersättas till exempel med ett annat prov, en examen eller utbildning, till exempel en avgångsexamen från en skola i landet i fråga eller en kurs i samhällsvetenskaper. Utöver ålder kan även sjukdom och funktionsnedsättning i flera länder utgöra en grund för att göra ett undantag från kravet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ansvaret för att genomföra medborgarskapsprovet fördelas i de olika länderna i allmänhet mellan flera aktörer. Den allmänna förvaltningen av provet ankommer ofta på något ämbetsverk. Uppgifter i anslutning till själva provet och dess frågor kan dock skötas av olika aktörer, som eventuellt har sakkunskap om utbildning. Provtillfällena kan ordnas av helt andra aktörer. I flera länder kan medborgarskapsprovet avläggas vid ett provcenter. Deltagaravgiften för provet är oftast några tiotals euro, men i vissa länder överskrider den hundra euro. I vissa länder tas det inte ut någon separat avgift för deltagande i provet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">De olika länderna använder sig av flera metoder för att förebygga missbruk. Provdeltagarnas identitet kontrolleras innan provtillfället inleds. Provfrågorna kan ställas på olika sätt för att säkerställa att varje deltagare besvarar dem självständigt: vid provet används till exempel olika blanketter eller så väljs frågorna i det digitala provet slumpmässigt i provsituationen. Vid provtillfället finns en eller flera övervakare på plats för att se till att deltagarna genomför provet utan utomstående hjälp eller förbjudna hjälpmedel. Om en deltagare i provet agerar bedrägligt eller orsakar störningar, underkänns personens prestation och personen kan förbjudas att delta i ett nytt prov för en viss tid. Om det i efterhand upptäcks att medborgarskapet har förvärvats genom bedrägligt förfarande, kan det fattas beslut om att medborgarskapet förloras. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tabell 8: Innehåll i medborgarskapsprovet i olika länder.&nbsp;\u003C/p>\n      \u003Cdiv id=\"tableID-N10E69\" class=\"table\">\n       \u003Ctable class=\"vaskitgroup\">\n        \u003Ctbody class=\"tbody\">\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Land\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Språkkunskapsnivå\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Ämnesområden i medborgarskapsprovet\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Läromedel\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Provets form\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Sverige&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1 och A2 (förslag)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Samhälle, demokrati, historia, mänskliga rättigheter (förslag)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Lärobok av Skolverket (förslag)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Digitalt prov (förslag) &nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Norge&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1 &nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Samhällslära&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Webbutbildning.&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Digitalt flervalsprov&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Danmark&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B2&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Samhälle, kultur, historia&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Lärobok på webbplatsen&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Flervalsprov, även ja/nej-frågor&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Island&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Tyskland&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Samhälle, historia&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Frågor på ämbetsverkets webbplats&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Flervalsprov på papper&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Österrike&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Samhälle, historia&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Avgiftsfritt läromedel på webbplatsen&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Skriftligt flervalsprov&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Nederländerna&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">A2&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kännedom om samhället&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Övningsprov, integrationsutbildning&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Flervalsprov&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Frankrike&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B2&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Historia, samhälle, kultur, medborgarnas rättigheter och skyldigheter&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Läromedel på webbplatsen, övningsfrågor&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Flervalsprov (tidigare intervju)&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Förenade kungariket&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Samhälle, historia, förvaltning, grundlagen, värderingar&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Handbok (även som ljudfil), övningsfrågor&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Flervalsprov&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Förenta staterna&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Grundnivå&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Landets historia och förvaltning&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Bok och övningsfrågor på webbplatsen&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Muntligt prov&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kanada&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Muntliga färdigheter&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Medborgarnas rättigheter och skyldigheter, landets historia, geografi, ekonomi, lagar, symboler&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Avgiftsfri bok&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Flervalsprov, även rätt/fel-frågor (muntligt prov för icke läskunniga)&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n        \u003C/tbody>\n       \u003C/table>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Remissvar\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Remissbehandling\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Sammanlagt inkom utlåtanden från 43 aktörer om utkastet till proposition. Ett utlåtande gavs av justitieministeriet, finansministeriet, undervisnings- och kulturministeriet, arbets- och näringsministeriet, justitiekanslern i statsrådet, riksdagens justitieombudsman, diskrimineringsombudsmannens byrå, barnombudsmannens byrå, dataombudsmannens byrå, Ålands landskapsregering, Migrationsverket, Utbildningsstyrelsen, Polisstyrelsen, Livskraftscentralen i Nyland, sysselsättnings-, utvecklings- och förvaltningscentret, Helsingfors förvaltningsdomstol, Helsingfors, Esbo, Vanda och Åbo stad, Rektorsrådet för yrkeshögskolorna Arene rf, Helsingfors universitet, Jyväskylä universitet, forskningsinstitutet för utbildning vid Jyväskylä universitet, Åbo universitet, Studentexamensnämnden, Finlands Näringsliv EK, Familia ry, Finlands Dövas förbund rf, Moniheli ry, Synskadades förbund rf, Flyktingrådgivningen rf, Finlands Advokatförbund, Suomi-Seura ry, UNHCR Northern Europe, Handikappforum rf, Flyktingrådgivningen rf, Finlands Advokater, Kyrkostyrelsen, Centralhandelskammaren, Suomen Paluumuuttajayhdistys ry, Fritänkarnas Förbund rf samt en privatperson. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Högsta förvaltningsdomstolen meddelade att den inte ger något utlåtande i ärendet. Social- och hälsovårdsministeriet och Domstolsverket meddelade att de inte har något att uttala sig om.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">En del av remissinstanserna understödde det nya samhällskunskapsvillkoret och medborgarskapsprovet (bl.a. Polisstyrelsen, Vanda stad). Andra ansåg däremot att ändringarna inte var nödvändiga, utan ansåg att de villkor för naturalisation som redan nu finns i lagen är tillräckliga (bl.a. Livskraftscentralen i Nyland, Finlands Advokater, UNHCR). Migrationsverket ansågs vara en lämplig instans för att förvalta det nya medborgarskapsprovet (bl.a. Polisstyrelsen, Åbo stad). Samtidigt ansågs det vara viktigt att trygga tillräcklig finansiering för verket (bl.a. arbets- och näringsministeriet, Helsingfors stad). Den eftersträvade tidtabellen för införandet av medborgarskapsprovet ansågs vara stram (bl.a. justitieministeriet, Utbildningsstyrelsen, Migrationsverket). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Innehållet i samhällsorienteringen ansågs allmänt vara lämpligt även för medborgarskapsprovet (bl.a. undervisnings- och kulturministeriet, barnombudsmannen, Helsingfors universitet). Det uppstod dock frågor om huruvida läromedlet för samhällsorientering lämpar sig för självstudier (bl.a. undervisnings- och kulturministeriet, sysselsättnings-, utvecklings- och förvaltningscentret, Migrationsverket). Det ansågs vara viktigt att läromedlet är allmänt tillgängligt, varaktigt och avgiftsfritt (bl.a. justitieministeriet, Livskraftscentralen i Nyland). Det bedömdes att ett universitet är en lämplig instans för att utarbeta frågorna i medborgarskapsprovet (undervisnings- och kulturministeriet, Finlands Advokater). Det ansågs vara nödvändigt att testa provet innan det införs (bl.a. justitieministeriet, Livskraftscentralen i Nyland, Flyktingrådgivningen rf). Det ansågs också viktigt att säkerställa att det ordnas tillräckligt med provtillfällen (bl.a. justitieministeriet, Livskraftscentralen i Nyland, Helsingfors universitet). I utlåtandena togs dessutom ställning till sökande av ändring gällande provresultatet samt till påföljderna av missbruk i samband med provet (bl.a. justitieministeriet, justitiekanslersämbetet, riksdagens justitieombudsman, Finlands Advokater). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I utlåtandena betonades betydelsen av tillräckligt omfattande specialarrangemang (bl.a. justitieministeriet, Handikappforum rf). I en del av utlåtandena lyfte man fram frågan om hur personer som inte är läs- och skrivkunniga beaktas i genomförandet av medborgarskapsprovet (bl.a. arbets- och näringsministeriet, justitiekanslersämbetet, Migrationsverket, Finlands Advokater). Vissa remissinstanser ansåg att samhällskunskap också kan påvisas genom en högskoleexamen (bl.a. undervisnings- och kulturministeriet, Migrationsverket, Helsingfors universitet) och yrkesutbildning (bl.a. Utbildningsstyrelsen, Polisstyrelsen, Esbo stad). I remissvaren behandlades dessutom bland annat dataskydd (bl.a. justitieministeriet, dataombudsmannen) och betydelsen av tjänster i samband med integrationen (bl.a. diskrimineringsombudsmannen, Åbo stad). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Propositionen bearbetades utifrån remissvaren så att bestämmelserna om innehållet i medborgarskapsprovet, de olika aktörer som deltar i genomförandet av provet och deras uppgifter samt sätt att ersätta medborgarskapsprovet kompletterades. Läromedlet för medborgarskapsprovet samt bestämmelserna om sakkunnigkommissionen och ändringssökandet preciserades. Tidsfristerna för påföljder ändrades. Motiveringarna till undantag från samhällskunskapsvillkoret och specialarrangemang i samband med medborgarskapsprovet preciserades. Även de uppskattade konsekvenserna av förslaget och propositionens förhållande till grundlagen kompletterades. Dessutom gjordes vissa andra preciseringar i propositionen. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rådet för bedömning av lagstiftningen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Rådet för bedömning av lagstiftningen gav den 26 mars 2026 ett utlåtande om utkastet till proposition. Rådet för bedömning ansåg att utkastet till proposition väl uppfyllde kraven i anvisningen om konsekvensbedömning vid lagberedning. Enligt rådet för bedömning var utkastet till propositionen om medborgarskapsprovet tydligt till sin struktur och gav en bra uppfattning om ärendets bakgrund, mål och centrala förslag. I propositionsutkastet hade olika typer av konsekvenser identifierats på ett mångsidigt sätt och konsekvenserna granskades också med tanke på väsentliga målgrupper. I konsekvensbedömningen bör man noggrannare behandla centrala osäkerhetsfaktorer och antaganden i de bedömningar som presenterats, till exempel i fråga om kostnader, omtagande av provet, deltagaravgifter och ansökningsbeteende. I propositionen bör dessutom noggrannare bedömas de praktiska konsekvenserna för sökandena, till exempel kostnader, tidsanvändning, krav på förberedelser och eventuell belastning på grund av att provet måste tas om.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">På basis av utlåtandet från rådet för bedömning har man i allmänhet strävat efter att noggrannare beakta osäkerheten i konsekvensbedömningen. Bedömningarna av konsekvenserna för hushåll kompletterades med observationer om provavgifter, omtagande av prov och tidsanvändningen i anslutning till provet. Även bedömningarna av hur jämställdheten mellan könen samt de grundläggande fri- och rättigheterna och de mänskliga rättigheterna tillgodoses preciserades och åskådliggjordes. I avsnittet om verkställande och uppföljning (10) kompletterades dessutom vilka statistiska uppgifter och andra uppgifter som särskilt ska följas upp efter att lagen trätt i kraft.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Specialmotivering\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Medborgarskapslagen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">3 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Migrationsverkets uppgifter. \u003C/span>I paragrafen föreskrivs det om Migrationsverkets uppgifter i anslutning till medborgarskapslagen. Dessa är enligt 1 mom. beslutande om förvärv, behållande och förlust av finskt medborgarskap samt om bestämmande av medborgarskapsstatus. Dessutom ska verket enligt 2 mom. fastställa formulären för de blanketter som behövs för en medborgarskapsansökan eller en medborgarskapsanmälan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att det till paragrafen fogas ett nytt 3 mom. där det föreskrivs om Migrationsverkets nya uppgifter i anslutning till medborgarskapsprovet. Enligt förslaget är dessa allmän förvaltning, kommunikation, utveckling och tillsyn vad gäller medborgarskapsprovet samt ansvar för helheten av informationssystem, och att ingå avtal som hänför sig till utarbetande och anordnande av medborgarskapsprovet. Enligt förslaget ska Migrationsverket i egenskap av myndighet sköta den allmänna förvaltningen, kommunikationen och helheten av informationssystem när det gäller det nya systemet med medborgarskapsprov och den allmänna tillsynen och utvecklingen av det. Verket ska ingå avtal om utarbetande av medborgarskapsprovet och anordnande av provtillfällen med sådana aktörer som uppfyller de föreslagna villkoren.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverkets myndighetsuppgifter omfattar enligt förslaget allmän kommunikation om medborgarskapsprovet, skötsel av betalningsrörelsen i samband med provet, skötsel av behövliga informationssystem och beslut om eventuella specialarrangemang. Verket ska på sin webbplats informera om det läromedel som används för att förbereda sig för provet, hur man anmäler sig till provet samt hur man styrker sin identitet i samband med provtillfället.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I samband med anmälan tar Migrationsverket ut en avgift för deltagande i provet och beslutar om eventuell återbetalning av avgiften. Bestämmelser om avgiften för deltagande i provet och villkoren för återbetalning av den föreslås i den nya 25 i §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket svarar för den helhet av informationssystem som behövs för provet. Verket ska se till att det i systemet för medborgarskapsprovet finns funktioner för anmälan till medborgarskapsprovet och för betalning av avgiften för deltagande i provet samt funktioner för att avlägga det elektroniska flervalsprovet som utarbetats utifrån läromedlet och för granskning av provprestationerna. Verket ska svara för registreringen av provprestationerna och för utnyttjandet av uppgifterna om provprestationen i samband med behandlingen av medborgarskapsansökningar. Verket ska också se till att de olika skedena i samband med deltagandet i provet genomförs på ett sätt som är tillgängligt för den som avlägger provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket behandlar begäranden om specialarrangemang som behövs vid ett provtillfälle och beslutar om beviljande av eventuella specialarrangemang. Bestämmelser om specialarrangemang föreslås i den nya 25 g §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Som en av Migrationsverkets uppgifter i anslutning till medborgarskapsprovet nämns i lagen tillsyn. Verket ska centraliserat ge dem som anordnar medborgarskapsprovet anvisningar om fastställandet av provdeltagarnas identitet och övervakningen av provtillfället. Om störande eller svikligt förfarande upptäcks under provtillfället ska Migrationsverket utreda fallet och hörandet i anslutning till det. Verket beslutar om eventuellt underkännande av provprestationen. Det beslutar också om ett tillfälligt förbud att delta i provet och ser till att förbudet verkställs genom att till exempel anteckna detta i det informationssystem som används vid anmälan. Bestämmelser om påföljder för brott mot ordningen och svikligt förfarande föreslås i den nya 25 h §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket ansvarar också för utvecklandet av medborgarskapsprovet. Verket har i egenskap av den myndighet som ansvarar för den allmänna förvaltningen av provet och helheten av informationssystem i anslutning till detta tillgång till olika statistiska uppgifter och andra uppgifter som kan utnyttjas vid utvecklandet av provet. För det allmänna utvecklandet av provet ska det enligt förslaget också finnas en sakkunnigkommission, vars ordförande är från Migrationsverket. Bestämmelser om sakkunnigkommissionen föreslås i den nya 25 h §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I lagen nämns också som Migrationsverkets uppgift att avtala om anordnande och utarbetande av medborgarskapsprovet. Enligt förslaget genomförs systemet med medborgarskapsprov delvis genom köpta tjänster som verket skaffar. Utarbetandet av medborgarskapsprovet och anordnandet av provtillfällen avviker till sin natur från andra uppgifter som Migrationsverket har. Därför är det ändamålsenligt att anförtro dessa uppgifter till sådana aktörer som har den sakkunskap som behövs för detta samt lämpliga lokaler och förhållanden.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Verket avtalar om utarbetandet av medborgarskapsprovet och anordnandet av provtillfällen med aktörer som uppfyller vissa villkor. I den köpta tjänst som omfattar utarbetandet av medborgarskapsprovet ingår ett brett urval av provfrågor jämte svarsalternativ samt utarbetandet av läromedlet. De som anordnar provtillfällen ska igen erbjuda lokaler, förhållanden och övervakning som lämpar sig för det elektroniska medborgarskapsprovet. Bestämmelser om utarbetande av medborgarskapsprovet föreslås i den nya 25 b § och bestämmelser om uppgifter för den som utarbetar medborgarskapsprovet i den nya 25 c §. Bestämmelser om anordnande av medborgarskapsprovet föreslås i den nya 25 d § och bestämmelser om uppgifter för den som anordnar provtillfällen i den nya 25 e §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås det också att lagen om behandling av personuppgifter i migrationsförvaltningen ändras så att dess bestämmelser omfattar Migrationsverkets uppgifter i anslutning till det medborgarskapsprov som föreslås och som inbegriper behandling av personuppgifter.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">13 §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Allmänna villkor för naturalisation.\u003C/span> I paragrafen föreskrivs om villkoren för att en utlänning ska beviljas finskt medborgarskap på ansökan. Enligt den gällande lagen ingår i de allmänna villkoren för naturalisation bland annat boendetidsvillkoret, oförvitlighetsvillkoret och språkkunskapsvillkoret.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att det till 1 mom. fogas en ny 7 punkt där det föreskrivs om ett nytt samhällskunskapsvillkor. Momentets 5 och 6 punkter ändras samtidigt tekniskt så att ordet ”och” stryks i 5 punkten och punkten i slutet av 6 punkten ersätts med ett kommatecken varefter ordet ”och” läggs till.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt artikel 6.3 i medborgarskapskonventionen ska varje konventionsstat i sin nationella lagstiftning medge möjlighet till naturalisation för personer som har legalt och varaktigt hemvist inom dess territorium. Vid uppställandet av villkor för naturalisation ska konventionsstaten inte fastställa längre tid än tio år för hemvist som ska ha förflutit innan ansökan kan göras. Enligt motiveringspromemorian till konventionen (s. 9) kan konventionsstaten utöver boendetiden förutsätta till exempel integration för naturalisation. I flera andra länder krävs det att man avlägger ett medborgarskapsprov eller på annat sätt visar motsvarande kunskaper till exempel genom genomförd utbildning för att förvärva medborgarskap. Medborgarskapsproven innehåller i allmänhet olika frågor om samhället. Enligt förslaget läggs samhällskunskapsvillkoret till också som ett villkor för beviljande av finskt medborgarskap på ansökan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I och med det föreslagna villkoret krävs det att kunskap om samhället visas för att förvärva medborgarskap. För att finskt medborgarskap ska kunna beviljas på ansökan behöver den sökande visa att denne har förvärvat grundläggande kunskaper om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Det nya villkoret kompletterar villkoren för naturalisation i den gällande lagen och ger uttryck för tanken att man ska känna till landets centrala förhållanden innan man förvärvar medborgarskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det nya villkoret omfattar kunskap om det finländska samhället och bestämmelser om påvisande av denna kunskap föreslås i den nya 17 b §. Att samhällskunskapsvillkoret uppfylls kan visas bland annat genom att avlägga medborgarskapsprovet med godkänt resultat. Bestämmelser om detta föreslås i det nya 3 a kap. Frågorna i medborgarskapsprovet ska basera sig på det allmänt tillgängliga läromedlet och i provet testas att man behärskar den centrala information som ingår i läromedlet. Villkoret kan således uppfyllas efter att man förberett sig till provet genom att studera medborgarskapsprovets läromedel. Den som är intresserad av att ansöka om medborgarskap kan genom att jämföra sina egna kunskaper med läromedlet också själv bedöma och förutse huruvida villkoret kan uppfyllas.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Den nivå som krävs är enligt förslaget tillräckliga kunskaper. Med detta avses central och grundläggande kunskap om det finländska samhället och om individens rättigheter och skyldigheter. Det är inte fråga om mycket detaljerad kunskap, utan för medborgarskapet är det motiverat att snarare förutsätta sådan kunskap som kan anses behövlig för en kommande finsk medborgare. Såväl läromaterialet för medborgarskapsprovet som de provfrågor som utarbetas på basis av det är av central betydelse med tanke på en lämplig kravnivå.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I villkoret ingår att kunskapen om det finländska samhället ska påvisas på sådan finska eller svenska som förutsätts för att förvärva medborgarskap. I villkoren för naturalisation ingår redan att man ska ha nöjaktig förmåga i finska eller svenska. Kravet är således förenligt med språkkunskapsvillkoret. Det föreslagna medborgarskapsprovet kan avläggas på finska eller svenska. I påvisande av samhällskunskap på annat sätt ingår också ett krav om att det språk som använts i samband med påvisandet är finska eller svenska.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Villkoret ska uppfyllas i enlighet med ordalydelsen i gällande 13 § 1 mom. när ansökan avgörs. I praktiken ska en person som är intresserad av att förvärva medborgarskap först avlägga medborgarskapsprovet, om personen inte redan har avlagt någon annan sådan examen genom vilken man kan visa att samhällskunskapsvillkoret uppfylls. Den som avlagt medborgarskapsprovet med godkänt resultat uppfyller det nya villkoret och är således till denna del redo att ansöka om medborgarskap. Utgångspunkten är densamma som för det språkkunskapsvillkor och de andra villkoren för naturalisation som ingår i den gällande lagen, det vill säga att den sökande ska lämna en ansökan om medborgarskap när villkoren för naturalisation uppfylls. Med tanke på uppfyllandet av samhällskunskapsvillkoret har det i sig ingen betydelse efter hur lång tid från det att medborgarskapsprovet eller student- eller högskoleexamen har avlagts som personen ansöker om medborgarskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">17 b §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Påvisande av samhällskunskap och undantag från samhällskunskapsvillkoret.\u003C/span> Till medborgarskapslagen fogas enligt förslaget en ny 17 b § där det föreskrivs om hur man kan påvisa att det föreslagna samhällskunskapsvillkoret uppfylls, vem som omfattas av samhällskunskapsvillkoret och på vilka grunder man kan avvika från villkoret.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 1 mom. ingår bestämmelser om de sätt på vilka den samhällskunskap som förutsätts för nationalisering kan visas. I 1 mom. 1 punkten föreskrivs det att man kan visa att samhällskunskapsvillkoret uppfylls genom att avlägga ett medborgarskapsprov med godkänt resultat. Bestämmelser om medborgarskapsprovet föreslås i det nya 3 a kap. Bestämmelser om innehållet i medborgarskapsprovet föreslås i den nya 25 a §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 1 mom. 2 punkten föreskrivs det att den kunskap som krävs också kan visas genom en finsk- eller svenskspråkig studentexamen. Studentexamen avläggs ofta som avslutning på en cirka treårig gymnasieutbildning. I gymnasieutbildningen ingår både obligatoriska och valfria studier i samhällslära. Syftet med samhällslära i gymnasiet är att fördjupa den studerandes uppfattning om det omgivande samhället och ge den studerande färdigheter att växa till en aktiv och deltagande medborgare som är intresserad av samhällsfrågor. I värdegrunden för gymnasiets samhällslära betonas de grundläggande utgångspunkterna för demokratin, inklusive jämställdhet och respekt för de mänskliga rättigheterna. Den som avlagt en finsk- eller svenskspråkig studentexamen uppfyller det nya samhällskunskapsvillkoret som föreslås för nationalisering. Samhällskunskapen kan påvisas genom studentexamen avlagd på finska eller svenska också då rätten att avlägga studentexamen grundat sig på 5 § i lagen om studentexamen. Den finsk- eller svenskspråkiga studentexamen ska ha avlagts i Finland.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 3 punkten kan uppfyllandet av villkoret dessutom visas genom en finsk- eller svenskspråkig högskoleexamen, det vill säga en universitets- eller yrkeshögskoleexamen. Av den som avlagt lägre eller högre högskoleexamen på finska eller svenska krävs således inte separat avläggande av medborgarskapsprov. Detta kan för sin del öka Finlands hållkraft när det gäller dem som avlagt högskoleexamen. Att villkoret uppfylls kan ändå inte påvisas genom en högskoleexamen som avlagts på engelska eftersom utgångspunkten för samhällskunskapsvillkoret är att de tillräckliga kunskaperna om samhället ska visas på finska eller svenska. Vid bedömningen är det viktigt huruvida det är fråga om en examen som avlagts inom ett utbildningsprogram på ett nationalspråk där examensspråket är finska eller svenska. I 10 § i universitetslagen och i 13 a § i yrkeshögskolelagen (932/2014) föreskrivs det om avgifter som tas ut för utbildning på främmande språk som leder till examen. Man kan inte visa att det föreslagna samhällskunskapsvillkoret uppfylls genom sådana examina på främmande språk som omfattas av tillämpningsområdet för skyldigheten att betala läsårsavgift.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">När en sökande påvisar den samhällskunskap som krävs genom medborgarskapsprovet, får Migrationsverket information om att provet har avlagts genom sitt eget informationssystem. Uppgifter om student- och högskoleexamen får verket i sin tur via Utbildningsstyrelsens nationella integrationstjänst för studierätter och prestationer (Koski) och den tjänst för utlämnande av studie- och examensuppgifter som fungerar i anslutning till denna. Uppgifter om avlagda studentexamina förvaras i enlighet med 3 kap. i lagen om nationella studie-, utbildnings- och examensregister (884/2017) permanent i studentexamensregistret. I högskolornas riksomfattande datalager som avses i 5 kap. i den lagen lagras igen permanent bland annat uppgifter om examina som avlagts vid högskolorna. Med tanke på uppfyllandet av samhällskunskapsvillkoret har det ingen betydelse efter hur lång tid från det att medborgarskapsprovet eller student- eller högskoleexamen har avlagts som personen ansöker om medborgarskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 2 mom. föreslås bestämmelser om vem samhällskunskapsvillkoret inte gäller. Samhällskunskap förutsätts inte av personer under 18 år. Barn är oftast medsökande i föräldrarnas ansökningar. Dessutom är barn som har sin vanliga vistelseort i Finland läropliktiga tills de fyller 18 år. Således är det inte ändamålsenligt att kräva att personer under 18 år separat ska visa sina samhällskunskaper. Om en medsökande fyller 18 år innan ansökan har avgjorts och kompletterar ansökan så att den gäller honom eller henne själv i enlighet med 25&nbsp;§ i lagen, förutsätts ändå inte visande av samhällskunskaper. Det föreslås att 25&nbsp;§ preciseras till denna del.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Samhällskunskap förutsätts inte heller av sökande som är 65 år eller äldre. Personer som har fyllt 65 år kan få ålderspension 2026. Även om en person som fyllt 65 år fortfarande kan arbeta eller studera, förutsätts det inte att en sökande i denna ålder kan uppvisa samhällskunskap för att förvärva medborgarskap. Denna gränsdragning är förenlig till exempel med bestämmelserna i medborgarskapslagen om försörjningsvillkoret.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 3&nbsp;mom. föreskrivs om de grunder på vilka avvikelse från samhällskunskapsvillkoret kan göras. Syftet med avvikelsen är att göra det möjligt att bevilja medborgarskap i situationer där det inte skäligen kan krävas att den sökande uppfyller samhällskunskapsvillkoret på grund av sitt hälsotillstånd, en funktionsnedsättning eller något annat synnerligen vägande skäl. Genom möjligheten till avvikelse säkerställs det att även sådana sökande som inte har någon faktisk möjlighet att uppfylla det nya samhällskunskapsvillkoret som föreslås i propositionen kan beviljas medborgarskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">En avvikelse från samhällskunskapsvillkoret kan komma i fråga om avläggandet av medborgarskapsprov till exempel på grund av en funktionsnedsättning inte skäligen kan förutsättas ens med hjälp av specialarrangemang. Bestämmelser om specialarrangemang i samband med provet föreslås i den nya 25 g §. Syftet med specialarrangemangen är att sådana saker som sjukdom, funktionsnedsättning eller särskilda läs- och skrivsvårigheter inte ska utgöra ett hinder för avläggande av provet. Genom specialarrangemangen tryggas lika och rimliga möjligheter att avlägga medborgarskapsprovet för dem som är intresserade av att ansöka om medborgarskap. Utgångspunkten är att den samhällskunskap som krävs ska visas, vid behov med hjälp av specialarrangemang. Medborgarskapsprovet jämte behövliga specialarrangemang är ett skede som föregår ansökan om medborgarskap, medan en avvikelse från samhällskunskapsvillkoret kan begäras i samband med medborgarskapsansökan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Förekomsten av eventuella grunder för avvikelse bedöms i situationer där den sökande inte visat att samhällskunskapsvillkoret uppfylls i enlighet med 1&nbsp;mom. och den sökande inte är en sådan person som avses i 2&nbsp;mom. Om den sökande i sin ansökan begär om avvikelse från samhällskunskapsvillkoret, ska man bedöma om det i den sökandes fall finns någon sådan grund för avvikelse som avses i 3 mom.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Avvikelse från samhällskunskapsvillkoret kan göras om det föreligger en sådan grund för avvikelse som hänför sig till den sökandes hälsotillstånd eller funktionsnedsättning och som gör att personen inte kan påvisa att villkoret uppfylls på det sätt som avses i det föreslagna 1&nbsp;mom. Det är således fråga om sådana grunder på vilka man enligt 18 b § 1 mom. 3 punkten kan avvika från språkkunskapsvillkoret. Syftet är att i omfattande utsträckning täcka alla sådana situationer där den sökandes fysiska eller psykiska funktionsförmåga är så pass allvarligt och under en lång tid nedsatt av medicinska skäl att personen inte skäligen kan förväntas uppfylla samhällskunskapsvillkoret. I praktiken är det i synnerhet fråga om att bedöma om den sökande kan avlägga medborgarskapsprovet ens på lång sikt och om den sökandes hälsotillstånd eller funktionsnedsättning är sådan att det även i framtiden är mycket svårt och osannolikt för den sökande att uppfylla villkoret. I vissa situationer kan man utifrån en sådan bedömning komma fram till att det inte är skäligt att kräva att medborgarskapsprovet avläggs, varvid det finns skäl att avvika från samhällskunskapsvillkoret.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Orsaker som hänför sig till hälsotillståndet kan till exempel vara en psykisk eller fysisk kronisk sjukdom, intellektuell funktionsnedsättning, neuropsykiatrisk störning, CP-skada eller långvarig skada orsakad av en yttre faktor. Om den sökande i sin ansökan begär om avvikelse från samhällskunskapsvillkoret på grund av orsaker som hänför sig till hälsotillstånd eller en funktionsnedsättning, ska den sökande som stöd för sin begäran lägga fram en utredning om den sjukdom, funktionsnedsättning eller annan omständighet som hänför sig till hälsotillståndet och som åberopas. I praktiken handlar det om ett utlåtande av den läkare som behandlat sökanden och utlåtandet gäller den sökandes hälsotillstånd eller funktionsnedsättning. Av läkarintyget ska framgå om sökandens sjukdom eller funktionsnedsättning är av sådan karaktär att den under en lång tid hindrar sökanden från att avlägga medborgarskapsprovet. Av intyget ska också framgå på vilket sätt sjukdomen eller funktionsnedsättningen hindrar avläggandet av medborgarskapsprovet. Samma intyg kan innehålla en utredning om grunderna för att avvika från både språkkunskaps- och samhällskunskapsvillkoret.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket bedömer utifrån en medicinsk och eventuell annan utredning om det föreligger en sådan grund att avvika från samhällskunskapsvillkoret som föreskrivs i lagen. Migrationsverket fattar i sista hand beslut om huruvida det i den sökandes fall utifrån alla utredningar som finns tillgängliga är fråga om en sådan i lagen avsedd situation där sökanden på grund av sitt hälsotillstånd eller sin funktionsnedsättning de facto inte kan anses förmå uppfylla samhällskunskapsvillkoret. Om den sökande också åberopar en sådan grund för avvikelse som avses i 18 b § 1 mom. 3 punkten, ska en avvikelse från språkkunskaps- och samhällskunskapsvillkoret i regel bedömas tillsammans.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utöver orsaker som hänför sig till sökandens hälsotillstånd eller funktionsnedsättning kan avvikelse från samhällskunskapsvillkoret göras om det annars finns synnerligen vägande skäl för detta. Grunden är avsedd att tillämpas i sådana exceptionella situationer där det annars skulle bli oskäligt att påvisa samhällskunskapen av andra orsaker som inte beror på sökanden. Syftet med grunden för undantag är att förhindra oskäliga situationer till exempel när det i den sökandes fall utifrån en helhetsbedömning av flera olika omständigheter finns grunder för att avvika från villkoret. Avvikelse på grund av annat synnerligen vägande skäl förutsätter alltid en helhetsprövning som beaktar sökandens särskilda situation. I praktiken kan det finnas synnerligen vägande skäl till avvikelse till exempel i en situation där omständigheter som hänför sig till sökandens hälsotillstånd eller funktionsnedsättning inte som sådana räcker som grund för avvikelse och personen trots flera försök inte har kunnat avlägga medborgarskapsprovet med godkänt resultat.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25&nbsp;§.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Ansökan som är anhängig när den sökande blir myndig. \u003C/span>Paragrafen innehåller bestämmelser för situationer där en person blir myndig medan medborgarskapsansökan är anhängig. En sådan person kan inom skälig tid komplettera ansökan så att den gäller honom eller henne själv, om personen har varit medsökande, eller bekräfta ansökan, om den har gjorts på hans eller hennes vägnar. På en sådan person tillämpas till vissa delar bestämmelserna om barn.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att 3 mom. ändras så att det till det fogas en precisering om tillämpandet av bestämmelserna om samhällskunskapsvillkoret. Om en person på det sätt som avses i paragrafen har kompletterat ansökan så att den gäller honom eller henne själv eller bekräftat den, förutsätts inte att personen påvisar samhällskunskaper för att förvärva medborgarskap. Samhällskunskapsvillkoret gäller således inte personen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">3 a kap. Medborgarskapsprov\u003C/span>&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget fogas ett nytt 3 a kap. till lagen. I kapitlet föreskrivs det om det nya medborgarskapsprovet och dess genomförande, såsom innehållet i medborgarskapsprovet, utarbetandet och anordnandet av det samt om uppgifterna för den som utarbetar och anordnar provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 a §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Medborgarskapsprovets innehåll. \u003C/span>Enligt förslaget fogas en ny 25 a § till medborgarskapslagen. I den föreskrivs om medborgarskapsprovets innehåll. Att avlägga medborgarskapsprov skulle enligt förslage
