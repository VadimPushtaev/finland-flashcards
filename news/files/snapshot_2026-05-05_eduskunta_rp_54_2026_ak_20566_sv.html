vutettavuusseloste",contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/tietoa-sivustosta/saavutettavuusseloste/",expanded:{contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/tietoa-sivustosta/saavutettavuusseloste/",expanded:null},name:"Saavutettavuusseloste",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"saavutettavuusseloste",url:"/tietoa-sivustosta/saavutettavuusseloste/",changed:null,created:null,startPublish:"2026-03-19T07:20:56Z",stopPublish:null,saved:null,status:null,teaserTitle:"Saavutettavuusseloste",teaserText:"Eduskunta haluaa taata kaikille yhdenvertaisen mahdollisuuden asioida sähköisissä palveluissaan. Verkkosivustoa koskee laki digitaalisten palvelujen tarjoamisesta, jonka mukaan julkisten verkkopalvelujen tulee olla saavutettavia. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Tietosuojaselosteet",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/tietoa-sivustosta/tietosuojaselosteet/",expanded:{contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/tietoa-sivustosta/tietosuojaselosteet/",expanded:null},name:"Tietosuojaselosteet",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"tietosuojaselosteet",url:"/tietoa-sivustosta/tietosuojaselosteet/",changed:null,created:null,startPublish:"2025-04-03T11:57:48Z",stopPublish:null,saved:null,status:null,teaserTitle:"Tietosuojaselosteet",teaserText:"Eduskunnan tietosuojaselosteissa kerrotaan muun muassa henkilötietojen käsittelyn tarkoituksesta, mihin tietoja säännönmukaisesti luovutetaan, miten kauan henkilötietoja säilytetään.",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/tietoa-sivustosta/sivukartta/",title:null,target:null,text:"Sivukartta",contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/tietoa-sivustosta/sivukartta/",expanded:{contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/tietoa-sivustosta/sivukartta/",expanded:null},name:"Sivukartta",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sivukartta",url:"/tietoa-sivustosta/sivukartta/",changed:null,created:null,startPublish:"2026-03-19T11:01:19Z",stopPublish:null,saved:null,status:null,teaserTitle:"Sivukartta",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"",contentLink:"18"},{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"",contentLink:"1796"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1659"},{children:[],relatedContent:[],name:"Eduskunnan EU-sihteeristö",teaserText:"EU-sihteeristö tukee kansanedustajien yhteydenpitoa suomalaisiin ja muihin Euroopan parlamentin jäseniin sekä muihin keskeisiin EU-toimijoihin.",url:"/asiat-ja-aanestykset/eu-asiat/eduskunnan-eu-sihteeristo/",selected:false,targetFrame:"",contentLink:"1415"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. \nVanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/asiat-ja-aanestykset/",selected:false,targetFrame:"",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. ",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"",contentLink:"64"}],relatedContent:[{children:[],relatedCont .85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden\">Riksdagsärenden\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/RP%2054%2F2026%20rd\">RP 54/2026 rd\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Handlingar\u003C/span>\u003C/li>\n    \u003C/ol>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n   \u003Cspan class=\"ViimeksiJulkaistu\">Senast publicerad:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">4.5.2026 | 18:35\u003C/span>\n  \u003C/div>\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Regeringens proposition\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;RP&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">54\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 rd&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Regeringens proposition till riksdagen med förslag till lag om ändring av medborgarskapslagen och till lagar som har samband med den\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv id=\"SisaltoKuvaus\" class=\"SisaltoKuvaus\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">PROPOSITIONENS HUVUDSAKLIGA INNEHÅLL\u003C/h2>\n   \u003Cp class=\"KappaleKooste\">I denna proposition föreslås det att medborgarskapslagen, lagen om Migrationsverket och lagen om behandling av personuppgifter i migrationsförvaltningen ändras.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Syftet är att revidera medborgarskapslagen i enlighet med regeringsprogrammet för statsminister Petteri Orpos regering genom att skärpa villkoren för naturalisation. Syftet är att befästa utgångspunkten att förvärv av medborgarskap förutsätter bevis på lyckad integration i samhället. Genom propositionen strävar man efter att främja att de utlänningar som är intresserade av ett finskt medborgarskap sätter in sig i hur samhället fungerar och i sådana centrala grundprinciper som stöder ett aktivt deltagande i samhället och som behövs för att fungera i samhället.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt villkor för naturalisation. Enligt villkoret ska sökanden visa en tillräcklig nivå av samhällskunskap för att förvärva finskt medborgarskap. Utgångspunkten är att villkoret uppfylls genom att avlägga ett medborgarskapsprov med godkänt resultat. I provet mäts kunskaperna om hur det finländska samhället fungerar och dess grundprinciper samt kunskaperna om individens rättigheter och skyldigheter. I vissa fall kan man också visa att villkoret uppfylls genom studier som genomförts i Finland.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">För medborgarskapsprovet utvecklas ett helt nytt provsystem, vars genomförande förutsätter ny lagstiftning. Enligt förslaget svarar Migrationsverket för myndighetsuppgifterna i anslutning till medborgarskapsprovet. Det är fråga om ett allmänt förvaltningsansvar av systemet med medborgarskapsprov. I detta ingår förutom tillsyn och utveckling ingående av avtal som hänför sig till utarbetandet och ordnandet av medborgarskapsprovet med de i propositionen föreslagna aktörer som uppfyller villkoren.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Enligt förslaget fogas ett nytt kapitel till medborgarskapslagen. I kapitlet föreskrivs närmare om det nya medborgarskapsprovet och dess genomförande, såsom innehållet i medborgarskapsprovet, utarbetandet och anordnandet av det samt om uppgifterna för den som utarbetar och anordnar provet.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">De föreslagna lagarna avses träda i kraft vid ingången av 2027. &nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv class=\"PerusteluOsaPerustelut\" id=\"PerusteluOsaPerustelut\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">MOTIVERING\u003C/h2>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Bakgrund och beredning\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Bakgrund\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">I regeringsprogrammet för statsminister Petteri Orpos regering ”Ett starkt och engagerat Finland 20.6.2023” finns flera skrivningar om ändring av villkoren för naturalisation (10; En trygg och kristålig rättsstat; 10.3; Invandrings- och integrationspolitiken, s. 208). Enligt regeringsprogrammet är finskt medborgarskap inte någonting man får automatiskt, utan förutsättningen för det är en lyckad integration. Enligt programmet ska medborgarskapslagen (359/2003) revideras så att villkoren för naturalisation skärps. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">De åtgärder i regeringsprogrammet som gäller medborgarskapslagen genomförs stegvis i tre separata projekt vid inrikesministeriet (SM034:00/2023, SM055:00/2023 och SM056:00/2023). I det första skedet genomfördes ändringarna gällande boendetidsvillkoret enligt regeringsprogrammet i medborgarskapslagen (RP&nbsp;27/2024&nbsp;rd, GrUU&nbsp;16/2024&nbsp;rd, FvUB&nbsp;14/2024 rd). Riksdagen godkände lagförslaget i regeringens proposition den 1 juli 2024 (RSv&nbsp;65/2024&nbsp;rd). Lagen trädde i kraft den 1 oktober 2024. I det andra skedet genomfördes de ändringar i medborgarskapslagen enligt regeringsprogrammet som gällde identitet, den nationella säkerheten, oförvitlighet och försörjningsvillkoret samt förlust av medborgarskap (RP 19/2025 rd, GrUU 25/2025 rd, FvUB 19/2025 rd). Riksdagen godkände ändringarna i medborgarskapslagen den 15 oktober 2025 (RSv 96/2025 rd). Lagen trädde i kraft den 17 december 2025. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Denna proposition om det tredje skedet av ändringar i medborgarskapslagen innehåller förslag till genomförande av skrivningen om ett medborgarskapsprov i regeringsprogrammet. Ett mål i regeringsprogrammet är att som villkor för naturalisation införa ett krav på ett godkänt medborgarskapsprov.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Beredning\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Beslutet om att tillsätta projekt för att revidera medborgarskapslagen fattades den 16 oktober 2023.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://intermin.fi/-/kansalaisuuslain-uudistaminen-kaynnistyy-sisaministeriossa\"> https://intermin.fi/-/kansalaisuuslain-uudistaminen-kaynnistyy-sisaministeriossa?languageId=sv_SE\u003C/a>\u003C/span>\u003C/span>\u003C/span> Projektet för det tredje skedet av ändringarna i medborgarskapslagen tillsattes för tiden 16 oktober 2023–30&nbsp;juni 2025. Den 28 maj 2025 beslutade man att förlänga projektets mandatperiod till den 31 mars 2026. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Som en del av projektet för det tredje skedet tillsatte inrikesministeriet den 29 november 2023 en tväradministrativ arbetsgrupp för att utreda införandet av medborgarskapsprovet.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/d3645e65-367e-408a-b895-084517e18f35/ASETTAMISPAATOS_20231129110128.PDF\">https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/d3645e65-367e-408a-b895-084517e18f35/ASETTAMISPAATOS_20231129110128.PDF\u003C/a>\u003C/span>\u003C/span>\u003C/span> Arbetsgruppens mandatperiod var den 29 november 2023–31 maj 2024. Arbetsgruppen bestod förutom av inrikesministeriet även av representanter för arbets- och näringsministeriet, undervisnings- och kulturministeriet, Migrationsverket, Polisstyrelsen, Utbildningsstyrelsen, närings-, trafik- och miljöcentralen i Nyland, Finlands Kommunförbund och nätverket av C6-städer. Dessutom hörde arbetsgruppen utomstående sakkunniga.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Arbetsgruppen hade i uppgift att göra en utredning om hur det medborgarskapsprov som förutsätts för naturalisation kan genomföras i Finland. Arbetsgruppen fick i uppgift att kartlägga olika alternativ i fråga om vilken instans som ska förvalta medborgarskapsprovet och hurdant medborgarskapsprov som ska tas i bruk. Dessutom hade arbetsgruppen i uppgift att utreda vilka åtgärder som är effektiva i anslutning till genomförandet av medborgarskapsprovet i praktiken och de praktiska arrangemangen samt hur medborgarskapsprovet har genomförts i de jämförelseländer som är centrala för Finland. Arbetsgruppen skulle också bedöma medborgarskapsprovets förhållande till språkkunskapsvillkoret som är ett villkor för naturalisation. Arbetsgruppens utredning offentliggjordes den 19 februari 2025.\u003Cspan class=\"AlaviiteKooste\"> Inrikesministeriets publikationer 2025:5 ()\u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"http://urn.fi/URN:ISBN:978-952-324-974-5\">http://urn.fi/URN:ISBN:978-952-324-974-5\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Propositionen har beretts som tjänsteuppdrag vid inrikesministeriets migrationsavdelning. I beredningen har man utnyttjat ovan nämnda utredning som utarbetats av den tväradministrativa arbetsgruppen. Beredningen gjordes i nära samarbete med Migrationsverket. Även undervisnings- och kulturministeriet, arbets- och näringsministeriet och Utbildningsstyrelsen har hörts under beredningen samt under den fortsatta beredningen dessutom justitieministeriet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Propositionsutkastet sändes på remiss mellan den 19 december 2025 och den 6 februari 2026. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ett utlåtande begärdes av följande instanser: justitieministeriet, finansministeriet, undervisnings- och kulturministeriet, arbets- och näringsministeriet, social- och hälsovårdsministeriet, justitiekanslern i statsrådet, riksdagens justitieombudsman, diskrimineringsombudsmannens byrå, barnombudsmannens byrå, dataombudsmannens byrå, Ålands landskapsregering, Migrationsverket, Utbildningsstyrelsen, Polisstyrelsen, Närings-, trafik- och miljöcentralen i Nyland, utvecklings- och förvaltningscentret för närings-, trafik- och miljöcentralerna UF-centret, Domstolsverket, högsta förvaltningsdomstolen, Helsingfors, Tavastehus, Östra Finlands, Norra Finlands, Åbo och Vasa förvaltningsdomstolar, Finlands Kommunförbund, nätverket av C6-städer, Helsingfors, Östra Finlands, Jyväskylä, Lapplands, Tammerfors och Åbo universitet, Åbo Akademi, Rektorsrådet för Finlands universitet UNIFI rf, Rektorsrådet för yrkeshögskolorna Arene rf, Amnesty International Finlands Avdelning, Finlands Näringsliv EK, Delegationen för etniska relationer Etno, Familia ry, Ihmisoikeusliitto, Finlands Dövas förbund rf, Moniheli ry, Synskadades förbund rf, Flyktingrådgivningen rf, Finlands Advokater, Suomi-Seura ry, UNHCR Northern Europe och Stödcentret för funktionshindrade invandrare Hilma. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Rådet för bedömning av lagstiftningen gav ett utlåtande om utkastet till proposition den 26 mars 2026.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Remissvaren behandlas närmare i avsnitt 6 i propositionen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Beredningsdokumenten för propositionen finns till påseende på inrikesministeriets webbplats på adressen \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://intermin.fi/hankkeet/hankesivu?tunnus=SM056:00/2023\">https://intermin.fi/sv/projekt-och-lagberedning/projektsida?tunnus=SM056:00/2023\u003C/a>\u003C/span>\u003C/span>. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Nuläge och bedömning av nuläget\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Allmänt\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Bestämmelser om finskt medborgarskap finns i Finlands grundlag medan närmare bestämmelser finns i medborgarskapslagen. I medborgarskapslagen föreskrivs det om förutsättningarna för att förvärva, behålla eller förlora finskt medborgarskap samt om förfarandet vid behandlingen av ett sådant ärende. Syftet med medborgarskapslagen är att reglera förvärv och förlust av finskt medborgarskap med beaktande av såväl privatpersoners som statens intressen, förhindra och minska statslösheten samt genomföra och främja principerna för god förvaltning och rättsskydd vid behandlingen av och beslutsfattandet i ärenden som gäller medborgarskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Finskt medborgarskap kan förvärvas vid födseln, genom föräldrarnas medborgarskap, på ansökan eller efter anmälan. Med naturalisation avses enligt etablerad praxis finskt medborgarskap som söks på ansökan. Det handlar om hur en utländsk medborgare som är permanent bosatt i Finland på ansökan kan förvärva finskt medborgarskap och vilka förutsättningar personen ska uppfylla. Ansökningsförfarandet är möjligt för alla utlänningar som bor i Finland. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapet kan allmänt anses definiera en ram som bidrar till att gestalta individens koppling till samhället bland annat genom rättigheter, skyldigheter, roller och ansvar, och därtill kan medborgarskapet ur individens synvinkel stärka känslan av samhörighet med samhället. I medborgarskapslagen definieras medborgarskap som ett rättsligt förhållande mellan individen och staten som anger individens ställning i staten och med hjälp av vilket de viktigaste rättigheterna och skyldigheterna i förhållandet mellan individen och staten bestäms. Allmänt taget kan de rättigheter och skyldigheter som förknippas med medborgarskapet grunda sig på statens nationella lagstiftning och därmed variera från stat till stat, eller till exempel Europeiska unionens rätt och därmed vara gemensamma för alla medborgare i unionens stater. Ansökan om medborgarskap grundar sig alltid på frivillighet och individens egen bedömning av betydelsen av ett medborgarskap i den stat där personen i fråga bor. Medborgarskap kan anses visa att staten har förtroende för individen och för att han eller hon har tillräckliga färdigheter att agera självständigt och fullt ut i samhället.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det finska medborgarskapets rättsliga betydelse har minskat när man jämför individens rättigheter mellan statens egna medborgare och andra personer, eftersom de grundläggande fri- och rättigheterna till följd av reformen av de grundläggande fri- och rättigheterna som trädde i kraft 1995 i princip tillhör alla som vistas i Finland. Medborgarskapet utgör dock fortfarande ett viktig anknytning mellan individen och staten, och ur individens synvinkel kan medborgarskapet anses vara såväl ett juridiskt och som ett faktiskt viktigt förhållande. Medborgarskapet förknippas med betydande rättigheter och skyldigheter och det definierar fortfarande till exempel en del av val- och deltagarrättigheterna. I och med medborgarskapet godkänns individen som fullvärdig medlem av samhället och kan då i högre grad än tidigare delta i den politiska, samhälleliga och ekonomiska verksamheten i den mottagande staten.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I medborgarskapsregleringen ska förutom individens intresse även statens intresse beaktas, och staten kan därmed fastställa sådana villkor för förvärv av medborgarskap som staten anser vara ändamålsenliga när den bestämmer vem som kan beviljas medborgarskap. Till exempel permanent boende i landet, iakttagande av samhällets regler samt självständigt deltagande i samhället kan anses vara centrala faktorer till exempel med tanke på möjligheterna att skaffa en egen försörjning och språkstudier. Likaså kan det anses ligga i statens intresse att säkerställa att personerna är tillräckligt medvetna om bland annat de centrala grundprinciperna i sitt bosättningsland samt om de rättigheter och skyldigheter som tillkommer dem som medborgare i landet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Såsom ovan konstaterats kan det föreskrivas om olika villkor för att få medborgarskap och som har ett nära samband med integrationen. Man kan närma sig kopplingen mellan regleringen av förvärv av medborgarskap och integrationen ur olika synvinklar. Det handlar bland annat om i vilken utsträckning statens intresse betonas i naturalisationen. Förhållandet mellan naturalisations- och integrationspolitiken har behandlats närmare i den tidigare regeringspropositionen om medborgarskapslagen (RP&nbsp;19/2025 rd, s. 6–9). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utgångspunkten för de reformer som görs i medborgarskapslagen är att krävs en lyckad integration för att förvärva finskt medborgarskap, varvid medborgarskap kan beviljas som ett resultat av den integrationsprocess som eftersträvas. För att förvärva medborgarskap ska personen påvisa att han eller hon engagerar sig i samhället bland annat genom att skaffa sig sådana kunskaper och färdigheter som anses förutsättas av en fullvärdig medlem i samhället. I förslagen i denna proposition betonas särskilt förtrogenhet med det finländska samhället och kännedom om de viktigaste grundprinciperna i samhället.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Samhällskunskap som ett villkor för naturalisation\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Villkor för naturalisation\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Bestämmelser om de allmänna villkoren för naturalisation, dvs. beviljande av medborgarskap på ansökan, finns i 13 § i medborgarskapslagen. En utlänning beviljas på ansökan finskt medborgarskap, om han eller hon när ansökan avgörs 1) har fyllt 18 år, 2) har och har haft sitt egentliga bo och hemvist i Finland de senaste åtta åren (\u003Cspan class=\"KursiiviTeksti\">boendetidsvillkor\u003C/span>), 3) inte har gjort sig skyldig till någon annan straffbar gärning än en sådan för vilken straffet är ordningsbot och inte heller har meddelats besöksförbud (\u003Cspan class=\"KursiiviTeksti\">oförvitlighetsvillkor\u003C/span>), 4) inte väsentligt har försummat sin underhållsskyldighet eller sina offentligrättsliga betalningsförpliktelser, 5) har tryggad försörjning (\u003Cspan class=\"KursiiviTeksti\">försörjningsvillkor\u003C/span>), och 6) har nöjaktig förmåga att i tal och skrift använda finska eller svenska eller i stället har motsvarande kunskaper i finskt eller finlandssvenskt teckenspråk (\u003Cspan class=\"KursiiviTeksti\">språkkunskapsvillkor\u003C/span>). &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Genom de olika villkoren för naturalisation visar de sökande i praktiken att de har förmåga att fungera självständigt i samhället och anpassa sig till det finländska samhället. Kravet på boendetid återspeglar att den sökande är permanent bosatt i Finland och under boendetiden skaffar sig personer färdigheter att leva i det finländska samhället. Språkkunskaperna är en viktig del av integrationen och när de ökar blir möjligheterna till sysselsättning, utbildning och annat deltagande i det finländska samhället lättare och snabbare. Oförvitlighet innebär att den sökande inte bedriver någon kriminell verksamhet som kan skada samhället och att den sökande följer samhällets regler. Syftet med kravet på försörjning är att den sökande ska kunna försörja sig själv ekonomiskt utan att i betydande grad ty sig till stöd från samhället.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Genom de olika villkoren för naturalisation enligt den gällande medborgarskapslagen säkerställs att personer som förvärvar medborgarskap kan agera ansvarsfullt och självständigt i samhället. Bland villkoren för naturalisation saknas dock ett villkor som berör sökandens kännedom om det finländska samhället och som den sökande för att uppfylla har varit tvungen att sätta sig in i central och grundläggande information om det finländska samhället. Med samhälls- eller medborgarkunskap (civic knowledge) avses allmänt kännedom om och förståelse för samhälleliga frågor samt rättigheter och skyldigheter.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enbart uppfyllande av kravet på samhällskunskap kan i sig inte anses vara det enda beviset på integration till exempel med tanke på hur väl den sökande lyckas sysselsätta sig eller delta i samhällelig verksamhet. Med hjälp av kravet på samhällskunskap kan man dock mäta om den sökande har tillägnat sig kunskaper och färdigheter som är centrala ur ett samhälleligt perspektiv och som hänför sig till integration och verksamhet inom olika delområden av samhället. Kravet på att påvisa samhällskunskap är därmed ett sätt att säkerställa att personer som ansöker om medborgarskap är förtrogna med och engagerade i samhället och dess grundläggande värderingar, lagar och verksamhetssätt. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ur individens synvinkel kan kravet på att påvisa samhällskunskap uppmuntra personer att sätta sig in i de kunskaper och färdigheter som är centrala för att fungera i samhället, vilket i sin tur stöder delaktigheten i samhället. På så sätt uppmuntras invandrare att djupare än tidigare bekanta sig med bland annat de samhälleliga strukturerna, lagarna och allmän praxis i sitt bosättningsland samt landets historia, kultur och seder. Insikt i vilka rättigheter och skyldigheter som följer av medborgarskapet kan också anses vara central bland annat med tanke på utövandet av den rösträtt som medborgarskapet ger. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Som konstaterats innehåller bestämmelserna om förvärv av medborgarskap inget krav på samhällskunskap. Därför är det nödvändigt att se över lagstiftningen så att man genom de olika villkoren för naturalisation kan beakta den sökandes integration i Finland på ett mer heltäckande sätt än i nuläget. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Utredningar om ämnet\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Inrikesministeriets utredning av införande av ett medborgarskapsprov\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">En arbetsgrupp som leddes av inrikesministeriet konstaterade i sin utredning att syftet med medborgarskapsprovet är att stärka integrationen av personer som ansöker om medborgarskap genom att mäta deras kunskaper om samhället, lagar och regelefterlevnad samt värderingar. Medborgarskapsprovet fungerar enligt utredningen som en konsekvent fortsättning på den samhällskunskap som tillhandahålls i samhällsorientering, integrationsutbildning och andra utbildningsformer avsedda för invandrare. Arbetsgruppen ansåg det vara viktigt att den som ansöker om medborgarskap vet hur samhället fungerar, vad en rättsstat är och vilka rättigheter och skyldigheter personer som bor i Finland har och att personen på ett allmänt plan känner till de mest centrala myndigheternas roller. Arbetsgruppen ansåg att det är viktigt att känna till de värderingar som råder i samhället samt frågor som berör säkerheten i samhället. Dessutom ansåg arbetsgruppen att det är väsentligt att den som förvärvar medborgarskap respekterar de grundläggande fri- och rättigheterna och de mänskliga rättigheterna samt förbinder sig att följa Finlands lagstiftning och inte utgör ett hot mot säkerheten i samhället (s. 44–45).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ett objekt som granskades i utredningen om medborgarskapsprovet var vilka frågor medborgarskapsprovet borde innehålla. Arbetsgruppen framförde som sin uppfattning att frågorna i medborgarskapsprovet ska återspegla vad man vill att den sökande ska förstå och kunna. På så sätt kan man med hjälp av frågorna mer genuint mäta den sökandes kunskaper om och förståelse för det finländska samhället och hur saker och ting fungerar här och varför man agerar på ett visst sätt. Frågorna i medborgarskapsprovet handlar således snarare om att behärska saker som hör till allmänbildningen än om att behärska mycket detaljerad information. Arbetsgruppen framförde också som sin åsikt att frågorna skulle kunna styra invandrare att i högre grad följa med det finländska samhället och nyheter i det. På så sätt skulle medborgarskapsprovet motivera och uppmuntra invandrare att sätta sig in i verksamheten i samhället (s. 44–45).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Nedan listas de ämnesområden som arbetsgruppen anser vara centrala och som frågorna i medborgarskapsprovet skulle kunna beröra (s. 45–47):&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">1) Grundläggande fri- och rättigheter och mänskliga rättigheter. Den som integreras ska veta att alla är jämlika i samhället och att ingen får diskrimineras på grund av ålder, kön, religion eller någon annan omständighet som gäller den enskilde som person. Den som integreras bör också känna till den finländska jämställdheten och kvinnornas rättigheter i familjen, på offentliga platser och i arbetslivet. Samhället skyddar minoriteter (inklusive könsminoriteter och sexuella minoriteter) och utsatta personer, bland annat barn. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">2) Samhällskunskap. Den som integreras ska vara förtrogen med samhället och veta hur samhället fungerar. Frågorna i provet kan handla om demokrati, det politiska systemet, påverkningsmöjligheter, medborgarnas rättigheter och skyldigheter, rättsstaten, lagstiftningen och de mest centrala myndigheternas roller. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">3) Historia och geografi. Arbetsgruppen ansåg att en person som integrerats på ett allmänt plan borde känna till de viktigaste fakta i Finlands historia och geografi. Frågorna kan handla om samhällets utveckling, självständighet, krig, viktiga händelser och personer. Kännedom om ämnesområdet hjälper invandrare att förstå hur det finländska samhället är uppbyggt och hur det har utvecklats till det nuvarande. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">4) Vardagskunskap. Arbetsgruppen ansåg det vara viktigt att den som ansöker om medborgarskap har grundläggande kunskaper om boende, hälso- och sjukvård, arbetsliv, beskattning, utbildning och studiemöjligheter. Till vardagskunskaperna hör hur man ska agera i sjukdomsfall samt i farliga situationer och nödsituationer. I vardagskunskaperna kan också inkluderas frågor om till exempel trafikkulturen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">5) Seder och värderingar. Arbetsgruppen ansåg att kännedom om finländska seder och traditioner är ett delområde i integrationen. Kännedom om finländska seder och traditioner bygger upp och stärker känslan av samhörighet med det finländska samhället och ökar på så sätt den allmänna trygghetskänslan. Frågor kring ämnet kan handla om seder och bruk, helger med tillhörande seder och varför man firar vissa fester. Det ansågs vara ett viktigt krav att invandrare känner till och tillägnar sig de centrala värderingar i det finländska samhället som framgår av grundlagen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">6) Säkerhet. Arbetsgruppen ansåg att ämnet är viktigt, men samtidigt konstaterades det vara omfattande eftersom termen används i flera sammanhang, till exempel när man hänvisar till militär säkerhet, säkerhet i samhället, förebyggande av olyckor och farliga situationer, arbetssäkerhet, livsmedelssäkerhet, trafiksäkerhet, cybersäkerhet och nationell säkerhet. Frågor som handlar om att identifiera faktorer som hotar säkerheten i samhället kan komma fram i andra frågor inom de ämnesområden som arbetsgruppen identifierat och som berör individens skyldigheter (bl.a. skyldigheten att försvara landet), grundläggande fri- och rättigheter och mänskliga rättigheter, jämlikhet, samhällets och rättssystemets funktion i Finland samt medvetenhet om polisens verksamhet.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">7) Digitala färdigheter. Arbetsgruppen diskuterade också om ett av temana i medborgarskapsprovet borde vara förmågan att fungera i ett samhälle som digitaliseras.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Såsom konstaterats ovan hörde den arbetsgrupp som utreder införandet av ett medborgarskapsprov också utomstående sakkunniga. Även i dessa samråd med sakkunniga identifierades vilken betydelse samhällskunskap har (s. 17–19). Det konstaterades att integration kräver att personen själv är aktiv. Det ansågs viktigt att upprätthålla förtroendet för myndigheternas verksamhet, även om myndighetsprocesserna tidvis kan kännas avlägsna ur individens perspektiv. Med tanke på detta vore det bra om invandrare hade djupare kännedom om samhällets strukturer och de principer som styr myndigheternas verksamhet. Det ansågs också viktigt att invandrare får information om allvarliga problem som till exempel arbetsrelaterat utnyttjande och tvångsäktenskap samt vilka åtgärder som vidtas mot dessa fenomen i Finland. Vid samråden lyftes dessutom upp bland annat kännedom om saker som gäller försvaret och värnplikten och att det vore bra om personer som ansöker om finskt medborgarskap hade grundläggande kunskaper om Finlands försvars- och värnpliktssystem. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Forskningsdata\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I vissa undersökningar har man behandlat villkoren för att förvärva medborgarskap, inklusive samhällskunskapsvillkoret och medborgarskapsprovet. Teman för undersökningen har bland annat varit vilken inverkan de krav som ställs för att förvärva medborgarskap har haft på ansökan och erhållande av medborgarskap. Det har observerats att det finns ett samband mellan villkoren för att förvärva medborgarskap och integrationen. Till exempel sådana omständigheter i anslutning till medborgarskapet som medborgarskapsprovet och handläggningsavgifterna påverkar viljan att ansöka om medborgarskap.\u003Cspan class=\"AlaviiteTeksti\"> Gathmann &amp; Garbers 2022: Citizenship and integration, IZA Discussion Papers, s. 34. De nya villkorens och det nya provets inverkan på ansökan om och erhållande av medborgarskap behandlas dessutom nedan i samband med bedömningen av propositionens konsekvenser (4.2). \u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Härnäst granskas forskningsdata särskilt med tanke på vad som är motiverat att ta i beaktande när medborgarskapsprovet införs. Medborgarskapsproven kan bedömas både med tanke på hur de genomförs och deras innehåll. Det kan till exempel anses vara av betydelse att deltagarna har rimliga möjligheter att förbereda sig för provet och att provet inte handlar om att bedöma deltagarnas individuella värderingar och övertygelser. Medborgarskapsproven kan bli problematiska om det fastställs en för hög kravnivå. Med tanke på förberedelserna inför provet är det viktigt att de läromedel som används är allmänt tillgängliga till exempel på en webbplats och att de rätta svaren på provfrågorna framgår av informationen i läromedlet. Det är också viktigt att nivån på kostnaderna för att delta i provet hålls skälig.\u003Cspan class=\"AlaviiteTeksti\"> Bauböck &amp; Joppke (red.) 2010: How liberal are citizenship tests? EUI Working Papers 2010/41, s. 1. \u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kunskaper i landets språk, om grundläggande principer och om de viktigaste historiska händelserna kan allmänt anses vara godtagbara krav för personer som ansöker om medborgarskap. I medborgarskapsprov kan vanligtvis krävas sådana kunskaper som personer som är permanent bosatta i landet inhämtar och lär sig. Medborgarskapsprovet ska genomföras så att provet och frågorna i det inte kränker till exempel deltagarnas åsiktsfrihet. Kunskapsbaserade medborgarskapsprov, vare sig de gäller landets historia, kultur eller värderingar, kan anses motiverade ur denna synvinkel, eftersom man kan lära sig och använda den information som krävs för att svara på frågorna i provet. Ett standardiserat och formbundet medborgarskapsprov kan anses vara ett mer förutsägbart alternativ än en individuell och behovsprövad intervju.\u003Cspan class=\"AlaviiteTeksti\"> Bauböck &amp; Joppke 2010, s. 1–4. \u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Genom medborgarskapsprovet kan man testa till exempel tillägnandet av sådana omständigheter i den lokala historien som är viktiga med tanke på deltagandet i det lokala politiska samfundet. På så sätt kan man ställa sådana krav på dem som är intresserade av medborgarskap som kan anses vara motiverade och godtagbara, och medborgarskapsprovet kan därmed genomföras på ett rättvist sätt.\u003Cspan class=\"AlaviiteTeksti\"> Blake 2022: In defense of citizenship testing – a reply to Daniel Sharp, Ethics &amp; Global Politics 15:1, s. 8. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">När man granskar medborgarskapsprovet i Förenta staterna har man bland annat observerat att tanken bakom provet är att invandrare ska ha sådana kunskaper om landet som de måste lära sig och tillägna sig för att förvärva medborgarskap. De kunskaper som ska inhämtas för medborgarskapsprovet kan också komplettera tidigare kunskaper hos dem som förbereder sig för provet. Med ett standardiserat (formbundet) medborgarskapsprov kan man mäta till exempel sådana aspekter som kunskaper i historia, men det kan också finnas alternativa sätt att avlägga medborgarskapsprovet, till exempel att delta i någon utbildning eller samhällsverksamhet\u003Cspan class=\"AlaviiteTeksti\"> Loring 2013: The Meaning of citizenship – tests, policy, and English proficiency, The CATESOL Journal 24.1, s. 215–217. \u003C/span> &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Andra länder \u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I avsnitt 5.2 beskrivs närmare hur vissa jämförelseländer som valts i propositionen förhåller sig till mätning av samhällskunskap och medborgarskapsprov. Allmänt taget kan emellertid konstateras att påvisande av samhälls- eller medborgarkunskap i många stater är ett villkor för att förvärva medborgarskap. Till exempel enligt en undersökning som Europeiska migrationsnätverket (EMN) publicerade 2020 krävde ungefär hälften av EU-länderna bevis på samhällskunskap för naturalisation.\u003Cspan class=\"AlaviiteTeksti\"> Pathways to citizenship for third-country nationals in the EU – EMN Synthesis Report for the EMN Study 2019, s. 20 (https://emnbelgium.be/sites/default/files/publications/EMN%20study%20synthesis%20report%20citizenship.pdf ). \u003C/span> Utanför Europa kräver till exempel Förenta staterna och Kanada ett medborgarskapsprov. Av de övriga nordiska länderna använder sig Danmark och Norge av ett medborgarskapsprov.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Även i Sverige håller man på att skärpa villkoren för att förvärva medborgarskap så att de utökas med ett krav på kunskaper i svenska och samhällskunskap. Två utredningar om detta nya krav har gjorts 2021 och 2025, i vilka även innehållet i och sättet att genomföra det särskilda medborgarskapsprovet har behandlats.\u003Cspan class=\"AlaviiteKooste\"> Krav på kunskaper i svenska och samhällskunskap för svenskt medborgarskap (SOU 2021:2, ), Skärpta krav för svenskt medborgarskap (SOU 2025:1, ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\">https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Dessutom har Universitets- och högskolerådet fått i uppgift att genomföra en förstudie om genomförandet av medborgarskapsprovet.\u003Cspan class=\"AlaviiteKooste\"> Uppdrag att genomföra en förstudie i fråga om medborgarskapsprov (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\">https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Genom kravet på språkkunskaper och samhällskunskaper försöker man i Sverige stärka medborgarskapets betydelse och främja ett inkluderande samhälle som baserar sig på samhörighet.\u003Cspan class=\"AlaviiteTeksti\"> SOU 2021:2, s. 153–155. \u003C/span> Tyngdpunkten i samhällsdelen i medborgarskapsprovet ligger på sådana kunskaper som behövs för att leva och fungera i samhället i Sverige, till exempel kunskaper om landets centrala lagstiftning och principer, demokrati och jämställdhet samt individens rättigheter och skyldigheter.\u003Cspan class=\"AlaviiteTeksti\"> SOU 2025:1, s. 200–201. \u003C/span> Enligt en utredning från 2025 borde medborgarskapsprovet utökas med ämnen som berör mediernas roll i samhället och barnets rättigheter som en del av de mänskliga rättigheterna.\u003Cspan class=\"AlaviiteTeksti\"> SOU 2025:1, s. 300. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Som en del av arbetet i inrikesministeriets arbetsgrupp genomfördes ännu en ad hoc-enkät via EMN som är mer aktuell än ovan nämnda EMN-undersökning. Enkäten skickades till 32 länder, varav 21 svarade. Endast tre av de länder som besvarade enkäten använde sig inte av ett medborgarskapsprov, och dessutom var ett av dessa länder Sverige, där man enligt det som konstaterats ovan planerar att införa ett prov. Därmed använder övriga länder som svarat även på denna enkät sig av ett medborgarskapsprov eller något annat sätt att mäta den sökandes samhällskunskap och integration. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Samhällskunskapen mäts bland annat genom ett skriftligt medborgarskaps- eller integrationsprov, en intervju eller en integrationskurs. De kunskaper testas berör i de olika länderna ofta såväl samhället som även landets historia, geografi och kultur samt medborgarnas rättigheter och skyldigheter. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Bestämmelserna om förvärv av medborgarskap omfattas av statens suveränitet, vilket innebär att varje stat med stöd av sin egen lagstiftning fastställer vilka förutsättningar som fastställs för att förvärva medborgarskap. Som en allmän bild av det som nämns ovan kan dock konstateras att mätningen av samhällskunskap som en del av statens förfarande för naturalisation ses som en central delfaktor i att individen godkänns som fullvärdig medlem i samhället.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Samhällskunskap som invandrare erhåller \u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I inrikesministeriets arbetsgruppsutredning granskades de kunskaper som invandrare får om det finländska samhället i olika skeden av vistelsen i landet (s. 20–29). Det här är centralt bland annat med tanke på vilka färdigheter invandrare ska ha för att påvisa tillräckliga samhällskunskaper och hurdana kunskaper som kan krävas av dem. Å andra sidan är det också fråga om hur man kan förbereda sig inför det medborgarskapsprov som är avsett till exempel för att påvisa samhällskunskap. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Nedan granskas ärendet först med tanke på tjänster i inledningsskedet av vistelsen i landet, vilket innebär tjänster enligt lagen om mottagande av personer som söker internationellt skydd och om identifiering av och hjälp till offer för människohandel (746/2011, nedan \u003Cspan class=\"KursiiviTeksti\">lagen om mottagande\u003C/span>) och lagen om främjande av integration (681/2023, nedan \u003Cspan class=\"KursiiviTeksti\">integrationslagen\u003C/span>). Därefter granskas hur undervisning om samhället ges inom den grundläggande utbildningen, gymnasieutbildningen, den grundläggande utbildningen för vuxna och den grundläggande yrkesutbildningen. Syftet är att kort beskriva hur man inom ramen för nämnda utbildningar förverkligar ett sådant undervisningsinnehåll som kan anses vara centralt med tanke på medborgarskapsprovet.&nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kunskaper och studier i inledningsskedet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I lagen om mottagande definieras de tjänster som personer som kommer som asylsökande får och hur omfattande de är. I mottagningstjänsterna ingår enligt 13&nbsp;§ i lagen om mottagande också arbets- och studieverksamhet, om vilken det föreskrivs närmare i lagens 29&nbsp;§. Enligt paragrafen ska det vid andra förläggningar än transitförläggningar ordnas möjligheter till arbete och studier för att främja självständigt handlande hos klienten. Arbets- och studieverksamhet är obligatorisk och vägran att delta kan leda till att mottagningspenningen minskas.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Migrationsverket har gett anvisningar om hur arbets- och studieverksamheten ska ordnas vid förläggningarna. Den studieverksamhet som ordnas vid förläggningarna avviker från den egentliga integrationsutbildningen som ordnas för personer som redan fått uppehållstillstånd i Finland, men studieverksamheten erbjuder ändå förutsättningar för integration genom att förbereda de studerande för att leva i det finländska samhället. Studierna vid förläggningen stöder övergången till integrationsutbildning och andra studier eller arbetslivet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Varje asylsökande ska som en del av arbets- och studieverksamheten avlägga en kurs om det finländska samhället. Syftet med kursen om det finländska samhället är att göra klienten på förläggningen förtrogen med det finländska samhället och hur man fungerar i det. Kursen ger grundläggande information om samhället, lagstiftningen, historia, samhällsordningen samt den finländska kulturen och finländska seder. Kursen om det finländska samhället består av självstudiematerial och föreläsningar samt en webbkurs. Allt material i kursen om det finländska samhället finns tillgängligt på förläggningarna och självstudiematerialet finns också på Migrationsverkets webbplats. Självstudiematerialet har översatts till finska och flera andra språk.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://migri.fi/suomalaisen-yhteiskunnan-kurssi\">https://migri.fi/sv/kurs-om-det-finlandska-samhallet\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Integrationslagen tillämpas på personer som har ett giltigt uppehållstillstånd i Finland enligt utlänningslagen (301/2004). Lagen tillämpas även på personer vars uppehållsrätt har registrerats eller som har beviljats ett uppehållskort i enlighet med utlänningslagen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt lagens 11&nbsp;§ ska myndigheter informera invandrare om deras rättigheter och skyldigheter i det finländska samhället och arbetslivet i samband med delgivningen av beslutet om uppehållstillstånd, registreringen av uppehållsrätt,
