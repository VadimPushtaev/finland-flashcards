 beviljandet av uppehållskort eller registreringen av hemkommuns- och befolkningsuppgifter. Guiden Välkommen till Finland är ett informationspaket i enlighet med lagen om främjande av integration. Guiden delas ut av till exempel Migrationsverket och finska beskickningar. Informationsmaterialet finns tillgängligt i skriftlig och elektronisk form.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://tem.fi/tervetuloa-suomeen\">https://tem.fi/sv/valkommen-till-finland\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Därtill har kommunen en mer omfattande skyldighet att ge vägledning och rådgivning i syfte att främja integrationen. Integrationsfrämjande åtgärder och tjänster ordnas som en del av integrationsprogrammet, som är en tjänstehelhet som kommunen ordnar för invandrare i inledningsskedet av integrationen. Enligt 13 § i integrationslagen ska integrationsprogrammet innehålla bland annat flerspråkig samhällsorientering, integrationsutbildning och sluttestning av språkkunskaperna. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I 26 § i integrationslagen föreskrivs om integrationsutbildningen. Integrationsutbildningen är en integrationstjänst som är avsedd för invandrare som passerat läropliktsåldern. Integrationsutbildningen innehåller undervisning i finska eller svenska och annan undervisning som främjar tillgång till arbetslivet och fortsatta studier samt förbättrar de samhälleliga färdigheterna. Integrationsutbildningen genomförs i regel som arbetskraftsutbildning. Det språkliga målet med integrationsutbildningen är att integrationskunden når fungerande och grundläggande språkkunskaper i finska eller svenska. Sluttestning i finska eller svenska ska ordnas som en del av integrationsutbildningen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Integrationsutbildning kan också ordnas i form av frivilliga studier. De vanligaste studierna som genomförs i form av frivilliga studier enligt integrationslagen är utbildningar i läs- och skrivfärdigheter och grundläggande utbildning för vuxna. Dessutom avläggs bland annat utbildning som förbereder för examensutbildning, olika andra språkkurser samt utbildningar som förbereder för högskolestudier.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I 25 § i integrationslagen föreskrivs om flerspråkig samhällsorientering. Enligt 1 mom. i paragrafen ska kommunen ordna samhällsorientering för integrationskunderna, i den mån det är möjligt på deras modersmål eller på språk som de annars har goda kunskaper i, med beaktande av integrationskundernas behov av tjänster och språkliga behov i kommunen. Flerspråkig samhällsorientering kan genomföras av kommunen eller av en serviceproducent. Enligt 2 mom. ska samhällsorienteringen åtminstone innehålla information om att bo, leva och arbeta i Finland, om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det är fråga om en integrationsfrämjande tjänst som syftar till att öka invandrarnas kännedom bland annat om det finländska samhället och om rättigheter och skyldigheter (RP&nbsp;208/2022&nbsp;rd, s. 233). Samhällsorientering ordnas på integrationskundens eget språk eller på ett språk kunden behärskar väl. Målet är att ge invandraren en bild av hur det finländska samhället fungerar samt att stöda och påskynda tillträdet till samhällets verksamhet. Närmare bestämmelser om innehållet i samhällsorienteringen, hur den genomförs och hur länge den varar utfärdas genom förordning av statsrådet (576/2024). &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt 1&nbsp;§ i statsrådets förordning ska det i den flerspråkiga samhällsorienteringen ingå undervisning om åtminstone det finländska samhällets värderingar och normer samt den centrala lagstiftningen, grundläggande och mänskliga rättigheter samt jämlikhet, jämställdhet mellan könen och sexuella rättigheter, målen för integrationen samt integrationsfrämjande tjänster, sysselsättning och företagande samt arbetsmarknaden, studier och studiemöjligheter, organisations- och frivilligverksamhet samt delaktighet, planering av ekonomin samt annan verksamhet i vardagen och Finlands historia och kultur. Enligt 2&nbsp;§ i förordningen ska samhällsorienteringen omfatta sammanlagt minst 70 timmar undervisning och självständiga studier och den ska i regel genomföras i form av undervisning. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Med tanke på samhällskunskapen ska kommunen eller arbetskraftsmyndigheten erbjuda väsentlig flerspråkig samhällsorientering till en integrationskund i vars integrationsplan man kommer överens om deltagande i tjänsten i fråga. Med en integrationskund avses en invandrare som har en giltig integrationsplan eller sektorsövergripande integrationsplan. En integrationsplan eller sektorsövergripande integrationsplan utarbetas senast inom tre år efter det att det första uppehållstillståndet eller uppehållskortet beviljades eller den första uppehållsrätten registrerades för en invandrare som är arbetslös arbetssökande, får hemvårdsstöd, får utkomststöd annat än tillfälligt, är kvotflykting eller får internationellt skydd, är offer för människohandel eller är ett sådant barn eller en sådan ung person som avses i 2 § 6 mom. i integrationslagen. En plan utarbetas också i det fall att det för att främja en persons integration förutsätts samordning av de tjänster som kommunen och välfärdsområdet ansvarar för att ordna. Integrationsplanen är individuell och den gäller i regel i två år. I praktiken deltar största delen av de invandrare som till exempel arbetar eller studerar på heltid inte i flerspråkig samhällsorientering eller integrationsutbildning.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Läromedel för samhällsorientering\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">För den samhällsorientering som beskrivs i föregående avsnitt har utarbetats ett riksomfattande webbundervisningsmaterial som finns tillgängligt gratis.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/sv/laromedel\u003C/a>\u003C/span>\u003C/span>\u003C/span> Utbildningsstyrelsen och Finlands Flyktinghjälp rf uppdaterade den finskspråkiga läroboken för samhällsorientering riktad till vuxna invandrare i ett samprojekt under 2023–2025. Under projektet uppdaterades det läromedel för samhällsorientering som tidigare producerats genomgående, illustrerades och digitaliserades till ett användarorienterat och tillgängligt inlärningsmaterial som finns på webben. Projektet genomfördes i ett omfattande samarbete och det nya läromedelskonceptet och textmaterialet kommenterades av myndigheter, sakkunniga inom integrationsbranschen, utbildare, aktörer inom organisationsområdet och invandrare. Det är fråga om den enda läromedelshelhet som utarbetats uttryckligen för samhällsorienteringen. Läromedlet på webben upprätthålls och uppdateras av sysselsättnings-, utvecklings- och förvaltningscentret (UF-centret).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ett enhetligt läromedel som finns tillgängligt på webben hjälper kommunerna att genomföra en jämlik samhällsorientering, och materialet kan förutom av utbildningsanordnarna även utnyttjas av studerande på orienteringskursen och andra som är intresserade av samhällskunskap. Det enhetliga läromedlet på webben tryggar att samhällsorienteringen kan genomföras på ett jämlikt sätt i hela landet. Läromedlet erbjuder en grund för en högklassig utbildning i samhällsorientering med ett aktuellt sakinnehåll. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Till sitt innehåll motsvarar läromedlet statsrådets förordning om flerspråkig samhällsorientering. Läromedlet på webben är omfattande och indelat i tio delhelheter, som alla dessutom innehåller flera underdelar. De tio delarna i läromedlet är integration, människorna och kulturen, vardagen, arbete, studier och utbildning, familj, hälsa och välbefinnande, samhälle och påverkan, lag och rätt samt Finlands historia.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">De allmänna inlärningsmålen för webbläromedlet för samhällsorientering är att när samhällsorienteringen har genomförts med hjälp av läromedlet har den som deltagit i utbildningen bättre förutsättningar att integrera sig i Finland, känner till värderingarna och kulturen i det finländska samhället, förstår verksamheten i det finländska samhället, känner till sina egna rättigheter och skyldigheter i Finland, kan själv sköta myndighetsärenden och andra ärenden bättre samt kan bättre delta i samhället och utvecklingen av det.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Undervisning som ingår i övriga studier\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Den grundläggande utbildningen omfattar nio år. För invandrare kan dessutom ordnas undervisning som förbereder för grundläggande utbildning, vars omfattning motsvarar ett års lärokurs. Den grundläggande utbildningen upphör när den grundläggande utbildningens lärokurs har slutförts eller senast när skolarbetet under läsåret slutar det kalenderår då eleven fyller 17 år. Läroplikten upphör när den studerande fyller 18 år eller dessförinnan avlägger en examen på andra stadiet eller genomgår en motsvarande utländsk utbildning.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Den grundläggande utbildningen är allmänbildande utbildning och handlar både om fostran och utbildning. Den grundläggande utbildningen innehåller vissa ämnen som är gemensamma för alla, däribland läroämnet samhällslära. Uppdraget i undervisningen i samhällslära att stödja elevernas utveckling till aktiva, ansvarsfulla och företagsamma medborgare. Eleverna ska vägledas att iaktta demokratiska värden och principer i ett pluralistiskt samhälle som har förståelse för olikhet och respekterar jämlikhet och mänskliga rättigheter. Läroämnets uppdrag är att ge teoretisk kunskap om hur samhället fungerar och hur en medborgare kan påverka samt uppmuntra eleverna att utvecklas till handlingskraftiga och initiativrika samhälleliga och ekonomiska aktörer.\u003Cspan class=\"AlaviiteTeksti\"> Grunderna för läroplanen för den grundläggande utbildningen 2014. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I undervisningen i årskurserna 7–9 ska man betona elevernas möjligheter och kompetens att påverka i ett demokratiskt samhälle samt elevernas ansvar i fråga om egna livsval. I undervisningen ska man fästa vikt vid samhällets och samhällslivets strukturer samt begrepp i anslutning till dessa. Eleven ska vägledas att fälla omdöme om samhälleliga och ekonomiska frågor och att jämföra olika åsikter och strategier inom olika folkgrupper och gällande olika värdemål. Studierna av samhällsfrågor ska vidgas till att omfatta även globala frågor.\u003Cspan class=\"AlaviiteTeksti\"> Samma som ovan. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Den grundläggande utbildningen för vuxna består av tre skeden: ett läskunnighetsskede, ett inledningsskede och ett slutskede. Målgrupper i den grundläggande utbildningen för vuxna är till exempel 17–25-åringar med invandrarbakgrund, som på grund av sin ålder inte kan delta i den grundläggande utbildningen för barn och unga, men som behöver ett avgångsbetyg från den grundläggande utbildningen och studiefärdigheter för att fortsätta studera på andra stadiet, samt övriga vuxna med invandrarbakgrund, som på grund av sin svaga grundutbildning har behov i synnerhet av undervisning i inledningsskedet i den grundläggande utbildningen, såsom läs- och skrivfärdigheter och matematiska färdigheter, eller som behöver ett avgångsbetyg för att kunna söka till fortsatta studier. Syftet med utbildningen i inledningsskedet är att ge den studerande behövliga färdigheter i modersmål och litteratur samt övriga färdigheter för övergång till den grundläggande utbildningens slutskede, liksom att främja de studerandes balanserade utveckling. Efter inledningsskedet kan studierna fortsätta till slutskedet, där det är möjligt att studera läroämnen som bland annat samhällslära.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I alla yrkesinriktade grundexamina ingår obligatoriska examensdelar som berör kunnande om samhälle och arbetsliv. Dessa är att verka i samhället och som medborgare, att verka i arbetslivet, färdigheter i studie- och karriärplanering, företagsamhet och företagarinriktad verksamhet, upprätthållande av arbetsförmågan och välbefinnandet och främjande av hållbar utveckling. I delen om att om att verka i det finländska samhället behandlas bland annat medborgarnas grundläggande fri- och rättigheter och skyldigheter, principerna för jämställdhet och likabehandling och iakttagandet av dem samt hur man agerar som en aktiv medborgare och utnyttjar mångsidiga sätt att påverka.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Gymnasieutbildningen är allmänbildande utbildning, och den studentexamen som avläggs efter gymnasiestudierna ger allmän högskolebehörighet. Enligt gymnasielagen (714/2018) är syftet med gymnasieutbildningen är att stödja de studerandes utveckling till goda, harmoniska och bildade människor och aktiva samhällsmedlemmar samt att ge dem sådana kunskaper, färdigheter och beredskaper som de behöver i arbetslivet, för fritidsintressen och för en allsidig personlighetsutveckling. Därtill är syftet med utbildningen att ge de studerande beredskap för livslångt lärande och för att utveckla sig själva kontinuerligt. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Gymnasieutbildningens uppdrag är att stärka en bred allmänbildning. Allmänbildningen i gymnasieutbildningen består av värderingar, kunskaper, färdigheter, attityder och vilja med vars hjälp en kritiskt och självständigt tänkande individ kan handla på ett ansvarsfullt och empatiskt sätt samt samverka med andra och utveckla sig själv. Under gymnasietiden fördjupar den studerande kunskaper och engagemang som är väsentliga i förhållande till människan, olika kulturer, miljön och samhället. Undervisningen handleder den studerande att förstå komplexa beroendeförhållanden i livet och i världen och att analysera omfattande företeelser.\u003Cspan class=\"AlaviiteTeksti\"> Grunderna för gymnasiets läroplan 2019 \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Den målsatta tiden för gymnasiestudier är tre år och studiernas omfattning är 150 studiepoäng. Som avslutning på studierna avläggs studentexamen. Enligt gymnasielagen ingår i gymnasieutbildningens lärokurs studier i modersmålet och litteratur, det andra inhemska språket och främmande språk, matematisk-naturvetenskapliga studier, humanistisk-samhälleliga studier, studier i religion eller livsåskådningskunskap och studier i konst- och färdighetsämnen (läroämnesgrupper) samt studiehandledning. Gymnasieutbildningens lärokurs kan innefatta tematiska studier som utvecklar den mångsidiga kompetensen. Gymnasieutbildningens lärokurs kan också innehålla studiehelheter som genomgås i olika läroämnesgrupper eller läroämnen och som innefattar ett arbete som påvisar särskilt kunnande och intresse (gymnasiediplom).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I gymnasiets undervisning i samhällslära ingår både obligatoriska och valfria studier. Undervisningen i samhällslära ska fördjupa den studerandes kunskaper om det omgivande samhället och ge den studerande förutsättningar att utvecklas till en aktiv och engagerad medborgare med intresse för samhällsfrågor. Undervisningen i samhällslära ska ge den studerande förutsättningar för att kritiskt granska och bedöma aktuella företeelser samt reflektera över framtida trender och alternativ. Undervisningen ska också stärka den studerandes ekonomiska kunnande och juridiska förståelse samt uppmuntra den studerande till aktivt samhälleligt deltagande. Utgångspunkten för undervisningen är att väcka ett personligt intresse för samhällsfrågor och världshändelser. I undervisningen i samhällslära ska värdegrunden präglas av demokratiska principer, som jämlikhet, socialt ansvar, respekt för de mänskliga rättigheterna, åsiktsfrihet och aktivt medborgarskap samt uppskattning av arbete och företagsamhet.\u003Cspan class=\"AlaviiteTeksti\"> Samma som ovan.\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Utöver det som beskrivits ovan omfattar utbildningssystemet utbildning på högre nivå som kan avläggas efter studier på andra stadiet. Högskolesystemet består av universitet och yrkeshögskolor. Det finns sammanlagt tiotals universitets- och yrkeshögskoleexamina.\u003Cspan class=\"AlaviiteTeksti\"> Statsrådets förordning om examina och specialiseringsutbildningar vid universitet (764/2004), 10 och 16 §, Statsrådets förordning om yrkeshögskolor (352/2003), 10 §. \u003C/span> Universiteten och yrkeshögskolorna har undervisnings- och forskningsfrihet samt konstnärlig frihet. Innehållet i högskoleexamina regleras inte på lagnivå. Till högskolornas autonomi hör att de själva kan bestämma vad examina ska innehålla. Vid universitet och yrkeshögskolor kan man studera såväl på finska och svenska som på engelska.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sammanfattande observationer om samhällskunskap\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kunskap om samhället har en central roll i invandrarnas integration eftersom den bland annat hjälper invandraren att förstå individens rättigheter och skyldigheter samt stöder politisk och samhällelig delaktighet, vilket är en väsentlig del av en djupare integration. Samhällskunskap ger också en bred bild av olika strukturer i samhället, till exempel förvaltnings- och utbildningssystemet, arbetsmarknaden och kulturen samt historien. Dessa kunskaper stöder individens förmåga att klara sig i vardagen och underlättar den sociala och kulturella anpassningen, vilket främjar en smidig växelverkan i samhället. Även ur samhällets synvinkel är det viktigt att invandraren känner till de centrala principerna och verksamhetssätten i samhället. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Invandrarnas samhällskunskap främjas bland annat genom kurser, orientering och utbildning. Deltagandet kan till vissa delar vara obligatoriskt och följas upp, men när undervisningen avslutas bedöms deltagarens samhällskunskaper inte nödvändigtvis alltid. De invandrare som omfattas av antingen lagen om mottagande eller integrationslagen får grundläggande kunskaper om det finländska samhället redan i ett mycket tidigt skede av sin vistelse i Finland. I det finländska utbildningssystemet utvecklas samhällskunskapen i enlighet med läroplanen både inom den grundläggande utbildningen och studier på andra stadiet, vilket stöder invandrarnas integration och aktiva deltagande i samhället. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sammanfattningsvis kan konstateras att samhällskunskap främjas på flera nivåer i Finland, till exempel genom lagstiftning (lagen om mottagande, integrationslagen), särskilda kurser och orienteringar samt i olika skeden av utbildningssystemet. Målet är att säkerställa att även invandrare får tillräckligt med information om det finländska samhället, dess värderingar, verksamhet och om sina egna rättigheter och skyldigheter oberoende av i vilket skede av vistelsen eller utbildningen de befinner sig. Dessutom samlar invandraren naturligt på sig samhällskunskap också genom att agera på egen hand i ett interaktivt förhållande till samhället.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I nuläget förutsätts inte samhällskunskap i samband med ansökan om medborgarskap. Betydelsen av kunskap om samhället och internationella jämförelseuppgifter talar för att komplettera bestämmelserna i medborgarskapslagen så att villkoren för naturalisation utökas med ett samhällskunskapsvillkor. Det finns också utrednings- och forskningsdata om ett sådant villkor och om medborgarskapsprovet som kan utnyttjas vid genomförandet av lagändringen till exempel med tanke på vad som är motiverat att beakta då medborgarskapsprovet införs.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ett medborgarskapsprov i samhällskunskap visar att den sökande har integrerats tillräckligt i samhället med tanke på förvärvandet av medborgarskap. Det nya samhällskunskapsvillkoret och införandet av ett medborgarskapsprov ger i större utsträckning än de övriga gällande villkoren för naturalisation möjlighet att mäta integrationen. Genom att avlägga medborgarskapsprovet kan man säkerställa att personer som förvärvar medborgarskap behärskar de grundläggande kunskaperna om det finländska samhället, till exempel om dess historia, lagstiftning och verksamhetssätt samt om individens rättigheter och skyldigheter. Villkoret om tillräcklig samhällskunskap i naturalisationsskedet och det medborgarskapsprov som är avsett att påvisa detta kan fungera som en naturlig fortsättning på all den samhällskunskap som invandrare får och tillägnar sig under sin vistelse i landet.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Genomförande av medborgarskapsprovet och nytt provsystem\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Centrala observationer i inrikesministeriets utredning\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Målet med den tväradministrativa arbetsgrupp som inrikesministeriet tillsatt var att utreda hur medborgarskapsprovet kan genomföras och hurdant medborgarskapsprov som ska införas. I detta arbete ingår bland annat frågor om förvaltningen av provet och åtgärder i anslutning till de praktiska arrangemangen kring provet. Nedan beskrivs i korthet de centrala synpunkter som arbetsgruppen framfört om genomförandet av medborgarskapsprovet.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">En av de centrala uppgifterna för den arbetsgrupp som utrett införandet av medborgarskapsprovet var att granska vilken som är den mest ändamålsenliga instansen för att förvalta medborgarskapsprovet. Förvaltningen av medborgarskapsprovet behandlades i kapitel 6 i utredningen (s. 68–76). I arbetsgruppens utredning konstaterades att det inte finns någon sådan enskild myndighet vars nuvarande verksamhet motsvarar förvaltningen av medborgarskapsprovet. I arbetsgruppens utredning lades inte fram någon enskild aktör som borde sörja för förvaltningen av medborgarskapsprovet. Däremot ansåg arbetsgruppen att samarbete mellan olika aktörer är centralt med tanke på förvaltningen av provet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Dessutom ansåg arbetsgruppen att den instans som ansvarar för förvaltningen kan komma överens om anordnandet av medborgarskapsprovet med någon annan instans eller aktör. I utredningen konstaterades till exempel att uppgifter i anslutning till genomförandet av medborgarskapsprovet kan utkontrakteras även om en viss myndighet ansvarar för förvaltningen av medborgarskapsprovet. När provet ordnas kan man utnyttja aktörer som ordnar utbildningar och testtillfällen i anslutning till dem. I mån av möjlighet kan även privata tjänsteleverantörer utnyttjas. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I utredningen behandlades testmetoder och typer av uppgifter med vilka samhällskunskapen kan mätas (s. 47–49). Arbetsgruppen ansåg att ett digitalt, det vill säga elektroniskt, prov lämpar sig bäst för att genomföra medborgarskapsprovet. Vad gäller typer av uppgifter identifierade arbetsgruppen olika möjliga alternativ för att testa kunskaperna. Till denna del ansåg arbetsgruppen att flervalsfrågor där den sökande ska välja rätt svar bland flera alternativ är det mest ändamålsenliga alternativet.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Arbetsgruppen behandlade också språkvalet i medborgarskapsprovet (s. 49–50) och medborgarskapsprovets förhållande till språkkunskapsvillkoret (s. 54–58). Språkvalet i medborgarskapsprovet ansågs allmänt taget vara betydelsefullt i utredningen. Arbetsgruppen ansåg det vara viktigt att medborgarskapsprov som genomförs på finska eller svenska utarbetas med beaktande av nivån på de språkkunskaper som är ett villkor för naturalisation.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ett av de ämnen som arbetsgruppen behandlade gällde förberedelserna för medborgarskapsprovet och läromaterial för provet (s. 65–67). Arbetsgruppen ansåg det vara viktigt att det finns möjlighet att förbereda sig för medborgarskapsprovet med hjälp av läromedel och att provfrågorna grundar sig på detta förhandsmaterial. Arbetsgruppen ansåg emellertid inte att det skulle förespråkas att ett helt nytt läromedel utarbetas för medborgarskapsprovet. Arbetsgruppen ansåg att det är ändamålsenligt att utnyttja befintliga utbildningsmaterial och läromedel, till exempel läromedlet för samhällsorientering för integrationskunder. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I arbetsgruppens utredning behandlades olika åtgärder för att förebygga missbruk (s. 63–64). Arbetsgruppen konstaterade att missbruk kan förebyggas både genom åtgärder före provet och genom övervakning under provet. Särskilt viktiga ansågs åtgärder för att fastställa identiteten samt förebyggande av svikligt förfarande genom övervakning. Dessutom framfördes sanktioner i samband med svikligt förfarande.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I utredningen behandlades specialarrangemang i samband med medborgarskapsprovet (s. 64–65). Syftet med specialarrangemangen är att garantera att en person har samma möjligheter att avlägga provet som alla andra. I utredningen konstaterades att det inte är fråga om en avvikelse från villkoret eller en annorlunda bedömning av provprestationen, utan att specialarrangemangen gäller själva provtillfället. I utredningen lyftes fram exempel på situationer med specialarrangemang, till exempel tilläggstid för att utföra uppgiften eller användning av överenskomna hjälpmedel. Arbetsgruppen ansåg att det ska vara möjligt att ansöka om specialarrangemang för att avlägga provet.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Befintliga examens- och provsystem\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Den arbetsgrupp som utredde medborgarskapsprovet identifierade flera delfaktorer i anslutning till genomförandet av provet (s. 68–69). Dessa omfattar bland annat planering av provet, till exempel utarbetande av frågor. Dessutom borde innehållet i provet förnyas och utvecklas i syfte att upprätthålla dess tillförlitlighet och aktualitet. Även testets effektivitet bör utvärderas regelbundet. I förvaltningen ingår också arrangemang för övervakning av provet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Anordnandet av medborgarskapsprovet omfattar bland annat lokaler som behövs för provet, provövervakare och teknisk utrustning. Enligt arbetsgruppens utredning kan den tekniska utrustningen omfatta till exempel användning av digitala plattformar, utdelning av pappersprov eller anordnande av muntliga tester. Andra viktiga delområden i genomförandet av medborgarskapsprovet är anmälan till provet, registrering av provresultat och information om provresultat till deltagarna. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Nedan granskas några befintliga examens- och provsystem med tanke på hur sättet på vilket de genomförs skulle kunna utnyttjas för att skapa ett system för medborgarskapsprovet.&nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Allmän språkexamen\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Bestämmelserna om allmänna språkexamina kan anses vara betydelsefulla även med tanke på genomförandet av det kommande medborgarskapsprovet eftersom det är fråga om ett befintligt examenssystem vars användning redan har etablerats. Nedan granskas de centrala bestämmelserna om allmänna språkexamina samt vissa detaljer i det praktiska genomförandet. Föremål för granskningen är i synnerhet anordnandet och övervakningen av examenstillfällen, det anmälningssystem som används samt ombesörjandet av nödvändiga specialarrangemang. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Bestämmelser om allmänna språkexamina och anordnandet av dem finns i lagen om allmänna språkexamina (964/2004) och statsrådets förordning om allmänna språkexamina (1163/2004). De allmänna språkexamina är språkexamina som ordnas för att visa funktionella språkkunskaper och i vilka språkkunskaper kan testas i nio olika språk. I examina bedöms kunskaperna i standardspråket i praktiska situationer. Efter avlagd examen får man ett intyg med vilket man officiellt kan påvisa språkkunskaper till exempel i anslutning till arbetsuppgifter och studier eller när man ansöker om finskt medborgarskap. De allmänna språkexamina och språkexamina för statsförvaltningen förnyades i ett projekt vid undervisnings- och kulturministeriet (OKM001:00/2025) Målet med projektet var att digitalisera språkexamina och göra processerna för språkexamina ändamålsenliga i syfte att svara på det ökande antalet personer som avlägger examina.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I 2&nbsp;§ i lagen om allmänna språkexamina föreskrivs om examensförvaltning. Utbildningsstyrelsen svarar för systemet med allmänna språkexamina, systemets utveckling och tillsynen över det. Utbildningsstyrelsen kan ingå avtal om utarbetande och bedömning av allmänna språkexamina med högskolor eller andra sådana offentliga samfund eller sammanslutningar som har tillräcklig sakkunskap för att utarbeta och bedöma språkexamina. Utbildningsstyrelsen har ingått ett avtal med Centret för tillämpad språkforskning (Solki) vid Jyväskylä universitet. Solki utarbetar de tester som används i de allmänna språkexamina och koordinerar bedömningen av examensprestationerna. Detta arbete omfattar bland annat planering av testet, till exempel utarbetande av frågor och fastställande av bedömningskriterier. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I anslutning till Utbildningsstyrelsen finns en kommission för allmänna språkexamina, vilken tillsätts av Utbildningsstyrelsen för högst tre år i sänder (3&nbsp;§). Det är ett sakkunnigorgan vars medlemmar besitter sakkunskap som är central för de allmänna språkexamina. Kommissionen för allmänna språkexamina har till uppgift att behandla principiella frågor som hänför sig till utvecklingen av allmänna språkexamina och frågor som är viktiga för samhället eller för examinanden samt att ta initiativ till utvecklingen av språkexamina (3&nbsp;a&nbsp;§). Närmare bestämmelser om kommissionens uppgifter får utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I 4&nbsp;§ i lagen om allmänna språkexamina finns bestämmelser om anordnande av examina. Utbildningsstyrelsen kan avtala om anordnande av examina med sådana offentliga samfund eller sammanslutningar som har tillräcklig sakkunskap och förutsättningar att ordna examina. När avtal ingås ska det beaktas att det regionalt ordnas tillräckligt med examenstillfällen och att tillfällen ordnas tillräckligt ofta. Ett avtal kan hävas om anordnaren försummar sina avtalsenliga uppgifter.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt 5&nbsp;§ i lagen om allmänna språkexamina har examensanordnarna bland annat till uppgift att ordna examina i enlighet med avtalsvillkoren, informera om examina, svara för övervakningen av examenstillfällena, underrätta om brott mot ordning och svikligt förfarande, lämna in examensprestationerna för bedömning samt lämna myndigheter inom undervisningsväsendet de uppgifter som dessa behöver om anordnandet av examina. Närmare bestämmelser om examensanordnarnas uppgifter och innehållet i de avtal som gäller dessa får utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Såsom konstaterats ovan kan ett sådant offentligt samfund eller en sådan sammanslutning som har ingått ett avtal om anordnande av examenstillfällen med Utbildningsstyrelsen ordna allmänna språkexamina. Anordnare av allmänna språkexamina sörjer för den yttre ramen för och övervakningen av examenstillfällena.\u003Cspan class=\"AlaviiteKooste\"> Anordnandet av allmänna språkexamina beskrivs i den finskspråkiga publikationen Yleiset kielitutkinnot 30 vuotta (Utbildningsstyrelsen, rapporter och utredningar 2024:8, s. 133–137 ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.oph.fi/sites/default/files/documents/Yleiset_kielitutkinnot_30_vuotta_060125.pdf\">https://www.oph.fi/sites/default/files/documents/Yleiset_kielitutkinnot_30_vuotta_060125.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> Det ingår i examensanordnarens uppgifter att reservera nödvändiga lokaler och anordningar samt personer som övervakar provtillfällena. I beredningen av examenstillfällena ingår också att ge övervakarna utbildning och anvisningar. Examensarrangören får det testmaterial som används vid examenstillfället och tillhörande anvisningar från Centret för tillämpad språkforskning (Solki) vid Jyväskylä universitet, som likaså är Utbildningsstyrelsens avtalspart. Även det kommande medborgarskapsprovet skulle kunna genomföras genom avtal med aktörer som anordnar provtillfällen så att de som deltar i provtillfällena svarar på sådana provfrågor som har utarbetats centraliserat på basis av ett separat avtal med en aktör med nödvändig sakkunskap. Utgångspunkten skulle alltså vara att anordnandet av provtillfällen och utarbetandet av provfrågor ankommer på olika aktörer. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Den som ordnar examenstillfällen ska se till att examen avläggs under övervakning. Examensanordnarnas övervakningsuppgift lades till i lagen genom en lagändring som trädde i kraft den 1 januari 2023. Enligt regeringens proposition om ändringen ingår i examensanordnarens övervakningsskyldighet bland annat alla föregripande åtgärder som syftar till att förhindra brott mot ordningen och svikligt förfarande vid examenstillfällen (RP&nbsp;230/2022&nbsp;rd, s. 17). Examensanordnaren övervakar för det första att samma person som har anmält sig till examen deltar i examen. Identiteten hos dem som deltar i en allmän språkexamen kontrolleras innan examenstillfället börjar. För att identiteten ska kunna kontrolleras ska deltagaren ha med sig ett godtagbart identitetsbevis, till exempel ett giltigt pass. Försök att utge sig vara en annan person anmäls och rapporteras till Utbildningsstyrelsen och Solki samt eventuellt till polisen. Den person som kontrollerar identiteten registrerar deltagaren vid examenstillfället. Samtidigt samlas elektroniska apparater, till exempel telefon och smartklocka, in av deltagarna under examenstillfället. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Anordnaren av en allmän språkexamen övervakar också själv examenstillfället och sörjer för att det råder allmän ordning och lugn och ro under tillfället. Om det vid examenstillfället förekommer förseelser eller försök till fusk ska examensanordnaren lämna en redogörelse för situationen till Utbildningsstyrelsen. Vid misstanke om fusk skickar Utbildningsstyrelsen en begäran om hörande till examinanden. Efter att ha utrett ärendet fattar Utbildningsstyrelsen beslut om huruvida fusk har begåtts. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I 6 a § i lagen om allmänna språkexamina finns bestämmelser om påföljder för brott mot ordning och för svikligt förfarande. Om examinanden under examenstillfället gör sig skyldig till svikligt förfarande, medverkar till svikligt förfarande eller gör sig skyldig till försök till fusk, betraktas examensprestationen som underkänd och examinanden förlorar rätten att delta i examen i språket i fråga för sex månader från dagen för examenstillfället. Om förfarandet upprepas eller är synnerligen grovt och skadligt kan examinanden förlora rätten att delta i examen för tolv månader. I regeringens proposition motiverades behovet av bestämmelser om sanktioner bland annat med att man genom ändringen kan minska antalet fall av svikligt förfarande, vilket i sin tur sparar in på den arbetstid som går åt till att behandla dem samt på andra resurser (RP&nbsp;230/2022 rd, s. 10). Bestämmelserna om sanktioner till följd av svikligt förfarande har varit i kraft sedan 2023 och den gällande lagen har till denna del bedömts ha förbättrat och balanserat situationen avsevärt.\u003Cspan class=\"AlaviiteTeksti\"> Yleiset kielitutkinnot 30 vuotta, s. 27.\u003C/span> Det skulle vara motiverat att inkludera motsvarande bestämmelser i lagstiftningen om medborgarskapsprovet i syfte att förebygga svikligt förfarande. Bestämmelser om sanktioner för svikligt förfarande bidrar till att stöda medborgarskapsprovets trovärdighet och tillförlitlighet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Anmälan till en allmän språkexamen görs elektroniskt i Studieinfo-systemet.\u003Cspan class=\"AlaviiteTeksti\"> Den elektroniska anmälan till en allmän språkexamen beskrivs i den finskspråkiga publikationen Yleiset kielitutkinnot 30 vuotta, s. 47–50. \u003C/span> Den som anordnar examenstillfällena lägger till uppgifter om examenstillfället och det maximala antalet deltagare i systemet. Efter att anmälningstiden löpt ut kallar arrangören deltagarna till examenstillfället. Deltagarna får då också en länk till anvisningen för deltagare på Utbildningsstyrelsens webbplats. Den som anordnar examenstillfällena använder därmed själv det system där uppgifter om anmälan till examen behandlas. Å andra sidan utnyttjas i samband med anmälan en gemensam anvisning för alla deltagare, som har centraliserats. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Anmälningssystemet för den allmänna språkexamen ingår i den nationella webbplatsen Studieinfo, där Utbildningsstyrelsens digitala tjänster för privatpersoner, inklusive gemensamma ansökningar för olika utbildningsstadier, finns samlade. Det centraliserade elektroniska anmälningssystemet för allmänna språkexamina togs i bruk i alla anmälningar till allmänna språkexamina 2020. Anmälningssystemet för allmänna språkexamina består av ett användargränssnitt som är synligt för examensdeltagarna och av ett sådant tjänstemannagränssnitt som syns för Utbildningsstyrelsen och examensanordnare. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Den som är intresserad av att delta i en examen kan söka examenstillfällen i anmälningssystemet till exempel enligt examensspråk och ort. Sökresultaten kan också begränsas till exempel till examina där det finns lediga platser. Man kan dock anmäla sig till ett examenstillfälle i systemet endast under anmälningstiderna. För att anmäla sig ska personen identifiera sig elektroniskt antingen med Suomi.fi-identifikation eller per e-post. Efter att ha skickat in anmälningsblanketten får personen per e-post en betalningslänk för att betala examensavgiften. Länken gäller i tre dygn. I systemet kan man också beställa aviseringar om platser som blir lediga om något examenstillfälle redan är fullt. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I tjänstemannagränssnittet lägger anordnare av examenstillfällen till uppgifter om tidpunkterna för och antalet platser vid examenstillfällena i systemet. Både anordnarna och Utbildningsstyrelsen kan följa hur platserna fylls. Dessutom samlar anordnarna via tjänstemannagränssnittet in uppgifter till Utbildningsstyrelsen för fakturering. Utbildningsstyrelsen, som ansvarar för förvaltningen av examensavgifterna, använder gränssnittets uppgifter för att granska fakturor. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">De som deltar i examen bör beakta att de examensplatser som erbjuds reserveras snabbt. För att ha möjlighet att avlägga examen ska man anmäla sig i tid och eventuellt också resa till en ort där provtillfällen ordnas. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt 11&nbsp;§ i lagen om allmänna språkexamina tar Utbildningsstyrelsen ut en examensavgift hos examinanderna. Examensavgifterna tas ut för att täcka kostnaderna för att ordna en allmän språkexamen. Examensavgifterna betalades tidigare till examensanordnarna. Genom ändringen att examensavgiften betalas till Utbildningsstyrelsen i stället för till examensanordnaren strävade man efter att öka transparensen och tydligheten i fråga om uppföljningen av de totala kostnaderna för systemet (RP&nbsp;230/2022&nbsp;rd, s. 11). Examensavgiften återbetalas till en person som anmält sig till examen om han eller hon är förhindrad att delta i examen på grund av egen sjukdom. Avgiften återbetalas dock inte om den som anmält sig till examen inte har annullerat sin anmälan innan examenstillfället börjar.&nbsp;Ansökan om återbetalning ska göras hos Utbildningsstyrelsen inom två veckor från dagen för examenstillfället (11&nbsp;§ 2&nbsp;mom.).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Den som deltar i en allmän språkexamen kan beviljas specialarrangemang på grund av sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårigheter eller av någon annan jämförbar orsak.\u003Cspan class=\"AlaviiteTeksti\"> Mer information om specialarrangemang i allmänna språkexamina finns i publikationen Yleiset kielitutkinnot 30 vuotta, s. 41–46.\u003C/span> Provuppgifterna för en deltagare som behöver specialarrangemang är dock desamma som för andra deltagare. Antalet personer som ansökt om specialarrangemang vid allmän språkexamen har uppgått till några tiotal per år. Antalet har varierat något från år till år, men andelen deltagare som begärt specialarrangemang har ändå varit relativt liten. Till exempel 2014–2023 avlade sammanlagt 71&nbsp;607 personer examen i finska på mellannivå i allmänna språkexamina.\u003Cspan class=\"AlaviiteTeksti\"> Yleiset kielitutkinnot 30 vuotta, s. 56.\u003C/span> Under samma tid ansöktes det sammanlagt 511 gånger om specialarrangemang för allmänna språkexamina. Utifrån dessa uppgifter kan konstateras att andelen som begärt specialarrangemang av alla som deltagit i examen därmed ligger klart under en procent. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Vid allmänna språkexamina gäller följande uppgiftsfördelning för specialarrangemang. Utbildningsstyrelsen ger anvisningar om examensarrangemang och även om hur specialarrangemang genomförs och begärs. Centret för tillämpad språkforskning, Solki, vid Jyväskylä universitet behandlar begäranden om specialarrangemang från enskilda personer. Den som ordnar examenstillfällena informerar deltagaren om beviljade specialarrangemang och sörjer för att de genomförs. Även i fråga om begäranden om specialarrangemang i det framtida medborgarskapsprovet kan anvisningar ges och begäranden behandlas centraliserat, medan anordnare av provtillfällen kan se till att de beviljade specialarrangemangen genomförs. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Information om specialarrangemang i allmänna språkexamina finns både på Utbildningsstyrelsens webbplats och i det system som används för anmälan till examen. Den som deltar i en allmän språkexamen begär specialarrangemang i samband med anmälan till examenstillfället. Ett expertutlåtande om funktionsnedsättning, sjukdom eller till exempel inlärningssvårigheter skickas till Solki. Av läkarens, psykologens eller speciallärarens utlåtande ska framgå hur deltagarens funktionsnedsättning eller övriga tillstånd påverkar avläggandet av examen. Expertutlåtanden som innehåller deltagarnas hälsouppgifter bevaras inte, utan de förstörs efter examenstillfället. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Examensanordnaren har i uppgift att i praktiken genomföra sådana specialarrangemang som deltagaren på förhand har beviljats på begäran. Specialarrangemangen kan omfatta olika paus-, grupp- och lokallösningar. Det kan till exempel vara fråga om att deltagaren ges tilläggstid för att avlägga provet eller att deltagaren avlägger provet i ett separat utrymme i en övervakares närvaro. Deltagare har också kunnat beviljas möjlighet att använda något hjälpmedel, till exempel förstoringsglas eller handledsstöd. Hjälpmedlens funktion kan vid behov testas dagen före examenstillfället. En del synskadade deltagare använder datorns skärmläsningsprogram (talsyntetisator) som omvandlar texten på skärmen till tal. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vissa andra system\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I utredningen om medborgarskapsprovet föreslog arbetsgruppen att provet ska kunna genomföras digitalt, det vill säga elektroniskt. I sin utredning behandlade arbetsgruppen också bland annat genomförandet av övervakningen av provet och förebyggandet av olika typer av missbruk (s. 63–64). Nedan granskas genomförandet av tre digitala prov – studentexamen, yrkeshögskolornas urvalsprov och teoriprovet för förarexamen – särskilt med tanke på övervakningen. Dessutom granskas specialarrangemangen kring provet samt omständigheter i anslutning till granskningen av provprestationen och erhållandet av provresultatet.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt 4&nbsp;§ i lagen om studentexamen (502/2019) ordnar läroanstalter som ger gymnasieutbildning proven i studentexamen samtidigt två gånger per år. Proven i studentexamen ordnas skriftligt eller digitalt. Studentexamensnämnden bestämmer närmare om anordnande av prov samt om tidtabeller och arrangemang. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Studentproven avläggs elektroniskt i Abitti-systemet.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.abitti.fi/\">https://www.abitti.fi/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Provsystemet består av tre delar: examinandernas datorer, provlokalens egentliga server och reservserver samt ett slutet lokalt nätverk.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.ylioppilastutkinto.fi/fi/tutkinnon-toimeenpano/kokeen-tekniset-jarjestelyt\">https://www.ylioppilastutkinto.fi/sv/verkstallandet-av-examen/tekniska-arrangemang-av-prov\u003C/a>\u003C/span>\u003C/span>\u003C/span> Studentprovet avläggs i en övervakad provlokal antingen med skolans datorer eller med examinandens egen dator. Kraven på utrustningen är låga och det behöver inte göras några permanenta ändringar på datorn, till exempel programinstallationer. Studentexamensproven utarbetas på ett särskilt kodningsspråk i nämnden. Nämnden skickar examensresultaten till alla gymnasier samtidigt genast när de är klara. Resultaten får meddelas examinanderna genast när de har anlänt till gymnasiet. Resultaten och de provprestationer som bedömts för examinanden ges till examinanden och vårdnadshavaren till en examinand under 18 år till påseende i Utbildningsstyrelsens tjänst Studieinfo. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt 9&nbsp;§ i lagen om studentexamen kan en examinand få specialarrangemang på grund av bland annat sjukdom, funktionsnedsättning eller särskilda läs- och skrivsvårigheter. Studentnämnden beslutar om användning av specialarrangemang och bestämmer också närmare om ansökan om och användning av specialarrangemang.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">De specialarrangemang som beviljas i studentprovet kan i praktiken omfatta bland annat förlängd tid och vissa hjälpmedel.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.ylioppilastutkinto.fi/fi/tutkinnon-toimeenpano/maaraykset-ja-ohjeet/koesuoritusta-heikentavan-syyn-huomioon-ottaminen \\l chapter-2\">https://www.ylioppilastutkinto.fi/sv/verkstallandet-av-examen/foreskrifter-och-anvisningar/hur-skal-som-forsamrar-en-examinands\u003C/a>\u003C/span>\u003C/span>\u003C/span> Examinanden kan utan särskilt tillstånd av studentnämnden använda sedvanliga hjälpmedel som till exempel en funktionsnedsättning förutsätter. Sådana hjälpmedel kontrolleras innan provet inleds. Trådlös elektronisk utrustning får tas in i provlokalen endast med läkarintyg. Om Folkpensionsanstalten har beviljat examinanden rätt till studietolk till exempel på grund av en hörselskada, kan examinanden använda sig av tolk utan separat beslut om specialarrangemang då provtillfället inleds och då det avslutas. Under själva provet kan tolken finnas tillgänglig så att en examinand som har behov av tolk kan kommunicera med övervakaren. Rätten till tolkning gäller inte innehållet i uppgifterna och svaren. Den tolk som används vid provet får inte vara jävig enligt jävsgrunderna i 28&nbsp;§ i förvaltningslagen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt 28 a § i yrkeshögskolelagen (932/2014) ordnas antagning av studerande till studier som leder till yrkeshögskoleexamen eller högre yrkeshögskoleexamen med en gemensam ansökan till högskolorna. Även yrkeshögskolorna använder sig av ett digitalt prov för att bedöma sökandens färdigheter för yrkeshögskolestudier. Yrkeshögskolornas urvalsprov avläggs i en separat provlokal på en egen bärbar dator i Vallu-tjänsten för urvalsprov.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.ammattikorkeakouluun.fi/hakijalle/valintatavat/amk-valintakoe/\">https://www.yrkeshogskolestudier.fi/till-sokanden/urvalsmetoder/yh-urvalsprovet/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Man kan inte delta i provet med en surfplatta eller telefon. Ungefär en vecka före provet får den sökande en länk till en identifierare samt information om tidpunkten och platsen för urvalsprovet. Vid provtillfället ska den sökande uppvisa ett identitetsbevis och identifieraren för övervakaren, ansluta sin dator till elnätet och logga in på det trådlösa provnätverket enligt instruktionerna. Endast en bärbar dator och en stängd mobiltelefon får tas in i provlokalen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yrkeshögskolornas urvalsprov består av flera delar. Varje del av urvalsprovet ska utföras inom en på förhand bestämd tid. När tiden tar slut, stängs delen automatiskt. Urvalsprovssystemet beräknar den sökandes totala poäng automatiskt utifrån urvalsprovet. Endast urvalsprovssystemet och det elektroniska material som ingår i provet får vara öppna på datorn. Alla andra program är förbjudna att använda och användning av andra program kan leda till att provet underkänns. Användning av telefon under provet betraktas som fusk och leder till att provprestationen underkänns. Även innehav av andra förbjudna anordningar eller saker eller annat svikligt förfarande kan leda till att provet underkänns. Sökanden kan beviljas individuella arrangemang på grund av sjukdom, funktionsnedsättning, lässvårigheter eller av någon annan särskild orsak.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Även teoriprovet i anslutning till körkort och förarexamen har genomförts som ett elektroniskt prov. Bestämmelser om körkort och förarexamina som krävs för framförande av motordrivna fordon finns i körkortslagen (386/2011). För att köra till exempel en personbil behövs ett körkort, för vilket man måste avlägga den utbildning som avses i 35&nbsp;§ i körkortslagen. Enligt 53 § i körkortslagen ingår i förarexamen ett teoriprov och ett körprov. Närmare bestämmelser om teoriprov, examensfordon och andra krav på förarexamen får utfärdas genom förordning av statsrådet. Transport- och kommunikationsverket får utfärda närmare föreskrifter om innehållet i teoriprov, körprov och manöverprov samt hur de genomförs i praktiken. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Transport- och kommunikationsverket Traficom har utfärdat en föreskrift om teoriprovet för förarexamen.\u003Cspan class=\"AlaviiteKooste\"> Föreskrift om teoriprov för förarexamen 30.6.2021, TRAFICOM/149520/03.04.03.00/2021 (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://traficom.fi/sites/default/files/media/regulation/Kuljettajantutkinnon%20teoriakoem%C3%A4%C3%A4r%C3%A4ys%202021.pdf\">https://traficom.fi/sites/default/files/media/regulation/F%C3%B6reskrift%20om%20teoriprov%20f%C3%B6r%20f%C3%B6rarexamen%202021.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> Den som avlägger körkort ska påvisa sina kunskaper genom att svara på frågor som kan vara verbala flervalsfrågor, bildfrågor om trafiksituationer eller riskidentifieringsfrågor som handlar om identifiering av farliga situationer och undvikande av risker. Frågorna i teoriprovet grundar sig på innehållet i vägtrafiklagstiftningen och fordonslagstiftningen samt författningar som utfärdats med stöd av dessa samt allmänna principer i vägtrafiken. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Teoriprovet för förarexamen avläggs vid ett av Transport- och kommunikationsverkets tjänsteleverantörs serviceställen Det är inte tillåtet att ta med mobiltelefoner eller annan kommunikationsutrustning eller lagringsmedium till provtillfället. Provet består av tre olika delar och svaren granskas automatiskt. Den som deltar i provet ser sina resultat omedelbart efter att ha avlagt provet och får också sitt provresultat per e-post. Vid behov kan olika specialarrangemang ordnas för provet och det får till exempel under vissa förutsättningar avläggas muntligt med förlängd svarstid. Ändring i beslutet om provresultatet får sökas bland annat genom en begäran om omprövning, även om den automatiserade granskningen av svaren kan antas minska behovet av att söka ändring. Behandlingen av en begäran om omprövning kostar 50 euro.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://traficom.fi/sites/default/files/media/file/oikaisuvaatimusohje_kuljettajantutkinto.pdf\">https://traficom.fi/sites/default/files/media/file/Anvisningar%20om%20hur%20man%20beg%C3%A4r%20ompr%C3%B6vning_Traficom.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Sammanfattningsvis kan konstateras att man vid övervakningen av prov som genomförs elektroniskt kan använda både tekniska och fysiska övervakningsmetoder. Med tekniska medel kan man till exempel begränsa åtkomsten till webbplatser och andra filer som inte ingår i provet. De övervakare som närvarar vid provtillfället kan bland annat konstatera identiteten hos deltagarna i provet, upprätthålla ordningen och se till att de som deltar i provet inte använder några förbjudna anordningar eller hjälpmedel. De olika metoderna i fråga kan också utnyttjas vid övervakningen av medborgarskapsprov som genomförs elektroniskt. &nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Migrationsverkets uppgifter \u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Nedan granskas Migrationsverkets nuvarande uppgiftsfält särskilt med tanke på vilken roll Migrationsverket skulle kunna ha i verkställandet av medborgarskapsprovet. Enligt 1 § i lagen om Migrationsverket (156/1995) finns Migrationsverket inom inrikesministeriets förvaltningsområde. I lagens 2 § föreskrivs om Migrationsverkets uppgifter. Migrationsverket handlägger och avgör de ärenden i fråga om utlänningar och finskt medborgarskap som hör till verkets uppgifter enligt lag eller med stöd av lag. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">För det andra svarar Migrationsverket för styrningen, planeringen och övervakningen av den praktiska verksamheten vid mottagande av personer som söker internationellt skydd och mottagande av personer som får tillfälligt skydd. Migrationsverket svarar för styrningen och övervakningen av förvarsenheternas praktiska verksamhet. Verket ansvarar också för driften av de statliga förläggningarna och flyktingslussarna samt statens förvarsenheter. Dessutom bär verket ansvar för styrningen av verkställigheten av hjälp till offer för människohandel.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">För det tredje ansvarar Migrationsverket för förvaltningen och utvecklingen av ärendehanteringssystemet för utlänningsärenden. För det fjärde ska Migrationsverket tillhandahålla inrikesministeriet och övriga myndigheter samt internationella organisationer information som gäller frågor inom dess verksamhetsområde. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I 3 § i medborgarskapslagen föreskrivs särskilt om Migrationsverkets uppgifter i anslutning till medborgarskap. Enligt 1&nbsp;mom. i paragrafen beslutar Migrationsverket om förvärv, behållande och förlust av finskt medborgarskap samt om bestämmande av medborgarskapsstatus. I 37&nbsp;§ i medborgarskapslagen föreskrivs dessutom om Migrationsverkets uppdrag att informera om behållande av medborgarskap. Detta har att göra med att man kan förlora sitt finska medborgarskap när man fyller 22 år om man också är medborgare i en annan stat och inte har påvisat tillräcklig anknytning till Finland.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">På handläggningen och avgörandet av ärenden som gäller utlänningar tillämpas utlänningslagen samt i vissa situationer lagen om villkor för tredjelandsmedborgares inresa och vistelse för säsongsanställning (907/2017) och lagen om villkor för inresa och vistelse för tredjelandsmedborgare inom ramen för företagsintern förflyttning av personal (908/2017). &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Bestämmelser om Migrationsverkets uppgifter finns också i lagen om mottagande. Enligt lagens 9&nbsp;§ svarar Migrationsverket för driften av statliga förläggningar. Migrationsverket ingår avtal i enlighet med 10 § om inrättande av andra förläggningar. I paragrafens 1 mom. föreskrivs om med vilka instanser avtal kan ingås. Av paragrafens 2 mom. framgår vad avtalet ska innehålla bestämmelser om. Enligt regeringens proposition (RP&nbsp;131/2016&nbsp;rd, s. 14) ska Migrationsverket vid ingåendet av avtal sträva efter lösningar som med tanke på statens intresse som helhet är förmånliga och flexibla samt beakta avtalsparternas tillförlitlighet.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vad gäller lagstiftningen om Migrationsverket kan således konstateras att verkets uppgifter i anslutning till medborgarskap framför allt fokuserar på beslutsfattande. Migrationsverket har emellertid även andra uppgifter. Det ansvarar för att upprätthålla och utveckla det system som används även i medborgarskapsärenden, det vill säga ärendehanteringssystemet för utlänningsärenden. Verket styr också den praktiska verksamheten vid mottagnings- och förvarsenheterna samt verkställandet av hjälp till offer för människohandel. I verkets uppgifter ingår dessutom att producera informationstjänster. Uppgiftsfältet sträcker sig således till många delar över ett större område än beslutsfattandet. I detta avseende bör beaktas att Migrationsverket skaffar nödvändiga tjänster även av andra instanser, varvid det konkurrensutsätter tjänsteleverantörer och ingår avtal om köpta tjänster med dem. Såväl mottagningstjänster som ändringar i datasystemen genomförs som sådana upphandlingar. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I arbetsgruppens utredning av införandet av medborgarskapsprovet (s. 75–76) ansågs det möjligt att Migrationsverket ansvarar för förvaltningen av medborgarskapsprovet. Å andra sidan funderade arbetsgruppen också på i vilken mån samma aktör både kan ansvara för medborgarskapsprovet och besluta om beviljande av medborgarskap. I uppgiftsfördelningen i anslutning till det kommande provsystemet är det viktigt att fästa uppmärksamhet vid att de aktörer som deltar i genomförandet av provet kan anses vara så objektiva och neutrala som möjligt. Således kan till exempel någon annan aktör än Migrationsverket sörja för utarbetandet av proven. Samtidigt bör det beaktas att medborgarskapsprovet avläggs uttryckligen i syfte att ansöka om och förvärva medborgarskap. Medborgarskapsprovet anknyter därmed framför allt till Migrationsverkets verksamhetsområde, varvid det är verket som har mest nytta av ett smidigt system. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">På dessa grunder kan Migrationsverket ha en central roll i genomförandet av medborgarskapsprovet, särskilt när det gäller den allmänna förvaltningen av provet. Därtill ingår det i systemet för medborgarskapsprovet uppgifter där man kan utnyttja andra aktörers sakkunskap. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sammanfattande observationer om det nya provsystemet\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I nuläget finns det inte ett färdigt examens- eller provsystem som sådant lämpar sig för att påvisa att den sökande har tillräcklig samhällskunskap för att förvärva medborgarskap. Detta innebär att ett helt nytt medborgarskapsprovsystem bör utvecklas för förfarandet för naturalisation. När man granskar andra befintliga examens- och provsystem samt inrikesministeriets utredning och forskningsdata om sättet att genomföra provet kan man identifiera flera olika delfaktorer som bör beaktas vid genomförandet av provet och i lagstiftningen i anslutning till det. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">De examenssystem som granskats i propositionen har utvecklats för ett visst syfte som fastställts i lag, varvid lagstiftningen om systemen och verkställandet av den inte till alla delar kan utnyttjas för att förverkliga ett system för medborgarskapsprovet. I synnerhet när det gäller allmänna språkexamina och anordnandet av dem kan man emellertid specificera sådana aspekter i såväl lagstiftningen som det praktiska genomförandet som också kan utnyttjas för att utveckla ett system för medborgarskapsprovet. När det gäller systemet för medborgarskapsprovet är det i synnerhet fråga om omständigheter i anslutning till förvaltningen av provsystemet och skötseln av olika uppgiftshelheter. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I den allmänna språkexamen har en del av uppgifterna centraliserats till den myndighet som ansvarar för förvaltningen av examenssystemet medan andra uppgifter sköts av de aktörer som ordnar examenstillfällen på basis av avtal och allmänna anvisningar. Utarbetandet av prov för allmän språkexamen har i sin tur centraliserats till en aktör som har den sakkunskap som är nödvändig och med vilken den myndighet som förvaltar examenssystemet har ingått ett avtal. Även vid genomförandet av medborgarskapsprovet utgör förvaltningen av provsystemet, utarbetandet av provfrågor och ordnandet av provtillfällen centrala uppgiftshelheter.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Förvaltningen av examenssystemet omfattar i den allmänna språkexamen centraliserade uppgifter såsom allmän kommunikation och anvisningar till examinanderna samt anvisningar till examensanordnarna om till exempel kontroll av identiteten. I den allmänna språkexamen finns ett centraliserat anmälningssystem som används av såväl den myndighet som förvaltar examenssystemet som av examinanderna och de aktörer som anordnar examenstillfällen. Den myndighet som förvaltar examenssystemet fattar också beslut om till exempel huruvida något som inträffat vid examenstillfället ska betraktas som fusk eller försök till fusk och vilka följder handlingen eventuellt medför för den som deltagit i provet.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I det praktiska genomförandet av den allmänna språkexamen ingår å andra sidan uppgifter som delegerats till anordnarna av examenstillfällen, till exempel att sörja för de lokaler som behövs för examenstillfällena och andra ramar samt att kontrollera examensdeltagarnas identitet och övervaka examenstillfällena. De som ordnar examenstillfällen använder anmälningssystemet för allmänna språkexamina och inför uppgifter om examenstillfällena i systemet. Vid misstanke om fusk lämnar anordnarna av examenstillfällen in en utredning till den myndighet som förvaltar examenssystemet och som efter att ha utrett ärendet och hört parten fattar beslut om eventuella påföljder.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Även de specialarrangemang som behövs vid examenstillfällena omfattar olika uppgifter i den allmänna språkexamen. Den allmänna kommunikationen och anvisningarna om specialarrangemang har centraliserats, likaså behandlingen av begäranden om specialarrangemang och beviljandet av eventuella specialarrangemang. Anordnarna av examenstillfällena ansvarar i sin tur för det praktiska genomförandet av beviljade specialarrangemang i enlighet med de anvisningar de fått. Även i fråga om begäranden om specialarrangemang i det framtida medborgarskapsprovet kan anvisningar ges och begäranden behandlas centraliserat, medan anordnare av provtillfällen kan se till att de beviljade specialarrangemangen genomförs.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Missbruk förhindras på flera olika sätt i andra examens- och provsystem. Till de metoder som används hör bland annat kontroll av deltagarnas identitet, en tekniskt sluten elektronisk provmiljö och närvaro av övervakare vid provtillfället samt påföljder som ges till följd av svikligt förfarande, till exempel underkännande av provprestationen och tidsbundet förbud mot deltagande. Även i det kommande systemet för medborgarskapsprovet är det viktigt att konstatera identiteten hos dem som deltar i provet, övervaka provtillfället med tekniska medel och med hjälp av övervakare på plats samt ge anvisningar till dem som ordnar provtillfällena. Påföljder till följd av missbruk kan omfatta såväl underkännande av en provprestation som ett tidsbegränsat förbud att delta i provet på nytt. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Migrationsverket kan ha en central roll i förvaltningen av systemet för medborgarskapsprovet eftersom medborgarskapsprovet framför allt kopplas till inrikesministeriets förvaltningsområde och Migrationsverkets ansvarsområde. Detta helhetsansvar som ankommer på myndighetsinstansen kan fullgöras på ett ändamålsenligt sätt som beaktar myndighetens nuvarande uppgifter och funktioner samt uppgifter i anslutning till systemet för medborgarskapsprovet som kräver olika slags sakkunskap. Centrala uppgiftshelheter i det kommande systemet för medborgarskapsprovet är att utarbeta ett prov och ordna provtillfällen. Enligt exemplet med de allmänna språkexamina kan dessa uppgifter ordnas så att den myndighet som ansvarar för förvaltningen kan utnyttja andra aktörers sakkunskap för att genomföra uppgifterna. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sammanfattning av bedömningen av nuläget\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Uppfyllandet av de olika villkoren för naturalisation påvisar den sökandes engagemang och integration i samhället ur flera synvinklar. I praktiken återspeglar villkoren faktorer såsom permanent bosättning i landet, språkkunskaper, iakttagande av samhällets regler och omsorg om den egna försörjningen. Genom de villkor som fastställts för att förvärva medborgarskap kan man bedöma och säkerställa att medborgarskap beviljas personer som visar att de har förmåga att fungera självständigt och ansvarsfullt i det finländska samhället. Medborgarskapslagen innehåller dock inget villkor som gäller den sökandes kännedom om det finländska samhället och som förutsätter att den sökande sätter sig in i centrala och grundläggande information om det finländska samhället. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Den lyckade integration som krävs för att förvärva medborgarskap enligt de gällande bestämmelserna i medborgarskapslagen granskas inte uttryckligen med tanke på kännedom om det finländska samhället. Det nya samhällskunskapsvillkoret kompletterar den helhet av eftersträvade kunskaper och färdigheter som anses kunna krävas av en fullvärdig medlem i samhället. Utifrån en internationell jämförelse kan konstateras att påvisande av samhällskunskap ses som en central delfaktor i olika staters förfaranden för naturalisation. Vanligtvis testas samhällskunskap med ett medborgarskapsprov, vilket är fallet till exempel i de nordiska länderna Danmark och Norge. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kravet på påvisande av samhällskunskap möjliggör en mer omfattande bedömning av en persons integration med tanke på förvärvande av medborgarskap än till exempel enbart en bedömning av språkkunskaperna. Villkoret gällande samhällskunskap bör emellertid uppfyllas så att språkkunskapernas betydelse som ett villkor för naturalisation inte minskar, eftersom språkkunskaper är en central del av integrationen. Därmed är det mest ändamålsenligt att bevara bestämmelserna om språkkunskaper i sin nuvarande form. Å andra sidan bör man i genomförandet av det nya samhällskunskapsvillkoret beakta den nivå på språkkunskaper som är ett villkor för att förvärva medborgarskap. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Förutom att det att personen sätter sig in i grundläggande information om samhället ska fastställas som ett nytt villkor för att förvärva medborgarskap, bör särskild uppmärksamhet fästas vid regleringslösningar som gäller villkoret. Det är fråga om omständigheter som gäller både själva villkoret och sättet att genomföra medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det ovan nämnda gäller till exempel vem alla som berörs av det nya villkoret. Då bör man vid sidan av de grunder som hänför sig till sökandenas ålder i regleringen gällande samhällskunskap beakta bland annat eventuella möjligheter att avvika från och jämställa villkoret. I regleringen bör för det första beaktas att medborgarskap även i fortsättningen kan beviljas sökande som inte har en faktisk möjlighet att uppfylla det nya samhällskunskapsvillkoret till exempel på grund av orsaker som hänför sig till hälsotillståndet eller funktionsnedsättning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Möjligheten att jämställa villkoret handlar om att bedöma om studier på en viss nivå kan jämföras med den information som det nya villkoret avses gälla. Det är inte nödvändigtvis ändamålsenligt att en person som redan tillägnat sig information som kan jämställas med den information som testas i medborgarskapsprovet därtill deltar i medborgarskapsprovet. Ovan i propositionen beskrivs hur samhällskunskap ingår i undervisningen på olika nivåer i det finländska utbildningssystemet. I synnerhet i gymnasiet ger undervisningen i samhällslära djupgående information om samhällets strukturer, medborgarnas roll och olika sätt att påverka. Därtill är syftet med gymnasieutbildning att stärka den breda allmänbildningen. Därmed kan den studentexamen som avläggs i slutet av gymnasieutbildningen fungera som ett alternativt sätt att påvisa tillräcklig samhällskunskap för att förvärva medborgarskap i stället för att avlägga medborgarskapsprovet. Högskoleexamina kan däremot inte avgränsas tydligt utifrån det innehåll som berör samhällskunskap och som motsvarar medborgarskapsprovet, men även personer som avlagt högskoleexamen kan beaktas i regleringen så att de inte behöver påvisa samhällskunskap genom ett medborgarskapsprov.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Såsom konstaterats i propositionen finns det i nuläget inget färdigt prov- eller examenssystem som sådant lämpar sig för att påvisa att det samhällskunskapsvillkor som avses läggas till i medborgarskapslagen uppfylls. Således bör ett helt nytt medborgarskapsprovsystem utvecklas för förfarandet för naturalisation. För att genomföra provsystemet förutsätts en ny regleringshelhet. I enlighet med det som nämnts tidigare är det då viktigt att fästa uppmärksamhet vid hur det nya provet genomförs och hurdan reglering provsystemet kräver. I regleringslösningarna bör man beakta synvinklar i anslutning till provsystemets tydlighet, rättvisa och kvalitet. Detta gäller till exempel reglering som berör olika aktörers uppgifter, innehållet i provet och rättsskydd. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I fråga om regleringen av det nya provsystemet kan man på ett ändamålsenligt sätt utnyttja vissa liknande lösningar som ingår i de befintliga examens- eller provsystem som behandlas i propositionen. I synnerhet när det gäller allmänna språkexamina och anordnandet av dem kan man specificera sådana aspekter i såväl lagstiftningen som det praktiska genomförandet som också kan utnyttjas för att utveckla ett system för medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Med tanke på systemet för medborgarskapsprovet är lösningar som hänför sig till förvaltningen av provsystemet, utarbetandet och anordnandet av provet samt provets innehåll särskilt viktiga. Uppmärksamhet bör också fästas vid övervakningen i samband med provet samt vid jämlika möjligheter att avlägga provet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det nya systemet för medborgarskapsprovet omfattar uppgifter som bör anvisas en myndighet. Sådana uppgifter är till exempel förvaltningen, övervakningen och utvecklingen av medborgarskapsprovet. Dessa uppgifter som hänför sig till det allmänna förvaltningsansvaret för systemet för medborgarskapsprovet kan anvisas Migrationsverket, eftersom det föreslagna medborgarskapsprovet är avsett att utnyttjas framför allt i det förfarande för naturalisation som hör till Migrationsverkets verksamhetsområde. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Centrala uppgiftshelheter i systemet för medborgarskapsprovet är att utarbeta ett prov och ordna provtillfällen. Det är fråga om uppgifter som till sin natur avviker från Migrationsverkets övriga uppgifter. Därför kan dessa uppgifter ordnas så att de skaffas som köpta tjänster av aktörer som har tillräcklig sakkunskap för att sköta dem. Därmed fästs också uppmärksamhet vid att de aktörer som deltar i genomförandet av provet kan anses vara så objektiva och neutrala som möjligt.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">När medborgarskapsprovet utarbetas bör det beaktas att man genom provet ska kunna bedöma kunskaperna hos den som deltar i provet på ett tillförlitligt och tillräckligt entydigt sätt. Därmed bör den som utarbetar provet ha tillräckligt högklassig och mångsidig sakkunskap. I detta avseende kan till exempel ett universitet komma i fråga. Av den aktör som anordnar medborgarskapsprovet krävs å sin sida att aktören har tillräckliga förutsättningar att anordna provet bland annat i fråga om lokaler, anordningar, personal och övervakning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Innehållet i medborgarskapsprovet kan bestå av grundläggande information som gäller verksamheten i det finländska samhället samt individens rättigheter och skyldigheter. Sådan information kan beröra till exempel central lagstiftning i det finländska samhället samt grundläggande fri- och rättigheter och mänskliga rättigheter. Dessutom kan det vara fråga om information om likabehandling, jämställdhet mellan könen samt Finlands historia och kultur. Genom ett kunskapsbaserat prov kan man bedöma hur en person som ansöker om medborgarskap kan, behärskar och förstår till exempel nämnda centrala kunskaper om hur det finländska samhället fungerar.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Med tanke på såväl den som utarbetar medborgarskapsprovet som den som avlägger provet är det ändamålsenligt att frågorna i provet grundar sig på ett på förhand fastställt och allmänt tillgängligt läromedel. På så sätt kan man säkerställa att provet är transparent och jämlikt. I fråga om innehållet i provet kan befintliga läromedel utnyttjas. Läromedel som används för samhällsorientering enligt integrationslagen kan komma i fråga.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/sv/laromedel\">https://yhteiskuntaorientaatio.fi/sv/laromedel\u003C/a>\u003C/span>\u003C/span>\u003C/span> Samhällsorienteringen innehåller sådan information om olika ämnesområden som berör det finländska samhället som kan anses vara central med tanke på provets syfte och mål. I läromedlet behandlas i omfattande utsträckning till exempel hur det finländska samhället fungerar och hur man kan påverka det, det finländska rättssystemet och dess olika drag samt Finlands historia. Utifrån läromedlet för samhällsorientering kan man utarbeta ett läromedel för medborgarprovet som motsvarar provets innehåll och omfattning och som på ett ännu mer ändamålsenligt sätt lämpar sig för medborgarskapsprovets användningsändamål och som självstudiematerial för personer som förbereder sig för provet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det är ändamålsenligt att genomföra medborgarskapsprovet i elektronisk form, varvid avläggandet av provet i sig återspeglar sådana digitala färdigheter som krävs för att fungera i det finländska samhället. Med tanke på de kunskaper som testas i medborgarskapsprovet skulle den lämpligaste provformen kunna vara ett flervalsprov som innehåller frågor och svarsalternativ som utarbetats utifrån läromedlet. Då finns det inget behov av att bedöma provprestationen utifrån separata bedömningskriterier. Således skulle ett relativt enkelt genomförandesätt möjliggöra ett effektivt genomförande av provet till exempel i fråga om granskningen av provresultaten, på samma sätt som när det gäller till exempel det teoriprov som ingår i förarexamen och som beskrivs i propositionen. Av den som förvärvar medborgarskap förutsätts att personen behärskar finska eller svenska, så det är motiverat att ordna även medborgarskapsprovet på finska och svenska. Denna lösning understöds också av perspektiv som hänför sig till hur smidigt och kostnadseffektivt genomförandet av provet är.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Dessutom bör man sörja för att det finns lämpliga och tillräckliga förfaranden för underkända provprestationer. Såsom lyftes fram ovan förutsätter ett medborgarskapsprov som genomförs i form av ett
