ens område. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förarbetena till grundlagen (RP 1/1998 rd, s. 131–132) kan den som utfärdar en förordning bemyndigas att utfärda närmare bestämmelser om smärre detaljer som gäller en enskild persons rättigheter och skyldigheter. En bemyndigande lag ska uppfylla de krav på exakthet och noggrann avgränsning vilka förutsätts i grundlagsutskottets utlåtandepraxis. Dessutom ska även ärenden som omfattas av lagens tillämpningsområde föreskrivas genom lag. Hänvisningen täcker alla ärenden som enligt någon bestämmelse i grundlagen ska föreskrivas genom lag. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Samhällskunskapsvillkoret enligt förslaget i denna proposition kan uppfyllas bland annat genom att avlägga medborgarskapsprovet. Det föreslås att det finns bestämmelser om det nya medborgarskapsprovet i nya 3 a kap. som fogas till medborgarskapslagen. En del av de nya paragraferna om medborgarskapsprovet omfattar dock även ett bemyndigande att utfärda förordning. Enligt förslaget är det genom förordning av statsrådet möjligt att utfärda närmare bestämmelser om innehållet i medborgarskapsprovet, uppgifterna för den som utarbetar och anordnar provet och uppgifterna för den sakkunnigkommission som inrättas för medborgarskapsprovet. Bemyndigandena att utfärda förordning finns i samband med varje enskild grundläggande bestämmelse som föreslås till lagen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Innehållet i medborgarskapsprovet och det anknutna bemyndigandet att utfärda förordning föreskrivs i nya 25 a §. Enligt de bestämmelser som föreslås till lagen testas genom medborgarskapsprovet grundläggande kunskaper om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Frågorna i flervalsprovet baserar sig på ett allmänt tillgängligt läromedel för medborgarskapsprovet, vilket har utarbetats utifrån läromedlet för samhällsorientering enligt 25 § i lagen om främjande av integration. Frågorna i provet gäller Finlands centrala lagstiftning, de grundläggande fri- och rättigheterna och de mänskliga rättigheterna, jämlikheten mellan könen, Finlands historia och kultur samt andra centrala uppgifter som ingår i läromedlet för medborgarskapsprovet. Medborgarskapsprovet avläggs på finska eller svenska. Provet avläggs elektroniskt, såvida det inte finns hinder för elektroniskt genomförande. En godkänd prestation i medborgarskapsprovet förutsätter att största delen av svaren har valts rätt i flervalsprovet. Det är möjligt att utfärda närmare bestämmelser om provets innehåll genom förordning av statsrådet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Uppgifterna för den som utarbetar medborgarskapsprovet och det anknutna bemyndigandet att utfärda förordning föreskrivs i nya 25 c §. Det föreslås att lagen innehåller bestämmelser om att den som utarbetar provet har till uppgift att utarbeta ett läromedel för medborgarskapsprovet utifrån läromedlet för samhällsorientering, bereda ett brett urval av frågor inklusive svarsalternativ på finska och svenska för medborgarskapsprovet, sköta testningen, förvaltningen och utvecklingen av läromedlet, frågorna och svarsalternativen för provet samt delta i sakkunnigkommissionens verksamhet. Närmare bestämmelser om uppgifterna för dem som utarbetar provet och innehållet i avtalen om dessa kan utfärdas genom förordning av statsrådet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Bestämmelserna om uppgifterna för dem som anordnar ett medborgarskapsprov och bemyndigandet att utfärda förordning finns i nya 25 e §. Enligt de bestämmelser som föreslås för lagen har den som anordnar ett prov till uppgift att anordna provtillfällena enligt avtalsvillkoren, sköta övervakningen av provtillfällen, genomföra specialarrangemang och underrätta Migrationsverket om situationer med brott mot ordningen och svikliga förfaranden, så att verket kan fatta beslut om eventuella påföljder. Närmare bestämmelser om uppgifterna för dem som anordnar ett prov och innehållet i avtalen om dessa kan utfärdas genom förordning av statsrådet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att nya 25 f § innehåller bestämmelser om den sakkunnigkommission som verkar i anslutning till Migrationsverket. Paragrafen innehåller även ett bemyndigande att utfärda förordning som gäller kommissionen. Dessutom utfärdas bestämmelser om att en företrädare för Migrationsverket är ordförande för kommissionen, att en företrädare för sakkunskap inom integration i möjligaste mån är vice ordförande och att sakkunnigmedlemmarna dessutom företräder sakkunskap åtminstone inom utbildning samt om den som utarbetar och anordnar medborgarskapsprovet. Lagen innehåller även bestämmelser om att kommissionen har till uppgift att stödja Migrationsverket i den allmänna utvecklingen och förvaltningen av medborgarskapsprovet. Dessutom innehåller lagen bestämmelser om att kommissionen på begäran av Migrationsverket ger ett utlåtande beträffande en begäran om omprövning som gäller medborgarskapsprovet. Det är möjligt att utfärda närmare bestämmelser om kommissionens sammansättning, dess behandling av ärenden och dess uppgifter genom förordning av statsrådet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sammanfattningsvis kan det konstateras att bemyndigandena att utfärda förordning om innehållet i medborgarskapsprovet, uppgifterna för den som utarbetar och anordnar provet samt sakkunnigkommissionen för provet är förenliga med kraven i grundlagen. Grunderna för en individs rättigheter och skyldigheter och villkoren för att bevilja medborgarskap föreskrivs genom lag. Genom förordning av statsrådet är det möjligt att utfärda närmare bestämmelser om vissa detaljer som gäller genomförandet av medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Propositionen innehåller även ett förslag om en provavgift (nya 25 i §). I enlighet med principen i lagen om grunderna för avgifter till staten baserar sig avgiften på självkostnadsprincipen och med den täcks de kostnader som orsakas av systemet med medborgarskapsprov. Beloppet av provavgiften föreskrivs genom förordning av inrikesministeriet, vilken även omfattar avgiftsbeläggningen för Migrationsverkets prestationer.\u003Cspan class=\"AlaviiteTeksti\"> Även avgiftsbeläggningen för avgifterna för till exempel år 2026 föreskrivs genom förordning av inrikesministeriet. \u003C/span> &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I propositionen föreslås därtill att det är möjligt att framföra en begäran om omprövning av ett beslut om en underkänd provprestation i medborgarskapsprovet till Migrationsverket (nya 42 §). Inrikesministeriets förordning om Migrationsverkets avgiftsbelagda prestationer innehåller även bestämmelser om behandlingsavgiften för begäran om omprövning.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Internationella konventioner\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Enligt artikel&nbsp;15 i den allmänna förklaringen om de mänskliga rättigheterna (1948) har var och en rätt till en nationalitet. Enligt andra stycket i artikeln får ingen godtyckligt fråntas sin nationalitet eller nekas rätten att ändra nationalitet. Rätten till medborgarskap ingår även i flera internationella konventioner som binder Finland. Till exempel enligt artikel 24.3 i den internationella konventionen om medborgerliga och politiska rättigheter (FördrS 7 och 8/1976) har varje barn rätt att förvärva ett medborgarskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att ett nytt samhällskunskapsvillkor fogas till villkoren för att bevilja medborgarskap. Detta villkor kan påvisas genom att avlägga det nya medborgarskapsprovet eller student- eller högskoleexamen. Nedan behandlas mer ingående föreskrifterna i olika internationella fördrag i synnerhet med tanke på beviljande av medborgarskap.&nbsp;\u003C/p>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konventionen om barnets rättigheter\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I artikel 1 i konventionen om barnets rättigheter avses med barn varje människa under 18 år, om inte myndighet uppnås tidigare enligt den lag som gäller för barnet. Enligt första stycket i artikel 2 i konventionen skall konventionsstaterna respektera och tillförsäkra varje barn inom deras jurisdiktion de rättigheter som anges i denna konvention, utan åtskillnad av något slag och oavsett barnets eller dess föräldrars eller vårdnadshavares ras, hudfärg, kön, språk, religion, politisk eller annan åskådning nationella, etniska eller sociala ursprung, egendom, handikapp, börd eller ställning i övrigt. Enligt andra stycket skall konventionsstaterna vidta alla lämpliga åtgärder för att säkerställa att barnet skyddas mot alla former av diskriminering eller bestraffning på grund av föräldrars, vårdnadshavares eller familjemedlemmars ställning, verksamhet, uttryckta åsikter eller tro. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt första stycket i artikel 3 i konventionen skall barnets bästa komma i främsta rummet vid alla åtgärder som rör barn, vare sig de vidtas av offentliga eller privata välfärdsinstitutioner, domstolar, administrativa myndigheter eller lagstiftande organ. Kommittén för barnets rättigheter har behandlat det främsta rummet för barnets bästa i sin allmänna kommentar nr 14 från år 2013 (CRC/C/GC/14). Kommittén har i punkt 30 i sin allmänna kommentar betonat att beslut som fattas av administrativa myndigheter på alla nivåer spänner över ett mycket stort område och bland annat gäller tillgång till medborgarskap. Förvaltningsmyndigheterna ska i de enskilda beslut som de fattar bedöma barnets bästa, som besluten ska styra.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt första stycket i artikel 7 skall barnet registreras omedelbart efter födseln och skall från födseln ha rätt till ett namn, rätt att få ett medborgarskap och, så långt det är möjligt, rätt att få vetskap om sina föräldrar och bli omvårdat av dem. Konventionsstaterna skall säkerställa genomförandet av dessa rättigheter i enlighet med sin nationella lagstiftning och sina skyldigheter enligt tillämpliga internationella instrument på detta område, särskilt i de fall då barnet annars skulle vara statslös. Enligt första stycket i artikel 8 åtar sig konventionsstaterna att respektera barnets rätt att behålla sin identitet, innefattande medborgarskap, namn och släktförhållanden såsom dessa erkänns i lag, utan olagligt ingripande.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 12 skall konventionsstaterna tillförsäkra det barn som är i stånd att bilda egna åsikter rätten att fritt uttrycka dessa i alla frågor som rör barnet. Barnets åsikter skall tillmätas betydelse i förhållande till barnets ålder och mognad. För detta ändamål ska barnet särskilt beredas möjlighet att höras i rättsliga eller administrativa åtgärder som gäller honom eller henne, antingen direkt eller genom en företrädare eller ett lämpligt organ och på ett sätt som är förenligt med procedurreglerna enligt den nationella lagstiftningen.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kommittén för barnets rättigheter har behandlat barnets rätt att bli hörd i sin allmänna kommentar nr 12 från år 2009 (CRC/C/GC/12). Enligt punkt 20 i den allmänna kommentaren ska konventionsstaterna förutsätta att barnet är i stånd att bilda sina egna åsikter och erkänna att barnet har rätt att uttrycka dessa. För att barnets rätt att fritt uttrycka sina åsikter ska förverkligas måste enligt 25 punkten de som är ansvariga för att höra barnet, samt barnets föräldrar eller vårdnadshavare, informera barnet om de frågor det gäller, vilka valmöjligheter som finns och vilka beslut som kan komma att fattas, och vad de kan få för följder. Den rätt till information är väldigt betydelsefull, eftersom den är en grundläggande förutsättning för att barnet ska fatta tydliga beslut.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor för att förvärva medborgarskap och införande av ett medborgarskapsprov. Ändringarna gäller endast medborgarskap som beviljas på ansökan. I propositionen föreslås däremot inte ändringar om grunderna för barn att få finskt medborgarskap, till exempel direkt på grundval av födelse (2 kap. i medborgarskapslagen). Även de olika anmälningarna om medborgarskap förblir oförändrade (4 kap. i medborgarskapslagen). De föreslagna ändringarna påverkar således inte till exempel bestämmelserna för att hindra att barn som föds i Finland blir statslösa och inte heller medborgarskapsanmälningar som gäller barn.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I samband med naturalisation kan det anses vara förenligt med barnets bästa att få medborgarskap i bosättningslandet, eftersom barnet då inte är utlänning i landet och till exempel inte behöver uppehållstillstånd. Också familjens gemensamma medborgarskap kan anses vara barnets intresse. Ett barn har även rätt till att behålla sitt medborgarskap och det ursprungliga medborgarskapet är en del av barnets identitet. Med tanke på tillgodoseendet av barnets rättigheter är det väsentligt att barnet i enlighet med 5&nbsp;§ i medborgarskapslagen hörs med anledning av en ansökan och anmälan som gäller barnet. Ett barn hörs om en ansökan eller ett meddelande om medborgarskap och då medborgarskap ansöks för honom eller henne som medsökande tillsammans med sin vårdnadshavare samt då ansökan eller meddelandet gjorts enkom för barnets räkning. I denna proposition föreslås inte ändringar av bestämmelserna om hörande av barn.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt 43&nbsp;§ i medborgarskapslagen kan ett barn beviljas medborgarskap tillsammans med sin vårdnadshavare, och till denna del föreslås inga ändringar i denna proposition. Medborgarskapslagen möjliggör således även framöver att hela familjen kan beviljas medborgarskap samtidigt. Även framöver är en förutsättning för att få medborgarskap som medsökande att även en vårdnadshavare som är sökande på samma gång kan beviljas medborgarskap. Dessutom kan ett barn även i fortsättningen naturaliseras ensam under de förutsättningar som anges i 24&nbsp;§ i medborgarskapslagen. Även framöver kan en vårdnadshavare eller intressebevakare göra en ansökan för ett barns räkning.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det nya samhällskunskapsvillkoret och det anknutna medborgarskapsprovet gäller inte för personer under 18 år. I samband med en medborgarskapsansökan av en förälder förutsätts inte att ett barn som är medsökande påvisar samhällskunskaper. Ett barn som är sökande (24 §) omfattas inte heller av det villkor som gäller samhällskunskaper. Samhällskunskapsvillkoret gäller däremot en förälder till en medsökande. Enligt förslaget är det möjligt att påvisa att villkoret är uppfyllt genom att avlägga medborgarskapsprovet eller student- eller högskoleexamen. Utgångspunkten är fortfarande att sökanden ska uppfylla villkoren för naturalisation för att sökanden och sökandens eventuella medsökanden ska få medborgarskap. Samma princip gäller till exempel även för språkkunskapsvillkoret, oförvitlighetsvillkoret och försörjningsvillkoret.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt punkt 12 i barnrättskommitténs allmänna kommentar nr 5 (CRC/GC/2003/5) förutsätts det att varje lagstiftnings-, förvaltnings- och rättsorgan eller -institution systematiskt tillämpar principen om barnets bästa när de överväger hur deras beslut och åtgärder påverkar eller kommer att påverka barnens rättigheter och intressen, till exempel föreslagna eller nuvarande lagar eller politik, administrativa åtgärder eller domstolsbeslut, inklusive även de som inte direkt berör barnen utan påverkar dem indirekt.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Barnets bästa har beaktats i det föreslagna samhällskunskapsvillkoret på så sätt att villkoret inte gäller personer under 18 år. Barn som bor stadigvarande i Finland har läroplikt fram till att de fyller 18 år. Således går barn, det vill säga personer under 18 år, ännu i skolan, varför det inte är behövligt att kräva att de avlägger ett separat medborgarskapsprov. Å andra sidan kan det även anses att det är förenligt med barnets bästa att hans eller hennes förälder har grundläggande kunskaper om hur det finländska samhället fungerar och en individs rättigheter och skyldigheter. I och med de föreslagna ändringarna förutsätts att dessa kunskaper påvisas i princip av alla vuxna i den arbetsföra åldern för att medborgarskap ska kunna beviljas på ansökan. Även föräldrar som ansöker om medborgarskap åt sig själva och sina barn ska således påvisa att de inhämtat centrala kunskaper om det finländska samhället genom medborgarskapsprovet eller student- eller högskoleexamen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Genom förslagen beaktas dock även rimliga möjligheter att uppfylla villkoret för föräldrar. Enligt förslaget kan Migrationsverket bevilja en förälder sådana specialarrangemang för att avlägga medborgarskapsprovet vilka han eller hon behöver på grund av bland annat en funktionsnedsättning. Enligt förslaget är det därtill möjligt att avvika från samhällskunskapsvillkoret bland annat utifrån en funktionsnedsättning som långvarigt hindrar en förälder som är sökande från att uppfylla detta villkor. Samhällskunskapsvillkoret och medborgarskapsprovet bildar således inte något hinder för att barn ska få medborgarskap då en förälder har en funktionsnedsättning. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konventionen angående flyktingars rättsliga ställning\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 34 i konventionen angående flyktingars rättsliga ställning (FördrS 77/1968) ska de fördragsslutande staterna så mycket som möjligt underlätta flyktingars införlivande med samhället och deras naturalisation. Särskilt ska fördragsslutande stat bemöda sig om att påskynda naturalisationsförfarandet och att så mycket som möjligt minska avgifterna och kostnaderna för detta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det samhällskunskapsvillkor som föreslås i denna proposition gäller i princip även för flyktingar. Inga ändringar som gäller särskilt för flyktingar föreslås till medborgarskapslagen. De föreslagna ändringarna gäller inte sådana bestämmelser i medborgarskapslagen vars syfte är att underlätta naturalisation av personer som fått flyktingstatus. Medborgarskapsansökningar av personer som beviljats internationellt skydd ska även framöver i enlighet med 20&nbsp;a&nbsp;§ behandlas skyndsamt och senast inom ett år. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konventionen angående statslösa personers rättsliga ställning\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 32 i konventionen angående statslösa personers rättsliga ställning (FördrS 80/1968) ska de fördragsslutande staterna så mycket som möjligt underlätta statslösa personers införlivande med samhället och deras naturalisation. Särskilt ska fördragsslutande stat bemöda sig om att påskynda naturalisationsförfarandet och att så mycket som möjligt minska avgifterna och kostnaderna för detta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det samhällskunskapsvillkor som föreslås i denna proposition gäller i princip även sökanden som är statslösa, det vill säga sådana som saknar medborgarskap. Inga ändringar som gäller särskilt för statslösa föreslås till medborgarskapslagen. De föreslagna ändringarna gäller inte sådana bestämmelser i medborgarskapslagen vars syfte är att underlätta naturalisation av statslösa. Den boendetid som krävs för statslösa förblir även framöver kortare än i allmänhet (20 § i medborgarskapslagen). Dessutom ska medborgarskapsansökningar som gäller statslösa personer i enlighet med 20&nbsp;a&nbsp;§ behandlas skyndsamt och senast inom ett år. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konventionen om rättigheter för personer med funktionsnedsättning\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel&nbsp;1 i konventionen om rättigheter för personer med funktionsnedsättning (FördrS 26 och 27/2016) innefattar personer med funktionsnedsättning bland annat personer med varaktiga fysiska, psykiska, intellektuella eller sensoriska funktionsnedsättningar, vilka i samspel med olika hinder kan motverka deras fulla och verkliga deltagande i samhället på samma villkor som andra. Enligt artikel 18 i konventionen erkänner konventionsstaterna att personer med funktionsnedsättning på lika villkor som andra har rätt att förvärva och ändra medborgarskap och att inte fråntas detta godtyckligt eller på grund av funktionsnedsättning.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Artikel 5 i konventionen gäller jämlikhet och icke-diskriminering. Konventionsstaterna erkänner att alla personer är lika inför och enligt lagen och utan någon diskriminering berättigade till lika skydd och lika förmåner enligt lagen. Konventionsstaterna förbjuder all diskriminering på grund av funktionsnedsättning och garanterar personer med funktionsnedsättning lika och effektivt rättsligt skydd mot diskriminering på alla grunder. För att främja jämlikhet och avskaffa diskriminering vidtar konventionsstaterna alla ändamålsenliga åtgärder för att säkerställa att skälig anpassning tillhandahålls. Särskilda åtgärder som är nödvändiga för att påskynda eller uppnå faktisk jämlikhet för personer med funktionsnedsättning ska inte betraktas som diskriminering enligt konventionen. Enligt artikel 2 i konventionen avser ”skälig anpassning” nödvändiga och ändamålsenliga ändringar och anpassningar, som inte innebär en oproportionerlig eller omotiverad börda när så behövs i ett enskilt fall för att säkerställa att personer med funktionsnedsättning på samma villkor som andra kan åtnjuta eller utöva alla mänskliga rättigheter och grundläggande friheter. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Artikel 9 i konventionen gäller tillgänglighet. För att göra det möjligt för personer med funktionsnedsättning att leva oberoende och att fullt ut delta på alla livets områden, vidtar konventionsstaterna ändamålsenliga åtgärder för att säkerställa att personer med funktionsnedsättning får tillgång på samma villkor som andra till den fysiska miljön, till transporter, till information och kommunikation, innefattande informations- och kommunikationsteknik och system samt till andra anläggningar och tjänster som är tillgängliga för eller erbjuds allmänheten både i städerna och på landsbygden. Dessa åtgärder, som ska innefatta identifiering och undanröjande av hinder och barriärer mot tillgänglighet, ska bland annat a) gälla byggnader, vägar, transportmedel och andra inom- och utomhusanläggningar, däribland skolor, bostäder, vårdinrättningar och arbetsplatser, samt b) information, kommunikation och annan service, däribland elektronisk service och service i nödsituationer. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor för att få medborgarskap. Detta villkor kan påvisas genom att avlägga medborgarskapsprovet eller student- eller högskoleexamen. Vid genomförandet av medborgarskapsprovet ser man till att den elektroniska och fysiska provmiljön är tillgänglig och nåbar och att man gör de skäliga anpassningar som behövs av personer med funktionsnedsättning. Migrationsverket kan för medborgarskapsprovet bevilja sådana specialarrangemang som den som deltar i provet på grund av sin funktionsnedsättning behöver för att kunna avlägga provet. De aktörer med vilka verket ingått ett avtal om anordnande av provtillfällen ansvarar för att genomföra de specialarrangemang som beviljats av Migrationsverket. Medborgarskapsprovet med behövliga specialarrangemang är en fas som föregår ansökan om medborgarskap. I propositionen föreslås dessutom att det är möjligt att avvika från samhällskunskapsvillkoret i samband med en medborgarskapsansökan, om en funktionsnedsättning hos sökanden långvarigt hindrar honom eller henne från att uppfylla villkoret. Avsikten är att på detta sätt säkerställa att även personer med funktionsnedsättning har en jämlik rätt till medborgarskap och att förvärva sådant. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Internationella konventionen om avskaffande av alla former av rasdiskriminering\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 5 i den internationella konventionen om avskaffandet av alla former av rasdiskriminering (FördrS 37/1970) förbinder sig konventionsstaterna att tillförsäkra rätten för var och en, utan åtskillnad på grund av ras, hudfärg, nationalitet eller etniskt ursprung, till likhet inför lagen, särskilt när det gäller åtnjutande av de rättigheter som nämns i konventionen, i vilka ingår även rätten till en nationalitet. Enligt artikel 1.3 i konventionen får inget i konventionen tolkas så att det på något sätt inverkar på konventionsstaternas rättsregler rörande nationalitet, medborgarskap eller naturalisering, under förutsättning att dessa regler icke diskriminerar mot någon särskild nationalitet.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Konventionen förutsätter således att lagstiftningen om naturalisation inte diskriminerar någon särskild nationalitet. I denna proposition föreslås inga sådana ändringar som särskilt gäller företrädare för en viss nationalitet.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Den europeiska konventionen om medborgarskap\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 2 i den europeiska konventionen om medborgarskap avses med medborgarskap det rättsliga förhållandet mellan en person och en stat och termen har inte avseende på en persons etniska ursprung. Enligt artikel 6.3 i konventionen ska varje konventionsstat i sin nationella lagstiftning medge möjlighet till naturalisation för personer som har legalt och varaktigt hemvist inom dess territorium. Vid uppställandet av villkor för naturalisation ska konventionsstaten inte fastställa längre tid än tio år för hemvist som ska ha förflutit innan ansökan kan göras. Stater kan enligt motiveringspromemorian till konventionen (s. 9) föreskriva andra villkor för att få medborgarskap utöver boendetiden, särskilt i anslutning till integration. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 6.4 i konventionen ska varje konventionsstat i sin nationella lagstiftning underlätta förvärv av medborgarskap i staten för vissa personer. Dessa är a) äkta makar till medborgare i staten, b) barn till någon medborgare i staten som avses i undantaget i artikel 6.1 a, c) barn till föräldrar av vilka den ene förvärvar eller har förvärvat medborgarskap i staten, d) barn som adopterats av någon medborgare i staten, e) personer födda inom statens territorium som har legalt och varaktigt hemvist där, f) personer som har legalt och varaktigt hemvist inom statens territorium under en tidsperiod som börjat före artonårsdagen; tidsperiodens längd ska bestämmas i den berörda konventionsstatens nationella lagstiftning och g) statslösa personer och personer som är erkända som flyktingar som har legalt och varaktigt hemvist inom statens territorium.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Artiklarna 10–13 i konventionen om medborgarskap innehåller bestämmelser om förfaranden angående medborgarskap. Ansökningar om förvärv, bibehållande, förlust, återvinning och bekräftelse av medborgarskap ska behandlas inom skälig tid. Besluten ska innehålla en skriftlig motivering. Besluten ska kunna underkastas omprövning i enlighet med statens nationella lagstiftning och avgifterna ska vara skäliga. Avgifterna för administrativ eller judiciell omprövning får inte vara ett hinder för de sökande.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt motiveringspromemorian till konventionen (s. 14–15) ska beslut om förvärv och förlust av medborgarskap motiveras skriftligen och det ska vara möjligt att söka ändring i dem. I beslutet ska åtminstone anges de rättsliga och faktiska grunderna för beslutet. Skriftliga motiveringar behövs dock inte om det endast är fråga om registrering av att en person har förvärvat eller förlorat sitt medborgarskap direkt med stöd av lag. Om besluten har anknytning till den nationella säkerheten räcker det med ett minimiantal uppgifter. När det gäller ändringssökande är det viktigt att beslut som gäller medborgarskap kan överklagas. Konventionsstaterna får i sin interna lagstiftning besluta om detaljerna i förfarandet.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att ett nytt samhällskunskapsvillkor fogas för naturalisation och därtill att ett medborgarskapsprov införs i Finland. Bakgrunden till såväl det nya villkoret som medborgarskapsprovet är en tanke om att integration kan förutsättas av personer som bor i Finland för att de ska få medborgarskap, vilket står i samklang med konventionen om medborgarskap. Det är möjligt att uppfylla samhällskunskapsvillkoret genom studentexamen eller högskoleexamen eller det föreslagna nya medborgarskapsprovet, som testar grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Centrala kunskaper om dessa ämnen kan anses vara ett sådant krav som anknyter till integration, vilket i ljuset av motiveringspromemorian till konventionen om medborgarskap kan ställas vid sidan om boendetid av en viss tid. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">För vissa personer underlättas förvärvet av medborgarskap även framöver med en kortare boendetid, en maximihandläggningstid eller ett förenklat förfarande och till dessa delar föreslås i denna proposition inte ändringar i medborgarskapslagen. I denna proposition föreslås inte heller ändringar som gäller förfarandet för att ansöka om medborgarskap eller sökande av ändring i beslut om medborgarskap. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konventionen om skydd för de mänskliga rättigheterna och de grundläggande friheterna\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Konventionen om skydd för de mänskliga rättigheterna och de grundläggande friheterna (FördrS 18 och 19/1990; sådan den lyder senare ändrad i FördrS 71 och 72/1994, FördrS 85 och 86/1998, FördrS 8 och 9/2005, FördrS 6 och 7/2005 samt FördrS 50 och 51/2010;&nbsp;\u003Cspan class=\"KursiiviTeksti\">Europeiska människorättskonventionen\u003C/span>) med tilläggsprotokoll innehåller inte någon sådan föreskrift som gäller rätten till medborgarskap. Europeiska människorättsdomstolen (Europadomstolen) har dock ansett att godtycklig vägran av medborgarskap kan bedömas med tanke på skyddet för privatlivet enligt artikel 8 i konventionen (bland annat Karassev mot Finland, 31414/96, 12.1.1999). Europadomstolen har bedömt förvärv av medborgarskap även med tanke på förbudet mot diskriminering enligt artikel 14 i konventionen (bland annat Genovese mot Malta, 53124/09, 11.10.2011). Europadomstolen har likaså konstaterat att en viss boendetid eller att äktenskapet varat en viss tid är allmänt i lagstiftningen om beviljande av medborgarskap (Savoia och Bounegru mot Italien, 8407/05, 16.2.2006). Utöver medborgarskap har Europadomstolen även i flera mål bedömt fråntagande av medborgarskap (bland annat Ramadan mot Malta, 76136/12, 21.6.2016; K2 mot Förenade kungariket, 42387/13, 9.3.2017). &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 8 i Europakonventionen har var och en rätt till skydd för sitt privat- och familjeliv, sitt hem och sin korrespondens. Myndigheterna får inte inskränka åtnjutande av denna rättighet annat än med stöd av lag och om det i ett demokratiskt samhälle är nödvändigt med hänsyn till statens säkerhet, den allmänna säkerheten, landets ekonomiska välstånd eller till förebyggande av oordning eller brott till skydd för hälsa eller moral eller för andra personers fri- och rättigheter. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt artikel 14 i Europakonventionen ska åtnjutandet av de fri- och rättigheter som anges i denna konvention säkerställas utan diskriminering på någon grund såsom kön, ras, hudfärg, språk, religion, politisk eller annan åsikt, nationellt eller socialt ursprung, tillhörighet till nationell minoritet, förmögenhet, börd eller ställning i övrigt. Konventionen har kompletterats med ett protokoll som förbjuder all slags diskriminering och som innehåller ett generellt förbud mot diskriminering (FördrS 8–9/2005). Enligt första stycket i artikel 1 i protokollet ska åtnjutandet av varje rättighet som anges i lag säkerställas utan diskriminering på någon grund såsom kön, ras, hudfärg, språk, religion, politisk eller annan åsikt, nationellt eller socialt ursprung, tillhörighet till nationell minoritet, förmögenhet, börd eller ställning i övrigt. Enligt artikel 2 ska ingen bli diskriminerad av en offentlig myndighet på någon grund såsom dem som nämnts under punkt 1. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor för att få medborgarskap och att ett medborgarskapsprov införs i Finland. I flera andra länder används redan ett medborgarskapsprov (läs om medborgarskapsprov i andra länder ovan i 5.2). I flera länder krävs att man påvisar kunskaper om samhället antingen genom ett medborgarskapsprov eller på något annat sätt. I det föreslagna medborgarskapsprovet testas centrala kunskaper om det finländska samhället vilka baserar sig på det allmänt tillgängliga läromedlet. Specialarrangemang för att avlägga provet kan beviljas bland annat utifrån en funktionsnedsättning. Dessutom är det möjligt att avvika från samhällskunskapsvillkoret bland annat utifrån den grunden att en funktionsnedsättning hos sökanden långvarigt hindrar honom eller henne från att uppfylla villkoret. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">På grund av dessa orsaker kan det bedömas att samhällskunskapsvillkoret och medborgarskapsprovet inte kränker skyddet för privatlivet enligt artikel 8 i Europakonventionen och inte heller diskrimineringsskyddet enligt artikel 14. I propositionen föreslås inga ändringar i bestämmelserna om förlust av medborgarskap. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Unionsrätten\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Enligt artikel 9 i fördraget om Europeiska unionen (FEU) och artikel 20.1 i fördraget om Europeiska unionens funktionssätt (FEUF) ska varje person som är medborgare i en medlemsstat vara unionsmedborgare. Enligt artikel 45 i Europeiska unionens stadga om de grundläggande rättigheterna har varje unionsmedborgare rätt att fritt röra sig och uppehålla sig inom medlemsstaternas territorier. Enligt artikel 39 i stadgan om de grundläggande rättigheterna ska unionsmedborgare i den medlemsstat där de är bosatta ha rösträtt och vara valbara vid val till Europaparlamentet och enligt artikel 40 i stadgan på motsvarande sätt i kommunala val. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">En finsk medborgare är på samma gång även unionsmedborgare. För tredjelandsmedborgare innebär förvärv av finskt medborgarskap således unionsmedborgarskap och därmed tillhörande rättigheter. I denna proposition föreslås ett nytt samhällskunskapsvillkor för att få medborgarskap. Detta villkor kan påvisas genom att avlägga det nya medborgarskapsprovet eller student- eller högskoleexamen. De föreslagna ändringarna påverkar hur en person som bor i Finland kan få finskt medborgarskap på ansökan. I fråga om medborgare i tredjeländer påverkar de föreslagna ändringarna även möjligheten att få unionsmedborgarskap och de anknutna rättigheterna. Ett medborgarskapsprov används även i flera andra medlemsstater i Europeiska unionen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt Europeiska unionens domstol (EU-domstolen) utgör artikel 20 i FEUF-fördraget ett hinder för nationella åtgärder som leder till att unionsmedborgarna i själva verket inte kan utöva de rättigheter som de har på grund av sin ställning som unionsmedborgare (Ruiz Zambrano mot Office national de l'emploi, dom av den 8 november 2011 C-34/09). De ändringar som föreslås i denna proposition påverkar inte unionsmedborgarnas möjligheter att i Finland utöva sina rättigheter som unionsmedborgare. De föreslagna ändringarna hänför sig inte exempelvis till den fria rörligheten för unionsmedborgare. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Europeiska unionens domstol (EU-domstolen) har behandlat förlust av medborgarskap i sina avgörande (bland annat Rottmann mot Freistaat Bayern, dom 2.3.2010 C-135/08; Tjebbes m.fl. mot Nederländerna, dom 12.3.2019 C-221/17). Bestämmelserna om förvärv och förlust av medborgarskap omfattas av medlemsstaternas behörighet, men förlust av unionsmedborgarskap och de anknutna rättigheterna omfattas av unionsrättens tillämpningsområde. Vid bedömningen av förlust av medborgarskap ska uppmärksamhet fästas vid konsekvenserna av förlust av unionsmedborgares rättigheter för personen själv och eventuellt för hans eller hennes familjemedlemmar. Enligt EU-domstolen hindrar unionsrätten inte medlemsstaterna från att under vissa förutsättningar utfärda bestämmelser om förlust av medborgarskap. I fallen ska det dock bedömas om förlusten av ställning som medborgare i en medlemsstat och unionsmedborgare är förenlig med proportionalitetsprincipen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås inga ändringar i bestämmelserna om förlust av medborgarskap.&nbsp;De föreslagna ändringarna påverkar således inte förlusten av unionsmedborgarskap och inte ställningen som unionsmedborgare. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Propositionens förhållande till EU:s allmänna dataskyddsförordning har bedömts ovan i samband med bestämmelserna i grundlagen om skyddet för privatlivet och personuppgifter (11.3). &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Till slut \u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Utifrån ovan nämnda grunder kan lagförslagen behandlas i vanlig lagstiftningsordning.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n   \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n   \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Kläm\u003C/span>&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Med stöd av vad som anförts ovan föreläggs riksdagen följande lagförslag:&nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv id=\"SaadosOsa\" class=\"SaadosOsa\">\n   \u003Cspan class=\"edk-title-h3\">Lagförslag\u003C/span>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">1.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Lag&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">om ändring av medborgarskapslagen&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">I enlighet med riksdagens beslut&nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">ändras\u003C/span> i medborgarskapslagen (359/2003) 13 § 1 mom. 5 och 6 punkten, 25 § 3 mom., 44 § 3 och 4 mom. samt 45 § 1 mom.,&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">sådana de lyder, 13 § 1 mom. 5 punkten och 25 § 3 mom. i lag 929/2025, 13 § 1 mom. 6 punkten och 45 § 1 mom. i lag 579/2011 och 44 § 3 och 4 mom. i lag 974/2007, och&nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">fogas\u003C/span> till 3 §, sådan den lyder i lag 974/2007, ett nytt 3 mom., till 13 § 1 mom., sådant det lyder i lagarna 579/2011, 474/2024 och 929/2025, en ny 7 punkt, till lagen en ny 17 b § och ett nytt 3 a kap., till 41 §, sådan den lyder i lag 929/2025, nya 2 och 3 mom. samt till lagen en ny 42 §, i stället för den 42 § som upphävts genom lag 929/2025, som följer:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">3 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Migrationsverkets uppgifter&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Migrationsverket ska vad gäller medborgarskapsprovet svara för den allmänna förvaltningen, kommunikationen, helheten av informationssystem, utvecklandet och tillsynen samt ingå avtal som hänför sig till anordnande och utarbetande av medborgarskapsprovet.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">13 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Allmänna villkor för naturalisation&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">En utlänning beviljas på ansökan finskt medborgarskap, om han eller hon när ansökan avgörs&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;En icke ändrad del av lagtexten har utelämnats&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) har tryggad försörjning (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">försörjningsvillkor\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">),\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">6) har nöjaktig förmåga att i tal och skrift använda finska eller svenska eller i stället har motsvarande kunskaper i finskt eller finlandssvenskt teckenspråk (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">språkkunskapsvillkor\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">), och\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">7) har tillräcklig kunskap om det finländska samhället och har kunnat påvisa detta på sådan finska eller svenska som avses i 6 punkten (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">samhällskunskapsvillkor\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">).\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;En icke ändrad del av lagtexten har utelämnats&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">17 b §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Påvisande av samhällskunskap och undantag från samhällskunskapsvillkoret&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Att samhällskunskapsvillkoret uppfylls kan visas genom avläggande av&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) ett medborgarskapsprov med godkänt resultat,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) en finsk- eller svenskspråkig studentexamen i Finland, eller\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) en finsk- eller svenskspråkig högskoleexamen i Finland.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Samhällskunskapsvillkoret gäller inte personer under 18 år eller personer som har fyllt 65 år.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Den sökande kan beviljas finskt medborgarskap trots att samhällskunskapsvillkoret inte uppfylls, om hans eller hennes hälsotillstånd eller en funktionsnedsättning långvarigt hindrar honom eller henne från att uppfylla villkoret eller det finns något annat synnerligen vägande skäl för att avvika från samhällskunskapsvillkoret.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Ansökan som är anhängig när den sökande blir myndig&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Migrationsverket ska förelägga de personer som avses i 1 och 2 mom. en skälig tid under vilken ansökan ska kompletteras eller bekräftas. På en sökande som har kompletterat eller bekräftat en medborgarskapsansökan tillämpas villkoren enligt 23 § 2 mom. och 24 § 3 mom., om de har uppfyllts innan den sökande fyllde 18 år. Försörjningsvillkoret och samhällskunskapsvillkoret gäller inte personer som fyllt 18 år medan ansökan varit anhängig.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-luku\">\n      \u003Ch5>\n       \u003Cdiv class=\"LukuTunnusKooste\">3 a kap.&nbsp;\u003C/div>\n       \u003Cspan class=\"SaadosOtsikkoKooste\">Medborgarskapsprov&nbsp;\u003C/span>\n      \u003C/h5>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 a §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Medborgarskapsprovets innehåll&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Medborgarskapsprovet testar grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Frågorna i flervalsprovet ska basera sig på det allmänt tillgängliga läromedlet för medborgarskapsprovet som är utarbetat utifrån läromedlet i den samhällsorientering som avses i 25 § i lagen om främjande av integration (681/2023). Frågorna i provet ska gälla central lagstiftning i Finland, grundläggande och mänskliga rättigheter, jämlikhet, jämställdhet mellan könen, Finlands historia och kultur samt annan central kunskap som ingår i läromedlet för medborgarskapsprovet.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Medborgarskapsprovet ska avläggas på sådan finska eller svenska som avses i 13 § 1 mom. 6 punkten. Provet avläggs elektroniskt, om det inte finns hinder för att genomföra det elektroniskt. En godkänd prestation i medborgarskapsprovet förutsätter att majoriteten av svaren i flervalsprovet är rätt.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Närmare bestämmelser om innehållet i och en godkänd prestation av medborgarskapsprovet får utfärdas genom förordning av statsrådet.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 b §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Utarbetande av medborgarskapsprovet&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Migrationsverket ingår ett avtal om skaffande av frågor, svarsalternativ och läromedel för medborgarskapsprovet med ett universitet eller någon annan aktör på universitetsnivå som har tillräcklig sakkunskap för att utarbeta frågor, svarsalternativ och läromedel.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 c §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Uppgifter för den som utarbetar medborgarskapsprovet&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"KohdatMomentti\">\n        \u003Cdiv class=\"MomenttiJohdantoKooste\">Den som utarbetar medborgarskapsprovet har till uppgift att&nbsp;\u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">1) utarbeta på finska och svenska det i 25 a § avsedda läromedlet för medborgarskapsprovet som baserar sig på läromedlet i samhällsorientering,\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">2) bereda ett brett urval frågor för medborgarskapsprovet jämte svarsalternativ på finska och svenska,\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">3) se till att provets läromedel, frågor och svarsalternativ testas, uppdateras och utvecklas, samt\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">4) delta i den sakkunnigkommission som avses i 25 f §.\u003C/span>&nbsp;\n        \u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">På personer som är anställda hos den som utarbetar medborgarskapsprovet tillämpas bestämmelserna om straffrättsligt tjänsteansvar när de utför uppgifter som avses i 1 mom.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Närmare bestämmelser om uppgifter för den som utarbetar medborgarskapsprovet och innehållet i avtalen om dessa får utfärdas genom förordning av statsrådet.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 d §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Anordnande av medborgarskapsprov&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Migrationsverket avtalar om anordnande av medborgarskapsprov med sådana aktörer som har tillräcklig sakkunskap och förutsättningar att ordna provtillfällen. När avtalen ingås ska det beaktas att provtillfällen erbjuds i en omfattning som är tillräcklig med beaktande av de regionala behoven samt tillräckligt ofta.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 e §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Uppgifter för den som anordnar medborgarskapsprov&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"KohdatMomentti\">\n        \u003Cdiv class=\"MomenttiJohdantoKooste\">Den som anordnar medborgarskapsprov har till uppgift att&nbsp;\u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">1) ordna provtillfällen i enlighet med avtalsvillkoren,\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">2) sörja för övervakningen av provtillfällena,\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">3) genomföra de specialarrangemang som avses i 25 g §, samt\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">4) utan dröjsmål underrätta Migrationsverket om sådana situationer som avses i 25 h § i syfte att bestämma om påföljder.\u003C/span>&nbsp;\n        \u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Den som anordnar medborgarskapsprov har rätt att av Migrationsverket avgiftsfritt och trots sekretessbestämmelser få de uppgifter som är nödvändiga för att sköta de uppgifter som avses i 1 mom. På den som anordnar prov tillämpas sekretessplikten enligt lagen om offentlighet i myndigheternas verksamhet (621/1999) när den sköter de uppgifter som avses i 1 mom. På personer som är anställda hos den som anordnar medborgarskapsprov tillämpas bestämmelserna om straffrättsligt tjänsteansvar när de utför uppgifter som avses i 1 mom.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Närmare bestämmelser om uppgifter för dem som anordnar medborgarskapsprov och innehållet i avtalen om dessa får utfärdas genom förordning av statsrådet.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 f §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Sakkunnigkommission&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">I anslutning till Migrationsverket finns en sakkunnigkommission som Migrationsverket tillsätter för högst tre år åt gången. Ordförande för sakkunnigkommissionen är en företrädare för Migrationsverket. Vice ordförande är i möjligaste mån en företrädare för sakkunskap inom integration. Sakkunnigmedlemmarna ska dessutom företräda åtminstone sakkunskap inom utbildning samt den som utarbetar och anordnar medborgarskapsprovet.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Sakkunnigkommissionen har till uppgift att stödja Migrationsverket i den allmänna utvecklingen och förvaltningen av medborgarskapsprovet. Kommissionen ger på begäran av Migrationsverket ett utlåtande om en begäran om omprövning som gäller medborgarskapsprovet.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Närmare bestämmelser om sakkunnigkommissionens sammansättning, behandling av ärenden och uppgifter får utfärdas genom förordning av statsrådet.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 g §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Specialarrangemang som gäller avläggande av prov&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">En person som på grund av sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårigheter eller någon annan därmed jämställbar orsak inte kan avlägga medborgarskapsprovet på samma sätt som övriga som avlägger provet, kan avlägga provet med specialarrangemang.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">En sådan person under 65 år som avses i 18 b § 2 och 3 mom. kan avlägga provet muntligen.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Migrationsverket beslutar om användningen av specialarrangemang. En separat begäran om specialarrangemang ska lämnas in till verket.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25&nbsp;h&nbsp;§&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Påföljder för brott mot ordning och svikligt förfarande&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Provprestationen för en person som avlägger medborgarskapsprovet anses underkänd, om han eller hon gör sig skyldig till brott mot ordningen vid provtillfället och inte upphör med förfarandet trots uppmaning av övervakaren av provtillfället.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Om den som avlägger provet gör sig skyldig till svikligt förfarande, deltagande i sådant förfarande eller försök till det under provtillfället, anses provprestationen underkänd och han eller hon förlorar rätten att delta i ett provtillfälle för sex månader från provtillfället i fråga. Om förfarandet upprepas eller annars är synnerligen grovt och skadligt, betraktas provprestationen för den som avlägger provet som underkänd och han eller hon förlorar rätten att delta i ett provtillfälle för 12 månader räknat från provtillfället i fråga. Om den som avlägger provet har hunnit anmäla sig till ett nytt provtillfälle, kan Migrationsverket annullera deltagandet.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Beslut i ett ärende enligt 1 eller 2 mom. fattas av Migrationsverket. Beslutet verkställs även om besvär har anförts, om inte besvärsmyndigheten förbjuder verkställigheten.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 i §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Provavgift&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Migrationsverket tar ut en provavgift av dem som anmält sig till provet. Bestämmelser om provavgiftens belopp utfärdas genom inrikesministeriets förordning om Migrationsverkets avgiftsbelagda prestationer med iakttagande av vad som föreskrivs om avgifter för offentligrättsliga prestationer i lagen om grunderna för avgifter till staten (150/1992).&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Provavgiften återbetalas till den som anmält sig till provet, om han eller hon är förhindrad att delta i provet på grund av egen sjukdom. Avgiften återbetalas inte om Migrationsverket inte informerats om förhindret före examenstillfället. Begäran om återbetalning ska göras hos Migrationsverket inom 14 dagar från dagen för provtillfället.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">41 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Sökande av ändring &nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">I fråga om ett beslut som gäller en underkänd provprestation i medborgarskapsprovet får omprövning begäras hos Migrationsverket.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Migrationsverket kan begära ett utlåtande om den begäran om omprövning som avses i 2 mom. av den sakkunnigkommission som avses i 25 f §. På omprövningsförfarandet tillämpas i övrigt vad som föreskrivs i förvaltningslagen (434/2003). Ett i 2 mom. avsett beslut som fattats med anledning av en begäran om omprövning får inte överklagas genom besvär.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">42 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Behandlingsavgift för begäran om omprövning&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Behandlingen av en begäran om omprövning som gäller ett medborgarskapsprov som avses i 41 § 2 mom. är avgiftsbelagd. Bestämmelser om behandlingsavgiftens belopp utfärdas genom inrikesministeriets förordning om Migrationsverkets avgiftsbelagda prestationer med iakttagande av vad som föreskrivs om avgifter för offentligrättsliga prestationer i lagen om grunderna för avgifter till staten.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Fortsatt behandling av en begäran om omprövning efter att begäran blivit anhängig förutsätter att den avgift som tas ut för behandlingen är betald inom 30 dagar från det att begäran blivit anhängig. En begäran om omprövning kan avvisas utan prövning, om avgiften för behandlingen av begäran inte har betalats inom den nämnda tidsfristen.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Avgiften för behandlingen av en begäran om omprövning återbetalas till den berörda parten, om Migrationsverket ändrar det beslut som ändringssökandet gäller till ändringssökandens fördel så att prestationen i medborgarskapsprovet är godkänd.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">44 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Anhängiggörande av ansökan och anmälan&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Ett villkor för fortsatt behandling av ansökan och anmälan efter kontroll enligt 2 mom. är att Migrationsverkets behandlingsavgift betalas. Avgiften bestäms enligt lagen om grunderna för avgifter till staten. Närmare bestämmelser om avgiften utfärdas genom förordning av inrikesministeriet.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">På behandlingen av ärenden enligt denna lag vid honorärkonsulat tillämpas förvaltningslagen.&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">45 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Bilagor till ansökan&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Den sökande ska till sin medborgarskapsansökan foga en sådan utredning om sina kunskaper i finska eller svenska som avses i 17 §, en sådan utredning som påvisar samhällskunskaper som avses i 17 b § och en sådan redogörelse för sin försörjning i Finland som avses i 13 § 1 mom. 5 punkten. En utredning om språkkunskaper behövs dock inte om den sökande är ett barn som inte har fyllt 15 år. Om en medsökande som fyllt 15 år omfattas av ansökan, ska den sökande också foga en utredning om den medsökandes kunskaper i finska eller svenska till ansökan. Om barnet fyller 15 år efter det att ansökan har lämnats in men innan den har avgjorts, ska en utredning om barnets språkkunskaper fogas till ansökan.&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Paragraf eller bestämmelse om ikraftträdande börjar&nbsp; \u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Denna lag träder i kraft den 20 .&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Vad som i 13 § 1 mom. 7 punkten föreskrivs tillämpas inte på sådana ansökningar som har gjorts inom två månader från ikraftträdandet av denna lag.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">På en medborgarskapsansökan som var anhängig vid ikraftträdandet av denna lag tillämpas de bestämmelser som gällde vid ikraftträdandet.&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Slut på lagförslaget&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">2.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Lag&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">om ändring av 2&nbsp;§ i lagen om Migrationsverket&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">I enlighet med riksdagens beslut&nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">ändras\u003C/span> i lagen om Migrationsverket (156/1995) 2 § 2 mom. 4 punkten, sådan den lyder i lag 621/2020,&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">fogas\u003C/span> till 2 § 2 mom., sådant det lyder i lag 621/2020, en ny 5 punkt som följer:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">2 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Uppgifter&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Migrationsverket svarar för&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;En icke ändrad del av lagtexten har utelämnats&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) styrningen av verkställigheten av hjälp till offer för människohandel,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) allmänna förvaltningen, övervakningen och utvecklingen av medborgarskapsprovet.\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;En icke ändrad del av lagtexten har utelämnats&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Paragraf eller bestämmelse om ikraftträdande börjar&nbsp; \u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Denna lag träder i kraft den 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Slut på lagförslaget&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">3.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Lag&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">om ändring av 1 § i lagen om behandling av personuppgifter i migrationsförvaltningen&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">I enlighet med riksdagens beslut&nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">ändras\u003C/span> i lagen om behandling av personuppgifter i migrationsförvaltningen (615/2020) 1 § 1 mom. 2 punkten, sådan den lyder i lag 683/2023, som följer:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">1 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Lagens tillämpningsområde och ändamålet med behandlingen av personuppgifter&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Denna lag tillämpas, om inte annat föreskrivs någon annanstans i lag, på helt eller delvis automatiserad behandling av personuppgifter och på annan behandling av personuppgifter, om personuppgifterna utgör eller är avsedda att utgöra ett personregister eller en del av ett sådant, och personuppgifterna behandlas för följande ändamål:&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;En icke ändrad del av lagtexten har utelämnats&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) behandling av och beslut i ärenden som gäller förvärv, behållande och förlust av finskt medborgarskap och befrielse från medborgarskap samt bestämmande av medborgarskapsstatus samt allmän förvaltning och övervakning av medborgarskapsprov,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;En icke ändrad del av lagtexten har utelämnats&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Paragraf eller bestämmelse om ikraftträdande börjar&nbsp; \u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Denna lag träder i kraft den 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Slut på lagförslaget&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"AllekirjoitusOsa\" class=\"AllekirjoitusOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingfors den 16 april 2026&nbsp;\u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">Statsminister&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Petteri&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Orpo&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">Inrikesminister&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Mari&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Rantanen&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"LiiteOsa\" class=\"LiiteOsa\">\n   \u003Cdiv class=\"LiiteNimi\">\u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Statsrådets förordning&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">om medborgarskapsprov&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">I enlighet med statsrådets beslut föreskrivs med stöd av 25 a § i medborgarskapslagen (359/2003), sådan paragrafen lyder i lag xx/xxxx:&nbsp;\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">1 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Medborgarskapsprovets innehåll&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">I medborgarskapsprovet ska ingå minst 20 och högst 40 frågor. En godkänd provprestation förutsätter att minst 70 procent av svaren är rätt.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">2 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Innehållet i ett avtal med den som anordnar medborgarskapsprov&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Ur ett avtal som gäller anordnande av medborgarskapsprov ska framgå åtminstone följande om de uppgifter som den som anordnar medborgarskapsprovet har enligt 25 e § i medborgarskapslagen:&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) ordnande av provtillfällen under de allmänna dagarna för avläggande av medborgarskapsprov,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) de orter som provet ordnas på,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) hur informationen om lediga provplatser meddelas för anmälan till provet,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) hur hanteringen av provmaterialet sköts,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) hur övervakningen av provtillfällena sköts med hjälp av tekniska medel och övervakare,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">6) hur specialarrangemang som Migrationsverket beviljat en person som avlägger provet på grund av personens sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårigheter eller någon annan därmed jämställbar orsak genomförs,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">7) lämnande av uppgifter till Migrationsverket för utredning av ett ärende som gäller brott mot ordning eller svikligt förfarande.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">3 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Sakkunnigkommissionens sammansättning&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Den sakkunnigkommission som avses i 25 f § medborgarskapslagen har utöver ordföranden och vice ordföranden minst tre sakkunnigmedlemmar, som var och en har en personlig suppleant. Kommissionen kan vid behov även höra andra sakkunniga.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">4 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Sakkunnigkommissionens uppgifter&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Till sakkunnigkommissionens uppgifter enligt 25 f § 2 mom. i medborgarskapslagen hör att&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) följa och utvärdera statistik över deltagandet i provet och om huruvida antalet provtillfällen är tillräckligt,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) följa den respons som gäller medborgarskapsprovet och statistiken över provprestationerna,\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) följa utvecklingen av det läromedel som används i den samhällsorientering som avses i 25 § i lagen om främjande av integration (981/2023),\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) ta initiativ för att utveckla systemet med medborgarskapsprov, \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) ge Migrationsverket utlåtanden om begäranden om omprövning som gäller innehållet i medborgarskapsprovet.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">5 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Behandling av sakkunnigkommissionens ärenden&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Sakkunnigkommissionen sammanträder på kallelse av ordföranden eller av vice ordföranden om ordföranden är förhindrad, eller om två medlemmar kräver det.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Sakkunnigkommissionen gör årligen upp en arbetsplan och avfattar en verksamhetsberättelse och lämnar dem till Migrationsverket och inrikesministeriet.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Sakkunnigkommissionens administrativa uppgifter sköts som tjänsteuppdrag vid Migrationsverket.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Paragraf eller bestämmelse om ikraftträdande börjar&nbsp; \u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Denna förordning träder i kraft den 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-20566",nav:"\u003Cspan class=\"edk-title-h4\" id=\"SisallysluetteloTitle\">Innehållsförteckning\u003C/span>\n\u003Cul id=\"Sisallysluettelo\" class=\"navbar-nav nav\">\n \u003Cli>\u003Ca href=\"#IdentifiointiOsa\">Identifieringselement\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#SisaltoKuvaus\">Huvudsakligt innehåll\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#PerusteluOsaPerustelut\">Motivering\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#PonsiOsa\">Kläm\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#SaadosOsa\">Lagtext\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#AllekirjoitusOsa\">Undertecknare\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#LiiteOsa\">Appendix\u003C/a>\u003C/li>\n\u003C/ul>\n\u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Andra format\u003C/span>\n\u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n \u003Cli>\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/handlingar/edktunnus/EDK-2026-AK-20566/pdf\" class=\"navilink\">Pdf-format\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%2054%2F2026%20vp\" class=\"navilink\">Asiakirja suomeksi\u003C/a>\u003C/li>\n\u003C/ul>\n\u003Cspan class=\"edk-title-h4\" id=\"KasittelytiedotTitle\">Behandlingsinformation\u003C/span>\n\u003Cul id=\"Kasittelytiedot\" class=\"navbar-nav nav\">\n \u003Cli>\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/RP%2054%2F2026%20rd\" class=\"navilink\">RP 54/2026 rd\u003C/a>\u003C/li>\n\u003C/ul>"},uses:{params:["edktunnus"]}}],
							form: null,

						});
