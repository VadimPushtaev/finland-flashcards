t vara ett av sätten att visa att man uppfyller det nya samhällskunskapsvillkoret som föreslås för naturalisation. Provet ska avläggas för ansökan om medborgarskap innan medborgarskapsansökan lämnas.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I medborgarskapsprovet efterfrågas grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Frågorna gäller central och grundläggande kunskap om dessa ämnen. I provet testas inte hur man behärskar mycket detaljerad kunskap, utan med tanke på medborgarskapet är det motiverat att förutsätta sådan allmän kunskap som kan anses behövlig för en kommande finsk medborgare. Enligt förslaget ska frågorna behandla sådana teman som central lagstiftning i Finland, grundläggande och mänskliga rättigheter, jämlikhet, jämställdhet mellan könen samt Finlands historia och kultur.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet ska basera sig på läromedlet för medborgarskapsprovet. Läromedlet ska vara utarbetat utifrån det nationella läromedel som används vid den samhällsorientering som ordnas av kommunerna och det ska till innehåll och omfattning motsvara detta läromedel. Med stöd av 25 § i lagen om främjande av integration ska kommunen ordna samhällsorientering för integrationskunderna. I samhällsorienteringen ska ingå information om bland annat hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Enligt 56 § i lagen om främjande av integration hör upprätthållandet av läromedlet i samhällsorientering till Sysselsättnings-, utvecklings- och förvaltningscentrets uppgifter. Närmare bestämmelser om innehållet i samhällsorienteringen har utfärdats genom förordning av statsrådet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Läromedlet för medborgarskapsprovet ska vara allmänt tillgängligt för förberedelse inför medborgarskapsprovet. Läromedlet ska vara offentligt, kostnadsfritt och tillgängligt. Frågorna i medborgarskapsprovet behandlar central information som ingår i det. Provet kan avläggas efter att man förberett sig genom att studera läromedlet. Då provet testar den kunskap som grundar sig på läromedlet, är det möjligt för den som är intresserad av att ansöka om medborgarskap att också själv bedöma och förutse sina möjligheter att avlägga provet. Genom ett kunskapsbaserat prov särbehandlas ingen till exempel på grund av övertygelse eller åsikt.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 2 mom. kan medborgarskapsprovet avläggas på finska eller svenska. För att avlägga provet behövs samma nivå av språkkunskaper som för att förvärva medborgarskap, det vill säga nöjaktiga kunskaper i finska eller svenska, som motsvarar språkkunskapsnivån B1 på skalan för den europeiska referensramen för språkkunskaper. Den som deltar i medborgarskapsprovet ska välja språk för provet i samband med anmälan till provet. Personer med funktionsnedsättning som använder sig av teckenspråk kan avlägga medborgarskapsprovet med hjälp av sådana specialarrangemang som det föreslås bestämmelser om i den nya 25 g §. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet avläggs vid ett provtillfälle som övervakas av den som anordnar medborgarskapsprov och i regel avläggs det elektroniskt. Även granskningen av provresultatet görs elektroniskt. Provresultatet delges deltagaren som ett elektroniskt meddelande i enlighet med lagen om elektronisk kommunikation i myndigheternas verksamhet (13/2003). I undantagsfall kan testet också genomföras på annat sätt än elektroniskt. En sådan situation kan ha att göra med någon teknisk störning som förhindrar att provet genomförs elektroniskt.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget är medborgarskapsprovet ett flervalsprov som innehåller frågor och svarsalternativ som utarbetats utifrån läromedlet. Den som deltar i provet ska välja rätt svar bland alternativen. För en godkänd prestation krävs det att majoriteten av svaren är rätt. Alla svar behöver således inte vara rätt för att provprestationen ska vara godkänd. En godkänd prestation i medborgarskapsprovet förutsätter i olika länder att 50–80 procent av svaren är rätt. Enligt förslaget kan närmare bestämmelser om gränsen för en godkänd provprestation utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I&nbsp;3&nbsp;mom. ingår ett bemyndigande att utfärda förordning. Närmare bestämmelser om innehållet i och en godkänd prestation av medborgarskapsprovet får utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 b §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Utarbetande av medborgarskapsprovet.\u003C/span> Till medborgarskapslagen fogas enligt förslaget en ny 25 b § där det föreskrivs med vilket slag av aktör Migrationsverket kan ingå avtal om utarbetande av medborgarskapsprovet med. Utarbetandet av provet genomförs som en köpt tjänst som Migrationsverket skaffar. Det är motiverat att anförtro utarbetandet av medborgarskapsprovet och dess läromedel till en annan aktör än Migrationsverket. Detta för att säkerställa förutom tillräcklig sakkunskap även kraven på objektivitet och neutralitet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I paragrafen föreslås bestämmelser om att avtal om att utarbeta medborgarskapsprovet kan ingås med ett universitet eller någon annan aktör på universitetsnivå som har tillräcklig sakkunskap för att utarbeta frågor, svarsalternativ och läromedel. Medborgarskapsprovet blir ett centralt sätt att visa att den som ansöker om medborgarskap uppfyller det föreslagna nya samhällskunskapsvillkoret. Avläggandet av medborgarskapsprovet är således i fortsättningen av betydelse med tanke på förvärvandet av finskt medborgarskap. Därför förutsätts det att den som utarbetar medborgarskapsprovet har tillräckligt hög sakkunskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Genom provet ska det vara möjligt att tillförlitlig testa deltagarens kunskaper om det finländska samhället samt om individens rättigheter och skyldigheter. De frågor jämte rätta svar som utarbetats utifrån det läromedel som används ska vara tillräckligt entydiga. Frågorna och svaren ska utarbetas så att de rätta svaren tydligt framgår i det läromedel som används för att förbereda sig inför provet. Samtidigt bör provet vara förutsägbart för den som förbereder sig inför det, och den kunskap som behövs för att besvara frågorna bör återspegla det centrala innehållet i läromedlet. Provfrågorna ska också utarbetas så att den finska eller svenska som används i dem till sin svårighetsgrad motsvarar det språkkunskapsvillkor som anges i lagen. Den språkkunskapsnivå som krävs för finskt medborgarskap är B1 på skalan för den europeiska referensramen för språkkunskaper.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utarbetandet av medborgarskapsprovet förutsätter således mångsidig sakkunskap inte bara inom provets ämnesområde utan också om formuleringen av frågor och svar som baserar sig på informationen i läromedlet och om hur språket i provet och läromedlet anpassas till rätt nivå. Till utarbetandet av provet hör att testa provfrågorna innan provet tas i bruk. För detta behöver den som utarbetar provet se till att en representativ testgrupp samlas. Av den aktör som ansvarar för utarbetandet av provet krävs dessutom sådan statistisk kompetens som behövs för att utveckla provfrågorna.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket kan avtala om utarbetandet av provet och dess läromedel förutom med ett universitet även med en annan aktör på universitetsnivå som uppfyller villkoren. Provet kan således också utarbetas av till exempel ett högskolekonsortium som består av flera olika universitet eller av universitet och yrkeshögskolor. Det väsentliga är att det i utarbetandet av provet deltar ett universitet som kan samarbeta också med något annat universitet eller någon annan högskola för att utarbeta provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Bestämmelser om uppgifter för den som utarbetar medborgarskapsprovet föreslås i den nya 25 c §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 c §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Uppgifter för den som utarbetar medborgarskapsprovet. \u003C/span>Till medborgarskapslagen fogas enligt förslaget en ny 25 c § där det föreskrivs om uppgifter för den som utarbetar medborgarskapsprovet. Utarbetandet av medborgarskapsprovet omfattar beredningen av provfrågorna och svaren på dem samt beredningen av läromedlet för medborgarskapsprovet utifrån läromedlet i samhällsorientering. Provet utarbetas utifrån läromedlet för medborgarskapsprovet så att det i provet testas hur man behärskar den centrala informationen som ingår i läromedlet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Till uppgifterna för den som utarbetar medborgarskapsprovet hör för det första att utarbeta läromedlet för medborgarskapsprovet. Innehållet i läromedlet för medborgarskapsprovet ska grunda sig på läromedlet i den samhällsorientering som avses i integrationslagen. Den som utarbetar provet ska för medborgarskapsprovet utgående från läromedlet i samhällsorientering utarbeta ett läromedel som lämpar sig för självstudier. Även svårighetsgraden på det språk som används i läromedlet för provet ska samordnas med den språkkunskapsnivå som krävs för medborgarskap. Läromedlet för medborgarskapsprovet ska till sin omfattning motsvara läromedlet i samhällsorientering.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För det andra ska den som utarbetar medborgarskapsprovet bereda ett tillräckligt brett urval av provfrågor så att samma frågor inte upprepas i stor utsträckning vid provtillfällen som hålls vid olika tidpunkter. Avsikten är att man genom provet tillförlitligt ska kunna testa deltagarens kunskaper om det finländska samhället och om individens rättigheter och skyldigheter. För varje provfråga ska flera svarsalternativ beredas, varav endast ett är rätt. Vid utarbetandet av svarsalternativen bör uppmärksamhet fästas vid att valet av rätt svar ska vara tillräckligt entydigt.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet kan avläggas både på finska och svenska. Därför ska frågorna och svarsalternativen i provet samt läromedlet utarbetas med samma innehåll både på finska och svenska. Dessutom ska svårighetsgraden på språket i provet och läromedlet motsvara den språkkunskapsnivå som krävs för naturalisation, det vill säga B1 på skalan för den europeiska referensramen för språkkunskaper.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För det tredje ska den som utarbetar medborgarskapsprovet sköta testandet, uppdaterande och utvecklandet av provfrågorna, svarsalternativen och läromedlet. Det förutsätts utveckling och testning av provfrågorna och svarsalternativen redan innan medborgarskapsprovet tas i bruk, för att provet ska vara färdigt att avläggas. Därefter ska medborgarskapsprovet fortsättningsvis utvecklas kontinuerligt bland annat på basis av den frågespecifika statistiken och den inkomna responsen om provet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">De frågor och svarsalternativ som används vid provtillfällena ska motsvara informationen i det läromaterial som före tidpunkten för provtillfället finns allmänt tillgängligt för förberedelse inför provet. I och med eventuella uppdateringar av läromedlet behöver också frågorna och svarsalternativen i medborgarskapsprovet uppdateras och förenhetligas. Nya frågor och svarsalternativ behövs dessutom för att säkerställa att de frågor som redan använts inte upprepas i stor utsträckning vid olika provtillfällen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För det fjärde ska den som utarbetar medborgarskapsprovet delta i sakkunnigkommissionen för medborgarskapsprovet som det föreslås bestämmelser om i 25 f §. Det finns behov att delta i sakkunnigkommissionen med tanke på utvecklandet av läromedlet och provfrågorna. Sakkunskapen hos den som utarbetar provet behövs också för att bedöma vissa begäranden om omprövning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet avläggs elektroniskt genom att besvara flervalsfrågor. Även granskningen av provprestationen görs elektroniskt. Granskningen av resultaten av medborgarskapsprovet förutsätter således ingen separat bedömningsuppgift. Enligt det 3 mom. som enligt förslaget fogas till 3 § svarar Migrationsverket för bland annat helheten av informationssystem, inklusive att den elektroniska granskningen av provprestationerna fungerar tekniskt. Den som utarbetar provet svarar för sin del för att frågorna och svarsalternativen i provet är tydliga och att de rätta svaren är entydiga. Till uppgifterna för den som utarbetar provet hör inte att godkänna eller underkänna provprestationerna. Den som utarbetat provet ska dock i sakkunnigkommissionen framföra sin egen åsikt om enskilda flervalsfrågor, om den som deltagit i provet i sin begäran om omprövning har åberopat att de lämnar rum för tolkning. Sakkunnigkommissionen ska i en sådan situation ge Migrationsverket ett utlåtande om begäran om omprövning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 2 mom. föreslås en hänvisning till bestämmelserna om straffrättsligt tjänsteansvar. På personer som är anställda hos den som utarbetar provet tillämpas bestämmelserna om straffrättsligt tjänsteansvar när de utför uppgifter som avses i 1 mom.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 3 mom. föreslås ett bemyndigande att utfärda förordning. Närmare bestämmelser om uppgifter för den som utarbetar medborgarskapsprovet och innehållet i avtalen får utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 d §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Anordnande av medborgarskapsprov. \u003C/span>Till medborgarskapslagen fogas enligt förslaget en ny 25 d § där det föreskrivs med vilket slag av aktörer Migrationsverket kan ingå avtal om anordnande av medborgarskapsprov. Anordnandet av provtillfällen genomförs som köpta tjänster som Migrationsverket skaffar.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket kan avtala om anordnande av medborgarskapsprov med sådana aktörer som har tillräcklig sakkunskap och förutsättningar att ordna provtillfällen. De som ordnar provtillfällena kan vara offentliga samfund eller andra sammanslutningar som uppfyller kraven. I praktiken kan provtillfällena för medborgarskapsprovet genomföras av ett nätverk som bildas av flera olika aktörer. Den som anordnar medborgarskapsprov ska ha lokaler och andra förhållanden som lämpar sig för provtillfällena samt den personal som behövs för övervakningen. De utrymmen som är avsedda för ordnande av provtillfällena ska vara tillgängliga. Verket kan avtala om ordnande av provtillfällen till exempel med utbildningsanordnare eller huvudmän för läroanstalter. Bestämmelser om uppgifter för dem som anordnar medborgarskapsprov och om rätten att få uppgifter föreslås i 25 e §. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">När avtalen ingås ska det beaktas att provtillfällen erbjuds i en omfattning som är tillräcklig med beaktande av de regionala behoven samt tillräckligt ofta. Medborgarskapsprovet ska ordnas på olika orter. Vid bedömningen av hurdan regional täckning som är tillräcklig beaktas också efterfrågan på att avlägga medborgarskapsprovet och eventuella regionala skillnader i den. För avläggande av medborgarskapsprovet kan det av deltagaren förutsättas sådant resande som kan anses skäligt.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet ska dessutom ordnas tillräckligt ofta så att till exempel någon vars prestation i provet har underkänts kan delta i provet på nytt inom en rimlig tid. Det är också viktigt att man kan anmäla sig till provet utan betydande dröjsmål, om efterfrågan på medborgarskapsprov plötsligt ökar och det därför uppstår tillfällig kö till provtillfällena. Medborgarskapsprovet ska ordnas flera gånger per år.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 e §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Uppgifter för den som anordnar medborgarskapsprov. \u003C/span>Till medborgarskapslagen fogas enligt förslaget en ny 25 e § där det föreskrivs om uppgifter för den som anordnar medborgarskapsprov. Till dessa hör för det första att ordna provtillfällen i enlighet med villkoren i avtalet med Migrationsverket. Den som ordnar provet ska erbjuda tillgängliga lokaler och andra förhållanden som behövs för att avlägga medborgarskapsprovet och meddela om lediga platser för anmälan till provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För det andra ska anordnaren sörja för övervakningen av provet. Detta innebär både kontroll av provdeltagarnas identitet och kontroll av deltagarnas egen utrustning innan provet avläggs. Den som anordnar provet ska också övervaka att deltagarna börjar avlägga provet i det system som är avsett för ändamålet. Den som anordnar provet ska även sköta övervakningen under provtillfället.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För det tredje ska den som anordnar provet genomföra de specialarrangemang som Migrationsverket till exempel på grund av en funktionsnedsättning beviljat en person som deltar i provet. Bestämmelser om specialarrangemang föreslås i den nya 25 g §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För det fjärde ska den som anordnar provet utan dröjsmål underrätta Migrationsverket om situationer på basis av vilka Migrationsverket bestämmer om påföljder för någon som deltagit i provet. Det kan vara fråga om en situation där någon som deltar i provet under provtillfället gör sig skyldig till brott mot ordningen och trots uppmaning av övervakaren inte upphör med det störande beteendet. Den som anordnar provet ska också underrätta Migrationsverket om svikligt förfarande som upptäckts vid provtillfället. Bestämmelser om påföljder för brott mot ordningen och svikligt förfarande föreslås i den nya 25 h §.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Uppgifterna för den som anordnar medborgarskapsprov omfattar inte bedömning av provprestationerna. Granskningen av det flervalsprov som avläggs elektroniskt genomförs elektroniskt. Även då provet avläggs med specialarrangemang är det ett flervalsprov och en godkänd prestation förutsätter att ett tillräckligt antal av svaren på frågorna i provet är rätt.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 2 mom. föreslås bestämmelser om rätten för den som anordnar medborgarskapsprovet att få uppgifter. De som anordnar provtillfällen behöver uppgifter om dem som anmält sig till provet för att kunna kontrollera provdeltagarnas identitet och på detta sätt säkerställa att ingen utomstående person avlägger provet för någon som anmält sig till provet. Uppgifter om de personer som anmält sig till provtillfället är nödvändiga med tanke på ordnandet av provtillfället. Den som anordnar provtillfället ska ha rätt att få dessa uppgifter ur det informationssystem som Migrationsverket upprätthåller.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">När Migrationsverket beviljar specialarrangemang till exempel på grund av en funktionsnedsättning för någon som deltar i provet, ska den som anordnar medborgarskapsprovet se till att dessa specialarrangemang genomförs. Det är således nödvändigt för den som anordnar medborgarskapsprovet att få uppgifter om till exempel omständigheter i anslutning till hälsotillståndet eller funktionsnedsättningen på basis av vilka den som anmält sig till provet behöver specialarrangemang.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Momentet innehåller också en uttrycklig bestämmelse om att det på den som anordnar medborgarskapsprov tillämpas sekretessplikten enligt lagen om offentlighet i myndigheternas verksamhet när den sköter de uppgifter som nämns ovan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Dessutom innehåller momentet enligt förslaget en hänvisning till bestämmelserna om straffrättsligt tjänsteansvar. På personer som är anställda hos den som anordnar medborgarskapsprov tillämpas bestämmelserna om straffrättsligt tjänsteansvar när de utför uppgifter som avses i 1 mom.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 3 mom. föreslås ett bemyndigande att utfärda förordning. Närmare bestämmelser om uppgifter för den som anordnar medborgarskapsprov och innehållet i avtalen får utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 f §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Sakkunnigkommission. \u003C/span>Till medborgarskapslagen fogas enligt förslaget en ny 25 f § där det föreskrivs om den sakkunnigkommission som inrättas för medborgarskapsprovet. Detta nya sakkunnigorgan ska verka i anslutning till och tillsättas av Migrationsverket och dess ordförande ska vara från Migrationsverket. Ansvaret för den allmänna förvaltningen, kommunikationen, helheten av informationssystem, utvecklandet och tillsynen i anslutning till medborgarskapsprovet ligger hos Migrationsverket på det sätt som föreslås i denna proposition. Med tanke på medborgarskapsprovets karaktär och uppgiftsfördelningen inom systemet med medborgarskapsprov finns det ändå behov att som stöd för Migrationsverket ha en sakkunnigkommission med medlemmar vars representation är förvaltningsövergripande. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Till vice ordförande för kommissionen väljs i möjligaste mån en sakkunnig inom integration. Det är önskvärt att vice ordföranden företräder arbets- och näringsministeriets ansvarsområde, till vilket bland annat integrationen av invandrare hör enligt reglementet för statsrådet (262/2003). Tanken med det nya samhällskunskapsvillkoret och medborgarskapsprovet i anslutning till det är i hög grad den, att integration kan förutsättas av den sökande för beviljande av medborgarskap. Därför är det ändamålsenligt att vice ordföranden för den kommission som behandlar medborgarskapsprovet företräder sakkunskap inom integration. Således kunde vice ordföranden vara från arbets- och näringsministeriet. Utöver ministeriet har till exempel Sysselsättnings-, utvecklings- och förvaltningscentret sådan sakkunskap inom förvaltningsområdet som är viktig med tanke på medborgarskapsprovet och kommissionens uppgifter och syfte. Centret ansvarar med stöd av 56 § i lagen om främjande av integration om upprätthållandet av läromedlet i samhällsorientering.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sakkunnigmedlemmarna ska också företräda sakkunskap inom utbildning. Finskt medborgarskap och villkoren för det hör till inrikesministeriets ansvarsområde, och även det nya medborgarskapsprovet som föreslås är en uppgift inom inrikesministeriets förvaltningsområde. Det är dock befogat att sakkunnigmedlemmarna företräder undervisnings- och kulturministeriets ansvarsområde, till vilket bland annat vetenskap och utbildning hör. Detta är motiverat med tanke på systemet med medborgarskapsprov som helhet, i synnerhet eftersom såväl utarbetandet av medborgarskapsprovet som ordnandet av provtillfällen enligt förslaget ska skötas av aktörer inom vetenskap och utbildning på basis av ett avtal med Migrationsverket. Det skulle vara nyttigt att företrädare för de aktörer som sköter dessa två uppgifter deltar i sakkunnigkommissionen. Således kunde till exempel företrädare för undervisnings- och kulturministeriet och Utbildningsstyrelsen ingå bland sakkunnigmedlemmarna utöver företrädare för den som utarbetar provet och den som anordnar provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Eventuella andra sakkunnigmedlemmar kan företräda till exempel några av de ovannämnda förvaltningsområdena.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 2 mom. föreslås bestämmelser om sakkunnigkommissionens uppgifter. Syftet är att sakkunnigkommissionen ska stödja Migrationsverket i den allmänna utvecklingen av systemet med medborgarskapsprovet, något som i denna proposition föreslås höra till verkets ansvarsområde. Kommissionen kan behandla till exempel sådant som samordnande av efterfrågan och utbud när det gäller provtillfällen, behov av allmän kommunikation om medborgarskapsprovet som uppdagats samt information om hur läromedlet i samhällsorientering har utvecklats. Migrationsverket kan i egenskap av den myndighet som svarar för den allmänna förvaltningen av medborgarskapsprovet i sin egen verksamhet utnyttja kommissionens sakkunniga.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sakkunnigkommissionen ger dessutom på begäran av Migrationsverket ett utlåtande om en begäran om omprövning som gäller medborgarskapsprovet. I propositionen föreslås det att det till 41 § fogas bestämmelser om begäran om omprövning av en underkänd provprestation. Migrationsverket ska av sakkunnigkommissionen begära ett utlåtande om begäran om omprövning, om någon begärt omprövning av resultatet i medborgarskapsprovets på grund av att provfrågorna lämnat rum för tolkning. Omprövningsförfarandet och begäran om utlåtande av sakkunnigkommissionen beskrivs närmare i specialmotiveringen till ändringen av 41 § i propositionen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I&nbsp;3&nbsp;mom. ingår ett bemyndigande att utfärda förordning. Närmare bestämmelser om kommissionens sammansättning, behandling av ärenden och uppgifter får utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 g §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Specialarrangemang som gäller avläggande av prov. \u003C/span>Till medborgarskapslagen fogas enligt förslaget en ny 25 g § där det föreskrivs om specialarrangemang som används vid medborgarskapsprovet. Man kan begära specialarrangemang på grund av sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårigheter eller någon annan därmed jämställbar orsak. Syftet med bestämmelserna är att för dem som avlägger medborgarskapsprovet trygga rimliga och lika möjligheter att avlägga provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Konventionen om rättigheter för personer med funktionsnedsättning ålägger bland annat att säkerställa att personer med funktionsnedsättning har rätt att förvärva och ändra medborgarskap och att inte fråntas detta godtyckligt eller på grund av funktionsnedsättning. Konventionen ålägger också att vidta alla ändamålsenliga åtgärder för att säkerställa att skälig anpassning tillhandahålls. Skälig anpassning betyder nödvändiga och ändamålsenliga ändringar och anpassningar, som inte innebär en oproportionerlig eller omotiverad börda när så behövs i ett enskilt fall för att säkerställa att personer med funktionsnedsättning på lika villkor som andra kan åtnjuta eller utöva alla mänskliga rättigheter och grundläggande friheter. Bestämmelser om rimliga anpassningar finns också i 15 § i diskrimineringslagen (1325/2014). Enligt den ska myndigheter, utbildningsanordnare, arbetsgivare och de som tillhandahåller varor eller tjänster göra sådana ändamålsenliga och rimliga anpassningar som behövs i det enskilda fallet för att göra det möjligt för personer med funktionsnedsättning att på lika villkor som andra använda myndigheters tjänster samt att få utbildning och arbete samt varor och tjänster som tillhandahålls allmänheten och att klara av sina arbetsuppgifter och avancera i arbetet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget ska en person kunna avlägga medborgarskapsprovet med specialarrangemang i det fall att den som avlägger medborgarskapsprovet på grund av någon sådan orsak som nämns i bestämmelsen är förhindrad att avlägga medborgarskapsprovet på samma sätt som övriga som avlägger provet. En förutsättning är således att en sådan orsak annars skulle utgöra hinder för att avlägga medborgarskapsprovet eller allvarligt försvåra avläggandet av provet. Innehållet i de specialarrangemang som behövs påverkas både av karaktären på de orsaker som nämns i bestämmelsen och av graden av svårigheter som en sådan orsak medför den som avlägger provet. Det finsk- eller svenskspråkiga medborgarskapsprovet kan till exempel tolkas till teckenspråk, om den som avlägger provet är en person med funktionsnedsättning som använder teckenspråk. Man kan dock inte få specialarrangemang för medborgarskapsprovet enbart på grund av att den som anmält sig till provet inte har behövliga kunskaper i finska eller svenska, så provet kan inte avläggas tolkat till ett främmande språk.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 2 mom. föreskrivs det enligt förslaget om möjligheten för sådana personer under 65 år som avses i 18 b § 2 och 3 mom. i medborgarskapslagen att avlägga medborgarskapsprovet muntligen. Trots språkkunskapsvillkoret i medborgarskapslagen förutsätts det inte att en person som inte är läs- och skrivkunnig ska visa muntliga och skriftliga språkkunskaper. En person som konstaterats sakna läs- och skrivkunnighet ska visa ett intyg över nivån på tal och förståelse i finska eller svenska eller att personen regelbundet har deltagit i undervisning i finska eller svenska. Syftet med bestämmelsen om avläggande av provet muntligen är att det i vissa begränsade fall räcker med muntliga kunskaper i språket för att avlägga provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det nya samhällskunskapsvillkoret som föreslås i propositionen är separat från språkkunskapsvillkoret, vilket innebär att man måste visa att det uppfylls utöver språkkunskaperna. Bestämmelserna om visande av språkkunskap enligt medborgarskapslagen eller avvikande från språkkunskapsvillkoret ändras dock inte. En person som inte är läs- och skrivkunnig kan även i fortsättningen visa sina språkkunskaper i enlighet med 18 b § 2 och 3 mom. Således förblir den nämnda regleringen fortfarande betydelsefull med tanke på språkkunskapsvillkoret och visande av språkkunskap.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet avläggs muntligen på finska eller svenska. Genom att ordna ett muntligt prov beaktas möjligheten för en sådan person som saknar läs- och skrivkunnighet som avses i 18 b § 2 och 3 mom. att avlägga provet. Provprestationen förutsätter inte att provfrågorna och svarsalternativen läses själv. Vid ett muntligt prov som ordnas individuellt läses provfrågorna och svarsalternativen för den som avlägger provet och den som avlägger provet meddelar muntligen rätt svarsalternativ. På så sätt förutsätter provprestationen till exempel inte skrivande, vilket inte heller i enlighet med gällande bestämmelser krävs av en person som avses i 18 b § 2 och 3 mom. Det prov som läses för den som avlägger provet anpassas till sådan finska eller svenska att det till exempel till sin struktur och sitt innehåll är mer begripligt än allmänspråket. Lättläst är tillgängligare än allmänspråket, och då provet genomförs muntligen på detta sätt beaktas de särskilda språkliga behov som den som avlägger provet har.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet som avläggs muntligen motsvarar i övrigt det prov som avläggs i elektronisk form. Således behandlar till exempel frågorna samma ämnen som i medborgarskapsprovet i övrigt, och de grundar sig på läromedlet för medborgarskapsprovet. Läromedlet för medborgarskapsprovet ska också finnas tillgängligt som inspelning som går att lyssna på för förberedelse inför provet. Med läromedel som är tillgängligt för en person som saknar läs- och skrivkunnighet, det vill säga som går att lyssna på, ser man till att också en sådan person har möjlighet att avlägga medborgarskapsprovet utan skriftliga kunskaper i finska eller svenska, en kunskap som inte heller förutsätts av dem för att uppfylla språkkunskapsvillkoret.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Med tanke på förberedelserna inför medborgarskapsprovet har det också betydelse att ämnena i provet behandlas i den samhällsorientering som avses i 25 § i integrationslagen. Åtminstone en del av de som inte är läs- och skrivkunniga som avses i 18 b § 2 och 3 mom. i medborgarskapslagen ska ha genomfört den samhällsorientering som avses i 25 § i integrationslagen eller deltagit i annan sådan utbildning där det finländska samhället har behandlats. Enligt 25&nbsp;§ i integrationslagen ska en kommun ordna samhällsorientering för integrationskunden, i den mån det är möjligt på hans eller hennes modersmål eller på ett språk som han eller hon annars har goda kunskaper i. Under en boendetid på åtta år är det dessutom möjligt att avlägga även andra utbildningar vars syfte är att öka samhällskunskapen, läs- och skrivkunnigheten och språkkunskapen. Ett av målen med reformen av integrationstjänsterna är att tydligare i fortsättningen lära sig bland annat finska eller svenska. Detta främjar möjligheten att avlägga provet som endast förutsätter muntliga språkkunskaper. När det gäller förslaget bör det noteras att det i 18 b § 2 och 3 mom. i medborgarskapslagen inte är fråga om en situation där en person på grund av sitt hälsotillstånd eller en funktionsnedsättning inte kan lära sig språket. I propositionen föreslås det att man kan begära om avvikelse från samhällskunskapsvillkoret i sådana situationer där villkoret inte kan uppfyllas på grund av hälsotillstånd eller funktionsnedsättning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 3 mom. föreslås bestämmelser om beslut som gäller specialarrangemang. Beslut om beviljande av eventuella specialarrangemang fattas av Migrationsverket. Ett beslut om beviljande av specialarrangemang ska inte vara begränsat till endast ett visst provtillfälle. Specialarrangemang som kan beviljas är till exempel mera tid för att avlägga provet eller möjlighet att avlägga provet i en separat och tillgänglig provlokal. Arrangemangen kan också gälla delar som särskilt anknyter till det elektroniska provet och till exempel innehålla en möjlighet att använda större skärm eller större teckenstorlek. Specialarrangemang för personer med funktionsnedsättning kan dessutom omfatta olika hjälpmedel, möjlighet att använda egen dator eller motsvarande anordning tillsammans med de hjälpmedel som redan finns i den samt sådan personlig assistans som avses i lagen om funktionshinder. I enlighet med den föreslagna 25 e § 1 mom. 3 punkten ska de som anordnar provtillfällena genomföra de specialarrangemang som Migrationsverket beviljat. Bestämmelser om rätten för dem som anordnar provtillfällen att få uppgifter finns i 25 e § 2 mom.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Begäran om specialarrangemang ska lämnas in till Migrationsverket innan provet avläggs. Begäran ska motiveras och åtföljas av en utredning som gäller behovet av specialarrangemang. Utredningen kan vara till exempel ett läkarintyg eller något annat utlåtande av en sakkunnig som gäller tillståndet för den som anmäler sig till provet. Av utredningen ska framgå på vilket sätt den sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårighet eller därmed jämställbara orsak som den som anmäler sig till provet har inverkar på avläggandet av medborgarskapsprovet. Även Folkpensionsanstaltens beslut om rätt till FPA:s tolktjänst som beviljats en teckenspråkig kan fungera som utredning. Medborgarskapsprovet kan på grund av avsaknad av läs- och skrivkunnighet avläggas muntligt endast om man på det sätt som avses i 18 b § 3 mom. i medborgarskapslagen visat att man inte är läs- och skrivkunnig.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet med eventuella specialarrangemang är ett skede som föregår ansökan om medborgarskap. Om medborgarskapsprovet inte rimligen kan avläggas ens med hjälp av specialarrangemang, kan man i samband med ansökan om medborgarskap med stöd av 17 b § begära avvikelse från samhällskunskapsvillkoret på grund av hälsotillstånd eller funktionsnedsättning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 h §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Påföljder för brott mot ordning och svikligt förfarande. \u003C/span>Till medborgarskapslagen fogas enligt förslaget en ny 25 h § där det föreskrivs om vilka påföljder en deltagare i medborgarskapsprovet kan påföras på grund av brott mot ordningen eller svikligt förfarande.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Bestämmelserna i 1 mom. gäller situationer där den som avlägger medborgarskapsprovet gör sig skyldig till brott mot ordningen vid provtillfället. Brott mot ordningen är ett sådant beteende som stör provtillfället eller de andra som avlägger provet. Om den som beter sig på detta sätt trots uppmaning av övervakaren av provtillfället inte upphör med att bryta mot ordningen, är påföljden den att personens provprestation betraktas som underkänd.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 2 mom. föreslås bestämmelser om påföljder som ska påföras på grund av svikligt förfarande. Provprestationen betraktas som underkänd om den som avlägger provet gör sig skyldig till svikligt förfarande, deltagande i sådant förfarande eller försök till det. Dessutom förlorar personen rätten att delta i ett provtillfälle för sex månader från provtillfället i fråga.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Som svikligt förfarande betraktas en oärlig gärning eller underlåtelse som har som syfte att ge en felaktig bild av de egna kunskaperna eller en annan persons kunskaper. Med det avses användning av förbjudna metoder eller hjälpmedel vid provet. Till svikligt förfarande hör bland annat luntande, samtal, anlitande av annan än på förhand godkänd eventuell hjälp av utomstående, avläggande av prov för någon annans räkning samt kopiering och inspelning av provet. Med svikligt förfarande jämställs deltagande i sådant förfarande eller försök till svikligt förfarande. Tidsfristen räknas från den provdag då det svikliga förfarandet, deltagandet i det eller försöket till det har ägt rum.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I vissa situationer kan det beslutas att den som avlägger provet förlorar sin rätt att delta i provtillfället för 12 månader från provtillfället i fråga. Detta kan göras när den som avlägger provet har upprepat det svikliga förfarandet eller det annars kan anses vara synnerligen grovt och skadligt. Det är fråga om synnerligen grovt och skadligt förfarande till exempel då någon annan de facto avlagt provet än den som anmält sig till provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 3 mom. föreslås bestämmelser om beslut som gäller påföljder. Beslut om att påföra påföljder både på grund av brott mot ordning och på grund av svikligt förfarande fattas av Migrationsverket. Verket får kännedom om sådana situationer som avses i 1 och 2 mom. av dem som ordnar provtillfällen. Dessa meddelar verket i enlighet med den föreslagna 25 e § 1 mom. 4 punkten. Verket ska i egenskap av myndighet se till att det som skett vid provtillfället utreds i enlighet med 31 § 1 mom. i förvaltningslagen. Som en del av utredningen och behandlingen av ärendet ska verket också se till att den part som deltagit i provet hörs i enlighet med 34 § 1 mom. Därefter ska verket fatta beslut om eventuellt underkännande av provprestationen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Om det är fråga om att den som deltagit i provet har gjort sig skyldig till svikligt förfarande, deltagande i sådant förfarande eller försök till det vid provtillfället, ska verket också besluta att personen i fråga förlorar rätten att delta i provet för en viss tid. Verket bedömer om det enligt bestämmelserna föreligger grunder för en tidsfrist på 12 månader. Efter att ha fattat beslutet ska verket se till att det tillfälliga förbudet att delta i provet verkställs till exempel genom att anteckna det för parten i fråga i anmälningssystemet för provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket kan också återkalla en anmälan till medborgarskapsprovet, om den som gjort sig skyldig till svikligt förfarande redan hunnit anmäla sig på nytt för att avlägga provet. I praktiken är det möjligt att den som deltagit i provet hinner anmäla sig till ett nytt prov medan ärendet utreds. Migrationsverket ska kunna återkalla anmälan i en sådan situation.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Beslutet om påföljder verkställs även om besvär har anförts, om inte förvaltningsdomstolen förbjuder verkställigheten. Detta gäller både då en provprestation betraktas som underkänd och då ett tillfälligt förbud att delta antecknas i informationssystemet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 i §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Provavgift. \u003C/span>Till medborgarskapslagen fogas enligt förslaget en ny 25 i § där det föreskrivs om provavgiften för medborgarskapsprovet. Avgiften ska betalas i samband med att man anmäler sig till medborgarskapsprovet. Migrationsverket tar ut avgiften. Migrationsverket svarar för skötseln av betalningsrörelsen i samband med medborgarskapsprovet som en del av den allmänna förvaltningen av systemet med medborgarskapsprov.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Avgiften för medborgarskapsprovet grundar sig på självkostnadsprincipen. Utgångspunkten enligt 6&nbsp;§ 1&nbsp;mom. i lagen om grunderna för avgifter till staten (150/1992) är att storleken på den avgift som staten tar ut för en offentligrättslig prestation ska motsvara beloppet av statens totalkostnader för prestationen. Med provavgifterna för medborgarskapsprovet täcks kostnaderna för systemet med medborgarskapsprov. Bestämmelser om provavgiftens belopp utfärdas genom inrikesministeriets förordning som gäller Migrationsverkets avgiftsbelagda prestationer.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 2 mom. föreslås bestämmelser om återbetalning av provavgiften. Provavgiften återbetalas enligt förslaget till den som anmält sig till provet, om han eller hon är förhindrad att delta i provet på grund av egen sjukdom. En förutsättning är att Migrationsverket har informerats om förhindret före provtillfället. Det skulle till exempel kunna finnas en funktion för meddelande om förhinder i det system som används för anmälan till provet. Begäran om återbetalning ska göras hos Migrationsverket inom 14 dagar från tidpunkten för provtillfället. Sjukdom ska påvisas med ett läkarintyg som fogas till begäran. Den som är förhindrad på grund av sjukdom kan anmäla sig till ett nytt provtillfälle på samma sätt som vanligt, till exempel till en ledig provplats som framgår av det system som används för anmälan eller till kön.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">41&nbsp;§. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Sökande av ändring. \u003C/span>Paragrafens 1 mom. innehåller en informativ hänvisning till lagen om rättegång i förvaltningsärenden.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att ett nytt 2 mom. med bestämmelser om begäran om omprövning av en underkänd provprestation ska fogas till paragrafen. Avläggandet av medborgarskapsprovet är en fas som föregår medborgarskapsansökan. Godkännande eller underkännande av en provprestation har inte direkt inverkan på någons rätt, skyldighet eller fördel. Ett beslut som gäller en provprestation utgör således inte ett sådant förvaltningsbeslut i vilket det ska vara möjligt att söka ändring genom besvär. I fråga om Migrationsverkets beslut om en underkänd provprestation får omprövning ändå begäras. Bestämmelser om omprövningsförfarandet finns i 7 a kap. i förvaltningslagen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">En godkänd prestation i medborgarskapsprovet förutsätter att den som deltar i provet väljer ett tillräckligt antal rätta svarsalternativ på frågorna i provet. Medborgarskapsprovet är enligt förslaget ett flervalsprov som avläggs elektroniskt och också granskningen görs elektroniskt. Den som deltagit i provet får information om antalet rätta och felaktiga svar och om huruvida prestationen har godkänts eller underkänts. Dessutom får personen information om hur de rätta och felaktiga svaren fördelas enligt ämnesområde. Utgångspunkten är att resultatet av provet och fördelningen av svaren ska delges deltagaren som ett elektroniskt meddelande i enlighet med lagen om elektronisk kommunikation i myndigheternas verksamhet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I provet ingår till exempel inga sådana delar där svar som provdeltagaren själv skrivit ska bedömas utifrån särskilda bedömningskriterier. Huruvida provresultatet är godkänt beror således inte på en individuell bedömning av varje prestation, och därför är också provdeltagarens behov av rättsskydd relativt litet. Omprövningsförfarandet behövs framför allt för att utreda om till exempel någon teknisk störning har förhindrat att provet avlagts med godkänt resultat.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Omprövning kan dessutom begäras på basis av ämnesvis specificerade flervalsfrågor som lämnar rum för tolkning. För att begäran om omprövning ska kunna framställas och motiveras behöver den som deltagit i provet i synnerhet information om vilka ämnens frågor som besvarats felaktigt. På så sätt kan den som avlägger provet bedöma om en oklar formulering av frågorna och svarsalternativen kan vara orsaken till fel svar, och då kan personen överväga att begära omprövning. Frågorna och svarsalternativen i provet ställs dock icke som sådana till förfogande för dem som deltagit i provet eftersom det är ändamålsenligt att förhindra att frågorna sprids utanför provtillfällena. På detta sätt tryggas både provets tillförlitlighet och likabehandlingen av dem som deltar i provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket ska i enlighet med 49 e § i förvaltningslagen behandla en begäran om omprövning skyndsamt. Ärenden som gäller omprövning av medborgarskapsprov är i princip relativt enkla också ur myndighetens synvinkel. Kravet på skyndsamhet enligt förvaltningslagen är således förenligt med den utredning som ärendet förutsätter.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Till paragrafen föreslås också ett nytt 3 mom. som innehåller en bestämmelse om utlåtandeförfarandet i anslutning till omprövningsbegäran, en hänvisning till förvaltningslagen samt besvärsförbud i fråga om beslut som fattats med anledning av begäran om omprövning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket kan begära ett utlåtande om en begäran om omprövning av den sakkunnigkommission som avses i den föreslagna 25 f §. Förfarandet är avsett för situationer där begäran om omprövning har framställts på grund av att flervalsfrågorna lämnat rum för tolkning. Då förutsätter behandlingen av begäran om omprövning också en annan slags utredning än bara till exempel ett konstaterande om att en teknisk störning förekommit. Genom att begära ett utlåtande beaktar man att Migrationsverket inte har den sakkunskap som behövs för att bedöma innehållet i frågorna oh svarsalternativen. Syftet med förfarandet är således att trygga den sakkunskap som behövs för bedömningen av provets innehåll och flertydighet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">När någon som deltagit i provet kräver att Migrationsverket rättar provresultatet på grund av att personens felaktiga svar skulle ha berott på att flervalsfrågorna lämnade rum för tolkning, begär Migrationsverket ett utlåtande om begäran om omprövning av sakkunnigkommissionen. Utlåtande begärs om huruvida den fråga som specificeras enligt ämne i begäran om omprövning lämnar rum för tolkning och om motiveringarna som framförs i begäran om omprövning. Medlemmarna i sakkunnigkommissionen ger för utlåtandet sin syn på huruvida flervalsfrågan lämnar rum för tolkning. Bedömningen av huruvida frågan och dess svarsalternativ är ändamålsenliga görs också med hänsyn till informationen i läromedlet för medborgarskapsprovet. Om en flervalsfråga som specificeras i begäran om omprövning enligt kommissionens sakkunnigutlåtande ska anses ge rum för tolkning, ska Migrationsverket rätta beslutet om provresultatet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Momentet innehåller också en hänvisning till förvaltningslagen. Syftet med hänvisningen är att förtydliga att förvaltningslagen ska tillämpas vid omprövningsförfarandet, med undantag för begäran om utlåtande av sakkunnigkommissionen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Momentet innehåller dessutom en bestämmelse om besvärsförbud. I ett sådant beslut som fattats med anledning av en begäran om omprövning som avses i det föreslagna 2 mom. får ändring inte sökas genom besvär. Möjligheten att begära omprövning av provresultatet innebär ett särskilt rättsmedel för en sådan person som senare vill ansöka om medborgarskap. Migrationsverkets beslut om begäran om omprövning får inte överklagas genom besvär hos förvaltningsdomstolen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Besvärsförbudet ska begränsas till att gälla endast sådana beslut i anslutning till medborgarskapsprovet som Migrationsverket har meddelat med anledning av begäran om omprövning av ett beslut som gäller en underkänd provprestation i medborgarskapsprovet. Sådana beslut av Migrationsverket som gäller specialarrangemang enligt den föreslagna 25 g §, påföljder enligt 25 h § och återbetalning av avgifter enligt 25 i § får överklagas hos förvaltningsdomstolen i enlighet med lagen om rättegång i förvaltningsärenden.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">42&nbsp;§. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Behandlingsavgift för begäran om omprövning.\u003C/span> Till medborgarskapslagen fogas enligt förslaget en ny 42 § med bestämmelser om behandlingsavgift för begäran om omprövning som gäller ett medborgarskapsprov. Enligt 1 mom. är behandlingen av en begäran om omprövning avgiftsbelagd. Om beloppet av behandlingsavgiften för begäran om omprövning föreskrivs i inrikesministeriets förordning om Migrationsverkets avgiftsbelagda prestationer. Den utfärdas årligen med stöd av lagen om grunderna för avgifter till staten.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 2 mom. förutsätter en fortsatt behandling av en begäran som blivit anhängig att behandlingsavgiften för begäran om omprövning har betalats. Behandlingsavgiften ska betalas inom 30 dagar från det att begäran om omprövning blev anhängig. Om behandlingsavgiften inte betalas inom denna tid kan begäran om omprövning avvisas utan prövning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 3 mom. återbetalas avgiften för behandlingen av en begäran om omprövning till den berörda parten, om Migrationsverket ändrar det beslut som ändringssökandet gäller så att prestationen i medborgarskapsprovet i stället för underkänd är godkänd. I en sådan situation är det motiverat att återbetala avgiften, eftersom begäran om omprövning visat sig motiverad.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">44&nbsp;§.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Anhängiggörande av ansökan och anmälan.\u003C/span> I 3 och 4 mom. föreslås tekniska ändringar genom att stryka författningsnumren för lagen om grunderna för avgifter till staten och förvaltningslagen. Det hänvisas första gången till lagen om grunderna för avgifter till staten i det föreslagna 25 i § 1 mom. och till förvaltningslagen i det föreslagna 41 § 3 mom. Samtidigt uppdateras i 3 mom. ”sisäasiainministeriö” till ”sisäministeriö” i den finska språkdräkten.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">45&nbsp;§.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Bilagor till ansökan.\u003C/span> I paragrafen föreskrivs det om fogande av en utredning om språkkunskaper och en redogörelse för försörjning samt eventuella utredningar som gäller grunder för avvikelse till medborgarskapsansökan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att 1&nbsp;mom. ändras så att det till momentet fogas ett omnämnande om en sådan utredning som påvisar samhällskunskaper som avses i 17 b §. Enligt den föreslagna 17 b § kan uppfyllandet av det nya samhällskunskapsvillkoret visas genom att avlägga ett medborgarskapsprov med godkänt resultat eller genom en finsk- eller svenskspråkig student- eller högskoleexamen. Till medborgarskapsansökan ska således fogas en utredning om att medborgaskapsprovet avlagts med godkänt resultat eller om en godkänd student- eller högskoleexamen. En utredning om påvisande av samhällskunskap behövs för att säkerställa att Migrationsverket för behandlingen av en medborgarskapsansökan får uppgift om att samhällskunskapsvillkoret uppfylls. Åtminstone på längre sikt kommer verket sannolikt att få uppgift om att villkoret uppfylls också direkt via ett informationssystem och då behöver utredningen i praktiken inte längre bifogas till ansökan.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lagen om Migrationsverket\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2&nbsp;§.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Uppgifter. \u003C/span>I paragrafen föreskrivs det om Migrationsverkets olika uppgifter. I 1 mom. föreskrivs att Migrationsverket handlägger och avgör de ärenden i fråga om utlänningar och finskt medborgarskap som hör till verkets uppgifter enligt lag eller med stöd av lag. Enligt 2 mom. svarar Migrationsverket för styrningen, planeringen och övervakningen av den praktiska verksamheten vid mottagande av personer som söker internationellt skydd och mottagande av personer som får tillfälligt skydd samt styrningen och övervakningen av förvarsenheternas praktiska verksamhet. Verket svarar också för driften av de statliga förläggningarna och flyktingslussarna samt statens förvarsenheter. Dessutom ansvarar verket för styrningen av verkställigheten av hjälp till offer för människohandel. Enligt 3 mom. ansvarar Migrationsverket för förvaltningen och utvecklingen av ärendehanteringssystemet för utlänningsärenden. Dessutom ska Migrationsverket tillhandahålla inrikesministeriet och övriga myndigheter samt internationella organisationer information som gäller frågor inom dess verksamhetsområde.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att det till 2 mom. fogas en ny 5 punkt där det föreskrivs om Migrationsverkets uppgifter i anslutning till medborgarskapsprovet. I punkten nämns allmän förvaltning, övervakning och utveckling av medborgarskapsprovet. Samtidigt görs i 4 punkten en teknisk ändring då punkten i slutet av punkten ersätts med ett kommatecken.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget svarar Migrationsverket i egenskap av myndighet för den allmänna förvaltningen, övervakningen och utvecklingen av systemet med medborgarskapsprov. Medborgarskapslagen innehåller närmare bestämmelser om systemet med medborgarskapsprov och innehållet i Migrationsverkets uppgifter i anslutning till det. Enligt förslaget ska andra aktörer än Migrationsverket ansvara för utarbetandet och anordnandet av medborgarskapsprovet, och bestämmelser om dessa delar i systemet med medborgarskapsprov ingår också i medborgarskapslagen.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lagen om behandling av personuppgifter i migrationsförvaltningen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">1 §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Lagens tillämpningsområde och ändamålet med behandlingen av personuppgifter. \u003C/span>I 1 § i lagen om behandling av personuppgifter i migrationsförvaltningen föreskrivs om lagens tillämpningsområde och ändamålet med behandlingen av personuppgifter. I enlighet med 1 § 1 mom. tillämpas lagen på automatiserad behandling av personuppgifter och på annan behandling av personuppgifter, om personuppgifterna utgör eller är avsedda att utgöra ett personregister eller en del av ett sådant, och personuppgifterna behandlas bland annat för sådana ändamål i anknytning till finskt medborgarskap som avses i 2 punkten. Dessa är behandling av och beslut i ärenden som gäller förvärv, behållande och förlust av finskt medborgarskap samt bestämmande av medborgarskapsstatus. Den nämnda 2 punkten motsvarar till sitt innehåll det gällande 3 § 1 mom. i medborgarskapslagen enligt vilket Migrationsverket fattar beslut om förvärv, behållande och förlust av finskt medborgarskap samt om bestämmande av medborgarskapsstatus.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås att 1 § 1 mom. 2 punkten i lagen om behandling av personuppgifter i migrationsförvaltningen ändras så att det till den fogas ett omnämnande av sådana av Migrationsverkets uppgifter i anknytning till medborgarskapsprovet som inbegriper behandling av personuppgifter. Dessa är uppgifterna som gäller den allmänna förvaltningen och övervakningen av medborgarskapsprovet. Förslaget motsvarar till sitt innehåll den ändring som föreslås i 3 § i medborgarskapslagen till den del Migrationsverkets nya uppgifter i anslutning till medborgarskapsprovet inbegriper behandling av personuppgifter.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket behandlar personuppgifter för dem som deltar i medborgarskapsprovet när verket administrerar anmälningssystemet för provet, betalningsrörelsen och registreringen av provprestationerna samt då verket beslutar om eventuella påföljder på grund av brott mot ordningen eller svikligt förfarande. Migrationsverkets uppgifter omfattar också beslut om specialarrangemang som behövs vid provtillfällen. För detta är det nödvändigt för verket att behandla uppgifter som hör till särskilda kategorier av personuppgifter i enlighet med 8 § i lagen om behandling av personuppgifter i migrationsförvaltningen.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Reglering på lägre nivå än lag\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">I propositionen föreslås ett nytt medborgarskapsprov, som på det övergripande planet förvaltas av Migrationsverket. Migrationsverket utarbetar eller anordnar dock inte provet, utan kommer överens om skötseln av dessa uppgifter med andra aktörer. Det föreslås att det finns bestämmelser om genomförandet av medborgarskapsprovet i nya 3 a kap., som fogas till medborgarskapslagen. En del av de nya paragraferna omfattar dock ett bemyndigande att utfärda förordning. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Utfärdande av förordning förutsätter att behövliga grundläggande bestämmelser finns i lag och att det i lagen finns ett korrekt bemyndigande. Enligt grundlagen är det möjligt att genom förordning utfärda endast närmare bestämmelser om ärenden som omfattas av lagens tillämpningsområde. I avsnitt 11.7 bedöms bemyndigandet att utfärda författningar på lägre nivå och dess förhållande till 80 § i grundlagen. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">I propositionen föreslås att det genom förordning av statsrådet är möjligt att utfärda närmare bestämmelser om innehållet i medborgarskapsprovet, uppgifterna för den som utarbetar och anordnar provet och innehållet i avtal om dessa samt om sammansättningen, behandlingen av ärenden och uppgifterna i fråga om den sakkunnigkommission som inrättas för medborgarskapsprovet. Bemyndigandena att utfärda förordning finns i samband med varje enskild grundläggande bestämmelse som föreslås till lagen. Innehållet i medborgarskapsprovet och det anknutna bemyndigandet att utfärda förordning föreskrivs i nya 25 a §. Uppgifterna för den som utarbetar medborgarskapsprovet och det anknutna bemyndigandet att utfärda förordning föreskrivs i nya 25 c §. Bestämmelserna om uppgifterna för dem som anordnar ett medborgarskapsprov och bemyndigandet att utfärda förordning finns i nya 25 e §. Det föreslås att nya 25 f § innehåller bestämmelser om den sakkunnigkommission som verkar i anslutning till Migrationsverket. Paragrafen innehåller även ett bemyndigande att utfärda förordning som gäller kommissionen. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Ett utkast till den föreslagna förordningen finns som bilaga till propositionen.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Det föreslås även att bestämmelser om en avgift för att delta i medborgarskapsprovet fogas till nya 25 i § i medborgarskapslagen. I enlighet med utgångspunkten i lagen om grunderna för avgifter till staten baserar sig avgiften enligt förslaget på självkostnadsprincipen och med den täcks de kostnader som orsakas av det nya provsystemet. Beloppet av provavgiften föreskrivs genom förordning av inrikesministeriet, vilken även omfattar avgiftsbeläggningen för Migrationsverkets prestationer.\u003Cspan class=\"AlaviiteTeksti\"> Förordningen om Migrationsverkets avgiftsbelagda prestationer utfärdas årligen. Inrikesministeriets senaste förordning (1336/2025) gäller avgiftsbeläggningen för prestationerna år 2026. \u003C/span> &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">I propositionen föreslås därtill att det är möjligt att framföra en begäran om omprövning av ett beslut om en underkänd provprestation i medborgarskapsprovet till Migrationsverket. Inrikesministeriets förordning om Migrationsverkets avgiftsbelagda prestationer innehåller även bestämmelser om behandlingsavgiften för begäran om omprövning.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ikraftträdande\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Lagen avses träda i kraft i början av år 2027. Avsikten är att Migrationsverket börjar bereda införandet av medborgarskapsprovet under år 2026. De behövliga åtgärderna gäller bland annat avtal om utarbetande och anordnande av medborgarskapsprovet och konkurrensutsättning av sådana köpta tjänster. Migrationsverket ska även i övrigt förbereda sig på olika uppgifter, som enligt förslaget hör till det i egenskap av myndighet med ansvar för att allmänt förvalta, övervaka och utveckla medborgarskapsprovet. Ämbetsverkets uppgifter omfattar till exempel att sköta den informationssystemhelhet som anknyter till medborgarskapsprovet och informationen samt betalningsrörelsen för provet. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Det föreslås att lagen innehåller övergångsbestämmelser. I denna proposition föreslås ett nytt samhällskunskapsvillkor för att förvärva medborgarskap. Det tillämpas dock inte ännu på sådana ansökningar som görs inom två månader från lagens ikraftträdande. Till övriga delar tillämpas regleringen direkt då lagen trätt i kraft, inklusive Migrationsverkets och andra aktörers uppgifter. Med tanke på de verkställighetsuppgifter som hör till Migrationsverket är en tillräcklig tid mellan lagens ikraftträdande och tillämpningen av det nya samhällskunskapsvillkoret motiverad. Genom övergångstiden möjliggörs dessutom bland annat att det är möjligt att börja förbereda sig på provet och anmäla sig till det innan det krävs att provet avläggs för att få medborgarskap. Målet med graderingen av tillämpningen av lagen är att hindra att det uppstår en sådan situation där det de facto inte är möjligt att påvisa att det nya villkor som fogats för naturalisation är uppfyllt, på grund av att medborgarskapsprovet inte ännu införts. Utgångspunkten för regleringen är att medborgarskapsprovet avläggs före medborgarskapsansökan. Genom övergångstiden på två månader främjas för egen del att medborgarskap även framöver, på det sätt som Migrationsverket rekommenderat, ansöks först då villkoren för naturalisation är uppfyllda. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Dessutom föreslås att övergångsbestämmelsen innehåller bestämmelser om att villkoren enligt den gällande lagen tillämpas på medborgarskapsansökan, om ärendet blivit anhängigt innan de föreslagna lagändringarnas ikraftträdande. Behandlingsavgifterna för ansökningar om medborgarskap baserar sig på självkostnadsprincipen. År 2026 är behandlingsavgiften för en ansökan 550 eller 650 euro. När de föreslagna ändringarna träder i kraft kommer ett avsevärt antal ärenden att vara anhängiga i vilka de sökande har bedömt att de uppfyller villkoren på basis av de gällande bestämmelserna i medborgarskapslagen och uppgifterna på Migrationsverkets webbplats. &nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Verkställighet och uppföljning\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Verkställigheten av de föreslagna ändringarna, deras funktion och utfallet för konsekvenserna följs vid inrikesministeriets migrationsavdelning. De uppgifter som ska följas är till exempel statistiken över medborgarskapsansökningar och antalet beslut om dessa samt fördelningen av positiva och negativa beslut. De centrala uppgifterna omfattar likaså statistik över antalet deltagare i medborgarskapsprovet, procenttalen för de godkända resultaten och kösituationen. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">I propositionen föreslås att en sakkunnigkommission med tväradministrativt kunnande verkar i anslutning till Migrationsverket och stödjer verket i den allmänna utvecklingen av systemet med medborgarskapsprov. Migrationsverket ansvarar för att utveckla medborgarskapsprovet, men verket kan i sin verksamhet utnyttja kommissionens sakkunniga synpunkter. I kommissionen är det möjligt att behandla till exempel omständigheter som gäller anordnande av prov och som det är centralt att följa med tanke på lagens funktion. I propositionen föreslås att det genom förordning av statsrådet är möjligt att bland annat ge närmare bestämmelser även om behandlingen av sakkunnigkommissionens uppgifter. Enligt det utkast till förordning som finns som bilaga till propositionen utarbetar kommissionen årligen en arbetsplan och verksamhetsberättelse och lämnar dem till inrikesministeriet. Således kan inrikesministeriet vid sidan om de andra ovan nämnda åtgärderna följa lagens funktion även i synnerhet genom den verksamhetsberättelse som lämnas till det. Dessutom är det möjligt att inrikesministeriet har en sakkunnigmedlem i kommissionen.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förhållande till grundlagen och lagstiftningsordning \u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Bestämmelserna om medborgarskap i grundlagen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Det finns bestämmelser om finskt medborgarskap i 5 § i grundlagen. Enligt förarbetena till grundlagsreformen (RP&nbsp;1/1998&nbsp;rd, s. 78/I) har den statsförfattningsrättsliga betydelsen av finskt medborgarskap minskat väsentligt efter att bestämmelserna i grundlagen om de grundläggande fri- och rättigheterna genom en reform år 1995 utsträcktes till att i regel omfatta alla personer inom Finlands jurisdiktion. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I förarbetena till grundlagen (s. 78/I) konstateras att det direkt till medborgarskap anknyts rösträtt i statliga val och folkomröstningar (14&nbsp;§ 1&nbsp;mom.), valbarhet i riksdagsval (27&nbsp;§ 1&nbsp;mom.) och i val av republikens president (54&nbsp;§ 1&nbsp;mom.) samt medlemskap i statsrådet (60&nbsp;§ 1&nbsp;mom.). Genom lag kan bestämmas att endast finska medborgare får utnämnas till bestämda offentliga tjänster eller uppdrag (125 § 1 mom.). Skyldigheten att försvara landet gäller enligt 127 § för finska medborgare. Enligt 9&nbsp;§ 3&nbsp;mom. i grundlagen får finska medborgare inte hindras att resa in i landet, landsförvisas eller mot sin vilja utlämnas eller föras till ett annat land. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 14 § 1 mom. i grundlagen har varje finsk medborgare som har fyllt aderton år rätt att rösta i statliga val och folkomröstningar. Enligt 27 § 1 mom. i grundlagen är varje röstberättigad som inte är omyndig valbar i riksdagsval. Enligt 54 § 1 mom. i grundlagen utses republikens president genom direkt val för en ämbetsperiod av sex år. Presidenten ska vara infödd finsk medborgare. Enligt 60 § 1 mom. i grundlagen ska de ministrar som hör till statsrådet vara för redbarhet och skicklighet kända finska medborgare. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Förvärv av finskt medborgarskap på ansökan medför således flera rösträtter och behörigheter. Endast i presidentval är enbart infödda finska medborgare valbara. Skyldigheten att försvara landet enligt 127 § i grundlagen och skyddet mot landsförvisning enligt 9 § 3 mom. i grundlagen gäller för alla finska medborgare. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Grundlagsutskottet har bedömt att medborgarskapet ändå fortfarande kan sägas utgöra ett viktigt band mellan den enskilde och staten. Det är alltså både rättsligt och de facto en viktig institution för den enskilda människan (GrUB&nbsp;8/2010&nbsp;rd, s. 2/I).&nbsp;\u003C/p>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förvärv av medborgarskap\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt 5&nbsp;§ 1&nbsp;mom. i grundlagen får barn finskt medborgarskap vid födelsen och genom föräldrarnas medborgarskap enligt vad som närmare bestäms genom lag. Utifrån de förutsättningar som föreskrivs i lag kan medborgarskap beviljas även utifrån en anmälan eller ansökan. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Enligt förarbetena till grundlagsreformen (s. 78/II) avgör lagstiftaren förutsättningarna för beviljande av medborgarskap. Grundlagsutskottet har i sitt utlåtande (GrUU 16/2024 rd, s. 3) ansett att det står klart att grundlagen lämnar avsevärd prövningsrätt för lagstiftaren i fråga om på vilka villkor finskt medborgarskap beviljas på ansökan. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I sitt betänkande om medborgarskapslagen (GrUB&nbsp;8/2002&nbsp;rd, s. 4/II) har grundlagsutskottet fäst uppmärksamhet vid att det på grund av 5&nbsp;§ i grundlagen måste föreskrivas genom lag om villkoren för att få medborgarskap. För stort prövningsutrymme i regleringen står inte i samklang med detta, utan beslutsfattandet ska till alla delar vara bundet till bestämmelserna i lagen. Grundlagsutskottet har dessutom i sitt utlåtande (GrUU 16/2024 rd, s. 4) riktat uppmärksamhet på att statsrådet ska sträva efter att beskriva den helhet som bildas av ändringar som följer på varandra och förslagens eventuella sammantagna konsekvenser. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att ett nytt samhällskunskapsvillkor fogas till villkoren för att bevilja medborgarskap på ansökan. Det nya villkoret för naturalisation föreskrivs genom lag. För att finskt medborgarskap ska kunna beviljas på ansökan, ska sökanden påvisa att han eller hon inhämtat grundläggande kunskaper om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Fogandet av ett sådant villkor omfattas av lagstiftarens prövningsrätt. Samhällskunskapsvillkoret kompletterar de villkor som föreskrivs för naturalisation i den gällande lagen och bidrar till att ge uttryck för tanken om kunskaper om de centrala förhållandena i landet innan medborgarskap förvärvs.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Syftet är att beslutsfattandet om beviljande av medborgarskap även framöver till alla delar är bundet till bestämmelserna i lagen på det sätt som avses i 5 § i grundlagen. Det föreslås att lagen innehåller bestämmelser om de möjliga sätten för att påvisa att det nya samhällskunskapsvillkoret är uppfyllt, om tillämpningsområdet för villkoret och om sådana grunder utifrån vilka det är möjligt att avvika från villkoret. Beslut om att bevilja medborgarskap fattas utifrån dessa bestämmelser. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">De föreslagna ändringarna anknyter till de ändringar av villkoren för boendetiden vilka trätt i kraft den 1 oktober 2024 och de andra ändringarna av villkoren för naturalisation vilka trädde i kraft den 17 december 2025 (bland annat oförvitlighet och försörjning). Dessa ändringar som redan gjorts och det nya föreslagna samhällskunskapsvillkoret är en del av samma helhet som påverkar personer som ansöker om medborgarskap. I bedömningen av propositionens konsekvenser ovan har man strävat efter att beskriva de sammantagna konsekvenserna av de ändringar som föreslås i denna proposition och de tidigare ändringarna. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Bestämmelserna om jämlikhet i grundlagen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Enligt förarbetena till grundlagsreformen (s. 78/II) är det klart att det inte får uppställas sådana villkor för erhållande av medborgarskap som strider mot de grundläggande fri- och rättigheterna eller de mänskliga rättigheterna eller som på något annat sätt är godtyckliga. För beviljande av medborgarskap får således inte uppställas till exempel sådana förutsättningar som enligt 6 § 2 mom. utgör förbjuden diskriminering. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 6 § 1 mom. i grundlagen är alla lika inför lagen. Enligt paragrafens 2 mom. får ingen utan godtagbart skäl särbehandlas på grund av kön, ålder, ursprung, språk, religion, övertygelse, åsikt, hälsotillstånd eller handikapp eller av någon annan orsak som gäller hans eller hennes person. Barn ska enligt 3 mom. bemötas som jämlika individer och de ska ha rätt till medinflytande enligt sin utvecklingsnivå i frågor som gäller dem själva. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I den allmänna jämlikhetsklausulen i 6 § 1 mom. i grundlagen ingår ett förbud mot godtycke och ett krav på enahanda bemötande i likadana fall (RP 309/1993 rd, s. 46). Genom klausulen förutsätts inte att alla människor behandlas på likadant sätt i alla förhållanden, såvida inte de förhållande som påverkar ärendet inte är likadana. Särbehandlingen får inte vara godtycklig och skillnaderna får inte bli oskäliga (se till exempel GrUU 68/2022 rd, s. 3, GrUB 11/2009 rd, s. 2). De måste också kunna motiveras på ett sätt som är godtagbart med tanke på de grundläggande fri- och rättigheterna (bland annat RP&nbsp;309/1993 rd, s. 25, GrUU&nbsp;54/2022 rd, s. 3). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ur hela komplexet av grundläggande fri- och rättigheter och rättigheternas karaktär av grundlagsfästa rättigheter har grundlagsutskottet härlett vissa allmänna krav på inskränkning av dem (GrUB 25/1994 rd, s. 5). Dessa är krav på att inskränkningar bör bygga på lagar, att inskränkningar ska vara noga avgränsade och tillräckligt exakt definierade samt acceptabla, förenliga med kravet på proportionalitet, bevara kärnan i en grundläggande fri- och rättighet samt på att inskränkningar kräver ett adekvat rättsskydd och inte står i strid med förpliktelserna vad gäller de mänskliga rättigheterna.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor för naturalisation och att ett anknutet nytt medborgarskapsprov införs. Ett villkor om grundläggande kunskaper om det finländska samhället för att medborgarskap ska beviljas är inte godtyckligt, utan ett sådant villkor för att förvärva medborgarskap kan i princip anses vara godtagbart och rimligt. Även i andra länder är det ett relativt allmänt krav att kunna påvisa uppgifter om samhället genom ett medborgarskapsprov. Genom medborgarskapsprovet testas enligt förslaget grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Provets frågor gäller sådana ämnen som den centrala finländska lagstiftningen, grundläggande fri- och rättigheter, mänskliga rättigheter, jämlikheten mellan könen samt Finlands historia och kultur. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I och med samhällskunskapsvillkoret fogas ett nytt integrationsanknutet villkor för naturalisation. I ljuset av den europeiska konventionen om medborgarskap är det utöver boendetiden möjligt att ställa även ett villkor av denna typ, vars bakomliggande tanke utgörs av integration i bosättningslandet.\u003Cspan class=\"AlaviiteTeksti\"> Explanatory Report to the European Convention on Nationality, s. 6.\u003C/span> Kravet på att påvisa centrala kunskaper som gäller samhället har en koppling till integrationen. Ur denna synvinkel handlar det om ett godtagbart villkor för att förvärva medborgarskap. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det är möjligt att uppfylla det föreslagna nya samhällskunskapsvillkoret genom student- eller högskoleexamen eller det föreslagna nya medborgarskapsprovet, som testar grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Sådana ämnen ingår även i samhällsorientering enligt lagen om främjande av integration och det läromedel\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/sv/laromedel\">https://yhteiskuntaorientaatio.fi/sv/laromedel\u003C/a>\u003C/span>\u003C/span>\u003C/span> som utarbetats för denna orientering utnyttjas i medborgarskapsprovet. Frågorna i provet baserar sig på de centrala uppgifterna i det läromedel som utarbetats utifrån läromedlet för samhällsorientering. Läromedlet för medborgarskapsprovet är allmänt tillgängligt, varvid det står till förfogande för att förbereda sig för medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet är således ett kunskapsbaserat prov, som kan avläggas efter att man studerat de centrala uppgifterna i det allmänt tillgängliga läromedlet. Frågorna i provet handlar inte om särskilt detaljerade uppgifter, utan genom provet testas enligt förslaget ämnen som gäller samhällets funktion och som behandlas i läromedlet. Även den nivå i finska eller svenska som används i provet och i läromedlet motsvarar den nivå av språkkunskaper som krävs för att få medborgarskap, vilken är B1 på nivåskalan i den europeiska referensramen för språk. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Provfrågorna blir inte godtyckliga inom den föreslagna ramen. I genomförandet av provet beaktas den språkkunskapsnivå som förutsätts för medborgarskap. Utifrån det kunskapsbaserade provet särbehandlas inte någon på grund av någon i 6 § 2 mom. i grundlagen avsedd orsak so
