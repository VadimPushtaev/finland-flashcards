rna bland flera alternativ. Det föreslagna nya provet är således relativt enkelt vad gäller genomförandesätt och provprestationen godkänns om examinanden har valt det antal rätta svar som krävs. Den som inte uppnår godkänd prestation i provet kan senare delta i provet på nytt. Behovet av att söka ändring i en provprestation är således relativt ringa. I propositionen föreslås ändå att omprövning av provresultatet kan begäras hos Migrationsverket. Verket kan då utreda om till exempel en teknisk störning har hindrat deltagaren från att avlägga provet med godkänt resultat. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I vissa situationer kan det också uppstå ett behov av en begäran om omprövning på grund av att flervalsfrågorna lämnar rum för tolkning. För bedömningen av huruvida provfrågorna lämnar rum för tolkning föreslås ett förfarande där Migrationsverket begär ett utlåtande om begäran om omprövning av sakkunnigkommissionen. På så sätt tryggas den sakkunskap som behövs för att bedöma innehållet i flervalsfrågorna och deras svarsalternativ och deras tolkningsbarhet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ett beslut som Migrationsverket fattat med anledning av en begäran om omprövning får inte överklagas hos förvaltningsdomstolen. I övrigt får Migrationsverkets beslut överklagas hos förvaltningsdomstolen i enlighet med lagen om rättegång i förvaltningsärenden (808/2019). Rättsskyddet i anslutning till medborgarskapsprovet förverkligas i domstol i situationer där Migrationsverket har fattat ett beslut om återbetalning av provavgiften, beviljande av specialarrangemang eller utfärdande av påföljder för brott mot ordning eller svikligt förfarande. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I propositionen föreslås inga ändringar som gäller överklagande av ett negativt beslut på medborgarskapsansökan. Om den som ansökt om medborgarskap inte uppfyller det nya samhällskunskapsvillkoret och det fattas ett negativt beslut på personens ansökan, har personen tillgång till en besvärsinstans enligt lagen om rättegång i förvaltningsärenden. I en sådan situation får Migrationsverkets beslut därmed överklagas hos förvaltningsdomstolen, vars beslut kan överklagas hos högsta förvaltningsdomstolen om högsta förvaltningsdomstolen beviljar besvärstillstånd. Propositionen har till denna del ingen inverkan på tillgodoseendet av rättsskyddet. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kulturella rättigheter\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Enligt 16 § i grundlagen har alla rätt till avgiftsfri grundläggande utbildning. Bestämmelser om läroplikten utfärdas genom lag. Det allmänna skall, enligt vad som närmare bestäms genom lag, säkerställa lika möjligheter för var och en att oavsett medellöshet enligt sin förmåga och sina särskilda behov få även annan än grundläggande utbildning samt utveckla sig själv. Vetenskapens, konstens och den högsta utbildningens frihet är tryggad.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">De ändringar som föreslås i detta proposition påverkar inte den grundläggande utbildningen, läroplikten, småbarnspedagogiken, förskoleundervisningen eller högskolestudier, eftersom dessa inte är beroende av att en person förvärvar finskt medborgarskap.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rätt till social trygghet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Enligt 19&nbsp;§ i grundlagen har alla som inte förmår skaffa sig den trygghet som behövs för ett människovärdigt liv rätt till oundgänglig försörjning och omsorg. Genom lag skall var och en garanteras rätt att få sin grundläggande försörjning tryggad vid arbetslöshet, sjukdom, arbetsoförmåga och under ålderdomen samt vid barnafödsel och förlust av en försörjare. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">De ändringar som föreslås i denna proposition påverkar inte tillgodoseendet av den sociala tryggheten, eftersom rätten till social trygghet inte är beroende av förvärv av finskt medborgarskap.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rätt till medborgarskap\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Enligt 5 § i grundlagen får barn finskt medborgarskap vid födelsen och genom föräldrarnas medborgarskap enligt vad som närmare bestäms genom lag. Enligt grunder som bestäms i lag kan medborgarskap också beviljas efter anmälan eller på ansökan. Ingen kan fråntas eller befrias från sitt finska medborgarskap annat än på i lag bestämda grunder och under förutsättning att han eller hon har eller får medborgarskap i en annan stat.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt artikel&nbsp;15 i FN:s allmänna förklaring om de mänskliga rättigheterna har var och en rätt till en nationalitet. Ingen får godtyckligt fråntas sin nationalitet eller nekas rätten att ändra nationalitet. Rätten till medborgarskap ingår också i bestämmelserna i flera internationella avtal. Den nämns till exempel i principerna i den europeiska konventionen om medborgarskap (FördrS 94/2008, \u003Cspan class=\"KursiiviTeksti\">medborgarskapskonventionen\u003C/span>). Enligt motiveringspromemorian\u003Cspan class=\"AlaviiteKooste\"> Explanatory Report to the European Convention on Nationality (), s. 9.\u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://rm.coe.int/16800ccde7\">https://rm.coe.int/16800ccde7\u003C/a>\u003C/span>\u003C/span>\u003C/span> till konventionen om medborgarskap syns rätten till medborgarskap i konventionen särskilt i bakgrunden till bestämmelser om att undvika statslöshet. Rätten till ett visst medborgarskap beror å sin sida på bestämmelserna om medborgarskap i respektive land. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det nya samhällskunskapsvillkor och tillhörande medborgarskapsprov som föreslås i denna proposition påverkar möjligheten att förvärva medborgarskap på basis av ansökan. I propositionen föreslås inga ändringar i förvärvet av medborgarskap på grundval av födelse och föräldrarnas medborgarskap eller gällande förlust av medborgarskap. De föreslagna ändringarna har ingen inverkan på förebyggandet av statslöshet eller förbudet mot att göra en person statslös, vilka ingår både i 5&nbsp;§ i grundlagen och i 4&nbsp;§ i medborgarskapslagen. De ändringar som föreslås i medborgarskapslagen påverkar till denna del inte hur rätten till medborgarskap förverkligas i fortsättningen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det nya samhällskunskapsvillkoret gäller i regel även statslösa personer. Den boendetid som krävs av statslösa förblir även i fortsättningen kortare än vanligt (20&nbsp;§ i medborgarskapslagen). Dessutom ska medborgarskapsansökningar som gäller statslösa personer i enlighet med 20&nbsp;a&nbsp;§ behandlas skyndsamt och senast inom ett år. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Skydd för privatlivet och av personuppgifter\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I 10 § i grundlagen föreskrivs om skydd för privatlivet. Enligt 1 mom. är vars och ens privatliv, heder och hemfrid tryggade. Närmare bestämmelser om skydd av personuppgifter utfärdas genom lag. Skyddet av personuppgifter är således en del av det skydd för privatlivet som tryggas i 10 § 1 mom. i grundlagen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I behandlingen av en medborgarskapsansökan ingår numera även behandling av personuppgifter då man bedömer huruvida den person som ansöker om medborgarskap uppfyller de föreskrivna villkoren för naturalisation. Vid bedömningen av begäran om undantag från dessa villkor behandlas också känsliga personuppgifter, till exempel om sökanden har begärt ett undantag från språkkunskapsvillkoret på grund av hälsotillstånd eller funktionsnedsättning. Även det nya samhällskunskapsvillkoret förknippas med en möjlighet att göra ett undantag på en sådan grund. En person som åberopar en sådan grund för undantag ska på samma sätt som i nuläget bifoga ett läkarintyg eller någon annan utredning till sin ansökan. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I denna proposition föreslås förutom ett nytt samhällskunskapsvillkor även ett helt nytt system för medborgarskapsprovet, och de aktörer som sörjer för genomförandet av systemet behandlar också personuppgifter om dem som deltar i provet. På grund av specialarrangemang som behövs för att avlägga provet behandlas i samband med provet i vissa situationer också uppgifter om personens hälsotillstånd eller funktionsnedsättning. Dataskyddsriskerna i anslutning till medborgarskapsprovet berör således uppgifter som till exempel personens namn och medborgarskap samt hälsotillstånd och funktionsnedsättning. Genom åtgärder för behandling av sådana uppgifter bör man till exempel hantera riskerna för att uppgifterna behandlas för andra ändamål än de som krävs för medborgarskapsprovet eller att utomstående får tillgång till uppgifterna. Hanteringen av dataskyddsrisker gäller såväl informationssystem som även aktörer och personer vars uppgifter omfattar behandling av personuppgifter om personer som deltar i medborgarskapsprovet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Migrationsverket ansvarar för den allmänna förvaltningen av det nya systemet för medborgarskapsprovet, helheten av informationssystem och tillsynen. I verkets uppgifter ingår redan bland annat ovan nämnda behandling av medborgarskapsansökningar och beslutsfattande som gäller medborgarskap. För detta ändamål används ärendehanteringssystemet för utlänningsärenden, som Migrationsverket ansvarar för att förvalta och utveckla (2 § 3 mom. i lagen om Migrationsverket). Riskerna i anslutning till systemet för medborgarskapsprovet ska hanteras med hjälp av såväl tekniska egenskaper hos den helhet av informationssystem som används för att genomföra provet som med hjälp av övervakning av användningen av systemet. Det är också viktigt att ge den utbildning och de anvisningar som behövs till alla vars uppgifter omfattar behandling av personuppgifter om personer som deltar i medborgarskapsprovet. Till metoderna för att hantera dataskyddsrisker hör dessutom bland annat att exakt reglera vilka villkor som ställs på de aktörer som deltar i genomförandet av medborgarskapsprovet samt att begränsa av behandlingen av personuppgifter som hör till särskilda kategorier av personuppgifter till det som är nödvändigt samt att det finns bestämmelser om att sådana uppgifter ska raderas omedelbart efter att de blivit onödiga. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Förslagen i propositionen behandlas nedan i detalj ur ett dataskyddsperspektiv (11.3).&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för integrationen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt forskningsrön har det konstaterats att det finns ett samband mellan förvärv av medborgarskap och integration.\u003Cspan class=\"AlaviiteTeksti\"> T.ex. Gathmann &amp; Garbers 2023: Citizenship and integration, Labour Economics 82:2023.\u003C/span> Det är skäl att granska de ändringar i förvärvandet av medborgarskap som genomförs i tre skeden ur perspektivet för hur ändringarna påverkar integrationen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">När den boendetid som krävs för medborgarskap allmänt förlängdes till åtta år betonades samtidigt också incitamentet för att skaffa sig språkkunskaper jämfört med tidigare. Då ändras lagen så att en person kan förvärva medborgarskap upp till tre år innan det allmänna boendetidsvillkoret uppfylls, om språkkunskapsvillkoret uppfylls före det. En sådan ändring av boendetiden bedömdes ha en integrationsfrämjande effekt genom att en kortare boendetid uppmuntrar till snabbt förvärv av språkkunskaper.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Efter ändringarna i boendetiden utökades villkoren för naturalisation med ett krav på tryggad försörjning. Det som är centralt i fråga om villkoret är att den sökande inte har fått arbetslöshetsförmån eller utkomststöd i mer än tre månader under de två år som föregår beviljandet av medborgarskap. I ändringen beaktades att integrationen av personer som flyttat till Finland framskrider med tiden. Arbetsinkomsterna och sysselsättningen utvecklas under boendetiden i Finland även för personer av vilka det i samband med uppehållstillståndet inte har krävts att personerna ska påvisa att deras försörjning är tryggad. Av tidsperioden på två år bedömdes följa att till exempel en person som varit arbetslös efter att ha sysselsatts kan uppfylla det nya försörjningsvillkoret inom en skälig tid. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Såsom konstaterats i den föregående regeringspropositionen till riksdagen med förslag till lag om ändring av medborgarskapslagen (RP&nbsp;19/2025 rd, s. 7–8) kan man närma sig kopplingen mellan regleringen av förvärv av medborgarskap och integrationen ur olika synvinklar. Det nya samhällskunskapsvillkoret och införandet av medborgarskapsprovet är en del av helheten av ändringar i medborgarskapslagen, där utgångspunkten är att det krävs en lyckad integration för att förvärva finskt medborgarskap. Det nya villkoret kompletterar de villkor för naturalisation som föreskrivits i den gällande lagen och uttrycker en tanke om att man ska vara förtrogen med de centrala förhållandena i landet innan man förvärvar medborgarskap. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Läromedlet för medborgarskapsprovet ska basera sig på ett sådant riksomfattande läromedel som har utarbetats för att användas i kommunernas samhällsorientering för integrationskunder.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/sv/laromedel\u003C/a>\u003C/span>\u003C/span>\u003C/span> Enligt 25 § i lagen om främjande av integration ska kommunen ordna samhällsorientering för integrationskunderna. Samhällsorienteringen ska åtminstone innehålla information om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Närmare bestämmelser om innehållet i och genomförandet av flerspråkig samhällsorientering får utfärdas genom statsrådets förordning. I och med det läromedel som utarbetats för samhällsorienteringen har innehållet i medborgarskapsprovet en stark koppling till just sådana åtgärder som är avsedda att främja integrationen. Därför kan förberedelser för medborgarskapsprovet ha en positiv inverkan på integrationen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I medborgarskapsprovet testas de grundläggande kunskaperna om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Frågorna berör central och grundläggande information om dessa ämnen. I provet testas inte hur personen behärskar kunskaper om mycket små detaljer, utan för medborgarskap förutsätts sådana allmänna kunskaper som kan anses nödvändiga för en blivande finsk medborgare. Frågorna i medborgarprovet omfattar ämnen såsom central lagstiftning i det finländska samhället samt grundläggande fri- och rättigheter och mänskliga rättigheter. Provet kan innehålla frågor om informationen i läromedlet, till exempel om jämlikhet, jämställdhet mellan könen samt om Finlands historia och kultur. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Även avläggande av studentexamen, som är ett möjligt sätt att påvisa samhällskunskap, har en positiv inverkan på integrationen. Studentexamen avläggs i slutet av gymnasieutbildningen som inbegriper bland annat studier i samhällslära. Syftet med gymnasiets samhällslära är att fördjupa den studerandes kunskaper om det omgivande samhället och ge den studerande förutsättningar att utvecklas till en aktiv och engagerad medborgare med intresse för samhällsfrågor. I gymnasiets samhällslära ska värdegrunden präglas av demokratiska principer, inklusive jämlikhet och respekt för de mänskliga rättigheterna. Innehållet i samhällsläran kan anses vara särskilt lämpligt med tanke på att en del av de politiska rättigheterna enligt grundlagen uttryckligen hänför sig till finskt medborgarskap. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det nya samhällskunskapsvillkoret är till vissa delar ett likadant incitament för medborgarskap som det redan befintliga språkkunskapsvillkoret. Medborgarskapsprovet kan i praktiken avläggas när en person själv upplever sig vara redo för det. Tidpunkten för att påvisa språkkunskaper och i fortsättningen även samhällskunskap påverkar när personen i fråga kan förvärva medborgarskap. Ur denna synvinkel inbegriper det nya samhällskunskapsvillkoret och medborgarskapsprovet positiva incitamentseffekter med tanke på integrationen.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för säkerheten\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I samband med ändringarna av boendetiden bedömdes att det till följd av den förlängda boendetiden kan finnas sådana uppgifter om sökanden som är betydelsefulla med tanke på den nationella säkerheten och som kan ta längre tid att samla in. Ändringarna av boendetiden bedömdes till denna del ha en positiv inverkan på den nationella säkerheten. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Även i det andra skedet av ändringarna i medborgarskapslagen gjordes ändringar som påverkar säkerheten. De bestämmelser som redan tidigare tillämpats på ansökningsförfarandet utvidgades till att gälla även anmälningsförfarandet så att den nationella säkerheten beaktas i både ansökningsförfarandet och anmälningsförfarandet. I bestämmelserna om utredd identitet föreslås en ändring som syftar till att uppmuntra sökandena att utreda sin identitet med hjälp av dokument. Dessutom gjordes ändringar i bestämmelserna om förlust av medborgarskap. Till följd av de föreslagna ändringarna kan beslut om förlust av medborgarskap fattas i något större utsträckning än tidigare om en person genom att göra sig skyldig till landsförräderibrott, högförräderibrott eller terroristbrott allvarligt äventyrat Finlands vitala intressen. Dessa ändringar som berör förvärv och förlust av medborgarskap bedömdes ha positiva konsekvenser för den nationella säkerheten. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det ska införas ett nytt samhällskunskapsvillkor för naturalisation och ett nytt medborgarskapsprov. I och med det föreslagna villkoret krävs det att personen påvisar kunskaper om samhället för att förvärva medborgarskap. För att finskt medborgarskap ska kunna beviljas på ansökan måste den sökande ha påvisat att han eller hon har skaffat sig grundläggande kunskaper om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Det nya villkoret kompletterar de villkor för naturalisation som föreskrivits i den gällande lagen och uttrycker en tanke om att man ska vara förtrogen med de centrala förhållandena i landet innan man förvärvar medborgarskap. Kravet på samhällskunskap kan indirekt ha en positiv inverkan även på säkerheten. För att avlägga medborgarskapsprovet bör man sätta sig in i innehållet i det läromedel som utarbetats på basis av läromedlet för samhällsorientering och förbereda sig på att svara på frågor om bland annat Finlands centrala lagstiftning. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för förverkligande av jämställdheten\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Ändringarna av boendetiden bedömdes inte påverka jämställdheten mellan könen. År 2022 var kvinnornas andel av alla som naturaliserades 55 procent och männens 45 procent. En förlängning av boendetiden bedömdes inte särskilt påverka till exempel män eller kvinnor. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Försörjningsvillkoret eller andra ändringar som gjorts i det andra skedet bedömdes inte heller ha någon särskild påverkan på män eller kvinnor. I regeringens proposition (RP 19/2025 rd, s. 45–46) konstaterades på basis av uppgifter om sysselsättning och utbildning att skillnaden mellan könen minskar ju fler år personen bott i Finland. Män deltar i högre grad i arbete eller utbildning än kvinnor särskilt under de första åren i Finland, men andelen sysselsatta kvinnor ökar dock anmärkningsvärt snabbt. Efter att ha bott tio år i landet är nästan 70 procent av kvinnorna sysselsatta, vilket är bara tio procentenheter mindre än motsvarande siffra för män. Efter tio års boende i Finland är andelen kvinnor i utbildning som leder till examen större än motsvarande andel för män. Kravet på tryggad försörjning bedömdes därför inte påverka jämställdheten mellan könen, när man beaktade att granskningsperioden för försörjningsvillkoret infaller under de två år som omedelbart föregår naturalisationen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det ska införas ett nytt samhällskunskapsvillkor för naturalisation och ett nytt medborgarskapsprov. Samhällskunskapsvillkoret gäller i regel alla personer i arbetsför ålder som är intresserade av att ansöka om medborgarskap. Den samhällskunskap som krävs för medborgarskap kan påvisas antingen genom en student- eller högskoleexamen eller genom ett särskilt medborgarskapsprov. Medborgarskapsprovet baserar sig på läromedlet för medborgarskapsprovet, som utarbetas utifrån det läromedel som utarbetats för samhällsorienteringen för kommunernas integrationskunder. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet är detsamma för män och kvinnor. Syftet är att alla 18–64-åringar ska ha möjlighet att avlägga medborgarskapsprovet oberoende av kön. Frågorna i medborgarskapsprovet omfattar bland annat individens rättigheter och skyldigheter samt jämställdhet mellan könen. Att förbereda sig för medborgarskapsprovet och sätta sig in i det läromedel som används för provet kan indirekt ha en positiv inverkan på förverkligandet av jämställdheten mellan könen. I läromedlet för samhällsorientering, på basis av vilket läromedlet för medborgarskapsprovet utarbetas, ingår ett separat avsnitt om jämställdhet och likabehandling.\u003Cspan class=\"AlaviiteKooste\"> I avsnittet finns bland annat information om förbudet mot diskriminering på grund av kön och kvinnors ställning i arbetslivet ().\u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali/lait-ja-oikeus/tasa-arvo-ja-yhdenvertaisuus\">https://yhteiskuntaorientaatio.fi/sv/laromedel/lag-och-ratt/jamstalldhet-och-likabehandling\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Personer som deltagit i samhällsorienteringen som integrationskunder i kommunen har i praktiken delvis bekantat sig med ämnena i medborgarskapsprovet redan innan de börjar förbereda sig för medborgarskapsprovet. I samhällsorienteringen inkluderas bland annat hemmaföräldrar, och på detta sätt strävar man efter att stärka integrationen av föräldrar som vårdar barn hemma och i synnerhet kvinnor i det finländska samhället. Det att medborgarskapsprovet och läromedlet för det baserar sig på läromedlet i samhällsorienteringen kan därför i viss mån främja kvinnornas möjligheter att avlägga provet och på så sätt ha en positiv inverkan på förverkligandet av jämställdheten mellan könen. Detta har betydelse i synnerhet eftersom till exempel fördelningen av omsorgsansvaret i familjerna kan påverka möjligheterna att förbereda sig för provet och därmed också tidpunkten för provet och för att förvärva medborgarskap. Genom ett medborgarskapsprov som baserar sig på samhällsorientering kan man sträva efter att främja jämlika möjligheter att avlägga provet. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för olika människogrupper\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Nedan granskas propositionens konsekvenser enligt människogrupp. Dessa grupper kan också delvis överlappa varandra. &nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för familjer och barn\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">En förlängning av boendetiden bedömdes påverka barnen särskilt genom att barnen oftast får medborgarskap som medsökande tillsammans med sin vårdnadshavare. År 2022 var barnens andel av alla som naturaliserades ca 28 %. År 2022 var cirka 13 procent av de personer som naturaliserades makar till finska medborgare. Antalet dagar då den sökande vistats utomlands som godkänns som boendetid minskades, vilket i vissa situationer bedömdes kunna påverka den andra förälderns möjligheter att resa till bakgrundslandet eller förvärva medborgarskap. Bestämmelserna bedömdes dock fortfarande möjliggöra både förvärv av medborgarskap och sådana utlandsresor till den andra förälderns bakgrundsland som har betydelse för barnets identitet och språkkunskaper samt släktskapsförhållanden. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I följande skede gjordes ändringar i bland annat den försörjning som krävs för medborgarskap. Kravet på tryggad försörjning ledde till att en person som i huvudsak lever med arbetslöshetsförmån eller utkomststöd i regel inte kan förvärva medborgarskap. Ändringarna bedömdes påverka hela familjens möjligheter till medborgarskap om föräldrarna är arbetslösa. Om en arbetslös förälder inte uppfyller försörjningsvillkoret och det fattas ett negativt beslut på hans eller hennes ansökan, förvärvar inte heller de barn som är medsökande finskt medborgarskap. Det väsentliga är om den vårdnadshavare för barnen som är sökande har fått arbetslöshetsförmån eller utkomststöd i mer än tre månader under de senaste två åren. Försörjningsvillkoret kan också uppfyllas om sökanden får sin försörjning genom sin makes arbete eller företagsverksamhet, om personen inte själv hade behövt ty sig till arbetslöshetsförmån eller utkomststöd annat än tillfälligt. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor samt att det ska införas ett medborgarskapsprov avsett för att påvisa samhällskunskap. Dessa ändringar berör framför allt vuxna personer i arbetsför ålder. Medborgarskapsprovet påverkar således indirekt barns möjlighet att förvärva medborgarskap genom att barnen i regel kan förvärva medborgarskap tillsammans med sin förälder endast om föräldern först har klarat medborgarskapsprovet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det nya samhällskunskapsvillkoret och medborgarskapsprovet i anslutning till det berör inte barn, det vill säga personer under 18 år. Av ett barn som är medsökande i samband med en förälders ansökan om medborgarskap förutsätts inte påvisande av samhällskunskap. Ett barn som är sökande (24&nbsp;§) omfattas heller inte av samhällskunskapsvillkoret. Samhällskunskapsvillkoret gäller däremot den medsökandes förälder. Uppfyllandet av villkoret kan enligt förslaget påvisas genom medborgarskapsprovet eller en student- eller högskoleexamen. Utgångspunkten är fortfarande att den sökande ska uppfylla villkoren för naturalisation för att personen och eventuella medsökande ska kunna förvärva medborgarskap. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Alla barn som är permanent bosatta i Finland är läropliktiga tills de fyller 18 år. Barn, det vill säga personer under 18 år, går således ännu i skola och därför är det inte nödvändigt att kräva att de avlägger ett separat medborgarskapsprov. Å andra sidan kan det också anses vara förenligt med barnets bästa att barnets förälder har grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. I och med de föreslagna ändringarna förutsätts det i fortsättningen att alla vuxna i arbetsför ålder påvisar sådana kunskaper för att medborgarskap ska kunna beviljas på ansökan. Även föräldrar som ansöker om medborgarskap för sig själva och sina barn ska således genom ett medborgarskapsprov eller en student- eller högskoleexamen påvisa att de har inhämtat centrala kunskaper om det finländska samhället. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Migrationsverket kan enligt förslaget bevilja en sökande förälder sådana specialarrangemang för att avlägga medborgarskapsprovet som föräldern behöver bland annat på grund av sin funktionsnedsättning. Dessutom kan man enligt förslaget avvika från samhällskunskapsvillkoret bland annat på grund av en sådan funktionsnedsättning som långvarigt hindrar sökanden från att uppfylla kravet. Samhällskunskapsvillkoret och medborgarskapsprovet hindrar således inte ett barn från att förvärva medborgarskap på grund av förälderns funktionsnedsättning. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">År 2025 gjordes sammanlagt 11&nbsp;237 medborgarskapsansökningar, av vilka 3&nbsp;535 var ansökningar från barn som var medsökande. År 2024 anhängiggjordes sammanlagt 17&nbsp;063 ansökningar, av vilka 5&nbsp;255 gällde barn som var medsökande. År 2025 beviljades sammanlagt 13&nbsp;483 personer medborgarskap på basis av en ansökan om medborgarskap, och 3 975 av dessa var medsökande barn. År 2024 beviljades 12&nbsp;417 personer medborgarskap, av vilka 3&nbsp;622 var medsökande barn. År 2024 och 2025, då villkoren för naturalisation inte omfattade ett samhällskunskapsvillkor, förvärvade således färre än 4&nbsp;000 medsökande barn medborgarskap. Utifrån denna statistik kan det uppskattas att samhällskunskapsvillkoret varje år indirekt påverkar cirka 4&nbsp;000 barn, vars förälder måste uppfylla det nya samhällskunskapsvillkoret för att förvärva medborgarskap. Antalet negativa beslut som fattades för medsökande uppgick till sammanlagt 514 år 2025 och till sammanlagt 350 år 2024. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tabell 5: Barn som varit medsökande i föräldrarnas ansökan om medborgarskap 2024–2025. &nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10A3F\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Medsökande barn/år\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2024\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2025\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Personer som ansökt om medborgarskap &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">5&nbsp;255&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">3&nbsp;535&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Naturaliserats &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">3&nbsp;622&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">3&nbsp;975&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Personer som fått avslag&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">350&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">514&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Det nya samhällskunskapsvillkoret ökar inte nödvändigtvis avsevärt antalet negativa beslut som gäller medsökande barn. Det nya villkoret med tillhörande medborgarskapsprov kan emellertid påverka en del av barnens föräldrar så att de skjuter upp ansökan om medborgarskap för sig själva och sina barn. Å andra sidan är medborgarskapsprovet ett flervalsprov som baserar sig på ett läromedel som finns allmänt tillgängligt och vars frågor handlar om information som är central i läromedlet. Läromedlet för medborgarskapsprovet ska utarbetas utifrån det befintliga nationella läromedlet för samhällsorientering. Syftet är att det nya samhällskunskapsvillkoret inte ska utgöra ett oskäligt krav för personer som har barn och som är intresserade av att ansöka om medborgarskap. Om ett barn emellertid inte förvärvar medborgarskap som förälderns medsökande och fyller 18 år, kan barnet under vissa förutsättningar förvärva medborgarskap på basis av en ung persons medborgarskapsanmälan (28 § i medborgarskapslagen), varvid barnet inte själv behöver uppfylla samhällskunskapsvillkoret ens efter att ha blivit myndig\u003Cspan class=\"AlaviiteTeksti\"> En ung persons medborgarskapsanmälan är avsedd för 18–22-åringar som bott länge i Finland.\u003C/span>&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för personer som får internationellt skydd och statslösa personer\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Avskaffandet av undantaget i fråga om boendetid för personer som får internationellt skydd bedömdes ha den inverkan att den boendetid som krävs av vissa sökande fördubblas, såvida det inte föreligger några andra grunder för att avvika från boendetiden. Utöver avskaffandet av undantaget i anslutning till internationellt skydd ändrades lagen så att den tid som gått åt till att behandla asylansökan inte längre räknas in i boendetiden, och denna ändring bedömdes beröra något över tusen personer årligen. Lagen ändrades dock också så att en medborgarskapsansökan i regel ska behandlas inom ett år, om sökanden får internationellt skydd eller är statslös. Den nya lagstadgade maximitiden bedömdes påverka en sådan sökande så att tiden för behandling av medborgarskapsansökan i praktiken blir cirka ett år kortare.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Efter ändringarna i boendetiden ändrades medborgarskapslagen bland annat så att ett nytt försörjningsvillkor lades till för att förvärva medborgarskap. Det gäller i regel även sökande som får internationellt skydd och statslösa sökande. I ändringen beaktas att alla som ansöker om medborgarskap inte har haft förutsättningar för försörjning i ett tidigare skede. Granskningsperioden för tryggad försörjning är de två år som föregår naturalisationen. Sysselsättningen under den tid personen bott i Finland påverkar också möjligheterna att förvärva medborgarskap för personer som får internationellt skydd och statslösa personer. I fortsättningen kommer det att vara svårare för en arbetslös person att förvärva finskt medborgarskap, eftersom försörjningsvillkoret inte uppfylls om sökanden under de senaste två åren har tytt sig till arbetslöshetsförmån eller utkomststöd i mer än tre månader sammanlagt.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor för naturalisation, och dessutom införs ett medborgarskapsprov avsett för påvisande av samhällskunskap. Samhällskunskapsvillkoret gäller i regel alla vuxna i arbetsför ålder, även personer som får internationellt skydd och statslösa personer. Uppfyllandet av villkoret kan påvisas med en student- eller högskoleexamen eller ett medborgarskapsprov. Frågorna i medborgarskapsprovet baserar sig på ett läromedel för medborgarskapsprovet som utarbetas utifrån läromedlet för samhällsorientering enligt integrationslagen. Ur denna synvinkel är det viktigt att man i integrationsplanen för bland annat en kvotflykting eller en person som får internationellt skydd kan komma överens om att personen deltar i samhällsorientering. Personer som deltagit i samhällsorienteringen har i praktiken delvis bekantat sig med ämnena i medborgarskapsprovet redan innan de börjar förbereda sig för medborgarskapsprovet. Deltagandet i samhällsorienteringen kan således främja möjligheterna för bland annat personer som får internationellt skydd att avlägga provet.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för internationella experter\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I samband med ändringarna av boendetiden bedömdes att en förlängning av boendetiden i viss mån kan minska Finlands dragningskraft för sådana utländska personer som utför expertarbete. En minskning av antalet dagar då den sökande vistats utomlands som godkänns som boendetid bedömdes ha betydelse särskilt för personer som reser mycket på grund av sitt arbete. Ändringarna av boendetiden kan medverka till att minska eller fördröja en mer permanent etablering av utbildad arbetskraft i Finland, men landets dragningskraft påverkas också av andra faktorer än möjligheten att förvärva medborgarskap, till exempel karriärmöjligheter och ett familjevänligt samhälle. Förlängningen av boendetiden och minskningen av antalet dagar då den sökande vistats utomlands som godkänns som boendetid kan också påverka utländska studerandes planer, men det bedömdes att bestämmelserna även efter ändringarna fortfarande gör det möjligt att kombinera studentutbyte och ansökan om medborgarskap.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I det andra skedet av ändringarna i medborgarskapslagen granskades särskilt det nya försörjningsvillkorets inverkan (RP&nbsp;19/2025&nbsp;rd, s. 48–49). Utifrån den utredning som genomförts av Datarummet, som verkar i anslutning till Statens ekonomiska forskningscentral, bedömdes att ändringarna inte har någon betydande inverkan på hur personer som kommer till Finland på grund av arbete i fortsättningen uppfyller försörjningsvillkoret.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det ska införas ett nytt samhällskunskapsvillkor och ett nytt medborgarskapsprov. Även i flera andra länder förutsätts att man för att förvärva medborgarskap antingen avlägger ett medborgarskapsprov eller på annat sätt påvisar motsvarande kunskaper till exempel genom avlagd utbildning. Medborgarskapsproven innehåller i allmänhet olika frågor om samhället. Det kan antas att medborgarskapsprovet inte utgör något betydande hinder för att förvärva medborgarskap för personer som utför expertarbete i Finland. För naturalisation förutsätts även nu att man påvisar nöjaktiga kunskaper i finska eller svenska. Utbildade personer som utför expertarbete antas ha färdigheter att avlägga olika prov som krävs för medborgarskap.\u003Cspan class=\"AlaviiteTeksti\"> Till exempel för en del personer i utsatt ställning kan medborgarskapsprovet i praktiken utgöra ett mer kännbart krav (jfr bl.a. Cooke 2009: Barrier or entitlement? The language and citizenship agenda in the United Kingdom, Language Assessment Quaterly 6:1, s. 76–77). I Danmark och Nederländerna har man observerat att det finns ett samband mellan utbildningsnivån och i vilken mån införandet av prov i anslutning till medborgarskap har minskat intresset för att ansöka om medborgarskap och skjutit upp förvärvandet av medborgarskap (Vink m.fl. 2021, s. 759, 763). \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Dessutom kan sökanden påvisa att samhällskunskapsvillkoret uppfylls om personen avlagt en högskoleexamen på finska eller svenska, varvid det inte krävs att personen avlägger medborgarskapsprovet. Syftet med att beakta högskoleexamina är att öka Finlands hållkraft för personer som avlagt högskoleexamen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Utifrån statistik över utlänningar som studerat i Finland kan man uppskatta det eventuella antalet personer som inte behöver avlägga medborgarskapsprovet för att förvärva medborgarskap. Den statistik som finns tillgänglig omfattar å ena sidan utlänningar som inlett gymnasieutbildning och å andra sidan utlänningar som avlagt en yrkeshögskoleexamen och högre yrkeshögskoleexamen på finska eller svenska, det vill säga personer som inte har finskt medborgarskap. Sammanlagt cirka 1&nbsp;300–1&nbsp;800 personer som inte hade finskt medborgarskap inledde en gymnasieutbildning i Finland 2021–2023.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://vipunen.fi/fi-fi/_layouts/15/WopiFrame.aspx?sourcedoc=%7BF5D99143-A9B5-421A-B522-D7DD211E36C4%7D&amp;file=Lukiokoulutus%20-%20uudet%20opiskelijat%20-%20ulkomaalaiset%20-%20kansalaisuus.xlsb&amp;action=default\">https://vipunen.fi/fi-fi/_layouts/15/WopiFrame.aspx?sourcedoc=%7BF5D99143-A9B5-421A-B522-D7DD211E36C4%7D&amp;file=Lukiokoulutus%20-%20uudet%20opiskelijat%20-%20ulkomaalaiset%20-%20kansalaisuus.xlsb&amp;action=default\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tabell 6: Utländska studerande som inlett gymnasieutbildning i Finland.&nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10B02\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Studier/år\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2021\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2022\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2023\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Personer som inlett gymnasieutbildning&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;272&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;575&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;752&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">År 2024 avlade sammanlagt 197 personer som inte hade finskt medborgarskap en yrkeshögskoleexamen på finska eller svenska (2023 sammanlagt 142 personer). År 2024 avlade sammanlagt 17 personer som inte hade finskt medborgarskap en högre yrkeshögskoleexamen på finska eller svenska (2023 sammanlagt 13 personer).\u003Cspan class=\"AlaviiteTeksti\"> Statistik enligt utbildningens språk finns endast att tillgå om yrkeshögskoleutbildningen. Enligt en bedömning av undervisnings- och kulturministeriet ligger siffrorna inom universitetsutbildningen emellertid på samma nivå som vid yrkeshögskolorna.\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tabell 7: Utlänningar som avlagt yrkeshögskolestudier på finska eller svenska.&nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10B73\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Studier/år\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2023\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2024\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Yrkeshögskoleexamen på finska eller svenska&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">142&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">197&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Högre yrkeshögskoleexamen på finska eller svenska&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">13&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">17&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">På basis av statistiken ovan kan man uppskatta att det varje år sammanlagt finns cirka 2&nbsp;000 personer som inte behöver avlägga medborgarskapsprovet för att förvärva medborgarskap i den mån det med beaktande av andra omständigheter är aktuellt för personen att ansöka om medborgarskap. I fråga om de siffror som presenteras ska man till exempel beakta att det bland dem som avlagt studier också kan finnas personer som över huvud taget inte ansöker om finskt medborgarskap eller för vilka det av någon annan orsak ännu inte är aktuellt eller möjligt. Dessutom ska även en person som avlagt studier uppfylla de övriga villkoren för naturalisation, till exempel boendetidsvillkoret och försörjningsvillkoret.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för utlandsfinländare och återflyttare\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Förlängningen av den boendetid som krävs för medborgarskap bedömdes kunna ha en indirekt inverkan på hur lockande återflyttning är för såväl utlandsfinländare som deras familjemedlemmar. För utlandsfinländare och återflyttare är dock också frågor som berör till exempel familjemedlemmars inresa och uppehållstillstånd centrala. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I följande skede gjordes ändringar i vissa andra villkor för att förvärva medborgarskap, till exempel i försörjningsvillkoret, och gällande förlust av medborgarskap. Ändringarna bedömdes som sådana inte nödvändigtvis medföra några konsekvenser för utlandsfinländares och deras familjers flytt till Finland. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det samhällskunskapsvillkor och medborgarskapsprov som föreslås i denna proposition har sannolikt inte heller någon avgörande betydelse för flyttningsbeslutet. En allmän skärpning av villkoren för naturalisation kan dock påverka flyttplanerna för utlandsfinländare och deras familjer.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för personer med långtidssjukdom eller funktionsnedsättning\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I det föregående skedet av ändringarna i medborgarskapslagen infördes bland annat ett nytt försörjningsvillkor för naturalisation. Vid bedömningen av konsekvenserna av ändringen konstaterades att till exempel en person som får sin utkomst av sjuk- eller invalidpension också uppfyller det nya villkoret. Även till exempel en person som får handikappbidrag kan uppfylla villkoret. Dessutom kan undantag från försörjningsvillkoret göras på den grund att sökanden är långvarigt sjuk eller har en sådan funktionsnedsättning som långvarigt hindrar personen från att uppfylla villkoret.&nbsp;&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor och att det ska införas ett medborgarskapsprov avsett för att påvisa samhällskunskap. Specialarrangemang kan beviljas för att avlägga medborgarskapsprovet, till exempel på grund av funktionsnedsättning. Syftet med specialarrangemangen är att omständigheter såsom sjukdom, funktionsnedsättning eller särskilda läs- och skrivsvårigheter inte ska utgöra ett hinder för att avlägga provet. Genom specialarrangemangen tryggas personer som är intresserade av att ansöka om medborgarskap jämlika och skäliga möjligheter att avlägga medborgarskapsprovet och därmed också förvärva medborgarskap. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Beslut om beviljande av eventuella specialarrangemang fattas av Migrationsverket. Som specialarrangemang kan till exempel beviljas tilläggstid för att avlägga provet eller möjlighet att avlägga provet i en separat och tillgänglig provlokal. Specialarrangemangen kan också hänföra sig till särdrag i det elektroniska provet och inkludera till exempel möjlighet att använda en större skärm eller att förstora teckenstorleken. Specialarrangemangen för personer med funktionsnedsättning kan dessutom omfatta olika hjälpmedel, möjlighet att använda sin egen dator eller någon annan motsvarande anordning tillsammans med de hjälpmedel som finns i den samt personlig assistans enligt lagen om funktionshinderservice (675/2023). De aktörer med vilka Migrationsverket avtalat om anordnande av provtillfällen sörjer för att de specialarrangemang som Migrationsverket beviljat genomförs.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Utgångspunkten är således att den samhällskunskap som krävs vid behov kan påvisas med hjälp av specialarrangemang. Undantag från samhällskunskapsvillkoret kan emellertid göras när man till exempel på grund av en funktionsnedsättning inte skäligen kan förutsätta att medborgarskapsprovet kan avläggas ens med hjälp av specialarrangemang. Genom möjligheten till undantag säkerställs att även sådana sökande som inte har någon faktisk möjlighet att uppfylla det nya samhällskunskapsvillkoret kan beviljas medborgarskap. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Undantag från samhällskunskapsvillkoret kan göras om det föreligger en sådan grund för undantag som hänför sig till den sökandes hälsotillstånd eller funktionsnedsättning och som gör att personen inte kan påvisa att villkoret uppfylls. Regleringen täcker i omfattande utsträckning täcka alla sådana situationer där den sökandes fysiska eller psykiska funktionsförmåga är så pass allvarligt och under en lång tid nedsatt av medicinska skäl att personen inte skäligen kan förväntas uppfylla samhällskunskapsvillkoret. Orsaker som hänför sig till hälsotillståndet kan till exempel vara en psykisk eller fysisk kronisk sjukdom, intellektuell funktionsnedsättning, neuropsykiatrisk störning, CP-skada eller långvarig skada orsakad av en yttre faktor. &nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sammanfattande observationer om samverkan av de ändringar som gäller medborgarskap\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Det har tillsatts sammanlagt tre olika projekt för att bereda ändringarna i medborgarskapslagen. Till helheten hör förutom en förlängning av boendetiden även andra skärpningar av villkoren för att förvärva medborgarskap, inklusive ett nytt försörjningsvillkor. I det föregående skedet gjordes också vissa ändringar som berörde förlust av medborgarskap. I denna proposition föreslås att det ska införas ett nytt samhällskunskapsvillkor och ett nytt medborgarskapsprov. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ändringarna i villkoren för naturalisation påverkar i omfattande utsträckning personer som ansöker om medborgarskap och möjligheten att förvärva medborgarskap. År 2025 gjorde sammanlagt 11&nbsp;237 personer en ansökan om medborgarskap (sammanlagt 17&nbsp;063 personer 2024 och sammanlagt 18&nbsp;296 personer 2023). År 2025 beviljades sammanlagt 14&nbsp;067 personer medborgarskap på ansökan (2024 sammanlagt 12&nbsp;417 personer och 2023 2023 sammanlagt 11&nbsp;594 personer). Antalet ärenden som gäller förlust av medborgarskap har varit betydligt mindre, och de ändringar som gjorts gällande förlust av medborgarskap gäller i praktiken ett litet antal personer. Andelen negativa beslut av alla medborgarskapsansökningar har varit 9–11 procent under de nämnda åren.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I samband med ändringen av boendetiden och andra ändringar har man redan preliminärt bedömt de sammantagna konsekvenserna av att skärpa de olika villkoren för naturalisation. En skärpning av de olika villkoren leder inte nödvändigtvis till att det fattas klart fler negativa beslut på medborgarskapsansökningar än tidigare. De olika ändringarna kan dock bidra till att det görs färre ansökningar än tidigare, om eventuella sökande efter att ändringarna trätt i kraft bedömer att de inte uppfyller villkoren för naturalisation. Hur de ändringar som gjorts i olika skeden har påverkat såväl antalet ansökningar som antalet negativa beslut kan granskas noggrannare först när ändringarna har varit i kraft en längre tid.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det försörjningsvillkor som trädde i kraft i det föregående skedet av ändringarna i medborgarskapslagen skiljer sig avsevärt från den tidigare regleringen. Arbetslöshet kan påverka möjligheten att förvärva medborgarskap betydligt mer än tidigare, eftersom försörjningsvillkoret inte uppfylls om sökanden har tytt sig till arbetslöshetsförmån eller utkomststöd i mer än tre månader under de senaste två åren. Lagändringen om försörjningsvillkoret har endast varit i kraft en tid, så det är inte möjligt att göra en noggrannare bedömning av dess konsekvenser i detta skede.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att villkoren för naturalisation utökas med ett krav på att påvisa kunskaper om samhället. I praktiken är det fråga om grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Dessa kunskaper kan i stället för genom det nya medborgarskapsprovet också påvisas genom en student- eller högskoleexamen som avlagts på finska eller svenska. Frågorna i medborgarskapsprovet baserar sig på läromedlet för medborgarskapsprovet, som utarbetas utifrån läromedlet för den samhällsorientering som ordnas för kommunens integrationskunder. Medborgarskapsprovet är skriftligt och den som deltar i provet ska välja rätt svar på frågorna bland de givna alternativen. Avläggandet av ett sådant medborgarskapsprov kan också i ljuset av en internationell jämförelse anses vara ett rimligt nytt krav. Också ändringarna i denna proposition kan dock bedömas bidra till att det görs färre ansökningar än tidigare, om eventuella sökande efter att ändringarna trätt i kraft bedömer att de inte uppfyller villkoren för naturalisation. Medborgarskapsprovet utgör ett nytt skede som föregår ansökan om medborgarskap och för naturalisation krävs i fortsättningen oftast att medborgarskapsprovet avlagts med godkänt resultat. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Införandet av det nya medborgarskapsprovet leder till nya uppgifter i synnerhet för Migrationsverket, som ansvarar för den allmänna förvaltningen, övervakningen och utvecklingen av samt informationen om systemet för medborgarskapsprovet. För att anmäla sig till medborgarskapsprovet, avlägga provet och registrera provresultaten behövs en interoperabel helhet av informationssystem, och Migrationsverket ansvarar även för denna. Det föreslås att Migrationsverket avtalar om utarbetandet av medborgarskapsprovet till exempel med något universitet. Migrationsverket avtalar om anordnandet av provtillfällen till exempel med utbildningsanordnare eller aktörer som upprätthåller läroanstalter. För medborgarskapsprovet inrättas också en tväradministrativ sakkunnigkommission som bland annat stöder Migrationsverket i utvecklingen av medborgarskapsprovet. Införandet av medborgarskapsprovet kräver inledande investeringar på sammanlagt 4,2 miljoner euro. Senare är avsikten att kostnaderna för medborgarskapsprovet ska täckas med provavgifter enligt självkostnadsprincipen. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Alternativa handlingsvägar\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Handlingsalternativen och deras konsekvenser\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ansvar för förvaltningen av medborgarskapsprovet\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">En av de centrala uppgifterna för den arbetsgrupp som utrett införandet av medborgarskapsprovet var att granska vilken som är den mest ändamålsenliga instansen för att förvalta medborgarskapsprovet. Det är alltså fråga om en helt ny uppgift. I arbetsgruppens utredning granskades i synnerhet sådana myndighetsaktörer som har någon form av koppling till anordnandet av examina eller prov eller till medborgarskaps- eller integrationsärenden. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Som ett alternativ för genomförandet bedömdes om undervisnings- och kulturministeriets förvaltningsområde lämpar sig för att förvalta medborgarskapsprovet. Utarbetandet, upprätthållandet och utvecklingen av provet förutsätter en bred sakkunskap om planering och organisering av pedagogik och testning. Undervisnings- och kulturministeriet fastställer riktlinjerna och de strategiska riktlinjerna för utbildningspolitiken samt bereder lagstiftning och statsrådets beslut som berör utbildning. En central nationell aktör i genomförandet och utvecklingen av utbildningspolitiken är Utbildningsstyrelsen, som lyder under undervisnings- och kulturministeriet. Till exempel i integrationsutbildningen enligt integrationslagen iakttas Utbildningsstyrelsens grunder för läroplanen för integrationsutbildning. Dessutom har Utbildningsstyrelsen varit med och uppdaterat och utvecklat ett läromedel för samhällsorientering, utifrån vilket det utarbetas ett läromedel även för medborgarskapsprovet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Förutom att Utbildningsstyrelsen har en sådan pedagogisk sakkunskap som är till nytta med tanke på utarbetandet av medborgarskapsprovet, har den även erfarenhet av att förvalta olika tester. Såsom konstaterats i avsnitt 2.3.2.1 ansvarar Utbildningsstyrelsen för att förvalta, utveckla och övervaka systemet med allmänna språkexamina. Dessutom ansvarar Utbildningsstyrelsen för att genomföra sluttester av kunskaperna i finska och svenska enligt integrationslagen. Därmed har Utbildningsstyrelsen erfarenhet av och sakkunskap om förvaltning av testsystem och de praktiska åtgärder som förvaltningsansvaret medför. För att utarbeta och utveckla frågorna i medborgarskapsprovet krävs sakkunskap om olika nivåer av språkkunskaper, vilket skulle ha förordat att Utbildningsstyrelsen är en lämplig instans för att förvalta medborgarskapsprovet.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I fråga om undervisnings- och kulturministeriets förvaltningsområde har man i beredningen dock särskilt beaktat att medborgarskapsprovet till sin natur eller till sitt användningsändamål inte hör till förvaltningsområdets kärnområde. Därmed har det bedömts att ansvaret för att förvalta medborgarskapsprovet som helhet inte lämpar sig för undervisnings- och kulturministeriets förvaltningsområde. Sakkunskapen inom undervisnings- och kulturministeriets förvaltningsområde kan dock utnyttjas i medborgarskapsprovet genom att även experter på vetenskap och utbildning ingår i den sakkunnigkommissionen som inrättas för medborgarskapsprovet. Detta är nödvändigt eftersom även aktörer inom vetenskap och utbildning enligt förslaget ska sörja för utarbetandet av medborgarskapsprovet och anordnandet av provtillfällen. Medlemmarnas åsikter i egenskap av sakkunniga kan utnyttjas bland annat för att analysera hur provfrågorna fungerar samt för att samordna efterfrågan och utbudet på provtillfällen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Även arbets- och näringsministeriet och de närings-, trafik- och miljöcentraler (NTM-centraler) som hör till dess förvaltningsområde var en alternativ aktör för att ansvara för förvaltningen av provet\u003Cspan class=\"AlaviiteTeksti\"> På basis av NTM-centralerna har inrättats livskraftscentraler i samband med en reform som trädde i kraft i början av 2026.\u003C/span>. Till arbets- och näringsministeriets förvaltningsområde hör bland annat främjande av integrationen av invandrare och arbetsrelaterad invandring. Arbets- och näringsministeriet ansvarar för planeringen, utvecklingen och styrningen av integrationspolitiken, beredningen av integrationslagstiftningen samt uppföljningen och utvärderingen av integrationspolitiken. Ministeriet styr också de regionala NTM-centralerna. NTM-centralerna å sin sida sköter regionalt uppgifter i anslutning till främjande av integration, mottagande av flyktingar, arbetskraftsinvandring och goda befolkningsrelationer. NTM-centralerna stöder och samarbetar tväradministrativt med aktörer som arbetar med invandring och integration. NTM-centralerna ansvarar för den regionala koordinationen, utvecklingen och samordningen av integrationsfrämjandet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Syftet med medborgarskapsprovet är att mäta personens integration i samhället och kunskaper om grundprinciper och regler i samhället. Detta kan för sin del anses förorda en lösning där den instans som ansvarar för förvaltningen har ansvar och sakkunskap även om integrationsfrämjande. Till denna del bör det dock beaktas att integrationen och åtgärderna i anslutning till den i Finland snarare infaller i det inledande skedet av boendet, medan samhällskunskapen i anslutning till förvärv av finskt medborgarskap eventuellt testas först flera år efter integrationsutbildningen. Alla som ansöker om medborgarskap deltar heller inte i integrationsutbildning, och dessutom förutsätts det för att avlägga medborgarskapsprovet i praktiken att personen sätter sig in i de saker som mäts i provet även efter en eventuell integrationsutbildning när det blir mer aktuellt att ansöka om medborgarskap. Således är det inte nödvändigt att samma aktör som ansvarar för integrationsåtgärderna även ansvarar för förvaltningen av medborgarskapsprovet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det är dock motiverat att utnyttja även sakkunskapen inom arbets- och näringsministeriets förvaltningsområde i sakkunnigkommissionen för medborgarskapsprovet. I denna proposition föreslås att vice ordförande för sakkunnigkommissionen ska företräda sakkunskap inom integration. Sakkunskap som är central med tanke på medborgarskapsprovet innehas till exempel av sysselsättnings-, utvecklings- och förvaltningscentret, som ansvarar för att upprätthålla det läromedel för samhällsorientering som används som grund för läromedlet för medborgarskapsprovet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ett annat alternativ i arbetsgruppens utredning var kommunerna. Kommunerna har sakkunskap om undervisning och prov eftersom de bland annat ansvarar för den grundläggande utbildningen och den grundläggande utbildningen för vuxna. Dessutom ansvarar kommunerna för integrationsfrämjandet på lokal nivå I detta ingår bland annat att kommunerna enligt integrationslagen ska ordna samhällsorientering för integrationskunder på deras modersmål eller på språk som de annars har goda kunskaper i. Det finns ett betydande antal kommuner i Finland och till exempel samhällsorientering har inte ordnats i alla kommuner medan kommunerna i vissa områden i form av projekt har pilottestat att ordna samhällsorientering genom samarbete. Med tanke på bland annat jämlikheten mellan dem som ansöker om medborgarskap skulle det vara mer ändamålsenligt att ansvaret för att förvalta medborgarskapsprovet centraliserades på riksnivå så att anordnandet av provet således inte är beroende av en enskild kommuns möjligheter och till exempel resurser.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition beslöt man att föreslå att medborgarskapsprovet ska förvaltas av Migrationsverket. Uppgiften anknyter till det samhällskunskapsvillkor som bedöms i samband med ansökan om medborgarskap och resultatet av provet påverkar direkt individens möjlighet att förvärva finskt medborgarskap. Medborgarskapsprovet har således en central betydelse i medborgarskapsprocessen och därför är det naturligt att förvaltningen av provet ankommer på samma myndighet som redan ansvarar för hela processen. Migrationsverket behöver provresultatet vid behandlingen av medborgarskapsansökningar, så verket har direkt nytta av att provet genomförs på ett effektivt och smidigt sätt. Den administrativa helheten förblir tydlig och fungerande om ansvaret för förvaltningen av provet ankommer på den myndighet som på basis av sina övriga uppgifter behöver utnyttja provresultaten.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Medborgarskapsprovets innehåll och genomförandesätt\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Utifrån inrikesministeriets utredning om medborgarskapsprovet har man vid beredningen av propositionen bedömt att det mest kostnadseffektiva och ändamålsenliga sättet att testa samhällskunskapen är ett elektroniskt flervalsprov som avläggs på finska eller svenska. Syftet med medborgarskapsprovet är att mäta integrationen, och som en del av integrationen kan också betraktas förmågan att fungera i ett samhälle där skriftlig kommunikation och digital ärendehantering är en central del av vardagen och myndighetstjänsterna. I och med digitaliseringen har allt fler samhällstjänster överförts till webben och för att fungera i det finländska samhället krävs digital kompetens på basnivå.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I arbetsgruppens utredning granskades också andra genomförandesätt i anslutning till språket i provet och valet av provform samt dessa faktorers inverkan på provets funktion som ett instrument för att mäta kunskaperna om samhället. Eftersom kravet på språkkunskaper redan är ett villkor för naturalisation är syftet att genom medborgarskapsprovet uttryckligen bedöma samhällskunskapen och inte till exempel språkkunskaperna eller skrivfärdigheterna. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Språket i provet kan för sin del påverka hur väl personen förstår texten och provfrågorna i det läromedel som används för att förbereda sig för provet. I arbetsgruppens utredning granskades möjligheten att provet avläggs på deltagarens eget modersmål som ett alternativ. Möjligheten att använda sitt eget modersmål kan i vissa situationer förbättra deltagarens möjligheter att påvisa uttryckligen samhällskunskap, i synnerhet om personens kunskaper i finska eller svenska är begränsade. I praktiken skulle en sådan lösning dock kräva mycket ekonomiska resurser eftersom de utlänningar som bor i Finland har många olika modersmål.\u003Cspan class=\"AlaviiteTeksti\"> I Finland finns det sammanlagt 610&nbsp;148 personer med ett främmande språk som modersmål. De tio största språkgrupperna är ryska, estniska, arabiska, ukrainska, engelska, somaliska, farsi, kinesiska, albanska, kurdiska. Finland i siffror 2025, Statistikcentralen, s. 8.\u003C/span> Det skulle sannolikt inte vara möjligt att beakta alla språk, varvid man skulle vara tvungen att välja ett mer begränsat antal språk och därmed skulle alla inte ha möjlighet att avlägga provet på sitt eget modersmål.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">När provformerna granskades var ett alternativ för genomförandet ett prov i pappersform eller ett digitalt prov med öppna frågor som avläggs skriftligen. Denna provform kunde i sig lämpa sig för att mäta de grundläggande kunskaperna om det finländska samhället. Öppna frågor förutsätter dock att den som deltar i provet har aktiva skriftliga språkkunskaper, vilket för sin del kan påverka möjligheterna för dem som deltar i provet att påvisa sina kunskaper. Bedömningen av de öppna skriftliga svaren skulle också förutsätta ett särskilt nätverk av bedömare, vilket skulle öka kostnaderna för att genomföra medborgarskapsprovet och göra att det tar längre tid att få resultaten av provprestationerna. Om ett sådant genomförandesätt används kan digitaliseringen inte utnyttjas på samma sätt vid bedömningen av provprestationerna som i flervals- och påståendefrågor. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ett annat alternativ som granskades för medborgarskapsprovet var en muntlig intervju som skulle göra det möjligt att få en bild av provdeltagarens integration. En intervju kunde vara en lämplig provform särskilt för personer med svagare läs- och skrivfärdigheter. Om medborgarskapsprovet genomfördes genom muntliga intervjuer skulle det dock krävas bland annat intervjuare som utbildats för uppgiften och ett standardiserat bedömningsförfarande för att säkerställa att intervjuerna är enhetliga. Ett sådant genomförande skulle därför öka kostnaderna för medborgarskapsprovet avsevärt. I denna proposition beslutade man således att föreslå att medborgarskapsprovet avläggs skriftligen som ett elektroniskt prov, för vilket det vid behov kan beviljas specialarrangemang bland annat på grundval av en funktionsnedsättning. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sätt att påvisa samhällskunskap\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att ett krav på samhällskunskap fogas till villkoren för naturalisation. Uppfyllandet av kravet kan framför allt påvisas genom ett medborgarskapsprov. Syftet med samhällskunskapsvillkoret är att säkerställa att den som ansöker om medborgarskap framgångsrikt integrerats i det finländska samhället och kan fungera som finsk medborgare i landet. Med hjälp av medborgarskapsprovet kan man bedöma om examinanden känner till grundläggande strukturer och central lagstiftning i det finländska samhället, de grundläggande fri- och rättigheterna och de mänskliga rättigheterna samt Finlands historia och kultur.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Utifrån utredningen från inrikesministeriets arbetsgrupp granskades vid beredningen av propositionen olika alternativ för att ersätta medborgarskapsprovet med redan genomförd utbildning. I bakgrunden fanns tanken att den som är intresserad av att ansöka om medborgarskap inte behöver avlägga ett separat medborgarskapsprov om personen i fråga på annat sätt redan har visat att han eller hon har tillräcklig samhällskunskap. Genom att jämställa en viss utbildning med medborgarskapsprovet kan man undvika överlappande testning av samma kunskaper. Möjligheten att jämställa prov befriar en del av de blivande sökandena från det nya medborgarskapsprovet och minskar därmed också kostnaderna för att ansöka om medborgarskap.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">En viss utbildning kan under vissa förutsättningar jämställas med medborgarskapsprovet. Innehållet i den utbildning som jämställs ska motsvara medborgarskapsprovet. Utbildningen borde i tillräckligt stor utsträckning inbegripa de ämnesområden som är centrala i medborgarskapsprovet. Den borde omfatta studier om samhället som behandlar ämnen såsom de grundläggande fri- och rättigheterna och de mänskliga rättigheterna, det finländska samhället, den centrala lagstiftningen samt Finlands historia och kultur. Innehållet i utbildningen ska grunda sig på den läroplan som följs i Finland. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I det finländska utbildningssystemet ingår samhälleliga ämnen i undervisningen på det sätt som beskrivs i avsnitt 2.2.3.3. Såväl i den grundläggande utbildningen som i gymnasiet behandlas ämnen som ingår även i medborgarskapsprovet. Likaså inbegriper yrkesinriktade grundexamina obligatoriska examensdelar som anknyter till samhälls- och arbetslivskompetens. Även i den grundläggande utbildningen för vuxna behandlas strukturerna i det finländska samhället. Innehållet i de olika utbildningarna skiljer sig dock något från varandra. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I synnerhet innehållet i gymnasiets samhällslära kan anses vara jämförbart med ämnesområdena i medborgarskapsprovet. Syftet med gymnasiets samhällslära är att fördjupa den studerandes kunskaper om det omgivande samhället och ge den studerande förutsättningar att utvecklas till en aktiv och engagerad medborgare med intresse för samhällsfrågor. I gymnasiets samhällslära ska värdegrunden präglas av demokratiska principer, inklusive jämlikhet och respekt för de mänskliga rättigheterna. I denna proposition föreslås därför att en studentexamen som avläggs på finska eller svenska i slutet av gymnasieutbildningen ska kunna jämställas med en godkänd prestation i medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Samhällskunskapsvillkorets förhållande till språkkunskapsvillkoret\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det till villkoren för naturalisation fogas ett helt nytt villkor som inbegriper tillräcklig kunskap om samhället som påvisas på finska eller svenska. Samhällskunskapen påvisas i regel genom ett medborgarskapsprov som avlagts med godkänt resultat. Det här innebär att språkkunskapsvillkoret fortsättningsvis är ett separat villkor för naturalisation och att den sökande även i fortsättningen ska lägga fram en utredning om sina språkkunskaper utöver den föreslagna samhällskunskapen. Under beredningen har man också bedömt andra alternativ för hur bedömningen av samhällskunskapen skulle kunna genomföras i förhållande till språkkunskapsvillkoret. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I arbetsgruppens utredning om införandet av medborgarskapsprovet bedömdes som ett alternativ ett genomförandesätt där samhällskunskapsvillkoret skulle ha ersatt språkkunskapsvillkoret. Då skulle det gällande språkkunskapsvillkoret som ett villkor för naturalisation ha fallit bort. I detta alternativ skulle språkkunskaperna ha mätts endast genom att medborgarskapsprovet avläggs. Även i detta alternativ skulle medborgarskapsprovet ha avlagts antingen på finska eller svenska, så att det samtidigt skulle ha påvisat kunskaper i språket.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I det aktuella alternativet skulle den sökande inte ha behövt påvisa sina språkkunskaper separat i naturalisationsskedet eftersom han eller hon i vilket fall som helst skulle ha haft tillräckliga språkkunskaper för att avlägga medborgarskapsprovet med godkänt resultat. I integrationsutbildningen ingår sluttestning av språkkunskaperna, och dessutom ställs det olika krav på språkkunskaper för permanent uppehållstillstånd. Villkoren för naturalisation skulle inte ha ökat kvantitativt sett och de språkexamina som behöver avläggas för naturalisation skulle ha minskat. Detta kunde i viss mån ha medfört positiva konsekvenser även för
