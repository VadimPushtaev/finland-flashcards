m gäller personen, såsom en övertygelse eller åsikt. För att förvärva medborgarskap krävs framöver att man påvisar en viss kunskapsnivå på en viss nivå i finska eller svenska, men kravet blir inte orimligt inom den föreslagna ramen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I propositionen har man även beaktat inverkan av hälsotillståndet och en funktionsnedsättning då provet avläggs. På begäran av den som anmält sig till ett prov kan Migrationsverket bevilja specialarrangemang för provtillfället, med vilka till exempel personer med funktionsnedsättning kan avlägga medborgarskapsprovet på jämlikt sätt med andra. Medborgarskapsprovet avläggs innan medborgarskap ansöks. Det är således en fas som föregår medborgarskapsansökan. Dessutom beaktas hälsotillståndet och funktionsnedsättning i samband med en medborgarskapsansökan på så sätt att det är möjligt att avvika från samhällskunskapsvillkoret om sökandens hälsotillstånd eller funktionsnedsättning långvarigt hindrar honom eller henne från att uppfylla villkoret. Avvikelse från samhällskunskapsvillkoret kan bli aktuellt då man till exempel på grund av en funktionsnedsättning inte skäligen kan kräva att medborgarskapsprovet avläggs ens med specialarrangemang. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapslagen innehåller bestämmelser om såväl ett lägre språkkunskapsvillkor för personer som inte är skriv- och läskunniga (18 b § 2 mom.) som om hur man visar avsaknad av läs- och skrivkunnighet (18 b § 3 mom.). Medborgarskapslagen förutsätter att personer som inte har läs- och skrivkunnighet har elementära färdigheter att förstå och tala finska eller svenska eller regelbundet har deltagit i undervisning i finska eller svenska. Således krävs inte en tillfredsställande nivå i finska eller svenska av en person som visats vara en person som inte är läs- och skrivkunnig vilken motsvarar den nivå i finska eller svenska som används i provet och läromedlet. På grund av detta är en central fråga hur det språkkunskapskrav som gäller för personer som inte är skriv- och läskunniga kan samordnas med det nya samhällskunskapsvillkoret och hur man ska göra för att beakta jämlika möjligheter för personer som inte är skriv- och läskunniga att visa att det nya villkoret är uppfyllt. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sådana personer som inte är läs- och skrivkunniga på det sätt som avses i 18 b § 2 och 3 mom. i medborgarskapslagen kan avlägga medborgarskapsprovet muntligt genom specialarrangemang. På så sätt beaktas att det i vissa avgränsade situationer är tillräckligt med en färdighet att förstå tal för att avlägga provet. Även det finska eller svenska språk som används i provet anpassas till en begripligare form än allmänspråket. Genom sådana specialarrangemang beaktas det lägre språkkunskapskrav som föreskrivits för personer som inte är läs- och skrivkunniga i medborgarskapslagen och att det inte förutsätts att de har skriftliga kunskaper i finska eller svenska för att visa språkkunskapen. På grund av tillgängligheten är läromedlet för medborgarskapsprovet tillgängligt även i ljudform. På så sätt krävs inte skriftliga språkkunskaper av en person som visats sakna läs- och skrivkunnighet för att förbereda sig på medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Trots vad som lagts fram ovan är den språkkunskapsnivå som krävs för att avlägga provet dock något högre än den nivå på muntliga färdigheter som med tanke på språkkunskapsvillkoret förutsätts av en person som visats sakna läs- och skrivkunnighet för att förvärva medborgarskap. Ett medborgarskapsprov som kräver tillfredsställande språkkunskaper kan i praktiken inte avläggas med enbart elementära färdigheter att förstå tal. För att kunna avlägga provet krävs i verkligheten således en högre nivå på muntliga språkfärdigheter än vad som med tanke på språkkunskapsvillkoret krävs i medborgarskapslagen av personer som saknar läs- och skrivkunnighet. De personer som kommit till Finland utan att kunna läsa och skriva kan omfatta även sådana personer vars muntliga språkfärdigheter i praktiken ligger på tillräcklig nivå för att avlägga medborgarskapsprovet muntligen. I ett sådant fall överskrider de muntliga språkfärdigheterna hos en person som inte är läs- och skrivkunnig den språkkunskapsnivå som enligt lagen krävs av honom eller henne för att förvärva medborgarskap och i verkligheten har han eller hon övergått till nivån för en avancerad språkanvändare. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det nya villkor som gäller samhällskunskaper och som föreslås i propositionen är separat i förhållande till språkkunskapsvillkoret, varvid det förutsätts att detta villkor är uppfyllt utöver språkkunskapen. Å andra sidan ändras inte regleringen kring påvisande av språkkunskaper eller avvikelse från språkkunskapsvillkoret i medborgarskapslagen. En person som inte är läs- och skrivkunnig kan även framöver visa sina språkkunskaper i enlighet med vad som föreskrivs i 18 b § 2 och 3 mom. i lagen. Således förblir den nämnda regleringen fortfarande betydelsefull för att visa språkkunskapsvillkoret och språkkunskaperna, även om uppfyllandet av det nya språkkunskapsvillkoret i praktiken förutsätter en något högre nivå av muntliga språkfärdigheter.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I bedömningen av skäligheten för de högre muntliga språkfärdigheter som förutsätts i praktiken för att avlägga medborgarskapsprovet ska man för det första rikta uppmärksamhet på att det under en boendetid på åtta år är möjligt att avlägga sådana utbildningar vars syfte är att förvärva samhällskunskaper, läs- och skrivkunnighet och språkkunskaper. Till exempel skulle åtminstone en del av de i 18 b § 2 och 3 mom. i medborgarskapslagen avsedda personer som inte är skriv- och läskunniga ha avlagt samhällsorientering enligt 25 § i lagen om främjande av integration eller deltagit i en annan sådan utbildning som behandlar det finländska samhället, såsom en integrations- eller skrivkunnighetsutbildning eller grundläggande utbildning för vuxna. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I och med reformen av integrationstjänsterna (TEM099:00/2024) blir ett ännu tydligare mål att bland annat att lära sig finska eller svenska. De planerade ändringarna för att revidera integrationstjänsterna och de integrationsfrämjande åtgärder som används redan i nuläget kan förmodas bidra till att främja att invandrare som inte är läs- och skrivkunniga har möjlighet att avlägga ett sådant prov som förutsätter endast muntliga språkfärdigheter. De planerade ändringarna kan även för egen del minska det antal personer som fortfarande inte är läskunniga då de ansöker om medborgarskap. Reformen av integrationstjänsterna avses träda i kraft i början av år 2027. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Så som ovan konstaterats förutsätts inte heller framöver skriftliga språkfärdigheter av en person som inte är läs- och skrivkunnig, vilket är av betydelse för skälighetsbedömningen av förslaget. Språkkunskapernas olika delområden utvecklas i allmänhet i olika takt för samma person och till exempel skrivkunnighet uppnås i allmänhet sist (se RP 62/2025 rd, s. 54–55). I propositionen beaktas därtill även sådana situationer där uppfyllande av samhällskunskapsvillkoret inte är möjligt på grund av en orsak som gäller hälsotillståndet eller en funktionsnedsättning hos sökanden. Samhällskunskapsvillkoret gäller överhuvudtaget inte för personer i en viss ålder, eftersom det inte krävs att personer under 18 år och personer som fyllt 65 år avlägger medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Möjligheten att avlägga provet muntligt utifrån avsaknad av läs- och skrivkunnighet föreskrivs entydigt i lagen (25 g § 2 mom.). Vem som omfattas av en sådan möjlighet till ett muntligt prov framgår på ett noggrant avgränsat och exakt sätt av bestämmelsen. Möjligheten att avlägga provet muntligen på grund av avsaknad av läs- och skrivkunnighet har avgränsats till sådana personer under 65 år som avses i 18 b § 2 och 3 mom. i medborgarskapslagen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Syftet med samhällskunskapsvillkoret är att främja att en person som är intresserad av att få medborgarskap sätter sig in i de grundläggande principerna och reglering i samhället samt individens rättigheter och skyldigheter. En approach som betonar integration kan anses vara godtagbar bland annat med tanke på föreskrifterna i den europeiska konventionen om medborgarskap. Även medborgarskapslagens syfte (1 §) är att utöver den enskildes intresse även beakta statens intresse, vilket kan anses ha ett samband med att personen har tillräckliga samhällskunskaper. Integration och kännedom om samhället bildar ett sådant godtagbart mål, på grund av vilket färdigheter att förstå tal vilka överskrider en elementär nivå i praktiken kan förutsättas för att även av personer som visats sakna läs- och skrivkunnighet ska kunna avlägga provet muntligen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">De mål som är förknippade med medborgarskapsprovet kan inte uppnås med mindre inskränkande metoder, eftersom medborgarskapsprovet och det läromedel som används för att förbereda sig på det inte kan genomföras genom att anpassa det till en nivå av elementära språkkunskaper. Med ett prov som anpassats till en sådan nivå är det i verkligheten inte möjligt att mäta de grundläggande kunskaperna om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Även efter tillägget av det nya samhällskunskapsvillkoret omfattas medborgarskapsansökan av likadana rättsskyddsarrangemang som för närvarande. Det är möjligt att överklaga ett negativt beslut om en medborgarskapsansökan till förvaltningsdomstolen och den som ansökt om medborgarskap kan även framöver hänskjuta ett eget ärende till domstolsbehandling.&nbsp;&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I förslaget om medborgarskapsprovet beaktas även de olika boningsorterna för dem som deltar i det framtida provet. När avtal om anordnande av medborgarskapsprovet ingås ska man enligt förslaget beakta att provtillfällen erbjuds i en omfattning som är tillräcklig med beaktande av de regionala behoven. För att avlägga medborgarskapsprovet är det möjligt att förutsätta att deltagaren gör sådana resor som kan anses vara rimliga. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås inga ändringar som gäller hörande av barn. Bestämmelserna om hörande av barn och vårdnadshavare i 5 § i medborgarskapslagen förblir oförändrade. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utifrån vad som lagts fram ovan genomförs det nya samhällskunskapsvillkoret med beaktande av jämlikheten, diskrimineringsförbudet och förutsättningarna för att begränsa de grundläggande fri- och rättigheterna. Den föreslagna ändringen bedöms inte bli oskälig.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Bestämmelserna om skyddet för privatliv och personuppgifter i grundlagen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Grundlagens 10 § innehåller bestämmelser om skyddet för privatlivet. Enligt 1 mom. i paragrafen är vars och ens privatliv, heder och hemfrid tryggade. Skyddet för personuppgifter föreskrivs närmare genom lag. Skyddet för personuppgifter är således en del av det skydd för privatlivet vilket tryggats genom 10 § 1 mom. i grundlagen, varför det ska föreskrivas genom lag. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt grundlagsutskottet (bland annat GrUU 14/2018 rd, s. 4–5, GrUU 11/2024 rd, s. 2, GrUU 34/2024 rd, s. 2) bildar den detaljerade regleringen i EU:s allmänna dataskyddsförordning (EU) 2016/679 i allmänhet en tillräcklig författningsgrund även med tanke på det skydd för privatlivet och personuppgifter som tryggas i 10 § i grundlagen . Skyddet för personuppgifter bör i första hand tillgodoses med stöd av dataskyddsförordningen och den nationella allmänna lagstiftningen. Behövligheten av speciallagstiftning ska bedömas enligt det riskbaserade angreppssätt som tillägnats i dataskyddsförordningen. Ju större risk fysiska personers rättigheter och friheter utsätts för på grund av behandlingen av personuppgifter, desto mer motiverat är det med mer detaljerade bestämmelser. Denna omständighet är av särskild betydelse när det gäller behandling av känsliga uppgifter. Personuppgifter som anses vara känsliga omfattar till exempel uppgifter om en persons hälsotillstånd eller funktionsnedsättning (GrUU 11/2024 rd, s. 2, GrUU 15/2018 rd, s. 35). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Grundlagsutskottet har riktat uppmärksamhet bland annat på hur rätten att få uppgifter binds till uppgifternas nödvändighet (GrUU 15/2018 rd, GrUU 11/2024 rd, s. 4, GrUU 34/2024 rd, s. 3). Enligt grundlagsutskottet (GrUU 15/2018 rd, s. 39, GrUU 17/2016 rd, s. 5–6) kan myndigheternas rätt att få och möjlighet att lämna ut uppgifter ha gällt \"behövliga uppgifter\" för ett visst syfte, om lagen ger en uttömmande förteckning över innehållet i uppgifterna. Om innehållet i uppgifterna däremot inte anges i form av en förteckning på detta sätt, ska det i regleringen ha ingått ett krav på att ”uppgifterna är nödvändiga” för ett visst ändamål. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">EU:s allmänna dataskyddsförordning är direkt tillämplig rätt, men till vissa delar innehåller den nationellt handlingsutrymme. Genom en nationell lag är det möjligt att precisera den rättsliga grunden för behandling av personuppgifter och innehållet i behandlingen samt till exempel om vissa förutsättningar är uppfyllda avvika från den registrerades rättigheter. Lagenligheten i behandlingen av personuppgifter föreskrivs närmare i artikel 6. Med stöd av artikel 9 i förordningen är det möjligt att utfärda närmare bestämmelser även om behandling av personuppgifter som hör till de särskilda kategorierna av personuppgifter. Dataskyddsförordningen och dataskyddslagen innehåller detaljerade bestämmelser bland annat om de allmänna principerna för behandling av personuppgifter, den personuppgiftsansvariges skyldigheter och den registrerades rättigheter, datasäkerhet, tillsyn av behandlingen av personuppgifter samt om påföljderna för lagstridig behandling av personuppgifter. Det nationella handlingsutrymmet i dataskyddsförordningen har utövats bland annat i lagen om behandling av personuppgifter i migrationsförvaltningen, i vilken man enligt förvaltningsutskottets syn på lämpligt sätt beaktat de krav som följer av EU-rätten.\u003Cspan class=\"AlaviiteTeksti\"> FvUB 10/2020 rd, s. 3–5. \u003C/span>&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt artikel 4 i den allmänna dataskyddsförordningen avses med personuppgifter varje upplysning som avser en identifierad eller direkt eller indirekt identifierbar fysisk person. Även Europeiska människorättsdomstolen och EU-domstolen har i sin rättspraxis om artikel 8 i Europakonventionen och artiklarna 7 och 8 i Europeiska unionens stadga om de grundläggande rättigheterna ansett att respekt för privatlivet i behandlingen av personuppgifter gäller alla former av uppgifter om en identifierad eller identifierbar fysisk person. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt artikel 4 i den allmänna dataskyddsförordningen avses med behandling av personuppgifter alla åtgärder beträffande personuppgifter, oberoende av om de utförs automatiserat eller ej. Med register avses varje strukturerad samling av personuppgifter utifrån vilket uppgifter är tillgängliga utifrån vissa grunder. Med personuppgiftsansvarig avses en fysisk eller juridisk person, offentlig myndighet, institution eller ett annat organ som ensamt eller tillsammans med andra bestämmer ändamålen och medlen för behandlingen av personuppgifter. Med personuppgiftsbiträde avses å sin sida bland annat en juridisk person, en myndighet, ett ämbetsverk eller ett annat organ som behandlar personuppgifter för en personuppgiftsansvarigs räkning. Enligt artikel 5 omfattar principerna för behandling av personuppgifter bland annat ändamålsbegränsning, uppgiftsminimering, korrekthet, lagringsminimering samt integritet och konfidentialitet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt artikel 6 i den allmänna dataskyddsförordningen är behandling av personuppgifter laglig endast under vissa förutsättningar. Led c i punkt 1 i artikeln gäller en sådan situation där behandlingen behövs för att fullgöra en rättslig förpliktelse som åvilar den personuppgiftsansvarige. Led e i stycket gäller å sin sidan en situation där behandling är nödvändig för att utföra en uppgift av allmänt intresse eller som ett led i den personuppgiftsansvariges myndighetsutövning. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I artikel 9 i den allmänna dataskyddsförordningen finns det bestämmelser om behandling av särskilda kategorier av personuppgifter. Sådana är till exempel uppgifter om hälsan. Det är tillåtet att behandla sådana personuppgifter endast i vissa situationer, varav en del förutsätter även nationell lagstiftning. Enligt led g i punkt 2 i artikeln behövs preciserande reglering då behandlingen är nödvändig av hänsyn till ett viktigt allmänt intresse, på grundval av unionsrätten eller medlemsstaternas nationella rätt. Reglering som möjliggör behandling ska stå i proportion till det eftersträvade syftet och vara förenligt med det väsentliga innehållet i rätten till dataskydd. I detta sammanhang ska bestämmelser även utfärdas om åtgärder för att säkerställa den registrerades grundläggande rättigheter och intressen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt samhällskunskapsvillkor för att förvärva medborgarskap. För att medborgarskap ska kunna beviljas på ansökan, ska sökanden framöver påvisa att detta villkor är uppfyllt antingen genom att avlägga det föreslagna nya medborgarskapsprovet eller alternativt genom att avlägga student- eller högskoleexamen. Det handlar om ett villkor för naturalisation som kompletterar de villkor som redan föreskrivs i den gällande medborgarskapslagen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det finns kompletterande reglering om behandling av personuppgifter i anknytning till ärenden som gäller förvärv av medborgarskap i lagen om behandling av personuppgifter i migrationsförvaltningen. I enlighet med 1 § 1 mom. i lagen tillämpas lagen på helt eller delvis automatiserad behandling av personuppgifter och på annan behandling av personuppgifter, om personuppgifterna utgör eller är avsedda att utgöra ett personregister eller en del av ett sådant, och personuppgifterna behandlas bland annat för syften som gäller finskt medborgarskap enligt 2 punkten. Dessa omfattar bland annat behandling av ärenden som gäller förvärv av finskt medborgarskap och beslutfattande i sådana ärenden. I behandlingen av personuppgifter tillämpas således lagen om behandling av personuppgifter i migrationsförvaltningen på behandlingen av medborgarskapsansökningar, vilken i och med de föreslagna ändringarna framöver även innehåller en bedömning av om samhällskunskapsvillkoret är uppfyllt och utnyttjande av uppgifter om avläggandet av medborgarskapsprovet i behandlingen av medborgarskapsansökningar. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utöver det ovan nämnda nya villkoret för naturalisation föreslås i denna proposition att medborgarskapslagen innehåller bestämmelser om ett nytt medborgarskapsprov och om uppgifter för de myndigheter och övriga aktörer som hänför sig till systemet med medborgarskapsprov. Det föreslås att den allmänna förvaltningen av systemet med medborgarskapsprov föreskrivs som en uppgift för Migrationsverket. Migrationsverket ansvarar för informationssystemhelheten för medborgarskapsprovet och informationen samt för den allmänna tillsynen över och utvecklingen av provsystemet. Verket kommer överens om utarbetande av medborgarskapsprovet och anordnande av provtillfällen med aktörer som uppfyller villkoren. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I samband med det föreslagna medborgarskapsprovet finns det ett behov av att behandla personuppgifter så att en person som deltar i ett prov kan dra nytta av sin provprestation för att påvisa att han eller hon uppfyller det nya samhällskunskapsvillkoret för naturalisation. Syftet är att medborgarskapsprovet avläggs före ansökan om medborgarskap, om inte sökanden redan avlagt studentexamen eller högskoleexamen, med vilken det även är möjligt att påvisa att villkoret är uppfyllt. De personuppgifter som samlas in om deltagarna i ett medborgarskapsprov utgör ett register eller en del av ett register. Personuppgifter samlas in endast för avläggandet av medborgarskapsprovet. I behandlingen av personuppgifter tillämpas principerna enligt artikel 5 i dataskyddsförordningen, inklusive principen om ändamålsbegränsning och uppgiftsminimering. Migrationsverket har en behandlingsgrund enligt artikel 6.1 c i dataskyddsförordningen att behandla personuppgifter. För dem som anordnar provtillfällen är det å sin sida behövligt att behandla personuppgifter för att fullgöra en uppgift av allmänt intresse och behandlingen baserar sig på artikel 6.1 e.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget kompletteras regleringen i lagen om behandling av personuppgifter i migrationsförvaltningen på så sätt att man till 1 § 1 mom. 2 punkten i lagen fogar ett omnämnande om Migrationsverkets uppgifter i anknytning till medborgarskapsprovet, vilka omfattar behandling av personuppgifter. Utifrån 3 § 2 mom. 1 punkten får Migrationsverket behandla de uppgifter som det lagrat för att fullgöra sina lagstadgade uppgifter. Detta gäller även för personuppgifter i anknytning till medborgarskapsprovet. Utifrån 3 § 3 mom. är Migrationsverket personuppgiftsansvarig för ärendehanteringssystemet för utlänningsärenden i fråga om de uppgifter som det lagrat. Verket fungerar även som personuppgiftsansvarig i samband med medborgarskapsprovet. Enligt 3 § 4 mom. ansvarar Migrationsverket därtill för administreringen av ärendehanteringssystemet för utlänningsärenden i enlighet med lagen om informationshantering inom den offentliga förvaltningen. Migrationsverket ansvarar även för ärendehanteringssystemet för utlänningsärenden i fråga om samhällskunskapsvillkoret och medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utifrån 7 § 1 mom. i lagen om behandling av personuppgifter i migrationsförvaltningen får Migrationsverket behandla bland annat uppgifter som identifierar en person och uppgifter som beskriver kunnandet. Migrationsverket behandlar personuppgifter om deltagare i medborgarskapsprovet då det administrerar anmälningssystemet för provet, betalningsrörelsen och registreringen av provprestationer samt då det beslutar om eventuella påföljder som ska utfärdas på grund av brott mot ordningen eller svikligt förfarande. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utifrån 8 § får Migrationsverket behandla uppgifter som hör till de särskilda kategorierna av personuppgifter endast om behandlingen är nödvändig för användningsändamålet. En person som anmäler sig till medborgarskapsprovet kan till Migrationsverket framföra en begäran om specialarrangemang för att avlägga provet. Specialarrangemang kan bli aktuella på grund av sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårigheter eller någon annan därmed jämställbar orsak hos en person som deltar i ett prov. Migrationsverket fattar beslut om beviljande av specialarrangemang. Eftersom Migrationsverkets uppgifter även omfattar beslut om de specialarrangemang som behövs för provtillfällen, är det nödvändigt för verket att behandla uppgifter som hör till de särskilda kategorierna av personuppgifter i enlighet med 8 § i lagen om behandlingen av personuppgifter i migrationsförvaltningen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det finns bestämmelser om radering av uppgifter i 15 § i lagen om behandling av personuppgifter i migrationsförvaltningen. Bland annat sådana personuppgifter som kundnummer, namn, födelsetid, personbeteckning och medborgarskap raderas tio år efter att personen har avlidit eller fått finskt medborgarskap eller uppgifterna om ärenden i anknytning till personen har raderats (1 punkten). Andra personuppgifter än de som avses i 1 punkten och uppgifter om ärenden som anknyter till en person ska raderas senast fem år efter att uppehållsrätten upphörde eller den sista uppgiften antecknades i det sista anhängiga ärendet (2 punkten). Detta gäller även uppgifter om avläggande av medborgarskapsprovet. Uppgifter om medborgarskapsprovet för en person som avlagt medborgarskapsprovet med godkänt resultat och sedermera även fått medborgarskap på ansökan raderas således fem år efter att medborgarskapet förvärvats. Personuppgifter som hör till särskilda kategorier av personuppgifter ska å sin sida raderas genast när de inte längre behövs (3 punkten). Uppgifter om specialarrangemang i medborgarskapsprovet raderas således direkt då de inte längre är behövliga efter att provet avlagts. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I samband med medborgarskapsprovet fungerar Migrationsverket som personuppgiftsansvarig. De som anordnar provtillfällen har å sin sida en roll som personuppgiftsbiträden. Dessa aktörer som ingått ett avtal med Migrationsverket behandlar personuppgifter i samband med anmälningen till medborgarskapsprovet och tillsynen över provtillfällen. Enligt förslaget innehåller 25 e § 2 mom. i medborgarskapslagen bestämmelser om rätten att få uppgifter för dem som anordnar provtillfällen.\u003Cspan class=\"AlaviiteTeksti\"> Bestämmelserna inkluderas inte i lagen om behandling av personuppgifter i migrationsförvaltningen, eftersom de som anordnar provtillfällen inte är migrationsförvaltningsmyndigheter. \u003C/span> De som anordnar provtillfällen har rätt att avgiftsfritt och trots sekretessbestämmelserna få uppgifter som är nödvändiga för att anordna provtillfällen från Migrationsverket. De som anordnar provtillfällen behöver uppgifter om personer som anmält sig till ett prov så att de kan styrka identiteten på provdeltagarna. Uppgifterna om dem som anmält sig till ett provtillfälle är nödvändiga för att anordna provtillfället. Den som anordnar ett provtillfälle har rätt att få dessa uppgifter från det informationssystem som Migrationsverket administrerar. Å andra sidan tillämpas de sekretessplikter som föreskrivs i lagen om offentlighet i myndigheternas verksamhet på dem som fungerar som anordnare av provtillfällen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I samband med förberedelserna för provtillfällen är det i vissa situationer nödvändigt att behandla även uppgifter som hör till de särskilda kategorierna av personuppgifter, såsom uppgifter om en sådan funktionsnedsättning hos en deltagare i provet vilken innebär att han eller hon behöver specialarrangemang vid provtillfället för att kunna avlägga provet. Specialarrangemang kan bli aktuella på grund av sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårigheter eller någon annan därmed jämställbar orsak hos en person som deltar i ett prov. De som anordnar provtillfällen sörjer för genomförandet av specialarrangemang som beviljats av Migrationsverket. Det är därför nödvändigt för den som anordnar ett provtillfälle att få uppgifter även om sådana omständigheter som gäller till exempel hälsotillstånd och funktionsnedsättning, utifrån vilka en person som deltar i ett provtillfälle behöver specialarrangemang. Till denna del omfattar den föreslagna rätten att få uppgifter för den som anordnar ett provtillfälle uppgifter som hör till de särskilda kategorierna av personuppgifter, vilka är nödvändiga för att genomföra specialarrangemang.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Således förutsätter de uppgifter som anknyter till medborgarskapsprovet att såväl Migrationsverket som de som anordnar provtillfällen i vissa situationer behandlar även uppgifter som hör till särskilda kategorier av personuppgifter. Det är nödvändigt att behandla dessa uppgifter för specialarrangemangen för att avlägga medborgarskapsprovet och de skäliga anpassningar som behövs för personer som deltar i medborgarskapsprovet. Till denna del handlar det om en fas som föregår medborgarskapsansökan. Därtill behandlas uppgifter som hör till de särskilda kategorierna av personuppgifter i bedömningen av om den som gjort en medborgarskapsansökan hade grunder för avvikelse från det nya samhällskunskapsvillkoret. Det är nödvändigt att behandla uppgifter som hör till särskilda kategorier av personuppgifter i samband med en medborgarskapsansökan då en person som ansöker om medborgarskap framför en begäran om avvikelse från det nya samhällskunskapsvillkoret utifrån sitt hälsotillstånd eller en funktionsnedsättning. Till den del handlar det om likadan prövning om avvikelse i anknytning till behandlingen av en medborgarskapsansökan som till exempel i samband med det nuvarande språkkunskapsvillkoret. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Syftet med behandling av uppgifter som hör till de särskilda kategorierna av personuppgifter är att trygga skäliga möjligheter för utlänningar som bor i Finland att såväl delta i medborgarskapsprovet som att få medborgarskap. Således är behandlingen av uppgifter som hör till de särskilda kategorierna av personuppgifter proportionerlig sett till det eftersträvade målet på det sätt som förutsätts i artikel 9 i dataskyddsförordningen. Regleringshelheten omfattar även flera sådana skyddsåtgärder som förutsätts i artikel 9. Dessa omfattar bland annat bestämmelser om begränsning till vad som är nödvändigt, radering av uppgifter som blivit onödiga och sekretessplikter i anknytning till uppgifterna. De skyddsåtgärder som föreskrivs i 6 § 2 mom. i dataskyddslagen är likaså en del av helheten, inbegripet att sörja för personalens kunnande och genomföra olika tillsynsmetoder samt att garantera systemens tekniska funktion. I egenskap av myndighet beslutar Migrationsverket om beviljande av de specialarrangemang som behövs för provet. Genomförandet av specialarrangemang innehåller anordnande av provtillfällen, vilket är en offentlig förvaltningsuppgift som kan anförtros endast aktörer som uppfyller de föreslagna förutsättningarna. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sammanfattningsvis kan det konstateras att man i det system med medborgarskapsprov som föreslås i denna proposition beaktar de krav som följer av det skydd för personuppgifter som ingår i skyddet för privatlivet. Skyddet för personuppgifter tillgodoses genom de ändringar som enligt förslaget görs såväl i lagen om behandling av personuppgifter i migrationsförvaltningen som i medborgarskapslagen. Lagen om behandling av personuppgifter i migrationsförvaltningen kompletteras på så sätt att dess reglering täcker även Migrationsverkets uppgifter i anknytning till det föreslagna medborgarskapsprovet. Till medborgarskapslagen fogas å sin sida bestämmelser om rätten att få uppgifter för dem som anordnar provtillfällen och om tystnadsplikten. Sådana känsliga personuppgifter såsom uppgifter om en persons hälsotillstånd eller funktionsnedsättning får behandlas endast då det är nödvändigt för att sköta de lagstadgade uppgifter som anknyter till medborgarskapsprovet. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Bestämmelserna om rättsskyddet i grundlagen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Enligt 21 § i grundlagen har var och en rätt att på behörigt sätt och utan ogrundat dröjsmål få sin sak behandlad av en domstol eller någon annan myndighet som är behörig enligt lag samt att få ett beslut som gäller hans eller hennes rättigheter och skyldigheter behandlat vid domstol eller något annat oavhängigt rättskipningsorgan. Handläggningens offentlighet, rätten att bli hörd, rätten att få ett motiverat beslut, rätten att söka ändring och likaså de andra garantierna för en rättvis rättegång och god förvaltning tryggas genom lag. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt grundlagsutskottet är rättelseförfarandet ett sådant rättssäkerhetsmedel som är av konstitutionell betydelse i och med att det ger garantier för god förvaltning i enlighet med 21 § 2 mom. grundlagen och därför ska dess grunder föreskrivas genom lag (GrUU 43/2000 rd, s. 2). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Genom att överklaga är det möjligt att utifrån 6 § 1 mom. i lagen om rättegång i förvaltningsärendet söka ändring i ett beslut med vilket en myndighet avgjort ett förvaltningsärende eller avvisat det. Vid bedömningen av om ett förvaltningsbeslut är överklagbart eller inte ska i synnerhet beaktas huruvida beslutet innehåller ett avgörande som direkt påverkar någons rätt, skyldighet eller juridiskt definierad fördel (RP 29/2018 rd, s. 74).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Avläggande av medborgarskapsprovet handlar om en fas som föregår medborgarskapsansökan. Ett prov som avlagts med godkänd eller underkänd prestation har inte någon direkt konsekvens för någon persons rätt, skyldighet eller rättsligt fastställda intresse. Ett beslut om en provprestation bildar således inte ett sådant förvaltningsbeslut som det är möjligt att söka ändring i genom att överklaga. Enligt förslaget är det dock möjligt att söka ändring i det genom en begäran om omprövning. Sökandet av ändring avseende medborgarskapsprovet ordnas till denna del på samma sätt som i fråga om de allmänna språkexamina, som ett stort antal personer som ansökt om medborgarskap likaså avlagt innan medborgarnskapsansökan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I enlighet med ordalydelsen i 13 § 1 mom. i medborgarskapslagen är utgångspunkten att villkoren för naturalisation ska vara uppfyllda då en ansökan avgörs. Detta innebär att medborskapsprovet ska avläggas före medborgarskapsansökan på samma sätt som i fråga om den allmänna språkexamen, som är ett av sätten att påvisa att språkkunskapsvillkoret är uppfyllt. I praktiken ska sökande avlägga medborgarskapsprovet innan medborgarskapsansökan görs, för att det genom prestationen i medborgarskapsprovet ska vara möjligt att påvisa att samhällskunskapsvillkoret är uppfyllt. På samma sätt som i fråga om den allmänna språkexamen är det möjligt att avlägga medborgarskapsprovet redan innan övriga villkor för naturalisation, såsom boendetiden, är uppfyllda.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Så som redan konstaterats, ska sökande i praktiken avlägga språkexamen innan medborgarskapsansökan lämnas in, om sökande avser påvisa att språkkunskapsvillkoret är uppfyllt genom den allmänna språkexamen. Således jämställs avläggandet av medborgarskapsprovet med det nuvarande språkprovet på så sätt att det på samma sätt som i fråga om språkprovet handlar om en fas som föregår medborgarskapsansökan. Granskningen av prestationen i medborgarskapsprovet påminner till denna del om hur ett intyg som getts om den allmänna språkexamen granskas för närvarande i samband med en medborgarskapsansökan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Prestationen i den allmänna språkexamen bedöms inte i ett beslut som gäller en medborgarskapsansökan och inte heller i ändringssökande som gäller ett medborgarskapsbeslut. Avgörandet av en medborgarskapsansökan omfattar att konstatera om den som ansöker om medborgarskap uppfyller de villkor för naturalisation som avses i 13 § 1 mom. i medborgarskapslagen. Det är möjligt att påvisa att språkkunskapsvillkoret är uppfyllt på något av de sätt som avses i 17 § i medborgarskapslagen, såsom genom prestationen i den allmänna språkexamen. Om sökanden inte kan påvisa att villkoren är uppfyllda på något av de sätt som nämns i medborgarskapslagen, övergår man i behandlingen av medborgarskapsansökan till att granska om det i personens fall finns grunder för att avvika från villkoret. I samband med sökande av ändring i en medborgarskapsansökan eller i ett beslut om den är det inte möjligt att överklaga bedömningen av prestationen i den allmänna språkexamen eller ett underkännande av den. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sett till det som nämnts ovan bedöms inte prestationen i medborgarskapsprovet i ett beslut som gäller en medborgarskapsansökan och inte heller i ändringssökande som gäller ett medborgarskapsbeslut. Med tanke på det nya samhällskunskapsvillkoret utgörs det avgörande av informationen om huruvida sökande avlagt något av de prov eller examina som nämns i lagen, med vilka det är möjligt att påvisa att villkoret är uppfyllt, eller om det i ärendet finns skäl att bedöma grunderna för avvikelse från samhällskunskapsvillkoret. Det är möjligt att överklaga ett negativt beslut om en medborgarskapsansökan till förvaltningsdomstolen. Vid sökande av ändring i ett negativt beslut om en medborgarskapsansökan är det däremot inte möjligt att överklaga en underkänd prestation i medborgarskapsprovet. Således är det vid sökande av ändring i ett beslut om en medborgarskapsansökan inte möjligt att överklaga slutresultatet av bägge faser före medborgarskapsansökan, det vill säga en underkänd prestation i den allmänna språkexamen eller medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Den som deltagit i den allmänna språkexamen kan söka ändring i ett beslut som gäller bedömningen av prestationen i enlighet med 13 § i lagen om allmänna språkexamina. Motsvarande bestämmelser om sökande av ändring i medborgarskapsprovet utfärdas i medborgarskapslagen. I den allmänna språkexamen kan bedömarens arbete bidra till att påverka slutresultatet, medan medborgarskapsprovet är ett flervalsprov som granskas elektroniskt. Denna skillnad mellan den allmänna språkexamen och medborgarskapsprovet kan i viss mån påverka behovet av att söka ändring i anknytning till medborgarskapsprovet på så sätt att behovet blir ännu mindre än i den allmänna språkexamen, där bedömningen av prestationen kan ändras utifrån en ny bedömning. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 13 § 3 mom. i lagen om allmänna språkexamina får omprövning i fråga om ett beslut som gäller bedömningen av prestationen i examen eller i ett delprov i examen begäras hos kommissionen för allmänna språkexamina. Begäran om omprövning ska lämnas till kommissionen inom 14 dagar från det att den som avlagt examen eller ett delprov i examen har haft möjlighet att få kännedom om bedömningsresultaten och tillämpningen av bedömningsgrunderna i sitt eget fall. På förfarandet vid begäran om omprövning tillämpas i övrigt förvaltningslagen. Ett beslut om bedömningen av prestationen vilket fattats med anledning av en begäran om omprövning får inte överklagas genom besvär. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det är möjligt att framföra en begäran om omprövning av resultatet i medborgarskapsprovet till Migrationsverket, som i egenskap av myndighet med ansvar för den allmänna förvaltningen av medborgarskapsprovet behandlar begäranden om omprövning på centraliserat sätt. I enlighet med vad som beskrivs nedan kan Migrationsverket begära ett utlåtande av den sakkunnigkommission som avses i 25 f § i fråga om en begäran om omprövning som gäller utrymme för tolkning i innehållet i provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Förfarandet med begäran om omprövning behövs framför allt för att utreda om till exempel någon teknisk störningssituation utgjort ett hinder för att avlägga provet med godkänt resultat. Medborgarskapsprovet avläggs enligt förslaget som ett flervalsprov som baserar sig på ett läromedel, i vilket deltagaren väljer rätt svar på frågorna utifrån svarsalternativen. Det förutsätts att den som utarbetar medborgarskapsprovet har tillräcklig sakkunskap för att utarbeta läromedlet, frågorna och svarsalternativen för medborgarskapsprovet. I utarbetandet av svarsalternativen ska uppmärksamhet riktas på att valet av rätt svar är tillräckligt entydigt. Avläggande av det föreslagna medborgarskapsprovet med godkänt resultat förutsätter att den som deltar i provet väljer ett tillräckligt antal rätt svar på provfrågorna. Således är sättet att genomföra provet relativt enkelt och granskningen av provresultaten genomförs elektroniskt på samma sätt som till exempel i det teoriprov som hör till den förarexamen som ska avläggas för att få körkort. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Avläggandet av medborgarskapsprovet är inte förknippat med till exempel produktion av svar på egen hand eller att en person som fungerar som bedömare bedömer prestationen utifrån kriterier som är avsedda för detta ändamål. Således är ett godkänt resultat i medborgarskapsprovet inte förknippat med sådant utrymme för tolkning som till exempel i de delprov som gäller tal och skrift i den allmänna språkexamen, där en person som fungerar som bedömare bedömer provprestationen utifrån de bedömningskriterier som är avsedda för detta ändamål. Utifrån detta blir även behovet av rättsskydd för en person som deltagit i medborgarskapsprovet i viss mån mindre än för en person som avlagt den allmänna språkexamen. För medborgarskapsprovet behövs inte någon likadan granskningsbedömning som i den allmänna språkexamen. I förfarandet med begäran om omprövning för medborgarskapsprovet handlar det inte om att en annan bedömare gör en ny bedömning av prestationen av en provdeltagare utifrån bedömningskriterierna. Vid behandlingen av en begäran om omprövning som gäller ett medborgarskapsprov konstateras de rätt och fel valda svaren på frågorna och om antalet rätta svar är tillräckligt för en godkänd prestation i medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Trots ovan framlagda observationer kan det i vissa situationer uppkomma ett behov av en begäran om omprövning även på grund av att flervalsfrågorna är förknippade med utrymme för tolkning. På grund av sådana situationer ska man i den föreslagna regleringen beakta att Migrationsverket inte har den sakkunskap som behövs för att bedöma innehållet i frågorna och svarsalternativen. Avsikten är att ge en annan aktör än Migrationsverket till uppgift att utarbeta frågorna, svarsalternativen och läromedlet för medborgarskapsprovet uttryckligen därför att en sådan uppgift avviker från verkets nuvarande uppgifter och förutsätter sådan sakkunskap som i högre grad innehas av till exempel ett universitet. Med tanke på en sådan situation behövs därför ett förfarande med vilket man säkerställer tillräcklig sakkunskap för bedömningen av flervalsfrågorna och svarsalternativen och utrymmet för tolkning i dessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För bedömningen av utrymmet för tolkning i provfrågorna föreslås ett förfarande där Migrationsverket begär ett utlåtande om en begäran om omprövning från sakkunnigkommissionen. I ett sådant fall framskrider behandlingen av en begäran om omprövning enligt följande. Provdeltagaren kan framföra en begäran om omprövning av provresultatet till Migrationsverket utifrån den grunden att han eller hon gett fel svar på grund av att en flervalsfråga lämnat utrymme för tolkning, varvid deltagaren i motiveringarna till sin begäran om omprövning ska specificera vilken ämnesfråga som enligt honom eller henne lämnar utrymme för tolkning och varför. Om begäran om omprövning gäller ett sådant ärende som gäller innehållet i medborgarskapsprovet, begär verket ett utlåtande av sakkunnigkommissionen i fråga om tolkningsutrymmet i den fråga till vilken det hänvisats och om de grunder som anförts i begäran om omprövning. På så sätt säkerställs den behövliga sakkunskapen till stöd för behandlingen av en begäran om omprövning som gäller innehållet. Medlemmarna i sakkunnigkommissionen framför sin syn om utrymmet för tolkning i flervalsfrågan med tanke på utlåtandet. Frågans och svarsalternativens ändamålsenlighet bedöms även i ljuset av de uppgifter som framgår av läromedlet för medborgarskapsprovet. Om en flervalsfråga som specificerats i en begäran om omprövning enligt kommissionens sakkunnigutlåtande ska anses lämna utrymme för tolkning, rättar Migrationsverket beslutet om provresultatet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För att en deltagare i medborgarskapsprovet ska kunna framföra en begäran om omprövning av ett beslut om ett provresultat på grundval av tolkningsutrymme i vissa frågor i flervalsprovet, behöver han eller hon tillräckligt precis information om sin provprestation. Deltagaren ska få information om antalet rätt och fel svar och därtill även om hur de fördelat sig enligt frågornas ämnen. För att kunna göra och motivera en begäran om omprövning behöver en provdeltagare information i synnerhet om på vilka ämnesfrågor han eller hon valt fel svar. På så sätt kan den som avlagt provet överväga om bakgrunden till valet av fel svar utgjorts av att frågorna och svarsalternativen varit otydligt formulerade. Själva frågorna och svarsalternativen i provet ställs dock inte till provdeltagarens förfogande. Ett sådant förfarande är även enhetligt med de allmänna språkexamina och det teoriprov som ingår i förarexamen och dess syfte är att trygga att provet är tillförlitligt och även att provdeltagarna behandlas jämlikt, då man strävar efter att förhindra att provfrågorna sprids utanför provtillfällena. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Så som konstaterats ovan handlar en underkänd provprestation inte om ett överklagbart beslut, men i samband med medborgarskapsprovet används förfarandet med begäran om omprövning. Möjligheten att begära omprövning av ett provresultat utifrån informationen om provsvarens fördelning enligt område innebär ett särskilt rättsskyddsmedel för sådana personer som senare vill ansöka om medborgarskap. Även om väldigt detaljerade uppgifter inte är tillgängliga om provprestationen, är det dock utifrån fördelningen av rätt och fel svar enligt område möjligt att bedöma om flervalsprovet är behörigt. Det är möjligt att dra nytta av informationen även då man förbereder sig på ett nytt prov. Såväl information om provprestationen som det befintliga förfarandet med begäran om omprövning har en konsekvens som förbättrar ställningen för den som avlägger provet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt 24 § 1 mom. 22 punkten i offentlighetslagen omfattar de sekretessbelagda myndighetshandlingarna handlingar som innehåller uppgifter om inträdesprov eller andra prov eller test, om utlämnandet av uppgifter ur dem skulle äventyra provens eller testens syfte eller en användning av testen i framtiden. Utlämnande av exakta uppgifter om flervalsfrågorna i medborgarskapsprovet skulle äventyra fullgörandet av syftet med provet och användningen av det i framtiden. Genom sekretessbeläggningen av provfrågorna tryggas ett synnerligen viktigt allmänt intresse, varför den som deltagit i ett prov inte ens själv får exakta uppgifter om sin egen provprestation. Begränsningen av rätten till information för en part är förenlig med 11 § 2 mom. 1 punkten i offentlighetslagen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det föreslås även att bestämmelser om avgiftsbeläggningen för en begäran om omprövning och återbetalning av behandlingsavgiften fogas till medborgarskapslagen. Biträdande justitiekanslern har i ett beslut (OKV/430/70/2024) behandlat avgiftsbeläggningen av en begäran om omprövning hos olika myndigheter. I beslutet konstateras bland annat att alla ärenden där avgiftsbeläggningen av behandling av en begäran om omprövning hade reglerats dock inte omfattades av föreskrifter om återbetalning av avgiften i en situation där en begäran om omprövning leder till ett positivt slutresultat för den som framfört begäran. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I ett betänkande (FvUB 26/2018 rd, s. 2) har förvaltningsutskottet i fråga om behandlingsavgiften för omprövningsbegäranden som gäller ansökan om visering konstaterat att man genom den strävar efter att säkerställa effektiv och snabb rättsvård och att dämpa antalet uppenbart ogrundade omprövningsbegäranden. Utskottet har dock betonat att avgiften inte oskäligt får höja tröskeln för att begära omprövning så att den de facto försvagar rättssäkerheten. I detta hänseende har utskottet ansett att det är relevant att avgiften återbetalas till den viseringspliktige i det fall att omprövningsbegäran leder till ett resultat som är till dennes fördel.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I de föreslagna bestämmelserna om avgiftsbeläggningen för en begäran om omprövning beaktas ovan nämnda omständigheter som gäller återbetalning av avgiften. Om provresultatet i förfarandet med begäran om omprövning ändras på så sätt att antalet rätta svar räcker för en godkänd prestation, återbetalas behandlingsavgiften för begäran om omprövning till den som framfört begäran om omprövning. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget är det inte möjligt att söka ändring i Migrationsverkets beslut om en begäran om omprövning genom att överklaga till förvaltningsdomstolen. Således omfattar sökandet av ändring i medborgarskapsprovet ett liknande besvärsförbud som i ändringssökande som gäller den allmänna språkexamen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Grundlagsutskottet har i sin utlåtandepraxis bedömt förbud mot att söka ändring i olika ärenden (bland annat GrUU 15/2009 rd, GrUU 2/2009 rd). Det har tagit ställning till exempel till förbudet att söka ändring i bedömningen av en provprestation i studentexamen och ansett att rättssäkerhetsmekanismen inte är problematisk med tanke på bestämmelsen i 21 § i grundlagen (GrUU 18/2005 rd, s. 2). Med tanke på rättsskyddet har utskottet ansett att det är viktigt att det är möjligt att anhålla om en kontrollbedömning av ett beslut om bedömningen av en provprestation i studentexamen. Likaså har det bland annat varit av betydelse att ett omprov är möjlig vid en underkänd provprestation. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Även universitetslagen innehåller bestämmelser om förfarandet för begäran om omprövning och besvärsförbudet i anknytning till examensprestationer. Det finns bestämmelser om besvärsförbudet i 84 § 2 mom. i universitetslagen, enligt vilket ett beslut inte får överklagas genom besvär, om det gäller bedömning av studieprestation eller tillgodoräknande. I sitt utlåtande om reformen av universitetslagstiftningen (RP 7/2009 rd) tog grundlagsutskottet ställning även till besvärsförbuden (GrUU 11/2009 rd, s. 8). Utskottet hade inte något att anmärka om de besvärsförbud som föreslogs i propositionen med tanke på 21 § i grundlagen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Så som konstaterats ovan har avläggande av prov med en godkänd eller underkänd prestation inte någon direkt konsekvens för en persons rätt, skyldighet eller rättsligt fastställda intresse och ett beslut om en provprestation bildar således inte något sådant förvaltningsbeslut i vilket det är möjligt att söka ändring genom att överklaga. Inte heller ett beslut av Migrationsverket om rättelse av resultatet av medborgarskapsprovet hänför sig direkt till rättigheterna eller skyldigheterna för en provdeltagare. Medborgarskapsprovet är av betydelse för förvärvet av medborgarskap på så sätt att det genom ett godkänt provresultat är möjligt att påvisa att det nya villkor som föreslås för naturalisation är uppfyllt på samma sätt som det genom prestationen i den allmänna språkexamen är möjligt att påvisa att det gällande språkkunskapsvillkoret är uppfyllt. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ett beslut om en underkänd prestation i medborgarskapsprovet förblir inte slutligt när det gäller konsekvenserna, utan den som deltagit i ett prov kan såväl framföra en begäran om omprövning av ett beslut som gäller en underkänd provprestation som anmäla sig och på nytt delta i medborgarskapsprovet. I fråga om anordnandet av medborgarskapsprovet konstateras i propositionen att medborgarskapsprov ska anordnas tillräckligt ofta så att till exempel en person som inte avlagt provet med godkänd prestation inom en skälig tid kan delta i provet på nytt. En begäran om omprövning som gäller prestationen i ett medborgarskapsprov bedöms vid behov även av sakkunnigkommissionen som har flera medlemmar. Migrationsverket begär ett utlåtande avseende begäranden om omprövning som gäller innehållet i provet av sakkunnigkommissionen, i vilken de centrala aktörerna i systemet med medborgarskapsprov är representerade. Kommissionen har bred och omfattande sakkunskap för att bedöma eventuellt utrymme för tolkning i provfrågorna. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Besvärsförbudet är avgränsat till att gälla endast ett sådant beslut som gäller medborgarskapsprovet och som Migrationsverket gett beträffande en begäran om omprövning som gäller ett beslut som gäller en underkänd prestation i medborgarskapsprovet. I övrigt är det möjligt att överklaga Migrationsverkets beslut i anknytning till förslagen i denna proposition till förvaltningsdomstolen i enlighet med lagen om rättegång i förvaltningsärenden. Det är möjligt att söka ändring hos förvaltningsdomstolen till exempel i Migrationsverkets beslut om återbetalning av provavgifter och om de påföljder som utfärdats för svikligt förfarande. En förutsättning för att överklaga ett beslut av förvaltningsdomstolen är att högsta förvaltningsdomstolen beviljar besvärstillstånd. Besvärsförbudet enligt förslaget påverkar inte överhuvudtaget överklagan av beslut som fattats om medborgarskapsansökningar, utan även framöver finns det en möjlighet att överklaga negativa beslut om medborgarskapsansökningar till förvaltningsdomstolarna.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">En provavgift tas ut för avläggande av det medborgarskapsprov som föreslås i denna proposition. Enligt förslaget kan avgiften återbetalas till en person som anmält sig till ett prov, om han heller hon haft hinder att delta på grund av sjukdom och meddelat Migrationsverket om hindret före provtillfället. Ansökan om återbetalning av provavgiften görs hos Migrationsverket, som fattar beslut om eventuell återbetalning. Det är möjligt att överklaga ett beslut om återbetalning av Migrationsverket hos förvaltningsdomstolen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Migrationsverket fattar beslut även om eventuella påföljder, om en deltagare i ett prov gör sig skyldig till brott mot ordningen vid provtillfället eller förfar svikligt i det. I en sådan situation ansvarar Migrationsverket för att utreda situationen i efterskott och för att höra parten i enlighet med förvaltningslagen. Utifrån ett brott mot ordningen kan ett avlagt prov underkännas. Likaså är det möjligt att anse att en provprestation är underkänd på grund av svikligt förfarande, deltagande i sådant förfarande eller försök till det och därtill kan parten förlora sin rätt att delta i medborgarskapsprovet i sex eller 12 månader från provdagen. Det är möjligt att överklaga ett beslut om påföljder av Migrationsverket hos förvaltningsdomstolen. Enligt förslaget kan beslutet dock verkställas även om besvär har anförts, om inte besvärsmyndigheten förbjuder verkställigheten. Den föreslagna regleringen motsvarar vad som föreskrivs i 6 § i lagen om allmänna språkexamina. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ovan behandlas ändringssökande i anknytning till medborgarskapsprovet. Det föreslås inte att några ändringar görs i fråga om sökande av ändring i själva beslutet om en medborgarskapsansökan. Om sökanden i sin medborgarskapsansökan framför en begäran om undantag från det nya samhällskunskapsvillkoret genom att åberopa till exempel sitt hälsotillstånd och Migrationsverket bedömer att grunder för att avvika från villkoret inte föreligger, är det även framöver möjligt att söka ändring i det negativa beslutet av Migrationsverket genom att överklaga till förvaltningsdomstolen. Det är å sin sida möjligt att överklaga förvaltningsdomstolens beslut till högsta förvaltningsdomstolen, om högsta förvaltningsdomstolen beviljar besvärstillstånd. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tilldelande av en offentlig förvaltningsuppgift till någon annan än en myndighet\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Enligt 124 § i grundlagen kan offentliga förvaltningsuppgifter anförtros andra än myndigheter endast genom lag eller med stöd av lag, om det behövs för en ändamålsenlig skötsel av uppgifterna och det inte äventyrar de grundläggande fri- och rättigheterna, rättssäkerheten eller andra krav på god förvaltning. Det är dock möjligt att anförtro uppgifter som omfattar avsevärd utövning av allmän makt endast till en myndighet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt motiveringarna till paragrafen (RP 1/1998 rd, s. 178–180) är syftet med bestämmelsen att begränsa att offentliga förvaltningsuppgifter anförtros till parter utanför det egentliga myndighetsmaskineriet. En offentlig förvaltningsuppgift kan anförtros någon annan än en myndighet endast genom lag och med stöd av lag endast om de villkor som avses i bestämmelsen är uppfyllda. Med ordalydelsen i bestämmelsen hänvisar man till att skötseln av offentliga förvaltningsuppgifter i regel ska ankomma på myndigheter och att sådana uppgifter kan tilldelas andra än myndigheter endast i begränsad utsträckning. Begreppet offentliga förvaltningsuppgifter hänvisar till en relativt vidsträckt helhet av administrativa uppgifter. Det omfattar uppgifter som hänför sig till bland annat verkställigheten av lagar samt beslut om enskilda personers och sammanslutningars rättigheter, skyldigheter och förmåner. Paragrafen täcker överföring av såväl uppgifter som för närvarande hör till myndigheterna som tilldelande av nya uppgifter som jämställs med förvaltningsuppgifter till andra än myndigheter. Utgångspunkten är att offentliga förvaltningsuppgifter endast genom lag kan anförtros andra än myndigheter. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det ska vara behövligt att anförtro uppgiften med tanke på en ändamålsenlig skötsel av uppgiften. Enligt förarbetena till grundlagen (RP 1/1998, s. 179) ska vid bedömningen av ändamålsenligheten särskilt uppmärksammas dels förvaltningens effektivitet och övriga interna behov, dels enskilda personers och sammanslutningars behov. Dessutom ska hänsyn tas till förvaltningsuppgiftens särdrag. Kravet på ändamålsenlighet kan således när det är fråga om uppgifter i samband med serviceproduktion uppfyllas lättare än till exempel i fråga om beslutsfattande som gäller en enskild persons eller sammanslutnings centrala rättigheter. Kravet på ändamålsenlighet är ett rättsligt villkor och det bedöms från fall till fall om det är uppfyllt. Enligt grundlagsutskottet ska ändamålsenligheten bedömas från fall till fall varje gång då en offentlig förvaltningsuppgift föreslås bli anförtrodd någon utanför myndighetsorganisationen (GrUU 53/2010 rd, s. 2/II, GrUU 23/2013 rd, s. 3/I). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Om offentliga förvaltningsuppgifter anförtros andra än myndigheter ska det inte äventyra de grundläggande fri- och rättigheterna, rättssäkerheten eller andra krav på god förvaltning. Enligt förarbetena till grundlagen (RP 1/1998 rd, s. 179/II) understryker bestämmelsen betydelsen av att de som sköter offentliga förvaltningsuppgifter ska vara utbildade för ändamålet och sakkunniga samt att de ska stå under tillräcklig offentlig tillsyn. Kraven på rättsskydd och god förvaltning berör framför allt beslutsfattandet i anknytning till en offentlig förvaltningsuppgift. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt sista meningen i 124 § i grundlagen får uppgifter som innebär betydande utövning av offentlig makt ges endast myndigheter. Grundlagsutskottet (GrUU 14/2013, s. 2) har ansett att till exempel utfärdande av en administrativ påföljd omfattar utövning av betydande offentlig makt. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt villkor för att få medborgarskap. Det är möjligt att påvisa att villkoret är uppfyllt genom att avlägga det föreslagna nya medborgarskapsprovet. Medborgarskapsprovet har en offentlig karaktär, eftersom avläggandet av det hänför sig till förvärv av finskt medborgarskap och de anknutna rättigheterna och skyldigheterna. Således är uppgifterna i anknytning till genomförandet av medborgarskapsprovet offentliga och därför ska bestämmelserna i 124 § i grundlagen beaktas i regleringen. Enligt förslaget administrerar Migrationsverket systemet med medborgarskapsprov, som delvis genomförs genom köpta tjänster som verket upphandlar. Migrationsverket ingår avtal om såväl utarbetande av medborgarskapsprov som anordnande av provtillfällen. Den köpta tjänst som gäller utarbetande av medborgarskapsprovet innehåller ett brett urval av provfrågor med svarsalternativ och ett läromedel som lämpar sig för självstudier. De som anordnar provtillfällen ska å sin sida tillhandahålla utrymmen, yttre ramar och övervakning som lämpar sig för det elektroniska medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget hör den allmänna förvaltningen och övervakningen av systemet med medborgarskapsprov till Migrationsverket, det vill säga till en myndighet. Migrationsverkets uppgifter omfattar den allmänna kommunikationen om medborgarskapsprovet till deltagare i provet och handledning av dem som anordnar provtillfällen i fråga om granskningen av provdeltagarnas identitet. Begäranden om specialarrangemang som behövs för ett provtillfälle handläggs av Migrationsverket, som fattar beslut om beviljande av eventuella specialarrangemang. Om man vid ett provtillfälle observerar störande eller svikligt förfarande, sköter Migrationsverket utredningen av fallet och det anknutna hörandet och verket ansvarar även för att fatta beslut om eventuella påföljder. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget genomförs utarbetandet av själva medborgarskapsprovet och läromedlet för det och anordnandet av provtillfällen på så sätt att dessa enskilda uppgifter i anknytning till genomförandet av medborgarskapsprovet tilldelas andra aktörer än en myndighet och Migrationsverket i egenskap av myndighetsorganisation ingår avtal om upphandling av sådana tjänster med aktörer som uppfyller de föreslagna villkoren i lagen. Till denna del påminner genomförandet av medborgarskapsprovet genomförandet av den allmänna språkexamen, där den myndighet som administrerar examenssystemet likaså ingår avtal om såväl utarbetande av prov och anordnande av examenstillfällen. Lagen innehåller specificerade bestämmelser om att uppgifter som gäller utarbetande av medborgarskapsprovet och anordnande av provtillfällen anförtros någon annan än en myndighet. I lagen införs bestämmelser om villkoren för att utarbeta medborgarskapsprovet och anordna provtillfällen, liksom även om vilka uppgifter som krävs av de aktörer som sköter dessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det framtida medborgarskapsprovet utarbetas utifrån det läromedel som används vid samhällsorientering enligt lagen om främjande av integration. Bakgrunden till medborgarskapsprovet utgörs av det läromedel som är avsett för utbildarna i samhällsorientering, vilket administreras av UF-centret, det vill säga av en myndighet. Utifrån läromedlet för samhällsorientering redigerar den som utarbetar medborgarskapsprovet ett självstudiematerial för medborgarskapsprovet, vars språk motsvarar den nivå som krävs för finskt medborgarskap (B1 på nivåskalan i den europeiska referensramen för språk). Det läromedel för medborgarskapsprovet vilket redigeras utifrån läromedlet för samhällsorientering ingår i den köpta tjänst som Migrationsverket i egenskap av myndighet upphandlar från den som utarbetar medborgarskapsprovet. Medborgarskapsprovet genomförs som ett kunskapsbaserat prov, vars flervalsfrågor baserar sig på uppgifter i ett allmänt tillgängligt läromedel. I motsats till vad fallet är för den allmänna språkexamen, har den som utarbetar provet därför även till uppgift att utarbeta ett läromedel som lämpar sig för självstudier för att förbereda sig på provet. Det faktum att läromedlet för medborgarskapsprovet baserar sig på det redan existerande läromedlet för samhällsorientering bidrar för egen del till att begränsa uppgiften att utarbeta ett läromedel. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Så som konstaterats ovan ska man enligt förarbetena till grundlagen rikta särskild uppmärksamhet på behoven hos de enskilda personerna då ändamålsenligheten bedöms. Ur denna synvinkel är i synnerhet den sakkunskap som behövs för uppgifterna av betydelse, då det finns andra aktörer som har djupare kunskap än Migrationsverket för dessa uppgifter. Även kraven på neutralitet och objektivet talar för att uppgifterna i anknytning till provet tilldelas någon annan aktör än Migrationsverket, som är den myndighet som beslutar om beviljande av medborgarskap. Med tanke på kravet på ändamålsenlighet är det därtill relevant att de uppgifter som tilldelas andra aktörer handlar om tillhandahållande av tjänster, inte om beslutsfattande som gäller en individs eller sammanslutnings centrala rättigheter. Utarbetandet och anordnandet av medborgarskapsprovet genomförs som tjänster som upphandlas av Migrationsverket, det vill säga av en myndighet. Dessa uppgifter är inte förknippade med beslutsfattande som gäller en individs eller en sammanslutnings centrala rättigheter. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det är ändamålsenligt att ge en aktör med behövlig sakkunskap till uppgift att utarbeta frågorna och svarsalternativen samt läromedlet för medborgarskapsprovet. För att avläggandet av medborgarskapsprovet ska kunna övervakas behövs å sin sida utrymmen och yttre ramar som lämpar sig för provtillfällen samt den behövliga sakkunskapen och personalen för att anordna provtillfällen. Det är ändamålsenligt att ge aktörer som uppfyller dessa villkor till uppgift att anordna provtillfällen. De uppgifter som gäller utarbetande och anordnande av medborgarskapsprovet avviker i fråga om karaktär från Migrationsverkets övriga uppgifter. Därför föreslås att utarbetandet av medborgarskapsprovet och anordnandet av provtillfällen genomförs som tjänster som produceras av en annan aktör än en myndighet. Däremot delegeras inte rätt att fatta beslut om en individs rättigheter, utan Migrationsverket fattar i egenskap av myndighet beslut om beviljande av specialarrangemang som behövs i ett provtillfälle och påföljder som ska utfärdas vid svikligt förfarande som framkommit vid ett provtillfälle. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Genom att tilldela uppgiften att utarbeta och anordna medborgarskapsprovet till någon annan än en myndighet äventyras inte de grundläggande fri- och rättigheterna, rättsskyddet eller andra krav på god förvaltning. På det sätt som konstaterats ovan gäller kraven på rättssäkerhet och god förvaltning enligt förarbetena till grundlagen framför allt för beslutsfattandet i anknytning till en offentlig förvaltningsuppgift. En myndighet, det vill säga Migrationsverket, har till uppgift att fatta förvaltningsbeslut som gäller medborgarskapsprov. Andra än myndighetsaktörer fattar däremot inte beslut, utan de tillhandahåller tjänster som gäller utarbetande och anordnande av medborgarskapsprovet i form av köpta tjänster som upphandlas av en myndighet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lämpligheten och behörigheten för dem som sköter offentliga förvaltningsuppgifter regleras på samma sätt som i fråga om den allmänna språkexamen. Bestämmelserna om den sakkunskap som krävs av den som utarbetar och anordnar ett medborgarskapsprov samt om myndighetstillsynen av dessa aktörer är likadana som i lagen om allmänna språkexamina. Tillräcklig sakkunskap för utarbetande av språkexamina förutsätts av dem som utarbetar allmänna språkexamina (2 § i lagen om allmänna språkexamina). Utgångspunkten i regleringen är att en högskola är den aktör som utarbetar språkexamina. På samma förutsätts att den som utarbetar medborgarskapsprovet har tillräcklig sakkunskap för att utarbeta frågorna, svarsalternativen och läromedlet för medborgarskapsprovet. Utgångspunkten är att ett universitet utarbetar provet och dess läromedel. De som anordnar allmänna språkexamina ska å sin sida ha tillräcklig sakkunskap och förutsättningar för att anordna examina (4 § i lagen om allmänna språkexamina). Tillräcklig sakkunskap och förutsättningar att anordna provtillfällen förutsätts av dem som anordnar medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utbildningsstyrelsen ansvarar för myndighetstillsynen i fråga om den allmänna språkexamen, medan Migrationsverket på motsvarande sätt ansvarar för myndighetstillsynen i fråga om medborgarskapsprovet. I 2 § i lagen om allmänna språkexamina finns det bestämmelser om examensförvaltning. Enligt bestämmelsen svarar Utbildningsstyrelsen för systemet med allmänna språkexamina, systemets utveckling och tillsynen över det. Liknande allmänna bestämmelser om Migrationsverkets uppgifter i anknytning till medborgarskapsprovet fogas till 3 § i medborgarskapslagen. I bestämmelsen nämns förvaltning, utveckling och övervakning över medborgarskapsprovet samt ingående av avtal i anknytning till medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">De uppgifter som tilldelas den som utarbetar och anordnar ett medborgarskapsprov motsvarar i fråga om natur uppgifterna för den som utarbetar och anordnar allmänna språkexamina. Uppgifternas liknande karaktär är av betydelse även i bedömningen av ansvaret i anknytning till dessa. Grundlagsutskottet har i sina utlåtanden behandlat ansvarsbestämmelser i anknytning till olika uppgifter. Enligt grundlagsutskottets vedertagna praxis förutsätter säkerställandet av att kraven på rättskydd och god förvaltning tillgodoses bland annat att de personer som behandlar ärenden verkar under straffrättsligt tjänsteansvar (GrUU 17/2021 rd, s. 20, GrUU 26/2017 rd, s. 49). Bestämmelser om straffrättsligt ansvar har ansetts vara behövliga bland annat i samband med att bestämmelser utfärdades om kandidatuppställningen i fråga om domare med uppgiften som bisyssla vid försäkringsdomstolen (GrUU 53/2014 rd, s. 4–5) och om en observationsremiss som utarbetas av en annan läkare än en läkare i tjänsteförhållande, då den kan leda till vård oberoende av patientens vilja (GrUU 5/2014 rd, s. 2–4). Utskottet har ansett att en uppgift utgör utövning av offentligt makt och förutsatt fullt tjänsteansvar till exempel i en situation som handlade om att chefen för en frivillig sjöräddringsförening var ledare på en olycksplats (GrUU 24/2001 rd, s. 4).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I 7 § i lagen om allmänna språkexamina finns det bestämmelser om det straffrättsliga tjänsteansvaret för en bedömare av den allmänna språkexamen. Däremot finns det inte sådana bestämmelser om ansvaret för den som utarbetar och anordnar den allmänna språkexamen. Enligt förslaget genomförs medborgarskapsprovet som ett flervalsprov, varvid ingen uppgift som särskild bedömare behövs, utan granskningen av provprestationen genomförs elektroniskt. Enligt 3 mom. som enligt förslaget fogas till 3 § ansvarar Migrationsverket bland annat för informationssystemhelheten för medborgarskapsprovet, inklusive den tekniska funktionen för den elektroniska granskningen av provprestationer. Den som utarbetar provet ansvarar å sin sida för att provfrågorna och svarsalternativen är tydliga och att de rätta svaren är entydiga. Den som anordnar ett prov sköter övervakningen av provtillfällen och genomförandet av specialarrangemang. Även då medborgarskapsprovet avläggs med specialarrangemang är det ett flervalsprov, som kräver att ett tillräckligt antal rätta svar på provfrågorna valts för att det ska vara avlagt med godkänd prestation.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Således behövs inte reglering kring det straffrättsliga tjänsteansvaret för bedömaren. Avläggande av medborgarskapsprovet har dock liknande konsekvenser för förvärvet av medborgarskap som avläggande av den allmänna språkexamen. Detta talar för att regleringen kring ansvarsfrågor kring medborgarskapsprovet ska vara likadant som i lagen om allmänna språkexamina. Därför föreslås i propositionen att de paragrafer som gäller såväl den som utarbetar medborgarskapsprovet som den som anordnar ett prov innehåller hänvisningar till bestämmelserna om straffrättsligt tjänsteansvar.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">De allmänna lagarna för förvaltningen tillämpas bland annat utifrån bestämmelserna om tillämpningsområdet för dessa även på privata personer då de sköter offentliga förvaltningsuppgifter. I medborgarskapslagen är det till denna del motiverat att tillägna en liknande regleringsslösning som i lagen om allmänna språkexamina. På detta gäller även tillämpningen av lagen om offentlighet i myndigheternas verksamhet på den som anordnar ett prov. Enligt 5 § i lagen om allmänna språkexamina tillämpas lagen om offentlighet i myndigheternas verksamhet när examensanordnaren behandlar testmaterialet för allmänna språkexamina. Hänvisningar till den övriga allmänna lagstiftningen behövs inte heller i fråga om medborgarskapsprovet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I propositionen föreslås att en sakkunnigkommission verkar i anslutning till Migrationsverket och att dess medlemmar ska vara företrädare för sakkunskap inom integration och utbildning samt den som utarbetar och anordnar medborgarskapsprovet. Sakkunnigkommissionen kan ha företrädare från inrikesministeriet, arbets- och näringsministeriet samt undervisnings- och kulturministeriet och därtill kan kommissionen ha representanter för dessa ministeriers förvaltningsområden, såsom UF-centret och Utbildningsstyrelsen. Kommissionen har till uppgift att stödja Migrationsverket i den allmänna utvecklingen och förvaltningen av medborgarskapsprovet. Den skulle även ge sakkunnigutlåtanden om begäranden om omprövning till Migrationsverket. Kommissionens medlemmar företräder i hög grad och på ett omfattande sätt den sakkunskap som behövs i systemet med medborgarskapsprov. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sakkunnigkommissionen följer att antalet provtillfällen är tillräckligt och även feedbacken på medborgarskapsprovet och statistiken över provprestationerna. Eftersom det läromedel för samhällsorientering som administreras av UF-centret utgör bakgrunden till medborgarskapsprovet och ett läromedel som lämpar sig för självstudier för medborgarskapsprovet utarbetas utifrån det, följer kommissionen även utvecklingen för läromedlet för samhällsorientering. Kommissionen kan ta initiativ till utveckling av systemet med medborgarskapsprov och överlämna dem till Migrationsverket, vars uppgifter omfattar den allmänna förvaltningen och utvecklingen av medborgarskapsprovet. Sakkunskapen hos medlemmarna i kommissionen behövs även i behandlingen av sådana begäranden om omprövning som gäller utrymme för tolkning i flervalsfrågorna. I sådana ärenden har kommissionens sakkunnigutlåtande en central betydelse med tanke på tillgodoseendet av rättsskyddet för deltagaren i provet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">På grundval av den breda sakkunskapen hos medlemmarna i kommissionen är det ändamålsenligt att tilldela de offentliga förvaltningsuppgifterna i anknytning till medborgarskapsprovet till den. Överföringen av de beskrivna uppgifterna till sakkunnigkommissionen äventyrar inte de grundläggande fri- och rättigheterna, rättssäkerheten eller andra krav på god förvaltning. Beslutsfattandet om medborgarskapsprovet hör till en myndighet, det vill säga Migrationsverket, inbegripet en sådan uppgift som innehåller avsevärd utövning av offentligt makt som beslut om de påföljder som ska utfärdas utifrån brott mot ordningen eller svikligt förfarande. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utifrån ovan framlagda grunder uppfyller förslaget till reglering kring utarbetande och anordnande av medborgarskapsprovet och sakkunnigkommissionen kraven i grundlagen, vilka gäller anförtroende av en offentlig förvaltningsuppgift till någon annan än en myndighet.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Utfärdande av bestämmelser om statsförvaltningens organ\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Enligt 119 § 2 mom. i grundlagen ska de allmänna grunderna för statsförvaltningens organ regleras genom lag, om deras uppgifter omfattar utövning av offentlig makt. Med allmänna grunder hänvisar man närmast till enhetens namn, bransch och huvudsakliga uppgifter samt behörighet (RP 1/1998 rd, s. 174/II). Även på grund av ett organs faktiska betydelse har det ansetts vara ändamålsenligt att utfärda bestämmelser genom lag, trots att det kan förmodas att organets uppgifter inte omfattar utövning av offentlig makt i den mening som 119 § 2 mom. i grundlagen avser (GrUU 41/2005 rd, s. 2). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I propositionen föreslås att en sakkunnigkommissionen inrättas för medborgarskapsprovet (25 f §). Det handlar om ett nytt sakkunnigorgan som har inrättats av Migrationsverket och som verkar i anslutning till det och vars ordförande är från verket. Utöver Migrationsverket har organet en tväradministrativ representation. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Utöver bestämmelserna om sakkunnigkommissionens sammansättning och mandatperiod innehåller lagen även bestämmelser om kommissionens uppgifter, vilka med tanke på medborgarskapsprovets karaktär och uppgiftsfördelningen i systemet med medborgarskapsprov kan anses vara av reell betydelse. Sakkunnigkommissionen har till uppgift att stödja Migrationsverket i den allmänna utvecklingen och förvaltningen av medborgarskapsprovet. Därtill kan kommissionen ge Migrationsverket ett utlåtande till stöd för behandlingen av en begäran om omprövning som gäller en underkänd provprestation. Utöver de allmänna motiveringar som framgår av lagen innehåller förslaget även ett bemyndigande att utfärda förordning, enligt vilket närmare bestämmelser om sakkunnigkommissionens sammansättning, behandlingen av dess ärenden och om dess uppgifter kan utfärdas genom förordning av statsrådet.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Bemyndiganden att utfärda förordning\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Grundlagens 80 § innehåller bestämmelser om utfärdande av förordningar och delegering av lagstiftningsbehörigheten. Republikens president, statsrådet och ministerierna kan utfärda förordningar med stöd av ett bemyndigande i grundlagen eller i någon annan lag. Genom lag ska bestämmelser dock utfärdas om grunden för en individs rättigheter och skyldigheter samt om ärenden som enligt grundlagen i övrigt omfattas av lag
