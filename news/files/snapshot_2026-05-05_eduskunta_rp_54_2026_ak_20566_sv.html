flervalsprov inte en likadan bedömning av prestationen som grundar sig på olika kriterier som till exempel vissa delprov som ingår i den allmänna språkexamen. Det behövs inga separata bedömningskriterier för att fastställa om en examinand bland de olika alternativen valt rätt svar på frågorna i flervalsprovet. Ett flervalsprov som granskas elektroniskt lämnar således i regel inget utrymme för sådan tolkning vid bedömningen av provprestationen som kan ge anledning till ändringssökande när det gäller bedömningen av en prestation i en allmän språkexamen. Omprövning får begäras i ett beslut om bedömning av en allmän språkexamen eller ett delprov i den. Även i fråga om medborgarskapsprovet är det ändamålsenligt att trygga möjligheten att söka ändring i en provprestation som underkänts genom ett omprövningsförfarande.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Målsättning\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Det allmänna målet med propositionen är att i enlighet med regeringsprogrammet skärpa villkoren för naturalisation genom att införa en skrivning om införande av ett medborgarskapsprov. Målet är att stärka det förhållningssätt enligt vilket medborgarskap beviljas till följd av en lyckad integration. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Ett centralt mål är att betona betydelsen av kännedom om det finländska samhället med tanke på naturalisationen, eftersom tillräcklig samhällskunskap kan anses vara ett motiverat bevis på den integration som eftersträvas. Genom propositionen strävar man således efter att främja att en person som är intresserad av att förvärva medborgarskap gör sig förtrogen med samhällets grundprinciper, regler och värderingar, individens rättigheter och skyldigheter samt betydelsen av att förvärva medborgarskap. Ett syfte är att betona betydelsen av att personen själv aktivt agerar för att förvärva medborgarskap. En eftersträvad effekt är att förändringen uppmuntrar till integration och därmed också främjar att personen deltar i samhällets verksamhet i högre grad än tidigare. Även ur samhällets synvinkel är en önskvärd effekt att en person som naturaliserats har bättre färdigheter än tidigare att fungera i det finländska samhället. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Dessutom är målet att regleringen ska möjliggöra en tydlig och exakt helhet för att verkställa ett sådant system för medborgarskapsprovet som är tillförlitligt, högklassigt och rättvist. &nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förslagen och deras konsekvenser\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">De viktigaste förslagen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">I propositionen föreslås att regleringen av de allmänna villkoren för naturalisation utökas med ett nytt samhällskunskapsvillkor. Den gällande regleringen innehåller inget villkor genom vilket man kan granska den sökandes integration med tanke på personens kunskaper om det finländska samhället. Därför förutsätts det av personer som ansöker om medborgarskap i fortsättningen att de har tillräckliga kunskaper om samhället och dessa kunskaper påvisas på finska eller svenska. Villkoret föreskrivs separat från språkkunskapsvillkoret och även i fortsättningen förutsätts att sökanden visar sina språkkunskaper utöver den samhällskunskap som föreslås. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Till medborgarskapslagen fogas bestämmelser om hur uppfyllandet av det nya samhällskunskapsvillkoret kan visas. Utgångspunkten är att villkoret uppfylls genom att med godkänt resultat avlägga medborgarskapsprovet, som är ett kunskapsbaserat prov som baserar sig på ett på förhand fastställt läromedel. I provet mäts kunskaperna om hur det finländska samhället fungerar och dess grundprinciper samt om individens rättigheter och skyldigheter. Det är fråga om ett helt nytt provsystem som utvecklas för förfarandet för naturalisation. De lagförslag som krävs för att genomföra systemet ingår i denna proposition.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tillräcklig samhällskunskap som krävs för naturalisation kan också påvisas genom vissa studier som genomförts i Finland. Sådana studier är en studentexamen på finska eller svenska eller en högskoleexamen på finska eller svenska. På så sätt strävar man för det första efter att eliminera en sådan oändamålsenlig situation där en sökande som erhållit kunskaper som kan jämställas med medborgarskapsprovet inom ramen för gymnasieutbildningen blir tvungen att delta i ett avgiftsbelagt medborgarskapsprov. Genom att jämställa högskoleexamina kan man också öka Finlands hållkraft gentemot personer som avlagt högskoleexamen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Villkoret gäller inte sökande under 18 år eller sökande som fyllt 65 år. Avvikelse kan dessutom göras om den sökande inte kan uppfylla villkoret på grund av sitt hälsotillstånd eller en funktionsnedsättning. Den sökande ska visa att det är fråga om ett sådant betydande och långvarigt medicinskt skäl som gör att personen inte skäligen kan antas uppfylla villkoret. Undantag från villkoret kan dessutom göras i övrigt av synnerligen vägande skäl. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget svarar Migrationsverket för de nya myndighetsuppgifterna i anslutning till medborgarskapsprovet. Dessa är allmän förvaltning, övervakning och utveckling av medborgarskapsprovet samt ingående av avtal om utarbetande av medborgarskapsprovet och anordnande av provtillfällen. Det är fråga om ett allmänt ansvar för att förvalta det nya systemet för medborgarskapsprovet som genomförs med beaktande av Migrationsverkets nuvarande uppgifter och funktioner. Till exempel utarbetandet av medborgarskapsprovet och anordnandet av provtillfällen handlar om uppgifter som till sin natur avviker från Migrationsverkets övriga uppgifter. Därför är det ändamålsenligt att ordna nämnda uppgifter i form av köpta tjänster som verket skaffar av aktörer som har tillräcklig sakkunskap för att sköta dem. Migrationsverket avtalar om utarbetandet och anordnandet av medborgarskapsprovet med de aktörer som uppfyller de villkor som föreslås i propositionen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget fogas ett nytt kapitel till medborgarskapslagen. I kapitlet föreskrivs närmare om det nya medborgarskapsprovet och dess genomförande, såsom innehållet i medborgarskapsprovet, utarbetandet och anordnandet av det samt om uppgifterna för den som utarbetar och anordnar provet. Kapitlet innehåller också bestämmelser om provavgiften, specialarrangemang som gäller avläggande av prov, påföljder för brott mot ordning och svikligt förfarande samt en sakkunnigkommission i anslutning till utvecklingen av medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet testar grundläggande kunskaper om hur det finländska samhället fungerar samt om individens rättigheter och skyldigheter. Flervalsprovet avläggs elektroniskt på finska eller svenska. För att säkerställa ett transparent och jämlikt prov baseras frågorna i provet på ett på förhand fastställt och allmänt tillgängligt läromedel. Medborgarskapsprovet föreslås utarbetas utifrån innehållet i det läromedel som används i samhällsorienteringen enligt integrationslagen eftersom det är ändamålsenligt att utnyttja sådant befintligt läromaterial som innehåller information som är central med tanke på provets syfte och mål. Utifrån läromedlet för samhällsorientering utarbetas ett läromedel som motsvarar dess innehåll och omfattning och som lämpar sig för medborgarskapsprovets användningsändamål. Samhällsorienteringen inbegriper undervisning i bland annat normer i det finländska samhället, central lagstiftning, grundläggande fri- och rättigheter och mänskliga rättigheter, jämlikhet och jämställdhet mellan könen samt Finlands kultur och historia. Således föreslås det att frågorna i medborgarskapsprovet handlar om till exempel dessa nämnda ämnen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För att utarbeta medborgarskapsprovet förutsätts tillräckligt högklassig och mångsidig sakkunskap eftersom man genom provet måste kunna bedöma deltagarnas kunskaper på ett tillförlitligt och tillräckligt entydigt sätt. Således kan Migrationsverket ingå ett avtal om utarbetande av provet med ett universitet, eftersom det kan anses ha den sakkunskap som förutsätts för att utarbeta provet. Den som utarbetar medborgarskapsprovet producerar ett läromedel för medborgarskapsprovet som baserar sig på läromedlet för samhällsorientering. Den som utarbetar medborgarskapsprovet har också i uppgift att bereda provfrågor och svar på dem. Provfrågorna ska basera sig på ovan nämnda på förhand fastställda läromedel och det ska utarbetas tillräckligt många frågor så att förutsebarhet kan förhindras, och dessutom bör man vid utarbetandet av frågorna beakta den nivå på språkkunskaperna som är ett villkor för naturalisation. Den som utarbetar provet sörjer dessutom för att frågorna och svarsalternativen samt läromedlet utvecklas bland annat utifrån respons på provet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Den aktör som anordnar medborgarskapsprovet ska erbjuda lokaler och ramar för avläggandet av provet samt sörja för övervakningen av provtillfällena. Därmed kan Migrationsverket avtala om anordnandet av provtillfällen med sådana aktörer som har tillräckliga förutsättningar att ordna provet bland annat i fråga om lokaler, anordningar, personal och övervakning. Anordnarna av provtillfällena kan vara såväl offentliga samfund som andra samfund som uppfyller villkoren. I praktiken kan provtillfällena genomföras av ett nätverk av anordnare som består av flera olika aktörer. Då det ingås avtal om anordnande av provtillfällen bör det beaktas att ett tillräckligt antal provtillfällen erbjuds regionalt och att provtillfällen erbjuds tillräckligt ofta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Genom specialarrangemang som gäller avläggande av prov ser man till att de som avlägger medborgarskapsprovet har skäliga och jämlika möjligheter att avlägga provet och att så många som möjligt avlägger provet. I praktiken kan det till exempel vara fråga om tilläggstid för att avlägga provet. Den som avlägger provet ska lägga fram en motiverad begäran och utredning om behovet av specialarrangemang. Migrationsverket beslutar om användningen av specialarrangemang.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt förslaget kan den som deltar i medborgarskapsprovet påföras påföljder på grund av brott mot ordning eller svikligt förfarande. Brott mot ordningen vid provtillfället kan leda till att provprestationen underkänns. Även ett svikligt förfarande leder till att provprestationen underkänns, och därtill förlorar examinanden sin rätt att delta i ett provtillfälle för en viss tid. Migrationsverket fattar beslut i nämnda situationer.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">För medborgarskapsprovet inrättas en tväradministrativ sakkunnigkommission som verkar i anslutning till Migrationsverket. Syftet med sakkunnigkommissionen är framför allt att stödja Migrationsverket i den allmänna utvecklingen av medborgarskapsprovet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapslagen kompletteras också med bestämmelser om begäran om omprövning av en underkänd provprestation.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lagen om Migrationsverket föreslås ändras genom att de uppgifter i anslutning till medborgarskapsprovet som utförs av Migrationsverket läggs till. Lagen om behandling av personuppgifter i migrationsförvaltningen (615/2020) föreslås ändras till följd av Migrationsverkets nya uppgifter i anslutning till medborgarskapsprovet, i vilka ingår behandling av personuppgifter.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">De huvudsakliga konsekvenserna\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Allmänt\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">De ändringar som föreslås i denna proposition är en del av helheten av ändringar som görs i medborgarskapslagen. Till samma helhet hör också en förlängning av den boendetid som är ett villkor för naturalisation, i fråga om vilken ändringarna trädde i kraft i oktober 2024, samt ändringar i bland annat försörjnings. och oförvitlighetsvillkoret, som trädde i kraft i december 2025. Nedan presenteras bedömningar av såväl konsekvenserna av det samhällskunskapsvillkor och medborgarskapsprov som föreslås i denna proposition som av de samverkanseffekter som de förändringar som gjorts i olika skeden kan medföra. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Det föreslagna systemet för medborgarskapsprovet är helt nytt och det finns ännu inga tidigare erfarenheter av det i Finland. Det finns inget provsystem som helt motsvarar det. Bedömningen av konsekvenserna av det nya samhällskunskapsvillkoret och medborgarskapsprovet är således också förknippad med flera osäkerhetsfaktorer. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för myndigheternas verksamhet\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det ska föreskrivas om ett nytt samhällskunskapsvillkor för naturalisation och om införande av ett medborgarskapsprov, vilket påverkar Migrationsverket mest av alla myndigheter. I Migrationsverkets uppgifter ingår att besluta om beviljande av medborgarskap på ansökan. Införandet av ett samhällskunskapsvillkor som ett nytt villkor för naturalisation påverkar således Migrationsverkets beslutsprövning. Det ankommer också på Migrationsverket att bedöma om det i vissa fall finns grunder för att avvika från det nya villkoret. I och med införandet av medborgarskapsprovet får Migrationsverket helt nya uppgifter. Migrationsverket föreslås ha en central roll i förvaltningen och samordningen av det nya systemet för medborgarskapsprovet.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Nedan behandlas till en början närmare hur införandet av ett krav på samhällskunskap som ett villkor för naturalisation påverkar myndigheternas verksamhet. Därefter granskas närmare hur de olika uppgifterna i anslutning till verkställandet av medborgarskapsprovet påverkar i synnerhet Migrationsverkets verksamhet. &nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Det nya samhällskunskapsvillkorets konsekvenser för myndigheterna\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">I propositionen föreslås att ett samhällskunskapsvillkor ska läggas till som ett villkor för att finskt medborgarskap ska beviljas på ansökan. För att finskt medborgarskap ska kunna beviljas på ansökan ska den sökande påvisa att han eller hon har skaffat sig grundläggande kunskaper om hur det finländska samhället fungerar och om individens rättigheter och skyldigheter. Innehållet i det nya villkoret är kunskaper om samhället som kan påvisas genom att avlägga det nya medborgarskapsprovet med godkänt resultat samt genom en student- eller högskoleexamen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">De ändringar i boendetidsvillkoret i medborgarskapslagen som genomfördes 2024 bedömdes påverka antalet ansökningar till Migrationsverket. Innan ändringarna gällande boendetiden trädde i kraft gjordes klart fler ansökningar än tidigare. Ikraftträdandet av ändringarna bedömdes emellertid leda till att det under en tid görs något färre ansökningar, eftersom eventuella sökande ännu inte uppfyller kravet på boendetid. De ändringar i medborgarskapslagen som gjordes i följande skede 2025 bedömdes å sin sida påverka antalet ansökningar framför allt på grund av att en person som fått arbetslöshetsförmån eller utkomststöd inte nödvändigtvis längre uppfyller det nya försörjningsvillkoret. I propositionen bedömdes att en del av de eventuella sökandena kan skjuta upp ansökan om medborgarskap på grund av arbetslöshet. Det ansågs också möjligt att det fattas fler negativa beslut för arbetslösa personer som ansöker om medborgarskap. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">År 2025 lämnades sammanlagt 11&nbsp;237 ansökningar om medborgarskap till Migrationsverket (2024: 17&nbsp;063, 2023: 18&nbsp;296). Migrationsverket fattade sammanlagt 15&nbsp;809 beslut på medborgarskapsansökningar 2025 (2024: 14&nbsp;112, 2023: 13&nbsp;322), av vilka 1&nbsp;742 beslut var negativa (2024: 1&nbsp;258, 2023: 1&nbsp;330). År 2025 utgjorde andelen negativa beslut av alla beslut som fattades på medborgarskapsansökningar cirka 11&nbsp;procent (2024: 9 %, 2023: 10 %). Den vanligaste grunden för ett negativt beslut 2021–2025 var att den sökande inte uppfyllde språkkunskapsvillkoret. År 2025 fattades sammanlagt 539 beslut, det vill säga cirka 31 procent av de negativa besluten, på den grunden att den sökande inte hade de språkkunskaper som krävs och att det inte fanns någon grund för att avvika från språkkunskapsvillkoret. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tabell 1: Beslut på medborgarskapsansökningar 2023–2025.&nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N104F5\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Beslut på medborgarskapsansökningar\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2023\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2024\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2025\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Alla &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">13&nbsp;322&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">14&nbsp;112&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">15 809&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Negativa beslut&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;330&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1 258&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1 742&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Negativa beslut, språkkunskaper&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">400&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">382&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">539&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Antalet negativa beslut på medborgarskapsansökningar som fattats på grund av bristfälliga språkkunskaper har betydelse eftersom samhällskunskapsvillkoret är ett liknande villkor för naturalisation som det språkkunskapsvillkor som redan finns i medborgarskapslagen. Även grunderna för att göra undantag från villkoret är i viss mån likartade. I den utredning om införandet av medborgarskapsprovet (s. 59–60) som arbetsgruppen gjort bedömdes att det krävs att cirka 5&nbsp;000–10&nbsp;000 personer avlägger medborgarskapsprovet varje år. Uppskattningen grundade sig på antalet 18–64-åringar som ansökte om medborgarskap 2020–2023. Språkkunskapsvillkoret och samhällskunskapsvillkoret gäller till stor del samma personer. Å andra sidan kan man bedöma att det åtminstone delvis är samma sökande som kommer att begära undantag från villkoret. Därför ökar antalet negativa beslut på medborgarskapsansökningar inte nödvändigtvis nämnvärt till följd av införandet av det nya samhällskunskapsvillkoret och medborgarskapsprovet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">En del av de eventuella sökandena kan dock skjuta upp ansökan om medborgarskap på grund av medborgarskapsprovet. På samma sätt som de tidigare skärpningarna av boendetiden och försörjningen påverkar också kravet på samhällskunskap som ett villkor för naturalisation i synnerhet antalet medborgarskapsansökningar i framtiden. I vissa andra länder har det observerats att införandet av ett medborgarskapsprov har minskat och skjutit upp erhållandet av medborgarskap.\u003Cspan class=\"AlaviiteTeksti\"> Sådana konsekvenser har observerats i Nederländerna och Danmark, där påvisandet av språkkunskaper och samhällskunskap lades till villkoren för att förvärva medborgarskap i början av 2000-talet (Vink m.fl. 2021: Long-term heterogeneity in immigrant naturalization – the conditional relevance of civic integration and dual citizenship, European Sociological Review 37:5, s. 751, 753, 763). Även i Tyskland har införandet av prov konstaterats ha påverkat erhållandet av medborgarskap (Van Oers 2021: Deserving citizenship in Germany and The Netherlands – citizenship tests in liberal democracies, Ethnicities 21:2, s. 284).\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Införandet av ett krav på samhällskunskap som ett nytt villkor för naturalisation leder till att Migrationsverket måste uppdatera ansökningsblanketterna i elektronisk form och pappersform. Såväl den personal som arbetar med medborgarskapsansökningar som kundservicepersonalen vid verket behöver få utbildning och anvisningar om det nya villkoret. Uppgifterna om villkoren för naturalisation på Migrationsverkets webbplats måste uppdateras. På webbplatsen ska anges vem det nya villkoret gäller, hur man kan påvisa att det uppfylls och på vilka grunder man kan avvika från villkoret. Information om avläggande av medborgarskapsprovet ska också finnas tillgänglig antingen på Migrationsverkets webbplats eller via den. Det nya villkoret medför också behov av ändringar i de informationssystem som Migrationsverket använder, i ärendehanteringssystemet för utlänningsärenden och i webbtjänsten Enter Finland. För medborgarskapsprovet behövs dessutom en interoperabel helhet av informationssystem. De olika konsekvenserna för informationssystemen granskas närmare nedan. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ändringarna i villkoren för naturalisation påverkar förutom Migrationsverket även förvaltningsdomstolarna, hos vilka beslut om medborgarskap kan överklagas. Migrationsverkets beslut får överklagas hos förvaltningsdomstolen, vars beslut kan överklagas hos högsta förvaltningsdomstolen om högsta förvaltningsdomstolen beviljar besvärstillstånd.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I synnerhet de ändringar som gjorts i försörjningsvillkoret bedömdes kunna påverka antalet ärenden även vid förvaltningsdomstolarna. Enligt Domstolsverkets statistik lämnades sammanlagt 337 klagomål som berörde medborgarskapsärenden till förvaltningsdomstolarna 2023 (2022: 206). Försörjningsvillkoret förknippas delvis med liknande undantagsgrunder som språkkunskapsvillkoret. Det nya försörjningsvillkoret bedömdes leda till att det årliga antalet besvär till förvaltningsdomstolarna eventuellt ökar med cirka 80 (mindre än 1 % av de ärenden som anhängiggjordes vid förvaltningsdomstolarna 2024). &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Även införandet av medborgarskapsprovet kan öka antalet besvär till förvaltningsdomstolarna om medborgarskapsansökningar. Såsom konstaterats ovan kan det dock delvis vara samma personer som begär undantag från de olika villkoren till exempel på grund av hälsotillståndet. Medborgarskapsprovet ökar således inte nödvändigtvis i väsentlig grad antalet besvär som gäller medborgarskap, varvid medborgarskapsprovets konsekvenser för förvaltningsdomstolarnas resursbehov eventuellt blir ringa. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Uppgifter i anslutning till verkställandet av medborgarskapsprovet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Migrationsverket har en central roll i verkställandet av medborgarskapsprovet och i synnerhet i förvaltningen av systemet för medborgarskapsprovet. Migrationsverket konkurrensutsätter utarbetandet av medborgarskapsprovet och anordnandet av provtillfällen och ingår avtal om köp av sådana tjänster. För medborgarskapsprovet behövs också en interoperabel helhet av informationssystem. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Migrationsverkets uppgifter omfattar bland annat allmän kommunikation om medborgarskapsprovet, skötsel av betalningsrörelsen kring provet, skötsel av den helhet av informationssystem som behövs och beslut om eventuella specialarrangemang. Verket informerar på sin webbplats om de läromedel som används för förberedelserna för provet, om anmälan till provet samt om styrkande av identiteten i samband med provtillfället. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det föreslås att Migrationsverket i regel avtalar om utarbetandet av det nya medborgarskapsprovet med något universitet. Migrationsverket köper medborgarskapsprovet och provfrågorna som en tjänst. I denna köpta tjänst ingår ett brett utbud av provfrågor med svarsalternativ samt det läromedel för provet som flervalsfrågorna baserar sig på. Läromedlet för medborgarskapsprovet utarbetas på basis av det läromaterial som används i samhällsorienteringen enligt integrationslagen så att det motsvarar dess innehåll och omfattning. Frågorna och svarsalternativen samt läromedlet för medborgarskapsprovet bör utformas så att de beaktar den nivå på språkkunskaperna som krävs för medborgarskap, vilken är bedömningen B1 enligt skalan i den gemensamma europeiska referensramen för språk. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Innan medborgarskapsprovet införs ska provfrågorna testas och i fortsättningen ska de utvecklas. Vid anskaffningen av en helhet av provfrågor bör man således beakta det utvecklingsarbete och den testning som utarbetandet av medborgarskapsprovet förutsätter. Efter att medborgarskapsprovet införts bör provfrågorna fortsättningsvis uppdateras och nya frågor med svarsalternativ bör utvecklas för provet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Migrationsverket konkurrensutsätter nätverket av anordnare av medborgarskapsprov och ingår avtal om anordnande av provtillfällen. Anordnarna av provtillfällen ska tillhandahålla lämpliga lokaler och ramar för det elektroniska flervalsprovet. Anordnarna av provtillfällen erbjuder vid tidpunkten för ett prov lokaler för att avlägga provet och använder systemet avsett för anmälan till provet. I anordnandet av provtillfällen ingår att kontrollera identiteten hos dem som deltar i provet innan provet inleds samt att övervaka provtillfällena. Anordnarna av provtillfällen övervakar att de som deltar i provet börjar avlägga provet i en tekniskt sluten miljö. Dessutom ska anordnarna av prov sörja för de anpassningar och specialarrangemang som deltagarna eventuellt behöver. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Migrationsverket ska på sin webbplats lägga upp nödvändig information om avläggande av medborgarskapsprovet, till exempel en länk till de läromedel som används för att förbereda sig för provet, exempelfrågor med tillhörande svar, tidpunkter och platser för prov, information om att identitetsbevis ska uppvisas i samband med provtillfället samt en länk till anmälan till provet. Migrationsverket sköter också betalningsrörelsen i anslutning till provet och beslutar om återbetalning av avgiften till personer som är förhindrade att delta i provet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det inrättas en sakkunnigkommission för den allmänna utvecklingen av medborgarskapsprovet. Migrationsverket är ordförande för kommissionen. Vice ordförande är i möjligaste mån en företrädare för sakkunskap inom integration. Sakkunnigmedlemmarna ska dessutom företräda åtminstone sakkunskap inom utbildning samt den som utarbetar och anordnar medborgarskapsprovet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Om störande eller svikligt förfarande observeras vid provtillfället ska Migrationsverket sörja för att fallet utreds och hörandet i anslutning till det. Migrationsverket beslutar också om eventuella påföljder. I en sådan situation ser Migrationsverket till att ärendet utreds i efterhand och att parten hörs i enlighet med förvaltningslagen. Provprestationen kan anses underkänd på grund av brott mot ordningen. Likaså kan provprestationen anses underkänd på grund av svikligt förfarande, deltagande i sådant förfarande eller försök till det under provtillfället, och därtill kan parten förlora rätten att delta i medborgarskapsprovet för en viss tid.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I fråga om resultatet av medborgarskapsprovet kan omprövning begäras hos Migrationsverket, som i egenskap av myndighet som ansvarar för förvaltningen av medborgarskapsprovet behandlar begäranden om omprövning centraliserat. En godkänd prestation i det föreslagna medborgarskapsprovet förutsätter att den som deltar i provet väljer ett tillräckligt antal rätta svarsalternativ på frågorna i provet. Det finns således i regel knappt något utrymme för tolkning av huruvida provresultatet kan godkännas. Omprövningsförfarandet är nödvändigt framför allt för att utreda om till exempel en teknisk störning utgjort ett hinder för att avlägga provet med godkänt resultat. I förfarandet beaktas dock även sådana situationer där omprövning begärs på grund av att flervalsfrågorna är tolkningsbara. Behovet av att söka ändring minskas genom att medborgarskapsprovet kan avläggas på nytt om antalet rätta svar som valts i provet inte räcker till för en godkänd prestation.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Helhet av informationssystem som behövs för medborgarskapsprovet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Såsom konstaterats ovan (4.2.1.1) leder det nya villkoret för naturalisation till behov av ändringar i Migrationsverkets informationssystem, ärendehanteringssystemet för utlänningsärenden och den elektroniska webbtjänsten Enter Finland. För att verkställa medborgarskapsprovet behövs dessutom informationssystemlösningar, som Migrationsverket kan konkurrensutsätta och skaffa som köpta tjänster. En del av lösningarna kan Migrationsverket eventuellt också själv genomföra. Båda alternativen förutsätter utvecklingsarbete och testning innan de införs. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">För ett medborgarskapsprov som genomförs i form av ett flervalsprov behövs ett elektroniskt system för de frågor jämte svarsalternativ som används vid olika provtillfällen. Ordningen på provfrågorna kan vara slumpmässig och variera för olika deltagare. Granskningen av provsvaren görs elektroniskt. Deltagarens tillgång till andra webbplatser eller material som sparats på anordningen förhindras under provtillfället. I samband med att identiteten kontrolleras kan man till exempel ge deltagarna en separat webblänk och ett separat lösenord till provsystemet.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">För medborgarskapsprovet behövs också ett system eller en funktion för anmälan till provet, i samband med vilken deltagaravgiften för provet betalas. För medborgarskapsprovet behövs dessutom ett system eller en funktion för registrering av provresultat. Systemet eller funktionen kan eventuellt kopplas till ovan nämnda elektroniska provsystem och behandlingen av medborgarskapsansökningar.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tabell 2: Delar i den helhet av informationssystem som hör till systemet för medborgarskapsprovet. &nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N105F1\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Del\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Provfrågor\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Anmälan till provet\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Avläggande av provet\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Registrering av provprestationer\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Innehåll&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Tillräckligt många flervalsfrågor med svarsalternativ&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">System/del för anmälan till provet&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">System/del för avläggande av medborgarskapsprovet&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Uppgifter om provprestationer&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Användning&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Medborgarskapsproven sammanställs av frågor jämte svarsalternativ. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Anordnarna av provtillfällen anger information om lediga provplatser i systemet. &nbsp;\u003C/p>\n            \u003Cp class=\"KappaleKooste\">Deltagarna anmäler sig till provet och betalar provavgiften. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Deltagarna avlägger provet vid ett övervakat provtillfälle på dator med hjälp av ett elektroniskt testsystem. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Information om provprestationerna registreras i ett informationssystem där de finns tillgängliga i samband med behandling av ärenden som gäller naturalisation. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kopplingar till andra delar&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Koppling till det elektroniska testsystem som används för att avlägga medborgarskapsprovet&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Koppling till det elektroniska testsystem i vilket de som anmält sig till provet avlägger provet efter att deras identitet kontrollerats.&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Koppling till provfrågorna och registreringen av provprestationer &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Koppling till det elektroniska testsystemet och behandlingen av medborgarskapsansökningar &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Migrationsverkets roll&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Verket skaffar frågorna och svarsalternativen samt läromedlet som en köpt tjänst. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Verket förvaltar betalningsrörelsen i anslutning till provet. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Verket skaffar systemet eller tjänsten. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Verket fungerar som personuppgiftsansvarig. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Övrigt&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Frågorna jämte svaren baserar sig på läromedlet för medborgarskapsprovet. Frågorna behöver uppdateras.&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Migrationsverket kan i systemet anteckna tillfälliga förbud mot deltagande på basis av ett svikligt förfarande som uppdagats vid provtillfället. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Prestationerna i flervalsprovet granskas elektroniskt.&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Vid bedömningen av huruvida villkoret för naturalisation uppfylls utnyttjas uppgifter om provprestationerna. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Enligt 8 § 2 mom. i lagen om informationshantering inom den offentliga förvaltningen (906/2019) ska det ministerium som ansvarar för verksamhetsområdet göra en bedömning enligt 5 § 3 mom. då bestämmelser som är under beredning återverkar på informationsmaterial och informationssystem. Dessutom ska ministeriet bedöma planerade bestämmelsers konsekvenser för handlingsoffentligheten och handlingssekretessen. Vid planeringen av väsentliga administrativa reformer och i samband med att informationssystem tas i bruk ska man i enlighet med 5&nbsp;§ 3&nbsp;mom. bedöma förändringarnas konsekvenser i förhållande till ansvaren för informationshanteringen och informationssäkerheten. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Förslagen i denna proposition har sådana konsekvenser för Migrationsverkets informationshantering som avses i 8 § 2&nbsp;mom. i lagen om informationshantering. Medborgarskapsprovet medför nya uppgifter för Migrationsverket och för provet behövs olika ändringar i helheten av informationssystem. Helheten av informationssystem ska i fortsättningen möjliggöra sådana funktioner i anslutning till medborgarskapsprovet som anmälan till medborgarskapsprovet och betalning av deltagaravgiften för provet, avläggande av ett elektroniskt flervalsprov som utarbetats på basis av ett läromedel och automatisk granskning av provsvaren samt registrering av provprestationer och utnyttjande av information om avläggandet av provet i behandlingen av medborgarskapsansökan. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tabell 3: Hur införandet av medborgarskapsprovet påverkar informationshanteringen. &nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10724\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Del av informationshanteringen\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Konsekvenser av ändringarna\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Ansvar för informationshanteringen\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Migrationsverket är personuppgiftsansvarig för den helhet av informationssystem som behövs för medborgarskapsprovet. Uppgifter om dem som anmält sig till provet behandlas också av tjänsteproducenter som ingått ett avtal om anordnande av provtillfällen med Migrationsverket. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Informationssäkerhetsåtgärder\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">För de uppgifter som behandlas i samband med medborgarskapsprovet krävs ingen särskild tillförlitlighet jämfört med de uppgifter som i nuläget finns i ärendehanteringssystemet för utlänningsärenden. I samband med anmälan till provet kan man i informationssystemet anteckna uppgifter om sådana specialarrangemang som de som deltar i provet behöver på grund av sitt hälsotillstånd eller sin funktionsnedsättning eller av någon annan jämförbar orsak. Informationssäkerheten i informationssystemet ska således ligga på den nivå som sekretessbelagda uppgifter och personuppgifter som hör till särskilda kategorier av personuppgifter förutsätter.&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Skapande av informationsmaterial\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Informationsmaterial bildas genom att kunderna anmäler sig till provet och avlägger det. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Handlingars offentlighet och sekretess\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">I propositionen föreslås inga ändringar av regleringen om handlingars offentlighet och sekretess.&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Interoperabilitet\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">De olika delarna av helheten av informationssystem ska kopplas till varandra så att uppgifterna i en del kan utnyttjas i en annan.&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Enligt 24 § 1 mom. 22 punkten i lagen om offentlighet i myndigheternas verksamhet (621/1999, \u003Cspan class=\"KursiiviTeksti\">offentlighetslagen\u003C/span>) inbegriper sekretessbelagda myndighetshandlingar handlingar som innehåller uppgifter om inträdesprov eller andra prov eller test, om utlämnandet av uppgifter ur dem skulle äventyra provens eller testens syfte eller en användning av testen i framtiden. Att lämna ut uppgifter om frågorna och svarsalternativen i medborgarskapsprovet skulle äventyra syftet med provet. En handling som innehåller sådana uppgifter är således sekretessbelagd. De som deltar i genomförandet av medborgarskapsprovet ska se till att medborgarskapsprovet och i synnerhet dess frågor och svarsalternativ behandlas på det sätt som förutsätts i offentlighetslagen. &nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ekonomiska konsekvenser\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Enligt uppskattningar uppgår engångskostnaderna för de inledande investeringarna i medborgarskapsprovet till sammanlagt cirka 4,2 miljoner euro och de bestående kostnaderna till cirka 2,35 miljoner euro. De ekonomiska konsekvenserna av de föreslagna ändringarna har framför allt att göra med att medborgarskapsprovet är helt nytt i Finland och att införandet av provet orsakar olika kostnader. En del av kostnaderna beror på det nya villkoret och den ökade mängden arbete för Migrationsverket i anslutning till det. Största delen av kostnaderna kommer dock att orsakas av det nya systemet för medborgarskapsprovet, den helhet av informationssystem som behövs för det, utarbetandet av frågor och svarsalternativ för själva provet samt anordnandet av provtillfällen. I planen för de offentliga finanserna har det inte beviljats anslag för behövliga ändringar. Ett eventuellt behov av tilläggsanslag bedöms i samband med beredningen av den andra tilläggsbudgeten för 2026.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I den utredning om införandet av medborgarskapsprovet (s. 59–60) som arbetsgruppen gjort bedömdes att cirka 5000–10&nbsp;000 personer borde delta i medborgarskapsprovet i Finland varje år. Uppskattningen grundar sig på antalet 18–64-åringar som ansökte om medborgarskap 2020–2023. Arbetsgruppens utredning innehöll också preliminära observationer om de resurser som krävs för att införa medborgarskapsprovet (s. 81–82). I utredningen granskades kostnaderna för vissa andra liknande system och den tid som utvecklingsarbetet kräver. Till exempel uppgår de årliga underhållskostnaderna för den allmänna språkexamen som Utbildningsstyrelsen förvaltar till sammanlagt 1 912 000 euro. På basis av utredningen bör man reservera åtminstone tre till sex månader för konkurrensutsättningarna. För Migrationsverkets nödvändiga systemutveckling behövs utifrån erfarenheter från tidigare projekt eventuellt fyra till åtta månader. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att frågorna i medborgarskapsprovet ska basera sig på ett läromedel för medborgarskapsprovet som utarbetas utifrån läromedlet för samhällsorientering enligt integrationslagen. För medborgarskapsprovet och förberedelserna för det behöver således inte utarbetas ett helt nytt läromedel. Frågorna i medborgarskapsprovet och läromedlet utarbetas och provtillfällena anordnas genom köpta tjänster som konkurrensutsätts och skaffas av Migrationsverket. För anmälan till medborgarskapsprovet, det elektroniska flervalsprovet och registreringen av provresultaten behövs en helhet av informationssystem som åtminstone i viss mån kräver utvecklingsarbete och testning. Medborgarskapsprovet ska också testas som en helhet före det första provtillfället. Även systemutvecklingen och testningen medför kostnader. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Nedan anges enligt de olika uppgiftshelheterna uppskattningar av vilka olika kostnader medborgarskapsprovet medför. I tabellen specificeras kostnaderna av engångskaraktär för de inledande investeringar som medborgarskapsprovet kräver samt de bestående årliga kostnaderna som systemet för medborgarskapsprovet medför i fortsättningen. Förberedelserna för införandet av medborgarskapsprovet vid Migrationsverket omfattar sammanlagt två och ett halvt årsverken. Efter införandet omfattar förvaltningen, övervakningen och utvecklingen av provet sammanlagt tre årsverken vid verket. Kostnaderna för den helhet av informationssystem som behövs för medborgarskapsprovet fördelas på flera år. Den mest nödvändiga utveckling av informationssystemet som behövs för att införa medborgarskapsprovet sker 2026. Det slutliga helhet av informationssystem som behövs för medborgarskapsprovet genomförs i sin tur under 2027. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tabell 4: Kostnader som orsakas av samhällskunskapsvillkoret och medborgarskapsprovet.&nbsp;\u003C/p>\n      \u003Cdiv id=\"tableID-N107CD\" class=\"table\">\n       \u003Ctable class=\"vaskitgroup\">\n        \u003Ctbody class=\"tbody\">\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Uppgift\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Engångskostnader 2026–2027 \u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Bestående kostnader/år (från 2027)\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Informationssystemet för medborgarskapsprovet och ändringar i ärendehanteringssystemet för utlänningsärenden&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">2&nbsp;000&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">60&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Utarbetande av medborgarskapsprovet (frågor och läromedel)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">200&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Upprätthållande och utveckling av medborgarskapsprovet&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">60&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Anordnande och inledande av provtillfällen&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">1&nbsp;320&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">1&nbsp;900&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Beredning av införandet av medborgarskapsprovet vid Migrationsverket, inkl. kommunikation&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">680&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Förvaltning och övervakning av medborgarskapsprovet vid Migrationsverket&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">330&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Totalt&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">4&nbsp;200&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">2&nbsp;350&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n        \u003C/tbody>\n       \u003C/table>\n      \u003C/div>\n      \u003Cp class=\"KappaleKooste\">De totala kostnaderna för införandet av medborgarskapsprovet uppgår till cirka 4,2 miljoner euro.\u003Cspan class=\"AlaviiteTeksti\"> Uppskattningarna av engångskostnaderna i synnerhet för införandet av provet preciserades efter remissbehandlingen. Enligt propositionsutkastet som var på remiss uppskattades de totala kostnaderna till 4,9 miljoner euro. Olika kostnader för informationssystem bedömdes dock vara lägre under beredningen. \u003C/span> Införandet genomförs i sin helhet 2026–2027. Efter att medborgarskapsprovet införts uppgår de bestående kostnaderna till cirka 2,35 miljoner euro per år. Dessa kostnader täcks med deltagaravgifterna under en längre tid. Investeringskostnaderna för medborgarskapsprovet täcks med avskrivningar på investeringar.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ovan beskrivs propositionens konsekvenser för den offentliga ekonomin. De föreslagna ändringarna påverkar hushållen framför allt genom att vuxna i arbetsför ålder som är intresserade av att ansöka om medborgarskap i fortsättningen i regel ska avlägga medborgarskapsprovet. Till följd av medborgarskapsprovet förknippas ansökan om medborgarskap också med en ny kostnad eftersom en separat provavgift tas ut för deltagande i medborgarskapsprovet. Det finns ännu ingen exakt uppskattning av avgiftens storlek, men till exempel i den allmänna språkexamen, som ofta avläggs innan en person ansöker om medborgarskap, är examensavgiften 190 euro.\u003Cspan class=\"AlaviiteKooste\"> Examensavgiften är 190 euro i examina på mellannivå, med vilken den nivå på språkkunskaperna som krävs för medborgarskap kan påvisas (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.oph.fi/fi/koulutus-ja-tutkinnot/ilmoittautuminen-yki-testiin\">https://www.oph.fi/sv/utbildning-och-examina/anmalan-till-yki-test\u003C/a>\u003C/span>\u003C/span>\u003C/span> I granskningen av medborgarskapsproven i vissa andra länder nedan (5.2) framgår dessutom att avgiften för medborgarskapsprovet i allmänhet varierar mellan några tiotals euro till över hundra euro i de olika länderna. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Samhällskunskapsvillkoret och medborgarskapsprovet gäller dock inte personer under 18 år, så i barnfamiljer berör provavgiften i praktiken endast ansökan om medborgarskap för vuxna i familjen. Om antalet korrekta svar i medborgarskapsprovet inte räcker till för en godkänd prestation, kan man anmäla sig till provet och delta i det på nytt. Då måste man också betala provavgiften på nytt på samma sätt som i nuläget i samband med att den allmänna språkexamen tas om. Utöver de konsekvenser som provavgiften medför påverkar medborgarskapsprovet hushållens tidsanvändning eftersom man i fortsättningen måste avlägga medborgarskapsprovet med godkänt resultat innan ansökan om medborgarskap lämnas in. Man måste också förbereda sig på provet på förhand genom att studera läromedlet för medborgarskapsprovet. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">De indirekta konsekvenserna för företag bedöms vara ringa. Förslagens indirekta konsekvenser för till exempel företagens tillgång på arbetskraft kommer sannolikt inte att vara betydande. Nätverket av anordnare av medborgarskapsprov kan eventuellt också omfatta företag med vilka Migrationsverket avtalar om anordnande av provtillfällen. Provtillfällen anordnas i systemet för medborgarskapsprovet genom köpta tjänster som konkurrensutsätts och anskaffas av Migrationsverket. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konsekvenser för de grundläggande fri och rättigheterna och de mänskliga rättigheterna\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Grundlagens bestämmelser om de grundläggande fri- och rättigheterna gäller i regel alla som omfattas av Finlands jurisdiktion. I fråga om de flesta grundläggande fri- och rättigheter har ett finskt medborgarskap således ingen inverkan på tillgodoseendet av rättigheten. I samband med tidigare ändringar i villkoren för naturalisation bedömdes att en förlängning av boendetiden och andra ändringar framför allt har en uppskjutande inverkan på tillgodoseendet av rättigheterna till den del vissa rättigheter hänför sig till finskt medborgarskap. De tidigare ändringarna i medborgarskapslagen gällde utöver boendetiden även identiteten, oförvitligheten och försörjningsvillkoret samt beaktandet av säkerheten i samband med beviljandet av medborgarskap. I medborgarskapslagen gjordes också vissa sådana ändringar utifrån vilka finskt medborgarskap och därmed förknippade rättigheter kan förloras i något fler situationer än tidigare. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">En del rösträtter och rättigheter till inflytande gäller endast finska medborgare, liksom rätten att rösta i statliga val. Likaså gäller vissa rättigheter som hör till rörelsefriheten också särskilt finska medborgare. Finska medborgare får inte hindras att resa in i landet eller landsförvisas. Finskt medborgarskap anknyter också till unionsmedborgarskapet och unionsmedborgarnas rättigheter. Om en person ännu inte är medborgare i en medlemsstat i Europeiska unionen, förvärvar han eller hon genom sitt finska medborgarskap samtidigt unionsmedborgarskap med därtill hörande rättigheter, till vilka hör rätten att fritt röra sig och vistas inom medlemsstaternas territorium samt rösträtt och valbarhet vid val till Europaparlamentet. En skärpning av villkoren för naturalisation kan ha en uppskjutande inverkan när det gäller tillgodoseendet av dessa rättigheter.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">I denna proposition föreslås att det ska införas ett nytt samhällskunskapsvillkor för att förvärva medborgarskap och ett nytt medborgarskapsprov i anslutning till villkoret. Även samhällskunskapsvillkoret och avläggandet av medborgarskapsprovet påverkar möjligheten att förvärva medborgarskap. I praktiken måste de flesta innan de ansöker om medborgarskap avlägga medborgarskapsprovet, som de förbereder sig på genom att studera läromedlet för medborgarskapsprovet. Medborgarskapsprovet och förberedelserna för det kan å andra sidan ha en indirekt inverkan på tillgodoseendet av de grundläggande fri- och rättigheterna och de mänskliga rättigheterna i och med att individens rättigheter och skyldigheter är ett centralt ämnesområde i medborgarskapsprovet och det läromedel som används för det.\u003Cspan class=\"AlaviiteKooste\"> Det ingår också ett avsnitt som behandlar ämnet i läromedlet för samhällsorientering, utifrån vilket läromedlet för medborgarskapsprovet utarbetas (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali/lait-ja-oikeus/yksilon-oikeudet-ja-velvollisuudet\">https://yhteiskuntaorientaatio.fi/sv/laromedel/lag-och-ratt/individens-rattigheter-och-skyldigheter\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Nedan behandlas i närmare detalj bedömningar av hur de föreslagna ändringarna påverkar tillgodoseendet av de grundläggande fri- och rättigheterna och de mänskliga rättigheterna. Granskningen omfattar i synnerhet jämlikhet, rösträtt och rätt till inflytande, rörelsefrihet och skydd mot utvisning, rättsskydd, kulturella rättigheter, rätt till social trygghet, rätt till medborgarskap samt skydd för privatlivet och av personuppgifter.&nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Jämlikhet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Enligt 6 § i grundlagen är alla lika inför lagen. Ingen får utan godtagbart skäl särbehandlas på grund av kön, ålder, ursprung, språk, religion, övertygelse, åsikt, hälsotillstånd eller handikapp eller av någon annan orsak som gäller hans eller hennes person. Barn skall bemötas som jämlika individer och de skall ha rätt till medinflytande enligt sin utvecklingsnivå i frågor som gäller dem själva. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Uppfyllandet av det nya samhällskunskapsvillkoret kan påvisas med en student- eller högskoleexamen eller med det nya medborgarskapsprovet, i vilket man testar de grundläggande kunskaperna om hur det finländska samhället fungerar samt individens rättigheter och skyldigheter. Dessa ämnen ingår också i samhällsorienteringen enligt integrationslagen, för vilken det utarbetats läromedel\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/sv/laromedel\u003C/a>\u003C/span>\u003C/span>\u003C/span> som läromedlet för medborgarskapsprovet baserar sig på. Frågorna i provet handlar om information som är central i läromedlet. Läromedlet finns allmänt tillgängligt så att det kan användas för förberedelser för medborgarskapsprovet. Personer som är intresserade av att ansöka om medborgarskap har således lika möjligheter att avlägga medborgarskapsprovet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet är ett kunskapsbaserat prov som kan avläggas efter att man studerat central information i ett läromedel som är tillgängligt för alla. Frågorna i provet handlar inte om mycket detaljerad information, utan enligt förslaget ska man genom provet testa grundläggande kunskaper om ämnen som berör hur samhället fungerar och som behandlas i läromedlet. Ett kunskapsbaserat prov försätter ingen i ojämlik ställning till exempel på grund av övertygelse eller åsikt. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Nivån på det finska eller svenska språket som används i medborgarskapsprovet motsvarar den nivå på språkkunskaper som krävs för medborgarskap, det vill säga B1 enligt skalan i den gemensamma europeiska referensramen för språk. Medborgarskapsprovet försätter således inte sökande i olikvärdig ställning på basis av en nivå på språkkunskaper som överskrider den lagstadgade nivån. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Enligt förslaget krävs det inte att barn, det vill säga personer under 18 år, påvisar samhällskunskap. Alla barn som är permanent bosatta i Finland är läropliktiga tills de fyller 18 år. Dessutom är barn oftast medsökande i föräldrarnas ansökningar. Om den medsökande fyller 18 år innan ansökan avgörs, förutsätts inte att personen separat påvisar samhällskunskap.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Den samhällskunskap som krävs kan också påvisas med en studentexamen som avlagts på finska eller svenska. I gymnasieutbildningen som föregår studentexamen ingår studier i samhällslära och det är inte nödvändigt att kräva att den som avlagt studierna i fråga också avlägger medborgarskapsprovet. Syftet med samhällsläran i gymnasiet är att ge den studerande förutsättningar att utvecklas till en medborgare med intresse för samhällsfrågor och läroämnets värdegrund präglas av demokratiska principer såsom jämlikhet och respekt för de mänskliga rättigheterna. Den som avlagt studentexamen har således påvisat den kunskap om samhället som krävs för medborgarskap.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Såväl läromedlet för medborgarskapsprovet som utarbetats på basis av läromedlet för samhällsorientering som frågorna i medborgarprovet som baserar sig på det omfattar ämnen såsom central lagstiftning i det finländska samhället samt grundläggande fri- och rättigheter och mänskliga rättigheter. Provet kan innehålla frågor om informationen i läromedlet, till exempel om jämlikhet, jämställdhet mellan könen samt om Finlands historia och kultur. Jämlikhet hör således till de ämnen som behandlas i medborgarskapsprovet och i det läromedel som används för det. Förberedelserna för medborgarskapsprovet kan därför ha en indirekt positiv inverkan på jämlikheten i och med att personen får mer kunskaper om ämnet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet är ett skriftligt prov där det utöver centrala kunskaper om samhället i praktiken i allmänhet förutsätts att de som avlägger provet förstår texten så att de kan välja rätt svarsalternativ på frågorna. Migrationsverket kan till exempel bevilja en person som anmält sig till provet tilläggstid vid provtillfället om personen har lämnat in en nödvändig redogörelse för sina lässvårigheter till verket. Syftet med specialarrangemangen vid provet är att trygga lika möjligheter att avlägga provet för dem som är intresserade av att ansöka om medborgarskap. I förberedelserna för provet främjas likabehandling av att en del av dem som är intresserade av medborgarskap har deltagit i samhällsorientering och studerat de ämnen som ingår i den som kommunens integrationskunder.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Hälsotillståndets och funktionsnedsättningens inverkan på provet har beaktats på två sätt i propositionen. Migrationsverket kan på begäran av en person som anmält sig till provet bevilja specialarrangemang vid provtillfället genom vilka bland annat personer med funktionsnedsättning kan avlägga medborgarskapsprovet på lika villkor som andra. Dessutom kan man enligt förslaget avvika från samhällskunskapsvillkoret om den sökandes hälsotillstånd eller funktionsnedsättning under en lång tid hindrar personen från att uppfylla kravet. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Personer som inte är läs- och skrivkunniga och som avses i 18 b&nbsp;§ 2 och 3 mom. i medborgarskapslagen kan genom specialarrangemang avlägga medborgarskapsprovet muntligt. Det finska eller svenska språket som används i det muntliga provet anpassas till exempel till en form som till sin struktur är mer begriplig än allmänspråket. På så sätt beaktas att en person som inte är läs- och skrivkunnig endast förutsätts ha muntliga språkkunskaper för att förvärva medborgarskap. Läromedlet för medborgarskapsprovet ska också finnas tillgängligt i ett format så att man kan förbereda sig för provet genom att lyssna på materialet. Medborgarskapsprovet motsvarar till sitt innehåll innehållet i den samhällsorientering som avses i 25&nbsp;§ i integrationslagen. Kommunen ska i mån av möjlighet ordna samhällsorientering för integrationskunder på deras modersmål eller på språk som de annars har goda kunskaper i. Åtminstone en del av de icke läs- och skrivkunniga personer som avses i 18 b § 2 och 3 mom. har genomgått samhällsorientering eller deltagit i någon annan utbildning där det finländska samhället har behandlats. Dessutom är det möjligt att under en boendetid på åtta år avlägga även andra utbildningar som syftar till att öka samhällskunskapen samt förbättra läs- och skrivfärdigheterna och språkkunskaperna.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Även det att de som deltar i det kommande provet har olika bostadsorter beaktas. När avtal om anordnande av medborgarskapsprov ingås bör man enligt förslaget beakta att det regionalt finns tillräckligt många provtillfällen. Av deltagaren kan för att avlägga medborgarskapsprovet förutsättas en resa som kan anses skälig. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">I propositionen föreslås inga ändringar i fråga om hörande av barn, utan bestämmelserna om hörande av barn och vårdnadshavare i 5 § i medborgarskapslagen förblir oförändrade. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rösträtt och rätt till inflytande\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Enligt 14 § i grundlagen har varje finsk medborgare som fyllt aderton år rätt att rösta i statliga val och folkomröstningar. Varje finsk medborgare och varje i Finland bosatt medborgare i Europeiska unionen som har fyllt aderton år har rätt att rösta vid val till Europaparlamentet enligt vad som bestäms genom lag. Varje finsk medborgare och varje i Finland stadigvarande bosatt utlänning som har fyllt aderton år har rätt att rösta i kommunalval och kommunala folkomröstningar enligt vad som bestäms genom lag. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Rätten att rösta i statliga val och folkomröstningar har begränsats till endast finska medborgare. Vissa rösträtter och rättigheter till inflytande kan även i fortsättningen förvärvas när förutsättningarna för förvärv av medborgarskap uppfylls. I denna proposition föreslås att förutsättningarna i fråga utökas med ett samhällskunskapsvillkor. För att uppfylla samhällskunskapsvillkoret bör man oftast avlägga medborgarskapsprovet, som man förbereder sig för på förhand genom att studera läromedlet. Det nya villkoret för naturalisation och medborgarskapsprovet kan påverka möjligheterna för medborgare i tredjeländer att förvärva finskt medborgarskap och därmed också medborgarskap i EU och de rättigheter som detta medför. Det krävs inte finskt medborgarskap för att delta i områdes- och kommunalval, och därför påverkar propositionen till denna del inte tillgodoseendet av rösträtten och rätten till inflytande.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rörelsefrihet och skydd mot utvisning\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Enligt 9&nbsp;§ i grundlagen har finska medborgare samt utlänningar som lagligen vistas i landet rätt att röra sig fritt inom landet och att där välja bostadsort. Enligt paragrafens 2&nbsp;mom. har var och en rätt att lämna landet. Denna rätt kan begränsas genom lag, om det är nödvändigt för att säkerställa rättegång eller verkställighet av straff eller för att säkerställa att skyldigheten att försvara landet fullgörs. Enligt paragrafens 3&nbsp;mom. får finska medborgare inte hindras att resa in i landet, landsförvisas eller mot sin vilja utlämnas eller föras till ett annat land. Genom lag kan dock föreskrivas att finska medborgare får utlämnas eller föras till ett land där deras mänskliga rättigheter och rättssäkerhet kan garanteras, när åtgärden vidtas med anledning av brott eller när syftet med den är rättegång eller verkställighet av ett beslut som gäller vårdnad om eller vård av barn. Enligt paragrafens 4&nbsp;mom. regleras rätten för utlänningar att resa in i Finland och att vistas i landet genom lag. En utlänning får inte utvisas, utlämnas eller återsändas, om han eller hon till följd härav riskerar dödsstraff, tortyr eller någon annan behandling som kränker människovärdet.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Det finns flera rättigheter i anslutning till rörelsefriheten som inte begränsats till endast finska medborgare. De ändringar som föreslås gällande förvärv av medborgarskap påverkar till stor del således inte tillgodoseendet av de rättigheter som ingår i rörelsefriheten. De ändringar som föreslås i fråga om villkor för naturalisation påverkar dock möjligheterna att få tillgång till de rättigheter som en finsk medborgare har. Medborgarskap ger medborgaren rätt att resa in i landet och skydd mot utvisning. I denna proposition föreslås ett nytt samhällskunskapsvillkor som den sökande i fortsättningen ska uppfylla för att få de rättigheter som ett finskt medborgarskap ger. De föreslagna ändringarna påverkar också indirekt till exempel möjligheterna att få ett finskt pass.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tillgodoseende av rättsskyddet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Enligt 21 § i grundlagen har var och en rätt att på behörigt sätt och utan ogrundat dröjsmål få sin sak behandlad av en domstol eller någon annan myndighet som är behörig enligt lag samt att få ett beslut som gäller hans eller hennes rättigheter och skyldigheter behandlat vid domstol eller något annat oavhängigt rättskipningsorgan. Offentligheten vid handläggningen, rätten att bli hörd, rätten att få motiverade beslut och rätten att söka ändring samt andra garantier för en rättvis rättegång och god förvaltning ska tryggas genom lag. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ett centralt sätt att påvisa samhällskunskap enligt denna proposition är ett nytt medborgarskapsprov vars läromedel baserar sig på läromedel som utarbetats för samhällsorientering enligt integrationslagen och som avläggs genom att deltagaren väljer de rätta svaren på provfrågo
