oa-sivustosta/saavutettavuusseloste/",expanded:null},name:"Saavutettavuusseloste",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"saavutettavuusseloste",url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",changed:null,created:null,startPublish:"2026-03-19T07:20:56Z",stopPublish:null,saved:null,status:null,teaserTitle:"Saavutettavuusseloste",teaserText:"Eduskunta haluaa taata kaikille yhdenvertaisen mahdollisuuden asioida sähköisissä palveluissaan. Verkkosivustoa koskee laki digitaalisten palvelujen tarjoamisesta, jonka mukaan julkisten verkkopalvelujen tulee olla saavutettavia. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Tietosuojaselosteet",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:{contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:null},name:"Tietosuojaselosteet",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"tietosuojaselosteet",url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",changed:null,created:null,startPublish:"2025-04-03T11:57:48Z",stopPublish:null,saved:null,status:null,teaserTitle:"Tietosuojaselosteet",teaserText:"Eduskunnan tietosuojaselosteissa kerrotaan muun muassa henkilötietojen käsittelyn tarkoituksesta, mihin tietoja säännönmukaisesti luovutetaan, miten kauan henkilötietoja säilytetään.",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/sivukartta/",title:null,target:null,text:"Sivukartta",contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:{contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:null},name:"Sivukartta",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sivukartta",url:"/fi/tietoa-sivustosta/sivukartta/",changed:null,created:null,startPublish:"2026-03-19T11:01:19Z",stopPublish:null,saved:null,status:null,teaserTitle:"Sivukartta",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/fi/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"_self",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"_self",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"_self",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"_self",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"_self",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"_self",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"_self",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"_self",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/fi/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"_self",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"_self",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"_self",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"_self",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"_self",contentLink:"1796"},{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"_self",contentLink:"18"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"_self",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"_self",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"_self",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"_self",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/fi/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"_self",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"_self",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"_self",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"_self",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"_self",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/fi/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"_self",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/fi/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"_self",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"_self",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"_self",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"1659"},{children:[],relatedContent:[],name:"EU-tiedonlähteet ja asiakirjat",teaserText:"Tämä sivu kokoaa keskeiset Euroopan unionia koskevat tiedonlähteet sekä ohjeet EU-asiakirjojen ja tietokantojen käyttöön. Tavoitteena on helpottaa EU-asioihin liittyvän virallisen aineiston löytämistä sekä mahdollistaa tiedon hakeminen Euroopan unionista yleisesti ja eri aihealueilta. \n\nLinkit johtavat ensisijaisesti EU:n virallisiin lähteisiin ja virastojen verkkosivuille. Jos suomenkielistä sisältöä ei ole saatavilla, linkki ohjaa englanninkieliselle sivulle. Kaikki linkit avautuvat uuteen välilehteen.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-tiedonlahteet-ja-asiakirjat/",selected:false,targetFrame:"_self",contentLink:"8196"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/fi/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"_self",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. Vanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/fi/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"_self",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/fi/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"_self",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/fi/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"_self",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/fi/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/fi/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/fi/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/fi/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/fi/asiat-ja-aanestykset/",selected:false,targetFrame:"_self",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/fi/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"_self",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/fi/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"_self",contentLink:"3513"},{children:[],relatedContent:[],name:"Tulevien viikkojen täysistuntosuunnitelma",teaserText:"Tältä sivulta löydät eduskunnan tulevien täysistuntojen istuntosuunnitelman. Suunnitelmassa esitetään täysistuntojen ajankohdat sekä tiedossa olevat käsiteltävät asiat. Aikatauluihin ja sisältöihin voi tulla muutoksia.",url:"/fi/taysistunnot-ja-tapahtumat/tulevien-viikkojen-taysistuntosuunnitelma/",selected:false,targetFrame:"_self",contentLink:"10183"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/fi/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"_self",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"_self",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"_self",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"_self",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/fi/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"_self",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"_self",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"_self",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"_self",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"_self",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"_self",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"_self",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"_self",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"_self",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"_self",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"_self",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"_self",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"_self",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"_self",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"_self",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"_self",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"_self",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/fi/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"_self",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"_self",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"_self",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"_self",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. \nOpastuksen aikana opas kertoo eduskunnan toiminnasta, eduskunnan tehtävistä, kansanedustajan työstä ja Eduskuntatalon keskeisimmistä tiloista.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/fi/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"_self",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/fi/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"_self",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"_self",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"_self",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"_self",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"_self",contentLink:"64"}],relatedContent:[{children:[],relatedContent:[],name:"Ota yhteyttä kansanedustajaan",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Katso täysistuntosuunnitelma ja muut tapahtumat",teaserText:null,url:"/fi/?epsremainingpath=taysistunnot-ja-tapahtumat",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/avoin-data",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null}],name:"Vieraile ja osallistu",teaserText:"Eduskuntatalo on avoin vierailijoille. Voit varata paikan opastetulle kierrokselle varauspalvelun kautta. Voit myös seurata eduskunnan täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä tilaisuuksina suorana verkossa. Jokaisella on mahdollisuus vaikuttaa päätöksentekoon. Voit keskustella ja kertoa mielipiteesi, kun uusia lakeja suunnitellaan.",url:"/fi/vieraile-ja-osallistu/",selected:false,targetFrame:"_self",contentLink:"50"}],subMenuItems:[],breadcrumbItems:[{name:"Eduskunta",teaserText:null,url:"/fi/",selected:true,targetFrame:"_self",contentLink:null}],languageMenuItems:[{name:"en",url:"/en/"},{name:"sv",url:"/sv/"}],alternateLanguages:[{name:"en",url:"/en/"},{name:"sv",url:"/sv/"},{name:"fi",url:"/fi/"}],headerFooter:{headerLinks:[{name:"Verkkolähetykset ja videot",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/",selected:false,targetFrame:"_blank",contentLink:null},{name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:"_top",contentLink:null},{name:"Avoin data",teaserText:null,url:"/fi/?epsremainingpath=%2Favoin-data",selected:false,targetFrame:null,contentLink:null},{name:"Medialle",teaserText:null,url:"/fi/medialle/",selected:false,targetFrame:null,contentLink:null}],footerShortcutLinks:[{name:"Ota yhteyttä tai tule vierailulle",teaserText:null,url:"/fi/ota-yhteytta-tai-tule-vierailulle/",selected:false,targetFrame:null,contentLink:null},{name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null},{name:"Puhemiehet",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:null,contentLink:null},{name:"Hae eduskunnan aineistoja",teaserText:null,url:"/fi/haku/",selected:false,targetFrame:null,contentLink:null}],footerSocialMediaLinks:[{name:"Facebook",teaserText:null,url:"https://www.facebook.com/suomeneduskunta",selected:false,targetFrame:"_blank",contentLink:null},{name:"Flickr",teaserText:null,url:"https://www.flickr.com/photos/finnishparliament",selected:false,targetFrame:"_blank",contentLink:null},{name:"Instagram",teaserText:null,url:"https://www.instagram.com/eduskunta_riksdagen/?hl=fi",selected:false,targetFrame:"_blank",contentLink:null},{name:"LinkedIn",teaserText:null,url:"https://www.linkedin.com/company/12304/",selected:false,targetFrame:"_blank",contentLink:null},{name:"X",teaserText:null,url:"https://twitter.com/SuomenEduskunta",selected:false,targetFrame:"_blank",contentLink:null},{name:"Youtube",teaserText:null,url:"https://www.youtube.com/user/SuomenEduskunta",selected:false,targetFrame:"_blank",contentLink:null}],footerSiteLinks:[{name:"Anna palautetta sivustosta",teaserText:null,url:"mailto:verkkosivut@eduskunta.fi",selected:false,targetFrame:"_blank",contentLink:null},{name:"Evästeet",teaserText:null,url:"/fi/tietoa-sivustosta/evasteet/",selected:false,targetFrame:null,contentLink:null},{name:"Käyttöehdot",teaserText:null,url:"/fi/tietoa-sivustosta/kayttoehdot-ja-kayttosaannot/",selected:false,targetFrame:null,contentLink:null},{name:"Asiakirjajulkisuuskuvaus",teaserText:null,url:"/fi/tietoa-sivustosta/asiakirjajulkisuuskuvaus/",selected:false,targetFrame:null,contentLink:null},{name:"Saavutettavuusseloste",teaserText:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",selected:false,targetFrame:null,contentLink:null},{name:"Tietosuojaselosteet",teaserText:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",selected:false,targetFrame:null,contentLink:null},{name:"Sivukartta",teaserText:null,url:"/fi/tietoa-sivustosta/sivukartta/",selected:false,targetFrame:null,contentLink:null}]},staticRoutes:{}},anchors:[],shortcutUrl:null,teaserTitle:"",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null},exactPathContent:void 0,featureFlags:["asiakirjojen-laaja-haku","puheenvuorojen-laaja-haku","kielivalinta","aanestyssivu","aanestysten-laaja-haku","sivujen-laaja-haku","tiedotteiden-laaja-haku","www2-redirect"],featureFlagsEnabledByDefault:false,cookieConsent:void 0},uses:{url:1}},{type:"data",data:{asiakirja:"\u003Cdiv class=\"VaskiPage2020\" id=\"VaskiPage\">\n \u003Cdiv id=\"TalousarvioMietinto\" class=\"TalousarvioMietinto Talousarviokirjelma2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Valiokunnan mietintö\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;VaVM&nbsp;\u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">19\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp\u003C/span>\u003C/span>\u003Cspan class=\"edk-Vireilletulo\">\u003Cspan class=\"edk-EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20102%2F2026%20vp\">HE 102/2026 vp\u003C/a>\u003C/span>\u003Cspan class=\"edk-EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20112%2F2026%20vp\">HE 112/2026 vp\u003C/a>\u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle vuoden 2026 toiseksi lisätalousarvioksi\u003C/span>\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle vuoden 2026 toisen lisätalousarvioesityksen (HE 102/2026 vp) täydentämisestä\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv id=\"AsiaKuvaus\" class=\"AsiaKuvaus\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">JOHDANTO\u003C/h2>\n   \u003Cdiv class=\"VireilletuloAsia\">\n    \u003Ch3 class=\"LihavaKursiiviOtsikkoTeksti\">Vireilletulo\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Hallituksen esitys eduskunnalle vuoden 2026 toiseksi lisätalousarvioksi (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20102%2F2026%20vp\">HE 102/2026 vp\u003C/a>\u003C/span>): Asia on saapunut valtiovarainvaliokuntaan mietinnön antamista varten.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Hallituksen esitys eduskunnalle vuoden 2026 toisen lisätalousarvioesityksen (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20102%2F2026%20vp\">HE 102/2026 vp\u003C/a>\u003C/span>) täydentämisestä (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20112%2F2026%20vp\">HE 112/2026 vp\u003C/a>\u003C/span>): Asia on saapunut valtiovarainvaliokuntaan mietinnön antamista varten.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Valiokunta on käsitellyt esitykset yhdessä ja antaa niistä yhteisen mietinnön.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"YhdistettyAsia\">\n    \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Lisätalousarvioaloitteet\u003C/div>\n    \u003Cp class=\"KappaleKooste\">Valiokunta on käsitellyt esitysten yhteydessä aloitteet LTA 1—8/2026 vp. Aloiteluettelo on tämän asiakirjan liitteenä.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"Valiokuntakasittely\">\n    \u003Ch3 class=\"LihavaKursiiviOtsikkoTeksti\">Jaostovalmistelu\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Asia on valmisteltu asiayhteyden mukaisesti kaikissa valtiovarainvaliokunnan jaostoissa.&nbsp;\u003C/p>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv class=\"TalousarvioPerusteluOsaYleisetPerustelut\" id=\"TalousarvioPerusteluOsaYleisetPerustelut\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">VALIOKUNNAN YLEISPERUSTELUT\u003C/h2>\n   \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n    \u003Cp class=\"KappaleKooste\">Vuoden 2026 toisessa lisätalousarvioesityksessä varsinaisten tulojen arviota korotetaan 131 milj. eurolla ja määrärahoja lisätään 430 milj. eurolla. Valiokunta nostaa esiin merkittävimpiä muutosesityksiä seuraavasti:&nbsp;\u003C/p>\n    \u003Cdiv class=\"RiviotsikkoTeksti\">Tuloarviot.\u003C/div>\n    \u003Cp class=\"KappaleKooste\">Arvonlisäveron kertymää esitetään nostettavaksi 122 milj. eurolla. Sekalaisten tulojen arviota korotetaan nettomääräisesti 113 milj. eurolla, mihin sisältyy muun muassa päästöoikeuksien huutokauppatuloarvion alentaminen sekä korotuksia arvioituihin EU:lta saataviin tuloihin. Osinkotuloja ja omaisuuden myyntituloja esitetään alennettavaksi yhteensä 72 milj. eurolla. Arviota osinkotulosta alennetaan, mutta toisaalta Fingrid Oyj:n osakemyynnit lisäävät tuloja 62 milj. euroa. Lisäksi Suomen Pankin tuloutus ja Senaatti-kiinteistöjen tuloutus poistetaan vuodelta 2026, mikä alentaa tuloja yhteensä 41,4 milj. euroa. Metsähallituksen tuloutusta korotetaan 10 milj. eurolla.&nbsp;\u003C/p>\n    \u003Cdiv class=\"RiviotsikkoTeksti\">Määrärahat.\u003C/div>\n    \u003Cp class=\"KappaleKooste\">Lisätalousarvioesitykseen sisältyy hallituksen kevään kehysriihessä linjaamia työllisyystoimia. Nuorten rekrytointitukeen esitetään 20 milj. euroa, mikä riittäisi noin 3&nbsp;300 työttömän nuoren työllistämiseen. Nuorisotyöttömyyden ehkäisemisen pilotteihin kohdennetaan 15 milj. euroa ja lisäksi 20 milj. euroa kohdennetaan pitkäaikaistyöttömien osaamissetelistä aiheutuviin kustannuksiin. Valtionhallinnon kesätyöntekijöiden ja harjoittelijoiden lisärekrytointiin esitetään 4 milj. euroa.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Edelleen kehysriihen linjauksen mukaisesti energiatehokkuutta parantavan korjausrakentamisen avustuksiin ja niiden hallinnointiin osoitetaan 25 milj. euroa. Määrärahalisäys liittyy kaikkiaan 110 milj. euron määräaikaiseen kokonaisuuteen, jolla tavoitellaan suunnitteilla olevien remonttien nopeuttamista sekä uusia korjaushankkeita.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Droonitorjuntakyvyn vahvistamiseen esitetään noin 50 milj. euroa sisäministeriön hallinnonalalle ja kokonaisuutta käsitellään momentin 26.20.70 yhteydessä. Lisäksi hallitus täydensi esitystään maataloudessa käytettyjen eräiden energiatuotteiden 10 milj. euron tilapäisellä valmisteveron lisäpalautuksella.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Esitykseen sisältyy myös useita määrärahojen tarvearvioiden tarkennuksia. Esimerkiksi pakolaisten ja turvapaikanhakijoiden vastaanottoon sekä vastaanoton asiakkaille maksettaviin tukiin esitetään yhteensä 82 milj. euron määrärahalisäystä, mikä aiheutuu maahanmuuttoa koskevan ennusteen päivityksestä sekä sen mukaisesta vastaanoton piirissä olevien henkilöiden arvioidun määrän kasvusta. Valiokunnan saaman selvityksen mukaan ukrainalaisten osuus on tässä kokonaisuudessa keskeinen. Toisaalta EU-jäsenmaksujen määrärahan tarvearviota alennetaan 106 milj. eurolla ja uusiutuvan energian tuotantotuen tarvearviota 69 milj. eurolla.&nbsp;\u003C/p>\n    \u003Cdiv class=\"RiviotsikkoTeksti\">Tilaus- ja takausvaltuudet.\u003C/div>\n    \u003Cp class=\"KappaleKooste\">Hallitus esittää puolustusministeriön hallinnonalalla PVKEH2026 -tilausvaltuuden enimmäismäärään lisäystä 1&nbsp;057 milj. eurolla materiaalihankintoihin, jotka ajoittuvat vuosille 2026—2028. Ukrainaan toimitettuun 31. tukipakettiin sisältyneen puolustusmateriaalin korvaaviin hankintoihin tarkoitettua Ukrainan tukemisen tilausvaltuutta esitetään korotettavan 96,8 milj. eurolla. Lisätalousarvioesitykseen sisältyy myös useita liikennehankevaltuuksia, joita tarkastellaan momentin 31.10.77 yhteydessä.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Suomen arkkitehtuuri- ja designmuseota varten esitetään 58,5 milj. euron takausvaltuutta. Takaus on ehdollinen Helsingin kaupungin vastaavan suuruiselle takaukselle tai muulle vastuunotolle.&nbsp;\u003C/p>\n    \u003Cdiv class=\"ValiotsikkoKooste\">\n     \u003Cspan class=\"KursiiviTeksti\">Tasapaino, velka ja jakamaton varaus\u003C/span>&nbsp;\n    \u003C/div>\n    \u003Cp class=\"KappaleKooste\">Vuoden 2026 toinen lisätalousarvioesitys lisää valtion nettolainanoton tarvetta 299 milj. eurolla. Vuoden 2026 nettolainanotoksi arvioidaan noin 11,1 mrd. euroa. Jos lakkautetun Valtion asuntorahaston jäljellä olevan kassan tulouttaminen valtion budjettiin jätetään huomioimatta, on alijäämä 13,4 mrd. euroa. Budjetoidun valtionvelan määrän arvioidaan olevan noin 201 mrd. euroa vuoden 2026 lopussa, mikä on noin 69,5 prosenttia suhteessa bruttokansantuotteeseen. Kun huomioidaan kehysmenojen lisäys ja kehyksen rakennemuutokset, jää kuluvan vuoden jakamattomaksi varaukseksi 39 milj. euroa.&nbsp;\u003C/p>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv class=\"TalousarvioPerusteluOsaYksityiskohtaisetPerustelut\" id=\"TalousarvioPerusteluOsaYksityiskohtaisetPerustelut\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">VALIOKUNNAN YKSITYISKOHTAISET PERUSTELUT\u003C/h2>\n   \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n    \u003Ch3 class=\"TalousarvioLukuOtsikko \">\u003Cspan class=\"edk-OtsikkoTeksti\">MÄÄRÄRAHAT\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 26\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">SISÄMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rajavartiolaitos\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">70.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Rajavartiolaitoksen investoinnit\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 5&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Hallituksen esitykseen sisältyy yhteensä 50,2 milj. euron lisäys Suomen droonipuolustuksen vahvistamiseen. Tästä kohdennetaan Rajavartiolaitokselle 44 milj. euroa käsiteltävällä momentilla ja poliisille 6,2 milj. euroa momentilla 26.10.01.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Valiokunta on tyytyväinen esitettyyn lisäykseen. Rajavartiolaitos tehostaa määrärahalla droonien havaitsemista, tunnistamista, torjuntaa ja viranomaisyhteistyötä. Tavoitteena on rakentaa kattava ja monikerroksinen vastadroonijärjestelmä, joka muodostuu kiinteästä valvonta- ja vaikuttamisjärjestelmästä itärajalla ja rannikolla sekä liikkuvasta valtakunnallisesta torjuntakyvystä. Poliisi puolestaan kehittää kykyä muun muassa miehittämättömien ilma-alusten havaitsemiseen ja paikantamiseen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Valiokunta korostaa, että droonitorjunnan kehittäminen, hankinnat ja suorituskykyjen käyttö on tärkeää koordinoida Puolustusvoimien, Rajavartiolaitoksen ja poliisin välisenä moniviranomaisyhteistyönä. Tällä varmistetaan resurssien ja suorituskykyjen tehokas käyttö. Valiokunta viittaa myös kehysmietintöönsä (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/VaVM%2014%2F2026%20vp\">VaVM 14/2026 vp\u003C/a>\u003C/span> — \u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/VNS%203%2F2026%20vp\">VNS 3/2026 vp\u003C/a>\u003C/span>) ja pitää tärkeänä varautumisen sekä valmiuden resurssien vahvistamista. Tärkeää on niin ikään kiirehtiä droonivaroitusjärjestelmän valmistumista, jotta varmistetaan väestön oikea-aikainen tiedottaminen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Valiokunta nostaa lisäksi esiin momentille esitettävän 0,17 milj. euron lisäyksen Rajavartiolaitokselle miehittämättömien valvontajärjestelmien hankintaan ja käyttöönottoon perustetun hankkeen (UXV30-hanke) toimeenpanoon. Hanke on merkittävä, ja se toteutetaan pääosin (90 prosenttisesti) EU:lta saatavalla 18 milj. euron rahoituksella.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 31\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">LIIKENNE- JA VIESTINTÄMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">10.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikenne- ja viestintäverkot\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">77.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Väyläverkon kehittäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Lisätalousarvioesitykseen sisältyy useita uusia liikennehankevaltuuksia sekä aiempien valtuuksien korotuksia. Hallituksen investointiohjelmasta rahoitettavat hankevaltuudet kasvavat yhteensä 42,8 milj. eurolla. Sotilaallisen liikkuvuuden hankkeisiin kohdennetaan uutta valtuutta tai aiemman valtuuden korotusta yhteensä lähes 133 milj. euroa. Lisäksi uuden jäänmurtajan hankinnan valtuutta esitetään korotettavaksi 70 milj. eurolla 240 milj. euroon.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Hallituksen esityksessä on monia tärkeitä sotilaallisen liikkuvuuden hankkeita. Valiokunnan saaman selvityksen mukaan näiden hankkeiden kansallinen rahoitus katetaan niin sanotusta sitomattomasta määrärahasta, mikä käytännössä tarkoittaa Digiradan rahoitusvarausta ja viivästyttää hanketta. Rautatieliikenteen kulunvalvontajärjestelmän ja turvalaitteiden modernisoinnin ja peruskorjauksen valmistuminen myöhentyy 2040-luvun alkupuolelle.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Valiokunta on huolestunut (kuten \u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/VaVM%2014%2F2026%20vp\">VaVM 14/2026 vp\u003C/a>\u003C/span>) siitä, että uudet sotilaallisen liikkuvuuden hankkeet rahoitetaan liikennehankkeiden määrärahakehyksen sisältä. Tämä kaventaa jo nykyisellään vähäistä liikkumatilaa ja vaikuttaa muiden liikennehankkeiden etenemiseen. Erityisen huolestunut valiokunta on Digirata-hankkeen viivästymisestä, sillä kulunvalvonta- ja turvalaitteiden uudistamisella taataan turvallista ja mahdollisimman häiriötöntä rautatieliikennettä sekä mahdollistetaan rautatieverkon kapasiteetin kasvattamista.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Valiokunta kiinnittää huomiota myös siihen, että hankkeiden kustannusarvioiden tulee jo hankkeista päätettäessä vastata paremmin todellista tarvetta. Useiden väylähankkeiden kustannusarvio on nyt noussut merkittävästi suhteessa alun perin budjetoituun valtuuteen.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 33\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">SOSIAALI- JA TERVEYSMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">60.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sosiaali- ja terveydenhuollon tukeminen\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n        \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">35.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtionosuus korkeakouluopiskelijoiden terveydenhuoltoon \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n        \u003Cp class=\"KappaleKooste\">Valiokunnan saaman selvityksen mukaan vuodelta 2025 siirtyneen määrärahan käytön yhteyteen oli virheellisesti esitetty enintään-erä. Valiokunta korjaa momentin päätösosaa siten, että enintään-erä poistetaan. Tosiasiallisesti valtionavustuspäätös tehdään kuitenkin korkeintaan 250&nbsp;000 eurolle.&nbsp;\u003C/p>\n        \u003Cdiv class=\"TalousarvioPaatosOsa\">\n         \u003Cdiv class=\"ValiotsikkoKooste\">\n          \u003Cspan class=\"KursiiviTeksti\">Momentti muuttuu seuraavaksi:\u003C/span>&nbsp;\n         \u003C/div>\n         \u003Cdiv class=\"TalousarvioKappaleKooste\">\n          Momentin perusteluja täydennetään siten, että vuodelta 2025 siirtynyttä määrärahaa saa käyttää \u003Cspan class=\"KursiiviTeksti\">(poist.)\u003C/span> 250&nbsp;000 euroa Toivottua lastensaantia tukevan pilottihankkeen valtionavustusten maksamiseen YTHS:lle ja Väestöliitolle valtionavustuslain mukaisesti.&nbsp;\n         \u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n    \u003Ch3 class=\"TalousarvioLukuOtsikko \">\u003Cspan class=\"edk-OtsikkoTeksti\">YHTEENVETO\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Hallituksen esityksissä ehdotetaan määrärahoihin 430&nbsp;124&nbsp;000 euron lisäystä, tuloarvioihin (pl. nettolainanotto ja velanhallinta) 131&nbsp;486&nbsp;000 euron lisäystä ja nettolainanottoon ja velanhallintaan 298&nbsp;638&nbsp;000 euron lisäystä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettujen muutosten jälkeen olisivat kuluvan vuoden budjetoidut tuloarviot ja määrärahat varsinainen talousarvio ja lisätalousarviot huomioon ottaen 91&nbsp;697&nbsp;867&nbsp;000 euroa.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"PaatosOsa\" class=\"PaatosOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">VALIOKUNNAN PÄÄTÖSEHDOTUS\u003C/h2>\n   \u003Cdiv class=\"PaatosToimenpide\">\n    \u003Cp class=\"KappaleKooste\">Valtiovarainvaliokunnan päätösehdotus:&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">\n     \u003Cspan class=\"KursiiviTeksti\">Eduskunta hyväksyy hallituksen esitykseen HE 102/2026 vp ja sitä täydentävään hallituksen esitykseen HE 112/2026 vp sisältyvän ehdotuksen vuoden 2026 toiseksi lisätalousarvioksi edellä todetuin muutoksin.\u003C/span>&nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">\n     \u003Cspan class=\"KursiiviTeksti\">Eduskunta hylkää lisätalousarvioaloitteet LTA 1—8/2026 vp.\u003C/span>&nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">\n     \u003Cspan class=\"KursiiviTeksti\">Eduskunta päättää, että vuoden 2026 toista lisätalousarviota sovelletaan 1.7.2026 alkaen.\u003C/span>&nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"OsallistujaOsa\" class=\"OsallistujaOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingissä 22.6.2026&nbsp;\u003C/div>\n   \u003Cp class=\"JohdantoTeksti\">Asian ratkaisevaan käsittelyyn valiokunnassa ovat ottaneet osaa\u003C/p>\n   \u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">puheenjohtaja&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Markus&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Lohi&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">kesk&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">varapuheenjohtaja&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Saara&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Hyrkkö&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">vihr&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">jäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Otto&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Andersson&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">r&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">jäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Markku&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Eestilä&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">kok&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">jäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Seppo&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Eskelinen&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">jäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Janne&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Heikkinen&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">kok&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">jäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Timo&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Heinonen&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">kok&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">jäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Marko&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Kilpi&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">kok&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003
