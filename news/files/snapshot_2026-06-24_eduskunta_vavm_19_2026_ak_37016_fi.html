satietoTeksti\">(osittain)&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">varajäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Juha&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Mäenpää&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">ps&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">varajäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Saku&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Nikkanen&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"YhteisoTeksti\">varajäsen&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Henrik&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Wickström&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">r&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\n   \u003Cp class=\"JohdantoTeksti\">Valiokunnan sihteereinä ovat toimineet\u003C/p>\n   \u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">valiokuntaneuvos&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Mari&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Nuutila&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">valiokuntaneuvos&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Jonna&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Berghäll&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">valiokuntaneuvos&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Minna&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Tiili&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-1\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Vastalause 1 /sd\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Yleisperustelut\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Hallituksen esitys vuoden 2026 toiseksi lisätalousarvioksi osoittaa, että hallituksen talouspolitiikan kokonaisuus ei ole riittävä vastaamaan Suomen julkisen talouden, työllisyyden ja kasvun haasteisiin. Esityksessä varsinaisten tulojen arviota korotetaan 131 milj. eurolla ja määrärahoja lisätään 430 milj. eurolla. Valtion nettolainanoton tarve kasvaa 299 milj. eurolla, ja vuoden 2026 nettolainanotoksi arvioidaan noin 11,1 mrd. euroa. Jos Valtion asuntorahaston jäljellä olevan kassan tulouttaminen jätetään huomioimatta, budjettitalouden alijäämä on 13,4 mrd. euroa. Budjetoidun valtionvelan arvioidaan nousevan noin 201 mrd. euroon vuoden 2026 lopussa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">SDP:n valiokuntaryhmä pitää välttämättömänä, että julkista taloutta vahvistetaan uskottavasti ja oikeudenmukaisesti. Hallituksen linja ei kuitenkaan muodosta johdonmukaista kokonaisuutta. Hallitus on kohdistanut mittavia leikkauksia pienituloisiin, työttömiin, opiskelijoihin, lapsiperheisiin, järjestöihin sekä koulutukseen ja osaamiseen. Samaan aikaan hallitus on tehnyt ja valmistelee ratkaisuja, jotka heikentävät julkista taloutta pysyvästi ja kaventavat mahdollisuuksia pysyä EU:n korjaavalla nettomenopolulla.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Erityisen ongelmallinen on hallituksen päätös alentaa yhteisöveroa vuodesta 2027 alkaen. Yhteisöveron alennuksen staattinen vaikutus julkiseen talouteen on yli 800 milj. euroa vuodessa. Tämä on enemmän kuin vuodelle 2027 arvioitu lisäsopeutustarve korjaavalla nettomenopolulla pysymiseksi. Hallitus on näin samanaikaisesti kiristämässä arkea monilta kotitalouksilta ja heikentämässä valtion tulopohjaa kalliilla, yleisellä ja huonosti kohdennetulla veronalennuksella.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisätalousarvioon sisältyy joitakin perusteltuja yksittäisiä toimia. SDP pitää tärkeänä muun muassa nuorisotyöttömyyden torjuntaa, pitkäaikaistyöttömien osaamisen vahvistamista, energiatehokkuutta parantavaa korjausrakentamista sekä sisäisen turvallisuuden ja droonitorjuntakyvyn vahvistamista. Esitykseen sisältyy 20 milj. euroa nuorten rekrytointitukeen, 15 milj. euroa nuorisotyöttömyyden ehkäisemisen pilotteihin, 20 milj. euroa pitkäaikaistyöttömien osaamisseteliin ja 25 milj. euroa energiatehokkuutta parantavan korjausrakentamisen avustuksiin. Nämä toimet ovat kuitenkin mittaluokaltaan riittämättömiä suhteessa työllisyyden ja kasvun ongelmiin. Lisäksi hallituksen aiemmat toimet ovat suurelta osin epäonnistuneet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Nuorisotyöttömyyden nopea kasvu edellyttäisi hallitukselta selvästi vahvempaa kokonaisuutta. Nuorten rekrytointituki ja pilotit ovat oikeansuuntaisia, mutta eivät muuta sitä, että hallituksen aiemmat työvoimapolitiikan, koulutuksen ja sosiaaliturvan ratkaisut ovat heikentäneet monien nuorten tulevaisuuden mahdollisuuksia. Tarvitaan laajempi kokonaisuus, jossa vahvistetaan koulutuspolkuja ja helpotetaan osa-aikatyön vastaanottamista.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen nuorille suunnattujen toimien ongelmana ei ole ainoastaan niiden riittämätön mittaluokka, vaan myös toimeenpanon ja vaikuttavuuden epävarmuus. Nuorten työllistymissetelin käyttöaste on jäänyt hallituksen tavoitteisiin nähden matalaksi. Tämä kertoo siitä, että väline ei ole tavoittanut työnantajia ja nuoria riittävän tehokkaasti tai sen ehdot eivät ole olleet käytännössä riittävän toimivia. On ongelmallista, että hallitus lisää samaan välineeseen uutta rahoitusta ilman, että aiemman rahoituksen käyttöasteesta, kohtaanto-ongelmista ja vaikuttavuudesta on esitetty riittävää arviota.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Työllisyyspolitiikassa ei riitä, että määrärahoja osoitetaan muodollisesti oikeaan tarkoitukseen. Toimenpiteiden on myös johdettava tosiasiallisiin työllistymisiin. Jos tuki jää käyttämättä tai kohdentuu tilanteisiin, joissa työllistyminen olisi tapahtunut muutenkin, vaikutus julkiseen talouteen, nuorten työmarkkina-asemaan ja syrjäytymisen ehkäisyyn jää vähäiseksi. Hallituksen on varmistettava, että nuorten rekrytointituen ja pilottien toimeenpano on yksinkertaista, työnantajille aidosti kannustavaa ja nuoret tehokkaasti tavoittavaa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Myös pitkäaikaistyöttömyyden kasvu vaatii vaikuttavampia toimia. Pelkkä osaamisseteli ei riitä, jos työvoimapalveluiden resurssit, osaamisen kehittäminen ja työttömien yksilöllinen tuki eivät ole kunnossa. Hallituksen työmarkkinapolitiikka on painottunut työttömyysturvan leikkauksiin ja ehtojen kiristämiseen sen sijaan, että painopiste olisi aidosti työllistymistä edistävissä palveluissa, koulutuksessa ja työkyvyn tukemisessa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">SDP pitää välttämättömänä sisäisen turvallisuuden ja rajaturvallisuuden vahvistamista. Esityksen noin 50 milj. euron lisäys droonipuolustuksen vahvistamiseen on perusteltu turvallisuusympäristön muutoksen vuoksi. Samalla on huolehdittava siitä, että sisäisen turvallisuuden viranomaisten perusrahoitus, poliisin toimintakyky, pelastustoimi ja rajaturvallisuus eivät jää kertaluonteisten hankkeiden varaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisäys energia-avustuksiin on tervetullut, mutta rakennusalan tilanne olisi vaatinut jämäkämpiä toimia jo kolme vuotta aiemmin. On hyvä, että hallitus nyt tarttui vihdoin esittämäämme korjausrakentamisen tukipakettiin. Kokonaisuutena hallituksen asuntopoliittiset toimet ovat kuitenkin olleet täysin vääränsuuntaisia ajaessaan alas kohtuuhintaisen asuntotuotannon tulevaisuuden edellytyksiä, ja jättämällä huomiotta rakennusalan oikea-aikaiset tukitoimet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisätalousarvio vahvistaa kuvaa hallituksesta, joka reagoi yksittäisiin ongelmiin erillisillä lisäyksillä, mutta jonka talouspolitiikan peruslinja on ristiriitainen. Hallitus leikkaa kasvun ja hyvinvoinnin edellytyksiä, mutta samalla keventää pysyvästi verotusta tavalla, joka vaikeuttaa julkisen talouden vakauttamista. Tämä ei ole vastuullista finanssipolitiikkaa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">SDP:n mielestä julkista taloutta on vahvistettava tavalla, joka tukee kasvua, työllisyyttä ja oikeudenmukaisuutta. Hallituksen tulee luopua yhteisöveron alennuksesta tai korvata sen vaikutus täysimääräisesti pysyvillä julkista taloutta vahvistavilla toimilla. Samalla on panostettava vaikuttaviin työllisyystoimiin, osaamiseen, tutkimukseen ja tuottavuutta parantaviin investointeihin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme hyväksyttäväksi seuraavat lausumat:&nbsp;\u003C/p>\n     \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 1\u003C/div>\n     \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus korjaa talouspoliittista linjaansa siten, että julkista taloutta ei heikennetä pysyvillä ja huonosti kohdennetuilla toimilla, vaan hallitus tuo eduskunnalle kokonaisuuden, joka vahvistaa julkista taloutta, tukee kasvua ja työllisyyttä sekä varmistaa, ettei Suomi poikkea EU:n korjaavalta nettomenopolulta vuonna 2027.&nbsp;\u003C/div>\n     \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 2\u003C/div>\n     \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus varmistaa nuorten työllisyyttä ja pitkäaikaistyöttömien työllistymistä koskevien uusien toimenpiteiden vaikuttavuuden, seuraa niiden käyttöastetta ja työllisyysvaikutuksia ajantasaisesti sekä tuo eduskunnalle selvityksen siitä, miten toimenpiteiden toimeenpanoa, kohdentumista ja ehtoja korjataan, jos määrärahat eivät johda tavoiteltuihin työllistymisiin.&nbsp;\u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Ehdotus\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme,&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että ehdotus vuoden 2026 toiseksi lisätalousarvioksi hyväksytään valiokunnan mietinnön mukaisena ja&nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että edellä ehdotetut 2 lausumaa hyväksytään.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingissä 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Joona&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Räsänen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Seppo&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Eskelinen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Aki&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lindén&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Pia&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Viitanen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Lauri&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lyly&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Saku&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Nikkanen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-2\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Vastalause 2 /kesk\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Yleisperustelut\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Suomi on joutunut pääministeri Orpon hallituskauden aikana liiallisen alijäämän menettelyyn eli EU:n talouden tarkkailuluokalle.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sen sijaan, että hallitus pyrkisi tasapainottamaan julkista taloutta, lisätään nyt käsittelyssä olevassa lisätalousarviossakin menoja 430 milj. eurolla ja velanotto kasvaa puolestaan 299 milj. eurolla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Muun muassa pakolaisten ja turvapaikanhakijoiden vastaanottoon sekä vastaanoton asiakkaille maksettaviin tukiin ehdotetaan lisätalousarviossa yhteensä 82 milj. euron määrärahalisäystä. Tarvearvion nousu aiheutuu maahanmuuttoa koskevan ennusteen päivityksestä sekä sen mukaisesta vastaanoton piirissä olevien henkilöiden arvioidun määrän kasvusta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomen Pankin pääjohtaja Olli Rehn on todennut julkisuudessa, että hallituksen olisi perusteltua säätää finanssipolitiikan viritystä budjettiriihessä. Sen sijaan että finanssipolitiikkaa kevennettäisiin, se olisi hyvä mitoittaa neutraaliksi. Rehnin mukaan voimistuva talouskasvu vuonna 2027 antaa hyvän tilaisuuden toteuttaa julkista taloutta vahvistavia toimia, eikä tätä mahdollisuutta kannata hukata.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Julkisen talouden tervehdyttämisen sijaan hallitus on kertonut valmistevansa yhteisöveron alentamista siten, että muutos tulisi voimaan vuonna 2027. EU:n seuraamassa nettomenopolussa otetaan huomioon myös päätösperäiset veromuutokset, joten yhteisöveron alentaminen lisää vastaavasti muun sopeuttamisen tarvetta. Hallitus ei ole tehnyt tästä tarvittavia päätöksiä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Valtiovarainministeriön ja Suomen Pankin tämänhetkisten arvioiden perusteella nettomenopolulla pysyminen tarkoittaisi tämänhetkisten tietojen valossa noin 600 milj. euron lisäsopeutuksen tarvetta vuodelle 2027. Vuodelle 2028 korjausliikkeen tarve on VM:n arvion mukaan jo 2,7 mrd. euroa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Keskustan mielestä hallituksen on syytä jättää toteuttamatta yhteisöveron alentaminen. Hallituksen tulisi päinvastoin tehdä lisää julkista taloutta vahvistavia päätöksiä budjettiriihessään syyskuussa 2026. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen on syytä toimeenpanna osa lisäsopeutuksista jo kuluvan vuoden seuraavassa lisätalousarviossa ja loput sitten vuoden 2027 talousarvioesityksessä. Suomella ei ole nyt siihen varaa, että hallitus laskettelee loppukauden ja kieltäytyy talouden tervehdyttämisestä vaalien vuoksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Päättämällä tarvittavista uusista sopeutuksista varmistettaisiin, että Suomi ei ylitä EU:n nettomenopolkua vuonna 2027 ja samalla jaksotettaisiin sopeutustarvetta useamman vuoden ajalle, jolloin vuoden 2028 sopeutustarve ei kasvaisi kohtuuttoman suureksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme hyväksyttäväksi seuraavan lausuman:&nbsp;\u003C/p>\n     \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus\u003C/div>\n     \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että julkisen talouden tervehdyttämiseksi hallitus päättää viimeistään syksyn 2026 budjettiriihessä uusista lisäsopeutuksista vuosina 2026 ja 2027 voimaantulevaksi sekä valmistelee ja antaa eduskunnalle tarvittavat esitykset, joilla varmistetaan, ettei Suomi ylitä EU:n nettomenopolkua vuosien 2026 ja 2027 aikana, helpottaen samalla vuoden 2028 suureksi kasvanutta nettosopeutustarvetta.&nbsp;\u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Ehdotus\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme,&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että ehdotus vuoden 2026 toiseksi lisätalousarvioksi hyväksytään valiokunnan mietinnön mukaisena ja &nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että edellä ehdotettu lausuma hyväksytään.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingissä 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Markus&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lohi&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">kesk&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Mika&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lintilä&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">kesk&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Eeva&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Kalli&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">kesk&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-3\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Vastalause 3 /vihr\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Yleisperustelut\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Hallituksen vuoden 2026 toisessa lisätalousarvioesityksessä varsinaisten tulojen arviota korotetaan 131 milj. eurolla ja määrärahoja lisätään 430 milj. eurolla. Tämä lisää valtion nettolainanoton tarvetta 289 milj. eurolla, ja näin ollen nettolainanotoksi v. 2026 arvioidaan n. 11,1 mrd. euroa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomen taloutta vaivaa matalasuhdanne, jota hallituksen epäonnistunut työllisyys- ja kasvu- sekä kuluttajien luottamusta heikentävä politiikka on tarpeettomasti pitkittänyt. Velkasuhteen kasvaessa huolestuttavalla tavalla tulisi hallituksen ryhtyä lisätoimiin velkasuhteen vakauttamiseksi ja etenkin veropuolen toimien uudelleentarkastelemiseksi talouden tasapainon näkökulmasta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomea vaivaa lisäksi historiallisen korkea työttömyys, joka kohdistuu erityisen voimakkaasti nuoriin. Alle 30-vuotiaita työttömiä työnhakijoita oli joulukuussa 2025 yhteensä 80&nbsp;000. Vuoden 2025 viimeisen kvartaalin työttömyysaste oli koko väestön tasalla 9,8 prosenttia ja alle 25-vuotiaiden osalta vastaava luku oli 21 prosenttia.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Erityisen huolestuttavana voidaan pitää pitkäaikaistyöttömäksi jääneiden nuorten tilannetta. Vuosina 2008—2025 heidän osuutensa oli kasvanut 300 pitkäaikaistyöttömästä lähes 7&nbsp;000:een. Kehitys ei selity pelkästään suhdannevaikutuksilla. Nuorten tulevaisuususkon murentumiseen ja työllisyysnäkymien heikkenemiseen on puututtava nopeasti ja määrätietoisesti. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallituksen lisätalousarvioesitys on riittämätön vastaus Suomen julkisen talouden haasteisiin.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Yksityiskohtaiset perustelut\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">MÄÄRÄRAHAT\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 27\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">SISÄMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">40. Maahanmuutto\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">01. Maahanmuuttoviraston ja valtion vastaanottokeskusten toimintamenot\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Hallitus esittää 4,2 milj. euroa kansalaisuuslain muuttamisen mukaista kansalaisuuskoetta varten. Vihreät kyseenalaistaa kansalaisuuskokeen tavoitteiden toteutumisen ja tarkoituksenmukaisuuden tilanteessa, jossa kotoutumispalveluiden rahoitusta ja saatavuutta heikennetään. &nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Jo nykyisin voimassa olevat edellytykset kansalaisuudelle, kuten kahdeksan vuoden maassaolo, toimeentuloedellytys, nuhteettomuus ja yleisen kielitutkinnon läpäiseminen, luovat tiukat edellytykset kansalaisuuden hakemiselle. Kansalaisuushakemusten käsittelyaika on jo tällä hetkellä sekä lasten että aikuisten kohdalla Maahanmuuttovirastossa keskimäärin 34 kuukautta, ja kansalaisuuskoe pitkittäisi prosesseja entisestään. Lisäresurssin arvioidaan olevan tähän suhteutettuna riittämätön.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Lisäksi hallituksen ulkomaalaislain uudistusten kokonaisvaikutuksia on mahdotonta arvioida. Selvää on, että yhdessä ja erikseen ne lisäävät todennäköisyyttä sille, että Suomi ei onnistu tunnistamaan kaikkia heitä, jotka kansainvälistä suojelua tarvitsevat ja ovat siihen oikeutettuja.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Erityisen ongelmallista on, että muutokset voivat heikentää haavoittuvassa asemassa olevien henkilöiden, kuten lasten, ihmiskaupan uhrien, väkivallan uhrien, vammaisten henkilöiden ja vakavasti sairaiden henkilöiden asemaa. &nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan hyväksyttäväksi seuraavat lausumat:&nbsp;\u003C/p>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 1\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus peruu ulkomaalaislain kiristykset ja arvioi uudelleen kansalaisuuskokeen tarkoituksenmukaisuutta.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 2\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus varmistaa, että ulkomaalaislain muutokset eivät johda sellaisten henkilöiden maasta poistamiseen, joilla olisi oikeus ulkomaalaislain mukaiseen työperäisen hyväksikäytön uhrin oleskelulupaan.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 28\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">VALTIOVARAINMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">91. Työllisyyden ja elinkeinoelämän tukeminen\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">41. Energiaverotuki\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Hallituksen lisätalousarviota täydentävässä esityksessä \u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20112%2F2026%20vp\">HE 112/2026 vp\u003C/a>\u003C/span> lisätään yhteensä 10 milj. euroa vuodelle 2026 maatalouden energiaveron palautuksiin.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Maatalouden kannattavuuskriisi on todellinen ja vakava ongelma. Viljelijöiden toimeentulo, kotimainen ruoantuotanto ja huoltovarmuus edellyttävät politiikkaa, joka vahvistaa maatalouden pitkän aikavälin toimintaedellytyksiä. Tukea ei kuitenkaan pidä rakentaa tavalla, joka lisää riippuvuutta fossiilisista polttoaineista tai heikentää kannusteita siirtyä kohti vähäpäästöisempiä ratkaisuja.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Esityksen ongelmana on, että tuki kohdistuu lähes kokonaan polttoöljyn käyttöön. Hallituksen esityksen mukaan lisäpalautuksesta lähes 99 prosenttia koskisi kevyttä polttoöljyä ja sitä korvaavia biopolttoöljyjä. Käytännössä kyse on siten ensisijaisesti fossiilisen energiankäytön tukemisesta tilanteessa, jossa maatalouden pitäisi päinvastoin saada tukea energiatehokkuuden parantamiseen, polttoöljyn käytön vähentämiseen ja uusiutuviin ratkaisuihin siirtymiseen.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Maatalouden tukemiseen on etsittävä keinoja, jotka vahvistavat alan kannattavuutta ja huoltovarmuutta ilman, että samalla ylläpidetään fossiiliriippuvuutta. Tukea tulisi kohdentaa esimerkiksi energiatehokkuuteen, kotimaiseen uusiutuvaan energiaan, sähköistymiseen, biokaasuun ja muihin ratkaisuihin, jotka vähentävät tilojen energiakustannuksia pysyvästi ja tukevat samalla ilmastotavoitteita.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan hyväksyttäväksi seuraavat lausumat:&nbsp;\u003C/p>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 3\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus edistää maatalouden tukemista kustannuskriisissä energiaveron palautuksen sijaan tavalla, joka kannustaa alan toimijoita irtautumaan fossiilienergian käytöstä.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 29\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">OPETUS- JA KULTTUURIMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">80. Taide ja kulttuuri\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">50. Avustukset taiteen ja kulttuurin edistämiseen\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Taidetestaajat-ohjelma on seitsemän toimintavuotensa aikana mahdollistanut taidelähtöisen, yhteisöllisen ja yhteiskunnallisen kokemuksen käytännössä jokaiselle kahdeksasluokkalaiselle Hangosta Utsjoelle. Taidetestaajat-toiminta on kytkenyt toisiinsa taide- ja kulttuurikasvatusta, eri oppiaineita yhdistävää oppimista, yhteiskunnallista vaikuttamista ja kokemuksellisuutta.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Taidetestaajat-ohjelmaa ovat rahoittaneet Suomen Kulttuurirahasto ja Svenska kulturfonden, sekä opetus- ja kulttuuriministeriö. Taidetestaajatoiminta on näillä näkyminen päättymässä, mikäli valtio ei ota siitä pysyvää rahoitusvastuuta.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Suurissa kasvukeskuksissa lapsilla ja nuorilla on aivan erilaiset mahdollisuudet päästä taiteen ja kulttuurin äärelle. Yhteiskunnallisen tasa-arvon kannalta olisi kuitenkin tärkeää, että samoja kokemuksia olisi mahdollista saada asuinpaikasta riippumatta myös esimerkiksi maaseudulla asuville nuorille.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Aiheesta on jätetty lisätalousarvioaloite (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/LTA%207%2F2026%20vp\">LTA 7/2026 vp\u003C/a>\u003C/span>).&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan, &nbsp;\u003C/p>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">että momentille 29.80.50 lisätään 4&nbsp;000&nbsp;000 euroa Taidetestaajat-toimintaan.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 30\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">MAA- JA METSÄTALOUSMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cp class=\"KappaleKooste\">Poikkeuksellisen korkeassa nuorisotyöttömyyden tilanteessa valtion tulisi hyödyntää kaikki käytettävissä olevat keinot nuorten työllisyystilanteen kohentamiseksi. Toimenpiteet tulisi keskittää erityisesti pitkäaikaistyöttömien nuorten tilanteen parantamiseksi. &nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Vuosina 2010—2013 eduskunta myönsi hallituksen esityksestä yhteensä 4&nbsp;875&nbsp;00 euron määrärahoituksen Metsähallitukselle nuorten työllistämiseen ja valtioneuvoston nuorisotakuun toteuttamiseen. Määrärahan ansiosta Metsähallituksen luontopalvelut pystyivät tarjoamaan töitä yhteensä 343 työttömälle nuorelle. Tämä toimenpide olisi syytä ottaa uudelleen käyttöön.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan hyväksyttäväksi seuraavan lausuman:&nbsp;\u003C/p>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 4\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus antaa eduskunnalle esityksen nuorten työllistämiseksi Metsähallituksen luontopalveluihin.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 32\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">TYÖ- JA ELINKEINOMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cp class=\"KappaleKooste\">Valtiolla on vain vähän suoria keinoja kohentaa nuorten työllistyystilannetta. Siksi olemassa olevia keinoja täytyy käyttää tehokkaasti. Nuorisotyöttömyyden ollessa poikkeuksellisen korkealla tulisi julkisen rahan käyttöön lisätä enemmän vastikkeellisia elementtejä työllisyyden tukemiseksi. &nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Vihreät esittää mallia, jossa suoriin yritystukiin lisätään velvoittava elementti nuorten työllistämiseen liittyen. Velvoitteen voisi täyttää joko palkkaamalla nuoren ensimmäiseen työpaikkaansa tai tarjoamalla työtä yli vuoden työttömänä olleelle nuorelle.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan hyväksyttäväksi seuraavan lausuman:&nbsp;\u003C/p>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 5\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus valmistelee ja ottaa käyttöön mallin, jossa suoriin yritystukiin lisätään velvoittava elementti nuorten työllistämiseen liittyen.&nbsp;\u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">40. Yritysten erityisrahoitus \u003C/span>\u003C/h3>\n        \u003Cdiv class=\"ValiotsikkoTeksti\">60. Siirrot hallinnonalan rahastoihin\u003C/div>\n        \u003Cp class=\"KappaleKooste\">Hallitus esittää 10 milj. euron lisämäärärahaa huoltovarmuusrahastolle turpeen varmuusvarastointia varten. Asiantuntijalausunnoissa huomautetaan turpeen olevan rinnasteinen fossiilisiin polttoaineisiin ja sen olevan jopa kivihiiltäkin päästöintensiivisempää. Uutta turvetukea on vaikea perustella taloudellisesti tai ilmaston kannalta. Lisäksi se saattaa haitata päästökauppasektorin päästöjen suotuisaa kehitystä ja johtaa vastaavasti kalliisiin tai vaikeisiin päästövähennystoimiin muilla sektoreilla. Uutta valtion fossiilitukea ei voi tiukassa julkisen talouden tilanteessa perustella.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Turvealalla työskentelevien auttamiseen tarvitaan murrosaikana monenlaisia keinoja: luopumispakettia, apua yritystoiminnan suunnan muuttamiseen, uudelleenkoulutustukea, romutuspalkkiota ja niin edelleen. &nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Soiden ennallistamiseen käytetään samoja koneita kuin turvetuotannossa. Siksi joillekin turvealan yrittäjille tai työntekijöille voi löytyä korvaavia töitä ennallistamisen parista ja mahdollisuus hyödyntää jo olemassa olevaa kalustoa mahdollisimman pitkään. Turvealalla työskentelevillä on jo valmiiksi tarvittavat välineet sekä osaamista koneiden käyttöön. &nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan, &nbsp;\u003C/p>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">että momentilta 32.40.60 vähennetään 10&nbsp;000&nbsp;000 euroa huoltovarmuusrahaston turpeen varmuusvarastoinnista ja että hyväksytään seuraava lausuma:&nbsp;\u003C/div>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 6\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus edistää turvealan tuottajien reilua siirtymää tavalla, joka mahdollistaa tukea yritystoiminnan uudelleensuuntaamiseen ja sekä tuottajien että työntekijöiden uudelleenkouluttautumiseen.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">TULOARVIOT\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Osasto 13\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">KORKOTULOT, OSAKKEIDEN MYYNTITULOT JA VOITON TULOUTUKSET\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">05. Valtion liikelaitosten voiton tuloutukset\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">01. Valtion liikelaitosten voiton tuloutukset\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Hallitus esittää lisätalousarviossaan Metsähallituksen tuloutuksen kasvattamista 10 milj. eurolla. Hallitus on jo nostanut Metsähallituksen tuloutustavoitetta vuosien 2025 sekä 2026 talousarvioesityksissä. Viimeisimmän päätöksen, ennätyskorkeaksi nostetun 155 milj. euron tuloutustavoitteen, yhteydessä Metsähallitus itse myönsi päätöksen saattavan johtaa hakkuiden lisääntymiseen.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Hiilinielut ovat kansallisen ilmastopolitiikan kokonaisuuden kannalta merkittäviä. Hallituksen energia- ja ilmastopoliittisen selonteon (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/VNS%208%2F2025%20vp\">VNS 8/2025 vp\u003C/a>\u003C/span>) arvion mukaan Suomelle olisi syntymässä ensimmäisellä EU LULUCF -velvoitekaudella 110—115 Mt CO2-ekv. alijäämä, joka joustot huomioon ottaen olisi noin 84 Mt CO2-ekv. Alijäämä on mittakaavaltaan huolestuttava ja edellyttäisi hallitukselta pikaisia toimia hiilinielujen kasvattamiseksi. Nykyisillä toimilla hiilinielut uhkaavat kutistua entisestään muun muassa liiallisten hakkuumäärien vuoksi.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Ilmastopaneeli on esittänyt hiilinielujen romahtamisen keskisimmäksi syyksi liian suuria hakkuumääriä. Jotta Suomen ilmastotavoitteiden kannalta elintärkeät hiilinielut saadaan pelastettua, hakkuumääriä tulisi päin vastoin rajoittaa ja metsäteollisuuden arvonlisää nostaa. &nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan,&nbsp;\u003C/p>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">että momentilta 13.05.01 vähennetään 10&nbsp;000&nbsp;000 euroa Metsähallituksen tuloutuksesta ja että hyväksytään seuraava lausuma:&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 7\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus varmistaa, että tähän mennessä tehdyt päätökset tuloutuksen kasvattamisesta eivät johda hakkuumäärien kasvuun.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Ehdotus\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotan,&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että ehdotus vuoden 2026 toiseksi lisätalousarvioksi hyväksytään valiokunnan mietinnön mukaisena edellä todetuin muutoksin ja&nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että edellä ehdotetut 7 lausumaa hyväksytään.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingissä 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Saara&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Hyrkkö&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">vihr&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-4\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Vastalause 4 /vas\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Yleisperustelut\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Orpon hallitus on epäonnistunut kaikissa keskeisissä talouspolitiikan tavoitteissaan. Hallitusohjelman talouspoliittisia tavoitteita olivat muun muassa suomalaisten elintason parantaminen, työllisyyden nostaminen vähintään 100&nbsp;000 työllisellä ja julkisen talouden velkasuhteen kasvun pysäyttäminen, sekä sen saattaminen pitemmällä aikavälillä laskevalle uralle. Päinvastoin hallitusohjelman tavoitteisiin nähden Suomessa pienituloisuus, eriarvoisuus, asunnottomuus ja työttömyys ovat kaikki kasvaneet tällä hallituskaudella. Suomen työttömyystilanne on EU:n huonoin ja myös työllisyysaste on heikentynyt. Samaan aikaan julkisen talouden velkasuhde on kasvanut erityisesti siksi, että hallituksen harjoittama finanssipolitiikka on osaltaan pitkittänyt talouden matalasuhdannetta. Hallitus on myös rapauttanut julkisen talouden tulopohjaa ja syventänyt alijäämää keventämällä erityisesti suurituloisten ja yritysten verotusta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vaikka taloudessa on alkuvuoden aikana näkynyt myönteisiä merkkejä, kasvu ei vielä näy ihmisten arjessa tai julkisen talouden tilassa. Hallitus on ajanut erityisesti pienituloiset kotitaloudet ahtaalle leikkauspolitiikallaan. Toisaalta hallituksen toimet Euroopan pahimpaan työttömyyskriisiin ovat täysin riittämättömät.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Yksityiskohtaiset perustelut\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">MÄÄRÄRAHAT\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 28\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">VALTIOVARAINMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">91. Työllisyyden ja elinkeinoelämän tukeminen\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">41. Energiaverotuki (arviomääräraha)\u003C/div>\n        \u003C/div>\n        \u003Cp class=\"KappaleKooste\">Hallitus esittää momentille 10&nbsp;000 000 euron lisäystä. Lisäys aiheutuu maatalouden energiaveron tilapäisestä lisäpalautuksesta. Hallituksen esityksessä ehdotetaan, että maataloudessa käytettyjen eräiden energiatuotteiden valmisteveron palautusta korotetaan määräaikaisesti vuosien 2025 ja 2026 polttoöljyn kulutuksen perusteella. Käytännössä palautuksen määrä olisi kevyestä polttoöljystä neljä senttiä litralta. Maatalouden kannattavuuskriisi on todellinen ja vakava ongelma. Tukea ei kuitenkaan pidä rakentaa tavalla, joka lisää riippuvuutta fossiilisista polttoaineista tai heikentää kannusteita siirtyä kohti vähäpäästöisempiä ratkaisuja. Maatalouden tukemiseen on etsittävä keinoja, jotka vahvistavat alan kannattavuutta ja huoltovarmuutta ilman, että samalla ylläpidetään fossiiliriippuvuutta. Tukea tulisi kohdentaa esimerkiksi energiatehokkuuteen, kotimaiseen uusiutuvaan energiaan, sähköistymiseen, biokaasuun ja muihin ratkaisuihin, jotka vähentävät tilojen energiakustannuksia pysyvästi ja tukevat samalla ilmastotavoitteita.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme hyväksyttäväksi seuraavan lausuman:&nbsp;\u003C/p>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 1\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus edistää maatalouden tukemista kustannuskriisissä tavalla, joka kannustaa alan toimijoita irtautumaan fossiilienergian käytöstä.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 29\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">OPETUS- JA KULTTUURIMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">80. Taide ja kulttuuri\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">50. Avustukset taiteen ja kulttuurin edistämiseen (siirtomääräraha 3 v)\u003C/div>\n        \u003C/div>\n        \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Taidetestaajien rahoitus \u003C/span>&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Taidetestaajat on Suomen suurin kulttuurikasvatusohjelma, jonka kautta kaikki kahdeksasluokkalaiset eli noin 70&nbsp;000 nuorta ja heidän noin 5&nbsp;000 opettajaansa pääsevät kokemaan yhden tai kaksi taide-elämystä. Kaikilla lapsilla ja nuorilla on oikeus taiteeseen ja kulttuuriin. Mitä kauemmaksi isoista kaupungeista mennään, sitä vähemmän ammattimaisia kulttuuripalveluja on tarjolla. Lasten ja nuorten kulttuuripalvelujen saatavuuteen vaikuttaa myös esimerkiksi sosioekonominen asema, ja aktiivinen kulttuuriin osallistuminen tai osallistumattomuus myös monesti periytyy sukupolvelta toiselle. &nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Taidetestaajat-ohjelman kautta kokonaiselle ikäluokalle ympäri Suomen tarjotaan pääsyliput ja kuljetukset esimerkiksi oopperaan, teatteriin, sirkukseen, konserttiin tai taidenäyttelyyn. Taidetestaajien kautta voidaan siis puuttua moneen kulttuurin ja taiteen saavutettavuuteen liittyvään tekijään ja vähentää eriarvoistumista.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Taidetestaajat-ohjelmaan sisältyvät vierailut sopivat myös opetussuunnitelman tavoitteisiin, ja ne voidaan rakentaa osaksi sitä. Taidetestaajien kautta voidaan myös tehdä usean oppiaineen taidepainotteista yhteistyötä. Taidetestaajia kehitetään koko ajan nuorilta saadun palautteen perusteella, ja tätä kautta kehitetään sisältöjä, jotta se elää tässä päivässä ja on nuoria puhuttelevaa. &nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme, &nbsp;\u003C/p>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">että momentille 29.80.50 lisätään 1&nbsp;400&nbsp;000 euroa Taidetestaajien rahoitukseen.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Pääluokka 32\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">TYÖ- JA ELINKEINOMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">30. Työllisyys ja yrittäjyys\u003C/span>\u003C/h3>\n         \u003Cp class=\"KappaleKooste\">Tämän hallituskauden aikana Suomessa on testattu oikeistolaisen työllisyyspolitiikan toimivuutta. Suomen työttömyyden trendiluku on ylittänyt 10 prosentin rajan - kyseessä on työttömyyskriisi. Oikeistohallituksen työllisyyspolitiikka on perustunut ihmiskuvaan, jonka mukaan ihmisiä täytyy pakottaa hakeutumaan töihin, koska sosiaaliturvalla on liian helppo elää. Suomessa on kuitenkin samanaikaisesti massatyöttömyys eikä riittävästi työpaikkoja kaikille. Näissä olosuhteissa hallituksen politiikka, joka perustuu lähes yksinomaan työttömien ruoskimiseen ei toimi. Suomen työttömyyskriisiin vastaaminen edellyttää työn kysynnän vahvistamista ja työpaikkojen lisäämistä. &nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Työntekijöiden aseman heikentämisen sijasta työntekijöiden vaikutusmahdollisuuksia ja työhyvinvointia on myös parannettava. Vasemmistoliitto tarjoaisi ihmisille parempaa työelämää ja paremmat mahdollisuudet työllistyä. Vasemmistoliitto säätäisi pitkäaikaistyöttömien työtakuun, panostaisi työllisyyspalveluihin ja helpottaisi osa-aikaisen työn vastaanottamista. &nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Vasemmistoliitto haluaa myös parantaa suomalaisen työelämän laatua ja vahvistaa työntekijöiden neuvotteluvoimaa. Peruisimme Orpon hallituksen lakko-oikeuteen ja työsuhdeturvaan tekemät heikennykset, vientivetoisen työmarkkinamallin sekä muut työntekijöihin kohdistuvat heikennykset. &nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Pitkäaikaistyöttömyys on Suomen suurin työvoimapoliittinen ongelma. Sitä ei ratkaista työttömyysturvaa leikkaamalla tai sen ehtoja kiristämällä, vaan henkilökohtaisella ohjauksella, tuella, riittävillä sosiaali- ja terveydenhuollon palveluilla ja tarvittaessa koulutuksella. Työttömille pitää säätää työtakuu eli taata oikeus palkkatuettuun työpaikkaan 12 kuukauden työttömyyden jälkeen. Työttömien palveluprosessiin liittyvästä yksityiskohtaisesta sääntelystä, kuten työhakemustehtailusta, tulee luopua, ja resurssit kohdistaa aidosti yksilöiden tarpeita vastaaviin palveluihin.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme hyväksyttäväksi seuraavat lausumat: &nbsp;\u003C/p>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 2\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus säätää pitkäaikaistyöttömien työtakuun eli takaa oikeuden palkkatuettuun työpaikkaan 12 kuukauden työttömyyden jälkeen.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 3\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus varaa pitkäaikaistyöttömyyden hoitoon riittävät resurssit. &nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 4\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus jatkaa työn ja työhyvinvoinnin kehittämisohjelmaa ja varaa sen toteuttamiseen riittävän rahoituksen. &nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 5\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus peruu työntekijöiden asemaa heikentävät lakimuutokset, jotka liittyvät esimerkiksi lakko-oikeuden rajoituksiin, ensimmäisen sairauspäivän palkattomuuteen, vientivetoiseen palkkamalliin, irtisanomisten helpottamiseen ja määräaikaisuuksien lisäämiseen työsuhteissa. &nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 6\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus vahvistaa työllisyyttä tukemalla tosiasiallisten työllistymisen esteiden poistamista esimerkiksi lievittämällä osaamisvajeita, työkykyongelmia, työhönottosyrjintää ja sopivien työmahdollisuuksien puutetta sen sijaan, että hallitus pyrkii vahvistamaan työllisyyttä ainoastaan köyhyyttä lisäävien sosiaaliturvaleikkausten kautta. &nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Vastalauseen lausumaehdotus 7\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Eduskunta edellyttää, että hallitus ryhtyy tarvittaviin lainsäädäntötoimiin ja palveluprosessien uudistamiseen työvoimapalveluiden muuttamiseksi henkilöiden yksilöllistä tarvetta enemmän vastaaviksi.&nbsp;\u003C/div>\n         \u003Cdiv class=\"PerusteluLuku\">\n          \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">40. Yritysten erityisrahoitus\u003C/span>\u003C/h3>\n          \u003Cdiv class=\"ValiotsikkoTeksti\">60. Siirrot hallinnonalan rahastoihin (arviomääräraha)\u003C/div>\n          \u003Cp class=\"KappaleKooste\">Hallitus esittää momentille 10&nbsp;000&nbsp;000 euron lisäystä turpeen varmuusvarastointiin. &nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Hallitus päätti kehysriihessä tukea turpeen energiakäyttöä ja huoltovarmuusvarastointia yhteensä 18 milj. eurolla. Tukimallilla on tarkoitus rahoittaa biokaasuinvestointeja. Turve ei kuitenkaan ole biopolttoaine vaan rinnastuu fossiilisiin polttoaineisiin. Sen polton päästökerroin ylittää jopa kivihiilen, samalla kun turpeennosto tuhoaa suoluonnon. Tällainen tuki ei ole hyväksyttävissä.&nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Kuten Ilmastopaneeli on arvioinut, turpeen käyttö huoltovarmuuden näkökulmasta sisältää riskin siitä, että sen käyttöä tulisi ylläpitää kokoaikaisesti jossain määrin, jotta tuotantoinfrastruktuuri, logistiikka ja laitosten toimivuus säilyvät. Tämä todennäköisesti lisää energiasektorin päästöjä, mikä edelleen kasvattaa muiden sektorien päästövähennystarvetta. Kun päästövähennyskuilu kasvaa ja kustannustehokkaimmat toimet jätetään käyttämättä, kalliimpien päästövähennystoimien tarve kasvaa. Tämä on paitsi huonoa ilmastopolitiikkaa myös huonoa taloudenpitoa.&nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Turpeen käytöstä tulee luopua asteittain kokonaan ja huoltovarmuusratkaisuna se tulee korvata vähähiilisellä ratkaisulla mahdollisimman pian. Sen sijaan energiatehokkuuden lisääminen läpi yhteiskunnan olisi erittäin kannatettava huoltovarmuustoimi ja sen edistämiseen tulisi kohdentaa asianmukaiset määrärahat.&nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme, &nbsp;\u003C/p>\n          \u003Cdiv class=\"SisennettyKappaleKooste\">että momentilta 32.40.60 vähennetään 10&nbsp;000&nbsp;000 euroa turpeen varmuusvarastoinnista.&nbsp;\u003C/div>\n         \u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">TULOARVIOT\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Osasto 13\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">KORKOTULOT, OSAKKEIDEN MYYNTITULOT JA VOITON TULOUTUKSET\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">05. Valtion liikelaitosten voiton tuloutukset\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">01. Valtion liikelaitosten voiton tuloutukset\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Hallitus esittää momentilta vähennettäväksi yhteensä 16&nbsp;400&nbsp;000 euroa. Tuloarvion muutoksessa on otettu huomioon lisäyksenä 10&nbsp;000&nbsp;000 euroa Metsähallituksen tuloutuksen kasvuna ja vähennyksenä 26&nbsp;400&nbsp;000 euroa Senaatti-kiinteistöjen tuloutuksen poistumisena.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Valtion metsät ovat avainasemassa metsäluonnon kadon pysäyttämisen kannalta. Hallitus aikoo nyt tulouttaa Metsähallituksen liiketoiminnasta vielä 10&nbsp;000 000 euroa lisää jo edellisten tuloutusten päälle, mikä on liian paljon kestävän metsänhoidon näkökulmasta. Valtion omistamia metsiä tulisi hoitaa luonnon monimuotoisuutta ja hiilinielun elvyttämistä huomioivalla tavalla, minkä vuoksi Metsähallituksen tuloutustavoitetta tulee kohtuullistaa.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme, &nbsp;\u003C/p>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">että momentilta 13.05.01 vähennetään Metsähallituksen 10&nbsp;000&nbsp;000 euron tuloutus.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Ehdotus\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Edellä olevan perusteella ehdotamme,&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että ehdotus vuoden 2026 toiseksi lisätalousarvioksi hyväksytään valiokunnan mietinnön mukaisena edellä todetuin muutoksin ja&nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">että edellä ehdotetut 7 lausumaa hyväksytään.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingissä 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Hanna&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Sarkkinen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">vas&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Jessi&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Jokelainen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">vas&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(osittain)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"AloiteLiiteOsa\" class=\"AloiteLiiteOsa\">\n   \u003Ch2 class=\"LiiteNimi\">Liite\u003C/h2>\n   \u003Cdiv class=\"YhdistettyAsia\">\n    \u003Cdiv class=\"Asia\">\n     \u003Cdiv class=\"IdentifiointiOsa\">\n      \u003Cdiv class=\"AsiakirjatyyppiNimi\">Lisätalousarvioaloite\u003C/div>\n      \u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;LTA&nbsp;\u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">1\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp\u003C/span>\u003C/span>&nbsp;\u003Cspan class=\"Toimija\"> \n       \u003Cdiv class=\"Henkilo\">\n        \u003Cdiv class=\"EtuNimi\">Mikko&nbsp;\u003C/div>\n
