julkisuuskuvauksessa on kerrottu, miten eduskunnan asiarekisteri ja palvelujen tiedonhallinta ovat jäsentyneet.  Se sisältää myös ohjeistukset siitä, miten tietoja voidaan pyytää. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/saavutettavuusseloste/",title:null,target:null,text:"Saavutettavuusseloste",contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",expanded:{contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",expanded:null},name:"Saavutettavuusseloste",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"saavutettavuusseloste",url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",changed:null,created:null,startPublish:"2026-03-19T07:20:56Z",stopPublish:null,saved:null,status:null,teaserTitle:"Saavutettavuusseloste",teaserText:"Eduskunta haluaa taata kaikille yhdenvertaisen mahdollisuuden asioida sähköisissä palveluissaan. Verkkosivustoa koskee laki digitaalisten palvelujen tarjoamisesta, jonka mukaan julkisten verkkopalvelujen tulee olla saavutettavia. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Tietosuojaselosteet",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:{contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:null},name:"Tietosuojaselosteet",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"tietosuojaselosteet",url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",changed:null,created:null,startPublish:"2025-04-03T11:57:48Z",stopPublish:null,saved:null,status:null,teaserTitle:"Tietosuojaselosteet",teaserText:"Eduskunnan tietosuojaselosteissa kerrotaan muun muassa henkilötietojen käsittelyn tarkoituksesta, mihin tietoja säännönmukaisesti luovutetaan, miten kauan henkilötietoja säilytetään.",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/sivukartta/",title:null,target:null,text:"Sivukartta",contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:{contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:null},name:"Sivukartta",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sivukartta",url:"/fi/tietoa-sivustosta/sivukartta/",changed:null,created:null,startPublish:"2026-03-19T11:01:19Z",stopPublish:null,saved:null,status:null,teaserTitle:"Sivukartta",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/fi/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/fi/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"",contentLink:"18"},{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"",contentLink:"1796"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/fi/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/fi/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/fi/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1659"},{children:[],relatedContent:[],name:"Eduskunnan EU-sihteeristö",teaserText:"EU-sihteeristö tukee kansanedustajien yhteydenpitoa suomalaisiin ja muihin Euroopan parlamentin jäseniin sekä muihin keskeisiin EU-toimijoihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-eu-sihteeristo/",selected:false,targetFrame:"",contentLink:"1415"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/fi/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. Vanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/fi/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/fi/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/fi/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/fi/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/fi/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/fi/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/fi/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/fi/asiat-ja-aanestykset/",selected:false,targetFrame:"",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/fi/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/fi/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/fi/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/fi/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/fi/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. ",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/fi/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/fi/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"",contentLink:"64"}],relatedContent:[{children:[],relatedContent:[],name:"Ota yhteyttä kansanedustajaan",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Katso täysistuntosuunnitelma ja muut tapahtumat",teaserText:null,url:"/fi/?epsremainingpath=taysistunnot-ja-tapahtumat",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/avoin-data",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null}],name:"Vieraile ja osallistu",teaserText:"Eduskuntatalo on avoin vierailijoille. Voit varata paikan opastetulle kierrokselle varauspalvelun kautta. Voit myös seurata eduskunnan täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä tilaisuuksina suorana verkossa. Jokaisella on mahdollisuus vaikuttaa päätöksentekoon. Voit keskustella ja kertoa mielipiteesi, kun uusia lakeja suunnitellaan.",url:"/fi/vieraile-ja-osallistu/",selected:false,targetFrame:"",contentLink:"50"}],subMenuItems:[],breadcrumbItems:[{name:"Eduskunta",teaserText:null,url:"/fi/",selected:true
