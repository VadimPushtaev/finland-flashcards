u003Cspan class=\"OtsikkoNroTeksti \">92.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">EU ja kansainväliset järjestöt\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">69.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maksut Euroopan unionille\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 106&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">88.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Suomen osuus Euroopan vakausmekanismin pääomasta\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 23&nbsp;080&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 29\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">OPETUS- JA KULTTUURIMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Hallinto, kirkollisasiat ja toimialan yhteiset menot\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Opetus- ja kulttuuriministeriön toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 5&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">02.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Opetushallituksen toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 50&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">31.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Eräät Opetushallituksen menot ja avustukset\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 50&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">10.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Varhaiskasvatus, esi- ja perusopetus ja vapaa sivistystyö\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">30.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtionosuus ja -avustus esi- ja perusopetuksen ja varhaiskasvatuksen käyttökustannuksiin\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 8&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että ohjaustuntimäärän estämättä määrärahaa saa käyttää oikaisupäätöksistä aiheutuvien valtionosuuksien maksamiseen.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">80.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Taide ja kulttuuri\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Avustukset taiteen ja kulttuurin edistämiseen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 7&nbsp;620&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että määrärahaa saa käyttää Suomen Kansallisteatterin kuparikaton peruskorjauksen avustuksiin.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">90.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikuntatoimi\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikunnan ja urheilun edistäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 2&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että määrärahaa saa käyttää valtion vastinrahoitukseen Olympiarahastolle.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 30\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">MAA- JA METSÄTALOUSMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Hallinto ja tutkimus\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maa- ja metsätalousministeriön toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 164&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maa- ja elintarviketalouden sekä luonnonvaratalouden huoltovarmuuden vahvistaminen, viennin edistäminen ja arvonlisän kehittäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 1&nbsp;390&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">10.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maaseudun kehittäminen\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maatalouden aloittamis- ja investointiavustukset\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Vuoden 2024 talousarviossa myönnetystä kolmevuotisesta siirtomäärärahasta peruutetaan 17&nbsp;500&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">64.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">EU:n ja valtion rahoitusosuus alueelliseen ja paikalliseen maaseudun kehittämiseen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Vuoden 2024 talousarviossa myönnetystä kolmevuotisesta siirtomäärärahasta peruutetaan 12&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maa- ja elintarviketalous\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ruokaviraston toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 200&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">47.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ruokaketjun kehittäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 1&nbsp;190&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">49.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Alkutuotannon tuotantopanosomavaraisuuden lisääminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 3&nbsp;300&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Vuoden 2024 talousarviossa myönnetystä kolmevuotisesta siirtomäärärahasta peruutetaan 3&nbsp;300&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Luonnonvaratalous\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">31.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vesi- ja kalataloushankkeiden tukeminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 770&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Eräät luonnonvaratalouden korvaukset\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 110&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">42.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Petoeläinten aiheuttamien vahinkojen korvaaminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 4&nbsp;400&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Riistatalouden edistäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 227&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">62.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Elinkeinokalatalouden edistäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 13&nbsp;783&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja muutetaan siten, että määrärahasta on varattu 14&nbsp;572&nbsp;000 euroa EU:n osarahoittamien hankkeiden valtion rahoitusosuutta varten.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että Elinvoimakeskus voi vuosina 2026—2028 myöntää Euroopan meri-, kalatalous- ja vesiviljelyrahastosta (EMKVR) annetun lain (997/2021) 10&nbsp;a&nbsp;§:n mukaisia takauksia rahoituslaitosten tuen saajille myöntämille lainoille yhteensä 4&nbsp;000&nbsp;000 euroa, kuitenkin enintään euromäärän, joka vastaa määrärahasta käyttämättä jäävää osaa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">64.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Metsähallitus\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"ValiotsikkoKooste\">\n        \u003Cspan class=\"KursiiviTeksti\">2. Peruspääoman muutokset\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Luvun perusteluja muutetaan siten, että Metsähallituksen peruspääomaa ehdotetaan korotettavaksi 2,254 milj. eurolla.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 31\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">LIIKENNE- JA VIESTINTÄMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Hallinto ja toimialan yhteiset menot\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikenne- ja viestintäministeriön toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 11&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">02.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikenne- ja viestintäviraston toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 1&nbsp;183&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että määrärahaa saa käyttää myös liikennepalveluiden kehittämishankkeista aiheutuvien menojen maksamiseen.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">88.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Osakehankinnat\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 4&nbsp;464&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että määrärahaa saa käyttää Verkkojen Eurooppa -välineestä (Connecting Europe Facility, CEF) Länsirata Oy:lle myönnettyjen tukien siirtämiseen hankeyhtiön käytettäväksi.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">10.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikenne- ja viestintäverkot\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Perusväylänpito\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 13&nbsp;370&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määrärahan käyttäminen Vt 21:n Tengeliönjoen siltojen uusimiseen, Kt 92:n Karigasniemen sillan uusimiseen ja varasiltakaluston hankintaan edellyttää myönteistä EAKR-tukipäätöstä.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">31.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Eräät avustukset\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 2&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin käyttösuunnitelma muutetaan seuraavaksi:&nbsp;\u003C/div>\n        \u003Cdiv id=\"tableID-N110E6\" class=\"table\">\n         \u003Cdiv class=\"title\">\n          \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Käyttösuunnitelma (euroa)\u003C/span>&nbsp;\u003C/p>\n         \u003C/div>\n         \u003Ctable class=\"vaskitgroup\">\n          \u003Ccolgroup>\n           \u003Ccol width=\"84.448%\">\n           \u003Ccol width=\"15.552%\">\n          \u003C/colgroup>\n          \u003Ctbody class=\"tbody\">\n           \u003Ctr class=\"vaskirow \tb-border\">\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n            \u003C/td>\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n            \u003C/td>\n           \u003C/tr>\n           \u003Ctr class=\"vaskirow \tb-border\">\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">Finavian lentoasemaverkoston ulkopuoliset lentoasemat ja lentopaikat&nbsp;\u003C/p>\n            \u003C/td>\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">1&nbsp;370&nbsp;000&nbsp;\u003C/p>\n            \u003C/td>\n           \u003C/tr>\n           \u003Ctr class=\"vaskirow \tb-border\">\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">Yksityistieavustukset ja tiekuntien neuvonnasta aiheutuvat kulutusmenot&nbsp;\u003C/p>\n            \u003C/td>\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">5&nbsp;500&nbsp;000&nbsp;\u003C/p>\n            \u003C/td>\n           \u003C/tr>\n           \u003Ctr class=\"vaskirow \tb-border\">\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">Kävelyn ja pyöräilyn edistäminen ja kuntien joukkoliikennehankkeet&nbsp;\u003C/p>\n            \u003C/td>\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">5&nbsp;000&nbsp;000&nbsp;\u003C/p>\n            \u003C/td>\n           \u003C/tr>\n           \u003Ctr class=\"vaskirow \">\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Yhteensä\u003C/span>&nbsp;\u003C/p>\n            \u003C/td>\n            \u003Ctd class=\"vaskientry \">\n             \u003Cp class=\"KappaleKooste\">11&nbsp;870&nbsp;000&nbsp;\u003C/p>\n            \u003C/td>\n           \u003C/tr>\n          \u003C/tbody>\n         \u003C/table>\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Vuoden 2024 talousarviossa myönnetystä kolmevuotisesta siirtomäärärahasta peruutetaan 2&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">77.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Väyläverkon kehittäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 24&nbsp;890&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että määrärahaa saa käyttää EU:n rahastojen tuella toteutettavien hankkeiden omarahoitusosuutta koskevien menojen maksamiseen ja Eurooppalaisen raideleveyden ratayhteyksien suunnittelu Tornio—Haaparanta—Kemi -hankkeessa Ruotsin ja Suomen välisen sillan osalta myös Ruotsin puolen suunnitteluun yhteistyössä Trafikverketin kanssa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"ValiotsikkoKooste\">\n         \u003Cspan class=\"LihavaTeksti\">Valtuus\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että Väylävirasto oikeutetaan tekemään sopimuksia hankkeeseen&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">\n         1) Vt 6 Keltin silta, Kouvola liittyen siten, että siitä saa aiheutua valtiolle menoja hankkeen omarahoitusosuutena enintään \u003Cspan class=\"Valtuusraha\"> 20&nbsp;751&nbsp;000\u003C/span> euroa&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">\n         2) Vt 9 Vartiala—Riistavesi Kivisillansalmen silta, Kuopio liittyen siten, että siitä saa aiheutua valtiolle menoja hankkeen omarahoitusosuutena enintään \u003Cspan class=\"Valtuusraha\"> 12&nbsp;600&nbsp;000\u003C/span> euroa&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">\n         3) Vaasan satamaradan sähköistys liittyen siten, että siitä saa aiheutua valtiolle menoja enintään \u003Cspan class=\"Valtuusraha\"> 8&nbsp;000&nbsp;000\u003C/span> euroa&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">\n         4) Vaasan meriväylän syventäminen liittyen siten, että siitä saa aiheutua valtiolle menoja enintään \u003Cspan class=\"Valtuusraha\"> 15&nbsp;000&nbsp;000\u003C/span> euroa.&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja muutetaan siten, että Väylävirasto oikeutetaan tekemään sopimuksia hankkeeseen&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">5) Eurooppalaisen raideleveyden ratayhteyksien suunnittelu Tornio—Haaparanta—Kemi liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 61&nbsp;000&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">6) Vt 21 Palojoensuu—Maunu liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 56&nbsp;500&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">7) Vt 5 Leppävirta—Kuopio liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 212&nbsp;000&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">8) Vt 3 ja vt 19 liittymäjärjestelyt Jalasjärvi, Kurikka liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 14&nbsp;000&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">9) Vt 15 Kotkan sisääntulotie (Hyväntuulentie) liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 12&nbsp;670&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">10) Turun satamaradan siirto liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 19&nbsp;000&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">11) Oulun henkilöratapiha liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 34&nbsp;100&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">12) Vt 8 Edsevö—Lepplax liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 26&nbsp;200&nbsp;000 euroa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">13) Uuden jäänmurtajan hankintaan liittyen siten, että siitä saa aiheutua valtiolle menoja aiemmin tehdyt sopimukset mukaan lukien enintään 240&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Hankkeiden 1) ja 2) valtuuden ja määrärahan käytön edellytyksenä on myönteinen EAKR-tukipäätös.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikenteen ja viestinnän palvelut\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">21.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Julkisen henkilöliikenteen palvelujen ostot ja kehittäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"ValiotsikkoKooste\">\n         \u003Cspan class=\"LihavaTeksti\">Valtuus\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">\n         Momentin perusteluja täydennetään siten, että Liikenne- ja viestintävirasto oikeutetaan solmimaan sopimuksia junaliikenteen hankinnoista siten, että niistä aiheutuu menoja vuosina 2026—2030 enintään \u003Cspan class=\"Valtuusraha\"> 296&nbsp;192&nbsp;000\u003C/span> euroa. Vuoden 2022 talousarviossa junaliikenteen ostoihin vuosille 2022—2030 myönnetystä valtuudesta peruutetaan 174&nbsp;500&nbsp;000 euroa, vuoden 2022 ensimmäisessä lisätalousarviossa yöjunarungon vaunukaluston hankintaa varten vuosille 2022—2030 myönnetystä valtuudesta peruutetaan 33&nbsp;626&nbsp;000 euroa ja lisäksi peruutetaan vuoden 2026 lisätalousarviossa myönnetty 76&nbsp;000&nbsp;000 euron viisivuotinen kalustovuokravaltuus.&nbsp;\n        \u003C/div>\n       \u003C/div>\n div class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 130&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja muutetaan siten, että määrärahasta on varattu 100&nbsp;000 euroa energiainfrastruktuuri-investointeihin (RRF pilari1), 100&nbsp;000 euroa investointeihin uuteen energiateknologiaan (RRF pilari1), 33&nbsp;000 euroa vähähiilisen vedyn sekä hiilidioksidin talteenottoon ja hyödyntämiseen (RRF pilari1), 40&nbsp;000 euroa tukiviranomaisroolin voimavaroihin (REPowerEU) ja 20&nbsp;000 euroa teollisuuden prosessien suoraan sähköistämiseen ja vähähiilistämiseen (RRF pilari1) osana elpymis- ja palautumissuunnitelmaa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">02.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Elinvoimakeskusten toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 700&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja muutetaan siten, että määrärahasta on varattu 53&nbsp;014&nbsp;000 euroa Työllisyys-, kehittämis- ja hallintokeskuksen työllisyyden ja elinkeinojen edistämiseen.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">04.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Geologian tutkimuskeskuksen toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"ValiotsikkoKooste\">\n         \u003Cspan class=\"LihavaTeksti\">Valtuus\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">\n         Momentin perusteluja muutetaan siten, että vuonna 2026 saa tehdä uusia sitoumuksia enintään \u003Cspan class=\"Valtuusraha\"> 39&nbsp;200&nbsp;000\u003C/span> eurolla.&nbsp;\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">06.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kilpailu- ja kuluttajaviraston toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 17&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">08.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Turvallisuus- ja kemikaaliviraston toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 20&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">09.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Energiaviraston toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 20&nbsp;000 euroa.  siten, että määrärahasta on varattu 9&nbsp;100&nbsp;000 euroa innovaatio- ja tutkimusinfrastruktuurin edistämiseen (RRF pilari3), 2&nbsp;932&nbsp;000 euroa avainalojen vauhdittamiseen ja osaamiseen vahvistamiseen (RRF pilari3), 5&nbsp;534&nbsp;000 euroa kiinteistö- ja rakentamisalan vähähiilisten ratkaisujen tukiohjelmaan (RRF pilari1), 640&nbsp;000 euroa luovien alojen rakennetukeen (RRF pilari3), 35&nbsp;175&nbsp;000 euroa materiaalien ja teollisuuden sivuvirtojen uudelleenkäyttöön ja kierrätykseen (RRF pilari1), 280&nbsp;000 euroa terveys- ja hyvinvointiteknologioihin ja osaamiseen (RRF pilari3), 4&nbsp;601&nbsp;000 euroa 6G:n, tekoälyn ja kvanttilaskennan kehittämisympäristöihin (RRF pilari2), 3&nbsp;235&nbsp;000 euroa innovatiivisten kasvuyritysten tukemiseen (RRF pilari3) ja 1&nbsp;056&nbsp;000 euroa teollisuuden vähähiilisen, kiertotalouden ja digitaalisen uudistumisen edistämisen ja teollisen palveluviennin kasvattamisen ohjelmaan (RRF pilari3).&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">41.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Energiatuki\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja muutetaan siten, että määrärahasta on varattu 85&nbsp;321&nbsp;000 euroa energiainfrastruktuuri-investointeihin (RRF pilari1), 40&nbsp;393&nbsp;000 euroa uuden energiateknologian investointeihin (RRF pilari1), 15&nbsp;870&nbsp;000 euroa vähähiilisen vedyn ja hiilidioksidin talteenoton ja hyödyntämisen edistämiseen (RRF pilari1), 30&nbsp;422&nbsp;000 euroa teollisuuden prosessien sähköistämiseen ja vähähiilistämiseen (RRF pilari1) ja 16&nbsp;415&nbsp;000 euroa puhtaan siirtymän investointeihin (REPower EU) osana elpymis- ja palautumissuunnitelmaa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">47.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Julkisen liikennesähkön ja -kaasun lataus- ja tankkausinfrastruktuurin edistäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 1&nbsp;180&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja muutetaan siten, että määrärahasta on varattu 2&nbsp;382&nbsp;000 julkisiin liikennesähkön lataus- ja vedyn tankkausinfrastruktuurihankkeisiin (RRF pilari1) osana elpymis- ja palautumissuunnitelmaa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">48.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Uusiutuvan energian tuotantotuki\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 69&nbsp;031&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">83.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lainat tutkimus- ja innovaatiotoimintaan\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 5&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">30.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Työllisyys ja yrittäjyys\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">32.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtionavustus kunnille Ohjaamoiden monialaisuuden vahvistamiseen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään 2&nbsp;100&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määrärahaa saa käyttää valtionavustuslain (688/2001) mukaisesti kunnille tai kuntayhtymille Ohjaamojen monialaisuuden vahvistamiseen myönnettävän valtionavustuksen maksamiseen.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määräraha on varattu Ohjaamojen monialaisuuden vahvistamiseen (RRF pilari3) osana elpymis- ja palautumissuunnitelmaa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määräraha budjetoidaan maksatuspäätösperusteisena.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Vuoden 2025 talousarviossa myönnetystä kaksivuotisesta siirtomäärärahasta peruutetaan 2&nbsp;100&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Alueiden kestävän kasvun ja elinvoiman tukeminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perustelut muutetaan seuraaviksi:&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määrärahaa saa käyttää valtionavustuslain (688/2001) mukaisesti:&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">1) Kutilan kanavan rakentamisesta aiheutuvien kustannusten maksamiseen.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määrärahaa saa käyttää alueiden kehittämisen ja Euroopan unionin alue- ja rakennepolitiikan hankkeiden rahoittamisesta annetun lain (757/2021) mukaisesti:&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">2) kansainvälistä rekrytointia edistävään sopimusperusteiseen yhteistyöhön kaupunkien kanssa&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">3) alueiden kehittämistä, kestävää kasvua ja elinvoimaa edistäviin hankkeisiin sekä niihin sisältyviin investointeihin&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">4) kuntien ja kuntayhtymien toteuttamiin yritysten toimintaedellytyksiä tukeviin perusrakenteen investointihankkeisiin&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">5) useampaa kuin yhtä aluetta koskeviin tai valtakunnallisesti tärkeisiin alueiden kehittämistä koskeviin kehittämishankkeisiin sekä sopimusperusteiseen yhteistyöhön.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Lisäksi määrärahaa saa käyttää:&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">6) kohtien 1)—5) kulutusmenojen maksamiseen&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">7) enintään viittä henkilötyövuotta vastaavan määräaikaisen henkilöstön palkkaamiseen ja henkilöstön palkkaamisesta aiheutuvien tila- ja muiden kustannusten maksamiseen&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">8) ennakoiden maksamiseen, jos se on hankkeiden toteuttamisen kannalta perusteltua.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määräraha budjetoidaan siirtomenojen osalta maksatuspäätösperusteisena.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtionavustus nuorten rekrytointitukeen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 19&nbsp;700&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">53.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Työllisyyden edistämisen täsmätoimet \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään 34&nbsp;475&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määrärahaa saa käyttää elinvoimakeskuksen valtionavustuslain (688/2001) nojalla työvoimaviranomaiselle myöntämään avustukseen:&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">1) enintään 19&nbsp;700&nbsp;000 euroa pitkäaikaistyöttömien osaamissetelistä aiheutuviin kustannuksiin&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">2) enintään 14&nbsp;775&nbsp;000 euroa nuorisotyöttömyyden ehkäisemisen pilotteihin.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määräraha budjetoidaan maksatuspäätösperusteisena.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yritysten erityisrahoitus\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">60.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Siirrot hallinnonalan rahastoihin\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 10&nbsp;000&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kotoutuminen ja kansainvälinen osaaminen\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">03.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kotoutumisen ja työvoiman maahanmuuton edistäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että määrärahaa saa käyttää kotoutumiseen ja työvoiman maahanmuuttoon liittyvään muun viraston tietojärjestelmän kehittämiseen.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 33\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">SOSIAALI- JA TERVEYSMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Hallinto\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sosiaali- ja terveysministeriön toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 911&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">06.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Terveyden ja hyvinvoinnin laitoksen alaisen vankiterveydenhuollon yksikön toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 150&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">03.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tutkimus- ja kehittämistoiminta\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">04.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Terveyden ja hyvinvoinnin laitoksen toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 710&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Työttömyysturva\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">52.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtionosuus työttömyysetuuksien perusturvasta\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 300 000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">60.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sosiaali- ja terveydenhuollon tukeminen\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">35.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtionosuus korkeakouluopiskelijoiden terveydenhuoltoon \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja täydennetään siten, että vuodelta 2025 siirtynyttä määrärahaa saa käyttää 250&nbsp;000 euroa Toivottua lastensaantia tukevan pilottihankkeen valtionavustusten maksamiseen YTHS:lle ja Väestöliitolle valtionavustuslain mukaisesti.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">39.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Palvelurakenteen kehittäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin perusteluja muutetaan siten, että määrärahaa saa käyttää enintään 40&nbsp;000&nbsp;000 euroa valtionavustuksiin, jotka kohdistuvat hyvinvointialueiden lakisääteisistä tehtävistä erillisiin määräaikaisiin omalääkäri-, omatiimi- ja ammatinharjoittajamallien kehittämishankkeisiin.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">52.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtion rahoitus turvakotitoiminnan menoihin\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentin määräraha muutetaan kaksivuotiseksi siirtomäärärahaksi.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">70.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Terveyden ja toimintakyvyn edistäminen\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Terveyden edistäminen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 1 400 000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Vuoden 2024 talousarviossa myönnetystä kolmevuotisesta määrärahasta peruutetaan 1&nbsp;400&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Pääluokka 35\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">YMPÄRISTÖMINISTERIÖN HALLINNONALA\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ympäristöhallinnon toimintamenot\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ympäristöministeriön toimintamenot\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään lisäystä 405&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhdyskunnat, rakentaminen ja asuminen\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">57.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtion tukeman asuntokannan avustukset\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 2&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">\n         Momentin perusteluja muutetaan siten, että määrärahaa saa käyttää vuokra- ja asumisoikeustaloyhteisöjen talouden tervehdyttämisavustuksista annetun lain (1030\u003Cspan class=\"LihavaTeksti\">/\u003C/span>2008) mukaisten avustusten myöntämiseen yhteensä enintään 600&nbsp;000 euroa, josta saa käyttää enintään 200&nbsp;000 euroa taloudellisissa vaikeuksissa olevien asuntoyhteisöjen talouden tervehdyttämistä ja kunnossapidon suunnittelua edistävistä selvityksistä ja toimenpiteistä aiheutuviin kustannuksiin.&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Lisäksi momentin perusteluja muutetaan siten, että määrärahaa saa käyttää enintään 300&nbsp;000 euroa saatavien turvaamiseen kuten saatavien perintään ja vakuusomaisuuden hoitoon, takautumisoikeuden käyttämisestä aiheutuvien menojen maksamiseen, kiinnityksen haltijan vastuuvakuutuksen maksamiseen, kiinteistön tai muun omaisuuden ostamiseen konkurssi- tai ulosottohuutokaupassa tai muussa realisointijärjestelyssä, milloin se on laina-, takaus- tai muiden sellaisten saatavien turvaamiseksi tai takausvastuiden minimoimiseksi tarpeen sekä näin tulleen omaisuuden hoidosta ja realisoinnista aiheutuviin kustannuksiin.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">58.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtion tukeman asuntotuotannon valtuudet\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (arviomääräraha)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentilta vähennetään 26&nbsp;950&nbsp;000 euroa.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n       \u003Ch6 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">59.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Avustukset asuinrakennusten energiatehokkuuden edistämiseksi\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (siirtomääräraha 3&nbsp;v)\u003C/span>\u003C/h6>\n       \u003Cdiv class=\"TalousarvioPaatosOsa\">\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Momentille myönnetään 24&nbsp;537&nbsp;000 euroa.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Määrärahaa saa käyttää valtionavustuslain (688/2001) nojalla asuinrakennusten energiatehokkuusavustuksiin siten kuin annettavalla valtioneuvoston asetuksella säädetään.&nbsp;\u003C/div>\n        \u003Cdiv class=\"TalousarvioKappaleKooste\">Avustuksen myöntää ympäristöministeriö.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"VoimaantuloSaannosOsa\" class=\"VoimaantuloSaannosOsa\">\n   \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Eduskunta on päättänyt, että nyt hyväksyttyä vuoden 2026 toista lisätalousarviota sovelletaan 1 päivästä heinäkuuta 2026 alkaen.\u003C/span>&nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv id=\"AllekirjoitusOsa\" class=\"AllekirjoitusOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingissä 23.6.2026&nbsp;\u003C/div>\n   \u003Cp class=\"JohdantoTeksti\">Eduskunnan puolesta\u003C/p>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"AsemaTeksti\">puhemies&nbsp;\u003C/div>\n     \u003Cdiv class=\"EtuNimi\">&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">&nbsp;\u003C/div>\n    \u003C/div>\n    &nbsp;\n   \u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"AsemaTeksti\">pääsihteeri&nbsp;\u003C/div>\n     \u003Cdiv class=\"EtuNimi\">&nbsp;\u003C/div>\n     \u003Cdiv class=\"S
