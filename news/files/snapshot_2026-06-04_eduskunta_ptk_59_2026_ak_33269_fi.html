]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Asiakirjat\u003C/span>\u003C/li>\n    \u003C/ol>\n   \u003C/nav>\n  \u003C/div>\n \u003C/div>\n \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n  \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">3.6.2026 | 14:30\u003C/span>\n \u003C/div>\n \u003Cdiv class=\"PoytakirjaAsiakohta Eduskunnanpoytakirja2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Pöytäkirjan asiakohta\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;PTK&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">59\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"YhteisoTeksti\">Täysistunto&nbsp;\u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Tiistai 2.6.2026 klo 14.00—22.04\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv class=\"Asiakohta 236662\">\n   \u003Ch2>\u003Cspan class=\"KohtaNumeroTeksti\">10.&nbsp; \u003C/span>\u003Cspan class=\"KohtaNimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/span>\u003C/span>\u003C/h2>\n   \u003Cdiv class=\"edk-viite\">\n    \u003Cdiv class=\"KohtaAsia\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%2054%2F2026%20vp\">HE 54/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"edk-viite b-margin\">\n    \u003Cdiv class=\"KohtaAsiakirja\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Valiokunnan mietintö\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HaVM%2010%2F2026%20vp\">HaVM 10/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Toimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Ensimmäinen käsittely\u003C/div>\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Ensimmäiseen käsittelyyn esitellään päiväjärjestyksen \u003Cspan class=\"HarvaKursiiviTeksti\">10.\u003C/span> asia. Käsittelyn pohjana on hallintovaliokunnan mietintö HaVM 10/2026 vp. Nyt päätetään lakiehdotusten sisällöstä. — Yleiskeskustelu alkaa. Edustaja, valiokunnan puheenjohtaja Peltokangas, esittelypuheenvuoro, olkaa hyvä. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"KeskusteluToimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Keskustelu\u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.21\">20.21&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Mauri&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.21Peltokangas\">Peltokangas&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(esittelypuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitos, arvoisa rouva puhemies! Kansalaisuuslakia koskevia hallitusohjelmakirjauksia on toteutettu vaiheittain kolmessa eri hankkeessa. Ensimmäisessä vaiheessa toteutettiin asumisaikaedellytystä koskevat muutokset. Toisessa vaiheessa toteutettiin ne hallitusohjelman mukaiset muutokset, jotka koskivat selvitettyä henkilöllisyyttä, kansallista turvallisuutta, nuhteettomuutta ja toimeentuloedellytystä sekä kansalaisuuden menettämistä. Käsillä olevassa mietinnössä ehdotukset koskevat kansalaisuuslain muutosten kolmatta eli viimeistä vaihetta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hallituksen esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoa koskevaa edellytystä eli lähtökohtaisesti kansalaisuuskokeen hyväksyttyä suorittamista. Edellytys ei koske alle 18-vuotiasta eikä 65 vuotta täyttänyttä hakijaa, joten yhteiskuntatiedon osoittamista edellytetään käytännössä vain työikäisiltä. Edellytyksestä voidaan lisäksi poiketa, jos hakija ei pysty täyttämään sitä terveydentilansa tai vammaisuutensa vuoksi tai jos muutoin on olemassa erittäin painava syy edellytyksestä poikkeamiselle. Kansalaisuuskokeen lisäksi yhteiskuntatiedon voi ehdotuksen mukaan osoittaa suomen tai ruotsin kielellä suoritetulla ylioppilas- tai korkeakoulututkinnolla.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Muutoksen tarkoituksena on vahvistaa onnistuneen kotoutumisen osoittamista kansalaisuuden saamisen lähtökohtana. Hallituksen esityksen ehdotuksilla pyritään edistämään Suomen kansalaisuudesta kiinnostuneiden ulkomaalaisten perehtymistä keskeisiin yhteiskunnan toimintatapoihin ja perusperiaatteisiin, jotka tukevat aktiivista yhteiskuntaan osallistumista ja ovat tarpeen yhteiskunnassa toimimista varten. Kansalaisuuskokeella on tarkoitus testata luotettavasti ja yhdenvertaisesti siihen osallistuvan tietoja suomalaisesta yhteiskunnasta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Kansalaisuuskoe toteutetaan ehdotuksen mukaan monivalintakokeena. Valiokunnan saaman selvityksen mukaan kansalaisuuskokeeseen voi valmistautua itsenäisesti opiskelemalla yleisesti saatavilla olevan kansalaisuuskokeen oppimateriaalin tietoja. Kokeen toteutuksessa huomioidaan myös kansalaistamisen edellytyksenä oleva kielitaidon taso. Kysymykset koskevat sellaisia aiheita kuin Suomen keskeistä lainsäädäntöä, perus- ja ihmisoikeuksia, yhdenvertaisuutta, sukupuolten tasa-arvoa sekä Suomen historiaa ja kulttuuria.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuskokeen oppimateriaalin on tarkoitus vastata sisällöltään ja laajuudeltaan yhteiskuntaorientaation oppimateriaalia, joka on laadittu nimenomaan edistämään yhteiskuntaorientaatioon osallistuvien kotoutumista. Kansalaisuuskokeessa, sen oppimateriaalissa ja kokeen aihealueissa on kyse perustiedoista, jotka koskevat suomalaisen yhteiskunnan toimintaa sekä yksilön oikeuksia ja velvollisuuksia. Maahanmuuttovirasto tekee sopimuksen kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin hankkimisesta yliopiston tai muun sellaisen yliopistollisen toimijan kanssa, jolla on riittävä asiantuntemus tähän tehtävään. Muu yliopistollinen toimija voi olla esimerkiksi useampi yliopisto yhdessä tai yliopisto yhteistyössä ammattikorkeakoulun kanssa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hallintovaliokunta toteaa, että Suomen kansalaisuuden saamisen kannalta kansalaisuuskokeen suorittamisella on jatkossa merkittävä rooli. Kokeella on pystyttävä testaamaan luotettavasti siihen osallistuvan tietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Tästä syystä valiokunta pitää tärkeänä, että kansalaisuuskokeen laatijalta edellytetään korkeatasoista ja monipuolista asiantuntemusta paitsi kokeen aihepiiristä myös oppimateriaalin ja sen tietoihin perustuvien kysymysten ja vastausten muotoilusta sekä kokeen ja sen oppimateriaalin kielen sovittamisesta oikealle taitotasolle.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Hallintovaliokunta toteaa, että hallituksen esityksen mukaan kansalaisuuskokeen alkuinvestoinneista aiheutuvat kertaluonteiset kustannukset ovat yhteensä noin 4,2 miljoonaa euroa ja pysyvät kustannukset noin 2,35 miljoonaa euroa. Mahdollisen lisämäärärahan tarve arvioidaan vuoden 2026 toisen lisätalousarvion valmistelun yhteydessä. Kansalaisuuskokeen pysyvät kulut katetaan kokeeseen osallistuvilta koemaksuina pidemmän ajan kuluessa. Ehdotettujen muutosten on tarkoitus tulla voimaan vuoden 2027 alussa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Valiokunta kiinnittää erityistä huomiota Maahanmuuttoviraston keskeiseen rooliin uudistuksen toimeenpanossa. Virastolle tulee esityksen myötä uusia tehtäviä muun muassa kansalaisuuskokeen valmisteluun, järjestämiseen, tietojärjestelmiin, maksuliikenteeseen sekä oikaisuvaatimusten käsittelyyn. Näiden asianmukainen hoitaminen edellyttää riittäviä henkilöstö- ja taloudellisia tietojärjestelmäresursseja. Valiokunta korostaa, että Maahanmuuttovirastolle on jo aiemmin osoitettu huomattava määrä uusia tehtäviä. Hallitusohjelmaan sisältyy laaja kokonaisuus lupajärjestelmän tehostamiseen sekä ulkomaalais- ja kansalaisuuslainsäädännön tiukentamiseen liittyviä uudistuksia, joista valiokunta on jo käsitellyt merkittävän osan. Näiden muutosten on arvioitu lisäävän viraston työmäärää ainakin siirtymävaiheessa, vaikka pidemmällä aikavälillä esimerkiksi turvapaikkahakemusten määrän voidaan arvioida vähenevän. Lisäksi Euroopan unionin maahanmuutto- ja turvapaikkapolitiikan uudistusta koskevaa lainsäädäntöä aletaan soveltaa kesällä 2026.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Valiokunta pitää välttämättömänä, että uudistusten kokonaisvaikutukset otetaan huomioon Maahanmuuttoviraston resursoinnissa. Riittämätön resursointi voi tietenkin johtaa käsittelyaikojen pidentymiseen. Valiokunta pitää tärkeänä, että resurssit kohdennetaan Maahanmuuttovirastossa tarkoituksenmukaisesti. Virastossa on panostettu automaatioon ja ict-kehitykseen, mikä on jo parantanut prosessien sujuvuutta. Näiden toimien jatkaminen, mukaan lukien tekoälyn hyödyntämisen laajentaminen, on perusteltua. Kehittämistoimet eivät kuitenkaan korvaa riittävää perusresursointia.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Valiokunnan mielestä on lisäksi tärkeää, että mahdollisuuksia Maahanmuuttovirastossa käsiteltävien asioiden vähentämiseen aktiivisesti selvitetään. Mikäli toimintamenoihin kohdistuu liiallisia säästöjä, on riskinä, että käsittelyajat pitenevät eikä tavoiteltua tehokkuushyötyä saavuteta. Valiokunta painottaa, että Maahanmuuttoviraston resurssien tulee olla riittävät ja ennakoitavat sekä uudistusten valmisteluun että niiden toimeenpanoon.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Hallintovaliokunta pitää hyvin tärkeänä, että kansalaisuutta hakevalla henkilöllä on perustiedot suomalaisesta yhteiskunnasta, oikeuksista ja velvollisuuksista. Yhteiskuntatietoedellytys voi parhaimmillaan tukea kotoutumista, osallisuutta ja yhteiskuntaan kiinnittymistä. Valiokunta toteaa, että saadun selvityksen mukaan yhteiskuntaa koskevien tietojen osoittaminen kansalaisuuskokeella on myös muissa maissa varsin yleinen vaatimus.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hallituksen esityksen perusteluista ilmenevistä syistä ja saamansa selvityksen perusteella valiokunta pitää esitystä tarpeellisena ja tarkoituksenmukaisena sekä hyvin valmisteltuna. Valiokunta puoltaa ehdotuksen hyväksymistä muuttamattomana.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Mietintöön on liitetty yksi vastalause. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitokset esittelystä. — Ja sitten edustaja Garedew.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.29\">20.29&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Kaisa&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.29Garedew\">Garedew&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kansalaisuuslain kokonaisuudistus ollaan vihdoin saamassa maaliin. Kolmannen eli viimeisen osan mietintö on nyt valmis ja astumassa voimaan vuoden 2027 alussa. Kansalaisuuslain uudistus on ollut pitkä ja erittäin tärkeä urakka.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Vihreät ja vasemmisto varmaan pitävät tätäkin maahanmuuttajien kiusaamisena, koska he ovat jättäneet kaikkiin uudistusta koskeviin mietintöihin vastalauseen. Heidän mukaansa siis asumisaikavaatimusta ei olisi saanut pidentää Pohjoismaiselle linjalle, tulijoilta ei saisi edellyttää itsensä elättämistä ja lakien mukaan elämistä, eikä heiltä ilmeisesti nyt saisi myöskään vaatia kielen oppimista tai ymmärrystä suomalaisen yhteiskunnan tavoista ja kulttuurista, kuten ymmärrystä naisen yhdenvertaisuudesta. Kysynpä vaan, että millä varjoyhteiskuntia sitten torjutaan ja maahanmuuttajat saadaan motivoitua kotoutumaan, jos ei juuri näillä hallituksen toimilla?&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomalaisen kansallisvaltion arvojen säilyttäminen ja valtion rahojen riittäminen hyvinvointiyhteiskunnan välttämättömiin palveluihin vaativat tiukkaa maahanmuuttopolitiikkaa. Vieraskielisille maksettaviin Kelan tukiin kuluu suomalaisten työtä tekevien veronmaksajien rahoja jo yli miljardi euroa joka vuosi. Vantaalla ja Espoossa noin puolet toimeentulotuen saajista on ulkomaalaistaustaisia.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Suomen valtion ensisijainen tehtävä on pitää huolta suomalaisista. Kukaan muu ei tule rakkaan isänmaamme taloutta pelastamaan tai ylläpitämään suomalaisia kulttuuriperinteitä ja kieltä. Se on tämän maan hallituksen toimien varassa, ja siksi nämä lakimuutokset ovat nyt äärimmäisen tärkeitä. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Keskisarja poissa. — Edustaja Hänninen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.32\">20.32&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.32Hänninen\">Hänninen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomen kansalaisuus on yksi yhteiskuntamme vahvimmista siteistä. Se ei ole pelkkä hallinnollinen päätös vaan luottamuksen osoitus. Se on lupaus siitä, että kansalaisuuden saanut henkilö sitoutuu Suomen lakeihin, arvoihin ja yhteisiin pelisääntöihin. Lausunnossa lähdetään liikkeelle oikeasta ja tarpeellisesta perusajatuksesta. Kansalaisuus ei ole automaatio, se on onnistuneen kotouttamisen tulos.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hallintovaliokunta on vakaasti ja harkitusti lausunut kansalaisuuteen liittyviä ehtoja seuraamaan tämän päivän tilannekuvaa. Olemme päättäneet asumisajan pidentämisestä tässä lausunnossa ja esityksessä sekä nuhteettomuus- ja toimeentuloedellytysten tiukentamisesta. Nyt käsiteltävä kansalaisuuskokeeseen liittyvä lainmuutos täydentää tätä kokonaisuutta loogisesti ja vastuullisesti. Se varmistaa, että Suomen kansalaisuuden saavalla on perustiedot siitä, miten suomalainen yhteiskunta toimii, mitä oikeuksia kansalaisilla on ja mitä velvollisuuksia niihin liittyy. Tämä on tärkeä osa kansalaisuuteen sitoutumista.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Yhteiskunnan turvallisuus rakentuu pitkälti luottamuksesta: luottamuksesta siihen, että samassa yhteiskunnassa elävät ihmiset tuntevat ja noudattavat yhteisiä sääntöjä. Kansalaisuuskoe vahvistaa tätä perustaa. Se tukee kotoutumista, ehkäisee eriytymistä ja on samalla ennaltaehkäisevää turvallisuuspolitiikkaa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On myös todettava, ettei Suomi ole tässä poikkeus. Kansalaisuuden edellytyksiin kuuluva yhteiskuntatiedon osoittaminen on käytössä monissa muissa Euroopan maissa. On perusteltua, että myös Suomessa kansalaisuuden saavuttaminen edellyttää ymmärrystä suomalaisesta demokratiasta, oikeusvaltiosta ja yhteisistä arvoista. Vain siten voimme suojata sisäistä turvallisuuttamme kuormittumiselta tässä ajassa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tässä esityksessä ei ole kyse siitä, että jotakuta syrjittäisiin, poljettaisiin, tai kansalaisuuden ehtoja tiukennettaisiin kohtuuttomasti. Kansalaisuuden saamisen tulee olla osoitus suomalaisen kulttuurin kunnioittamisesta. Se ei ole itsestäänselvyys. Siksi tämä esitys ei sulje ketään ulos mutta tekee selväksi, että Suomen kansalaisuus merkitsee vastuuta, omaa halua ja tahtoa sekä yhteisiä pelisääntöjä. Jokainen voi omilla toimillaan yhä tavoitella kansalaisuutta. Se on viesti, joka vahvistaa sekä suomalaisuutta että yhteiskuntamme kestävyyttä. Se on viesti, joka tänä päivänä on yhteiskuntamme tulevaisuuden kannalta kriittisen tärkeä. — Kiitos, arvoisa puhemies. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Strandman poissa, edustaja Simula poissa. — Edustaja Vigelius.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.36\">20.36&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Joakim&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.36Vigelius\">Vigelius&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Käsittelemme kansalaisuuskokeen käyttöönottoa eli yhtä uutta kansalaisuuden saamisen ehtoa ulkomaalaisille Suomessa. Näitä tiukennuksiahan on tässä vaalikauden mittaan jo tehty, ja tämä olisi viimeinen osassa sitä pitkää sarjaa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tämä kansalaisuuskoe on käytössä suuressa osassa Eurooppaa ja myös monia muita länsimaita. Siksi hieman ihmettelen, että tätäkin ehtoa vihreät ja vasemmistoliitto vastustavat tässä viimeisessäkin vaiheessa. Hallintovaliokunnassa vihreät ja vasemmistoliitto jättivät vastalauseensa tähän kansalaisuuskokeen käyttöönottoon, ja ajattelin, että käydäänpä läpi tätä vastalausetta ja sen perusteluita.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ensinnäkin vihreät ja vasemmistoliitto kyseenalaistavat kansalaisuuskokeen tavoitteiden toteutumisen ja tarkoituksenmukaisuuden tilanteessa, jossa kotoutumispalveluiden rahoitusta ja saatavuutta heikennetään. Myöskään esityksen yhdenvertaisuuteen liittyviä ongelmia ei ole heidän mukaansa valiokuntakäsittelyssä otettu tarpeeksi huomioon. He kertovat tässä vastalauseessaan, että kansalaisuuden ehdot ovat jo selvästi kiristyneet, ja siinä vaiheessa, kun henkilö tekisi kokeen, olisi hän todellisuudessa jo hyvin pitkälle kotoutunut. He listaavat tässä vastalauseessaan, kuinka asumisaikaedellytystä on korotettu, kuinka toimeentuloedellytystä on kiristetty, kuinka nuhteettomuutta edellytetään entistä enemmän, kuinka vaaditaan yleisen kielitutkinnon läpäisemistä. Samaan aikaan he ovat itse vastustaneet näistä liki jokaista kiristystä. Siis jokaista kiristystä, mitä tällä hallituskaudella on tehty, he ovat olleet vastustamassa, ja nyt he perustelevat sillä, että kun näitä on jo kiristetty, niin ei tätäkään kiristystä pitäisi tehdä. Tosiasiallisesti se on ollut kategorista vastustamista kaikkia näitä kiristyksiä kohtaan täällä eduskunnassa. Kerta toisensa jälkeen on painettu punaista nappia: ei vaadita enempää heiltä, jotka saavat Suomen kansalaisuuden eli tulevat yhteiskunnan täysiverisiksi jäseniksi, saavat täydet poliittiset oikeudet, saavat täydet oikeudet äänestää jokaisissa vaaleissa, saavat täydet oikeudet tulla ja pysyvästi jäädä Suomeen liki peruuttamattomasti — ei voi vaatia enempää, kertovat meille vihreät ja vasemmistoliitto.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">No, sen lisäksi he toteavat, että mahdolliseen kokeeseen valmistautuminen ja sen suorittaminen eivät lisää osallisuutta: 1) ne eivät lisää osallisuutta ja suomalaiseen yhteiskuntaan integroitumista, vaan 2) kansalaisuuskokeen suorittamisvelvollisuus voi hidastaa sitä. Siis se, että suoritat kansalaisuuskokeen, hidastaisi integroitumistasi Suomeen. [Puhuja naurahtaa] Voiko joku avata? Voivatko vihreiden tai vasemmistoliiton edustajat avata sitä, miten kansalaisuuskokeen suorittaminen hidastaa ihmisen integroitumista Suomeen? Miten se, että sinulla on kannustin oppia suomalaista kulttuuria, historiaa, yhteiskuntaa, meidän normeja, hidastaa ihmisen integroitumista tähän maahan? Eikö se nimenomaisesti vauhdita, luo ihmiselle kannustimen — ja jos ei sisäistä kannustinta ole, niin ulkoisen kannustimen — oppia suomalaista kieltä, kulttuuria, yhteiskuntaa, historiaa, kaikkea sitä.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ja vielä: 3) ilman asianmukaista tukea koe voi lisätä psykologista stressiä erityisesti haavoittuvassa asemassa oleville. Mietin, että onkohan tässä juuri syy siihen meidän opetusjärjestelmän ja koulujärjestelmän heikentyviin tuloksiin, jos tällainen ajattelu on yleistäkin, että kokeet aiheuttavat psykologista stressiä ja sen takia niitä ei tulisi järjestää. Annetaan vaan läpäisty suoritus henkilöille mitään kokeilematta ja heidän tietotasoansa kokeilematta, niin ei tule stressiä. Kaikille paperit kouraan, niin saadaan varmasti loistavia tuloksia aikaan. Aivan uskomatonta argumentointia, mitä eduskuntatasollakin nähdään. Huh huh. [Mauri Peltokangas: Stressitöntä hillumista!] &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ihmettelin myös valiokuntatasolla hieman sitä, että täällä todetaan näistä kokeen kustannuksista ihan relevantti argumentti siitä, mitä tämä voi kokeen tekijälle kustantaa. Kansalaisuuden saaminen toki tuo myös paljon oikeuksia, joten siitä voi varmasti jotain veloittaakin. Mutta täällä vihreät ja vasemmistoliitto toteavat: ”Lisäksi koe, etenkin, mikäli sen vaikeustaso on liian korkea, voi johtaa maksullisten valmennuspalveluiden syntymiseen, mikä nostaa riskiä etenkin vähävaraisille henkilöiden yhdenvertaiselle osallistumiselle.” Minä itse ajattelen, että voisi olla kyllä ihanteellistakin se, että jos joku ihminen niin intohimoisesti haluaa Suomen kansalaisuuden, että on valmis kouluttamaan itseään, on valmis käymään kielikursseilla omaan piikkiin, on valmis opiskelemaan, saamaan joltakin tukea rahaa vastaan siihen, että oppii suomalaista yhteiskunnallista tietämystä, meidän lainsäädäntöä ja muuta, niin eikö se ole vain hyvä asia? Jos joku on valmis omasta pussistaan laittamaan rahaa peliin, eikä niin, että valtio ja veronmaksajat kustantavat tämänkin kotouttamisen, mutta vihreät ja vasemmisto näkevät tämän yhdenvertaisuusongelmana, että kaikilla ei ole varaa siihen tai että kaikki eivät sitä hankkisi. Niin se vaan tässä yhteiskunnassa menee, että jotkut ovat valmiita panostamaan osaamiseensa enemmän, jotkut ovat valmiita heittämään enemmän rahaa likoon siihen, että oppii erilaisia taitoja. Eihän meidän yhteiskunnassa pyrkimyksenä ole tasapäistää ihmisiä ja viedä heiltä mahdollisuuksia parempaan ymmärrykseen, parempiin taitoihin, parempaan osaamiseen. Minkä ihmeen takia maahanmuuttaja ei voisi hakea itselleen parempaa ymmärrystä ja valmistautumista kokeeseen, vaikka sitten maksamalla jollekin siitä palvelusta?&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kaiken kaikkiaan vihreät ja vasemmistoliitto esittävät tämän — siis tämänkin — kansalaisuuslainsäädännön ehdon kiristämisen hylkäämistä. Kaiken edellä olevan perusteella he sitä ehdottavat, ja siksi tämä eduskunta pääsee siitä nyt vielä viimeisessä äänestyksessään äänestämään. Ilokseni voin todeta, että vihreiden ja vasemmistoliiton vastustus tässä salissa ei tule riittämään, vaan tämäkin kansalaisuuslain kiristys tullaan saamaan läpi, ja täten Suomen kansalaisuuden ehdot, sen saamisen ehdot, tulevat kiristymään, mikä on erittäin hyvä asia koko Suomen kansalle ja sen nykyisille ja tuleville kansalaisille. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Polvinen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.44\">20.44&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Mikko&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.44Polvinen\">Polvinen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Kyse on kansalaisuuslain muutoksen kolmannen vaiheen ykköskäsittelystä. Keskusta on yhtynyt mietintöön.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nyt puheena olevan kolmannen vaiheen päätavoitteena on tiukentaa kansalaistamisen edellytyksiä ja korostaa, että Suomen kansalaisuus seuraa onnistuneesta kotoutumisesta, eikä se ole automaatio. Nyt ollaan luomassa yhtenäinen, ennakoitava ja oikeusturvan huomioiva kansalaisuuskoejärjestelmä, jossa hakijan tulee osoittaa riittävät perustiedot suomalaisesta yhteiskunnasta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuslakiin lisättäisiin yhteiskuntatietoedellytys, joka on erillinen kielitaitovaatimuksesta. Hakijan on osoitettava riittävät tiedot suomen ja ruotsin kielellä. Sen mittaamiseksi otetaan käyttöön uusi kansalaisuuskoe, joka on sähköinen, tietopohjainen ja pääosin monivalintakoe. Koe perustuu julkiseen ja ennalta määritettyyn oppimateriaaliin, joka mittaa perustietoja muun muassa perus- ja ihmisoikeuksista, suomalaisesta oikeus- ja hallintojärjestelmästä sekä yhteiskunnan toiminnasta, arjesta ja historiasta — kuulostaa hyvältä. Kansalaisuuskoetta ei vaadita, jos hakija on suorittanut suomen- tai ruotsinkielisen ylioppilastutkinnon tai suomen- tai ruotsinkielisen korkeakoulututkinnon. Hakijoilta perittäisiin kansalaisuuskokeen osallistumismaksu, mahdollisia uusintakoemaksuja. Tutkintorinnastuksella pyritään vähentämään hakijakustannuksia niillä, joilla osaaminen on jo osoitettavissa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Alkuvaiheen investoinnit kansalaisuusjärjestelmään maksavat noin 4,2 miljoonaa, ja toki tässä byrokratia lisääntyy. Itse näen, että tämä voidaan ajatella investointina välttää tulevaisuudessa kasvavia kustannuksia, joista meillä on Suomessa jo valitettavasti kokemuksia. Maahanmuuttovirastolle tulisi kansalaisuuskoejärjestelmän kokonaisvastuu. Tämä tarkoittaisi kokeen hallinnointia, valvontaa ja kehittämistä, sopimusten tekemistä kokeen laatijoiden ja järjestäjien kanssa. Maahanmuuttovirastoon kohdistuu selkeä lisäresurssitarve ja valmisteluvaiheessa useita henkilötyövuosia sekä pysyvästi noin kolmen henkilötyövuoden lisätyöpanos.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Minä vähän hämmästelen sitä, että esimerkiksi synnyinkunnassani Kuhmossa Migriä ajetaan alas, ja siellä on alan ammattilaisia, ja nyt sitten tätä pumppausliikettä tehdään. Ehkä tämä rytmitys voisi olla vähän sujuvampi. Näitä työpaikkoja, mitä tuolta lakkautetaan, olisi voitu tämän lain myötä myöskin säilyttää siellä. En tiedä, minne nämä työpaikat nyt sitten seuraavaksi syntyvät, mutta voisin kuvitella, että nekin keskitetään suuriin kaupunkeihin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Se on hyvä, että Suomen kansalaisuus pitää ansaita, eikä se ole automaatio. Sen ei tarvitse olla automaatio. Keskusta kritisoi ensimmäisen vaiheen muutosesityksen vastalauseessaan sitä, että hallitus on ottanut tavakseen tehdä isoja uudistuksia tuomalla eduskunnalle lakiesityksiä tipoittain. Valiokunnissa on silloin ollut mahdotonta muodostaa uudistuksista ja sen vaikutuksista kokonaiskäsitystä. Hallituksen toinen helmasynti on ollut nojautua hallitusohjelmaan asiantuntija-arvioista ja vaikutuksista piittaamatta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Samaan aikaan, kun hallitus lisää Maahanmuuttoviraston, tuomioistuinten ja poliisien työmäärää ulkomaalaislakien muutoksilla, leikkaa se niiden rahoitusta tuottavuusohjelmallaan. Voimavarojen niukkuus on kuitattu hallituksen esityksissä ja ministeriöiden vastineissa sillä, että tehtävä toteutetaan budjettimäärärahojen puitteissa. Kuitenkin hyvätkin lait ilman riittäviä voimavaroja aiheuttavat sen, että lain tavoitteet jäävät toteutumatta, ja kyllä tässä omalla kohdallani sellainen huoli on, että näitten resurssien puutteen takia tämä hyvä laki voi hidastua ja sen toimeenpanossa olla haasteellisuuksia. Siksi näistä resursseista täytyy todella kantaa huolta ja myös pitää sellaista järjestystä, että ne jatkossa sitten kuitenkin riittävät. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Kilpi.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.48\">20.48&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Marko&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.48Kilpi\">Kilpi&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Meillä on tässä käsittelyssä nyt kansalaisuuskoe. Ajattelisin niin — ja saattaa olla, että joku muukin voisi herkästi ajatella niin — että mikäli maahanmuuttaja haluaa aidosti kotoutua ja integroitua tähän suomalaiseen yhteiskuntaan, niin tällainen kansalaisuuskokeen suorittaminen voisi olla minimivaatimus, jotain sellaista, mikä olisi täysin selvä ja itsestäänselvä asia.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On jotenkin hyvin vaikea nähdä tällaisen suorittamisessa mitään väärää tai haitallista, mutta kyllä tässä on käynyt hyvinkin ilmi, että vasemmistoliitto ja vihreät ovat kuitenkin nostaneet esiin, että sellaisen vaatiminen aiheuttaa psykologista stressiä. En tiedä, kuinka pitkälle meidän tehtävänä on suojella maahanmuuttajia psykologiselta stressiltä. Onko tämä niin epäinhimillinen asia, että sitä ei voida vaatia? En tiedä. Nimittäin poliisin työssä olen useasti törmännyt maahanmuuttajataustaisiin ihmisiin, joilla on varsin vähäiset ja joskus jopa olemattomat tiedot suomalaisesta yhteiskunnasta, vaikka he ovat saattaneet olla täällä jo huomattavankin pitkän aikaa. Vähintään yhtä usein tällaiset henkilöt ovat sitten joutuneet tekemisiin poliisin kanssa, ja hyvin usein ne ongelmat, mitä siellä on syntynyt, ovat johtuneet siitä tilanteesta, että ne tiedot suomalaisesta yhteiskunnasta ja siitä, miten täällä eletään ja ollaan, ovat olleet niin vähäisiä.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Väittäisin, että kansalaisuuskoe ei pitkitä integroitumista, se ei pitkitä sitä kotoutumista, vaan päinvastoin: se helpottaa, se sujuvoittaa, se lyhentää. Käsitykseni mukaan tämänkaltaisia kansalaisuuskokeita on monessa Euroopan maassa ja muuallakin länsimaissa käytössä. Niistä on saatu hyviä kokemuksia, ja niitä pidetään täysin itsestäänselvinä asioina. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Viljanen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.51\">20.51&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Eerikki&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.51Viljanen\">Viljanen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Kansalaisuuslain muutoksen kolmannen vaiheen päätavoitteena on tiukentaa kansalaistamisen edellytyksiä ja korostaa, että Suomen kansalaisuus seuraa onnistuneesta kotoutumisesta eikä se ole automaatio. Tämä linja on erittäin kannatettava.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nyt ollaan luomassa yhtenäinen ennakoitava ja oikeusturvaa huomioiva kansalaisuuskoejärjestelmä, jossa hakijan tulee osoittaa riittävät perustiedot suomalaisesta yhteiskunnasta, kuten perus- ja ihmisoikeuksista, kansalaisten velvollisuuksista, meidän demokraattisesta järjestelmästämme, sen toiminnasta ja ylipäänsä arkisesta elämästä täällä rakkaassa koti-Suomessa. Tämä linja on erittäin kannatettava.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tähän asian käsittelyyn liittyy kuitenkin yksi haaste, ja se liittyy tämän lainsäädännön mukanaan tuomaan väistämättömään byrokratian lisääntymiseen tämän käytännön toimeenpanosta. Tässä yhteydessä voi ehkä todeta, että byrokratia on tässä yhteydessä välttämätön paha ja palvelee tarkoitustaan, mutta samaan aikaan Maahanmuuttovirastolle, jolle tulee kansalaisuuskokeen järjestämisestä päävastuu, ei olla osoittamassa lisää resursseja. Itse asiassa päinvastoin Maahanmuuttovirasto on valtion tuottavuusohjelmassa entisellä tavalla mukana, ja siten resurssit ovat niukkenemassa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kannatan esitystä, mutta joudun toteamaan, että sen menestyksellinen toteuttaminen edellyttää riittäviä resursseja Maahanmuuttovirastolle, jonka vastuulle tämän toimeenpano nyt tulee. Hallituksen ja hallituspuolueiden tehtävänä onkin nyt riittävät resurssit Maahanmuuttovirastolle turvata, jotta tämä lainsäädäntö kyetään toimeenpanemaan siinä muodossa ja sillä aikataululla kuin me täällä tulemme päättämään, jotta tämä lainsäädäntö tulee johtamaan niihin tuloksiin, joita me kaikki siltä odotamme.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Garedew.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.53\">20.53&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Kaisa&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.53Garedew\">Garedew&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kansalaisuuskoe on tärkeä lisä kansalaisuuden saamisen uusien edellytysten joukossa. Kokeen perimmäisenä tarkoituksena on mitata tänne kotoutumisen onnistumista. Koe on aiheellinen, sillä ei ole mitään syytä myöntää kansalaisuutta henkilölle, joka ei vielä vuosien täällä asumisenkaan jälkeen ole ollut halukas perehtymään siihen, miten suomalainen yhteiskunta toimii. Kokeen avulla siis selvitettäisiin, mitä hakija tietää yhteiskuntamme perusperiaatteista sekä yksilön oikeuksista ja velvollisuuksista, kuten naisten tasa-arvosta ja siitä, miten he ovat yhdenvertaisia täällä Suomessa meidän kulttuurissa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Myös muissa maissa on käytössä vastaavia kokeita, eikä tämäkään maahanmuuttopolitiikan tiukennus siis ole kansainvälisestä näkökulmasta mitenkään poikkeuksellinen. Suomessa on vain totuttu aivan käsittämättömään vasemmistolaiseen lepsuun linjaan, kunnes onneksi perussuomalaiset pääsivät hallitukseen laittamaan asioita oikeille raiteille.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomi on maailman paras maa jopa monen virallisen mittapuun mukaan: maailman onnellisin, maailman vapain sekä yksi turvallisimmista ja vähiten korruptoituneista maista. Koska me arvostamme Suomea, haluamme, että myös tänne muualta muuttavat oppivat arvostamaan rakasta isänmaatamme. Suomen kansalaisuuden tulee olla arvokas etuoikeus, jonka saamiseksi tulee nähdä vaivaa, ja onneksi kansalaisuuslain kokonaisuusuudistuksen myötä se sellaiseksi muuttuukin. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Vigelius.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"20.56\">20.56&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Joakim&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"20.56Vigelius\">Vigelius&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomen kansalaisuuden ei tule olla halpaa jakotavaraa, mutta valitettavasti se on kyllä sitä tähän asti ollut. Meillä on jaettu ihan eurooppalaisessakin vertailussa Suomen kansalaisuuksia hyvin löperöin ehdoin, ja ajattelinkin, että tehdäänpä pientä vertailua. Kymmenen Euroopan maan keskuudessa, joita ovat Ruotsi, Tanska, Norja, Saksa, Ranska, Espanja, Italia, Iso-Britannia, Unkari, Viro, Suomi on liki poikkeuksetta löperöimpiä ehtoja kansalaisuus- ja kansalaistamispolitiikassaan soveltanut maa, siis ennen kuin tämä hallitus lähti kansalaisuuden ehtoja kiristämään.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Aloitetaan ensimmäisestä kiristyksestä, joka tehtiin. Aiemmin Suomessa vaadittiin ulkomaalaiselta, joka Suomen kansalaisuutta haki, viiden vuoden asumisaika. Lähtökohtaisesti viisi vuotta piti olla asunut Suomessa, että voi hakea kansalaisuutta. Näiden kymmenen maan vertailussa suurin osa vaati tuolloin pari vuotta sitten enemmän. Suurin osa näistä maista vaati enemmän asumisaikaa kuin mitä Suomi silloin vaati, sellaiset ihan sivistyneet valtiot kuin Norja, Tanska, Saksa, Espanja, Italia, Viro, Unkari. Nyt vihdoin Suomi päätti parisen vuotta sitten, että perussuomalaisten esityksestä hallituksen toteuttamana asumisaikavaatimusta korotettiin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Entäpä toimeentulovaatimus, siis se, että ulkomaalainen, joka hakee Suomen kansalaisuutta, tulisi tässä maassa omillaan toimeen? Sellaista vaatimusta ei Suomessa ollutkaan aiemmin. Kansalaisuuden ehtona ei ollut erillistä toimeentulovaatimusta. Myös siinä me oltiin näiden vertailumaiden löperöimpien, kevyimmin kansalaisuuksia myöntävien maiden joukossa. Enemmän jo tuolloin vaativat Tanska, Saksa, Ranska, Espanja, Italia, Unkari, Viro. Nyt vaadimme: hyväksyimme toimeentulovaatimuksen jo aiemmin eduskunnassa, toisessa osassa kiristyssarjaa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Entäpä nyt kolmas vaatimuserä, kun lisätään kansalaisuuskoe kansalaisuuden saamisen ehtoihin? Myöskään sitä Suomessa ei ollut. Ei ollut aiemmin kansalaisuuskoetta, toisin kuin suuressa osassa näitä vertailumaita. Aiemmin kansalaisuuskoe oli käytössä Pohjoismaissa, kuten Norjassa ja Tanskassa, keskisen Euroopan maissa, kuten Saksassa, Ranskassa, Espanjassa, Isossa-Britanniassa, ja toisaalta itäisemmässä Euroopassa, Unkarissa ja Virossa. Suurin osa vertailumaista omasi kansalaisuuskokeen, Suomi ei omannut.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kun yhteensä katsotaan tätä palettia, niin Suomi on käytännössä harjoittanut löperöintä ja lepsuinta kansalaistamispolitiikkaa, myöntänyt kansalaisuuksia löperöimmin ehdoin yhdessä Ison-Britannian ja Ruotsin kanssa. Siinä ovatkin muuten huonon maahanmuuttopolitiikan mallimaat Euroopassa, varoittavat esimerkit siitä, mitä voi käydä, jos maahanmuuttopolitiikkaa harjoitetaan huonosti ja jos kansalaisuuksia jaetaan leväperäisesti.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Onneksi Suomi otti opiksi. Jos emme olisi ottaneet — Ruotsikin tällä hetkellä kiristää omaa kansalaisuuspolitiikkaansa — me olisimme käytännössä Euroopan pohjasakkaa tässä vertailuryhmässä. Nyt sekä Suomi että Ruotsi ovat muuttaneet linjaansa, toivottavasti myös Iso-Britannia pikkuhiljaa paineen lisääntyessä. Tämä on yleiseurooppalainen suunta, ja on erinomainen asia, että Suomikin vaatii kansalaistettaviltaan enemmän.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Peltokangas.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"21.00\">21.00&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Mauri&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"21.00Peltokangas\">Peltokangas&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitos, arvoisa rouva puhemies! Ihan muutaman sanan ajattelin vielä sanoa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tässä kohtaa olen erittäin iloinen siitä, että olemme saaneet valmiiksi koko paktin. Ensimmäisessä vaiheessa toteutettiin asumisaikaedellytykset, toisessa vaiheessa hallitusohjelman mukaiset muutokset, jotka koskivat selvitettyä henkilöllisyyttä, kansallisen turvallisuuden kuvioita, nuhteettomuusvaatimusta, toimeentuloedellytystä sekä myöskin sitä mahdollisuutta, että voi menettää kansalaisuuden. Siis hyvin selkeitä asioita, jotka ainakin omasta tulokulmastani olisi ollut hyvä olla tässä maassa jo vuosikymmeniä sitten saatettu siihen tilaan, mihin nyt hallitus nämä saattaa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nyt käsillä olevassa mietinnössä ehdotukset koskevat siis kansalaisuuslakia. Kansalaisuuskoe on erittäin hyvä mittari sille, millä tavalla tulija suhtautuu. Onhan se ihan selvää, että priimusoppilaat, jotka tosiaan perehtyvät asioihin ja saavat hyvät tulokset kansalaisuuskokeesta, osoittavat kyllä sitten myöskin kiinnostusta sitä uutta yhteiskuntaa kohtaan, ja hyvä niin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toivon, että tämä antaa meille hyviä eväitä ja tuo mukanaan hyviä tuloksia. — Kiitoksia.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Toinen varapuhemies Tarja Filatov\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Vigelius.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"21.01\">21.01&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Joakim&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"21.01Vigelius\">Vigelius&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Lyhyesti vielä kommenttiluonteinen puheenvuoro. Keskustalaiset edustajat Viljanen ja Polvinen esittivät aiemmin kritiikkiä sitä kohtaan, että samalla kun näitä kansalaisuuden ehtoja kiristetään, niin käytännössä Maahanmuuttovirastolle tulee enemmän vastuita. He kritisoivat hallitusta siitä, että emme ole osoittaneet lisää rahaa näiden tehtävien hoitamiseen Maahanmuuttovirastolle ja käytännössä valtionhallintoon.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On hyvä muistuttaa siitä, että keskusta on kyllä nyt parissa vaihtoehtobudjetissaan hyväksynyt hallituksen tekemät valtionhallinnon säästöt, mikä väistämättä tarkoittaa sitä, että niitä kohdistuu myös yksittäisille virastoille, kuten Maahanmuuttovirastolle, ellei keskusta nimenomaisesti halua, että Maahanmuuttovirasto olisi valtionhallinnon säästöjen ulkopuolella. Jos on, niin se olisi hyvä osoittaa sitten omissa vaihtoehtobudjeteissa ja puheissa laajemminkin. Mutta selvää on, että jos jostakin pitää säästää, niin valtionhallinto on yksi niistä keskeisistä kohteista, joista on löydettävä säästöjä. On pystyttävä tekemään asioita fiksummin ja tehokkaammin, jotta rahaa riittää tulevaisuudessa ja jotta rahaa voidaan käyttää tärkeämpiin asioihin, joita valtiollakin on hoidettavanaan.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Jos valtionhallinnosta säästetään, niin kyllä se jossain näkyy. Eli ei voi samaan aikaan esittää, että valtionhallinnosta pitää säästää satoja miljoonia, ja samaan aikaan kuvitella, että se ei näy missään, esimerkiksi siinä, miten toimipisteitä on sijoiteltuina eri virastoilla ympäri Suomea. Eli jos keskusta hyväksyy valtionhallinnon säästöjä, kuten useissa vaihtoehtobudjeteissaan, niin ehkä kannattaa myös hyväksyä se tosiasia, että se saattaa tarkoittaa, että Maahanmuuttovirastolla, Kelalla tai muilla viranomaisilla ei välttämättä ole toimipisteitä yhtä laajasti kuin nykyisessä Suomen palvelujärjestelmässä. Nämä realiteetit on hyvä tunnustaa, jos on valmis säästöt hyväksymään.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv id=\"PaatoksentekoToimenpide\" class=\"PaatoksentekoToimenpide\">\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cp class=\"edk-KappaleKooste\">Yleiskeskustelu päättyi.&nbsp;\u003C/p>\n     \u003Cp class=\"edk-KappaleKooste\">Eduskunta hyväksyi hallituksen esitykseen HE 54/2026 vp sisältyvien 1.—3. lakiehdotuksen sisällön mietinnön mukaisena. Lakiehdotusten ensimmäinen käsittely päättyi.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cspan class=\"edk-EduskuntaTunnus\">\u003C/span>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-33269",nav:"\u003Cnav id=\"VaskiNavi\">\n \u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Muut esitysmuodot\u003C/span>\n \u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/pdf/PTK+59/2026+10\" class=\"navilink\">Asiakirjan painoasu (PDF)\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/riksdagshandlingar/PR+59/2026+10\" class=\"navilink\">Dokumentet på svenska\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/PTK%2059%2F2026%20vp?asiakirjatyyppikoodi=PTKPS\" class=\"navilink\">Pöytäkirjan pääsivu\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cul id=\"AsiaKohtaPuheenvuorot\" class=\"navbar-nav nav t-margin\">\n  \u003Cli>\u003Ca href=\"#PuheenjohtajaRepliikki\">Puhemiehen esittely\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.21Peltokangas\">20.21 Mauri Peltokangas ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.29Garedew\">20.29 Kaisa Garedew ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.32H%C3%A4nninen\">20.32 Juha Hänninen kok\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.36Vigelius\">20.36 Joakim Vigelius ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.44Polvinen\">20.44 Mikko Polvinen kesk\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.48Kilpi\">20.48 Marko Kilpi kok\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.51Viljanen\">20.51 Eerikki Viljanen kesk\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.53Garedew\">20.53 Kaisa Garedew ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#20.56Vigelius\">20.56 Joakim Vigelius ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#21.00Peltokangas\">21.00 Mauri Peltokangas ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#21.01Vigelius\">21.01 Joakim Vigelius ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#PaatoksentekoToimenpide\">Päätös\u003C/a>\u003C/li>\n \u003C/ul>\n\u003C/nav>"},uses:{params:["edktunnus"]}}],
