ta/saavutettavuusseloste/",expanded:{contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",expanded:null},name:"Saavutettavuusseloste",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"saavutettavuusseloste",url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",changed:null,created:null,startPublish:"2026-03-19T07:20:56Z",stopPublish:null,saved:null,status:null,teaserTitle:"Saavutettavuusseloste",teaserText:"Eduskunta haluaa taata kaikille yhdenvertaisen mahdollisuuden asioida sähköisissä palveluissaan. Verkkosivustoa koskee laki digitaalisten palvelujen tarjoamisesta, jonka mukaan julkisten verkkopalvelujen tulee olla saavutettavia. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Tietosuojaselosteet",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:{contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:null},name:"Tietosuojaselosteet",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"tietosuojaselosteet",url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",changed:null,created:null,startPublish:"2025-04-03T11:57:48Z",stopPublish:null,saved:null,status:null,teaserTitle:"Tietosuojaselosteet",teaserText:"Eduskunnan tietosuojaselosteissa kerrotaan muun muassa henkilötietojen käsittelyn tarkoituksesta, mihin tietoja säännönmukaisesti luovutetaan, miten kauan henkilötietoja säilytetään.",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/sivukartta/",title:null,target:null,text:"Sivukartta",contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:{contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:null},name:"Sivukartta",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sivukartta",url:"/fi/tietoa-sivustosta/sivukartta/",changed:null,created:null,startPublish:"2026-03-19T11:01:19Z",stopPublish:null,saved:null,status:null,teaserTitle:"Sivukartta",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/fi/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"_self",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"_self",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"_self",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"_self",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"_self",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"_self",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"_self",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"_self",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/fi/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"_self",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"_self",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"_self",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"_self",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"_self",contentLink:"1796"},{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"_self",contentLink:"18"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"_self",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"_self",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"_self",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"_self",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/fi/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"_self",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"_self",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"_self",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"_self",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"_self",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/fi/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"_self",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/fi/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"_self",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"_self",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"_self",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"1659"},{children:[],relatedContent:[],name:"EU-tiedonlähteet ja asiakirjat",teaserText:"Tämä sivu kokoaa keskeiset Euroopan unionia koskevat tiedonlähteet sekä ohjeet EU-asiakirjojen ja tietokantojen käyttöön. Tavoitteena on helpottaa EU-asioihin liittyvän virallisen aineiston löytämistä sekä mahdollistaa tiedon hakeminen Euroopan unionista yleisesti ja eri aihealueilta. \n\nLinkit johtavat ensisijaisesti EU:n virallisiin lähteisiin ja virastojen verkkosivuille. Jos suomenkielistä sisältöä ei ole saatavilla, linkki ohjaa englanninkieliselle sivulle. Kaikki linkit avautuvat uuteen välilehteen.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-tiedonlahteet-ja-asiakirjat/",selected:false,targetFrame:"_self",contentLink:"8196"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/fi/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"_self",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. Vanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/fi/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"_self",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/fi/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"_self",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/fi/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"_self",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/fi/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/fi/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/fi/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/fi/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/fi/asiat-ja-aanestykset/",selected:false,targetFrame:"_self",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/fi/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"_self",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/fi/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"_self",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/fi/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"_self",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"_self",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"_self",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"_self",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/fi/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"_self",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"_self",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"_self",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"_self",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"_self",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"_self",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"_self",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"_self",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"_self",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"_self",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"_self",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"_self",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"_self",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"_self",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"_self",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"_self",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"_self",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/fi/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"_self",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"_self",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"_self",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"_self",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. \nOpastuksen aikana opas kertoo eduskunnan toiminnasta, eduskunnan tehtävistä, kansanedustajan työstä ja Eduskuntatalon keskeisimmistä tiloista.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/fi/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"_self",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/fi/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"_self",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"_self",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"_self",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"_self",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"_self",contentLink:"64"}],relatedContent:[{children:[],relatedContent:[],name:"Ota yhteyttä kansanedustajaan",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Katso täysistuntosuunnitelma ja muut tapahtumat",teaserText:null,url:"/fi/?epsremainingpath=taysistunnot-ja-tapahtumat",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/avoin-data",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null}],name:"Vieraile ja osallistu",teaserText:"Eduskuntatalo on avoin vierailijoille. Voit varata paikan opastetulle kierrokselle varauspalvelun kautta. Voit myös seurata eduskunnan täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä tilaisuuksina suorana verkossa. Jokaisella on mahdollisuus vaikuttaa päätöksentekoon. Voit keskustella ja kertoa mielipiteesi, kun uusia lakeja suunnitellaan.",url:"/fi/vieraile-ja-osallistu/",selected:false,targetFrame:"_self",contentLink:"50"}],subMenuItems:[],breadcrumbItems:[{name:"Eduskunta",teaserText:null,url:"/fi/",selected:true,targetFrame:"_self",contentLink:null}],languageMenuItems:[{name:"en",url:"/en/"},{name:"sv",url:"/sv/"}],alternateLanguages:[{name:"en",url:"/en/"},{name:"sv",url:"/sv/"},{name:"fi",url:"/fi/"}],headerFooter:{headerLinks:[{name:"Verkkolähetykset ja videot",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/",selected:false,targetFrame:"_blank",contentLink:null},{name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:"_top",contentLink:null},{name:"Avoin data",teaserText:null,url:"/fi/?epsremainingpath=%2Favoin-data",selected:false,targetFrame:null,contentLink:null},{name:"Medialle",teaserText:null,url:"/fi/medialle/",selected:false,targetFrame:null,contentLink:null}],footerShortcutLinks:[{name:"Ota yhteyttä tai tule vierailulle",teaserText:null,url:"/fi/ota-yhteytta-tai-tule-vierailulle/",selected:false,targetFrame:null,contentLink:null},{name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null},{name:"Puhemiehet",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:null,contentLink:null},{name:"Hae eduskunnan aineistoja",teaserText:null,url:"/fi/haku/",selected:false,targetFrame:null,contentLink:null}],footerSocialMediaLinks:[{name:"Facebook",teaserText:null,url:"https://www.facebook.com/suomeneduskunta",selected:false,targetFrame:"_blank",contentLink:null},{name:"Flickr",teaserText:null,url:"https://www.flickr.com/photos/finnishparliament",selected:false,targetFrame:"_blank ass=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Asiakirjat\u003C/span>\u003C/li>\n    \u003C/ol>\n   \u003C/nav>\n  \u003C/div>\n \u003C/div>\n \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n  \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">9.6.2026 | 17:45\u003C/span>\n \u003C/div>\n \u003Cdiv class=\"PoytakirjaAsiakohta Eduskunnanpoytakirja2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Pöytäkirjan asiakohta\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;PTK&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">62\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"YhteisoTeksti\">Täysistunto&nbsp;\u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Tiistai 9.6.2026 klo 14.01\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv class=\"Asiakohta 236943\">\n   \u003Ch2>\u003Cspan class=\"KohtaNumeroTeksti\">9.&nbsp; \u003C/span>\u003Cspan class=\"KohtaNimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/span>\u003C/span>\u003C/h2>\n   \u003Cdiv class=\"edk-viite\">\n    \u003Cdiv class=\"KohtaAsia\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%2054%2F2026%20vp\">HE 54/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"edk-viite b-margin\">\n    \u003Cdiv class=\"KohtaAsiakirja\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Valiokunnan mietintö\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HaVM%2010%2F2026%20vp\">HaVM 10/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Toimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Toinen käsittely\u003C/div>\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Toiseen käsittelyyn esitellään päiväjärjestyksen \u003Cspan class=\"HarvaKursiiviTeksti\">9.\u003C/span> asia. Nyt voidaan hyväksyä tai hylätä lakiehdotukset, joiden sisällöstä päätettiin ensimmäisessä käsittelyssä. — Siellä ensimmäisen puheenvuoron käyttää edustaja Keskisarja, olkaapas hyvä.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"KeskusteluToimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Keskustelu\u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.18\">16.18&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Teemu&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.18Keskisarja\">Keskisarja&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Iloitsen kansalaisuuslaista niin, että riennän asioiden edelle. Lakihan laittaa kansalaisuuden havittelijan kokeeseen todistamaan tietonsa Suomesta. Laadin valmiiksi kysymykset, helppoja monivalintoja siltä varalta, että suorittajalla on kognitiivisia haasteita. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">No, eka on itse asiassa vaikea. Tietääkö moni tässä salissakaan vastausta? Suomalainen sielunmaisema pohjautuu a) monikulttuuriseen tulkkaukseen ja kotouttamisteollisuuden palveluihin, b) supisuomalaisten alistamiseen, rasismiuikutukseen ja kansalliseen itseinhoon, c) Suomen kansalliskieliin, kirjallisuuteen, Suomen historiaan ja kristillisiin hyveisiin &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toinen kysymys: Suomen kansalaisen on noudatettava a) šariaa ja muuta pakolaismaiden uskonnon pakotusta, b) perinteitä ja tapoja, jotka toimivat loistavasti Afganistanissa, Irakissa ja Somaliassa, c) Suomen lakia. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kolmas kysymys — valitettavasti tarpeen taas viime päivien rikosuutisten takia: Suomessa miehellä on oikeus harjoittaa sukupuoliyhteyttä a) alisteisten vaimojensa ja klaanin päämiesten valitseman neitsyen kanssa, b) lupaa kyselemättä kenen tahansa naikkosen kanssa, joka aiheuttaa himoittavuutensa esimerkiksi vähäpukeisuudella tai humalatilalla julkisella paikalla, c) vain kera täysi-ikäisen ja tolkullisen naisen tai miehen, joka vapaaehtoisesti suostuu kanssakäymiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Vika kysymys. Suomessa on yhteisöllisesti hyväksyttävää a) peukun kaupustelu, b) katin maiskuttelu, [Puhuja maiskuttelee] c) keskiskaljan kulauttaminen. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tällä kokeella saamme Suomeen kelpo kansalaisia, mutta eduskunnalle vielä ylimääräinen lisäkysymys: Miksi maahamme tulvahti ulkolaisia väkivaltarikollisia, raiskaajia ja huumekauppiaita? Miksi? a) Koska Impivaarassa ei ollut niitä tarpeeksi omasta takaa, b) koska se nyt on vaan tätä päivää, c) koska poliitikot niitä tänne viekoittelivat maailman syleilyllä ja Suomen kuoliaaksi halailulla. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Hänninen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.21\">16.21&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.21Hänninen\">Hänninen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomen kansalaisuus on yksi yhteiskuntamme vahvimmista siteistä. Se ei ole pelkkä hallinnollinen päätös vaan luottamuksen osoitus. Se on lupaus siitä, että kansalaisuuden saanut henkilö sitoutuu Suomen lakeihin, arvoihin ja yhteisiin pelisääntöihin. Lausunnossa lähdetään liikkeelle oikeasta ja tarpeellisesta perusajatuksesta: kansalaisuus ei ole automaatio, se on onnistuneen kotoutumisen tulos. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hallintovaliokunta on vakavasti ja harkitusti lausunut kansalaisuuteen liittyvistä ehdoista, jotta ne seuraisivat tämän päivän tilannekuvaa. Olemme päättäneet asumisajan pidentämisestä sekä nuhteettomuudesta ja toimeentuloedellytysten tiukentamisesta. Nyt käsiteltävä kansalaisuuskokeeseen liittyvä lainmuutos täydentää tätä kokonaisuutta loogisesti ja vastuullisesti. Se varmistaa, että Suomen kansalaisuuden saavalla on perustiedot siitä, miten suomalainen yhteiskunta toimii, mitä oikeuksia kansalaisilla on sekä mitä velvollisuuksia niihin liittyy. Tämä on tärkeä osa kansalaisuuteen sitoutumista. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Yhteiskunnan turvallisuus rakentuu pitkälti luottamuksesta, luottamuksesta siihen, että samassa yhteiskunnassa elävät ihmiset tuntevat ja noudattavat yhteisiä sääntöjä. Kansalaiskoe vahvistaa tätä perustaa. Se tukee kotoutumista, ehkäisee eriytymistä ja on samalla ennaltaehkäisevää turvallisuuspolitiikkaa. On myös todettava, ettei Suomi ole tässä poikkeus. Kansalaisuuden edellytyksiin kuuluva yhteiskuntatiedon osoittaminen on käytössä monissa muissa Euroopan maissa. On ollut perusteltua, että Suomessa kansalaisuuden saavuttaminen edellyttää ymmärrystä suomalaisesta demokratiasta, oikeusvaltiosta ja yhteisistä arvoista. Vain siten voimme suojata sisäistä turvallisuuttamme kuormittumiselta tässä ajassa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kannatan esitystä. Lisäksi valiokunnan mietintö täydentää esitystä, ja se on nyt aivan erinomainen. — Kiitos, arvoisa puhemies. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Strandman.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.25\">16.25&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Jaana&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.25Strandman\">Strandman&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Suomen kansalaisuus on arvokas asia. On täysin kohtuullista vaatia, että kansalaisuutta hakeva tuntee suomalaisen yhteiskunnan perusasiat, lait, oikeudet ja velvollisuudet sekä osaa suomen tai ruotsin kieltä riittävällä tasolla.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Esityksessä kansalaisuuden saaminen edellyttää jatkossa kansalaisuuskokeen suorittamista tai vastaavien tietojen osoittamista opinnoilla. Kansalaisuuskokeessa mitataan tietoja suomalaisesta yhteiskunnasta, lainsäädännöstä, tasa-arvosta, oikeuksista ja velvollisuuksista sekä Suomen historiasta ja kulttuurista. Samalla hakijan pitää osoittaa riittävä suomen tai ruotsin kielen taito.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuskoe kuuluu laajempaan kansalaisuuslain uudistukseen, jossa ehtoja on jo kiristetty asumisajan, nuhteettomuuden ja toimeentulon osalta. Tavoitteena on vahvistaa kotoutumista, työntekoa ja suomalaisen yhteiskunnan sääntöjen noudattamista. Suomeen muuttavan pitää ymmärtää, miten suomalainen yhteiskunta toimii. Pitää tuntea suomalaiset lait, sananvapaus, tasa-arvo ja yhteiset pelisäännöt. Kansalaisuuden mukana tulee vastuu. Kansalaisuutta ei pidä myöntää henkilölle, joka ei kykene osallistumaan yhteiskuntaan tai joka rikkoo jatkuvasti suomalaisen yhteiskunnan sääntöjä.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hyvä ratkaisu on myös se, että suomalaisen ylioppilas- tai korkeakoulututkinnon suorittanut voi osoittaa osaamisensa sitä kautta. Jos henkilö on jo opiskellut Suomessa suomeksi tai ruotsiksi, uusia kokeita ei tarvita.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Vastaavat vaatimukset ovat käytössä monissa Euroopan maissa. Norjassa ja Tanskassa kansalaisuuskoe kuuluu jo järjestelmään, ja myös Ruotsi valmistelee vastaavaa mallia. Suomessa tehdään samansuuntaisia ratkaisuja kuin muualla Pohjoismaissa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuskokeen tulee olla selkeä, tasapuolinen ja käytännöllinen. Kysymysten tulee liittyä tavalliseen elämään ja suomalaisen yhteiskunnan perusteisiin. Suomen kansalaisuuden pitää perustua siihen, että ihminen osaa kieltä, tuntee maan tavat ja lait, käy töissä tai pyrkii töihin sekä haluaa aidosti olla osa Suomea. Suomen kansalaisuus on palkinto onnistuneesta kotiutumisesta.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Antikainen poissa. — Edustaja Alametsä, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.28\">16.28&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Alviina&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.28Alametsä\">Alametsä&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vihr&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomen kansalaisuutta hakevalta edellytetään tällä hetkellä nuhteettomuutta, riittävää toimeentuloa, kielitutkinnon läpäisemistä ja kahdeksan vuoden asumisaikaa Suomessa. Hallitus esittää lisäksi kansalaiskoetta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaistaidot ovat tietenkin tärkeitä, mutta jo nyt kansalaisuushakemuksen käsittelyaika Maahanmuuttovirastossa on keskimäärin 34 kuukautta. Kansalaisuuskoe lisäisi byrokratiaa ja pitkittäisi näitä käsittelyaikoja. Kokeen onnistunut toteuttaminen vaatisi merkittäviä taloudellisia panostuksia. Samalla kuitenkin kotoutumispalveluiden rahoitusta ja saatavuutta on heikennetty. Tässä taloustilanteessa kansalaiskoetta järkevämpi kohde käyttää rahaa olisi esimerkiksi kielikoulutuksen lisääminen, sillä sen saatavuudessa on tällä hetkellä merkittäviä ongelmia.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Edellä olevan perusteella ehdotan, että lakiehdotukset hylätään. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Viitala.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.29\">16.29&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.29Viitala\">Viitala&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kansalaisuuskoe on hyvä lisä nykyiseen järjestelmäämme. On perusteltua, että Suomen kansalaisuutta hakevalla henkilöllä on riittävät perustiedot suomalaisesta yhteiskunnasta, sen oikeuksista, velvollisuuksista ja keskeisistä toimintaperiaatteista. Kansalaisuuden saaminen on merkittävä askel ihmiselle, joka on rakentanut elämänsä Suomeen. Siksi on kohtuullista odottaa, että kansalaisuuden hakija tuntee suomalaisen yhteiskunnan perusteita, kuten perus- ja ihmisoikeuksia, yhdenvertaisuutta, sukupuolten tasa-arvoa sekä yhteiskunnan keskeisiä pelisääntöjä. Parhaimmillaan kansalaisuuskoe tukee kotoutumista, vahvistaa osallisuutta ja kannustaa perehtymään suomalaiseen yhteiskuntaan. On tärkeää, ettei kansalaisuuskoetta nähdä irrallisena testinä, vaan osana laajempaa kotoutumisen kokonaisuutta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On kuitenkin syytä korostaa, että onnistuneen kotoutumisen tärkein edellytys on edelleen kielitaito. Suomen tai ruotsin kielen osaaminen on avain esimerkiksi työelämään, koulutukseen ja täysipainoiseen osallistumiseen yhteiskunnassamme. Siksi kielikoulutukseen ja kielen oppimisen mahdollisuuksiin on panostettava nykyistä vahvemmin. Samalla on huolehdittava siitä, että kotoutumispalvelut ovat saatavilla heti maahan saapumisesta lähtien. Mahdollisimman nopea aloitus kieliopinnoissa, ohjauksessa ja muissa kotoutumista tukevissa palveluissa antaa parhaat mahdollisuudet rakentaa elämää Suomessa ja kiinnittyä osaksi yhteiskuntaa. Kun yhteiskunta tarjoaa toimivat palvelut ja aidot mahdollisuudet kotoutumiseen, voidaan myös yksilöltä odottaa aktiivista osallistumista ja vastuunkantoa omasta kotoutumisestaan.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kansalaisuuskoe voi olla toimiva väline suomalaisen yhteiskunnan tuntemuksen vahvistamisessa. Sen onnistuminen riippuu kuitenkin ennen kaikkea siitä, että kotoutumisen palvelut, kielikoulutus ja viranomaisten resurssit ovat kunnossa. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Immonen poissa. — Edustaja Honkasalo, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.31\">16.31&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Veronika&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.31Honkasalo\">Honkasalo&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vas&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tämä perussuomalaisten puolueen varapuheenjohtajan, kansanedustaja Keskisarjan puhe osoitti, että ehkä sitä kansalaisuuskoetta pitäisi soveltaa sinne perussuomalaisiinkin, [Perussuomalaisten ryhmästä: Ohhoh!] että pysyisi keskustelu sivistyneenä. On järkyttävää kerta toisensa jälkeen kuulla tässä salissa näin rasistista ja naisvihamielistä puhetta. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kansalaisuuden saamisen ehtoja on todella tällä hallituskaudella kiristetty usealla esityksellä, ja käsittelyssä olevan kansalaisuuslain muutoksen julkilausuttuna tavoitteena on, että kansalaisuutta hakeva osoittaa onnistuneensa kotoutumisessa. Samaan aikaan Orpon hallitus on tuonut lukuisia lainsäädäntöesityksiä, joilla nimenomaan maahanmuuttajien asemaa on kiristetty. Samaan aikaan eduskunta käsittelee kotoutumislain muutoksia, joilla leikataan 36 miljoonaa euroa kotoutumisen rahoista kunnissa. Kuntaliitto on laskenut, että hallitus on leikannut tähän mennessä kotoutumisesta kaudellaan yhteensä jo 156 miljoonaa euroa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Samanaikaisesti kunnat saivat kotoutumis- ja työllisyyspalvelut vastuulleen viime vuoden alussa. Palvelut siirrettiin kuntien vastuulle valmiiksi aliresursoituina, ja samalla kunnilta on leikattu massiivisia määriä muun muassa leikkaamalla peruspalveluiden valtionosuuksista. Leikkaukset kotoutumisen rahoitukseen vaikeuttavat kuntien mahdollisuuksia järjestää riittäviä, laadukkaita palveluita. Kotoutumisen vastuuta siirretään siis yksilöille ilman vastavuoroista yhteiskunnan sitoutumista tarvittavaan kotoutumisen tukeen. Tämä yhtälö on kestämätön eikä tue tämän kansalaislain muutosten tavoitteiden toteutumista. Kansalaisuuskoetta ei tulisi ottaa käyttöön tilanteessa, jossa hallitus on jo leikannut kotoutumispalveluista, kotouttamista tukevilta järjestöiltä sekä kunnilta, joilla kotoutumispalveluiden järjestämisvastuu on. Kannatan siksi edustaja Alametsän tekemää hylkäysesitystä. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Sillanpää.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.34\">16.34&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Pia&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.34Sillanpää\">Sillanpää&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suomen kansalaisuus ei ole kertakäyttötavaraa tai mitään sellaista, mitä haluamme antaa kenelle tahansa. Se ei ole itsestäänselvyys, vaan se on yksi arvokkaimmista asioista, joita valtio voi myöntää yksittäiselle ihmiselle. Se ei myöskään ole pelkkä passi, vaan se on osa jotain paljon merkityksellisempää. Se on osoitus siitä, että me olemme osa samaa yhteiskuntaa ja meillä on keskenämme samat säännöt, oikeudet ja velvollisuudet. Siksi vähintä, mitä voimme vaatia Suomen kansalaisuutta hakevalta, on se, että häneltä edellytetään perustietoja suomalaisesta yhteiskunnasta, ja siihen tarvitsemme kansalaisuuslain muutosta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Me perussuomalaiset olemme jo pitkään vaatineet, että Suomen kansalaisuutta hakevan täytyy osoittaa olevansa kansalaisuuden arvoinen. Jatkossa kansalaisuutta hakevan tulee osoittaa tuntevansa suomalaisen yhteiskunnan toimintaa ja perusperiaatteita sekä kyetä kertomaan omista oikeuksistaan ja velvollisuuksistaan tässä maassa. Tämä tapahtuisi pääsääntöisesti niin kutsutulla kansalaisuuskokeella. Mikäli henkilö on jo suorittanut Suomessa suomen- tai ruotsinkielisen ylioppilas- tai korkeakoulututkinnon, erillistä koetta ei tarvitsisi tehdä. Jos myönnämme ihmiselle Suomen kansalaisuuden, meidän tulee varmistua siitä, että hän ymmärtää esimerkiksi sen, miten Suomessa tehdään päätökset, miten demokratia toimii, mitä kaikkea laki edellyttää kansalaiselta, mitä oikeuksia ihmisillä Suomessa on, mitä sukupuolten välinen tasa-arvo tarkoittaa ja minkälaiset arvot meidän suomalaisessa yhteiskunnassamme ovat tärkeitä.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kansalaisuuskoe ei ole mikään uusi keksintö. Vastaavanlainen koe on itse asiassa ollut jo pitkään käytössä monissa eri maissa. Tämä ei siis ole mikään erikoisuus, vaan jatkossa Suomi toimii samalla tavalla kuin monessa muussakin maassa toimitaan, jos joku haluaa saada maan kansalaisuuden.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansalaisuuden ehtoja on muutenkin kiristetty tällä hallituskaudella, mikä on ainoa oikea kehityssuunta. Esimerkiksi asumisaikavaatimusta on pidennetty kahdeksaan vuoteen. Itsensä ja perheensä pitää elättää omalla työllä, ja taustojen pitää olla nuhteettomat. Kansalaisuuskoe vain täydentää osaltaan näitä vaatimuksia.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Ennen kuin voimme edes ajatella antavamme jollekulle Suomen kansalaisuuden, on tiettyjä perusasioita, jotka pitää hallita. Ensin opitaan suomen kieli, opitaan suomalaisesta yhteiskunnasta ja kulttuurista sekä sitoudutaan yhteisiin sääntöihin ja lakeihin. Ihmisen tulee sopeutua meidän tapaamme elää ja elättää itsensä sekä perheensä tässä maassa. Jos kaikki menee hyvin ja ihmisestä tulee aidosti suomalaisen yhteiskunnan jäsen, hän on ansainnut kansalaisuuden. Kriteerit tulee pitää korkealla, sillä sitähän se kansalaisuuskin on: arvokas saavutus, jota pitää vaalia myös sen saamisen jälkeenkin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Jotkut ovat vastustaneet tätä esitystä sillä perusteella, että kansalaisuuskoe voisi aiheuttaa stressiä tai estää kansalaisuuden saamisen. Meillä vaaditaan jo nyt esimerkiksi suomen kielen taidon osoittamista osana kansalaisuuden saamista. Ei ole liikaa vaadittua, että siinä samalla ihmisen täytyy osata perusasiat suomalaisesta yhteiskunnasta. Myös hakija voi olla ylpeä itsestään läpäistessään kansalaisuuskokeen, koska hänellä on silloin todistetusti perusasiat hallussa. Ja jos pelkkä kansalaisuuskoe aiheuttaa liikaa stressiä hakijalle, niin sitten sitä ei ehkä kannata hakea ollenkaan.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Olen hyvin tyytyväinen, että olemme tällä hallituskaudella saaneet kiristettyä merkittävästi maahanmuuttoon liittyviä lakeja, jotka ovat olleet liian löysällä pohjalla aivan liian pitkään. Jatkossa myös Suomen kansalaisuuden saamisen ehdot ovat entistä tiukemmat, jotta kansalaisuuden saisivat vain ja ainoastaan ne ihmiset, jotka sen aidosti ansaitsevat. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Ensimmäinen varapuhemies Paula Risikko\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Kaunistola.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"16.38\">16.38&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Mari&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"16.38Kaunistola\">Kaunistola&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa rouva puhemies! Kansalaisuus on tosiaan onnistuneen kotoutumisen, vastuunkannon, nuhteettomuuden ja yhteiskunnan sääntöjen noudattamisen tulosta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hallituksen uudistukset kansalaisuuden saamisen edellytyksistä on toteutettu kolmessa vaiheessa, joista tämä käsittelyssä oleva on nyt sitten viimeinen. Tässä esityksessä siis puhutaan kansalaisuuskokeesta, jolla mitattaisiin tietoa suomalaisen yhteiskunnan toiminnasta ja perusperiaatteista. Tarkoituksena on, että Suomen kansalaisuutta hakevat ovat perehtyneet yhteiskuntaamme ja sen toimintatapoihin ja perusperiaatteisiin. Tämä tietenkin mahdollistaa aktiivista yhteiskunnan osallistumista ja osallistamista.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hallinnon vastuu tästä koejärjestelmästä olisi Maahanmuuttovirastolla, ja tämän esityksen mukaan kansalaisuuskokeen käyttöönotto aiheuttaakin noin reilun neljän miljoonan euron kertaluontoiset kustannukset sekä pysyvät reilun kahden miljoonan vuotuiset kustannukset. Onkin tärkeää ja huomioitavaa, että seurataan, miten tutkinto vaikuttaa viraston resursseihin, kun kokonaisuudesta tulee tietysti näitä uusia vastuita ja tehtäviä. Tämä on huomioitava senkin takia, että näistä esityksistä virastolle on tullut muitakin tehtäviä, ja siksi on hyvä seurata resursoinnin osalta säännöllisesti ja tarvittaessa sitä, miten kokonaisarviointi tässä toteutuu. — Kiitos.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Toimenpide\">\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cp class=\"edk-KappaleKooste\">Keskustelu päättyi ja asian käsittely keskeytettiin.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cspan class=\"edk-EduskuntaTunnus\">\u003C/span>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-34653",nav:"\u003Cnav id=\"VaskiNavi\">\n \u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Muut esitysmuodot\u003C/span>\n \u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/pdf/PTK+62/2026+9\" class=\"navilink\">Asiakirjan painoasu (PDF)\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/riksdagshandlingar/PR+62/2026+9\" class=\"navilink\">Dokumentet på svenska\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/PTK%2062%2F2026%20vp?asiakirjatyyppikoodi=PTKPS\" class=\"navilink\">Pöytäkirjan pääsivu\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cul id=\"AsiaKohtaPuheenvuorot\" class=\"navbar-nav nav t-margin\">\n  \u003Cli>\u003Ca href=\"#PuheenjohtajaRepliikki\">Puhemiehen esittely\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.18Keskisarja\">16.18 Teemu Keskisarja ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.21H%C3%A4nninen\">16.21 Juha Hänninen kok\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.25Strandman\">16.25 Jaana Strandman ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.28Alamets%C3%A4\">16.28 Alviina Alametsä vihr\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.29Viitala\">16.29 Juha Viitala sd\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.31Honkasalo\">16.31 Veronika Honkasalo vas\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.34Sillanp%C3%A4%C3%A4\">16.34 Pia Sillanpää ps\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#16.38Kaunistola\">16.38 Mari Kaunistola kok\u0
