">Sekreterare var\u003C/p>\n   \u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">utskottsråd&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Mari&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Nuutila&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">utskottsråd&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"EtuNimi\">Jonna&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">Berghäll.&nbsp;\u003C/div>\n     \u003Cdiv class=\"LisatietoTeksti\">&nbsp;\u003C/div>\n    \u003C/div>&nbsp;\u003C/span>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-1\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Reservation 1 /sd\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Allmän motivering\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Regeringens andra tilläggsbudgetproposition för 2026 visar att regeringens ekonomiska politik sammantaget inte är tillräcklig för att hantera utmaningarna i anslutning till Finlands ekonomi, sysselsättning och tillväxt. I propositionen höjs kalkylen över de ordinarie inkomsterna med 131 miljoner euro och ökas anslagen med 430 miljoner euro. Statens behov av nettoupplåning ökar med 299 miljoner euro, alltså beräknas nettoupplåningen 2026 uppgå till cirka 11,1 miljarder euro. Om intäktsföringen av den återstående kassan hos Statens bostadsfond inte tas i beaktande ligger underskottet på 13,4 miljarder euro. Den budgeterade statsskulden beräknas öka till cirka 201 miljarder euro i slutet av 2026.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">SDP:s utskottsgrupp anser det vara nödvändigt att de offentliga finanserna stärks på ett trovärdigt och rättvist sätt. Regeringens linje är dock inte konsekvent. Regeringen har gjort omfattande nedskärningar som drabbat låginkomsttagare, arbetslösa, studerande, barnfamiljer, social- och hälsovårdsorganisationer och utbildning. Samtidigt har regeringen fattat beslut – och planerar ytterligare sådana – som permanent försvagar de offentliga finanserna och gör det svårt att hålla jämna steg med EU:s korrigerande nettoutgiftsbana.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Särskilt problematiskt är regeringens beslut att sänka samfundsskatten från och med 2027. Den statiska effekten av sänkningen av samfundsskatten är mer än 800 miljoner euro på årsnivå. Det är mer än det uppskattade behovet av ytterligare anpassning 2027 för att inte avvika från den korrigerande nettoutgiftsbanan. Regeringen försvårar vardagen för många hushåll och försvagar statens inkomstunderlag genom en dyr, generell och dåligt riktad skattesänkning.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tilläggsbudgeten innehåller enstaka motiverade åtgärder. Vi anser bland annat att det är viktigt att bekämpa ungdomsarbetslösheten, stärka långtidsarbetslösas kompetens, stödja renoveringar som förbättrar energiprestandan samt stärka den inre säkerheten och förmågan att bekämpa drönare. I propositionen ingår 20 miljoner euro till rekryteringsstöd för unga, 15 miljoner euro till pilotprojekt för att förebygga ungdomsarbetslöshet, 20 miljoner euro till en kompetenssedel för långtidsarbetslösa och 25 miljoner euro till renoveringsprojekt som förbättrar energiprestandan. Åtgärderna är dock inte tillräckliga i förhållande till sysselsättnings- och tillväxtproblemen. Dessutom har regeringens tidigare åtgärder till stor del misslyckats.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Den snabba ökningen av ungdomsarbetslösheten skulle kräva ett klart kraftigare åtgärdspaket av regeringen. Rekryteringsstödet för unga och pilotförsöken är åtgärder i rätt riktning, men de ändrar inte det faktum att regeringens tidigare lösningar i fråga om arbetskraftspolitik, utbildning och social trygghet har försämrat framtidsutsikterna för många unga. Det behövs mer omfattande åtgärder som bidrar till bättre utbildningsvägar och underlättar mottagandet av deltidsarbete.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Problemet med regeringens åtgärder för unga är inte enbart att de är otillräckliga, utan också att genomförandet och effekterna av dem är förenade med osäkerhetsfaktorer. Användningen av sysselsättningssedeln har förblivit på en låg nivå i förhållande till regeringens mål. Det tyder på att sysselsättningssedeln inte har nått arbetsgivare och unga tillräckligt effektivt eller att villkoren för användningen av sedeln inte har fungerat tillräckligt bra i praktiken. Det är problematiskt att regeringen ökar finansieringen för samma instrument utan att det har gjorts en tillräcklig bedömning av användningsgraden, matchningsproblemen och effekterna av den tidigare finansieringen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Inom sysselsättningspolitiken räcker det inte med att anslagen formellt sett anvisas för rätt ändamål. Åtgärderna måste de facto leda till att människor får arbete. Om stödet inte används eller om det riktas till områden där sysselsättningen inte behöver stödjas, har det endast små effekter på de offentliga finanserna, de ungas ställning på arbetsmarknaden och förebyggandet av marginalisering. Regeringen måste säkerställa att rekryteringsstödet för unga och pilotförsöken kan genomföras på ett enkelt sätt som är genuint motiverande för arbetsgivarna och gör det möjligt att effektivt nå de unga.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det krävs också mer verkningsfulla åtgärder för att hantera den ökade långtidsarbetslösheten. Enbart en kompetenssedel räcker inte om det finns problem vad gäller arbetskraftsservicens resurser, kompetensutvecklingen och det individuella stödet för arbetslösa. Regeringens arbetsmarknadspolitik har fokuserat på nedskärningar i utkomstskyddet för arbetslösa och skärpta villkor i stället för att fokusera på genuint sysselsättningsfrämjande service, utbildning och stödjande av arbetsförmågan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vi anser att det är nödvändigt att stärka den inre säkerheten och gränssäkerheten. Det föreslagna tillägget på cirka 50 miljoner euro för att stärka drönarförsvaret är motiverat på grund av förändringarna i den säkerhetspolitiska miljön. Samtidigt måste man se till att basfinansieringen av myndigheterna för den inre säkerheten, polisens funktionsförmåga, räddningsväsendet och gränssäkerheten inte är beroende av projekt av engångsnatur.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tilläggsfinansieringen för energiunderstöden är välkommen, men situationen inom byggbranschen skulle ha krävt kraftigare åtgärder redan för tre år sedan. Det är bra att regeringen nu äntligen gick in för det stödpaket för reparationsbyggande som vi har föreslagit. Sammantaget har regeringens bostadspolitiska åtgärder dock gått i helt fel riktning: man har undergrävt förutsättningarna för framtida bostadsproduktion till skäligt pris och struntat i att i rätt tid vidta stödåtgärder för byggbranschen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tilläggsbudgeten stärker bilden av att regeringen reagerar på enskilda problem genom separata tillägg medan den ekonomiska politiken i grunden är inkonsekvent. Regeringen undergräver förutsättningarna för tillväxt och välfärd, men inför samtidigt permanenta skattelättnader som försvårar konsolideringen av de offentliga finanserna. Det är inte ansvarsfull finanspolitik.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">SDP anser att de offentliga finanserna måste stärkas på ett sätt som stöder tillväxt, sysselsättning och rättvisa. Regeringen måste avstå från sänkningen av samfundsskatten eller fullt ut kompensera effekterna av den med permanenta åtgärder som stärker de offentliga finanserna. Samtidigt måste man satsa på effektiva sysselsättningsåtgärder, kompetens, forskning och investeringar som förbättrar produktiviteten.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vi föreslår att riksdagen godkänner följande uttalanden:&nbsp;\u003C/p>\n     \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 1\u003C/div>\n     \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen korrigerar sin finanspolitiska linje så att de offentliga finanserna inte försämras genom permanenta och dåligt riktade åtgärder, utan att regeringen förelägger riksdagen ett åtgärdspaket som stärker de offentliga finanserna, stöder tillväxten och sysselsättningen och säkerställer att Finland inte avviker från EU:s korrigerande nettoutgiftsbana 2027.&nbsp;\u003C/div>\n     \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 2\u003C/div>\n     \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen säkerställer effekterna av de nya åtgärderna för sysselsättning av unga och långtidsarbetslösa, följer upp användningsgraden och sysselsättningseffekterna i realtid samt lämnar riksdagen en utredning om hur genomförandet, inriktningen och villkoren för åtgärderna ska korrigeras, om de sysselsättningsmål som eftersträvas inte uppnås genom de föreslagna anslagen.&nbsp;\u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Förslag\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Vi föreslår&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner förslaget till en andra tilläggsbudget för 2026 enligt betänkandet och&nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner de 2 uttalandena ovan.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingfors 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Joona&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Räsänen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Seppo&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Eskelinen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Aki&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lindén&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Pia&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Viitanen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Lauri&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lyly&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(delvis)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Saku&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Nikkanen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">sd&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(delvis)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-2\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Reservation 2 /cent\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Allmän motivering\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Under statsminister Orpos regeringsperiod har Finland hamnat i underskottsförfarande, alltså hamnat i EU:s finansiella observationsklass.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I stället för att försöka balansera de offentliga finanserna ökar regeringen också i den aktuella tilläggsbudgeten utgifterna med 430 miljoner euro och skulderna med 299 miljoner euro.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Regeringen föreslår ett anslagstillägg på sammanlagt 82 miljoner euro bland annat för mottagande av flyktingar och asylsökande samt för stöd till mottagningsverksamhetens kunder. Höjningen av behovskalkylen föranleds av en uppdatering av prognosen för invandringen och enligt den en ökning av det uppskattade antalet personer som omfattas av mottagningsverksamheten.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Finlands Banks chefdirektör Olli Rehn har i offentligheten konstaterat att det är motiverat att regeringen justerar finanspolitiken vid budgetförhandlingarna. I stället för att lätta på finanspolitiken vore det bra att dimensionera den så att den är neutral. Enligt Rehn medför den ökande ekonomiska tillväxten 2027 ett bra tillfälle att vidta åtgärder som stärker de offentliga finanserna, och det lönar sig inte att slösa bort denna möjlighet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">I stället för att sanera de offentliga finanserna har regeringen meddelat att den tänker sänka samfundsskatten från och med 2027. I EU:s nettoutgiftsbana beaktas också diskretionära skatteändringar, så sänkningen av samfundsskatten ökar på motsvarande sätt behovet av anpassning på annat håll. Regeringen har inte fattat de beslut som behövs.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Enligt finansministeriets och Finlands Banks bedömningar krävs det i ljuset av nuvarande uppgifter ytterligare anpassningar på cirka 600 miljoner euro under 2027 för att Finland ska hålla sig till nettoutgiftsbanan. Enligt finansministeriets uppskattning uppgår anpassningsbehovet för 2028 redan till 2,7 miljarder euro.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Centern anser att regeringen bör låta bli att sänka samfundsskatten. Tvärtom bör regeringen vid budgetförhandlingarna i september 2026 fatta fler beslut som stärker de offentliga finanserna.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Regeringen bör genomföra en del av de ytterligare anpassningarna i en tilläggsbudget ännu under innevarande år och resten i budgetpropositionen för 2027. Finland har inte råd med att regeringen ligger på latsidan under återstoden av valperioden och vägrar att sanera ekonomin på grund av det kommande valet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Genom att besluta om behövliga nya anpassningar säkerställer man att Finland följer EU:s nettoutgiftsbana 2027 och att anpassningsbehovet fördelas över flera år, varvid det inte behövs oskäligt stora anpassningar 2028.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vi föreslår att riksdagen godkänner följande uttalande:&nbsp;\u003C/p>\n     \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande\u003C/div>\n     \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen för att konsolidera de offentliga finanserna senast vid budgetförhandlingarna hösten 2026 beslutar om nya ytterligare anpassningar under 2026 och 2027 samt bereder och förelägger riksdagen de propositioner som behövs för att säkerställa att Finland inte avviker från EU:s nettoutgiftsbana 2026 och 2027 och för att minska behovet av nettoanpassning 2028.&nbsp;\u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Förslag\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Vi föreslår&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner förslaget till en andra tilläggsbudget för 2026 enligt betänkandet och&nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner uttalandet ovan.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingfors 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Markus&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lohi&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">cent&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Mika&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Lintilä&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">cent&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(delvis)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Eeva&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Kalli&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">cent&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(delvis)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-3\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Reservation 3 /gröna\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Allmän motivering\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">I den andra tilläggsbudgetpropositionen för 2026 höjs de ordinarie inkomsterna med 131 miljoner euro och ökas anslagen med 430 miljoner euro. Behovet av statlig nettoupplåning ökar således med 289 miljoner euro, alltså beräknas nettoupplåningen 2026 uppgå till cirka 11,1 miljarder euro.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Finlands ekonomi lider av en lågkonjunktur, som blivit onödigt utdragen bara på grund av regeringens misslyckade politik som försvagat sysselsättningen, tillväxten och konsumenternas förtroende. När skuldkvoten ökar i oroväckande takt bör regeringen vidta ytterligare åtgärder för att stabilisera skuldkvoten och i synnerhet se över de skattemässiga åtgärderna med tanke på den ekonomiska balansen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Arbetslösheten i Finland är också historiskt hög, och de unga drabbas särskilt kraftigt. I december 2025 fanns det sammanlagt 80&nbsp;000 arbetslösa arbetssökande under 30 år. I fråga om hela befolkningen uppgick arbetslöshetsgraden till 9,8 procent under det sista kvartalet 2025. För befolkningen under 25 år var motsvarande siffra 21 procent.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Särskilt oroväckande är situationen för långtidsarbetslösa unga. Deras andel har ökat från 300 till nästan 7&nbsp;000 mellan 2008 och 2025. Utvecklingen förklaras inte enbart av konjunktureffekter. De ungas försvagade framtidstro och försämrade sysselsättningsutsikter måste åtgärdas snabbt och målmedvetet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Regeringens tilläggsbudgetproposition är ett otillräckligt svar på den finska ekonomins utmaningar.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Detaljmotivering\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">ANSLAG\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 27\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">INRIKESMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">40. Migration\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">01. Migrationsverkets och statliga förläggningars omkostnader\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Regeringen föreslår 4,2 miljoner euro för ett medborgarskapsprov i anslutning till ändringen av medborgarskapslagen. Vi ifrågasätter uppnåendet av målen för medborgarskapsprovet och provets ändamålsenlighet i en situation där finansieringen av och tillgången till integrationstjänster försvagas.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">De redan gällande förutsättningarna för medborgarskap, såsom åtta års vistelse i landet, försörjningsförutsättningen, oförvitligheten och avklarad allmän språkexamen, skapar strikta förutsättningar för att ansöka om medborgarskap. Migrationsverkets behandlingstid för medborgarskapsansökningar är redan nu i genomsnitt 34 månader för både barn och vuxna, och medborgarskapsprovet förlänger processerna ytterligare. Tilläggsresurserna bedöms vara otillräckliga i förhållande till detta.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Dessutom är det omöjligt att bedöma de samlade konsekvenserna av regeringens reformer av utlänningslagen. Det är emellertid klart att reformerna var för sig och tillsammans ökar sannolikheten för att Finland inte lyckas identifiera alla som behöver internationellt skydd och har rätt till det.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Särskilt problematiskt är det att ändringarna kan försämra ställningen för utsatta personer, såsom barn, offer för människohandel, våldsoffer, personer med funktionsnedsättning och allvarligt sjuka personer.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Jag föreslår att riksdagen godkänner följande uttalanden:&nbsp;\u003C/p>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 1\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen återtar skärpningarna av utlänningslagen och omprövar ändamålsenligheten med medborgarskapsprovet.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 2\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen säkerställer att ändringarna i utlänningslagen inte leder till att personer som i enlighet med utlänningslagen har rätt till uppehållstillstånd på grund av arbetsrelaterat utnyttjande avlägsnas ur landet.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 28\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">FINANSMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">91. Stöd för sysselsättningen och näringslivet\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">41. Energiskattestöd\u003C/div>\n         \u003Cp class=\"KappaleKooste\">I regeringens kompletterande proposition \u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/handlingar/eduskuntatunnus/RP%20112%2F2026%20rd\">RP 112/2026 rd\u003C/a>\u003C/span> ökas återbäringen av energiskatt för jordbruket med sammanlagt 10 miljoner euro 2026.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Lönsamhetskrisen inom jordbruket är ett verkligt och allvarligt problem. Jordbrukarnas försörjning, den inhemska matproduktionen och försörjningsberedskapen kräver en politik som stärker jordbrukets verksamhetsförutsättningar på lång sikt. Stödet får dock inte byggas upp på ett sätt som ökar beroendet av fossila bränslen eller försvagar incitamenten att övergå till utsläppssnåla lösningar.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Problemet med propositionen är att stödet nästan helt och hållet riktas till användningen av brännolja. Av den föreslagna tilläggsåterbäringen gäller nästan 99 procent lätt brännolja och ersättande biobrännolja. I praktiken är det därför i första hand fråga om att stödja användningen av fossil energi trots att jordbruket i stället borde få stöd för att öka energieffektiviteten, minska användningen av brännolja och övergå till förnybara lösningar.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">För att stödja jordbruket måste man söka sådana metoder som ökar lönsamheten och funktionssäkerheten inom branschen utan att de samtidigt upprätthåller fossilberoendet. Stödet bör riktas till exempel till energieffektivitet, inhemsk förnybar energi, elektrifiering, biogas och andra lösningar som permanent minskar gårdarnas energikostnader och samtidigt stöder klimatmålen.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Jag föreslår att riksdagen godkänner följande uttalande:&nbsp;\u003C/p>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 3\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen i stället för genom återbäring av energiskatt stöder jordbruket under kostnadskrisen på ett sätt som uppmuntrar aktörerna inom branschen att lösgöra sig från användningen av fossil energi.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 29\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">UNDERVISNINGS- OCH KULTURMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">80. Konst och kultur\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">50. Understöd för främjande av konst och kultur\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Programmet Konsttestarna har under sina sju år möjliggjort en konstorienterad, gemensam och samhällelig upplevelse för praktiskt taget alla åttondeklassare från Hangö till Utsjoki. I verksamheten kombineras konst- och kulturfostran, ämnesövergripande lärande, samhällspåverkan och erfarenhetsbaserat lärande.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Programmet har finansierats av Finska kulturfonden och Svenska kulturfonden samt undervisnings- och kulturministeriet. I nuläget förefaller det som att verksamheten kommer att avslutas, om inte staten permanent tar ansvar för finansieringen.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Barn och unga i större tillväxtorter har helt andra möjligheter att uppleva konst och kultur än barn och unga från mindre orter. Med tanke på jämlikheten i samhället är det dock viktigt att det finns lika möjligheter till upplevelser och erfarenheter, också till exempel för unga som bor på landsbygden.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">En tilläggsbudgetmotion har lämnats i frågan (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/handlingar/eduskuntatunnus/TBM%207%2F2026%20rd\">TBM 7/2026 rd\u003C/a>\u003C/span>).&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Jag föreslår&nbsp;\u003C/p>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen ökar moment 29.80.50 med 4&nbsp;000&nbsp;000 euro till Konsttestarna.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 30\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">JORD- OCH SKOGSBRUKSMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cp class=\"KappaleKooste\">I en situation med exceptionellt hög ungdomsarbetslöshet bör staten använda alla medel som finns att tillgå för att förbättra sysselsättningsläget bland unga. Fokus bör särskilt ligga på att förbättra situationen för långtidsarbetslösa unga.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Åren 2010–2013 beviljade riksdagen på förslag av regeringen Forststyrelsen ett anslag på sammanlagt 4&nbsp;875 000 euro för att sysselsätta unga och genomföra statsrådets ungdomsgaranti. Tack vare anslaget kunde Forststyrelsens naturtjänster erbjuda arbete för sammanlagt 343 arbetslösa unga. Denna åtgärd bör införas på nytt.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Jag föreslår att riksdagen godkänner följande uttalande:&nbsp;\u003C/p>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 4\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen lämnar riksdagen en proposition med förslag om att sysselsätta unga inom Forststyrelsens naturtjänster.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 32\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">ARBETS- OCH NÄRINGSMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cp class=\"KappaleKooste\">Staten har få metoder för att direkt öka sysselsättningen bland unga. Därför måste de metoder som finns till handa användas effektivt. När ungdomsarbetslösheten är exceptionellt hög bör offentliga stöd i högre utsträckning vara förenade med villkor som stöder sysselsättningen.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Vi föreslår en modell där direkta företagsstöd innehåller ett villkor om att sysselsätta unga. Skyldigheten kan uppfyllas antingen genom att erbjuda en första arbetsplats för unga eller genom att unga som varit arbetslösa i över ett år erbjuds arbete.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Jag föreslår att riksdagen godkänner följande uttalande:&nbsp;\u003C/p>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 5\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen bereder och inför en modell där direkta företagsstöd förpliktar till verksamhet som sysselsätter unga.&nbsp;\u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">40. Specialfinansiering till företag\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"ValiotsikkoTeksti\">60. Överföringar till förvaltningsområdets fonder\u003C/div>\n        \u003Cp class=\"KappaleKooste\">Regeringen föreslår ett tilläggsanslag på 10 miljoner euro för säkerhetsupplagring av torv. I sakkunnigyttrandena påpekas det att torv kan jämställas med fossila bränslen och att den rentav är mer utsläppsintensiv än stenkol. Det nya torvstödet är svårt att motivera ekonomiskt eller klimatmässigt. Dessutom kan det hindra en gynnsam utveckling av utsläppen inom utsläppshandelssektorn och i motsvarande mån leda till dyra eller svåra åtgärder för att minska utsläppen inom andra sektorer. Detta nya statliga fossilstöd kan inte motiveras när läget i de offentliga finanserna är svårt.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Under brytningstiden behövs det många olika metoder för att hjälpa dem som arbetar inom torvbranschen: ett avträdelsepaket, hjälp med att ändra inriktning på företagsverksamheten, omskolningsstöd, skrotningspremie osv.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">För restaurering av myrar används samma maskiner som vid torvproduktion. Därför kan det för vissa företagare eller arbetstagare inom torvbranschen finnas ersättande arbete inom restaureringen av myrar och möjlighet att i så stor utsträckning som möjligt utnyttja redan befintliga maskiner och materiel. De som arbetar inom torvbranschen har redan de redskap som behövs och kompetens för att använda maskinerna.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Jag föreslår&nbsp;\u003C/p>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen minskar anslaget för försörjningsberedskapsfondens säkerhetsupplagring av torv under moment 32.40.60 med 10&nbsp;000&nbsp;000 euro, och att riksdagen godkänner följande uttalande:&nbsp;\u003C/div>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 6\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen främjar en rättvis omställning för torvproducenterna och erbjuder stöd för att ändra inriktning på företagsverksamheten och för omskolning för både producenter och arbetstagare.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">INKOMSTPOSTER\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Avdelning 13\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">RÄNTEINKOMSTER, INKOMSTER AV FÖRSÄLJNING AV AKTIER OCH INTÄKTSFÖRING AV VINST\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">05. Intäktsföring av de statliga affärsverkens vinst\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">01. Intäktsföring av de statliga affärsverkens vinst\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Regeringen föreslår att Forststyrelsens intäktsföring ökas med 10 miljoner euro. Regeringen har redan höjt Forststyrelsens intäktsföringsmål i budgetpropositionerna för 2025 och 2026. I samband med det senaste beslutet, som leder till ett rekordhögt intäktsföringsmål på 155 miljoner euro, medgav Forststyrelsen själv att beslutet kan leda till ökad avverkning.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Kolsänkorna är viktiga för den nationella klimatpolitiken som helhet. Enligt regeringens energi- och klimatpolitiska redogörelse (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/handlingar/eduskuntatunnus/SRR%208%2F2025%20rd\">SRR 8/2025 rd\u003C/a>\u003C/span>) kommer Finland under EU:s första LULUCF-åtagandeperiod att få ett underskott på 110–115 Mt CO2-ekv., vilket med beaktande av flexibiliteten skulle vara cirka 84 Mt CO2-ekv. Storleken på underskottet är oroväckande och förutsätter att regeringen snabbt vidtar åtgärder för att öka kolsänkorna. Genom de nuvarande åtgärderna hotar kolsänkorna att minska ytterligare bland annat på grund av överdriven avverkning.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Klimatpanelen har framhållit att den främsta orsaken till kollapsen är för stora avverkningsvolymer. För att de kolsänkor som är livsviktiga med tanke på Finlands klimatmål ska kunna räddas måste avverkningsvolymerna tvärtom begränsas och skogsindustrins förädlingsvärde höjas.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Jag föreslår&nbsp;\u003C/p>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen minskar Forststyrelsens intäktsföring under moment 13.05.01 med 10&nbsp;000&nbsp;000 euro och att riksdagen godkänner följande uttalande:&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 7\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen säkerställer att de beslut som hittills fattats om att öka intäktsföringen inte leder till att avverkningsvolymerna ökar.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Förslag\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Jag föreslår&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner förslaget till en andra tilläggsbudget för 2026 enligt betänkandet med ändringarna ovan och&nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner de 7 uttalandena ovan.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingfors 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Saara&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Hyrkkö&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">gröna&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(delvis)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-4\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Reservation 4 /vänst\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Allmän motivering\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cp class=\"KappaleKooste\">Regeringen har misslyckats med alla sina viktigaste mål för den ekonomiska politiken. Regeringsprogrammets finanspolitiska mål är bland annat att förbättra finländarnas levnadsstandard, höja sysselsättningen med minst 100&nbsp;000 sysselsatta och stoppa ökningen av skuldkvoten i de offentliga finanserna samt att på sikt vända den offentliga skuldkvoten i en nedåtgående riktning. I motsats till målen i regeringsprogrammet har fattigdom, ojämlikhet, bostadslöshet och arbetslöshet ökat i Finland under denna regeringsperiod. Arbetslösheten i Finland är den högsta i EU och också sysselsättningsgraden har försvagats. Samtidigt har skuldkvoten i de offentliga finanserna ökat särskilt därför att regeringens finanspolitik har förlängt den ekonomiska lågkonjunkturen. Regeringen har också urholkat inkomstbasen för de offentliga finanserna och förvärrat underskottet genom att lindra beskattningen särskilt för höginkomsttagare och företag.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Även om det har funnits positiva tecken i ekonomin under början av året syns tillväxten ännu inte i människornas vardag eller i de offentliga finanserna. Regeringens nedskärningspolitik har slagit hårt särskilt mot hushållen. Samtidigt är regeringens åtgärder för att hantera den högsta arbetslösheten i Europa helt otillräckliga.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Detaljmotivering\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">ANSLAG\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 28\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">FINANSMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">91. Stöd för sysselsättningen och näringslivet\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">41. Energiskattestöd (förslagsanslag)\u003C/div>\n        \u003C/div>\n        \u003Cp class=\"KappaleKooste\">Regeringen föreslår att momentet ökas med 10&nbsp;000 000 euro. Ökningen föranleds av en tillfällig tilläggsåterbäring av energiskatt inom jordbruket. Regeringen föreslår att återbäringen av punktskatt på vissa energiprodukter som använts inom jordbruket höjs temporärt på basis av förbrukningen av brännolja 2025 och 2026. I praktiken är återbäringsbeloppet fyra cent per liter för lätt brännolja. Lönsamhetskrisen inom jordbruket är ett verkligt och allvarligt problem. Stödet får dock inte byggas upp på ett sätt som ökar beroendet av fossila bränslen eller försvagar incitamenten att övergå till utsläppssnåla lösningar. För att stödja jordbruket måste man söka sådana metoder som ökar lönsamheten och funktionssäkerheten inom branschen utan att de samtidigt upprätthåller fossilberoendet. Stödet bör riktas till exempel till energieffektivitet, inhemsk förnybar energi, elektrifiering, biogas och andra lösningar som permanent minskar gårdarnas energikostnader och samtidigt stöder klimatmålen.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Vi föreslår att riksdagen godkänner följande uttalande:&nbsp;\u003C/p>\n        \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 1\u003C/div>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen stöder jordbruket under kostnadskrisen på ett sätt som uppmuntrar aktörerna inom branschen att lösgöra sig från användningen av fossil energi.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 29\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">UNDERVISNINGS- OCH KULTURMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">80. Konst och kultur\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">50. Understöd för främjande av konst och kultur (reservationsanslag 3 år)\u003C/div>\n        \u003C/div>\n        \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Finansiering av Konsttestarna\u003C/span>&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Konsttestarna är Finlands största kulturpedagogiska program, genom vilket alla elever i årskurs åtta, det vill säga omkring 70&nbsp;000 unga och deras cirka 5&nbsp;000 lärare, får ta del av konstupplevelser. Alla barn och unga har rätt till konst och kultur. Ju längre bort från de stora städerna man kommer, desto färre professionella kulturtjänster erbjuds. Tillgången till kulturtjänster för barn och unga påverkas också till exempel av socioekonomisk ställning, och huruvida man aktivt tar del av eller inte tar del av kultur går ofta i arv från en generation till nästa.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Via programmet Konsttestarna erbjuds en hel årskull i hela Finland inträdesbiljetter och transport för att ta del av en opera-, teater- eller cirkusföreställning eller för att gå på konsert eller konstutställning. Genom Konsttestarna kan man alltså på många sätt förbättra tillgängligheten till konst och kultur och minska ojämlikheten.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Den verksamhet som programmet Konsttestarna erbjuder är också förenlig med målen i läroplanen och kan inkluderas i den. I anslutning till programmet kan man också samarbeta mellan läroämnena med betoning på konst. Programmet utvecklas ständigt utifrån de ungas respons så att innehållet är modernt och tilltalande för de unga.&nbsp;\u003C/p>\n        \u003Cp class=\"KappaleKooste\">Vi föreslår&nbsp;\u003C/p>\n        \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen ökar moment 29.80.50 med 1&nbsp;400&nbsp;000 euro till Konsttestarna.&nbsp;\u003C/div>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Huvudtitel 32\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">ARBETS- OCH NÄRINGSMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">30. Sysselsättning och företagsamhet\u003C/span>\u003C/h3>\n         \u003Cp class=\"KappaleKooste\">Under den här regeringsperioden har man prövat på hur en högerregerings sysselsättningspolitik fungerar i praktiken. Arbetslöshetsgraden i vårt land har överskridit gränsen på 10 procent – vi har en arbetslöshetskris. Högerregeringens sysselsättningspolitik bygger på uppfattningen att människor måste tvingas att söka arbete, eftersom det är för lätt att bara leva med socialskyddsförmåner. Samtidigt lider Finland av massarbetslöshet och det finns inte tillräckligt med jobb för alla. Regeringens politik, som nästan uteslutande slår mot de arbetslösa, fungerar inte under dessa omständigheter. För att Finland ska kunna hantera arbetslöshetskrisen måste efterfrågan på arbete stärkas och antalet arbetstillfällen ökas.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">I stället för att försvaga arbetstagarnas ställning måste arbetstagarnas möjligheter att påverka och deras välbefinnande i arbetet också förbättras. Vänsterförbundet vill erbjuda människor ett bättre arbetsliv och bättre möjligheter att få arbete. Vi vill införa en arbetsgaranti för långtidsarbetslösa, satsa på sysselsättningstjänsterna och göra det lättare att ta emot deltidsarbete.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Vänsterförbundet vill också förbättra kvaliteten på det finländska arbetslivet och stärka arbetstagarnas förhandlingsposition. Vi vill återta regeringens försämringar av strejkrätten och anställningstryggheten, den exportdrivna arbetsmarknadsmodellen och andra försämringar som drabbar arbetstagarna.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Långtidsarbetslösheten är Finlands största arbetskraftspolitiska problem. Problemet kan inte lösas genom att sänka utkomstskyddet för arbetslösa eller skärpa villkoren för det, utan genom personlig handledning, stöd, tillräckliga social- och hälsovårdstjänster och vid behov genom utbildning. Det måste införas en arbetsgaranti för arbetslösa, det vill säga rätt till lönesubventionerat arbete efter tolv månaders arbetslöshet. De detaljerade bestämmelserna om serviceprocessen för arbetslösa, såsom skyldigheten att mata fram arbetsansökningar, bör slopas och resurserna riktas till tjänster som de facto motsvarar individernas behov.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Vi föreslår att riksdagen godkänner följande uttalanden:&nbsp;\u003C/p>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 2\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen föreskriver om en arbetsgaranti som ger arbetslösa rätt till lönesubventionerat arbete efter tolv månaders arbetslöshet.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 3\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen reserverar tillräckliga resurser för att hantera långtidsarbetslösheten.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 4\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen fortsätter programmet för utveckling av arbetet och välbefinnandet i arbetet och reserverar tillräcklig finansiering för detta.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 5\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen återtar de lagändringar som försvagar arbetstagarnas ställning och som exempelvis hänför sig till begränsning av strejkrätten, en första sjukdag utan lön, en exportdriven lönemodell, underlättande av uppsägningar och fler visstidsanställningar.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 6\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen stärker sysselsättningen genom att stödja undanröjandet av faktiska hinder för sysselsättning, till exempel genom att åtgärda kompetensgapet, problemen med arbetsförmågan, diskriminering vid rekryteringar och bristen på lämpliga möjligheter till arbete, i stället för att sträva efter att stärka sysselsättningen endast genom att urholka den sociala tryggheten och öka fattigdomen.&nbsp;\u003C/div>\n         \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Reservationens förslag till uttalande 7\u003C/div>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">Riksdagen förutsätter att regeringen vidtar behövliga lagstiftningsåtgärder och förnyar serviceprocesserna för att arbetskraftsservicen bättre ska motsvara personernas individuella behov.&nbsp;\u003C/div>\n         \u003Cdiv class=\"PerusteluLuku\">\n          \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">40. Specialfinansiering till företag\u003C/span>\u003C/h3>\n          \u003Cdiv class=\"ValiotsikkoTeksti\">60. Överföringar till förvaltningsområdets fonder (förslagsanslag)\u003C/div>\n          \u003Cp class=\"KappaleKooste\">Regeringen föreslår att momentet ökas med 10 000 000 euro för säkerhetsupplagring av torv.&nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Regeringen beslutade vid ramförhandlingarna att stödja energianvändningen och säkerhetsupplagringen av torv med sammanlagt 18 miljoner euro. Syftet med stödmodellen är att finansiera investeringar i biogas. Torv är ändå inget biobränsle, utan den kan jämställas med fossila bränslen. Utsläppskoefficienten för förbränning överskrider rentav stenkolets koefficient, samtidigt som torvutvinning förstör myrnaturen. Ett sådant stöd är oacceptabelt.&nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Enligt klimatpanelens bedömning innebär torvanvändning en risk med avseende på försörjningsberedskapen eftersom användningen kanske måste upprätthållas på heltid i viss mån för att produktionsinfrastrukturen, logistiken och anläggningarnas funktion ska kunna bevaras. Detta ökar sannolikt utsläppen inom energisektorn, vilket ytterligare ökar behovet av utsläppsminskningar inom andra sektorer. När gapet i utsläppsminskningen växer och de mest kostnadseffektiva åtgärderna förblir outnyttjade, ökar behovet av dyrare åtgärder för utsläppsminskning. Det är inte bara dålig klimatpolitik, utan också dåligt skött ekonomi.&nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Användningen av torv måste fasas ut helt och hållet, och som försörjningsberedskapslösning bör den ersättas med en koldioxidsnål lösning så snart som möjligt. Däremot skulle en ökad energieffektivitet som genomsyrar hela samhället vara en mycket välkommen åtgärd för försörjningsberedskapen och det bör anvisas ändamålsenliga anslag för att främja detta.&nbsp;\u003C/p>\n          \u003Cp class=\"KappaleKooste\">Vi föreslår&nbsp;\u003C/p>\n          \u003Cdiv class=\"SisennettyKappaleKooste\">att anslagen för säkerhetsupplagring av torv under moment 32.40.60 minskas med 10&nbsp;000&nbsp;000 euro.&nbsp;\u003C/div>\n         \u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">INKOMSTPOSTER\u003C/span>\u003C/h3>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">Avdelning 13\u003C/span>\u003C/h3>\n       \u003Cdiv class=\"PerusteluLuku\">\n        \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">RÄNTEINKOMSTER, INKOMSTER AV FÖRSÄLJNING AV AKTIER OCH INTÄKTSFÖRING AV VINST\u003C/span>\u003C/h3>\n        \u003Cdiv class=\"PerusteluLuku\">\n         \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoTeksti\">05. Intäktsföring av de statliga affärsverkens vinst\u003C/span>\u003C/h3>\n         \u003Cdiv class=\"ValiotsikkoTeksti\">01. Intäktsföring av de statliga affärsverkens vinst\u003C/div>\n         \u003Cp class=\"KappaleKooste\">Regeringen föreslår att anslagen under momentet minskas med 16 400 000 euro. Vid ändringen av inkomstposten har som tillägg beaktats 10&nbsp;000&nbsp;000 euro i form av en ökning av Forststyrelsens intäktsföring och som avdrag 26&nbsp;400&nbsp;000 euro i form av en minskning av intäktsföringen från Senatfastigheter.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Statens skogar har en nyckelroll när det gäller att stoppa förlusten av skogsnatur. Regeringen har för avsikt att intäktsföra ytterligare 10 000 000 euro av Forststyrelsens resultat, vilket är för mycket med tanke på en hållbar skogsvård. De statsägda skogarna bör skötas på ett sätt som beaktar den biologiska mångfalden och stimuleringen av kolsänkor och därför bör Forststyrelsens intäktsföringsmål göras skäligare.&nbsp;\u003C/p>\n         \u003Cp class=\"KappaleKooste\">Vi föreslår&nbsp;\u003C/p>\n         \u003Cdiv class=\"SisennettyKappaleKooste\">att Forststyrelsens intäktsföring under moment 13.05.01 minskas med 10&nbsp;000&nbsp;000 euro.&nbsp;\u003C/div>\n        \u003C/div>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"LihavaKursiiviOtsikkoTeksti\">Förslag\u003C/div>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n    \u003Cp class=\"KappaleKooste\">Vi föreslår&nbsp;\u003C/p>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner förslaget till en andra tilläggsbudget för 2026 enligt betänkandet med ändringarna ovan och&nbsp;\u003C/div>\n    \u003Cdiv class=\"SisennettyKappaleKooste\">att riksdagen godkänner de 7 uttalandena ovan.&nbsp;\u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingfors 22.6.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNimi\">Hanna&nbsp;\u003C/div>\n      \u003Cdiv class=\"SukuNimi\">Sarkkinen&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">vänst&nbsp;\u003C/div>\n      \u003Cdiv class=\"LisatietoTeksti\">(delvis)&nbsp;\u003C/div>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cdiv class=\"EtuNim
