ousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 4&nbsp;464&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet kompletteras så att anslaget får användas till överföring till projektbolaget av stöd som beviljats Västbanan Ab ur Fonden för ett sammanlänkat Europa (Connecting Europe Facility, CEF).&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">10.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Trafik- och kommunikationsnäten\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Basunderhåll av transportinfrastrukturen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 13&nbsp;370&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Användningen av anslaget för en ombyggnad av broarna över Tengeli älv vid riksväg 21, för en ombyggnad av Karigasniemi bro vid stamväg 92 och för anskaffning av reservbromateriel förutsätter ett positivt beslut om ERUF-stöd.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">31.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vissa understöd\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 2&nbsp;000&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Dispositionsplanen under momentet ändras som följer:&nbsp;\u003C/div>\n       \u003Cdiv id=\"tableID-N110E0\" class=\"table\">\n        \u003Cdiv class=\"title\">\n         \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Dispositionsplan (euro)\u003C/span>&nbsp;\u003C/p>\n        \u003C/div>\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ccolgroup>\n          \u003Ccol width=\"66.672%\">\n          \u003Ccol width=\"33.328%\">\n         \u003C/colgroup>\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Trafikflygplatser och flygplatser utanför Finavias flygplatsnät&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;370&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Understöd för enskilda vägar och konsumtionsutgifter som föranleds av rådgivning till väglag&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">5&nbsp;500&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Främjande av gång och cykling samt kommunernas kollektivtrafikprojekt&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">5&nbsp;000&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Sammanlagt\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">11&nbsp;870&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Av det treåriga reservationsanslag som beviljades i budgeten för 2024 återtas 2&nbsp;000&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">77.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\"> Utveckling av trafikledsnätet \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 24&nbsp;890&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet kompletteras så att anslaget får användas till betalning av utgifter som gäller självfinansieringsandelen för projekt som genomförs med stöd från EU:s fonder och i fråga om bron mellan Finland och Sverige som ingår i projektet Planering av järnvägsförbindelser med den europeiska spårviddsstandarden Torneå­—Haparanda—Kemi också till planering av den svenska sidan i samarbete med Trafikverket.&nbsp;\u003C/div>\n       \u003Cdiv class=\"ValiotsikkoKooste\">\n        \u003Cspan class=\"LihavaTeksti\">Fullmakt\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet kompletteras så att Trafikledsverket bemyndigas att ingå avtal&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">\n        1) i anslutning till projektet riksväg 6 Keltti bro, Kouvola, så att projektet får medföra utgifter för staten i form av självfinansieringsandel för projektet till ett belopp av högst \u003Cspan class=\"Valtuusraha\"> 20&nbsp;751&nbsp;000\u003C/span> euro&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">\n        2) i anslutning till projektet riksväg 9, avsnittet Vartiala—Riistavesi, Kivisillansalmi bro, Kuopio, så att projektet får medföra utgifter för staten i form av självfinansieringsandel för projektet till ett belopp av högst \u003Cspan class=\"Valtuusraha\"> 12&nbsp;600&nbsp;000\u003C/span> euro&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">\n        3) i anslutning till projektet elektrifiering av Vasa hamnbana så att projektet får medföra utgifter för staten till ett belopp av högst \u003Cspan class=\"Valtuusraha\"> 8&nbsp;000&nbsp;000\u003C/span> euro&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">\n        4) i anslutning till projektet för att fördjupa farleden till Vasa, så att projektet får medföra utgifter för staten till ett belopp av högst \u003Cspan class=\"Valtuusraha\"> 15&nbsp;000&nbsp;000\u003C/span> euro.&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras så att Trafikledsverket bemyndigas att ingå avtal i anslutning till projektet&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">5) planering av järnvägsförbindelser med den europeiska spårviddsstandarden Torneå—Haparanda—Kemi, så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 61&nbsp;000&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">6) riksväg 21 avsnittet Palojoensuu—Maunu, så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 56&nbsp;500&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">7) riksväg 5 Leppävirta—Kuopio, så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 212&nbsp;000&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">8) riksväg 3 och riksväg 19, anslutningsarrangemang i Jalasjärvi, Kurikka , så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 14&nbsp;000&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">9) riksväg 15, vid infarten till Kotka, (Hyväntuulentie), så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 12&nbsp;670&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">10) flyttning av hamnbanan i Åbo, så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 19&nbsp;000&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">11) Uleåborgs personbangård, så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 34&nbsp;100&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">12) riksväg 8 Edsevö—Lepplax, så att projektet inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 26&nbsp;200&nbsp;000 euro&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">13) anskaffning av en ny isbrytare, så att anskaffningen inklusive de tidigare ingångna avtalen får medföra utgifter för staten till ett belopp av högst 240&nbsp;000&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">En förutsättning för användningen av fullmakten och anslaget för projekt 1) och 2) är ett positivt beslut om ERUF-stöd.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tjänster inom trafik, transport och kommunikation\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">21.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Köp och utvecklande av tjänster inom den offentliga persontrafiken\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"ValiotsikkoKooste\">\n        \u003Cspan class=\"LihavaTeksti\">Fullmakt\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">\n        Motiveringen till momentet kompletteras så att Transport- och kommunikationsverket bemyndigas att ingå avtal om köp av tågrafik så att det under åren 2026—2030 föranleder utgifter till ett belopp av högst \u003Cspan class=\"Valtuusraha\"> 296&nbsp;192&nbsp;000\u003C/span> euro. Av den fullmakt som i budgeten för 2022 beviljats för köp av tågtrafik 2022—2030 återtas 174&nbsp;500&nbsp;000 euro, av den fullmakt som i den första tilläggsbudgeten för 2022 beviljades för anskaffning av vagnmateriel för nattågstrafiken 2022—2030 återtas 33&nbsp;626&nbsp;000 euro och dessutom återtas den femåriga fullmakt för hyra av materiel på 76&nbsp;000&nbsp;000 euro som beviljats i tilläggsbudgeten för 2026.&nbsp;\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">51.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Understöd till tjänster inom trafik, transport och kommunikation\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 1&nbsp;050&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet kompletteras så att anslaget får användas till betalning av statsunderstöd för att trygga produktionen av de grundläggande nyhetstjänsterna och utveckla verksamheten.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Dispositionsplanen under momentet ändras som följer:&nbsp;\u003C/div>\n       \u003Cdiv id=\"tableID-N111BB\" class=\"table\">\n        \u003Cdiv class=\"title\">\n         \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Dispositionsplan (euro)\u003C/span>&nbsp;\u003C/p>\n        \u003C/div>\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ccolgroup>\n          \u003Ccol width=\"80.003%\">\n          \u003Ccol width=\"19.997%\">\n         \u003C/colgroup>\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Tidsbundet understöd för tidningsutdelning&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">7&nbsp;500&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Säkerhetsverksamhet för vägtrafik&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">9&nbsp;900&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Stöd till fartygsrutterna i Kvarken på grund av införandet av undantaget för öar&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">2&nbsp;000&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Yrkesutbildning inom järnvägstrafik&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">841&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Prisstöd för lotsning i Saimenområdet och upprätthållande av beredskap för lotsning&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">600&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Nationell självfinansieringsandel för cyberkompetensprojekt i små och medelstora företag&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">600&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Nationell åtkomstpunkt och informationstjänst för grundläggande information om trafiksystemet&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">7&nbsp;555&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Skrotningspremie&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">20&nbsp;000&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Stödordningen för statsunderstöd till rederier&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">70&nbsp;324&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">— varav juridiskt stöd, konsultering och utredningar som föranleds av verkställigheten och beredningen (högst)&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">150&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Tryggande av godstrafik som är kritisk med tanke på försörjningsberedskapen på rutten Nådendal—Åland&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">350&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \tb-border\">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">Tryggande av de grundläggande nyhetstjänsterna&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;050&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow \">\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Sammanlagt\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry \">\n            \u003Cp class=\"KappaleKooste\">120&nbsp;720&nbsp;000&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n    \u003Ch3 class=\"TalousarvioLukuOtsikko \">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Huvudtitel 32\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">ARBETS- OCH NÄRINGSMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förvaltning\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Arbets- och näringsministeriets omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 130&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras så att 100&nbsp;000 euro av anslaget är reserverat för investeringar i energiinfrastruktur (RFF pelare 1), 100&nbsp;000 euro till investeringar i ny energiteknik (RRF pelare 1), 33&nbsp;000 euro till främjande av avskiljning och återvinning av koldioxidsnålt väte och koldioxid (RRF pelare 1), 40&nbsp;000 euro till resurser för rollen som stödmyndighet (REPowerEU) och 20&nbsp;000 euro till elektrifiering och koldioxidsnålhet i industrins processer (RRF pelare 1) som ett del av planen för återhämtning och resiliens.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">02.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Livskraftscentralernas omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 700&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras så att 53&nbsp;014&nbsp;000 euro av anslaget har reserverats för Sysselsättnings-, utvecklings- och förvaltningscentrets främjande av sysselsättningen och näringarna.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">04.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Geologiska forskningscentralens omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"ValiotsikkoKooste\">\n        \u003Cspan class=\"LihavaTeksti\">Fullmakt\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">\n        Motiveringen till momentet ändras så att det 2026 får ingås nya förbindelser till ett belopp av högst \u003Cspan class=\"Valtuusraha\"> 39&nbsp;200&nbsp;000\u003C/span> euro.&nbsp;\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">06.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konkurrens- och konsumentverkets omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 17&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">08.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Säkerhets- och kemikalieverkets omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 20&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">09.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Energimyndighetens omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 20&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">11.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Försörjningsberedskapscentralens omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 73&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">51.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ersättningar för sjömäns resekostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 500&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förnyelse och koldioxidsnålhet\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Stödjande av forsknings-, utvecklings- och innovationsverksamhet\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 7&nbsp;967&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras så att 9&nbsp;100&nbsp;000 euro av anslaget är reserverat för främjande av en innovations- och forskningsinfrastruktur (RRF pelare 3), 2&nbsp;932&nbsp;000 euro för främjande av nyckelsektorer och stärkande av kompetensen (RRF pelare 3), 5&nbsp;534&nbsp;000 euro för stödprogrammet för koldioxidsnåla lösningar inom fastighets- och byggbranschen (RRF pelare 1), 640&nbsp;000 euro för strukturstöd till de kreativa branscherna (RRF pelare 3), 35&nbsp;175&nbsp;000 euro för återanvändning och återvinning av material och restprodukter från industrin (RRF pelare 1), 280&nbsp;000 euro för teknik och kompetens på området hälsa och välbefinnande (RRF pelare 3), 4&nbsp;601&nbsp;000 euro för utvecklingsmiljöer för 6G, artificiell intelligens och kvantberäkning (RRF pelare 2), 3&nbsp;235&nbsp;000 euro för stöd till innovativa tillväxtföretag (RRF pelare 3) och 1&nbsp;056&nbsp;000 euro för programmet för främjande av koldioxidsnåla lösningar, cirkulär ekonomi och digital förnyelse inom industrin och ökad export av industriella tjänster (RRF pelare 3).&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">41.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Energistöd\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras så att 85&nbsp;321&nbsp;000 euro av anslaget är reserverat för investeringar i energiinfrastruktur (RFF pelare 1), 40&nbsp;393&nbsp;000 euro till investeringar i ny energiteknik (RRF pelare 1), 15&nbsp;870&nbsp;000 euro till främjande av avskiljning och återvinning av koldioxidsnålt väte och koldioxid (RRF pelare 1), 30&nbsp;422&nbsp;000 euro till elektrifiering och koldioxidsnålhet i industrins processer (RRF pelare 1) och 16&nbsp;415&nbsp;000 euro till omställningen till ren energi (REPower EU) som en del av planen för återhämtning och resiliens.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">47.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Främjande av en offentlig infrastruktur för laddning av el och tankning av gas i trafiken\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 1&nbsp;180&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras så att det av anslaget har reserverats 2&nbsp;382&nbsp;000 euro för offentliga infrastrukturprojekt som avser laddning av el och tankning av gas i trafiken (RRF pelare 1) som en del av återhämtnings- och resiliensplanen.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">48.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Produktionsstöd för förnybar energi\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 69&nbsp;031&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">83.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lån för forsknings- och innovationsverksamhet\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 5&nbsp;000&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">30.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sysselsättning och företagsamhet\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">32.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Statsunderstöd till kommunerna för stärkande av Navigatorernas sektorsövergripande kompetens\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas 2&nbsp;100&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget får i enlighet med statsunderstödslagen (688/2001) användas till betalning av statsunderstöd som beviljas kommuner eller samkommuner för stärkande av Navigatorernas sektorsövergripande kompetens.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget har som en del av planen för återhämtning och resiliens reserverats för stärkande av Navigatorernas sektorsövergripande kompetens (RRF pelare 3).&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget budgeteras enligt principen om betalningsbeslut.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Av det tvååriga reservationsanslag som beviljats i budgeten för 2025 återtas 2&nbsp;100&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Stödjande av hållbar tillväxt och livskraft i regionerna\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras som följer:&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget får i enlighet med statsunderstödslagen (688/2001) användas&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">1) till betalning av kostnader för byggandet av Kutila kanal.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget får i enlighet med lagen om finansiering av projekt inom regionutveckling och Europeiska unionens regional- och strukturpolitik (757/2021) användas&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">2) för sådant avtalsbaserat samarbete med städer som främjar internationell rekrytering&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">3) för projekt som främjar utveckling, hållbar tillväxt och livskraft i regionerna och för investeringar som ingår i dem&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">4) för kommunala och samkommunala infrastrukturella investeringsprojekt som stöder företagens verksamhetsförutsättningar&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">5) för regionutvecklingsprojekt som gäller fler än en region eller som är nationellt viktiga samt för avtalsbaserat samarbete.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget får också användas&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">6) till betalning av konsumtionsutgifter enligt 1—5 punkten&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">7) för avlönande av visstidsanställd personal motsvarande högst fem årsverken och till betalning av de kostnader för lokaler och andra kostnader som föranleds av avlönandet av personal&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">8) till betalning av stöd i förskott, om detta är motiverat med tanke på genomförandet av projekten.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">I fråga om överföringsutgifterna budgeteras anslaget enligt principen om betalningsbeslut.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Statsunderstöd för rekryteringsstödet för unga\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 19&nbsp;700&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">53.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Konkreta åtgärder för att främja sysselsättningen \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas 34&nbsp;475&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget får användas för understöd som livskraftscentralen med stöd av statsunderstödslagen (688/2001) beviljar arbetskraftsmyndigheten&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">1) till ett belopp av högst 19&nbsp;700&nbsp;000 euro för kostnader som föranleds av en kompetenssedel för långtidsarbetslösa&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">2) till ett belopp av högst 14&nbsp;775&nbsp;000 euro för pilotförsök för förebyggande av ungdomsarbetslöshet.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget budgeteras enligt principen om betalningsbeslut.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">40.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Specialfinansiering för företag\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">60.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Överföringar till förvaltningsområdets fonder\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 10&nbsp;000&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Integration och internationell kompetens\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">03.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Främjande av integration och arbetskraftsinvandring\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet kompletteras så att anslaget får användas för sådan utveckling av ett annat ämbetsverks informationssystem som hänför sig till integration och arbetskraftsinvandring.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n    \u003Ch3 class=\"TalousarvioLukuOtsikko \">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Huvudtitel 33\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">SOCIAL- OCH HÄLSOVÅRDSMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Förvaltning\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Social- och hälsovårdsministeriets omkostnader \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 911&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">06.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Omkostnader för enheten för hälso- och sjukvård för fångar som är underställd Institutet för hälsa och välfärd \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 150&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">03.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Forskning och utveckling\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">04.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Omkostnader för Institutet för hälsa och välfärd\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 710&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Utkomstskyddet för arbetslösa\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">52.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Statsandel till grundskyddet inom arbetslöshetsförmånerna\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 300&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">60.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Social- och hälsovården stöds\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">35.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Statsandel för hälso- och sjukvård för högskolestuderande\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet kompletteras så att 250&nbsp;000 euro av det anslag som överförts från 2025 får användas till betalning av statsunderstöd i enlighet med statsunderstödslagen till Studenternas hälsovårdsstiftelse och Befolkningsförbundet för ett pilotprojekt som stöder önskan att få barn.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">39.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Utvecklande av servicestrukturen\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Motiveringen till momentet ändras så att av anslaget får användas högst 40&nbsp;000&nbsp;000 euro för statsunderstöd till sådana tidsbegränsade projekt för utveckling av husläkar-, vårdteam- och yrkesutövarmodeller som är fristående från välfärdsområdenas lagstadgade uppgifter.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">52.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Statlig finansiering av utgifterna för skyddshemsverksamhet\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget under momentet ombildas till ett tvåårigt reservationsanslag.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">70.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Hälsa och funktionsförmåga främjas\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">50.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Hälsofrämjande verksamhet\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas ett tillägg på 1&nbsp;400&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Av det treåriga anslag som beviljades i budgeten 2024 återtas 1&nbsp;400&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n    \u003Ch3 class=\"TalousarvioLukuOtsikko \">\u003Cspan class=\"OtsikkoNroTeksti edk-display-block\">Huvudtitel 35\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">MILJÖMINISTERIETS FÖRVALTNINGSOMRÅDE\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Miljöförvaltningens omkostnader\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">01.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Miljöministeriets omkostnader\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 405&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n     \u003Ch4 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">20.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Samhällen, byggande och boende\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">57.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Understöd för det statligt stödda bostadsbeståndet \u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 2&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">\n        \u003Cspan class=\"LihavaTeksti\">\u003C/span>Motiveringen till momentet ändras så att anslaget får användas till beviljande av understöd enligt lagen om understöd för sanering av ekonomin i hyreshussamfund och bostadsrättshussamfund (1030/2008) till ett belopp av sammanlagt högst 600&nbsp;000 euro, av vilket högst 200&nbsp;000 euro får användas till kostnader för utredningar och åtgärder som främjar saneringen av ekonomin och planeringen av underhållet i fråga om bostadssammanslutningar som har ekonomiska svårigheter.&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Dessutom ändras motiveringen till momentet så att av anslaget får användas högst 300&nbsp;000 euro till tryggande av fordringar, såsom indrivning av fordringar och skötsel av säkerhetsegendom, betalning av utgifter för utövande av regressrätt, betalning av ansvarsförsäkring för inteckningshavare, inköp av fastigheter eller annan egendom vid konkursauktioner, exekutiva auktioner eller andra realiseringsarrangemang, när det behövs för tryggande av låne- eller borgensfordringar eller andra fordringar eller för minimering av borgensansvar, samt till kostnader för skötseln och realiseringen av egendom som på detta sätt tillfallit staten.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">58.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Fullmakter för statsunderstödd bostadsproduktion\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (förslagsanslag)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet dras det av 26&nbsp;950&nbsp;000 euro.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"TalousarvioPerusteluLuku\">\n      \u003Ch5 class=\"TalousarvioLukuOtsikko\">\u003Cspan class=\"OtsikkoNroTeksti \">59.\u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Understöd för främjande av energieffektiviteten i bostadshus\u003C/span>\u003Cspan class=\"MaararahalajiTeksti\"> (reservationsanslag 3&nbsp;år)\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"TalousarvioPaatosOsa\">\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Under momentet beviljas 24&nbsp;537&nbsp;000 euro.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Anslaget får med stöd av statsunderstödslagen (688/2001) användas till energieffektivitetsunderstöd för bostadshus på det sätt som föreskrivs i den förordning som utfärdas av statsrådet.&nbsp;\u003C/div>\n       \u003Cdiv class=\"TalousarvioKappaleKooste\">Understödet beviljas av miljöministeriet.&nbsp;\u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"VoimaantuloSaannosOsa\" class=\"VoimaantuloSaannosOsa\">\n   \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Riksdagen har beslutat att den nu godkända andra tilläggsbudgeten för 2026 tillämpas från och med den 1 juli 2026.\u003C/span>&nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv id=\"AllekirjoitusOsa\" class=\"AllekirjoitusOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingfors 23.6.2026&nbsp;\u003C/div>\n   \u003Cp class=\"JohdantoTeksti\">På riksdagens vägnar\u003C/p>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"AsemaTeksti\">talman&nbsp;\u003C/div>\n     \u003Cdiv class=\"EtuNimi\">&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">&nbsp;\u003C/div>\n    \u003C/div>\n    &nbsp;\n   \u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cdiv class=\"AsemaTeksti\">generalsekreterare&nbsp;\u003C/div>\n     \u003Cdiv class=\"EtuNimi\">&nbsp;\u003C/div>\n     \u003Cdiv class=\"SukuNimi\">&nbsp;\u003C/div>\n    \u003C/div>\n    &nbsp;\n   \u003C/div>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-37019",nav:"\u003Cnav id=\"VaskiNavi\">\n \u003Cspan class=\"edk-title-h4\" id=\"SisallysluetteloTitle\">Innehållsförteckning\u003C/span>\n \u003Cul id=\"Sisallysluettelo\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"#IdentifiointiOsa\">Identifieringselement\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#AsiaKuvaus\">Inledning\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#PaatosOsa\">Beslut\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#TaulukkoOsa\">Tabeller\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#TalousarvioPerusteluOsaYksityiskohtaisetPerustelut\">Detaljmotivering\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#VoimaantuloSaannosOsa\">Ikraftträdande\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#AllekirjoitusOsa\">Undertecknare\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Andra format\u003C/span>\n \u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/handlingar/edktunnus//pdf\" class=\"navilink\">Pdf-format\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/valtiopaivaasiakirjat/EK+30/2026\" class=\"navilink\">Asiakirja suomeksi\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"KasittelytiedotTitle\">Behandlingsinformation\u003C/span>\n \u003Cul id=\"Kasi
