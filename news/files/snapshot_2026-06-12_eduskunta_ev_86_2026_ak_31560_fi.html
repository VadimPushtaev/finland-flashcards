b",providerName:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",expanded:{contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",expanded:null},name:"Saavutettavuusseloste",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"saavutettavuusseloste",url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",changed:null,created:null,startPublish:"2026-03-19T07:20:56Z",stopPublish:null,saved:null,status:null,teaserTitle:"Saavutettavuusseloste",teaserText:"Eduskunta haluaa taata kaikille yhdenvertaisen mahdollisuuden asioida sähköisissä palveluissaan. Verkkosivustoa koskee laki digitaalisten palvelujen tarjoamisesta, jonka mukaan julkisten verkkopalvelujen tulee olla saavutettavia. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Tietosuojaselosteet",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:{contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:null},name:"Tietosuojaselosteet",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"tietosuojaselosteet",url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",changed:null,created:null,startPublish:"2025-04-03T11:57:48Z",stopPublish:null,saved:null,status:null,teaserTitle:"Tietosuojaselosteet",teaserText:"Eduskunnan tietosuojaselosteissa kerrotaan muun muassa henkilötietojen käsittelyn tarkoituksesta, mihin tietoja säännönmukaisesti luovutetaan, miten kauan henkilötietoja säilytetään.",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/sivukartta/",title:null,target:null,text:"Sivukartta",contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:{contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:null},name:"Sivukartta",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sivukartta",url:"/fi/tietoa-sivustosta/sivukartta/",changed:null,created:null,startPublish:"2026-03-19T11:01:19Z",stopPublish:null,saved:null,status:null,teaserTitle:"Sivukartta",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/fi/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"_self",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"_self",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"_self",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"_self",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"_self",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"_self",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"_self",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"_self",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/fi/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"_self",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"_self",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"_self",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"_self",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"_self",contentLink:"1796"},{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"_self",contentLink:"18"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"_self",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"_self",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"_self",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"_self",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/fi/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"_self",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"_self",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"_self",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"_self",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"_self",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/fi/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"_self",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/fi/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"_self",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"_self",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"_self",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"1659"},{children:[],relatedContent:[],name:"EU-tiedonlähteet ja asiakirjat",teaserText:"Tämä sivu kokoaa keskeiset Euroopan unionia koskevat tiedonlähteet sekä ohjeet EU-asiakirjojen ja tietokantojen käyttöön. Tavoitteena on helpottaa EU-asioihin liittyvän virallisen aineiston löytämistä sekä mahdollistaa tiedon hakeminen Euroopan unionista yleisesti ja eri aihealueilta. \n\nLinkit johtavat ensisijaisesti EU:n virallisiin lähteisiin ja virastojen verkkosivuille. Jos suomenkielistä sisältöä ei ole saatavilla, linkki ohjaa englanninkieliselle sivulle. Kaikki linkit avautuvat uuteen välilehteen.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-tiedonlahteet-ja-asiakirjat/",selected:false,targetFrame:"_self",contentLink:"8196"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/fi/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"_self",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. Vanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/fi/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"_self",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/fi/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"_self",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/fi/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"_self",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/fi/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/fi/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/fi/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/fi/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/fi/asiat-ja-aanestykset/",selected:false,targetFrame:"_self",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/fi/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"_self",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/fi/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"_self",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/fi/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"_self",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"_self",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"_self",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"_self",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/fi/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"_self",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"_self",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"_self",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"_self",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"_self",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"_self",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"_self",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"_self",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"_self",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"_self",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"_self",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"_self",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"_self",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"_self",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"_self",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"_self",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"_self",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/fi/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"_self",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"_self",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"_self",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"_self",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. \nOpastuksen aikana opas kertoo eduskunnan toiminnasta, eduskunnan tehtävistä, kansanedustajan työstä ja Eduskuntatalon keskeisimmistä tiloista.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"_self",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/fi/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"_self",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/fi/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"_self",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"_self",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"_self",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"_self",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"_self",contentLink:"64"}],relatedContent:[{children:[],relatedContent:[],name:"Ota yhteyttä kansanedustajaan",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Katso täysistuntosuunnitelma ja muut tapahtumat",teaserText:null,url:"/fi/?epsremainingpath=taysistunnot-ja-tapahtumat",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/avoin-data",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null}],name:"Vieraile ja osallistu",teaserText:"Eduskuntatalo on avoin vierailijoille. Voit varata paikan opastetulle kierrokselle varauspalvelun kautta. Voit myös seurata eduskunnan täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä tilaisuuksina suorana verkossa. Jokaisella on mahdollisuus vaikuttaa päätöksentekoon. Voit keskustella ja kertoa mielipiteesi, kun uusia lakeja suunnitellaan.",url:"/fi/vieraile-ja-osallistu/",selected:false,targetFrame:"_self",contentLink:"50"}],subMenuItems:[],breadcrumbItems:[{name:"Eduskunta",teaserText:null,url:"/fi/",selected:true,targetFrame:"_self",contentLink:null}],languageMenuItems:[{name:"en",url:"/en/"},{name:"sv",url:"/sv/"}],alternateLanguages:[{name:"en",url:"/en/"},{name:"sv",url:"/sv/"},{name:"fi",url:"/fi/"}],headerFooter:{headerLinks:[{name:"Verkkolähetykset ja videot",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/",selected:false,targetFrame:"_blank",contentLink:null},{name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:"_top",contentLink:null},{name:"Avoin data",teaserText:null,url:"/fi/?epsremainingpath=%2Favoin-data",selected:false,targetFrame:null,contentLink:null},{name:"Medialle",teaserText:null,url:"/fi/medialle/",selected:false,targetFrame:null,contentLink:null}],footerShortcutLinks:[{name:"Ota yhteyttä tai tule vierailulle",teaserText:null,url:"/fi/ota-yhteytta-tai-tule-vierailulle/",selected:false,targetFrame:null,contentLink:null},{name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null},{name:"Puhemiehet",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:null,contentLink:null},{name:"Hae eduskunnan aineistoja",teaserText:null,url:"/fi/haku/",selected:false,targetFrame:null,contentLink:null}],footerSocialMediaLinks:[{name:"Facebook",teaserText:null,url:"https://www.facebook.com/suomeneduskunta",selected:false,targetFrame:"_blank",contentLink:null},{name:"Flickr",teaserText:null,url:"https://www.flickr.com/photos/finnishp i>\n    \u003C/ol>\n   \u003C/nav>\n  \u003C/div>\n \u003C/div>\n \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n  \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">11.6.2026 | 11:12\u003C/span>\n \u003C/div>\n \u003Cdiv id=\"EduskunnanVastaus\" class=\"EduskunnanVastaus EduskunnanVastaus2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Eduskunnan vastaus\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;EV&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">86\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"edk-Vireilletulo\">\u003Cspan class=\"edk-EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%2054%2F2026%20vp\">HE 54/2026 vp\u003C/a>&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/span>\u003C/span>\u003C/h1>\n   \u003Cdiv class=\"AsiakirjaViitteet\">\n    \u003Cdiv class=\"Muu1Viite\">\n     \u003Cdiv class=\"ViiteTeksti\">\n      \u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/\">HE 54/2026 vp\u003C/a>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Muu2Viite\">\n     \u003Cdiv class=\"ViiteTeksti\">\n      \u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/\">HaVM 10/2026 vp\u003C/a>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"AsiaKuvaus\" class=\"AsiaKuvaus\">\n   \u003Cdiv class=\"VireilletuloAsia\">\n    \u003Ch3 class=\"LihavaKursiiviOtsikkoTeksti\">Asia\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%2054%2F2026%20vp\">HE 54/2026 vp\u003C/a>\u003C/span>).&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"Valiokuntakasittely\">\n    \u003Ch3 class=\"LihavaKursiiviOtsikkoTeksti\">Valiokuntakäsittely\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Valiokunnan mietintö: Hallintovaliokunta (\u003Cspan class=\"AsiakirjaViiteTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HaVM%2010%2F2026%20vp\">HaVM 10/2026 vp\u003C/a>\u003C/span>).&nbsp;\u003C/p>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"PaatosOsa\" class=\"PaatosOsa\">\n   \u003Cdiv class=\"PaatosToimenpide\">\n    \u003Ch3 class=\"LihavaKursiiviOtsikkoTeksti\">Päätös\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Eduskunta on hyväksynyt seuraavat lait:&nbsp;\u003C/p>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"SaadosOsa\" class=\"SaadosOsa\">\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">kansalaisuuslain muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan\u003C/span> kansalaisuuslain (359/2003) 13&nbsp;§:n 1 momentin 5 ja 6 kohta, 25&nbsp;§:n 3 momentti, 44&nbsp;§:n 3 ja 4 momentti sekä 45 §:n 1 momentti,&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">sellaisina kuin ne ovat, 13 §:n 1 momentin 5 kohta ja 25 §:n 3 momentti laissa 929/2025, 13 §:n 1 momentin 6 kohta ja 45&nbsp;§:n 1 momentti laissa 579/2011 ja 44&nbsp;§:n 3 ja 4 momentti laissa 974/2007,&nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">lisätään\u003C/span> 3 §:ään, sellaisena kuin se on laissa 974/2007, uusi 3 momentti, 13 §:n 1 momenttiin, sellaisena kuin se on laeissa 579/2011, 474/2024 ja 929/2025, uusi 7 kohta, lakiin uusi 17&nbsp;b&nbsp;§ ja uusi 3 a luku, 41 §:ään, sellaisena kuin se on laissa 929/2025, uusi 2 ja 3 momentti sekä lakiin siitä lailla 929/2025 kumotun 42 §:n tilalle uusi 42 § seuraavasti:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">3 §&nbsp;\u003C/span>\n       \u003Cdiv class=\"SaadosOtsikkoKooste\">Maahanmuuttoviraston tehtävät&nbsp;\u003C/div>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto vastaa kansalaisuuskokeen yleisestä hallinnosta, tiedottamisesta, tietojärjestelmäkokonaisuudesta, kehittämisestä ja valvonnasta sekä tekee kansalaisuuskokeen järjestämiseen ja laatimiseen liittyviä sopimuksia.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">13 §&nbsp;\u003C/span>\n       \u003Cdiv class=\"SaadosOtsikkoKooste\">Kansalaistamisen yleiset edellytykset&nbsp;\u003C/div>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Ulkomaalaiselle myönnetään hakemuksesta Suomen kansalaisuus, jos hakemusta ratkaistaessa: &nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) hänen toimeentulonsa on turvattu (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">toimeentuloedellytys\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">);\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">6) hänellä on suomen tai ruotsin kielen tyydyttävä suullinen ja kirjallinen taito tai näiden sijasta vastaavan tasoinen suomalaisen tai suomenruotsalaisen viittomakielen taito (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">kielitaitoedellytys\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">); ja\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">7) hänellä on 6 kohdassa tarkoitetulla suomen tai ruotsin kielellä osoitetut riittävät tiedot suomalaisesta yhteiskunnasta (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">yhteiskuntatietoedellytys\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">).\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">17 b §&nbsp;\u003C/span>\n       \u003Cdiv class=\"SaadosOtsikkoKooste\">Yhteiskuntatiedon osoittaminen ja yhteiskuntatietoedellytyksestä poikkeaminen&nbsp;\u003C/div>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Yhteiskuntatietoedellytyksen täyttäminen voidaan osoittaa suorittamalla:&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) hyväksytysti kansalaisuuskoe;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) Suomessa suomen- tai ruotsinkielinen ylioppilastutkinto; tai\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) Suomessa suomen- tai ruotsinkielinen korkeakoulututkinto.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Yhteiskuntatietoedellytys ei koske alle 18-vuotiasta eikä 65 vuotta täyttänyttä henkilöä.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Hakijalle voidaan myöntää Suomen kansalaisuus, vaikka yhteiskuntatietoedellytys ei täyty, jos hänen terveydentilansa tai vammansa pitkäaikaisesti estää sen täyttämisen tai muutoin on olemassa erittäin painava syy yhteiskuntatietoedellytyksestä poikkeamiselle.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 §&nbsp;\u003C/span>\n       \u003Cdiv class=\"SaadosOtsikkoKooste\">Täysivaltaiseksi tulon vaikutus vireillä olevaan hakemukseen&nbsp;\u003C/div>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto asettaa 1 ja 2 momentissa tarkoitetuille henkilöille kohtuullisen määräajan, jossa hakemusta on täydennettävä tai se on vahvistettava. Hakijaan, joka on täydentänyt kansalaisuushakemusta tai joka on vahvistanut kansalaisuushakemuksen, sovelletaan 23&nbsp;§:n 2 momentissa ja 24&nbsp;§:n 3 momentissa säädettyjä edellytyksiä, jos ne ovat täyttyneet ennen 18 ikävuoden täyttämistä. Toimeentuloedellytys ja yhteiskuntatietoedellytys eivät koske hakemuksen vireillä ollessa 18 vuotta täyttänyttä henkilöä.&nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-luku\">\n      \u003Ch5>\n       \u003Cdiv class=\"LukuTunnusKooste\">3 a luku&nbsp;\u003C/div>\n       \u003Cdiv class=\"SaadosOtsikkoKooste\">Kansalaisuuskoe&nbsp;\u003C/div>\n      \u003C/h5>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 a §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen sisältö&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeella testataan perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Monivalintakokeen kysymykset perustuvat yleisesti saatavilla olevaan kansalaisuuskokeen oppimateriaaliin, joka on laadittu kotoutumisen edistämisestä annetun lain (681/2023) 25&nbsp;§:ssä tarkoitetun yhteiskuntaorientaation oppimateriaalin pohjalta. Kokeen kysymykset koskevat Suomen keskeistä lainsäädäntöä, perus- ja ihmisoikeuksia, yhdenvertaisuutta, sukupuolten tasa-arvoa, Suomen historiaa ja kulttuuria sekä muita kansalaisuuskokeen oppimateriaaliin sisältyviä keskeisiä tietoja.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskoe suoritetaan 13&nbsp;§:n 1 momentin 6 kohdassa tarkoitetulla suomen tai ruotsin kielellä. Koe suoritetaan sähköisesti, ellei kokeen sähköiselle toteutukselle ole estettä. Kansalaisuuskokeen hyväksytty suoritus edellyttää sitä, että valtaosa monivalintakokeen vastauksista on valittu oikein.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen sisällöstä ja hyväksytystä suorituksesta voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 b §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen laatiminen&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto tekee sopimuksen kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin hankkimisesta yliopiston tai muun sellaisen yliopistollisen toimijan kanssa, jolla on riittävä asiantuntemus kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin laatimiseen.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 c §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen laatijan tehtävät&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"KohdatMomentti\">\n        \u003Cdiv class=\"MomenttiJohdantoKooste\">Kansalaisuuskokeen laatijan tehtävänä on:&nbsp;\u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">1)&nbsp;laatia 25&nbsp;a&nbsp;§:ssä tarkoitettu yhteiskuntaorientaation oppimateriaaliin perustuva kansalaisuuskokeen oppimateriaali suomen ja ruotsin kielellä;\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">2)&nbsp;valmistella laaja valikoima kansalaisuuskokeen kysymyksiä vastausvaihtoehtoineen suomen ja ruotsin kielellä;\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">3)&nbsp;huolehtia kokeen oppimateriaalin, kysymysten ja vastausvaihtoehtojen testauksesta, ylläpitämisestä ja kehittämisestä; sekä\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">4) osallistua 25&nbsp;f&nbsp;§:ssä tarkoitetun asiantuntijatoimikunnan toimintaan.\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">Kansalaisuuskokeen laatijan palveluksessa olevaan henkilöön sovelletaan rikosoikeudellista virkavastuuta koskevia säännöksiä hänen suorittaessaan 1 momentissa&nbsp;tarkoitettuja tehtäviä.\u003C/span>&nbsp;\n        \u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen laatijan tehtävistä ja niitä koskevien sopimusten sisällöstä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 d § &nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen järjestäminen&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto sopii kansalaisuuskokeen koetilaisuuksien järjestämisestä sellaisten toimijoiden kanssa, joilla on riittävä asiantuntemus ja edellytykset koetilaisuuksien järjestämiseen. Sopimuksia tehtäessä on otettava huomioon, että koetilaisuuksia on tarjolla alueellisesti riittävä määrä ja riittävän usein.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 e §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen järjestäjän tehtävät&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"KohdatMomentti\">\n        \u003Cdiv class=\"MomenttiJohdantoKooste\">Kansalaisuuskokeen järjestäjän tehtävänä on:&nbsp;\u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">1) järjestää koetilaisuudet sopimusehtojen mukaisesti; \u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">2) huolehtia koetilaisuuksien valvonnasta; \u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">3) toteuttaa 25 g §:ssä tarkoitetut erityisjärjestelyt; sekä\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">4)&nbsp;ilmoittaa Maahanmuuttovirastolle viipymättä 25&nbsp;h&nbsp;§:ssä tarkoitetuista tilanteista seuraamuksista päättämistä varten. \u003C/span>&nbsp;\n        \u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen järjestäjällä on oikeus saada Maahanmuuttovirastolta maksutta ja salassapitosäännösten estämättä 1 momentissa tarkoitettujen tehtävien hoitamisen kannalta välttämättömät tiedot. Kokeen järjestäjään sovelletaan viranomaisten toiminnan julkisuudesta annetussa laissa (621/1999) säädettyjä salassapitovelvoitteita, kun se hoitaa 1 momentissa tarkoitettuja tehtäviä. Kokeen järjestäjän palveluksessa olevaan henkilöön sovelletaan rikosoikeudellista virkavastuuta koskevia säännöksiä hänen suorittaessaan 1&nbsp;momentissa&nbsp;tarkoitettuja tehtäviä.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen järjestäjien tehtävistä ja niitä koskevien sopimusten sisällöstä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 f §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Asiantuntijatoimikunta&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttoviraston yhteydessä toimii asiantuntijatoimikunta, jonka Maahanmuuttovirasto asettaa enintään kolmeksi vuodeksi kerrallaan. Asiantuntijatoimikunnan puheenjohtajana toimii Maahanmuuttoviraston edustaja. Varapuheenjohtajana toimii mahdollisuuksien mukaan kotoutumisen asiantuntemuksen edustaja. Lisäksi asiantuntijajäsenten tulee edustaa ainakin koulutuksen asiantuntemusta sekä kansalaisuuskokeen laatijaa ja järjestäjää. &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Asiantuntijatoimikunnan tehtävänä on tukea Maahanmuuttovirastoa kansalaisuuskokeen yleisessä kehittämisessä ja hallinnossa. Toimikunta antaa Maahanmuuttoviraston pyynnöstä lausunnon kansalaisuuskoetta koskevasta oikaisuvaatimuksesta.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Asiantuntijatoimikunnan kokoonpanosta, asioiden käsittelystä ja tehtävistä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 g §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Kokeen suorittamista koskevat erityisjärjestelyt&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Henkilö, joka on sairauden, vamman, lukemisen ja kirjoittamisen erityisvaikeuden tai muun niihin rinnastettavan syyn vuoksi estynyt suorittamasta kansalaisuuskoetta samalla tavalla kuin muut kokeen suorittajat, voi suorittaa kokeen erityisjärjestelyin.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Lain 18&nbsp;b&nbsp;§:n 2 ja 3 momentissa tarkoitettu alle 65-vuotias henkilö voi suorittaa kokeen suullisesti.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto päättää erityisjärjestelyjen käytöstä. Erityisjärjestelyistä tulee esittää virastolle erillinen pyyntö.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 h §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Seuraamus järjestyksen rikkomisesta ja vilpillisestä menettelystä&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen suorittajan koesuoritus katsotaan hylätyksi, jos hän syyllistyy järjestyksen rikkomiseen koetilaisuudessa eikä koetilaisuuden valvojan kehotuksesta huolimatta lopeta menettelyä.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Jos kokeen suorittaja syyllistyy koetilaisuudessa vilpilliseen menettelyyn, siinä avustamiseen tai sen yritykseen, hänen koesuorituksensa katsotaan hylätyksi ja hän menettää oikeutensa osallistua koetilaisuuteen kuuden kuukauden ajaksi koetilaisuudesta. Jos menettely on toistuvaa tai muuten erityisen vakavaa ja haitallista, kokeen suorittajan koesuoritus katsotaan hylätyksi ja hän menettää oikeutensa osallistua koetilaisuuteen 12 kuukauden ajaksi koetilaisuudesta. Jos kokeen suorittaja on ehtinyt ilmoittautua uuteen koetilaisuuteen, Maahanmuuttovirasto voi peruuttaa osallistumisen.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Päätöksen 1 ja 2 momentissa tarkoitetussa asiassa tekee Maahanmuuttovirasto. Päätös pannaan täytäntöön tehdystä valituksesta huolimatta, jollei valitusviranomainen kiellä täytäntöönpanoa. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 i §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Koemaksu&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto perii kokeeseen ilmoittautuneelta koemaksun. Koemaksun määrästä säädetään sisäministeriön asetuksella Maahanmuuttoviraston suoritteiden maksullisuudesta noudattaen, mitä valtion maksuperustelaissa (150/1992) säädetään julkisoikeudellisista suoritteista perittävistä maksuista.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Koemaksu palautetaan kokeeseen ilmoittautuneelle, jos hän on estynyt osallistumasta kokeeseen oman sairautensa vuoksi. Maksua ei palauteta, jos esteestä ei ole ilmoitettu Maahanmuuttovirastolle ennen koetilaisuutta. Pyyntö maksun palauttamisesta on tehtävä Maahanmuuttovirastolle 14 päivän kuluessa koepäivästä.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">41 §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Muutoksenhaku&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen suorituksen hylkäämistä koskevaan päätökseen saa vaatia oikaisua Maahanmuuttovirastolta.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto voi pyytää 2 momentissa tarkoitetusta oikaisuvaatimuksesta lausunnon 25&nbsp;f&nbsp;§:ssä tarkoitetulta asiantuntijatoimikunnalta. Muutoin oikaisuvaatimusmenettelyyn sovelletaan, mitä hallintolaissa (434/2003) säädetään. Edellä 2 momentissa tarkoitetusta oikaisuvaatimuksesta annettuun päätökseen ei saa hakea muutosta valittamalla.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">42 §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Oikaisuvaatimuksen käsittelymaksu&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Edellä 41&nbsp;§:n 2 momentissa tarkoitetun kansalaisuuskoetta koskevan oikaisuvaatimuksen käsittely on maksullinen. Käsittelymaksun määrästä säädetään sisäministeriön asetuksella Maahanmuuttoviraston suoritteiden maksullisuudesta noudattaen, mitä valtion maksuperustelaissa säädetään julkisoikeudellisista suoritteista perittävistä maksuista.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Oikaisuvaatimuksen käsittelyn jatkaminen sen vireille tulon jälkeen edellyttää, että oikaisuvaatimuksen käsittelystä perittävä maksu on suoritettu 30 päivän kuluessa vaatimuksen vireille tulosta. Oikaisuvaatimus voidaan jättää tutkimatta, jos oikaisuvaatimuksen käsittelystä perittävää maksua ei ole suoritettu mainitussa määräajassa.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Oikaisuvaatimuksen käsittelyä koskeva maksu palautetaan asianosaiselle, jos Maahanmuuttovirasto muuttaa muutoksenhaun alaista päätöstä muutoksenhakijan eduksi siten, että kansalaisuuskokeen suoritus on hyväksytty.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">44 §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Hakemuksen ja ilmoituksen vireillepano&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Hakemuksen ja ilmoituksen käsittelyn jatkaminen 2 momentin mukaisen tarkastuksen jälkeen edellyttää Maahanmuuttoviraston käsittelymaksun suorittamista. Maksu määräytyy valtion maksuperustelain&nbsp;mukaisesti. Tarkemmat säännökset maksusta annetaan sisäministeriön asetuksella.&nbsp;&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Tämän lain mukaisten asioiden käsittelyyn kunniakonsulaateissa sovelletaan hallintolakia.&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">45 §&nbsp;\u003C/span>\n        \u003Cdiv class=\"SaadosOtsikkoKooste\">Hakijan liitteet hakemukseen&nbsp;\u003C/div>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Hakijan on liitettävä kansalaisuushakemukseensa 17&nbsp;§:ssä tarkoitettu selvitys suomen tai ruotsin kielen taidostaan, 17&nbsp;b&nbsp;§:ssä tarkoitettu selvitys yhteiskuntatiedon osoittamisesta ja 13 §:n 1 momentin 5 kohdassa tarkoitettu selvitys siitä, kuinka hän saa Suomessa toimeentulonsa. Kielitaitoselvitystä ei kuitenkaan tarvita, jos hakijana on alle 15-vuotias lapsi. Jos hakemuksessa on 15 vuotta täyttänyt kanssahakija, hakijan on liitettävä hakemukseensa selvitys myös tämän suomen tai ruotsin kielen taidosta. Jos lapsi täyttää 15 vuotta hakemuksen vireillepanon jälkeen mutta ennen sen ratkaisemista, selvitys hänen kielitaidostaan on liitettävä hakemukseen.&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan&nbsp;&nbsp;&nbsp;&nbsp;päivänä&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;kuuta&nbsp;20&nbsp;&nbsp;.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Mitä 13&nbsp;§:n 1 momentin 7 kohdassa säädetään, ei sovelleta sellaisiin hakemuksiin, jotka on tehty kahden kuukauden kuluessa tämän lain voimaantulosta.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Tämän lain voimaan tullessa vireillä olleeseen kansalaisuushakemukseen sovelletaan tämän lain voimaan tullessa voimassa olleita säännöksiä.&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">Maahanmuuttovirastosta annetun lain 2 §:n muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan\u003C/span> Maahanmuuttovirastosta annetun lain (156/1995) 2&nbsp;§:n 2&nbsp;momentin 4&nbsp;kohta, sellaisena kuin se on laissa 621/2020, ja&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">lisätään\u003C/span> 2 §:n 2 momenttiin, sellaisena kuin se on laeissa 621/2020 ja &nbsp;&nbsp;&nbsp;/&nbsp;&nbsp;&nbsp;, uusi 5 kohta seuraavasti:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">2 §&nbsp;\u003C/span>\n       \u003Cdiv class=\"SaadosOtsikkoKooste\">Tehtävät&nbsp;\u003C/div>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Maahanmuuttovirasto vastaa:&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) ihmiskaupan uhrien auttamisen toimeenpanon ohjauksesta;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) kansalaisuuskokeen yleisestä hallinnosta, valvonnasta ja kehittämisestä.\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan&nbsp;&nbsp;&nbsp;&nbsp;päivänä&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;kuuta&nbsp;20&nbsp;&nbsp;.&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 1 §:n muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan\u003C/span> henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain (615/2020) 1&nbsp;§:n 1 momentin 2 kohta, sellaisena kuin se on laissa 683/2023, seuraavasti:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">1 §&nbsp;\u003C/span>\n       \u003Cdiv class=\"SaadosOtsikkoKooste\">Lain soveltamisala ja henkilötietojen käsittelyn tarkoitus&nbsp;\u003C/div>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Tätä lakia sovelletaan, jollei muualla laissa toisin säädetä, henkilötietojen kokonaan tai osittain automatisoituun käsittelyyn sekä muuhun henkilötietojen käsittelyyn, kun henkilötiedot muodostavat tai niiden on tarkoitus muodostaa henkilörekisteri tai sen osa ja henkilötietoja käsitellään seuraavissa tarkoituksissa:&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2)&nbsp;Suomen kansalaisuuden saamista, säilyttämistä, menettämistä ja kansalaisuudesta vapautumista sekä kansalaisuusaseman määrittämistä koskevien asioiden käsittely ja päätöksenteko sekä kansalaisuuskokeen yleinen hallinto ja valvonta; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan&nbsp;&nbsp;&nbsp;&nbsp;päivänä&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;kuuta&nbsp;20&nbsp;&nbsp;.&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"AllekirjoitusOsa\" class=\"AllekirjoitusOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingissä 10.6.2026&nbsp;\u003C/div>\n   \u003Cp class=\"JohdantoTeksti\">Eduskunnan puolesta\u003C/p>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">puhemies&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">pääsihteeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-31560",nav:"\u003Cnav id=\"VaskiNavi\">\n \u003Cspan class=\"edk-title-h4\" id=\"SisallysluetteloTitle\">Sisällysluettelo\u003C/span>\n \u003Cul id=\"Sisallysluettelo\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"#IdentifiointiOsa\">Identifiointiosa\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#AsiaKuvaus\">Johdanto\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#PaatosOsa\">Päätösosa\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#SaadosOsa\">Säädösosa\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#AllekirjoitusOsa\">Allekirjoittajat\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Muut esitysmuodot\u003C/span>\n \u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/edktunnus/EDK-2026-AK-31560/pdf\" class=\"navilink\">Asiakirjan painoasu (PDF)\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/riksdagshandlingar/RSv+86/2026\" class=\"navilink\">Dokumentet på svenska\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"KasittelytiedotTitle\">Käsittelytiedot\u003C/span>\n \u003Cul id=\"Kasittelytiedot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/HE%2054%2F2026%20vp\" class=\"navilink\">HE 54/2026 vp\u003C/a>\u003C/li>\n \u003C/ul>\n\u003C/nav>"},uses:{params:["edktunnus"]}}],
