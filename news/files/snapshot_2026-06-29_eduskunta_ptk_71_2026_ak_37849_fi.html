path d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/HE%20102%2F2026%20vp\">HE 102/2026 vp\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Asiakirjat\u003C/span>\u003C/li>\n    \u003C/ol>\n   \u003C/nav>\n  \u003C/div>\n \u003C/div>\n \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n  \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">23.6.2026 | 14:03\u003C/span>\n \u003C/div>\n \u003Cdiv class=\"PoytakirjaAsiakohta Eduskunnanpoytakirja2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Pöytäkirjan asiakohta\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;PTK&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">71\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"YhteisoTeksti\">Täysistunto&nbsp;\u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Tiistai 23.6.2026 klo 10.05—11.42\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv class=\"Asiakohta 240927\">\n   \u003Ch2>\u003Cspan class=\"KohtaNumeroTeksti\">2.&nbsp; \u003C/span>\u003Cspan class=\"KohtaNimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle vuoden 2026 toiseksi lisätalousarvioksi\u003C/span>\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle vuoden 2026 toisen lisätalousarvioesityksen (HE 102/2026 vp) täydentämisestä\u003C/span>\u003C/span>\u003C/h2>\n   \u003Cdiv class=\"edk-viite\">\n    \u003Cdiv class=\"KohtaAsia\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20102%2F2026%20vp\">HE 102/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"edk-viite\">\n    \u003Cdiv class=\"KohtaAsia\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20112%2F2026%20vp\">HE 112/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"edk-viite\">\n    \u003Cdiv class=\"KohtaAsia\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Lisätalousarvioaloite\u003C/span>\u003Cspan class=\"MultiViiteTunnus\">\u003Ca href=\"/haku?category=asioiden-kasittelytiedot&amp;multiviite=LTA%201-8%2F2026%20vp\">LTA 1-8/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"edk-viite b-margin\">\n    \u003Cdiv class=\"KohtaAsiakirja\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Valiokunnan mietintö\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/VaVM%2019%2F2026%20vp\">VaVM 19/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Toimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Ainoa käsittely\u003C/div>\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Ainoaan käsittelyyn esitellään päiväjärjestyksen \u003Cspan class=\"HarvaKursiiviTeksti\">2.\u003C/span> asia. Käsittelyn pohjana on valtiovarainvaliokunnan mietintö VaVM 19/2026 vp.&nbsp;\u003C/p>\n      \u003Cp class=\"edk-KappaleKooste\">Asian käsittely alkaa yleiskeskustelulla, jossa on nopeatahtinen osuus, jolloin etukäteen varatut puheenvuorot saavat kestää enintään viisi minuuttia. Puhemiesneuvosto suosittaa, että myös nopeatahtisen keskusteluosuuden jälkeen pidettävät puheenvuorot kestävät enintään viisi minuuttia. Äänestykset ovat yleiskeskustelun päätyttyä. — Valtiovarainvaliokunnan puheenjohtaja, edustaja Lohi, olkaa hyvä.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"KeskusteluToimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Keskustelu\u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.06\">10.06&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Markus&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.06Lohi\">Lohi&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(esittelypuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Esittelen valtiovarainvaliokunnan mietinnön koskien hallituksen esitystä eduskunnalle vuoden 2026 toiseksi lisätalousarvioksi. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Valiokunta toteaa yleisperusteluissaan, että vuoden 2026 toisessa lisätalousarvioesityksessä varsinaisten tulojen arviota korotetaan 131 miljoonaa euroa ja määrärahoja lisätään 430 miljoonalla eurolla. Valiokunta nostaa esiin merkittävimpiä muutosesityksiä seuraavasti: Tuloarviosta toteamme, että arvonlisäveron kertymää esitetään nostettavaksi 122 miljoonalla eurolla. Sekalaisten tulojen arvioidaan nousevan nettomääräisesti 113 miljoonalla eurolla, mihin sisältyy muun muassa päästöoikeuksien huutokauppatuloarvion alentaminen sekä korotuksia arvioituihin EU:lta saataviin tuloihin. Osinkotuloja ja omaisuuden myyntituloja esitetään alennettavaksi yhteensä 72 miljoonalla eurolla. Arviota osinkotuloista alennetaan, mutta toisaalta Fingrid Oyj:n osakemyynnit lisäävät tuloja 62 miljoonalla eurolla. Lisäksi Suomen Pankin tuloutus ja Senaatti-kiinteistöjen tuloutus poistetaan vuodelta 2026, mikä alentaa tuloja yhteensä 41,4 miljoonalla eurolla. Metsähallituksen tuloutusta korotetaan 10 miljoonalla eurolla. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Lisätalousarvioesitykseen sisältyy hallituksen kevään kehysriihessä linjaamia työllisyystoimia. Nuorten rekrytointitukeen esitetään 20 miljoonan euron määrärahaa, mikä riittäisi noin 3&nbsp;300 työttömän nuoren työllistämiseen. Nuorisotyöttömyyden ehkäisemisen pilotteihin kohdennetaan 15 miljoonaa euroa ja lisäksi 20 miljoonaa euroa kohdennetaan pitkäaikaistyöttömien osaamissetelistä aiheutuviin kustannuksiin. Valtionhallinnon kesätyöntekijöiden ja harjoittelijoiden lisärekrytointiin esitetään 4 miljoonan euron määrärahaa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Edelleen kehysriihen linjauksen mukaisesti energiatehokkuutta parantavan korjausrakentamisen avustuksiin ja niiden hallinnointiin osoitetaan 25 miljoonaa euroa. Määrärahalisäys liittyy kaikkiaan 110 miljoonan euron määräaikaiseen kokonaisuuteen, jolla tavoitellaan suunnitteilla olevien remonttien nopeuttamista sekä uusia korjaushankkeita. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Droonintorjuntakyvyn vahvistamiseen esitetään noin 50:tä miljoonaa euroa sisäministeriön hallinnonalalle, ja kokonaisuutta käsitellään momentin 26.20.70 yhteydessä. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Lisäksi hallitus täydensi esitystään maataloudessa käytettyjen eräiden energiatuotteiden 10 miljoonan euron tilapäisellä valmisteveron lisäpalautuksella. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hallitus esittää puolustusministeriön hallinnonalalle tilausvaltuuden enimmäismäärään lisäystä 1 miljardi 57 miljoonaa euroa materiaalihankintoihin, jotka ajoittuvat vuosille 2026—2028. Ukrainaan toimitettuun 31. tukipakettiin sisältyneen puolustusmateriaalin korvaaviin hankintoihin tarkoitettua Ukrainan tukemisen tilausvaltuutta esitetään korotettavan 96,8 miljoonalla eurolla. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Lisätalousarvioesitykseen sisältyy myös useita liikennehankevaltuuksia, joita tarkastellaan erikseen kyseisellä momentilla. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Vuoden 2026 toinen lisätalousarvioesitys lisää valtion nettolainanoton tarvetta 299 miljoonaa euroa. Vuoden 2026 nettolainanotoksi arvioidaan noin 11,1 miljardia euroa. Jos lakkautetun Valtion asuntorahaston jäljellä olevan kassan tulouttaminen valtion budjettiin jätetään huomioimatta, on alijäämä 13,4 miljardia euroa. Budjetoidun valtionvelan määrän arvioidaan olevan noin 201 miljardia euroa vuoden 2026 lopussa, mikä on 69,5 prosenttia suhteessa bruttokansantuotteeseen. Kun huomioidaan kehysmenojen lisäys ja kehyksen rakennemuutokset, jää kuluvan vuoden jakamattomaksi varaukseksi 39 miljoonaa euroa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Yhteenvetona valiokunta toteaa mietinnössään, että hallituksen esityksessä ehdotetaan määrärahoihin 430&nbsp;124&nbsp;000 euron lisäystä, tuloarvioihin 131&nbsp;486&nbsp;000 euron lisäystä ja nettolainanottoon ja velanhallintaan noin 298 miljoonan euron lisäystä. Ehdotettujen muutosten jälkeen olisivat kuluvan vuoden budjetoidut tuloarviot ja määrärahat varsinainen talousarvio ja lisätalousarviot huomioon ottaen 91&nbsp;697&nbsp;867&nbsp;000 euroa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Valiokunnan päätösehdotus on, että eduskunta hyväksyy hallituksen esitykseen 102/2026 ja sitä täydentävään hallituksen esitykseen 112/2026 sisältyvän ehdotuksen vuoden 2026 toiseksi lisätalousarvioksi edellä todetuin muutoksin, että eduskunta hylkää lisätalousarvioaloitteet 1—8 ja että eduskunta päättää, että vuoden 2026 toista lisätalousarviota sovelletaan 1.7.2026 alkaen. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tähän mietintöön on jätetty neljä vastalausetta, jotka esitellään täällä keskustelun aikana erikseen. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia, edustaja Lohi. — Edustaja Hänninen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.12\">10.12&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.12Hänninen\">Hänninen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hallituksen toinen lisätalousarvio on ennen kaikkea turvallisuuden lisätalousarvio. Se vahvistaa puolustuskykyä, rajaturvallisuutta, viranomaisten toimintakykyä ja yhteiskunnan kriisinkestävyyttä aikana, jolloin turvallisuusympäristömme on muuttunut pysyvästi. Turvallisuus ei ole vain puolustuspolitiikkaa. Se on myös toimivia viranomaisia, vahvaa huoltovarmuutta, toimintakykyistä infrastruktuuria ja kykyä varautua uudenlaisiin uhkiin. Tässä suhteessa lisätalousarvio sisältää useita tärkeitä ratkaisuja.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Pidän erityisen tärkeänä sitä, että Rajavartiolaitoksen ja poliisin dronetorjuntakykyyn osoitetaan yhteensä noin 50 miljoonaa euroa. Valtiovarainvaliokunta korostaa mietinnössään tarvetta rakentaa kattava vastadronejärjestelmä sekä vahvistaa viranomaisten yhteistyötä. Tämä on välttämätöntä, sillä miehittämättömät järjestelmät ovat nousseet uudeksi turvallisuusuhkaksi myös Suomessa. Kuten Venäjän raakalaismaisesta hyökkäyssodasta olemme voineet oppia, dronet voivat toimia tiedustelun, tuhovaikutuksen ja häirinnän välineinä. Siksi Suomen on kyettävä havaitsemaan, tunnistamaan ja tarvittaessa torjumaan ja tuhoamaan tällaiset uhat varmasti ja tehokkaasti, ja siksi tässäkin lisätalousarviossa myös Ukrainan tukeminen jatkuu. Kansalaisten turvallisuus edellyttää, että tieto mahdollisista uhista liikkuu nopeasti ja viranomaiset toimivat saumattomasti yhdessä ja että voimme kumppaniemme kanssa olla vahvoja, varautuneita ja valmiita.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Turvallisuus tarkoittaa myös toimivia yhteyksiä. Valtiovarainvaliokunta nostaa esiin sotilaallisen liikkuvuuden hankkeet, joilla vahvistetaan Suomen puolustus- ja huoltovarmuuskykyä. Myös pohjoisen Suomen raidehankkeet ja Oulun ratapihan parantaminen ovat turvallisuusinvestointeja eivätkä pelkästään liikennehankkeita. Liikkuvuuden turvaaminen on tärkeää koko Suomen puolustuksen kannalta. Joukkojen, kaluston ja huollon on voitava liikkua nopeasti eri puolilla maata myös poikkeusoloissa. Tässä ajassa pohjoinen Suomi on noussut entistä merkittävämpään strategiseen asemaan. Siksi myös liikkumisen hankkeita on tarkasteltava turvallisuuspoliittisesta näkökulmasta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Turvallisuus on kaiken keskiössä. Vahva puolustus, riittävät puolustusteollisuuden resurssit, toimivat viranomaiset, turvattu huoltovarmuus, hyväkuntoiset yhteiskunnan rakenteet sekä vakaa yhteiskunta ovat kaikki turvallisuuden edellytyksiä. Tämä lisätalousarvio vastaa näihin tarpeisiin vastuullisella tavalla. Turvallisuudesta on huolehdittava, mutta samalla velkaantumisen hallinta on osa kansallista turvallisuutta. [Aki Lindén: Velkahan kasvaa!] Taloudellisesti vahva Suomi kykenee paremmin vastaamaan myös turvallisuusuhkiin. Samalla on todettava, että talouden tilannekuva ei ole muuttunut. Tässä lisätalousarviossa ei vain anneta rahaa sinne ja tänne. Kaikki lisäykset kohdennetaan tarkasti, huolellisesti ja vastuullisesti. Pohjoisesta Suomesta katsottuna haasteet, joihin tällä talousarviolla vastataan, eivät ole kaukaisia tai teoreettisia kysymyksiä. Ne näkyvät rajalla, liikenneverkoissa, viranomaistyössä ja ihmisten arjessa. [Tuomas Kettunen: Länsirajallako?] Siksi pidän esitystä perusteltuna ja kannatettavana. — Kiitos, arvoisa puhemies.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Heinonen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.17\">10.17&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Timo&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.17Heinonen\">Heinonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies, hyvät edustajakollegat ja muut täysistuntoa seuraavat! Hän oli yksinäinen optimisti. [Aki Lindén: Tuo äskeinen vai? — Naurua]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Maamme talous on nyt toipumassa. Edelleen ilmassa on kuitenkin kysymysmerkkejäkin, ja toipumista varjostavat Lähi-idän kriisi, kohonneet energiahinnat ja talousnäkymiin liittyvä epävarmuus. Talouskehitykseen liittyy siis edelleen huomattavaa epävarmuutta, ja toivottavasti nyt ensi tiedot Lähi-idästä, Hormuzinsalmelta ja Iranista realisoituisivat kohti pysyvämpää rauhaa. Toivomme myös rauhaa Ukrainaankin, ennen muuta Ukrainan ja ukrainalaisten takia, mutta toki tämänkin pitkittyneen sodan vaikutukset näkyvät koko maailmassa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Valtiovarainministeriön tuoreessa raportissa todetaan nyt, että talouskasvu on alkuvuonna ollut odotettua vahvempaa. Itse asiassa maamme talous on jo kasvanut kolmatta vuotta. Tarkentuneet luvut kertovat, että pääministeri Petteri Orpon hallituksen toimet toimivat. Tilastokeskuksen tarkentuneet ennakkotiedot kertoivat, että maamme bruttokansantuote kasvoi viime vuonna 0,8 prosenttia, aiempi arvio viime vuodelta oli 0,2. Kasvu siis nelinkertaistui, en muista tällaista nähneeni ainakaan 20 vuoteen, ja tämä Tilastokeskuksen korjattu oikea luku vaikuttaa myös kaikkiin tehtyihin ennusteisiin. Eli maamme talous on kasvanut hyvin jo pidempään ja vahvistaa sen, että hallituksen talouspolitiikka toimii.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Voisi tiivistäen todeta, että Orpon hallituksen talouspolitiikka on vaikeassa maailmanpoliittisessa tilanteessa toiminut varsin hyvin. [Tuomas Kettusen välihuuto] Nyt tuoreimpaan kasvuun vaikutti erityisesti viennin hyvä vire. Taloutemme kasvoi siis viime vuonna 0,9 prosenttia ja 0,9 prosenttia jo vuonna 24 ja viime vuonna 0,8 prosenttia, ja nyt alkuvuosi on ollut hyvässä nosteessa. Merkittävä huomio on sekin, että samaan aikaan on tehtyjen työtuntien määrä laskenut, eli tuottavuus on siis kasvanut aika lailla reippain askelin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kuka muistaa, kun pääministeri Petteri Orpoa kutsuttiin yksinäiseksi optimistiksi, kun hän viime syksynä nosti esiin talouden positiivisia merkkejä? Orpoa parjattiin optimismista, vasemmisto-oppositio toitotti, että kasvu on aina jäänyt nurkan taakse, [Pia Viitanen: No niin se onkin!] ja haluttiin oikein yhdessä synkistellä.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa vasemmisto-oppositio keskustan kanssa: nyt tarkentuneiden tietojen mukaan maamme talous kuitenkin kääntyi hyvään kasvuun jo vuonna 24, ja viime vuonna talouskasvu jatkui. Itse asiassa vuosittaisten bkt-lukujen tarkentuminen on kokoaan suurempi muutos: Suomi onkin painellut noin prosentin kasvussa viimeiset pari vuotta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tarkentuneet luvut kertovat, että Orpon hallituksen toimet toimivat. Mitä tarkoittaa tämä? Ennusteita nostetaan taas syksyllä. Taloudessa on lähtenyt hyvä kierre jo aikaa sitten käyntiin, ja se on tämän vuoden alun tietojen perusteella voimistumassa. Taisi joku ekonomisti jo puhua, että edes kahden prosentin kasvu ei ole poissuljettua. Suomella menee nyt siis jo paremmin kuin uskommekaan, ja tällä luodaan siis parempaa, vaurasta, kasvavaa ja itsevarmempaa Suomea. Se on hyvä uutinen ihan jokaiselle suomalaiselle. [Aki Lindén: Ja velka kasvaa!]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tehtävää kuitenkin riittää, ja tekemättä ei voi jättää. Valtiovarainministeriön ylijohtaja, osastopäällikkö Mikko Spolander totesi tämän ennusteen julkistamisen yhteydessä, että näkymä, josta Suomen talous ponnistaa seuraavalle hallituskaudelle, odottaa vielä sumun hälvenemistä. Sen sijaan julkisessa taloudessa näkymä on selkeä: rakenteellisen epätasapainon oikaiseminen vaaditusti edellyttää maaltamme mittavia, nopeasti vaikuttavia, suoria sopeutustoimia myös ensi vaalikaudella.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta haluan nostaa esille sen, että meillä on erittäin vaikea työttömyystilanne edelleen. Pitkäaikaistyöttömyys ja nuorisotyöttömyys vaivaavat maatamme, ja julkisen talouden tila ei kohene tulevina vuosina ilman uusia sopeutustoimia, sillä puolustusmenojen kasvu jatkuu tulevina vuosina merkittävästi, korkomenot ovat korkeat ja niin poispäin. Myös velkasuhde tulee nousemaan merkittävästi jatkossakin. Maamme talous siis kasvaa vaikeasta ympäristöstä huolimatta, vaikka energian hinta, korkotaso ja geopoliittinen epävarmuus painavatkin taloutta, ja VM nosti tämän vuoden omaakin kasvuennustettaan.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Myönteistä on sekin, että maahamme uskalletaan jälleen investoida. Vientikin vetää jälleen epävarmuudesta huolimatta, ja lopputulemana voisin todeta, että velkaantumisen hillintää tulee jatkaa määrätietoisesti myös ensi ja ehkäpä vielä sitäkin seuraavalla vaalikaudella. Tehtävä on massiivinen mutta toki meidän kaikkien suomalaisten yhteinen. Tämä on lopulta edellytys vakaudelle, luottamukselle ja matalammille koroille tulevaisuudessa, ja vaikeinta tässä tulee olemaan se, että talouden sopeuttaminen on pyrittävä toteuttamaan siten, että se ei haittaa alkanutta ja vahvistuvaa talouskasvua paljoakaan, toivottavasti ei yhtään. Nyt olisi myrkkyä esimerkiksi keskustan esittämät miljardien veronkiristykset tuleville vuosille. Nyt tarvitaan enemmän talouskasvua tukevia toimia ja ennen muuta samalla rakenteellisia, kestävää kasvua tukevia uudistuksia. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Muistutan kaikkia viiden minuutin aikarajasta. — Edustaja Joona Räsänen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.24\">10.24&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Joona&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.24Räsänen\">Räsänen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Nyt kun käsitellään todella tämän vuoden toista lisätalousarviota, niin on syytä keskittyä jälleen muutamaan asiaan, ensimmäisenä niihin asioihin, mitkä tapahtuvat täällä koko kansantalouden puolella, ja sitten totta kai niihin asioihin, mihin tällä lisätalousarviolla enemmän puututaan eli tähän julkisen talouden kokonaisuuteen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Niin kuin edellä on hyvin todettu, kansantalouden osaltahan olemme viime aikoina saaneet oikeinkin positiivisia uutisia. [Jari Koskela: Oho, hienoa!] Ne kaikki uutiset on syytä ottaa avosylin vastaan ja joka ilta jokaisen meistä ristiä kätemme, että niitä tulisi jatkossakin lisää, [Jari Koskela: Näin on tehty!] koska viime kädessä myös julkisen talouden tasapainon ja julkisen talouden vahvistamisen ratkaisee se, miten tässä talous- ja työllisyyskehityksessä onnistumme.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Jäin nyt hieman vain kysymään sitä, että kun tänään nämä kansantalouden positiiviset uutiset ovatkin kaikki hallituksen ansiota, niin ennen näitä korjauksia hidas kasvu oli kuitenkin maailmantalouden myllerryksen syytä. Ymmärsinkö oikein? Eli nyt kun luvut ovat tarkentuneet myös takautuvasti, niin kaikki syy on tietenkin hallituksella [Timo Heinonen: Mutta ei edellisellä!] ja hallituksen hienoissa toimenpiteissä, sekä tietenkin edellisellä hallituksella että sitten seuraavalla. Mutta muistelisin, että vielä aikaisemmin, kun tätä keskustelua käytiin, tässä salissa monesti todettiin, että huonoista kasvuluvuista ei voi suinkaan syyttää hallitusta vaan maailmantalouden tilannetta. [Ben Zyskowicz: Oletteko eri mieltä siitä?]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nyt pitää sitten päättää, onko todella niin, että kaikki kiitos kuuluu hallitukselle, vai onko niin, että saattaapa olla jollain muullakin siinä merkitystä ottaen nyt huomioon, mistä nämä tarkentuneet luvut kertovat. Nehän eivät suinkaan kerro siitä, että meillä kotimarkkinoilla olisi mennyt paremmin, vaan nehän kertovat nimenomaan siitä, että meillä viennissä menee paremmin, ja tästä tietenkin iso kiitos meidän vientiteollisuuden toimijoille. Nyt kun luvut ovat todella tarkentuneet, että Suomen talous on kasvanut useampana vuotena, niin sitten se toinen kysymys, mikä tästä tietenkin tulee, on se, miten voi olla, että samanaikaisesti, kun meidän talous on kuitenkin kasvanut, meidän työllisyyskehitys on silti Euroopan surkeinta. Siis miten tässä tilanteessa, jossa talous on kasvanut — kun olemme täällä kuulleet, että hallitus on tehnyt kaiken oikein — Suomen työllisyyskehitys voi olla Euroopan surkeinta? [Ben Zyskowicz: Palataanko tähän loppuvuodesta?] Tämä tietenkin aiheuttaa sen jatkokysymyksen, että varmaankin on niin, että sitten ne toimenpiteet, jotka hallitukselta ovat enemmänkin kohdistuneet tänne kotimarkkinoihin, eivät ole niinkään osuneet lankulle, koska jos ne olisivat osuneet lankulle, niin eihän tietenkään tällaisen talouskasvun oloissa olisi näin heikkoa työllisyyskehitystä nähty, ja hallitus olisi lähempänä saavuttaa tämän oman työllisyystavoitteensa, joka muuten viimeisimpien ennusteiden mukaan on vasta 20&nbsp;000 lisätyöllistä näillä toimenpiteillä vuonna 30. Piti saada 100&nbsp;000 vuoteen 27 mennessä, ja uusimpien ministeriön arvioiden mukaanhan tämä taso on plus 20&nbsp;000 vuonna 2030. Siltä osin ainakaan nämä työllisyystoimenpiteet eivät varmaan ole onnistuneet.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta sitten mitä tulee, arvoisa puhemies, tähän julkisen talouden kokonaisuuteen, niin tämän lisätalousarvion osaltahan tehdään monia tarpeellisia panostuksia, mutta vastapainona tietenkin on se, että julkisen talouden tunnuslukuja joudutaan korjaamaan entisestään alaspäin. Velanotto tämänkin vuoden osalta pahenee edelleen ennustetusta, ja tietenkin se herättää kysymyksen, millä tavalla myös näissä kansantalouden positiivisissa uutisissa me saisimme myös tähän julkiseen talouteen hieman positiivisia uutisia, niin että tämä suunta kääntyisi. Senpä takia, arvoisa puhemies, onkin ensisijaista, ettei ainakaan omilla toimenpiteillä pyritä heikentämään julkisen talouden kestävyyttä entisestään. Tässähän hallituksen helpoin tehtävä olisi vain todeta, että tätä suunniteltua yhteisöveron alennusta ei tuoda eduskuntaan käsittelyyn, ja sillä parannettaisiin liki miljardilla julkisen talouden tasapainoa jo heti ensi vuonna, jolloin myöskään perintö ei olisi niin karmea kuin miltä se nyt näyttää.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toinen huomio, mikä tästä lisätalousarviosta puuttuu, on se, että nyt kun jälleen ihan perustellusti lisätään panostuksia nuorten työllisyyden edistämiseen ja pitkäaikaistyöttömyyden vähentämiseen, niin täytyisi huomioida, että ne rahat myös menevät käyttöön, koska nythän se suurempi ongelma on ollut siinä, että edelleenkään ne nykyisetkään panostukset eivät ole menneet käyttöön. Rahojahan on säästössä huomattavasti enemmän kuin niitä on myönnetty.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Senpä takia, arvoisa puhemies, teen vastalauseemme mukaiset esitykset ja ehdotan, että käsittelyn pohjaksi otetaan sosiaalidemokraattien vastalause tähän lisätalousarvioon ja laitetaan nämä asiat kuntoon. — Kiitoksia.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Viitanen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.29\">10.29&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Pia&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.29Viitanen\">Viitanen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Kannatan edustaja Räsäsen tekemiä tärkeitä ja hyviä ehdotuksia. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Puhemies! Todellakin kun puhumme nyt tästä julkisesta taloudesta ja tästä lisätalousarviosta, mistä parhaillaan keskustelemme, on syytä huomata, että valitettavasti tässäkin se velkavuori kasvaa. Liki 300 miljoonaa velkavuorta lisää tämä hallitus lapioi, ja ei se tulostaulu tässä suhteessa erityisen hyvältä näytä. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Puhemies! Toinen asia, mihin edustaja Räsänen tuossa aiemmin viittasi, oli tämä työllisyyskehitys. Meillä on valitettavan huonot työttömyyslukemat, Euroopan surkeiten hoidettu työllisyys, ja myös se maksaa. Se maksaa muutaman miljardin, kun emme ole päässeet niihin tavoitteisiin, mitä hallitus asetti lisätyöllisyyden puolesta. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Puhemies! Tämä tulostaulu on siis heikko, ja sen lisäksi kiinnitän huomiota siihen, että hallituksen talouspolitiikka kokonaisuudessaan on ollut varsin epäreilua. Tyyppiesimerkki on tässä tämä yhteisöveron alennus, johon hallitus yhtäkkiä löysi rahaa liki miljardin. Tämä alennus on muuten siinäkin mielessä aika pelottava, että se vaarantaa meidän pysymisemme tässä nettomenopolulla, mutta se on myös epäreilu siinä suhteessa, että hallituksella kyllä riitti rahaa liki miljardi tähän suuryritysten veronkevennykseen. Se auttaa suuryrityksiä ja niiden osingonsaajia, ja samaan aikaan samassa kehysriihessä hallitus teki asiakasmaksukorotuksia, jotka iskevät eniten työttömiin, sairaisiin ja vanhuksiin. Eli tällaisella maksumoukarilla nyt sitten näitä ihmisiä rangaistaan hallituksen huonosta taloudenpidosta, huonoista työllisyysluvuista ja siitä, että hallituksella on kuitenkin rahaa sitten liki miljardi näihin suuryritysten veronkevennyksiin. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta, puhemies, sanon, että onhan tässä lisätalousarviossa muutamia ihan kannatettaviakin asioita ja tärkeitä asioita. Sitä en kiistä. Yksi sellainen, minkä haluan tässä puheenvuorossa mainita, on esimerkiksi tämä korjausrakentamisen tukeminen. Se on toivottavaa, että näin tapahtuu, mutta SDP esitti sitä jo kolme vuotta sitten. Olimme sitä mieltä, kun näimme, että rakennusteollisuus on erittäin huonossa tilassa, että sinne tarvittaisiin hieman apuja ja myös ihmisten kodit tarvitsevat korjausta, ja esitimme korjausavustuksia, ja mitä silloin hallituspuolueet tekivät? Jyrkästi vastustivat näitä SDP:n esityksiä ja kertoivat, että ei niitä nyt tarvita ja niistä ei ole mitään hyötyä ja SDP:llä siis ei ole mitään vaihtoehtoja. Sinänsä, puhemies, on tietenkin positiivista, että nyt sitten tähän SDP:n esitykseen on tartuttu. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toinen hyvä puoli on se, että hallitus yrittää iskeä myös nuorisotyöttömyyteen ja sinne budjetoi lisää rahaa, mutta kuten edustaja Räsänen tuossa edellä mainitsi, meidän ongelmamme nyt on se, että nämä toimet eivät ole olleet tehokkaita, ja meidän täytyy kyllä hanakammin tehdä työtä nuorisotyöttömyyden poistamiseksi. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Näillä sanoilla, arvoisa puhemies, siis kannatan edustaja Räsäsen esityksiä. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Hyrkkö, olkaa hyvä. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.32\">10.32&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Saara&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.32Hyrkkö\">Hyrkkö&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vihr&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hallituksen talouspolitiikan epäonnistumisesta ei ole epäselvyyttä. Jokainen hallituksen omista taloustavoitteista on karannut käsistä, velkavuori on kasvanut, ja tämä lisätalousarvio on riittämätön vastaus käsillä oleviin haasteisiin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Suomea vaivaa historiallisen korkea työttömyys, jonka vaikutukset nuoriin ovat erityisen raskauttavia. Nuorten tulevaisuususkon murentumiseen ja työllisyysnäkymien heikkenemiseen on puututtava nopeasti ja määrätietoisesti. Toki kiitän hallitusta siitä, että tässäkin lisätalousarviossa on yritystä tämän asian tiimoilta. Pahoin pelkään, että nämä esitetyt toimet eivät kuitenkaan riitä. Vihreät ovat esittäneet lukuisia eri keinoja nuorten työllisyyden vahvistamiseksi, mukaan lukien nuorten työllistämisvelvoitteen lisääminen valtion maksamiin yritystukiin ja nuorten palkkaaminen Metsähallituksen luontopalveluihin, kuten vuosina 2010—2013 toimittiin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tässä lisätalousarviossa esitetään määrärahoja myös maahanmuuton kiristyksiin. Tämä ei ole suinkaan ensimmäinen kerta tällä hallituskaudella. Kokonaisuudessaan hallituksen maahanmuuttopolitiikan vaikutuksia on mahdotonta arvioida, mutta on selvää, että riskejä se kasvattaa: riskiä siitä, että ihmisten kotoutuminen vaikeutuu, ja riskiä siitä, että Suomi ei onnistu tunnistamaan kaikkia, jotka olisivat oikeutettuja kansainväliseen suojeluun. Erityisen ongelmallista on, että nämä muutokset voivat heikentää haavoittuvassa asemassa olevien henkilöiden, kuten lasten, ihmiskaupan uhrien, väkivallan uhrien, vammaisten henkilöiden ja vakavasti sairaiden henkilöiden, asemaa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Lisäksi lisätalousarviossa kasvatetaan Metsähallituksen tuottotavoitetta, mikä lisää riskiä hakkuiden kasvuun, [Pauli Kiurun välihuuto] ja siirretään sama raha maatalouden fossiilitukiin. Maatalouden kannattavuuskriisi on aito ja vakava ongelma, mutta valtion ei pidä omilla päätöksillään vahvistaa maatalouden fossiiliriippuvuutta ja heikentää kannustimia siirtyä kohti vähäpäästöisempiä ratkaisuja. Samasta syystä suhtaudumme kriittisesti myös turpeen tukipaketteihin ja korvaisimme ne turvealan reilua siirtymää tukevilla toimilla.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Viimeisenä yksityiskohtana tästä lisätalousarviosta nostan esiin lastenkulttuurin. Taidetestaajat-ohjelma on seitsemän toimintavuotensa aikana mahdollistanut taidelähtöisen, yhteisöllisen ja yhteiskunnallisen kokemuksen käytännössä jokaiselle kahdeksasluokkalaiselle Hangosta Utsjoelle. Taidetestaajat-toiminta on kytkenyt toisiinsa taide- ja kulttuurikasvatusta, eri oppiaineita yhdistävää oppimista, yhteiskunnallista vaikuttamista ja kokemuksellisuutta, ja me esitämme, että valtio turvaisi lasten ja nuorten kulttuurikokemusten jatkon.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Esitän, että lisätalousarvio hyväksytään vastalauseen 3 mukaisena eli käsittelyn pohjaksi otetaan vihreiden vastalause.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Lohi, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.35\">10.35&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Markus&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.35Lohi\">Lohi&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hetki sitten esittelin valtiovarainvaliokunnan mietinnön tuolta toiselta puhujakorokkeelta ja nyt ajattelin kertoa, mitä mieltä keskusta tästä hallituksen esityksestä on.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Edustaja Heinonen täällä edellä kertoi, että meillä on hyviä uutisia Suomen taloudesta, siis kansantaloudesta. Tämä pitää paikkansa, ja me toivomme, että ne vahvistuvat, kun tämä vuosi etenee. Iloitsemme kaikki siitä, jos Suomen talous saadaan voimakkaampaan kasvuun kuin millaista se viime vuosina on ollut. Se hyödyttää kyllä kaikkia. Valitettavasti työllisyystilannetta se parantaa vasta kovalla viiveellä. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta, arvoisa puhemies, tässä hallituksen esityksessä, jota me nyt käsittelemme, ei ole kysymys Suomen kansantaloudesta tai viennistä. Tässä on kysymys julkisesta taloudesta, siis valtiontaloudesta, siitä, mihin valtio käyttää rahat, ja tällä hetkellä juuri siitä, mitä hallitus tuo eduskuntaan lisätalousarviona kesken vuoden. Tästä julkisesta taloudesta eli valtiontaloudesta meillä ei valitettavasti ole mitään myönteisiä uutisia, vaan tämäkin hallituksen esitys on esitys, jossa julkinen talous velkaantuu entistä voimakkaammin ja entistä nopeammin. On siis kaksi eri asiaa: Suomen talous, jossa on myönteisiä merkkejä, ja sitten on tämä julkinen talous, jossa on vain huonoja uutisia, valitettavasti.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kenen tehtävä on huolehtia julkisesta taloudesta? Onko se opposition tehtävä? Ei. Onko tavallisten suomalaisten kansalaisten tehtävä huolehtia, että julkinen talous saadaan kuntoon? Ei ole. Heidän tehtävänsä on rakentaa onnellista elämää Suomessa, ja me toivomme, että kaikille se olisi mahdollista. Onko suomalaisten yritysten tehtävä huolehtia siitä, että julkinen talous laitetaan kuntoon? Ei ole. Yritysten tehtävä on luoda tänne kannattavaa liiketoimintaa — kasvaa, investoida ja menestyä — ja silloin me kaikki hyödymme siitä. Kenen tehtävä se sitten on? Kulloinkin istuvan hallituksen tehtävä on huolehtia, että julkisen talouden kehitys on myönteistä ja se menisi oikeaan suuntaan ja velkaantuminen ei kiihtyisi vaan mieluummin hidastuisi.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mitä tekee tämä hallitus? Se tuo tänne esityksen, jossa velkaantuminen kiihtyy, ei siis hillitse velkaantumista. Ja missä tilanteessa? Tilanteessa, jossa Suomi on joutunut tarkkailuluokalle, ja silloin kun ollaan tarkkailuluokalla, se tarkoittaa, että ollaan käyttäydytty sopimattomasti talouden suhteen. Silloin jos ollaan tarkkailuluokalla, niin kannattaisi lopettaa tämmöinen ja alkaa käyttäytymään kiltisti eli toimimaan taloudessa viisaasti ja toimimaan niitten sääntöjen mukaisesti, joita on tarkkailuluokallekin annettu. [Tuomas Kettunen: Edustaja Heinonen, kuunnelkaa!] &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">No, mitä valtiovarainministeriö toteaa nytten tässäkin yhteydessä? ”Valtiovarainministeriön ja Suomen Pankin tämänhetkisten arvioiden perusteella nettomenopolulla pysyminen tarkoittaisi tämänhetkisten tietojen valossa noin 600 miljoonan euron lisäsopeutuksen tarvetta vuodelle 27.” Vuodelle 2028 korjausliikkeen tarve on peräti 2,7 miljardia euroa. [Pia Viitasen välihuuto]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toimiiko hallitus näin? Ei. Se toi tänne julkisen talouden suunnitelman, jossa ei ole minkäänlaisia velkaantumisen hillitsemisiä, ei minkäänlaisia sääntöjen noudattamisia. Me ymmärrämme, että puolustusmenojen kasvu on kovaa. Tässäkin lisätalousarvioesityksessä esitetään tilausvaltuuksia tuleville vuosille yli miljardilla, mutta ne maksetaan ensi vaalikaudella. Samalla kun hallitus velkaantuu ennätystahtia, se kirjoittaa tulevalle hallitukselle ennätyssuuren laskun, nuolee postimerkin ja laittaa postiin sen laskun [Timo Heinonen: Pitäisikö jättää tilaamatta?] ja sitten haukkuu edellisen hallituksen siihen perään vielä, että kun te ette huolehtineet taloudesta, ja itse velkaantuu ennätystahtia. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nyt pitäisi lähteä hoitamaan taloutta viisaasti ja toimia terveen talouden periaatteiden mukaisesti. Totta kai puolustus on tärkeää. Me olemme kaikki sitoutuneet tähän Nato-polkuun — tai ei nyt ihan kaikki mutta lähes kaikki täällä eduskunnassa — mutta silloin, jos joudutaan sinne satsaamaan, on pakko lähteä priorisoimaan menoja ja katsottava, mistä voidaan vähentää niitä menoja. Tai onko järkevää tehdä, niin kuin hallitus esittää, yhteisöveron alennus, yli 830 miljoonaa tappiota valtiontaloudelle, ja hallitus omassa esityksessään toteaa, että edes pitkällä tähtäimellä se ei ole kasvutoimi, se ei maksa edes 50-prosenttisesti itseään takaisin? Eihän tämmöisiä pitäisi tehdä tässä tilanteessa, eli laitetaan verot valtion maksettavaksi. Ei mitään järkeä, arvoisa puhemies. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Sen takia keskusta esittää vastalauseessaan lausumaehdotusta, jossa edellytetään, että viimeistään syksyn 2026 budjettiriihessä hallituksen on tuotava eduskuntaan esitykset uusista lisäsopeutustoimista vuosille 26 ja 27. [Puhemies koputtaa] Esitänkin, että käsittelyn pohjaksi otetaan keskustan vastalauseen mukainen esitys. Teen siis sen mukaisen muutosesityksen.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Lyly, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.40\">10.40&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Lauri&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.40Lyly\">Lyly&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! On erinomainen asia, että taloudessa on pieniä viriämisen merkkejä. Talouslukuja ja kasvulukuja voidaan hieman korottaa, ja se on hyvä asia, mutta valitettavasti nämä luvut eivät näy meillä vielä työllisyysluvuissa. Ne tulevat varmaan viiveellä jossain kohtaa, vaikka tässä hetkessä näyttää siltä, että koko ajan työttömyys on jokainen kuukausi vuoden takaiseen vastaavaan mennyt kaikilla mittareilla huonompaan suuntaan. Siinä kokonaistyöttömyys on kasvanut, pitkäaikaistyöttömyys on kasvanut, nuorisotyöttömyys on kasvanut, ja palveluissa on entistä vähemmän ihmisiä. Tämä on se huolestuttava piirre, että meiltä puuttuu aktiivinen työllisyyspolitiikka.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nyt tässä lisätalousarviossa tulee nuorten työllistämiseen 20 miljoonaa, mikä on hyvä asia nuorisosetelin osalta, ja muitakin aktivointitoimia lisätään, mutta ongelma on, että ne tulevat aika myöhään. Täällä eduskunnassa kuultiin noin viikko sitten ministeriltä laskelma: noin 500 nuorisoseteliä oli mennyt alkuvuoden aikana, puolen vuoden aikana, ja meillä kohderyhmä on 76&nbsp;000 alle 30-vuotiasta työtöntä, joihin tämä seteli voisi kohdistua — 500 ja 76&nbsp;000. Tässä mielessä se nuorisoseteli on palkkatuettua työtä, ja se olisi ehkä ollut parempi heti alun perin laittaa palkkatuetuksi työksi ja sillä tavalla saada se nopeammin käyntiin, ja se olisi ollut siellä käytössä, kun aktivointiasteet ovat tosi alhaalla.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Se myös kertoo näissä työttömyys- ja työllisyystilanteissa, että meidän avoimien työpaikkojen määrä on edelleen ollut huonompi kuin on ollut aikaisempi, vuosi sitten oleva tilanne. Me ei olla sielläkään vielä nähty merkkejä. Minulle käänne tapahtuu siinä, kun työttömyystilanteessa mennään parempiin lukuihin kuin viime vuonna vastaavaan aikaan, ja sitten voidaan sanoa, että jotain käännettä on tapahtunut. Niin kauan tässä ollaan aika huolestuttavassa tilanteessa. Työttömyys on meille muutenkin kansantaloudellisesti tosi iso asia, inhimillisesti jokaisen työttömän osalta, mutta meidän työttömyysturvamenot ovat noin neljä miljardia euroa vuodessa, eli puhutaan valtavasta summasta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Näistä hallituksen talouspolitiikan kolmesta isosta tavoitteesta — talouskasvun aikaansaamisesta, velan taittamisesta, alijäämän alentamisesta siihen yhteen prosenttiin — ollaan vielä tosi kaukana, niistä alkuperäisistä tavoitteista. Alijäämä on noin neljän prosentin luokkaa. Meillä on 13&nbsp;400 miljoonaa valtion budjetin alijäämä, ja nämä lisäbudjetit, ensimmäinen ja tämä toinen lisäbudjetti, ovat kasvattaneet velanottoa 1,6 miljardilla eurolla. Eli vielä tässä julkisessa taloudessa, niin kuin edustaja Lohi tässä hyvin toi esiin, ei näy näitä hyviä lukuja. Toivoisin, että ne pystytään näyttämään.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Sitten nämä työllisyystoimet: Nyt kotitalousvähennyksen kasvattaminenkin — tavallaan se oli 2&nbsp;350 euroa, hallitus pudotti sen 1&nbsp;600:aan ja nyt palautti 2&nbsp;100:aan — on ollut semmoinen toimenpide, joka tulee myöhään. Ja miksi yleensä tiputettiin, koska rakennusalan työttömyyteen sillä voidaan jonkin verran vaikuttaa, koska 75 prosenttia kotitalousvähennyksistä menee rakentamiseen ja kunnossapitoon liittyviin vähennyksiin? Eli tässä mielessä toimet ovat aika pieniä siihen nähden, mikä ongelma on, ja tarvittaisiin enemmän aktiivista politiikkaa työllistämisen edistämiseksi ja työllisyyden parantamiseksi. Nyt ne toimet ovat tällä kertaa puuttuneet. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Sarkkinen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.45\">10.45&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Hanna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.45Sarkkinen\">Sarkkinen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vas&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Orpon hallitus on epäonnistunut keskeisissä talouspolitiikan tavoitteissaan. Pienituloisuus, eriarvoisuus, asunnottomuus ja työttömyys ovat kasvaneet tällä hallituskaudella. Suomen työttömyystilanne on EU:n huonoin, ja myös työllisyysaste on heikentynyt. Samaan aikaan julkisen talouden velkasuhde on kasvanut, osittain koska hallituksen harjoittama finanssipolitiikka on pitkittänyt talouden matalasuhdannetta heikentämällä kotimarkkinakysyntää. Hallitus on myös rapauttanut julkisen talouden tulopohjaa, syventänyt alijäämää ja lisännyt velkaantumista keventämällä suurituloisten yritysten verotusta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Vaikka taloudessa on näkymässä myönteisiä merkkejä, kasvu ei ole vielä näkynyt työllisyydessä tai julkisen talouden tilassa, päinvastoin. Hallitus on ajanut erityisesti pienituloiset kotitaloudet ahtaalle leikkauspolitiikallaan. Toisaalta hallituksen toimet Euroopan pahimpaan työttömyyskriisiin vastaamiseksi ovat riittämättömät.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Pitkäaikaistyöttömyys on Suomen suurin työvoimapoliittinen ongelma. Sitä ei ratkaista työttömyysturvaa leikkaamalla tai sen ehtoja kiristämällä vaan henkilökohtaisella ohjauksella, tuella, työllisyyspalveluilla, riittävillä sosiaali- ja terveydenhuollon palveluilla ja tarvittaessa koulutuksella. Työttömille pitäisi säätää työtakuu eli taata oikeus palkkatuettuun työpaikkaan 12 kuukauden työttömyyden jälkeen. Työttömien palveluprosessiin liittyvästä yksityiskohtaisesta sääntelystä tulisi luopua ja resurssit kohdistaa aidosti yksilöiden tarpeita vastaaviin palveluihin. Esitämme lisätalousarvion vastalauseessamme useita työllisyystilanteeseen ja työntekijöiden oikeuksiin liittyviä lausumia.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Taidetestaajat ovat Suomen suurin kulttuurikasvatusohjelma, jonka kautta kaikki kahdeksasluokkalaiset eli noin 70&nbsp;000 nuorta ja heidän 5&nbsp;000 opettajaansa pääsevät kokemaan yhden tai kaksi taide-elämystä. Kaikilla lapsilla ja nuorilla on oikeus taiteeseen ja kulttuuriin. Mitä kauemmaksi isoista kaupungeista mennään, sitä vähemmän ammattimaisia kulttuuripalveluita kuitenkaan on tarjolla. Taidetestaajat-ohjelman kautta kokonaiselle ikäluokalle ympäri Suomea tarjotaan pääsyliput ja kuljetukset esimerkiksi oopperaan, teatteriin, sirkukseen, konserttiin tai taidenäyttelyyn. Taidetestaajien kautta voidaan siis puuttua moneen kulttuurin ja taiteen saavutettavuuteen liittyvään tekijään ja vähentää eriarvoistumista. Taidetestaajat-toiminta on kuitenkin vaarassa loppua, joten esitämme lisämäärärahaa toiminnan jatkon turvaamiseksi.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Valtion metsät ovat avainasemassa metsäluonnon monimuotoisuuskadon pysäyttämisen kannalta. Hallitus aikoo nyt tulouttaa Metsähallituksen liiketoiminnasta vielä kymmenen miljoonaa euroa lisää jo aiemman tuloutuksen päälle, mikä on liian paljon kestävän metsänhoidon näkökulmasta. Valtion omistamia metsiä tulisi hoitaa luonnon monimuotoisuutta ja hiilinielun elvyttämistä huomioivalla tavalla, minkä vuoksi Metsähallituksen tuloutustavoitetta tulee kohtuullistaa. Tämän vuoksi ehdotamme, että lisätalousarviosta poistetaan Metsähallituksen kymmenen miljoonan euron lisätuloutus. Lisäksi ehdotamme, että hallituksen kehysriihessä päättämään turvepakettiin varattu kymmenen miljoonan euron lisäys poistetaan lisätalousarviosta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Teen siis vastalauseen 4 mukaiset muutosehdotukset ja lausumaehdotukset, eli esitän, että käsittelyn pohjaksi otetaan vasemmistoliiton vastalause.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Jokelainen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.49\">10.49&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Jessi&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.49Jokelainen\">Jokelainen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vas&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kannatan edustaja Sarkkisen tekemää esitystä.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Hoskonen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.49\">10.49&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Hannu&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.49Hoskonen\">Hoskonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Kannatan lämpimästi kaikkia edustaja Lohen äsken tekemiä esityksiä.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Karlsson, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.49\">10.49&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Anette&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.49Karlsson\">Karlsson&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitos, arvoisa puhemies, ärade talman! Vuoden toinen lisätalousarvio sisältää tarpeellisia panostuksia nuorten työllistymiseen, pitkäaikaistyöttömien osaamiseen sekä turvallisuuden vahvistamiseen, ja on hyvä, että näihin haasteisiin nyt haetaan ratkaisuja. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Samalla on todettava, että tilanne työmarkkinoilla on vakava. Alle 25-vuotiaita työttömiä työnhakijoita on jo yli 40&nbsp;000. Jokaisen luvun takana on nuori, joka yrittää löytää paikkansa työelämässä ja rakentaa uskoa omaan tulevaisuuteen. Siksi on perusteltua kysyä, miksi näihin ongelmiin tartutaan vasta nyt, kun työttömyys on päässyt kasvamaan näin korkeaksi. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Siksi tarvitsemme nykyisiä toimia vahvemman kokonaisuuden, jossa panostetaan työllistymiseen, koulutukseen ja osaamisen kehittämiseen. Nuoren ei pitäisi joutua lähettämään kymmeniä hakemuksia ilman yhtäkään mahdollisuutta näyttää osaamistaan. Mitä pidempään nuori jää työn ja koulutuksen ulkopuolelle, sitä suuremmaksi kasvaa riski ongelmien kasaantumisesta. Siksi nuorten työllisyyteen on panostettava nyt, kun voimme vielä avata ovia tulevaisuuteen, eikä vasta sitten, kun niiden sulkeutuminen on tullut yhteiskunnalle paljon kalliimmaksi. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kannatan Joona Räsäsen tekemiä ehdotuksia. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Hopsu, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.50\">10.50&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Inka&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.50Hopsu\">Hopsu&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vihr&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Teen lisätalousarvioaloitteen 7 Taidetestaajat-toiminnan jatkon turvaamisesta. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">65&nbsp;000 kahdeksasluokkalaista on saanut vuodesta 2017 lähtien mahdollisuuden vierailla kulttuuriesityksissä. Toiminta on tavoittanut lähes koko ikäluokan. Taidetestaajat-toiminta on ollut monelle nuorelle ensimmäinen mahdollisuus tutustua taiteen maailmaan. Tällaista vastaavaa toimintaa on järjestetty hyvin monessa maailman maassa, ja Pohjoismaista esimerkiksi Ruotsissa usealla ikäluokalla on mahdollisuus vastaaviin taidevierailuihin. Ennen lisätalousarvion valmistelua vaadimme opposition kansanedustajien Razmyarin, Siposen ja Lohikosken, eri puolueiden edustajien, kesken tämän rahoituksen jatkon turvaamista. Taustalla on säätiörahoitus, jonka on ilmoitettu päättyvän, ja se tieto on ollut ajoissa käsittelyssä, mutta nyt neljä miljoonaa rahoituksen jatkosta puuttuu, ja tämän vuoksi on ajateltu, että tämä esitys on hyvä tehdä erillisenä esityksenä, jotta kaikki puolueet pystyvät ottamaan kantaa eduskunnassa siihen, haluammeko Taidetestaajat-toiminnan jatkon turvata. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. Totean, että tämä esitys tulee tehdä yksityiskohtaisessa käsittelyssä, ei tässä yhteydessä. — Edustaja Krista Mikkonen, olkaa hyvä. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.52\">10.52&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Krista&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.52Mikkonen\">Mikkonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vihr&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kannatan tuossa aiemmin edustaja Saara Hyrkön esittelemää vastalausetta numero 3 ja kannatan sitä, että lisätalousarvio hyväksytään tuon vastalauseen mukaisena. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Kettunen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.52\">10.52&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Tuomas&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.52Kettunen\">Kettunen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kunnioitettu herra puhemies! Näin sitä kesälomille pikkuhiljaa siirrytään, tai korjaan: ei lomille, vaan istuntotauolle eduskuntatyöstä.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta totean tähän puheenvuoroni alkuun: Edustaja Heinonen tässä keskustelussa toi esille näitä hyviä talousuutisia, kuinka talous on kasvanut. Me yhdymme näihin hyviin uutisiin, ja olen tyytyväinen, että edustaja Heinonen omassa puheenvuorossaan myös toi tämän huolen siitä, että meillä työttömyys kuitenkin on vielä aika korkealla tässä maassa, varsinkin nuorisotyöttömyys ja pitkäaikaistyöttömyys.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toitte esille omassa puheenvuorossanne, edustaja Heinonen, että rakennatte itsevarmempaa Suomea, mutta toivon, että kun totesitte ”ihan jokaiselle suomalaiselle”, siinä otetaan myös Itä-Suomi huomioon.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Totesitte myös vakauden ja luottamuksen arvoina teidän omassa puheenvuorossanne. Totean näin, että sitä vakautta myös syysistuntokaudella ja tulevina vuosina harjoitetaan niin, että sitä vakautta syntyy talouspolitiikan suunnalla, eritoten veropolitiikassa. Kaivosmineraaliveron nostaminen nimittäin on aiheuttanut tuolla pohjoisessa Suomessa haasteita kaivosveron osalta kaivosteollisuuden suuntaan.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta, puhemies, kun tosiaan aurinko paistaa myös tänne istuntosaliin [Ben Zyskowicz: Eikös se ole kattolamppu?] ja me lähdemme pikkuhiljaa tuonne kesälaitumille, istuntotauko alkaa, niin haluan edustaja Heinoselle toivottaa oikein hyvää ja aurinkoista kesää. Muistakaa myös levähtää, koska syysistuntokausi tulee olemaan politiikan rintamalla hyvin vauhdikas. Me täältä opposition suunnasta nimittäin tulemme teitä kirittämään ja haastamaan teidän talouspolitiikkanne osa-aluetta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Herra puhemies! Toivotan myös teille hyvää, aurinkoista ja leppoisaa kesää, ja totta kai kaikille edustajakollegoille. — Kiitoksia. [Eduskunnasta: Kiitos, samoin!]&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. Näin myös edustaja Kettuselle. —Edustaja Heinonen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"10.54\">10.54&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Timo&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"10.54Heinonen\">Heinonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kun edustaja Kettunen puhui niin kovin kauniisti, niin haluan kiittää häntä kauniista sanoista ja toivottaa oikein hyvää kesää myös edustaja Kettuselle, kaikille kollegoille, puhemiehelle, koko eduskunnan väelle ja kaikille suomalaisille. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia, näin myös teille.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv id=\"PaatoksentekoToimenpide\" class=\"PaatoksentekoToimenpide\">\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cp class=\"edk-KappaleKooste\">Yleiskeskustelu päättyi.&nbsp;\u003C/p>\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Muutosehdotuksia koskevat äänestykset tapahtuvat tässä täysistunnossa tauon jälkeen. Istunto ja asian käsittely keskeytetään ja istuntoa jatketaan kello 11.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cp class=\"edk-KappaleKooste\">Täysistunto keskeytettiin kello 10.55.&nbsp;\u003C/p>\n     \u003Cdiv class=\"Palstaviiva\">\u003C/div>\n     \u003Cp class=\"edk-KappaleKooste\">Täysistuntoa jatkettiin kello 11.00.&nbsp;\u003C/p>\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Nyt jatketaan kello 10.55 keskeytettyä istuntoa ja päiväjärjestyksen 2. asian käsittelyä.&nbsp;\u003C/p>\n      \u003Cp class=\"edk-KappaleKooste\">Nyt ryhdytään lisätalousarvioehdotuksen yksityiskohtaiseen käsittelyyn. Ensin äänestetään lisätalousarvioaloitteisiin perustuvista muutosehdotuksista ja tämän jälkeen äänestetään jokaisesta vastalauseesta erikseen kokonaisuutena mietintöä vastaan.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cp class=\"edk-KappaleKooste\">Äänestysjärjestys hyväksyttiin.&nbsp;\u003C/p>\n     \u003Cp class=\"edk-KappaleKooste\">Tehtiin seuraava lisätalousarviota koskeva, hyväksytyn menettelytavan mukaisesti keskuskansliaan kirjallisena jätetty, edustajille monistettuna ja numeroituna jaettu ehdotus:&nbsp;\u003C/p>\n     \u003Cp class=\"edk-KappaleKooste\">1. Inka Hopsu (vihr) Krista Mikkosen (vihr) kannattamana 29.80.50: Lisätään 4 000 000 euroa Taidetestaajat-toimintaan. (LTA 7)&nbsp;\u003C/p>\n     \u003Cdiv class=\"AanestysKappaleKooste\">\n      Mietintö ”jaa”, Inka Hopsun ehdotus ”ei”. \u003Cspan class=\"AanestysTulos\"> \n       \u003Cdiv class=\"AanestysTulos\">\n        \u003Cdiv class=\"AanestysTulosTeksti\">Äänestyksen tulos: jaa 112, ei 58; poissa 29\u003C/div>\n        \u003Cdiv class=\"AanestysViite\">\n         \u003Cdiv class=\"AanestysViiteTeksti\">\n          \u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/asian-aanestykset/HE%20102%2F2026%20vp?id=1%2F71%2F2026\">(äänestys 1). \u003C/a>\u003C/span>\n         \u003C/div>\n        \u003C/div>\n       \u003C/div> \n      \u003C/span>Eduskunta hyväksyi mietinnön.&nbsp;\n     \u003C/div>\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Seuraavaksi käsitellään vastalauseiden 1—4 mukaiset muutosehdotukset. Keskustelussa on edustaja Joona Räsänen edustaja Pia Viitasen kannattamana tehnyt vastalauseen 1 mukaiset muutosehdotukset, edustaja Markus Lohi edustaja Hannu Hoskosen kannattamana vastalauseen 2 mukaiset muutosehdotukset, edustaja Saara Hyrkkö edustaja Krista Mikkosen kannattamana vastalauseen 3 mukaiset muutosehdotukset ja edustaja Hanna Sarkkinen edustaja Jessi Jokelaisen kannattamana vastalauseen 4 mukaiset muutosehdotukset.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cp class=\"edk-KappaleKooste\">Tulkki esitti selonteon ruotsiksi.&nbsp;\u003C/p>\n     \u003Cp class=\"edk-KappaleKooste\">Selonteko hyväksyttiin.&nbsp;\u003C/p>\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Jokaisesta vastalauseesta äänestetään erikseen kokonaisuutena mietintöä vastaan.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cp class=\"edk-KappaleKooste\">Äänestysjärjestys hyväksyttiin.&nbsp;\u003C/p>\n     \u003Cdiv class=\"AanestysKappaleKooste\">\n      Mietintö ”jaa”, Joona Räsäsen ehdotukset ”ei”. \u003Cspan class=\"AanestysTulos\"> \n       \u003Cdiv class=\"AanestysTulos\">\n        \u003Cdiv class=\"AanestysTulosTeksti\">Äänestyksen tulos: jaa 121, ei 29, tyhjiä 23; poissa 26\u003C/div>\n        \u003Cdiv class=\"AanestysViite\">\n         \u003Cdiv class=\"AanestysViiteTeksti\">\n          \u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/asian-aanestykset/HE%20102%2F2026%20vp?id=2%2F71%2F2026\">(äänestys 2). \u003C/a>\u003C/span>\n         \u003C/div>\n        \u003C/div>\n       \u003C/div> \n      \u003C/span>Eduskunta hyväksyi mietinnön.&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"AanestysKappaleKooste\">\n      Mietintö ”jaa”, Markus Lohen ehdotukset ”ei”. \u003Cspan class=\"AanestysTulos\"> \n       \u003Cdiv class=\"AanestysTulos\">\n        \u003Cdiv class=\"AanestysTulosTeksti\">Äänestyksen tulos: jaa 100, ei 22, tyhjiä 52; poissa 25\u003C/div>\n        \u003Cdiv class=\"AanestysViite\">\n         \u003Cdiv class=\"AanestysViiteTeksti\">\n          \u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/asian-aanestykset/HE%20102%2F2026%20vp?id=3%2F71%2F2026\">(äänestys 3). \u003C/a>\u003C/span>\n         \u003C/div>\n        \u003C/div>\n       \u003C/div> \n      \u003C/span>Eduskunta hyväksyi mietinnön.&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"AanestysKappaleKooste\">\n      Mietintö ”jaa”, Saara Hyrkön ehdotukset ”ei”. \u003Cspan class=\"AanestysTulos\"> \n       \u003Cdiv class=\"AanestysTulos\">\n        \u003Cdiv class=\"AanestysTulosTeksti\">Äänestyksen tulos: jaa 122, ei 13, tyhjiä 39; poissa 25\u003C/div>\n        \u003Cdiv class=\"AanestysViite\">\n         \u003Cdiv class=\"AanestysViiteTeksti\">\n          \u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/asian-aanestykset/HE%20102%2F2026%20vp?id=4%2F71%2F2026\">(äänestys 4). \u003C/a>\u003C/span>\n         \u003C/div>\n        \u003C/div>\n       \u003C/div> \n      \u003C/span>Eduskunta hyväksyi mietinnön.&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"AanestysKappaleKooste\">\n      Mietintö ”jaa”, Hanna Sarkkisen ehdotukset ”ei”. \u003Cspan class=\"AanestysTulos\"> \n       \u003Cdiv class=\"AanestysTulos\">\n        \u003Cdiv class=\"AanestysTulosTeksti\">Äänestyksen tulos: jaa 122, ei 10, tyhjiä 42; poissa 25\u003C/div>\n        \u003Cdiv class=\"AanestysViite\">\n         \u003Cdiv class=\"AanestysViiteTeksti\">\n          \u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/asian-aanestykset/HE%20102%2F2026%20vp?id=5%2F71%2F2026\">(äänestys 5). \u003C/a>\u003C/span>\n         \u003C/div>\n        \u003C/div>\n       \u003C/div> \n      \u003C/span>Eduskunta hyväksyi mietinnön.&nbsp;\n     \u003C/div>\n     \u003Cp class=\"edk-KappaleKooste\">Eduskunta hyväksyi hallituksen esitykseen HE 102/2026 vp ja sitä täydentävään hallituksen esitykseen HE 112/2026 vp sisältyvän ehdotuksen vuoden 2026 toiseksi lisätalousarvioksi mietinnön mukaisena. Eduskunta yhtyi valiokunnan ehdotukseen lisätalousarvioaloitteiden LTA 1—8/2026 vp hylkäämisestä. Eduskunta hyväksyi valiokunnan ehdotuksen vuoden 2026 toisen lisätalousarvion soveltamisesta. Asian käsittely päättyi.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cspan class=\"edk-EduskuntaTunnus\">\u003C/span>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-37849",nav:"\u003Cnav id=\"VaskiNavi\">\n \u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Muut esitysmuodot\u003C/span>\n \u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/pdf/PTK+71/2026+2\" class=\"navilink\">Asiakirjan painoasu (PDF)\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/riksdagshandlingar/PR+71/2026+2\" class=\"navilink\">Dokumentet på svenska\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/PTK%2071%2F2026%20vp?asiakirjatyyppikoodi=PTKPS\" class=\"navilink\">Pöytäkirjan pääsivu\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cul id=\"AsiaKohtaPuheenvuorot\" class=\"navbar-nav nav t-margin\">\n  \u003Cli>\u003Ca href=\"#PuheenjohtajaRepliikki\">Puhemiehen esittely\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.06Lohi\">10.06 Markus Lohi kesk\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.12H%C3%A4nninen\">10.12 Juha Hänninen kok\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.17Heinonen\">10.17 Timo Heinonen kok\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.24R%C3%A4s%C3%A4nen\">10.24 Joona Räsänen sd\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.29Viitanen\">10.29 Pia Viitanen sd\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.32Hyrkk%C3%B6\">10.32 Saara Hyrkkö vihr\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.35Lohi\">10.35 Markus Lohi kesk\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.40Lyly\">10.40 Lauri Lyly sd\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#10.45Sarkkinen\">10.45 Hanna Sarkkinen vas\u003C/a>\u003C/l
