{name:"Evästeet",teaserText:null,url:"/fi/tietoa-sivustosta/evasteet/",selected:false,targetFrame:null,contentLink:null},{name:"Käyttöehdot",teaserText:null,url:"/fi/tietoa-sivustosta/kayttoehdot-ja-kayttosaannot/",selected:false,targetFrame:null,contentLink:null},{name:"Asiakirjajulkisuuskuvaus",teaserText:null,url:"/fi/tietoa-sivustosta/asiakirjajulkisuuskuvaus/",selected:false,targetFrame:null,contentLink:null},{name:"Saavutettavuusseloste",teaserText:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",selected:false,targetFrame:null,contentLink:null},{name:"Tietosuojaselosteet",teaserText:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",selected:false,targetFrame:null,contentLink:null},{name:"Sivukartta",teaserText:null,url:"/fi/tietoa-sivustosta/sivukartta/",selected:false,targetFrame:null,contentLink:null}]}},anchors:[],tags:null,teaserTitle:"Kansalaisuuskoe osaksi kansalaisuuslakia",teaserText:"Tällä hallituskaudella on lisätty vaatimuksia Suomen kansalaisuuden saamiseksi. Hallitus ehdottaa nyt, että kansalaisuuslakiin lisättäisiin kansalaisuuden edellytyksenä kansalaisuuskokeen läpäiseminen. Kansalaisuuskokeessa henkilö voisi osoittaa tietämyksensä suomalaisesta yhteiskunnasta kuten arvoista, lainsäädännöstä, yksilön oikeuksista ja velvollisuuksista sekä perus- ja ihmisoikeuksista. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null},featureFlags:["asiakirjojen-laaja-haku","puheenvuorojen-laaja-haku","kielivalinta","aanestyssivu","aanestysten-laaja-haku","sivujen-laaja-haku","tiedotteiden-laaja-haku"],featureFlagsEnabledByDefault:false,cookieConsent:void 0},uses:{url:1}},{type:"data",data:{content:{contentLink:{id:5850,workId:0,guidValue:"b49a7ed9-f9a3-41af-a7b8-59c60c4bb60b",providerName:null,url:"/fi/lakihankkeiden-tietopaketit/kansalaisuuskoe-osaksi-kansalaisuuslakia/",expanded:null},name:"Kansalaisuuskoe osaksi kansalaisuuslakia",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","LegislativeInitiativeInformationPackagePage"],parentLink:null,routeSegment:"kansalaisuuskoe-osaksi-kansalaisuuslakia",url:"/fi/lakihankkeiden-tietopaketit/kansalaisuuskoe-osaksi-kansalaisuuslakia/",changed:null,created:null,startPublish:"2026-03-25T08:40:41Z",stopPublish:null,saved:null,status:null,responsibleMinistries:[{id:3306,workId:0,guidValue:"9066fb69-7bba-45f6-bc9a-8fa7ba2121e7",providerName:null,url:"/fi/meta/ministeriot/sisaministerio-sm/",expanded:{contentLink:{id:3306,workId:0,guidValue:"9066fb69-7bba-45f6-bc9a-8fa7ba2121e7",providerName:null,url:"/fi/meta/ministeriot/sisaministerio-sm/",expanded:null},name:"Sisäministeriö (SM)",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","MetaDataPage"],parentLink:null,routeSegment:"sisaministerio-sm",url:"/fi/meta/ministeriot/sisaministerio-sm/",changed:null,created:null,startPublish:"2026-01-15T08:50:17Z",stopPublish:null,saved:null,status:null}}],leadParagraph:"Tällä hallituskaudella on lisätty vaatimuksia Suomen kansalaisuuden saamiseksi. Hallitus ehdottaa nyt, että kansalaisuuslakiin lisättäisiin kansalaisuuden edellytyksenä kansalaisuuskokeen läpäiseminen. Kansalaisuuskokeessa henkilö voisi osoittaa tietämyksensä suomalaisesta yhteiskunnasta kuten arvoista, lainsäädännöstä, yksilön oikeuksista ja velvollisuuksista sekä perus- ja ihmisoikeuksista. ",isActive:true,mainContentArea:[{displayOption:"",tag:null,contentLink:{id:5852,workId:0,guidValue:"e94da1ff-6ebb-4fa5-8de9-9175c780f85b",providerName:null,url:null,expanded:{contentLink:{id:5852,workId:0,guidValue:"e94da1ff-6ebb-4fa5-8de9-9175c780f85b",providerName:null,url:null,expanded:null},name:"sisältö1",language:null,existingLanguages:null,masterLanguage:null,contentType:["Block","ContentBlock"],parentLink:null,routeSegment:null,url:null,changed:null,created:null,startPublish:"2026-03-25T08:36:25Z",stopPublish:null,saved:null,status:null,body:"\u003Ch2>Johdanto\u003C/h2>\n\u003Cp>P&auml;&auml;ministeri Petteri Orpon hallituksen ohjelmaan on kirjattu, ett&auml; kansalaisuuslakia uudistetaan tiukentamalla kansalaistamisen edellytyksi&auml;. Kansalaistaminen tarkoittaa kansalaisuuden my&ouml;nt&auml;mist&auml; hakemuksesta. Sis&auml;ministeri&ouml; on valmistellut kansalaisuuslain muutoksia kolmessa eri hankkeessa vuosina 2023&ndash;2026. Uudistusten yhten&auml; tavoitteena on, ett&auml; kansalaisuuden saaminen edellytt&auml;&auml; onnistunutta kotoutumista. Ensimm&auml;inen hanke koski asumisaikaa ja toinen esimerkiksi nuhteettomuutta sek&auml; toimeentuloa.\u003C/p>\n\u003Cp>T&auml;m&auml; tietopaketti koskee viimeist&auml;, kansalaisuuskokeeseen ja yhteiskuntatietouteen keskittyv&auml;&auml; hanketta. Sis&auml;ministeri&ouml; asetti marraskuussa 2023 hankkeelle poikkihallinnollisen ty&ouml;ryhm&auml;n, jonka tuli pohtia esimerkiksi sit&auml;, miten kansalaisuuskoe voitaisiin toteuttaa. Ryhm&auml; julkaisi loppuraporttinsa helmikuussa 2025. Raportin mukaan keskeisi&auml; kansalaisuuskokeen aihealueita voisivat olla esimerkiksi perus- ja ihmisoikeudet, yhteiskuntatietous, historia, arjentaidot, tavat ja arvot, yleinen turvallisuus sek&auml; digitaidot.\u003C/p>\n\u003Cp>Sis&auml;ministeri&ouml; on valmistellut hallituksen esityst&auml; yhteisty&ouml;ss&auml; Maahanmuuttoviraston kanssa. Maahanmuuttovirastosta on tarkoitus tulla kansalaisuuskokeen vastuuviranomainen. Sis&auml;ministeri&ouml; julkaisi 19.12.2025 lausuntopyynn&ouml;n kansalaisuuslain uudistamisen kolmannesta vaiheesta: \u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/bae44b7c-83b7-4fa4-8f8f-ac00b18ed76d/LAUSUNTOPYYNTO_20251219155050.PDF\" target=\"_blank\" rel=\"noopener\">Lausuntopyynt&ouml; luonnoksesta hallituksen esitykseksi eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/a>. Lausuntopyynt&ouml;&ouml;n sis&auml;ltyi luonnos hallituksen esitykseksi: \u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/348eb0b0-fe35-4f75-b1df-7e117def5377/LAUSUNTOPYYNTO_20251219155050.PDF\" target=\"_blank\" rel=\"noopener\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/a>. Lausunnot tuli antaa viimeist&auml;&auml;n 6.2.2026.\u003C/p>\n\u003Cp>Lakimuutosten tarkoituksena on, ett&auml; Suomen kansalaisuutta hakevat ovat perehtyneet yhteiskunnan toimintatapoihin ja perusperiaatteisiin. T&auml;m&auml; puolestaan mahdollistaa aktiivisen yhteiskuntaan osallistumisen. Kansalaisuuskokeessa henkil&ouml; voisi osoittaa tiet&auml;myksens&auml; suomalaisesta yhteiskunnasta kuten arvoista, lains&auml;&auml;d&auml;nn&ouml;st&auml;, yksil&ouml;n oikeuksista ja velvollisuuksista sek&auml; perus- ja ihmisoikeuksista. Lis&auml;ksi esill&auml; voisivat olla Suomen historia ja kulttuuri, yhdenvertaisuus sek&auml; sukupuolten tasa-arvo.\u003C/p>\n\u003Cp>Maahanmuuttovirasto ei vastaisi kansalaisuuskokeen laatimisesta. Sopiva taho olisi yliopisto. Koekysymykset perustuisivat yleisesti saatavilla olevaan oppimateriaaliin. Koe toteutettaisiin s&auml;hk&ouml;isess&auml; muodossa, joten hakija voisi osoittaa digitaalista osaamistaan. Kokeen kielivaihtoehdot olisivat suomi ja ruotsi. Ylioppilastutkinnon suorittaminen voisi olla vaihtoehto kansalaisuuskokeelle.\u003C/p>\n\u003Cp>Kansalaisuuskoe ei koskisi alle 18-vuotiaita eik&auml; 65 vuotta t&auml;ytt&auml;neit&auml;. Terveydentila tai vamma voisi olla peruste vapauttaa hakija kokeen suorittamisesta, jos h&auml;n voi osoittaa, ett&auml; kyseess&auml; on merkitt&auml;v&auml; ja pitk&auml;aikainen l&auml;&auml;ketieteellinen syy. Kansalaisuuskoe ei koskisi my&ouml;sk&auml;&auml;n henkil&ouml;it&auml;, jotka ovat suorittaneet korkeakoulututkinnon suomen tai ruotsin kielell&auml;.\u003C/p>\n\u003Cp>Hallituksen esitys \u003Ca href=\"https://www.eduskunta.fi/valtiopaivaasiat/HE+54/2026\" target=\"_blank\" rel=\"noopener\">HE 54/2026\u003C/a> annettiin eduskunnalle 16.4.2026. Lainmuutosten on tarkoitus tulla voimaan vuoden 2027 alusta.\u003C/p>\n\u003Cp>Vuosina 2024 ja 2025 hyv&auml;ksyttiin s&auml;&auml;d&ouml;smuutokset kahdessa edellisess&auml; hankkeessa, joista ensimm&auml;inen koski kansalaisuuslain asumisaikaedellytysten muuttamista. Kyseiset kansalaisuuslain muutokset tulivat voimaan 1.10.2024. T&auml;st&auml; hankkeesta on tietopaketti: \u003Ca href=\"/fi/lakihankkeiden-tietopaketit/kansalaisuuslain-asumisaikaedellytysten-muuttaminen/\" target=\"_blank\" rel=\"noopener\">Kansalaisuuslain asumisaikaedellytysten muuttaminen\u003C/a>.\u003C/p>\n\u003Cp>Toinen hanke koski nuhteettomuus- ja toimeentuloedellytyksi&auml;. Eduskunta p&auml;&auml;tti asiasta lokakuussa 2025, ja s&auml;&auml;d&ouml;smuutokset tulivat voimaan 17.12.2025. Asiasta on tietopaketti: \u003Ca href=\"/fi/lakihankkeiden-tietopaketit/kansalaisuuslain-muuttaminen-nuhteettomuus--ja-toimeentuloedellytysten-osalta/\" target=\"_blank\" rel=\"noopener\">Kansalaisuuslain muuttaminen nuhteettomuus- ja toimeentuloedellytysten osalta\u003C/a>.\u003C/p>\n\u003Cp>\u003Ca id=\"valmistelu\" href=\"#valmistelu\" name=\"valmistelu\">\u003C/a>\u003C/p>\n\u003Ch2>Valmistelu ennen eduskuntak&auml;sittely&auml;\u003C/h2>\n\u003Cp>\u003Ca href=\"https://urn.fi/URN:ISBN:978-952-383-763-8\" target=\"_blank\" rel=\"noopener\">Vahva ja v&auml;litt&auml;v&auml; Suomi : P&auml;&auml;ministeri Petteri Orpon hallituksen ohjelma 20.6.2023\u003C/a>\u003Cbr />&ndash; luku \u003Ca href=\"https://valtioneuvosto.fi/hallitukset/hallitusohjelma#/10/3\" target=\"_blank\" rel=\"noopener\">10.3 Maahanmuutto- ja kotoutumispolitiikka\u003C/a>\u003C/p>\n\u003Cp>Sis&auml;ministeri&ouml;n kansalaisuuslain muuttamista valmisteleva hanke, vaihe 3: \u003Ca href=\"https://intermin.fi/hankkeet/hankesivu?tunnus=SM056:00/2023\" target=\"_blank\" rel=\"noopener\">SM056:00/2023\u003C/a>.\u003Cbr />&ndash; Hankkeen toimikausi 16.10.2023&ndash;31.3.2026.\u003Cbr />&ndash; Hanke-sivun Asiakirjat-osiosta l&ouml;ytyv&auml;t muun muassa asettamisp&auml;&auml;t&ouml;s, lausuntopyynt&ouml; ja hallituksen esityksen luonnos (pdf)\u003Cbr />&ndash; \u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/e66dd086-6fef-421c-b1c8-10cc4d7bcf53/ASETTAMISPAATOS_20231016070844.PDF\" target=\"_blank\" rel=\"noopener\">Asettamisp&auml;&auml;t&ouml;s: Kansalaisuuslain muuttamista valmisteleva hanke, vaihe 3\u003C/a>\u003Cbr />&ndash; \u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/bae44b7c-83b7-4fa4-8f8f-ac00b18ed76d/LAUSUNTOPYYNTO_20251219155050.PDF\" target=\"_blank\" rel=\"noopener\">Lausuntopyynt&ouml; luonnoksesta hallituksen esitykseksi eduskunnallelaiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/a>\u003Cbr />&ndash; Luonnos: \u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/348eb0b0-fe35-4f75-b1df-7e117def5377/LAUSUNTOPYYNTO_20251219155050.PDF\" target=\"_blank\" rel=\"noopener\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/a>\u003Cbr />&ndash; \u003Ca href=\"https://valtioneuvosto.fi/documents/194055633/209910739/Arviointineuvoston+lausunto+kansalaisuuskokeesta.pdf/3d4f3ee2-64dc-0c94-13da-29b47dd36d0a?t=1774526127950\" target=\"_blank\" rel=\"noopener\">Lains&auml;&auml;d&auml;nn&ouml;n arviointineuvoston lausunto sis&auml;ministeri&ouml;lle hallituksen esityksen luonnoksesta laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/a>. 26.3.2026\u003Cbr />&ndash; \u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/8e6258d7-fee2-4302-b74e-986f93c64a13/YHTEENVETO_20260416070851.PDF\" target=\"_blank\" rel=\"noopener\">Lausuntoyhteenveto &ndash; kansalaisuuskoetta koskevan hallituksen esityksen luonnos\u003C/a> (pdf). Sis&auml;ministeri&ouml;, 16.4.2026.\u003C/p>\n\u003Cp>\u003Ca id=\"eduskunta\" href=\"#eduskunta\" name=\"eduskunta\">\u003C/a>\u003C/p>\n\u003Ch2>K&auml;sittely eduskunnassa\u003C/h2>\n\u003Cp>Hallituksen esitys \u003Ca href=\"https://www.eduskunta.fi/valtiopaivaasiat/HE+54/2026\" target=\"_blank\" rel=\"noopener\">HE 54/2026\u003C/a> laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi annettiin eduskunnalle 16.4.2026.\u003C/p>\n\u003Cp>L&auml;hetekeskustelussa 23.4.2026 asia l&auml;hetettiin hallintovaliokuntaan.\u003C/p>\n\u003Ch3>Aiheen aikaisempi k&auml;sittely\u003C/h3>\n\u003Cp>\u003Ca href=\"https://www.eduskunta.fi/FI/search/Sivut/Vaskiresults.aspx#k=kansalaisuusla*#l=1035\" target=\"_blank\" rel=\"noopener\">Valtiop&auml;iv&auml;asiakirjat, joissa esiintyy termi kansalaisuusla*\u003C/a>\u003C/p>\n\u003Cp>Kirjallinen kysymys \u003Ca href=\"https://www.eduskunta.fi/valtiopaivaasiat/KK+364/2011\" target=\"_blank\" rel=\"noopener\">KK 364/2011\u003C/a> kansalaisuustestin j&auml;rjest&auml;minen Suomen kansalaisuutta hakeville / Olli Immonen, ps\u003C/p>\n\u003Cp>Hallituksen esitys \u003Ca href=\"https://www.eduskunta.fi/valtiopaivaasiat/HE+27/2024\" target=\"_blank\" rel=\"noopener\">HE 27/2024\u003C/a> eduskunnalle laiksi kansalaisuuslain muuttamisesta annettiin uudistuksen ensimm&auml;isess&auml; vaiheessa.\u003Cbr />&ndash; Lakimuutokset \u003Ca href=\"https://www.finlex.fi/fi/laki/alkup/2024/20240474\" target=\"_blank\" rel=\"noopener\">(474/2024)\u003C/a> hyv&auml;ksyttiin 1.7.2024.\u003C/p>\n\u003Cp>Hallituksen esitys \u003Ca href=\"https://www.eduskunta.fi/valtiopaivaasiat/HE+19/2025\" target=\"_blank\" rel=\"noopener\">HE 19/2025\u003C/a> eduskunnalle laiksi kansalaisuuslain muuttamisesta annettiin uudistuksen toisessa vaiheessa.\u003Cbr />&ndash; Lakimuutokset \u003Ca href=\"https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2025/929\" target=\"_blank\" rel=\"noopener\">(929/2025)\u003C/a> hyv&auml;ksyttiin 15.10.2025.\u003C/p>\n\u003Cp>\u003Ca id=\"oikeusvertailu\" href=\"#oikeusvertailu\" name=\"oikeusvertailu\">\u003C/a>\u003C/p>\n\u003Ch2>Oikeusvertailevaa aineistoa\u003C/h2>\n\u003Cp>Hallituksen esityksen luonnoksessa on /\" target=\"_blank\" rel=\"noopener\">SOU 2021:2\u003C/a>.\u003C/p>\n\u003Cp>&Auml;ndringar i medborgarskapslagen, Regeringens proposition, \u003Ca href=\"https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/andringar-i-medborgarskapslagen_hb03107/\" target=\"_blank\" rel=\"noopener\">Prop. 2023/24:107\u003C/a>.\u003C/p>\n\u003Cp>Samaa aihepiiri&auml; k&auml;sittelee my&ouml;s uudempi selvitys:\u003Cbr />Sk&auml;rpta krav f&ouml;r svenskt medborgarskap. Statens offentliga utredningar, \u003Ca href=\"https://www.regeringen.se/rattsliga-dokument/statens-offentliga-utredningar/2025/01/sou-20251/\" target=\"_blank\" rel=\"noopener\">SOU 2025:1\u003C/a>.\u003C/p>\n\u003Cp>\u003Ca href=\"https://www.regeringen.se/rattsliga-dokument/lagradsremiss/2026/02/skarpta-krav-for-svenskt-medborgarskap/\" target=\"_blank\" rel=\"noopener\">​Lagr&aring;dsremiss : Sk&auml;rpta krav f&ouml;r svenskt medborgarskap\u003C/a> 10.1.2026\u003C/p>\n\u003Cp>\u003Ca href=\"https://www.riksdagen.se/sv/dokument-och-lagar/dokument/proposition/skarpta-krav-for-svenskt-medborgarskap_hd03175/\" target=\"_blank\" rel=\"noopener\">Proposition 2025/26:175\u003C/a>: Sk&auml;rpta krav f&ouml;r svenskt medborgarskap\u003Cbr />&ndash; Hallituksen esityksen k&auml;sittely Ruotsin valtiop&auml;ivill&auml;, medborgarskapsprovet s. 88&ndash;95&nbsp;\u003C/p>\n\u003Ch4>Ranska\u003C/h4>\n\u003Cp>\u003Ca href=\"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000049040245/\" target=\"_blank\" rel=\"noopener\">LOI n&deg; 2024-42\u003C/a> du 26 janvier 2024 pour contr&ocirc;ler l'immigration, am&eacute;liorer l'int&eacute;gration\u003C/p>\n\u003Cp>\u003Ca href=\"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000052381620\" target=\"_blank\" rel=\"noopener\">Arr&ecirc;t&eacute; du 10 octobre 2025\u003C/a> relatif au programme, aux &eacute;preuves et aux modalit&eacute;s d'organisation de l'examen civique\u003C/p>\n\u003Cp>Tammikuussa 2026 Ranskassa on otettu k&auml;ytt&ouml;&ouml;n koe, jolla testataan .2022.2031589\" target=\"_blank\" rel=\"noopener\">In defense of citizenship testing : a reply to Daniel Sharp\u003C/a> / Michael Blake. Ethics &amp; Global Politics 15 (2022):1, s. 8&ndash;13.\u003C/p>\n\u003Cp>\u003Ca href=\"https://www.researchgate.net/publication/361709565_Language_Requirement_for_Naturalization_Linguistic_Networks_and_International_Migration_The_Role_of_Common_Unofficial_Language\" target=\"_blank\" rel=\"noopener\">Language requirement for naturalization, linguistic networks, and international migration : the role of common unofficial language\u003C/a> / Luke Okafor, Usman Khalid &amp; Nusrate Aziz. Artikkeli julkaisussa Economics and finance readings : selected papers from Asia-pacific conference on economics &amp; finance, 2021. s. 1&ndash;31.\u003Cbr />&ndash; Artikkelia voi tiedustella ResearchGate-palvelusta.\u003C/p>\n\u003Cp>Maahanmuuton lait ja menettelyt : k&auml;yt&auml;nn&ouml;n k&auml;sikirja / Anna-Maija Juvonen. Edita, 2021.\u003Cbr />&ndash; \u003Ca href=\"https://eduskunnankirjasto.finna.fi/Record/ekk.994256234006250\" target=\"_blank\" rel=\"noopener\">Juvosen julkaisun saatavuus Eduskunnan kirjastossa\u003C/a>\u003C/p>\n\u003Cp>\u003Ca href=\"https://dx.doi.org/10.2139/ssrn.3979808\" target=\"_blank\" rel=\"noopener\">Modes of acquisition and loss of citizenship around the world : comparative typology and main patterns in 2020\u003C/a> / Luuk van der Baaren, Maarten Vink. Robert Schuman Centre for Advanced Studies Research Paper No. #RSC 2021/90.\u003C/p>\n\u003Cp>\u003Ca href=\"https://urn.fi/URN:ISBN:978-952-7167-75-5\" target=\"_blank\" rel=\"noopener\">Muuttoliikebibliografia = Migration Bibliography = Migrationsbibliografi\u003C/a> / Johanna Leinonen. Siirtolaisuusinstituutin julkaisuja 27, 2019. Siirtolaisuusinstituutti, 2019.\u003C/p>\n\u003Cp>\u003Ca href=\"https://doi.org/10.1111/imig.12477\" target=\"_blank\" rel=\"noopener\">Life satisfaction and the UK Citizenship Process : do tests and ceremonies enhance immigran  rel=\"noopener\">Kansalaisuuskoe on tulossa ensi vuonna &ndash;&thinsp;t&auml;llaisia kokeita muissa maissa on\u003C/a>. Simo Natunen, Keskisuomalainen 16.4.2026\u003C/p>\n\u003Cp>\u003Ca href=\"https://valtioneuvosto.fi/-/kansalaisuuskoetta-koskeva-vaikutusarviointi-on-paaosin-onnistunut-mutta-joitakin-tasmennyksia-tarvitaan\" target=\"_blank\" rel=\"noopener\">Kansalaisuuskoetta koskevan lain vaikutusarviointi on p&auml;&auml;osin onnistunut\u003C/a>. Valtioneuvoston tiedote 26.3.2026\u003C/p>\n\u003Cp>\u003Ca href=\"https://yle.fi/a/74-20212887\" target=\"_blank\" rel=\"noopener\">​​Suomen kansalaisuuskoe\u003C/a>. Viikon uutinen selkosuomeksi, Yle Uutiset 28.2.2026\u003C/p>\n\u003Cp>\u003Ca href=\"https://yle.fi/a/74-20211340\" target=\"_blank\" rel=\"noopener\">&rdquo;Maalitolppien siirt&auml;mist&auml; kesken pelin&rdquo; &ndash; asiantuntijat vaativat parannuksia Suomen kansalaisuuskokeeseen\u003C/a>. Ronan Browne, Yle Uutiset 20.2.2026\u003C/p>\n\u003Cp>​\u003Ca href=\"https://www.mtvuutiset.fi/artikkeli/ministeri-rantanen-puolustaa-kansalaisuuskoetta-nama-ovat-suomalaiset-arvot/9298164\" target=\"_blank\" rel=\"noopener\">Ministeri Rantanen puolustaa kansalaisuuskoetta &ndash; n&auml;m&auml; ovat \"suomalaiset arvot\u003C/a>\". Maria Nyk&auml;nen, MTV Uutiset 18.2.2026\u003C/p>\n\u003Cp>\u003Ca href=\"https://www.hs.fi/politiikka/art-2000011810632.html\" target=\"_blank\" rel=\"noopener\">Kansalaisuuden saamiseen tulossa uusi ehto: kansalaisuuskoe\u003C/a>. Veli-Pekka Lehtonen, Helsingin Sanomat 15.2.2026\u003C/p>\n\u003Cp>\u003Ca href=\"https://www.hs.fi/maailma/art-2000011805253.html\" target=\"_blank\" rel=\"noopener\">Ruotsi tiukentaa kansalaisuuden saamisen ehtoja\u003C/a>. Tiina Rajam&auml;ki, Helsingin Sanomat 9.2.2026\u003C/p>\n\u003Cp>\u003Ca href=\"https://www.hs.fi/politiikka/art-2000011714562.html\" target=\"_blank\" rel=\"noopener\">T&auml;m&auml; kaavaillusta kansalaiskokeesta tiedet&auml;&auml;n: Kysymyksi&auml; naisten oikeuksista ja juhlap UK Test\u003C/a>\u003C/p>\n\u003Ch4>Ranska\u003C/h4>\n\u003Cp>Minist&egrave;re de l'Int&eacute;rieur: \u003Ca href=\"https://formation-civique.interieur.gouv.fr/examen-civique/informations-g%C3%A9n%C3%A9rales-sur-lexamen-civique\" target=\"_blank\" rel=\"noopener\">Informations g&eacute;n&eacute;rales sur l'examen civique\u003C/a>\u003C/p>\n\u003Cp>Minist&egrave;re de l'Int&eacute;rieur: \u003Ca href=\"https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Les-procedures-d-acces-a-la-nationalite-francaise\" target=\"_blank\" rel=\"noopener\">Les proc&eacute;dures d'acc&egrave;s &agrave; la nationalit&eacute; fran&ccedil;aise\u003C/a>\u003C/p>\n\u003Ch4>​​Kanada\u003C/h4>\n\u003Cp>Government of Canada: \u003Ca href=\"https://www.canada.ca/en/immigration-refugees-citizenship/corporate/publications-manuals/discover-canada.html\" target=\"_blank\" rel=\"noopener\">Study Guide &ndash; Discover Canada &ndash; The Rights and Responsibilities of Citizenship\u003C/a>\u003C/p>\n\u003Ch3>Kansainv&auml;lisi&auml; aineistoja:\u003C/h3>\n\u003Cp>European Court of Human Rights, ECHR: \u003Ca href=\"https://www.echr.coe.int/documents/d/echr/fs_citizenship_deprivation_eng\" target=\"_blank\" rel=\"noopener\">Factsheet &ndash; Deprivation of citizenship\u003C/a>\u003C/p>\n\u003Cp>ECHR: \u003Ca href=\"https://ks.echr.coe.int/documents/d/echr-ks/nationality\" target=\"_blank\" rel=\"noopener\">Key theme &ndash; Article 8 Nationality\u003C/a>\u003C/p>\n\u003Cp>ECHR: \u003Ca href=\"https://ks.echr.coe.int/documents/d/echr-ks/guide_art_8_eng\" target=\"_blank\" rel=\"noopener\">Guide on Article 8 of the European Convention on Human Rights : right to respect for private and family life, home and correspondence\u003C/a>\u003Cbr />&ndash; sivu 85: Statelessness, citizenship and residence\u003C/p>\n\u003Cp>European Commission: \u003Ca href=\"https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/eu-citizenship-and-democracy/eu-citizenship_en\" target=\"_blank\" rel=\"noopener\">EU citizenship\u003C/a>\u003C/p>\n\u003Cp>European University Institute, EUI: \u003Ca href=\"https://globalcit.eu/national-citizenship-laws\" target=\"_blank\" rel=\"noopener\">Global Nationality Laws Database\u003C/a>\u003C/p>\n\u003Cp>EUI: \u003Ca href=\"https://globalcit.eu/modes-acquisition-citizenship\" target=\"_blank\" rel=\"noopener\">GLOBALCIT Citizenship Law Dataset &ndash; Modes of Acquisition of Citizenship\u003C/a>\u003C/p>\n\u003Cp>EUI: \u003Ca href=\"https://globalcit.eu/modes-loss-citizenship\" target=\"_blank\" rel=\"noopener\">GLOBALCIT Citizenship Law Dataset &ndash; Modes of Loss of Citizenship\u003C/a>\u003C/p>\n\u003Cp>\u003Cem>\u003Cbr />Sis&auml;ll&ouml;llinen toimitus: Eduskunnan kirjasto, s&auml;hk&ouml;posti: kirjasto@eduskunta.fi, helmikuu 2026, p&auml;ivitetty 17.4.2026.\u003C/em>\u003C/p>",showInTableOfContents:false,anchorId:null}},inlineBlock:{contentType:[]}}],showLeftNavigation:true,leftNavigationContentArea:[{displayOption:"",tag:null,contentLink:{id:5860,workId:0,guidValue:"6d16d7fe-f601-4453-be14-67fae0981b0f",providerName:null,url:null,expanded:{contentLink:{id:5860,workId:0,guidValue:"6d16d7fe-f601-4453-be14-67fae0981b0f",providerName:null,url:null,expanded:null},name:"sisällysluettelo",language:null,existingLanguages:null,masterLanguage:null,contentType:["Block","ContentBlock"],parentLink:null,routeSegment:null,url:null,changed:null,created:null,startPublish:"2026-03-25T08:40:35Z",stopPublish:null,saved:null,status:null,showInTableOfContents:false,anchorId:null}},inlineBlock:{contentType:[]}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/fi/lakihankkeiden-tietopaketit/kansalaisuuskoe-osaksi-kansalaisuuslakia/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/fi/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"",contentLink:"18"},{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"",contentLink:"1796"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/fi/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/fi/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/fi/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1659"},{children:[],relatedContent:[],name:"Eduskunnan EU-sihteeristö",teaserText:"EU-sihteeristö tukee kansanedustajien yhteydenpitoa suomalaisiin ja muihin Euroopan parlamentin jäseniin sekä muihin keskeisiin EU-toimijoihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-eu-sihteeristo/",selected:false,targetFrame:"",contentLink:"1415"},{children:[],relatedContent:[],name:"EU-tiedonlähteet ja asiakirjat",teaserText:"Tämä sivu kokoaa keskeiset Euroopan unionia koskevat tiedonlähteet sekä ohjeet EU-asiakirjojen ja tietokantojen käyttöön. Tavoitteena on helpottaa EU-asioihin liittyvän virallisen aineiston löytämistä sekä mahdollistaa tiedon hakeminen Euroopan unionista yleisesti ja eri aihealueilta. \n\nLinkit johtavat ensisijaisesti EU:n virallisiin lähteisiin ja virastojen verkkosivuille. Jos suomenkielistä sisältöä ei ole saatavilla, linkki ohjaa englanninkieliselle sivulle. Kaikki linkit avautuvat uuteen välilehteen.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-tiedonlahteet-ja-asiakirjat/",selected:false,targetFrame:"",contentLink:"8196"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/fi/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. Vanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/fi/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/fi/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/fi/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/fi/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/fi/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/fi/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/fi/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/fi/asiat-ja-aanestykset/",selected:false,targetFrame:"",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/fi/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/fi/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/fi/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/fi/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/fi/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. \nOpastuksen aikana opas kertoo eduskunnan toiminnasta, eduskunnan tehtävistä, kansanedustajan työstä ja Eduskuntatalon keskeisimmistä tiloista.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/fi/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/fi/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"",contentLink:"64"}],relatedContent:[
