ll,contentType:["Page","CollectionPage"],parentLink:null,routeSegment:"oppna-data",url:"/sv/oppna-data/",changed:null,created:null,startPublish:"2026-03-04T12:16:09Z",stopPublish:null,saved:null,status:null,teaserTitle:"Öppna data",teaserText:"Riksdagen tillhandahåller öppna data om riksdagsledamöter och riksdagsärenden. Du kan söka, läsa och ladda ned innehåll till exempel för forskning. Öppna data är enklast att använda genom att bläddra i sökresultat. Du kan också ladda ned öppna data genom API-gränssnittet.",teaserLinkText:"Till nyheten",teaserImage:null}}},{href:"/sv/for-medier/",title:"Medialle",target:null,text:"För medier",contentLink:{id:87,workId:0,guidValue:"c0a24b1f-97f2-4c1e-8e2c-3a14ed949882",providerName:null,url:"/sv/for-medier/",expanded:{contentLink:{id:87,workId:0,guidValue:"c0a24b1f-97f2-4c1e-8e2c-3a14ed949882",providerName:null,url:"/sv/for-medier/",expanded:null},name:"För medier",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","CollectionPage"],parentLink:null,routeSegment:"for-medier",url:"/sv/for-medier/",changed:null,created:null,startPublish:"2025-07-07T12:27:16Z",stopPublish:null,saved:null,status:null,teaserTitle:"För medier",teaserText:"Kring 200 journalister och fotografer är ackrediterade vid riksdagen. Även övriga journalister och fotografer får besöka riksdagen för att intervjua ledamöter eller för att bevaka riksdagsarbetet.",teaserLinkText:"Till nyheten",teaserImage:null}}}],footerShortcutLinks:[{href:"/sv/ta-kontakt-eller-kom-pa-besok/",title:null,target:null,text:"Ta kontakt eller kom på besök",contentLink:{id:2894,workId:0,guidValue:"681f72be-ba10-4599-92c7-250bd7db9bf0",providerName:null,url:"/sv/ta-kontakt-eller-kom-pa-besok/",expanded:{contentLink:{id:2894,workId:0,guidValue:"681f72be-ba10-4599-92c7-250bd7db9bf0",providerName:null,url:"/sv/ta-kontakt-eller-kom-pa-besok/",expanded:null},name:"Ta kontakt eller kom på besök",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","CollectionPage"],parentLink:null,routeSegment:"ta-kontakt-eller-kom-pa-besok",url:"/sv/ta-kontakt-eller-kom-pa-besok/",changed:null,created:null,startPublish:"2026-03-12T11:10:05Z",stopPublish:null,saved:null,status:null,teaserTitle:"Ta kontakt eller kom på besök",teaserText:"Du kan ta kontakt med en riksdagsledamot eller riksdagens kansli. Du kan skicka oss frågor med Fråga om riksdagen-blanketter eller bekanta dig med våra besöksalternativ.",teaserLinkText:"Till nyheten",teaserImage:null}}},{href:"/sv/arbetet-i-riksdagen/sa-fungerar-riksdagen/",title:"Så fungerar riksdagen",target:null,text:"Så fungerar riksdagen",contentLink:{id:36,workId:0,guidValue:"affbb4c3-46d2-4c5a-aa05-52f9cbe118af",providerName:null,url:"/sv/arbetet-i-riksdagen/sa-fungerar-riksdagen/",expanded:{contentLink:{id:36,workId:0,guidValue:"affbb4c3-46d2-4c5a-aa05-52f9cbe118af",providerName:null,url:"/sv/arbetet-i-riksdagen/sa-fungerar-riksdagen/",expanded:null},name:"Så fungerar riksdagen",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sa-fungerar-riksdagen",url:"/sv/arbetet-i-riksdagen/sa-fungerar-riksdagen/",changed:null,created:null,startPublish:"2026-01-22T16:07:20Z",stopPublish:null,saved:null,status:null,teaserTitle:"Så fungerar riksdagen",teaserText:"Riksdagens viktigaste uppgift är att stifta lagar. Riksdagen beslutar också om statsbudgeten, väljer statsminister och övervakar regeringens arbete. Riksdagen godkänner dessutom de viktigaste av de internationella överenskommelser som är bindande för Finland och är med och påverkar i EU-frågor.",teaserLinkText:"Till nyheten",teaserImage:null}}},{href:"/sv/riksdagsledamoter-och-organ/talmannen/",title:"Talmännen",target:null,text:"Talmännen",contentLink:{id:15,workId:0,guidValue:"029dcd22-6f19-4729-a147-a4d166fb9293",providerName:null,url:"/sv/riksdagsledamoter-och-organ/talmannen/",expanded:{contentLink:{id:15,workId:0,guidValue:"029dcd22-6f19-4729-a147-a4d166fb9293",providerName:null,url:"/sv/riksdagsledamoter-och-organ/talmannen/",expanded:null},name:"Talmännen",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"talmannen",url:"/sv/riksdagsledamoter-och-organ/talmannen/",changed:null,created:null,startPublish:"2025-10-31T12:54:13Z",stopPublish:null,saved:null,status:null,teaserTitle:"Talmännen",teaserText:"Riksdagens talman har en väsentlig roll i riksdagsarbetet. Talmannens ställning syns också i rikets inofficiella hierarki, där talmannen är näst i rang efter republikens president. Talmannen leder arbetet i plenum och kontrollerar dess grundlagsenlighet.",teaserLinkText:"Till nyheten",teaserImage:{altText:"Eduskunnan puhemiehistö eduskunnan Valtiosalissa kuvattuna.  Puhemies Jussi Halla-aho, ensimmäinen varapuhemies Paula Risikko ja toinen varapuhemies Tarja Filatov. ",id:179,workId:0,guidValue:"1990ca73-878f-4034-96ef-6d2541e14644",providerName:null,url:"/api/assets/globalassets/kuvat/sisaltosivujen-kuvia/puhemiehisto.jpg?timestamp=638949995650000000",expanded:null}}}},{href:"/sv/sok/",title:null,target:null,text:"Sök riksdagsmaterial",contentLink:{id:2992,workId:0,guidValue:"16ea5324-63be-49c3-a4b2-59479fcd504c",providerName:null,url:"/sv/sok/",expanded:{contentLink:{id:2992,workId:0,guidValue:"16ea5324-63be-49c3-a4b2-59479fcd504c",providerName:null,url:"/sv/sok/",expanded:null},name:"Avancerad sökning",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","CollectionPage"],parentLink:null,routeSegment:"sok",url:"/sv/sok/",changed:null,created:null,startPublish:"2026-02-12T10:19:08Z",stopPublish:null,saved:null,status:null,teaserTitle:"Avancerad sökning",teaserText:"",teaserLinkText:"Till nyheten",teaserImage:null}}}],footerSocialMediaLinks:[{href:"https://www.facebook.com/suomeneduskunta",title:"Facebook",target:"_blank",text:"Facebook",contentLink:null},{href:"https://www.flickr.com/photos/finnishparliament",title:"Flickr",targ vaus/",title:null,target:null,text:"Beskrivning av handlingsoffentlighet",contentLink:{id:120,workId:0,guidValue:"9c41c983-845e-4aae-a2bb-c56d60a8d3a0",providerName:null,url:"/fi/tietoa-sivustosta/asiakirjajulkisuuskuvaus/",expanded:null}},{href:"/fi/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Dataskyddsbeskrivningar",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:null}},{href:"/fi/tietoa-sivustosta/rss-syotteet/",title:null,target:null,text:"RSS-flöden",contentLink:{id:1735,workId:0,guidValue:"080f8dea-6c05-4e6f-b0c1-737adb09d170",providerName:null,url:"/fi/tietoa-sivustosta/rss-syotteet/",expanded:null}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/sv/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Riksdagsledamöter",teaserText:"Riksdagen har 200 riksdagsledamöter, som väljs i val vart fjärde år. Ledamöterna arbetar i plenum, utskotten och riksdagsgrupperna.",url:"/sv/riksdagsledamoter-och-organ/riksdagsledamoter/",selected:false,targetFrame:"_self",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Arbete i plenum och utskott",teaserText:"Riksdagsledamoten är lagstiftare, samhällelig påverkare, företrädare för sin region och internationell aktör. Plenum är den mest synliga delen av riksdagsarbetet, men utskottet är ledamotens viktigaste kanal för att påverka.",url:"/sv/riksdagsledamoter-och-organ/om-ledamotens-arbete/arbete-i-plenum-och-utskott/",selected:false,targetFrame:"_self",contentLink:"1848"},{children:[],relatedContent:[],name:"Ledamöternas arvoden och ersättningar",teaserText:"Riksdagsledamöterna får inte lön för sitt arbete, utan de betalas ett arvode. Arvodet är skattepliktig inkomst. Förutom arvodet får ledamöterna skattefri ersättning för sina utgifter.",url:"/sv/riksdagsledamoter-och-organ/om-ledamotens-arbete/ledamoternas-arvoden-och-ersattningar/",selected:false,targetFrame:"_self",contentLink:"10"},{children:[],relatedContent:[],name:"Ledamöternas bindningar",teaserText:"En riksdagsledamot måste ge riksdagen en redogörelse för sina bindningar och inkomster som kan påverka uppdraget som ledamot samt gåvor som ledamoten mottagit.",url:"/sv/riksdagsledamoter-och-organ/om-ledamotens-arbete/ledamoternas-bindningar/",selected:false,targetFrame:"_self",contentLink:"12"},{children:[],relatedContent:[],name:"Byte av riksdagsledamot",teaserText:"En riksdagsledamot kan bytas ut under en valperiod om riksdagen beviljar en riksdagsledamot befrielse från uppdraget som ledamot. En ledamot kan också avbryta sitt uppdrag som ledamot om denne blir vald till ledamot av Europaparlamentet.",url:"/sv/riksdagsledamoter-och-organ/om-ledamotens-arbete/byte-av-riksdagsledamot/",selected:false,targetFrame:"_self",contentLink:"1654"},{children:[],relatedContent:[],name:"Riksdagsledamöternas pensioner och anpassningsbidrag",teaserText:"Riksdagsledamöter tjänar in pension. I regel kan en ledamot få pension vid 65 års ålder. En ledamot kan också vara berättigad till ett tidsbegränsat anpassningsbidrag.",url:"/sv/riksdagsledamoter-och-organ/om-ledamotens-arbete/riksdagsledamoternas-pensioner-och-anpassningsbidrag/",selected:false,targetFrame:"_self",contentLink:"11"}],relatedContent:[],name:"Om ledamotens arbete",teaserText:"Om ledamotens arbete",url:"/sv/riksdagsledamoter-och-organ/om-ledamotens-arbete/",selected:false,targetFrame:"_self",contentLink:"13"},{children:[],relatedContent:[],name:"Talmännen",teaserText:"Riksdagens talman har en väsentlig roll i riksdagsarbetet. Talmannens ställning syns också i rikets inofficiella hierarki, där talmannen är näst i rang efter republikens president. Talmannen leder arbetet i plenum och kontrollerar dess grundlagsenlighet.",url:"/sv/riksdagsledamoter-och-organ/talmannen/",selected:false,targetFrame:"_self",contentLink:"15"},{children:[],relatedContent:[],name:"Regering och opposition",teaserText:"Regeringen och oppositionen är viktiga parter i riksdagens verksamhet.",url:"/sv/riksdagsledamoter-och-organ/regering-och-opposition/",selected:false,targetFrame:"_self",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Social- och hälsovårdsutskottet",teaserText:"Social- och hälsovårdsutskottet behandlar bland annat frågor som gäller socialvård, hälso- och sjukvård, socialförsäkring, avgifter inom socialvård och hälso- och sjukvård, pensionslagstiftning och miljö- och hälsoskydd.",url:"/sv/riksdagsledamoter-och-organ/utskotten/social-och-halsovardsutskottet/",selected:false,targetFrame:"_self",contentLink:"2876"},{children:[],relatedContent:[],name:"Anvisningar för sakkunniga som hörs i utskott",teaserText:null,url:"/sv/riksdagsledamoter-och-organ/utskotten/anvisningar-for-sakkunniga-som-hors-i-utskott/",selected:false,targetFrame:"_self",contentLink:"1355"}],relatedContent:[],name:"Utskotten",teaserText:"Riksdagens beslut bereds i utskotten. I riksdagen finns 16 permanenta fackutskott samt stora utskottet, som koordinerar EU-ärenden.",url:"/sv/riksdagsledamoter-och-organ/utskotten/",selected:false,targetFrame:"_self",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Registret över riksdagsgrupper",teaserText:null,url:"/sv/riksdagsledamoter-och-organ/riksdagsgrupperna/registret-over-riksdagsgrupper/",selected:false,targetFrame:"_self",contentLink:"1796"},{children:[],relatedContent:[],name:"Riksdagsgruppens arbete",teaserText:"Riksdagsgruppens arbete",url:"/sv/riksdagsledamoter-och-organ/riksdagsgrupperna/riksdagsgruppens-arbete/",selected:false,targetFrame:"_self",contentLink:"18"}],relatedContent:[],name:"Riksdagsgrupperna",teaserText:"Riksdagsledamöterna bildar riksdagsgrupper efter parti. Här sker viktigt och praktiskt riksdagsarbete. Varje riksdagsgrupp tillsätter ett presidium och eventuellt andra organ.",url:"/sv/riksdagsledamoter-och-organ/riksdagsgrupperna/",selected:false,targetFrame:"_self",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Ledamöternas internationella arbete",teaserText:"Riksdagsledamöterna företräder Finland också i internationella sammanhang. Finländska ledamöter deltar i arbetet i interparlamentariska organisationer, och besöksutbyte bedrivs med andra parlament. Talmansmötena utgör en viktig del av det interparlamentariska samarbetet.",url:"/sv/riksdagsledamoter-och-organ/internationellt-arbete/ledamoternas-internationella-arbete/",selected:false,targetFrame:"_self",contentLink:"21"},{children:[],relatedContent:[],name:"Delegationer",teaserText:"Riksdagen deltar regelbundet i nio olika internationella organisationers arbete. För samarbetet tillsätts delegationer, vars mandatperiod är en valperiod.",url:"/sv/riksdagsledamoter-och-organ/internationellt-arbete/delegationer/",selected:false,targetFrame:"_self",contentLink:"1241"}],relatedContent:[],name:"Internationellt arbete",teaserText:"Genom sitt internationella samarbete bidrar riksdagen till arbetet med Finlands utrikespolitiska prioriteringar som exempelvis mänskliga rättigheter, starka demokratiska institutioner, det internationella regelbaserade systemet och iakttagande av folkrätten.",url:"/sv/riksdagsledamoter-och-organ/internationellt-arbete/",selected:false,targetFrame:"_self",contentLink:"20"},{children:[],relatedContent:[],name:"EU-arbete",teaserText:"Riksdagen medverkar i Europeiska unionens parlamentariska samarbete som en del av växelverkan mellan medlemsländerna och Europaparlamentet. I anslutning till behandlingen av EU-ärenden sköts koordinering, samarbete mellan riksdagsledamöter samt internationella kontakter. Detta arbete sker både inom ramarna för riksdagens inre funktioner och via nätverk mellan parlamenten.",url:"/sv/riksdagsledamoter-och-organ/eu-arbete/",selected:false,targetFrame:"_self",contentLink:"7746"},{children:[],relatedContent:[],name:"Ledamöternas medlemskap i riksdagens organ",teaserText:"Riksdagsledamöterna arbetar i olika organ. Centrala organ i riksdagen är till exempel utskotten, presidiet eller de internationella parlamentariska delegationerna. Ledamöterna är också medlemmar i olika parlamentariska tillsyns- och styrorgan, såsom Yles förvaltningsråd. Medlemskapen i organ, såsom utskott, fördelas enligt riksdagsgruppernas storlek. På den här sidan finns information om riksdagsledamöternas medlemskap och uppgifter i olika organ och riksdagsgrupper.",url:"/sv/riksdagsledamoter-och-organ/ledamoternas-medlemskap-i-riksdagens-organ/",selected:false,targetFrame:"_self",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Vänskapsgrupper",teaserText:"Riksdagsledamöterna grundar vänskapsgrupper, som sköter internationella kontakter vid sidan av riksdagens officiella internationella arbete. Nedan är en förteckning över vänskapsgrupperna som konstituerat sig efter riksdagsvalet 2023.",url:"/sv/riksdagsledamoter-och-organ/natverk-vanskapsgrupper-och-klubbar/vanskapsgrupper/",selected:false,targetFrame:"_self",contentLink:"24"}],relatedContent:[],name:"Nätverk, vänskapsgrupper och klubbar",teaserText:"Riksdagsledamöterna är verksamma i olika samhälleliga nätverk, vänskapsgrupper och klubbar. De för samman ledamöter som har gemensamma intressen och utgör ett komplement till debatten i riksdagen.",url:"/sv/riksdagsledamoter-och-organ/natverk-vanskapsgrupper-och-klubbar/",selected:false,targetFrame:"_self",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Fråga om riksdagen",teaserText:null,url:"/sv/fraga-om-riksdagen/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Ledamöternas arvoden och ersättningar",teaserText:null,url:"/sv/riksdagsledamoter-och-organ/om-ledamotens-arbete/ledamoternas-arvoden-och-ersattningar/",selected:false,targetFrame:null,contentLink:null}],name:"Riksdagsledamöter och organ",teaserText:"Riksdagen har 200 riksdagsledamöter. Medborgarna väljer riksdagsledamöterna genom att rösta i val. I riksdagen hör ledamöterna till riksdagsgrupper. Riksdagsgrupperna indelas i regerings- och oppositionsgrupper. Riksdagen tillsätter ledamöter i nationella och internationella organ.",url:"/sv/riksdagsledamoter-och-organ/",selected:false,targetFrame:"_self",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Ärenden under behandling",teaserText:"På denna sida ser du ärenden som behandlas i riksdagen just nu. Du kan filtrera ärenden efter riksdagens uppgift, ärendetyp eller behandlingsfas.",url:"/sv/arenden-och-omrostningar/arenden-under-behandling/",selected:false,targetFrame:"_self",contentLink:"1365"},{children:[],relatedContent:[],name:"Vad är riksdagsärenden?",teaserText:"Riksdagen fattar beslut om våra gemensamma angelägenheter. Riksdagens beslut gäller alltid något riksdagsärende, som har behandlats i riksdagen. Riksdagsärendena kan grupperas exempelvis så här: lagstiftning, budgeten, kontroll över regeringen och EU-ärenden.",url:"/sv/arenden-och-omrostningar/vad-ar-riksdagsarenden/",selected:false,targetFrame:"_self",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Riksdagens roll i EU:s beslutsprocess",teaserText:"Riksdagen slår fast Finlands ståndpunkt i de frågor som beslutas av EU men som hör till riksdagens behörighet.",url:"/sv/arenden-och-omrostningar/eu-arenden/riksdagens-roll-i-eus-beslutsprocess/",selected:false,targetFrame:"_self",contentLink:"1407"},{children:[],relatedContent:[],name:"Riksdagsbehandlingen av EU-ärenden",teaserText:"EU-rättsakter, särskilt direktiv, kräver ofta att Finlands lagstiftning ändras. Beslut om sådana ändringar fattas av riksdagen, precis som i andra lagstiftningsfrågor. EU-ärenden behandlas i alla utskott, men stora utskottet är riksdagens egentliga EU-utskott och fattar beslut om riksdagens ståndpunkt i EU-ärenden.",url:"/sv/arenden-och-omrostningar/eu-arenden/riksdagsbehandlingen-av-eu-arenden/",selected:false,targetFrame:"_self",contentLink:"1659"}],relatedContent:[],name:"EU-ärenden",teaserText:"Riksdagen har en stark roll i EU:s beslutsprocess. Det är riksdagen som beslutar Finlands ståndpunkt i de frågor som beslutas av EU, men som ingår i riksdagens behörighet. ",url:"/sv/arenden-och-omrostningar/eu-arenden/",selected:false,targetFrame:"_self",contentLink:"1658"},{children:[],relatedContent:[],name:"Riksdagsärenden före år 2015",teaserText:"Riksdagens webbplats förnyas. Riksdagsärenden som riksdagen har behandlat före år 2015 ligger för närvarande endast på den gamla webbplatsen. Dessa äldre handlingar flyttas till den nya webbplatsen senast i juli 2026.",url:"/sv/arenden-och-omrostningar/riksdagsarenden-fore-ar-2015/",selected:false,targetFrame:"_self",contentLink:"7039"},{children:[],relatedContent:[],name:"Senaste riksdagshandlingar",teaserText:"En riksdagshandling är en handling, som inleder behandlingen av ett riksdagsärende i riksdagen. Handlingen kan också gälla behandlingen i sig eller resultatet av den. Riksdagshandlingarna sparas på riksdagens webbplats på finska och svenska genast när de har inkommit till riksdagen eller när de handlingar som riksdagen själv utarbetat har blivit klara.",url:"/sv/arenden-och-omrostningar/senaste-riksdagshandlingar/",selected:false,targetFrame:"_self",contentLink:"6546"},{children:[],relatedContent:[],name:"Senaste omröstningar",teaserText:"På denna sida publiceras resultaten av de senaste omröstningarna i plenum. Typiska omröstningar i plenum gäller lagförslag, statsbudgeten samt personval och val till organ.",url:"/sv/arenden-och-omrostningar/senaste-omrostningar/",selected:false,targetFrame:"_self",contentLink:"3435"},{children:[],relatedContent:[],name:"Omröstning i riksdagen",teaserText:"Riksdagen röstar vanligtvis om lagförslag och statsbudgeten samt i personval och tillsättande av organ. I en omröstning står valet mellan två eller flera alternativ, och riksdagen väljer det som får flest röster.",url:"/sv/arenden-och-omrostningar/omrostning-i-riksdagen/",selected:false,targetFrame:"_self",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Sök riksdagsärenden",teaserText:null,url:"/sv/sok/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Hur länka till riksdagens material",teaserText:null,url:"/sv/arenden-och-omrostningar/vad-ar-riksdagsarenden/hur-lanka-till-riksdagens-material/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Öppna data",teaserText:null,url:"/sv/oppna-data/",selected:false,targetFrame:null,contentLink:null}],name:"Ärenden och omröstningar",teaserText:"Riksdagens beslut gäller alltid ett riksdagsärende, som har behandlats i riksdagen. Till ärendet hör en eller flera riksdagshandlingar. Omröstningarna handlar i regel om att godkänna eller förkasta paragrafer eller uttalanden i lagförslag eller behandling av statsbudgeten.",url:"/sv/arenden-och-omrostningar/",selected:false,targetFrame:"_self",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Riksdagens plenum",teaserText:"Lagar stiftas i plenum. Riksdagen samlas till plenum tisdagar till fredagar. På tisdagar och onsdagar börjar plenum i regel klockan 14, på torsdagar klockan 16 och på fredagar klockan 13.",url:"/sv/plenum-och-evenemang/riksdagens-plenum/",selected:false,targetFrame:"_self",contentLink:"34"},{children:[],relatedContent:[],name:"Dagordningen för nästa plenum",teaserText:null,url:"/sv/plenum-och-evenemang/dagordningen-for-nasta-plenarsession/",selected:false,targetFrame:"_self",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Läs plenarplanen i kalendern",teaserText:null,url:"/sv/plenum-och-evenemang/?week=",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Videor av plenum",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/sv/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Sök plenarprotokoll",teaserText:null,url:"/sv/sok/?category=asiakirjat&sort=laadintapvm_desc%2Cnimeketeksti_asc&aineistonKieli=sv&asiakirjatyypit=PTKPS&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto",selected:false,targetFrame:null,contentLink:null}],name:"Plenum och evenemang",teaserText:"Riksdagen stiftar lagar i plenum. Plenum är öppna för allmänheten och visas även på webben. I riksdagens kalender ser du schemat för plenum, utskottsmöten och övriga evenemang.",url:"/sv/plenum-och-evenemang/",selected:false,targetFrame:"_self",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Riksdagen beslutar om statsbudgeten",teaserText:"Vid sidan av att stifta lagar är en annan av riksdagens primära uppgifter att besluta om statsbudgeten. Budgeten görs upp varje år och innehåller statens inkomster och utgifter för det följande året. Regeringen lämnar en budgetproposition till riksdagen och riksdagen fattar det slutliga beslutet om den.",url:"/sv/arbetet-i-riksdagen/sa-fungerar-riksdagen/riksdagen-beslutar-om-statsbudgeten/",selected:false,targetFrame:"_self",contentLink:"37"},{children:[],relatedContent:[],name:"Riksdagen övervakar regeringen",teaserText:"Riksdagen utövar såväl politisk som rättslig kontroll över regeringen och myndigheterna. Den politiska kontrollen ska säkerställa att regeringen stöds av en majoritet i riksdagen.",url:"/sv/arbetet-i-riksdagen/sa-fungerar-riksdagen/riksdagen-overvakar-regeringen/",selected:false,targetFrame:"_self",contentLink:"38"}],relatedContent:[],name:"Så fungerar riksdagen",teaserText:"Riksdagens viktigaste uppgift är att stifta lagar. Riksdagen beslutar också om statsbudgeten, väljer statsminister och övervakar regeringens arbete. Riksdagen godkänner dessutom de viktigaste av de internationella överenskommelser som är bindande för Finland och är med och påverkar i EU-frågor.",url:"/sv/arbetet-i-riksdagen/sa-fungerar-riksdagen/",selected:false,targetFrame:"_self",contentLink:"36"},{children:[],relatedContent:[],name:"Lagstiftningsprocessen steg för steg",teaserText:"En ny lag stiftas eller en befintlig lag ändras utifrån en proposition från regeringen, en motion från en riksdagsledamot eller ett medborgarinitiativ. I riksdagen inleds behandlingen av lagförslaget med en remissdebatt, varefter ärendet remitteras till ett utskott. När utskottet har färdigställt sitt betänkande behandlas lagförslaget i plenum i två omgångar. Om riksdagen antar lagen, upprättas riksdagens svar i ärendet. Slutligen stadfästs lagen av republikens president.",url:"/sv/arbetet-i-riksdagen/lagstiftningsprocessen-steg-for-steg/",selected:false,targetFrame:"_self",contentLink:"39"},{children:[],relatedContent:[],name:"Planering och strukturering av riksdagsarbetet",teaserText:"Riksdagens mandatperiod omfattar en valperiod, alltså fyra år. Den börjar när resultatet från riksdagsvalet har fastställts och fortgår tills nästa val har förrättats.",url:"/sv/arbetet-i-riksdagen/planering-och-strukturering-av-riksdagsarbetet/",selected:false,targetFrame:"_self",contentLink:"1337"},{children:[],relatedContent:[],name:"Riksdagens historia",teaserText:"Finlands riksdag har genom sin historia stiftat lagar i skuggan av kejsardömet, revolutionen och världskrigen. Den finländska representativa demokratin har stått emot både interna och externa påtryckningar utan att bryta samman, vilket är ovanligt i Europas våldsamma 1900-talshistoria. Nedan presenteras kortfattat de viktigaste vändningarna i riksdagens historia. I slutet av varje avsnitt finns länkar till fördjupande information i form av historiska faktapaket. ",url:"/sv/arbetet-i-riksdagen/riksdagens-historia/",selected:false,targetFrame:"_self",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Jobba för riksdagen",teaserText:"Riksdagens kansli är en serviceorganisation, som erbjuder riksdagens 200 ledamöter all den hjälp och expertis de behöver i sitt arbete.",url:"/sv/arbetet-i-riksdagen/riksdagens-organisation/jobba-for-riksdagen/",selected:false,targetFrame:"_self",contentLink:"43"}],relatedContent:[],name:"Riksdagens organisation",teaserText:"Riksdagens kansli stöder riksdagsarbetet och riksdagsledamöternas arbete. I kansliet arbetar cirka 400 tjänstemän och cirka 40 ledamotsassistenter.",url:"/sv/arbetet-i-riksdagen/riksdagens-organisation/",selected:false,targetFrame:"_self",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Regeringsbildning",teaserText:"Processen att bilda regering börjar efter valet. I regeringssonderingen reder man ut vilka riksdagsgrupper och partier som fortsätter till de egentliga regeringsförhandlingarna. I regeringsförhandlingarna kommer parterna överens om innehållet i regeringsprogrammet och fattar beslut om att vara del av regeringen. G​odkännandet av regeringen sker i samråd med riksdagens talman, republikens president och riksdagen.",url:"/sv/arbetet-i-riksdagen/riksdagsval/regeringsbildning/",selected:false,targetFrame:"_self",contentLink:"1309"},{children:[],relatedContent:[],name:"Vad händer då en ny riksdag sätter igång?",teaserText:"Efter valet fastställer valkretsarnas valkretsnämnder hela valresultatet och skriver ut fullmakter åt de nya riksdagsledamöterna. Sedan kan den nya riksdagen påbörja sitt arbete.",url:"/sv/arbetet-i-riksdagen/riksdagsval/vad-hander-da-en-ny-riksdag-satter-igang/",selected:false,targetFrame:"_self",contentLink:"1314"}],relatedContent:[],name:"Riksdagsval",teaserText:"Vid riksdagsval väljs 200 riksdagsledamöter till Finlands riksdag. Riksdagsval hålls vart fjärde år. Följande riksdagsval hålls år 2027.",url:"/sv/arbetet-i-riksdagen/riksdagsval/",selected:false,targetFrame:"_self",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Läromedel om utskotten",teaserText:"På den här sidan har vi samlat läromedel om riksdagsutskotten.",url:"/sv/arbetet-i-riksdagen/laromedel/laromedel-om-utskotten/",selected:false,targetFrame:"_self",contentLink:"48"},{children:[],relatedContent:[],name:"Spela Riksdagsspelet",teaserText:"Riksdagsspelet är ett webbläsarbaserat inlärningsspel där spelaren spelar som en riksdagsledamot. Spelet lämpar sig väl för studier i samhällslära för högstadieelever, men passar också bra för studerande på andra stadiet.",url:"/sv/arbetet-i-riksdagen/laromedel/spela-riksdagsspelet/",selected:false,targetFrame:"_self",contentLink:"49"},{children:[],relatedContent:[],name:"Broschyrer om riksdagen",teaserText:"Riksdagens broschyrer erbjuder information om bland annat riksdagens verksamhet, historia och inledande skede av självständigheten, riksdagens roll i EU-ärenden samt om Riksdagshuset och Riksdagsbiblioteket.",url:"/sv/arbetet-i-riksdagen/laromedel/broschyrer-om-riksdagen/",selected:false,targetFrame:"_self",contentLink:"47"},{children:[],relatedContent:[],name:"Videor som läromedel",teaserText:"Riksdagens arbete visas i direktsändning​ och i videor. Du kan också bekanta dig med arbetet med våra undervisningsvideor och annat videomaterial.",url:"/sv/arbetet-i-riksdagen/laromedel/videor-som-laromedel/",selected:false,targetFrame:"_self",contentLink:"46"},{children:[],relatedContent:[],name:"Så här stiftas lagar i Finland",teaserText:"Riksdagens viktigaste uppgift är att stifta lagar. Läs mer om stegen i lagstiftningsarbetet.",url:"/sv/arbetet-i-riksdagen/laromedel/sa-har-stiftas-lagar-i-finland/",selected:false,targetFrame:"_self",contentLink:"1774"}],relatedContent:[],name:"Läromedel",teaserText:"Riksdagen stödjer demokratifostran samt undervisningen i samhällslära och historia genom att erbjuda läromedel för lektioner och undervisningsplanering.",url:"/sv/arbetet-i-riksdagen/laromedel/",selected:false,targetFrame:"_self",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Statistik om riksdagsärenden",teaserText:"Riksdagen publicerar regelbundet statistik om riksdagsärenden. Riksdagsärenden behandlas i utskott och i plenum. Ett riksdagsärende aktualiseras i riksdagen genom att en riksdagshandling överlämnas. Riksdagshandlingar är till exempel regeringspropositioner, lagmotioner av riksdagsledamöter och medborgarinitiativ.",url:"/sv/arbetet-i-riksdagen/statistik-och-publikationer/statistik-om-riksdagsarenden/",selected:false,targetFrame:"_self",contentLink:"2848"},{children:[],relatedContent:[],name:"Frånvarostatistik över riksdagsledamöterna valperioden 2023–2026",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. ",url:"/sv/arbetet-i-riksdagen/statistik-och-publikationer/franvarostatistik/",selected:false,targetFrame:"_self",contentLink:"2799"}],relatedContent:[],name:"Statistik och publikationer",teaserText:"Riksdagen publicerar statistik och rapporter om riksmöten, riksdagsledamöter och riksdagens organ. Om verksamheten vid riksdagens kansli publiceras årligen också olika rapporter, berättelser och planer.",url:"/sv/arbetet-i-riksdagen/statistik-och-publikationer/",selected:false,targetFrame:"_self",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Besök riksdagen",teaserText:null,url:"/sv/besok-och-delta/besok-riksdagen/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Riksdagsordlistan",teaserText:null,url:"https://mot.kielikone.fi/mot/eduskuntasanasto/netmot?UI=sved&height=151",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Biblioteket och arkivet",teaserText:null,url:"/sv/biblioteket-och-arkivet/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Informationstjänsten",teaserText:null,url:"/sv/informationstjansten/",selected:false,targetFrame:null,contentLink:null}],name:"Arbetet i riksdagen",teaserText:"Riksdagens viktigaste uppgift är att stifta lagar. Riksdagen beslutar också om statsbudgeten, väljer statsminister och övervakar regeringens arbete. Riksdagen godkänner dessutom de viktigaste av de internationella överenskommelser som är bindande för Finland och är med och påverkar i EU-frågor.",url:"/sv/arbetet-i-riksdagen/",selected:false,targetFrame:"_self",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"Självständiga besök",teaserText:null,url:"/sv/besok-och-delta/besok-riksdagen/sjalvstandiga-besok/",selected:false,targetFrame:"_self",contentLink:"52"},{children:[],relatedContent:[],name:"Infocentrum",teaserText:"Evenemang med anknytning till riksdagsarbetet ordnas i Infocentrum i riksdagens sidobyggnad Lilla parlamentet.",url:"/sv/besok-och-delta/besok-riksdagen/infocentrum/",selected:false,targetFrame:"_self",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/sv/besok-och-delta/besok-riksdagen/anvisningar-for-besokare/",selected:false,targetFrame:"_self",contentLink:"56"}],relatedContent:[],name:"Besök riksdagen",teaserText:"Du kan bekanta dig med Riksdagshuset och arbetet i riksdagen på flera olika sätt. Ta plats på läktaren under plenum, delta på en guidad rundvandring eller boka en distanslektion.",url:"/sv/besok-och-delta/besok-riksdagen/",selected:false,targetFrame:"_self",contentLink:"51"},{children:[],relatedContent:[],name:"Riksdagshuset",teaserText:"Beslutet om att bygga Riksdagshuset fattade riksdagen i plenum i mars 1925. Det var arkitekt Johan Sigfrid Sirén som ritade huset. Grunden för bygget på Arkadiabacken lades 1926 och huset stod klart 1931.",url:"/sv/besok-och-delta/riksdagshuset/",selected:false,targetFrame:"_self",contentLink:"1276"},{children:[],relatedContent:[],name:"Se webbsändningar",teaserText:"Riksdagen visar plenum, öppna utfrågningar i utskotten och andra evenemang i direktsändning på webben.",url:"/sv/besok-och-delta/se-webbsandningar/",selected:false,targetFrame:"_self",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Rösta i val",teaserText:"I val väljer vi de personer som ska få bestämma. Genom val väljer vi vem som bestämmer i riksdagen, kommunerna, regionerna, EU-parlamentet och vem som blir Finlands president.",url:"/sv/besok-och-delta/hur-kan-du-paverka/rosta-i-val/",selected:false,targetFrame:"_self",contentLink:"65"}],relatedContent:[],name:"Hur kan du påverka?",teaserText:"Alla har rätt att påverka politiken och besluten i samhället. Du kan rösta i val och välja de personer som ska få bestämma. Du kan också säga vad du tycker när politikerna planerar en ny lag. Det finns många sätt att vara med och påverka.",url:"/sv/besok-och-delta/hur-kan-du-paverka/",selected:false,targetFrame:"_self",contentLink:"64"}],relatedContent:[{children:[],relatedContent:[],name:"Kontakta en riksdagsledamot",teaserText:null,url:"/sv/riksdagsledamoter-och-organ/riksdagsledamoter/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Läs mer om plenum och andra evenemang",teaserText:null,url:"/sv/plenum-och-evenemang/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Öppna data",teaserText:null,url:"/sv/oppna-data/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Fråga om riksdagen",teaserText:null,url:"/sv/fraga-om-riksdagen/",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Biblioteket och arkivet",teaserText:null,url:"/sv/biblioteket-och-arkivet/",selected:false,targetFrame:null,contentLink:null}],name:"Besök och delta",teaserText:"Riksdagshuset är öppet för besökare. Du kan boka plats på en guidad rundvandring genom bokningstjänsten. Riksdagens plenum, utskottens öppna utfrågningar och andra evenemang i riksdagen visas också i direktsändning på webben. Var och en har möjlighet att påverka. Du kan diskutera och berätta din åsikt, då nya lagar planeras.",url:"/sv/besok-och-delta/",selected:false,targetFrame:"_self",contentLink:"50"}],subMenuItems:[],breadcrumbItems:[{name:"Riksdagen",teaserText:null,url:"/sv/",selected:true,t
