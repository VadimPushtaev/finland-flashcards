saan olisivat edelleen lukutaidottomia. Kotoutumispalveluiden uudistuksen olisi tarkoitus tulla voimaan vuoden 2027 alussa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, jatkossakaan luku- ja kirjoitustaidottomalta ei edellytettäisi kirjallista kielitaitoa, millä olisi merkitystä ehdotuksen kohtuullisuuden arvioimisessa. Kielitaidon eri osa-alueet kehittyvät yleensä samallakin henkilöllä eri tahtiin, ja esimerkiksi kirjoittamistaito saavutetaan yleensä viimeisenä (ks. HE 62/2025 vp, s. 53–54). Tämän lisäksi esityksessä huomioitaisiin myös sellaiset tilanteet, joissa yhteiskuntatietoedellytyksen täyttäminen ei olisi mahdollista hakijan terveydentilaan tai vammaisuuteen liittyvän syyn vuoksi. Tietyn ikäisiä henkilöitä yhteiskuntatietoedellytys ei puolestaan koskisi lainkaan, eikä alle 18-vuotiailta ja 65 vuotta täyttäneiltä vaadittaisi kansalaisuuskokeen suorittamista.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suullisen kokeen mahdollisuudesta luku- ja kirjoitustaidottomuuden perusteella säädettäisiin yksiselitteisesti laissa (25 g § 2 mom.). Säännöksestä ilmenisi tarkkarajaisesti ja täsmällisesti, ketä tällainen suullisen kokeen mahdollisuus koskisi. Mahdollisuus suullisen kokeen suorittamiseen luku- ja kirjoitustaidottomuuden vuoksi olisi rajattu kansalaisuuslain 18 b §:n 2 ja 3 momentissa tarkoitetuille alle 65-vuotiaille henkilöille.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoedellytyksen tarkoituksena on edistää kansalaisuuden saamisesta kiinnostuneen henkilön perehtymistä yhteiskunnan perusperiaatteisiin, sääntöihin sekä yksilön oikeuksiin ja velvollisuuksiin. Kotoutumista painottavaa lähestymistapaa voidaan pitää hyväksyttävänä muun muassa eurooppalaisen kansalaisuusyleissopimuksen määräysten näkökulmasta. Myös kansalaisuuslain tarkoituksena (1 §) on yksilön edun ohella huomioida valtion etu, millä voidaan katsoa olevan yhteyttä myös siihen, että henkilöllä on riittävät tiedot yhteiskunnasta. Kotoutuminen ja yhteiskuntatietous muodostaisivat sellaisen hyväksyttävän päämäärän, jonka vuoksi suullisen kokeen suorittamiseen voitaisiin käytännössä edellyttää myös todistetusti luku- ja kirjoitustaidottomilta henkilöiltä alkeistason ylittävää puheen ymmärtämisen taitoa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeeseen liitettävät tavoitteet eivät olisi saavutettavissa vähemmän puuttuvin keinoin, koska kansalaisuuskoetta ja siihen valmistautumiseen käytettävää oppimateriaalia ei voitaisi toteuttaa alkeiskielitaidon tasolle sovitettuna. Tällaiselle tasolle sovitetulla kokeella ei olisi tosiasiallisesti mahdollista mitata perustietoja suomalaisen yhteiskunnan toiminnasta ja yksilön oikeuksista ja velvollisuuksista. Kansalaisuuden hakemiseen sisältyisi uuden yhteiskuntatietoedellytyksen lisäämisen jälkeenkin samanlaiset oikeusturvajärjestelyt kuin nykyisin. Kansalaisuushakemukseen tehdystä kielteisestä päätöksestä voi valittaa hallinto-oikeuteen, ja kansalaisuutta hakenut voi jatkossakin saattaa oman asiansa tuomioistuimen arvioitavaksi.&nbsp;&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta koskevassa ehdotuksessa huomioitaisiin myös tulevaan kokeeseen osallistuvien eri asuinpaikat. Kansalaisuuskokeen järjestämistä koskevia sopimuksia tehtäessä olisi ehdotuksen mukaan otettava huomioon, että koetilaisuuksia olisi tarjolla alueellisesti riittävä määrä. Kansalaisuuskokeen suorittamista varten voitaisiin edellyttää osallistujalta sellaista matkustamista, jota voitaisiin pitää kohtuullisena. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ei ehdoteta muutoksia lasten kuulemiseen. Kansalaisuuslain 5 §:n säännökset lapsen ja huoltajan kuulemisesta säilyvät siten ennallaan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä esitetyn perusteella ehdotettu uusi yhteiskuntatietoedellytys toteutettaisiin yhdenvertaisuus, syrjintäkielto ja perusoikeuksien rajoitusedellytykset huomioiden. Ehdotetun muutoksen ei arvioitaisi muodostuvan kohtuuttomaksi.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yksityiselämän ja henkilötietojen suojaa koskevat perustuslain säännökset\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 10 §:ssä säädetään yksityiselämän suojasta. Pykälän 1 momentin mukaan jokaisen yksityiselämä, kunnia ja kotirauha on turvattu. Henkilötietojen suojasta säädetään tarkemmin lailla. Henkilötietojen suoja kuuluu siten osaksi perustuslain 10 §:n 1 momentilla turvattua yksityiselämän suojaa, ja siitä on säädettävä lailla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunnan (mm. PeVL 14/2018 vp, s. 4–5, PeVL 11/2024 vp, s. 2, PeVL 34/2024 vp, s. 2) mukaan EU:n yleisen tietosuoja-asetuksen (EU) 2016/679 yksityiskohtainen sääntely muodostaa yleensä riittävän säännöspohjan myös perustuslain 10 §:ssä turvatun yksityiselämän ja henkilötietojen suojan kannalta. Henkilötietojen suoja tulee turvata ensisijaisesti tietosuoja-asetuksen ja kansallisen yleislainsäädännön nojalla. Erityislainsäädännön tarpeellisuutta on arvioitava tietosuoja-asetuksessa omaksutun riskiperustaisen lähestymistavan mukaisesti. Mitä suurempi riski henkilötietojen käsittelystä aiheutuu luonnollisen henkilön oikeuksille ja vapauksille, sitä perustellumpana voidaan yksityiskohtaista sääntelyä pitää. Tällä seikalla on merkitystä erityisesti arkaluonteisten tietojen käsittelyn osalta. Arkaluonteisina pidettäviä henkilötietoja ovat esimerkiksi henkilön terveydentilaa tai vammaisuutta koskevat tiedot (PeVL 11/2024 vp, s. 2, PeVL 15/2018 vp, s. 35). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on kiinnittänyt huomiota muun muassa siihen, miten tiedonsaantioikeus sidotaan tietojen välttämättömyyteen (PeVL 15/2018 vp, PeVL 11/2024 vp, s. 4, PeVL 34/2024 vp, s. 3). Perustuslakivaliokunnan (PeVL 15/2018 vp, s. 39, PeVL 17/2016 vp, s. 5–6) mukaan viranomaisen tietojenluovutusmahdollisuus ja tietojensaantioikeus ovat voineet liittyä tietyn tarkoituksen kannalta ”tarpeellisiin tietoihin”, jos tietosisällöt on lueteltu laissa tyhjentävästi. Jos taas tietosisältöjä ei ole tällä tavoin lueteltu, sääntelyyn on pitänyt sisällyttää vaatimus ”tietojen välttämättömyydestä” jonkin tarkoituksen kannalta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">EU:n yleinen tietosuoja-asetus on suoraan sovellettavaa oikeutta, mutta se sisältää tietyiltä osin kansallista liikkumavaraa. Kansallisella lailla voidaan täsmentää henkilötietojen käsittelyn oikeusperustaa ja käsittelyn sisältöä sekä esimerkiksi tiettyjen edellytysten vallitessa poiketa rekisteröidyn oikeuksista. Henkilötietojen käsittelyn lainmukaisuudesta säädetään tarkemmin 6 artiklassa. Asetuksen 9 artiklan nojalla voidaan antaa tarkempia säännöksiä myös erityisiin henkilötietoryhmiin kuuluvien henkilötietojen käsittelystä.&nbsp;Tietosuoja-asetus ja tietosuojalaki sisältävät yksityiskohtaisia säännöksiä mm. henkilötietojen käsittelyn yleisistä periaatteista, rekisterinpitäjän velvollisuuksista ja rekisteröidyn oikeuksista, tietoturvallisuudesta ja henkilötietojen käsittelyn valvonnasta sekä lainvastaisen henkilötietojen käsittelyn seuraamuksista. Tietosuoja-asetukseen sisältyvää kansallista liikkumavaraa on käytetty mm. henkilötietojen käsittelystä maahanmuuttohallinnossa annetussa laissa, jossa on hallintovaliokunnan näkemyksen mukaan otettu asianmukaisesti huomioon EU-oikeudesta johtuvat vaatimukset.\u003Cspan class=\"AlaviiteTeksti\"> HaVM 10/2020 vp, s. 3–5. \u003C/span>&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Henkilötiedoilla tarkoitetaan yleisen tietosuoja-asetuksen 4 artiklan mukaan kaikkia tunnistettuun tai suoraan tai epäsuorasti tunnistettavissa olevaan luonnolliseen henkilöön liittyviä tietoja. Myös Euroopan ihmisoikeustuomioistuin ja EU:n tuomioistuin ovat Euroopan ihmisoikeussopimuksen 8 artiklaa ja EU:n perusoikeuskirjan 7 ja 8 artiklaa koskevassa oikeuskäytännössään katsoneet, että oikeus yksityiselämän kunnioittamiseen henkilötietojen käsittelyssä koskee kaikenlaisia tunnistettua tai tunnistettavissa olevaa luonnollista henkilöä koskevia tietoja. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleisen tietosuoja-asetuksen 4 artiklan mukaan henkilötietojen käsittelyllä tarkoitetaan kaikkia toimintoja, joita kohdistetaan henkilötietoihin joko automaattista tietojenkäsittelyä käyttäen tai manuaalisesti. Rekisterillä tarkoitetaan mitä tahansa jäsenneltyä henkilötietoja sisältävää tietojoukkoa, josta tiedot ovat saatavilla tietyin perustein. Rekisterinpitäjällä tarkoitetaan luonnollista henkilöä tai oikeushenkilöä, viranomaista, virastoa tai muuta elintä, joka yksin tai yhdessä toisten kanssa määrittelee henkilötietojen käsittelyn tarkoitukset ja keinot. Henkilötietojen käsittelijällä tarkoitetaan puolestaan mm. oikeushenkilöä, viranomaista, virastoa tai muuta elintä, joka käsittelee henkilötietoja rekisterinpitäjän lukuun. Henkilötietojen käsittelyä koskeviin periaatteisiin kuuluu 5 artiklan mukaan mm. käyttötarkoitussidonnaisuus, tietojen minimointi, täsmällisyys, säilytyksen rajoittaminen sekä eheys ja luottamuksellisuus. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleisen tietosuoja-asetuksen 6 artiklan mukaan henkilötietojen käsittely on lainmukaista vain tietyin edellytyksin. Artiklan 1 kohdan c alakohta koskee sellaista tilannetta, jossa käsittely on tarpeen rekisterinpitäjän lakisääteisen velvoitteen noudattamiseksi. Kohdan e alakohta koskee puolestaan sellaista tilannetta, jossa käsittely on tarpeen yleistä etua koskevan tehtävän suorittamiseksi tai rekisterinpitäjälle kuuluvan julkisen vallan käyttämiseksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleisen tietosuoja-asetuksen 9 artiklassa säädetään erityisiin henkilötietoryhmiin kuuluvista tiedoista. Tällaisia ovat esimerkiksi terveyttä koskevat tiedot. Tällaisten henkilötietojen käsittely on sallittua ainoastaan tietyissä tilanteissa, joista osa edellyttää myös kansallista lainsäädäntöä. Tarkentavaa sääntelyä tarvitaan artiklan 2 kohdan g alakohdan mukaan silloin, kun käsittely on tarpeen&nbsp;tärkeää yleistä etua koskevasta syystä&nbsp;unionin oikeuden tai jäsenvaltion lainsäädännön nojalla. Käsittelyn mahdollistavan sääntelyn tulee olla oikeassa suhteessa käsittelyn tavoitteeseen nähden, ja siinä tulee noudattaa keskeisiltä osin oikeutta henkilötietojen suojaan. Tässä yhteydessä on myös säädettävä toimenpiteistä, joilla suojataan rekisteröidyn perusoikeudet ja edut. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoedellytystä. Jotta kansalaisuus voitaisiin myöntää hakemuksen perusteella, hakijan olisi jatkossa osoitettava tämän edellytyksen täyttyminen joko suorittamalla ehdotettava uusi kansalaisuuskoe tai vaihtoehtoisesti ylioppilastutkinnolla tai korkeakoulututkinnolla. Kyseessä olisi uusi kansalaistamisen edellytys voimassa olevassa kansalaisuuslaissa jo säädettyjen lisäksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuden saamista koskeviin asioihin liittyvästä henkilötietojen käsittelystä on täydentävää erityissääntelyä henkilötietojen käsittelystä maahanmuuttohallinnossa annetussa laissa. Lain 1 §:n 1 momentin mukaisesti lakia sovelletaan henkilötietojen automatisoituun ja muuhun käsittelyyn, kun henkilötiedot muodostavat tai niiden on tarkoitus muodostaa henkilörekisteri tai sen osa ja henkilötietoja käsitellään muun muassa 2 kohdan mukaisissa Suomen kansalaisuuteen liittyvissä tarkoituksissa. Näihin kuuluvat mm. Suomen kansalaisuuden saamista koskevien asioiden käsittely ja päätöksenteko tällaisissa asioissa. Henkilötietojen käsittelystä maahanmuuttohallinnossa annettua lakia sovelletaan siten kansalaisuushakemusten käsittelyyn, johon ehdotettujen muutosten myötä sisältyisi jatkossa myös yhteiskuntatietoedellytyksen täyttymisen arviointi ja kansalaisuuskokeen suorittamista koskevien tietojen hyödyntäminen kansalaisuushakemusten käsittelyssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä mainitun uuden kansalaistamisen edellytyksen lisäksi tässä esityksessä ehdotetaan, että kansalaisuuslaissa säädettäisiin uudesta kansalaisuuskokeesta ja kansalaisuuskoejärjestelmään liittyvistä viranomaisten ja muiden toimijoiden tehtävistä. Uuden kansalaisuuskoejärjestelmän yleinen hallinto säädettäisiin Maahanmuuttoviraston tehtäväksi. Maahanmuuttovirasto vastaisi kansalaisuuskokeen tietojärjestelmäkokonaisuudesta ja tiedottamisesta sekä koejärjestelmän yleisestä valvonnasta ja kehittämisestä. Kansalaisuuskokeen laatimisesta ja koetilaisuuksien järjestämisestä virasto sopisi ehdotettavat edellytykset täyttävien toimijoiden kanssa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan kansalaisuuskokeen yhteydessä olisi käsiteltävä henkilötietoja, jotta kokeeseen osallistuva henkilö pystyisi hyödyntämään koesuoritustaan sen osoittamiseen, että hän täyttäisi kansalaistamiselle ehdotettavan uuden yhteiskuntatietoedellytyksen. Tarkoituksena on se, että kansalaisuuskoe suoritettaisiin ennen kansalaisuuden hakemista, ellei hakija olisi suorittanut ylioppilastutkintoa tai korkeakoulututkintoa, jolla edellytyksen täyttymisen voisi niin ikään osoittaa. Kansalaisuuskoetta varten kerättävät osallistujien henkilötiedot muodostaisivat rekisterin tai sen osan. Henkilötietoja kerättäisiin nimenomaan kansalaisuuskokeen suorittamista varten. Tietojen käsittelyssä noudatettaisiin yleisen tietosuoja-asetuksen 5 artiklan mukaisia periaatteita, mukaan lukien käyttötarkoitussidonnaisuuden ja tietojen minimoinnin periaatetta. Maahanmuuttovirastolla olisi henkilötietojen käsittelylle tietosuoja-asetuksen 6 artiklan 1 kohdan c alakohdan mukainen käsittelyperuste. Koetilaisuuksien järjestäjillä henkilötietojen käsittely olisi puolestaan tarpeen yleistä etua koskevan tehtävän suorittamiseksi ja perustuisi siten 6 artiklan 1 kohdan e alakohtaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain sääntelyä täydennettäisiin ehdotuksen mukaan siten, että sen 1 §:n 1 momentin 2 kohtaan lisättäisiin maininta kansalaisuuskokeeseen liittyvistä Maahanmuuttoviraston tehtävistä, joihin sisältyisi henkilötietojen käsittelyä. Maahanmuuttovirasto saa 3 §:n 2 momentin 1 kohdan perusteella käsitellä tallentamiaan tietoja lakisääteisten tehtäviensä hoitamiseksi. Tämä koskisi myös kansalaisuuskokeeseen liittyviä henkilötietoja. Maahanmuuttovirasto toimii 3 §:n 3 momentin perusteella ulkomaalaisasioiden asiankäsittelyjärjestelmän rekisterinpitäjänä tallentamiensa tietojen osalta. Virasto toimisi rekisterinpitäjänä myös kansalaisuuskokeen yhteydessä. Lisäksi 3 §:n 4 momentin mukaan Maahanmuuttovirasto vastaa ulkomaalaisasioiden asiankäsittelyjärjestelmästä julkisen hallinnon tiedonhallinnasta annetun lain mukaisesti. Maahanmuuttovirasto vastaisi ulkomaalaisasioiden asiankäsittelyjärjestelmästä myös yhteiskuntatietoedellytykseen ja kansalaisuuskokeeseen liittyviltä osin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 7 §:n 1 momentin perusteella Maahanmuuttovirasto saa käsitellä mm. henkilön yksilöintitietoja ja osaamista kuvaavia tietoja. Maahanmuuttovirasto käsittelisi kansalaisuuskokeen osallistujien henkilötietoja hallinnoidessaan kokeen ilmoittautumisjärjestelmää, maksuliikennettä ja koesuoritusten rekisteröintiä sekä päättäessään mahdollisista järjestyksen rikkomisen tai vilpillisen menettelyn perusteella annettavista seuraamuksista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Erityisiin henkilötietoryhmiin kuuluvia tietoja Maahanmuuttovirasto saa käsitellä 8 §:n perusteella vain, jos käsittely on käsittelytarkoituksen kannalta välttämätöntä. Kansalaisuuskokeeseen ilmoittautuva voisi pyytää Maahanmuuttovirastolta erityisjärjestelyjä kokeen suorittamista varten. Erityisjärjestelyt voisivat tulla kyseeseen kokeeseen osallistuvan henkilön sairauden, vammaisuuden, lukemisen ja kirjoittamisen erityisvaikeuden tai muun näihin rinnastettavan syyn perusteella. Erityisjärjestelyjen myöntämisestä päättäisi Maahanmuuttovirasto. Koska Maahanmuuttoviraston tehtävät kattaisivat myös koetilaisuuksiin tarvittavista erityisjärjestelyistä päättämisen, viraston olisi välttämätöntä käsitellä erityisiin henkilötietoryhmiin kuuluvia tietoja henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 8 §:n mukaisesti. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tietojen poistamisesta säädetään henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 15 §:ssä. Mm. sellaiset henkilötiedot kuin asiakasnumero, nimi, syntymäaika, henkilötunnus ja kansalaisuus poistetaan kymmenen vuoden kuluttua siitä, kun henkilö on kuollut tai saanut Suomen kansalaisuuden tai häneen liittyvien asioiden tiedot on poistettu (1 kohta). Muut kuin 1 kohdassa tarkoitetut henkilötiedot ja henkilöön liittyvien asioiden tiedot poistetaan viimeistään, kun oleskeluoikeuden päättymisestä tai viimeisimmän vireillä olleen asian viimeisestä tiedon merkitsemisestä on kulunut viisi vuotta (2 kohta). Tämä koskisi myös kansalaisuuskokeen suorittamista koskevia tietoja. Kansalaisuuskokeen hyväksytysti suorittaneen ja sittemmin myös kansalaisuuden hakemuksesta saaneen henkilön kansalaisuuskoetta koskevat tiedot poistettaisiin siten viiden vuoden kuluttua kansalaisuuden saamisesta. Erityisiin henkilötietoryhmiin kuuluvat tiedot poistetaan puolestaan heti, kun ne ovat käyneet tarpeettomiksi (3 kohta). Kansalaisuuskokeen erityisjärjestelyjä koskevat tiedot poistettaisiin siten heti, kun ne olisivat kokeen suorittamisen jälkeen käyneet tarpeettomiksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Rekisterinpitäjänä toimisi kansalaisuuskokeen yhteydessä Maahanmuuttovirasto. Koetilaisuuksien järjestäjät toimisivat puolestaan henkilötietojen käsittelijän roolissa. Nämä Maahanmuuttoviraston kanssa sopimuksen tehneet toimijat käsittelisivät henkilötietoja kansalaisuuskokeeseen ilmoittautumisen ja koetilaisuuksien valvonnan yhteydessä. Koetilaisuuksien järjestäjien tiedonsaantioikeudesta säädettäisiin ehdotuksen mukaan kansalaisuuslain 25 e §:n 2 momentissa.\u003Cspan class=\"AlaviiteTeksti\"> Säännöksiä ei sisällytettäisi henkilötietojen käsittelystä maahanmuuttohallinnossa annettuun lakiin, koska koetilaisuuksien järjestäjät eivät olisi maahanmuuttohallinnon viranomaisia. \u003C/span> Koetilaisuuksien järjestäjillä olisi oikeus saada Maahanmuuttovirastolta maksutta ja salassapitosäännösten estämättä koetilaisuuksien järjestämisen kannalta välttämättömät tiedot. Koetilaisuuksien järjestäjät tarvitsisivat tietoja kokeeseen ilmoittautuneista henkilöistä, jotta he voisivat todeta kokeeseen osallistuvien henkilöllisyyden. Tiedot koetilaisuuteen ilmoittautuneista henkilöistä olisivat koetilaisuuden järjestämisen kannalta välttämättömiä. Koetilaisuuden järjestäjällä olisi oikeus saada nämä tiedot Maahanmuuttoviraston ylläpitämästä tietojärjestelmästä. Koetilaisuuksien järjestäjinä toimiviin sovellettaisiin toisaalta viranomaisten toiminnan julkisuudesta annetussa laissa säädettyjä salassapitovelvoitteita.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koetilaisuuksien valmistelun yhteydessä olisi joissakin tilanteissa välttämätöntä käsitellä myös erityisiin henkilötietoryhmiin kuuluvia tietoja, kuten tietoja kokeeseen osallistuvan sellaisesta vammaisuudesta, jonka vuoksi hän tarvitsisi koetilaisuuteen erityisjärjestelyjä kokeen suorittamista varten. Erityisjärjestelyt voisivat tulla kyseeseen kokeeseen osallistuvan henkilön sairauden, vammaisuuden, lukemisen ja kirjoittamisen erityisvaikeuden tai muun näihin rinnastettavan syyn perusteella. Maahanmuuttoviraston myöntämien erityisjärjestelyjen toteutumisesta huolehtisivat koetilaisuuksien järjestäjät. Koetilaisuuden järjestäjän olisi siksi välttämätöntä saada tietoja myös sellaisista esimerkiksi terveydentilaan ja vammaisuuteen liittyvistä seikoista, joiden perusteella koetilaisuuteen osallistuva henkilö tarvitsisi erityisjärjestelyjä. Tältä osin ehdotettava koetilaisuuksien järjestäjän tiedonsaantioikeus kattaisi sellaisia erityisiin henkilötietoryhmiin kuuluvia tietoja, jotka olisivat välttämättömiä erityisjärjestelyjen toteuttamisen kannalta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeeseen liittyvät tehtävät edellyttäisivät siten sitä, että niin Maahanmuuttovirasto kuin koetilaisuuksien järjestäjätkin käsittelisivät eräissä tilanteissa myös erityisiin henkilötietoryhmiin kuuluvia tietoja. Näiden tietojen käsittely olisi välttämätöntä kansalaisuuskokeen suorittamista koskevien erityisjärjestelyjen ja kansalaisuuskokeeseen osallistuvien henkilöiden tarvitsemien kohtuullisten mukautusten toteuttamista varten. Tältä osin olisi kyseessä kansalaisuuden hakemista edeltävä vaihe. Sen lisäksi erityisiin henkilötietoryhmiin kuuluvia tietoja käsiteltäisiin arvioitaessa sitä, olisiko kansalaisuushakemuksen tehneellä perusteita uudesta yhteiskuntatietoedellytyksestä poikkeamiselle. Erityisiin henkilötietoryhmiin kuuluvia tietoja olisi välttämätöntä käsitellä kansalaisuushakemuksen yhteydessä silloin, kun kansalaisuutta hakeva henkilö pyytäisi terveydentilansa tai vammaisuutensa perusteella poikkeamista uudesta yhteiskuntatietoedellytyksestä. Tältä osin kyse olisi kansalaisuushakemuksen käsittelyyn liittyvästä samankaltaisesta poikkeamisharkinnasta kuin esimerkiksi nykyisen kielitaitoedellytyksen yhteydessä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Erityisiin henkilötietoryhmiin kuuluvien tietojen käsittelyn tarkoituksena olisi turvata Suomessa asuville ulkomaalaisille kohtuulliset mahdollisuudet sekä kansalaisuuskokeeseen osallistumiseen että kansalaisuuden saamiseen. Erityisiin henkilötietoryhmiin kuuluvien tietojen käsittely olisi siten tietosuoja-asetuksen 9 artiklan edellyttämällä tavalla oikeassa suhteessa sen tavoitteeseen nähden. Sääntelyn kokonaisuus sisältäisi myös useita 9 artiklan edellyttämiä suojatoimia. Näihin kuuluvat mm. säännökset käsittelyn rajoittamisesta välttämättömään, tarpeettomiksi käyneiden tietojen poistamisesta ja tehtäviin liittyvistä salassapitovelvoitteista. Osana kokonaisuutta ovat niin ikään tietosuojalain 6 §:n 2 momentissa säädetyt suojatoimet, mukaan lukien henkilöstön osaamisesta huolehtiminen ja erilaisten valvontakeinojen toteuttaminen sekä teknisten järjestelmien toimivuuden takaaminen. Kokeeseen tarvittavien erityisjärjestelyjen myöntämisestä päättäisi viranomaisena Maahanmuuttovirasto. Erityisjärjestelyjen toteutus sisältyisi koetilaisuuksien järjestämiseen, joka olisi julkinen hallintotehtävä ja voitaisiin antaa vain ehdotettavat edellytykset täyttävien toimijoiden hoidettavaksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteenvetona voidaan todeta, että tässä esityksessä ehdotettavassa kansalaisuuskoejärjestelmässä huomioitaisiin yksityiselämän suojaan kuuluvasta henkilötietojen suojasta seuraavat vaatimukset. Henkilötietojen suojan toteutumisesta huolehdittaisiin henkilötietojen käsittelystä maahanmuuttohallinnossa annettuun lakiin ja kansalaisuuslakiin ehdotettavilla muutoksilla. Henkilötietojen käsittelystä maahanmuuttohallinnossa annettua lakia täydennettäisiin siten, että sen sääntely kattaisi myös ehdotettavaan kansalaisuuskokeeseen liittyvät Maahanmuuttoviraston tehtävät. Kansalaisuuslakiin lisättäisiin puolestaan säännökset koetilaisuuksien järjestäjien tiedonsaantioikeudesta ja salassapitovelvoitteista. Sellaisia arkaluonteisia henkilötietoja kuin henkilön terveydentilaa tai vammaisuutta koskevia tietoja saisi käsitellä vain silloin, kun se olisi välttämätöntä kansalaisuuskokeeseen liittyvien lakisääteisten tehtävien hoitamiseksi. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oikeusturvaa koskevat perustuslain säännökset\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 21 §:n mukaan jokaisella on oikeus saada asiansa käsitellyksi asianmukaisesti ja ilman aiheetonta viivytystä lain mukaan toimivaltaisessa tuomioistuimessa tai muussa viranomaisessa sekä oikeus saada oikeuksiaan ja velvollisuuksiaan koskeva päätös tuomioistuimen tai muun riippumattoman lainkäyttöelimen käsiteltäväksi. Käsittelyn julkisuus sekä oikeus tulla kuulluksi, saada perusteltu päätös ja hakea muutosta samoin kuin muut oikeudenmukaisen oikeudenkäynnin ja hyvän hallinnon takeet turvataan lailla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oikaisumenettely on perustuslakivaliokunnan mukaan sellainen oikeusturvakeino, joka on valtiosääntöoikeudellisesti merkityksellinen perustuslain 21 §:n 2 momentin mukaisena hyvän hallinnon takeena, ja sen perusteista on siksi säädettävä lailla (PeVL 43/2000 vp, s. 2). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Valittamalla saa oikeudenkäynnistä hallintoasioissa annetun lain 6 §:n 1 momentin perusteella hakea muutosta päätökseen, jolla viranomainen on ratkaissut hallintoasian tai jättänyt sen tutkimatta. Hallintopäätöksen valituskelpoisuuden arvioinnissa kiinnitetään huomiota erityisesti siihen, sisältääkö päätös ratkaisun, jolla on välitön vaikutus jonkun oikeuteen, velvollisuuteen tai oikeudellisesti määriteltyyn etuun (HE 29/2018 vp, s. 73).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamisessa olisi kyse kansalaisuuden hakemista edeltävästä vaiheesta. Koesuorituksen hyväksymisellä tai hylkäämisellä ei olisi välitöntä vaikutusta kenenkään oikeuteen, velvollisuuteen tai oikeudellisesti määriteltyyn etuun. Koesuoritusta koskeva päätös ei siten muodostaisi sellaista hallintopäätöstä, johon olisi voitava hakea muutosta valittamalla. Siihen saisi ehdotuksen mukaan hakea kuitenkin muutosta oikaisuvaatimuksella. Kansalaisuuskoetta koskeva muutoksenhaku järjestettäisiin tältä osin samaan tapaan kuin yleisessä kielitutkinnossa, jonka useat kansalaisuuden hakijat ovat niin ikään suorittaneet ennen kansalaisuushakemuksen tekemistä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslain 13 §:n 1 momentin sanamuodon mukaisesti lähtökohtana on se, että kansalaistamisen edellytysten on täytyttävä hakemusta ratkaistaessa. Tämä tarkoittaa, että kansalaisuuskoe olisi tarkoitus suorittaa ennen kansalaisuuden hakemista samalla tavalla kuin kielitaitoedellytyksen osoittamistapoihin kuuluva yleinen kielitutkinto. Käytännössä kansalaisuuskoe olisi käytävä suorittamassa ennen kansalaisuushakemuksen tekemistä, jotta kansalaisuuskokeen suorituksella pystyisi osoittamaan yhteiskuntatietoedellytyksen täyttymisen. Yleisen kielitutkinnon lailla kansalaisuuskokeen voisi käydä suorittamassa esimerkiksi jo ennen muiden kansalaistamisen edellytysten, kuten asumisajan, täyttymistä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, jos kielitaitoedellytyksen täyttymisen aikoo osoittaa yleisellä kielitutkinnolla, on kielitutkinto käytännössä käytävä suorittamassa ennen kansalaisuushakemuksen jättämistä. Siten tulevan kansalaisuuskokeen suorittaminen rinnastuisi nykyiseen kielikokeeseen siinä, että kielikokeen tapaan kyse olisi kansalaisuuden hakemista edeltävästä vaiheesta. Kansalaisuuskoesuorituksen tarkastelu muistuttaisi tältä osin sitä, miten yleisestä kielitutkinnosta annettua todistusta tarkastellaan nykyisin kansalaisuushakemuksen yhteydessä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleisen kielitutkinnon suoritusta ei arvioida kansalaisuushakemusta koskevassa päätöksessä eikä kansalaisuuspäätöstä koskevassa muutoksenhaussa. Kansalaisuushakemuksen ratkaisemiseen kuuluu sen toteaminen, täyttääkö kansalaisuuden hakija kansalaisuuslain 13 §:n 1 momentissa tarkoitetut kansalaistamisen edellytykset. Kielitaitoedellytyksen täyttymisen voi osoittaa jollakin kansalaisuuslain 17 §:ssä tarkoitetulla tavalla, kuten yleisen kielitutkinnon suorituksella. Jos hakija ei pysty osoittamaan edellytyksen täyttymistä jollakin kansalaisuuslaissa mainitulla tavalla, siirrytään kansalaisuushakemusta käsiteltäessä tarkastelemaan sitä, onko hänen tapauksessaan perusteita tästä edellytyksestä poikkeamiselle. Kansalaisuushakemuksen tai siihen tehtyä päätöstä koskevan muutoksenhaun yhteydessä ei voi valittaa yleisen kielitutkinnon suorituksen arvioinnista tai hylkäämisestä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sanottuun nähden myöskään kansalaisuuskokeen suoritusta ei arvioitaisi kansalaisuushakemusta koskevassa päätöksessä eikä kansalaisuuspäätöstä koskevassa muutoksenhaussa. Uuden yhteiskuntatietoedellytyksen kannalta ratkaisevaa olisi tieto siitä, olisiko hakija suorittanut jonkin laissa mainitun kokeen tai tutkinnon, jolla edellytyksen täyttymisen voisi osoittaa, vai tulisiko asiassa arvioida perusteita yhteiskuntatietoedellytyksestä poikkeamiselle. Kansalaisuushakemukseen tehdystä kielteisestä päätöksestä voi valittaa hallinto-oikeuteen. Kansalaisuuskokeen hylätystä suorituksesta ei sen sijaan voisi valittaa hakiessaan muutosta kansalaisuushakemukseen tehtyyn kielteiseen päätökseen. Siten kummankaan kansalaisuushakemusta edeltävän vaiheen lopputuloksesta, yleisen kielitutkinnon tai kansalaisuuskokeen suorituksen hylkäämisestä, ei voisi valittaa kansalaisuushakemukseen tehtyä päätöstä koskevassa muutoksenhaussa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleiseen kielitutkintoon osallistunut voi hakea suorituksensa arviointia koskevaan päätökseen muutosta yleisistä kielitutkinnoista annetun lain 13 §:n mukaisesti. Kansalaisuuskokeen muutoksenhausta säädettäisiin vastaavalla tavalla kansalaisuuslaissa. Yleisessä kielitutkinnossa arvioijan työ voi osaltaan vaikuttaa lopputulokseen, kun taas kansalaisuuskoe olisi sähköisesti tarkastettava monivalintakoe. Tämä ero yleisen kielitutkinnon ja kansalaisuuskokeen välillä voi jossain määrin vaikuttaa siten, että kansalaisuuskokeeseen liittyvä muutoksenhakutarve jäisi vieläkin pienemmäksi kuin yleisessä kielitutkinnossa, jossa suorituksesta annettu arvio saattaa muuttua uuden arvioinnin perusteella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleisistä kielitutkinnoista annetun lain 13 §:n 3 momentin mukaan tutkinnon tai sen osakokeen suorituksen arviointia koskevaan päätökseen saa vaatia oikaisua yleisten kielitutkintojen tutkintotoimikunnalta. Oikaisuvaatimus on toimitettava tutkintotoimikunnalle 14 päivän kuluessa siitä ajankohdasta, jolloin tutkinnon tai sen osakokeen suorittajalla on ollut tilaisuus saada arvostelun tulokset sekä arvosteluperusteiden soveltaminen omalta kohdaltaan tietoonsa. Muutoin oikaisuvaatimusmenettelyssä sovelletaan, mitä hallintolaissa säädetään. Suorituksen arviointia koskevasta oikaisuvaatimuksesta annettuun päätökseen ei saa hakea muutosta valittamalla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaisuuskokeen tuloksesta voisi tehdä oikaisuvaatimuksen Maahanmuuttovirastolle, joka kansalaisuuskokeen yleisestä hallinnosta vastaavana viranomaisena käsittelisi oikaisuvaatimukset keskitetysti. Jäljempänä kuvatun mukaisesti Maahanmuuttovirasto voisi pyytää kokeen sisällön tulkinnanvaraisuutta koskevasta oikaisuvaatimuksesta lausunnon ehdotetussa 25 f §:ssä tarkoitetulta asiantuntijatoimikunnalta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oikaisuvaatimusmenettely olisi tarpeen ennen kaikkea sen selvittämistä varten, olisiko esimerkiksi jokin tekninen häiriötilanne estänyt kokeen suorittamisen hyväksytysti. Kansalaisuuskoe toteutettaisiin oppimateriaaliin perustuvana monivalintakokeena, johon osallistuva suorittaisi sen valitsemalla kuhunkin kysymykseen oikean vastauksen annetuista vaihtoehdoista. Kansalaisuuskokeen laatijalta edellytettäisiin riittävää asiantuntemusta kansalaisuuskokeen oppimateriaalin, kysymysten ja vastausvaihtoehtojen laatimiseen. Vastausvaihtoehtojen laatimisessa olisi kiinnitettävä huomiota siihen, että oikean vastauksen valitseminen olisi tarpeeksi yksiselitteistä. Ehdotettavan kansalaisuuskokeen hyväksytty suoritus edellyttäisi sitä, että kokeeseen osallistuva valitsisi kokeen kysymyksiin riittävän määrän oikeita vastauksia. Kokeen toteutustapa olisi siten varsin yksinkertainen, ja koetulosten tarkastus toteutettaisiin sähköisesti samaan tapaan kuin esimerkiksi ajokorttia varten suoritettavaan kuljettajantutkintoon kuuluvassa teoriakokeessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamiseen ei liittyisi esimerkiksi itsenäistä vastausten tuottamista ja sitä, että arvioijana toimiva henkilö arvioisi suoritusta siihen tarkoitettujen kriteerien perusteella. Kansalaisuuskokeen tuloksen hyväksyttävyyteen ei siten liittyisi sellaista tulkinnanvaraa kuin esimerkiksi yleisen kielitutkinnon puhumisen ja kirjoittamisen osakokeissa, joissa arvioijana toimiva henkilö arvioi koesuoritusta siihen tarkoitettujen arviointikriteerien perusteella. Tällä perusteella myös kansalaisuuskokeeseen osallistuneen henkilön oikeussuojan tarve jäisi jossain määrin pienemmäksi kuin yleistä kielitutkintoa suorittaneen. Kansalaisuuskoetta varten ei tarvittaisi samanlaista tarkistusarviointia kuin yleisessä kielitutkinnossa. Kansalaisuuskokeen oikaisuvaatimusmenettelyssä ei olisi kyse siitä, että toinen arvioija arvioisi kokeeseen osallistuneen suorituksen uudestaan arviointikriteerien perusteella. Kansalaisuuskokeen oikaisuvaatimusta käsiteltäessä todettaisiin kokeen kysymyksiin valitut oikeat ja väärät vastaukset sekä se, riittäisikö oikeiden vastausten määrä kansalaisuuskokeen hyväksyttyyn suoritukseen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä esitetyistä havainnoista huolimatta joissain tilanteissa oikaisuvaatimukselle voisi ilmetä tarvetta myös monivalintakysymysten tulkinnanvaraisuuden vuoksi. Tällaisten tilanteiden vuoksi ehdotetussa sääntelyssä olisi huomioitava se, että Maahanmuuttovirastolla ei olisi kysymysten ja niiden vastausvaihtoehtojen sisällön arvioimiseen tarvittavaa asiantuntemusta. Kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin laatiminen olisi tarkoitus antaa tehtäväksi muulle toimijalle kuin Maahanmuuttovirastolle juuri siitä syystä, että tällainen tehtävä poikkeaisi viraston nykyisistä tehtävistä ja edellyttäisi sellaista asiantuntemusta, jota esimerkiksi yliopistolla olisi enemmän kuin virastolla. Tällaisen tilanteen varalle tarvittaisiin siksi menettely, jolla turvattaisiin tarvittava asiantuntemus monivalintakysymysten ja niiden vastausvaihtoehtojen sisällön ja tulkinnanvaraisuuden arviointiin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koekysymysten tulkinnanvaraisuuden arviointiin ehdotetaan menettelyä, jossa Maahanmuuttovirasto pyytäisi oikaisuvaatimuksesta lausunnon asiantuntijatoimikunnalta. Oikaisuvaatimuksen käsittely etenisi tällöin seuraavasti. Kokeeseen osallistunut voisi vaatia Maahanmuuttovirastolta koetuloksen oikaisua sillä perusteella, että hänen väärä vastauksensa olisi johtunut monivalintakysymyksen tulkinnanvaraisuudesta, jolloin hänen olisi oikaisuvaatimuksensa perusteluissa yksilöitävä, mitä aihetta koskevaa kysymystä hän pitäisi tulkinnanvaraisena ja mistä syystä. Jos oikaisuvaatimus koskisi tällaista kansalaisuuskokeen sisältöön liittyvää asiaa, virasto pyytäisi asiantuntijatoimikunnalta lausuntoa oikaisuvaatimuksessa viitatun kysymyksen tulkinnanvaraisuudesta ja oikaisuvaatimuksessa esitetyistä perusteluista. Näin turvattaisiin tarvittava asiantuntemus kokeen sisältöä koskevan oikaisuvaatimuksen käsittelyn tueksi. Asiantuntijatoimikunnan jäsenet antaisivat lausuntoa varten näkemyksensä monivalintakysymyksen tulkinnanvaraisuudesta. Kysymyksen ja sen vastausvaihtoehtojen asianmukaisuutta arvioitaisiin myös kansalaisuuskokeen oppimateriaalista ilmenevien tietojen valossa. Jos oikaisuvaatimuksessa yksilöityä monivalintakysymystä olisi toimikunnan asiantuntijalausunnon mukaan pidettävä tulkinnanvaraisena, Maahanmuuttovirasto oikaisisi kokeen tulosta koskevaa päätöstä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Jotta kansalaisuuskokeeseen osallistunut voisi vaatia oikaisua koetulosta koskevaan päätökseen monivalintakokeen joidenkin kysymysten tulkinnanvaraisuuden perusteella, hän tarvitsisi tiedon koesuorituksestaan riittävällä tarkkuudella. Hänen olisi saatava tieto paitsi oikeiden ja väärien vastausten määrästä, myös niiden jakautumisesta kysymysten aiheiden mukaan. Kokeeseen osallistunut tarvitsisi oikaisuvaatimuksen tekemistä ja sen perustelemista varten tiedon erityisesti siitä, mitä aiheita koskeviin kysymyksiin olisi valittu väärät vastaukset. Tällä tavoin suorittaja voisi harkita sitä, olisiko väärin valittujen vastausten taustalla ollut kysymysten ja vastausvaihtojen epäselvä muotoilu. Kokeen kysymyksiä ja vastausvaihtoehtoja ei kuitenkaan sellaisinaan annettaisi kokeeseen osallistuneen käyttöön. Tällainen menettely olisi yhdenmukainen myös yleisten kielitutkintojen ja kuljettajantutkintoon kuuluvan teoriakokeen kanssa, ja sen tarkoituksena olisi niin kokeen luotettavuuden kuin myös kokeeseen osallistuvien yhdenvertaisuuden turvaaminen, kun koekysymysten leviämistä koetilaisuuksien ulkopuolelle pyrittäisiin estämään. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, koesuorituksen hylkäämisessä ei olisi kyse valituskelpoisesta päätöksestä, mutta kansalaisuuskokeen yhteydessä olisi käytössä oikaisuvaatimusmenettely. Mahdollisuus vaatia koetuloksen oikaisua koevastausten aihekohtaista jakautumista koskevan tiedon perusteella merkitsisi erityistä oikeusturvakeinoa sellaiselle henkilölle, joka haluaisi myöhemmin hakea kansalaisuutta. Vaikka koesuorituksesta ei olisi saatavilla kovin yksityiskohtaisia tietoja, oikeiden ja väärien vastausten aihekohtaista jakautumista koskevan tiedon perusteella voisi kuitenkin arvioida monivalintakokeen asianmukaisuutta. Tietoa voisi hyödyntää myös uuteen kokeeseen valmistautumiseen. Sekä koesuoritusta koskevalla tiedolla että oikaisuvaatimusmenettelyn olemassaololla olisi kokeen suorittajan asemaa parantavaa vaikutusta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Julkisuuslain 24 §:n 1 momentin 22 kohdan mukaan salassa pidettäviin viranomaisen asiakirjoihin kuuluvat asiakirjat, jotka sisältävät tietoja pääsy- tai muusta kokeesta tai testistä, jos tiedon antaminen vaarantaisi kokeen tai testin tarkoituksen toteutumisen tai testin käyttämisen vastaisuudessa. Kansalaisuuskokeen monivalintakysymyksiä koskevien tarkkojen tietojen antaminen vaarantaisi kokeen tarkoituksen toteutumisen ja sen käyttämiseen vastaisuudessa. Koekysymysten salassapidolla turvattaisiin erittäin tärkeää yleistä etua, minkä vuoksi kokeeseen osallistunut ei itsekään saisi tarkkoja tietoja omasta koesuorituksestaan. Asianosaisen tiedonsaantia koskevan oikeuden rajoittaminen olisi yhdenmukaista julkisuuslain 11 §:n 2 momentin 1 kohdan kanssa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin ehdotetaan myös oikaisuvaatimuksen maksullisuutta ja käsittelymaksun palauttamista koskevia säännöksiä. Apulaisoikeuskansleri on käsitellyt päätöksessään (OKV/430/70/2024) oikaisuvaatimusten käsittelyn maksullisuutta eri viranomaisissa. Päätöksessä todetaan muun ohella, että kaikissa asioissa, joissa oikaisuvaatimuksen käsittelyn maksullisuudesta oli säädetty, ei ollut kuitenkaan säädetty maksun palauttamisesta tilanteessa, jossa oikaisuvaatimus johtaa sen tekijälle myönteiseen lopputulokseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallintovaliokunta on mietinnössään (HaVM 26/2018 vp, s. 2) todennut viisumihakemusten oikaisuvaatimusten käsittelymaksusta, että sen avulla pyritään varmistamaan tehokas ja viivytyksetön oikeudenhoito sekä hillitsemään ilmeisen perusteettomien oikaisuvaatimusten määrää. Valiokunta on kuitenkin korostanut, että käsittelymaksun periminen ei saa nostaa kohtuuttomasti kynnystä oikaisuvaatimuksen tekemiseen ja tätä kautta johtaa oikeusturvan tosiasialliseen heikentymiseen. Tässä suhteessa valiokunta on pitänyt merkityksellisenä sitä, että maksu palautetaan viisumivelvolliselle, jos oikaisuvaatimus johtaa tälle myönteiseen lopputulokseen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esitettävissä oikaisuvaatimuksen maksullisuutta koskevissa säännöksissä huomioitaisiin edellä mainitut maksun palautusta koskevat seikat. Jos kokeen tulos muuttuisi oikaisuvaatimusmenettelyssä siten, että oikeiden vastausten määrä riittäisi hyväksyttyyn suoritukseen, oikaisuvaatimuksen käsittelymaksu palautettaisiin oikaisua vaatineelle. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oikaisuvaatimusta koskevaan Maahanmuuttoviraston päätökseen ei saisi ehdotuksen mukaan hakea muutosta valittamalla hallintuomioistuimeen. Kansalaisuuskokeen muutoksenhakuun liittyisi siten samanlainen valituskielto kuin yleisen kielitutkinnon muutoksenhaussa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on arvioinut lausuntokäytännössään muutoksenhakukieltoja eri asioissa (mm. PeVL 15/2009 vp, PeVL 2/2009 vp). Se on ottanut kantaa esimerkiksi ylioppilastutkinnon koesuorituksen arvostelua koskevaan muutoksenhakukieltoon eikä ole pitänyt oikeusturvajärjestelyä ongelmallisena perustuslain 21 §:n säännösten kannalta (PeVL 18/2005 vp, s. 2). Valiokunta on oikeusturvan näkökulmasta pitänyt tärkeänä, että ylioppilastutkinnon koesuorituksen arvostelusta on mahdollista hakea tarkastusarvostelua. Merkitystä on niin ikään ollut mm. sillä, että hylätty koesuoritus on mahdollista uusia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tutkintosuorituksiin liittyvää oikaisuvaatimusmenettelyä ja valituskieltoa koskevaa sääntelyä sisältyy myös yliopistolakiin. Valituskiellosta säädetään yliopistolain 84 §:n 2 momentissa, jonka mukaan opintosuoritusten arvostelua ja hyväksilukemista koskevaan oikaisuvaatimusmenettelyssä tehtyyn päätökseen ei saa hakea muutosta valittamalla. Yliopistolainsäädännön uudistusta (HE 7/2009 vp) koskevassa perustuslakivaliokunnan lausunnossa otettiin kantaa myös valituskieltoihin (PeVL 11/2009 vp, s. 8). Valiokunnalla ei ollut huomautettavaa esityksessä ehdotetuista valituskielloista perustuslain 21 §:n näkökulmasta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, koesuorituksen hyväksymisellä tai hylkäämisellä ei olisi välitöntä vaikutusta kenenkään oikeuteen, velvollisuuteen tai oikeudellisesti määriteltyyn etuun eikä koesuoritusta koskeva päätös siten muodostaisi sellaista hallintopäätöstä, johon olisi voitava hakea muutosta valittamalla. Myöskään kansalaisuuskokeen tuloksen oikaisua koskeva Maahanmuuttoviraston päätös ei koskisi välittömästi kokeeseen osallistuneen henkilön oikeutta tai velvollisuutta. Kansalaisuuskokeella olisi merkitystä kansalaisuuden saamisen kannalta siten, että hyväksytyllä koetuloksella voisi osoittaa täyttävänsä kansalaistamiselle ehdotettavan uuden edellytyksen, samoin kuin yleisen kielitutkinnon suorituksella voi osoittaa täyttävänsä voimassa olevan kielitaitoedellytyksen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorituksen hylkäämistä koskeva päätös ei jäisi vaikutuksiltaan lopulliseksi, vaan kokeeseen osallistunut voisi sekä vaatia koesuorituksen hylkäämistä koskevan päätöksen oikaisua että ilmoittautua ja osallistua kansalaisuuskokeeseen uudestaan. Kansalaisuuskokeen järjestämisen osalta esityksessä on todettu, että kansalaisuuskoe olisi järjestettävä riittävän usein siten, että esimerkiksi kokeessa alle hyväksytyn suorituksen jäänyt voisi kohtuullisen ajan kuluttua osallistua kokeeseen uudestaan. Kansalaisuuskokeen suoritusta koskevaa oikaisuvaatimusta arvioisi tarvittaessa myös asiantunteva ja monijäseninen toimikunta. Maahanmuuttovirasto pyytäisi kokeen sisältöä koskevista oikaisuvaatimuksista lausunnon asiantuntijatoimikunnalta, jossa olisi edustettuna kansalaisuuskoejärjestelmän keskeisiä toimijoita. Toimikunnalla olisi laajaa ja kattavaa asiantuntemusta koekysymysten mahdollisen tulkinnanvaraisuuden arviointiin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Valituskielto olisi rajattu koskemaan ainoastaan sellaista kansalaisuuskokeeseen liittyvää päätöstä, jonka Maahanmuuttovirasto olisi antanut kansalaisuuskokeen hylättyä suoritusta koskevan päätöksen oikaisuvaatimuksesta. Muutoin tämän esityksen ehdotuksiin liittyvistä Maahanmuuttoviraston päätöksistä saisi valittaa hallinto-oikeuteen oikeudenkäynnistä hallintoasioissa annetun lain mukaisesti. Esimerkiksi koemaksunpalautuksia ja vilpillisestä menettelystä annettuja seuraamuksia koskeviin Maahanmuuttoviraston päätöksiin voisi hakea muutosta hallinto-oikeusteitse. Hallinto-oikeuden päätöksestä valittaminen edellyttää sitä, että korkein hallinto-oikeus myöntää valitusluvan. Ehdotuksen mukainen valituskielto ei vaikuttaisi lainkaan kansalaisuushakemuksiin tehdyistä päätöksistä valittamiseen, vaan kansalaisuushakemuksiin tehtyihin kielteisiin päätöksiin liittyisi jatkossakin mahdollisuus valittaa hallintotuomioistuimiin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettavan kansalaisuuskokeen suorittamisesta perittäisiin koemaksu. Maksu voitaisiin ehdotuksen mukaan palauttaa kokeeseen ilmoittautuneelle, jos hän olisi estynyt osallistumasta kokeeseen sairautensa vuoksi ja hän olisi ilmoittanut esteestä Maahanmuuttovirastolle ennen koetilaisuutta. Koemaksun palauttamista haettaisiin Maahanmuuttovirastolta, joka tekisi päätöksen mahdollisesta maksunpalautuksesta. Maksunpalautusta koskevasta Maahanmuuttoviraston päätöksestä voisi valittaa hallinto-oikeuteen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto päättäisi myös mahdollisista seuraamuksista, jos kokeen osallistuja rikkoisi järjestystä koetilaisuudessa tai menettelisi siinä vilpillisesti. Maahanmuuttovirasto huolehtisi tällaisessa tilanteessa asian jälkikäteisestä selvittämisestä ja asianosaisen kuulemisesta hallintolain mukaisesti. Järjestyksen rikkomisen perusteella koesuoritus voitaisiin katsoa hylätyksi. Vilpillisen menettelyn, siinä avustamisen tai vilpin yrityksen perusteella koesuoritus voitaisiin niin ikään katsoa hylätyksi, minkä lisäksi asianosainen voisi menettää oikeutensa osallistua kansalaisuuskokeeseen kuuden tai 12 kuukauden ajaksi koepäivästä. Seuraamuksia koskevasta Maahanmuuttoviraston päätöksestä voisi valittaa hallinto-oikeuteen. Päätös voitaisiin kuitenkin ehdotuksen mukaan panna täytäntöön tehdystä valituksesta huolimatta, jollei valitusviranomainen kieltäisi täytäntöönpanoa. Ehdotettu sääntely vastaisi yleisistä kielitutkinnoista annetun lain 6 a §:ssä säädettyä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä on käsitelty kansalaisuuskokeeseen liittyvää muutoksenhakua. Itse kansalaisuushakemukseen tehtyä päätöstä koskevaan muutoksenhakuun ei ehdoteta mitään muutoksia. Jos hakija pyytäisi kansalaisuushakemuksessaan poikkeamista uudesta yhteiskuntatietoedellytyksestä esimerkiksi terveydentilaansa vedoten ja Maahanmuuttovirasto arvioisi, ettei käsillä olisi perusteita edellytyksestä poikkeamiselle, Maahanmuuttoviraston kielteiseen päätökseen voisi jatkossakin hakea muutosta valittamalla hallinto-oikeuteen. Hallinto-oikeuden päätöksestä voi puolestaan valittaa korkeimpaan hallinto-oikeuteen, jos korkein hallinto-oikeus myöntää valitusluvan. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Julkisen hallintotehtävän antaminen muulle kuin viranomaiselle\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 124 §:n mukaan julkinen hallintotehtävä voidaan antaa muulle kuin viranomaiselle vain lailla tai lain nojalla, jos se on tarpeen tehtävän tarkoituksenmukaiseksi hoitamiseksi eikä vaaranna perusoikeuksia, oikeusturvaa tai muita hyvän hallinnon vaatimuksia. Merkittävää julkisen vallan käyttöä sisältäviä tehtäviä voidaan kuitenkin antaa vain viranomaiselle. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain esitöiden (HE 1/1998 vp, s. 178–179) mukaan tarkoituksena on rajoittaa julkisten hallintotehtävien osoittamista varsinaisen viranomaiskoneiston ulkopuolelle. Julkinen hallintotehtävä voidaan antaa muulle kuin viranomaiselle vain lailla ja lain nojalla ja vain säännöksessä tarkoitettujen edellytysten vallitessa. Säännöksen sanamuodolla korostetaan sitä, että julkisten hallintotehtävien hoitamisen tulee pääsääntöisesti kuulua viranomaisille ja että tällaisia tehtäviä voidaan antaa muille kuin viranomaisille vain rajoitetusti. Julkisella hallintotehtävällä viitataan verraten laajaan hallinnollisten tehtävien kokonaisuuteen, johon kuuluu esimerkiksi lakien toimeenpanoon sekä yksityisten henkilöiden ja yhteisöjen oikeuksia, velvollisuuksia ja etuja koskevaan päätöksentekoon liittyviä tehtäviä. Pykälä kattaa sekä viranomaisille nykyisin kuuluvien tehtävien siirtämisen että hallintoon luettavien uusien tehtävien antamisen muille kuin viranomaisille. Lähtökohtana on se, että julkisen hallintotehtävän antamisesta muulle kuin viranomaiselle säädetään lailla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tehtävän antamisen on oltava tarpeen tehtävän tarkoituksenmukaiseksi hoitamiseksi. Perustuslain esitöiden (HE 1/1998 vp, s. 179) mukaan tarkoituksenmukaisuusarvioinnissa tulee hallinnon tehokkuuden ja muiden hallinnon sisäisiksi luonnehdittavien tarpeiden lisäksi kiinnittää erityistä huomiota yksityisten henkilöiden ja yhteisöjen tarpeisiin. Myös hallintotehtävän luonne on otettava huomioon. Siten tarkoituksenmukaisuusvaatimus voi palveluiden tuottamiseen liittyvien tehtävien kohdalla täyttyä helpommin kuin esimerkiksi yksilön tai yhteisön keskeisiä oikeuksia koskevan päätöksenteon kohdalla. Tarkoituksenmukaisuusvaatimus on oikeudellinen edellytys, jonka täyttyminen jää tapauskohtaisesti arvioitavaksi. Perustuslakivaliokunnan mukaan tarkoituksenmukaisuutta on arvioitava tapauskohtaisesti kunkin viranomaisorganisaation ulkopuolelle annettavaksi ehdotetun julkisen hallintotehtävän kohdalla erikseen (PeVL 53/2010 vp, s. 2/II, PeVL 23/2013 vp, s. 3/I). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Julkisen hallintotehtävän antaminen muulle kuin viranomaiselle ei saa vaarantaa perusoikeuksia, oikeusturvaa eikä muita hyvän hallinnon vaatimuksia. Perustuslain esitöiden (HE 1/1998 vp, s. 179/II) mukaan säännös korostaa julkisia hallintotehtäviä hoitavien henkilöiden koulutuksen ja asiantuntemuksen merkitystä sekä sitä, että näiden henkilöiden julkisen valvonnan on oltava asianmukaista. Oikeusturvan ja hyvän hallinnon vaatimukset koskevat ennen muuta julkiseen hallintotehtävään liittyvää päätöksentekoa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 124 §:n viimeisen virkkeen mukaan merkittävää julkisen vallan käyttöä sisältäviä tehtäviä voidaan antaa vain viranomaiselle. Perustuslakivaliokunta (PeVL 14/2013, s. 2) on katsonut esimerkiksi hallinnollisen seuraamuksen määräämiseen sisältyvän merkittävää julkisen vallan käyttöä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta edellytystä, jonka täyttyminen voitaisiin osoittaa suorittamalla ehdotettava uusi kansalaisuuskoe. Kansalaisuuskokeella olisi julkinen luonne, koska sen suorittaminen liittyisi Suomen kansalaisuuden ja siihen liittyvien oikeuksien ja velvollisuuksien saamiseen. Kansalaisuuskokeen toteutukseen liittyvät tehtävät olisivat siten julkisia, ja sääntelyssä on siksi huomioitava perustuslain 124 §:n säännökset. Ehdotuksen mukaan Maahanmuuttovirasto hallinnoisi kansalaisuuskoejärjestelmää, joka toteutettaisiin osittain viraston hankkimina ostopalveluina. Maahanmuuttovirasto tekisi sopimukset niin kansalaisuuskokeen laatimisesta kuin myös koetilaisuuksien järjestämisestä. Kansalaisuuskokeen laatimista koskevaan ostopalveluun sisältyisi laaja valikoima koekysymyksiä vastausvaihtoehtoineen sekä itseopiskeluun sopiva oppimateriaali. Koetilaisuuksien järjestäjien olisi puolestaan tarjottava sähköiselle kansalaisuuskokeelle soveltuvat tilat, puitteet ja valvonta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoejärjestelmän yleinen hallinto ja valvonta kuuluisivat ehdotuksen mukaan Maahanmuuttoviraston eli viranomaisen tehtäviin. Maahanmuuttoviraston tehtävät kattaisivat kansalaisuuskoetta koskevan yleisen viestinnän ja ohjeistuksen kokeeseen osallistuville sekä koetilaisuuksien järjestäjien ohjeistamisen kokeeseen osallistuvien henkilöllisyyden tarkastamisesta. Koetilaisuuteen tarvittavia erityisjärjestelyjä koskevat pyynnöt käsittelisi Maahanmuuttovirasto, joka päättäisi mahdollisten erityisjärjestelyjen myöntämisestä. Jos koetilaisuudessa havaittaisiin häiritsevää tai vilpillistä toimintaa, tapauksen selvittämisestä ja siihen liittyvästä kuulemisesta huolehtisi Maahanmuuttovirasto, jolle kuuluisi myös mahdollisia seuraamuksia koskeva päätöksenteko. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Itse kansalaisuuskokeen ja sen oppimateriaalin laatiminen sekä koetilaisuuksien järjestäminen toteutettaisiin ehdotuksen mukaan siten, että nämä yksittäiset kansalaisuuskokeen täytäntöönpanoon liittyvät tehtävät annettaisiin muille kuin viranomaisille ja Maahanmuuttovirasto viranomaisorganisaationa tekisi sopimukset tällaisten palvelujen ostamisesta lakiin ehdotettavat edellytykset täyttävien toimijoiden kanssa. Tältä osin kansalaisuuskokeen täytäntöönpano muistuttaisi yleisen kielitutkinnon toteutusta, jossa tutkintojärjestelmää hallinnoiva viranomainen tekee niin ikään sopimukset sekä kokeiden laatimisesta että tutkintotilaisuuksien järjestämisestä. Laissa säädettäisiin yksilöidysti kansalaisuuskokeen laatimiseen ja koetilaisuuksien järjestämiseen liittyvien tehtävien antamisesta muulle kuin viranomaiselle. Lakiin tulisi säännöksiä kansalaisuuskokeen laatimisen ja koetilaisuuksien järjestämisen edellytyksistä samoin kuin siitä, mitä näitä tehtäviä hoitavilta toimijoilta vaadittaisiin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että tuleva kansalaisuuskoe laadittaisiin kotoutumislain mukaisessa yhteiskuntaorientaatiossa käytettävän oppimateriaalin pohjalta. Kansalaisuuskokeen taustalla olisi KEHA-keskuksen eli viranomaisen ylläpitämä yhteiskuntaorientaation kouluttajille tarkoitettu oppimateriaali. Kansalaisuuskokeen laatija muokkaisi yhteiskuntaorientaation oppimateriaalista kansalaisuuskoetta varten itseopiskelumateriaalin, jonka kieli sopisi Suomen kansalaisuuteen vaadittavalle taitotasolle (B1 kielitaidon arvioinnin eurooppalaisen viitekehyksen asteikolla). Yhteiskuntaorientaation oppimateriaalin pohjalta muokattava kansalaisuuskokeen oppimateriaali sisältyisi ostopalveluun, jonka Maahanmuuttovirasto viranomaisena hankkisi kansalaisuuskokeen laatijalta. Kansalaisuuskoe toteutettaisiin tietopohjaisena kokeena, jonka monivalintakysymykset perustuisivat yleisesti saatavilla olevan oppimateriaalin tietoihin. Toisin kuin yleisessä kielitutkinnossa, kokeen laatijan tehtäviin kuuluisi siksi myös itseopiskeluun sopivan oppimateriaalin laatiminen kokeeseen valmistautumista varten. Se, että kansalaisuuskokeen oppimateriaali pohjautuisi jo olemassa olevaan yhteiskuntaorientaation oppimateriaaliin, rajoittaisi osaltaan oppimateriaalin laatimista koskevaa tehtävää. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, tarkoituksenmukaisuutta arvioitaessa on perustuslain esitöiden mukaan kiinnitettävä erityistä huomiota yksityisten henkilöiden tarpeisiin. Tästä näkökulmasta merkitystä olisi varsinkin tehtäviin tarvittavalla asiantuntemuksella, jota muilla toimijoilla olisi Maahanmuuttovirastoa enemmän. Myös neutraaliuden ja objektiivisuuden vaatimukset puoltaisivat kokeeseen liittyvien tehtävien antamista muulle toimijalle kuin Maahanmuuttovirastolle, joka on kansalaisuuden myöntämisestä päättävä viranomainen. Tarkoituksenmukaisuuden vaatimuksen kannalta olisi lisäksi merkityksellistä, että muille toimijoille annettavissa tehtävissä olisi kyse palveluiden tuottamisesta, ei sen sijaan yksilön tai yhteisön keskeisiä oikeuksia koskevasta päätöksenteosta. Kansalaisuuskokeen laatiminen ja järjestäminen toteutettaisiin Maahanmuuttoviraston eli viranomaisen hankkimina palveluina. Näihin tehtäviin ei liittyisi yksilön tai yhteisön keskeisiä oikeuksia koskevaa päätöksentekoa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen kysymysten ja vastausvaihtoehtojen sekä oppimateriaalin laatiminen olisi tarkoituksenmukaista antaa tarvittavaa asiantuntemusta edustavan toimijan tehtäväksi. Kansalaisuuskokeen valvottuun suorittamiseen tarvittaisiin puolestaan koetilaisuuksille sopivat tilat ja puitteet sekä tarvittavaa asiantuntemusta ja henkilöstöä koetilaisuuksien järjestämiseen. Koetilaisuuksien järjestäminen olisi tarkoituksenmukaista antaa tehtäväksi tällaiset edellytykset täyttäville toimijoille. Kansalaisuuskokeen laatimista ja järjestämistä koskevat tehtävät poikkeavat luonteeltaan Maahanmuuttoviraston muista tehtävistä. Kansalaisuuskokeen laatiminen ja koetilaisuuksien järjestäminen ehdotetaan siksi toteutettavaksi muun kuin viranomaisen tuottamina palveluina. Yksilön oikeuksia koskevaa päätöksentekovaltaa ei sen sijaan siirrettäisi, vaan koetilaisuuteen tarvittavien erityisjärjestelyjen myöntämisestä ja koetilaisuudessa ilmenneestä vilpillisestä menettelystä annettavista seuraamuksista päättäisi viranomaisena Maahanmuuttovirasto. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Antamalla kansalaisuuskokeen laatiminen ja järjestäminen tehtäväksi muulle kuin viranomaiselle ei vaarannettaisi perusoikeuksia, oikeusturvaa eikä muita hyvän hallinnon vaatimuksia. Kuten edellä on todettu, oikeusturvan ja hyvän hallinnon vaatimukset koskevat perustuslain esitöiden mukaan ennen muuta julkiseen hallintotehtävään liittyvää päätöksentekoa. Kansalaisuuskokeeseen liittyvien hallintopäätösten tekeminen kuuluisi viranomaiselle eli Maahanmuuttovirastolle. Muut kuin viranomaistoimijat eivät sen sijaan tekisi päätöksiä, vaan ne tuottaisivat kansalaisuuskokeen laatimisen ja järjestämisen viranomaisen ostamina palveluina. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Julkisia hallintotehtäviä hoitavien sopivuudesta ja pätevyydestä säädettäisiin samaan tapaan kuin yleisen kielitutkinnon osalta. Säännökset kansalaisuuskokeen laatijalta ja järjestäjiltä vaadittavasta asiantuntemuksesta sekä näiden toimijoiden viranomaisvalvonnasta olisivat samankaltaisia kuin yleisistä kielitutkinnoista annetussa laissa. Yleisten kielitutkintojen laatijalta edellytetään riittävää asiantuntemusta kielitutkintojen laatimiseen (laki yleisistä kielitutkinnoista 2 §). Sääntelyssä on lähtökohtana, että kielitutkintojen laatijana toimii korkeakoulu. Kansalaisuuskokeen laatijalta edellytettäisiin samaan tapaan riittävää asiantuntemusta kansalaisuuskokeen kysymysten, vastausvaihtojen ja oppimateriaalin laatimiseen. Lähtökohtana olisi se, että kokeen ja sen oppimateriaalin laatijana toimisi yliopisto. Yleisten kielitutkintojen järjestäjillä on puolestaan oltava riittävä asiantuntemus ja edellytykset tutkintojen järjestämiseen (laki yleisistä kielitutkinnoista 4 §). Myös kansalaisuuskokeen järjestäjiltä edellytettäisiin riittävää asiantuntemusta ja edellytyksiä koetilaisuuksien järjestämiseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Siinä missä yleisen kielitutkinnon viranomaisvalvonta kuuluu Opetushallitukselle, kansalaisuuskokeen viranomaisvalvonnasta vastaisi Maahanmuuttovirasto. Yleisistä kielitutkinnoista annetun lain 2 §:ssä säädetään tutkintojen hallinnosta. Lainkohdan mukaan yleisestä kielitutkintojärjestelmästä, sen kehittämisestä ja valvonnasta vastaa Opetushallitus. Samankaltaisia yleisiä säännöksiä kansalaisuuskokeeseen liittyvistä Maahanmuuttoviraston tehtävistä lisättäisiin kansalaisuuslain 3 §:ään. Lainkohdassa mainittaisiin kansalaisuuskokeen hallinto, kehittäminen ja valvonta sekä kansalaisuuskokeeseen liittyvien sopimusten tekeminen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatijalle ja järjestäjälle annettavat tehtävät vastaisivat luonteeltaan yleisten kielitutkintojen laatijan ja järjestäjän tehtäviä. Tehtävien samanlaisella luonteella olisi merkitystä myös arvioitaessa niihin liittyvää vastuuta. Perustuslakivaliokunta on lausunnoissaan käsitellyt erilaisiin tehtäviin liittyviä vastuusäännöksiä. Perustuslakivaliokunnan vakiintuneen käytännön mukaan oikeusturvan ja hyvän hallinnon vaatimusten toteutumisen varmistaminen edellyttää mm. sitä, että asioita käsittelevät henkilöt toimivat rikosoikeudellisella virkavastuulla (PeVL 17/2021 vp, s. 20, PeVL 26/2017 vp, s. 49). Rikosoikeudellista virkavastuuta koskevia säännöksiä on pidetty tarpeellisina säädettäessä mm. vakuutusoikeuden sivutoimisten tuomareiden ehdokasasettelusta (PeVL 53/2014 vp, s. 4–5) ja muun kuin virkasuhteisen lääkärin laatimasta tarkkailulähetteestä osana prosessia, joka voi johtaa tahdosta riippumattomaan hoitoon (PeVL 5/2014 vp, s. 2–4). Valiokunta on pitänyt tehtävää julkisen vallan käyttönä ja edellyttänyt täyttä virkavastuuta esimerkiksi tilanteessa, jossa oli kyse vapaaehtoisen meripelastusyhdistyksen päällikön toimimisesta onnettomuuspaikan johtajana (PeVL 24/2001 vp, s. 4).&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yleisistä kielitutkinnoista annetun lain 7 §:ssä säädetään yleisen kielitutkinnon arvioijan rikosoikeudellisesta virkavastuusta. Yleisen kielitutkinnon laatijan ja järjestäjän vastuusta ei sen sijaan ole tällaisia säännöksiä. Kansalaisuuskoe toteutettaisiin ehdotuksen mukaan monivalintakokeena, jolloin erityistä arvioijan tehtävää ei tarvittaisi, vaan koesuorituksen tarkastus toteutettaisiin sähköisesti. Maahanmuuttovirasto vastaisi 3 §:ään lisättäväksi ehdotetun 3 momentin mukaan mm. kansalaisuuskokeen tietojärjestelmäkokonaisuudesta, mukaan lukien koesuoritusten sähköisen tarkastuksen teknisestä toimivuudesta. Kokeen laatija vastaisi puolestaan kokeen kysymysten ja vastausvaihtoehtojen selkeydestä ja oikeiden vastausten yksiselitteisyydestä. Kokeen järjestäjä huolehtisi koetilaisuuksien valvonnasta ja erityisjärjestelyjen toteuttamisesta. Myös erityisjärjestelyin suoritettuna kansalaisuuskoe olisi monivalintakoe, jonka hyväksytty suoritus edellyttäisi sitä, että kokeen kysymyksiin olisi valittu riittävästi oikeita vastauksia.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin ei siten tarvittaisi sääntelyä arvioijan rikosoikeudellisesta virkavastuusta. Kansalaisuuskokeen suorittamisella olisi kuitenkin samanlaista vaikutusta kansalaisuuden saamiseen kuin yleisen kielitutkinnon suorittamisella. Tämä puoltaisi sitä, että kansalaisuuskokeen vastuukysymyksiä koskeva sääntely olisi sellaista kuin yleisistä kielitutkinnoista annetussa laissa. Esityksessä ehdotetaan siksi, että niin kansalaisuuskokeen laatijan kuin myös järjestäjän tehtäviä koskeviin pykäliin tulisi viittaukset rikosoikeudellista virkavastuuta koskeviin säännöksiin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hallinnon yleislakeja sovelletaan mm. niiden soveltamisalaa koskevien säännösten perusteella myös yksityisiin niiden hoitaessa julkisia hallintotehtäviä. Kansalaisuuslaissa olisi tältä osin perusteltua omaksua samanlainen sääntelyratkaisu kuin yleisistä kielitutkinnoissa annetussa laissa. Tämä koskisi myös viranomaisten toiminnan julkisuudesta annetun lain soveltamista kokeen järjestäjään. Yleisistä kielitutkinnoista annetun lain 5 §:n mukaan tutkinnon järjestäjään sovelletaan viranomaisten toiminnan julkisuudesta annettua lakia, kun se käsittelee yleisten kielitutkintojen testimateriaalia. Viittaukset muuhun yleislainsäädäntöön eivät olisi tarpeen myöskään kansalaisuuskokeen osalta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että Maahanmuuttoviraston yhteydessä toimisi asiantuntijatoimikunta, jonka jäsenet edustaisivat kotoutumisen ja koulutuksen asiantuntemusta sekä kansalaisuuskokeen laatijaa ja järjestäjää. Asiantuntijatoimikuntaan voisi kuulua sisäministeriön, työ- ja elinkeinoministeriön sekä opetus- ja kulttuuriministeriön edustajia, minkä lisäksi toimikunnan jäsenissä voisi olla edustettuna näiden ministeriöiden hallinnonalojen toimijoita, kuten KEHA-keskus ja Opetushallitus. Toimikunnan tehtävänä olisi tukea Maahanmuuttovirastoa kansalaisuuskokeen yleisessä kehittämisessä ja hallinnossa. Se antaisi myös oikaisuvaatimuksia koskevia asiantuntijalausuntoja Maahanmuuttovirastolle. Toimikunnan jäsenet edustaisivat laajasti ja kattavasti kansalaisuuskoejärjestelmässä tarvittavaa asiantuntemusta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Asiantuntijatoimikunta seuraisi koetilaisuuksien riittävyyttä sekä kansalaisuuskokeesta annettua palautetta ja koesuorituksia koskevia tilastoja. Koska kansalaisuuskokeen taustalla olisi KEHA-keskuksen ylläpitämä yhteiskuntaorientaation oppimateriaali, jonka pohjalta itseopiskeluun soveltuva kansalaisuuskokeen oppimateriaali laadittaisiin, toimikunta seuraisi myös yhteiskuntaorientaation oppimateriaalin kehitystä. Toimikunta voisi tehdä kansalaisuuskoejärjestelmän kehittämistä koskevia aloitteita Maahanmuuttovirastolle, jonka tehtäviin kansalaisuuskokeen yleinen hallinto ja kehittäminen kuuluisivat. Toimikunnan jäsenistön asiantuntemusta tarvittaisiin myös sellaisten oikaisuvaatimusten käsittelyssä, jotka koskisivat monivalintakysymysten tulkinnanvaraisuutta. Tällaisissa asioissa toimikunnan asiantuntijalausunnolla olisi keskeinen merkitys kokeeseen osallistuneen oikeusturvan toteutumisen kannalta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeeseen liittyvien julkisten hallintotehtävien antaminen toimikunnalle olisi sen jäsenistöllä olevan laajan asiantuntemuksen perusteella tarkoituksenmukaista. Antamalla kuvattuja tehtäviä asiantuntijatoimikunnalle ei vaarannettaisi perusoikeuksia, oikeusturvaa tai muita hyvän hallinnon vaatimuksia. Kansalaisuuskokeeseen liittyvä päätöksenteko kuuluisi viranomaiselle eli Maahanmuuttovirastolle, mukaan lukien sellainen merkittävää julkisen vallan käyttöä sisältävä tehtävä kuin järjestyksen rikkomisen tai vilpillisen menettelyn perusteella annettavista seuraamuksista päättäminen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä esitetyillä perusteilla ehdotus kansalaisuuskokeen laatimista, järjestämistä ja asiantuntijatoimikuntaa koskevaksi sääntelyksi täyttäisi perustuslain vaatimukset, jotka koskevat julkisen hallintotehtävän antamista muulle kuin viranomaiselle.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtionhallinnon toimielimistä säätäminen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 119 §:n 2 momentin mukaan valtionhallinnon toimielinten yleisistä perusteista on säädettävä lailla, jos niiden tehtäviin kuuluu julkisen vallan käyttöä. Yleisillä perusteilla viitataan lähinnä yksikön nimeen, toimialaan sekä pääasiallisiin tehtäviin ja toimivaltuuksiin (HE 1/1998, s. 174/II). Myös toimielimen tosiasiallisen merkityksen vuoksi lailla säätämistä on pidetty asianmukaisena, vaikka toimielimen tehtäviin ei näyttäisikään kuuluvan julkisen vallan käyttöä perustuslain 119 §:n 2 momentin mielessä (PeVL 41/2005 vp., s. 2). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että kansalaisuuskoetta varten perustettaisiin asiantuntijatoimikunta (25 f §). Kyse olisi uudesta asiantuntijaelimestä, joka toimisi Maahanmuuttoviraston yhteydessä ja asettamana ja jonka puheenjohtaja olisi virastosta. Maahanmuuttoviraston lisäksi toimielimen edustus olisi poikkihallinnollista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Asiantuntijatoimikunnan kokoonpanon ja toimikauden lisäksi laissa säädettäisiin toimikunnan tehtävistä, joita voidaan pitää tosiasiallisesti merkittävinä kansalaisuuskokeen luonteen ja kansalaisuuskoejärjestelmän tehtäväjaon näkökulmasta. Asiantuntijatoimikunnan tehtävänä olisi Maahanmuuttoviraston tukeminen kansalaisuuskokeen yleisessä kehittämisessä ja hallinnossa. Lisäksi toimikunta voisi antaa Maahanmuuttovirastolle lausunnon koesuorituksen hylkäämistä koskevan oikaisuvaatimuksen käsittelyn tueksi. Laista ilmenevien yleisten perusteiden lisäksi ehdotus sisältää myös asetuksenantovaltuuden, jonka mukaan asiantuntijatoimikunnan kokoonpanosta, asioiden käsittelystä ja tehtävistä voitaisiin antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtuudet asetuksen antamiseen\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 80 §:ssä säädetään asetuksen antamisesta ja lainsäädäntövallan siirtämisestä. Tasavallan presidentti, valtioneuvosto ja ministeriö voivat antaa asetuksia perustuslaissa&nbsp;tai muussa laissa säädetyn valtuuden nojalla. Lailla on kuitenkin säädettävä yksilön oikeuksien ja velvollisuuksien perusteista sekä asioista, jotka&nbsp;perustuslain&nbsp;mukaan muuten kuuluvat lain alaan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain esitöiden (HE 1/1998 vp, s. 131–132) mukaan asetuksen antaja voidaan valtuuttaa antamaan tarkempia säännöksiä yksilön oikeuksiin ja velvollisuuksiin liittyvistä vähäisistä yksityiskohdista. Valtuuttavan lain on täytettävä perustuslakivaliokunnan lausuntokäytännössä edellytetyt täsmällisyyden ja tarkkarajaisuuden vaatimukset. Lailla on säädettävä myös muuten lain alaan kuuluvista asioista. Viittaus kattaa kaikki asiat, joista perustuslain jonkin säännöksen mukaan on säädettävä lailla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettavan yhteiskuntatietoedellytyksen voisi täyttää muun muassa suorittamalla kansalaisuuskokeen. Uudesta kansalaisuuskokeesta säädettäisiin kansalaisuuslakiin lisättävässä uudessa 3 a luvussa. Osa kansalaisuuskoetta koskevista pykälistä sisältäisi myös asetuksenantovaltuuden. Valtioneuvoston asetuksella voitaisiin ehdotuksen mukaan antaa tarkempia säännöksiä kansalaisuuskokeen sisällöstä, kokeen laatijan ja järjestäjän tehtävistä sekä kansalaisuuskoetta varten asetettavan asiantuntijatoimijakunnan tehtävistä. Asetuksenantovaltuudet olisivat lakiin kulloinkin ehdotettavien perussäännösten yhteydessä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen sisällöstä ja sitä koskevasta asetuksenantovaltuudesta säädettäisiin uudessa 25 a §:ssä. Lakiin ehdotettavien säännösten mukaan kansalaisuuskokeella testattaisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Monivalintakokeen kysymykset perustuisivat yleisesti saatavilla olevaan kansalaisuuskokeen oppimateriaaliin, joka olisi laadittu kotoutumisen edistämisestä annetun lain 25 §:ssä tarkoitetun yhteiskuntaorientaation oppimateriaalin pohjalta. Kokeen kysymykset koskisivat Suomen keskeistä lainsäädäntöä, perus- ja ihmisoikeuksia, yhdenvertaisuutta, sukupuolten tasa-arvoa, Suomen historiaa ja kulttuuria sekä muita kansalaisuuskokeen oppimateriaaliin sisältyviä keskeisiä tietoja. Kansalaisuuskoe suoritettaisiin suomen tai ruotsin kielellä. Koe suoritettaisiin sähköisesti, ellei kokeen sähköiselle toteutukselle olisi estettä. Kansalaisuuskokeen hyväksytty suoritus edellyttäisi sitä, että suurin osa monivalintakokeen vastauksista olisi valittu oikein. Kokeen sisällöstä voitaisiin antaa tarkempia säännöksiä valtioneuvoston asetuksella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatijan tehtävistä ja niihin liittyvästä asetuksenantovaltuudesta säädettäisiin uudessa 25 c §:ssä. Laissa ehdotetaan säädettäväksi, että kokeen laatijan tehtävänä olisi laatia yhteiskuntaorientaation oppimateriaaliin perustuva kansalaisuuskokeen oppimateriaali, valmistella laaja valikoima kansalaisuuskokeen kysymyksiä vastausvaihtoehtoineen suomen ja ruotsin kielellä, huolehtia kokeen oppimateriaalin, kysymysten ja vastausvaihtoehtojen testauksesta, ylläpitämisestä ja kehittämisestä sekä osallistua asiantuntijatoimikunnan toimintaan. Kokeen laatijan tehtävistä ja niitä koskevien sopimusten sisällöstä voitaisiin antaa tarkempia säännöksiä valtioneuvoston asetuksella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen järjestäjän tehtäviä koskevat säännökset ja asetuksenantovaltuus olisivat uudessa 25 e §:ssä. Lakiin ehdotettavien säännösten mukaan kokeen järjestäjän tehtävänä olisi järjestää koetilaisuudet sopimusehtojen mukaisesti, huolehtia koetilaisuuksien valvonnasta, toteuttaa erityisjärjestelyt sekä ilmoittaa Maahanmuuttovirastolle järjestyksen rikkomiseen ja vilpilliseen menettelyyn liittyvistä tilanteista, jotta virasto voisi päättää mahdollisista seuraamuksista. Kokeen järjestäjien tehtävistä ja niitä koskevien sopimusten sisällöstä voitaisiin antaa tarkempia säännöksiä valtioneuvoston asetuksella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston yhteydessä toimivasta asiantuntijatoimikunnasta säädettäisiin uudessa 25 f §:ssä, joka sisältäisi myös toimikuntaa koskevan asetuksenantovaltuuden. Laissa säädettäisiin siitä, että toimikunnan puheenjohtajana toimisi Maahanmuuttoviraston edustaja, varapuheenjohtajana toimisi mahdollisuuksien mukaan kotoutumisen asiantuntemuksen edustaja ja asiantuntijajäsenet edustaisivat lisäksi ainakin koulutuksen asiantuntemusta sekä kansalaisuuskokeen laatijaa ja järjestäjää. Laissa säädettäisiin myös siitä, että toimikunnan tehtävänä olisi tukea Maahanmuuttovirastoa kansalaisuuskokeen yleisessä kehittämisessä ja hallinnoinnissa. Lisäksi laissa säädettäisiin, että toimikunta antaisi Maahanmuuttoviraston pyynnöstä lausunnon kansalaisuuskoetta koskevasta oikaisuvaatimuksesta. Toimikunnan kokoonpanosta, asioiden käsittelystä ja tehtävistä voitaisiin antaa tarkempia säännöksiä valtioneuvoston asetuksella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteenvetona voidaan todeta, että kansalaisuuskokeen sisältöä, kokeen laatijan ja järjestäjän tehtäviä sekä kokeeseen liittyvää asiantuntijatoimikuntaa koskevat asetuksenantovaltuudet olisivat perustuslain vaatimusten mukaisia. Yksilön oikeuksien ja velvollisuuksien perusteista sekä kansalaisuuden myöntämisen edellytyksistä säädettäisiin lailla. Valtioneuvoston asetuksella voitaisiin antaa ainoastaan tarkempia säännöksiä eräistä kansalaisuuskokeen toteutukseen liittyvistä yksityiskohdista.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan säädettäväksi myös koemaksusta (uusi 25 i §). Maksu perustuisi valtion maksuperustelain lähtökohdan mukaisesti omakustannusperiaatteeseen, ja sillä katettaisiin kansalaisuuskoejärjestelmästä aiheutuvia kustannuksia. Koemaksun määrästä säädettäisiin sisäministeriön asetuksessa, joka annetaan vuosittain Maahanmuuttoviraston suoritteiden maksullisuudesta.\u003Cspan class=\"AlaviiteTeksti\"> Myös esimerkiksi vuoden 2026 suoritteiden maksullisuudesta säädetään sisäministeriön asetuksella. \u003C/span> &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lisäksi, että kansalaisuuskokeen suorituksen hylkäämistä koskevaan päätökseen saisi vaatia oikaisua Maahanmuuttovirastolta (uusi 42 §). Oikaisuvaatimuksenkin käsittelymaksusta säädettäisiin Maahanmuuttoviraston suoritteiden maksullisuutta koskevassa sisäministeriön asetuksessa.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansainväliset sopimukset\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Yleismaailmallisen ihmisoikeuksien julistuksen (1948) 15 artiklan mukaan jokaisella on oikeus kansalaisuuteen. Artiklan 2 kappaleen mukaan keltään ei saa mielivaltaisesti riistää kansalaisuutta eikä evätä oikeutta kansalaisuuden vaihtamiseen. Oikeus kansalaisuuteen sisältyy myös useisiin Suomea sitoviin kansainvälisiin sopimuksiin. Esimerkiksi kansalaisoikeuksia ja poliittisia oikeuksia koskevan kansainvälisen yleissopimuksen (SopS 7 ja 8/1976) 24 artiklan 3 kappaleen mukaan jokaisella lapsella on oikeus saada kansalaisuus.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaisuuden myöntämisen edellytyksiin lisättäisiin uusi yhteiskuntatietoedellytys, jonka täyttymisen voisi osoittaa uudella kansalaisuuskokeella tai ylioppilas- tai korkeakoulututkinnolla. Alla käsitellään tarkemmin eri kansainvälisten sopimusten määräyksiä erityisesti kansalaisuuden myöntämisen näkökulmasta.&nbsp;\u003C/p>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yleissopimus lapsen oikeuksista\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Lapsen oikeuksista tehdyssä yleissopimuksessa tarkoitetaan lapsella 1 artiklan mukaan jokaista alle 18-vuotiasta henkilöä, ellei lapseen soveltuvien lakien mukaan täysi-ikäisyyttä saavuteta aikaisemmin. Sopimuksen 2 artiklan 1 kappaleen mukaan sopimusvaltiot kunnioittavat ja takaavat sopimuksessa tunnustetut oikeudet kaikille niiden lainkäyttövallan alaisille lapsille ilman minkäänlaista lapsen, hänen vanhempiensa tai muun laillisen huoltajansa rotuun, ihonväriin, sukupuoleen, kieleen, uskontoon, poliittisiin tai muihin mielipiteisiin, kansalliseen, etniseen tai sosiaaliseen alkuperään, varallisuuteen, vammaisuuteen, syntyperään tai muuhun seikkaan perustuvaa erottelua. Sopimusvaltiot ryhtyvät 2 kappaleen mukaan kaikkiin tarpeellisiin toimiin varmistaakseen, että lasta suojellaan kaikenlaiselta syrjinnältä ja rangaistukselta, jotka perustuvat hänen vanhempiensa, laillisten huoltajiensa tai muiden perheenjäsentensä asemaan, toimintaan, mielipiteisiin tai vakaumuksiin.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimuksen 3 artiklan 1 kappaleen mukaan kaikissa julkisen tai yksityisen sosiaalihuollon, tuomioistuinten, hallintoviranomaisten tai lainsäädäntöelimien toimissa, jotka koskevat lapsia, on ensisijaisesti otettava huomioon lapsen etu. Lapsen oikeuksien komitea on käsitellyt lapsen edun ensisijaisuutta yleiskommentissaan nro 14 vuodelta 2013 (CRC/C/GC/14). Komitea on yleiskommenttinsa 30 kohdassa korostanut, että hallintoviranomaiset tekevät kaikilla hallinnon tasoilla hyvin laaja-alaisia päätöksiä, joihin kuuluvat muun muassa kansalaisuuden myöntämistä koskevat päätökset. Hallintoviranomaisten on tekemissään yksittäisissä päätöksissä arvioitava lapsen etua, jonka on ohjattava päätöksiä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lapsi on 7 artiklan 1 kappaleen mukaan rekisteröitävä heti syntymänsä jälkeen, ja hänellä on syntymästään lähtien oikeus nimeen ja kansalaisuuteen sekä mikäli mahdollista, oikeus tuntea vanhempansa ja olla heidän hoidettavanaan. Sopimusvaltiot takaavat näiden oikeuksien toteutumisen kansallisen lainsäädäntönsä ja asiaankuuluvissa kansainvälisissä asiakirjoissa määriteltyjen velvoitteidensa mukaisesti etenkin silloin, kun lapsi muuten olisi kansalaisuudeton. Sopimusvaltiot sitoutuvat 8 artiklan 1 kappaleen mukaan kunnioittamaan lapsen oikeutta säilyttää henkilöllisyytensä, myös kansalaisuutensa, nimensä ja sukulaissuhteensa niin kuin lainsäädännössä niistä määrätään ilman, että niihin puututaan laittomasti.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimusvaltiot takaavat 12 artiklan mukaan
