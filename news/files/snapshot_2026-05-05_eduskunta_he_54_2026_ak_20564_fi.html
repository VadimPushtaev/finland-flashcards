sti ehdotettua raskaamman. Yksinomaan yhteiskuntatiedon testaamiseen tarkoitetun kansalaisuuskokeen käyttöönotosta voidaan arvioida aiheutuvan selvästi vähemmän kustannuksia. Tämän esityksen ehdotuksia kansalaisuutta varten edellytettävästä yhteiskuntatiedosta ja sen osoittamiseen tarkoitetusta kansalaisuuskokeesta voidaan tästä näkökulmasta pitää perusteltuina. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ulkomaiden lainsäädäntö ja muut ulkomailla käytetyt keinot\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Alla oleva koonti muiden maiden kansalaisuuskokeista perustuu suurelta osin kansalaisuuskokeen käyttöönotosta tehtyyn työryhmän selvitykseen (s. 30–43) ja Euroopan muuttoliikeverkoston kautta toteutetun kyselyn vastauksiin\u003Cspan class=\"AlaviiteKooste\"> Ad-Hoc Query on 2024.5 Citizenship tests as part of naturalisation process (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://home-affairs.ec.europa.eu/document/download/5e80dc8e-541a-4514-a1ec-798d68ce185f_en\">https://home-affairs.ec.europa.eu/document/download/5e80dc8e-541a-4514-a1ec-798d68ce185f_en\u003C/a>\u003C/span>\u003C/span>\u003C/span>. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maan kielellä suoritettavalla kansalaisuuskokeella on yhteyttä myös siihen, minkä tasoista kielitaitoa kansalaisuutta varten vaaditaan. Alla tarkastelluissa maissa edellytetään yleensä sellaista kielitaitoa, joka on tasolla B1 eurooppalaisen kielitaidon arvioinnin viitekehyksen (CEFR)\u003Cspan class=\"AlaviiteTeksti\"> Euroopan neuvoston kehittämässä kielten oppimisen, opetuksen ja arvioinnin yleiseurooppalaisessa kehyksessä on määritelty ja kuvattu kuutta kielitaidon tasoa asteikolla A1–C2. \u003C/span> asteikolla. Asteikon B1-tasolla on kyse itsenäisestä kielenkäyttäjästä, joka kykenee kielitaidollaan selviytymään useimmista tilanteista kielialueella. &nbsp;\u003C/p>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ruotsi\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Ruotsissa ei ole vielä kielitaitoedellytystä eikä kansalaisuuskoetta, mutta näiden käyttöönottoa on selvitetty.\u003Cspan class=\"AlaviiteKooste\"> Krav på kunskaper i svenska och samhällskunskap för svenskt medborgarskap (SOU 2021:2, ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\">https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kansalaisuutta varten vaadittava kielitaidon taso olisi kielen ymmärtämisessä B1 ja kielen tuottamisessa A2. Kielen tuottamisessa riittäisi siten alempi kielitaidon taso.\u003Cspan class=\"AlaviiteTeksti\"> A2-tasolla on kyse perustason kielenkäyttäjästä, jonka kielitaito riittää sosiaaliseen kanssakäymiseen ja lyhyeen kerrontaan. \u003C/span> Kielen ymmärtäminen kattaisi tekstin ja kuullun ymmärtämisen ja kielen tuottaminen taas kirjoittamisen ja puhumisen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe toteutettaisiin Ruotsissa digitaalisena kokeena. Kansalaisuuskokeen kysymykset koskisivat tietoja yhteiskunnasta, ja ne kattaisivat sellaisia aiheita kuin demokratia, maantiede, historia, perinteet, työmarkkinat ja ihmisoikeudet. Kansalaistamisen edellytyksiä koskevan uudemman selvityksen\u003Cspan class=\"AlaviiteKooste\"> Skärpta krav för svenskt medborgarskap (SOU 2025:1, ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/98678c2a40d64ccd9f16e6017923bbce/sou-20251-skarpta-krav-for-svenskt-medborgarskap.pdf\">https://www.regeringen.se/contentassets/98678c2a40d64ccd9f16e6017923bbce/sou-20251-skarpta-krav-for-svenskt-medborgarskap.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> mukaan kansalaisuuskokeen aiheisiin olisi lisättävä myös tiedotusvälineiden rooli yhteiskunnassa sekä lapsen oikeudet osana ihmisoikeuksia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamista edellytettäisiin Ruotsissa 16–66-vuotiailta. Kokeen suorittamisen lisäksi edellytyksen täyttymisen voisi osoittaa myös muilla tavoilla, kuten eräillä koulu- ja kurssitodistuksilla. Edellytyksestä voitaisiin poiketa mm. vammaisuuden perusteella. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yleinen vastuu kokeen toteuttamisesta kuuluisi yliopisto- ja korkeakouluneuvostolle (Universitets- och högskolerådet, UHR).\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\">https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Yliopisto- ja korkeakouluneuvosto vastaisi mm. kokeen kehittämisestä ja tuloksia koskevista päätöksistä. Opetusviraston vastuulla olisi puolestaan kokeen oppimateriaalina toimiva yhteiskuntaopin kirja, johon kokeen kysymykset perustuisivat. Kokeen osallistumismaksuksi on aiemmin suunniteltu 500 Ruotsin kruunua (45 euroa). &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Norja\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Norjan kansalaisuuden saaminen edellyttää B1-tasoista suullista kielitaitoa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe on Norjassa digitaalinen monivalintakoe. Kokeen kysymykset perustuvat aikuisten maahanmuuttajien yhteiskuntaopin opetussuunnitelmaan. Oppimateriaali kokeeseen valmistautumista varten on saatavilla verkkosivuilla\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://samfunnskunnskap.no/en/index.html\">https://samfunnskunnskap.no/en/index.html\u003C/a>\u003C/span>\u003C/span>\u003C/span>, joilla käsitellään mm. Norjan työmarkkinoita ja historiaa. Kansalaisuuskokeen 32 kysymyksestä on vastattava oikein vähintään 24 kysymykseen. Hyväksytty suoritus edellyttää siten sitä, että 75 % vastauksista on oikein.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Norjan kansalaisuuskoe koskee 16–67-vuotiaita. Kansalaisuuskokeen voi korvata norjan kielellä suoritetulla yhteiskuntatestillä, jota edellytetään mm. pysyvän oleskeluluvan saamiseen. Norjan tai saamen kieltä ymmärtävät Pohjoismaan kansalaiset on vapautettu kieli- ja kansalaisuuskokeesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta hallinnoi Norjassa koulutusvirasto (Direktoratet for høyere utdanning og kompetanse).\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://prove.hkdir.no/\">https://prove.hkdir.no/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kansalaisuuskoe suoritetaan asuinkunnan koekeskuksessa, jossa osallistuja käyttää koekeskuksen tietokonetta. Kunnat päättävät kansalaisuuskokeen osallistumismaksun, joka vaihtelee 300–1800 Norjan kruunun (28–170 euron) välillä. Kokeen tulokseen voi hakea muutosta teknisen virheen vuoksi kolmen viikon kuluessa kokeen suorittamisesta. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tanska\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Tanskan kansalaisuutta varten vaadittava kielitaidon taso on B2\u003Cspan class=\"AlaviiteTeksti\"> Taso on ylempi kuin B1. B2-tasolla on kyse sellaisesta itsenäisestä kielenkäyttäjästä, joka pystyy säännölliseen vuorovaikutukseen syntyperäisten kielenpuhujien kanssa. \u003C/span>. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen kysymykset koskevat Tanskan yhteiskuntaa, kulttuuria ja historiaa. Kokeeseen valmistautumista varten on saatavilla oppikirja\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://danskogproever.dk/media/4vbfd0ac/laeremateriale-til-medborgerskabsproeven.pdf\">https://danskogproever.dk/media/4vbfd0ac/laeremateriale-til-medborgerskabsproeven.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span>. Kokeessa on monivalintakysymyksiä ja lisäksi sellaisia kysymyksiä, joihin vastaus on kyllä tai ei. Kokeen 45 kysymyksestä on vastattava oikein vähintään 36:een. Hyväksyttävä suoritus edellyttää siten sitä, että 80 % vastauksista on oikein. Kysymyksistä viisi koskee yhteiskunnan arvoja, ja näihin kysymyksiin on oltava vähintään neljä oikeaa vastausta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Alle 12-vuotiaat kansalaisuutta hakevat lapset on vapautettu kansalaisuuskokeen suorittamisesta. Ruotsin- ja norjankieliset hakijat voivat esittää todistuksen ruotsin- tai norjankielisestä peruskoulusta. Kansalaisuuskokeen suorittamisesta voidaan poiketa sairauden tai alentuneen toimintakyvyn perusteella, jos henkilön ei voida kohtuudella odottaa suoriutuvan kokeesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kokeen laatimisesta huolehtii kansainvälisen rekrytoinnin ja kotoutumisen hallitus (Styrelsen for International Integration og Rekruttering, SIRI).\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://danskogproever.dk/borger/indfoedsretsproeve-statsborgerskab/forberedelse-til-indfoedsretsproeven/ \\l accordion-tidligere-indfodsretsprover\">https://danskogproever.dk/borger/indfoedsretsproeve-statsborgerskab/forberedelse-til-indfoedsretsproeven/#accordion-tidligere-indfodsretsprover\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kansalaisuuskokeen voi suorittaa kielikeskuksessa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://danskogproever.dk/sprogcenter/sprogcentre/\">https://danskogproever.dk/sprogcenter/sprogcentre/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Maksu kokeeseen osallistumisesta on 874 Tanskan kruunua (129 euroa). &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Islanti\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Islannin kansalaisuutta varten vaaditaan A2-tasoista kielitaitoa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Islannissa ei ole käytössä kansalaisuuskoetta.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Saksa\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Saksan kansalaisuuden saamista varten vaadittava kielitaidon taso on B1.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.xn--einbrgerung-whb.de/fragebogen.php\">https://www.xn--einbrgerung-whb.de/fragebogen.php\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen kysymykset koskevat elämää demokratiassa, historiaa ja yhteiskuntaa. Kokeeseen voi valmistautua maahanmuutto- ja pakolaisviraston verkkosivuilla olevien kysymysten avulla. Kyseessä on paperilla suoritettava monivalintakoe. Kokeen 33 kysymyksestä on vastattava oikein 17:ään. Hyväksytty suoritus edellyttää siten sitä, että 52 % vastauksista on oikein. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe ei koske alle 16-vuotiaita. Kokeeseen ei tarvitse osallistua, jos on suorittanut saksalaisen koulun päättötutkinnon. Edellytyksestä voidaan poiketa fyysisen tai psyykkisen sairauden, vammaisuuden tai iän perusteella.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Einbuergerung/einbuergerung-node.html\">https://www.bamf.de/DE/Themen/Integration/ZugewanderteTeilnehmende/Einbuergerung/einbuergerung-node.html\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen hallinnoinnista vastaa liittovaltion maahanmuutto- ja pakolaisvirasto. Kokeen tehtävävalikoiman teknisestä kehittämisestä huolehtii Berliinin Humboldt-yliopiston yhteydessä oleva koulutuksen laadun kehittämisen laitos. Kansalaisuuskokeen voi suorittaa koekeskuksessa. Kokeeseen osallistumisesta suoritetaan 25 euron maksu. Osallistujien henkilöllisyys tarkastetaan ennen koetilaisuuden alkua. Tilaisuudessa on paikalla vähintään yksi valvoja. Jos kokeeseen osallistuja toimii petollisesti tai yrittää petosta, hänen koettaan ei arvostella. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Itävalta\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Itävallan kansalaisuuden saamiseen vaadittava kielitaidon taso on B1.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.staatsbuergerschaft.gv.at/index.php?id=5\">https://www.staatsbuergerschaft.gv.at/index.php?id=5\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen kysymysten aiheet liittyvät ennen kaikkea yhteiskuntaan ja historiaan. Oppimateriaali kokeeseen valmistautumista varten on saatavilla verkkosivuilta maksutta.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.staatsbuergerschaft.gv.at/index.php?id=6\">https://www.staatsbuergerschaft.gv.at/index.php?id=6\u003C/a>\u003C/span>\u003C/span>\u003C/span> Koe on toteutettu kirjallisena monivalintakokeena. Sen 18 kysymyksestä on vastattava oikein vähintään yhdeksään. Hyväksytty suoritus edellyttää siten 50 % oikeita vastauksia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Alle 14-vuotiaalta ei vaadita kansalaisuuskokeen suorittamista. Kansalaisuuskokeen sijaan voi esittää selvityksen suoritetusta 8. luokan historian ja yhteiskuntatieteiden kurssista. Kansalaisuuskokeesta voidaan poiketa terveydentilan tai vamman vuoksi, jos hakija on esittänyt lääkärintodistuksen poikkeamisen perusteesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kokeen järjestämisestä huolehtii osavaltio. Yleiset esimerkiksi koko maan historiaa koskevat kysymykset laatii keskuskomitea. Koe on uudistettu joitakin vuosia sitten yhteistyössä Wienin yliopiston koulutusosaston ja muiden asiantuntijoiden kanssa.\u003Cspan class=\"AlaviiteKooste\"> Pathways to Citizenship for Foreigners in Austria, s. 44–46 (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://publications.iom.int/books/pathways-citizenship-foreigners-austria\">https://publications.iom.int/books/pathways-citizenship-foreigners-austria\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kansalaisuuskokeen suorittamisesta ei peritä maksua. Kokeessa voidaan käyttää erilaisia lomakkeita sen varmistamiseksi, että jokainen osallistuja vastaa kysymyksiin itsenäisesti. Koetilaisuudessa myös valvotaan sitä, että osallistujat tekevät kokeen ilman ulkopuolista apua tai kiellettyjä apuvälineitä. Kiellettyjen keinojen käyttö kokeessa johtaa suorituksen hylkäämiseen. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Alankomaat\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Alankomaiden kansalaisuuden saamiseen vaadittava kielitaidon taso on A2.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://ind.nl/en/dutch-citizenship/becoming-a-dutch-national-through-naturalisation \\l requirements\">https://ind.nl/en/dutch-citizenship/becoming-a-dutch-national-through-naturalisation#requirements\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen aiheena on yhteiskunnan tuntemus. Koe on toteutettu monivalintakokeena. Siihen voi valmistautua harjoituskokeilla tai osallistumalla maksulliseen kotoutumiskoulutukseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamisesta voidaan vapauttaa esimerkiksi sellainen hakija, joka on asunut Alankomaissa 5–16 vuoden iässä vähintään kahdeksan vuotta tai joka on suorittanut tutkinnon Alankomaissa. Edellytyksestä voidaan lisäksi poiketa lääketieteellisistä syistä.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://ind.nl/en/living-in-the-netherlands-with-a-residence-permit/civic-integration-for-more-secure-residence-permit-and-naturalisation\">https://ind.nl/en/living-in-the-netherlands-with-a-residence-permit/civic-integration-for-more-secure-residence-permit-and-naturalisation\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta hallinnoi Alankomaissa koulutusvirasto. Kokeen kysymysten laatimisesta vastaa osaamisen arvioinnin laitos. Kokeen voi suorittaa kuudella eri paikkakunnalla. Kansalaisuuskokeen osallistumismaksu on 50 euroa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://inburgeren.nl/en/paying-for-integration/\">https://inburgeren.nl/en/paying-for-integration/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Jos kokeeseen osallistuja toimii koetilanteessa petollisesti tai aiheuttaa häiriötä, hänen koetuloksensa mitätöidään, minkä lisäksi hän ei saa seuraavan vuoden ajan osallistua kansalaisuuskokeeseen. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ranska\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Ranskan kansalaisuuteen vaadittava kielitaidon taso on aiemmin ollut B1, mutta se on vuoden 2026 alussa nostettu B2:een.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Les-procedures-d-acces-a-la-nationalite-francaise\">https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Les-procedures-d-acces-a-la-nationalite-francaise\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lisäksi Ranskassa on vastikään otettu käyttöön uusi kansalaisuuskoe. Kokeessa on 40 monivalintakysymystä, joihin on valittava yksi oikea vastaus neljästä vaihtoehdosta. Kysymykset koskevat tasavallan periaatteita ja arvoja, instituutioita ja poliittista järjestelmää, oikeuksia ja velvollisuuksia, historiaa, maantiedettä ja kulttuuria sekä elämää ranskalaisessa yhteiskunnassa. Koe suoritetaan sähköisesti 45 minuutin kuluessa. Hyväksytty suoritus edellyttää sitä, että vastauksista 32 (80 %) on oikein. Aiemmin kansalaisuuskoe toteutettiin poliisin tekemänä haastatteluna. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeeseen voi valmistautua tutustumalla Ranskan kansalaisen oikeuksiin ja velvollisuuksiin sekä kansalaisen kirjan\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Le-livret-du-citoyen\">https://www.immigration.interieur.gouv.fr/Integration-et-Acces-a-la-nationalite/La-nationalite-francaise/Le-livret-du-citoyen\u003C/a>\u003C/span>\u003C/span>\u003C/span> ja harjoituskysymysten avulla. Materiaali on yleisesti saatavilla verkkosivuilta. Jos kansalaisuuskoetta ei pysty suorittamaan vammaisuuden tai terveydentilan vuoksi, asiasta on toimitettava lääkärintodistus. Jos kansalaisuus on saatu petollisella menettelyllä, voidaan päättää kansalaisuuden menettämisestä kahden vuoden kuluessa asian havaitsemisesta. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhdistynyt kuningaskunta\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Yhdistyneen kuningaskunnan kansalaisuuteen vaaditaan B1-tasoista kielitaitoa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.gov.uk/english-language\">https://www.gov.uk/english-language\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen aiheina ovat mm. yhteiskunta, historia, hallinto, perustuslaki ja arvot. Kokeen oppimateriaalina on käsikirja, joka on saatavilla myös äänitiedostona. Kokeeseen voi lisäksi valmistautua verkkosivuilla olevien harjoituskysymysten avulla. Koe on toteutettu monivalintakokeena, jonka kysymykset valikoituvat koetilanteessa sattumanvaraisesti. Kokeen 24 kysymyksestä on vastattava oikein 18:aan. Hyväksytty suoritus edellyttää siten sitä, että 75 % vastauksista on oikein. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamista edellytetään 18–65-vuotiailta. Koetta ei kuitenkaan tarvitse tehdä kansalaisuutta varten, jos sen on suorittanut jo pysyvää oleskelulupaa varten. Edellytyksestä voidaan poiketa pitkäaikaisen fyysisen tai psyykkisen sairauden aiheuttaman alentuneen toimintakyvyn perusteella, jos hakija on esittänyt lääkärintodistuksen poikkeamisen perusteesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kokeen voi suorittaa yli 30 koekeskuksessa. Maksu kokeeseen osallistumisesta on 50 puntaa (58 euroa). &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhdysvallat\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Yhdysvaltain kansalaisuuteen vaaditaan englannin kielen suullista ja kirjallista taitoa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.uscis.gov/citizenship/learn-about-citizenship/the-naturalization-interview-and-test\">https://www.uscis.gov/citizenship/learn-about-citizenship/the-naturalization-interview-and-test\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen kysymykset koskevat maan historiaa ja hallintoa. Koe on suullinen, ja siihen voi valmistautua kansalaisuus- ja maahanmuuttoviraston verkkosivuilla olevien kirjan tai harjoituskysymysten avulla. Materiaali on saatavilla eri kielillä. Kokeessa on 20 kysymystä, joista on vastattava oikein kahteentoista.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/2025-civics-test\">https://www.uscis.gov/citizenship-resource-center/naturalization-test-and-study-resources/2025-civics-test\u003C/a>\u003C/span>\u003C/span>\u003C/span> Hyväksytty suoritus edellyttää siten sitä, että 60 % vastauksista on oikein. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamisesta voidaan poiketa hakijan iän, maassa asumisen ajan tai alentuneen toimintakyvyn perusteella.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.11&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kanada\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kanadan kansalaisuuden saamiseen vaaditaan englannin tai ranskan kielen suullista taitoa, mikä tarkoittaa puhumista ja kuullun ymmärtämistä toisella näistä kielistä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen kysymysten aiheena ovat kansalaisten oikeudet ja velvollisuudet sekä maan historia, maantiede, talous, lait ja symbolit. Kokeeseen voi valmistautua maksuttoman kirjan avulla. Kokeessa on monivalinta- ja oikein/väärin -kysymyksiä. Yhteensä 20 kysymyksestä on vastattava oikein 15:een. Hyväksytty suoritus edellyttää siten sitä, että 75 % vastauksista on oikein. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamista edellytetään 18–54-vuotiailta. Luku- ja kirjoitustaidottomille on käytössä suullinen koe. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.2.12&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhteenveto eri maiden kansalaisuuskokeista\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Edellä käsitellyistä vertailumaista suurimmalla osalla on käytössä kansalaisuuskoe. Kansalaisuuskokeiden kysymykset koskevat eri maissa usein paitsi yhteiskuntaa, myös maan historiaa, maantiedettä ja kulttuuria sekä kansalaisen oikeuksia ja velvollisuuksia. Kansalaisuuskoe on useimmissa maissa toteutettu monivalintakokeen muodossa. Kokeeseen valmistautumiseen käytettävä oppimateriaali on useissa maissa saatavilla maksutta kansalaisuuskokeesta huolehtivan toimijan verkkosivuilta. Osalla maista on verkkosivuillaan myös harjoituskysymyksiä. Kansalaisuuskokeen kysymysten määrä vaihtelee vertailumaissa 20:stä 45:een. Hyväksyttävään suoritukseen vaaditaan eri maissa sitä, että vastauksista on oikein 50–80 %. Hyväksyttävän suorituksen alarajojen keskiarvo on tarkastelluissa maissa 68 %. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Useimmissa vertailumaissa lähtökohtana on se, että kansalaisuuden saaminen edellyttää aikuisilta hakijoita kansalaisuuskokeen suorittamista. Joissakin maissa edellytys koskee myös alle 18-vuotiaita. Toisaalta tietyn iän saavuttaneilta ei välttämättä enää vaadita kansalaisuuskokeen suorittamista. Kansalaisuuskokeen voi eri maissa myös korvata esimerkiksi jollakin muulla kokeella, tutkinnolla tai koulutuksella, kuten kyseisessä maassa käydyn koulun päättötutkinnolla tai yhteiskuntatieteiden kurssilla. Iän lisäksi sairaus ja vammaisuus voivat useissa maissa olla perusteena edellytyksestä poikkeamiselle. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vastuu kansalaisuuskokeen toteuttamisesta jakautuu eri maissa yleensä useammalle kuin yhdelle toimijalle. Kokeen yleinen hallinnointi kuuluu usein jollekin virastolle. Itse kokeeseen ja sen kysymyksiin liittyvät tehtävät voivat kuitenkin olla eri toimijalla, jolla on mahdollisesti koulutukseen liittyvää asiantuntemusta. Koetilaisuuksien järjestämisestä voivat huolehtia vielä kokonaan eri toimijat. Kansalaisuuskokeen voi useassa maassa käydä suorittamassa koekeskuksessa. Kokeen osallistumismaksu on useimmiten joitakin kymmeniä euroja, mutta joissakin maissa se ylittää sata euroa. Joissakin maissa ei ole erillistä maksua kokeeseen osallistumisesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Väärinkäytösten ehkäisyyn on eri maissa käytössä useita keinoja. Kokeeseen osallistujien henkilöllisyys tarkastetaan ennen koetilaisuuden alkua. Koekysymykset voidaan esittää eri tavoin sen varmistamiseksi, että jokainen osallistuja vastaa niihin itsenäisesti: kokeessa käytetään esimerkiksi erilaisia lomakkeita tai digitaalisen kokeen kysymykset valikoituvat koetilanteessa sattumanvaraisesti. Koetilaisuudessa on paikalla yksi tai useampi valvoja huolehtimassa siitä, että osallistujat tekevät kokeen ilman ulkopuolista apua tai kiellettyjä apuvälineitä. Jos kokeeseen osallistuja toimii petollisesti tai aiheuttaa häiriötä, hänen suorituksensa hylätään ja häneltä voidaan kieltää uuteen kokeeseen osallistuminen määräajaksi. Jos jälkikäteen havaitaan, että kansalaisuus on saatu toimimalla petollisesti, voidaan päättää kansalaisuuden menettämisestä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Taulukko 8: Kansalaisuuskokeen sisältö eri maissa.&nbsp;\u003C/p>\n      \u003Cdiv id=\"tableID-N10E6C\" class=\"table\">\n       \u003Ctable class=\"vaskitgroup\">\n        \u003Ctbody class=\"tbody\">\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Maa\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kielitaidon taso\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kansalaisuuskokeen aihealueet\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Oppimateriaali\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kokeen muoto\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Ruotsi&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1 ja A2 (ehdotus)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteiskunta, demokratia, historia, ihmisoikeudet (ehdotus)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Opetusviraston laatima oppikirja (ehdotus)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Digitaalinen koe (ehdotus) &nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Norja&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1 &nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteiskuntaoppi&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Verkkokoulutus&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Digitaalinen monivalintakoe&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Tanska&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B2&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteiskunta, kulttuuri, historia&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Oppikirja verkkosivuilla&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Monivalintakoe, myös kyllä / ei -kysymyksiä&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Islanti&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">-&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Saksa&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteiskunta, historia&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kysymykset viraston verkkosivuilla&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Paperinen monivalintakoe&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Itävalta&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteiskunta, historia&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Maksuton oppimateriaali verkkosivuilla&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kirjallinen monivalintakoe&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Alankomaat&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">A2&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteiskunnan tuntemus&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Harjoituskokeet, kotoutumiskoulutus&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Monivalintakoe&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Ranska&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B2&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Historia, yhteiskunta, kulttuuri, kansalaisen oikeudet ja velvollisuudet&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Oppimateriaali verkkosivuilla, harjoituskysymykset&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Monivalintakoe (aiemmin haastattelu)&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhdistynyt kuningaskunta&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">B1&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteiskunta, historia, hallinto, perustuslaki, arvot&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Käsikirja (myös äänitiedostona), harjoituskysymykset&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Monivalintakoe&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhdysvallat&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Perustaso&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Maan historia ja hallinto&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kirja ja harjoituskysymykset verkkosivuilla&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Suullinen koe&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kanada&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Suullinen taito&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kansalaisen oikeudet ja velvollisuudet, maan historia, maantiede, talous, lait, symbolit&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Maksuton kirja&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Monivalintakoe, myös oikein / väärin -kysymyksiä (lukutaidottomille suullinen koe)&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n        \u003C/tbody>\n       \u003C/table>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lausuntopalaute\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lausuntokierros\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Esitysluonnoksesta saatiin lausunto yhteensä 43 taholta. Lausunnon antoivat oikeusministeriö, valtiovarainministeriö, opetus- ja kulttuuriministeriö, työ- ja elinkeinoministeriö, valtioneuvoston oikeuskansleri, eduskunnan oikeusasiamies, yhdenvertaisuusvaltuutetun toimisto, lapsiasiavaltuutetun toimisto, tietosuojavaltuutetun toimisto, Ahvenanmaan maakunnan hallitus, Maahanmuuttovirasto, Opetushallitus, Poliisihallitus, Uudenmaan elinvoimakeskus, työllisyys-, kehittämis- ja hallintokeskus, Helsingin hallinto-oikeus, Helsingin, Espoon, Vantaan ja Turun kaupungit, Ammattikorkeakoulujen rehtorineuvosto Arene ry, Helsingin yliopisto, Jyväskylän yliopisto, Jyväskylän yliopiston koulutuksen tutkimuslaitos, Turun yliopisto, Ylioppilastutkintolautakunta, Elinkeinoelämän keskusliitto EK, Familia ry, Kuurojen Liitto ry, Moniheli ry, Näkövammaisten liitto ry, Pakolaisneuvonta ry, Suomen Asianajajaliitto, Suomi-Seura ry, UNHCR Northern Europe, Vammaisfoorumi ry, Pakolaisneuvonta ry, Suomen Asianajajat, Kirkkohallitus, Keskuskauppakamari, Suomen Paluumuuttajayhdistys ry, Vapaa-ajattelijain liitto ry sekä eräs yksityishenkilö. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Korkein hallinto-oikeus ilmoitti, ettei se anna asiassa lausuntoa. Sosiaali- ja terveysministeriö ja Tuomioistuinvirasto ilmoittivat, että niillä ei ole lausuttavaa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Osa lausunnonantajista kannatti uutta yhteiskuntatietoedellytystä ja kansalaisuuskoetta (mm. Poliisihallitus, Vantaan kaupunki). Osa taas ei pitänyt muutoksia tarpeellisina vaan katsoi, että laissa jo nykyisin olevat kriteerit kansalaistamiselle riittäisivät (mm. Uudenmaan elinvoimakeskus, Suomen Asianajajat, UNHCR). Maahanmuuttovirastoa pidettiin sopivana hallinnoimaan uutta kansalaisuuskoetta (mm. Poliisihallitus, Turun kaupunki). Riittävän rahoituksen turvaamista virastolle pidettiin samalla olennaisena (mm. työ- ja elinkeinoministeriö, Helsingin kaupunki). Kansalaisuuskokeen käyttöönoton tavoiteltua aikataulua pidettiin kireänä (mm. oikeusministeriö, Opetushallitus, Maahanmuuttovirasto). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteiskuntaorientaation sisältöä pidettiin yleisesti sopivana myös kansalaisuuskoetta varten (mm. opetus- ja kulttuuriministeriö, lapsiasiavaltuutettu, Helsingin yliopisto). Yhteiskuntaorientaation oppimateriaalin soveltumisesta itseopiskeluun nousi kuitenkin kysymyksiä (mm. opetus- ja kulttuuriministeriö, työllisyys-, kehittämis- ja hallintokeskus, Maahanmuuttovirasto). Pidettiin keskeisenä, että oppimateriaali olisi saatavilla yleisesti, pysyvästi ja maksutta (mm. oikeusministeriö, Uudenmaan elinvoimakeskus). Yliopiston arvioitiin olevan sopiva toimija kansalaisuuskokeen kysymysten laatijaksi (mm. opetus- ja kulttuuriministeriö, Suomen Asianajajat). Kokeen testaamista ennen sen käyttöönottoa pidettiin tarpeellisena (mm. oikeusministeriö, Uudenmaan elinvoimakeskus, Pakolaisneuvonta ry). Pidettiin myös tärkeänä varmistaa, että koetilaisuuksia järjestettäisiin riittävästi (mm. oikeusministeriö, Uudenmaan elinvoimakeskus, Helsingin yliopisto). Lausunnoissa otettiin lisäksi kantaa siihen, millaisia muutoksia kokeen tulosta koskevaan muutoksenhakuun ja kokeessa ilmenneistä väärinkäytöksistä annettaviin seuraamuksiin tarvittaisiin (mm. oikeusministeriö, oikeuskanslerinvirasto, eduskunnan oikeusasiamies, Suomen Asianajajat). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lausunnoissa korostettiin riittävän kattavien erityisjärjestelyjen merkitystä (mm. oikeusministeriö, Vammaisfoorumi). Osassa lausuntoja nostettiin esiin kysymys siitä, miten kansalaisuuskokeen toteutuksessa huomioitaisiin luku- ja kirjoitustaidottomat henkilöt (mm. työ- ja elinkeinoministeriö, oikeuskanslerinvirasto, Maahanmuuttovirasto, Suomen Asianajajat). Jotkut lausunnonantajat katsoivat, että yhteiskuntatieto voitaisiin osoittaa myös korkeakoulututkinnolla (mm. opetus- ja kulttuuriministeriö, Maahanmuuttovirasto, Helsingin yliopisto) ja ammatillisella koulutuksella (mm. Opetushallitus, Poliisihallitus, Espoon kaupunki). Lausuntopalautteessa käsiteltiin lisäksi mm. tietosuojaa (mm. oikeusministeriö, Tietosuojavaltuutettu) ja kotoutumiseen liittyvien palvelujen merkitystä (mm. Yhdenvertaisuusvaltuutettu, Turun kaupunki). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esitystä muokattiin lausuntopalautteen perusteella siten, että kansalaisuuskokeen sisältöä, kokeen toteutukseen osallistuvia eri toimijoita ja näiden tehtäviä sekä kansalaisuuskokeen korvaamisen tapoja koskevia säännöksiä täydennettiin. Kansalaisuuskokeen oppimateriaalia sekä asiantuntijatoimikuntaa ja muutoksenhakua koskevaa sääntelyä tarkennettiin. Seuraamuksiin liittyviä määräaikoja muutettiin. Yhteiskuntatietoedellytyksestä poikkeamista ja kansalaisuuskokeen erityisjärjestelyjä koskevia perusteluja täsmennettiin. Myös ehdotuksen arvioituja vaikutuksia ja esityksen suhdetta perustuslakiin koskevia perusteluja täydennettiin. Lisäksi esitykseen tehtiin eräitä muita täsmennyksiä. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">6.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lainsäädännön arviointineuvosto\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Lainsäädännön arviointineuvosto antoi esityksen luonnoksesta lausunnon 26.3.2026. Arviointineuvosto katsoi, että esitysluonnos täytti hyvin lainvalmistelun vaikutusarviointiohjeen vaatimukset. Arviointineuvoston mukaan kansalaisuuskoetta koskeva esitysluonnos oli rakenteeltaan selkeä, ja siitä sai hyvän käsityksen asian taustasta, tavoitteista ja keskeisistä ehdotuksista. Esitysluonnoksessa oli tunnistettu monipuolisesti eri vaikutuslajeja, ja vaikutuksia tarkasteltiin myös olennaisten kohderyhmien näkökulmasta. Vaikutusarvioinnissa tulisi käsitellä täsmällisemmin esitettyjen arvioiden keskeisiä epävarmuuksia ja oletuksia, esimerkiksi kustannuksiin, uusintakokeisiin, osallistumismaksuihin ja hakemiskäyttäytymiseen liittyen. Lisäksi esityksessä tulisi arvioida tarkemmin hakijoille aiheutuvia käytännön vaikutuksia, kuten kustannuksia, ajankäyttöä, valmistautumisen vaatimuksia ja mahdollisia uusintakokeista aiheutuvia rasitteita.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Arviointineuvoston lausunnon perusteella vaikutusarviointiin liittyvää epävarmuutta on yleisesti pyritty huomioimaan tarkemmin. Arvioita kotitalouksiin kohdistuvista vaikutuksista täydennettiin huomioilla koemaksuista, uusintakokeista ja kokeeseen liittyvästä ajankäytöstä. Myös sukupuolten tasa-arvon sekä perus- ja ihmisoikeusvaikutusten toteutumista koskevia arvioita täsmennettiin ja havainnollistettiin. Toimeenpanoa ja seurantaa koskevaan jaksoon (10) täydennettiin lisäksi, mitä tilasto- ja muita tietoja lain voimaantulon jälkeen tultaisiin erityisesti seuraamaan. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Säännöskohtaiset perustelut\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuuslaki\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">3 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Maahanmuuttoviraston tehtävät. \u003C/span>Pykälässä säädetään kansalaisuuslakiin liittyvistä Maahanmuuttoviraston tehtävistä. Näitä ovat 1 momentin mukaan Suomen kansalaisuuden saamisesta, säilyttämisestä ja menettämisestä sekä kansalaisuusaseman määrittämisestä päättäminen, minkä lisäksi virastolle kuuluu 2 momentin mukaan kansalaisuushakemusta ja -ilmoitusta varten tarvittavien lomakkeiden kaavojen vahvistaminen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälään ehdotetaan lisättäväksi uusi 3 momentti, jossa säädettäisiin Maahanmuuttoviraston uusista kansalaisuuskokeeseen liittyvistä tehtävistä. Näitä olisivat kansalaisuuskokeen yleinen hallinto, tiedottaminen, kehittäminen, valvonta ja tietojärjestelmäkokonaisuudesta vastaaminen sekä kansalaisuuskokeen laatimista ja järjestämistä koskevien sopimusten tekeminen. Maahanmuuttovirasto huolehtisi viranomaisena niin uuden kansalaisuuskoejärjestelmän yleisestä hallinnosta, tiedottamisesta ja tietojärjestelmäkokonaisuudesta kuin myös sen yleisestä valvonnasta ja kehittämisestä. Kansalaisuuskokeen laatimisesta ja koetilaisuuksien järjestämisestä virasto tekisi sopimuksia ehdotettavat edellytykset täyttävien toimijoiden kanssa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston viranomaistehtävät kattaisivat kansalaisuuskoetta koskevan yleisen viestinnän, kokeen maksuliikenteen hoitamisen, tarvittavasta tietojärjestelmäkokonaisuudesta huolehtimisen ja mahdollisista erityisjärjestelyistä päättämisen. Virasto tiedottaisi verkkosivuillaan kokeeseen valmistautumisessa käytettävästä oppimateriaalista, kokeeseen ilmoittautumisesta sekä henkilöllisyyden osoittamisesta koetilaisuuden yhteydessä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto perisi ilmoittautumisen yhteydessä maksun kokeeseen osallistumisesta ja päättäisi mahdollisesta maksujen palauttamisesta. Kokeen osallistumismaksusta ja sen palauttamisen edellytyksistä ehdotetaan säädettäväksi uudessa 25 i §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto vastaisi koetta varten tarvittavasta tietojärjestelmäkokonaisuudesta. Virasto huolehtisi siitä, että kansalaisuuskoejärjestelmässä olisi toiminnot kansalaisuuskokeeseen ilmoittautumiseen ja kokeen osallistumismaksun suorittamiseen sekä oppimateriaalin pohjalta laaditun sähköisen monivalintakokeen suorittamiseen ja koesuoritusten tarkastukseen. Virasto vastaisi koesuoritusten rekisteröinnistä ja kokeen suorittamista koskevan tiedon hyödyntämisestä kansalaisuushakemusten käsittelyssä. Viraston olisi huolehdittava myös siitä, että kokeeseen osallistumiseen liittyvät eri vaiheet olisi toteutettu kokeen suorittajan näkökulmasta saavutettavalla tavalla.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto käsittelisi koetilaisuuteen tarvittavia erityisjärjestelyjä koskevat pyynnöt ja päättäisi mahdollisten erityisjärjestelyjen myöntämisestä. Kokeen suorittamista koskevista erityisjärjestelyistä ehdotetaan säädettäväksi uudessa 25 g §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhtenä kansalaisuuskokeeseen liittyvänä Maahanmuuttoviraston tehtävänä laissa mainittaisiin valvonta. Virasto ohjeistaisi keskitetysti kansalaisuuskokeen järjestäjiä kokeeseen osallistuvien henkilöllisyyden toteamisesta ja koetilaisuuksien valvonnasta. Jos koetilaisuudessa havaittaisiin häiritsevää tai vilpillistä toimintaa, tapauksen selvittämisestä ja siihen liittyvästä kuulemisesta huolehtisi Maahanmuuttovirasto. Virasto päättäisi mahdollisesta koesuorituksen hylkäämisestä. Se päättäisi myös tilapäisestä osallistumiskiellosta ja huolehtisi kiellon toteutumisesta esimerkiksi merkitsemällä sen ilmoittautumisessa käytettävään tietojärjestelmään. Järjestyksen rikkomisen ja vilpillisen menettelyn perusteella annettavista seuraamuksista ehdotetaan säädettäväksi uudessa 25 h §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto vastaisi niin ikään kansalaisuuskokeen kehittämisestä. Virastolla olisi kokeen yleisestä hallinnosta ja siihen liittyvästä tietojärjestelmäkokonaisuudesta vastaavana viranomaisena käytössään erilaisia tilasto- ja muita tietoja, joita kokeen kehittämisessä voitaisiin hyödyntää. Kokeen yleistä kehittämistä varten viraston yhteydessä toimisi myös asiantuntijatoimikunta, jonka puheenjohtaja olisi Maahanmuuttovirastosta. Asiantuntijatoimikunnasta ehdotetaan säädettäväksi uudessa 25 f §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Laissa mainittaisiin Maahanmuuttoviraston tehtävänä myös sopiminen kansalaisuuskokeen laatimisesta ja järjestämisestä. Kansalaisuuskoejärjestelmä toteutettaisiin osittain viraston hankkimina ostopalveluina. Kansalaisuuskokeen laatiminen ja koetilaisuuksien järjestäminen poikkeavat luonteeltaan Maahanmuuttoviraston muista tehtävistä. Siksi olisi tarkoituksenmukaista antaa kyseiset tehtävät sellaisten toimijoiden hoidettaviksi, joilla olisi niitä varten tarvittavaa asiantuntemusta sekä sopivat tilat ja puitteet. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Virasto sopisi kansalaisuuskokeen laatimisesta ja järjestämisestä tietyt edellytykset täyttävien toimijoiden kanssa. Kansalaisuuskokeen laatimista koskevaan ostopalveluun sisältyisi laaja valikoima koekysymyksiä vastausvaihtoehtoineen sekä kokeen oppimateriaalin laatiminen. Koetilaisuuksien järjestäjien olisi puolestaan tarjottava sähköiselle kansalaisuuskokeelle soveltuvat tilat, puitteet ja valvonta. Kansalaisuuskokeen laatimisesta ehdotetaan säädettäväksi uudessa 25 b §:ssä ja kansalaisuuskokeen laatijan tehtävistä uudessa 25 c §:ssä. Kansalaisuuskokeen järjestämisestä ehdotetaan puolestaan säädettäväksi uudessa 25 d §:ssä ja koetilaisuuksien järjestäjän tehtävistä uudessa 25 e §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan myös henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain muuttamista siten, että sen sääntely kattaisi ehdotettavaan kansalaisuuskokeeseen liittyvät Maahanmuuttoviraston tehtävät, joihin sisältyisi henkilötietojen käsittelyä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">13 §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Kansalaistamisen yleiset edellytykset\u003C/span>. Pykälässä säädetään niistä edellytyksistä, joilla ulkomaalaiselle myönnetään Suomen kansalaisuus hakemuksesta. Kansalaistamisen yleisiin edellytyksiin kuuluu voimassa olevan lain mukaan muun muassa asumisaika-, nuhteettomuus- ja kielitaitoedellytys. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 1 momenttiin ehdotetaan lisättäväksi uusi 7 kohta, jossa säädettäisiin uudesta yhteiskuntatietoedellytyksestä. Momentin 5 ja 6 kohtia muutettaisiin samalla teknisluonteisesti siten, että 5 kohdasta poistettaisiin ”ja”-sana ja 6 kohdan lopussa oleva piste korvattaisiin puolipisteellä, jonka jälkeen lisättäisiin ”ja”-sana.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Eurooppalaisen kansalaisuusyleissopimuksen 6 artiklan 3 kappaleen mukaan kukin sopimusvaltio säätää valtionsisäisessä lainsäädännössään mahdollisuudesta kansalaistaa henkilöt, jotka asuvat laillisesti sen alueella. Sopimusvaltio ei säädä kansalaistamisen edellytykseksi yli kymmenen vuoden oleskelua valtion alueella ennen hakemuksen jättämistä. Sopimuksen perustelumuistion (s. 9) mukaan sopimusvaltio voi asumisajan lisäksi edellyttää kansalaistamista varten esimerkiksi kotoutumista. Useassa muussa maassa kansalaisuuden saamista varten edellytetään kansalaisuuskokeen suorittamista tai muutoin vastaavien tietojen osoittamista esimerkiksi suoritetulla koulutuksella. Kansalaisuuskokeet sisältävät yleensä erilaisia yhteiskuntaa koskevia kysymyksiä. Yhteiskuntatietoedellytys lisättäisiin myös hakemuksesta myönnettävän Suomen kansalaisuuden edellytykseksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan edellytyksen myötä kansalaisuuden saamista varten vaadittaisiin yhteiskuntaa koskevien tietojen osoittamista. Jotta Suomen kansalaisuus voitaisiin myöntää hakemuksen perusteella, hakijan olisi pitänyt osoittaa hankkineensa perustiedot suomalaisen yhteiskunnan toiminnasta ja yksilön oikeuksista ja velvollisuuksista. Uusi edellytys täydentäisi kansalaistamiselle voimassa olevassa laissa säädettyjä edellytyksiä ja ilmentäisi osaltaan ajatusta maan keskeisten olosuhteiden tuntemisesta ennen kansalaisuuden saamista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Uuden edellytyksen sisältönä olisi suomalaista yhteiskuntaa koskeva tieto, jonka osoittamisesta ehdotetaan säädettäväksi uudessa 17 b §:ssä. Yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa muun muassa suorittamalla hyväksytysti uuden kansalaisuuskokeen, josta ehdotetaan säädettäväksi uudessa 3 a luvussa. Kansalaisuuskokeen kysymykset perustuisivat yleisesti saatavilla olevaan oppimateriaaliin, ja kokeessa testattaisiin oppimateriaaliin sisältyvien keskeisten tietojen hallintaa. Edellytyksen voisi siten täyttää valmistauduttuaan kokeeseen kansalaisuuskokeen oppimateriaalia opiskelemalla. Kansalaisuuden hakemisesta kiinnostunut pystyisi myös itse arvioimaan ja ennakoimaan edellytyksen täyttymistä vertaamalla omia tietojaan oppimateriaaliin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vaadittavana tasona olisi riittävät tiedot, millä tarkoitettaisiin keskeisiä ja perustavanlaatuisia tietoja suomalaisesta yhteiskunnasta ja yksilön oikeuksista ja velvollisuuksista. Kyse ei olisi hyvin pieniä yksityiskohtia koskevista tiedoista, vaan kansalaisuutta varten olisi perusteltua edellyttää pikemminkin sellaisia tietoja, joita voitaisiin pitää tarpeellisina tulevalle Suomen kansalaiselle. Niin kansalaisuuskokeen oppimateriaalilla kuin myös sen perusteella laadittavilla koekysymyksillä olisi keskeinen merkitys sopivan vaatimustason kannalta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellytykseen sisältyisi se, että tiedot suomalaisesta yhteiskunnasta olisi osoitettu kansalaisuuden saamisen edellytyksenä olevalla suomen tai ruotsin kielellä. Kansalaistamisen edellytyksiin kuuluu jo tyydyttävä suomen tai ruotsin kielen taito. Vaatimus olisi siten yhdenmukainen kielitaitoedellytyksen kanssa. Ehdotettavan kansalaisuuskokeen voisi suorittaa suomeksi tai ruotsiksi. Myös ehdotettavaan muuhun yhteiskuntatiedon osoittamiseen liittyisi vaatimus siitä, että sen yhteydessä käytetty kieli olisi ollut suomi tai ruotsi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellytyksen olisi täytyttävä voimassa olevan 13 §:n 1 momentin sanamuodon mukaisesti hakemusta ratkaistaessa. Käytännössä kansalaisuuden saamisesta kiinnostuneen henkilön olisi käytävä ensin suorittamassa kansalaisuuskoe, ellei hän olisi jo suorittanut muuta sellaista tutkintoa, jolla yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa. Kansalaisuuskokeen hyväksytysti suorittanut henkilö täyttäisi uuden edellytyksen ja olisi siltä osin valmis hakemaan kansalaisuutta. Lähtökohta olisi sama kuin voimassa olevaan lakiin sisältyvässä kielitaitoedellytyksessä ja muissa kansalaistamisen edellytyksissä eli se, että hakija jättäisi kansalaisuushakemuksen kansalaistamisen edellytykset täyttäessään. Yhteiskuntatietoedellytyksen täyttämisen näkökulmasta ei toisaalta olisi merkitystä, minkä pituisen ajan kuluttua kansalaisuuskokeen tai ylioppilas- tai korkeakoulututkinnon suorittamisesta kansalaisuutta haettaisiin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">17 b §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Yhteiskuntatiedon osoittaminen ja yhteiskuntatietoedellytyksestä poikkeaminen.\u003C/span> Kansalaisuuslakiin lisättäisiin uusi 17 b §, jossa säädettäisiin siitä, miten ehdotettavan yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa, keitä yhteiskuntatietoedellytys koskisi ja millä perusteella edellytyksestä voitaisiin poiketa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 1 momentti sisältäisi säännökset niistä tavoista, joilla kansalaistamiseen edellytettävän yhteiskuntatiedon voisi osoittaa. Momentin 1 kohdassa säädettäisiin, että edellytyksen täyttymisen voisi osoittaa hyväksytysti suoritetulla kansalaisuuskokeella. Kansalaisuuskokeesta ehdotetaan säädettäväksi uudessa 3 a luvussa. Kansalaisuuskokeen sisältöä koskevat säännökset olisivat uudessa 25 a §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Momentin 2 kohdassa säädettäisiin siitä, että vaadittavan osaamisen voisi osoittaa myös suomen- tai ruotsinkielisellä ylioppilastutkinnolla. Ylioppilastutkinto suoritetaan usein noin kolmevuotisen lukiokoulutuksen päätteeksi. Lukiokoulutukseen sisältyy sekä pakollisia että valinnaisia yhteiskuntaopin opintoja. Lukion yhteiskuntaopin tarkoituksena on syventää opiskelijan käsitystä ympäröivästä yhteiskunnasta ja antaa hänelle valmiuksia kasvaa yhteiskunnallisista asioista kiinnostuneeksi aktiiviseksi ja osallistuvaksi kansalaiseksi. Lukion yhteiskuntaopin arvopohjassa korostuvat demokratian peruslähtökohdat, mukaan lukien tasa-arvo ja ihmisoikeuksien kunnioittaminen. Suomen- tai ruotsinkielisen ylioppilastutkinnon suorittanut täyttäisi kansalaistamiselle ehdotettavan uuden yhteiskuntatietoedellytyksen. Yhteiskuntatiedon voisi osoittaa suomen tai ruotsin kielellä suoritetulla ylioppilastutkinnolla myös silloin, kun oikeus ylioppilastutkinnon suorittamiseen olisi perustunut ylioppilastutkinnosta annetun lain 5 §:ään. Suomen- tai ruotsinkielinen ylioppilastutkinto olisi pitänyt suorittaa Suomessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Momentin 3 kohdan mukaan edellytyksen täyttymisen voisi lisäksi osoittaa suomen- tai ruotsinkielisellä korkeakoulututkinnolla eli yliopisto- tai ammattikorkeakoulututkinnolla. Alemman tai ylemmän korkeakoulututkinnon suomeksi tai ruotsiksi suorittaneelta ei siten vaadittaisi erikseen kansalaisuuskokeen suorittamista. Tällä voitaisiin osaltaan lisätä Suomen pitovoimaa korkeakoulututkinnon suorittaneita kohtaan. Edellytyksen täyttymistä ei voisi kuitenkaan osoittaa englannin kielellä suoritetulla korkeakoulututkinnolla, sillä yhteiskuntatietoedellytyksen lähtökohtana olisi, että riittävät tiedot yhteiskunnasta osoitettaisiin suomen tai ruotsin kielellä. Arvioinnissa keskeistä olisi se, onko kyse kansalliskielisessä koulutusohjelmassa suoritetusta tutkinnosta, jossa tutkintokielenä on suomi tai ruotsi. Yliopistolain (558/2009) 10 §:ssä ja ammattikorkeakoululain 13 a §:ssä säädetään tutkintoon johtavasta vieraskielisestä koulutuksesta perittävistä maksuista. Tällaisilla lukuvuosimaksuvelvollisuuden soveltamisalaan kuuluvilla vieraskielisillä tutkinnoilla ei voisi osoittaa ehdotetun yhteiskuntatietoedellytyksen täyttymistä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Silloin, kun hakija osoittaisi edellytettävän yhteiskuntatiedon kansalaisuuskokeella, Maahanmuuttovirasto saisi tiedon kokeen suorituksesta omasta tietojärjestelmästään. Ylioppilas- ja korkeakoulututkinnoista virasto saisi puolestaan tiedon Opetushallituksen kansallisesta opiskeluoikeuksien ja suoritusten keskitetystä integraatiopalvelusta (KOSKI) ja sen yhteydessä toimivasta opinto- ja tutkintotietojen luovutuspalvelusta. Suoritettuja ylioppilastutkintoja koskevia tietoja säilytetään valtakunnallisista opinto- ja tutkintorekistereistä annetun lain (884/2017) 3 luvun mukaisesti pysyvästi ylioppilastutkintorekisterissä. Lain 5 luvussa tarkoitetussa korkeakoulujen valtakunnallisessa tietovarannossa säilytetään puolestaan pysyvästi mm. tiedot korkeakouluissa suoritetuista tutkinnoista. Yhteiskuntatietoedellytyksen täyttämisen näkökulmasta ei olisi merkitystä, minkä pituisen ajan kuluttua kansalaisuuskokeen tai ylioppilas- tai korkeakoulututkinnon suorittamisesta kansalaisuutta haettaisiin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentti sisältäisi säännökset siitä, ketä ehdotettava yhteiskuntatietoedellytys ei koskisi. Yhteiskuntatietoa ei edellytettäisi alle 18-vuotiaalta. Lapset ovat useimmiten kanssahakijoina vanhempiensa hakemuksissa. Lisäksi Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia 18 vuoden täyttämiseen asti. Siten ei olisi tarkoituksenmukaista edellyttää alle 18-vuotiaalta erillistä yhteiskuntatiedon osoittamista. Jos kanssahakija täyttäisi 18 vuotta ennen hakemuksen ratkaisemista ja täydentäisi kansalaisuushakemuksen itseään koskevaksi lain 25 §:n mukaisesti, ei häneltä edellyttäisi yhteiskuntatiedon osoittamista. Lain 25 §:ää ehdotetaan täsmennettäväksi tältä osin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoa ei niin ikään edellytettäisi 65-vuotiaalta tai sitä vanhemmalta hakijalta. Sellaiset henkilöt, jotka ovat täyttäneet 65 vuotta, voivat vuonna 2026 saada vanhuuseläkettä. Vaikka 65 vuotta täyttänyt henkilö voi yhä työskennellä tai opiskella, tämän ikäiseltä hakijalta ei kuitenkaan enää edellytettäisi yhteiskuntatietoa kansalaisuuden saamista varten. Rajaus olisi yhdenmukainen esimerkiksi kansalaisuuslain toimeentuloedellytystä koskevien säännösten kanssa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentissa säädettäisiin niistä perusteista, joilla yhteiskuntatietoedellytyksestä voitaisiin poiketa. Poikkeuksen tarkoituksena olisi mahdollistaa kansalaisuuden myöntäminen sellaisissa tilanteissa, joissa ei voitaisi kohtuudella edellyttää hakijan täyttävän yhteiskuntatietoedellytystä terveydentilan, vammaisuuden tai muun erittäin painavan syyn vuoksi. Poikkeamismahdollisuudella varmistettaisiin se, että myös sellaisille hakijoille voitaisiin myöntää kansalaisuus, joilla ei olisi tosiasiallista mahdollisuutta täyttää esityksessä ehdotettua uutta yhteiskuntatietoedellytystä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoedellytyksestä poikkeaminen voisi tulla kyseeseen silloin, kun kansalaisuuskokeen suorittamista ei esimerkiksi vammaisuuden vuoksi voitaisi kohtuudella edellyttää erityisjärjestelyjenkään avulla. Kokeessa käytettävistä erityisjärjestelyistä ehdotetaan säädettäväksi uudessa 25 g §:ssä. Erityisjärjestelyjen tarkoituksena olisi se, että sellaiset asiat kuin sairaus, vamma tai lukemisen ja kirjoittamisen eritysvaikeus eivät muodostuisi esteeksi kokeen suorittamiselle. Erityisjärjestelyillä turvattaisiin kansalaisuuden hakemisesta kiinnostuneille yhdenvertaiset ja kohtuulliset mahdollisuudet kansalaisuuskokeen suorittamiseen. Lähtökohtana olisi edellytettävän yhteiskuntatiedon osoittaminen tarvittaessa erityisjärjestelyjen avulla. Kansalaisuuskoe tarvittavine erityisjärjestelyineen olisi kansalaisuuden hakemista edeltävä vaihe, kun taas poikkeamista yhteiskuntatietoedellytyksestä voisi pyytää kansalaisuushakemuksen yhteydessä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Mahdollisten poikkeamisperusteiden olemassaoloa arvioitaisiin sellaisissa tilanteissa, joissa hakija ei olisi osoittanut yhteiskuntatietoedellytyksen täyttymistä pykälän 1 momentin mukaisesti eikä hän olisi 2 momentissa tarkoitettu henkilö. Jos hakija pyytäisi hakemuksessaan poikkeamista yhteiskuntatietoedellytyksestä, arvioitaisiin, olisiko hakijan tapauksessa jokin 3 momentin mukainen peruste poikkeamiselle.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoedellytyksestä voitaisiin poiketa siinä tapauksessa, että poikkeamiselle olisi sellainen hakijan terveydentilaan tai vammaisuuteen liittyvä peruste, jonka vuoksi hän ei pystyisi osoittamaan edellytyksen täyttymistä 1 momentissa tarkoitetulla tavalla. Kyse olisi siten sellaisista perusteista, joilla voidaan 18 b §:n 1 momentin 3 kohdan mukaan poiketa kielitaitoedellytyksestä. Tarkoituksena olisi kattaa laajasti kaikki sellaiset tilanteet, joissa hakijan fyysinen tai psyykkinen toimintakyky olisi siinä määrin vakavasti ja pitkäaikaisesti alentunut lääketieteellisistä syistä, ettei hänen voitaisi kohtuudella odottaa täyttävän yhteiskuntatietoedellytystä. Käytännössä kyse olisi erityisesti sen arvioimisesta, voisiko hakija suorittaa kansalaisuuskoetta pidemmälläkään aikavälillä ja olisiko hakijan terveydentila tai vamma sellainen, jonka vuoksi edellytyksen täyttäminen olisi hänelle vastaisuudessakin erittäin vaikeaa ja epätodennäköistä. Joissakin tilanteissa voitaisiin päätyä tällaisen arvioinnin perusteella siihen, ettei olisi kohtuullista vaatia kansalaisuuskokeen suorittamista, jolloin yhteiskuntatietoedellytyksestä olisi aihetta poiketa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Terveydentilaan liittyvässä syyssä voisi olla kyse esimerkiksi psyykkisestä tai fyysisestä kroonisesta sairaudesta, kehitysvammasta tai -häiriöstä, neuropsykiatrisesta häiriöstä, CP-vammasta tai ulkoisen tekijän aiheuttamasta pitkäaikaisesta vammasta. Jos hakija pyytäisi hakemuksessaan poikkeamaan yhteiskuntatietoedellytyksestä terveydentilaan tai vammaisuuteen liittyvistä syistä, hänen olisi esitettävä pyyntönsä tueksi selvitystä sairaudestaan, vammastaan tai muusta terveydentilaan liittyvästä seikasta, johon hän vetoaisi. Käytännössä kyse olisi hakijaa hoitaneen lääkärin antamasta lausunnosta, joka koskisi hakijan terveydentilaa tai vammaa. Lääkärintodistuksesta tulisi käydä ilmi, onko hakijan sairaus tai vamma sellainen, että se estää pitkäaikaisesti kansalaisuuskokeen suorittamisen. Todistuksesta tulisi selvitä myös, millä tavalla sairaus tai vamma estää kansalaisuuskokeen suorittamisen. Sama todistus voisi sisältää selvityksen sekä kielitaito- että yhteiskuntatietoedellytyksestä poikkeamisen perusteista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto arvioisi käytössään olevan lääketieteellisen sekä mahdollisen muun selvityksen perusteella, olisiko käsillä laissa säädetty peruste yhteiskuntatietoedellytyksestä poikkeamiselle. Maahanmuuttovirasto tekisi viime kädessä päätöksen siitä, onko hakijan kohdalla kaiken käytössä olevan selvityksen perusteella kyse sellaisesta lain tarkoittamasta tilanteesta, jossa hakijan ei voida katsoa terveydentilansa tai vammaisuutensa vuoksi tosiasiallisesti kykenevän täyttämään yhteiskuntatietoedellytystä. Jos hakija vetoaisi myös 18 b §:n 1 momentin 3 kohdassa tarkoitettuun poikkeamisperusteeseen, kielitaito- ja yhteiskuntatietoedellytyksestä poikkeamista olisi lähtökohtaisesti perusteltua arvioida yhdessä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Hakijan terveydentilaan tai vammaisuuteen liittyvien syiden lisäksi yhteiskuntatietoedellytyksestä voitaisiin poiketa, jos tähän olisi olemassa muutoin erittäin painava syy. Peruste olisi tarkoitettu sovellettavaksi sellaisissa poikkeuksellisissa tilanteissa, joissa yhteiskuntatiedon osoittaminen muodostuisi muutoin kohtuuttomaksi muista hakijasta itsestään riippumattomista syistä. Poikkeamisperusteen tarkoituksena olisi estää kohtuuttomat tilanteet esimerkiksi silloin, kun hakijan tapauksessa olisi kokonaisuutena arvioiden useammasta eri seikasta johtuva peruste edellytyksestä poikkeamiselle. Poikkeaminen muun erittäin painavan syyn perusteella edellyttäisi aina hakijan erityistilanteen huomioivaa kokonaisharkintaa. Käytännössä poikkeamiselle voisi olla erittäin painava syy esimerkiksi sellaisessa tilanteessa, jossa hakijan terveydentilaan tai vammaisuuteen liittyvät seikat eivät sellaisenaan riittäisi perusteiksi poikkeamiselle ja hän ei useasta yrityksestään huolimatta olisi pystynyt suorittamaan kansalaisuuskoetta hyväksytysti. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Täysivaltaiseksi tulon vaikutus vireillä olevaan hakemukseen. \u003C/span>Pykälä sisältää säännökset sellaisia tilanteita varten, joissa henkilöstä tulee kansalaisuushakemuksen vireillä ollessa täysi-ikäinen. Tällainen henkilö voi kohtuullisessa määräajassa täydentää hakemuksen itseään koskevaksi, jos hän on ollut kanssahakijana, tai vahvistaa hakemuksen, jos se on tehty vain hänen puolestaan. Tällaiseen henkilöön sovelletaan eräiltä osin lasta koskevia säännöksiä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momenttia ehdotetaan muutettavaksi siten, että siihen lisättäisiin tarkennus yhteiskuntatietoedellytystä koskevien säännösten soveltamisesta. Jos henkilö olisi pykälässä tarkoitetulla tavalla täydentänyt hakemuksen itseään koskevaksi tai vahvistanut sen, häneltä ei edellytettäisi kansalaisuuden saamista varten yhteiskuntatietoa. Yhteiskuntatietoedellytys ei siten koskisi häntä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">3 a luku\u003C/span> \u003Cspan class=\"LihavaTeksti\">Kansalaisuuskoe\u003C/span>&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lakiin ehdotetaan lisättäväksi uusi 3 a luku, jossa säädettäisiin uudesta kansalaisuuskokeesta ja sen toteutuksesta, kuten kansalaisuuskokeen sisällöstä, laatimisesta ja järjestämisestä sekä kokeen laatijan ja järjestäjän tehtävistä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 a §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Kansalaisuuskokeen sisältö. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 a §, jossa säädettäisiin ehdotettavan kansalaisuuskokeen sisällöstä. Kansalaisuuskokeen suorittaminen olisi yksi niistä tavoista, joilla voisi osoittaa täyttävänsä kansalaistamiselle ehdotettavan uuden yhteiskuntatietoedellytyksen. Koe suoritettaisiin kansalaisuuden hakemista varten ennen kansalaisuushakemuksen tekemistä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeessa kysyttäisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Kysymykset koskisivat keskeisiä ja perustavanlaatuisia tietoja näistä aiheista. Kokeessa ei testattaisi hyvin pieniä yksityiskohtia koskevien tietojen hallintaa, vaan kansalaisuutta varten olisi perusteltua edellyttää sellaisia yleisiä tietoja, joita voitaisiin pitää tarpeellisina tulevalle Suomen kansalaiselle. Kysymykset koskisivat sellaisia aiheita kuin Suomen keskeinen lainsäädäntö, perus- ja ihmisoikeudet, yhdenvertaisuus, sukupuolten tasa-arvo sekä Suomen historia ja kulttuuri. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe perustuisi kansalaisuuskokeen oppimateriaaliin, joka olisi laadittu kuntien järjestämässä yhteiskuntaorientaatiossa käytettävän valtakunnallisen oppimateriaalin pohjalta tämän sisältöjä ja laajuutta vastaavana. Kotoutumisen edistämisestä annetun lain 25 §:n perusteella kunnan on järjestettävä kotoutuja-asiakkaille yhteiskuntaorientaatio, jonka sisältöön kuuluu tietoa muun muassa suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Yhteiskuntaorientaation oppimateriaalin ylläpito kuuluu kotoutumisen edistämisestä annetun lain 56 §:n mukaisesti työllisyys-, kehittämis- ja hallintokeskuksen tehtäviin. Yhteiskuntaorientaation sisällöstä on säädetty tarkemmin valtioneuvoston asetuksella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen oppimateriaali olisi yleisesti saatavilla kansalaisuuskokeeseen valmistautumista varten. Oppimateriaali olisi julkinen, maksuton ja saavutettava. Kansalaisuuskokeen kysymykset koskisivat sen sisältämiä keskeisiä tietoja. Kokeen voisi suorittaa valmistauduttuaan siihen oppimateriaalia opiskelemalla. Kun kokeessa testattaisiin oppimateriaaliin perustuvia tietoja, kansalaisuuden hakemisesta kiinnostunut pystyisi myös itse arvioimaan ja ennakoimaan mahdollisuuksiaan sen suorittamiseen. Tietoon perustuvalla kokeella ei asetettaisi ketään eri asemaan esimerkiksi vakaumuksen tai mielipiteen perusteella.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentin mukaan kansalaisuuskokeen voisi suorittaa suomeksi tai ruotsiksi. Kokeen suorittamiseen tarvittaisiin samaa kielitaidon tasoa kuin kansalaisuuden saamiseen eli tyydyttävää suomen tai ruotsin kielen taitoa, joka vastaa taitotasoa B1 eurooppalaisen kielitaidon arvioinnin viitekehyksen asteikolla. Kansalaisuuskokeeseen osallistuva valitsisi kokeen kielen kokeeseen ilmoittautuessaan. Viittomakieltä käyttävät vammaiset henkilöt voisivat suorittaa kansalaisuuskokeen sellaisten erityisjärjestelyjen avulla, joista ehdotetaan säädettäväksi uudessa 25 g §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe suoritettaisiin kansalaisuuskokeen järjestäjän valvomassa koetilaisuudessa ja lähtökohtaisesti sähköisenä kokeena. Myös koesuorituksen tarkastus toteutettaisiin sähköisesti. Kokeen tulos annettaisiin osallistujalle tiedoksi sähköisenä viestinä sähköisestä asioinnista viranomaistoiminnassa annetun lain (13/2003) mukaisesti. Poikkeuksellisessa tilanteessa koe voitaisiin toteuttaa myös muussa kuin sähköisessä muodossa. Tällainen tilanne voisi liittyä esimerkiksi johonkin tekniseen häiriöön, joka estäisi kokeen sähköisen toteutuksen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe olisi monivalintakoe, joka sisältäisi oppimateriaalin pohjalta laadittuja kysymyksiä ja vastausvaihtoehtoja. Kokeeseen osallistuvan olisi valittava näistä oikeita vastauksia. Hyväksyttyyn suoritukseen vaadittaisiin sitä, että valtaosa vastauksista olisi valittu oikein. Kaikkien vastausten ei siten tarvitsisi olla oikein, jotta koesuoritus olisi hyväksytty. Kansalaisuuskokeen hyväksytty suoritus edellyttää eri maissa sitä, että vastauksista on oikein 50–80 prosenttia. Hyväksytyn koesuorituksen rajasta voitaisiin säätää tarkemmin valtioneuvoston asetuksella.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentti sisältäisi asetuksenantovaltuuden. Kansalaisuuskokeen sisällöstä ja hyväksytystä suorituksesta voitaisiin antaa tarkempia säännöksiä valtioneuvoston asetuksella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 b §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Kansalaisuuskokeen laatiminen.\u003C/span> Kansalaisuuslakiin lisättäisiin uusi 25 b §, jossa säädettäisiin siitä, millaisen toimijan kanssa Maahanmuuttovirasto voisi tehdä sopimuksen kansalaisuuskokeen laatimisesta. Kokeen laatiminen toteutettaisiin Maahanmuuttoviraston hankkimana ostopalveluna. Kansalaisuuskokeen ja sen oppimateriaalin laatiminen olisi perusteltua antaa tehtäväksi muulle toimijalle kuin Maahanmuuttovirastolle paitsi riittävän asiantuntemuksen varmistamiseksi, myös objektiivisuuden ja neutraaliuden vaatimusten vuoksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälässä ehdotetaan säädettäväksi, että sopimus kansa
