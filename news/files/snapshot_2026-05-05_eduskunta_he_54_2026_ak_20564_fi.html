stä kansalaisuuden saamiseksi. Tavoiteltava vaikutus olisi, että muutos osaltaan kannustaisi kotoutumaan ja siten myös edistäisi henkilön osallistumista entistä täysipainoisemmin yhteiskunnan toimintaan. Myös yhteiskunnan kannalta toivottava vaikutus olisi, että kansalaistetulla henkilöllä olisi entistä paremmat valmiudet suomalaisessa yhteiskunnassa toimimiseen. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Lisäksi tavoitteena on, että sääntely mahdollistaisi selkeän ja täsmällisen kokonaisuuden sellaisen kansalaisuuskoejärjestelmän toimeenpanolle, joka olisi luotettava, laadukas ja oikeudenmukainen. &nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Ehdotukset ja niiden vaikutukset\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Keskeiset ehdotukset\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että kansalaistamisen yleisiä edellytyksiä koskevaan sääntelyyn lisättäisiin uusi yhteiskuntatietoa koskeva edellytys. Voimassa olevaan sääntelyyn ei sisälly sellaista edellytystä, jonka kautta voitaisiin tarkastella hakijan kotoutumista siitä näkökulmasta, minkälaiset tiedot hänellä on suomalaisesta yhteiskunnasta. Tämän vuoksi kansalaisuuden hakijalta edellytettäisiin jatkossa, että hänellä olisi suomen tai ruotsin kielellä osoitetut riittävät tiedot yhteiskunnasta. Edellytys olisi kielitaitoedellytyksestä erillinen, ja jatkossakin hakijalta edellytettäisiin kielitaidon osoittamista ehdotetun yhteiskuntaosaamisen lisäksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin lisättäisiin säännökset siitä, miten uuden yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa. Lähtökohtaisesti edellytyksen täyttyminen osoitettaisiin suorittamalla hyväksytysti ennalta määriteltyyn oppimateriaalin perustuva tietopohjainen kansalaisuuskoe, jossa mitattaisiin tietoja suomalaisen yhteiskunnan toiminnasta ja perusperiaatteista sekä yksilön oikeuksista ja velvollisuuksista. Kyse olisi kokonaan uudesta kansalaistamismenettelyä varten kehitettävästä koejärjestelmästä, jonka toimeenpanon edellyttämät säädösehdotukset sisältyvät tähän esitykseen.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaistamista varten vaadittava riittävä yhteiskuntatieto voitaisiin osoittaa myös tietyillä Suomessa suoritetuilla opinnoilla. Näitä olisivat suomen- tai ruotsinkielinen ylioppilastutkinto tai suomen- tai ruotsinkielinen korkeakoulututkinto. Tällä pyrittäisiin ensinnäkin poistamaan sellainen epätarkoituksenmukainen tilanne, jossa kansalaisuuskokeeseen rinnastuvat tiedot lukiokoulutuksessa saanut hakija joutuisi menemään maksulliseen kansalaisuuskokeeseen. Korkeakoulututkintojen rinnastamisella taas voitaisiin osaltaan lisätä Suomen pitovoimaa korkeakoulututkinnon suorittaneita kohtaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellytys ei koskisi alle 18-vuotiasta eikä 65 vuotta täyttänyttä hakijaa. Edellytyksestä voitaisiin myös poiketa, jos hakija ei pystyisi täyttämään sitä terveydentilansa tai vammansa vuoksi. Hakijan tulisi osoittaa, että kyse olisi sellaisesta merkittävästä ja pitkäaikaisesta lääketieteellisestä syystä, jonka vuoksi hänen ei voitaisi kohtuudella olettaa täyttävän edellytystä. Lisäksi edellytyksestä voitaisiin poiketa muutoin erittäin painavan syyn perusteella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto vastaisi uusista kansalaisuuskokeeseen liittyvistä viranomaistehtävistä. Näitä olisivat kansalaisuuskokeen yleinen hallinto, valvonta ja kehittäminen sekä kansalaisuuskokeen laatimista ja järjestämistä koskevien sopimusten tekeminen. Kyse olisi uuden kansalaisuuskoejärjestelmän yleisestä hallinnointivastuusta, joka toteutettaisiin huomioiden Maahanmuuttoviraston nykyiset tehtävät ja toiminnot. Esimerkiksi kansalaisuuskokeen laatimisessa ja koetilaisuuksien järjestämisessä olisi kyse sellaisista tehtävistä, jotka poikkeaisivat luonteeltaan Maahanmuuttoviraston muista tehtävistä. Siksi olisi tarkoituksenmukaista järjestää mainitut tehtävät viraston hankkimina ostopalveluina sellaisilta toimijoilta, joilla on niiden hoitamiseksi riittävää asiantuntemusta. Maahanmuuttovirasto sopisi kansalaisuuskokeen laatimisesta ja järjestämisestä esityksessä ehdotettavat edellytykset täyttävien toimijoiden kanssa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin lisättäisiin uusi luku, jossa säädettäisiin tarkemmin uudesta kansalaisuuskokeesta ja sen toteutuksesta, kuten kansalaisuuskokeen sisällöstä, laatimisesta ja järjestämisestä sekä kokeen laatijan ja järjestäjän tehtävistä. Luku sisältäisi säännökset myös koemaksusta, kokeen suorittamista koskevista erityisjärjestelyistä, järjestyksen rikkomisen ja vilpillisen menettelyn perusteella annettavista seuraamuksista sekä kansalaisuuskokeen kehittämiseen liittyvästä asiantuntijatoimikunnasta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeella testattaisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Monivalintakoe suoritettaisiin sähköisesti suomen tai ruotsin kielellä. Koekysymykset perustuisivat ennalta määriteltyyn ja kaikille yleisesti saatavilla olevaan oppimateriaaliin kokeen läpinäkyvyyden ja tasapuolisuuden varmistamiseksi. Kansalaisuuskoe laadittaisiin kotoutumislain mukaisessa yhteiskuntaorientaatiossa käytettävän oppimateriaalin sisällön pohjalta, sillä olisi tarkoituksenmukaista hyödyntää sellaista jo olemassa olevaa oppimateriaalia, joka sisältää kokeen tarkoituksen ja tavoitteiden kannalta keskeisiä tietoja. Yhteiskuntaorientaation oppimateriaalin pohjalta laadittaisiin sen sisältöjä ja laajuutta vastaava ja kansalaisuuskokeen käyttötarkoitukseen soveltuva oppimateriaali. Yhteiskuntaorientaatio sisältää opetusta muun muassa suomalaisen yhteiskunnan normeista ja keskeisestä lainsäädännöstä, perus- ja ihmisoikeuksista, yhdenvertaisuudesta ja sukupuolten tasa-arvosta sekä Suomen kulttuurista ja historiasta. Siten kansalaisuuskokeen kysymykset koskisivat esimerkiksi näitä mainittuja aiheita. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatiminen edellyttäisi riittävän korkeatasoista ja monipuolista asiantuntemusta, sillä kokeella olisi pystyttävä arvioimaan luotettavasti ja riittävän yksiselitteisesti siihen osallistuvan tietoja. Siten Maahanmuuttovirasto voisi tehdä sopimuksen kokeen laatimisesta yliopiston kanssa, koska tällä voidaan katsoa olevan kokeen laatimiseen edellytettävää asiantuntemusta. Kansalaisuuskokeen laatija tuottaisi yhteiskuntaorientaation oppimateriaalin perustuvan kansalaisuuskokeen oppimateriaalin. Kansalaisuuskokeen laatijan tehtävä sisältäisi myös koekysymysten ja niiden vastausten valmistelun. Koekysymysten tulisi perustua edellä mainittuun ennalta määriteltyyn oppimateriaaliin ja niitä olisi laadittava riittävän runsaasti ennalta arvattavuuden estämiseksi, minkä lisäksi kysymysten laatimisessa tulisi huomioida kansalaistamisen edellytyksenä oleva kielitaidon taso. Lisäksi laatijan tehtävänä olisi huolehtia kokeen kysymysten ja vastausvaihtoehtojen sekä oppimateriaalin kehittämisestä muun muassa kokeesta saadun palautteen perusteella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen järjestäjän tehtävänä olisi tarjota tilat ja puitteet kokeen suorittamiselle sekä huolehtia koetilaisuuksien valvonnasta. Siten Maahanmuuttovirasto voisi sopia koetilaisuuksien järjestämisestä sellaisten toimijoiden kanssa, joilla on riittävät edellytykset kokeen järjestämiseen muun muassa tilojen, laitteiden, henkilöstön ja valvonnan osalta. Koetilaisuuksien järjestäjät voisivat olla niin julkisyhteisöjä kuin myös muita edellytykset täyttäviä yhteisöjä. Käytännössä koetilaisuuksia voisi olla toteuttamassa useamman eri toimijan muodostama järjestäjäverkosto. Koetilaisuuksien järjestämisestä sovittaessa olisi huomioitava, että koetilaisuuksia tarjottaisiin alueellisesti riittävä määrä ja riittävän usein. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kokeen suorittamista koskevilla erityisjärjestelyillä huolehdittaisiin siitä, että kansalaisuuskokeen suorittajilla olisi kohtuulliset ja yhdenvertaiset mahdollisuudet kokeen suorittamiseen ja mahdollisimman moni suorittaisi kokeen. Käytännössä kyse voisi olla esimerkiksi lisäajasta kokeen suorittamiseen. Kokeen suorittajan olisi esitettävä erillinen perusteltu pyyntö ja selvitys erityisjärjestelyjen tarpeesta. Maahanmuuttovirasto päättäisi erityisjärjestelyjen käytöstä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen osallistujalle voitaisiin antaa seuraamuksia järjestyksen rikkomisen tai vilpillisen menettelyn perusteella. Koetilaisuudessa tapahtuvasta järjestyksen rikkomisesta voisi seurata koesuorituksen hylkääminen. Myös vilpillinen menettely johtaisi koesuorituksen hylkäämiseen, minkä lisäksi kokeen suorittaja menettäisi oikeutensa osallistua koetilaisuuteen määräajaksi. Päätöksen mainituissa tilanteissa tekisi Maahanmuuttovirasto.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta varten perustettaisiin poikkihallinnollinen asiantuntijatoimikunta, joka toimisi Maahanmuuttoviraston yhteydessä. Asiantuntijatoimikunnan tarkoitus olisi ennen kaikkea tukea Maahanmuuttovirastoa kansalaisuuskoejärjestelmän yleisessä kehittämisessä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin lisättäisiin säännökset myös hylättyä koesuoritusta koskevasta oikaisuvaatimuksesta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirastosta annettua lakia muutettaisiin lisäämällä Maahanmuuttoviraston tehtäviin kansalaisuuskokeeseen liittyvät tehtävät. Henkilötietojen käsittelystä maahanmuuttohallinnossa annettuun lakiin (615/2020) ehdotetaan muutoksia, jotka johtuvat sellaisista kansalaisuuskokeeseen liittyvistä Maahanmuuttoviraston uusista tehtävistä, joihin sisältyy henkilötietojen käsittelyä.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Pääasialliset vaikutukset\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yleistä\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettavat muutokset ovat osa kansalaisuuslakiin tehtävien muutosten kokonaisuutta. Samaan kokonaisuuteen kuuluu myös kansalaistamisen edellytyksenä olevan asumisajan pidentäminen, jota koskevat muutokset tulivat voimaan lokakuussa 2024, sekä mm. toimeentulo- ja nuhteettomuusedellytyksiin tehdyt muutokset, jotka tulivat voimaan joulukuussa 2025. Seuraavassa esitetään arvioita niin tässä esityksessä ehdotettavan yhteiskuntatietoedellytyksen ja kansalaisuuskokeen vaikutuksista kuin myös niistä yhteisvaikutuksista, joita eri vaiheiden muutoksilla voi olla. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ehdotettava kansalaisuuskoejärjestelmä olisi kokonaan uusi, eikä siitä ole Suomessa vielä aiempia kokemuksia. Toista täysin vastaavaa koejärjestelmää ei ole olemassa. Uuden yhteiskuntatietoedellytyksen ja kansalaisuuskokeen vaikutusten arviointiin liittyy siten myös useita epävarmuustekijöitä. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset viranomaisten toimintaan\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaistamiselle uutta yhteiskuntatietoedellytystä sekä kansalaisuuskokeen käyttöönottoa, mikä vaikuttaisi viranomaisista eniten Maahanmuuttovirastoon. Maahanmuuttoviraston tehtäviin kuuluu päättää kansalaisuuden myöntämisestä hakemuksen perusteella. Yhteiskuntatietoedellytyksen lisääminen uudeksi kansalaistamisen edellytykseksi vaikuttaisi siten Maahanmuuttoviraston päätösharkintaan. Maahanmuuttoviraston arvioitavaksi tulisi myös se, olisiko joissakin tapauksissa käsillä perusteita uudesta edellytyksestä poikkeamiselle. Kansalaisuuskokeen käyttöönoton myötä Maahanmuuttovirastolle tulisi toisaalta kokonaan uusia tehtäviä. Maahanmuuttovirastolla olisi keskeinen merkitys uuden kansalaisuuskoejärjestelmän hallinnoinnissa ja koordinoinnissa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Seuraavassa käsitellään aluksi tarkemmin sitä, miten yhteiskuntatiedon lisääminen kansalaistamisen edellytykseksi vaikuttaisi viranomaisten toimintaan. Sen jälkeen tarkastellaan lähemmin kansalaisuuskokeen täytäntöönpanoon liittyvien eri tehtävien vaikutusta varsinkin Maahanmuuttoviraston toimintaan. &nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Uuden yhteiskuntatietoedellytyksen vaikutukset viranomaisiin\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että hakemuksesta myönnettävän Suomen kansalaisuuden edellytykseksi lisättäisiin yhteiskuntatietoedellytys. Jotta Suomen kansalaisuus voitaisiin myöntää hakemuksen perusteella, hakijan pitäisi osoittaa hankkineensa perustiedot suomalaisen yhteiskunnan toiminnasta ja yksilön oikeuksista ja velvollisuuksista. Uuden edellytyksen sisältönä olisi yhteiskuntaa koskeva tieto, jonka voisi osoittaa suorittamalla hyväksytysti uuden kansalaisuuskokeen sekä ylioppilas- tai korkeakoulututkinnolla.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin vuonna 2024 tehtyjen asumisaikaedellytyksen muutosten arvioitiin vaikuttavan Maahanmuuttovirastolle tehtävien hakemusten määrään. Ennen asumisajan muutosten voimaantuloa hakemuksia tehtiin selvästi aiempaa enemmän. Muutosten voimaantulon arvioitiin kuitenkin vaikuttavan siten, että hakemuksia tehtäisiin jonkin aikaa hieman vähemmän, koska mahdolliset hakijat eivät vielä täyttäisi asumisaikaa. Kansalaisuuslakiin seuraavassa vaiheessa vuonna 2025 tehtyjen muutosten arvioitiin puolestaan vaikuttavan hakemusten määrään ennen kaikkea siksi, että työttömyysetuutta tai toimeentulotukea saanut henkilö ei välttämättä enää täyttäisi uutta toimeentuloedellytystä. Esityksessä arvioitiin, että osa mahdollisista hakijoista saattaa lykätä kansalaisuushakemuksen tekemistä myöhemmäksi työttömyyden vuoksi. Pidettiin myös mahdollisena, että työttömille kansalaisuuden hakijoille tehtäisiin enemmän kielteisiä päätöksiä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuushakemuksia tehtiin Maahanmuuttovirastolle vuonna 2025 yhteensä 11 237 (2024: 17&nbsp;063, 2023: 18 296). Maahanmuuttovirasto teki kansalaisuushakemuksiin vuonna 2025 yhteensä 15 809 päätöstä (2024: 14&nbsp;112, 2023: 13 322), joista oli kielteisiä 1 742 (2024: 1&nbsp;258, 2023: 1 330). Kielteisten päätösten osuus kaikista kansalaisuushakemuksiin tehdyistä päätöksistä oli vuonna 2025 noin 11 % (2024: 9 %, 2023: 10 %). Yleisin peruste kielteiselle päätökselle on vuosina 2021–2025 ollut se, että hakija ei ole täyttänyt kielitaitoedellytystä. Yhteensä 539 eli noin 31 % kielteisistä päätöksistä tehtiin vuonna 2025 sillä perusteella, että hakijalla ei ollut vaadittavaa kielitaitoa eikä perustetta kielitaitoedellytyksestä poikkeamiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Taulukko 1: Kansalaisuushakemuksiin vuosina 2023–2025 tehdyt päätökset.&nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N104F8\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Päätökset kansalaisuushakemuksiin\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2023\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2024\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2025\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kaikki &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">13 322&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">14 112&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">15 809&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kielteiset päätökset&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1 330&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1 258&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1 742&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kielteiset päätökset, kielitaito&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">400&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">382&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">539&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuushakemuksiin kielitaidon puuttumisen vuoksi tehtyjen kielteisten päätösten määrällä on merkitystä siksi, että yhteiskuntatietoedellytyksestä tulisi hieman samankaltainen kansalaistamisen edellytys kuin kansalaisuuslaissa jo oleva kielitaitoedellytys. Myös edellytyksestä poikkeamisen perusteet olisivat jonkin verran samankaltaisia. Kansalaisuuskokeen käyttöönottoa koskevassa työryhmän selvityksessä (s. 59–60) arvioitiin, että kansalaisuuskokeen suorittamista edellytettäisiin vuosittain noin 5&nbsp;000–10&nbsp;000 henkilöltä. Arvio perustui kansalaisuutta vuosina 2020–2023 hakeneiden 18–64-vuotiaiden määrään. Kielitaitoedellytys ja yhteiskuntatietoedellytys koskisivat suurelta osin samoja henkilöitä. Voidaan toisaalta arvioida, että edellytyksistä poikkeamista tulisivat pyytämään ainakin osittain samat hakijat. Sen vuoksi kansalaisuushakemuksiin tehtävät kielteiset päätökset eivät välttämättä juurikaan lisääntyisi uuden yhteiskuntatietoedellytyksen ja kansalaisuuskokeen käyttöönoton myötä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Osa mahdollisista hakijoista saattaa kuitenkin lykätä kansalaisuushakemuksen tekemistä kansalaisuuskokeen vuoksi. Samalla tavalla kuin aiemmat asumisajan ja toimeentulon tiukennukset, myös yhteiskuntatiedon lisääminen kansalaistamisen edellytyksiin vaikuttaisi siten varsinkin tulevien kansalaisuushakemusten määrään. Kansalaisuuskokeen käyttöönoton on eräissä muissa maissa havaittu vähentäneen ja lykänneen kansalaisuuden saamista.\u003Cspan class=\"AlaviiteTeksti\"> Tällaisia vaikutuksia on havaittu Alankomaissa ja Tanskassa, joissa kielitaidon ja yhteiskuntatiedon osoittaminen lisättiin kansalaisuuden saamisen edellytyksiin 2000-luvun alussa (Vink ym. 2021: Long-term heterogeneity in immigrant naturalization – the conditional relevance of civic integration and dual citizenship, European Sociological Review 37:5, s. 751, 753, 763). Myös Saksassa kokeiden käyttöönoton on havaittu vaikuttaneen kansalaisuuden saamiseen (Van Oers 2021: Deserving citizenship in Germany and The Netherlands – citizenship tests in liberal democracies, Ethnicities 21:2, s. 284).\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteiskuntatiedon lisäämisestä uudeksi kansalaistamisen edellytykseksi seuraisi se, että Maahanmuuttoviraston olisi päivitettävä sähköisiä ja paperisia hakemuslomakkeita. Niin kansalaisuushakemuksia käsittelevää kuin myös asiakaspalvelussa työskentelevää viraston henkilöstöä olisi koulutettava ja ohjeistettava uudesta edellytyksestä. Maahanmuuttoviraston verkkosivuilla olevia tietoja kansalaistamisen edellytyksistä olisi päivitettävä. Verkkosivuilla olisi kerrottava, ketä uusi edellytys koskee, miten sen täyttymisen voi osoittaa ja millä perusteilla edellytyksestä voidaan poiketa. Kansalaisuuskokeen suorittamiseen liittyvien tietojen olisi niin ikään oltava saatavilla joko Maahanmuuttoviraston verkkosivuilla tai niiden kautta. Uudesta edellytyksestä seuraisi muutostarpeita myös Maahanmuuttoviraston käyttämiin tietojärjestelmiin, ulkomaalaisasioiden asiankäsittelyjärjestelmään ja Enter Finland -verkkopalveluun. Kansalaisuuskoetta varten tarvittaisiin lisäksi yhteentoimiva tietojärjestelmäkokonaisuus. Erilaisia tietojärjestelmävaikutuksia tarkastellaan tarkemmin jäljempänä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaistamisen edellytysten muutokset vaikuttavat Maahanmuuttoviraston lisäksi hallintotuomioistuimiin, joihin kansalaisuutta koskevista päätöksistä voi valittaa. Maahanmuuttoviraston päätöksestä voi valittaa hallinto-oikeuteen, jonka päätöksestä voi puolestaan valittaa korkeimpaan hallinto-oikeuteen, jos korkein hallinto-oikeus myöntää valitusluvan.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Etenkin toimeentuloedellytykseen tehtyjen muutosten arvioitiin voivan vaikuttaa myös hallinto-oikeuksien asiamääriin. Tuomioistuinviraston tilastojen mukaan kansalaisuusasioissa tehtiin hallinto-oikeuksiin vuonna 2023 yhteensä 337 valitusta (2022: 206). Toimeentuloedellytykseen liittyy osittain samanlaisia poikkeusperusteita kuin kielitaitoedellytykseen. Uuden toimeentuloedellytyksen arvioitiin vaikuttavan siten, että hallinto-oikeuksille tehtyjen valitusten vuosittainen määrä kasvaisi mahdollisesti noin 80:llä (alle 1 % vuonna 2024 hallinto-oikeuksissa vireille tulleista asioista). &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Myös kansalaisuuskokeen käyttöönotto voi osaltaan lisätä sellaisia valituksia, joita hallinto-oikeuksille tehtäisiin kansalaisuushakemuksia koskevista päätöksistä. Kuten edellä on kuitenkin todettu, osittain samat henkilöt voivat pyytää poikkeamista eri edellytyksistä esimerkiksi terveydentilan perusteella. Kansalaisuuskoe ei siten välttämättä lisäisi olennaisesti kansalaisuutta koskevien valitusten määrää, jolloin kansalaisuuskokeen vaikutus hallinto-oikeuksien resurssitarpeeseen jäisi mahdollisesti pieneksi. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuuskokeen täytäntöönpanoon liittyvät tehtävät\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Maahanmuuttovirastolla olisi keskeinen rooli kansalaisuuskokeen täytäntöönpanossa ja varsinkin kansalaisuuskoejärjestelmän hallinnoinnissa. Maahanmuuttovirasto kilpailuttaisi kansalaisuuskokeen laatimisen ja koetilaisuuksien järjestämisen ja tekisi sopimukset tällaisten palvelujen ostamisesta. Kansalaisuuskoetta varten tarvittaisiin myös yhteentoimiva tietojärjestelmäkokonaisuus. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston tehtävät kattaisivat mm. kansalaisuuskoetta koskevan yleisen viestinnän, kokeen maksuliikenteen hoitamisen, tarvittavasta tietojärjestelmäkokonaisuudesta huolehtimisen ja mahdollisista erityisjärjestelyistä päättämisen. Virasto tiedottaisi verkkosivuillaan kokeeseen valmistautumisessa käytettävästä oppimateriaalista, kokeeseen ilmoittautumisesta sekä henkilöllisyyden osoittamisesta koetilaisuuden yhteydessä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Uuden kansalaisuuskokeen laatimisesta Maahanmuuttovirasto sopisi lähtökohtaisesti jonkin yliopiston kanssa. Maahanmuuttovirasto ostaisi kansalaisuuskokeen kysymyksineen palveluna. Tähän ostopalveluun sisältyisi laaja valikoima koekysymyksiä vastausvaihtoehtoineen sekä kokeen oppimateriaali, johon monivalintakysymykset perustuisivat. Kansalaisuuskokeen oppimateriaali laadittaisiin kotoutumislain mukaisessa yhteiskuntaorientaatiossa käytettävän oppimateriaalin pohjalta sen sisältöjä ja laajuutta vastaavasti. Kysymykset ja vastausvaihtoehdot sekä kansalaisuuskokeen oppimateriaali olisi laadittava siten, että niissä huomioitaisiin kansalaisuutta varten vaadittava kielitaidon taso, joka on B1 kielitaidon arvioinnin eurooppalaisen kielitaidon arvioinnin viitekehyksen asteikolla. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ennen kansalaisuuskokeen käyttöönottoa koekysymyksiä olisi testattava, ja jatkossa niitä olisi kehitettävä. Koekysymysten kokonaisuuden hankinnassa olisi siten huomioitava kansalaisuuskokeen laatimisen edellyttämä kehitystyö ja testaus. Kansalaisuuskokeen käyttöönoton jälkeen koekysymyksiä olisi edelleen päivitettävä ja koetta varten olisi kehitettävä uusia kysymyksiä vastausvaihtoehtoineen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto kilpailuttaisi kansalaisuuskokeen järjestäjäverkoston ja tekisi sopimukset koetilaisuuksien järjestämisestä. Koetilaisuuksien järjestäjien olisi tarjottava sähköiselle monivalintakokeelle soveltuvat tilat ja puitteet. Koetilaisuuksien järjestäjät tarjoaisivat kokeen ajankohdiksi tilat kokeen suorittamiselle ja käyttäisivät kokeeseen ilmoittautumiselle tarkoitettua järjestelmää. Koetilaisuuksien järjestämiseen kuuluisi kokeeseen osallistuvien henkilöllisyyden tarkastaminen ennen kokeen alkua, samoin kuin koetilaisuuksien valvonta. Koetilaisuuksien järjestäjät valvoisivat, että kokeeseen osallistuvat alkaisivat suorittaa koetta teknisesti suljetussa ympäristössä. Lisäksi koetilaisuuksien järjestäjien olisi huolehdittava osallistujien mahdollisesti tarvitsemista mukautuksista ja erityisjärjestelyistä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston olisi lisättävä verkkosivuilleen tarpeellisia tietoja kansalaisuuskokeen suorittamisesta, kuten linkki kokeeseen valmistautumisessa käytettävään oppimateriaaliin, kokeen esimerkkikysymyksiä vastauksineen, koeajat ja -paikat, tietoa henkilöllisyyden osoittamisesta koetilaisuuden yhteydessä sekä linkki kokeeseen ilmoittautumiseen. Maahanmuuttovirasto huolehtisi myös kokeen maksuliikenteen hoitamisesta ja päättäisi maksujen palauttamisesta kokeeseen osallistumiseen estyneille. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen yleistä kehittämistä varten perustettaisiin asiantuntijatoimikunta, jonka puheenjohtaja olisi Maahanmuuttovirastosta. Varapuheenjohtajana toimisi mahdollisuuksien mukaan kotoutumisen asiantuntija, ja asiantuntijajäsenet edustaisivat lisäksi ainakin koulutuksen asiantuntemusta sekä kokeen laatijaa ja järjestäjää. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Jos koetilaisuudessa havaittaisiin häiritsevää tai vilpillistä toimintaa, tapauksen selvittämisestä ja siihen liittyvästä kuulemisesta huolehtisi Maahanmuuttovirasto, jolle kuuluisi myös mahdollisia seuraamuksia koskeva päätöksenteko. Maahanmuuttovirasto huolehtisi tällaisessa tilanteessa asian jälkikäteisestä selvittämisestä ja asianosaisen kuulemisesta hallintolain mukaisesti. Järjestyksen rikkomisen perusteella koesuoritus voitaisiin katsoa hylätyksi. Vilpillisen menettelyn, siinä avustamisen tai vilpin yrityksen perusteella koesuoritus voitaisiin niin ikään katsoa hylätyksi, minkä lisäksi asianosainen voisi menettää oikeutensa osallistua kansalaisuuskokeeseen määräajaksi.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen tuloksesta voisi tehdä oikaisuvaatimuksen Maahanmuuttovirastolle, joka kansalaisuuskokeen hallinnoinnista vastaavana viranomaisena käsittelisi oikaisuvaatimukset keskitetysti. Ehdotettavan kansalaisuuskokeen hyväksytty suoritus edellyttäisi sitä, että kokeeseen osallistuva valitsisi kokeen kysymyksiin riittävän määrän oikeita vastausvaihtoehtoja. Koetuloksen hyväksyttävyyteen ei siten lähtökohtaisesti liittyisi juurikaan tulkinnanvaraa. Oikaisuvaatimusmenettely olisi tarpeen ennen kaikkea sen selvittämistä varten, olisiko esimerkiksi jokin tekninen häiriötilanne estänyt kokeen suorittamisen hyväksytysti. Menettelyssä huomioitaisiin kuitenkin myös sellaiset tilanteet, joissa oikaisua vaadittaisiin monivalintakysymysten tulkinnanvaraisuuden vuoksi. Tarvetta muutoksenhaulle vähentäisi osaltaan se, että kansalaisuuskokeen voisi käydä suorittamassa uudestaan, jos kokeessa valittujen oikeiden vastausten määrä ei riittäisi hyväksyttyyn suoritukseen.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuuskoetta varten tarvittava tietojärjestelmäkokonaisuus\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Kuten edellä (4.2.1.1) on todettu, uudesta kansalaistamisen edellytyksestä seuraisi muutostarpeita Maahanmuuttoviraston tietojärjestelmiin, ulkomaalaisasioiden asiankäsittelyjärjestelmään ja sähköiseen Enter Finland -verkkopalveluun. Lisäksi kansalaisuuskokeen täytäntöönpanoon tarvittaisiin tietojärjestelmäratkaisuja, joita Maahanmuuttovirasto voisi kilpailuttaa ja hankkia ostopalveluina. Osan niistä Maahanmuuttovirasto voisi mahdollisesti toteuttaa myös itse. Kumpikin vaihtoehto edellyttäisi kehitystyötä ja testausta ennen käyttöönottoa. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Monivalintakokeena toteutettavaa kansalaisuuskoetta varten tarvittaisiin sähköinen järjestelmä eri koetilaisuuksissa käytettäville kysymyksille vastausvaihtoehtoineen. Koekysymysten järjestys voisi olla sattumanvarainen ja vaihdella eri osallistujille. Koevastausten tarkastus toteutettaisiin sähköisesti. Osallistujan pääsy muille verkkosivuille tai laitteelle tallennettuun materiaaliin estettäisiin koetilaisuuden aikana. Henkilöllisyyden tarkastamisen yhteydessä voitaisiin esimerkiksi antaa osallistujille erillinen verkkolinkki ja erillinen salasana koejärjestelmään.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta varten tarvittaisiin myös järjestelmä tai toiminto kokeeseen ilmoittautumiselle, jonka yhteydessä suoritettaisiin kokeen osallistumismaksu. Lisäksi kansalaisuuskoetta varten tarvittaisiin järjestelmä tai toiminto koetulosten rekisteröintiin, jolla olisi puolestaan mahdollisesti yhteys edellä mainittuun sähköiseen koejärjestelmään ja kansalaisuushakemusten käsittelyyn. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Taulukko 2: Kansalaisuuskoejärjestelmään kuuluvan tietojärjestelmäkokonaisuuden osia. &nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N105F4\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Osa\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Koekysymykset\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kokeeseen ilmoittautuminen\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kokeen suorittaminen\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Koesuoritusten rekisteröinti\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Sisältö&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Riittävän suuri määrä monivalintakysymyksiä vastausvaihtoehtoineen&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Järjestelmä/osa kokeeseen ilmoittautumiseen&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Järjestelmä/osa kansalaisuuskokeen suorittamiseen&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Tiedot kokeen suorituksista&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Käyttö&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeet koostuisivat kysymyksistä vastausvaihtoehtoineen. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Koetilaisuuksien järjestäjät merkitsisivät järjestelmään tiedot vapaista koepaikoista. &nbsp;\u003C/p>\n            \u003Cp class=\"KappaleKooste\">Osallistujat ilmoittautuisivat kokeeseen ja maksaisivat koemaksun. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Osallistujat suorittaisivat kokeen valvotussa koetilaisuudessa tietokoneella sähköistä testijärjestelmää käyttäen. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kokeen suoritustiedot talletettaisiin tietojärjestelmään, josta ne olisivat saatavilla kansalaistamista koskevien asioiden käsittelyä varten. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Yhteydet muihin osiin&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Yhteys kansalaisuuskokeen suorittamisessa käytettävään sähköiseen testijärjestelmään&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Yhteys sähköiseen testijärjestelmään, jossa kokeeseen ilmoittautuneet suorittaisivat kokeen henkilöllisyyden tarkastuksen jälkeen.&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Yhteys koekysymyksiin ja koesuoritusten rekisteröintiin &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Yhteys sähköiseen testijärjestelmään ja kansalaisuushakemusten käsittelyyn &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston rooli&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Virasto hankkisi kysymykset vastausvaihtoehtoineen ja oppimateriaalin ostopalveluna. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Virasto hallinnoisi kokeen maksuliikennettä. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Virasto hankkisi järjestelmän tai palvelun. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Virasto toimisi rekisterinpitäjänä. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Muuta&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kysymykset vastauksineen perustuisivat kansalaisuuskokeen oppimateriaaliin. Kysymykset edellyttäisivät ylläpitoa.&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto voisi merkitä järjestelmään kokeessa ilmenneen vilpillisen menettelyn perusteella annetut tilapäiset osallistumiskiellot. &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Monivalintakokeen suoritusten tarkastus toteutettaisiin sähköisesti.&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kansalaistamisen edellytyksen täyttymisen arvioinnissa hyödynnettäisiin tietoja koesuorituksista. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Julkisen hallinnon tiedonhallinnasta annetun lain (906/2019) 8 §:n 2 momentin mukaan toimialasta vastaavan ministeriön on laadittava 5 §:n 3 momentin mukainen arviointi, kun valmisteltavat säännökset vaikuttavat tietoaineistoihin ja tietojärjestelmiin. Lisäksi ministeriön on arvioitava suunniteltujen säännösten vaikutukset asiakirjojen julkisuuteen ja salassapitoon. Suunniteltaessa olennaisia hallinnollisia uudistuksia ja tietojärjestelmien käyttöönottoa tiedonhallintayksikössä on 5 §:n 3 momentin mukaisesti arvioitava muutosten vaikutukset mm. tiedonhallinnan vastuisiin ja tietoturvallisuuteen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tämän esityksen ehdotuksilla on tiedonhallintalain 8 §:n 2 momentissa tarkoitettuja vaikutuksia Maahanmuuttoviraston tiedonhallintaan. Kansalaisuuskokeesta seuraisi Maahanmuuttovirastolle uusia tehtäviä, ja koetta varten tarvittaisiin erilaisia muutoksia tietojärjestelmäkokonaisuuteen. Tietojärjestelmäkokonaisuuden olisi jatkossa mahdollistettava sellaisia kansalaisuuskokeeseen liittyviä toimintoja kuin kansalaisuuskokeeseen ilmoittautuminen ja kokeen osallistumismaksun suorittaminen, oppimateriaalin pohjalta laaditun sähköisen monivalintakokeen suorittaminen ja koevastausten sähköinen tarkastus sekä koesuoritusten rekisteröinti ja kokeen suorittamista koskevan tiedon hyödyntäminen kansalaisuushakemuksen käsittelyssä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Taulukko 3: Kansalaisuuskokeen käyttöönoton vaikutukset tiedonhallintaan. &nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10727\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Tiedonhallinnan osa\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Muutosten vaikutukset\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Tiedonhallinnan vastuut\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta varten tarvittavan tietojärjestelmäkokonaisuuden rekisterinpitäjänä toimisi Maahanmuuttovirasto. Kokeeseen ilmoittautuneiden tietoja käsittelisivät myös palveluntuottajat, jotka olisivat tehneet Maahanmuuttoviraston kanssa sopimuksen koetilaisuuksien järjestämisestä. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Tietoturvallisuustoimet\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen yhteydessä käsiteltäviä tietoja varten ei edellytettäisi erityistä luotettavuutta ulkomaalaisasioiden asiankäsittelyjärjestelmässä nykyisin oleviin tietoihin verrattuna. Kokeeseen ilmoittautumisen yhteydessä tietojärjestelmään voitaisiin merkitä tietoja sellaisista erityisjärjestelyistä, joita kokeeseen osallistuvat tarvitsisivat terveydentilansa tai vammaisuutensa vuoksi tai muusta näihin rinnastuvasta syystä. Tietojärjestelmän tietoturvallisuuden olisi siten oltava salassa pidettävien tietojen ja erityisiin henkilötietoryhmiin kuuluvien henkilötietojen edellyttämällä tasolla.&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Tietoaineistojen muodostaminen\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Tietoaineistoja muodostuisi siitä, että asiakkaat ilmoittautuisivat kokeeseen ja suorittaisivat sen. &nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Asiakirjojen julkisuus ja salassapito\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Esityksessä ei ehdoteta muutoksia asiakirjojen julkisuutta ja salassapitoa koskevaan sääntelyyn.&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Yhteentoimivuus\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Tietojärjestelmäkokonaisuuden eri osilla olisi yhteyksiä toisiinsa siten, että yhden osan sisältämiä tietoja hyödynnettäisiin toisessa.&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Viranomaisten toiminnan julkisuudesta annetun lain (621/1999, \u003Cspan class=\"KursiiviTeksti\">julkisuuslaki\u003C/span>) 24 §:n 1 momentin 22 kohdan mukaan salassa pidettäviin viranomaisen asiakirjoihin kuuluvat asiakirjat, jotka sisältävät tietoja pääsy- tai muusta kokeesta tai testistä, jos tiedon antaminen vaarantaisi kokeen tai testin tarkoituksen toteutumisen tai testin käyttämisen vastaisuudessa. Tiedon antaminen kansalaisuuskokeen kysymyksistä ja vastausvaihtoehdoista vaarantaisi kokeen tarkoituksen toteutumisen. Tällaisia tietoja sisältävä asiakirja olisi siten salassa pidettävä. Kansalaisuuskokeen toteutukseen osallistuvien olisi huolehdittava kansalaisuuskokeen ja etenkin sen kysymysten ja vastausvaihtoehtojen käsittelystä julkisuuslain edellyttämällä tavalla. &nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Taloudelliset vaikutukset\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Arvioiden mukaan kansalaisuuskokeen alkuinvestoinneista aiheutuvat kertaluonteiset kustannukset ovat yhteensä noin 4,2 miljoonaa euroa ja pysyvät kustannukset noin 2,35 miljoonaa euroa. Ehdotettavien muutosten taloudelliset vaikutukset liittyisivät ennen kaikkea siihen, että kansalaisuuskoe olisi Suomessa kokonaan uusi ja sen käyttöönotosta aiheutuisi erilaisia kustannuksia. Osa kustannuksista johtuisi uudesta edellytyksestä ja siihen liittyvästä Maahanmuuttoviraston työn lisääntymisestä. Suurin osa kustannuksista tulisi kuitenkin aiheutumaan uudesta kansalaisuuskoejärjestelmästä, siihen tarvittavasta tietojärjestelmäkokonaisuudesta, itse kokeen kysymysten ja vastausvaihtoehtojen laatimisesta sekä koetilaisuuksien järjestämisestä. Julkisen talouden suunnitelmassa ei ole myönnetty määrärahaa tarvittaviin muutoksiin. Mahdollinen lisämäärärahatarve arvioidaan vuoden 2026 II lisätalousarvion valmistelun yhteydessä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen käyttöönottoa koskevassa työryhmän selvityksessä (s. 59–60) arvioitiin, että kansalaisuuskokeeseen tulisi Suomessa osallistumaan vuosittain noin 5000–10 000 henkilöä. Arvio perustuu vuosina 2020–2023 kansalaisuutta hakeneiden 18–64-vuotiaiden määrään. Työryhmän selvitys sisälsi myös alustavia huomioita kansalaisuuskokeen käyttöönoton vaatimista voimavaroista (s. 81–82). Selvityksessä tarkasteltiin eräiden muiden samankaltaisten järjestelmien kustannuksia ja kehitystyön vaatimaa aikaa. Esimerkiksi Opetushallituksen hallinnoiman yleisen kielitutkinnon vuosittaiset ylläpitokustannukset ovat yhteensä 1 912 000 euroa. Selvityksen perusteella kilpailutuksiin olisi varattava aikaa ainakin kolmesta kuuteen kuukautta. Maahanmuuttoviraston välttämättömään järjestelmäkehitykseen tarvittaisiin puolestaan aiemmista hankkeista saatujen kokemusten perusteella mahdollisesti neljästä kahdeksaan kuukautta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaisuuskokeen kysymykset perustuisivat kansalaisuuskokeen oppimateriaaliin, joka laadittaisiin kotoutumislain mukaisen yhteiskuntaorientaation oppimateriaalin pohjalta. Kansalaisuuskoetta ja siihen valmistautumista varten ei siten tarvitsisi laatia sisällöltään täysin uutta oppimateriaalia. Kansalaisuuskokeen kysymysten ja oppimateriaalin laatiminen sekä koetilaisuuksien järjestäminen toteutettaisiin Maahanmuuttoviraston kilpailuttamina ja hankkimina ostopalveluina. Kansalaisuuskokeeseen ilmoittautumista, sähköistä monivalintakoetta ja koetulosten rekisteröintiä varten tarvittaisiin tietojärjestelmäkokonaisuus, joka edellyttäisi ainakin jonkin verran kehitystyötä ja testausta. Kansalaisuuskoe olisi testattava myös kokonaisuutena ennen ensimmäistä koetilaisuutta. Myös järjestelmäkehityksestä ja testauksesta aiheutuisi kustannuksia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Alla on eri tehtäväkokonaisuuksien mukaan ryhmiteltynä arvioita siitä, mitä erilaisia kustannuksia kansalaisuuskokeesta aiheutuisi. Taulukkoon on eritelty kansalaisuuskokeen vaatimista alkuinvestoinneista aiheutuvat kertaluonteiset kustannukset sekä kansalaisuuskoejärjestelmästä jatkossa aiheutuvat pysyvät vuosittaiset kustannukset. Kansalaisuuskokeen käyttöönoton valmisteluun Maahanmuuttovirastossa sisältyisi yhteensä kaksi ja puoli henkilötyövuotta. Käyttöönoton jälkeen kokeen hallinnointiin, valvontaan ja kehittämiseen sisältyisi virastossa puolestaan yhteensä kolme henkilötyövuotta. Kansalaisuuskoetta varten tarvittavasta tietojärjestelmäkokonaisuudesta aiheutuvat kustannukset jakautuisivat useammalle vuodelle. Kansalaisuuskokeen käyttöönottoa varten välttämättömin tietojärjestelmäkehitys ajoittuisi vuodelle 2026. Kansalaisuuskoetta varten tarvittavaa lopullista tietojärjestelmäkokonaisuutta toteutettaisiin puolestaan vuoden 2027 aikana. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Taulukko 4: Yhteiskuntatietoedellytyksestä ja kansalaisuuskokeesta aiheutuvat kustannukset.&nbsp;\u003C/p>\n      \u003Cdiv id=\"tableID-N107D0\" class=\"table\">\n       \u003Ctable class=\"vaskitgroup\">\n        \u003Ctbody class=\"tbody\">\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Tehtävä\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kertakustannukset vuosina 2026–2027 \u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Pysyvät kulut / vuosi (vuodesta 2027)\u003C/span>&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen tietojärjestelmä ja muutokset ulkomaalaisasioiden asiankäsittelyjärjestelmään&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">2 000 000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">60 000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatiminen (kysymykset ja oppimateriaali)&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">200 000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen ylläpito ja kehittäminen&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">60 000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Koetilaisuuksien järjestäminen ja käynnistäminen&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">1&nbsp;320&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">1 900 000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen käyttöönoton valmistelu Maahanmuuttovirastossa, ml. viestintä&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">680 000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen hallinnointi ja valvonta Maahanmuuttovirastossa&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">330&nbsp;000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n         \u003Ctr class=\"vaskirow\n                \">\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">Yhteensä&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">4 200 000 €&nbsp;\u003C/p>\n          \u003C/td>\n          \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n           \u003Cp class=\"KappaleKooste\">2 350 000 €&nbsp;\u003C/p>\n          \u003C/td>\n         \u003C/tr>\n        \u003C/tbody>\n       \u003C/table>\n      \u003C/div>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen käyttöönoton kokonaiskustannukset olisivat noin 4,2 miljoonaa euroa.\u003Cspan class=\"AlaviiteTeksti\"> Arvioita erityisesti kokeen käyttöönoton kertakustannuksista tarkennettiin lausuntokierroksen jälkeen. Lausuntokierroksella olleen esitysluonnoksen mukaan arvio kokonaiskustannuksista oli 4,9 miljoonaa euroa. Erilaiset tietojärjestelmäkustannukset arvioitiin kuitenkin valmistelun kuluessa alhaisemmiksi. \u003C/span> Käyttöönotto toteutettaisiin kokonaisuudessaan vuosina 2026–2027. Kansalaisuuskokeen käyttöönoton jälkeen pysyvät kulut olisivat noin 2,35 miljoonaa euroa vuodessa. Nämä kulut katettaisiin kokeeseen osallistuvilta asiakasmaksuina pidemmän ajan kuluessa. Kansalaisuuskokeen investointikustannukset tulisivat katetuksi investointien poistoina. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Edellä on kuvattu esityksen vaikutuksia julkiseen talouteen. Kotitalouksiin taas ehdotetuilla muutoksilla olisi vaikutusta ennen kaikkea siten, että kansalaisuuden hakemisesta kiinnostuneiden työikäisten aikuisten olisi jatkossa lähtökohtaisesti suoritettava kansalaisuuskoe. Kansalaisuuskokeen myötä kansalaisuuden hakemiseen liittyisi myös uusi kustannus, kun kansalaisuuskokeeseen osallistumisesta perittäisiin erillinen koemaksu. Maksun suuruudesta ei ole vielä tarkkaa arviota, mutta esimerkiksi yleisessä kielitutkinnossa, joka usein suoritetaan ennen kansalaisuuden hakemista, tutkintomaksu on 190 euroa.\u003Cspan class=\"AlaviiteKooste\"> Tutkintomaksu on 190 euroa keskitason tutkinnossa, jolla kansalaisuuteen vaadittava kielitaidon taso voidaan osoittaa (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.oph.fi/fi/koulutus-ja-tutkinnot/ilmoittautuminen-yki-testiin\">https://www.oph.fi/fi/koulutus-ja-tutkinnot/ilmoittautuminen-yki-testiin\u003C/a>\u003C/span>\u003C/span>\u003C/span> Lisäksi jäljempänä (5.2) eräiden muiden maiden kansalaisuuskokeita tarkasteltaessa ilmenee, että kansalaisuuskokeen maksu vaihtelee eri maissa yleensä kymmenistä euroista yli sataan euroon. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoedellytys ja kansalaisuuskoe eivät kuitenkaan koskisi alle 18-vuotiaita, joten lapsiperheissä koemaksu liittyisi käytännössä vain perheen aikuisten kansalaisuuden hakemiseen. Jos kansalaisuuskokeessa valittujen oikeiden vastausten määrä ei riittäisi hyväksyttyyn suoritukseen, kokeeseen voisi ilmoittautua ja osallistua uudestaan. Tällöin olisi suoritettava myös uusi koemaksu samaan tapaan kuin nykyisin yleisen kielitutkinnon uusimisen yhteydessä. Koemaksusta seuraavien vaikutusten lisäksi kansalaisuuskokeella olisi vaikutusta kotitalouksien ajankäyttöön, kun ennen kansalaisuushakemuksen jättämistä olisi jatkossa suoritettava hyväksytysti kansalaisuuskoe, johon olisi valmistauduttava etukäteen opiskelemalla kansalaisuuskokeen oppimateriaalia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yrityksiin kohdistuvien välillisten vaikutusten arvioidaan puolestaan jäävän pieniksi. Ehdotusten välilliset vaikutukset esimerkiksi yritysten työvoiman saantiin eivät todennäköisesti olisi merkittäviä. Kansalaisuuskokeen järjestäjäverkostoon voisi mahdollisesti kuulua myös joitakin sellaisia yrityksiä, joiden kanssa Maahanmuuttovirasto sopisi koetilaisuuksien järjestämisestä. Koetilaisuuksien järjestäminen toteutettaisiin kansalaisuuskoejärjestelmässä Maahanmuuttoviraston kilpailuttamina ja hankkimina ostopalveluina. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset perus- ja ihmisoikeuksien toteutumiseen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Perustuslain perusoikeussäännökset koskevat pääsääntöisesti kaikkia Suomen oikeudenkäyttöpiirissä olevia. Suomen kansalaisuus ei siten vaikuta useimpien perusoikeuksien toteutumiseen. Kansalaistamisen edellytyksiin aiemmin tehtyjen muutosten yhteydessä arvioitiin, että asumisajan pidentäminen ja muut muutokset vaikuttavat oikeuksien toteutumiseen ennen kaikkea lykkäävästi siltä osin kuin eräät oikeudet liittyvät Suomen kansalaisuuteen. Aiemmat kansalaisuuslakiin tehdyt muutokset koskivat asumisajan lisäksi henkilöllisyyttä, nuhteettomuusedellytystä ja toimeentuloedellytystä sekä turvallisuuden huomioimista kansalaisuuden myöntämisen yhteydessä. Kansalaisuuslakiin tehtiin myös eräitä sellaisia muutoksia, joiden perusteella Suomen kansalaisuuden ja samalla siihen liittyvät oikeudet voi menettää jonkin verran aiempaa useammassa tilanteessa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Osa vaali- ja osallistumisoikeuksista koskee vain Suomen kansalaisia, kuten oikeus äänestää valtiollisissa vaaleissa. Eräät liikkumisvapauteen kuuluvat oikeudet koskevat niin ikään erityisesti Suomen kansalaisia. Suomen kansalaista ei saa estää saapumasta maahan eikä karkottaa maasta. Suomen kansalaisuus liittyy myös unionin kansalaisuuteen ja unionin kansalaisen oikeuksiin. Jos henkilöllä ei vielä ole jonkin Euroopan unionin jäsenvaltion kansalaisuutta, hän saa Suomen kansalaisuuden myötä samalla unionin kansalaisuuden siihen liittyvine oikeuksineen, joihin kuuluu oikeus vapaasti liikkua ja oleskella jäsenvaltioiden alueella sekä äänioikeus ja vaalikelpoisuus Euroopan parlamentin vaaleissa. Kansalaistamisen edellytysten tiukentamisella voi olla näiden oikeuksien toteutumisen kannalta lykkäävää vaikutusta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoedellytystä ja siihen liittyvän uuden kansalaisuuskokeen käyttöönottamista. Myös yhteiskuntatietoedellytys ja kansalaisuuskokeen suorittaminen vaikuttaisivat osaltaan kansalaisuuden saamisen mahdollisuuteen. Käytännössä useimpien olisi ennen kansalaisuushakemuksen tekemistä käytävä suorittamassa kansalaisuuskoe, johon olisi valmistauduttava opiskelemalla kansalaisuuskokeen oppimateriaalia. Kansalaisuuskokeella ja siihen valmistautumisella voi toisaalta olla välillistä vaikutusta perus- ja ihmisoikeuksien toteutumiseen sen myötä, että yksilön oikeudet ja velvollisuudet olisivat yhtenä keskeisenä kansalaisuuskokeen ja siihen käytettävän oppimateriaalin aihealueena.\u003Cspan class=\"AlaviiteKooste\"> Aihetta koskeva osio sisältyy myös yhteiskuntaorientaation oppimateriaaliin, jonka pohjalta kansalaisuuskokeen oppimateriaali laadittaisiin (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali/lait-ja-oikeus/yksilon-oikeudet-ja-velvollisuudet\">https://yhteiskuntaorientaatio.fi/oppimateriaali/lait-ja-oikeus/yksilon-oikeudet-ja-velvollisuudet\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Alla käsitellään yksityiskohtaisemmin arvioita siitä, miten ehdotettavat muutokset vaikuttavat eri perus- ja ihmisoikeuksien toteutumiseen. Tarkasteltavina ovat erityisesti yhdenvertaisuus, vaali- ja osallistumisoikeudet, liikkumisvapaus ja karkottamissuoja, oikeusturva, sivistykselliset oikeudet, oikeus sosiaaliturvaan, oikeus kansalaisuuteen sekä yksityiselämän ja henkilötietojen suoja.&nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhdenvertaisuus\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 6 §:n mukaan kaikki ihmiset ovat yhdenvertaisia lain edessä. Ketään ei saa ilman hyväksyttävää perustetta asettaa eri asemaan sukupuolen, iän, alkuperän, kielen, uskonnon, vakaumuksen, mielipiteen, terveydentilan, vammaisuuden tai muun henkilöön liittyvän syyn perusteella. Lapsia on kohdeltava tasa-arvoisesti yksilöinä, ja heidän tulee saada vaikuttaa itseään koskeviin asioihin kehitystään vastaavasti. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Uuden yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa ylioppilas- tai korkeakoulututkinnolla tai uudella kansalaisuuskokeella, jossa testattaisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Tällaisia aiheita sisältyy myös kotoutumislain mukaiseen yhteiskuntaorientaatioon, jota varten laadittuun oppimateriaaliin\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/oppimateriaali\u003C/a>\u003C/span>\u003C/span>\u003C/span> kansalaisuuskokeen oppimateriaali perustuisi. Kokeen kysymykset koskisivat oppimateriaalin keskeisiä tietoja. Oppimateriaali olisi yleisesti saatavilla siten, että se olisi käytettävissä kansalaisuuskokeeseen valmistautumiseen. Kansalaisuuden hakemisesta kiinnostuneilla olisi siten yhdenvertaiset mahdollisuudet kansalaisuuskokeen suorittamiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe olisi tietopohjainen koe, jonka pystyisi suorittamaan opiskeltuaan yleisesti saatavilla olevan oppimateriaalin keskeisiä tietoja. Kokeen kysymykset eivät koskisi hyvin yksityiskohtaisia tietoja, vaan kokeella testattaisiin ehdotuksen mukaan perustietoja yhteiskunnan toimintaan liittyvistä oppimateriaalissa käsittelyistä aiheista. Tietoon perustuvalla kokeella ei asetettaisi ketään eri asemaan esimerkiksi vakaumuksen tai mielipiteen perusteella. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeessa käytettävän suomen tai ruotsin kielen taso vastaisi puolestaan kansalaisuutta varten vaadittavaa kielitaidon tasoa, joka on B1 eurooppalaisen kielitaidon arvioinnin viitekehyksen asteikolla. Kansalaisuuskokeella ei siten asetettaisi hakijoita eri asemaan laissa säädetyn tason ylittävän kielitaidon tason perusteella. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteiskuntatiedon osoittamista ei ehdotuksen mukaan edellytettäisi lapsilta eli alle 18-vuotiailta. Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia 18 vuoden täyttämiseen asti. Lapset ovat myös useimmiten kanssahakijoina vanhempiensa hakemuksissa. Jos kanssahakija täyttäisi 18 vuotta ennen hakemuksen ratkaisemista, häneltä ei edellyttäisi erikseen yhteiskuntatiedon osoittamista.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Vaadittavan yhteiskuntatiedon voisi osoittaa myös suomen- tai ruotsinkielisellä ylioppilastutkinnolla. Ylioppilastutkintoa edeltävään lukiokoulutukseen sisältyy sellaisia yhteiskuntaopin opintoja, jotka suorittaneelta ei olisi tarpeen vaatia kansalaisuuskokeen suorittamista. Lukion yhteiskuntaopin tarkoituksena on antaa opiskelijalle valmiuksia kasvaa yhteiskunnallisista asioista kiinnostuneeksi kansalaiseksi, ja oppiaineen arvopohjassa korostuvat mm. sellaiset demokratian peruslähtökohdat kuin tasa-arvo ja ihmisoikeuksien kunnioittaminen. Ylioppilastutkinnon suorittanut olisi siten osoittanut kansalaisuuteen vaadittavat tiedot yhteiskunnasta.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Niin yhteiskuntaorientaation oppimateriaalin pohjalta laadittu kansalaisuuskokeen oppimateriaali kuin myös siihen perustuvat kansalaisuuskokeen kysymykset kattaisivat sellaisia aiheita kuin suomalaisen yhteiskunnan keskeinen lainsäädäntö sekä perus- ja ihmisoikeudet. Kokeessa voisi olla oppimateriaalin tietoja koskevia kysymyksiä esimerkiksi yhdenvertaisuudesta, sukupuolten tasa-arvosta sekä Suomen historiasta ja kulttuurista. Yhdenvertaisuus kuuluisi siten kansalaisuuskokeessa ja siihen käytettävässä oppimateriaalissa käsiteltävien aiheiden joukkoon. Kansalaisuuskokeeseen valmistautumisella voisi siksi osaltaan olla välillistä myönteistä vaikutusta yhdenvertaisuuteen aihetta koskevien tietojen kartuttamisen myötä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe olisi kirjallinen koe, jossa edellytettäisiin keskeisten yhteiskuntaa koskevien tietojen lisäksi käytännössä yleensä tekstin ymmärtämistä, jotta koetta suorittava kykenisi valitsemaan kysymyksiin oikeat vastausvaihtoehdot. Maahanmuuttovirasto voisi myöntää kokeeseen ilmoittautuneelle esimerkiksi lisäaikaa koetilaisuuteen, jos tämä olisi toimittanut virastolle tarvittavan selvityksen lukemisen vaikeudestaan. Kokeen erityisjärjestelyjen tarkoituksena olisi turvata kansalaisuuden hakemisesta kiinnostuneiden yhdenvertaiset mahdollisuudet kokeen suorittamiseen. Kokeeseen valmistautumisessa yhdenvertaisuuden toteutumista edistäisi puolestaan se, että osa kansalaisuudesta kiinnostuneista olisi osallistunut yhteiskuntaorientaatioon ja opiskellut siihen kuuluvia aiheita kunnan kotoutuja-asiakkaina.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Terveydentilan ja vammaisuuden vaikutus kokeen suorittamiseen on huomioitu esityksessä kahdella tavalla. Maahanmuuttovirasto voisi kokeeseen ilmoittautuneen pyynnöstä myöntää koetilaisuuteen erityisjärjestelyjä, joiden avulla mm. vammaiset henkilöt pystyisivät suorittamaan kansalaisuuskokeen yhdenvertaisesti muiden kanssa. Lisäksi yhteiskuntatietoedellytyksestä voitaisiin ehdotuksen mukaan poiketa, jos hakijan terveydentila tai vammaisuus pitkäaikaisesti estäisi häntä täyttämästä edellytystä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuslain 18 b §:n 2 ja 3 momentissa tarkoitetut luku- ja kirjoitustaidottomat voisivat suorittaa kansalaisuuskokeen erityisjärjestelyin suullisesti. Suullisessa kokeessa käytettävä suomen tai ruotsin kieli mukautettaisiin esimerkiksi rakenteeltaan yleiskieltä ymmärrettävämpään muotoon. Tällä tavoin huomioitaisiin se, että luku- ja kirjoitustaidottomalta henkilöltä edellytetään ainoastaan suullista kielitaitoa kansalaisuuden saamiseksi. Kansalaisuuskokeen oppimateriaali olisi saatavissa myös kuunneltavassa muodossa kokeeseen valmistautumista varten. Kansalaisuuskoe vastaisi sisällöltään kotoutumislain 25 §:ssä tarkoitetun yhteiskuntaorientaation sisältöä. Kunnan on järjestettävä kotoutuja-asiakkaille yhteiskuntaorientaatio mahdollisuuksien mukaan heidän äidinkielillään tai muutoin hyvin osaamillaan kielillä. Ainakin osa 18 b §:n 2 ja 3 momentissa tarkoitetuista luku- ja kirjoitustaidottomista olisi suorittanut yhteiskuntaorientaation tai osallistunut muuhun sellaiseen koulutukseen, jossa olisi käsitelty suomalaista yhteiskuntaa. Tämän lisäksi kahdeksan vuoden asumisajan aikana on mahdollista suorittaa muitakin koulutuksia, joiden tarkoituksena on yhteiskuntaosaamisen, luku- ja kirjoitustaidon ja kielitaidon kerryttäminen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Myös tulevaan kokeeseen osallistuvien eri asuinpaikat huomioitaisiin. Kansalaisuuskokeen järjestämistä koskevia sopimuksia tehtäessä olisi ehdotuksen mukaan otettava huomioon, että koetilaisuuksia olisi tarjolla alueellisesti riittävä määrä. Kansalaisuuskokeen suorittamista varten voitaisiin edellyttää osallistujalta sellaista matkustamista, jota voitaisiin pitää kohtuullisena. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Esityksessä ei ehdoteta muutoksia lasten kuulemiseen, vaan kansalaisuuslain 5 §:ssä olevat säännökset lapsen ja huoltajan kuulemisesta säilyvät ennallaan. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaali- ja osallistumisoikeudet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 14 §:n mukaan jokaisella Suomen kansalaisella, joka on täyttänyt kahdeksantoista vuotta, on oikeus äänestää valtiollisissa vaaleissa ja kansanäänestyksessä. Jokaisella Suomen kansalaisella ja maassa asuvalla muulla Euroopan unionin kansalaisella, joka on täyttänyt kahdeksantoista vuotta, on oikeus äänestää Euroopan parlamentin vaaleissa sen mukaan kuin lailla säädetään. Jokaisella Suomen kansalaisella ja maassa vakinaisesti asuvalla ulkomaalaisella, joka on täyttänyt kahdeksantoista vuotta, on oikeus äänestää kunnallisvaaleissa ja kunnallisessa kansanäänestyksessä sen mukaan kuin lailla säädetään. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Oikeus äänestää valtiollisissa vaaleissa ja kansanäänestyksessä on rajattu ainoastaan Suomen kansalaisille. Tietyt vaali- ja osallistumisoikeudet voisi jatkossakin saada täyttäessään kansalaisuuden saamisen edellytykset, joihin ehdotetaan tässä esityksessä lisättäväksi uusi yhteiskuntatietoedellytys. Täyttääkseen yhteiskuntatietoedellytyksen olisi useimmiten suoritettava kansalaisuuskoe, johon olisi valmistauduttava etukäteen oppimateriaalia opiskelemalla. Uusi kansalaistamisen edellytys ja kansalaisuuskoe voivat osaltaan vaikuttaa kolmannen maan kansalaisen mahdollisuuksiin saada Suomen ja siten myös unionin kansalaisuus ja tähän liittyvät oikeudet. Alue- ja kuntavaaleihin osallistuminen ei edellytä Suomen kansalaisuutta, joten tältä osin esitys ei vaikuttaisi vaali- ja osallistumisoikeuksien toteutumiseen.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Liikkumisvapaus ja karkottamissuoja\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 9 §:n mukaan Suomen kansalaisella ja maassa laillisesti oleskelevalla ulkomaalaisella on vapaus liikkua maassa ja valita asuinpaikkansa. Pykälän 2 momentin mukaan jokaisella on oikeus lähteä maasta. Tähän oikeuteen voidaan lailla säätää välttämättömiä rajoituksia oikeudenkäynnin tai rangaistuksen täytäntöönpanon varmistamiseksi taikka maanpuolustusvelvollisuuden täyttämisen turvaamiseksi. Pykälän 3 momentin mukaan Suomen kansalaista ei saa estää saapumasta maahan, karkottaa maasta eikä vastoin tahtoaan luovuttaa tai siirtää toiseen maahan. Lailla voidaan kuitenkin säätää, että Suomen kansalainen voidaan rikoksen johdosta tai oikeudenkäyntiä varten taikka lapsen huoltoa tai hoitoa koskevan päätöksen täytäntöönpanemiseksi luovuttaa tai siirtää maahan, jossa hänen ihmisoikeutensa ja oikeusturvansa on taattu. Pykälän 4 momentin mukaan ulkomaalaisen oikeudesta tulla Suomeen ja oleskella maassa säädetään lailla. Ulkomaalaista ei saa karkottaa, luovuttaa tai palauttaa, jos häntä tämän vuoksi uhkaa kuolemanrangaistus, kidutus tai muu ihmisarvoa loukkaava kohtelu.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Useita liikkumisvapauteen liittyviä oikeuksia ei ole rajattu ainoastaan Suomen kansalaisille. Kansalaisuuden saamiseen ehdotettavat muutokset eivät siten suurelta osin vaikuta liikkumisvapauteen kuuluvien oikeuksien toteutumiseen. Kansalaistamisen edellytyksiin ehdotettavilla muutoksilla on kuitenkin vaikutusta Suomen kansalaiselle kuuluvien oikeuksien saamiseen. Kansalaisuuden saaminen tuo mukanaan kansalaisen oikeuden saapua maahan sekä suojan maasta karkottamiselta. Kansalaistamiselle ehdotetaan tässä esityksessä uutta yhteiskuntatietoedellytystä, joka hakijan olisi jatkossa täytettävä Suomen kansalaisuuteen liittyvät oikeudet saadakseen. Ehdotettavat muutokset vaikuttavat välillisesti myös esimerkiksi Suomen passin saamiseen.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oikeusturvan toteutuminen\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 21 §:n mukaan jokaisella on oikeus saada asiansa käsitellyksi asianmukaisesti ja ilman aiheetonta viivytystä lain mukaan toimivaltaisessa tuomioistuimessa tai muussa viranomaisessa sekä oikeus saada oikeuksiaan ja velvollisuuksiaan koskeva päätös tuomioistuimen tai muun riippumattoman lainkäyttöelimen käsiteltäväksi. Käsittelyn julkisuus sekä oikeus tulla kuulluksi, saada perusteltu päätös ja hakea muutosta samoin kuin muut oikeudenmukaisen oikeudenkäynnin ja hyvän hallinnon takeet turvataan lailla. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Keskeinen tapa tämän esityksen mukaiseen yhteiskuntatiedon osoittamiseen olisi uusi kansalaisuuskoe, jonka oppimateriaali pohjautuisi kotoutumislain mukaista yhteiskuntaorientaatiota varten laadittuun oppimateriaaliin ja joka suoritettaisiin valitsemalla kokeen kysymyksiin oikeat vastaukset useammasta vaihtoehdosta. Ehdotettava uusi koe olisi siten toteutustavaltaan verraten yksinkertainen, ja koesuoritus olisi hyväksytty, jos kokeen suorittaja olisi valinnut siinä vaadittavan määrän oikeita vastauksia. Kokeessa alle hyväksytyn suorituksen jäänyt voisi myöhemmin osallistua kokeeseen uudestaan. Koesuoritusta koskevan muutoksenhaun tarve jäisi siten suhteellisen vähäiseksi. Esityksessä ehdotetaan kuitenkin, että kokeen tulokseen voisi vaatia Maahanmuuttovirastolta oikaisua. Virasto voisi tällöin selvittää, olisiko esimerkiksi jokin tekninen häiriötilanne estänyt kokeen suorittamisen hyväksytysti. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Joissain tilanteissa oikaisuvaatimukselle voisi ilmetä tarvetta myös monivalintakysymysten tulkinnanvaraisuuden vuoksi. Koekysymysten tulkinnanvaraisuuden arviointiin ehdotetaan menettelyä, jossa Maahanmuuttovirasto pyytäisi oikaisuvaatimuksesta lausunnon asiantuntijatoimikunnalta. Näin turvattaisiin tarvittava asiantuntemus monivalintakysymysten ja niiden vastausvaihtoehtojen sisällön ja tulkinnanvaraisuuden arviointiin. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Oikaisuvaatimuksen perusteella tehdystä Maahanmuuttoviraston päätöksestä ei saisi valittaa hallinto-oikeuteen. Muutoin Maahanmuuttoviraston päätöksistä voisi valittaa hallinto-oikeuteen oikeudenkäynnistä hallintoasioissa annetun lain (808/2019) mukaisesti. Kansalaisuuskokeeseen liittyvä oikeusturva toteutuisi hallinto-oikeusteitse sellaisissa tilanteissa, joissa Maahanmuuttovirasto olisi tehnyt päätöksen koemaksun palautuksesta, erityisjärjestelyjen myöntämisestä tai seuraamusten antamisesta järjestyksen rikkomisen tai vilpillisen menettelyn perusteella. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Esityksessä ei ehdoteta mitään sellaisia muutoksia, jotka koskisivat valittamista kansalaisuushakemukseen tehdystä kielteisestä päätöksestä. Jos kansalaisuutta hakenut ei täyttäisi uutta yhteiskuntatietoedellytystä ja hänen hakemukseensa tehtäisiin kielteinen päätös, hänellä olisi käytössään oikeudenkäynnistä hallintoasioissa annetun lain mukainen valitustie. Maahanmuuttoviraston päätöksestä voisi siten tällaisessa tilanteessa valittaa hallinto-oikeuteen, jonka päätöksestä voi puolestaan valittaa korkeimpaan hallinto-oikeuteen, jos korkein hallinto-oikeus antaisi valitusluvan. Esityksellä ei olisi tältä osin vaikutusta oikeusturvan toteutumiseen. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sivistykselliset oikeudet\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 16 §:n mukaan jokaisella on oikeus maksuttomaan perusopetukseen. Oppivelvollisuudesta säädetään lailla. Julkisen vallan on turvattava, sen mukaan kuin lailla tarkemmin säädetään, jokaiselle yhtäläinen mahdollisuus saada kykyjensä ja erityis
