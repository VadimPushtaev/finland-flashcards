Kotoutumiskoulutus on kotoutumispalvelu, joka on tarkoitettu oppivelvollisuusiän ylittäneille maahanmuuttajille. Kotoutumiskoulutus sisältää suomen tai ruotsin kielen opetusta ja muuta opetusta, joka edistää työelämään ja jatkokoulutukseen pääsyä sekä muita yhteiskunnallisia, kulttuurisia ja arjen kansalaistaitoihin liittyviä valmiuksia. Kotoutumiskoulutus järjestetään pääsääntöisesti työvoimakoulutuksena. Kotoutumiskoulutuksen kielellisenä tavoitteena on, että kotoutuja-asiakas saavuttaa suomen tai ruotsin kielessä toimivan peruskielitaidon. Kotoutumiskoulutuksen osana on järjestettävä suomen tai ruotsin kielitaidon päättötestaus. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kotoutumiskoulutus voidaan toteuttaa myös omaehtoisena opiskeluna. Tavallisimpia kotouttamislain mukaisina omaehtoisina opintoina suoritettavia opintoja ovat luku- ja kirjoitustaidon koulutukset ja aikuisten perusopetus. Lisäksi suoritetaan muun muassa tutkintokoulutukseen valmentavaa koulutusta, erilaisia muita kielikursseja sekä korkeakouluopintoihin valmentavia koulutuksia.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kotoutumislain 25 §:ssä säädetään monikielisestä yhteiskuntaorientaatiosta. Pykälän 1 momentin mukaan kunnan on järjestettävä kotoutuja-asiakkaille yhteiskuntaorientaatio mahdollisuuksien mukaan heidän äidinkielillään tai muutoin hyvin osaamillaan kielillä ottaen huomioon kotoutuja-asiakkaiden kunnassa esiintyvät palvelu- ja kielelliset tarpeet. Monikielisen yhteiskuntaorientaation voi toteuttaa kunta tai palveluntuottaja. Pykälän 2 momentin mukaan yhteiskuntaorientaation on vähintään sisällettävä tietoa Suomessa asumisesta, elämisestä ja työskentelemisestä, suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kyse on kotoutumista edistävästä lakisääteisestä palvelusta, jonka tarkoituksena on lisätä maahanmuuttajien tietoisuutta muun muassa suomalaisesta yhteiskunnasta sekä oikeuksista ja velvollisuuksista (HE 208/2022 vp, s. 214). Yhteiskuntaorientaatiota järjestetään kotoutuja-asiakkaan omalla tai hyvin tuntemalla kielellä. Tavoitteena on antaa maahan muuttaneelle kuva suomalaisen yhteiskunnan toiminnasta sekä tukea ja nopeuttaa yhteiskunnan toimintaan pääsyä. Yhteiskuntaorientaation sisällöstä, toteuttamisesta ja kestosta säädetään tarkemmin valtioneuvoston asetuksella (576/2024). &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Valtioneuvoston asetuksen 1 §:n mukaan monikieliseen yhteiskuntaorientaatioon on sisällytettävä opetusta ainakin suomalaisen yhteiskunnan arvoista ja normeista sekä keskeisestä lainsäädännöstä, perus- ja ihmisoikeuksista sekä yhdenvertaisuudesta, sukupuolten tasa-arvosta ja seksuaalioikeuksista, kotoutumisen tavoitteista ja kotoutumista edistävistä palveluista, työllistymisestä, yrittäjyydestä ja työmarkkinoista, opiskelusta ja opiskelumahdollisuuksista, järjestö- ja vapaaehtoistoiminnasta sekä osallisuudesta, talouden suunnittelusta ja muusta arjessa toimimisesta sekä Suomen historiasta ja kulttuurista. Asetuksen 2 §:n mukaan yhteiskuntaorientaation on sisällettävä yhteensä vähintään 70 tuntia opetusta ja itsenäistä opiskelua ja se on toteutettava lähtökohtaisesti opetusmuotoisesti. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteiskuntaosaaminen näkökulmasta olennaista monikielistä yhteiskuntaorientaatiota kunnan tai työvoimaviranomaisen on tarjottava sellaiselle kotoutuja-asiakkaalle, jonka kotoutumissuunnitelmassa sovitaan kyseiseen palveluun osallistumisesta. Kotoutuja-asiakkaalla tarkoitetaan maahanmuuttajaa, jolla on voimassa oleva kotoutumissuunnitelma tai monialainen kotoutumissuunnitelma. Kotoutumissuunnitelma tai monialainen kotoutumissuunnitelma laaditaan viimeistään kolmen vuoden kuluttua ensimmäisen oleskeluluvan tai oleskelukortin myöntämisestä tai oleskeluoikeuden rekisteröimisestä maahanmuuttajalle, joka on työtön työnhakija, kotihoidontukea saava, toimeentulotukea muuten kuin tilapäisesti saava, kiintiöpakolainen tai kansainvälistä suojelua saava henkilö, ihmiskaupan uhri tai kotoutumislain 2 §:n 6 momentissa tarkoitettu lapsi tai nuori. Suunnitelma laaditaan myös siinä tapauksessa, että henkilön kotoutumisen edistäminen edellyttää kunnan ja hyvinvointialueen järjestämisvastuulle kuuluvien palvelujen yhteensovittamista. Kotoutumissuunnitelma on yksilöllinen, ja sen kesto on pääsääntöisesti kaksi vuotta. Käytännössä suurin osa esimerkiksi työssäkäyvistä tai päätoimisesti opiskelevista maahanmuuttajista ei osallistu monikieliseen yhteiskuntaorientaatioon tai kotoutumiskoulutukseen.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhteiskuntaorientaation oppimateriaali\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Edellisessä luvussa kuvattuun yhteiskuntaorientaatioon on laadittu valtakunnallinen verkko-oppimateriaali, joka on saatavilla ilmaiseksi.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/oppimateriaali\u003C/a>\u003C/span>\u003C/span>\u003C/span> Opetushallitus ja Suomen Pakolaisapu ry päivittivät aikuisille maahan muuttaneille suunnatun yhteiskuntaorientaation suomenkielisen oppikirjan yhteishankkeessa vuosina 2023–2025. Hankkeen aikana aiemmin tuotettu yhteiskuntaorientaation oppimateriaali päivitettiin kauttaaltaan, kuvitettiin sekä digitalisoitiin käyttäjälähtöiseksi ja saavutettavaksi verkko-oppimismateriaaliksi. Hanke toteutettiin laajassa yhteistyössä, ja uutta oppimateriaalikonseptia ja tekstimateriaalia oli kommentoimassa viranomaisia, kotoutumisen alan asiantuntijoita, kouluttajia, järjestöalan toimijoita sekä kotoutujia. Kyse on ainoasta nimenomaan yhteiskuntaorientaatiota varten laaditusta oppimateriaalikokonaisuudesta. Verkko-oppimateriaalia ylläpitää ja päivittää työllisyys-, kehittämis- ja hallintokeskus (KEHA-keskus).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhtenäinen ja saavutettava verkko-oppimateriaali auttaa kuntia toteuttamaan yhdenvertaista yhteiskuntaorientaatiota, ja sitä voivat hyödyntää koulutuksen järjestäjien lisäksi orientaatiokurssin opiskelijat ja muut yhteiskuntatiedosta kiinnostuneet. Yhtenäinen verkko-oppimateriaali turvaa yhteiskuntaorientaation yhdenvertaista toteutusta koko maassa. Oppimateriaali tarjoaa pohjan laadukkaalle ja asiasisällöiltään ajantasaiselle yhteiskuntaorientaatiokoulutukselle. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Oppimateriaali vastaa sisällöiltään monikielisestä yhteiskuntaorientaatiosta annettua valtioneuvoston asetusta. Verkko-oppimateriaali on laaja, ja se jaettu kymmeneen osiokokonaisuuteen, joista jokainen sisältää lisäksi useampia alaosioita. Oppimateriaalin kymmenen osiota ovat kotoutuminen, ihmiset ja kulttuuri, arki, työ, opiskelu ja koulutus, perheet, terveys ja hyvinvointi, yhteiskunta ja vaikuttaminen, lait ja oikeus sekä Suomen historia.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteiskuntaorientaation verkko-oppimateriaalin yleisinä oppimistavoitteina on, että kun yhteiskuntaorientaatio on toteutettu oppimateriaalia hyödyntäen, koulutukseen osallistujalla on paremmat edellytykset kotoutua Suomeen, hän tuntee suomalaisen yhteiskunnan arvoja ja kulttuuria, ymmärtää suomalaisen yhteiskunnan toimintaa, tietää omat oikeutensa ja velvollisuutensa Suomessa, osaa hoitaa paremmin itse viranomais- ja muita asioita sekä kykenee osallistumaan paremmin yhteiskuntaan ja sen kehittämiseen.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Muihin opintoihin sisältyvä opetus\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perusopetus on laajuudeltaan yhdeksän vuotta. Tämän lisäksi maahanmuuttajille voidaan järjestää perusopetukseen valmistavaa opetusta, jonka laajuus vastaa yhden vuoden oppimäärää. Perusopetus päättyy, kun perusopetuksen oppimäärä on suoritettu, tai viimeistään sen lukuvuoden koulutyön päättyessä sinä kalenterivuonna, kun oppilas täyttää 17 vuotta. Oppivelvollisuus päättyy, kun opiskelija täyttää 18 vuotta tai kun hän tätä ennen suorittaa toisen asteen tutkinnon tai vastaavan ulkomaisen koulutuksen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Perusopetus on yleissivistävää koulutusta, ja sillä on sekä kasvatus- että opetustehtävä. Perusopetus sisältää kaikille tiettyjä yhteisiä aineita, joihin sisältyy myös yhteiskuntaopin oppiaine. Yhteiskuntaoppiaineen tehtävänä on tukea oppilaiden kasvua aktiivisiksi, vastuuntuntoisiksi ja yritteliäiksi kansalaisiksi. Oppilaita ohjataan toimimaan erilaisuutta ymmärtävässä, ihmisoikeuksia ja tasa-arvoa kunnioittavassa moniarvoisessa yhteiskunnassa demokratian arvojen ja periaatteiden mukaan. Oppiaineen tehtävänä on antaa yhteiskunnan toiminnasta ja kansalaisen vaikutusmahdollisuuksista tiedollinen perusta sekä rohkaista oppilaita kehittymään oma-aloitteisiksi yhteiskunnallisiksi ja taloudellisiksi toimijoiksi.\u003Cspan class=\"AlaviiteTeksti\"> Perusopetuksen opetussuunnitelman perusteet 2014. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Vuosiluokkien 7–9 opetuksessa korostetaan oppilaiden vaikuttamismahdollisuuksia ja -taitoja demokratiassa sekä vastuuta omaan elämään liittyvien valintojen tekemisessä. Opetuksessa kiinnitetään huomiota yhteiskunnan ja yhteisöllisen elämän rakenteisiin sekä niihin liittyviin käsitteisiin. Oppilaita ohjataan arvioimaan yhteiskunnan ja talouden kysymyksiä sekä vertailemaan niihin liittyviä erilaisia mielipiteitä ja toimintavaihtoehtoja erilaisten ihmisryhmien ja arvopäämäärien kannalta. Yhteiskunnallisten asioiden opiskelussa näkökulma laajenee kattamaan myös globaalit kysymykset.\u003Cspan class=\"AlaviiteTeksti\"> Sama kuin edellä. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Aikuisten perusopetus koostuu kolmesta vaiheesta, joita ovat lukutaitovaihe, alkuvaihe ja päättövaihe. Aikuisten perusopetuksen kohderyhmiä ovat esimerkiksi 17–25-vuotiaat maahanmuuttajataustaiset, jotka eivät voi osallistua oppivelvollisuusikäisille järjestettävään opetukseen ikänsä takia mutta tarvitsevat perusopetuksen päättötodistusta ja opiskeluvalmiuksia jatkaakseen opintoja toisella asteella, sekä muut maahanmuuttajataustaiset aikuiset, jotka heikon peruskoulutuksensa takia tarvitsevat erityisesti perusopetuksen alkuvaiheen opetusta esimerkiksi luku- ja kirjoitustaitoa sekä matemaattisia valmiuksia varten tai jotka tarvitsevat päättötodistusta päästäkseen jatko-opintoihin. Alkuvaiheen opetuksen tavoitteena on antaa opiskelijalle tarvittavat valmiudet äidinkielessä ja kirjallisuudessa ja tarpeelliset muut valmiudet perusopetuksen päättövaiheeseen siirtymistä varten sekä edistää opiskelijoiden tasapainoista kehitystä. Alkuvaiheen jälkeen opintoja voi jatkaa päättövaiheeseen, jossa on mahdollista oppiaineina opiskella muun muassa yhteiskuntaoppia.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kaikissa ammatillisissa perustutkinnoissa on pakollisina tutkinnon osina yhteiskunta- ja työelämäosaamiseen liittyviä asioita. Näitä ovat yhteiskunnassa ja kansalaisena toimiminen, työelämässä toimiminen, opiskelu- ja urasuunnitteluvalmiudet, yrittäjyys ja yrittäjämäinen toiminta, työkyvyn ja hyvinvoinnin yläpitäminen ja kestävän kehityksen edistäminen. Suomalaisessa yhteiskunnassa toimimisen osiossa käsitellään muuan muassa kansalaisten perusoikeuksia ja velvollisuuksia, tasa-arvon ja yhdenvertaisuuden periaatteita ja niiden noudattamista sekä sitä, miten toimia aktiivisena kansalaisena ja käyttää monipuolisia vaikuttamisen tapoja.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Lukiokoulutus on yleissivistävää koulutusta, ja sen päätteeksi suoritettava ylioppilastutkinto tuottaa yleisen korkeakoulukelpoisuuden. Lukiolain (714/2018) mukaan lukiokoulutuksen tarkoituksena on tukea opiskelijoiden kasvamista hyviksi, tasapainoisiksi ja sivistyneiksi ihmisiksi ja aktiivisiksi yhteiskunnan jäseniksi sekä antaa opiskelijoille työelämän, harrastusten sekä persoonallisuuden monipuolisen kehittämisen kannalta tarpeellisia tietoja, taitoja ja valmiuksia. Lisäksi koulutuksen tarkoituksena on antaa opiskelijoille valmiuksia elinikäiseen oppimiseen ja itsensä jatkuvaan kehittämiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen tehtävänä on laaja-alaisen yleissivistyksen vahvistaminen. Lukiokoulutuksessa yleissivistys koostuu arvoista, tiedoista, taidoista, asenteista ja tahdosta, joiden avulla kriittiseen ja itsenäiseen ajatteluun pystyvät yksilöt osaavat toimia vastuullisesti, myötätuntoisesti, yhteisöllisesti ja itseään kehittäen. Lukioaikana opiskelija kartuttaa ihmistä, kulttuureja, ympäristöä ja yhteiskuntaa koskevaa olennaista tietoa, osaamista ja toimijuutta. Lukio-opetus valmistaa opiskelijaa ymmärtämään elämässä ja maailmassa vallitsevia monitahoisia keskinäisriippuvuuksia sekä jäsentämään laaja-alaisia ilmiöitä.\u003Cspan class=\"AlaviiteTeksti\"> Lukion opetussuunnitelman perusteet 2019. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Lukio-opintojen tavoitteellinen suoritusaika on kolme vuotta ja laajuus 150 opintopistettä. Opintojen päätteeksi suoritetaan ylioppilastutkinto. Lukiolain mukaan lukiokoulutuksen oppimäärä sisältää äidinkielen ja kirjallisuuden, toisen kotimaisen kielen ja vieraiden kielten opintoja, matemaattis-luonnontieteellisiä opintoja, humanistis-yhteiskunnallisia ja uskonnon tai elämänkatsomustiedon opintoja ja taito- ja taideaineiden opintoja (oppiaineryhmät) sekä opinto-ohjausta. Lisäksi lukiokoulutuksen oppimäärä voi sisältää laaja-alaista osaamista kehittäviä temaattisia opintoja. Lukiokoulutuksen oppimäärä voi sisältää myös eri oppiaineryhmissä tai oppiaineissa suoritettavia erityistä osaamista ja harrastuneisuutta osoittavan näytön sisältäviä opintokokonaisuuksia (lukiodiplomi).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Lukion yhteiskuntaopin opetukseen sisältyy sekä pakollisia että valinnaisia opintoja. Opetuksen tarkoituksena on syventää opiskelijan käsitystä ympäröivästä yhteiskunnasta ja antaa hänelle valmiuksia kasvaa yhteiskunnallisista asioista kiinnostuneeksi aktiiviseksi ja osallistuvaksi kansalaiseksi. Yhteiskuntaoppi luo opiskelijalle edellytyksiä kriittiseen ajankohtaisten ilmiöiden tutkimiseen, niiden arviointiin sekä tulevien kehityssuuntien ja vaihtoehtojen pohdintaan. Lisäksi se vahvistaa opiskelijan talousosaamista ja oikeudellista ymmärrystä sekä kannustaa aktiiviseen yhteiskunnalliseen osallistumiseen. Lähtökohtana on omakohtaisen kiinnostuksen herättäminen yhteiskunnallisiin asioihin ja maailman tapahtumiin. Yhteiskuntaopin opetuksen arvopohjassa korostuvat demokratian peruslähtökohdat, kuten tasa-arvo, sosiaalinen vastuu, ihmisoikeuksien kunnioittaminen, mielipiteen vapaus ja aktiivinen kansalaisuus sekä työn ja yrittäjyyden arvostaminen.\u003Cspan class=\"AlaviiteTeksti\"> Sama kuin edellä.\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Edellä kuvatun lisäksi koulutusjärjestelmään kuuluu korkea-asteen koulutusta, jota voidaan suorittaa toisen asteen opintojen jälkeen. Korkeakoulujärjestelmä muodostuu yliopistoista ja ammattikorkeakouluista. Yliopisto- ja ammattikorkeakoulututkintoja on yhteensä kymmeniä.\u003Cspan class=\"AlaviiteTeksti\"> Valtioneuvoston asetus yliopistojen tutkinnoista ja erikoistumiskoulutuksista (764/2004) 10 ja 16 §, valtioneuvoston asetus ammattikorkeakouluista (352/2003) 10 §. \u003C/span> Yliopistoilla ja ammattikorkeakouluilla on tutkimuksen, taiteen ja opetuksen vapaus. Korkeakoulututkintojen sisällöstä ei ole säädetty lain tasolla. Korkeakoulujen autonomiaan kuuluu se, että ne voivat itse määritellä tutkintojensa sisällön. Yliopistoissa ja ammattikorkeakouluissa voi opiskella niin suomen ja ruotsin kuin myös englannin kielellä.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kokoavia huomioita yhteiskuntatiedosta\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Yhteiskuntaa koskevalla tiedolla on keskeinen rooli maahanmuuttajien kotoutumisessa, sillä se muun muassa auttaa maahanmuuttajaa ymmärtämään yksilön oikeudet ja velvollisuudet sekä tukee poliittista ja yhteiskunnallista osallisuutta, mikä on olennainen osa syvempää kotoutumista. Yhteiskuntatieto tarjoaa myös laajan käsityksen yhteiskunnan eri rakenteista, kuten hallinto- ja koulutusjärjestelmästä, työmarkkinoista ja kulttuurista sekä historiasta. Tämä tieto tukee yksilön arjessa selviytymistä ja helpottaa sosiaalista ja kulttuurista sopeutumista, mikä edistää sujuvaa yhteiskunnallista vuorovaikutusta. Myös yhteiskunnan näkökulmasta on olennaista, että maahanmuuttaja tuntee yhteiskuntaa koskevat keskeiset periaatteet ja toimintatavat. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Maahanmuuttajien yhteiskuntaosaamista edistetään muun muassa kursseilla, orientaatioilla ja koulutuksen kautta. Joiltain osin osallistuminen voi olla pakollista ja seurattua, mutta opetuksen päättyessä osallistujan yhteiskuntatiedon osaamista ei aina välttämättä arvioida. Ne maahanmuuttajat, jotka ovat joko vastaanottolain tai kotoutumislain palveluiden piirissä, saavat perustietoa suomalaisesta yhteiskunnasta jo hyvin varhaisessa vaiheessa Suomessa oleskelua. Suomalaisessa koulutusjärjestelmässä sekä perusopetuksessa että toisen asteen opinnoissa taas yhteiskuntaosaamista kehitetään opetussuunnitelman mukaisesti, mikä tukee maahanmuuttajien kotoutumista ja aktiivista yhteiskuntaan osallistumista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yhteenvetona voidaan todeta, että yhteiskuntaosaamista edistetään Suomessa monitasoisesti, kuten lainsäädännön kautta (vastaanottolaki, kotoutumislaki), erityisillä kursseilla ja orientaatioilla sekä koulutusjärjestelmän eri vaiheissa. Tavoitteena on varmistaa, että myös maahanmuuttajat saavat riittävästi tietoa suomalaisesta yhteiskunnasta, sen arvoista, toiminnasta ja omista oikeuksistaan ja velvollisuuksistaan riippumatta siitä, missä vaiheessa oleskelua tai koulutusta he ovat. Tämän lisäksi maahanmuuttaja kerryttää yhteiskuntaosaamista luonnollisesti myös oma-aloitteisen toimintansa kautta vuorovaikutteisessa suhteessa yhteiskuntaan.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Nykytilanteessa ei edellytetä yhteiskuntaosaamista kansalaisuuden hakemisen yhteydessä. Yhteiskuntaa koskevan tiedon tärkeys ja kansainväliset vertailutiedot puoltaisivat kansalaisuuslain sääntelyn täydentämistä siten, että kansalaistamisen edellytyksiin lisättäisiin yhteiskuntatietoa koskeva edellytys. Tällaisesta edellytyksestä ja kansalaisuuskokeesta on myös selvitys- ja tutkimustietoa, jota voitaisiin hyödyntää lainmuutoksen toteutuksessa esimerkiksi erityisesti siitä näkökulmasta, mitä kansalaisuuskokeen käyttöönotossa olisi perusteltua ottaa huomioon.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoa koskevan kansalaisuuskokeen suorittaminen osoittaisi, että hakija on kotoutunut riittävästi yhteiskuntaan kansalaisuuden saamisen näkökulmasta. Uusi yhteiskuntatietoedellytys ja kansalaisuuskokeen käyttöönotto tarjoaisivat mahdollisuuden mitata kotoutumista laajemmin kuin muut voimassa olevat kansalaistamisen edellytykset. Kansalaisuuskokeen suorittamisella voitaisiin varmistaa, että kansalaisuuden saavat henkilöt hallitsevat perustiedot suomalaisesta yhteiskunnasta, esimerkiksi sen historiasta, lainsäädännöstä ja toimintatavoista sekä yksilön oikeuksista ja velvollisuuksista. Edellytys riittävästä yhteiskuntaosaamisesta kansalaistamisvaiheessa sekä sen osoittamiseksi tarkoitettu kansalaisuuskoe voisivat toimia luontevana jatkumona kaikelle sille yhteiskuntatiedolle, jota maahanmuuttajat saavat ja omaksuvat maassa oleskelunsa aikana.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuuskokeen toteutus ja uusi koejärjestelmä\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sisäministeriön selvityksen keskeiset havainnot\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Sisäministeriön asettaman poikkihallinnollisen työryhmän tavoitteena oli selvittää, miten kansalaisuuskoe voitaisiin toteuttaa ja millainen kansalaisuuskoe otettaisiin käyttöön. Tähän liittyy keskeisesti muun muassa kysymykset kokeen hallinnoinnista sekä kokeen käytännön järjestelyihin liittyvistä toimista. Alla on kuvattu lyhyesti keskeisiä kansalaisuuskokeen toteutukseen liittyviä työryhmän esittämiä näkemyksiä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen käyttöönottoa selvittäneen työryhmän yhtenä keskeisenä tehtävänä oli tarkastella sitä, mikä olisi tarkoituksenmukaisin taho hallinnoimaan kansalaisuuskoetta. Kansalaisuuskokeen hallinnointia käsiteltiin selvityksen luvussa 6 (s. 68–76). Työryhmän selvityksessä todettiin, ettei ole sellaista yksittäistä viranomaistahoa, jonka nykyinen toiminta vastaisi kansalaisuuskokeen hallinnointia. Työryhmän selvityksessä ei esitetty sellaista yhtä yksittäistä toimijaa, jolle kansalaisuuskokeen hallinnoinnin tulisi kuulua. Sen sijaan työryhmä katsoi eri tahojen välisen yhteistyön keskeiseksi kokeen hallinnoimisen näkökulmasta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lisäksi työryhmä katsoi, että hallinnoimisvastuussa oleva taho voisi sopia kansalaisuuskokeiden järjestämisestä jonkin toisen tahon tai toimijan kanssa. Selvityksessä esimerkiksi todettiin, että kansalaisuuskokeen toteuttamiseen liittyviä tehtäviä voisi ulkoistaa, vaikka kansalaisuuskokeen hallinnointivastuu olisi jollakin tietyllä viranomaistaholla. Kokeen järjestämisessä voisi hyödyntää sellaisia tahoja, jotka järjestävät koulutuksia ja niihin liittyviä testaustilaisuuksia. Mahdollisuuksien mukaan voisi hyödyntää myös yksityisiä palveluntarjoajia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Selvityksessä käsiteltiin testaustapoja ja tehtävätyyppejä, joilla yhteiskuntaosaamista voitaisiin mitata (s. 47–49). Työryhmä piti digitaalista eli sähköistä koetta parhaiten soveltuvana kansalaisuuskokeen toteutusmuotona. Tehtävätyyppien osalta työryhmä tunnisti erilaisia mahdollisia vaihtoehtoja, joilla tietoja voisi testata. Tältä osin työryhmä katsoi, että monivalintakysymykset, joissa hakijan on valittava oikea vastaus useista vaihtoehdoista, olisivat tarkoituksenmukaisin vaihtoehto.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Työryhmä käsitteli myös kansalaisuuskokeen kielivalintaa (s. 49–50) ja kansalaisuuskokeen suhdetta kielitaitoedellytykseen (s. 54–58). Kansalaisuuskokeen kielivalinta nähtiin selvityksessä yleisesti ottaen merkitykselliseksi. Työryhmä piti tärkeänä, että suomen tai ruotsin kielellä toteutettuna kansalaisuuskoe laadittaisiin huomioiden kansalaistamisen edellytyksenä oleva kielitaidon taso.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yksi työryhmän käsittelemistä aiheista koski kansalaisuuskokeeseen valmistautumista ja kokeen oppimateriaalia (s. 65–67). Työryhmä piti keskeisenä, että kansalaisuuskokeeseen tulisi olla mahdollisuus valmistautua oppimateriaalin avulla ja että koekysymykset perustuisivat tähän ennakkomateriaaliin. Työryhmä ei kuitenkaan pitänyt kannatettavana, että kansalaisuuskoetta varten laadittaisiin kokonaan uutta oppimateriaalia. Työryhmä katsoi, että olisi tarkoituksenmukaista hyödyntää jo olemassa olevaa koulutus- ja oppimateriaalia, kuten kotoutuja-asiakkaille tarkoitetun yhteiskuntaorientaation oppimateriaalia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Työryhmän selvityksessä käsiteltiin erilaisia toimenpiteitä väärinkäytösten ehkäisemiseksi (s. 63–64). Työryhmä totesi, että väärinkäytöksiä voitaisiin ehkäistä sekä koetta edeltävillä toimilla että kokeen aikaisella valvonnalla. Erityisen tärkeänä nähtiin henkilöllisyyden toteamiseen liittyvät toimet sekä vilpillisen menettelyn ehkäiseminen valvonnalla. Lisäksi tuotiin esiin vilpillisen menettelyn sanktioiminen.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Selvityksessä käsiteltiin kansalaisuuskokeen erityisjärjestelyjä (s. 64–65). Erityisjärjestelyiden tarkoituksena olisi taata se, että henkilöllä olisi samat mahdollisuudet suorittaa koe kuin kaikilla muillakin. Selvityksessä todettiin, että kyse ei olisi edellytyksestä poikkeamisesta tai koesuorituksen erilaisesta arvioimisesta, vaan erityisjärjestelyt koskisivat itse koetilaisuutta. Selvityksessä nostettiin esille esimerkinomaisia tilanteita erityisjärjestelyistä, kuten lisäaika tehtävän tekemiseen tai sovittujen apuvälineiden käyttäminen. Työryhmä katsoi, että kokeen suorittamiseen tulisi olla mahdollisuus hakea erityisjärjestelyjä.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Olemassa olevia tutkinto- ja koejärjestelmiä\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta selvittänyt työryhmä tunnisti useita kokeen toteutukseen liittyviä osatekijöitä (s. 68–69). Näihin sisältyisi muun muassa kokeen suunnittelu, kuten kysymysten laatiminen. Lisäksi kokeen sisältöä pitäisi uusia ja kehittää sen luotettavuuden ja ajantasaisuuden ylläpitämiseksi. Myös kokeen tehokkuutta tulisi arvioida säännöllisesti. Hallinnoimiseen sisältyisi myös kokeen valvontajärjestelyt. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen järjestämiseen liittyisi muun muassa koetta varten tarvittavat tilat, kokeen valvojat ja tekniset välineet. Tekniset välineet voisivat työryhmän selvityksen mukaan kattaa esimerkiksi digitaalisten alustojen käyttöä, paperikokeiden jakamista tai suullisten testien järjestämistä. Tärkeitä kansalaisuuskokeen toteutuksen osa-alueita olisivat myös kokeeseen ilmoittautuminen, koetulosten rekisteröinti ja koetuloksista tiedottaminen osallistujille. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Seuraavassa tarkastellaan joitakin olemassa olevia tutkinto- ja koejärjestelmiä siitä näkökulmasta, miten niiden toteutustapoja voitaisiin hyödyntää kansalaisuuskoejärjestelmän luomisessa.&nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yleinen kielitutkinto\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Yleistä kielitutkintoa koskevaa sääntelyä voidaan pitää merkityksellisenä myös tulevan kansalaisuuskokeen toteutuksen kannalta, koska kyse sellaisesta olemassa olevasta tutkintojärjestelmästä, joka on jo vakiintuneesti toiminnassa. Alla tarkastellaan yleistä kielitutkintoa koskevaa keskeistä sääntelyä sekä joitakin käytännön toteutuksen yksityiskohtia. Tarkastelun kohteena ovat erityisesti tutkintotilaisuuksien järjestäminen ja valvonta, käytössä oleva ilmoittautumisjärjestelmä sekä tarvittavista erityisjärjestelyistä huolehtiminen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yleisistä kielitutkinnoista ja niiden järjestämisestä säädetään laissa yleisistä kielitutkinnosta (964/2004, myöhemmin \u003Cspan class=\"KursiiviTeksti\">kielitutkintolaki\u003C/span>) ja valtioneuvoston asetuksessa yleisistä kielitutkinnoista (1163/2004). Yleiset kielitutkinnot ovat toiminnallisen kielitaidon osoittamiseksi järjestettyjä kielitutkintoja, joissa kielitaitoa voi testata yhdeksässä eri kielessä. Tutkinnoissa arvioidaan yleiskielen osaamista käytännön tilanteissa. Suoritetusta tutkinnosta saa todistuksen, jolla voi osoittaa virallisesti kielitaidon esimerkiksi työtehtäviin ja opiskeluun liittyen tai Suomen kansalaisuutta hakiessa. Opetus- ja kulttuuriministeriön hankkeessa (OKM001:00/2025) uudistettiin yleisiä kielitutkintoja ja valtionhallinnon kielitutkintoja. Hankkeen tavoitteena oli digitalisoida kielitutkintoja ja tarkoituksenmukaistaa kielitutkintoprosesseja niin, että niillä pystyttäisiin vastaamaan kasvaviin suorittajamääriin.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kielitutkintolain 2 §:ssä säädetään tutkintojen hallinnosta. Yleisestä kielitutkintojärjestelmästä, sen kehittämisestä ja valvonnasta vastaa Opetushallitus. Opetushallitus voi tehdä yleisten kielitutkintojen laatimiseen ja arviointiin liittyviä sopimuksia korkeakoulujen taikka muiden sellaisten julkisyhteisöjen tai yhteisöjen kanssa, joilla on riittävä asiantuntemus&nbsp;kielitutkintojen&nbsp;laatimiseen ja arviointiin. Opetushallitus on tehnyt sopimuksen Jyväskylän yliopiston Soveltavan kielentutkimuksen keskuksen (Solki) kanssa. Solki laatii yleisissä kielitutkinnoissa käytettävät testit ja koordinoi tutkintosuoritusten arviointia. Tähän sisältyy muun muassa testin suunnittelu, kuten kysymysten laatiminen, ja arviointikriteerien määrittäminen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Opetushallituksen yhteydessä on yleisten kielitutkintojen tutkintotoimikunta, jonka Opetushallitus asettaa enintään kolmeksi vuodeksi kerrallaan (3 §). Se on asiantuntijaelin, jonka jäsenet edustavat yleisten kielitutkintojen näkökulmasta keskeistä asiantuntemusta. Tutkintotoimikunnan tehtävänä on muun muassa käsitellä yleisten kielitutkintojen kehittämiseen liittyviä periaatteellisia ja yhteiskunnan tai kielitutkinnon suorittajan kannalta merkittäviä asioita sekä tehdä aloitteita kielitutkintojen kehittämiseksi (3 a §). Tutkintotoimikunnan tehtävistä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kielitutkintolain 4 §:ssä säädetään tutkintojen järjestämisestä. Opetushallitus voi sopia tutkintojen järjestämisestä sellaisten julkisyhteisöjen tai yhteisöjen kanssa, joilla on riittävä asiantuntemus ja edellytykset tutkintojen järjestämiseen. Sopimuksia tehtäessä on otettava huomioon, että tutkintotilaisuuksia on tarjolla alueellisesti riittävä määrä ja riittävän usein. Sopimus voidaan purkaa, jos tutkinnon järjestäjä laiminlyö sopimuksen mukaisia tehtäviään.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kielitutkintolain 5 §:n mukaan tutkinnon järjestäjän tehtäviin kuuluu muun muassa järjestää tutkinnot sopimusehtojen mukaisesti, tiedottaa tutkinnoista, vastata tutkintotilaisuuksien valvonnasta, ilmoittaa järjestyksen rikkomisesta ja vilpillisestä menettelystä, toimittaa tutkintosuoritukset arvioitaviksi sekä toimittaa opetustoimen viranomaisille niiden tarvitsema tieto tutkintojen järjestämisestä. Tutkinnon järjestäjien tehtävistä ja niitä koskevien sopimusten sisällöstä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, yleisen kielitutkinnon järjestäjänä voi toimia sellainen julkisyhteisö tai yhteisö, joka on tehnyt Opetushallituksen kanssa sopimuksen tutkintotilaisuuksien järjestämisestä. Yleisen kielitutkinnon järjestäjät huolehtivat tutkintotilaisuuksien ulkoisista puitteista ja valvonnasta.\u003Cspan class=\"AlaviiteKooste\"> Yleisten kielitutkintojen järjestäjänä toimimista on kuvattu Yleiset kielitutkinnot 30 vuotta -julkaisussa (Opetushallitus, Raportit ja selvitykset 2024:8, s. 133–137 ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.oph.fi/sites/default/files/documents/Yleiset_kielitutkinnot_30_vuotta_060125.pdf\">https://www.oph.fi/sites/default/files/documents/Yleiset_kielitutkinnot_30_vuotta_060125.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> Tarvittavien tilojen ja laitteiden samoin kuin tilaisuuksissa toimivien valvojien varaaminen kuuluu tutkinnon järjestäjän tehtäviin. Tutkintotilaisuuksien valmisteluun sisältyy myös valvojien kouluttamista ja ohjeistamista. Tutkintotilaisuudessa käytettävän testimateriaalin ja siihen liittyvän ohjeistuksen tutkinnon järjestäjä saa Jyväskylän yliopiston Soveltavan kielentutkimuksen keskukselta (Solki), joka on niin ikään Opetushallituksen sopimuskumppani. Myös tuleva kansalaisuuskoe voitaisiin toteuttaa koetilaisuuksien järjestäjien kanssa tehtävillä sopimuksilla siten, että kokeeseen osallistujat vastaisivat koetilaisuuksissa sellaisiin koekysymyksiin, jotka olisi puolestaan laadittu keskitetysti erillisen, tarvittavaa asiantuntemusta edustavan toimijan kanssa tehdyn sopimuksen perusteella. Lähtökohtana olisi siis se, että koetilaisuuksien järjestäminen ja koekysymysten laatiminen kuuluisivat eri toimijoille. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tutkintotilaisuuksien järjestäjän tehtävänä on huolehtia siitä, että tutkinto suoritetaan valvotusti. Tutkinnon järjestäjien valvontatehtävä lisättiin lakiin 1.1.2023 voimaan tulleella lainmuutoksella. Muutosta koskevan hallituksen esityksen mukaan tutkinnon järjestäjän valvontavelvollisuuteen kuuluisi muun muassa kaikki ennakolliset toimenpiteet, joilla pyritään estämään järjestyksen rikkomiset ja vilpilliset menettelyt tutkintotilaisuuksissa (HE 230/2022 vp, s. 16). Tutkinnon järjestäjä valvoo ensinnäkin sitä, että tutkintoon osallistuu sama henkilö, joka on ilmoittautunut siihen. Yleiseen kielitutkintoon osallistuvien henkilöllisyys tarkastetaan ennen tutkintotilaisuuden alkua. Henkilöllisyyden tarkastamista varten osallistujalla on oltava mukanaan hyväksyttävä henkilöllisyystodistus, kuten voimassa oleva passi. Toisena henkilönä esiintymisen yrityksistä ilmoitetaan ja raportoidaan Opetushallitukselle ja Solkille sekä mahdollisesti poliisille. Henkilöllisyyden tarkastaja kirjaa henkilön sisään tutkintotilaisuuteen. Samalla osallistujalta kerätään sähköiset laitteet, kuten puhelin ja älykello, talteen tutkintotilaisuuden ajaksi. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yleisen kielitutkinnon järjestäjä valvoo niin ikään itse tutkintotilaisuutta ja huolehtii sen aikana yleisen järjestyksen ja testirauhan toteutumisesta. Jos tutkintotilaisuudessa ilmenee rikkeitä tai vilppiyrityksiä, tutkinnon järjestäjä toimittaa tilanteista selvityksen Opetushallitukselle. Vilppiepäilytilanteessa Opetushallitus lähettää tutkinnon suorittajalle kuulemispyynnön. Asiaa selvitettyään Opetushallitus tekee päätöksen siitä, onko vilppiä tapahtunut. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Järjestyksen rikkomisen ja vilpillisen menettelyn seuraamuksista säädetään kielitutkintolain 6 a §:ssä. Jos tutkinnon suorittaja syyllistyy vilpilliseen menettelyyn, siinä avustamiseen tai vilpin yritykseen tutkintotilaisuudessa, hänen tutkintosuorituksensa katsotaan hylätyksi ja hän menettää oikeutensa osallistua kyseisen kielen tutkintoon kuuden kuukauden ajaksi tutkintopäivästä.&nbsp;Toistuvasta tai erityisen vakavasta ja haitallisesta menettelystä osallistumisoikeuden voi menettää 12 kuukauden ajaksi. Hallituksen esityksessä tarvetta sanktiosääntelylle perusteltiin muun muassa siten, että muutoksella saataisiin vähennettyä vilppitapauksia, mikä säästäisi puolestaan niiden käsittelyyn menevää työaikaa ja muita resursseja (HE 230/2022 vp, s. 10). Vilpillisestä toiminnasta seuraavia sanktioita koskeva sääntely on ollut voimassa vuodesta 2023 alkaen, ja voimassa olevan lain on arvioitu tältä osin parantaneen ja tasapainottaneen tilannetta merkittävästi.\u003Cspan class=\"AlaviiteTeksti\"> Yleiset kielitutkinnot 30 vuotta, s. 27.\u003C/span> Vastaavanlaisen sääntelyn sisällyttäminen myös kansalaisuuskoetta koskevaan lainsäädäntöön olisi perusteltua, jotta voitaisiin ennaltaehkäistä vilpillistä menettelyä. Säännökset vilpillisestä menettelystä seuraavista sanktioista tukisivat osaltaan kansalaisuuskokeen uskottavuutta ja luotettavuutta. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yleisen kielitutkinnon tutkintotilaisuuteen ilmoittaudutaan sähköisesti Opintopolku-järjestelmässä.\u003Cspan class=\"AlaviiteTeksti\"> Yleisen kielitutkinnon sähköistä ilmoittautumista on kuvattu Yleiset kielitutkinnot 30 vuotta -julkaisussa, s. 47–50. \u003C/span> Tutkintotilaisuuksien järjestäjä lisää järjestelmään tutkintotilaisuuden tiedot ja enimmäisosallistujamäärän. Ilmoittautumisajan päätyttyä järjestäjä kutsuu osallistujat tutkintotilaisuuteen. Osallistujat saavat tällöin myös linkin Opetushallituksen verkkosivuilla olevaan osallistujan ohjeeseen. Tutkintotilaisuuksien järjestäjä käyttää siten itse sitä järjestelmää, jossa käsitellään tutkintoon ilmoittautumista koskevia tietoja. Toisaalta ilmoittautumisen yhteydessä hyödynnetään kaikille yhteistä osallistujan ohjetta, joka on keskitetty. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yleisen kielitutkinnon ilmoittautumisjärjestelmä on osa kansallista Opintopolku-verkkosivustoa, johon on koottu yksityishenkilöille tarkoitetut Opetushallituksen digitaaliset palvelut, mukaan lukien eri koulutusasteiden yhteishaut. Yleisen kielitutkinnon keskitetty sähköinen ilmoittautumisjärjestelmä on otettu käyttöön kaikissa yleisen kielitutkinnon ilmoittautumisissa vuonna 2020. Yleisen kielitutkinnon ilmoittautumisjärjestelmä koostuu tutkintoon osallistuvalle näkyvästä käyttöliittymästä ja sellaisesta virkailijakäyttöliittymästä, joka näkyy Opetushallitukselle ja tutkintotilaisuuksien järjestäjille. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tutkintoon osallistumisesta kiinnostunut voi hakea ilmoittautumisjärjestelmässä tutkintotilaisuuksia esimerkiksi tutkintokielen ja paikkakunnan mukaan. Hakutuloksia voi myös rajata esimerkiksi sellaisiin tutkintoihin, joissa on tilaa. Tutkintotilaisuuteen voi kuitenkin ilmoittautua järjestelmässä vain ilmoittautumisaikoina. Ilmoittautumisen aluksi henkilö tunnistautuu sähköisesti joko Suomi.fi-tunnistuksella tai sähköpostitse. Ilmoittautumislomakkeen lähetettyään hän saa sähköpostiinsa tutkintomaksun suorittamista varten maksulinkin, joka on voimassa kolme vuorokautta. Järjestelmässä voi myös tilata ilmoituksen vapautuvista paikoista, jos jokin tutkintotilaisuus on jo täynnä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Virkailijakäyttöliittymässä tutkintotilaisuuksien järjestäjät lisäävät järjestelmään tiedot tutkintotilaisuuksien ajankohdista ja paikkamääristä. Sekä järjestäjät että Opetushallitus voivat seurata paikkojen täyttymistä. Lisäksi järjestäjät kokoavat virkailijakäyttöliittymästä tiedot Opetushallitukselle laskutusta varten. Tutkintomaksujen hallinnoinnista vastaava Opetushallitus hyödyntää puolestaan liittymän tietoja laskujen tarkastuksessa. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tutkintoon osallistuvan kannalta on huomattava, että tarjolla olevat tutkintopaikat varataan nopeasti. Päästäkseen suorittamaan tutkintoa on ilmoittauduttava ajoissa ja myös mahdollisesti matkustettava sellaiselle paikkakunnalle, jossa koetilaisuuksia järjestetään. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Opetushallitus perii tutkintoon ilmoittautuneelta kielitutkintolain 11 §:n mukaan tutkintomaksun. Tutkintomaksut peritään yleisen kielitutkinnon järjestämisestä aiheutuvien kulujen kattamiseksi. Tutkintomaksut suoritettiin aiemmin tutkinnon järjestäjille. Sillä, että tutkintomaksu suoritetaan tutkinnon järjestäjän sijasta Opetushallitukselle, haluttiin lisätä Opetushallituksen rahoituksen läpinäkyvyyttä ja selkeyttä sekä järjestelmän kokonaiskustannuksen seuraamista (HE 230/2022 vp, s. 10). Tutkintomaksu palautetaan tutkintoon ilmoittautuneelle, jos hän on estynyt osallistumasta tutkintoon oman sairautensa vuoksi. Maksua ei kuitenkaan palauteta, jos tutkintoon ilmoittautunut ei ole perunut ilmoittautumistaan ennen tutkintotilaisuuden alkua.&nbsp;Hakemus maksun palauttamisesta tulee tehdä Opetushallitukselle kahden viikon kuluessa tutkintopäivästä (11 § 2 mom.).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yleiseen kielitutkintoon osallistuvalle voidaan myöntää erityisjärjestelyjä sairauden, vammaisuuden, lukemisen ja kirjoittamisen erityisvaikeuden tai muun näihin rinnastettavan syyn perusteella.\u003Cspan class=\"AlaviiteTeksti\"> Erityisjärjestelyistä yleisissä kielitutkinnoissa on kerrottu Yleiset kielitutkinnot 30 vuotta -julkaisussa, s. 41–46.\u003C/span> Erityisjärjestelyjä tarvitsevan osallistujan koetehtävät ovat kuitenkin samat kuin muillakin osallistujilla. Erityisjärjestelyjä yleiseen kielitutkintoon hakeneiden määrä on ollut vuosittain joitakin kymmeniä. Määrässä on ollut jonkin verran vuosittaista vaihtelua, mutta erityisjärjestelyjä pyytäneiden osuus kaikista tutkinnon suorittajista on kuitenkin jäänyt verraten pieneksi. Esimerkiksi vuosina 2014–2023 suomen kielen keskitason tutkinnon suoritti yleisissä kielitutkinnoissa yhteensä 71&nbsp;607 henkilöä.\u003Cspan class=\"AlaviiteTeksti\"> Yleiset kielitutkinnot 30 vuotta, s. 56.\u003C/span> Erityisjärjestelyjä haettiin yleisissä kielitutkinnoissa puolestaan saman ajan kuluessa yhteensä 511 kertaa. Näiden tietojen perusteella voidaan todeta, että erityisjärjestelyjä pyytäneiden osuus kaikista tutkintoon osallistuneista jää siten selvästi alle yhden prosentin. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yleisessä kielitutkinnossa on erityisjärjestelyjen osalta seuraava tehtäväjako. Opetushallitus ohjeistaa tutkintojärjestelyistä ja myös erityisjärjestelyjen toteuttamisesta ja pyytämisestä. Jyväskylän yliopiston soveltavan kielentutkimuksen keskus Solki käsittelee yksittäisten henkilöiden erityisjärjestelyjä koskevat pyynnöt. Tutkintotilaisuuksien järjestäjä puolestaan tiedottaa myönnetyistä erityisjärjestelyistä osallistujalle ja huolehtii niiden toteuttamisesta. Myös tulevan kansalaisuuskokeen erityisjärjestelyjä koskevista pyynnöistä voitaisiin ohjeistaa ja pyynnöt voitaisiin käsitellä keskitetysti, kun taas koetilaisuuksien järjestäjät voisivat huolehtia myönnettyjen erityisjärjestelyjen toteuttamisesta. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yleisen kielitutkinnon erityisjärjestelyistä viestitään niin Opetushallituksen verkkosivuilla kuin myös tutkintoon ilmoittautumisessa käytettävässä järjestelmässä. Yleiseen kielitutkintoon osallistuva pyytää erityisjärjestelyjä tutkintotilaisuuteen ilmoittautumisen yhteydessä. Asiantuntijalausunnon vammasta, sairaudesta tai esimerkiksi oppimisvaikeuksista hän lähettää Solkiin. Lääkärin, psykologin tai erityisopettajan antamasta lausunnosta pitäisi käydä ilmi, miten osallistujan vamma tai muu tila vaikuttaa tutkinnon suorittamiseen. Osallistujien terveystietoja sisältäviä asiantuntijalausuntoja ei säilytetä, vaan ne tuhotaan tutkintokerran jälkeen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tutkinnon järjestäjän tehtävänä on toteuttaa käytännössä sellaiset erityisjärjestelyt, jotka osallistujalle on etukäteen myönnetty tämän esittämän pyynnön perusteella. Erityisjärjestelyihin voi kuulua erilaisia tauko-, ryhmä- ja tilaratkaisuja. Kyse voi olla esimerkiksi siitä, että osallistujalle annetaan lisäaikaa kokeen suorittamista varten tai hän suorittaa kokeen erillisessä tilassa niin ikään valvojan läsnä ollessa. Osallistujalle on voitu myöntää myös mahdollisuus jonkin apuvälineen, kuten suurennuslasin tai rannetuen käyttöön. Apuvälineiden toimivuutta voidaan tarvittaessa testata tutkintotilaisuutta edeltävänä päivänä. Osa näkövammaisista osallistujista käyttää tietokoneen ruudunlukuohjelmaa (puhesyntetisaattoria), joka muuttaa näytöllä olevan tekstin puheeksi. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Eräitä muita järjestelmiä\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta koskevassa selvityksessä työryhmä esitti, että koe voitaisiin toteuttaa digitaalisesti eli sähköisesti. Työryhmä käsitteli selvityksessään myös mm. kokeen valvonnan toteuttamista ja erilaisten väärinkäytösten ehkäisyä (s. 63–64). Alla tarkastellaan kolmen digitaalisen kokeen – ylioppilastutkinnon, ammattikorkeakoulun valintakokeen ja kuljettajantutkinnon teoriakokeen – toteutusta erityisesti valvonnan näkökulmasta. Lisäksi tarkastellaan kokeen erityisjärjestelyjä sekä koesuorituksen tarkastamiseen ja koetuloksen saamiseen liittyviä seikkoja.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ylioppilastutkinnosta annetun lain (502/2019) 4 §:n mukaan lukiokoulutusta antavat oppilaitokset järjestävät ylioppilastutkinnon kokeet samanaikaisesti kaksi kertaa vuodessa. Ylioppilastutkinnon kokeet järjestetään kirjallisesti tai digitaalisesti. Ylioppilastutkintolautakunta määrää tarkemmin kokeiden järjestämisestä ja siihen liittyvistä aikatauluista ja järjestelyistä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ylioppilaskokeet suoritetaan sähköisesti Abitti-järjestelmässä.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.abitti.fi/\">https://www.abitti.fi/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Koejärjestelmä koostuu kolmesta osasta: kokelaiden koneista, varsinaisesta koetilan palvelimesta ja varapalvelimesta sekä suljetusta paikallisesta verkosta.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.ylioppilastutkinto.fi/fi/tutkinnon-toimeenpano/kokeen-tekniset-jarjestelyt\">https://www.ylioppilastutkinto.fi/fi/tutkinnon-toimeenpano/kokeen-tekniset-jarjestelyt\u003C/a>\u003C/span>\u003C/span>\u003C/span> Ylioppilaskoe tehdään valvotussa koetilassa joko koulun koneilla tai kokelaan omalla laitteella. Laitteille asetetut vaatimukset ovat matalat eikä koneeseen ei tarvitse tehdä mitään pysyviä muutoksia, kuten ohjelma-asennuksia. Ylioppilastutkinnon kokeet laaditaan erillisellä koodauskielellä lautakunnassa. Lautakunta toimittaa tutkintotulokset heti niiden valmistuttua kaikille lukioille yhtä aikaa. Tulokset saa ilmoittaa kokelaille heti, kun ne ovat saapuneet lukioon. Tulokset ja kokelaan arvostellut koesuoritukset annetaan kokelaalle ja alle 18-vuotiaan kokelaan huoltajalle nähtäväksi Opetushallituksen Opintopolku-palvelussa. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ylioppilastutkinnosta annetun lain 9 §:n mukaan kokeen suorittamiseen voi saada erityisjärjestelyjä mm. sairauden, vamman tai lukemisen ja kirjoittamisen erityisvaikeuden vuoksi. Erityisjärjestelyjen käytöstä päättää ylioppilaslautakunta, joka myös määrää tarkemmin erityisjärjestelyjen hakemisesta ja käyttämisestä.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ylioppilaskokeeseen myönnettäviin erityisjärjestelyihin voi käytännössä sisältyä mm. pidennetty aika ja eräitä apuvälineitä.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.ylioppilastutkinto.fi/fi/tutkinnon-toimeenpano/maaraykset-ja-ohjeet/koesuoritusta-heikentavan-syyn-huomioon-ottaminen \\l chapter-2\">https://www.ylioppilastutkinto.fi/fi/tutkinnon-toimeenpano/maaraykset-ja-ohjeet/koesuoritusta-heikentavan-syyn-huomioon-ottaminen#chapter-2\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kokelas voi ilman ylioppilaslautakunnan erillistä lupaa käyttää tavanomaisia apuvälineitä, joita esimerkiksi vammaisuus edellyttää. Tällaiset välineet tarkistetaan ennen kokeen alkamista. Langattomia elektronisia laitteita saa tuoda koetilaan vain lääkärintodistuksen perusteella. Jos Kansaneläkelaitos on myöntänyt kokelaalle oikeuden opiskelutulkkaukseen esimerkiksi kuulovammaisuuden perusteella, kokelas voi käyttää tulkkia kokeen aloituksessa ja lopetuksessa ilman erillistä erityisjärjestelypäätöstä. Kokeen aikana tulkki voi olla tavoitettavissa, jotta kokelas voi tarvittaessa kommunikoida valvojan kanssa. Tulkkaus ei kuitenkaan koske tehtävien ja vastausten sisältöä. Kokeessa käytettävältä tulkilta edellytetään hallintolain (434/2003) 28 §:n mukaista esteettömyyttä.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ammattikorkeakoululain (932/2014) 28 a §:n mukaan opiskelijoiden valinta ammattikorkeakoulututkintoon ja ylempään ammattikorkeakoulututkintoon johtaviin opintoihin järjestetään korkeakoulujen yhteishaussa. Ammattikorkeakoulutkin käyttävät digitaalista koetta arvioidakseen hakijan valmiuksia ammattikorkeakouluopintoihin. Ammattikorkeakoulujen valintakoe suoritetaan erillisessä koetilassa omalla kannettavalla tietokoneella Vallu-valintakoepalvelussa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.ammattikorkeakouluun.fi/hakijalle/valintatavat/amk-valintakoe/\">https://www.ammattikorkeakouluun.fi/hakijalle/valintatavat/amk-valintakoe/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kokeeseen ei voi osallistua tabletilla tai puhelimella. Noin viikkoa ennen koetta hakija saa linkin tunnisteeseen sekä tiedon valintakokeen ajasta ja paikasta. Koetilanteessa hakijan tulee esittää henkilöllisyystodistus ja tunniste valvojalle, kytkeä tietokone sähköverkkoon ja kirjautua langattomaan koeverkkoon ohjeiden mukaisesti. Koetilaan saa tuoda vain kannettavan tietokoneen ja suljetun matkapuhelimen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Ammattikorkeakoulun valintakoe koostuu useammasta osiosta. Jokaiselle osiolle on määritelty oma suoritusaika. Kun aika päättyy, osio sulkeutuu automaattisesti. Valintakoejärjestelmä laskee hakijan kokonaispisteet valintakokeesta automaattisesti. Tietokoneella saa olla auki vain valintakoejärjestelmä ja kokeessa oleva sähköinen aineisto. Kaikkien muiden ohjelmien käyttö on kielletty ja voi johtaa kokeen hylkäämiseen. Puhelimen käyttö kokeen aikana katsotaan vilpiksi, ja se johtaa koesuorituksen hylkäämiseen. Myös muiden kiellettyjen laitteiden tai tavaroiden hallussapito tai muu vilpillinen toiminta voi johtaa kokeen hylkäämiseen. Hakijalle voidaan myöntää yksilöllisiä järjestelyitä sairauden, vamman, lukivaikeuden tai jonkin muun erityisen syyn vuoksi.&nbsp;&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Myös ajokorttiin ja kuljettajantutkintoon liittyvä teoriakoe on toteutettu sähköisenä kokeena. Moottorikäyttöisten ajoneuvojen kuljettamiseen vaadittavista ajokorteista ja kuljettajantutkinnoista säädetään ajokorttilaissa (386/2011). Esimerkiksi henkilöauton kuljettamiseen tarvitaan ajokortti, jota varten on suoritettava ajokorttilain 35 §:ssa tarkoitettu koulutus. Ajokorttilain 53 §:n mukaan kuljettajantutkintoon sisältyy teoriakoe ja ajokoe. Valtioneuvoston asetuksella voidaan antaa tarkempia säännöksiä teoriakokeesta, tutkintoajoneuvoista ja muista kuljettajantutkinnon vaatimuksista. Liikenne- ja viestintävirasto voi antaa tarkempia määräyksiä teoriakokeiden, ajokokeiden ja käsittelykokeiden sisällöstä ja käytännön toteutuksesta. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Liikenne- ja viestintävirasto Traficom on antanut määräyksen kuljettajantutkinnon teoriakokeesta.\u003Cspan class=\"AlaviiteKooste\"> Kuljettajatutkinnon teoriakoemääräys 30.6.2021, TRAFICOM/149520/03.04.03.00/2021 (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://traficom.fi/sites/default/files/media/regulation/Kuljettajantutkinnon%20teoriakoem%C3%A4%C3%A4r%C3%A4ys%202021.pdf\">https://traficom.fi/sites/default/files/media/regulation/Kuljettajantutkinnon%20teoriakoem%C3%A4%C3%A4r%C3%A4ys%202021.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> Ajokorttia suorittavan on osoitettava osaamisensa vastaamalla kysymyksiin, jotka voivat olla sanallisia monivalintakysymyksiä, kuvakysymyksiä liikennetilanteista tai vaaratilanteiden tunnistamista ja riskien välttämistä koskevia riskientunnistamiskysymyksiä. Teoriakokeen kysymykset perustuvat tieliikenne- ja ajoneuvolainsäädännön sekä näiden nojalla annettujen säädösten sisältöön sekä tieliikenteen yleisiin periaatteisiin. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kuljettajantutkinnon teoriakoe käydään suorittamassa Liikenne- ja viestintäviraston palveluntuottajan palvelupisteessä. Koetilaisuuteen ei saa ottaa mukaan matkapuhelimia eikä muita viestintä- tai tallennusvälineitä. Koe sisältää kolme erilaista osiota, ja sen vastausten tarkastus on automatisoitu. Kokeeseen osallistuva näkee tuloksensa välittömästi kokeen suoritettuaan ja saa koetuloksensa myös sähköpostitse. Kokeeseen saa tarvittaessa erilaisia erityisjärjestelyjä, ja sen saa esimerkiksi tietyin edellytyksin suorittaa suullisesti pidennetyllä vastausajalla. Koetulosta koskevaan päätökseen saa hakea muutosta mm. tekemällä oikaisuvaatimuksen, joskin vastausten automatisoidun tarkastuksen voidaan olettaa vähentävän tarvetta muutoksenhaulle. Oikaisuvaatimuksen käsittely maksaa 50 euroa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://traficom.fi/sites/default/files/media/file/oikaisuvaatimusohje_kuljettajantutkinto.pdf\">https://traficom.fi/sites/default/files/media/file/oikaisuvaatimusohje_kuljettajantutkinto.pdf\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteenvetona voidaan todeta, että sähköisenä toteutetun kokeen valvonnassa voidaan käyttää sekä teknisen että fyysisen valvonnan keinoja. Teknisin keinoin voidaan rajoittaa esimerkiksi pääsyä kokeen ulkopuolisille verkkosivuille ja muihin tiedostoihin. Koetilanteessa paikalla olevat valvojat voivat puolestaan huolehtia mm. kokeeseen osallistuvan henkilöllisyyden toteamisesta, järjestyksen ylläpidosta ja siitä, ettei kokeeseen osallistuvilla ole käytössään kiellettyjä laitteita tai apuvälineitä. Tällaisia eri keinoja voitaisiin hyödyntää myös sähköisesti toteutettavan kansalaisuuskokeen valvonnassa. &nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maahanmuuttoviraston tehtävät \u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Seuraavassa tarkastellaan Maahanmuuttoviraston nykyistä tehtäväkenttää erityisesti siitä näkökulmasta, millainen rooli Maahanmuuttovirastolla voisi olla kansalaisuuskokeen toimeenpanossa. Maahanmuuttovirastosta annetun lain (156/1995) 1 §:n mukaan Maahanmuuttovirasto toimii sisäministeriön hallinnonalalla. Lain 2 §:ssä säädetään sen tehtävistä. Maahanmuuttovirasto käsittelee ja ratkaisee ne ulkomaalaisia ja Suomen kansalaisuutta koskevat asiat, jotka laissa tai sen nojalla säädetään sen tehtäviksi. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Toiseksi Maahanmuuttovirasto vastaa kansainvälistä suojelua hakevien ja tilapäistä suojelua saavien vastaanoton käytännön toiminnan ohjauksesta, suunnittelusta ja valvonnasta. Se vastaa säilöönottokeskusten käytännön toiminnan ohjauksesta ja valvonnasta. Viraston vastuulle kuuluu myös valtion vastaanotto- ja järjestelykeskusten sekä valtion säilöönottoyksiköiden ylläpito. Lisäksi viraston vastuulla on ihmiskaupan uhrien auttamisen toimeenpanon ohjaus.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kolmanneksi Maahanmuuttovirastolla on ulkomaalaisasioiden asiankäsittelyjärjestelmän ylläpito- ja kehitysvastuu. Neljänneksi Maahanmuuttovirasto tuottaa toimialaansa koskevissa asioissa tietopalveluita sisäministeriölle ja muille viranomaisille sekä kansainvälisille järjestöille. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Erityisesti kansalaisuuteen liittyvistä Maahanmuuttoviraston tehtävistä säädetään kansalaisuuslain 3 §:ssä. Pykälän 1 momentin mukaan Maahanmuuttovirasto päättää Suomen kansalaisuuden saamisesta, säilyttämisestä ja menettämisestä sekä kansalaisuusaseman määrittämisestä. Lisäksi kansalaisuuslain 37 §:ssä säädetään Maahanmuuttoviraston tehtävistä, jotka koskevat tiedottamista kansalaisuuden säilyttämisestä. Tämä liittyy siihen, että Suomen kansalaisuuden voi 22 vuotta täyttäessään menettää, jos on myös jonkin toisen valtion kansalainen eikä ole osoittanut riittävää yhteyttä Suomeen.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ulkomaalaisia koskevien asioiden käsittelyyn ja ratkaisuun sovelletaan puolestaan ulkomaalaislakia sekä eräissä tilanteissa lakia kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä kausityöntekijöinä työskentelyä varten&nbsp;(907/2017)&nbsp;ja lakia kolmansien maiden kansalaisten maahantulon ja oleskelun edellytyksistä yrityksen sisäisen siirron yhteydessä&nbsp;(908/2017). &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Maahanmuuttoviraston tehtävien sisällöstä säädetään myös vastaanottolaissa. Lain 9 §:n mukaan Maahanmuuttovirasto vastaa valtion vastaanottokeskusten ylläpidosta. Muiden vastaanottokeskusten perustamisesta Maahanmuuttovirasto tekee 10 §:n mukaisia sopimuksia. Pykälän 1 momentissa säädetään siitä, kenen kanssa sopimus voidaan tehdä. Pykälän 2 momentista ilmenee puolestaan, mistä sopimuksen määräyksissä on sovittava. Hallituksen esityksen (HE 131/2016 vp, s. 14) mukaan Maahanmuuttoviraston tulisi sopimuksia tehtäessä pyrkiä valtion kokonaisedun kannalta edullisiin ja joustaviin ratkaisuihin sekä huomioida sopimusosapuolen luotettavuus.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Maahanmuuttovirastoa koskevasta lainsäädännöstä voidaan siten todeta, että viraston kansalaisuuteen liittyvät tehtävät painottuvat ennen kaikkea päätöksentekoon. Virastolla on kuitenkin myös muunlaisia tehtäviä. Se vastaa kansalaisuusasioissakin käytettävän järjestelmän eli ulkomaalaisasioiden asiankäsittelyjärjestelmän ylläpidosta ja kehityksestä. Virasto myös ohjaa vastaanoton ja säilöönottoyksiköiden käytännön toimintaa sekä ihmiskaupan uhrien auttamisen toimeenpanoa. Lisäksi viraston tehtäviin kuuluu tietopalvelujen tuottamista. Tehtäväkenttä ulottuu siten monelta osin päätöksentekoa laajemmalle alueelle. Tältä osin on huomattava, että Maahanmuuttovirasto hankkii tarvittavia palveluita myös muilta tahoilta, jolloin se kilpailuttaa palveluntarjoajia ja tekee näiden kanssa sopimuksia ostopalveluista. Tällaisina hankintoina toteutetaan niin vastaanottopalveluita kuin myös tietojärjestelmien muutoksia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen käyttöönotosta tehdyssä työryhmän selvityksessä (s. 75–76) pidettiin mahdollisena, että vastuu kansalaisuuskokeen hallinnoinnista olisi Maahanmuuttovirastolla. Työryhmä pohti toisaalta myös sitä, missä määrin sama toimija voisi sekä vastata kansalaisuuskokeesta että päättää kansalaisuuden saamisesta. Tulevaan koejärjestelmään liittyvässä tehtäväjaossa olisi tärkeää kiinnittää huomiota siihen, että kokeen toteuttamiseen osallistuvia toimijoita voitaisiin pitää mahdollisimman objektiivisina ja neutraaleina. Esimerkiksi kokeiden laatimisesta voisi siten huolehtia jokin muu toimija kuin Maahanmuuttovirasto. Samalla on huomattava, että kansalaisuuskoe tultaisiin suorittamaan nimenomaan kansalaisuuden hakemista ja saamista varten. Kansalaisuuskoe liittyisi siten ennen kaikkea Maahanmuuttoviraston toimialaan, jolloin virasto tulisi hyötymään eniten järjestelmän sujuvuudesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Näillä perusteilla Maahanmuuttovirastolla voisi olla kansalaisuuskokeen toteuttamisessa keskeinen rooli erityisesti kokeen yleisen hallinnoimisen näkökulmasta. Lisäksi kansalaisuuskoejärjestelmässä olisi sellaisia tehtäviä, joissa voitaisiin puolestaan hyödyntää muiden toimijoiden asiantuntemusta. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.3.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kokoavia huomioita uudesta koejärjestelmästä\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Nykytilanteessa ei ole olemassa sellaista valmista tutkinto- tai koejärjestelmää, joka soveltuisi sellaisenaan osoittamaan hakijan riittävää yhteiskuntaosaamisen tasoa kansalaisuuden saamiseksi. Tämä tarkoittaa, että kansalaistamismenettelyä varten olisi kehitettävä kokonaan uusi kansalaisuuskoejärjestelmä. Tarkasteltaessa muita olemassa olevia tutkinto- ja koejärjestelmiä sekä sisäministeriön selvitystä ja kokeen toteutustapaa käsittelevää tutkimustietoa voidaan tunnistaa useita eri osatekijöitä, joita kokeen toteutuksessa ja siihen liittyvässä lainsäädännössä olisi otettava huomioon. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Esityksessä tarkastellut tutkintojärjestelmät on kehitetty tiettyä laissa määriteltyä tarkoitusta varten, jolloin niitä koskeva lainsäädäntö ja sen toimeenpano ei kaikilta osin olisi hyödynnettävissä kansalaisuuskoejärjestelmän toteutuksen näkökulmasta. Kuitenkin erityisesti yleisistä kielitutkinnoista ja niiden järjestämisestä on yksilöitävissä sellaisia sekä lainsäädäntöön että käytännön toteutukseen liittyviä näkökulmia, joita voitaisiin hyödyntää myös kansalaisuuskoejärjestelmän kehittämisessä. Kansalaisuuskoejärjestelmän osalta kyse olisi erityisesti koejärjestelmän hallinnoimiseen ja eri tehtäväkokonaisuuksien hoitamiseen liittyvistä seikoista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yleisessä kielitutkinnossa osa tehtävistä on keskitetty tutkintojärjestelmän hallinnoinnista vastaavalle viranomaiselle, kun taas joitakin tehtäviä hoitavat tehtyjen sopimusten ja yleisen ohjeistuksen perusteella tutkintotilaisuuksien järjestäjät. Yleisen kielitutkinnon kokeiden laatiminen on puolestaan keskitetty tarvittavaa asiantuntemusta edustavalle toimijalle, jonka kanssa tutkintojärjestelmää hallinnoiva viranomainen on tehnyt sopimuksen. Myös kansalaisuuskokeen toteutuksessa koejärjestelmän hallinnointi, koekysymysten laatiminen ja koetilaisuuksien järjestäminen muodostaisivat keskeisiä tehtäväkokonaisuuksia.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tutkintojärjestelmän hallinnointiin kuuluu yleisessä kielitutkinnossa sellaisia keskitettyjä tehtäviä kuin yleinen viestintä ja ohjeistus tutkintoon osallistuville, samoin tutkintotilaisuuksien järjestäjien ohjeistaminen esimerkiksi henkilöllisyyden tarkastamisesta. Yleisessä kielitutkinnossa on keskitetty ilmoittautumisjärjestelmä, jota käyttävät tutkintojärjestelmää hallinnoivan viranomaisen lisäksi sekä tutkintoon osallistuvat että tutkintotilaisuuksien järjestäjät. Tutkintojärjestelmää hallinnoiva viranomainen tekee myös päätöksen esimerkiksi siitä, onko tutkintotilaisuudessa tapahtunutta pidettävä vilppinä tai sen yrityksenä ja mitä seuraamuksia teosta mahdollisesti aiheutuu kokeeseen osallistuneelle.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yleisen kielitutkinnon käytännön toteutukseen kuuluu toisaalta sellaisia tutkintotilaisuuksien järjestäjille hajautettuja tehtäviä kuin tutkintotilaisuuksia varten tarvittavista tiloista ja muista puitteista huolehtiminen sekä tutkintoon osallistuvien henkilöllisyyden tarkastus ja tutkintotilaisuuksien valvonta. Tutkintotilaisuuksien järjestäjät käyttävät yleisen kielitutkinnon ilmoittautumisjärjestelmää ja lisäävät sinne tutkintotilaisuuksia koskevia tietoja. Vilppiepäilyistä tutkintotilaisuuksien järjestäjät toimittavat puolestaan selvityksen tutkintojärjestelmää hallinnoivalle viranomaiselle, joka asiaa selvitettyään ja asianosaista kuultuaan päättää mahdollisista seuraamuksista.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Myös tutkintotilaisuuksissa tarvittaviin erityisjärjestelyihin liittyy yleisessä kielitutkinnossa erilaisia tehtäviä. Erityisjärjestelyihin liittyvä yleinen viestintä ja ohjeistus on keskitetty, samoin erityisjärjestelyjä koskevien pyyntöjen käsittely ja mahdollisten erityisjärjestelyjen myöntäminen. Myönnettyjen erityisjärjestelyjen käytännön toteutuksesta huolehtivat puolestaan tutkintotilaisuuksien järjestäjät saamansa ohjeistuksen mukaisesti. Myös tulevan kansalaisuuskokeen erityisjärjestelyjä koskevista pyynnöistä voitaisiin ohjeistaa ja pyynnöt voitaisiin käsitellä keskitetysti, kun taas koetilaisuuksien järjestäjät voisivat huolehtia myönnettyjen erityisjärjestelyjen toteuttamisesta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Väärinkäytöksiä estetään muissa tutkinto- ja koejärjestelmissä useilla eri tavoilla. Käytössä oleviin keinoihin kuuluu mm. osallistujien henkilöllisyyden tarkastus, teknisesti suljettu sähköinen koeympäristö ja valvojien läsnäolo koetilaisuudessa sekä vilpillisen toiminnan perusteella annettavat seuraamukset, kuten koesuorituksen hylkääminen ja määräaikainen osallistumiskielto. Myös tulevassa kansalaisuuskoejärjestelmässä olisi tärkeää huolehtia kokeeseen osallistuvien henkilöllisyyden toteamisesta, koetilaisuuden valvonnasta teknisin keinoin ja paikalla olevien valvojien avulla sekä koetilaisuuksien järjestäjien ohjeistamisesta. Väärinkäytösten perusteella annettavat seuraamukset voisivat käsittää niin koesuorituksen hylkäämisen kuin myös määräaikaisen kiellon osallistua kokeeseen uudestaan. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Maahanmuuttovirastolla voisi olla keskeinen rooli kansalaisuuskoejärjestelmän hallinnoimisessa, sillä kansalaisuuskoe liittyisi ennen kaikkea sisäministeriön hallinnonalaan ja Maahanmuuttoviraston toimialaan. Tämä viranomaistaholle kuuluva kokonaisvastuu voitaisiin toteuttaa sellaisella tarkoituksenmukaisella tavalla, jolla huomioitaisiin viraston nykyiset tehtävät ja toiminnot sekä kansalaisuuskoejärjestelmään liittyvät erilaista asiantuntemusta edellyttävät tehtävät. Tulevassa kansalaisuuskoejärjestelmässä keskeisiä tehtäväkokonaisuuksia olisivat kokeen laatiminen ja koetilaisuuksien järjestäminen. Yleisten kielitutkintojen esimerkin mukaisesti nämä tehtävät voitaisiin järjestää siten, että hallinnoimisvastuussa oleva viranomainen voisi hyödyntää niiden toteutuksen osalta muiden toimijoiden asiantuntemusta. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhteenveto nykytilan arviosta\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Kansalaistamisen eri edellytysten täyttäminen osoittaa hakijan sitoutumista ja kotoutumista yhteiskuntaan useammasta näkökulmasta. Käytännössä edellytykset heijastavat sellaisia seikkoja kuin pysyvää maahan asettumista, kielitaitoa, yhteiskunnan sääntöjen noudattamista ja omasta toimeentulosta huolehtimista. Kansalaisuuden saamiseksi asetetuilla edellytyksillä voidaan arvioida ja varmistaa sitä, että kansalaisuus myönnetään sellaisille henkilöille, jotka osoittavat itsenäistä ja vastuullista toimintakykyä suomalaisessa yhteiskunnassa. Kansalaisuuslaissa ei ole kuitenkaan sellaista edellytystä, joka koskisi hakijan tietämystä suomalaisesta yhteiskunnasta ja jonka täyttäminen edellyttäisi häneltä perehtymistä keskeisiin ja perustavanlaatuisiin suomalaista yhteiskuntaa koskeviin tietoihin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Voimassa olevassa kansalaisuuslain sääntelyssä kansalaisuuden saamiselta edellytettävää onnistunutta kotoutumista ei tarkastella nimenomaisesti suomalaisen yhteiskunnan tuntemuksen näkökulmasta. Uusi yhteiskuntatietoa koskeva edellytys täydentäisi sitä tavoiteltavien tietojen ja taitojen kokonaisuutta, jota yhteiskunnan täysivaltaiselta jäseneltä katsotaan edellytettävän. Kansainvälisen vertailun perusteella voidaan todeta, että eri valtioiden kansalaistamismenettelyissä yhteiskuntatiedon osoittaminen nähdään yhtenä keskeisenä osatekijänä. Tyypillisesti yhteiskuntatietoa testataan kansalaisuuskokeella, kuten tehdään esimerkiksi Pohjoismaista Tanskassa ja Norjassa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vaatimus yhteiskuntatiedon osoittamisesta mahdollistaisi henkilön kotoutumisen arvioinnin kansalaisuuden saamisen näkökulmasta kattavammin kuin esimerkiksi pelkän kielitaidon perusteella. Yhteiskuntaosaamista koskeva edellytys tulisi toteuttaa kuitenkin siten, ettei kielen osaamisen merkitys kansalaistamisen edellytyksenä kaventuisi, sillä kielitaito on keskeinen osa kotoutumista. Tällöin tarkoituksenmukaisinta olisi säilyttää kielitaitoa koskeva sääntely nykyisellään. Toisaalta uuden yhteiskuntatietoedellytyksen toteutuksessa tulisi huomioida kansalaisuuden saamisen edellytyksenä oleva kielitaidon taso. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sen lisäksi, että kansalaisuuden saamisen uudeksi edellytykseksi asetettaisiin perehtyminen perustavanlaatuisiin yhteiskuntaa koskeviin tietoihin, tulisi erityistä huomiota kiinnittää edellytystä koskeviin sääntelyratkaisuihin. Kyse olisi sekä itse edellytykseen että kansalaisuuskokeen toteutustapaan liittyvistä seikoista.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä sanottua koskee esimerkiksi se, keitä kaikkia uusi edellytys koskisi. Tällöin hakijoiden ikään liittyvien perusteiden ohella yhteiskuntatietoa koskevassa sääntelyssä tulisi huomioida muun muassa mahdolliset edellytystä koskevat poikkeamis- ja rinnastamismahdollisuudet. Sääntelyssä olisi ensinnäkin huomioitava se, että kansalaisuus voitaisiin jatkossakin myöntää sellaisille hakijoille, joilla ei olisi tosiasiallista mahdollisuutta täyttää uutta yhteiskuntatietoedellytystä esimerkiksi terveydentilaan tai vammaisuuteen liittyvän syyn vuoksi.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Rinnastamismahdollisuudessa taas olisi kyse sen arvioimisesta, voisivatko tietyn tasoiset opinnot vertautua niihin tietoihin, joita uuden edellytyksen olisi tarkoitus koskea. Ei välttämättä olisi tarkoituksenmukaista, että kansalaisuuskokeella testattaviin tietoihin rinnastuvat tiedot opinnoissa jo omaksunut henkilö osallistuisi lisäksi kansalaisuuskokeeseen. Edellä esityksessä on kuvattu sitä, miten suomalaisessa koulutusjärjestelmässä yhteiskuntaosaamista sisältyy opetukseen eri tasoilla. Erityisesti lukiossa yhteiskuntaoppi tarjoaa syvällistä tietoa yhteiskunnan rakenteista, kansalaisen roolista ja vaikuttamisen keinoista. Lisäksi lukiokoulutuksen tehtävänä on laaja-alaisen yleissivistyksen vahvistaminen. Siten lukiokoulutuksen päätteeksi suoritettava ylioppilastutkinto voisi toimia vaihtoehtoisena tapana osoittaa riittävä yhteiskuntaosaaminen kansalaisuuden saamiseksi kansalaisuuskokeen suorittamisen sijaan. Korkeakoulututkintoja taas ei olisi rajattavissa selkeästi yhteiskuntatietoa koskevan ja kansalaisuuskoetta vastaavan sisällön perusteella, mutta myös korkeakoulututkinnon suorittaneet voitaisiin huomioida sääntelyssä siten, että heiltä ei vaadittaisi yhteiskuntatiedon osoittamista kansalaisuuskokeella.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kuten esityksessä on todettu, nykytilanteessa ei ole olemassa valmista koe- tai tutkintojärjestelmää, joka soveltuisi sellaisenaan osoittamaan kansalaisuuslakiin lisättäväksi tarkoitetun yhteiskuntatietoedellytyksen täyttämistä. Siten kansalaistamismenettelyä varten olisi kehitettävä kokonaan uusi kansalaisuuskoejärjestelmä. Koejärjestelmän toteuttaminen edellyttäisi uutta sääntelykokonaisuutta. Aiemmin sanotun mukaisesti tällöin olennaista on kiinnittää huomiota siihen, minkälaisena uusi koe toteutettaisiin ja minkälaista sääntelyä koejärjestelmältä edellytettäisiin. Sääntelyratkaisuissa tulisi huomioida koejärjestelmän selkeyteen, oikeudenmukaisuuteen ja laatuun liittyvät näkökulmat. Tämä liittyisi esimerkiksi sääntelyyn, joka koskisi eri toimijoiden tehtäviä, kokeen sisältöä ja oikeusturvaa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Uutta koejärjestelmää koskevan sääntelyn osalta voitaisiin tarkoituksenmukaisella tavalla hyödyntää joitain samankaltaisia ratkaisuja, joita jo olemassa oleviin ja esityksessä käsiteltyihin tutkinto- tai koejärjestelmiin sisältyy. Erityisesti yleisistä kielitutkinnoista ja niiden järjestämisestä on yksilöitävissä sellaisia sekä lainsäädäntöön että käytännön toteutukseen liittyviä näkökulmia, joita voitaisiin hyödyntää myös kansalaisuuskoejärjestelmän kehittämisessä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoejärjestelmän kannalta keskeistä olisi erityisesti koejärjestelmän hallinnoimiseen, kokeen laatimiseen ja järjestämiseen sekä kokeen sisältöön liittyvät ratkaisut. Myös kokeeseen liittyvään valvontaan sekä yhdenvertaiseen mahdollisuuteen suorittaa koe tulisi kiinnittää huomiota. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Uusi kansalaisuuskoejärjestelmä pitäisi sisällään sellaisia tehtäviä, jotka tulisi osoittaa viranomaistaholle. Näitä olisivat esimerkiksi kansalaisuuskokeen hallinnointi, valvonta ja kehittäminen. Nämä kansalaisuuskoejärjestelmän yleiseen hallinnoimisvastuuseen liittyvät tehtävät voitaisiin osoittaa Maahanmuuttoviraston tehtäviksi, sillä ehdotettu kansalaisuuskoe olisi tarkoitettu hyödynnettäväksi ennen kaikkea viraston toimialaan kuuluvassa kansalaistamismenettelyssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoejärjestelmässä keskeisiä tehtäväkokonaisuuksia olisivat kokeen laatiminen ja koetilaisuuksien järjestäminen. Kyse olisi sellaisista tehtävistä, jotka poikkeaisivat luonteeltaan Maahanmuuttoviraston muista tehtävistä. Sen vuoksi nämä tehtävät voitaisiin järjestää siten, että ne hankittaisiin ostopalveluina sellaisilta toimijoilta, joilla on niiden hoitamiseksi riittävää asiantuntemusta. Siten kiinnitettäisiin huomiota myös siihen, että kokeen toteuttamiseen osallistuvia toimijoita voitaisiin pitää mahdollisimman objektiivisina ja neutraaleina.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatimisessa tulisi huomioida se, että kokeella olisi pystyttävä arvioimaan luotettavasti ja riittävän yksiselitteisesti siihen osallistuvan tietoja. Siten kokeen laatijalla tulisi olla riittävän korkeatasoista ja monipuolista asiantuntemusta. Tältä osin kyseeseen voisi tulla esimerkiksi jokin yliopisto. Kansalaisuuskokeen järjestäjältä taas edellytettäisiin, että sillä olisi riittävät edellytykset kokeen järjestämiseen muun muassa tilojen, laitteiden, henkilöstön ja valvonnan osalta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen sisältö voisi muodostua sellaisesta perustiedosta, joka koskee suomalaisen yhteiskunnan toimintaa sekä yksilön oikeuksia ja velvollisuuksia. Tällainen tieto voisi koskea esimerkiksi suomalaisen yhteiskunnan keskeistä lainsäädäntöä sekä perus- ja ihmisoikeuksia. Lisäksi kyse voisi olla yhdenvertaisuuteen, sukupuolten tasa-arvoon sekä Suomen historiaan ja kulttuuriin liittyvästä tiedosta. Tietopohjaisella kokeella voitaisiin arvioida, miten kansalaisuutta hakeva henkilö osaa, hallitsee ja ymmärtää esimerkiksi mainitut suomalaisen yhteiskunnan toimintaan liittyvät keskeiset tiedot.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sekä kansalaisuuskokeen laatijan että kokeen suorittajan näkökulmasta olisi tarkoituksenmukaista, että kokeen kysymykset perustuisivat ennalta määriteltyyn ja yleisesti saatavilla olevaan oppimateriaaliin. Tällä voitaisiin varmistaa kokeen läpinäkyvyys ja tasapuolisuus. Kokeen sisällön osalta voitaisiin hyödyntää jo olemassa olevaa oppimateriaalia. Kyseeseen voisi tulla kotoutumislain mukaisessa yhteiskuntaorientaatiossa käytettävä oppimateriaali.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/oppimateriaali\u003C/a>\u003C/span>\u003C/span>\u003C/span> Yhteiskuntaorientaatio sisältää sellaista tietoa suomalaiseen yhteiskuntaan liittyvistä eri aihealueista, jota voitaisiin pitää kokeen tarkoituksen ja tavoitteiden kannalta keskeisenä. Oppimateriaalissa käsitellään esimerkiksi laaja-alaisesti suomalaisen yhteiskunnan toimintaa ja siihen vaikuttamista, suomalaista oikeusjärjestelmää ja sen eri piirteitä sekä Suomen historiaa. Yhteiskuntaorientaation oppimateriaalin pohjalta voitaisiin laatia sen sisältöä ja laajuutta vastaava nimenomainen kansalaisuuskokeen oppimateriaali, joka soveltuisi vielä tarkoituksenmukaisemmalla tavalla kansalaisuuskokeen käyttötarkoitukseen ja kokeeseen valmistautujan itseopiskelumateriaaliksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe olisi tarkoituksenmukaista toteuttaa sähköisessä muodossa, jolloin kokeen suorittaminen jo osaltaan heijastaisi sellaisia digitaalisia taitoja, joita suomalaisessa yhteiskunnassa toimiminen vaatii. Kansalaisuuskokeessa testattavien tietojen näkökulmasta soveltuvin koemuoto voisi olla monivalintakoe, joka sisältäisi oppimateriaalin pohjalta laadittuja kysymyksiä ja vastausvaihtoehtoja. Tällöin ei olisi tarvetta arvioida koesuoritusta erillisten arviointikriteerien perusteella. Siten tällainen verrattain yksinkertainen toteutustapa mahdollistaisi kokeen tehokkaan toimeenpanon esimerkiksi koetulosten tarkastuksen osalta samalla tavalla kuin esimerkiksi esityksessä kuvatussa kuljettajantutkintoon kuuluvassa teoriakokeessa. Kansalaisuuden saajalta edellytetään suomen tai ruotsin kielen hallintaa, joten myös kansalaisuuskoe olisi perusteltua järjestää suomeksi ja ruotsiksi. Tätä ratkaisua puoltaisivat myös kokeen toimeenpanon sujuvuuteen ja kustannustehokkuuteen liittyvät näkökulmat.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisäksi olisi huolehdittava siitä, että hylättyä koesuoritusta koskien olisi olemassa asianmukaiset ja riittävät menettelyt. Kuten edellä on tuotu esiin, monivalintakokeena toteutettava kansalaisuuskoe ei edellyttäisi samanlaista erilaisiin kriteereihin perustuvaa suorituksen arviointia kuin esimerkiksi eräät yleiseen kielitutkintoon kuuluvat osakokeet. Sen toteamiseen, olisiko monivalintakokeen kysymyksiin valittu eri vaihtoehdoista oikeita vastauksia, ei tarvittaisi erillisiä arviointikriteerejä. Sähköisesti tarkastettavaan monivalintakokeeseen ei siten lähtökohtaisesti liittyisi sellaista koesuorituksen arvioinnin tulkinnanvaraisuutta, jonka vuoksi yleisen kielitutkinnon suorituksen arviointia koskevalle muutoksenhaulle voi olla aihetta. Yleisen kielitutkinnon tai sen osakokeen suorituksen arviointia koskevasta päätöksestä saa vaatia oikaisua. Myös kansalaisuuskokeen osalta hylättyä koesuoritusta koskeva muutoksenhaku olisi tarkoituksenmukaista turvata oikaisuvaatimusmenettelyn kautta.&nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tavoitteet\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Esityksen yleisenä tavoitteena on tiukentaa kansalaistamisen edellytyksiä hallitusohjelman mukaisesti toteuttamalla kansalaisuuskokeen käyttöönottoa koskeva kirjaus. Tavoitteena on vahvistaa sitä lähestymistapaa, että kansalaisuus myönnetään onnistuneen kotoutumisen myötä. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Keskeisenä tavoitteena on painottaa suomalaisen yhteiskunnan tuntemuksen merkitystä kansalaistamisen kannalta, sillä riittävää yhteiskuntatietämystä voidaan pitää perusteltuna osoituksena tavoiteltavasta kotoutumisesta. Siten esityksellä pyritään edistämään kansalaisuuden saamisesta kiinnostuneen henkilön perehtymistä yhteiskunnan perusperiaatteisiin, sääntöihin ja arvoihin, yksilön oikeuksiin ja velvollisuuksiin sekä kansalaisuuden saamisen merkitykseen. Osaltaan tarkoituksena on korostaa henkilön oman aktiivisen toiminnan merkity
