laisuuskokeen laatimisesta voitaisiin tehdä jonkin yliopiston tai muun sellaisen yliopistollisen toimijan kanssa, jolla on riittävä asiantuntemus kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin laatimiseen. Kansalaisuuskokeesta tulisi keskeinen tapa sen osoittamiseen, että kansalaisuutta hakeva täyttäisi ehdotettavan uuden yhteiskuntatietoedellytyksen. Kansalaisuuskokeen suorittaminen olisi siten jatkossa merkittävää Suomen kansalaisuuden saamisen kannalta. Kansalaisuuskokeen laatijalta edellytettäisiin sen vuoksi riittävän korkeatasoista asiantuntemusta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kokeella olisi pystyttävä testaamaan luotettavasti siihen osallistuvan tietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Käytettävän oppimateriaalin pohjalta laadittujen kysymysten ja oikeiden vastausten olisi oltava riittävän yksiselitteisiä. Kokeen kysymykset vastauksineen olisi laadittava siten, että oikeat vastaukset ilmenisivät selvästi kokeeseen valmistautumiseen käytettävästä oppimateriaalista. Kokeen olisi samalla oltava siihen valmistautuvalle ennakoitava, ja kysymyksiin vastaamiseen tarvittavien tietojen olisi heijastettava oppimateriaalin keskeistä sisältöä. Koekysymykset olisi laadittava myös siten, että niissä käytetty suomen tai ruotsin kieli vastaisi vaikeustasoltaan laissa säädettyä kielitaitoedellytystä. Suomen kansalaisuutta varten vaadittavan kielitaidon taso on B1 eurooppalaisen kielitaidon arvioinnin viitekehyksen asteikolla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatiminen edellyttäisi siten monipuolista asiantuntemusta paitsi kokeen aihepiiristä, myös oppimateriaalin ja sen tietoihin perustuvien kysymysten ja vastausten muotoilusta sekä kokeen ja sen oppimateriaalin kielen sovittamisesta oikealle taitotasolle. Kokeen laatimiseen liittyisi koekysymysten testaaminen ennen kokeen käyttöönottoa, mitä varten kokeen laatimisesta vastaavan toimijan olisi pystyttävä huolehtimaan edustavan testiryhmän kokoamisesta. Kokeen laatimisesta vastaavalta toimijalta vaadittaisiin lisäksi koekysymysten kehittämisessä tarvittavaa tilastollista osaamista.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto voisi sopia kokeen ja sen oppimateriaalin laatimisesta paitsi yliopiston, myös muun edellytykset täyttävän yliopistollisen toimijan kanssa. Kokeen laatijana voisi siten toimia myös esimerkiksi sellainen korkeakoulukonsortio, joka koostuisi useammasta eri yliopistosta tai yliopistosta ja ammattikorkeakoulusta. Olennaista olisi se, että kokeen laatimiseen osallistuisi yliopisto, joka voisi tehdä kokeen laatimisessa yhteistyötä myös jonkin toisen yliopiston tai korkeakoulun kanssa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatijan tehtävistä ehdotetaan säädettäväksi uudessa 25 c §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 c §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Kansalaisuuskokeen laatijan tehtävät. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 c §, jossa säädettäisiin kansalaisuuskokeen laatijan tehtävistä. Kansalaisuuskokeen laatiminen käsittäisi koekysymysten ja niiden vastausten sekä kansalaisuuskokeen oppimateriaalin valmistelun yhteiskuntaorientaation oppimateriaalin pohjalta. Kansalaisuuskoe laadittaisiin kansalaisuuskokeen oppimateriaalin pohjalta siten, että siinä testattaisiin oppimateriaaliin sisältyvien keskeisten tietojen hallintaa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen laatijan tehtäviin kuuluisi ensinnäkin kansalaisuuskokeen oppimateriaalin laatiminen. Kansalaisuuskokeen oppimateriaalin sisältö perustuisi kotoutumislaissa tarkoitetun yhteiskuntaorientaation oppimateriaaliin. Kokeen laatija muokkaisi yhteiskuntaorientaation oppimateriaalista kansalaisuuskoetta varten itseopiskeluun soveltuvan oppimateriaalin. Myös kokeen oppimateriaalissa käytetyn kielen vaikeustaso olisi sovitettava yhteen kansalaisuuteen vaadittavan kielitaidon tason kanssa. Kansalaisuuskokeen oppimateriaali vastaisi laajuudeltaan yhteiskuntaorientaation oppimateriaalia.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Toiseksi kansalaisuuskokeen laatijan olisi valmisteltava riittävän laaja valikoima koekysymyksiä, jotta samat kysymykset eivät toistuisi laajalti eri ajankohtina pidettävissä koetilaisuuksissa. Tarkoituksena olisi se, että kokeella pystyttäisiin testaamaan luotettavasti siihen osallistuvan tietoja suomalaisen yhteiskunnan toiminnasta ja yksilön oikeuksista ja velvollisuuksista. Jokaista koekysymystä kohti olisi valmisteltava useampi vastausvaihtoehto, joista vain jokin olisi oikein. Vastausvaihtoehtojen laatimisessa olisi kiinnitettävä huomiota siihen, että oikean vastauksen valitseminen olisi tarpeeksi yksiselitteistä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen voisi suorittaa sekä suomen että ruotsin kielellä. Tästä syystä kokeen kysymykset ja vastausvaihtoehdot sekä oppimateriaali olisi laadittava sisällöltään samanlaisina sekä suomeksi että ruotsiksi. Kokeen ja oppimateriaalin kielen olisi lisäksi vastattava vaikeustasoltaan kansalaistamisen edellytyksenä olevaa kielitaidon tasoa, joka on B1 eurooppalaisen kielitaidon arvioinnin viitekehyksen asteikolla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kolmanneksi kansalaisuuskokeen laatijan tehtävänä olisi huolehtia kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin testauksesta, ylläpitämisestä ja kehittämisestä. Koekysymykset ja niiden vastausvaihtoehdot edellyttäisivät kehitystyötä ja testausta jo ennen kansalaisuuskokeen käyttöönottoa, jotta koe olisi valmis suoritettavaksi. Sen jälkeen kansalaisuuskoetta olisi edelleenkin kehitettävä jatkuvasti muun muassa kysymyskohtaisten suoritustilastojen ja kokeesta saadun palautteen perusteella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koetilaisuuksissa käytettävien kysymysten ja vastausvaihtoehtojen pitäisi vastata sen oppimateriaalin tietoja, joka olisi ennen koetilaisuuden ajankohtaa ollut yleisesti saatavilla kokeeseen valmistautumista varten. Oppimateriaalin mahdollisten päivitysten myötä olisi tarpeen ajantasaistaa ja yhdenmukaistaa myös kansalaisuuskokeen kysymyksiä ja vastausvaihtoehtoja. Uusia kysymyksiä ja vastausvaihtoehtoja tarvittaisiin lisäksi sen varmistamiseksi, etteivät aiemmin jo käytetyt kysymykset toistuisi laajalti eri koetilaisuuksissa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Neljänneksi kansalaisuuskokeen laatijan tehtäviin kuuluisi osallistua kansalaisuuskokeen asiantuntijatoimikuntaan, josta ehdotetaan säädettäväksi 25 f §:ssä. Asiantuntijatoimikuntaan osallistuminen olisi tarpeen kokeen oppimateriaalin ja koekysymysten kehittämisen näkökulmasta. Kokeen laatijan asiantuntemusta tarvittaisiin myös eräiden oikaisuvaatimusten arviointiin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe suoritettaisiin sähköisesti vastaamalla monivalintakysymyksiin. Myös koesuoritusten tarkastus toteutettaisiin sähköisesti. Kansalaisuuskokeen suoritusten tarkastus ei siten edellyttäisi erillistä arviointitehtävää. Maahanmuuttovirasto vastaisi 3 §:ään lisättäväksi ehdotetun 3 momentin mukaan mm. kansalaisuuskokeen tietojärjestelmäkokonaisuudesta, mukaan lukien koesuoritusten sähköisen tarkastuksen teknisestä toimivuudesta. Kokeen laatija vastaisi puolestaan kokeen kysymysten ja vastausvaihtoehtojen selkeydestä ja oikeiden vastausten yksiselitteisyydestä. Kokeen laatijan tehtäviin ei kuuluisi koesuoritusten hyväksymistä eikä hylkäämistä. Kokeen laatija esittäisi asiantuntijatoimikunnassa kuitenkin oman näkemyksensä yksittäisistä monivalintakysymyksistä, jos kokeeseen osallistunut olisi oikaisuvaatimuksessaan vedonnut niiden tulkinnanvaraisuuteen. Asiantuntijatoimikunta antaisi Maahanmuuttovirastolle tällaisessa tilanteessa lausunnon oikaisuvaatimuksesta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentti sisältäisi viittauksen rikosoikeudellista virkavastuuta koskeviin säännöksiin. Kokeen laatijan palveluksessa olevaan henkilöön sovellettaisiin rikosoikeudellista virkavastuuta koskevia säännöksiä hänen suorittaessaan 1 momentissa&nbsp;tarkoitettuja tehtäviä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentti sisältäisi asetuksenantovaltuuden. Valtioneuvoston asetuksella voitaisiin antaa tarkempia säännöksiä kansalaisuuskokeen laatijan tehtävistä ja niitä koskevien sopimusten sisällöstä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 d §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Kansalaisuuskokeen järjestäminen. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 d §, jossa säädettäisiin siitä, millaisten toimijoiden kanssa Maahanmuuttovirasto voisi tehdä sopimuksia kansalaisuuskokeen järjestämisestä. Koetilaisuuksien järjestäminen toteutettaisiin Maahanmuuttoviraston hankkimina ostopalveluina. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto voisi sopia kansalaisuuskokeen järjestämisestä sellaisten toimijoiden kanssa, joilla olisi riittävä asiantuntemus ja edellytykset koetilaisuuksien järjestämiseen. Koetilaisuuksien järjestäjät voisivat olla niin julkisyhteisöjä kuin myös muita edellytykset täyttäviä yhteisöjä. Kansalaisuuskokeen koetilaisuuksia voisi käytännössä olla toteuttamassa useamman eri toimijan muodostama järjestäjäverkosto. Kansalaisuuskokeen järjestäjällä olisi oltava koetilaisuuksille sopivat tilat ja muut puitteet sekä tarvittavaa henkilöstöä kokeen valvontaan. Koetilaisuuksien järjestämiseen tarkoitettujen tilojen olisi oltava esteettömät. Virasto voisi sopia koetilaisuuksien järjestämisestä esimerkiksi koulutuksen järjestäjien tai oppilaitosten ylläpitäjien kanssa. Koetilaisuuksien järjestäjien tehtävistä ja tiedonsaantioikeudesta ehdotetaan säädettäväksi 25 e §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Sopimuksia tehtäessä olisi otettava huomioon, että koetilaisuuksia olisi tarjolla alueellisesti riittävä määrä ja riittävän usein. Kansalaisuuskoetta olisi järjestettävä eri paikkakunnilla. Arvioitaessa siitä, millainen alueellinen kattavuus olisi riittävää, huomioitaisiin myös kysyntä kansalaisuuskokeen suorittamiselle ja siinä mahdollisesti ilmenevät alueelliset erot. Kansalaisuuskokeen suorittamista varten voitaisiin edellyttää osallistujalta sellaista matkustamista, jota voitaisiin pitää kohtuullisena. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe olisi lisäksi järjestettävä riittävän usein siten, että esimerkiksi kokeessa alle hyväksytyn suorituksen jäänyt voisi kohtuullisen ajan kuluttua osallistua kokeeseen uudestaan. Olisi myös tärkeää, että kokeeseen pystyisi ilmoittautumaan ilman merkittävää viivästystä, jos kansalaisuuskokeen kysyntä kasvaisi yllättäen ja koetilaisuuksiin aiheutuisi tästä syystä tilapäistä ruuhkaa. Kansalaisuuskoe olisi järjestettävä useamman kerran vuodessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 e §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Kansalaisuuskokeen järjestäjän tehtävät. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 e §, jossa säädettäisiin kansalaisuuskokeen järjestäjän tehtävistä. Näihin kuuluisi ensinnäkin koetilaisuuksien järjestäminen Maahanmuuttoviraston kanssa tehdyn sopimuksen ehtojen mukaisesti. Kokeen järjestäjä tarjoaisi esteettömät tilat ja muut tarvittavat puitteet kansalaisuuskokeen suorittamiselle ja ilmoittaisi tiedot vapaista koepaikoista kokeeseen ilmoittautumista varten. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Toiseksi kokeen järjestäjä huolehtisi kokeen valvonnasta. Ennen kokeen suorittamista tähän kuuluisi niin kokeeseen osallistuvien henkilöllisyyden kuin myös osallistujien omien laitteiden tarkastus. Kokeen järjestäjä valvoisi myös, että osallistujat alkaisivat suorittaa koetta siihen tarkoitetussa järjestelmässä. Kokeen järjestäjä huolehtisi valvonnasta myös koetilaisuuden aikana. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kolmanneksi kokeen järjestäjän tehtävänä olisi sellaisten erityisjärjestelyjen toteuttaminen, joita Maahanmuuttovirasto olisi myöntänyt kokeeseen osallistuvalle esimerkiksi tämän vammaisuuden perusteella. Kokeen suorittamista koskevista erityisjärjestelyistä ehdotetaan säädettäväksi uudessa 25 g §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Neljänneksi kokeen järjestäjän tehtävänä olisi ilmoittaa Maahanmuuttovirastolle viipymättä sellaisista tilanteista, joiden perusteella Maahanmuuttovirasto päättäisi seuraamusten antamisesta kokeeseen osallistuneelle. Tällaisesta tilanteesta olisi kyse silloin, kun kokeen osallistuja rikkoisi järjestystä koetilaisuuden aikana eikä koetilaisuuden valvojan kehotuksesta huolimatta lopettaisi häiritsevää käyttäytymistä. Kokeen järjestäjän olisi ilmoitettava Maahanmuuttovirastolle myös koetilaisuudessa havaitusta vilpillisestä menettelystä. Järjestyksen rikkomisen ja vilpillisen menettelyn perusteella annettavista seuraamuksista ehdotetaan säädettäväksi uudessa 25 h §:ssä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Koetilaisuuden järjestäjän tehtäviin ei kuuluisi koesuoritusten arviointia. Sähköisesti suoritettavan monivalintakokeen tarkastus toteutettaisiin sähköisesti. Myös erityisjärjestelyin suoritettuna kansalaisuuskoe olisi monivalintakoe, jonka hyväksytty suoritus edellyttäisi sitä, että kokeen kysymyksiin olisi valittu riittävästi oikeita vastauksia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentti sisältäisi säännökset kansalaisuuskokeen järjestäjän tiedonsaantioikeudesta. Koetilaisuuksien järjestäjät tarvitsisivat tietoja kokeeseen ilmoittautuneista henkilöistä, jotta he voisivat tarkastaa kokeeseen osallistuvien henkilöllisyyden ja varmistaa tällä tavoin, ettei kukaan ulkopuolinen henkilö tekisi koetta siihen ilmoittautuneen henkilön puolesta. Tiedot koetilaisuuteen ilmoittautuneista henkilöistä olisivat koetilaisuuden järjestämisen kannalta välttämättömiä. Koetilaisuuden järjestäjällä olisi oikeus saada nämä tiedot Maahanmuuttoviraston ylläpitämästä tietojärjestelmästä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Silloin, kun Maahanmuuttovirasto myöntäisi kokeeseen osallistuvalle erityisjärjestelyjä esimerkiksi tämän vammaisuuden perusteella, kansalaisuuskokeen järjestäjän tehtävänä olisi huolehtia tällaisten erityisjärjestelyjen toteuttamisesta. Kansalaisuuskokeen järjestäjän olisi siten välttämätöntä saada tietoja myös sellaisista esimerkiksi terveydentilaan ja vammaisuuteen liittyvistä seikoista, joiden perusteella koetilaisuuteen ilmoittautunut henkilö tarvitsisi erityisjärjestelyjä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Momentti sisältäisi myös nimenomaisen säännöksen siitä, että kansalaisuuskokeen järjestäjään sovellettaisiin viranomaisten toiminnan julkisuudesta annetussa laissa säädettyjä salassapitovelvoitteita, kun se hoitaisi edellä mainittuja tehtäviä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisäksi momentti sisältäisi viittauksen rikosoikeudellista virkavastuuta koskeviin säännöksiin. Kokeen järjestäjän palveluksessa olevaan henkilöön sovellettaisiin rikosoikeudellista virkavastuuta koskevia säännöksiä hänen suorittaessaan 1 momentissa&nbsp;tarkoitettuja tehtäviä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentti sisältäisi asetuksenantovaltuuden. Valtioneuvoston asetuksella voitaisiin antaa tarkempia säännöksiä kansalaisuuskokeen järjestäjien tehtävistä ja niitä koskevien sopimusten sisällöstä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 f §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Asiantuntijatoimikunta. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 f §, jossa säädettäisiin kansalaisuuskoetta varten perustettavasta asiantuntijatoimikunnasta. Tämä uusi asiantuntijaelin toimisi Maahanmuuttoviraston yhteydessä ja asettamana, ja sen puheenjohtaja olisi Maahanmuuttovirastosta. Vastuu kansalaisuuskokeen yleisestä hallinnosta, tiedottamisesta, tietojärjestelmäkokonaisuudesta, valvonnasta ja kehittämisestä kuuluisi tässä esityksessä ehdotetulla tavalla Maahanmuuttovirastolle. Kansalaisuuskokeen luonteen ja kansalaisuuskoejärjestelmän tehtäväjaon vuoksi olisi kuitenkin tarpeen, että Maahanmuuttoviraston työn tukena toimisi sellainen asiantuntijatoimikunta, jonka jäsenten edustus olisi poikkihallinnollista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Toimikunnan varapuheenjohtajaksi valittaisiin mahdollisuuksien mukaan kotoutumisen asiantuntija. Varapuheenjohtajan olisi suotavaa edustaa työ- ja elinkeinoministeriön toimialaa, johon valtioneuvoston ohjesäännön (262/2003) mukaan kuuluu muun muassa maahanmuuttajien kotouttaminen. Uuden yhteiskuntatietoedellytyksen ja siihen liittyvän kansalaisuuskokeen taustalla olisi keskeisesti ajatus siitä, että hakijalta voidaan kansalaisuuden myöntämistä varten edellyttää kotoutumista. Siksi olisi tarkoituksenmukaista, että kansalaisuuskoetta käsittelevän toimikunnan varapuheenjohtaja edustaisi kotoutumisen asiantuntemusta. Siten varapuheenjohtaja voisi olla työ- ja elinkeinoministeriöstä. Ministeriön ohella kansalaisuuskokeen sekä toimikunnan tehtävien ja tarkoituksen kannalta keskeistä hallinnonalan asiantuntemusta olisi lisäksi esimerkiksi työllisyys-, kehittämis- ja hallintokeskuksella, joka vastaa kotoutumisen edistämisestä annetun lain 56 §:n perusteella yhteiskuntaorientaation oppimateriaalin ylläpidosta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Asiantuntijajäsenten tulisi edustaa myös koulutuksen asiantuntemusta. Suomen kansalaisuus ja sen edellytykset kuuluvat sisäministeriön toimialaan, ja myös ehdotettava uusi kansalaisuuskoe olisi sisäministeriön hallinnonalan tehtävä. Asiantuntijajäsenten olisi kuitenkin aiheellista edustaa opetus- ja kulttuuriministeriön toimialaa, johon kuuluvat muun muassa tiede ja koulutus. Tämä olisi kansalaisuuskoejärjestelmän kokonaisuuden kannalta perusteltua etenkin sen vuoksi, että niin kansalaisuuskokeen laatimisesta kuin myös koetilaisuuksien järjestämisestä huolehtisivat ehdotuksen mukaan tieteen ja koulutuksen alan toimijat Maahanmuuttoviraston kanssa tehdyn sopimuksen perusteella. Kumpaakin tehtävää hoitavan toimijan edustajien olisi hyödyllistä osallistua asiantuntijatoimikuntaan. Siten asiantuntijajäseniin voisi kuulua esimerkiksi opetus- ja kulttuuriministeriön ja Opetushallituksen edustajat kokeen laatijan ja järjestäjän edustajien lisäksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Mahdolliset muut asiantuntijajäsenet voisivat edustaa esimerkiksi joitakin edellä mainituista hallinnonaloista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentti sisältäisi säännökset asiantuntijatoimikunnan tehtävistä. Asiantuntijatoimikunnan olisi tarkoitus tukea Maahanmuuttovirastoa kansalaisuuskoejärjestelmän yleisessä kehittämisessä, jonka ehdotetaan tässä esityksessä kuuluvan viraston vastuulle. Toimikunta voisi käsitellä esimerkiksi sellaisia asioita kuin koetilaisuuksien kysynnän ja tarjonnan yhteensovittamista, kansalaisuuskoetta koskevalle yleiselle viestinnälle ilmenneitä tarpeita sekä tietoja yhteiskuntaorientaation oppimateriaalin kehityksestä. Maahanmuuttovirasto voisi kansalaisuuskokeen yleisestä hallinnosta vastaavana viranomaisena hyödyntää omassa toiminnassaan toimikunnan asiantuntijanäkemyksiä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Asiantuntijatoimikunta antaisi lisäksi Maahanmuuttoviraston pyynnöstä lausunnon kansalaisuuskoetta koskevasta oikaisuvaatimuksesta. Esityksessä ehdotetaan lisättäväksi lain 41 §:ään säännökset hylättyä koesuoritusta koskevasta oikaisuvaatimuksesta. Maahanmuuttovirasto pyytäisi asiantuntijatoimikunnalta lausunnon oikaisuvaatimuksesta, jos kansalaisuuskokeen tulokseen olisi vaadittu oikaisua koekysymysten tulkinnanvaraisuuden perusteella. Oikaisuvaatimusmenettelyä ja lausunnon pyytämistä asiantuntijatoimikunnalta kuvataan tarkemmin esityksen 41 §:ää koskevan muutoksen säännöskohtaisissa perusteluissa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentti sisältäisi asetuksenantovaltuuden. Valtioneuvoston asetuksella voitaisiin antaa tarkempia säännöksiä toimikunnan kokoonpanosta, asioiden käsittelystä ja tehtävistä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 g §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Kokeen suorittamista koskevat erityisjärjestelyt. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 g §, jossa säädettäisiin kansalaisuuskokeessa käytettävistä erityisjärjestelyistä. Erityisjärjestelyjä voisi pyytää sairauden, vamman, lukemisen ja kirjoittamisen erityisvaikeuden tai muun näihin rinnastettavan syyn perusteella. Säännösten tarkoituksena olisi turvata kansalaisuuskokeen suorittajien kohtuulliset ja yhdenvertaiset mahdollisuudet kokeen suorittamiseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vammaisten henkilöiden oikeuksia koskeva yleissopimus velvoittaa muun muassa varmistamaan, että vammaisilla henkilöillä on oikeus hankkia kansalaisuus ja vaihtaa sitä eikä heiltä riistetä kansalaisuutta mielivaltaisesti tai vammaisuuden perusteella. Sopimus velvoittaa myös toteuttamaan kaikki asianmukaiset toimet, joilla varmistetaan kohtuullisten mukautusten tekeminen. Kohtuullinen mukauttaminen tarkoittaa tarvittaessa yksittäistapauksessa toteutettavia tarpeellisia ja asianmukaisia muutoksia ja järjestelyjä, joilla ei aiheuteta suhteetonta tai kohtuutonta rasitetta ja joilla varmistetaan vammaisten henkilöiden mahdollisuus nauttia tai käyttää kaikkia ihmisoikeuksia ja perusvapauksia yhdenvertaisesti muiden kanssa. Kohtuullisista mukautuksista säädetään myös yhdenvertaisuuslain (1325/2014) 15 §:ssä, jonka mukaan viranomaisen, koulutuksen järjestäjän, työnantajan sekä tavaroiden tai palvelujen tarjoajan on tehtävä asianmukaiset ja kulloisessakin tilanteessa tarvittavat kohtuulliset mukautukset, jotta vammainen henkilö voi yhdenvertaisesti muiden kanssa käyttää viranomaisen palveluita sekä saada koulutusta, työtä ja yleisesti tarjolla olevia tavaroita ja palveluita samoin kuin suoriutua työtehtävistä ja edetä työuralla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen voisi ehdotuksen mukaan suorittaa erityisjärjestelyin siinä tapauksessa, että kansalaisuuskokeen suorittaja olisi jonkin säännöksissä mainitun syyn vuoksi estynyt suorittamasta kansalaisuuskoetta samalla tavalla kuin muut kokeen suorittajat. Edellytyksenä olisi siten se, että tällainen syy muutoin muodostaisi esteitä kansalaisuuskokeen suorittamiselle tai haittaisi vakavasti sen suorittamista. Tarvittavien erityisjärjestelyjen sisältöön vaikuttaisi niin säännöksissä mainittujen syiden luonne kuin myös jostakin tällaisesta syystä kokeen suorittajalle seuraavien vaikeuksien aste. Suomen- ja ruotsinkielinen kansalaisuuskoe voitaisiin esimerkiksi tulkata viittomakielelle, jos kokeen suorittaja olisi viittomakieltä käyttävä vammainen. Kansalaisuuskokeeseen ei kuitenkaan voisi saada erityisjärjestelyjä pelkästään sillä perusteella, että kokeeseen ilmoittautuneella ei olisi tarvittavaa suomen tai ruotsin kielen taitoa, joten koetta ei voisi suorittaa vieraalle kielelle tulkattuna. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentissa säädettäisiin kansalaisuuslain 18 b §:n 2 ja 3 momentissa tarkoitetun alle 65-vuotiaan henkilön mahdollisuudesta suorittaa kansalaisuuskoe suullisesti. Luku- ja kirjoitustaidottomalta henkilöltä ei edellytetä sekä suullisen että kirjallisen kielitaidon osoittamista kansalaisuuslaissa säädetystä kielitaitoedellytyksestä poiketen. Luku- ja kirjoitustaidottomaksi todetun henkilön on esitettävä todistus suomen tai ruotsin kielen puhumisen ja ymmärtämisen tasosta tai siitä, että hän on osallistunut säännöllisesti suomen tai ruotsin kielen opintoihin. Suullisesti suoritettavaa koetta koskevan säännöksen tarkoituksena olisi huomioida se, että tietyissä rajatuissa tilanteissa kokeen suorittamiseksi riittäisi puhutun kielen taito. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotettava uusi yhteiskuntatietoa koskeva edellytys olisi kielitaitoedellytyksestä erillinen, jolloin osoitusta sen täyttämisestä edellytettäisiin kielitaidon lisäksi. Toisaalta kansalaisuuslain kielitaidon osoittamista tai kielitaitoedellytyksestä poikkeamista koskevaa sääntelyä ei muutettaisi. Luku- ja kirjoitustaidoton henkilö voisi jatkossakin osoittaa kielitaidon lain 18 b §:n 2 ja 3 momentissa säädetyn mukaisesti. Siten mainittu sääntely säilyisi edelleenkin merkityksellisenä kielitaitoedellytyksen ja kielitaidon osoittamisen näkökulmasta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe suoritettaisiin suomen tai ruotsin kielellä suullisesti, jolloin suullisesti järjestettävällä kokeella huomioitaisiin lain 18 b §:n 2 ja 3 momentissa tarkoitetun luku- ja kirjoitustaidottoman henkilön mahdollisuus kokeen suorittamiseen. Koesuoritus ei edellyttäisi koekysymysten ja vastausvaihtoehtojen itsenäistä lukemista. Yksilöllisesti järjestettävässä suullisessa kokeessa kokeen suorittajalle luettaisiin koekysymykset vastausvaihtoehtoineen ja suorittaja ilmoittaisi suullisesti omasta mielestään oikean vastausvaihtoehdon. Näin koesuoritus ei esimerkiksi edellyttäisi kirjoittamista, jota ei myöskään voimassa olevan sääntelyn mukaisesti edellytetä 18 b §:n 2 ja 3 momentissa tarkoitetulta henkilöltä. Kokeen suorittajalle luettava koe myös mukautettaisiin sellaiseen suomen tai ruotsin kielen muotoon, joka olisi esimerkiksi rakenteeltaan ja sisällöltään yleiskieltä ymmärrettävämpää. Selkokieli on yleiskieltä saavutettavampaa kieltä, jolloin näin toteutetussa suullisessa kokeessa huomioitaisiin kokeen suorittajan kielelliset erityistarpeet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suullisena toteutettu kansalaisuuskoe vastaisi muutoin sähköisessä muodossa suoritettavaa koetta. Siten esimerkiksi kokeen kysymykset koskisivat samoja aiheita kuin kansalaisuuskokeessa muutoinkin ja ne perustuisivat kansalaisuuskokeen oppimateriaaliin. Kansalaisuuskokeen oppimateriaali olisi saatavissa myös kuunneltavassa muodossa kokeeseen valmistautumista varten. Luku- ja kirjoitustaidottomalle henkilölle saavutettavalla eli kuunneltavassa muodossa olevalla oppimateriaalilla huolehdittaisiin siitä, että myös tällaisella henkilöllä olisi mahdollisuudet kansalaisuuskokeen suorittamiseen ilman kirjallista suomen tai ruotsin kielen taitoa, jonka osoittamista ei heidän kohdallaan edellytetä myöskään kielitaitoedellytyksen täyttämiseksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeeseen valmistautumisen näkökulmasta merkitystä olisi myös sillä, että kokeen aiheita käsitellään kotoutumislain 25 §:ssä tarkoitetussa yhteiskuntaorientaatiossa. Ainakin osa kansalaisuuslain 18 b §:n 2 ja 3 momentissa tarkoitetuista luku- ja kirjoitustaidottomista olisi suorittanut kotoutumislain 25 §:ssä tarkoitetun yhteiskuntaorientaation tai osallistunut muuhun sellaiseen koulutukseen, jossa olisi käsitelty suomalaista yhteiskuntaa. Kunnan on kotoutumislain 25 §:n mukaan järjestettävä kotoutuja-asiakkaille yhteiskuntaorientaatio mahdollisuuksien mukaan heidän äidinkielillään tai muutoin hyvin osaamillaan kielillä. Tämän lisäksi kahdeksan vuoden asumisajan aikana on mahdollista suorittaa muitakin koulutuksia, joiden tarkoituksena on yhteiskuntaosaamisen, luku- ja kirjoitustaidon ja kielitaidon kerryttäminen. Esimerkiksi kotoutumispalveluiden uudistuksen yhtenä tavoitteena olisi jatkossa yhä selkeämmin muun muassa suomen tai ruotsin kielen oppiminen. Tämä edesauttaisi osaltaan mahdollisuutta suorittaa koe, joka edellyttäisi ainoastaan suullisen kielitaidon hallitsemista. Ehdotuksen osalta olisi huomioitava, että kansalaisuuslain 18 b §:n 2 ja 3 momentissa ei ole kyse tilanteesta, jossa henkilö ei voi terveydentilansa tai vammaisuutensa vuoksi oppia kieltä. Esityksessä ehdotetaan, että yhteiskuntatietoedellytyksestä voitaisiin pyytää poikkeamista sellaisessa tilanteessa, jossa edellytystä ei voisi täyttää terveydentilan tai vammaisuuden perusteella.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentti sisältäisi säännökset erityisjärjestelyistä päättämisestä. Päätöksen mahdollisten erityisjärjestelyjen myöntämisestä tekisi Maahanmuuttovirasto. Erityisjärjestelyjen myöntämiseksi tehty päätös ei olisi rajattu vain yhtä tiettyä koetilaisuutta koskevaksi. Erityisjärjestelynä voitaisiin myöntää esimerkiksi lisäaikaa kokeen suorittamiseen tai mahdollisuus kokeen suorittamiseen erillisessä ja esteettömässä koetilassa. Erityisjärjestelyt voisivat liittyä myös sähköisen kokeen erityispiirteisiin ja sisältää esimerkiksi mahdollisuuden käyttää suurempaa näyttöä tai suurentaa kirjasinkokoa. Vammaisille tarkoitetut erityisjärjestelyt voisivat lisäksi kattaa erilaisia apuvälineitä, mahdollisuuden oman tietokoneen tai muun vastaavan laitteen käyttöön siinä valmiiksi olevien apuvälineiden kanssa sekä vammaispalvelulaissa tarkoitetun henkilökohtaisen avun. Maahanmuuttoviraston myöntämien erityisjärjestelyjen toteutumisesta huolehtisivat koetilaisuuksien järjestäjät ehdotetun 25 e §:n 1 momentin 3 kohdan mukaisesti. Säännökset koetilaisuuksien järjestäjien tiedonsaantioikeudesta olisivat 25 e §:n 2 momentissa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Erityisjärjestelyjä koskeva pyyntö olisi esitettävä Maahanmuuttovirastolle ennen kokeen suorittamista. Pyyntö olisi perusteltava, ja siihen olisi liitettävä selvitys erityisjärjestelyjen tarpeesta. Selvityksenä voisi olla esimerkiksi lääkärintodistus tai muu asiantuntijan antama lausunto kokeeseen ilmoittautuvan tilasta. Selvityksestä pitäisi ilmetä, millä tavoin kokeeseen ilmoittautuvalla oleva sairaus, vamma, lukemisen ja kirjoittamisen erityisvaikeus tai muu näihin rinnastettava syy vaikuttaa kansalaisuuskokeen suorittamiseen. Selvityksenä voisi toimia myös Kelan päätös viittomakieliselle myönnetystä oikeudesta käyttää Kelan tulkkauspalvelua. Kansalaisuuskokeen voisi suorittaa luku- ja kirjoitustaidottomuuden vuoksi suullisesti vain, jos luku- ja kirjoitustaidottomuus olisi osoitettu kansalaisuuslain 18 b §:n 3 momentissa tarkoitetulla tavalla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe mahdollisine erityisjärjestelyineen olisi kansalaisuuden hakemista edeltävä vaihe. Jos kansalaisuuskoe ei olisi kohtuudella suoritettavissa erityisjärjestelyjenkään avulla, kansalaisuushakemuksen yhteydessä voisi pyytää poikkeamista yhteiskuntatietoedellytyksestä terveydentilan tai vammaisuuden vuoksi 17 b §:n perusteella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 h §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Seuraamus järjestyksen rikkomisesta ja vilpillisestä menettelystä. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 h §, jossa säädettäisiin siitä, millaisia seuraamuksia kansalaisuuskokeen osallistujalle voitaisiin antaa järjestyksen rikkomisen tai vilpillisen menettelyn perusteella. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 1 momentin säännökset koskisivat tilannetta, jossa kansalaisuuskokeen suorittaja rikkoisi järjestystä koetilaisuudessa. Järjestyksen rikkomista olisi sellainen käyttäytyminen, joka häiritsee koetilaisuutta tai muita kokeen suorittajia. Jos tällä tavoin käyttäytyvä ei koetilaisuuden valvojan kehotuksesta huolimatta lopettaisi järjestyksen rikkomista, seuraamuksena olisi se, että hänen koesuorituksensa katsottaisiin hylätyksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentti sisältäisi säännökset vilpillisen menettelyn perusteella annettavista seuraamuksista. Koesuoritus katsottaisiin hylätyksi, jos kokeen suorittaja syyllistyisi koetilaisuudessa vilpilliseen menettelyyn, siinä avustamiseen tai sen yritykseen. Lisäksi hän menettäisi oikeutensa osallistua koetilaisuuteen kuuden kuukauden ajaksi koetilaisuudesta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Vilpilliseksi menettelyksi katsottaisiin sellainen teko tai tekemättä jättäminen, jonka tarkoituksena on antaa väärä kuva omista tai toisen henkilön tiedoista. Sillä tarkoitettaisiin kiellettyihin keinoihin tai apuvälineisiin turvautumista kokeessa. Vilpillisenä menettelynä pidettäisiin muun muassa lunttausta, keskustelua, muuta kuin etukäteen myönnettyä ulkopuoliseen apuun tukeutumista, kokeen tekemistä toisen puolesta sekä kokeen kopiointia ja tallentamista. Vilpilliseen menettelyyn rinnastettaisiin siinä avustaminen, samoin vilpillisen menettelyn yritys. Määräaika laskettaisiin siitä koepäivästä, jolloin vilpillinen menettely, siinä avustaminen tai sen yritys olisi tapahtunut. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Joissakin tilanteissa voitaisiin päättää, että kokeen suorittaja menettäisi oikeutensa osallistua koetilaisuuteen 12 kuukauden ajaksi koetilaisuudesta. Näin voitaisiin tehdä silloin, kun kokeen suorittajan vilpillinen menettely olisi ollut toistuvaa tai sitä olisi muutoin pidettävä erityisen vakavana ja haitallisena. Erityisen vakavasta ja haitallisesta menettelystä olisi kyse esimerkiksi siinä tapauksessa, että kokeeseen ilmoittautuneen henkilön sijaan kokeen olisi tosiasiassa suorittanut kokonaan toinen henkilö. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentti sisältäisi säännöksiä seuraamuksia koskevasta päätöksestä. Seuraamusten antamisesta niin järjestyksen rikkomisen kuin myös vilpillisen menettelyn perusteella päättäisi Maahanmuuttovirasto. Virasto saisi tiedon 1 ja 2 momentin mukaisista tilanteista koetilaisuuksien järjestäjiltä, jotka ilmoittaisivat niistä virastolle ehdotetun 25 e §:n 1 momentin 4 kohdan mukaisesti. Virasto huolehtisi viranomaisena sen selvittämisestä, mitä koetilaisuudessa olisi tapahtunut, hallintolain 31 §:n 1 momentin mukaisesti. Osana asian selvittämistä ja käsittelyä virasto huolehtisi myös kokeeseen osallistuneen asianosaisen kuulemisesta hallintolain 34 §:n 1 momentin mukaisesti. Sen jälkeen virasto tekisi päätöksen koesuorituksen mahdollisesta hylkäämisestä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Jos kyse olisi siitä, että kokeeseen osallistunut olisi syyllistynyt koetilaisuudessa vilpilliseen menettelyyn, siinä avustamiseen tai sen yritykseen, virasto päättäisi myös siitä, että kyseinen henkilö menettäisi oikeutensa osallistua kokeeseen määräajaksi. Virasto arvioisi, olisiko käsillä säännösten mukaisia perusteita 12 kuukauden määräajalle. Päätöksen tehtyään virasto huolehtisi tilapäisen osallistumiskiellon toteutuksesta esimerkiksi merkitsemällä sen asianosaiselle kokeen ilmoittautumisjärjestelmään. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto voisi myös peruuttaa kansalaisuuskokeeseen ilmoittautumisen, jos vilpilliseen menettelyyn syyllistynyt olisi jo ehtinyt ilmoittautua uudelleen suorittamaan koetta. Käytännössä olisi mahdollista, että kokeeseen osallistunut ehtisi asian selvittämisen aikana ilmoittautua uuteen koetilaisuuteen. Maahanmuuttoviraston olisi voitava peruuttaa ilmoittautuminen tällaisessa tilanteessa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Seuraamuksia koskeva päätös pantaisiin täytäntöön tehdystä valituksesta huolimatta, jollei hallintotuomioistuin kieltäisi täytäntöönpanoa. Tämä koskisi niin koesuorituksen katsomista hylätyksi kuin myös tilapäisen osallistumiskiellon merkitsemistä tietojärjestelmään. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">25 i §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Koemaksu. \u003C/span>Kansalaisuuslakiin lisättäisiin uusi 25 i §, jossa säädettäisiin kansalaisuuskokeen osallistumismaksusta. Maksu suoritettaisiin kansalaisuuskokeeseen ilmoittautumisen yhteydessä. Koemaksujen perimisestä huolehtisi Maahanmuuttovirasto. Virasto vastaisi kansalaisuuskokeen maksuliikenteen hoitamisesta osana kansalaisuuskoejärjestelmän yleistä hallinnointia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen maksu perustuisi omakustannusperiaatteeseen. Valtion maksuperustelain (150/1992) 6 §:n mukaisena lähtökohtana on se, että julkisoikeudellisesta suoritteesta valtiolle perittävän maksun suuruuden tulee vastata suoritteen tuottamisesta valtiolle aiheutuvien kokonaiskustannusten määrää. Kansalaisuuskokeen koemaksuilla katettaisiin kansalaisuuskoejärjestelmästä aiheutuvia kustannuksia. Koemaksun määrästä säädettäisiin sisäministeriön asetuksella, joka koskee Maahanmuuttoviraston suoritteiden maksullisuutta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentti sisältäisi säännökset koemaksun palauttamisesta. Koemaksu palautettaisiin kokeeseen ilmoittautuneelle, jos hän olisi estynyt osallistumasta kokeeseen oman sairautensa vuoksi. Edellytyksenä olisi se, että tällaisesta esteestä olisi ilmoitettu Maahanmuuttovirastolle ennen koetilaisuutta. Esteestä ilmoittamiselle voisi olla esimerkiksi toiminto kokeeseen ilmoittautumiseen käytettävässä järjestelmässä. Pyyntö maksun palauttamisesta olisi tehtävä Maahanmuuttovirastolle 14 päivän kuluessa koetilaisuuden ajankohdasta. Sairaus olisi osoitettava pyyntöön liitettävällä lääkärintodistuksella. Sairautensa vuoksi estynyt voisi ilmoittautua uuteen koetilaisuuteen samalla tavalla kuin yleensä, esimerkiksi ilmoittautumiseen käytettävästä järjestelmästä ilmenevälle vapaalle koepaikalle tai jonoon. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">41 §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Muutoksenhaku. \u003C/span>Pykälä sisältää informatiivisen viittauksen oikeudenkäynnistä hallintoasioissa annettuun lakiin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälään ehdotetaan lisättäväksi uusi 2 momentti, jossa säädettäisiin hylättyä koesuoritusta koskevasta oikaisuvaatimuksesta. Kansalaisuuskokeen suorittamisessa olisi kyse kansalaisuuden hakemista edeltävästä vaiheesta. Koesuorituksen hyväksymisellä tai hylkäämisellä ei olisi välitöntä vaikutusta kenenkään oikeuteen, velvollisuuteen tai oikeudellisesti määriteltyyn etuun. Koesuoritusta koskeva päätös ei siten muodostaisi sellaista hallintopäätöstä, johon olisi voitava hakea muutosta valittamalla. Koesuorituksen hylkäämistä koskevaan Maahanmuuttoviraston päätökseen saisi kuitenkin vaatia oikaisua. Oikaisuvaatimusmenettelystä säädetään hallintolain 7 a luvussa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen hyväksytty suoritus edellyttäisi sitä, että kokeeseen osallistuva valitsisi kokeen kysymyksiin riittävän määrän oikeita vastausvaihtoehtoja. Kansalaisuuskoe olisi sähköisesti suoritettava monivalintakoe, jonka tarkastus toteutettaisiin niin ikään sähköisesti. Kokeeseen osallistunut saisi tiedon oikeiden ja väärien vastausten määrästä ja siitä, olisiko suoritus hyväksytty vai hylätty. Lisäksi hän saisi tiedon oikeiden ja väärien vastausten jakautumisesta aiheiden mukaan. Lähtökohtana olisi se, että kokeen tulos ja vastausten jakautuminen annettaisiin osallistujalle tiedoksi sähköisenä viestinä sähköisestä asioinnista viranomaistoiminnassa annetun lain mukaisesti.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kokeeseen ei sisältyisi esimerkiksi mitään sellaisia osioita, joissa kokelaan itse kirjoittamia vastauksia olisi arvioitava erityisten arviointikriteerien perusteella. Koetuloksen hyväksyttävyys ei siten riippuisi kunkin suorituksen yksilöllisestä arvioinnista, mistä syystä myös kokeeseen osallistuneen henkilön oikeussuojan tarve jäisi verraten vähäiseksi. Oikaisuvaatimusmenettely olisi tarpeen ennen kaikkea sen selvittämistä varten, olisiko esimerkiksi jokin tekninen häiriötilanne estänyt kokeen suorittamisen hyväksytysti. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Oikaisua olisi lisäksi mahdollista vaatia aiheittain yksilöityjen monivalintakysymysten tulkinnanvaraisuuden perusteella. Kokeeseen osallistunut tarvitsisi oikaisuvaatimuksen tekemistä ja sen perustelemista varten tiedon erityisesti siitä, mitä aiheita koskeviin kysymyksiin olisi valittu väärät vastaukset. Näin kokeen suorittaja voisi arvioida sitä, olisiko väärin valittujen vastausten taustalla ollut kysymysten ja vastausvaihtoehtojen epäselvä muotoilu, jolloin hän voisi harkita oikaisuvaatimuksen tekemistä. Kokeen kysymyksiä ja vastausvaihtoehtoja ei kuitenkaan sellaisinaan annettaisi kokeeseen osallistuneen käyttöön, sillä olisi tarkoituksenmukaista estää koekysymysten leviämistä koetilaisuuksien ulkopuolelle. Näin turvattaisiin niin kokeen luotettavuutta kuin myös kokeeseen osallistuvien yhdenvertaisuutta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto käsittelisi oikaisuvaatimusta koskevan asian hallintolain 49 e §:n mukaisesti kiireellisenä. Kansalaisuuskokeen oikaisua koskevat asiat olisivat lähtökohtaisesti myös viranomaisen näkökulmasta verraten yksinkertaisia. Hallintolain mukainen kiireellisyysvaatimus olisi siten sovitettavissa yhteen asioiden edellyttämän selvittämisen kanssa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälään ehdotetaan lisättäväksi myös uusi 3 momentti, joka sisältäisi säännöksen oikaisuvaatimukseen liittyvästä lausuntomenettelystä, viittauksen hallintolakiin sekä oikaisuvaatimuksesta annettua päätöstä koskevan valituskiellon. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto voisi pyytää virastolle tehdystä oikaisuvaatimuksesta lausunnon ehdotetussa 25 f §:ssä tarkoitetulta asiantuntijatoimikunnalta. Menettely olisi tarkoitettu tilanteisiin, joissa oikaisuvaatimus olisi tehty monivalintakysymysten tulkinnanvaraisuuden perusteella. Tällöin oikaisuvaatimuksen käsittely edellyttäisi myös muunlaista selvittämistä kuin esimerkiksi pelkän teknisen häiriötilanteen olemassaolon toteamista. Lausunnon pyytämisellä huomioitaisiin se, että Maahanmuuttovirastolla ei olisi kysymysten ja niiden vastausvaihtoehtojen sisällön arvioimisen edellyttämää asiantuntemusta. Siten menettelyn tarkoituksena olisi turvata tarvittava asiantuntemus kokeen sisällön ja tulkinnanvaraisuuden arviointiin.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kun kokeeseen osallistunut vaatisi Maahanmuuttovirastolta koetuloksen oikaisua sillä perusteella, että hänen väärä vastauksensa olisi johtunut monivalintakysymysten tulkinnanvaraisuudesta, Maahanmuuttovirasto pyytäisi oikaisuvaatimuksesta lausunnon asiantuntijatoimikunnalta. Lausuntoa pyydettäisiin oikaisuvaatimuksessa aiheen mukaan yksilöidyn kysymyksen tulkinnanvaraisuudesta ja oikaisuvaatimuksessa esitetyistä perusteluista. Asiantuntijatoimikunnan jäsenet antaisivat lausuntoa varten näkemyksensä monivalintakysymyksen tulkinnanvaraisuudesta. Kysymyksen ja sen vastausvaihtoehtojen asianmukaisuutta arvioitaisiin myös kansalaisuuskokeen oppimateriaalista ilmenevien tietojen näkökulmasta. Jos oikaisuvaatimuksessa yksilöityä monivalintakysymystä olisi toimikunnan asiantuntijalausunnon mukaan pidettävä tulkinnanvaraisena, Maahanmuuttovirasto oikaisisi kokeen tulosta koskevaa päätöstä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Momenttiin sisältyisi myös viittaus hallintolakiin. Viittauksen tarkoituksena olisi selventää, että asiantuntijatuntijatoimikunnan lausunnon pyytämistä lukuun ottamatta oikaisuvaatimusmenettelyyn sovellettaisiin, mitä hallintolaissa säädetään. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lisäksi momentissa säädettäisiin valituskiellosta. Ehdotetussa 2 momentissa tarkoitetusta oikaisuvaatimuksesta annettuun päätökseen ei saisi hakea muutosta valittamalla. Mahdollisuus vaatia koetuloksen oikaisua merkitsisi erityistä oikeusturvakeinoa sellaiselle henkilölle, joka haluaisi myöhemmin hakea kansalaisuutta. Oikaisuvaatimusta koskevasta Maahanmuuttoviraston päätöksestä ei saisi valittaa hallintotuomioistuimeen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Valituskielto olisi rajattu koskemaan ainoastaan sellaista kansalaisuuskokeeseen liittyvää päätöstä, jonka Maahanmuuttovirasto olisi antanut kansalaisuuskokeen hylättyä suoritusta koskevan päätöksen oikaisuvaatimuksesta. Sellaisista Maahanmuuttoviraston päätöksistä kuin ehdotetun 25 g §:n mukaisia erityisjärjestelyjä, 25 h §:n mukaisia seuraamuksia ja 25 i §:n mukaisia maksunpalautuksia koskevista päätöksistä voisi valittaa hallinto-oikeuteen oikeudenkäynnistä hallintoasioissa annetun lain mukaisesti.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">42 §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Oikaisuvaatimuksen käsittelymaksu.\u003C/span> Kansalaisuuslakiin lisättäisiin uusi 42 §, joka sisältäisi säännöksiä kansalaisuuskoetta koskevan oikaisuvaatimuksen käsittelymaksusta. Pykälän 1 momentin mukaan oikaisuvaatimuksen käsittely olisi maksullinen. Oikaisuvaatimuksen käsittelymaksun suuruudesta säädettäisiin Maahanmuuttoviraston suoritteiden maksullisuutta koskevassa sisäministeriön asetuksessa, joka annetaan vuosittain valtion maksuperustelain nojalla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momentin mukaan vireille tulleen oikaisuvaatimuksen käsittelyn jatkaminen edellyttäisi sitä, että oikaisuvaatimuksen käsittelymaksu olisi suoritettu. Käsittelymaksu olisi suoritettava 30 päivän kuluessa siitä, kun oikaisuvaatimus olisi tullut vireille. Jos käsittelymaksua ei suoritettaisi tämän ajan kuluessa, oikaisuvaatimus voitaisiin jättää tutkimatta. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 3 momentin mukaan oikaisuvaatimuksen käsittelymaksu palautettaisiin asianosaiselle, jos Maahanmuuttovirasto muuttaisi oikaisuvaatimuksen kohteena olevaa päätöstä siten, että kansalaisuuskokeen suoritus olisi hylätyn sijaan hyväksytty. Maksun palauttaminen olisi tällaisessa tilanteessa perusteltua, koska oikaisuvaatimuksen tekeminen olisi osoittautunut aiheelliseksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">44 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Hakemuksen ja ilmoituksen vireillepano\u003C/span>. Pykälän 3 ja 4 momenttiin tehtäisiin tekniset muutokset poistamalla valtion maksuperustelain ja hallintolain säädösnumerot. Valtion maksuperustelakiin viitattaisiin ensimmäisen kerran ehdotetussa 25 i §:n 1 momentissa ja hallintolakiin ehdotetussa 41 §:n 3 momentissa. Samalla 3 momentissa ministeriöstä käytetty sisäasiainministeriö ajantasaistettaisiin. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">45 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Hakijan liitteet hakemukseen.\u003C/span> Pykälässä säädetään kielitaitoa ja toimeentuloa sekä mahdollisia poikkeamisperusteita koskevan selvityksen liittämisestä kansalaisuushakemukseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 1 momenttia ehdotetaan muutettavaksi siten, että siihen lisättäisiin maininta 17 b §:ssä tarkoitetusta yhteiskuntatiedon osoittamista koskevasta selvityksestä. Uuden yhteiskuntatietoedellytyksen täyttymisen voisi ehdotetun 17 b §:n mukaisesti osoittaa hyväksytysti suoritetulla kansalaisuuskokeella tai suomen- tai ruotsinkielisellä ylioppilas- tai korkeakoulututkinnolla. Kansalaisuushakemukseen olisi siten liitettävä selvitys hyväksytysti suoritetusta kansalaisuuskokeesta tai ylioppilas- tai korkeakoulututkinnosta. Yhteiskuntatiedon osoittamista koskeva selvitys olisi tarpeen sen varmistamiseksi, että Maahanmuuttovirasto saisi kansalaisuushakemuksen käsittelyä varten tiedon yhteiskuntatietoedellytyksen täyttämisestä. Ainakin pidemmällä aikavälillä virasto tulisi todennäköisesti saamaan edellytyksen täyttämistä koskevat tiedot myös suoraan tietojärjestelmästä, jolloin selvityksen liittämistä hakemukseen ei käytännössä enää tarvittaisi. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Laki Maahanmuuttovirastosta\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2 §.\u003C/span> \u003Cspan class=\"KursiiviTeksti\">Tehtävät. \u003C/span>Pykälässä säädetään Maahanmuuttoviraston erilaisista tehtävistä. Pykälän 1 momentin mukaan Maahanmuuttovirasto käsittelee ja ratkaisee ne ulkomaalaisia ja Suomen kansalaisuutta koskevat asiat, jotka laissa tai sen nojalla säädetään sen tehtäviksi. Pykälän 2 momentin mukaan Maahanmuuttovirasto vastaa kansainvälistä suojelua hakevien ja tilapäistä suojelua saavien vastaanoton käytännön toiminnan ohjauksesta, suunnittelusta ja valvonnasta sekä säilöönottokeskusten käytännön toiminnan ohjauksesta ja valvonnasta. Viraston vastuulle kuuluu myös valtion vastaanotto- ja järjestelykeskusten sekä valtion säilöönottoyksiköiden ylläpito. Lisäksi viraston vastuulla on ihmiskaupan uhrien auttamisen toimeenpanon ohjaus. Pykälän 3 momentin mukaan Maahanmuuttovirastolla on ulkomaalaisasioiden asiankäsittelyjärjestelmän ylläpito- ja kehitysvastuu. Lisäksi Maahanmuuttovirasto tuottaa toimialaansa koskevissa asioissa tietopalveluita sisäministeriölle ja muille viranomaisille sekä kansainvälisille järjestöille. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Pykälän 2 momenttiin ehdotetaan lisättäväksi uusi 5 kohta, jossa säädettäisiin kansalaisuuskokeeseen liittyvistä Maahanmuuttoviraston tehtävistä. Kohdassa mainittaisiin kansalaisuuskokeen yleinen hallinto, valvonta ja kehittäminen. Pykälän 4 kohtaan tehtäisiin samalla teknisluonteinen muutos, jossa kohdan lopussa oleva piste korvattaisiin puolipisteellä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto vastaisi viranomaisena kansalaisuuskoejärjestelmän yleisestä hallinnosta, valvonnasta ja kehittämisestä. Kansalaisuuslaissa olisi yksityiskohtaisia säännöksiä kansalaisuuskoejärjestelmästä ja siihen liittyvien Maahanmuuttoviraston tehtävien sisällöstä. Kansalaisuuskokeen laatimisesta ja järjestämisestä huolehtisivat ehdotuksen mukaan muut toimijat kuin Maahanmuuttovirasto, ja säännökset näistäkin kansalaisuuskoejärjestelmän osista sisältyisivät kansalaisuuslakiin. &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">7.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Laki henkilötietojen käsittelystä maahanmuuttohallinnossa\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">1 §. \u003C/span>\u003Cspan class=\"KursiiviTeksti\">Lain soveltamisala ja henkilötietojen käsittelyn tarkoitus. \u003C/span>Henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 1 §:ssä säädetään lain soveltamisalasta ja henkilötietojen käsittelyn tarkoituksesta. Lain 1 §:n 1 momentin mukaisesti lakia sovelletaan henkilötietojen automatisoituun ja muuhun käsittelyyn, kun henkilötiedot muodostavat tai niiden on tarkoitus muodostaa henkilörekisteri tai sen osa ja henkilötietoja käsitellään muun muassa 2 kohdan mukaisissa Suomen kansalaisuuteen liittyvissä tarkoituksissa. Näitä ovat Suomen kansalaisuuden saamista, säilyttämistä, menettämistä ja kansalaisuudesta vapautumista sekä kansalaisuusaseman määrittämistä koskevien asioiden käsittely ja päätöksenteko. Mainittu 2 kohta vastaa sisällöltään voimassa olevan kansalaisuuslain 3 §:n 1 momenttia, jonka mukaan Maahanmuuttovirasto päättää kansalaisuuslaissa tarkoitetusta Suomen kansalaisuuden saamisesta, säilyttämisestä ja menettämisestä sekä kansalaisuuslain määrittämisestä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 1 §:n 1 momentin 2 kohtaa ehdotetaan muutettavaksi siten, että siihen lisättäisiin maininta sellaisista kansalaisuuskokeeseen liittyvistä Maahanmuuttoviraston tehtävistä, joihin sisältyy henkilötietojen käsittelyä. Näitä olisivat kansalaisuuskokeen yleistä hallintoa ja valvontaa koskevat tehtävät. Ehdotus vastaisi sisällöltään kansalaisuuslain 3 §:ään ehdotettavaa muutosta siltä osin kuin kansalaisuuskokeeseen liittyvät Maahanmuuttoviraston uudet tehtävät sisältäisivät henkilötietojen käsittelyä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto käsittelisi kansalaisuuskokeen osallistujien henkilötietoja hallinnoidessaan kokeen ilmoittautumisjärjestelmää, maksuliikennettä ja koesuoritusten rekisteröintiä sekä päättäessään mahdollisista järjestyksen rikkomisen tai vilpillisen menettelyn perusteella annettavista seuraamuksista. Maahanmuuttoviraston tehtävät kattaisivat myös koetilaisuuksiin tarvittavista erityisjärjestelyistä päättämisen, mitä varten viraston olisi välttämätöntä käsitellä erityisiin henkilötietoryhmiin kuuluvia tietoja henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 8 §:n mukaisesti. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lakia alemman asteinen sääntely\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan uutta kansalaisuuskoetta, jonka yleinen hallinto kuuluisi Maahanmuuttovirastolle. Virasto ei kuitenkaan laatisi eikä järjestäisi koetta, vaan se sopisi näiden tehtävien hoitamisesta muiden toimijoiden kanssa. Kansalaisuuskokeen toteutuksesta ehdotetaan säädettäväksi kansalaisuuslakiin lisättävässä uudessa 3 a luvussa. Osa uusista pykälistä sisältäisi myös asetuksenantovaltuuden. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Asetuksen antaminen edellyttää, että tarvittavat perussäännökset ovat laissa ja että laissa on asianmukainen valtuutussäännös. Perustuslain mukaan lain alaan kuuluvista asioista voidaan asetuksella antaa ainoastaan tarkempia säännöksiä. Jäljempänä osiossa 11.7 arvioidaan tarkemmin alemman asteisen säädöksen antamisen valtuutusta ja sen suhdetta perustuslain 80 §:ään. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että valtioneuvoston asetuksella voitaisiin antaa tarkempia säännöksiä kansalaisuuskokeen sisällöstä, kokeen laatijan ja järjestäjän tehtävistä ja niitä koskevien sopimusten sisällöstä sekä kansalaisuuskoetta varten asetettavan asiantuntijatoimijakunnan kokoonpanosta, asioiden käsittelystä ja tehtävistä. Asetuksenantovaltuudet olisivat kulloinkin lakiin ehdotettavien perussäännösten yhteydessä. Kansalaisuuskokeen sisällöstä ja sitä koskevasta asetuksenantovaltuudesta säädettäisiin uudessa 25 a §:ssä. Kansalaisuuskokeen laatijan tehtävistä ja niihin liittyvästä asetuksenantovaltuudesta säädettäisiin uudessa 25 c §:ssä. Kansalaisuuskokeen järjestäjän tehtäviä koskevat säännökset ja asetuksenantovaltuus olisivat uudessa 25 e §:ssä. Maahanmuuttoviraston yhteydessä toimivasta asiantuntijatoimikunnasta säädettäisiin uudessa 25 f §:ssä, joka sisältäisi myös toimikuntaa koskevan asetuksenantovaltuuden. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Luonnos ehdotettavasta asetuksesta on esityksen liitteenä.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin ehdotetaan myös säännöksiä kansalaisuuskokeen osallistumismaksusta, josta säädettäisiin uudessa 25 i §:ssä. Maksu perustuisi valtion maksuperustelain lähtökohdan mukaisesti omakustannusperiaatteeseen, ja sillä katettaisiin uudesta koejärjestelmästä aiheutuvia kustannuksia. Koemaksun määrästä säädettäisiin sisäministeriön asetuksella, joka koskee Maahanmuuttoviraston suoritteiden maksullisuutta.\u003Cspan class=\"AlaviiteTeksti\"> Asetus Maahanmuuttoviraston suoritteiden maksullisuudesta annetaan vuosittain. Viimeisin sisäministeriön asetus (1336/2025) koskee vuoden 2026 suoritteiden maksullisuutta. \u003C/span> &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan lisäksi, että kansalaisuuskokeen suorituksen hylkäämistä koskevaan päätökseen saisi vaatia oikaisua Maahanmuuttovirastolta. Oikaisuvaatimuksenkin käsittelymaksusta säädettäisiin Maahanmuuttoviraston suoritteiden maksullisuutta koskevassa sisäministeriön asetuksessa.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Voimaantulo\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Lain olisi tarkoitus tulla voimaan vuoden 2027 alussa. Tarkoituksena on, että Maahanmuuttovirasto valmistelisi kansalaisuuskokeen käyttöönottoa vuoden 2026 aikana. Tarvittavat toimenpiteet liittyvät muun muassa kansalaisuuskokeen laatimisesta ja järjestämisestä tehtäviin sopimuksiin ja tällaisten ostopalvelujen kilpailuttamiseen. Maahanmuuttoviraston on valmistauduttava muutoinkin erilaisiin tehtäviin, jotka sille ehdotuksen mukaan kuuluisivat kansalaisuuskokeen yleisestä hallinnosta, valvonnasta ja kehittämisestä vastaavana viranomaisena. Viraston tehtäviin sisältyisi esimerkiksi kansalaisuuskokeeseen liittyvästä tietojärjestelmäkokonaisuudesta ja tiedottamisesta huolehtiminen ja kokeen maksuliikenteen hoitaminen. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Laissa ehdotetaan säädettäväksi siirtymäsäännöksistä. Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoedellytystä. Sitä ei kuitenkaan sovellettaisi vielä sellaisiin hakemuksiin, jotka tehtäisiin kahden kuukauden kuluessa lain voimaantulosta. Muilta osin sääntelyä sovellettaisiin välittömästi lain tultua voimaan, mukaan lukien Maahanmuuttoviraston ja muiden toimijoiden tehtävien osalta. Riittävä aika lain voimaantulon ja uuden yhteiskuntatietoedellytyksen soveltamisen välille olisi perusteltua Maahanmuuttovirastolle kuuluvien toimeenpanotehtävien näkökulmasta. Tämän lisäksi siirtymäajan avulla mahdollistettaisiin muun muassa se, että kokeeseen voisi alkaa valmistua ja siihen voisi ilmoittautua ennen kuin sen suorittamista vaadittaisiin kansalaisuuden saamiseen. Lain soveltamista porrastamalla pyrittäisiin estämään sellaisen tilanteen muodostumista, jossa kansalaistamiselle lisätyn uuden edellytyksen täyttymistä ei pystyisi tosiasiassa osoittamaan, koska kansalaisuuskoetta ei olisi vielä otettu käyttöön. Sääntelyn lähtökohtana on se, että kansalaisuuskoe suoritettaisiin ennen kansalaisuuden hakemista. Kahden kuukauden siirtymäajalla edistettäisiin osaltaan sitä, että kansalaisuutta haettaisiin jatkossakin vasta kansalaistamisen edellytysten täyttyessä, kuten Maahanmuuttovirasto on suositellut. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Lisäksi ehdotetaan säädettäväksi, että kansalaisuushakemukseen sovellettaisiin voimassa olevan lain mukaisia edellytyksiä, jos asia olisi tullut vireille ennen ehdotettavien lainmuutosten voimaantuloa. Kansalaisuushakemusten käsittelymaksut perustuvat omakustannusperiaatteeseen. Vuonna 2026 hakemuksen käsittelymaksu on 550 tai 650 euroa. Ehdotettujen muutosten tullessa voimaan on vireillä huomattava määrä asioita siten, että hakijat ovat arvioineet täyttävänsä edellytykset voimassa olevien kansalaisuuslain säännösten ja Maahanmuuttoviraston verkkosivuilla olevien tietojen perusteella. &nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Toimeenpano ja seuranta\u003C/span>\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Ehdotettavien muutosten täytäntöönpanoa, toimivuutta ja vaikutusten toteutumista seurattaisiin sisäministeriön maahanmuutto-osastolla. Seurattavia tietoja olisivat esimerkiksi tilastot kansalaisuushakemusten ja niihin tehtyjen päätösten määrästä sekä myönteisten ja kielteisten päätösten jakautumisesta. Keskeisiä olisivat niin ikään tilastot kansalaisuuskokeen osallistujamääristä, hyväksymisprosenteista ja jonotilanteesta. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan, että Maahanmuuttoviraston yhteydessä toimisi poikkihallinnollista osaamista edustava asiantuntijatoimikunta, joka tukisi virastoa kansalaisuuskoejärjestelmän yleisessä kehittämisessä. Maahanmuuttoviraston vastuulle kuuluisi kansalaisuuskokeen kehittäminen, mutta virasto voisi toiminnassaan hyödyntää toimikunnan asiantuntijanäkemyksiä. Toimikunnassa voitaisiin käsitellä esimerkiksi kokeiden järjestämiseen liittyviä seikkoja, joiden seuranta olisi keskeistä lain toimivuuden kannalta. Esityksessä ehdotetaan, että valtioneuvoston asetuksella voitaisiin muun ohella antaa tarkempia säännöksiä myös asiantuntijatoimikunnan asioiden käsittelystä. Esityksen liitteenä olevan asetusluonnoksen mukaan toimikunta laatisi vuosittain työsuunnitelman ja toimintakertomuksen ja toimittaisi ne sisäministeriölle. Siten sisäministeriö voisi muiden edellä mainittujen toimien ohella seurata lain toimivuutta myös erityisesti sille toimitettavan toimintakertomuksen avulla. Lisäksi on mahdollista, että sisäministeriöllä olisi oma asiantuntijajäsen toimikunnassa.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Suhde perustuslakiin ja säätämisjärjestys\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuutta koskevat perustuslain säännökset\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 5 §:ssä säädetään Suomen kansalaisuudesta. Perustuslakiuudistuksen esitöiden (HE 1/1998 vp, s. 77/I) mukaan Suomen kansalaisuuden valtiosääntöoikeudellinen merkitys on supistunut sen vuoksi, että vuonna 1995 voimaan tulleessa perusoikeusuudistuksessa perustuslain perusoikeussäännökset ulotettiin koskemaan pääsääntöisesti kaikkia Suomen oikeudenkäyttöpiirissä olevia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain esitöissä (s. 77/I) on todettu, että suoraan Suomen kansalaisuuteen on kytketty äänioikeus valtiollisissa vaaleissa ja kansanäänestyksissä (14 § 1 mom.), vaalikelpoisuus eduskuntavaaleissa (27 § 1 mom.) ja tasavallan presidentin vaalissa (54 § 1 mom.) sekä valtioneuvoston jäsenyys (60 § 1 mom.). Lailla voidaan säätää, että määrättyihin julkisiin virkoihin tai tehtäviin voidaan nimittää vain Suomen kansalainen (125 § 1 mom.). Maanpuolustusvelvollisuus koskee 127 §:n mukaan Suomen kansalaisia. Perustuslain 9 §:n 3 momentin mukaan Suomen kansalaista ei saa estää saapumasta maahan, karkottaa maasta eikä vastoin tahtoaan luovuttaa tai siirtää toiseen maahan. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 14 §:n 1 momentin mukaan jokaisella Suomen kansalaisella, joka on täyttänyt kahdeksantoista vuotta, on oikeus äänestää valtiollisissa vaaleissa ja kansanäänestyksessä. Perustuslain 27 §:n 1 momentin mukaan eduskuntavaaleissa on vaalikelpoinen jokainen äänioikeutettu, joka ei ole vajaavaltainen. Perustuslain 54 §:n 1 momentin mukaan tasavallan presidentti valitaan välittömällä vaalilla syntyperäisistä Suomen kansalaisista kuuden vuoden toimikaudeksi. Perustuslain 60 §:n 1 momentin mukaan valtioneuvostoon kuuluvien ministerien on oltava rehellisiksi ja taitaviksi tunnettuja Suomen kansalaisia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomen kansalaisuuden saaminen hakemuksen perusteella tuo siten useita äänioikeuksia ja kelpoisuuksia. Ainoastaan presidentin vaaleissa vaalikelpoisia ovat yksinomaan syntyperäiset Suomen kansalaiset. Perustuslain 127 §:n mukainen maanpuolustusvelvollisuus ja perustuslain 9 §:n 3 momentin mukainen suoja maasta karkottamiselta koskevat kaikkia Suomen kansalaisia. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on arvioinut, että kansalaisuus muodostaa edelleen merkittävän siteen yksilön ja valtion välille ja on siten jokaisen yksilön kannalta sekä oikeudellisesti että tosiasiallisesti tärkeä instituutio (PeVM 8/2010 vp, s. 2/I).&nbsp;\u003C/p>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuuden saaminen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Perustuslain 5 §:n 1 momentin mukaan Suomen kansalaisuus saadaan syntymän ja vanhempien kansalaisuuden perusteella sen mukaan kuin lailla tarkemmin säädetään. Kansalaisuus voidaan myöntää laissa säädetyin edellytyksin myös ilmoituksen tai hakemuksen perusteella. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Perustuslakiuudistuksen esitöiden (s. 77/II) mukaan kansalaisuuden myöntämisen edellytykset jäävät lainsäätäjän ratkaistaviksi. Perustuslakivaliokunta on pitänyt lausunnossaan (PeVL 16/2024 vp, s. 3) selvänä, että perustuslaki jättää lainsäätäjälle merkittävästi harkintavaltaa sen suhteen, millä edellytyksin Suomen kansalaisuus myönnetään hakemuksen perusteella. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuslakia koskevassa mietinnössään (PeVM 8/2002 vp, s. 4/II) perustuslakivaliokunta on kiinnittänyt huomiota siihen, että kansalaisuuden saamisen sääntelyä koskee perustuslain 5 §:n johdosta lailla säätämisen vaatimus. Sääntelyn liiallinen harkinnanvaraisuus ei ole tämän kanssa sopusoinnussa, vaan päätöksenteon on oltava kaikin osin lain säännöksiin sidottua. Perustuslakivaliokunta on lisäksi kiinnittänyt lausunnossaan (PeVL 16/2024 vp, s. 4) huomiota siihen, että valtioneuvoston tulisi pyrkiä kuvaamaan peräkkäisten muutosten muodostamaa kokonaisuutta ja ehdotusten mahdollista yhteisvaikutusta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että hakemuksen perusteella myönnettävän kansalaisuuden edellytyksiin lisättäisiin uusi yhteiskuntatietoedellytys. Uudesta kansalaistamisen edellytyksestä säädettäisiin laissa. Jotta Suomen kansalaisuus voitaisiin myöntää hakemuksen perusteella, hakijan pitäisi osoittaa hankkineensa perustiedot suomalaisen yhteiskunnan toiminnasta ja yksilön oikeuksista ja velvollisuuksista. Tällaisen uuden edellytyksen lisääminen sisältyisi lainsäätäjän harkintavaltaan. Yhteiskuntatietoedellytys täydentäisi kansalaistamiselle voimassa olevassa laissa säädettyjä edellytyksiä ja ilmentäisi osaltaan ajatusta maan keskeisten olosuhteiden tuntemisesta ennen kansalaisuuden saamista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tarkoituksena on se, että kansalaisuuden saamista koskeva päätöksenteko olisi myös jatkossa kaikin osin lain säännöksiin sidottua perustuslain 5 §:ssä tarkoitetulla tavalla. Laissa säädettäisiin tavoista, joilla uuden yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa, edellytyksen soveltamisalasta ja sellaisista perusteista, joilla edellytyksestä voitaisiin poiketa. Kansalaisuuden myöntämisestä päätettäisiin näiden säännösten perusteella. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ehdotettavat muutokset liittyvät 1.10.2024 voimaan tulleisiin asumisaikaedellytyksen muutoksiin sekä 17.12.2025 voimaan tulleisiin muihin kansalaistamisen edellytysten muutoksiin (mm. nuhteettomuus ja toimeentulo). Nämä jo tehdyt muutokset ja ehdotettava uusi yhteiskuntatietoedellytys ovat osa samaa kokonaisuutta, jolla on vaikutusta kansalaisuutta hakeviin henkilöihin. Edellä esityksen vaikutuksia arvioitaessa on pyritty kuvamaan tässä esityksessä ehdotettavien ja aiempien muutosten yhteisvaikutusta. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhdenvertaisuutta koskevat perustuslain säännökset\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Perustuslakiuudistuksen esitöiden (s. 77/II) mukaan on selvää, ettei kansalaisuuden myöntämiselle saa asettaa sellaisia ehtoja, jotka ovat ristiriidassa perus- ja ihmisoikeuksien kanssa tai jotka ovat muutoin mielivaltaisia. Siten kansalaisuuden myöntämiselle ei saisi asettaa esimerkiksi sellaisia edellytyksiä, joita olisi pidettävä 6 §:n 2 momentin kieltämänä syrjintänä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 6 §:n 1 momentin mukaan ihmiset ovat yhdenvertaisia lain edessä. Pykälän 2 momentin mukaan ketään ei saa ilman hyväksyttävää perustetta asettaa eri asemaan sukupuolen, iän, alkuperän, kielen, uskonnon, vakaumuksen, mielipiteen, terveydentilan, vammaisuuden tai muun henkilöön liittyvän syyn perusteella. Lapsia on 3 momentin mukaan kohdeltava tasa-arvoisesti yksilöinä, ja heidän tulee saada vaikuttaa itseään koskeviin asioihin kehitystään vastaavasti. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslain 6 §:n 1 momentissa olevaan yleiseen yhdenvertaisuuslausekkeeseen sisältyy mielivallan kielto ja vaatimus samanlaisesta kohtelusta samanlaisissa tapauksissa (HE 309/1993 vp, s. 42). Lausekkeella ei edellytetä kaikkien ihmisten kaikissa suhteissa samanlaista kohtelua, elleivät asiaan vaikuttavat olosuhteet ole samanlaisia. Erottelut eivät saa olla mielivaltaisia eivätkä ne saa muodostua kohtuuttomiksi (mm. PeVL 68/2022 vp, s. 3, PeVM 11/2009 vp, s. 2). Ne on myös pystyttävä perustelemaan perusoikeusjärjestelmän kannalta hyväksyttävällä tavalla (mm. HE 309/1993 vp, s. 44, PeVL 54/2022 vp, s. 3). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Perustuslakivaliokunta on johtanut perusoikeusjärjestelmän kokonaisuudesta joitakin yleisiä perusoikeuksien rajoittamista koskevia vaatimuksia (PeVM 25/1994 vp, s. 5). Näitä ovat vaatimukset lailla säätämisestä, lain täsmällisyydestä ja tarkkarajaisuudesta, rajoituksen hyväksyttävyydestä, rajoituksen suhteellisuudesta, perusoikeuden ydinalueen koskemattomuudesta, oikeusturvajärjestelyjen riittävyydestä ja ihmisoikeusvelvoitteiden noudattamisesta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaistamiselle uutta yhteiskuntatietoedellytystä sekä siihen liittyvän uuden kansalaisuuskokeen ottamista käyttöön. Suomalaista yhteiskuntaa koskevien perustietojen edellyttäminen kansalaisuuden saamista varten ei olisi mielivaltaista, vaan tällaista edellytystä kansalaisuuden saamiselle voidaan pitää lähtökohdiltaan hyväksyttävänä ja kohtuullisena. Yhteiskuntaa koskevien tietojen osoittaminen kansalaisuuskokeella on myös muissa maissa varsin yleinen vaatimus. Kansalaisuuskokeella testattaisiin ehdotuksen mukaan perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Kokeen kysymykset koskisivat sellaisia aiheita kuin Suomen keskeistä lainsäädäntöä, perus- ja ihmisoikeuksia, yhdenvertaisuutta, sukupuolten tasa-arvoa, Suomen historiaa ja kulttuuria. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoedellytyksen myötä kansalaistamiselle lisättäisiin uusi kotoutumiseen liittyvä edellytys. Kansalaisuuden saamiselle voidaan mm. eurooppalaisen kansalaisuusyleissopimuksen valossa asettaa asumisajan lisäksi tämänkaltainen edellytys, jonka taustalla on ajatus asuinmaahan kotoutumisesta.\u003Cspan class=\"AlaviiteTeksti\"> Explanatory Report to the European Convention on Nationality, s. 6.\u003C/span> Vaatimus yhteiskuntaa koskevien keskeisten tietojen osoittamisesta kytkeytyisi kotoutumiseen. Kyseessä olisi tästä näkökulmasta hyväksyttävä edellytys kansalaisuuden saamiselle. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Ehdotettavan uuden yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa ylioppilas- tai korkeakoulututkinnolla tai uudella kansalaisuuskokeella, jossa testattaisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Tällaisia aiheita sisältyy myös kotoutumislain mukaiseen yhteiskuntaorientaatioon, jota varten laadittua oppimateriaalia\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/oppimateriaali\u003C/a>\u003C/span>\u003C/span>\u003C/span> kansalaisuuskokeessa hyödynnettäisiin. Kokeen kysymykset perustuisivat yhteiskuntaorientaation oppimateriaalin pohjalta laaditun oppimateriaalin keskeisiin tietoihin. Kansalaisuuskokeen oppimateriaali olisi yleisesti saatavilla, jolloin se olisi käytettävissä kansalaisuuskokeeseen valmistautumiseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe olisi siten tietopohjainen koe, jonka pystyisi suorittamaan opiskeltuaan yleisesti saatavilla olevan oppimateriaalin keskeisiä tietoja. Kokeen kysymykset eivät koskisi hyvin yksityiskohtaisia tietoja, vaan kokeella testattaisiin ehdotuksen mukaan perustietoja yhteiskunnan toimintaan liittyvistä oppimateriaalissa käsittelyistä aiheista. Myös kokeessa ja oppimateriaalissa käytettävän suomen tai ruotsin kielen taso vastaisi kansalaisuutta varten vaadittavaa kielitaidon tasoa, joka on B1 eurooppalaisen kielitaidon arvioinnin viitekehyksen asteikolla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kokeen kysymykset eivät ehdotetuissa puitteissa muodostuisi mielivaltaisiksi. Kokeen toteutuksessa huomioitaisiin kansalaisuuteen edellytettävä kielitaidon taso. Tietoon perustuvalla kokeella ei asetettaisi ketään eri asemaan perustuslain 6 §:n 2 momentin mukaisen henkilöön liittyvän syyn, kuten vakaumuksen tai mielipiteen perusteella. Kansalaisuuden saamista varten vaadittaisiin jatkossa tietyn tasoisten tietojen osoittamista tietyn tasoisella suomen tai ruotsin kielellä, mutta vaatimus ei ehdotetuissa puitteissa muodostuisi kohtuuttomaksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä on huomioitu myös terveydentilan ja vammaisuuden vaikutus kokeen suorittamiseen. Maahanmuuttovirasto voisi kokeeseen ilmoittautuneen pyynnöstä myöntää koetilaisuuteen erityisjärjestelyjä, joiden avulla mm. vammaiset henkilöt pystyisivät suorittamaan kansalaisuuskokeen yhdenvertaisesti muiden kanssa. Kansalaisuuskoe suoritettaisiin ennen kansalaisuuden hakemista. Se olisi siten kansalaisuushakemusta edeltävä vaihe. Lisäksi terveydentila ja vammaisuus huomioitaisiin kansalaisuushakemuksen yhteydessä siten, että yhteiskuntatietoedellytyksestä voitaisiin ehdotuksen mukaan poiketa, jos hakijan terveydentila tai vammaisuus pitkäaikaisesti estäisi häntä täyttämästä edellytystä. Yhteiskuntatietoedellytyksestä poikkeaminen voisi tulla kyseeseen silloin, kun kansalaisuuskokeen suorittamista ei esimerkiksi vammaisuuden vuoksi voitaisi kohtuudella edellyttää erityisjärjestelyjenkään avulla. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslaissa säädetään sekä alemmasta kielitaitovaatimuksesta luku- ja kirjoitustaidottomille (18 b § 2 mom.) että siitä, miten luku- ja kirjoitustaidottomuus osoitetaan (18 b § 3 mom.). Kansalaisuuslaki edellyttää luku- ja kirjoitustaidottomilta suomen tai ruotsin kielen ymmärtämisen ja puhumisen alkeiden hallitsemista tai säännöllistä osallistumista suomen tai ruotsin kielen opintoihin. Luku- ja kirjoitustaidottomaksi osoitetulta henkilöltä ei siten edellytetä tyydyttävää suomen tai ruotsin kielen taitoa, jota kokeessa ja oppimateriaalissa käytettävä suomen tai ruotsin kielen taso vastaisi. Keskeisenä kysymyksenä on sen vuoksi, miten luku- ja kirjoitustaidottomia koskeva kielitaitovaatimus olisi sovitettavissa yhteen uuden yhteiskuntatietoedellytyksen kanssa sekä se, miten luku- ja kirjoitustaidottomien henkilöiden yhdenvertaiset mahdollisuudet osoittaa uuden edellytyksen täyttäminen tulisivat huomioiduksi. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslain 18 b §:n 2 ja 3 momentissa tarkoitettu luku- ja kirjoitustaidoton voisi suorittaa kansalaisuuskokeen erityisjärjestelyin suullisesti. Tällöin huomioitaisiin se, että tietyissä rajatuissa tilanteissa kokeen suorittamiseksi riittäisi puheen ymmärtämisen taito. Myös kokeessa käytettävä suomen tai ruotsin kieli mukautettaisiin yleiskieltä ymmärrettävämpään muotoon. Tällaisilla erityisjärjestelyillä osittain huomioitaisiin luku- ja kirjoitustaidottomille henkilöille kansalaisuuslaissa säädetty alempi kielitaitovaatimus sekä se, ettei heiltä edellytetä kielitaidon osoittamiseksi kirjallista suomen tai ruotsin kielen taitoa. Saavutettavuuden vuoksi kansalaisuuskokeen oppimateriaali olisi saatavissa myös kuunneltavassa muodossa. Tällä tavoin todistetusti luku- ja kirjoitustaidottomalta henkilöltä ei vaadittaisi kansalaisuuskokeeseen valmistautumiseen kirjallista kielitaitoa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Edellä esitetystä huolimatta kokeen suorittamiseen vaadittavan kielitaidon taso olisi kuitenkin jonkin verran korkeampi kuin se suullisen taidon taso, jota todistetusti luku- ja kirjoitustaidottomalta henkilöltä edellytetään kansalaisuuden saamista varten kielitaitoedellytyksen näkökulmasta. Tyydyttävää kielitaitoa vaativaa kansalaisuuskoetta ei käytännössä pystyisi suorittamaan pelkällä puheen ymmärtämisen alkeistaidolla. Siten kokeen suorittaminen tosiasiallisesti edellyttäisi korkeampaa suullisen kielitaidon tasoa kuin luku- ja kirjoitustaidottomilta kielitaitoedellytyksen näkökulmasta kansalaisuuslaissa vaaditaan. Luku- ja kirjoitustaidottomana Suomeen saapuneiden joukossa voi olla myös sellaisia henkilöitä, joiden suullinen kielitaito olisi käytännössä riittävällä tasolla kansalaisuuskokeen suorittamiseen suullisesti. Tällaisessa tapauksessa luku- ja kirjoitustaidottoman henkilön suullinen kielitaito ylittäisi sen kielitaidon tason, jota häneltä lain mukaan vaaditaan kansalaisuuden saamista varten ja hän olisi tosiasiassa siirtynyt edistyneemmän kielenkäyttäjän tasolle. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksessä ehdotettava uusi yhteiskuntatietoa koskeva edellytys olisi kielitaitoedellytyksestä erillinen, jolloin osoitusta sen täyttämisestä edellytettäisiin kielitaidon lisäksi. Toisaalta kansalaisuuslain kielitaidon osoittamista tai kielitaitoedellytyksestä poikkeamista koskevaa sääntelyä ei muutettaisi. Luku- ja kirjoitustaidoton henkilö voisi jatkossakin osoittaa kielitaidon lain 18 b §:n 2 ja 3 momentissa säädetyn mukaisesti. Siten mainittu sääntely säilyisi edelleenkin merkityksellisenä kielitaitoedellytyksen ja kielitaidon osoittamisen näkökulmasta, vaikka uuden yhteiskuntatietoedellytyksen täyttäminen käytännössä edellyttäisi jonkin verran korkeampaa suullisen kielitaidon tasoa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen suorittamiseksi käytännössä edellytettävän korkeamman suullisen kielitaidon kohtuullisuutta arvioitaessa on ensinnäkin kiinnitettävä huomiota siihen, että kahdeksan vuoden asumisajan aikana on mahdollista suorittaa sellaisia koulutuksia, joiden tarkoituksena on yhteiskuntaosaamisen, luku- ja kirjoitustaidon ja kielitaidon kerryttäminen. Esimerkiksi ainakin osa kansalaisuuslain 18 b §:n 2 ja 3 momentissa tarkoitetuista luku- ja kirjoitustaidottomista olisi suorittanut kotoutumislain 25 §:ssä tarkoitetun yhteiskuntaorientaation tai osallistunut muuhun sellaiseen koulutukseen, kuten kotoutumis- tai lukutaitokoulutukseen tai aikuisten perusopetukseen, jossa olisi käsitelty suomalaista yhteiskuntaa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kotoutumispalveluiden uudistamisen (TEM099:00/2024) yhtenä tavoitteena olisi jatkossa yhä selkeämmin muun muassa suomen tai ruotsin kielen oppiminen. Kotoutumispalveluiden uudistamiseksi suunniteltujen muutosten sekä nykytilassa jo käytössä olevien kotoutumista edistävien toimien voidaan olettaa edesauttavan osaltaan luku- ja kirjoitustaidottomien maahanmuuttajien mahdollisuutta suorittaa sellainen koe, joka edellyttäisi ainoastaan suullisen kielitaidon hallitsemista. Suunnitellut muutokset voivat omalta osaltaan vähentää myös niiden henkilöiden määrää, jotka kansalaisuutta hakies
