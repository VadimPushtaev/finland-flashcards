vutettavuusseloste",contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/tietoa-sivustosta/saavutettavuusseloste/",expanded:{contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/tietoa-sivustosta/saavutettavuusseloste/",expanded:null},name:"Saavutettavuusseloste",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"saavutettavuusseloste",url:"/tietoa-sivustosta/saavutettavuusseloste/",changed:null,created:null,startPublish:"2026-03-19T07:20:56Z",stopPublish:null,saved:null,status:null,teaserTitle:"Saavutettavuusseloste",teaserText:"Eduskunta haluaa taata kaikille yhdenvertaisen mahdollisuuden asioida sähköisissä palveluissaan. Verkkosivustoa koskee laki digitaalisten palvelujen tarjoamisesta, jonka mukaan julkisten verkkopalvelujen tulee olla saavutettavia. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Tietosuojaselosteet",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/tietoa-sivustosta/tietosuojaselosteet/",expanded:{contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/tietoa-sivustosta/tietosuojaselosteet/",expanded:null},name:"Tietosuojaselosteet",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"tietosuojaselosteet",url:"/tietoa-sivustosta/tietosuojaselosteet/",changed:null,created:null,startPublish:"2025-04-03T11:57:48Z",stopPublish:null,saved:null,status:null,teaserTitle:"Tietosuojaselosteet",teaserText:"Eduskunnan tietosuojaselosteissa kerrotaan muun muassa henkilötietojen käsittelyn tarkoituksesta, mihin tietoja säännönmukaisesti luovutetaan, miten kauan henkilötietoja säilytetään.",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/tietoa-sivustosta/sivukartta/",title:null,target:null,text:"Sivukartta",contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/tietoa-sivustosta/sivukartta/",expanded:{contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/tietoa-sivustosta/sivukartta/",expanded:null},name:"Sivukartta",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sivukartta",url:"/tietoa-sivustosta/sivukartta/",changed:null,created:null,startPublish:"2026-03-19T11:01:19Z",stopPublish:null,saved:null,status:null,teaserTitle:"Sivukartta",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"",contentLink:"18"},{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"",contentLink:"1796"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1659"},{children:[],relatedContent:[],name:"Eduskunnan EU-sihteeristö",teaserText:"EU-sihteeristö tukee kansanedustajien yhteydenpitoa suomalaisiin ja muihin Euroopan parlamentin jäseniin sekä muihin keskeisiin EU-toimijoihin.",url:"/asiat-ja-aanestykset/eu-asiat/eduskunnan-eu-sihteeristo/",selected:false,targetFrame:"",contentLink:"1415"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. \nVanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/asiat-ja-aanestykset/",selected:false,targetFrame:"",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. ",url:"/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"",contentLink:"64"}],relatedContent:[{children:[],relatedCont 296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat\">Valtiopäiväasiat\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/HE%2054%2F2026%20vp\">HE 54/2026 vp\u003C/a>\u003C/li>\n     \u003Cli class=\"[&amp;_svg]:size-6\">\n      \u003Csvg aria-hidden=\"true\" viewBox=\"0 -960 960 960\" width=\"24px\" height=\"24px\">\n       \u003Cpath d=\"m517.85-480-184-184L376-706.15 602.15-480 376-253.85 333.85-296l184-184Z\" />\n      \u003C/svg>\n     \u003C/li>\n     \u003Cli class=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Asiakirjat\u003C/span>\u003C/li>\n    \u003C/ol>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n   \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">4.5.2026 | 19:12\u003C/span>\n  \u003C/div>\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;HE&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">54\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle laiksi kansalaisuuslain muuttamisesta ja siihen liittyviksi laeiksi\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv id=\"SisaltoKuvaus\" class=\"SisaltoKuvaus\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">ESITYKSEN PÄÄASIALLINEN SISÄLTÖ\u003C/h2>\n   \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan muutettaviksi kansalaisuuslakia, Maahanmuuttovirastosta annettua lakia sekä henkilötietojen käsittelystä maahanmuuttohallinnossa annettua lakia.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Esityksen tavoitteena on uudistaa kansalaisuuslakia pääministeri Petteri Orpon hallituksen hallitusohjelman mukaisesti tiukentamalla kansalaistamisen edellytyksiä. Tarkoituksena on vahvistaa sitä lähtökohtaa, että kansalaisuuden saaminen edellyttää osoitusta onnistuneesta kotoutumisesta yhteiskuntaan. Ehdotuksilla pyritään edistämään Suomen kansalaisuudesta kiinnostuneiden ulkomaalaisten perehtymistä sellaisiin keskeisiin yhteiskunnan toimintatapoihin ja perusperiaatteisiin, jotka tukevat aktiivista yhteiskuntaan osallistumista ja ovat tarpeen yhteiskunnassa toimimista varten. &nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Esityksessä ehdotetaan uutta kansalaistamisen edellytystä, jonka myötä hakijan olisi osoitettava riittävä yhteiskuntaosaamisen taso Suomen kansalaisuuden saamiseksi. Lähtökohtaisesti edellytyksen täyttyminen osoitettaisiin suorittamalla hyväksytysti kansalaisuuskoe, jossa mitattaisiin tietoja suomalaisen yhteiskunnan toiminnasta ja perusperiaatteista sekä yksilön oikeuksista ja velvollisuuksista. Edellytyksen täyttymisen voisi myös tietyssä tilanteessa osoittaa Suomessa suoritetuilla opinnoilla.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Kansalaisuuskoetta varten kehitettäisiin kokonaan uusi koejärjestelmä, jonka toteutus edellyttäisi uutta lainsäädäntöä. Maahanmuuttovirasto vastaisi kansalaisuuskokeeseen liittyvistä viranomaistehtävistä. Kyse olisi kansalaisuuskoejärjestelmän yleisestä hallinnointivastuusta, johon kuuluisi kansalaisuuskokeen valvonnan ja kehittämisen ohella kansalaisuuskokeen laatimista ja järjestämistä koskevien sopimusten tekeminen esityksessä ehdotettavat edellytykset täyttävien toimijoiden kanssa.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin lisättäisiin uusi luku, jossa säädettäisiin tarkemmin uudesta kansalaisuuskokeesta ja sen toteutuksesta, kuten kansalaisuuskokeen sisällöstä, laatimisesta ja järjestämisestä sekä kokeen laatijan ja järjestäjän tehtävistä. &nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Ehdotetut lait on tarkoitettu tulemaan voimaan vuoden 2027 alussa. &nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv class=\"PerusteluOsaPerustelut\" id=\"PerusteluOsaPerustelut\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">PERUSTELUT\u003C/h2>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Asian tausta ja valmistelu\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tausta\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Pääministeri Petteri Orpon hallituksen ohjelmassa ”Vahva ja välittävä Suomi, 20.6.2023” on useita kirjauksia kansalaistamisen edellytysten muuttamiseksi (10; Turvallinen ja kriisinkestävä oikeusvaltio; 10.3; Maahanmuutto- ja kotoutumispolitiikka, s. 202–203). Hallitusohjelman mukaan Suomen kansalaisuus ei ole automaatio, vaan sen edellytys on onnistunut kotoutuminen. Ohjelman mukaan kansalaisuuslaki (359/2003) uudistetaan tiukentamalla kansalaistamisen edellytyksiä. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslakia koskevat hallitusohjelmakirjaukset toteutetaan vaiheittain kolmessa erillisessä sisäministeriön hankkeessa (SM034:00/2023, SM055:00/2023 ja SM056:00/2023). Ensimmäisessä vaiheessa toteutettiin hallitusohjelman asumisaikaedellytystä koskevat muutokset kansalaisuuslakiin (HE 27/2024 vp, PeVL 16/2024 vp, HaVM 14/2024 vp). Eduskunta hyväksyi hallituksen esitykseen sisältyvän lakiehdotuksen 1.7.2024 (EV 65/2024 vp). Laki tuli voimaan 1.10.2024. Toisessa vaiheessa toteutettiin puolestaan ne hallitusohjelman mukaiset muutokset kansalaisuuslakiin, jotka koskivat henkilöllisyyttä, kansallista turvallisuutta, nuhteettomuutta ja toimeentuloedellytystä sekä kansalaisuuden menettämistä (HE 19/2025 vp, PeVL 25/2025 vp, HaVM 19/2025 vp). Eduskunta hyväksyi muutokset kansalaisuuslakiin 15.10.2025 (EV 96/2025 vp). Laki tuli voimaan 17.12.2025. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tämä kansalaisuuslain muutosten kolmatta vaihetta koskeva esitys sisältää ehdotukset kansalaisuuskoetta koskevan hallitusohjelmakirjauksen toteuttamiseksi. Hallitusohjelman mukaan kansalaistamisen edellytykseksi asetetaan kansalaisuuskokeen hyväksytty suorittaminen.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valmistelu\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Päätös hankkeiden asettamisesta kansalaisuuslain uudistamiseksi tehtiin 16.10.2023.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://intermin.fi/-/kansalaisuuslain-uudistaminen-kaynnistyy-sisaministeriossa\">https://intermin.fi/-/kansalaisuuslain-uudistaminen-kaynnistyy-sisaministeriossa\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kansalaisuuslain muutosten kolmatta vaihetta koskeva hanke asetettiin ajalle 16.10.2023–30.6.2025. Hankkeen toimikautta päätettiin 28.5.2025 jatkaa 31.3.2026 asti. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Osana kolmannen vaiheen hanketta sisäministeriö asetti 29.11.2023 poikkihallinnollisen työryhmän selvittämään kansalaisuuskokeen käyttöönottoa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/d3645e65-367e-408a-b895-084517e18f35/ASETTAMISPAATOS_20231129110128.PDF\">https://api.hankeikkuna.fi/asiakirjat/1e6ba95e-e303-4947-858a-626d1b18235f/d3645e65-367e-408a-b895-084517e18f35/ASETTAMISPAATOS_20231129110128.PDF\u003C/a>\u003C/span>\u003C/span>\u003C/span> Työryhmän toimikausi oli 29.11.2023–31.5.2024. Sisäministeriön lisäksi työryhmässä oli edustaja työ- ja elinkeinoministeriöstä, opetus- ja kulttuuriministeriöstä, Maahanmuuttovirastosta, Poliisihallituksesta, Opetushallituksesta, Uudenmaan elinkeino-, liikenne- ja ympäristökeskuksesta, Kuntaliitosta ja C6-kaupunkien verkostosta. Työryhmä kuuli lisäksi ulkopuolisia asiantuntijoita.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Työryhmän tehtävänä oli laatia selvitys siitä, miten kansalaistamista varten edellytettävä kansalaisuuskoe voitaisiin toteuttaa Suomessa. Työryhmälle annettiin tehtäväksi kartoittaa erilaisia vaihtoehtoja siihen, mikä taho hallinnoisi kansalaisuuskoetta ja millainen kansalaisuuskoe otettaisiin käyttöön. Lisäksi työryhmän tehtävänä oli selvittää kansalaisuuskokeen käytännön toteuttamiseen ja järjestelyihin liittyviä ja vaikuttavia toimia sekä sitä, miten kansalaisuuskoe on toteutettu Suomen keskeisissä vertailumaissa. Työryhmän kuului myös arvioida, mikä olisi kansalaisuuskokeen suhde kansalaistamisen edellytyksenä olevaan kielitaitovaatimukseen. Työryhmän selvitys julkaistiin 19.2.2025.\u003Cspan class=\"AlaviiteKooste\"> Sisäministeriön julkaisuja 2025:5 ()\u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"http://urn.fi/URN:ISBN:978-952-324-974-5\">http://urn.fi/URN:ISBN:978-952-324-974-5\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esitys on valmisteltu sisäministeriön maahanmuutto-osastolla virkatyönä. Valmistelussa on hyödynnetty edellä mainittua poikkihallinnollisen työryhmän laatimaa selvitystä. Valmistelu on toteutettu tiiviissä yhteistyössä Maahanmuuttoviraston kanssa. Valmistelun aikana on kuultu myös opetus- ja kulttuuriministeriötä, työ- ja elinkeinoministeriötä ja Opetushallitusta sekä jatkovalmistelussa lisäksi oikeusministeriötä.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esitysluonnos lähetettiin lausuntokierrokselle ajalla 19.12.2025–6.2.2026. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lausuntoa pyydettiin seuraavilta tahoilta: oikeusministeriö, valtiovarainministeriö, opetus- ja kulttuuriministeriö, työ- ja elinkeinoministeriö, sosiaali- ja terveysministeriö, valtioneuvoston oikeuskansleri, eduskunnan oikeusasiamies, yhdenvertaisuusvaltuutetun toimisto, lapsiasiavaltuutetun toimisto, tietosuojavaltuutetun toimisto, Ahvenanmaan maakunnan hallitus, Maahanmuuttovirasto, Opetushallitus, Poliisihallitus, Uudenmaan elinkeino-, liikenne- ja ympäristökeskus, elinkeino-, liikenne- ja ympäristökeskusten kehittämis- ja hallintokeskus KEHA-keskus, Tuomioistuinvirasto, korkein hallinto-oikeus, Helsingin, Hämeenlinnan, Itä-Suomen, Pohjois-Suomen, Turun ja Vaasan hallinto-oikeudet,&nbsp;Kuntaliitto, C6-kaupunkien verkosto, Helsingin, Itä-Suomen, Jyväskylän, Lapin, Tampereen ja Turun yliopistot, Åbo Akademi, Suomen yliopistojen rehtorineuvosto UNIFI ry, Ammattikorkeakoulujen rehtorineuvosto Arene ry, Amnesty International Suomen osasto, Elinkeinoelämän keskusliitto EK, Etnisten suhteiden neuvottelukunta Etno, Familia ry, Ihmisoikeusliitto, Kuurojen Liitto ry, Moniheli ry, Näkövammaisten liitto ry, Pakolaisneuvonta ry, Suomen Asianajajaliitto, Suomi-Seura ry, UNHCR Northern Europe ja Vammaisten maahanmuuttajien tukikeskus Hilma. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lainsäädännön arviointineuvosto on antanut esitysluonnoksesta lausunnon 26.3.2026.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Lausuntopalautteesta kerrotaan tarkemmin esityksen jaksossa 6. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksen valmisteluasiakirjat ovat nähtävillä sisäministeriön verkkosivuilla osoitteessa \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://intermin.fi/hankkeet/hankesivu?tunnus=SM056:00/2023\">https://intermin.fi/hankkeet/hankesivu?tunnus=SM056:00/2023\u003C/a>\u003C/span>\u003C/span>. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Nykytila ja sen arviointi\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yleistä\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Suomen kansalaisuudesta säädetään perustuslaissa ja tarkemmin kansalaisuuslaissa. Kansalaisuuslaissa säädetään niistä edellytyksistä, joiden nojalla henkilö saa, säilyttää tai menettää Suomen kansalaisuuden sekä menettelyistä tällaista asiaa käsiteltäessä. Kansalaisuuslain tarkoituksena on säännellä Suomen kansalaisuuden saaminen ja menettäminen ottaen huomioon sekä yksityishenkilön että valtion etu, estää ja vähentää kansalaisuudettomuutta sekä toteuttaa ja edistää hyvän hallinnon ja oikeusturvan periaatteita kansalaisuuteen liittyvien asioiden käsittelyssä ja päätöksenteossa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomen kansalaisuuden voi saada syntymän ja vanhempien kansalaisuuden perusteella sekä hakemuksesta tai ilmoituksesta. Kansalaistamisella tarkoitetaan vakiintuneesti hakemuksella haettavaa Suomen kansalaisuutta. Kyse on siitä, miten Suomessa pysyvästi asuva ulkomaan kansalainen voi saada hakemuksesta Suomen kansalaisuuden ja minkälaisia edellytyksiä hänen tulee täyttää. Hakemusmenettely on mahdollinen kaikille Suomessa asuville ulkomaalaisille. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuden voidaan yleisesti katsoa määrittävän kehikon, joka auttaa hahmottamaan yksilön yhteyttä yhteiskuntaan muun muassa oikeuksien, velvollisuuksien, roolien ja vastuiden kautta, minkä lisäksi kansalaisuus voi yksilön näkökulmasta vahvistaa yhteenkuuluvuuden tunnetta yhteiskuntaan. Kansalaisuuslaissa kansalaisuus on määritelty yksilön ja valtion väliseksi lainsäädännölliseksi siteeksi, joka määrittää yksilön aseman valtiossa ja jolla määritetään yksilön ja valtion välisiä keskeisiä oikeuksia ja velvollisuuksia. Yleisesti kansalaisuuteen liitetyt oikeudet ja velvollisuudet voivat perustua valtion kansalliseen lainsäädäntöön ja siten vaihdella valtioittain, tai esimerkiksi Euroopan unionin oikeuteen ja olla siten kaikille unionin valtioiden kansalaisille yhteisiä. Kansalaisuuden hakeminen perustuu aina vapaaehtoisuuteen ja yksilön omaan arvioon sen valtion kansalaisuuden merkityksestä, jossa hän asuu. Kansalaistamisen voidaan katsoa osoittavan valtion taholta luottamusta yksilöön ja siihen, että hänellä on riittävät valmiudet toimia itsenäisesti ja täysipainoisesti yhteiskunnassa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomen kansalaisuuden oikeudellinen merkitys on vähentynyt verrattaessa yksilön oikeuksia valtion omien kansalaisten ja muiden välillä, sillä perusoikeudet kuuluvat lähtökohtaisesti kaikille Suomessa oleville vuonna 1995 voimaan tulleen perusoikeusuudistuksen myötä. Kansalaisuus muodostaa kuitenkin edelleen merkittävän siteen yksilön ja valtion välillä, ja yksilön näkökulmasta kansalaisuutta voidaan pitää sekä oikeudellisesti että tosiasiallisesti tärkeänä suhteena. Kansalaisuuteen liittyy merkittäviä oikeuksia ja velvollisuuksia, ja se määrittelee edelleen esimerkiksi osaa vaali- ja osallistumisoikeuksista. Kansalaisuuden myötä yksilö hyväksytään yhteiskunnan täysivaltaiseksi jäseneksi, jolloin hän voi osallistua entistä täysipainoisemmin vastaanottavan valtion poliittiseen, yhteiskunnalliseen ja taloudelliseen toimintaan.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuussääntelyssä tulee yksilön ohella huomioida myös valtion etu, jolloin valtio voi asettaa kansalaisuuden saamiselle sellaisia edellytyksiä, joita se pitää tarkoituksenmukaisina määrittäessään sen, kenelle kansalaisuus voidaan myöntää. Tällaisina keskeisinä asioina voidaan pitää esimerkiksi pysyvää maassa asumista, yhteiskunnan sääntöjen noudattamista sekä itsenäistä yhteiskuntaan osallistumista esimerkiksi oman toimeentulon hankkimisen ja kielen opiskelun näkökulmasta. Valtion etuna voidaan yhtä lailla pitää sen varmistamista, että henkilöt ovat riittävän tietoisia muun muassa asuinmaansa keskeisimmistä perusperiaatteista sekä maan kansalaisina heille kuuluvista oikeuksista ja velvollisuuksista. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, kansalaisuuden saamiselle voidaan säätää erilaisia edellytyksiä, jotka liittyvät kiinteästi kotoutumiseen. Kansalaisuuden saamista koskevan sääntelyn ja kotoutumisen välistä yhteyttä voidaan lähestyä eri näkökulmista. Kyse on osaltaan muun muassa siitä, kuinka merkittävästi kansalaistamisessa painottuu valtion etu. Kansalaistamis- ja kotoutumispolitiikan suhdetta on käsitelty tarkemmin aiemmassa kansalaisuuslakia koskevassa hallituksen esityksessä (HE 19/2025 vp, s. 6–9). &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Kansalaisuuslakiin tehtävien uudistusten lähtökohtana on, että Suomen kansalaisuuden saaminen edellyttää onnistunutta kotoutumista, jolloin kansalaisuus voidaan myöntää tavoiteltavan kotoutumisprosessin tuloksena. Kansalaisuuden saamiseksi henkilön tulee osoittaa sitoutumista yhteiskuntaan muun muassa hankkimalla sellaisia tietoja ja taitoja, joita yhteiskunnan täysivaltaiselta jäseneltä katsotaan edellytettävän. Tämän esityksen ehdotuksissa painottuu erityisesti suomalaiseen yhteiskuntaan perehtyminen ja keskeisimpien yhteiskunnallisten perusperiaatteiden tuntemus.&nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhteiskuntatieto kansalaistamisen edellytyksenä\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaistamisen edellytykset\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kansalaistamisen eli hakemuksesta myönnettävän kansalaisuuden yleisistä edellytyksistä säädetään kansalaisuuslain 13 §:ssä. Ulkomaalaiselle myönnetään hakemuksesta Suomen kansalaisuus, jos hakemusta ratkaistaessa: 1) hän on täyttänyt 18 vuotta; 2) hänen varsinainen asuntonsa ja kotinsa on ja on ollut Suomessa viimeksi kuluneet kahdeksan vuotta (\u003Cspan class=\"KursiiviTeksti\">asumisaikaedellytys\u003C/span>); 3) hän ei ole syyllistynyt muulla kuin rikesakolla rangaistuun tekoon eikä häntä ole määrätty lähestymiskieltoon (\u003Cspan class=\"KursiiviTeksti\">nuhteettomuusedellytys\u003C/span>); 4) hän ei ole olennaisesti laiminlyönyt elatusvelvollisuuttaan tai julkisoikeudellisia maksuvelvoitteitaan; 5) hänen toimeentulonsa on turvattu (\u003Cspan class=\"KursiiviTeksti\">toimeentuloedellytys\u003C/span>); ja 6) hänellä on suomen tai ruotsin kielen tyydyttävä suullinen ja kirjallinen taito tai näiden sijasta vastaavan tasoinen suomalaisen tai suomenruotsalaisen viittomakielen taito (\u003Cspan class=\"KursiiviTeksti\">kielitaitoedellytys\u003C/span>).&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaistamisen eri edellytysten kautta hakijat osoittavat käytännössä itsenäistä toimintakykyä yhteiskunnassa ja sopeutumista suomalaiseen yhteiskuntaan. Asumisaikavaatimus kuvastaa hakijan pysyvää asettumista Suomeen, ja asumisajan kuluessa henkilöt hankkivat valmiuksia suomalaisessa yhteiskunnassa elämiseen. Kielitaidolla on tärkeä osa kotoutumisessa, ja sen karttuessa mahdollisuudet työllistymiseen, kouluttautumiseen ja muuhun osallistumiseen suomalaisessa yhteiskunnassa helpottuvat ja nopeutuvat. Nuhteettomuus merkitsee sitä, ettei hakijalla ole rikollista toimintaa, joka voisi haitata yhteiskuntaa, ja että hakija noudattaa yhteiskunnan sääntöjä. Toimeentulovaatimuksen tarkoituksena on se, että hakija kykenee taloudellisesti huolehtimaan itsensä elättämisestä ilman huomattavaa turvautumista yhteiskunnan tukiin.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Voimassa olevan kansalaisuuslain mukaisilla kansalaistamisen eri edellytyksillä varmistetaan sitä, että kansalaisuuden saavat henkilöt kykenevät toimimaan vastuullisesti ja itsenäisesti yhteiskunnassa. Kansalaistamisen edellytyksistä puuttuu kuitenkin sellainen edellytys, joka koskisi hakijan tietämystä ja tuntemusta suomalaisesta yhteiskunnasta ja jonka täyttääkseen hänen on pitänyt perehtyä keskeisiin ja perustavanlaatuisiin suomalaista yhteiskuntaa koskeviin tietoihin. Yhteiskunta- tai kansalaistiedolla (civic knowledge) viitataan yleisesti tietämykseen ja ymmärrykseen yhteiskunnallisista asioista sekä oikeuksista ja velvollisuuksista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Pelkästään yhteiskuntatietoa koskevan vaatimuksen täyttämistä ei sellaisenaan voi pitää ainoana kotoutumisen osoituksena esimerkiksi hakijan työllistymisen onnistumisen tai yhteiskunnalliseen toimintaan osallistumisen näkökulmasta. Yhteiskuntatietoedellytyksen avulla voidaan kuitenkin mitata, onko hakija omaksunut yhteiskunnallisesti keskeisiä tietoja ja taitoja, jotka liittyvät kotoutumiseen ja yhteiskunnan eri osa-alueilla toimimiseen. Vaatimus yhteiskuntatiedon osoittamisesta toimii siten keinona osaltaan varmistaa, että kansalaisuutta hakevat henkilöt ovat perehtyneitä ja sitoutuneita yhteiskuntaan ja sen perusarvoihin, lakeihin ja toimintatapoihin. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yksilön näkökulmasta vaatimus yhteiskuntatiedon osoittamisesta voi kannustaa henkilöitä perehtymään yhteiskunnassa toimimisen kannalta keskeisiin tietoihin ja taitoihin, mikä taas tukee osallisuutta yhteiskuntaan. Näin se kannustaa maahanmuuttajia tutustumaan entistä syvällisemmin muun muassa asuinmaansa yhteiskunnallisiin rakenteisiin, lakeihin, yleisiin käytäntöihin sekä maan historiaan, kulttuuriin ja tapoihin. Ymmärrystä kansalaisuuden myötä tulevista oikeuksista ja velvollisuuksista voidaan myös pitää keskeisenä muun muassa kansalaisuuteen liittyvien äänestysoikeuksien käyttämisen näkökulmasta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kuten todettua, kansalaisuuden saamista koskevaan sääntelyyn ei sisälly yhteiskuntatietoa koskevaa edellytystä. Tämän vuoksi lainsäädäntöä on tarpeen tarkastella siitä näkökulmasta, että kansalaistamisen eri edellytysten kautta voitaisiin huomioida hakijan kotoutumista Suomeen nykyistä kattavammin. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Aihetta koskevat selvitykset\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Sisäministeriön selvitys kansalaisuuskokeen käyttöönotosta\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Sisäministeriön puheenjohtaman työryhmän selvityksessä todettiin, että kansalaisuuskokeen tarkoituksena olisi vahvistaa kansalaisuutta hakevan kotoutumista mittaamalla hänen tietämystään yhteiskunnasta, laeista ja sääntöjen noudattamisesta sekä arvoista. Kansalaisuuskoe toimisi selvityksen mukaan johdonmukaisena jatkumona yhteiskuntaorientaatiossa, kotoutumiskoulutuksessa ja muissa maahanmuuttajille tarkoitetuissa koulutusmuodoissa annettavalle yhteiskuntatiedolle. Työryhmä piti keskeisenä sitä, että kansalaisuutta hakeva tietäisi, miten yhteiskunta toimii, mikä on oikeusvaltio ja mitä oikeuksia ja velvollisuuksia Suomessa asuvilla on, ja että henkilö tuntisi yleisellä tasolla keskeisimpien viranomaisten roolit. Työryhmä piti tärkeänä yhteiskunnassa vallitsevien arvojen tuntemista sekä yhteiskunnan turvallisuuteen liittyviä kysymyksiä. Lisäksi työryhmä piti olennaisena sitä, että kansalaisuuden saaja kunnioittaisi perus- ja ihmisoikeuksia sekä sitoutuisi noudattamaan Suomen lainsäädäntöä eikä uhkaisi yhteiskunnan turvallisuutta (s. 44–45).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhtenä tarkastelun kohteena kansalaisuuskoetta koskevassa selvityksessä oli se, mitä kansalaisuuskokeessa tulisi kysyä. Työryhmä esitti näkemyksenään, että kansalaisuuskokeen kysymysten tulisi heijastaa sitä, mitä hakijan halutaan ymmärtävän ja osaavan. Näin kysymyksillä voitaisiin aidommin mitata hakijan osaamista ja ymmärrystä suomalaisesta yhteiskunnasta ja siitä, miten asiat täällä toimivat ja miksi toimitaan tietyllä tavalla. Kansalaisuuskokeen kysymykset koskisivat siten enemmänkin yleissivistykseen kuuluvien asioiden hallintaa kuin hyvin yksityiskohtaista tiedon hallintaa. Työryhmä esitti myös näkemyksenään, että kysymykset voisivat osaltaan ohjata maahanmuuttajia seuraamaan enemmän suomalaista yhteiskuntaa ja sen uutisia. Näin kansalaisuuskoe motivoisi ja kannustaisi perehtymään yhteiskunnan toimintaan (s. 44–45).&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Alla on lueteltuna työryhmän keskeisinä pitämiä aihealueita, joilta kansalaisuuskokeen kysymykset voisivat koostua (s. 45–47):&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">1) Perus- ja ihmisoikeudet. Kotoutuneen tulisi tietää, että kaikki ovat yhteiskunnassa yhdenvertaisia ja ketään ei saa syrjiä iän, sukupuolen, uskonnon tai muun henkilöön liittyvän syyn perusteella. Kotoutuneen tulisi myös tietää suomalaisesta tasa-arvosta ja naisten oikeuksista perheessä, julkisella paikalla ja työelämässä. Yhteiskunta suojelee vähemmistöjä (mukaan lukien sukupuoli- ja seksuaalivähemmistöt) ja heikossa asemassa olevia, muun muassa lapsia. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">2) Yhteiskuntatietous. Kotoutuneen pitäisi olla perehtynyt yhteiskuntaan ja tietää, miten yhteiskunta toimii. Kokeen kysymykset voisivat koskea sellaisia asioita kuin demokratia, poliittinen järjestelmä, vaikutusmahdollisuudet, kansalaisten oikeudet ja velvollisuudet, oikeusvaltio, lainsäädäntö ja tärkeimpien viranomaisten roolit. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">3) Historia ja maantiede. Työryhmä katsoi, että kotoutuneen henkilön tulisi tietää yleisellä tasolla tärkeimpiä seikkoja Suomen historiasta ja maantieteestä. Kysymykset voisivat liittyä yhteiskunnan kehittymiseen, itsenäistymiseen, sotiin, merkittäviin tapahtumiin ja henkilöihin. Aihealueen tunteminen auttaisi ymmärtämään, miten suomalainen yhteiskunta on rakentunut ja kehittynyt nykyisen kaltaiseksi. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">4) Arkielämäntieto. Työryhmä piti tärkeänä, että kansalaisuuden hakijalla olisi perustiedot asumisesta, terveydenhuollosta, työelämästä, verotuksesta, koulutuksesta ja opiskelumahdollisuuksista. Arkielämäntietoihin kuuluisi se, miten toimia sairaustapauksessa sekä vaara- ja hätätilanteessa. Arkielämäntietoihin voisi sisällyttää myös kysymyksiä esimerkiksi liikennekulttuurista. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">5) Tavat ja arvot. Työryhmä piti suomalaisten tapojen ja perinteiden tuntemista yhtenä kotoutumisen osa-alueena. Suomalaisten tapojen ja perinteiden tunteminen rakentaisi ja vahvistaisi yhteenkuuluvuuden tunnetta suomalaiseen yhteiskuntaan ja lisäisi näin myös yleistä turvallisuudentunnetta. Aiheeseen liittyvät kysymykset voisivat koskea tapakulttuuria, juhlapyhiä niihin liittyvine tapoineen ja sitä, miksi tiettyjä juhlia vietetään. Keskeisten perustuslaista ilmenevien suomalaisen yhteiskunnan arvojen tunteminen ja omaksuminen nähtiin tärkeänä vaatimuksena. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">6) Turvallisuus. Aihealue nähtiin työryhmässä tärkeänä, mutta samalla sen todettiin olevan laaja, sillä termiä käytetään useissa asiayhteyksissä esimerkiksi viitattaessa sotilaalliseen turvallisuuteen, yhteiskunnan turvallisuuteen, onnettomuuksien ja vaaratilanteiden ehkäisemiseen, työturvallisuuteen, elintarviketurvallisuuteen, liikenneturvallisuuteen, kyberturvallisuuteen ja kansalliseen turvallisuuteen. Kysymykset, jotka liittyisivät yhteiskunnan turvallisuutta uhkaavien tekijöiden tunnistamiseen, voisivat tulla esille muissa työryhmän tunnistamien aihealueiden kysymyksissä, jotka liittyvät yksilön velvollisuuksiin (mm. maanpuolustusvelvollisuuteen), perus- ja ihmisoikeuksiin, yhdenvertaisuuteen, yhteiskunnan ja oikeusjärjestelmän toimintaan Suomessa sekä tietoisuuteen poliisin toiminnasta.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">7) Digitaidot. Työryhmässä nousi esille myös se, tulisiko yhtenä kansalaisuuskokeen aiheena olla kyky toimia digitalisoituvassa yhteiskunnassa.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kuten edellä on todettu, kansalaisuuskokeen käyttöönottoa selvittävä työryhmä kuuli myös ulkopuolisia asiantuntijoita. Näissä asiantuntijakuulemisessakin tunnistettiin yhteiskuntatietouden merkitys (s. 17–19). Kotoutumisen todettiin vaativan henkilön omaa aktiivisuutta. Luottamuksen ylläpitäminen viranomaistoimintaan nähtiin tärkeänä, vaikka viranomaisprosessit saattaisivat yksilön näkökulmasta ajoittain näyttäytyä etäisinä. Tähän nähden olisi hyvä, että maahanmuuttajalla olisi syvempää tuntemusta yhteiskunnan rakenteista ja viranomaisten toimintaa ohjaavista periaatteista. Myös sitä pidettiin tärkeänä, että maahanmuuttajat saisivat tietoa sellaisista vakavista ongelmista kuin työperäisestä hyväksikäytöstä ja pakkoavioliitoista sekä siitä, minkälaisia näiden ilmiöiden vastaisia toimia Suomessa toteutetaan. Lisäksi kuulemisissa tuotiin esiin muun muassa maanpuolustus- ja asevelvollisuusasioiden tuntemus ja se, että Suomen kansalaisuutta hakevalla olisi hyvä olla perustiedot Suomen maanpuolustus- ja asevelvollisuusjärjestelmästä. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Tutkimustieto\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Eräissä tutkimuksissa on käsitelty kansalaisuuden saamiselle asetettavia edellytyksiä, mukaan lukien yhteiskuntatietoedellytystä ja kansalaisuuskoetta. Tutkimuksen aiheisiin on kuulunut mm. se, mitä vaikutusta kansalaisuudelle asetettavilla vaatimuksilla on ollut kansalaisuuden hakemiseen ja saamiseen. Kansalaisuuden saamiselle asetettavilla edellytyksillä on havaittu olevan yhteyttä kotoutumiseen. Esimerkiksi sellaiset kansalaisuuteen liittyvät seikat kuin kansalaisuuskoe ja käsittelymaksut vaikuttavat halukkuuteen hakea kansalaisuutta.\u003Cspan class=\"AlaviiteTeksti\"> Gathmann &amp; Garbers 2022: Citizenship and integration, IZA Discussion Papers, s. 34. Uusien edellytysten ja kokeiden vaikutuksia kansalaisuuden hakemiseen ja saamiseen käsitellään lisäksi jäljempänä esityksen arvioitujen vaikutusten yhteydessä (4.2). \u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Seuraavaksi tarkastellaan tutkimustietoa erityisesti siitä näkökulmasta, mitä kansalaisuuskokeen käyttöönotossa olisi perusteltua ottaa huomioon. Kansalaisuuskokeita voidaan arvioida sekä niiden toteutustavan että niiden sisällön näkökulmasta. Merkityksellisenä voidaan pitää esimerkiksi sitä, että osallistujilla on kohtuulliset mahdollisuudet valmistautua kokeeseen ja että kokeessa ei ole kyse osallistujien yksilöllisten arvojen ja vakaumusten arvioinnista. Kansalaisuuskokeet voivat muodostua ongelmallisiksi, jos niiden vaatimustaso asetetaan liian korkealle. Kokeeseen valmistautumisen kannalta on keskeistä, että siihen käytettävä oppimateriaali on yleisesti saatavilla esimerkiksi verkkosivuilla ja että oikeat vastaukset kokeen kysymyksiin ilmenevät oppimateriaaliin sisältyvistä tiedoista. Merkitystä on myös sillä, että kokeeseen osallistumisesta aiheutuvien kustannusten taso säilyy kohtuullisena.\u003Cspan class=\"AlaviiteTeksti\"> Bauböck &amp; Joppke (toim.) 2010: How liberal are citizenship tests? EUI Working Papers 2010/41, s. 1. \u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Maan kielen, perusperiaatteiden ja tärkeimpien historian tapahtumien osaamista voidaan yleisesti pitää hyväksyttävinä vaatimuksina kansalaisuutta hakevalle. Kansalaisuuskokeissa voidaan tyypillisesti vaatia sellaisia tietoja, jotka ovat maassa pysyväisluonteisesti asuvien henkilöiden hankittavissa ja opittavissa. Kansalaisuuskoe on toteutettava siten, että kokeella ja sen kysymyksillä ei loukata esimerkiksi kokeeseen osallistuvien mielipiteenvapautta. Tietopohjaisia kansalaisuuskokeita, koskivatpa ne sitten maan historiaa, kulttuuria tai arvoja, voidaan pitää tästä näkökulmasta perusteltuina, koska niissä vaadittavia tietoja pystyy opettelemaan ja käyttämään kokeen kysymyksiin vastaamisessa. Standardisoidusti ja määrämuotoisena toteutettua kansalaisuuskoetta voidaan pitää ennakoitavampana vaihtoehtona kuin yksilöllistä ja harkinnanvaraista haastattelua.\u003Cspan class=\"AlaviiteTeksti\"> Bauböck &amp; Joppke 2010, s. 1–4. \u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeilla voidaan testata esimerkiksi sellaisten paikallista historiaa koskevien seikkojen omaksumista, jotka ovat merkityksellisiä paikalliseen poliittiseen yhteisöön osallistumisen kannalta. Kansalaisuuden saamisesta kiinnostuneelle voidaan tällä tavoin asettaa vaatimuksia, joita voidaan pitää perusteltuina ja hyväksyttävinä, ja kansalaisuuskoe on siten toteutettavissa oikeudenmukaisella tavalla.\u003Cspan class=\"AlaviiteTeksti\"> Blake 2022: In defense of citizenship testing – a reply to Daniel Sharp, Ethics &amp; Global Politics 15:1, s. 8. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhdysvaltojen kansalaisuuskoetta tarkasteltaessa on havaittu muun muassa, että kokeen taustalla on ajatus sellaisista maakohtaisista tiedoista, joita kansalaisuuden saadakseen on opeteltava ja omaksuttava. Kansalaisuuskoetta varten opeteltavat tiedot voivat myös täydentää kokeeseen valmistautuvien aiempia tietoja. Standardisoidulla (määrämuotoisella) kansalaisuuskokeella voidaan mitata esimerkiksi sellaisia asioita kuin historiaa koskevia tietoja, mutta kansalaisuuskokeen suorittamiselle voisi olla myös vaihtoehtoisia tapoja, kuten osallistuminen johonkin koulutukseen tai yhteiskunnalliseen toimintaan.\u003Cspan class=\"AlaviiteTeksti\"> Loring 2013: The Meaning of citizenship – tests, policy, and English proficiency, The CATESOL Journal 24.1, s. 215–217. \u003C/span> &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Muut maat \u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Luvussa 5.2 kuvataan tarkemmin eräiden esitykseen valittujen vertailumaiden osalta sitä, miten maat suhtautuvat yhteiskuntatiedon mittaamiseen ja kansalaisuuskokeeseen. Voidaan kuitenkin yleisesti todeta, että yhteiskunta- tai kansalaistiedon osoittaminen on monessa valtiossa edellytys kansalaisuuden saamiselle. Esimerkiksi Euroopan muuttoliikeverkoston (EMN) vuonna 2020 julkaiseman tutkimuksen mukaan noin puolet EU-maista edellytti kansalaistamista varten yhteiskuntatiedon osoittamista.\u003Cspan class=\"AlaviiteTeksti\"> Pathways to citizenship for third-country nationals in the EU – EMN Synthesis Report for the EMN Study 2019, s. 20 (https://emnbelgium.be/sites/default/files/publications/EMN%20study%20synthesis%20report%20citizenship.pdf ). \u003C/span> Euroopan ulkopuolella esimerkiksi Yhdysvallat ja Kanada edellyttävät kansalaisuuskokeen suorittamista. Muista Pohjoismaista Tanskassa ja Norjassa on käytössä kansalaisuuskoe.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Myös Ruotsissa kansalaisuuden saamisen ehtoja ollaan tiukentamassa siten, että niihin lisättäisiin vaatimus ruotsin kielen ja yhteiskuntatiedon osaamisesta. Tästä uudenlaisesta vaatimuksesta on vuosina 2021 ja 2025 tehty kaksi selvitystä, joissa on käsitelty myös erityisen kansalaisuuskokeen sisältöä ja toteutustapaa.\u003Cspan class=\"AlaviiteKooste\"> Krav på kunskaper i svenska och samhällskunskap för svenskt medborgarskap (SOU 2021:2, ), Skärpta krav för svenskt medborgarskap (SOU 2025:1, ). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\">https://www.regeringen.se/contentassets/b23619ff933047688f64b8f0051f0dfd/krav-pa-kunskaper-i-svenska-och-samhallskunskap-for-svenskt-medborgarskap-sou-20212_/\u003C/a>\u003C/span>\u003C/span>\u003C/span> Ruotsin yliopisto- ja korkeakouluneuvostolle (Universitets- och högskolerådet) on lisäksi annettu tehtäväksi laatia esiselvitys kansalaisuuskokeen toteuttamisesta.\u003Cspan class=\"AlaviiteKooste\"> Uppdrag att genomföra en förstudie i fråga om medborgarskapsprov (). \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\">https://www.regeringen.se/contentassets/6b27b23246334f04bd7c1a173fe5d071/uppdrag-att-genomfora-en-forstudie-i-fraga-om-medborgarskapsprov/\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kielitaitoa ja yhteiskuntaosaamista koskevalla vaatimuksella pyrittäisiin Ruotsissa vahvistamaan kansalaisuuden merkitystä sekä edistämään osallistavaa ja yhteenkuuluvuuteen perustuvaa yhteiskuntaa.\u003Cspan class=\"AlaviiteTeksti\"> SOU 2021:2, s. 153–155. \u003C/span> Kansalaisuuskokeen yhteiskuntaosion painopisteenä olisivat sellaiset tiedot, joita Ruotsissa elämistä ja yhteiskunnassa toimimista varten tarvitaan esimerkiksi maan keskeisestä lainsäädännöstä ja periaatteista, demokratiasta ja tasa-arvosta sekä yksilön oikeuksista ja velvollisuuksista.\u003Cspan class=\"AlaviiteTeksti\"> SOU 2025:1, s. 200–201. \u003C/span> Vuoden 2025 selvityksen mukaan kansalaisuuskokeen aiheisiin olisi lisättävä tiedotusvälineiden rooli yhteiskunnassa sekä lapsen oikeudet osana ihmisoikeuksia.\u003Cspan class=\"AlaviiteTeksti\"> SOU 2025:1, s. 300. \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Osana sisäministeriön työryhmän työskentelyä teetettiin vielä edellä mainittua EMN:n tutkimusta ajankohtaisempi ad hoc -kysely EMN:n kautta. Kysely lähetettiin 32 maalle, joista 21 antoi vastauksen. Vastauksen antaneista maista ainoastaan kolmella ei ollut käytössä kansalaisuuskoetta, minkä lisäksi yksi näistä maista oli Ruotsi, jossa edellä todetun mukaisesti suunnitellaan kokeen käyttöönottoa. Siten muut tähänkin kyselyyn vastanneista maista käyttävät kansalaisuuskoetta tai muuta sellaista tapaa, jolla mitataan hakijan yhteiskuntatietämystä ja kotoutumista. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoa mitataan muun muassa kirjallisella kansalaisuus- tai kotoutumiskokeella, haastattelulla tai kotoutumiskurssin suorittamisella. Testattavat asiat liittyvät eri maissa usein paitsi yhteiskuntaan, myös maan historiaan, maantieteeseen ja kulttuuriin sekä kansalaisen oikeuksiin ja velvollisuuksiin. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuden saamisen sääntely kuuluu valtion suvereniteetin piiriin, mikä tarkoittaa sitä, että kukin valtio määrittää oman lainsäädäntönsä nojalla, minkälaisia edellytyksiä kansalaisuuden saamiselle asetetaan. Edellä sanotusta voidaan kuitenkin yleiskuvana todeta, että kansainvälisesti katsottuna yhteiskuntatiedon mittaaminen osana valtion kansalaistamismenettelyä nähdään yhtenä keskeisenä osatekijänä siinä, että yksilö hyväksytään yhteiskunnan täysivaltaiseksi jäseneksi.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Maahanmuuttajien saama yhteiskuntatieto \u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Sisäministeriön työryhmäselvityksessä tarkasteltiin maahanmuuttajien saamaa tietoa suomalaisesta yhteiskunnasta maassa oleskelun eri vaiheissa (s. 20–29). Tämä on keskeistä muun muassa siitä näkökulmasta, minkälaisia valmiuksia maahanmuuttajilla olisi riittävän yhteiskuntaosaamisen osoittamiseksi ja minkälaista osaamista heiltä voisi edellyttää. Toisaalta kyse olisi myös siitä, miten esimerkiksi yhteiskuntaosaamisen osoittamiseksi tarkoitettuun kansalaisuuskokeeseen voisi valmistautua. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Seuraavassa tarkastellaan asiaa ensin maassa oleskelun alkuvaiheiden palveluiden näkökulmasta, mikä tarkoittaa kansainvälistä suojelua hakevan vastaanotosta sekä ihmiskaupan uhrien tunnistamisesta ja auttamisesta annetun lain (746/2011, jäljempänä \u003Cspan class=\"KursiiviTeksti\">vastaanottolaki\u003C/span>) ja kotoutumisen edistämisestä annetun lain (681/2023, jäljempänä \u003Cspan class=\"KursiiviTeksti\">kotoutumislaki\u003C/span>) mukaisia palveluja. Tämän jälkeen tarkastellaan, miten yhteiskunnallista opetusta annetaan perusopetuksessa, lukiokoulutuksessa, aikuisten perusopetuksessa ja ammatillisessa peruskoulutuksessa. Tarkoitus on lyhyesti kuvata sitä, miten mainituissa opinnoissa toteutetaan sellainen opetussisältö, jonka voitaisiin katsoa olevan keskeistä kansalaisuuskokeen näkökulmasta.&nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">2.2.3.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Alkuvaiheen tiedot ja opinnot\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Vastaanottolaissa määritellään turvapaikanhakijoina tulevien henkilöiden saamat palvelut ja niiden laajuus. Vastaanottopalveluihin kuuluu vastaanottolain 13 §:n mukaan myös työ- ja opintotoiminta, josta säädetään tarkemmin lain 29 §:ssä. Sen mukaan muussa vastaanottokeskuksessa kuin kauttakulkukeskuksessa on järjestettävä työ- ja opintotoimintaa asiakkaan omatoimisuuden edistämiseksi. Työ- ja opintotoiminta on pakollista, ja siitä kieltäytyminen voi johtaa vastaanottorahan vähentämiseen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto on ohjeistanut työ- ja opintotoiminnan järjestämisestä vastaanottokeskuksissa. Vastaanottokeskuksissa järjestettävä opintotoiminta poikkeaa varsinaisesta kotoutumiskoulutuksesta, jota järjestetään Suomessa oleskeluluvan jo saaneille, mutta opintotoiminta tarjoaa kuitenkin kotoutumisen edellytyksiä valmistamalla opiskelijoita elämään suomalaisessa yhteiskunnassa. Vastaanottokeskuksen opinnot tukevat siirtymistä kotoutumiskoulutukseen ja muihin opintoihin tai työelämään. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Osana työ- ja opintotoimintaa jokaisen turvapaikanhakijan pitää suorittaa suomalaisen yhteiskunnan kurssi. Suomalaisen yhteiskunnan kurssin tarkoituksena on perehdyttää vastaanottokeskuksen asiakasta suomalaiseen yhteiskuntaan ja siinä toimimiseen. Kurssi tarjoaa perustietoa yhteiskunnasta, lainsäädännöstä, historiasta, yhteiskuntajärjestyksestä sekä suomalaisesta kulttuurista ja tavoista. Suomalaisen yhteiskunnan kurssin kokonaisuus koostuu itseopiskelumateriaalista ja luennoista sekä verkkokurssista. Kaikki suomalaisen yhteiskunnan kurssiin liittyvät materiaalit ovat saatavilla vastaanottokeskuksista ja itseopiskelumateriaalit myös Maahanmuuttoviraston verkkosivuilta. Itseopiskelumateriaalit on käännetty suomen lisäksi useammalle kielelle.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://migri.fi/suomalaisen-yhteiskunnan-kurssi\">https://migri.fi/suomalaisen-yhteiskunnan-kurssi\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kotoutumislakia sovelletaan henkilöihin, joilla on ulkomaalaislaissa (301/2004) tarkoitettu voimassa oleva oleskelulupa Suomessa. Lakia sovelletaan myös henkilöön, jonka oleskeluoikeus on rekisteröity tai jolle on myönnetty oleskelukortti ulkomaalaislain mukaisesti. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Lain 11 §:n mukaan viranomaisen on annettava maahanmuuttajalle perustietoa hänen oikeuksistaan ja velvollisuuksistaan suomalaisessa yhteiskunnassa ja työelämässä oleskelulupapäätöksen tiedoksiannon, oleskeluoikeuden rekisteröinnin, oleskelukortin myöntämisen tai kotikunta- ja väestötietojen rekisteröinnin yhteydessä. Tervetuloa Suomeen -opas on kotoutumislain mukainen perustietoaineisto. Opasta jakavat esimerkiksi Maahanmuuttovirasto ja Suomen edustustot. Perustietoaineistoa on saatavissa kirjallisessa ja sähköisessä muodossa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://tem.fi/tervetuloa-suomeen\">https://tem.fi/tervetuloa-suomeen\u003C/a>\u003C/span>\u003C/span>\u003C/span> &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tämän lisäksi kunnalla on laajempi ohjaus- ja neuvontavelvoite kotoutumisen edistämiseksi. Kotoutumista edistäviä toimenpiteitä ja palveluja järjestetään osana kotoutumisohjelmaa, joka on kunnan järjestämä maahanmuuttajan kotoutumisen alkuvaiheen palvelukokonaisuus. Kotoutumislain 13 §:n mukaan kotoutumisohjelman on sisällettävä muun muassa monikielinen yhteiskuntaorientaatio, kotoutumiskoulutusta ja kielitaidon päättötestaus. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kotoutumislain 26 §:ssä säädetään kotoutumiskoulutuksen sisällöstä.
