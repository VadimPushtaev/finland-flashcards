lapselle, joka kykenee muodostamaan omat näkemyksensä, oikeuden vapaasti ilmaista nämä näkemyksensä kaikissa lasta koskevissa asioissa. Lapsen näkemykset on otettava huomioon lapsen iän ja kehitystason mukaisesti. Tämän toteuttamiseksi lapselle on annettava erityisesti mahdollisuus tulla kuulluksi häntä koskevissa oikeudellisissa ja hallinnollisissa toimissa joko suoraan tai edustajan tai asianomaisen toimielimen välityksellä kansallisen lainsäädännön menettelytapojen mukaisesti.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lapsen oikeuksien komitea on käsitellyt lapsen oikeutta tulla kuulluksi yleiskommentissaan nro 12 vuodelta 2009 (CRC/C/GC/12). Sopimusvaltioiden pitäisi yleiskommentin 20 kohdan mukaan olettaa, että lapsi kykenee ilmaisemaan näkemyksiään, sekä tunnustaa, että hänellä on oikeus ilmaista niitä. Se, että lapsen oikeus ilmaista näkemyksiään toteutuu, edellyttää 25 kohdan mukaan sitä, että lapsen kuulemisesta vastaavat henkilöt sekä lapsen vanhemmat tai huoltaja kertovat lapselle keskeisistä asioista, eri vaihtoehdoista, mahdollisesti tehtävistä päätöksistä ja niiden seurauksista. Tämä tiedonsaantioikeus on hyvin merkittävä, sillä se on perusedellytys sille, että lapsi tekee selkeitä päätöksiä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoedellytystä sekä kansalaisuuskokeen käyttöönottoa. Muutokset koskevat vain hakemuksen perusteella myönnettävää kansalaisuutta. Esityksessä ei sen sijaan ehdoteta muutoksia siihen, millä perusteilla lapsi saa Suomen kansalaisuuden esimerkiksi syntyessään suoraan lain nojalla (kansalaisuuslaki 2 luku). Myös erilaiset kansalaisuusilmoitukset säilyvät ennallaan (kansalaisuuslaki 4 luku). Ehdotettavat muutokset eivät siten vaikuta esimerkiksi Suomessa syntyvien lasten kansalaisuudettomuuden estämiseen eivätkä lasten kansalaisuusilmoituksiin.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaistamisen yhteydessä lapsen etuna voidaan pitää sitä, että hän saisi asuinmaansa kansalaisuuden, koska hän ei silloin ole maassa ulkomaalainen eikä esimerkiksi tarvitse oleskelulupaa. Myös perheen yhteistä kansalaisuutta voidaan pitää lapsen etuna. Lapsella on niin ikään oikeus kansalaisuuden säilyttämiseen, ja alkuperäinen kansalaisuus on osa lapsen identiteettiä. Lapsen oikeuksien toteutumisen kannalta on olennaista, että lasta on kansalaisuuslain 5 §:n mukaisesti kuultava häntä koskevasta hakemuksesta ja ilmoituksesta. Lasta kuullaan kansalaisuutta koskevasta hakemuksesta tai ilmoituksesta sekä silloin, kun hänelle haetaan kansalaisuutta kanssahakijana yhdessä huoltajansa kanssa, että silloin, kun hakemus tai ilmoitus on tehty yksinomaan lapsen puolesta. Lapsen kuulemista koskeviin säännöksiin ei tässä esityksessä ehdoteta muutoksia.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lapsille voidaan kansalaisuuslain 43 §:n mukaisesti myöntää kansalaisuus yhdessä huoltajansa kanssa, mihin ei ehdoteta tässä esityksessä muutoksia. Kansalaisuuslaki mahdollistaa siten jatkossakin sen, että koko perheelle voidaan myöntää kansalaisuus samanaikaisesti. Kansalaisuuden saaminen kanssahakijana edellyttää jatkossakin sitä, että myös hakijana olevalle huoltajalle voidaan samalla myöntää kansalaisuus. Lapsi voidaan lisäksi jatkossakin kansalaistaa kansalaisuuslain 24 §:n mukaisilla edellytyksillä yksin. Hakemuksen voi jatkossakin tehdä lapsen puolesta hänen huoltajansa tai edunvalvojansa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Uusi yhteiskuntatietoedellytys ja siihen liittyvä kansalaisuuskoe eivät koskisi alle 18-vuotiaita henkilöitä. Vanhempansa kansalaisuushakemuksen yhteydessä kanssahakijana olevalta lapselta ei edellytettäisi yhteiskuntatiedon osoittamista. Hakijana olevalla lapsella (24 §) ei niin ikään olisi yhteiskuntatietoedellytystä. Yhteiskuntatietoedellytys koskisi sen sijaan kanssahakijan vanhempaa. Edellytyksen täyttymisen voisi ehdotuksen mukaan osoittaa kansalaisuuskokeella tai ylioppilas- tai korkeakoulututkinnolla. Lähtökohtana säilyisi edelleenkin se, että hakijan olisi täytettävä kansalaistamisen edellytykset, jotta hän ja hänen mahdolliset kanssahakijansa voisivat saada kansalaisuuden. Sama lähtökohta koskee myös esimerkiksi kielitaitoedellytystä, nuhteettomuusedellytystä ja toimeentuloedellytystä.&nbsp;&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lapsen oikeuksien komitean yleiskommentin nro 5 (CRC/GC/2003/5) 12 kohdan mukaan jokaisen lainsäädäntö-, hallinto- ja oikeuselimen tai -instituution edellytetään soveltavan lapsen edun periaatetta järjestelmällisesti harkitessaan, kuinka niiden päätökset ja toimet vaikuttavat tai tulevat vaikuttamaan lasten oikeuksiin ja etuihin, esimerkiksi ehdotetut tai nykyiset lait tai politiikat, hallintotoimet tai tuomioistuimen päätökset, mukaan lukien myös ne, jotka eivät suoraan koske lapsia vaan vaikuttavat heihin välillisesti.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lapsen etu on huomioitu ehdotettavassa yhteiskuntatietoedellytyksessä siten, että edellytys ei koske alle 18-vuotiaita henkilöitä. Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia 18 vuoden täyttämiseen asti. Lapset eli alle 18-vuotiaat käyvät siten vielä koulua, minkä vuoksi heiltä ei olisi tarpeen vaatia erillisen kansalaisuuskokeen suorittamista. Toisaalta voidaan myös pitää lapsen edun mukaisena, että hänen vanhemmallaan on perustiedot suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Ehdotettavien muutosten myötä näiden tietojen osoittamista edellytettäisiin jatkossa lähtökohtaisesti kaikilta työikäisiltä aikuisilta, jotta kansalaisuus voitaisiin myöntää hakemuksen perusteella. Myös kansalaisuutta itselleen ja lapsilleen hakevien vanhempien olisi siten osoitettava kansalaisuuskokeella tai ylioppilas- tai korkeakoulututkinnolla, että he ovat hankkineet keskeiset tiedot suomalaisesta yhteiskunnasta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Ehdotuksilla huomioitaisiin kuitenkin myös lasten vanhempien kohtuulliset mahdollisuudet edellytyksen täyttämiseen. Maahanmuuttovirasto voisi ehdotuksen mukaan myöntää vanhemmalle kansalaisuuskokeen suorittamiseen sellaisia erityisjärjestelyjä, joita tämä tarvitsisi mm. vammaisuutensa perusteella. Lisäksi yhteiskuntatietoedellytyksestä voitaisiin ehdotuksen mukaan poiketa mm. sellaisen vammaisuuden perusteella, joka pitkäaikaisesti estäisi hakijana olevaa vanhempaa täyttämästä edellytystä. Yhteiskuntatietoedellytys ja kansalaisuuskoe eivät siten muodostuisi esteeksi lapsen kansalaisuuden saamiselle hänen vanhempansa vammaisuuden vuoksi. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Pakolaisten oikeusasemaa koskeva yleissopimus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Pakolaisten oikeusasemaa koskevan yleissopimuksen (SopS 77/1968) 34 artiklan mukaan sopimusvaltioiden on mahdollisuuksien mukaan helpotettava pakolaisten sopeutumista yhteiskuntaan ja heidän kansalaistamistaan. Erityisesti on sopimusvaltioiden pyrittävä nopeuttamaan kansalaistamismenettelyä ja mahdollisuuksien mukaan alentamaan tällaisesta menettelystä aiheutuvia maksuja ja kustannuksia. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettava yhteiskuntatietoedellytys koskisi lähtökohtaisesti myös pakolaisia. Kansalaisuuslakiin ei ehdoteta erityisesti pakolaisia koskevia muutoksia. Ehdotettavat muutokset eivät koskisi sellaisia kansalaisuuslain säännöksiä, joiden tarkoituksena on helpottaa pakolaisaseman saaneiden henkilöiden kansalaistamista. Kansainvälistä suojelua saaneiden henkilöiden kansalaisuushakemukset on myös jatkossa käsiteltävä 20 a §:n mukaisesti kiireellisenä ja viimeistään vuoden määräajan kuluessa. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Valtiottomien henkilöiden oikeusasemaa koskeva yleissopimus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Valtiottomien henkilöiden oikeusasemaa koskevan yleissopimuksen&nbsp;(SopS 80/1968)&nbsp;32 artiklan mukaan sopimusvaltioiden on mahdollisuuksien mukaan helpotettava valtiottomien henkilöiden sopeutumista yhteiskuntaan ja heidän kansalaiseksi pääsyään. Erityisesti on sopimusvaltion pyrittävä nopeuttamaan kansalaistamismenettelyä ja mahdollisuuksien mukaan alentamaan tällaisesta menettelystä aiheutuvia maksuja ja kustannuksia.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettava yhteiskuntatietoedellytys koskisi lähtökohtaisesti myös niitä hakijoita, jotka ovat valtiottomia eli kansalaisuudettomia. Kansalaisuuslakiin ei ehdoteta erityisesti kansalaisuudettomia koskevia muutoksia. Ehdotettavat muutokset eivät koskisi sellaisia kansalaisuuslain säännöksiä, joiden tarkoituksena on helpottaa kansalaisuudettomien henkilöiden kansalaistamista. Kansalaisuudettomilta vaadittava asumisaika säilyy jatkossakin yleistä lyhyempänä (kansalaisuuslaki 20 §). Lisäksi kansalaisuudettomien henkilöiden kansalaisuushakemukset on käsiteltävä 20 a §:n mukaisesti kiireellisenä ja viimeistään vuoden määräajan kuluessa. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vammaisten henkilöiden oikeuksia koskeva yleissopimus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Vammaisten henkilöiden oikeuksia koskevan yleissopimuksen (SopS 26 ja 27/2016) 1 artiklan mukaan vammaisiin henkilöihin kuuluvat ne, joilla sellainen pitkäaikainen ruumiillinen, henkinen, älyllinen tai aisteihin liittyvä vamma, joka vuorovaikutuksessa erilaisten esteiden kanssa voi estää heidän täysimääräisen ja tehokkaan osallistumisensa yhteiskuntaan yhdenvertaisesti muiden kanssa. Yleissopimuksen 18 artiklan mukaan sopimuspuolet tunnustavat, että vammaisilla henkilöillä on yhdenvertaisesti muiden kanssa oikeus kansalaisuuteen, muun muassa varmistamalla, että vammaisilla henkilöillä on oikeus hankkia kansalaisuus ja vaihtaa sitä eikä heiltä riistetä kansalaisuutta mielivaltaisesti tai vammaisuuden perusteella.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimuksen 5 artikla koskee tasa-arvoa ja yhdenvertaisuutta. Sopimuspuolet tunnustavat, että kaikki henkilöt ovat yhdenvertaisia lain edessä ja lain mukaan ja ovat oikeutettuja ilman minkäänlaista syrjintää yhdenvertaiseen lakiin perustuvaan suojaan ja yhdenvertaisiin lakiin perustuviin etuihin. Sopimuspuolet kieltävät kaiken syrjinnän vammaisuuden perusteella ja takaavat vammaisille henkilöille yhdenvertaisen ja tehokkaan oikeussuojan syrjintää vastaan syrjintäperusteesta riippumatta. Yhdenvertaisuuden edistämiseksi ja syrjinnän poistamiseksi sopimuspuolet toteuttavat kaikki asianmukaiset toimet varmistaakseen kohtuullisten mukautusten tekemisen. Erityistoimia, jotka ovat tarpeen vammaisten henkilöiden tosiasiallisen yhdenvertaisuuden jouduttamiseksi tai saavuttamiseksi, ei katsota yleissopimuksen tarkoittamaksi syrjinnäksi. Sopimuksen 2 artiklan mukaan \"kohtuullinen mukauttaminen\" tarkoittaa tarvittaessa yksittäistapauksessa toteutettavia tarpeellisia ja asianmukaisia muutoksia ja järjestelyjä, joilla ei aiheuteta suhteetonta tai kohtuutonta rasitetta ja joilla varmistetaan vammaisten henkilöiden mahdollisuus nauttia tai käyttää kaikkia ihmisoikeuksia ja perusvapauksia yhdenvertaisesti muiden kanssa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimuksen 9 artikla koskee esteettömyyttä ja saavutettavuutta. Jotta vammaiset henkilöt voisivat elää itsenäisesti ja osallistua täysimääräisesti kaikilla elämänalueilla, sopimuspuolet toteuttavat asianmukaiset toimet varmistaakseen vammaisille henkilöille muiden kanssa yhdenvertaisen pääsyn fyysiseen ympäristöön, kuljetukseen, tiedottamiseen ja viestintään, muun muassa tieto- ja viestintäteknologiaan ja -järjestelmiin, sekä muihin yleisölle avoimiin tai tarjottaviin järjestelyihin ja palveluihin sekä kaupunki- että maaseutualueilla. Näitä toimia, joihin sisältyy saavutettavuuden esteiden tunnistaminen ja poistaminen, sovelletaan muun muassa a) rakennuksiin, teihin, kuljetukseen sekä muihin sisä- ja ulkotiloihin, koulut, asunnot, terveydenhuoltoyksiköt ja työpaikat mukaan lukien, b) tiedottamiseen, viestintään ja muihin palveluihin, sähköiset palvelut ja pelastuspalvelut mukaan lukien. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoedellytystä, jonka täyttymisen voisi osoittaa kansalaisuuskokeella tai ylioppilas- tai korkeakoulututkinnolla. Kansalaisuuskokeen toteutuksessa huolehdittaisiin sähköisen ja fyysisen koeympäristön esteettömyydestä ja saavutettavuudesta sekä vammaisten henkilöiden tarvitsemista kohtuullisista mukautuksista. Maahanmuuttovirasto voisi myöntää kansalaisuuskokeeseen sellaisia erityisjärjestelyjä, joita kokeeseen osallistuva tarvitsisi vammaisuutensa perusteella kokeen suorittamiseen. Maahanmuuttoviraston myöntämien erityisjärjestelyjen toteutumisesta huolehtisivat ne toimijat, joiden kanssa virasto olisi sopinut koetilaisuuksien järjestämisestä. Kansalaisuuskoe tarvittavine erityisjärjestelyineen olisi kansalaisuuden hakemista edeltävä vaihe. Esityksessä ehdotetaan lisäksi, että yhteiskuntatietoedellytyksestä voitaisiin kansalaisuushakemuksen yhteydessä poiketa, jos hakijan vammaisuus pitkäaikaisesti estäisi edellytyksen täyttämisen. Näillä tavoilla on tarkoitus varmistaa, että myös vammaisilla henkilöillä on yhdenvertainen oikeus kansalaisuuteen ja sen hankkimiseen. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kaikkinaisen rotusyrjinnän poistamista koskeva kansainvälinen yleissopimus\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kaikkinaisen rotusyrjinnän poistamista koskevan kansainvälisen yleissopimuksen (SopS 37/1970) 5 artiklan mukaan sopimusvaltiot sitoutuvat takaamaan jokaiselle rotuun, ihonväriin tai kansalliseen tai etniseen alkuperään katsomatta yhdenvertaisuuden lain edessä varsinkin sopimuksessa mainittujen oikeuksien osalta, joihin kuuluu myös oikeus kansalaisuuteen. Sopimuksen 1 artiklan 3 kappaleen mukaan sen määräysten ei ole tulkittava vaikuttavan sopimusvaltioiden kansalaisuutta tai kansalaistamista koskevaan lainsäädäntöön edellyttäen, että tällaiset säännökset eivät aiheuta syrjintää mitään erityistä kansallisuutta kohtaan.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimus edellyttää siten sitä, että kansalaistamista koskevalla lainsäädännöllä ei syrjitä mitään erityistä kansallisuutta. Tässä esityksessä ei ehdoteta sellaisia muutoksia, jotka kohdistuisivat erityisesti jonkin tietyn kansallisuuden edustajiin.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Eurooppalainen yleissopimus kansalaisuudesta\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Eurooppalaisen kansalaisuusyleissopimuksen 2 artiklan mukaan kansalaisuus tarkoittaa sopimuksessa henkilön ja valtion välistä oikeudellista sidettä eikä osoita henkilön etnistä alkuperää. Sopimuksen 6 artiklan 3 kappaleen mukaan kukin sopimusvaltio säätää valtionsisäisessä lainsäädännössään mahdollisuudesta kansalaistaa henkilöt, jotka asuvat laillisesti sen alueella. Sopimusvaltio ei säädä kansalaistamisen edellytykseksi yli kymmenen vuoden oleskelua valtion alueella ennen hakemuksen jättämistä. Sopimuksen perustelumuistion (s. 9) mukaan sopimusvaltio voi asumisajan lisäksi asettaa kansalaistamiselle muita, erityisesti kotoutumiseen liittyviä edellytyksiä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimuksen 6 artiklan 4 kappaleen mukaan kukin sopimusvaltio helpottaa valtionsisäisessä lainsäädännössään eräiden henkilöiden kansalaisuuden saamista. Näitä ovat a) sopimusvaltion kansalaisten puolisot, b) sopimusvaltion kansalaisten lapset 6 artiklan 1 kappaleen a kohdan poikkeus huomioon ottaen, c) lapset, joiden vanhemmista toinen saa tai on saanut sopimusvaltion kansalaisuuden, d) sopimusvaltion kansalaisten adoptoimat lapset, e) henkilöt, jotka ovat syntyneet sopimusvaltion alueella ja asuvat siellä laillisesti, f) henkilöt, jotka ovat asuneet laillisesti sopimusvaltion alueella tietyn ajan, joka on alkanut ennen kuin henkilö on täyttänyt 18 vuotta ja jonka pituus määritetään asianomaisen sopimusvaltion sisäisessä lainsäädännössä sekä g) kansalaisuudettomat henkilöt ja pakolaisaseman saaneet henkilöt, jotka asuvat laillisesti sopimusvaltion alueella.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuusyleissopimuksen 10–13 artiklassa on määräyksiä kansalaisuuteen liittyvistä menettelyistä. Kansalaisuuden saamiseen, säilyttämiseen, menettämiseen, takaisinsaamiseen tai todistamiseen liittyvät hakemukset on käsiteltävä kohtuullisessa ajassa. Päätösten tulee sisältää kirjalliset perustelut. Päätöksiin on voitava hakea muutosta valtionsisäisen lainsäädännön mukaisesti, ja maksujen on oltava kohtuullisia. Hallinnolliseen tai oikeudelliseen muutoksenhakuun liittyvät maksut eivät saa muodostua esteeksi hakijoille.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sopimuksen perustelumuistion (s. 14–15) mukaan kansalaisuuden saamista ja menettämistä koskevat päätökset on perusteltava kirjallisesti, ja niihin on voitava hakea muutosta. Päätöksessä on vähintään ilmoitettava sen oikeudelliset ja tosiasialliset perusteet. Kirjallisia perusteluja ei kuitenkaan tarvita, jos kyse on pelkästään sen rekisteröinnistä, että henkilö on saanut tai menettänyt kansalaisuuden suoraan lain nojalla. Jos päätökset liittyvät kansalliseen turvallisuuteen, vähimmäismäärä tietoa riittää. Muutoksenhaun osalta keskeistä on se, että kansalaisuutta koskevista päätöksistä voi valittaa. Sopimusvaltiot voivat sisäisessä lainsäädännössään päättää menettelyn yksityiskohdista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaistamiselle lisättäisiin uusi yhteiskuntatietoedellytys, minkä lisäksi Suomessa otettaisiin käyttöön kansalaisuuskoe. Niin uuden edellytyksen kuin myös kansalaisuuskokeen taustalla olisi ajatus siitä, että Suomessa asuvilta voidaan kansalaisuuden saamista varten edellyttää kototumista, mikä sopisi yhteen kansalaisuusyleissopimuksen kanssa. Yhteiskuntatietoedellytyksen täyttymisen voisi osoittaa ylioppilas- tai korkeakoulututkinnolla tai ehdotettavalla uudella kansalaisuuskokeella, jossa testattaisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Näitä aiheita koskevia keskeisiä tietoja voidaan pitää sellaisena kotoutumiseen liittyvänä vaatimuksena, jollainen kansalaisuutta hakeville voidaan kansalaisuusyleissopimuksen perustelumuistion valossa asettaa tietyn pituisen asumisajan ohella. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Eräiden henkilöiden kansalaisuuden saamista helpotetaan jatkossakin lyhyemmällä asumisajalla, enimmäiskäsittelyajalla tai yksinkertaisemmalla menettelyllä, miltä osin kansalaisuuslakiin ei ehdoteta tässä esityksessä mitään muutoksia. Kansalaisuuden hakemista koskevaan menettelyyn tai kansalaisuuspäätöksiä koskevaan muutoksenhakuun ei niin ikään ehdoteta tässä esityksessä muutoksia. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.8.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yleissopimus ihmisoikeuksien ja perusvapauksien suojaamiseksi\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Yleissopimus ihmisoikeuksien ja perusvapauksien suojaamiseksi (SopS 18 ja 19/1990; sellaisena kuin se on myöhemmin muutettuna SopS 71 ja 72/1994, SopS 85 ja 86/1998, SopS 8 ja 9/2005, SopS 6 ja 7/2005 sekä SopS 50 ja 51/2010;&nbsp;\u003Cspan class=\"KursiiviTeksti\">Euroopan ihmisoikeussopimus\u003C/span>) lisäpöytäkirjoineen ei sisällä sellaista määräystä, joka koskisi oikeutta kansalaisuuteen. Euroopan ihmisoikeustuomioistuin (EIT) on kuitenkin katsonut, että kansalaisuuden mielivaltaista epäämistä voidaan arvioida sopimuksen 8 artiklan mukaisen yksityiselämän suojan kannalta (mm. Karassev v. Suomi, 31414/96, 12.1.1999). EIT on arvioinut kansalaisuuden saamista myös sopimuksen 14 artiklan mukaisen syrjinnän kiellon kannalta (mm. Genovese v. Malta, 53124/09, 11.10.2011). EIT on niin ikään todennut, että tietyn asumisajan tai avioliiton keston edellyttäminen on yleistä kansalaisuuden myöntämistä koskevassa lainsäädännössä (Savoia and Bounegru v. Italia, 8407/05, 16.2.2006). Kansalaisuuden saamisen lisäksi EIT on arvioinut useissa tapauksissa kansalaisuuden menettämistä (mm. Ramadan v. Malta, 76136/12, 21.6.2016; K2 v. Yhdistynyt kuningaskunta, 42387/13, 9.3.2017). &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Euroopan ihmisoikeussopimuksen 8 artiklan mukaan jokaisella on oikeus nauttia yksityis- ja perhe-elämäänsä, kotiinsa ja kirjeenvaihtoonsa kohdistuvaa kunnioitusta. Viranomaiset eivät saa puuttua tämän oikeuden käyttämiseen, paitsi kun laki sen sallii ja se on välttämätöntä demokraattisessa yhteiskunnassa kansallisen ja yleisen turvallisuuden tai maan taloudellisen hyvinvoinnin vuoksi, tai epäjärjestyksen tai rikollisuuden estämiseksi, terveyden tai moraalin suojaamiseksi, tai muiden henkilöiden oikeuksien ja vapauksien turvaamiseksi. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Euroopan ihmisoikeussopimuksen 14 artiklan mukaan sopimuksessa tunnustetuista oikeuksista ja vapauksista nauttiminen taataan ilman minkäänlaista sukupuoleen, rotuun, ihonväriin, kieleen, uskontoon, poliittisiin tai muihin mielipiteisiin, kansalliseen tai yhteiskunnalliseen alkuperään, kansalliseen vähemmistöön kuulumiseen, varallisuuteen, syntyperään tai muuhun asemaan perustuvaa syrjintää. Sopimusta on täydennetty kaikkinaisen syrjinnän kieltävällä kahdennellatoista pöytäkirjalla, joka sisältää yleisen syrjintäkiellon (SopS 8–9/2005). Pöytäkirjan 1 artiklan 1 kappaleen mukaan laissa tunnustetuista oikeuksista nauttiminen taataan ilman minkäänlaista sukupuoleen, rotuun, ihonväriin, kieleen, uskontoon, poliittisiin tai muihin mielipiteisiin, kansalliseen tai yhteiskunnalliseen alkuperään, kansalliseen vähemmistöön kuulumiseen, varallisuuteen, syntyperään tai muuhun asemaan perustuvaa syrjintää. Artiklan 2 kappaleen mukaan ketään ei saa syrjiä viranomaistoiminnassa 1 kappaleessa tarkoitetuilla perusteilla. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoedellytystä sekä kansalaisuuskokeen ottamista käyttöön Suomessa. Useassa muussa maassa on jo käytössä kansalaisuuskoe (kansalaisuuskokeesta muissa maissa ks. edellä 5.2). Yhteiskuntaa koskevien tietojen osoittamista vaaditaan useassa eri maassa joko kansalaisuuskokeella tai jollakin muulla tavalla. Ehdotettavassa kansalaisuuskokeessa testattaisiin yleisesti saatavilla olevaan oppimateriaaliin perustuvia keskeisiä tietoja suomalaisesta yhteiskunnasta. Kokeen suorittamista varten voitaisiin myöntää erityisjärjestelyjä mm. vammaisuuden perusteella. Lisäksi yhteiskuntatietoedellytyksestä voitaisiin poiketa mm. sillä perusteella, että hakijan vammaisuus pitkäaikaisesti estäisi häntä täyttämästä edellytystä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Näistä syistä voidaan arvioida, että yhteiskuntatietoedellytys ja kansalaisuuskoe eivät loukkaisi Euroopan ihmisoikeussopimuksen 8 artiklan mukaista yksityiselämän suojaa eivätkä 14 artiklan mukaista syrjinnän kieltoa. Esityksessä ei ehdoteta mitään muutoksia kansalaisuuden menettämistä koskeviin säännöksiin. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Unionin oikeus\u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Euroopan unionista tehdyn sopimuksen (SEU) 9 artiklan ja Euroopan unionin toiminnasta tehdyn sopimuksen (SEUT) 20 artiklan 1 kohdan mukaan unionin kansalainen on jokainen, jolla on jonkin jäsenvaltion kansalaisuus. Euroopan unionin perusoikeuskirjan 45 artiklan mukaan jokaisella unionin kansalaisella on oikeus vapaasti liikkua ja oleskella jäsenvaltioiden alueella. Perusoikeuskirjan 39 artiklan mukaan unionin kansalaisella on siinä jäsenvaltiossa, jossa hän asuu, äänioikeus ja vaalikelpoisuus Euroopan parlamentin vaaleissa ja 40 artiklan mukaan vastaavasti kunnallisvaaleissa.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Suomen kansalainen on samalla myös unionin kansalainen. Kolmannen maan kansalaisten kannalta Suomen kansalaisuuden saaminen merkitsee siten unionin kansalaisuuden ja siihen liittyvien oikeuksien saamista. Tässä esityksessä ehdotetaan kansalaisuuden saamiselle uutta yhteiskuntatietoedellytystä, jonka täyttymisen voisi osoittaa uudella kansalaisuuskokeella tai ylioppilas- tai korkeakoulututkinnolla. Ehdotettavat muutokset vaikuttavat siten siihen, miten Suomessa asuva henkilö voi saada hakemuksen perusteella Suomen kansalaisuuden. Kolmannen maan kansalaisen osalta ehdotettavat muutokset vaikuttavat myös mahdollisuuteen saada unionin kansalaisuus siihen liittyvine oikeuksineen. Kansalaisuuskoe on käytössä myös useassa muussa Euroopan unionin jäsenvaltiossa. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Euroopan unionin tuomioistuimen (EUT) mukaan SEUT 20 artikla on esteenä kansallisille toimenpiteille, joiden vaikutuksesta unionin kansalaiset eivät tosiasiassa voi käyttää oikeuksia, jotka heillä on unionin kansalaisen asemansa perusteella (Ruiz Zambrano v. Office national de l’emploi, tuomio 8.11.2011 C-34/09). Tässä esityksessä ehdotetut muutokset eivät vaikuta unionin kansalaisten mahdollisuuksiin käyttää Suomessa unionin kansalaisen oikeuksiaan. Ehdotetut muutokset eivät kohdistu esimerkiksi unionin kansalaisten vapaaseen liikkuvuuteen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Euroopan unionin tuomioistuin (EUT) on käsitellyt ratkaisuissaan kansalaisuuden menettämistä (mm. Rottmann v. Freistaat Bayern, tuomio 2.3.2010 C-135/08; Tjebbes ja muut v. Alankomaat, tuomio 12.3.2019 C-221/17). Kansalaisuuden saamista ja menettämistä koskevat säännöt kuuluvat jäsenvaltioiden toimivaltaan, mutta unionin kansalaisuuden ja siihen liittyvien oikeuksien menettäminen kuuluu unionin oikeuden soveltamisalaan. Kansalaisuuden menettämistä koskevassa arvioinnissa on kiinnitettävä huomiota niihin seurauksiin, joita unionin kansalaisen oikeuksien menettämisestä aiheutuu henkilölle itselleen ja mahdollisesti hänen perheenjäsenilleen. EUT:n mukaan unionin oikeus ei estä jäsenvaltioita säätämästä tietyin edellytyksin kansalaisuuden menettämisestä. Tapauksissa on kuitenkin arvioitava sitä, onko jäsenvaltion kansalaisuuden ja unionin kansalaisen aseman menettäminen suhteellisuusperiaatteen mukaista.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Tässä esityksessä ei ehdoteta mitään muutoksia kansalaisuuden menettämistä koskeviin säännöksiin.&nbsp;Ehdotettavilla muutoksilla ei siten ole vaikutusta unionin kansalaisuuden eikä unionin kansalaisen aseman menettämiseen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Esityksen suhdetta EU:n yleiseen tietosuoja-asetukseen on arvioitu edellä yksityiselämän ja henkilötietojen suojaa koskevien perustuslain säännösten yhteydessä (11.3). &nbsp;\u003C/p>\n    \u003C/div>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">11.10&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Lopuksi \u003C/span>\u003C/h4>\n     \u003Cp class=\"KappaleKooste\">Edellä mainituilla perusteilla lakiehdotukset voidaan käsitellä tavallisessa lainsäätämisjärjestyksessä. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n   \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n   \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Ponsi\u003C/span>&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Edellä esitetyn perusteella annetaan eduskunnan hyväksyttäviksi seuraavat lakiehdotukset: &nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv id=\"SaadosOsa\" class=\"SaadosOsa\">\n   \u003Cspan class=\"edk-title-h3\">\u003C/span>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">1.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">kansalaisuuslain muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span>kansalaisuuslain (359/2003) 13 §:n 1 momentin 5 ja 6 kohta, 25 §:n 3 momentti, 44 §:n 3 ja 4 momentti sekä 45 §:n 1 momentti,&nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">sellaisina kuin ne ovat, 13 §:n 1 momentin 5 kohta ja 25 §:n 3 momentti laissa 929/2025, 13 §:n 1 momentin 6 kohta ja 45 §:n 1 momentti laissa 579/2011 ja 44 §:n 3 ja 4 momentti laissa 974/2007,&nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">lisätään\u003C/span> 3 §:ään, sellaisena kuin se on laissa 974/2007, uusi 3 momentti, 13 §:n 1 momenttiin, sellaisena kuin se on laeissa 579/2011, 474/2024 ja 929/2025, uusi 7 kohta, lakiin uusi 17 b § ja uusi 3 a luku, 41 §:ään, sellaisena kuin se on laissa 929/2025, uusi 2 ja 3 momentti sekä lakiin siitä lailla 929/2025 kumotun 42 §:n tilalle uusi 42 § seuraavasti:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">3 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Maahanmuuttoviraston tehtävät&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto vastaa kansalaisuuskokeen yleisestä hallinnosta, tiedottamisesta, tietojärjestelmäkokonaisuudesta, kehittämisestä ja valvonnasta sekä tekee kansalaisuuskokeen järjestämiseen ja laatimiseen liittyviä sopimuksia. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">13 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaistamisen yleiset edellytykset&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Ulkomaalaiselle myönnetään hakemuksesta Suomen kansalaisuus, jos hakemusta ratkaistaessa: &nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) hänen toimeentulonsa on turvattu (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">toimeentuloedellytys\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">);\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">6) hänellä on suomen tai ruotsin kielen tyydyttävä suullinen ja kirjallinen taito tai näiden sijasta vastaavan tasoinen suomalaisen tai suomenruotsalaisen viittomakielen taito (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">kielitaitoedellytys\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">); ja\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">7) hänellä on 6 kohdassa tarkoitetulla suomen tai ruotsin kielellä osoitetut riittävät tiedot suomalaisesta yhteiskunnasta (\u003C/span>\u003Cspan class=\"SaadosKursiiviKooste\">\u003Cspan class=\"KoosteTeksti\">yhteiskuntatietoedellytys\u003C/span>\u003C/span>\u003Cspan class=\"KoosteTeksti\">).\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">17 b §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Yhteiskuntatiedon osoittaminen ja yhteiskuntatietoedellytyksestä poikkeaminen&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Yhteiskuntatietoedellytyksen täyttäminen voidaan osoittaa suorittamalla:&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) hyväksytysti kansalaisuuskoe; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) Suomessa suomen- tai ruotsinkielinen ylioppilastutkinto; tai\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) Suomessa suomen- tai ruotsinkielinen korkeakoulututkinto.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Yhteiskuntatietoedellytys ei koske alle 18-vuotiasta eikä 65 vuotta täyttänyttä henkilöä.&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Hakijalle voidaan myöntää Suomen kansalaisuus, vaikka yhteiskuntatietoedellytys ei täyty, jos hänen terveydentilansa tai vammansa pitkäaikaisesti estää sen täyttämisen tai muutoin on olemassa erittäin painava syy yhteiskuntatietoedellytyksestä poikkeamiselle. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Täysivaltaiseksi tulon vaikutus vireillä olevaan hakemukseen&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto asettaa 1 ja 2 momentissa tarkoitetuille henkilöille kohtuullisen määräajan, jossa hakemusta on täydennettävä tai se on vahvistettava. Hakijaan, joka on täydentänyt kansalaisuushakemusta tai joka on vahvistanut kansalaisuushakemuksen, sovelletaan 23 §:n 2 momentissa ja 24 §:n 3 momentissa säädettyjä edellytyksiä, jos ne ovat täyttyneet ennen 18 ikävuoden täyttämistä. Toimeentuloedellytys ja yhteiskuntatietoedellytys eivät koske hakemuksen vireillä ollessa 18 vuotta täyttänyttä henkilöä. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-luku\">\n      \u003Ch5>\n       \u003Cdiv class=\"LukuTunnusKooste\">3 a luku&nbsp;\u003C/div>\n       \u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskoe&nbsp;\u003C/span>\n      \u003C/h5>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 a §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen sisältö&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeella testataan perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Monivalintakokeen kysymykset perustuvat yleisesti saatavilla olevaan kansalaisuuskokeen oppimateriaaliin, joka on laadittu kotoutumisen edistämisestä annetun lain (681/2023) 25 §:ssä tarkoitetun yhteiskuntaorientaation oppimateriaalin pohjalta. Kokeen kysymykset koskevat Suomen keskeistä lainsäädäntöä, perus- ja ihmisoikeuksia, yhdenvertaisuutta, sukupuolten tasa-arvoa, Suomen historiaa ja kulttuuria sekä muita kansalaisuuskokeen oppimateriaaliin sisältyviä keskeisiä tietoja.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskoe suoritetaan 13 §:n 1 momentin 6 kohdassa tarkoitetulla suomen tai ruotsin kielellä. Koe suoritetaan sähköisesti, ellei kokeen sähköiselle toteutukselle ole estettä. Kansalaisuuskokeen hyväksytty suoritus edellyttää sitä, että valtaosa monivalintakokeen vastauksista on valittu oikein.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen sisällöstä ja hyväksytystä suorituksesta voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 b §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen laatiminen&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto tekee sopimuksen kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin hankkimisesta yliopiston tai muun sellaisen yliopistollisen toimijan kanssa, jolla on riittävä asiantuntemus kansalaisuuskokeen kysymysten, vastausvaihtoehtojen ja oppimateriaalin laatimiseen. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 c §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen laatijan tehtävät&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"KohdatMomentti\">\n        \u003Cdiv class=\"MomenttiJohdantoKooste\">Kansalaisuuskokeen laatijan tehtävänä on:&nbsp;\u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">1) laatia 25 a §:ssä tarkoitettu yhteiskuntaorientaation oppimateriaaliin perustuva kansalaisuuskokeen oppimateriaali suomen ja ruotsin kielellä;\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">2) valmistella laaja valikoima kansalaisuuskokeen kysymyksiä vastausvaihtoehtoineen suomen ja ruotsin kielellä; \u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">3) huolehtia kokeen oppimateriaalin, kysymysten ja vastausvaihtoehtojen testauksesta, ylläpitämisestä ja kehittämisestä; sekä\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">4) osallistua 25 f §:ssä tarkoitetun asiantuntijatoimikunnan toimintaan. \u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">Kansalaisuuskokeen laatijan palveluksessa olevaan henkilöön sovelletaan rikosoikeudellista virkavastuuta koskevia säännöksiä hänen suorittaessaan 1 momentissa&nbsp;tarkoitettuja tehtäviä.\u003C/span>&nbsp;\n        \u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen laatijan tehtävistä ja niitä koskevien sopimusten sisällöstä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 d § &nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen järjestäminen&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto sopii kansalaisuuskokeen koetilaisuuksien järjestämisestä sellaisten toimijoiden kanssa, joilla on riittävä asiantuntemus ja edellytykset koetilaisuuksien järjestämiseen. Sopimuksia tehtäessä on otettava huomioon, että koetilaisuuksia on tarjolla alueellisesti riittävä määrä ja riittävän usein. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 e §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen järjestäjän tehtävät&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"KohdatMomentti\">\n        \u003Cdiv class=\"MomenttiJohdantoKooste\">Kansalaisuuskokeen järjestäjän tehtävänä on:&nbsp;\u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">1) järjestää koetilaisuudet sopimusehtojen mukaisesti; \u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">2) huolehtia koetilaisuuksien valvonnasta; \u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">3) toteuttaa 25 g §:ssä tarkoitetut erityisjärjestelyt; sekä\u003C/span>&nbsp;\n        \u003C/div>\n        \u003Cdiv class=\"MomenttiKohtaKooste\">\n         \u003Cspan class=\"KoosteTeksti\">4) ilmoittaa Maahanmuuttovirastolle viipymättä 25 h §:ssä tarkoitetuista tilanteista seuraamuksista päättämistä varten. \u003C/span>&nbsp;\n        \u003C/div>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen järjestäjällä on oikeus saada Maahanmuuttovirastolta maksutta ja salassapitosäännösten estämättä 1 momentissa tarkoitettujen tehtävien hoitamisen kannalta välttämättömät tiedot. Kokeen järjestäjään sovelletaan viranomaisten toiminnan julkisuudesta annetussa laissa (621/1999) säädettyjä salassapitovelvoitteita, kun se hoitaa 1 momentissa tarkoitettuja tehtäviä. Kokeen järjestäjän palveluksessa olevaan henkilöön sovelletaan rikosoikeudellista virkavastuuta koskevia säännöksiä hänen suorittaessaan 1 momentissa&nbsp;tarkoitettuja tehtäviä.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen järjestäjien tehtävistä ja niitä koskevien sopimusten sisällöstä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 f §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Asiantuntijatoimikunta&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttoviraston yhteydessä toimii asiantuntijatoimikunta, jonka Maahanmuuttovirasto asettaa enintään kolmeksi vuodeksi kerrallaan. Asiantuntijatoimikunnan puheenjohtajana toimii Maahanmuuttoviraston edustaja. Varapuheenjohtajana toimii mahdollisuuksien mukaan kotoutumisen asiantuntemuksen edustaja. Lisäksi asiantuntijajäsenten tulee edustaa ainakin koulutuksen asiantuntemusta sekä kansalaisuuskokeen laatijaa ja järjestäjää. &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Asiantuntijatoimikunnan tehtävänä on tukea Maahanmuuttovirastoa kansalaisuuskokeen yleisessä kehittämisessä ja hallinnossa. Toimikunta antaa Maahanmuuttoviraston pyynnöstä lausunnon kansalaisuuskoetta koskevasta oikaisuvaatimuksesta.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Asiantuntijatoimikunnan kokoonpanosta, asioiden käsittelystä ja tehtävistä voidaan antaa tarkempia säännöksiä valtioneuvoston asetuksella. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 g §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kokeen suorittamista koskevat erityisjärjestelyt&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Henkilö, joka on sairauden, vamman, lukemisen ja kirjoittamisen erityisvaikeuden tai muun niihin rinnastettavan syyn vuoksi estynyt suorittamasta kansalaisuuskoetta samalla tavalla kuin muut kokeen suorittajat, voi suorittaa kokeen erityisjärjestelyin.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Lain 18 b §:n 2 ja 3 momentissa tarkoitettu alle 65-vuotias henkilö voi suorittaa kokeen suullisesti.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto päättää erityisjärjestelyjen käytöstä. Erityisjärjestelyistä tulee esittää virastolle erillinen pyyntö.&nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 h §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Seuraamus järjestyksen rikkomisesta ja vilpillisestä menettelystä&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen suorittajan koesuoritus katsotaan hylätyksi, jos hän syyllistyy järjestyksen rikkomiseen koetilaisuudessa eikä koetilaisuuden valvojan kehotuksesta huolimatta lopeta menettelyä.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Jos kokeen suorittaja syyllistyy koetilaisuudessa vilpilliseen menettelyyn, siinä avustamiseen tai sen yritykseen, hänen koesuorituksensa katsotaan hylätyksi ja hän menettää oikeutensa osallistua koetilaisuuteen kuuden kuukauden ajaksi koetilaisuudesta. Jos menettely on toistuvaa tai muuten erityisen vakavaa ja haitallista, kokeen suorittajan koesuoritus katsotaan hylätyksi ja hän menettää oikeutensa osallistua koetilaisuuteen 12 kuukauden ajaksi koetilaisuudesta. Jos kokeen suorittaja on ehtinyt ilmoittautua uuteen koetilaisuuteen, Maahanmuuttovirasto voi peruuttaa osallistumisen.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Päätöksen 1 ja 2 momentissa tarkoitetussa asiassa tekee Maahanmuuttovirasto. Päätös pannaan täytäntöön tehdystä valituksesta huolimatta, jollei valitusviranomainen kiellä täytäntöönpanoa. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">25 i §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Koemaksu&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto perii kokeeseen ilmoittautuneelta koemaksun. Koemaksun määrästä säädetään sisäministeriön asetuksella Maahanmuuttoviraston suoritteiden maksullisuudesta noudattaen, mitä valtion maksuperustelaissa (150/1992) säädetään julkisoikeudellisista suoritteista perittävistä maksuista. &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Koemaksu palautetaan kokeeseen ilmoittautuneelle, jos hän on estynyt osallistumasta kokeeseen oman sairautensa vuoksi. Maksua ei palauteta, jos esteestä ei ole ilmoitettu Maahanmuuttovirastolle ennen koetilaisuutta. Pyyntö maksun palauttamisesta on tehtävä Maahanmuuttovirastolle 14 päivän kuluessa koepäivästä. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">41 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Muutoksenhaku&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeen suorituksen hylkäämistä koskevaan päätökseen saa vaatia oikaisua Maahanmuuttovirastolta. &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Maahanmuuttovirasto voi pyytää 2 momentissa tarkoitetusta oikaisuvaatimuksesta lausunnon 25 f §:ssä tarkoitetulta asiantuntijatoimikunnalta. Muutoin oikaisuvaatimusmenettelyyn sovelletaan, mitä hallintolaissa (434/2003) säädetään. Edellä 2 momentissa tarkoitetusta oikaisuvaatimuksesta annettuun päätökseen ei saa hakea muutosta valittamalla. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">42 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Oikaisuvaatimuksen käsittelymaksu&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Edellä 41 §:n 2 momentissa tarkoitetun kansalaisuuskoetta koskevan oikaisuvaatimuksen käsittely on maksullinen. Käsittelymaksun määrästä säädetään sisäministeriön asetuksella Maahanmuuttoviraston suoritteiden maksullisuudesta noudattaen, mitä valtion maksuperustelaissa säädetään julkisoikeudellisista suoritteista perittävistä maksuista.&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Oikaisuvaatimuksen käsittelyn jatkaminen sen vireille tulon jälkeen edellyttää, että oikaisuvaatimuksen käsittelystä perittävä maksu on suoritettu 30 päivän kuluessa vaatimuksen vireille tulosta. Oikaisuvaatimus voidaan jättää tutkimatta, jos oikaisuvaatimuksen käsittelystä perittävää maksua ei ole suoritettu mainitussa määräajassa. &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Oikaisuvaatimuksen käsittelyä koskeva maksu palautetaan asianosaiselle, jos Maahanmuuttovirasto muuttaa muutoksenhaun alaista päätöstä muutoksenhakijan eduksi siten, että kansalaisuuskokeen suoritus on hyväksytty. &nbsp;\u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">44 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Hakemuksen ja ilmoituksen vireillepano&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Hakemuksen ja ilmoituksen käsittelyn jatkaminen 2 momentin mukaisen tarkastuksen jälkeen edellyttää Maahanmuuttoviraston käsittelymaksun suorittamista. Maksu määräytyy valtion maksuperustelain&nbsp;mukaisesti. Tarkemmat säännökset maksusta annetaan sisäministeriön asetuksella.&nbsp;&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKooste\">Tämän lain mukaisten asioiden käsittelyyn kunniakonsulaateissa sovelletaan hallintolakia.&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n      \u003Cdiv class=\"edk-pykala\">\n       \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">45 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Hakijan liitteet hakemukseen&nbsp;\u003C/span>\u003C/h5>\n       \u003Cdiv class=\"MomenttiKooste\">Hakijan on liitettävä kansalaisuushakemukseensa 17 §:ssä tarkoitettu selvitys suomen tai ruotsin kielen taidostaan, 17 b §:ssä tarkoitettu selvitys yhteiskuntatiedon osoittamisesta ja 13 §:n 1 momentin 5 kohdassa tarkoitettu selvitys siitä, kuinka hän saa Suomessa toimeentulonsa. Kielitaitoselvitystä ei kuitenkaan tarvita, jos hakijana on alle 15-vuotias lapsi. Jos hakemuksessa on 15 vuotta täyttänyt kanssahakija, hakijan on liitettävä hakemukseensa selvitys myös tämän suomen tai ruotsin kielen taidosta. Jos lapsi täyttää 15 vuotta hakemuksen vireillepanon jälkeen mutta ennen sen ratkaisemista, selvitys hänen kielitaidostaan on liitettävä hakemukseen.&nbsp;&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 .&nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Mitä 13 §:n 1 momentin 7 kohdassa säädetään, ei sovelleta sellaisiin hakemuksiin, jotka on tehty kahden kuukauden kuluessa tämän lain voimaantulosta. &nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Tämän lain voimaan tullessa vireillä olleeseen kansalaisuushakemukseen sovelletaan tämän lain voimaan tullessa voimassa olleita säännöksiä. &nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">2.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">Maahanmuuttovirastosta annetun lain 2 §:n muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span>Maahanmuuttovirastosta annetun lain (156/1995) 2 §:n 2 momentin 4 kohta, sellaisena kuin se on laissa 621/2020, &nbsp;\n     \u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">lisätään\u003C/span> 2 §:n 2 momenttiin, sellaisena kuin se on laissa 621/2020, uusi 5 kohta seuraavasti:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">2 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Tehtävät&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"Katkoviiva\">\n       \u003Cspan class=\"sr-only\">Ponsiosa&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Maahanmuuttovirasto vastaa:&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) ihmiskaupan uhrien auttamisen toimeenpanon ohjauksesta;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) kansalaisuuskokeen yleisestä hallinnosta, valvonnasta ja kehittämisestä.\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"edk-LakiehdotusNumeroKooste\">3.&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Laki&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain 1 §:n muuttamisesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Eduskunnan päätöksen mukaisesti &nbsp;\u003C/div>\n     \u003Cdiv class=\"SaadosKappaleKooste\">\n      \u003Cspan class=\"SaadosKursiiviKooste\">muutetaan \u003C/span>henkilötietojen käsittelystä maahanmuuttohallinnossa annetun lain (615/2020) 1 §:n 1 momentin 2 kohta, sellaisena kuin se on laissa 683/2023, seuraavasti:&nbsp;\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">1 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Lain soveltamisala ja henkilötietojen käsittelyn tarkoitus&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Tätä lakia sovelletaan, jollei muualla laissa toisin säädetä, henkilötietojen kokonaan tai osittain automatisoituun käsittelyyn sekä muuhun henkilötietojen käsittelyyn, kun henkilötiedot muodostavat tai niiden on tarkoitus muodostaa henkilörekisteri tai sen osa ja henkilötietoja käsitellään seuraavissa tarkoituksissa:&nbsp;\u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) Suomen kansalaisuuden saamista, säilyttämistä, menettämistä ja kansalaisuudesta vapautumista sekä kansalaisuusaseman määrittämistä koskevien asioiden käsittely ja päätöksenteko sekä kansalaisuuskokeen yleinen hallinto ja valvonta; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"Katkoviiva\">\n        \u003Cspan class=\"sr-only\">&nbsp;Muuttamaton osa säädöstekstistä on jätetty pois&nbsp;\u003C/span>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä laki tulee voimaan päivänä kuuta 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Keskiviiva\">\n     \u003Cspan class=\"sr-only\">&nbsp;Lakiehdotus päättyy&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"AllekirjoitusOsa\" class=\"AllekirjoitusOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingissä 16.4.2026&nbsp;\u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">Pääministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Petteri&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Orpo&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Allekirjoittaja\">\n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"AsemaTeksti\">Sisäministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Mari&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Rantanen&nbsp;\u003C/span>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"LiiteOsa\" class=\"LiiteOsa\">\n   \u003Cdiv class=\"LiiteNimi\">\u003C/div>\n   \u003Cdiv class=\"Saados\">\n    \u003Ch3>\u003Cspan class=\"SaadosNimeke\">\u003Cspan class=\"edk-SaadostyyppiKooste\">Valtioneuvoston asetus&nbsp;\u003C/span>\u003Cspan class=\"SaadosNimekeKooste\">kansalaisuuskokeesta&nbsp;\u003C/span>\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"Johtolause\">\n     \u003Cdiv class=\"SaadosKappaleKooste\">Valtioneuvoston päätöksen mukaisesti säädetään kansalaisuuslain (359/2003) nojalla, sellaisena kuin se on laissa …/…: &nbsp;\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Pykalisto\">\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">1 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen sisältö&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuskokeessa on vähintään 20 ja enintään 40 kysymystä. Kokeen hyväksytty suoritus edellyttää sitä, että vähintään 70 prosenttia vastauksista on valittu oikein. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">2 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Kansalaisuuskokeen järjestäjän tehtäviä koskevan sopimuksen sisältö&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Kansalaisuuskokeen järjestämistä koskevasta sopimuksesta tulee käydä ilmi ainakin seuraavat asiat kansalaisuuslain 25 e §:ssä tarkoitetuista kansalaisuuskokeen järjestäjän tehtävistä:&nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) koetilaisuuksien järjestäminen kansalaisuuskokeen yleisinä suorituspäivinä;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) kokeen järjestämisen paikkakunnat; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) vapaita koepaikkoja koskevien tietojen ilmoittaminen kokeeseen ilmoittautumista varten; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) koemateriaalin käsittelystä huolehtiminen; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) koetilaisuuksien valvonnan järjestäminen teknisin keinoin ja valvojien avulla; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">6) Maahanmuuttoviraston myöntämien erityisjärjestelyjen toteuttaminen kokeeseen osallistuvan henkilön sairauden, vamman, lukemisen ja kirjoittamisen erityisvaikeuden tai muun niihin rinnastettavan syyn perusteella;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">7) tietojen antaminen Maahanmuuttovirastolle järjestyksen rikkomista tai vilpillistä menettelyä koskevan asian selvittämistä varten.\u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">3 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Asiantuntijatoimikunnan kokoonpano&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Kansalaisuuslain 25 f §:ssä tarkoitetussa asiantuntijatoimikunnassa on puheenjohtajan ja varapuheenjohtajan lisäksi vähintään kolme asiantuntijajäsentä, joista kullakin on henkilökohtainen varajäsen. Toimikunta voi tarpeen mukaan kuulla myös muita asiantuntijoita. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">4 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Asiantuntijatoimikunnan tehtävät &nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"KohdatMomentti\">\n       \u003Cdiv class=\"MomenttiJohdantoKooste\">Kansalaisuuslain 25 f §:n 2 momentissa tarkoitettuihin asiantuntijatoimikunnan tehtäviin kuuluu: &nbsp;\u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">1) seurata ja arvioida tilastoja kokeeseen osallistumisesta ja koetilaisuuksien riittävyydestä;\u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">2) seurata kansalaisuuskoetta koskevaa palautetta ja koesuorituksia koskevia tilastoja; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">3) seurata kotoutumisen edistämisestä annetun lain (681/2023) 25 §:n mukaisessa yhteiskuntaorientaatiossa käytettävän oppimateriaalin kehitystä; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">4) tehdä kansalaisuuskoejärjestelmän kehittämistä koskevia aloitteita; \u003C/span>&nbsp;\n       \u003C/div>\n       \u003Cdiv class=\"MomenttiKohtaKooste\">\n        \u003Cspan class=\"KoosteTeksti\">5) antaa Maahanmuuttovirastolle lausuntoja kansalaisuuskokeen sisältöä koskevista oikaisuvaatimuksista. \u003C/span>&nbsp;\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Ch5>\u003Cspan class=\"PykalaTunnusKooste\">5 §&nbsp;\u003C/span>\u003Cspan class=\"SaadosOtsikkoKooste\">Asiantuntijatoimikunnan asioiden käsittely&nbsp;\u003C/span>\u003C/h5>\n      \u003Cdiv class=\"MomenttiKooste\">Asiantuntijatoimikunta kokoontuu puheenjohtajan tai hänen ollessaan estyneenä varapuheenjohtajan kutsusta tai jos kaksi jäsentä sitä vaatii. &nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Asiantuntijatoimikunta laatii vuosittain työsuunnitelman ja toimintakertomuksen ja toimittaa ne Maahanmuuttovirastolle ja sisäministeriölle. &nbsp;\u003C/div>\n      \u003Cdiv class=\"MomenttiKooste\">Asiantuntijatoimikunnan hallinnolliset tehtävät hoidetaan Maahanmuuttovirastossa virkatyönä. &nbsp;\u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"Palstaviiva\">\n      \u003Cspan class=\"sr-only\">&nbsp;Voimaantulopykälä tai –säännös alkaa&nbsp;\u003C/span>\n     \u003C/div>\n     \u003Cdiv class=\"edk-pykala\">\n      \u003Cdiv class=\"MomenttiKooste\">Tämä asetus tulee voimaan päivänä kuuta 20 .&nbsp;\u003C/div>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-20564",nav:"\u003Cspan class=\"edk-title-h4\" id=\"SisallysluetteloTitle\">Sisällysluettelo\u003C/span>\n\u003Cul id=\"Sisallysluettelo\" class=\"navbar-nav nav\">\n \u003Cli>\u003Ca href=\"#IdentifiointiOsa\">Identifiointiosa\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#SisaltoKuvaus\">Asian kuvaus\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#PerusteluOsaPerustelut\">Perustelut\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#PonsiOsa\">Ponsiosa\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#SaadosOsa\">Säädösosa\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#AllekirjoitusOsa\">Allekirjoittajat\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"#LiiteOsa\">Liiteosa\u003C/a>\u003C/li>\n\u003C/ul>\n\u003Cspan class=\"edk-title-h4\" id=\"MuutEsitysmuodotTitle\">Muut esitysmuodot\u003C/span>\n\u003Cul id=\"MuutEsitysmuodot\" class=\"navbar-nav nav\">\n \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/edktunnus/EDK-2026-AK-20564/pdf\" class=\"navilink\">Asiakirjan painoasu (PDF)\u003C/a>\u003C/li>\n \u003Cli>\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/handlingar/eduskuntatunnus/RP%2054%2F2026%20rd\" class=\"navilink\">Dokumentet på svenska\u003C/a>\u003C/li>\n\u003C/ul>\n\u003Cspan class=\"edk-title-h4\" id=\"KasittelytiedotTitle\">Käsittelytiedot\u003C/span>\n\u003Cul id=\"Kasittelytiedot\" class=\"navbar-nav nav\">\n \u003Cli>\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/HE%2054%2F2026%20vp\" class=\"navilink\">HE 54/2026 vp\u003C/a>\u003C/li>\n\u003C/ul>"},uses:{params:["edktunnus"]}}],
							form: null,
							error: null
						});
					});
				}
