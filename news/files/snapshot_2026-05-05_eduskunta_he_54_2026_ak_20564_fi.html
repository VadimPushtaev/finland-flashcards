ten tarpeidensa mukaisesti myös muuta kuin perusopetusta sekä kehittää itseään varattomuuden sitä estämättä. Tieteen, taiteen ja ylimmän opetuksen vapaus on turvattu.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettavilla muutoksilla ei olisi vaikutusta perusopetukseen, oppivelvollisuuteen, varhaiskasvatukseen, esiopetukseen eikä korkeakouluopintoihin, koska nämä eivät riipu Suomen kansalaisuuden saamisesta.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oikeus sosiaaliturvaan\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 19 §:n mukaan jokaisella, joka ei kykene hankkimaan ihmisarvoisen elämän edellyttämää turvaa, on oikeus välttämättömään toimeentuloon ja huolenpitoon. Lailla taataan jokaiselle oikeus perustoimeentulon turvaan työttömyyden, sairauden, työkyvyttömyyden ja vanhuuden aikana sekä lapsen syntymän ja huoltajan menetyksen perusteella. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettavilla muutoksilla ei olisi vaikutusta sosiaaliturvan toteutumiseen, koska oikeus sosiaaliturvaan ei riipu Suomen kansalaisuuden saamisesta.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Oikeus kansalaisuuteen\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 5 §:n mukaan Suomen kansalaisuus saadaan syntymän ja vanhempien kansalaisuuden perusteella sen mukaan kuin lailla tarkemmin säädetään. Kansalaisuus voidaan myöntää laissa säädetyin edellytyksin myös ilmoituksen tai hakemuksen perusteella. Suomen kansalaisuudesta voidaan vapauttaa vain laissa säädetyillä perusteilla ja sillä edellytyksellä, että henkilöllä on tai hän saa toisen valtion kansalaisuuden.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">YK:n ihmisoikeuksien yleismaailmallisen julistuksen 15 artiklan mukaan jokaisella on oikeus kansalaisuuteen. Keltään ei saa mielivaltaisesti riistää kansalaisuutta eikä evätä oikeutta kansalaisuuden vaihtamiseen. Oikeus kansalaisuuteen sisältyy myös useiden kansainvälisten sopimusten määräyksiin. Se on mainittu esimerkiksi eurooppalaisen kansalaisuutta koskevan yleissopimuksen (SopS 94/2008, \u003Cspan class=\"KursiiviTeksti\">kansalaisuusyleissopimus\u003C/span>) periaatteissa. Kansalaisuusyleissopimuksen perustelumuistion\u003Cspan class=\"AlaviiteKooste\"> Explanatory Report to the European Convention on Nationality (), s. 9.\u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://rm.coe.int/16800ccde7\">https://rm.coe.int/16800ccde7\u003C/a>\u003C/span>\u003C/span>\u003C/span> mukaan oikeus kansalaisuuteen näkyy sopimuksessa erityisesti sellaisten määräysten taustalla, jotka koskevat kansalaisuudettomuuden välttämistä. Oikeus johonkin tiettyyn kansalaisuuteen riippuu puolestaan kunkin valtion kansalaisuutta koskevista säännöksistä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettava uusi yhteiskuntatietoedellytys ja siihen liittyvä kansalaisuuskoe vaikuttaisivat mahdollisuuteen saada kansalaisuus hakemuksen perusteella. Esityksessä ei ehdoteta muutoksia kansalaisuuden saamiseen syntymän ja vanhempien kansalaisuuden perusteella eikä kansalaisuuden menettämiseen. Ehdotettavilla muutoksilla ei ole vaikutusta kansalaisuudettomuuden välttämiseen eikä kansalaisuudettomaksi jättämisen kieltoon, joka sisältyy sekä perustuslain 5 §:ään että kansalaisuuslain 4 §:ään. Kansalaisuuslakiin ehdotettavat muutokset eivät tältä osin vaikuttaisi siihen, miten oikeus kansalaisuuteen toteutuu jatkossa. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Uusi yhteiskuntatietoedellytys koskisi lähtökohtaisesti myös kansalaisuudettomia henkilöitä. Kansalaisuudettomilta vaadittava asumisaika säilyy jatkossakin yleistä lyhyempänä (kansalaisuuslaki 20 §). Lisäksi kansalaisuudettomien henkilöiden kansalaisuushakemukset on käsiteltävä 20 a §:n mukaisesti kiireellisenä ja viimeistään vuoden määräajan kuluessa. &nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.4.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yksityiselämän ja henkilötietojen suoja\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Perustuslain 10 §:ssä säädetään yksityiselämän suojasta. Pykälän 1 momentin mukaan jokaisen yksityiselämä, kunnia ja kotirauha on turvattu. Henkilötietojen suojasta säädetään tarkemmin lailla. Henkilötietojen suoja kuuluu siten osaksi perustuslain 10 §:n 1 momentilla turvattua yksityiselämän suojaa. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuushakemuksen käsittelyyn sisältyy nykyisinkin henkilötietojen käsittelyä arvioitaessa sitä, täyttääkö kansalaisuutta hakeva henkilö kansalaistamiselle säädetyt edellytykset. Näistä edellytyksistä poikkeamista koskevia pyyntöjä arvioitaessa käsitellään myös arkaluonteisia henkilötietoja, esimerkiksi hakijan pyydettyä kielitaitoedellytyksestä poikkeamista terveydentilan tai vammaisuuden perusteella. Uuteen yhteiskuntatietoedellytykseenkin liittyisi mahdollisuus poikkeamiseen tällaisella perusteella. Tällaiseen poikkeamisperusteeseen vetoavan olisi, kuten nykyisinkin, liitettävä hakemukseensa lääkärintodistus tai muu selvitys. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan paitsi uutta yhteiskuntatietoedellytystä, myös kokonaan uutta kansalaisuuskoejärjestelmää, jonka toteutuksesta huolehtivien toimijoiden olisi niin ikään käsiteltävä kokeeseen osallistuvien henkilötietoja. Kokeen suorittamiseen tarvittavien erityisjärjestelyjen vuoksi kokeen yhteydessä olisi eräissä tilanteissa käsiteltävä myös henkilön terveydentilaa tai vammaisuutta koskevia tietoja. Kansalaisuuskokeeseen liittyvät tietosuojariskit koskisivat siten sellaisia tietoja kuin esimerkiksi henkilön nimi ja kansalaisuus sekä terveydentila ja vammaisuus. Tällaisten tietojen käsittelyä koskevilla toimilla olisi hallittava esimerkiksi riskejä siitä, että tällaisia tietoja käsiteltäisiin muihin kuin kansalaisuuskokeen edellyttämiin tarkoituksiin tai että tietoja päätyisi ulkopuolisten käyttöön. Tietosuojariskien hallinta liittyisi niin tietojärjestelmiin kuin myös sellaisiin toimijoihin ja henkilöihin, joiden tehtäviin kuuluisi kansalaisuuskokeeseen osallistuvien henkilötietojen käsittelyä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Uuden kansalaisuuskoejärjestelmän yleinen hallinto, tietojärjestelmäkokonaisuus ja valvonta kuuluisivat ehdotuksen mukaan Maahanmuuttoviraston vastuulle. Viraston tehtäviin sisältyy jo mm. edellä mainittu kansalaisuushakemusten käsittely ja kansalaisuutta koskeva päätöksenteko. Tähän tarkoitukseen käytetään ulkomaalaisasioiden asiankäsittelyjärjestelmää, jonka ylläpito- ja kehitysvastuu kuuluu niin ikään Maahanmuuttovirastolle (laki Maahanmuuttovirastosta 2 § 3 mom.). Kansalaisuuskoejärjestelmään liittyviä riskejä hallittaisiin niin kokeen toteutuksessa käytettävän tietojärjestelmäkokonaisuuden teknisten ominaisuuksien kuin myös sen käytön valvonnan avulla. Olennaista olisi myös tarvittavan koulutuksen ja ohjeistuksen antaminen kaikille niille, joiden tehtäviin kuuluisi kansalaisuuskokeeseen osallistuvien henkilötietojen käsittelyä. Tietosuojariskien hallinnan keinoihin lukeutuisi lisäksi mm. täsmällinen sääntely siitä, millaisia edellytyksiä kansalaisuuskokeen toteutukseen osallistuville toimijoille asetettaisiin, sekä erityisiin henkilötietoryhmiin kuuluvien tietojen käsittelyn rajaaminen välttämättömään ja säännökset tällaisten tietojen poistamisesta välittömästi niiden käytyä tarpeettomiksi. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Esitykseen sisältyviä ehdotuksia käsitellään tietosuojan näkökulmasta yksityiskohtaisesti jäljempänä (11.3).&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset kotoutumiseen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Tutkimustiedon mukaan kansalaisuuden saamisella ja kotoutumisella on havaittu olevan yhteyttä.\u003Cspan class=\"AlaviiteTeksti\"> Esim. Gathmann &amp; Garbers 2023: Citizenship and integration, Labour Economics 82:2023.\u003C/span> Kolmessa vaiheessa toteutettavia muutoksia kansalaisuuden saamiseen on aiheellista tarkastella siitä näkökulmasta, miten muutokset vaikuttavat kotoutumiseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kun kansalaisuuteen vaadittavaa asumisaikaa pidennettiin yleisesti kahdeksaan vuoteen, myös kielitaidon hankkimiseen liittyvää kannustinta korostettiin samalla aikaisempaan verrattuna. Tuolloin lakia muutettiin siten, että kansalaisuuden voi saada jopa kolme vuotta ennen yleisen asumisaikaedellytyksen täyttymistä, jos kielitaitoedellytys täyttyy sitä ennen. Tällaisella asumisajan muutoksella arvioitiin olevan kotoutumista edistävää vaikutusta sillä tavoin, että lyhyempi asumisaika kannustaisi kielitaidon nopeaan hankkimiseen.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Asumisajan muutosten jälkeen kansalaistamisen edellytykseksi lisättiin vaatimus turvatusta toimeentulosta. Sen keskeisenä sisältönä on, että hakija ei ole saanut yli kolmen kuukauden ajan työttömyysetuutta eikä toimeentulotukea niiden kahden vuoden aikana, jotka edeltävät kansalaisuuden myöntämistä. Muutoksessa huomioitiin, että Suomeen muuttaneiden henkilöiden kotoutuminen etenee ajan kuluessa. Työtulot ja työllisyys kehittyvät Suomessa asumisen aikana myös sellaisilla henkilöillä, joilta ei ole oleskeluluvan yhteydessä edellytetty turvatun toimeentulon osoittamista. Kahden vuoden ajanjaksosta arvioitiin seuraavan, että esimerkiksi työttömänä ollut henkilö pystyisi työllistyttyään täyttämään uuden toimeentuloedellytyksen kohtuullisen ajan kuluessa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kuten edellisessä kansalaisuuslain muuttamista koskevassa hallituksen esityksessä (HE 19/2025 vp, s. 7–8) on todettu, kansalaisuuden saamista koskevan sääntelyn ja kotoutumisen välistä yhteyttä voidaan lähestyä eri näkökulmista. Uusi yhteiskuntatietoedellytys ja kansalaisuuskokeen käyttöönotto ovat osa kansalaisuuslain muutosten kokonaisuutta, jossa on lähtökohtana, että Suomen kansalaisuuden saaminen edellyttää onnistunutta kotoutumista. Uusi edellytys täydentäisi kansalaistamiselle voimassa olevassa laissa säädettyjä edellytyksiä ja ilmentäisi osaltaan ajatusta maan keskeisten olosuhteiden tuntemisesta ennen kansalaisuuden saamista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen oppimateriaali perustuisi sellaiseen valtakunnalliseen oppimateriaaliin, joka on laadittu käytettäväksi kuntien kotoutuja-asiakkaille järjestettävässä yhteiskuntaorientaatiossa.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali\">https://yhteiskuntaorientaatio.fi/oppimateriaali\u003C/a>\u003C/span>\u003C/span>\u003C/span> Kotoutumisen edistämisestä annetun lain 25 §:n perusteella kunnan on järjestettävä kotoutuja-asiakkaille yhteiskuntaorientaatio, jonka sisältöön kuuluu tietoa mm. suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Yhteiskuntaorientaation sisällöstä on säädetty tarkemmin valtioneuvoston asetuksella. Yhteiskuntaorientaatiota varten laaditun oppimateriaalin myötä kansalaisuuskokeen sisällöllä olisi vahva yhteys juuri sellaisiin toimiin, jotka on tarkoitettu kotoutumisen edistämiseen. Kansalaisuuskokeeseen valmistautumisella voisi siksi olla myönteistä vaikutusta kotoutumiseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeessa kysyttäisiin perustietoja suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Kysymykset koskisivat keskeisiä ja perustavanlaatuisia tietoja näistä aiheista. Kokeessa ei testattaisi hyvin pieniä yksityiskohtia koskevien tietojen hallintaa, vaan kansalaisuutta varten edellytettäisiin sellaisia yleisiä tietoja, joita voitaisiin pitää tarpeellisina tulevalle Suomen kansalaiselle. Kansalaisuuskokeen kysymykset kattaisivat sellaisia aiheita kuin suomalaisen yhteiskunnan keskeinen lainsäädäntö sekä perus- ja ihmisoikeudet. Kokeessa voisi olla oppimateriaalin tietoja koskevia kysymyksiä esimerkiksi yhdenvertaisuudesta, sukupuolten tasa-arvosta sekä Suomen historiasta ja kulttuurista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Myönteinen vaikutus kotoutumiseen olisi myös ylioppilastutkinnon suorittamisella, joka olisi yksi mahdollinen tapa yhteiskuntatiedon osoittamiseen. Ylioppilastutkinto suoritetaan mm. yhteiskuntaopin opintoja sisältävän lukiokoulutuksen lopuksi. Lukion yhteiskuntaopin tarkoituksena on syventää opiskelijan käsitystä ympäröivästä yhteiskunnasta ja antaa hänelle valmiuksia kasvaa yhteiskunnallisista asioista kiinnostuneeksi aktiiviseksi ja osallistuvaksi kansalaiseksi. Lukion yhteiskuntaopin arvopohjassa korostuvat demokratian peruslähtökohdat, mukaan lukien tasa-arvo ja ihmisoikeuksien kunnioittaminen. Tällaista yhteiskuntaopin sisältöä voidaan pitää erityisen sopivana siitä näkökulmasta, että osa perustuslain mukaisista poliittisista oikeuksista liittyy nimenomaan Suomen kansalaisuuteen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Uusi yhteiskuntatietoedellytys olisi joiltakin osin samankaltainen kansalaisuuteen liittyvä kannustin kuin jo olemassa oleva kielitaitoedellytys. Kansalaisuuskokeen voisi käytännössä suorittaa silloin, kun kokisi itse olevansa siihen valmis. Kielitaidon ja jatkossa myös yhteiskuntatiedon osoittamisen ajankohta vaikuttaisi osaltaan siihen, milloin kansalaisuuden voisi saada. Tästä näkökulmasta uusi yhteiskuntatietoedellytys ja kansalaisuuskoe sisältäisivät kotoutumisen kannalta myönteistä kannustinvaikutusta.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.6&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset turvallisuuteen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Asumisajan muutosten yhteydessä arvioitiin, että asumisajan pidentämisen myötä hakijasta voi olla käytössä sellaisia kansallisen turvallisuuden kannalta merkityksellisiä tietoja, joiden kertyminen voi kestää kauemmin. Asumisajan muutosten vaikutus kansalliseen turvallisuuteen arvioitiin tältä osin myönteiseksi. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuslain muutosten toisessakin vaiheessa tehtiin turvallisuuteen vaikuttavia muutoksia. Hakemusmenettelyyn jo aiemmin sovellettuja säännöksiä laajennettiin myös ilmoitusmenettelyyn siten, että kansallinen turvallisuus huomioidaan sekä hakemus- että ilmoitusmenettelyssä. Selvitettyä henkilöllisyyttä koskeviin säännöksiin tehtiin puolestaan sellainen muutos, jonka tarkoituksena on osaltaan kannustaa hakijoita henkilöllisyyttä koskevan asiakirjanäytön esittämiseen. Lisäksi tehtiin muutoksia kansalaisuuden menettämistä koskeviin säännöksiin. Ehdotettavien muutosten myötä kansalaisuuden menettämisestä voidaan päättää jonkin verran aiempaa laajemmin, jos henkilö on syyllistymällä maanpetos-, valtiopetos- tai terrorismirikokseen vakavasti vaarantanut Suomen elintärkeitä etuja. Näillä kansalaisuuden saamiseen ja menettämiseen tehdyillä muutoksilla arvioitiin olevan myönteisiä vaikutuksia kansalliseen turvallisuuteen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaistamiselle uutta yhteiskuntatietoedellytystä sekä uuden kansalaisuuskokeen käyttöönottoa. Ehdotettavan edellytyksen myötä kansalaisuuden saamista varten vaadittaisiin yhteiskuntaa koskevien tietojen osoittamista. Jotta Suomen kansalaisuus voitaisiin myöntää hakemuksen perusteella, hakijan olisi pitänyt osoittaa hankkineensa perustiedot suomalaisen yhteiskunnan toiminnasta ja yksilön oikeuksista ja velvollisuuksista. Uusi edellytys täydentäisi kansalaistamiselle voimassa olevassa laissa säädettyjä edellytyksiä ja ilmentäisi osaltaan ajatusta maan keskeisten olosuhteiden tuntemisesta ennen kansalaisuuden saamista. Yhteiskuntaa koskevan tiedon edellyttämisellä voi olla välillisesti myönteistä vaikutusta myös turvallisuuteen. Kansalaisuuskokeen suorittamista varten olisi perehdyttävä yhteiskuntaorientaation oppimateriaalin pohjalta laaditun oppimateriaalin sisältöihin ja valmistauduttava vastaamaan kysymyksiin mm. Suomen keskeisestä lainsäädännöstä. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.7&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset sukupuolten tasa-arvon toteutumiseen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Asumisajan muutosten ei arvioitu vaikuttavan sukupuolten tasa-arvon toteutumiseen. Vuonna 2022 naisten osuus kaikista kansalaistetuista oli 55 % ja miesten 45 %. Asumisajan pidentämisen ei arvioitu vaikuttavan esimerkiksi erityisesti miehiin tai naisiin. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Toimeentuloedellytyksen tai muiden toisessa vaiheessa tehtyjen muutosten ei niin ikään arvioitu vaikuttavan erityisesti miehiin tai naisiin. Hallituksen esityksessä (HE 19/2025 vp, s. 45–46) todettiin työllisyyttä ja koulutusta koskevien tietojen perusteella, että näihin liittyvä sukupuolten välinen ero kaventuu Suomessa asuttujen vuosien aikana. Miehet osallistuvat työhön tai koulutukseen naisia enemmän erityisesti ensimmäisten Suomessa vietettyjen vuosien aikana, mutta naisilla työllisten osuuden kasvu on kuitenkin huomattavan nopeaa. Kymmenen maassa asutun vuoden jälkeen lähes 70 % naisista on työllisiä, mikä on enää 10 prosenttiyksikköä vähemmän kuin miehillä. Kymmenen Suomessa asutun vuoden jälkeen taas tutkintoon johtavassa koulutuksessa olevien naisten osuus on miehiä suurempi. Turvatun toimeentulon vaatimuksen ei sen vuoksi arvioitu vaikuttavan sukupuolten tasa-arvon toteutumiseen, kun otettiin huomioon, että toimeentuloedellytyksen tarkastelujakso ajoittuu kansalaistamista välittömästi edeltäviin kahteen vuoteen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan kansalaistamiselle uutta yhteiskuntatietoedellytystä sekä uuden kansalaisuuskokeen käyttöönottoa. Yhteiskuntatietoedellytys koskisi lähtökohtaisesti kaikkia kansalaisuuden hakemisesta kiinnostuneita työikäisiä. Vaadittavan yhteiskuntatiedon voisi kansalaisuutta varten osoittaa ylioppilas- tai korkeakoulututkinnolla tai erityisellä kansalaisuuskokeella. Kansalaisuuskoe perustuisi kansalaisuuskokeen oppimateriaaliin, joka laadittaisiin kuntien kotoutuja-asiakkaiden yhteiskuntaorientaatiota varten laaditun oppimateriaalin pohjalta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskoe olisi sama miehille ja naisille. Tarkoituksena olisi se, että kaikilla 18–64-vuotiailla olisi mahdollisuus kansalaisuuskokeen suorittamiseen sukupuolesta riippumatta. Kansalaisuuskokeen kysymysten aiheisiin kuuluisi mm. yksilön oikeudet ja velvollisuudet sekä sukupuolten tasa-arvo. Kansalaisuuskokeeseen valmistautumisella ja siihen käytettävään oppimateriaaliin perehtymisellä voisi olla välillisesti myönteistä vaikutusta sukupuolten tasa-arvon toteutumiseen. Yhteiskuntaorientaation oppimateriaaliin, jonka pohjalta kansalaisuuskokeen oppimateriaali laadittaisiin, sisältyy oma osionsa tasa-arvosta ja yhdenvertaisuudesta.\u003Cspan class=\"AlaviiteKooste\"> Osiossa kerrotaan mm. sukupuoleen liittyvän syrjinnän kiellosta ja naisten asemasta työelämässä ().\u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://yhteiskuntaorientaatio.fi/oppimateriaali/lait-ja-oikeus/tasa-arvo-ja-yhdenvertaisuus\">https://yhteiskuntaorientaatio.fi/oppimateriaali/lait-ja-oikeus/tasa-arvo-ja-yhdenvertaisuus\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kunnan kotoutuja-asiakkaina yhteiskuntaorientaatioon osallistuneet olisivat käytännössä tutustuneet kansalaisuuskokeen aiheisiin osittain myös jo ennen kansalaisuuskokeeseen valmistautumista. Yhteiskuntaorientaatioon otetaan mukaan mm. kotivanhempia, millä pyritään vahvistamaan kotona lapsia hoitavien vanhempien ja etenkin naisten kotoutumista suomalaiseen yhteiskuntaan. Kansalaisuuskokeen ja sen oppimateriaalin perustuminen yhteiskuntaorientaation oppimateriaaliin voi siksi jonkin verran edistää naisten mahdollisuuksia kokeen suorittamiseen ja vaikuttaa siten myönteisesti sukupuolten tasa-arvon toteutumiseen. Tällä on merkitystä erityisesti sen vuoksi, että esimerkiksi hoivavastuun jakautuminen perheissä voi osaltaan vaikuttaa mahdollisuuksiin valmistautua kokeeseen ja siten myös kokeen suorittamisen ja kansalaisuuden saamisen ajankohtaan. Yhteiskuntaorientaatioon perustuvalla kansalaisuuskokeella voidaan pyrkiä edistämään tasa-arvoisia mahdollisuuksia kokeen suorittamiseen. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset eri ihmisryhmiin\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Alla tarkastellaan esityksen vaikutuksia ihmisryhmittäin. Nämä ryhmät voivat olla myös osittain päällekkäisiä. &nbsp;\u003C/p>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset perheisiin ja lapsiin\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Asumisajan pidentämisen arvioitiin vaikuttavan lapsiin erityisesti sitä kautta, että lapset saavat kansalaisuuden useimmiten kanssahakijoina yhdessä huoltajansa kanssa. Vuonna 2022 lasten osuus kaikista kansalaistetuista oli noin 28 %. Suomen kansalaisten puolisoiden osuus vuonna 2022 kansalaistetuista henkilöistä oli noin 13 %. Asumisaikaan hyväksyttäviä ulkomaanpäiviä vähennettiin, minkä arvioitiin voivan vaikuttaa joissakin tilanteissa toisen vanhemman taustamaahan matkustamiseen tai kansalaisuuden saamiseen. Säännösten arvioitiin kuitenkin yhä mahdollistavan sekä kansalaisuuden saamisen että sellaisia ulkomaanmatkoja toisen vanhemman taustamaahan, joilla on merkitystä lapsen identiteetin ja kielitaidon sekä sukulaisuussuhteiden kannalta. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Seuraavassa vaiheessa tehtiin muutoksia mm. kansalaisuutta varten vaadittavaan toimeentuloon. Turvatun toimeentulon vaatimuksesta seurasi, että pääasiassa työttömyysetuudella tai toimeentulotuella elävä henkilö ei lähtökohtaisesti voi saada kansalaisuutta. Muutosten arvioitiin vaikuttavan työttöminä olevien vanhempien koko perheen mahdollisuuksiin saada kansalaisuus. Jos työttömänä oleva vanhempi ei täytä toimeentuloedellytystä ja hänen hakemukseensa tehdään kielteinen päätös, eivät kanssahakijoina olevat lapsetkaan saa Suomen kansalaisuutta. Olennaiseksi muodostuu se, onko hakijana oleva lasten huoltaja saanut työttömyysetuutta tai toimeentulotukea yli kolmen kuukauden ajan viimeksi kuluneiden kahden vuoden aikana. Toimeentuloedellytys voi täyttyä myös siten, että hakija saa toimeentulonsa puolisonsa työskentelyn tai yritystoiminnan perusteella, jos hänen ei itse ole tarvinnut turvautua työttömyysetuuteen tai toimeentulotukeen muuten kuin tilapäisesti. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan uutta yhteiskuntatietoedellytystä sekä yhteiskuntatiedon osoittamiseen tarkoitetun kansalaisuuskokeen käyttöönottoa. Nämä muutokset koskisivat ennen kaikkea aikuisia työikäisiä henkilöitä. Kansalaisuuskoe vaikuttaisi siten lasten kansalaisuuden saamisen mahdollisuuteen välillisesti sitä kautta, että lapset voisivat lähtökohtaisesti saada kansalaisuuden yhdessä vanhempansa kanssa vain, jos vanhempi olisi ensin läpäissyt kansalaisuuskokeen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Uusi yhteiskuntatietoedellytys ja siihen liittyvä kansalaisuuskoe eivät koskisi lapsia eli alle 18-vuotiaita henkilöitä. Vanhempansa kansalaisuushakemuksen yhteydessä kanssahakijana olevalta lapselta ei edellytettäisi yhteiskuntatiedon osoittamista. Hakijana olevalla lapsella (24 §) ei niin ikään olisi yhteiskuntatietoedellytystä. Yhteiskuntatietoedellytys koskisi sen sijaan kanssahakijan vanhempaa. Edellytyksen täyttymisen voisi ehdotuksen mukaan osoittaa kansalaisuuskokeella tai ylioppilas- tai korkeakoulututkinnolla. Lähtökohtana säilyisi edelleenkin se, että hakijan olisi täytettävä kansalaistamisen edellytykset, jotta hän ja hänen mahdolliset kanssahakijansa voisivat saada kansalaisuuden. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Suomessa vakinaisesti asuvat lapset ovat oppivelvollisia 18 vuoden täyttämiseen asti. Lapset eli alle 18-vuotiaat käyvät siten vielä koulua, minkä vuoksi heiltä ei olisi tarpeen vaatia erillisen kansalaisuuskokeen suorittamista. Toisaalta voidaan myös pitää lapsen edun mukaisena, että hänen vanhemmallaan on perustiedot suomalaisen yhteiskunnan toiminnasta sekä yksilön oikeuksista ja velvollisuuksista. Ehdotettavien muutosten myötä näiden tietojen osoittamista edellytettäisiin jatkossa lähtökohtaisesti kaikilta työikäisiltä aikuisilta, jotta kansalaisuus voitaisiin myöntää hakemuksen perusteella. Myös kansalaisuutta itselleen ja lapsilleen hakevien vanhempien olisi siten osoitettava kansalaisuuskokeella tai ylioppilas- tai korkeakoulututkinnolla, että he ovat hankkineet keskeiset tiedot suomalaisesta yhteiskunnasta. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Maahanmuuttovirasto voisi ehdotuksen mukaan myöntää hakijana olevalle vanhemmalle kansalaisuuskokeen suorittamiseen sellaisia erityisjärjestelyjä, joita tämä tarvitsisi mm. vammaisuutensa perusteella. Lisäksi yhteiskuntatietoedellytyksestä voitaisiin ehdotuksen mukaan poiketa mm. sellaisen vammaisuuden perusteella, joka pitkäaikaisesti estäisi hakijaa täyttämästä edellytystä. Yhteiskuntatietoedellytys ja kansalaisuuskoe eivät siten muodostuisi esteeksi lapsen kansalaisuuden saamiselle hänen vanhempansa vammaisuuden vuoksi. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Vuonna 2025 tehtiin yhteensä 11&nbsp;237 kansalaisuushakemusta, joista 3&nbsp;535 oli kanssahakijoina olevien lasten hakemuksia. Vuonna 2024 hakemuksia tuli puolestaan vireille yhteensä 17&nbsp;063, joista 5&nbsp;255 oli kanssahakijoina olevien lasten hakemuksia. Kansalaisuus myönnettiin vuonna 2025 kansalaisuushakemuksen perusteella yhteensä 13&nbsp;483 henkilölle, joista 3 975 oli kanssahakijana olevia lapsia. Vuonna 2024 kansalaisuus myönnettiin 12&nbsp;417 henkilölle, joista kanssahakijana olevia lapsia oli 3&nbsp;622. Vuosina 2024 ja 2025, jolloin kansalaistamisen edellytyksiin ei ole kuulunut yhteiskuntatietoedellytystä, kansalaisuuden on siten saanut vuosittain alle 4&nbsp;000 kanssahakijana ollutta lasta. Näiden tilastojen perusteella voidaan arvioida, että yhteiskuntatietoedellytys vaikuttaisi vuosittain välillisesti noin 4&nbsp;000 lapseen, jonka vanhemman olisi kansalaisuuden saadakseen täytettävä uusi yhteiskuntatietoedellytys. Kanssahakijoille tehtyjen kielteisten päätösten määrä oli vuonna 2025 yhteensä 514 ja vuonna 2024 yhteensä 350. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Taulukko 5: Vanhempiensa kansalaisuushakemuksessa kanssahakijana olleet lapset vuosina 2024–2025. &nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10A42\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Kanssahakijana olleet lapset / vuosi\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2024\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2025\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kansalaisuutta hakeneet &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">5 255&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">3 535&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kansalaistetut &nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">3 622&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">3 975&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Kielteisen päätökset saaneet&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">350&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">514&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Uusi yhteiskuntatietoedellytys ei välttämättä lisäisi merkittävästi kanssahakijoina olevia lapsia koskevien kielteisten päätösten määrää. Uusi edellytys siihen liittyvine kansalaisuuskokeineen voi kuitenkin vaikuttaa osaan lasten vanhemmista siten, että he lykkäisivät kansalaisuuden hakemista itselleen ja lapsilleen. Kansalaisuuskoe olisi toisaalta yleisesti saatavilla olevaan oppimateriaaliin perustuva monivalintakoe, jonka kysymykset koskisivat oppimateriaaliin sisältyviä keskeisiä tietoja. Kansalaisuuskokeen oppimateriaali olisi laadittu olemassa olevan yhteiskuntaorientaation valtakunnallisen oppimateriaalin pohjalta. Tarkoituksena olisi se, että uusi yhteiskuntaedellytys ei muodostaisi kohtuutonta vaatimusta myöskään sellaisille henkilöille, joilla olisi lapsia ja jotka olisivat kiinnostuneita hakemaan kansalaisuutta. Jos lapsi ei kuitenkaan saisi kansalaisuutta vanhempansa kanssahakijana ja hän täyttäisi 18 vuotta, hän voisi tietyin edellytyksin saada kansalaisuuden nuoren henkilön kansalaisuusilmoituksen perusteella (kansalaisuuslaki 28 §), jolloin hänen ei itse tarvitsisi täyttää yhteiskuntatietoedellytystä täysi-ikäiseksi tultuaankaan.\u003Cspan class=\"AlaviiteTeksti\"> Nuoren henkilön kansalaisuusilmoitus on tarkoitettu Suomessa pitkään asuneille 18–22-vuotiaille.\u003C/span>&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset kansainvälistä suojelua saaviin ja kansalaisuudettomiin henkilöihin\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Kansainvälistä suojelua saavien asumisaikaa koskevan poikkeuksen poistamisen arvioitiin vaikuttavan siten, että eräiltä hakijoilta vaadittava asumisaika kaksinkertaistuisi, ellei käsillä olisi joitakin muita perusteita asumisajasta poikkeamiseen. Kansainväliseen suojeluun liittyvän poikkeuksen poistamisen lisäksi lakia muutettiin siten, että turvapaikkahakemuksen käsittelyyn kulunutta aikaa ei enää lasketa mukaan asumisaikaan, ja tämän muutoksen arvioitiin koskevan vuosittain jonkin verran yli tuhatta henkilöä. Lakia muutettiin kuitenkin myös siten, että kansalaisuushakemus on lähtökohtaisesti käsiteltävä vuoden kuluessa, jos hakija on kansainvälistä suojelua saava tai kansalaisuudeton henkilö. Uuden lakisääteisen enimmäisajan arvioitiin vaikuttavan tällaiseen hakijaan siten, että kansalaisuushakemuksen käsittelyaika olisi käytännössä noin vuoden lyhyempi.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Asumisajan muutosten jälkeen kansalaisuuslakia muutettiin mm. siten, että kansalaistamiselle lisättiin uudenlainen toimeentuloedellytys. Se koskee lähtökohtaisesti myös kansainvälistä suojelua saavia ja kansalaisuudettomia hakijoita. Muutoksessa huomioitiin, ettei kaikilla kansalaisuuden hakijoilla ole ollut aiemmassa vaiheessa toimeentuloedellytystä. Turvatun toimeentulon tarkastelujaksona on kansalaistamista edeltävät kaksi vuotta. Suomessa asumisen aikana työllistyminen vaikuttaa myös kansainvälistä suojelua saavien ja kansalaisuudettomien henkilöiden kansalaisuuden saamiseen. Työttömänä olevan henkilön on puolestaan jatkossa vaikeampi saada Suomen kansalaisuus, koska toimeentuloedellytys ei täyty, jos hakija on viimeksi kuluneiden kahden vuoden aikana turvautunut työttömyysetuuteen tai toimeentulotukeen yhteensä yli kolmen kuukauden ajan.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaistamiselle lisättäisiin uusi yhteiskuntatietoedellytys, minkä lisäksi otettaisiin käyttöön yhteiskuntatiedon osoittamiseen tarkoitettu kansalaisuuskoe. Yhteiskuntatietoedellytys koskisi lähtökohtaisesti kaikkia työikäisiä aikuisia, myös kansainvälistä suojelua saavia ja kansalaisuudettomia. Edellytyksen täyttymisen voisi osoittaa ylioppilas- tai korkeakoulututkinnolla tai kansalaisuuskokeella. Kansalaisuuskokeen kysymykset perustuisivat kansalaisuuskokeen oppimateriaaliin, joka laadittaisiin kotoutumislain mukaisen yhteiskuntaorientaation oppimateriaalin pohjalta. Tästä näkökulmasta on olennaista, että mm. kiintiöpakolaisen tai kansainvälistä suojelua saavan henkilön kotoutumissuunnitelmassa voidaan sopia yhteiskuntaorientaatioon osallistumisesta. Yhteiskuntaorientaatioon osallistuneet olisivat käytännössä tutustuneet kansalaisuuskokeen aiheisiin osittain myös jo ennen kansalaisuuskokeeseen valmistautumista. Yhteiskuntaorientaatioon osallistuminen voi siten osaltaan edistää mm. kansainvälistä suojelua saavien mahdollisuuksia kokeen suorittamiseen.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset kansainvälisiin osaajiin\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Asumisajan muutosten yhteydessä arvioitiin, että asumisajan pidentäminen saattaa jonkin verran vähentää Suomen vetovoimaa sellaisille ulkomaalaisille henkilöille, jotka tekevät asiantuntijatyötä. Asumisaikaan hyväksyttävien ulkomaanpäivien vähentämisellä arvioitiin olevan merkitystä erityisesti työnsä vuoksi paljon matkustaville. Asumisajan muutokset saattavat osaltaan vähentää tai hidastaa koulutetun työvoiman pysyvämpää asettumista Suomeen, mutta maan vetovoimaisuuteen vaikuttavat muutkin seikat kuin mahdollisuus kansalaisuuden saamiseen, esimerkiksi uramahdollisuudet ja yhteiskunnan perheystävällisyys. Asumisajan pidentämisellä ja asumisaikaan hyväksyttävien ulkomaanpäivien vähentämisellä voi olla vaikutusta myös ulkomaalaisten opiskelijoiden suunnitelmiin, mutta säännösten arvioitiin muutosten jälkeenkin mahdollistavan yhä opiskelijavaihdon ja kansalaisuuden hakemisen yhdistämisen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuslain muutosten toisen vaiheen yhteydessä tarkasteltiin erityisesti uuden toimeentuloedellytyksen vaikutusta (HE 19/2025 vp, s. 48–49). Valtion taloudellisen tutkimuskeskuksen yhteydessä toimivan Datahuoneen toteuttaman selvityksen perusteella arvioitiin, että muutoksilla ei olisi merkittävää vaikutusta siihen, miten Suomeen työnteon perusteella tulleet henkilöt jatkossa täyttäisivät toimeentuloedellytyksen.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan uutta yhteiskuntatietoedellytystä ja kansalaisuuskokeen käyttöönottoa. Myös useassa muussa maassa edellytetään kansalaisuuden saamista varten joko kansalaisuuskokeen suorittamista tai muutoin vastaavien tietojen osoittamista esimerkiksi suoritetulla koulutuksella. Kansalaisuuskokeet sisältävät yleensä erilaisia yhteiskuntaa koskevia kysymyksiä. Voidaan arvioida, että kansalaisuuskoe ei muodostuisi merkittäväksi esteeksi Suomessa asiantuntijatyötä tekevien henkilöiden kansalaisuuden saamiselle. Kansalaistaminen edellyttää nykyisinkin tyydyttävän suomen tai ruotsin kielen taidon osoittamista. Koulutetuilla asiantuntijatyötä tekevillä henkilöillä on oletettavasti valmiuksia erilaisten kansalaisuutta varten vaadittavien kokeiden suorittamiseen.\u003Cspan class=\"AlaviiteTeksti\"> Esimerkiksi osalle haavoittuvassa asemassa olevia kansalaisuuskoe voi käytännössä muodostaa tuntuvamman vaatimuksen (vrt. mm. Cooke 2009: Barrier or entitlement? The language and citizenship agenda in the United Kingdom, Language Assessment Quaterly 6:1, s. 76–77). Koulutustasolla on havaittu Tanskassa ja Alankomaissa olleen yhteyttä siihen, missä määrin kansalaisuuteen liittyvien kokeiden käyttöönotto on vähentänyt halukkuutta kansalaisuuden hakemiseen ja lykännyt kansalaisuuden saamista (Vink ym. 2021, s. 759, 763). \u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoedellytyksen täyttymisen voisi lisäksi osoittaa siten, että hakija olisi suorittanut suomen- tai ruotsinkielisen ylioppilas- tai korkeakoulututkinnon, jolloin häneltä ei vaadittaisi kansalaisuuskokeen suorittamista. Korkeakoulututkinnon huomioimisen tarkoituksena olisi lisätä Suomen pitovoimaa korkeakoulututkinnon suorittaneita kohtaan. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Suomessa opiskelleita ulkomaalaisia koskevien tilastojen perusteella voidaan arvioida sellaisten henkilöiden mahdollista lukumäärää, joiden ei tarvitsisi kansalaisuuden saadakseen suorittaa kansalaisuuskoetta. Saatavilla olevat tilastot kattavat toisaalta lukiokoulutuksen aloittaneet ja toisaalta suomen- tai ruotsinkielisen ammattikorkeakoulututkinnon ja ylemmän ammattikorkeakoulututkinnon suorittaneet ulkomaalaiset eli sellaiset henkilöt, joilla ei ole Suomen kansalaisuutta. Lukiokoulutuksen aloitti Suomessa vuosina 2021–2023 yhteensä noin 1&nbsp;300–1 800 sellaista henkilöä, jolla ei ollut Suomen kansalaisuutta.\u003Cspan class=\"AlaviiteKooste\"> \u003Cspan class=\"YleinenViite\">\u003Cspan class=\"ViiteTeksti\">\u003Ca href=\"https://vipunen.fi/fi-fi/_layouts/15/WopiFrame.aspx?sourcedoc=%7BF5D99143-A9B5-421A-B522-D7DD211E36C4%7D&amp;file=Lukiokoulutus%20-%20uudet%20opiskelijat%20-%20ulkomaalaiset%20-%20kansalaisuus.xlsb&amp;action=default\">https://vipunen.fi/fi-fi/_layouts/15/WopiFrame.aspx?sourcedoc=%7BF5D99143-A9B5-421A-B522-D7DD211E36C4%7D&amp;file=Lukiokoulutus%20-%20uudet%20opiskelijat%20-%20ulkomaalaiset%20-%20kansalaisuus.xlsb&amp;action=default\u003C/a>\u003C/span>\u003C/span>\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Taulukko 6: Suomessa lukiokoulutuksen aloittaneet ulkomaalaiset opiskelijat.&nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10B05\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Opinnot / vuosi\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2021\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2022\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2023\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Lukiokoulutuksen aloittaneet&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;272&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;575&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">1&nbsp;752&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Vuonna 2024 suomen- tai ruotsinkielisen ammattikorkeatutkinnon suoritti yhteensä 197 sellaista henkilöä, jolla ei ollut Suomen kansalaisuutta (vuonna 2023 yhteensä 142 henkilöä). Ylemmän suomen- tai ruotsinkielisen ammattikorkeakoulututkinnon suoritti vuonna 2024 yhteensä 17 sellaista henkilöä, jolla ei ollut Suomen kansalaisuutta (vuonna 2023 yhteensä 13 henkilöä).\u003Cspan class=\"AlaviiteTeksti\"> Tilastoja on saatavissa koulutuksen kielen perusteella vain ammattikorkeakoulutuksesta. Opetus- ja kulttuuriministeriön arvion mukaan luvut ovat yliopistokoulutuksessa kuitenkin vastaavan suuruisia kuin ammattikorkeakouluissa.\u003C/span>&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Taulukko 7: Suomeksi tai ruotsiksi ammattikorkeakouluopintoja suorittaneet ulkomaalaiset.&nbsp;\u003C/p>\n       \u003Cdiv id=\"tableID-N10B76\" class=\"table\">\n        \u003Ctable class=\"vaskitgroup\">\n         \u003Ctbody class=\"tbody\">\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">Opinnot / vuosi\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2023\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">\u003Cspan class=\"LihavaTeksti\">2024\u003C/span>&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Suomen- tai ruotsinkielinen ammattikorkeakoulututkinto&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">142&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">197&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n          \u003Ctr class=\"vaskirow\n                \">\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">Suomen- tai ruotsinkielinen ylempi ammattikorkeakoulututkinto&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">13&nbsp;\u003C/p>\n           \u003C/td>\n           \u003Ctd class=\"vaskientry\n                b-borderr-border\">\n            \u003Cp class=\"KappaleKooste\">17&nbsp;\u003C/p>\n           \u003C/td>\n          \u003C/tr>\n         \u003C/tbody>\n        \u003C/table>\n       \u003C/div>\n       \u003Cp class=\"KappaleKooste\">Edellä esitettyjen tilastojen perusteella voidaan arvioida, että vuosittain yhteensä noin 2&nbsp;000 henkilön ei tarvitsisi kansalaisuuden saadakseen suorittaa kansalaisuuskoetta sikäli kuin kansalaisuuden hakeminen henkilön kohdalla muut seikat huomioiden tulisi kyseeseen. Esitettyjen lukumäärien osalta on esimerkiksi huomioitava, että opintoja suorittaneiden joukossa voi olla myös sellaisia henkilöitä, jotka eivät hae ollenkaan Suomen kansalaisuutta tai joille se ei muusta syystä ole vielä ajankohtaista tai mahdollista. Myös opinnot suorittaneen henkilön tulisi lisäksi täyttää muut kansalaistamisen edellytykset, kuten asumisaika- ja toimeentuloedellytykset.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset ulkosuomalaisiin ja paluumuuttajiin\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuutta varten vaadittavan asumisajan pidentämisellä arvioitiin saattavan olla välillistä vaikutusta paluumuuton houkuttelevuuteen sekä ulkosuomalaisten että heidän perheenjäsentensä kannalta. Ulkosuomalaisille ja paluumuuttajille keskeisiä ovat kuitenkin myös esimerkiksi perheenjäsenten maahantuloon ja oleskelulupaan liittyvät kysymykset. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Seuraavassa vaiheessa tehtiin muutoksia eräisiin muihin kansalaisuuden saamisen edellytyksiin, kuten toimeentuloedellytykseen, ja kansalaisuuden menettämiseen. Muutoksilla ei arvioitu olevan sellaisenaan vaikutusta ulkosuomalaisten ja heidän perheidensä Suomeen muuttamiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettavalla yhteiskuntatietoedellytyksellä ja kansalaisuuskokeella ei niin ikään ole todennäköisesti ratkaisevaa merkitystä muuttopäätökselle. Kansalaistamisen edellytysten yleinen tiukentaminen voi kuitenkin osaltaan vaikuttaa ulkosuomalaisten ja heidän perheidensä muuttosuunnitelmiin.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cdiv class=\"PerusteluLuku\">\n       \u003Ch6 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.8.5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaikutukset pitkäaikaisesti sairaisiin tai vammaisiin henkilöihin\u003C/span>\u003C/h6>\n       \u003Cp class=\"KappaleKooste\">Kansalaisuuslain muutosten edellisessä vaiheessa kansalaistamiselle mm. lisättiin uudenlainen toimeentuloedellytys. Muutoksen vaikutuksia arvioitaessa todettiin, että esimerkiksi työkyvyttömyyseläkkeestä toimeentulonsa saava henkilö täyttää myös uuden edellytyksen. Myös esimerkiksi vammaistukea saava henkilö voi täyttää edellytyksen. Toimeentuloedellytyksestä voidaan lisäksi poiketa sillä perusteella, että hakija on pitkäaikaisesti sairas tai hänellä on sellainen vamma, joka estää edellytyksen täyttämisen pitkäaikaisesti.&nbsp;&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan uutta yhteiskuntatietoedellytystä ja yhteiskuntatiedon osoittamiseen tarkoitetun kansalaisuuskokeen käyttöönottoa. Kansalaisuuskokeen suorittamiseen voitaisiin myöntää erityisjärjestelyjä esimerkiksi vammaisuuden perusteella. Erityisjärjestelyjen tarkoituksena olisi se, että sellaiset asiat kuin sairaus, vamma tai lukemisen ja kirjoittamisen eritysvaikeus eivät muodostuisi esteeksi kokeen suorittamiselle. Erityisjärjestelyillä turvattaisiin kansalaisuuden hakemisesta kiinnostuneille yhdenvertaiset ja kohtuulliset mahdollisuudet kansalaisuuskokeen suorittamiseen ja siten myös kansalaisuuden saamiseen. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Päätöksen mahdollisten erityisjärjestelyjen myöntämisestä tekisi Maahanmuuttovirasto. Erityisjärjestelynä voitaisiin myöntää esimerkiksi lisäaikaa kokeen suorittamiseen tai mahdollisuus kokeen suorittamiseen erillisessä ja esteettömässä koetilassa. Erityisjärjestelyt voisivat liittyä myös sähköisen kokeen erityispiirteisiin ja sisältää esimerkiksi mahdollisuuden käyttää suurempaa näyttöä tai suurentaa kirjasinkokoa. Vammaisille tarkoitetut erityisjärjestelyt voisivat lisäksi kattaa erilaisia apuvälineitä, mahdollisuuden oman tietokoneen tai muun vastaavan laitteen käyttöön siinä valmiiksi olevien apuvälineiden kanssa sekä vammaispalvelulaissa (675/2023) tarkoitetun henkilökohtaisen avun. Maahanmuuttoviraston myöntämien erityisjärjestelyjen toteutumisesta huolehtisivat ne toimijat, joiden kanssa Maahanmuuttovirasto olisi sopinut koetilaisuuksien järjestämisestä.&nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Lähtökohtana olisi siten edellytettävän yhteiskuntatiedon osoittaminen tarvittaessa erityisjärjestelyjen avulla. Yhteiskuntatietoedellytyksestä voitaisiin kuitenkin poiketa silloin, kun kansalaisuuskokeen suorittamista ei esimerkiksi vammaisuuden vuoksi voitaisi kohtuudella edellyttää erityisjärjestelyjenkään avulla. Poikkeamismahdollisuudella varmistettaisiin se, että myös sellaisille hakijoille voitaisiin myöntää kansalaisuus, joilla ei olisi tosiasiallista mahdollisuutta täyttää uutta yhteiskuntatietoedellytystä. &nbsp;\u003C/p>\n       \u003Cp class=\"KappaleKooste\">Yhteiskuntatietoedellytyksestä voitaisiin poiketa siinä tapauksessa, että poikkeamiselle olisi sellainen hakijan terveydentilaan tai vammaisuuteen liittyvä peruste, jonka vuoksi hän ei pystyisi osoittamaan edellytyksen täyttymistä. Sääntely kattaisi laajasti kaikki sellaiset tilanteet, joissa hakijan fyysinen tai psyykkinen toimintakyky olisi siinä määrin vakavasti ja pitkäaikaisesti alentunut lääketieteellisistä syistä, ettei hänen voitaisi kohtuudella odottaa täyttävän yhteiskuntatietoedellytystä. Terveydentilaan liittyvässä syyssä voisi olla kyse esimerkiksi psyykkisestä tai fyysisestä kroonisesta sairaudesta, kehitysvammasta tai -häiriöstä, neuropsykiatrisesta häiriöstä, CP-vammasta tai ulkoisen tekijän aiheuttamasta pitkäaikaisesta vammasta. &nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">4.2.9&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kokoavia huomioita kansalaisuutta koskevien muutosten yhteisvaikutuksista\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuslain muutosten valmistelulle on asetettu kaikkiaan kolme eri hanketta. Kokonaisuuteen kuuluu asumisajan pidentämisen lisäksi muita tiukennuksia kansalaisuuden saamisen edellytyksiin, mukaan lukien uudenlainen toimeentuloedellytys. Edellisessä vaiheessa tehtiin eräitä muutoksia myös kansalaisuuden menettämiseen. Tässä esityksessä ehdotetaan puolestaan uutta yhteiskuntatietoedellytystä sekä uuden kansalaisuuskokeen käyttöönottoa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaistamisen edellytysten muutokset vaikuttavat laajasti kansalaisuuden hakijoihin ja kansalaisuuden saamisen mahdollisuuteen. Vuonna 2025 kansalaisuushakemuksen teki yhteensä 11 237 henkilöä (vuonna 2024 yhteensä 17&nbsp;063 ja vuonna 2023 yhteensä 18 296 henkilöä). Kansalaisuus myönnettiin vuonna 2025 hakemuksesta yhteensä 14 067 henkilölle (vuonna 2024 yhteensä 12&nbsp;417 henkilölle ja vuonna 2023 yhteensä 11&nbsp;594 henkilölle). Kansalaisuuden menettämistä koskevien asioiden määrä on ollut huomattavasti pienempi, ja kansalaisuuden menettämiseen tehdyt muutokset koskevat käytännössä pientä henkilömäärää. Kielteisten päätösten osuus kaikista kansalaisuushakemuksiin tehdyistä päätöksistä on ollut mainittuina vuosina 9–11 %.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Asumisajan ja muiden muutosten yhteydessä on jo arvioitu alustavasti kansalaistamisen eri edellytysten tiukentamisen yhteisvaikutuksia. Eri edellytysten tiukentamisesta ei välttämättä seuraa sitä, että kansalaisuushakemuksiin tehtäisiin selvästi aiempaa enemmän kielteisiä päätöksiä. Eri muutokset voivat kuitenkin vaikuttaa siten, että hakemuksia tehdään aiempaa vähemmän, jos mahdolliset hakijat muutosten tultua voimaan arvioivat, että he eivät täytä kansalaistamisen edellytyksiä. Eri vaiheissa tehtyjen muutosten vaikutuksia sekä hakemusmääriin että kielteisten päätösten määriin on mahdollista tarkastella tarkemmin vasta, kun muutokset ovat olleet pidempään voimassa.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuslain muutosten edellisessä vaiheessa voimaan tullut toimeentuloedellytys eroaa merkittävästi aiemmasta sääntelystä. Työttömyys voi vaikuttaa kansalaisuuden saamisen mahdollisuuteen aiempaa huomattavasti enemmän, koska toimeentuloedellytys ei täyty, jos hakija on turvautunut työttömyysetuuteen tai toimeentulotukeen yli kolmen kuukauden ajan viimeksi kuluneiden kahden vuoden aikana. Toimeentuloedellytystä koskeva lainmuutos on ollut voimassa vasta jonkin aikaa, joten tarkempaa arviota sen vaikutuksista ei ole tässä vaiheessa mahdollista tehdä.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaistamisen edellytyksiin lisättäisiin vaatimus yhteiskuntaa koskevien tietojen osoittamisesta. Käytännössä kyse olisi suomalaisen yhteiskunnan toimintaa sekä yksilön oikeuksia ja velvollisuuksia koskevista perustiedoista. Nämä tiedot voisi uuden kansalaisuuskokeen sijaan osoittaa myös suomeksi tai ruotsiksi suoritetulla ylioppilas- tai korkeakoulututkinnolla. Kansalaisuuskokeen kysymykset perustuisivat kansalaisuuskokeen oppimateriaaliin, joka laadittaisiin kunnan kotoutuja-asiakkaille järjestettävän yhteiskuntaorientaation oppimateriaalin pohjalta. Kansalaisuuskoe olisi kirjallinen, ja siihen osallistuvan olisi valittava annetuista vaihtoehdoista oikeat vastaukset kysymyksiin. Tällaisen kansalaisuuskokeen suorittamista voitaisiin myös kansainvälisen vertailun valossa pitää kohtuullisena uutena vaatimuksena. Tämänkin esityksen muutosten voidaan kuitenkin arvioida vaikuttavan siten, että hakemuksia tehdään aiempaa vähemmän, jos mahdolliset hakijat muutosten tultua voimaan arvioivat, että he eivät täytä kansalaistamisen edellytyksiä. Kansalaisuuskoe muodostaisi uuden kansalaisuuden hakemista edeltävän vaiheen, ja kansalaistaminen edellyttäisi jatkossa useimmiten hyväksytysti suoritettua kansalaisuuskoetta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Uuden kansalaisuuskokeen käyttöönotosta seuraisi uusia tehtäviä etenkin Maahanmuuttovirastolle, joka vastaisi kansalaisuuskoejärjestelmän yleisestä hallinnosta, tiedottamisesta, valvonnasta ja kehittämisestä. Kansalaisuuskokeeseen ilmoittautumista, kokeen suorittamista ja koetulosten rekisteröintiä varten tarvittaisiin yhteentoimiva tietojärjestelmäkokonaisuus, joka olisi niin ikään Maahanmuuttoviraston vastuulla. Kansalaisuuskokeen laatimisesta Maahanmuuttovirasto sopisi esimerkiksi jonkin yliopiston kanssa. Koetilaisuuksien järjestämisestä virasto sopisi puolestaan esimerkiksi koulutuksen järjestäjien tai oppilaitosten ylläpitäjien kanssa. Kansalaisuuskoetta varten perustettaisiin myös poikkihallinnollinen asiantuntijatoimikunta mm. tukemaan Maahanmuuttovirastoa kansalaisuuskokeen kehittämisessä. Kansalaisuuskokeen käyttöönotto edellyttäisi yhteensä 4,2 miljoonan euron alkuinvestointeja. Myöhemmin kansalaisuuskokeen kustannuksia olisi tarkoitus kattaa omakustannusperiaatteen mukaisesti koemaksuilla. &nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Muut toteuttamisvaihtoehdot\u003C/span>\u003C/h3>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch4 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Vaihtoehdot ja niiden vaikutukset\u003C/span>\u003C/h4>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.1&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuuskokeen hallinnointivastuu\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen käyttöönottoa selvittäneen työryhmän yhtenä keskeisenä tehtävänä oli tarkastella sitä, mikä olisi tarkoituksenmukaisin taho hallinnoimaan kansalaisuuskoetta. Kyse olisi kokonaan uudesta tehtävästä. Työryhmän selvityksessä tarkasteltiin erityisesti sellaisia viranomaistahoja, joilla on jollakin tavalla yhteyttä tutkintojen tai kokeiden järjestämiseen tai kansalaisuus- tai kotoutumisasioihin. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yhtenä toteuttamisvaihtoehtona arvioitiin opetus- ja kulttuuriministeriön hallinnonalan soveltuvuutta kansalaisuuskokeen hallinnoimiseen. Kokeen laatiminen, ylläpitäminen ja kehittäminen edellyttäisivät laajapohjaista pedagogiikan ja testauksen suunnittelun ja järjestämisen asiantuntemusta. Opetus- ja kulttuuriministeriö määrittää koulutuspolitiikan suuntaviivat ja strategiset linjaukset sekä valmistelee koulutusta koskevan lainsäädännön ja valtioneuvoston päätökset. Keskeinen kansallinen toimija koulutuspolitiikan toimeenpanossa ja kehittämisessä on opetus- ja kulttuuriministeriön alainen Opetushallitus. Esimerkiksi kotoutumislain mukaisessa kotoutumiskoulutuksessa noudatetaan Opetushallituksen antamia kotoutumiskoulutuksen opetussuunnitelman perusteita. Lisäksi Opetushallitus on ollut mukana päivittämässä ja kehittämässä yhteiskuntaorientaation oppimateriaalia, jonka pohjalta laadittaisiin oppimateriaali myös kansalaisuuskoetta varten. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sen lisäksi, että Opetushallituksella olisi kansalaisuuskokeen laatimisen näkökulmasta hyödyllistä pedagogista asiantuntemusta, sillä olisi kokemusta erilaisten testien hallinnoimisesta. Kuten jaksossa 2.3.2.1 on todettu, Opetushallitus vastaa yleisen kielitutkintojärjestelmän hallinnoimisesta, kehittämisestä ja valvonnasta. Lisäksi se vastaa kotoutumislain mukaisesta suomen ja ruotsin kielitaidon päätöstestauksen toteuttamisesta. Siten Opetushallituksella olisi kokemusta ja asiantuntemusta testausjärjestelmän hallinnoimisesta ja hallinnointivastuuseen liittyvistä käytännön toimista. Kansalaisuuskokeen kysymysten laatiminen ja kehittäminen edellyttäisi kielen eri taitotasoja koskevaa asiantuntemusta, mikä olisi osaltaan puoltanut Opetushallitusta soveltuvana tahona hallinnoimaan kansalaisuuskoetta.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Opetus- ja kulttuuriministeriön hallinnonalan osalta on kuitenkin valmistelussa huomioitu erityisesti se, ettei kansalaisuuskoe luonteeltaan tai käyttötarkoitukseltaan kuuluisi sen hallinnonalan ydinalueeseen. Siten on arvioitu, ettei kansalaisuuskokeen hallinnointivastuu kokonaisuutena soveltuisi opetus- ja kulttuuriministeriön hallinnonalan tehtäväksi. Opetus- ja kulttuuriministeriön hallinnonalan asiantuntemusta voitaisiin kuitenkin hyödyntää kansalaisuuskokeen osalta siten, että kansalaisuuskoetta varten perustettavassa asiantuntijatoimikunnassa olisi jäseninä myös tieteen ja koulutuksen asiantuntijoita. Tämä olisi tarpeen siksi, että kansalaisuuskokeen laatimisesta ja koetilaisuuksien järjestämisestä huolehtisivat ehdotuksen mukaan tieteen ja koulutuksen alan toimijat. Jäsenten asiantuntijanäkemyksiä voitaisiin hyödyntää muun muassa koekysymysten toimivuuden analysoinnissa sekä koetilaisuuksien kysynnän ja tarjonnan yhteensovittamisessa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Yhtenä vaihtoehtona kokeen hallinnoinnista vastaavaksi toimijaksi oli esillä myös työ- ja elinkeinoministeriö ja sen hallinnonalalle kuuluvat elinkeino-, liikenne- ja ympäristökeskukset (ELY-keskukset)\u003Cspan class=\"AlaviiteTeksti\"> ELY-keskusten pohjalta on vuoden 2026 alussa voimaan tulleessa uudistuksessa perustettu elinvoimakeskuksia.\u003C/span>. Työ- ja elinkeinoministeriön hallinnonalaan kuuluu muun muassa maahanmuuttajien kotoutumisen edistäminen ja työperäinen maahanmuutto. Työ- ja elinkeinoministeriö vastaa kotoutumispolitiikan suunnittelusta, kehittämisestä ja ohjauksesta, kotoutumiseen liittyvän lainsäädännön valmistelusta sekä kotoutumispolitiikan seurannasta ja arvioinnista. Ministeriö myös ohjaa alueellisia ELY-keskuksia. ELY-keskuksissa taas hoidetaan alueellisesti kotoutumisen edistämiseen, pakolaisten vastaanottoon, työvoiman maahanmuuttoon ja hyviin väestösuhteisiin liittyviä tehtäviä. ELY-keskukset tukevat ja tekevät yhteistyötä poikkihallinnollisesti maahanmuuton ja kotoutumisen parissa työskentelevien tahojen kanssa. ELY-keskukset vastaavat kotoutumisen edistämisen alueellisesta koordinaatiosta, kehittämisestä ja yhteensovittamisesta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen olisi tarkoitus mitata henkilön kotoutumista yhteiskuntaan ja tietämystä yhteiskunnan perusperiaatteista ja säännöistä. Tämän voitaisiin osaltaan katsoa puoltavan sellaista ratkaisua, jossa hallinnointivastuussa olevalla taholla olisi vastuuta ja asiantuntemusta myös kotoutumisen edistämisestä. Tältä osin on kuitenkin huomioitava, että kotoutuminen ja siihen liittyvät toimet ajoittuvat Suomessa pikemminkin asumisen alkuvaiheeseen, kun taas Suomen kansalaisuuden saamiseen liittyvää yhteiskuntaosaamista testattaisiin mahdollisesti vasta useamman vuoden kuluttua kotoutumiskoulutuksen jälkeen. Kaikki kansalaisuuden hakijat eivät myöskään osallistu kotoutumiskoulutukseen, minkä lisäksi kansalaisuuskokeen suorittaminen edellyttäisi käytännössä sitä, että henkilö perehtyy kokeessa mitattaviin asioihin myös mahdollisen kotoutumiskoulutuksen jälkeen, kun kansalaisuuden hakeminen tulee ajankohtaisemmaksi. Siten ei olisi välttämätöntä, että kansalaisuuskokeen hallinnoimisesta vastaisi sama taho, joka vastaa myös kotoutumiseen liittyvistä toimista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Myös työ- ja elinkeinoministeriön hallinnonalan asiantuntemusta olisi kuitenkin perusteltua hyödyntää kansalaisuuskokeen asiantuntijatoimikunnassa. Tässä esityksessä ehdotetaan, että asiantuntijatoimikunnan varapuheenjohtaja edustaisi kotoutumisen asiantuntemusta. Kansalaisuuskokeen kannalta keskeistä asiantuntemusta olisi esimerkiksi työllisyys-, kehittämis- ja hallintokeskuksella, joka vastaa kansalaisuuskokeen oppimateriaalin pohjana käytettävän yhteiskuntaorientaation oppimateriaalin ylläpidosta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Työryhmän selvityksessä olivat lisäksi yhtenä vaihtoehtona kunnat. Kunnilla on opetukseen ja kokeisiin liittyvää asiantuntemusta, koska kunnat vastaavat muun muassa perusopetuksesta ja aikuisten perusopetuksesta. Lisäksi kunnilla on vastuu kotoutumisen edistämisestä paikallistasolla. Tähän kuuluu muun ohella se, että kotoutumislain mukaan kuntien tulee järjestää yhteiskuntaorientaatiota kotoutuja-asiakkaille heidän äidinkielellään tai muutoin hyvin osaamillaan kielillä. Kuntia on Suomessa huomattava lukumäärä, ja esimerkiksi yhteiskuntaorientaatiota ei ole järjestetty kaikissa kunnissa, kun taas joillain alueilla kunnat ovat hankemuotoisesti pilotoineet yhteiskuntaorientaation järjestämisen yhteistyönä. Muun muassa kansalaisuutta hakevien yhdenvertaisuuden näkökulmasta olisi tarkoituksenmukaisempaa, että kansalaisuuskokeen hallinnointivastuu olisi valtakunnallisesti keskitetty, eikä kokeen järjestäminen siten riippuisi yksittäisen kunnan mahdollisuuksista ja esimerkiksi resursseista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä päädyttiin ehdottamaan, että kansalaisuuskoetta hallinnoisi Maahanmuuttovirasto. Tehtävä liittyisi kansalaisuuden hakemisen yhteydessä arvioitavaan yhteiskuntatietoedellytykseen, ja kokeen tulos vaikuttaisi suoraan yksilön mahdollisuuteen saada Suomen kansalaisuus. Kansalaisuuskokeella olisi siten keskeinen merkitys kansalaisuusprosessissa, minkä vuoksi sen hallinnointi kuuluisi luontevasti samalle viranomaiselle, joka jo vastaa koko prosessista. Maahanmuuttovirasto tarvitsisi kokeen tulosta kansalaisuushakemusten käsittelyssä, joten se hyötyisi suoraan kokeen tehokkaasta ja sujuvasta toteutuksesta. Hallinnollinen kokonaisuus säilyisi selkeänä ja toimivana, kun vastuu kokeen hallinnoimisesta kuuluisi sille viranomaiselle, jolla olisi muiden tehtäviensä perusteella tarvetta kokeen tulosten hyödyntämiseen.&nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.2&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Kansalaisuuskokeen sisältö ja toteutustapa\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Sisäministeriön kansalaisuuskoetta koskevan selvityksen pohjalta esitystä valmisteltaessa on arvioitu, että kustannustehokkain ja tarkoituksenmukaisin tapa yhteiskuntaosaamisen testaamiseen olisi sähköinen monivalintakoe, joka suoritettaisiin suomen tai ruotsin kielellä. Kansalaisuuskokeen tarkoituksena on mitata kotoutumista, ja osana kotoutumista voidaan pitää myös kykyä toimia yhteiskunnassa, jossa kirjallinen viestintä ja digitaalinen asiointi kuuluvat keskeisesti arkeen ja viranomaispalveluihin. Digitalisaation myötä yhä useammat yhteiskunnan palvelut ovat siirtyneet verkkoon, ja suomalaisessa yhteiskunnassa toimiminen edellyttää perustason digitaalista osaamista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Työryhmän selvityksessä tarkasteltiin myös muita toteutustapoja liittyen kokeen kieleen ja koemuodon valintaan sekä näiden vaikutusta kokeen toimivuuteen yhteiskuntaa koskevan tiedon mittausvälineenä. Koska kansalaistamisen edellytyksenä on jo kielitaitovaatimus, kansalaisuuskokeella olisi tarkoitus arvioida nimenomaan yhteiskuntaosaamista eikä esimerkiksi kielitaitoa tai kirjoitustaitoa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kokeen kieli voi osaltaan vaikuttaa siihen, kuinka hyvin henkilö ymmärtää kokeeseen valmistautumisessa käytettävän oppimateriaalin tekstin ja koekysymykset. Työryhmän selvityksessä tarkasteltiin yhtenä vaihtoehtona mahdollisuutta suorittaa koe osallistujan omalla äidinkielellä. Mahdollisuus oman äidinkielen käyttöön voisi joissain tilanteissa parantaa osallistujan mahdollisuuksia osoittaa nimenomaisesti yhteiskuntaosaamista, erityisesti silloin, kun hänen suomen tai ruotsin kielen taitonsa olisi rajallinen. Käytännössä tällainen ratkaisu edellyttäisi kuitenkin runsaasti mm. taloudellisia resursseja, sillä Suomessa asuvilla ulkomaalaisilla on useita eri äidinkieliä.\u003Cspan class=\"AlaviiteTeksti\"> Suomessa on vieraskielisiä yhteensä 610 148. Kymmenen suurinta kieliryhmää ovat venäjä, viro, arabia, ukraina, englanti, somali, farsi, kiina, albania, kurdi. Suomi lukuina 2025, Tilastokeskus, s. 8.\u003C/span> Kaikkien kielten huomioiminen ei todennäköisesti olisi mahdollista, jolloin jouduttaisiin valitsemaan rajatumpi määrä kieliä eikä kaikilla olisi mahdollisuutta suorittaa koetta omalla äidinkielellään.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Koemuotoja tarkasteltaessa yhtenä toteutusvaihtoehtona oli sellainen kirjallisesti suoritettava paperinen tai digitaalinen koe, jossa olisi avoimia kysymyksiä. Tämä koemuoto voisi sinänsä soveltua mittaamaan perustietoja suomalaisesta yhteiskunnasta. Avoimet kysymykset edellyttäisivät kokeeseen osallistuvalta kuitenkin aktiivista kirjallista kielitaitoa, mikä voisi osaltaan vaikuttaa kokeeseen osallistuvien mahdollisuuksiin osoittaa osaamistaan. Avointen kirjallisten vastausten arviointi edellyttäisi myös erityistä arvioijaverkostoa, mikä lisäisi kansalaisuuskokeen toteutuksen kustannuksia ja hidastaisi koesuoritusten tulosten selville saamista. Koesuoritusten arvioinnissa ei voitaisi tällaisessa toteutustavassa hyödyntää digitalisaatiota samalla tavalla kuin monivalinta- ja väittämäkysymyksissä. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Eräänä kansalaisuuskokeen toteuttamisen vaihtoehtona tarkasteltiin myös suullista haastattelua, jonka avulla olisi osaltaan mahdollista saada kuvaa kokeeseen osallistujan kotoutumisesta. Haastattelu voisi soveltua koemuotona erityisesti sellaisille henkilöille, joiden luku- ja kirjoitustaito on jäänyt heikommaksi. Suullisina haastatteluina toteutettu kansalaisuuskoe vaatisi kuitenkin mm. tehtävään koulutettuja haastattelijoita ja vakioidun arviointimenettelyn haastattelujen yhdenmukaisuuden varmistamiseksi. Tällainen toteutustapa olisi sen vuoksi omiaan lisäämään kansalaisuuskokeen kustannuksia merkittävästi. Tässä esityksessä päädyttiin siten ehdottamaan, että kansalaisuuskoe suoritettaisiin kirjallisesti sähköisenä kokeena, jota varten voitaisiin tarvittaessa myöntää erityisjärjestelyjä mm. vammaisuuden perusteella. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.3&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhteiskuntatiedon osoittamisen tavat\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaistamisen edellytyksiin lisättäisiin yhteiskuntaosaamista koskeva vaatimus, jonka täyttyminen voitaisiin osoittaa ennen kaikkea kansalaisuuskokeella. Yhteiskuntatietoedellytyksen tavoitteena olisi varmistaa, että kansalaisuuden hakija olisi kotoutunut onnistuneesti suomalaiseen yhteiskuntaan ja kykenisi toimimaan maassa Suomen kansalaisena. Kansalaisuuskokeen avulla voitaisiin arvioida sitä, tunteeko kokeen suorittaja suomalaisen yhteiskunnan perusrakenteita ja keskeistä lainsäädäntöä, perus- ja ihmisoikeuksia sekä Suomen historiaa ja kulttuuria.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Sisäministeriön työryhmän selvityksen pohjalta esitystä valmisteltaessa tarkasteltiin erilaisia vaihtoehtoja, joissa kansalaisuuskokeen voisi korvata jo suoritetulla koulutuksella. Taustalla oli ajatus siitä, että kansalaisuuden hakemisesta kiinnostuneen ei tarvitsisi suorittaa erikseen kansalaisuuskoetta, jos hän olisi jo osoittanut riittävän yhteiskuntaosaamisen muulla tavoin. Tietyn koulutuksen rinnastamisella kansalaisuuskokeeseen voitaisiin välttää samanlaisten tietojen päällekkäistä testaamista. Rinnastamismahdollisuus vapauttaisi osan tulevista hakijoista uudesta kansalaisuuskokeesta ja vähentäisi osaltaan myös kansalaisuuden hakemiseen liittyviä kustannuksia.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Jokin koulutus voitaisiin rinnastaa kansalaisuuskokeeseen tietyin edellytyksin. Rinnastettavan koulutuksen tulisi sisällöltään vastata kansalaisuuskoetta. Koulutuksen pitäisi kattaa riittävän laajasti kansalaisuuskokeen keskeisiä aihealueita. Siihen pitäisi sisältyä yhteiskunnallisia opintoja, joissa käsiteltäisiin sellaisia aiheita kuin perus- ja ihmisoikeudet, suomalainen yhteiskunta, keskeinen lainsäädäntö sekä Suomen historia ja kulttuuri. Koulutuksen sisällön olisi perustuttava Suomessa noudatettavaan opetussuunnitelmaan. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Suomalaisessa koulutusjärjestelmässä opetukseen sisältyy yhteiskunnallisia aineita luvussa 2.2.3.3 kuvatulla tavalla. Sekä perusopetuksessa että lukiossa käsitellään osaltaan sellaisia aiheita, joita myös kansalaisuuskokeeseen sisältyisi. Ammatillisissa perustutkinnoissa on niin ikään pakollisina sellaisia tutkinnon osia, jotka liittyvät yhteiskunta- ja työelämäosaamiseen. Myös aikuisten perusopetuksessa käsitellään suomalaisen yhteiskunnan rakenteita. Eri koulutusten sisällöt eroavat kuitenkin toisistaan jonkin verran. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Erityisesti lukion yhteiskuntaopin sisällön voidaan katsoa vertautuvan kansalaisuuskokeen aihealueisiin. Lukion yhteiskuntaopin tarkoituksena on syventää opiskelijan käsitystä ympäröivästä yhteiskunnasta ja antaa hänelle valmiuksia kasvaa yhteiskunnallisista asioista kiinnostuneeksi aktiiviseksi ja osallistuvaksi kansalaiseksi. Lukion yhteiskuntaopin arvopohjassa korostuvat demokratian peruslähtökohdat, mukaan lukien tasa-arvo ja ihmisoikeuksien kunnioittaminen. Tässä esityksessä ehdotetaan sen vuoksi, että lukiokoulutuksen päätteeksi suomen tai ruotsin kielellä suoritettava ylioppilastutkinto voitaisiin rinnastaa kansalaisuuskokeen hyväksyttyyn suoritukseen. &nbsp;\u003C/p>\n     \u003C/div>\n     \u003Cdiv class=\"PerusteluLuku\">\n      \u003Ch5 class=\"LukuOtsikko\">\u003Cspan class=\"edk-OtsikkoNroTeksti\">5.1.4&nbsp; \u003C/span>\u003Cspan class=\"edk-OtsikkoTeksti\">Yhteiskuntatietoedellytyksen suhde kielitaitoedellytykseen\u003C/span>\u003C/h5>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotetaan, että kansalaistamisen edellytykseksi lisättäisiin kokonaan uusi edellytys, jonka sisältönä olisi suomen tai ruotsin kielellä osoitetut riittävät tiedot yhteiskunnasta. Yhteiskuntaosaaminen osoitettaisiin lähtökohtaisesti suorittamalla hyväksytysti kansalaisuuskoe. Tämä tarkoittaisi, että kielitaitoedellytys säilyisi yhä erillisenä kansalaistamisen edellytyksenä, ja hakijan tulisi jatkossakin esittää selvitys kielitaidostaan ehdotetun yhteiskuntaosaamisen lisäksi. Valmistelun kuluessa on arvioitu myös muita vaihtoehtoja sille, miten yhteiskuntaosaamisen arviointi voitaisiin toteuttaa suhteessa kielitaitoedellytykseen. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kansalaisuuskokeen käyttöönottoa koskevassa työryhmän selvityksessä arvioitiin yhtenä vaihtoehtona sellaista toteuttamistapaa, jossa yhteiskuntaosaamista koskeva edellytys olisi korvannut kielitaitoedellytyksen. Tällöin voimassa oleva kielitaitoedellytys kansalaistamisen edellytyksenä olisi jätetty pois. Tässä vaihtoehdossa kielitaitoa olisi mitattu ainoastaan kansalaisuuskokeen suorittamisella. Kansalaisuuskoe olisi tässäkin vaihtoehdossa suoritettu joko suomeksi tai ruotsiksi, jotta se olisi samalla osoittanut myös kielen osaamista.&nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Kyseisessä vaihtoehdossa hakijan ei olisi tarvinnut osoittaa erikseen kielitaitoa enää kansalaistamisvaiheessa, koska hänellä olisi joka tapauksessa ollut riittävä kielen osaamisen taso kansalaisuuskokeen suorittamiseksi hyväksytysti. Kotoutumiskoulutukseen sisältyy kielitaidon päättötestaus, minkä lisäksi pysyvän oleskeluluvan edellytyksenä on erilaisia kielitaitovaatimuksia. Kansalaistamisen edellytykset eivät olisi lisääntyneet määrällisesti, ja kansalaistamista varten suoritettavat kielitutkinnot olisivat vähentyneet. Tällä olisi voinut olla jossain määrin myönteisiä vaikutuksia myös viranomaisten toimintaan. Tähän nähden voitaisiin joiltain osin katsoa, ettei kielitaidon osoittaminen erikseen enää olisi tarkoituksenmukaista kansalaistamisvaiheessa. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Toisaalta kaikki kansalaisuuden hakijat eivät suorita kotoutumiskoulutuksen päättötestausta, ja osalle hakijoista on esimerkiksi myönnetty pysyvä oleskelulupa ilman kielitaitoedellytystä. Siten edellä kuvatussa vaihtoehdossa ei olisi välttämättä voitu olettaa, että hakijalla olisi ollut tietty taitotaso kielen eri osa-alueilla, joita esimerkiksi yleisellä kielitutkinnolla arvioidaan. Tässä vaihtoehdossa osallistujan kielitaitoa ei olisi arvioitu kovin laajasti tai tarkasti, koska kirjallisena suoritettava, monivalintakysymyksistä koostuva kansalaisuuskoe ei esimerkiksi mittaisi taitoa tuottaa kieltä. Puhumisen, kirjoittamisen ja kuullun ymmärtämisen merkitys olisi kaventunut huomattavasti. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Lisäksi kahden hyvin erilaisen osaamisalueen, kielitaidon ja yhteiskuntatietouden osaamisen arvioinnin yhdistäminen olisi saattanut olla haastavaa. Kielitaidon arvioinnin pohjaksi on kehitetty esimerkiksi eurooppalainen kielitaidon arvioinnin viitekehys, ja kansalaistamista varten vaadittua kielitaitoa kuvataan erilaisten taitotasojen avulla. Yhteiskuntatiedon mittaamista varten ei ole kehitetty vastaavan kaltaista yleisesti vakiintunutta arviointikehystä. Siten kahta erilaista osaamisaluetta ei voitaisi yhdistää toisiinsa samassa arvioinnissa niin, että tuloksena olisi perusteltu yhteisarvio sekä kielitaidosta että yhteiskuntatiedon hallinnasta. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Vaikka korvaamalla kielitaitoedellytys yhteiskuntatietoedellytyksellä olisi sinänsä toteutettu tavoite uudenlaisesta kansalaistamisen edellytyksestä, olisi kielen osaamisen merkitys kansalaistamisen edellytyksenä kaventunut tavalla, jonka ei voida katsoa olevan tarkoituksenmukaista kansalaisuutta varten edellytettävän kotoutumisen näkökulmasta. Siten kielitaitoedellytyksen korvaamista yhteiskuntatietoedellytyksellä ei pidetty perusteltuna vaihtoehtona. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Toisessa arvioitavana olleessa vaihtoehdossa kielitaitoedellytys ja yhteiskuntaosaamisen edellytys olisi yhdistetty yhdeksi uudeksi kansalaistamisen edellytykseksi. Tällöin lakiin olisi lisätty uusi edellytys, johon olisi sisältynyt sekä kielitaito että yhteiskuntaosaaminen. Kielitaitoedellytys ei olisi tässäkään vaihtoehdossa säilynyt erillisenä kansalaistamisen edellytyksenä. Edellytyksen täyttyminen olisi osoitettu kaksiosaisella kansalaisuuskokeella, joka olisi sisältänyt sekä kielitaitoa että yhteiskuntaosaamista mittaavat osiot. Koe olisi suoritettu joko suomen tai ruotsin kielellä, ja kielitaidon taso olisi voinut vastata voimassa olevan lain mukaista kielitaidon tasoa. Uuden edellytyksen täyttymiseen olisi vaadittu kokeen molempien osioiden hyväksyttyä suorittamista. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Uusi yhdistetty edellytys olisi vastannut esimerkiksi Ruotsissa suunniteltuja muutoksia, joiden myötä maan kansalaisuuden saaminen edellyttäisi kielitaidon ja yhteiskuntaosaamisen osoittamiseen tarkoitetun kansalaisuuskokeen suorittamista tai sitä, että hakija olisi suorittanut jonkin muun kansalaisuuskokeeseen rinnastettavan koulutuksen. Tässäkin vaihtoehdossa kansalaistamisen edellytysten määrä olisi säilynyt nykyisellään, kun voimassa olevan kielitaitoedellytyksen tilalle olisi tullut yhdistetty kielitaito- ja yhteiskuntatietoedellytys. Suomessa tilanne eroaa kuitenkin Ruotsista siten, että Suomen kansalaisuuden saamisen edellytyksenä on jo kielitaitoedellytys, jonka täyttyminen osoitetaan vakiintuneesti mm. yleisellä kielitutkinnolla. Sen vuoksi Suomessa ei olisi enää tarpeen kehittää uudenlaista koejärjestelmää suomen tai ruotsin kielen taidon osoittamista varten. &nbsp;\u003C/p>\n      \u003Cp class=\"KappaleKooste\">Tässä esityksessä ehdotettavasta yhteiskuntatiedon osoittamiseen tarkoitetusta kansalaisuuskokeesta seuraisi joka tapauksessa merkittävästi uusia tehtäviä Maahanmuuttovirastolle ja muille toimijoille. Kielitaidon arviointiin tarkoitettujen osioiden sisällyttäminen kansalaisuuskokeeseen tekisi uudesta koejärjestelmästä huomattava
