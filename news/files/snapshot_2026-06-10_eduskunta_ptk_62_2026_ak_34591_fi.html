class=\"DocumentBreadCrumb\">\u003Cspan class=\"font-semibold\">Asiakirjat\u003C/span>\u003C/li>\n    \u003C/ol>\n   \u003C/nav>\n  \u003C/div>\n \u003C/div>\n \u003Cdiv class=\"ViimeksiJulkaistuContainer\">\n  \u003Cspan class=\"ViimeksiJulkaistu\">Viimeksi julkaistu:&nbsp;\u003C/span>\u003Cspan class=\"ViimeksiJulkaistuPvm\">9.6.2026 | 16:15\u003C/span>\n \u003C/div>\n \u003Cdiv class=\"PoytakirjaAsiakohta Eduskunnanpoytakirja2020\">\n  \u003Cdiv id=\"IdentifiointiOsa\" class=\"IdentifiointiOsa\">\n   \u003Ch1>\u003Cspan class=\"edk-AsiakirjatyyppiNimi\">Pöytäkirjan asiakohta\u003C/span>\u003Cspan class=\"edk-EduskuntaTunniste\">\u003Cspan class=\"edk-AsiakirjatyyppiKoodi\">&nbsp;PTK&nbsp; \u003C/span>\u003Cspan class=\"edk-AsiakirjaNroTeksti\">62\u003C/span>\u003Cspan class=\"edk-ValtiopaivavuosiTeksti\">/2026 vp&nbsp; \u003C/span>\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"YhteisoTeksti\">Täysistunto&nbsp;\u003C/span>\u003C/span>\u003Cspan class=\"Nimeke\">\u003Cspan class=\"NimekeTeksti\">Tiistai 9.6.2026 klo 14.01\u003C/span>\u003C/span>\u003C/h1>\n  \u003C/div>\n  \u003Cdiv class=\"Asiakohta 237051\">\n   \u003Ch2>\u003Cspan class=\"KohtaNumeroTeksti\">5.&nbsp; \u003C/span>\u003Cspan class=\"KohtaNimeke\">\u003Cspan class=\"NimekeTeksti\">Hallituksen esitys eduskunnalle vuoden 2026 toiseksi lisätalousarvioksi\u003C/span>\u003C/span>\u003C/h2>\n   \u003Cdiv class=\"edk-viite b-margin\">\n    \u003Cdiv class=\"KohtaAsia\">\n     \u003Cspan class=\"AsiakirjatyyppiNimi\">Hallituksen esitys\u003C/span>\u003Cspan class=\"EduskuntaTunnus\">\u003Ca href=\"/asiat-ja-aanestykset/valtiopaivaasiat/asiakirjat/eduskuntatunnus/HE%20102%2F2026%20vp\">HE 102/2026 vp\u003C/a>\u003C/span>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"Toimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Lähetekeskustelu\u003C/div>\n    \u003Cdiv class=\"KohtaSisalto\">\n     \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n      \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n      \u003Cspan class=\"edk-colon\">:\u003C/span>\n      \u003Cp class=\"edk-KappaleKooste\">Lähetekeskustelua varten esitellään päiväjärjestyksen \u003Cspan class=\"HarvaKursiiviTeksti\">5.\u003C/span> asia. Asia lähetetään valtiovarainvaliokuntaan.&nbsp;\u003C/p>\n      \u003Cp class=\"edk-KappaleKooste\">Keskusteluun varataan tässä vaiheessa enintään 45 minuuttia. Jos puhujalistaa ei tässä ajassa ehditä käydä loppuun, asian käsittely keskeytetään ja sitä jatketaan muiden asiakohtien jälkeen. — Valtiovarainministeri Purra, olkaa hyvä.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cdiv class=\"KeskusteluToimenpide\">\n    \u003Cdiv class=\"ValiotsikkoTeksti\">Keskustelu\u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.03\">14.03&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"AsemaTeksti\">Valtiovarainministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Riikka&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.03Purra\">Purra&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(esittelypuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Hallitus antaa eduskunnalle nyt vuoden 2026 [Hälinää — Puhemies koputtaa] toisen lisätalousarvioehdotuksen. Taloudessa kuuluu parempaa, ja hallituksen talouspolitiikka on alkanut viimein tuoda tulosta. Ekonomistit eli kansantalouden asiantuntijat ovat laajasti sitä mieltä, että talouskasvu on viimein käynnistynyt meillä Suomessa, vaikka esimerkiksi Saksassa kasvu on edelleen hyvin nihkeää. Saksan nihkeys ei voi olla vaikuttamatta Suomeen, kuten ei Iranin sotakaan, joka valitettavasti otti eilen jälleen uusia kierroksia. Kasvu on siis haurasta, mutta joka tapauksessa sitä kuitenkin laaja-alaisesti kaikilla päätoimialoilla tapahtuu.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Talouspolitiikkaa tuleekin tehdä pidemmän aikavälin tarkasteluhorisontilla. Olemme sopeuttaneet taloutta suorilla toimilla 6,5 miljardilla, tervehdyttäneet työmarkkinoiden rakenteita, uudistaneet sosiaaliturvaa ja muun muassa nyt viimeisimpänä korjanneet Marinin hallituksen yrittäjien eläkelain. Paljon on silti vielä tehtävää. On myös syytä muistaa, että tekemämme uudistukset vaikuttavat viiveellä ja talouskasvua seuraava työttömyyden lasku tulee samoin viiveellä. Tuleva vuosi on varmasti jo valoisampi myös työmarkkinoilla ja tuo helpotusta työttömien vaikeaan tilanteeseen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tässä lisätalousarvioehdotuksessa teemme uusia toimia tilanteen helpottamiseksi. Nuorten rekrytointitukeen ehdotetaan yhteensä 20 miljoonaa euroa. Määräraha riittäisi vähintään 3&nbsp;300 työttömän nuoren työllistämiseen. Nuorisotyöttömyyden ehkäisemisen pilotteihin ehdotetaan 15 miljoonaa. Valtionhallinnon kesätyöntekijöiden ja harjoittelijoiden lisärekrytointiin ehdotetaan neljä miljoonaa euroa. Lisäksi pitkäaikaistyöttömien osaamissetelistä aiheutuviin kustannuksiin ehdotetaan yhteensä 20 miljoonaa euroa. Ison korjausrakentamisen paketin lisäksi teemme julkisia investointeja infraan ja väyliin. Tämä on järkevää ja vastuullista suhdannepolitiikkaa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toisaalta sopeutamme toissijaisista menoista. Muun muassa järjestöjen tuki vähenee edelleen, samoin kehitysavun määrä. Valtionhallinnon tuottavuusohjelmaa jatketaan ja laajennetaan. Kehysriihessä satsasimme edelleen lisää Puolustusvoimiin. Maavoimien uudistaminen vaatii resursseja. Toivon, että kotimainen puolustusteollisuutemme saa myös vauhtia merkittävistä panostuksistamme puolustusvälineiden hankintoihin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Meillä on ensi kertaa käsissämme lisätalousarvioehdotus, jossa pääsemme korjaamaan verotuloarviota ylöspäin. Tämä on seurausta alkaneesta talouskasvusta ja hallituksen talouspolitiikasta. Verotuloissa arvonlisäveron kertymää ehdotetaan korotettavaksi 122 miljoonalla perustuen huhtikuussa julkaistuun kokonaistaloudelliseen ennusteeseen. Sekalaisten tulojen arviota korotetaan 113 miljoonalla. Lisätalousarvio sisältää kevään kehysriihessä linjattuja työllisyystoimia sekä panostuksia droonien torjuntaan ja puolustukseen laajemmin. Vuoden 2026 toisessa lisätalousarvioesityksessä määrärahatarve kasvaa 420 miljoonaa euroa, varsinaisten tulojen lisäys on 131 miljoonaa, ja nämä yhdessä lisäävät nettolainanoton tarvetta 289 miljoonaa euroa. Nettolainanoton valtiolla vuonna 2026 arvioidaan olevan noin 11,1 miljardia euroa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Sota Ukrainassa säteilee meille, sillä drooneja voi lentää jatkossakin erehdyksessä ilmatilaamme. Siksi Rajavartiolaitokselle ehdotetaan 44 miljoonan euron lisärahoitusta ja poliisille vastaavasti 6,2 miljoonaa droonitorjuntakyvyn vahvistamiseen. Lisäksi Rajavartiolaitokselle ehdotetaan resursseja miehittämättömien valvontajärjestelmien hankintaan ja käyttöönottoon perustetun hankkeen käynnistämiseen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kansainvälisen tilanteen vuoksi hallitus tekee myös panostuksia huoltovarmuuteen energian osalta. Ehdotamme 10 miljoonan määrärahaa Huoltovarmuuskeskukselle energiaturpeen varmuusvarastointia varten. Lisäksi olemme tuomassa ensi vuoden talousarvioon uutta kahdeksan miljoonan euron kokonaisuutta talvienergiatukeen, josta neljä miljoonaa euroa menee turpeen varmuusvarastointiin ja tuotantovarauksiin ja toiset neljä miljoonaa euroa voimalaitosten käyttöjen jatkamiseen muun muassa CHP-voimaloiden osalta. Näin turve säilyttää asemansa energiapaletissa. [Keskustan ryhmästä: Neljä miljoonaa!]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Puolustussatsauksia tehdään siis edelleen lisää. Puolustusvoimille ehdotetaan 25 miljoonan euron lisärahoitusta materiaalin kunnossapitoon ja varustamiseen. Puolustusministeriön toimintaedellytysten parantamiseksi muuttuneessa turvallisuusympäristössä ja Nato-jäsenyyden myötä lisääntyneiden resurssitarpeiden kattamiseen ehdotetaan kahden miljoonan euron lisäystä. Lisäys katetaan siirtona Puolustusvoimien toimintamenoista. Puolustusmateriaalihankintojen vuoden 2020 tilausvaltuuden enimmäismäärään ehdotetaan lisää 1&nbsp;057 miljoonaa euroa materiaalihankintoihin, jotka ajoittuvat vuosille 2026—2032. Tilausvaltuuksien lisäyksistä vuosille 26—28 kohdentuvista maksuista 562 miljoonaa katetaan aiemmin myönnetyillä määrärahoilla. Kotimaisen puolustusteollisuuden tukemiseen ehdotetaan 18,3 miljoonaa euroa avustuksena.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ukrainan tukemiseksi tarkoitettuihin aloitteisiin osallistumiseen ehdotetaan 44,3 miljoonan euron lisärahoitusta. Kotimaiselta teollisuudelta Ukrainan tarpeisiin tehtäviin hankintoihin liittyvää tilausvaltuutta ehdotetaan korotettavaksi 50 miljoonalla eurolla, mikä kasvattaa vastaavalla määrällä vuoden 2026 puolustusmateriaalihankintojen määrärahaa. Ukrainaan toimitettuun 31. tukipakettiin sisältyneen puolustusmateriaalin korvaaviin hankintoihin tarkoitettua Ukrainan tukemisen tilausvaltuutta ehdotetaan korotettavaksi 96,8 miljoonaa. Tähän liittyvät maksut ajoittuvat vuoteen 2028. Lisäksi Puolustusvoimille ehdotetaan 5,7 miljoonan euron lisäystä Ukrainalle annettavan koulutus- ja materiaalituen kustannusten kattamiseen. Näin ollen voidaan huomata, että lisätalousarvion lisämenotarpeet kohdistuvat erittäin voimakkaasti turvallisuuteen, Ukrainaan, puolustukseen ja huoltovarmuuteen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Suhdannepoliittisesti hallitus päätti 110 miljoonan euron rakennuspaketista korjausrakentamisen elvyttämiseen. Tänä vuonna siis toivon mukaan taloyhtiöt tekevät päätöksiä energiatehokkuutta parantavista remonteista, sillä niihin on saatavissa valtiolta avustuksia tänä vuonna ja myös ensi vuonna. Rakentaminen on keskeinen osa talouttamme, ja nollakorkoaikana luotiin niin iso rakentamisen kupla asuntomarkkinoille, että korjausrakentamisen tukeminen on oikea tapa tukea rakentamisen elpymistä. Tässä lisätalousarvioehdotuksessa varaamme korjausrakentamisen pakettiin 25 miljoonaa euroa, ja loppurahoitus varataan syksyn lisätalousarvioon ja ensi vuoden talousarvioon. Näin saamme rakentamisen käyntiin ja työtä laajasti suomalaisille.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Hallitus ehdottaa myös panostuksia lukuisiin uusiin väylähankkeisiin. Lisäksi useiden jo päätettyjen liikennehankkeiden valtuuksiin ehdotetaan korotusta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hallituksen maahanmuuttopolitiikkaan sisältyy uusi kansalaisuuskoe liittyen kansalaisuutemme saamiseen. Suomen kansalaisuus pitää ansaita osoittamalla, että sitoutuu suomalaisiin arvoihin ja yhteiskuntamme yhteisiin pelisääntöihin. Maahanmuuttoviraston toimintamenoihin ehdotetaan 4,2 miljoonan euron lisäystä kansalaisuuslain muuttamista valmistelevaan hankkeeseen. Käytännössä rahoitus menee uuden kansalaisuuskokeen tekemiseen ja sen käyttöönottoon liittyviin kustannuksiin. Ulkomaalaislain muutokseen liittyviin kertaluonteisiin kustannuksiin ehdotetaan kaksi miljoonaa euroa. Lisäksi maastapoistamis- ja noutokuljetuksista aiheutuviin menoihin ehdotetaan lisäystä 1,5 miljoonaa. Maasta poistamiset ovat kasvaneet, hyvä niin, sillä lainsäädäntömme on tältäkin osin merkittävästi kiristynyt.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Vielä joitakin nostoja esityksestämme. Tuomioistuimille ehdotetaan 4,7 miljoonaa ja Syyttäjälaitokselle 2,2 miljoonaa euroa ruuhkan purkuun. Oikeudenhoidon resursseja ja niiden oikeasuhtaisuutta arvioidaan laajemmin osana valmisteilla olevaa oikeudenhoidon selontekoa. Petoeläinten aiheuttamien vahinkojen korvaamiseen ehdotetaan 4,4 miljoonaa lisäystä suurpetojen aiheuttamien porovahinkojen korjaamiseksi.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ja aivan lopuksi: Suomen riistakeskus saa lisää resursseja valkoposkihanhien ja merimetsojen poikkeuslupapäätösten käsittelyyn sekä tietojärjestelmämuutoksiin näiden lajien siirtyessä syksyllä metsästettäviksi riistalajeiksi. [Perussuomalaisten ryhmästä: Loistava päätös!]&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia, ministeri. — Edustajat voivat niin halutessaan pyytää minuutin vastauspuheenvuoroja painamalla V-painiketta ja nousemalla seisomaan. — Valtiovarainvaliokunnan puheenjohtaja, edustaja Lohi, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.13\">14.13&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Markus&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.13Lohi\">Lohi&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Valtiovarainministerin mainitsemat myönteiset talousuutiset koskevat Suomen kansantaloutta, niistä me iloitsemme, ja toivomme, että ne jatkuvat. Ne uutiset valitettavasti eivät koske julkista taloutta. Kun Suomi nyt julkisessa taloudessa velkaantuu aivan ennätystahtia, työttömyys on Euroopan korkein, korkokulut nousevat, tuoko hallitus eduskuntaan lisätalousarvion, jossa hillitään velkaantumista? Ei, vaan hallitus tuo tänne saliin lisätalousarvion, jossa kiihdytetään Suomen velkaantumista niin, [Sanna Antikainen: Mistä te olisitte leikanneet?] että se nousee 13,4 miljardiin euroon tänä vuonna. Ja ne myönteiset uutiset arvonlisäverotuottojen kasvustakin koskevat ensimmäistä lisätalousarviota, eivät joulukuun varsinaista budjettia, josta ollaan edelleen arvioissa jäljessä noin 200 miljoonaa euroa. Ja mitä tekee pääministeri? Lupaa puoluekokouksessa miljardiluokan veronalennuksia, eli kuoppa vain syvenisi. Silloin kun ollaan kuopassa, kannattaisi lopettaa kaivaminen ja alkaa nousta sieltä ylös. Tämä koskee myös julkista taloutta. [Sanna Antikainen: Olisitte muistaneet tuon viime kaudella!] &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Valiokunnan varapuheenjohtaja, edustaja Hyrkkö, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.14\">14.14&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Saara&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.14Hyrkkö\">Hyrkkö&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vihr&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! On helppo yhtyä tähän valiokunnan puheenjohtajan puheenvuoroon. Kyllä jää aika paljon toivomisen varaa tässäkin hallituksen lisätalousarviossa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tartun nyt kuitenkin yhteen asiaan, johon myöskin hallitus on yrittänyt tarttua, ja kiitän tietenkin niistä panostuksista, joita olette tehneet nuorten työllisyystilanteen helpottamiseksi. Kuten olemme kuitenkin lukeneet, nämä hallituksen käyttöön ottamat keinot eivät ole saaneet suuren suurta suosiota tähän mennessä, ja niiden vaikuttavuutta voidaan ehkä pitää jossain määrin kyseenalaisena. Nuorten työttömyysluvut ovat niin karuja, että nyt täytyisi ottaa koko keinovalikoima käyttöön. Se on niin yksilöiden kuin koko yhteiskunnankin kannalta kohtalokasta, jos emme saa rakennettua nuorille siltaa tämän heikon työllisyystilanteen yli ja puututtua siihen räjähdysmäisesti kasvaneeseen nuorten pitkäaikaistyöttömyyteen. Valtiolla ei ole aivan liikaa keinoja, mutta voisiko edes ajatella sitä, mitä vihreät ovat esittäneet: kun yritystukien karsiminen on ollut hallitukselle vaikeaa, niille rahoille saataisiin hiukan enemmän vastinetta, kun liitettäisiin yritystukiin velvollisuus työllistää nuoria? [Puhemies koputtaa] Tarttuisitteko tähän ehdotukseemme? &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Heinonen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.15\">14.15&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Timo&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.15Heinonen\">Heinonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Ymmärrän, että edustaja Lindtman lähti salista, sillä nyt taloudessa näkyy niitä hyviä merkkejä, joita hän on pelännyt. Euroopan nopein kasvu: bkt 0,9 ensimmäisellä neljänneksellä. Vienti vetää taas: [Timo Harakan välihuuto] pk-yritykset 46,3 prosenttia vuoden 24 tasoon. Suomeen investoidaan jälleen: plus 14 prosenttia edellisvuodesta. [Välihuuto perussuomalaisten ryhmästä] Tilauskirjat täyttyvät: 7,7 prosenttia teollisuuden uudet tilaukset edellisvuodesta, ja ostovoima on vahvistunut. Itse asiassa palkansaajien ostovoima on nyt viimein palautunut siitä Marinin hallituksen syvästä dropista. Se on hieno uutinen. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Valtiovarainministeri Purra, on totta, että meillä on liikaa tässä maassa työttömiä. Nuorten työttömyys on vaikeassa tilanteessa. Minkälaisia keinoja teillä on työkalupakissa nuorten työttömyyden helpottamiseksi? [Tuomas Kettunen: Edustaja Heinonen, on niin kova meno!] &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Jari Koskela, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.16\">14.16&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Jari&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.16Koskela\">Koskela&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitoksia, arvoisa herra puhemies! Oppositio näyttää arvostelevan hallitusta velkaantumisesta, mutta samaan aikaan se vastustaa lähes kaikkia toimia, [Keskustan ryhmästä: Syystä!] joilla velkaantumista hillitään. Tämä ristiriita on kyllä hyvin räikeä. Ei voida uskottavasti vaatia vastuullista talouspolitiikkaa ja samalla perua säästöjä, lisätä menoja, kiristää työn ja yrittämisen verotusta sekä vastustaa työmarkkinauudistuksia. Orastavan kasvun keskellä Suomi tarvitsee vakautta, ei opposition politiikassaan lietsomia epävarmuustekijöitä. Hallitus tekee vaikeita päätöksiä, koska jonkun on korjattava julkista taloutta. Perussuomalaisten linja on, että säästöt kohdistetaan ensisijaisesti toissijaiseen, samalla kun työ, turvallisuus ja huoltovarmuus turvataan — myöskin tämä turveasia on hyvin tärkeä muistaa, se 10 miljoonaa. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Lindén, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.17\">14.17&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Aki&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.17Lindén\">Lindén&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Oli oireellista, että valtiovarainministeri luetteli kovin monia panostuksia ja määrärahojen lisäyksiä, koska eikös tilanne nyt ole niin, että meidän kaikkein suurin ongelmamme valtiontaloudessa on tällä hetkellä tuo 13,5 miljardin vajaus tälle vuodelle, ja nyt tämä vajaus eli velanotto vain kasvaa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mitä tulee sitten siihen, että siellä oli ensimmäisen kerran pientä verotulojen kasvua, niin ensimmäisessä lisätalousarviossa arvonlisäveron määrä väheni arvion mukaan 323 miljoonaa, ja nyt siinä tapahtui pieni notkahdus, onneksi parempaan suuntaan, 122 miljoonaa euroa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta tämä kokonaiskuva: kun meidän tulisi nimenomaan keskittyä nyt tähän velan jatkuvan kasvun pysäyttämiseen, niin se vaatisi, että myös muunlaisia ratkaisuja tehdään kuin vain ja ainoastaan niitä, joita hallitus on tehnyt, joissa kaikkein heikompiosaisilta otetaan tiettyjä etuuksia pois. Meillä on rikkaitten veronalennuksia ollut, meillä on yhteisöveronalennuksia tulossa. [Puhemies koputtaa] Kyllä tämä kokonaisuus pitäisi kohdistaa nimenomaan siihen velan hallintaan. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Kalmari, edustaja Kalmari taitaa olla poistunut. — Edustaja Hoskonen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.19\">14.19&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Hannu&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.19Hoskonen\">Hoskonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Todellakin meillä on taloudessa valonpilkahduksia, ja hyvä näin, mutta meidän pitää... Kun näemme, mitkä ovat nämä tulevan vaalikauden sopeutustarpeet, niin lähellä 15:tä miljardia pyöritään. Elikkä meillä on iso rakenteellinen vika tässä suomalaisessa yhteiskunnassa ja talouselämässä. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Meidän pitää ensinnäkin lopettaa tämä arvopuun poltto tästä maasta. Björn Wahlroos varoitti teitä ja meitä kaikkia, teitäkin, arvoisa ministeri, myös kaikkia muita suomalaisia, että metsäteollisuus on tällä ajamassa itseään alas. Miksi? Me tämän typerän turveveivauksen takia olemme tehneet sen virheen, että 5—7 miljoonaa mottia palaa arvokasta puuta, mäntytukkia parhaasta päästä viedään polttokattilaan. Se on suurinta typeryyttä, mitä minä metsäisen maan tiedän tekevän. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ja sitten saman päälle tulee tietysti energian hinnan nousu. On hyvä, että saitte tämän kymmenen miljoonaa euroa siihen, jotta turvetta nousee, mutta sehän on vain varmuusvarastoturvetta. Sillä ei lämmitetä yhtään pakkasella, vaan meidän pitää saada kotimainen turve kunniaan ja lopettaa tämä muiden maiden mielistely. Polttaahan Saksa kivihiiltä ja öljyä ja vaikka mitä, maakaasua, eikä häiritse mitään. Toivon, arvoisa ministeri, yhä enemmän rohkeutta. [Puhemies koputtaa] Teillä sitä jo on, mutta toivon vielä enemmän. [Perussuomalaisten ryhmästä: Hyvä puheenvuoro!] &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Krista Mikkonen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.20\">14.20&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Krista&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.20Mikkonen\">Mikkonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vihr&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Talousarviot peilaavat aina hallituksen arvoja, ja tietysti tällä vaalikaudella kaikki nämä hallituksen talousarviot ja tämä lisätalousarviokaan eivät tee poikkeusta. [Sanna Antikainen: Turvallisuus etusijalla, toisin kuin teillä!] Rahaa on rikkaille, on fossiilisille tukia, on turpeelle, mutta sitä ei löydy köyhyyden torjuntaan, kansanterveyteen tai koulutukseen. On ymmärrettävää, että tänä aikana täytyy puolustukseen satsata, mutta haaste on se, miten me pystymme turvaamaan myös muut tarpeet, ja siksi vihreät ovat ehdottaneet puolustusveroa yhdeksi työkaluksi sen varmistamiseksi.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Nostan tästä lisätalousarviosta tuon Metsähallituksen tuloutustavoitteen nostamisen, jota tehdään nyt kolmatta tai neljättä kertaa tällä vaalikaudella, ja se kyllä johtaa liiallisiin hakkuihin valtion metsissä. Samaan aikaan suomalaiset ihmettelevät, kuinka valtion metsien retkeilypalveluita vähennetään. Itse asiassa ehdotankin, voisiko yksi keino nuorisotyöttömyyden vähentämiseksi olla se, mikä tehtiin kaudella 2012—2014, jolloin Metsähallitukseen palkattiin nuoria [Puhemies koputtaa] Luontopalveluihin, niin sinne opastukseen kuin rakenteiden [Puhemies koputtaa] ylläpitoon.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Sarkkinen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.21\">14.21&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Hanna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.21Sarkkinen\">Sarkkinen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vas&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Hallitus ei ole onnistunut taloustavoitteiden saavuttamisessa, ja tämänkin lisätalousarvion myötä velkaantuminen lisääntyy. Lisätalousarvio kertoo myös karua ja murheellista kuvaa Suomen työttömyyden korkeasta tasosta, hälyttävän korkeasta. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On hyvä, että hallitus päätti kehysriihessä joistain lisätoimista työllisyyden hoidossa. Kuitenkaan toimien mittakaava ei vastaa tilanteen vakavuutta. Heikossa suhdannetilanteessa ja erittäin korkean työttömyyden vallitessa me tarvitsemme aktiivisen työllisyyspolitiikan keinoja ihmisten työelämäosallisuuden ja toimeentulon kannattelemiseksi sekä pysyvän työmarkkinoilta syrjäytymisen ehkäisemiseksi. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">On hyvä, että hallitus keventää nuorten työllistymisseteliehtoja niin, että myös yhdistykset ja säätiöt voivat sitä käyttää ja muutenkin helpottaa sen käyttöä. Tämän toivotaan piristävän setelin kysyntää. On kuitenkin kysyttävä, miksi vasta nyt. Kun asiaa käsiteltiin viime vuonna eduskunnassa, oppositiosta peräänkuulutettiin setelin laajempaa käyttöalaa. Mutta nyt kun uudistatte ehtoja, niin tehkää se niin, että eduskunnan käyttämät määrärahat saadaan myös käytettyä [Puhemies koputtaa] nuorten työllistämisen hyväksi. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Viitanen, olkaa hyvä. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.22\">14.22&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Pia&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.22Viitanen\">Viitanen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Toden totta, meillä on hurja velkatilanne ja velkavuori sen kun kasvaa ja työllisyystilanteemme on äärimmäisen huono. Juuri siksi SDP on kolme vuotta esittänyt useita keinoja, joilla työllisyystilannettamme parannettaisiin, [Timo Heinonen: Olisi esittänyt neljä vuotta sitten!] ja on erittäin hyvä, että hallitus on nyt tarttunut joihinkin näistä SDP:n esittämistä vaihtoehdoista, kuten tämä energiatehokkuusavustus asuinrakennuksille. Esitimme tätä jo kolme vuotta sitten, koska rakennusala oli kriisissä ja tarvitsi paljon tukea, tarvitsee edelleen, ja silloin hallitus raivoisasti vastusti tätä SDP:n esitystä. Mutta ihan hyvä, ministeri, että olette tähän nyt tarttuneet, sillä toden totta, tämänkaltaisia tukitoimia edelleen tarvitaan. SDP:hän tuolloin esitti myös kotitalousvähennyksen parantamista, jota hallitus raivokkaasti vastusti, mutta hyvä, että siihenkin päätitte tarttua. SDP esitti työmatkavähennyksen parantamista, jota hallitus vastusti raivokkaasti, mutta hyvä, että siihenkin päätitte siellä kehysriihessä tarttua. Eli joistain hyvistä asioista olette ottaneet koppia, ja toivottavasti sitten niiden avulla [Puhemies koputtaa] tämä työllisyyskin kohenee. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Kettunen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.24\">14.24&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Tuomas&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.24Kettunen\">Kettunen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kunnioitettu herra puhemies! Kiinnostaa muutama asia.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ensinnäkin nämä petoeläinvahingot: Hyvä, että sinne tulee määrärahalisäystä se 4,4 miljoonaa, mutta laittakaa tämä suurpetoasia nyt vihdoin ja viimein kuntoon karhun osalta, niin ei tarvitsisi 4,4:ää miljoonaa käyttää jatkossa valtion rahoja suurpetoeläinkorvauksiin ja -vahinkoihin. Jos se suurpetoasia olisi kunnossa, niin tämäkin raha käytettäisiin vanhusten ja lasten hoitamiseen. [Petri Huru: Eikö susiasia ole kunnossa jo?]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Sitten on tämä turpeen kunnianpalautus, minkä Suomen eduskuntavaaleissa perussuomalaiset toivat esille. [Välihuutoja perussuomalaisten ryhmästä] Se kunnianpalautus on nyt kymmenen miljoonaa euroa tähän turpeen varmuusvarastointiin. [Jenna Simula: Keskusta tarvitsisi kunnianpalautuksen!] No, nähtäväksi jää, miten se kymmenen miljoonaa tulee riittämään. [Timo Heinonen: Vastustaako keskusta sitä?]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Maahanmuuttoon on tulossa yli 80 miljoonaa euroa lisärahaa, kun tätä talousvuotta on vasta puolet käyty. Kysymys kuuluu valtiovarainministerille: Onko teillä jollain tavalla nyt laskin jäänyt kotiin, koska te ette ole tarpeeksi budjetoinut maahanmuuttoon liittyviä rahoja? Mihin perustuu se, [Puhemies koputtaa] että puoli vuotta on tätä budjettikautta jäljellä ja te jo 80 miljoonaa [Puhemies koputtaa] laitatte lisää rahaa maahanmuuttoon?&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Satonen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.25\">14.25&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Arto&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.25Satonen\">Satonen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Tässä on useita tärkeitä asioita, mutta keskeisimmät asiat valtiovarainministeri jo omassa puheenvuorossaan toki totesi.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Se, että verotulokertymässä on nyt tapahtunut muutos, on todella iso asia. [Timo Harakka: Onko se pysyvä muutos?] Se kuvastaa sitä, että talous on kääntynyt nousuun. Kun edustaja Heinonen täällä omassa puheenvuorossaan totesi useita näitä lukuja, niin en lähde niitä toistamaan. Tämä on merkittävä muutos, ja tämä saattaa olla signaali siitä, että tämä kehitys tulee jatkumaan, ja todennäköisesti onkin.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toinen asia on se, että työllisyystilanne paranee tietysti viiveellä, ja sen takia on tärkeätä, että toteutetaan niitä täsmätoimia juuri tähän tilanteeseen liittyen. Sen takia nämä panostukset täällä nuorisotyöttömyyden kitkemiseksi tai sen tilanteen helpottamiseksi ja myös pitkäaikaistyöttömien tilanteen helpottamiseksi ovat juuri oikeita täsmätoimia, mitä tässä tilanteessa tarvitaan.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Vähämäki, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.26\">14.26&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Ville&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.26Vähämäki\">Vähämäki&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kunnioitettu puhemies! Kasvu on laaja-alaisesti lähtenyt käyntiin. Eilen kävin kolmessa kunnassa, Haapavedellä, Nivalassa ja Oulaisessa, ja kaikkialla suhtauduttiin positiivisin mielin tulevaan. Hallituskin sai kiitosta YEL-uudistuksesta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kun me katsotaan sitä, miksi siellä suhtaudutaan positiivisesti, niin pelkästään Oulu Eteläisen dataikkunassa on 132 hanketta ja Pohjois-Pohjanmaan ja Kainuun osalta on tunnistettu 60 isompaa hanketta. Osa näistä lähtee liikkeelle, epäilen, että jo tämän vuoden aikana. Pääoman saatavuus tietenkin nähtiin haasteeksi, mutta tämä vain osoittaa sitä, että kasvu on käynnistynyt hyvin laaja-alaisesti. Se vaikuttaa meidän bkt:hen, vientimahdollisuuksiin, työpaikkoihin. Meillä kuluttajaluottamus on kohentunut, kulutuskysyntä on myöskin kasvanut, ja ulkomaalaisia matkailijoita on yöpynyt jatkuvasti enemmän.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tästä lisäbudjetista vielä: Tämä on laaja puolustukseen keskittyvä lisäbudjetti, missä muun muassa tilausvaltuuksia Puolustusvoimille [Puhemies koputtaa] kasvatetaan 1&nbsp;057 miljoonaa. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Joona Räsänen, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.27\">14.27&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Joona&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.27Räsänen\">Räsänen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Jäin pohtimaan, että tässä kun on nyt kolme vuotta tätä keskustelua käyty, niin pitäisikö meidän nyt pikkuhiljaa päästä yhteisymmärrykseen siitä, mikä on se luku, jota ihan yhteisesti tässä salissa käyttäisimme, kun puhumme niistä toimenpiteistä, joilla hallitus on julkista taloutta vahvistanut. Tässä salissahan on käytetty 10:tä miljardia monesti, valtiovarainministeri käytti omassa puheessaan 6,5:tä miljardia, valtiovarainministeriö on tänä keväänä käyttänyt 4:ää miljardia ja viimeisimpänä 2,8:aa miljardia, eli kaikkien niiden hallituksen päätösten, kun katsotaan yhteisvaikutukset, julkista taloutta vahvistava vaikutus vuoden 27 tasossa on 2,8 miljardia euroa, ei siis 10:tä miljardia, 6,5:tä miljardia, 4:ää miljardia, vaan 2,8 miljardia euroa. Kun nyt valtiovarainministeriöltä se luku on tullut, niin kai siihen voisi nyt luottaa. Siksipä kysyisin, voisimmeko — huomenna jälleen salissa käsittelemme koko julkisen talouden suunnitelmaa — nyt yhdessä päättää, [Puhemies koputtaa] mikä on se luku, jota tästä eteenpäin kaikki me voisimme käyttää. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Siponen, olkaa hyvä. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.29\">14.29&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Markku&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.29Siponen\">Siponen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitos, arvoisa herra puhemies! Tässä edustaja Kettunen käytti hyvän puheenvuoron maahanmuuton kustannuksista. Yli 80 miljoonaa lisää sinne, kustannuksia lähes tuplataan. Tuossa avauspuheenvuorossa ei valtiovarainministeriltä kuultu tähän selvitystä, niin että olisi mielenkiintoista se kuulla. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta toiseen asiaan: Nämä kuntien maksamat sakkomaksut näistä työttömistä: Olimme tuossa viime viikonloppuna Tampereella, ja siellä kuulimme, että Tampereen kaupungissa maksetaan yli 50 miljoonaa euroa näitä sakkomaksuja, yli 50 miljoonaa tamperelaisten veronmaksajien pussista. Voi tietysti kysyä, onko tamperelaisten vika tämä suurtyöttömyys, mikä tällä hetkellä Suomessa on. Keskustan mielestä näitä sakkomaksuja voisi käyttää paljon järkevämmin — kuntien sakkomaksuja ja työttömyysturvaa — esimerkiksi tähän nuorten takuutyöhön, jota olemme esittäneet ja jolla jokainen vastavalmistunut nuori saisi sen ensimmäisen työpaikan. Voisitteko, arvoisa valtiovarainministeri ja hallitus, tarttua tähän keskustan ajatukseen? &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Haluaako valtiovarainministeri käyttää tässä kohdassa vastauspuheenvuoron? [Riikka Purra: Mieluusti, joo!] — 4 minuuttia, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.30\">14.30&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"AsemaTeksti\">Valtiovarainministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Riikka&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.30Purra\">Purra&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Kiitoksia edustajille keskusteluista. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Oikeastaan jo tämä peruslähtökohta, se, miten sosiaalidemokraatit ja keskusta, osin myös vasemmistoliitto, lähtivät tätä käsittelemään, kertoo siitä samasta, mitä me olemme koko vaalikauden täällä todistaneet. Kiinnititte aivan oikein huomiota siihen, että alijäämä kasvaa, velka kasvaa, ja edustaja Lindén kaikkein suorimmin totesi, miksei keskitytä velan hallintaan. Samaan aikaan luulen, että tässä lisätalousarviossa ei todennäköisesti ole yhtään menolisäystä, jota te vastustaisitte. Tässä lisätalousarviossa keskitytään turvallisuuteen, puolustukseen, droonitorjuntaan, aseisiin, huoltovarmuuteen, turpeeseen, energiahuoltovarmuuteen, Ukrainan merkittävään tukemiseen, korjausrakentamiseen, rakennusalan korjauspakettiin, nuorisotyöttömyyden korjauksiin, valkoposkihanhiin ja merimetsoihin, infrahankkeisiin Kouvolaan ja Kuopioon ja vähän muuallekin. No, ehkä voin ymmärtää, että sosiaalidemokraatit ja keskusta varmasti vastustavat näitä maahanmuuton kiristyksiin liittyviä menolisäyksiä eli kansalaisuuskoetta ja maasta poistamisen lisärahaa, mutta mikäli te kykenette... [Keskustan ryhmästä: Eihän vastusteta!] — Ette sitäkään vastusta. Eli te ette vastusta yhtään ainoata menolisäystä tästä talousarviosta, mutta sen sijaan te moititte sitä, että se lisää alijäämää. — Tässä oikein alleviivattuna opposition yleinen kanta: kritiikkiä, joka ei perustu kerta kaikkiaan yhtään mihinkään. [Välihuutoja keskustan ryhmästä] &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Edustaja Räsänen, tiedän, että oppositiolle ei ole aina helppo ymmärtää brutto- ja nettosopeutuksen eroa, mutta jälleen kerran kerron teille nämä luvut, jotka olen täällä useampaan otteeseen kertonut. Te kysyitte, mihin tämä 6,5 miljardia nyt viittaa. No, muun muassa valtioneuvoston yleisistunnossa 21.5. mainitaan valtioneuvoston selonteossa liiallisen alijäämän korjaamisesta. Ensimmäisellä sivulla lukee: ”Hallitus on sopeuttanut julkista taloutta suoraan yli 6,5 miljardilla eurolla. Velkasuhteen kasvuun vaikuttavia päätöksiä hallitus on tehnyt vaalikaudella noin 10 miljardilla eurolla.” Sama luku löytyy julkisen talouden suunnitelmasta, johon itsekin viittasitte. Sieltä löytyy suora sitaatti: ”Hallitus on päättänyt noin 10 miljardin euron toimenpidekokonaisuudesta. Toimenpidekokonaisuudesta noin 5 miljardia euroa muodostuu vuoden 2027 tasolla julkisen talouden menoja sopeuttavista toimista ja noin 1,5 miljardia euroa verotoimenpiteistä.” [Joona Räsänen: Se on brutto! — Keskustan ryhmästä: Se on brutto!] Eli voitte hyvin vahvasti viitata tähän 6,5:een. Ja juuri tähän minä viittasin, että teille ei tunnu olevan selvää, mikä on brutto- ja nettosopeutuksen ero. [Pia Viitanen: Bruttosopeutus!] &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mitä näistä lisätalousarvion menopuolen toimista te vastustatte: puolustusta, turvallisuutta, Ukrainaa, huoltovarmuutta, työttömyyden korjaamista, korjausrakentamista, infraa, maasta poistamista, kansalaisuuskoetta. Mikäli te ette pysty kertomaan yhtään panostusta, jota te vastustatte, teillä ei ole yksinkertaisesti logiikkaa tässä. [Perussuomalaisten ryhmästä: Vaietkaa iäksi!]&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Yritystukiin edustaja Hyrköltä tuli hyvä puheenvuoro. Tämä hallitushan on sopeuttanut yritystuista yli 400 miljoonaa euroa bruttona. [Perussuomalaisten ryhmästä: Tehkääpä perässä!] Kyllä, me olemme myös lisänneet niitä, joten netto jää huomattavasti pienemmäksi. Suurin yritystukikokonaisuus, johon me olemme rahaa laittaneet, on puhtaan siirtymän verohyvitys. En usko, että vihreät sitä vastustavat, [Petri Huru: Totta kai vastustaa!] mutta samaan aikaan olen sitä mieltä, että näitä pitää pystyä edelleen merkittävästi perkaamaan. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kysyttiin lisäksi nuorten työllistämisestä. Tietenkin talouden kasvu on se kaikista tärkein, joka koskettaa kaikkia ihmisryhmiä ja parantaa heidän työllistymistään, mutta tässä lisätalousarviossa on myös näitä muita toimenpiteitä eli nuorten rekrytointituki, nuorisotyöttömyyden ehkäisemisen pilotteja, valtionhallinnon kesätyöntekijöitä, harjoittelijoita ja pitkäaikaistyöttömien osaamisseteli. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Vielä lopuksi edustaja Kettuselle: &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kysyitte, mihin perustuvat nyt nämä merkittävät maahanmuuton lisäykset. Ne liittyvät ukrainalaisiin, [Tuomas Kettusen välihuuto] kuten uskon, että te tiesittekin, [Perussuomalaisten ryhmästä: Eli vastustatteko sitä? — Perussuomalaisten ryhmästä: Kettunen! — Puhemies koputtaa] ukrainalaisten siirtymiseen vastaanottopalveluihin ja muualle. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Sen sijaan tässä lisätalousarviossa kyllä laitetaan joitakin miljoonia myös niihin maahanmuuton kiristyksiin, jotka edellyttävät toimenpiteitä, jotka olen nyt jo moneen kertaan maininnut, eli maasta poistamiseen. Poliisi tarvitsee lisää resursseja, että se saa tästä maasta poistettavia ulkomaalaisia palautettua omiin kotimaihinsa, ja sen lisäksi kansalaisuuskokeen valmisteluun. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mielestäni puheenvuorossanne tunnuttiin myös vastustavan näitä meidän turvetoimenpiteitä, [Hälinää — Puhemies koputtaa] mitä jälleen ihmettelen, koska keskusta ei näiden asioiden eteen kyennyt viime kaudella tekemään yhtään mitään. Mielestäni nämä eivät ole aivan mitättömiä: 10 miljoonaa euroa tässä lisätalousarvioehdotuksessa Huoltovarmuuskeskukselle, lisäksi ensi vuodelle uusi tukivalmistelu, jossa ensi vuodelle tulee 8 miljoonaa euroa, josta puolet suoraan turpeelle ja puolet esimerkiksi EHP-laitosten käyttöiän pidentymiseen, [Petri Huru: Tätäkään ei keskusta saanut viime kaudella aikaiseksi!] mikä on edellytys sille, että energiaturvetta kyetään hyödyntämään. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Te tunnuitte myös vastustavan sitä, mitä me teemme merimetsojen ja hanhien ja muiden osalta. Muistuttaisin myös, että tämä hallitus tekee nimenomaan [Puhemies koputtaa] metsästyksen riistapolitiikan kannalta erinomaisia toimenpiteitä, joita ei ole tässä maassa muuten aiemmin nähtykään. [Timo Heinonen: Purra löi Kettusen kanveesiin! — Sanna Antikainen: Aivan täysin!]&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Jatkamme debattia. — Edustaja Paasi, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.36\">14.36&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Martin&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.36Paasi\">Paasi&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Muun muassa edustaja Hyrkkö ja edustaja Sarkkinen nostivat esille nuorten työllistymistilanteen. Yksi lisätalousarvion painopiste onkin työllisyys, erityisesti nuorten työllisyys. Nuorten rekrytointitukeen esitetään 20 miljoonaa euroa. Sen arvioidaan riittävän noin 3&nbsp;300 työttömän nuorten työllistämiseen. Lisäksi nuorisotyöttömyyden ehkäisemiseen, pilotteihin ja pitkäaikaistyöttömien osaamisseteleihin esitetään lisärahoitusta. Konkreettinen esimerkki on nuori, joka on valmistumisen jälkeen jäänyt ilman ensimmäistä työpaikkaa. Mitä pidempään ensimmäinen työpaikka viivästyy, sitä vaikeammaksi työmarkkinoille kiinnittyminen voi muuttua. Rekrytointituella madalletaan työnantajan kynnystä palkata nuori just siinä vaiheessa, jolloin se on ratkaisevaa. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Edustaja Antikainen.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.37\">14.37&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Sanna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.37Antikainen\">Antikainen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Kiitos, arvoisa herra puhemies! Talouskasvu on totta tosiaan vihdoin alkanut, vaikka oppositio on toisin väittänyt. Tämä viivästyminen ei ole johtunut hallituksesta, vaan maailmanpoliittisesta tilanteesta, ja useat asiantuntijatkin ovat tämän ottaneet esille. Mutta onneksi nyt hallitus teki niitä toimenpiteitä, joilla talouskasvun edellytykset saatiin kuntoon.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tässä kun kuuntelin kepun melskaamista, niin tuli vaan mieleen, kuinka iloinen olen pohjoiskarjalaisena siitä, että vihdoin meillä Pohjois-Karjalassa päästään valkoposkihanhiongelman ratkaisemiseen. Ei enää keskustan ruokintapeltoja, ei enää keskustan hanhipaimenia, ei enää hanhipaimenille suojatyöpaikkoja, vaan poikkeuslupia, joilla saadaan tämä ongelma kuriin. Tätä ei muuten keskusta saanut aikaiseksi viime kaudella. — Kiitos. [Petri Huru: Ja nyt saadaan linnut myös pataan!]&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Harakka, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.38\">14.38&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Timo&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.38Harakka\">Harakka&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tässä oli näistä numeroista puhetta. En minä valtiovarainministerinä paukuttelisi henkseleitä, jos kymmenen miljardin edestä on leikattu huono-osaisilta ja vaikutus ja hyöty [Välihuutoja perussuomalaisten ryhmästä — Petri Huru: Ei huono-osaisille tullut bensarahaakaan!] jää 2,8 miljardiin. Se on todella surkea tulos, ja se pitäisi tässä nyt myöntää. Siitä pitäisi jotain oppia, samoin kuin tietenkin tästä työllisyystilanteesta. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kun on ollut ideologisesti vaikea hyväksyä sitä, että osa suomalaisista tarvitsee palkkatukea, niin tämä hallitus on vaikeuttanut vahvasti palkkatuen myöntämistä. Nyt kun on huomattu, että se on johtanut ennätystyöttömyyteen, niin sitten on kehitelty tämmöisiä nuorisoseteleitä. Miksei palkkatuki kelpaa, kun seteli on käytännössä aivan sama asia? Ongelma on se, että se nuorisosetelikään ei tämän 80&nbsp;000 työttömän nuoren osalta riitä kuin alle 10 prosentille, edes teoriassa. &nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta ongelma on se, että kun jatkuvasti näitä sääntöjä muutetaan, niin yritykset eivät osaa käyttää tätä palkkatukea ja luovuttavat sen. Siksi [Puhemies koputtaa] valtiovarainministeriö on varmaan tyytyväinen, kun tämäkin raha jää käyttämättä [Puhemies koputtaa] ja sillä tavoin säästöön. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Kalli, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.39\">14.39&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Eeva&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.39Kalli\">Kalli&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tosiasia on se, että nettosopeutus todella jää aivan murto-osaan siitä, mitä hallitus tavoitteli, ja se on kyllä hallitukselta suuri epäonnistuminen ja kaikkien suomalaisten yhteinen murhe. Velkaantuminen siis jatkuu rajuna, [Perussuomalaisten ryhmästä: Te ette yrittäneet! — Sara Seppänen: Olisitte edes jostain säästäneet!] ja kun samanaikaisesti myös työttömyystilanne on sanalla sanoen sysimusta, niin on kyllä vaikea ymmärtää niitä hallituspuolueiden edustajien puheenvuoroja, joissa on todettu tilanteen olevan valoisa, ellei jopa fantastinen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Esimerkiksi tämä nuorisotyöttömyystilanne on todella murheellinen. Nuorisotyöttömyyden nujertaminen edellyttää nyt määrätietoisia toimia, ja tämä 20 miljoonan euron panostus nuorten rekrytointitukeen ilman muuta tarvitaan, mutta se on aivan liian vaatimaton, kun tilanne siis nyt on se, että työttömiä alle 30-vuotiaita on jo lähemmäs 80&nbsp;000. [Jenna Simula: Keskusta on jakopuolue!] Toivoisin vastausta edustaja Siposen jo aiemmin esittämään kysymykseen: eikö tilanne ole riittävän vakava, että nyt kannattaisi harkita keskustan esittämää nuorten takuutyötä?&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Pauli Kiuru, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.40\">14.40&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Pauli&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.40Kiuru\">Kiuru&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa herra puhemies! Kiitos ministerille hyvästä esittelystä — varmasti tärkeitä, perusteltuja rahoja tässä tilanteessa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kaksi kysymystä:&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Edustaja Mikkonen otti esiin Metsähallituksen tuloutuksen kasvamisen kymmenellä miljoonalla eurolla ja sitoi sen kasvaneisiin hakkuumääriin. Kysymyshän voi olla myös muista tekijöistä, muista satunnaisista myynneistä tai sitten esimerkiksi puun hinnan kasvusta. [Timo Harakka: Säästetyistä polttopuista!] Tähän kysyn tarkennusta: mistä tuo summa tulee?&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toinen asia koskee sinänsä tarpeellista asiaa. Siellä on kotimaisen puolustusteollisuuden tukemiseen 18,3 miljoonaa euroa. Sitä ei ole tarkemmin avattu, onko se kohdennettu johonkin tiettyyn hankkeeseen vai onko se hakemusten kautta tulossa yritysten saataville. Jos sitä voisitte vielä tarkentaa, niin saamme viestiä kentälle eteenpäin. — Kiitos.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Simula, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.42\">14.42&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Jenna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.42Simula\">Simula&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">ps&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tässä lisätalousarviossa on monta erittäin mainiota määrärahakohdetta. Droonien torjuntaan ja puolustukseen myönnetään määrärahoja, samoin maahanmuuttopolitiikan kiristysten toimeenpanoon. Maasta poistamista tehostetaan ja kansalaisuuskoetta valmistellaan, mitkä ovat muuten pitkällä tähtäimellä säästöjä. Lisätalousarviossa lisätään myös huoltovarmuuteen 10 miljoonaa euroa turpeen varmuusvarastointia varten, ei turvekoneiden romutukseen, mihin keskusta puolestaan keskittyi. [Markus Lohi: Turpeen vero, miksi nostitte sitä?] Mielestäni on erittäin perusteltua sanoa, että tämä hallitus satsaa siihen kaikista tärkeimpään: suomalaisten turvallisuuteen ja huoltovarmuuteen [Markus Lohi: Ja velanottoon!] nimenomaan näinä aikoina. Taloudestakin on kuulunut positiivisia uutisia: talouskasvu on orastavasti alkanut. [Perussuomalaisten ryhmästä: Keskusta leikkaisi puolustuksesta!] Valitettavaa, että oppositio jatkaa synkistelyä ja keskittyy lähinnä ankeuttamaan ilmapiiriä entisestään. [Markus Lohi: Tosiasioiden tunnustaminen on viisauden alku!] &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Kokko, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.43\">14.43&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Jani&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.43Kokko\">Kokko&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! SDP on esittänyt vaihtoehtobudjeteissaan joka vuosi konkreettisia sopeutustoimia ja keinoja talouskasvun aikaansaamiseksi. Edellisessäkin sopeutuksen mittakaava oli hallituksen vastaavalla tasolla, mutta yhdeksän kymmenestä suomalaisesta hyötyi siitä enemmän, joten jos kysellään täällä, että missä ne SDP:n vaihtoehdot ja esitykset ovat olleet, niin muun muassa meidän vaihtoehtobudjeteissa, mutta edelleen nostaisin itsekin esille tämän kokonaiskuvan. Tietysti jokainen tässä salissa on varmasti tyytyväinen siihen, jos Suomen talous lähtisi vihdoin kasvuun, [Jenna Simula: Jäikö uutiset lukematta?] ja tämä 0,1 on tietysti jo hyvä etunoja siihen, mutta kun katsoo sitä kokonaistilannetta, että tällä vaalikaudella on ennennäkemätöntä, kymmenien miljardien velkaantumista, työttömyys on noussut ennätyslukemiin siitä, missä se oli tämän hallituksen aloittaessa, ja työllisyysaste on heikentynyt, niin täytyy siinä mielessä kysyä hallitukselta: uskotteko, että nämä teidän keinonne ovat heikentäneet sitä talouskasvun käynnistymistä enemmän kuin aloittaneet sen liikkeelle lähtöä? &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Oinas-Panuma, olkaa hyvä. &nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.44\">14.44&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Olga&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.44Oinas-Panuma\">Oinas-Panuma&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kesk&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">No niin! Arvoisa herra puhemies! Pahoittelut, ei meinannut mikki alkaa toimimaan.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tämä lisätalousarviohan ei siis hillitse meidän velkaantumista vaan oikeastaan lisää sitä, ja kokonaisuutenakin hallituksen talouspolitiikka on ollut hyvin poukkoilevaa. Minun mielestäni on mielenkiintoista seurata erityisesti tätä elämöintiä sieltä laidasta salia, kun sen sijaan, että te kertoisitte, mitä hienoa te olette tehneet, te keskitytte siihen, mitä joku on joskus aiemmin tehnyt. [Perussuomalaisten ryhmästä: Ettekö kuunnelleet? — Kannattaisi kuunnella siellä!] Erityisen mielenkiintoista on tämä turpeella keikarointi, kun otetaan huomioon, että tämä teidän kunnianpalautuksenne on tämä varmuusvarastojen jatkaminen, vaikka muistaakseni tämä varmuusvarasto on ollut olemassa jo ennen kuin perussuomalaiset sinne vallankahvaan hyppäsivät.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">No mutta, pari asiaa pohjoisesta Suomesta:&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Ensinnäkin haluan kiittää ministeri Essayahia ja haluan kiittää valtiovarainministeriä siitä, että nämä porojen petokorvaukset saadaan maksuun. Se on oikeasti meille todella tärkeä asia. Se on tärkeä asia tässä vaiheessa, kun meillä ei vielä petopolitiikka ole ihan sillä mallilla, mitä me haluttaisiin, joten nyt on hyvä, että ne korvaukset kuitenkin saadaan. Mutta on se tietenkin harmillista, että joka vuosi pitää uudelleen tämä sama protokolla käydä. Jospa tämä saadaan joskus tulevaisuudessa vielä ihan kunnollakin kuntoon. Mutta kiitos näistä rahoista.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Toinen asia, jonka halusin nostaa esille, on se, että kyllä Metsähallituksen tuloutuksen nostaminen tässä tilanteessa on yksiselitteisesti vastuutonta, etenkin kun samaan aikaan leikataan meidän luontopalveluista.&nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Edustaja Lahdenperä, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.46\">14.46&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"EtuNimi\">Milla&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.46Lahdenperä\">Lahdenperä&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">kok&nbsp;\u003C/span>\u003C/span>\u003C/span>\n     \u003Cdiv class=\"TarkenneTeksti\">(vastauspuheenvuoro)\u003C/div>\n     \u003Cspan class=\"edk-colon no-bold\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Tämä lisätalousarvio on selkeästi priorisoitu työllisyyteen, turvallisuuteen, oikeusvaltioperiaatteeseen ja kasvuun. Samalla huomioidaan julkisen talouden hyvin rajallinen liikkumavara.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Tärkeää on nuorten työllistyminen. Nuorten rekrytointituen avulla yli 3&nbsp;000 nuorta pääsee töihin. Työttömyyden pilotit ja kesätyö- ja harjoittelupaikkojen lisääminen sekä osaamisseteli pitkäaikaistyöttömille mahdollistavat työelämään kiinnittymisen.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Turvallisuudessa ja puolustuksessa droonitorjunta, Puolustusvoimien kalusto ja varustus sekä kotimainen puolustustuotanto ovat vastausta muuttuneeseen turvallisuusympäristöön ja prioriteetti rahoituksen osalta.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Oikeusvaltiossa oikeuden on toteuduttava ajallaan, ja siksi tuomioistuimet ja syyttäjälaitos saavat rahoitusta ruuhkien purkuun.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Kasvun ja infran osalta väylä- ja liikennehankkeet eri puolilla maata jatkuvat edelleen. Satamaradat ja tiet laitetaan kuntoon, ja näin tuetaan yrityksiä ja alueellista elinvoimaa.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Erittäin hyvä arvio. — Kiitos. &nbsp;\u003C/p>\n       \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n        \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n        \u003Cspan class=\"edk-colon\">:\u003C/span>\n        \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Vielä valtiovarainministeri Purra, kaksi minuuttia, olkaa hyvä.&nbsp;\u003C/p>\n       \u003C/div>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"PuheenvuoroToimenpide\">\n     \u003Cdiv class=\"AjankohtaTeksti\" id=\"14.47\">14.47&nbsp;\u003C/div>\n     \u003Cspan class=\"Toimija\">\u003Cspan class=\"Henkilo\">\u003Cspan class=\"AsemaTeksti\">Valtiovarainministeri&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Riikka&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\" id=\"14.47Purra\">Purra&nbsp;\u003C/span>\u003C/span>\u003C/span>\u003Cspan class=\"edk-colon l-margin-negative\">:\u003C/span>\n     \u003Cdiv class=\"PuheenvuoroOsa\">\n      \u003Cdiv class=\"KohtaSisalto\">\n       \u003Cp class=\"edk-KappaleKooste\">Arvoisa puhemies! Ei oikeastaan juuri tullut lisää uusia kysymyksiä.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Edustaja Kalli jatkoi tällä samalla, johon jo vastasin. Eli ensin te arvostelitte sitä, että nettosopeutuksen määrä jää liian pieneksi. Sen jälkeen te luettelitte uusia toimia, joihin hallituksen pitäisi laittaa uutta rahaa, [Perussuomalaisten ryhmästä: Jakopuolue!] mikä tarkoittaa sitä, että nettosopeutuksen määrä koko ajan pienenisi. Vastaavasti, kun te ette pysty kertomaan yhtään menolisäystä, jota te vastustaisitte tässä lisätalousarviossa, tuo kritiikkinne ei yksinkertaisesti vain kanna. Tiedän, että oppositio vastustaa meidän veronkevennyksiä ja ehkä joitain muitakin kasvutoimia, [Markus Lohi: Ne eivät auta kasvuun!] mutta siinä taitavat olla enemmänkin ideologiset erot meidän välillämme.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Mutta siis vielä kerran: nettosopeutus tarkoittaa tehtyjä säästöjä käyttötalousmenoihin ynnä muualle, pysyvien menojen säästöjä, ja siitä vähennetään menolisäyksiä [Markus Lohi: Ja veronalennus!] esimerkiksi puolustukseen, turvallisuuteen, sinne, minne me tällä hallituskaudella olemme menoja joutuneet lisäämään. Sieltä saadaan se nettosopeutus. Mikäli te ette pysty kertomaan menolisäyksistä sellaisia, joita te vastustatte, niin teidän kritiikkinne nettosopeutuksen määrään ei ole kovin loogista. En ole kuullut... [Hanna Sarkkinen: Voi kritisoida myös veronalennuksia!] — Aivan totta, kuten vasemmalta sanottiin: mainitsinkin, että ainoat, mistä olen kuullut, että olette vastustaneet, ovat nämä varsinaiset veronkevennykset.&nbsp;\u003C/p>\n       \u003Cp class=\"edk-KappaleKooste\">Sitten kysyttiin tästä Metsähallituksen tuloutuksesta muutamassakin puheenvuorossa. Todellakin tässä takana on Metsähallituksen kaikkein paras tulos, mitä on ollut, ja tätä tuloutuksen kasvua selittää huomattavasti noussut puun hinta.&nbsp;\u003C/p>\n      \u003C/div>\n     \u003C/div>\n    \u003C/div>\n    \u003Cdiv id=\"PaatoksentekoToimenpide\" class=\"PaatoksentekoToimenpide\">\n     \u003Cdiv class=\"KohtaSisalto\">\n      \u003Cdiv id=\"PuheenjohtajaRepliikki\" class=\"PuheenjohtajaRepliikki\">\n       \u003Cdiv class=\"PuheenjohtajaTeksti\">Puhemies Jussi Halla-aho\u003C/div>\n       \u003Cspan class=\"edk-colon\">:\u003C/span>\n       \u003Cp class=\"edk-KappaleKooste\">Kiitoksia. — Keskustelu ja asian käsittely keskeytetään. Asian käsittelyä jatketaan tässä istunnossa muiden asiakohtien jälkeen.&nbsp;\u003C/p>\n      \u003C/div>\n      \u003Cp class=\"edk-KappaleKooste\">Asian käsittely keskeytettiin kello 14.49.&nbsp;\u003C/p>\n     \u003C/div>\n    \u003C/div>\n   \u003C/div>\n   \u003Cspan class=\"edk-EduskuntaTunnus\">\u003C/span>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-34591",nav:"\u003Cnav id=
