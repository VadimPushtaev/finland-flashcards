ja palvelujen tiedonhallinta ovat jäsentyneet.  Se sisältää myös ohjeistukset siitä, miten tietoja voidaan pyytää. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/saavutettavuusseloste/",title:null,target:null,text:"Saavutettavuusseloste",contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",expanded:{contentLink:{id:5669,workId:0,guidValue:"3a0774e6-bf37-401d-9a43-1e4ab62890db",providerName:null,url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",expanded:null},name:"Saavutettavuusseloste",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"saavutettavuusseloste",url:"/fi/tietoa-sivustosta/saavutettavuusseloste/",changed:null,created:null,startPublish:"2026-03-19T07:20:56Z",stopPublish:null,saved:null,status:null,teaserTitle:"Saavutettavuusseloste",teaserText:"Eduskunta haluaa taata kaikille yhdenvertaisen mahdollisuuden asioida sähköisissä palveluissaan. Verkkosivustoa koskee laki digitaalisten palvelujen tarjoamisesta, jonka mukaan julkisten verkkopalvelujen tulee olla saavutettavia. ",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/tietosuojaselosteet/",title:null,target:null,text:"Tietosuojaselosteet",contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:{contentLink:{id:119,workId:0,guidValue:"6c8ce04f-aa55-44f1-8cdb-e2f622844f80",providerName:null,url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",expanded:null},name:"Tietosuojaselosteet",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"tietosuojaselosteet",url:"/fi/tietoa-sivustosta/tietosuojaselosteet/",changed:null,created:null,startPublish:"2025-04-03T11:57:48Z",stopPublish:null,saved:null,status:null,teaserTitle:"Tietosuojaselosteet",teaserText:"Eduskunnan tietosuojaselosteissa kerrotaan muun muassa henkilötietojen käsittelyn tarkoituksesta, mihin tietoja säännönmukaisesti luovutetaan, miten kauan henkilötietoja säilytetään.",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}},{href:"/fi/tietoa-sivustosta/sivukartta/",title:null,target:null,text:"Sivukartta",contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:{contentLink:{id:5672,workId:0,guidValue:"e38c8e40-e9fd-450f-a8c7-236d3cb7abf3",providerName:null,url:"/fi/tietoa-sivustosta/sivukartta/",expanded:null},name:"Sivukartta",language:null,existingLanguages:null,masterLanguage:null,contentType:["Page","ContentPage"],parentLink:null,routeSegment:"sivukartta",url:"/fi/tietoa-sivustosta/sivukartta/",changed:null,created:null,startPublish:"2026-03-19T11:01:19Z",stopPublish:null,saved:null,status:null,teaserTitle:"Sivukartta",teaserText:"",teaserLinkText:"Siirry tiedotteeseen",teaserImage:null}}}],layout:{metaDescription:null,canonicalUrl:"https://www.eduskunta.fi/fi/",excludeFromSearch:false,showBreadcrumb:true,mainMenuItems:[{children:[{children:[],relatedContent:[],name:"Kansanedustajat",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa, jotka valitaan vaaleilla kerran neljässä vuodessa. Kansanedustajat työskentelevät täysistunnossa, valiokunnissa ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:"",contentLink:"9"},{children:[{children:[],relatedContent:[],name:"Täysistunto- ja valiokuntatyö",teaserText:"Kansanedustaja on lainsäätäjä, yhteiskunnallinen vaikuttaja, alueensa edusmies ja kansainvälinen toimija. Täysistunto on kansanedustajan eduskuntatyön näkyvin osa, mutta valiokunta on kansanedustajan tärkein vaikutuskanava.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/taysistunto-ja-valiokuntatyo/",selected:false,targetFrame:"",contentLink:"1848"},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:"Kansanedustajat eivät saa työstään palkkaa, vaan heille maksetaan palkkiota. Palkkio on veronalaista tuloa. Palkkion lisäksi kansanedustajat saavat verotonta kulukorvausta kustannustensa kattamiseen.  ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:"",contentLink:"10"},{children:[],relatedContent:[],name:"Kansanedustajan sidonnaisuudet",teaserText:"Kansanedustajan täytyy antaa eduskunnalle selvitys sidonnaisuuksista, tuloista, jotka voivat vaikuttaa edustajana toimimiseen sekä lahjoista, joita kansanedustaja on saanut.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-sidonnaisuudet/",selected:false,targetFrame:"",contentLink:"12"},{children:[],relatedContent:[],name:"Kansanedustajan vaihtuminen",teaserText:"Kansanedustaja voi vaihtua vaalikauden aikana, jos eduskunta myöntää kansanedustajalle vapautuksen edustajantoimesta. Kansanedustaja voi myös keskeyttää edustajantoimen hoitamisen, jos hänet valitaan kesken vaalikauden Euroopan parlamentin jäseneksi.",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajan-vaihtuminen/",selected:false,targetFrame:"",contentLink:"1654"},{children:[],relatedContent:[],name:"Kansanedustajien eläkkeet ja sopeutumisraha",teaserText:"Kansanedustajalle kertyy eläkettä. Yleensä kansanedustaja voi saada eläkkeen 65 vuoden iässä. Kansanedustaja voi olla oikeutettu myös määräaikaiseen sopeutumisrahaan. ",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-elakkeet-ja-sopeutumisraha/",selected:false,targetFrame:"",contentLink:"11"}],relatedContent:[],name:"Tietoa kansanedustajan työstä",teaserText:"Tietoa kansanedustajien tehtävistä",url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/",selected:false,targetFrame:"",contentLink:"13"},{children:[],relatedContent:[],name:"Puhemiehet",teaserText:"Eduskunnan puhemiehellä on keskeinen rooli eduskunnan toiminnassa. Puhemiehen asemaa kuvastaa myös se, että epävirallisessa valtakunnallisessa hierarkiassa puhemies sijoittuu heti tasavallan presidentin jälkeen. Hän johtaa täysistuntotyöskentelyä ja valvoo sen perustuslainmukaisuutta",url:"/fi/kansanedustajat-ja-toimielimet/puhemiehet/",selected:false,targetFrame:"",contentLink:"15"},{children:[],relatedContent:[],name:"Hallitus ja oppositio",teaserText:"Hallitus ja oppositio muodostavat keskeiset osapuolet eduskunnan toiminnassa.",url:"/fi/kansanedustajat-ja-toimielimet/hallitus-ja-oppositio/",selected:false,targetFrame:"",contentLink:"14"},{children:[{children:[],relatedContent:[],name:"Sosiaali- ja terveysvaliokunta",teaserText:"Sosiaali- ja terveysvaliokunta käsittelee sosiaali- ja terveyspalveluja sekä niihin liittyvää lainsäädäntöä. Sen toimialaan kuuluvat muun muassa sosiaaliturva, eläkejärjestelmä, perhe-etuudet ja toimeentuloturva. Valiokunta käsittelee myös Kansaneläkelaitosta sekä lapsiasiavaltuutetun ja vanhusasiavaltuutetun kertomuksia kansalaisten oikeuksien toteutumisesta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/sosiaali-ja-terveysvaliokunta/",selected:false,targetFrame:"",contentLink:"2876"},{children:[],relatedContent:[],name:"Ohjeita valiokuntaan kutsutulle asiantuntijalle",teaserText:"Tämä ohjeistus on tarkoitettu valiokunnan kuultavaksi kutsutuille asiantuntijoille. Se kokoaa keskeiset tiedot kuulemiseen valmistautumisesta, lausunnon laatimisesta ja esittämisestä sekä käytännön järjestelyistä ja korvauksista.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/ohjeita-valiokuntaan-kutsutulle-asiantuntijalle/",selected:false,targetFrame:"",contentLink:"1355"}],relatedContent:[],name:"Valiokunnat",teaserText:"Eduskunnan päätökset valmistellaan valiokunnissa. Eduskunnassa on 16 pysyvää erikoisvaliokuntaa ja EU-asioita koordinoiva suuri valiokunta.",url:"/fi/kansanedustajat-ja-toimielimet/valiokunnat/",selected:false,targetFrame:"",contentLink:"16"},{children:[{children:[],relatedContent:[],name:"Eduskuntaryhmän työ",teaserText:"Eduskuntaryhmän työ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhman-tyo/",selected:false,targetFrame:"",contentLink:"18"},{children:[],relatedContent:[],name:"Eduskuntaryhmärekisteri",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/eduskuntaryhmarekisteri/",selected:false,targetFrame:"",contentLink:"1796"}],relatedContent:[],name:"Eduskuntaryhmät",teaserText:"Kansanedustajat muodostavat puolueittain eduskuntaryhmiä, jotka tekevät käytännön eduskuntatyötä. Jokainen eduskuntaryhmä valitsee itselleen puheenjohtajat ja mahdollisesti muita toimielimiä. ",url:"/fi/kansanedustajat-ja-toimielimet/eduskuntaryhmat/",selected:false,targetFrame:"",contentLink:"17"},{children:[{children:[],relatedContent:[],name:"Kansanedustajien kansainvälinen toiminta",teaserText:"Kansanedustajat edustavat Suomea myös kansainvälisessä politiikassa. Kansanedustajat työskentelevät parlamenttien välisissä järjestöissä, ja parlamenttien välillä on kahdenkeskistä vierailuvaihtoa. Tärkeä osa yhteistyötä ovat myös puhemiesten tapaamiset ja kokoukset sekä ystävyysryhmien toiminta.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/kansanedustajien-kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"21"},{children:[],relatedContent:[],name:"Valtuuskunnat",teaserText:"Eduskunta osallistuu säännöllisesti yhdeksän monenkeskisen kansainvälisen järjestön toimintaan. Yhteistyötä hoitamaan valitaan valtuuskunnat, joiden toimintakausi on vaalikausi.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/valtuuskunnat/",selected:false,targetFrame:"",contentLink:"1241"}],relatedContent:[],name:"Kansainvälinen toiminta",teaserText:"Eduskunta tukee kansainvälisessä yhteistyössään Suomen ulkopoliittisia painopisteitä, joita ovat esimerkiksi ihmisoikeudet, demokraattisten instituutioiden vahvistaminen, kansainvälisen sääntöpohjaisen järjestelmän ylläpitäminen ja kansainvälisen oikeuden noudattaminen.",url:"/fi/kansanedustajat-ja-toimielimet/kansainvalinen-toiminta/",selected:false,targetFrame:"",contentLink:"20"},{children:[],relatedContent:[],name:"EU-toiminta",teaserText:"Eduskunta osallistuu Euroopan unionin parlamentaariseen yhteistyöhön osana jäsenvaltioiden ja Euroopan parlamenttien välistä vuorovaikutusta. EU-asioiden käsittelyyn liittyy koordinointia, kansanedustajien välistä yhteistyötä sekä kansainvälisiä yhteyksiä, joita toteutetaan sekä eduskunnan sisäisten toimintojen että parlamenttien välisten verkostojen kautta.",url:"/fi/kansanedustajat-ja-toimielimet/eu-toiminta/",selected:false,targetFrame:"",contentLink:"7746"},{children:[],relatedContent:[],name:"Kansanedustajat eduskunnan toimielimissä",teaserText:"Kansanedustajat työskentelevät erilaisissa toimielimissä. Keskeisiä toimielimiä eduskunnassa ovat esimerkiksi valiokunnat, puhemiehistö tai kansainväliset parlamentaariset valtuuskunnat. Kansanedustajia on nimetty myös erilaisiin parlamentaarisiin valvonta- ja ohjauselimiin, kuten esimerkiksi Ylen hallintoneuvostoon. Jäsenyydet toimielimissä, kuten valiokunnissa, jaetaan eduskuntaryhmien koon mukaan. Sivulle on koottu tietoja kansanedustajien jäsenyyksistä ja tehtävistä eri toimielimissä ja eduskuntaryhmissä. ",url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat-eduskunnan-toimielimissa/",selected:false,targetFrame:"",contentLink:"5931"},{children:[{children:[],relatedContent:[],name:"Ystävyysryhmät",teaserText:"Kansanedustajien perustamat ystävyysryhmät ylläpitävät kansainvälisiä yhteyksiä Eduskunnan virallisen kansainvälisen toiminnan lisäksi. Alla luetellut ystävyysryhmät ovat järjestäytyneet kevään 2023 eduskuntavaalien jälkeen. Ystävyysryhmien toiminta on epävirallista.​ ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/ystavyysryhmat/",selected:false,targetFrame:"",contentLink:"24"},{children:[],relatedContent:[],name:"Tu​tkas - tutkijoiden ja kansanedustajien seura",teaserText:"Tutkas on vuodesta 1970 toiminut Suomen eduskunnan tutkijoiden ja kansanedustajien seura, jonka toiminnan tarkoituksena on luoda edellytykset aktiiviselle vuoropuhelulle tutkijoiden ja kansanedustajien välillä.",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/tutkas-tutkijoiden-ja-kansanedustajien-seura/",selected:false,targetFrame:"",contentLink:"25"}],relatedContent:[],name:"Verkostot, ystävyysryhmät ja kerhot",teaserText:"Kansanedustajat toimivat erilaisissa yhteiskunnallisissa verkostoissa, ystävyysryhmissä ja kerhoissa. Ne kokoavat yhteen samasta teemasta kiinnostuneita kansanedustajia ja täydentävät eduskunnassa käytävää keskustelua.  ",url:"/fi/kansanedustajat-ja-toimielimet/verkostot-ystavyysryhmat-ja-kerhot/",selected:false,targetFrame:"",contentLink:"23"}],relatedContent:[{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kansanedustajien palkkiot ja kulukorvaukset",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/tietoa-kansanedustajan-tyosta/kansanedustajien-palkkiot-ja-kulukorvaukset/",selected:false,targetFrame:null,contentLink:null}],name:"Kansanedustajat ja toimielimet",teaserText:"Eduskunnassa on kaksisataa kansanedustajaa. Kansalaiset valitsevat kansanedustajat äänestämällä vaaleissa. Kansanedustajat kuuluvat eduskunnassa eduskuntaryhmiin. Eduskuntaryhmät jakautuvat hallitus- ja oppositioryhmiin. Eduskunta valitsee kansanedustajia kansallisissa ja kansainvälisissä yhteyksissä toimiviin toimielimiin. ",url:"/fi/kansanedustajat-ja-toimielimet/",selected:false,targetFrame:"",contentLink:"8"},{children:[{children:[],relatedContent:[],name:"Käsittelyssä olevat asiat",teaserText:"Tältä sivulta näet tällä hetkellä eduskunnassa käsittelyssä olevia asioita. Voit suodattaa asioita eduskunnan tehtävien, asiatyyppien tai eri käsittelyvaiheiden mukaan. ",url:"/fi/asiat-ja-aanestykset/kasittelyssa-olevat-asiat/",selected:false,targetFrame:"",contentLink:"1365"},{children:[],relatedContent:[],name:"Mitä ovat valtiopäiväasiat?",teaserText:"Eduskunta päättää koko Suomen asioista. Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiat voi ryhmitellä esimerkiksi lainsäädäntöön, talousarvion hyväksymiseen, hallituksen valvontaan tai EU-asioihin.      ",url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/",selected:false,targetFrame:"",contentLink:"1373"},{children:[{children:[],relatedContent:[],name:"Eduskunnan rooli EU-päätöksenteossa",teaserText:"Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-rooli-eu-paatoksenteossa/",selected:false,targetFrame:"",contentLink:"1407"},{children:[],relatedContent:[],name:"EU-asioiden käsittely eduskunnassa",teaserText:"​EU:n säädökset, ennen kaikkea direktiivit, vaativat usein muutoksia Suomen lainsäädäntöön. Asiasta päätetään eduskunnassa normaalilla lainsäädäntömenettelyllä. EU-asioita käsitellään kaikissa valiokunnissa, mutta suuri valiokunta toimii eduskunnan varsinaisena EU-valiokuntana ja hyväksyy eduskunnan kannan Euroopan unionin asioihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-asioiden-kasittely-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1659"},{children:[],relatedContent:[],name:"Eduskunnan EU-sihteeristö",teaserText:"EU-sihteeristö tukee kansanedustajien yhteydenpitoa suomalaisiin ja muihin Euroopan parlamentin jäseniin sekä muihin keskeisiin EU-toimijoihin.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eduskunnan-eu-sihteeristo/",selected:false,targetFrame:"",contentLink:"1415"},{children:[],relatedContent:[],name:"EU-tiedonlähteet ja asiakirjat",teaserText:"Tämä sivu kokoaa keskeiset Euroopan unionia koskevat tiedonlähteet sekä ohjeet EU-asiakirjojen ja tietokantojen käyttöön. Tavoitteena on helpottaa EU-asioihin liittyvän virallisen aineiston löytämistä sekä mahdollistaa tiedon hakeminen Euroopan unionista yleisesti ja eri aihealueilta. \n\nLinkit johtavat ensisijaisesti EU:n virallisiin lähteisiin ja virastojen verkkosivuille. Jos suomenkielistä sisältöä ei ole saatavilla, linkki ohjaa englanninkieliselle sivulle. Kaikki linkit avautuvat uuteen välilehteen.",url:"/fi/asiat-ja-aanestykset/eu-asiat/eu-tiedonlahteet-ja-asiakirjat/",selected:false,targetFrame:"",contentLink:"8196"}],relatedContent:[],name:"EU-asiat",teaserText:"Eduskunnalla on vahva rooli Euroopan unionin päätöksenteossa verrattuna moneen muuhun unionin jäsenmaahan. Eduskunta päättää, miten Suomi suhtautuu niihin EU:ssa päätettäviin asioihin, jotka kuuluvat eduskunnan toimivaltaan. ",url:"/fi/asiat-ja-aanestykset/eu-asiat/",selected:false,targetFrame:"",contentLink:"1658"},{children:[],relatedContent:[],name:"Vanhat valtiopäiväasiat ennen vuotta 2015",teaserText:"Eduskunnan verkkosivustoa uudistetaan. Ennen vuotta 2015 eduskunnassa käsitellyt asiat asiakirjoineen löytyvät toistaiseksi vanhasta sivustosta. Vanhempi aineistokokonaisuus siirretään tälle uudelle sivustolle viimeistään heinäkuussa 2026.",url:"/fi/asiat-ja-aanestykset/vanhat-valtiopaivaasiat-ennen-vuotta-2015/",selected:false,targetFrame:"",contentLink:"7039"},{children:[],relatedContent:[],name:"Uusimmat valtiopäiväasiakirjat",teaserText:"Valtiopäiväasiakirja tarkoittaa asiakirjaa, jolla valtiopäiväasia tulee eduskunnassa vireille tai joka koskee valtiopäiväasian käsittelyä tai käsittelyn tulosta. Valtiopäiväasiakirjat tallennetaan eduskunnan verkkosivuille suomen ja ruotsin kielellä heti, kun ne ovat saapuneet eduskuntaan tai kun eduskunnan tuottamat asiakirjat ovat valmistuneet.",url:"/fi/asiat-ja-aanestykset/uusimmat-valtiopaivaasiakirjat/",selected:false,targetFrame:"",contentLink:"6546"},{children:[],relatedContent:[],name:"Uusimmat äänestykset",teaserText:"Tältä sivulta löydät täysistuntojen uusimmat äänestystulokset. Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa.",url:"/fi/asiat-ja-aanestykset/uusimmat-aanestykset/",selected:false,targetFrame:"",contentLink:"3435"},{children:[],relatedContent:[],name:"​​​Äänestäminen eduskunnassa",teaserText:"​​Eduskunnassa äänestetään yleisimmin lakiehdotusten ja valtion talousarvion käsittelyssä sekä henkilö- ja toimielinvaaleissa. Äänestyksessä valitaan kahdesta tai useammasta vaihtoehdosta se, joka saa eniten kannatusta.",url:"/fi/asiat-ja-aanestykset/aanestaminen-eduskunnassa/",selected:false,targetFrame:"",contentLink:"1849"}],relatedContent:[{children:[],relatedContent:[],name:"Siirry hakemaan valtiopäiväasioita",teaserText:null,url:"/fi/haku/?category=asioiden-kasittelytiedot",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Miten linkität eduskunnan aineistoihin",teaserText:null,url:"/fi/asiat-ja-aanestykset/valtiopaivaasiat/miten-linkitat-eduskunnan-aineistoihin/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Lakihankkeiden tietopaketit",teaserText:null,url:"/fi/lakihankkeiden-tietopaketit/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/fi/avoin-data/",selected:false,targetFrame:null,contentLink:null}],name:"Asiat ja äänestykset",teaserText:"Eduskunnan päätökset liittyvät aina johonkin eduskunnassa käsiteltyyn valtiopäiväasiaan. Valtiopäiväasiaan liittyy yksi tai useampia valtiopäiväasiakirjoja.  Äänestykset liittyvät pääsääntöisesti lakiehdotusten sisältämien pykälien tai lausumien hyväksymiseen tai hylkäämiseen sekä valtion talousarvion käsittelyyn. ",url:"/fi/asiat-ja-aanestykset/",selected:false,targetFrame:"",contentLink:"1364"},{children:[{children:[],relatedContent:[],name:"Tietoa eduskunnan täysistunnoista",teaserText:"​Lait säädetään täysistunnossa. Täysistuntoja pidetään tiistaista perjantaihin. Tiistaisin ja keskiviikkoisin täysistunnot alkavat yleensä kello 14, torstaisin kello 16 ja perjantaisin kello 13. ",url:"/fi/taysistunnot-ja-tapahtumat/yleistietoa-eduskunnan-taysistunnoista/",selected:false,targetFrame:"",contentLink:"34"},{children:[],relatedContent:[],name:"Seuraavan täysistunnon päiväjärjestys",teaserText:null,url:"/fi/taysistunnot-ja-tapahtumat/seuraavan-taysistunnon-paivajarjestys/",selected:false,targetFrame:"",contentLink:"3513"}],relatedContent:[{children:[],relatedContent:[],name:"Katso kalenterista eduskunnan täysistuntosuunnitelma",teaserText:null,url:"/taysistunnot-ja-tapahtumat#kalenteri",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Siirry katsomaan täysistuntojen videotallenteita",teaserText:null,url:"https://verkkolahetys.eduskunta.fi/fi/taysistunnot",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Hae täysistunnon pöytäkirjoja",teaserText:null,url:"/haku/?category=asiakirjat&asiakirjaLaatijat=T%C3%A4ysistunto&sort=laadintapvm_desc,nimeketeksti_asc&asiakirjaLaatijatYhteiso=T%C3%A4ysistunto&asiakirjatyypit=PTKPS%2CPTKPS",selected:false,targetFrame:"_top",contentLink:null}],name:"Täysistunnot ja tapahtumat",teaserText:"Lakien säätäminen tapahtuu täysistunnossa. Täysistunnot ovat yleisölle avoimia ja voit seurata niitä myös verkossa. Eduskunnan kalenterista näet täysistuntojen aikataulun, valiokuntien kokousten ajankohdat sekä muut tapahtumat.",url:"/fi/taysistunnot-ja-tapahtumat/",selected:false,targetFrame:"",contentLink:"31"},{children:[{children:[{children:[],relatedContent:[],name:"Eduskunta päättää valtion talousarviosta",teaserText:"Valtion talousarvion eli budjetin hyväksyminen on toinen eduskunnan perustehtävistä lakien säätämisen lisäksi. Joka vuosi laadittava talousarvio sisältää valtion seuraavan vuoden tulot ja menot. Hallitus tekee esityksen talousarviosta eduskunnalle, ja eduskunta tekee siitä lopullisen päätöksen. testi.\n",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-paattaa-valtion-talousarviosta/",selected:false,targetFrame:"",contentLink:"37"},{children:[],relatedContent:[],name:"Eduskunta valvoo hallituksen toimintaa",teaserText:"Eduskunta valvoo hallituksen ja hallinnon toimintaa sekä poliittisesti että oikeudellisesti. Poliittisen valvonnan tarkoituksena on varmistaa, että hallituksen toiminnalla on eduskunnan enemmistön tuki.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/eduskunta-valvoo-hallituksen-toimintaa/",selected:false,targetFrame:"",contentLink:"38"}],relatedContent:[],name:"Miten eduskunta toimii",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:"",contentLink:"36"},{children:[],relatedContent:[],name:"Tutustu lainsäädäntöprosessiin",teaserText:"Uusi laki säädetään tai vanhaa lakia muutetaan hallituksen esityksestä, kansanedustajan aloitteesta tai kansalaisaloitteen johdosta. Eduskunnassa lakiehdotuksen käsittely alkaa lähetekeskustelulla, jonka jälkeen asia siirtyy valiokuntaan käsiteltäväksi. Kun valiokunta saa mietinnön valmiiksi, lakiehdotus käsitellään täysistunnossa kahdessa käsittelyssä. Jos eduskunta hyväksyy lain, siitä tehdään eduskunnan vastaus. Lopulta tasavallan presidentti vahvistaa lain.",url:"/fi/eduskunta-ja-sen-toiminta/tutustu-lainsaadantoprosessiin/",selected:false,targetFrame:"",contentLink:"39"},{children:[],relatedContent:[],name:"Eduskuntatyön rytmitys ja suunnittelu",teaserText:"Eduskunnan toimikausi on vaalikausi eli neljä vuotta. Toimikausi alkaa, kun eduskuntavaalien tulos on vahvistettu, ja jatkuu siihen asti, kunnes seuraavat vaalit on toimitettu.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntatyon-rytmitys-ja-suunnittelu/",selected:false,targetFrame:"",contentLink:"1337"},{children:[],relatedContent:[],name:"Eduskunnan historia",teaserText:"Suomen eduskunta on historiansa saatossa säätänyt lakeja keisarivallan, vallankumouksen ja maailmansotien katveessa. Suomalainen edustuksellinen demokratia on kestänyt sekä sisäiset että ulkoiset paineet murtumatta, mikä on harvinaista 1900-luvun Euroopan väkivaltaisessa historiassa.\n\nEduskunnan historian tärkeimpiä käänteitä esitellään seuraavassa lyhyesti. Kunkin osuuden lopussa on syventävää tietoa aihepiireistä historiatietopaketteina.     ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunnan-historia/",selected:false,targetFrame:"",contentLink:"1322"},{children:[{children:[],relatedContent:[],name:"Töihin eduskuntaan",teaserText:"Eduskunnan kanslia on palveluorganisaatio, joka tarjoaa kahdellesadalle kansanedustajalle kaiken avun ja asiantuntemuksen, joita he työssään tarvitsevat. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/toihin-eduskuntaan/",selected:false,targetFrame:"",contentLink:"43"}],relatedContent:[],name:"Eduskunta organisaationa",teaserText:"Eduskunnan kanslia tukee valtiopäivätoimintaa ja kansanedustajien työtä. Eduskunnan  kansliassa työskentelee noin 400 virkamiestä ja noin ​40 kansanedustajan avustajaa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskunta-organisaationa/",selected:false,targetFrame:"",contentLink:"42"},{children:[{children:[],relatedContent:[],name:"Hallituksen muodostaminen",teaserText:"Prosessi hallituksen muodostamiseksi alkaa vaalien jälkeen. Hallitustunnusteluissa selvitetään, mitkä eduskuntaryhmät ja puolueet jatkavat varsinaisiin hallitusneuvotteluihin. Hallitusneuvotteluissa sovitaan hallitusohjelman sisällöstä ja tehdään päätökset hallitukseen osallistumista. Hallituksen hyväksyminen tapahtuu yhteistoiminnassa eduskunnan puhemiehen, tasavallan presidentin ja eduskunnan kanssa.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/hallituksen-muodostaminen/",selected:false,targetFrame:"",contentLink:"1309"},{children:[],relatedContent:[],name:"Mitä tapahtuu, kun uusi eduskunta aloittaa?",teaserText:"Vaalien jälkeen vaalipiirien vaalipiirilautakunnat vahvistavat vaalien koko tuloksen ja kirjoittavat valtakirjat uusille kansanedustajille. Sen jälkeen uuden, valitun eduskunnan työ käynnistyy. ",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/mita-tapahtuu-kun-uusi-eduskunta-aloittaa/",selected:false,targetFrame:"",contentLink:"1314"}],relatedContent:[],name:"Eduskuntavaalit",teaserText:"Eduskuntavaaleissa valitaan 200 kansanedustajaa Suomen eduskuntaan. Eduskuntavaalit järjestetään neljän vuoden välein. Seuraavat eduskuntavaalit ovat vuonna 2027.",url:"/fi/eduskunta-ja-sen-toiminta/eduskuntavaalit/",selected:false,targetFrame:"",contentLink:"40"},{children:[{children:[],relatedContent:[],name:"Oppimateriaalia valiokunnista",teaserText:"Tälle sivulle on koottu oppimateriaaliksi sopivaa tietoa eduskunnan valiokunnista.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/oppimateriaalia-valiokunnista/",selected:false,targetFrame:"",contentLink:"48"},{children:[],relatedContent:[],name:"Pelaa Eduskuntapeliä",teaserText:"Eduskuntapeli on selainpohjainen oppimispeli, jossa pelaaja pelaa kansanedustajalla. Peli on suunnattu erityisesti yläkouluikäisten yhteiskuntaopin opiskeluun, mutta se sopii hyvin myös toisen asteen opiskelijoille.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/eduskuntapeli/",selected:false,targetFrame:"",contentLink:"49"},{children:[],relatedContent:[],name:"Esitteitä eduskunnan toiminnasta",teaserText:"​Eduskunnan esitteistä saat tietoa muun muassa eduskunnan toiminnasta, eduskunnan historiasta ja itsenäisyyden alkuvaiheista, eduskunnan roolista EU-asioiden käsittelyssä, Eduskuntatalosta ja Eduskunnan kirjastosta.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/esitteet/",selected:false,targetFrame:"",contentLink:"47"},{children:[],relatedContent:[],name:"Videot oppimateriaalina",teaserText:"Eduskuntatyötä voi seurata verkkolähetyksenä. Lisäksi siihen voi perehtyä tallenteiden, opetusvideoiden ja muiden videomateriaalien avulla.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/videot-oppimateriaalina/",selected:false,targetFrame:"",contentLink:"46"},{children:[],relatedContent:[],name:"Näin lakeja tehdään Suomessa",teaserText:"Eduskunnan tärkein tehtävä on säätää lakeja. Tutustu lainsäädännön vaiheisiin.",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/nain-lakeja-tehdaan-suomessa/",selected:false,targetFrame:"",contentLink:"1774"}],relatedContent:[],name:"Oppimateriaalit",teaserText:"​Eduskunta tukee demokratiakasvatusta sekä yhteiskuntaopin ja historian opetusta tarjoamalla materiaaleja oppitunneille ja opetuksen suunnitteluun. ",url:"/fi/eduskunta-ja-sen-toiminta/oppimateriaalit/",selected:false,targetFrame:"",contentLink:"44"},{children:[{children:[],relatedContent:[],name:"​​Tilastotietoa valtiopäiväasioista",teaserText:"Valtiopäiväasioista julkaistaan säännöllisesti tilastotietoa. Valtiopäiväasioita käsitellään valiokunnissa ja täysistunnossa. Valtiopäiväasia tulee vireille eduskunnassa, kun siitä annetaan valtiopäiväasiakirja, kuten hallituksen esitys, kansanedustajan lakialoite tai kansalaisaloite. Tilastot koskevat vaalikautta 2023–2026 ellei toisin merkitty.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/tilastotietoa-valtiopaivaasioista/",selected:false,targetFrame:"",contentLink:"2848"},{children:[],relatedContent:[],name:"​Kansanedustajien poissaolot",teaserText:"Kansanedustajien poissaolot täysistunnoista tilastoidaan istuntopäivien lukumäärän mukaan. Kansanedustajien poissaolot valiokuntien kokouksista tilastoidaan samalla periaatteella kuin poissaolot täysistunnoista. Poissaolotilastot koskevat kuluvaa vaalikautta.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/kansanedustajien-poissaolot/",selected:false,targetFrame:"",contentLink:"2799"}],relatedContent:[],name:"Tilastot ja julkaisut",teaserText:"Eduskunta julkaisee tilastotietoa ja raportteja valtiopäivistä, kansanedustajista ja eduskunnan toimielimistä. Eduskunnan kanslian toiminnasta julkaistaan myös vuosittain erilaisia raportteja, kertomuksia ja suunnitelmia.",url:"/fi/eduskunta-ja-sen-toiminta/tilastot/",selected:false,targetFrame:"",contentLink:"2795"}],relatedContent:[{children:[],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:null,url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Eduskuntasanasto",teaserText:null,url:"https://valter.sanakirja.fi/eduskuntasanasto/all",selected:false,targetFrame:"_blank",contentLink:null},{children:[],relatedContent:[],name:"Kirjasto ja arkisto",teaserText:null,url:"/fi/kirjasto-ja-arkisto/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Tietopalvelu",teaserText:null,url:"/fi/tietopalvelu/",selected:false,targetFrame:null,contentLink:null}],name:"Eduskunta ja sen toiminta",teaserText:"Eduskunnan tärkein tehtävä on lakien säätäminen. Eduskunta päättää myös valtion talousarviosta, valitsee pääministerin ja valvoo hallituksen toimintaa. Lisäksi eduskunta hyväksyy tärkeimmät Suomea sitovat kansainväliset sopimukset ja vaikuttaa Euroopan unionin asioihin.",url:"/fi/eduskunta-ja-sen-toiminta/",selected:false,targetFrame:"",contentLink:"35"},{children:[{children:[{children:[],relatedContent:[],name:"​​Omatoimiset vierailut",teaserText:"Eduskuntataloon voi tutustua omatoimisesti ilman opastusta virtuaalikierroksen avulla tai tulemalla paikan päälle seuraamaan täysistuntoa yleisölehterille. Myös Kansalaisinfon tapahtumat ovat yleisölle avoimia.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/omatoimiset-vierailut/",selected:false,targetFrame:"",contentLink:"52"},{children:[],relatedContent:[],name:"Kansalaisinfo",teaserText:"Eduskunnan Pikkuparlamentissa sijaitsevassa Kansalaisinfossa järjestetään eduskuntatyöhön liittyviä yleisötapahtumia. ",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/kansalaisinfo/",selected:false,targetFrame:"",contentLink:"55"},{children:[],relatedContent:[],name:"Ohjeita vierailijoille",teaserText:"Tutustu ohjeisiin, kun olet tulossa vierailuille eduskuntaan.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/ohjeita-vierailijoille/",selected:false,targetFrame:"",contentLink:"56"}],relatedContent:[],name:"Vieraile eduskunnassa",teaserText:"Voit tutustua Eduskuntataloon ja eduskunnan toimintaan monin tavoin. Tule seuraamaan täysistuntoa lehterille, osallistu opastetulle kierrokselle tai varaa etäoppitunti. \nOpastuksen aikana opas kertoo eduskunnan toiminnasta, eduskunnan tehtävistä, kansanedustajan työstä ja Eduskuntatalon keskeisimmistä tiloista.",url:"/fi/vieraile-ja-osallistu/vieraile-eduskunnassa/",selected:false,targetFrame:"",contentLink:"51"},{children:[],relatedContent:[],name:"Eduskuntatalo",teaserText:"Eduskunnan täysistunto päätti Eduskuntatalon rakentamisesta maaliskuussa vuonna 1925. Arkkitehti J. S. Sirénin suunnitteleman talon rakennustyöt käynnistyivät Arkadianmäellä vuonna 1926, ja talo valmistui vuonna 1931.",url:"/fi/vieraile-ja-osallistu/eduskuntatalo/",selected:false,targetFrame:"",contentLink:"1276"},{children:[],relatedContent:[],name:"Seuraa verkkolähetyksiä",teaserText:"Voit seurata täysistuntoja, valiokuntien julkisia kuulemisia ja muita eduskunnan järjestämiä useita tilaisuuksia suorina verkkolähetyksinä eduskunnan videot ja verkkolähetykset -palvelussa.",url:"/fi/vieraile-ja-osallistu/seuraa-verkkolahetyksia/",selected:false,targetFrame:"",contentLink:"63"},{children:[{children:[],relatedContent:[],name:"Vaikuta äänestämällä",teaserText:"Vaaleissa valitsemme, ketkä tekevät päätöksiä. Valitsemme vaaleilla eduskunnan, presidentin, kunnan ja ​alueiden päättäjät sekä Suomen edustajat Euroopan unionissa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaalit-ja-aanestaminen/",selected:false,targetFrame:"",contentLink:"65"},{children:[],relatedContent:[{children:[],relatedContent:[],name:"Miten eduskunta toimii",teaserText:null,url:"/fi/eduskunta-ja-sen-toiminta/miten-eduskunta-toimii/",selected:false,targetFrame:null,contentLink:null}],name:"Vaikuta lakeihin",teaserText:"Eduskunta päättää Suomen lait. Myös kansalaiset voivat ehdottaa uuden lain tekemistä tai vanhan lain muuttamista. Voit myös ottaa yhteyttä kansanedustajiin ja kertoa mielipiteesi lakiehdotuksista. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/vaikuta-lakeihin/",selected:false,targetFrame:"",contentLink:"67"},{children:[],relatedContent:[],name:"Monta tapaa vaikuttaa",teaserText:"Asioihin voi vaikuttaa monella tavalla. Voit valita juuri sinulle sopivan tavan.",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/muut-kansalaisvaikuttamisen-keinot/",selected:false,targetFrame:"",contentLink:"66"}],relatedContent:[],name:"Miten sinä voit vaikuttaa?",teaserText:"Jokainen saa vaikuttaa politiikkaan ja siihen, millaisia päätöksiä tehdään. Voit äänestää vaaleissa ja vaikuttaa siihen, ketkä päätöksiä tekevät. Voit keskustella ja kertoa mielipiteesi, kun päättäjät suunnittelevat uusia lakeja. Lisäksi on monia muita keinoja osallistua ja vaikuttaa. ",url:"/fi/vieraile-ja-osallistu/miten-sina-voit-vaikuttaa/",selected:false,targetFrame:"",contentLink:"64"}],relatedContent:[{children:[],relatedContent:[],name:"Ota yhteyttä kansanedustajaan",teaserText:null,url:"/fi/kansanedustajat-ja-toimielimet/kansanedustajat/",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Katso täysistuntosuunnitelma ja muut tapahtumat",teaserText:null,url:"/fi/?epsremainingpath=taysistunnot-ja-tapahtumat",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Avoin data",teaserText:null,url:"/avoin-data",selected:false,targetFrame:null,contentLink:null},{children:[],relatedContent:[],name:"Kysy eduskunnasta",teaserText:null,url:"/fi/kysy-eduskunnasta/", /arenden-och-omrostningar/riksdagsarenden/handlingar/eduskuntatunnus/RP%2054%2F2026%20rd\">RP 54/2026 rd\u003C/a>\u003C/span>): Ärendet har remitterats till förvaltningsutskottet för betänkande.&nbsp;\u003C/p>\n   \u003C/div>\n   \u003Cdiv class=\"AsiantuntijatToimenpide\">\n    \u003Ch3 class=\"LihavaKursiiviOtsikkoTeksti\">Sakkunniga\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Utskottet har hört&nbsp;\u003C/p>\n    \u003Cul class=\"SuppeaLista LyhytViiva\">\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">ledande expert&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Roope&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Jokinen&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">inrikesministeriet\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">specialsakkunnig&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Hanna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Pihkanen&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">inrikesministeriet\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">undervisningsråd&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Kaisu&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Piiroinen&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">undervisnings- och kulturministeriet \u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">ledande expert&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Hanna-Maria&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Hyttinen&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">arbets- och näringsministeriet\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">specialsakkunnig&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Marika&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Suutala&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">Migrationsverket\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">direktör&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Harriet&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Mallenius&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">Migrationsverket\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">projektchef&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Katja&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Lakojoki-Karhu&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">Migrationsverket\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">tjänsteägare&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Marja&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Alkio&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">Migrationsverket\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">polisinspektör&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Marjo&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Tyynelä&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">Polisstyrelsen\u003C/span>\n     \u003C/li>\n     \u003Cli class=\"Asiantuntija\">\n      \u003Cdiv class=\"Henkilo\">\n       \u003Cspan class=\"AsemaTeksti\">verksamhetsledare&nbsp;\u003C/span>\u003Cspan class=\"EtuNimi\">Julie&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Breton&nbsp;\u003C/span>\n      \u003C/div>\n      \u003Cspan class=\"YhteisoTeksti\">Moniheli ry.\u003C/span>\n     \u003C/li>\n    \u003C/ul>\n   \u003C/div>\n   \u003Cdiv class=\"AsiantuntijatToimenpide\">\n    \u003Cp class=\"KappaleKooste\">Skriftligt yttrande har lämnats av&nbsp;\u003C/p>\n    \u003Cul class=\"SuppeaLista LyhytViiva\">\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">justitieministeriet\u003C/span>\u003C/li>\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">Livskraftscentralen i Nyland\u003C/span>\u003C/li>\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">Helsingfors förvaltningsdomstol\u003C/span>\u003C/li>\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">Rådet för yrkeshögskolornas rektorer Arene rf\u003C/span>\u003C/li>\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">Familia ry\u003C/span>\u003C/li>\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">Finlands universitetsrektorers råd UNIFI rf\u003C/span>\u003C/li>\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">Handikappforum rf.\u003C/span>\u003C/li>\n    \u003C/ul>\n   \u003C/div>\n   \u003Cdiv class=\"AsiantuntijatToimenpide\">\n    \u003Cp class=\"KappaleKooste\">Inget yttrande av&nbsp;\u003C/p>\n    \u003Cul class=\"SuppeaLista LyhytViiva\">\n     \u003Cli class=\"Asiantuntija\">\u003Cspan class=\"YhteisoTeksti\">Helsingfors universitet.\u003C/span>\u003C/li>\n    \u003C/ul>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"SisaltoKuvaus\" class=\"SisaltoKuvaus\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">PROPOSITIONEN\u003C/h2>\n   \u003Cp class=\"KappaleKooste\">I propositionen föreslås det att medborgarskapslagen, lagen om Migrationsverket och lagen om behandling av personuppgifter i migrationsförvaltningen ändras.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Syftet är att revidera medborgarskapslagen i enlighet med regeringsprogrammet för statsminister Petteri Orpos regering genom att skärpa villkoren för naturalisation. Syftet är att befästa utgångspunkten att förvärv av medborgarskap förutsätter bevis på lyckad integration i samhället. Genom propositionen strävar man efter att främja att de utlänningar som är intresserade av ett finskt medborgarskap sätter in sig i hur samhället fungerar och i sådana centrala grundprinciper som stöder ett aktivt deltagande i samhället och som behövs för att fungera i samhället. &nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">I denna proposition föreslås ett nytt villkor för naturalisation. Enligt villkoret ska sökanden visa en tillräcklig nivå av samhällskunskap för att förvärva finskt medborgarskap. Utgångspunkten är att villkoret uppfylls genom att avlägga ett medborgarskapsprov med godkänt resultat. I provet mäts kunskaperna om hur det finländska samhället fungerar och dess grundprinciper samt kunskaperna om individens rättigheter och skyldigheter. I vissa fall kan man också visa att villkoret uppfylls genom studier som genomförts i Finland.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">För medborgarskapsprovet utvecklas ett helt nytt provsystem, vars genomförande förutsätter ny lagstiftning. Enligt förslaget svarar Migrationsverket för myndighetsuppgifterna i anslutning till medborgarskapsprovet. Det är fråga om ett allmänt förvaltningsansvar av systemet med medborgarskapsprov. I detta ingår förutom tillsyn och utveckling ingående av avtal som hänför sig till utarbetandet och ordnandet av medborgarskapsprovet med de i propositionen föreslagna aktörer som uppfyller villkoren.&nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">Enligt förslaget fogas ett nytt kapitel till medborgarskapslagen. I kapitlet föreskrivs närmare om det nya medborgarskapsprovet och dess genomförande, såsom innehållet i medborgarskapsprovet, utarbetandet och anordnandet av det samt om uppgifterna för den som utarbetar och anordnar provet. &nbsp;\u003C/p>\n   \u003Cp class=\"KappaleKooste\">De föreslagna lagarna avses träda i kraft vid ingången av 2027. &nbsp;\u003C/p>\n  \u003C/div>\n  \u003Cdiv class=\"PerusteluOsaYleisetPerustelut\" id=\"PerusteluOsaYleisetPerustelut\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">UTSKOTTETS ÖVERVÄGANDEN\u003C/h2>\n   \u003Cdiv class=\"PerusteluLuku\">\n    \u003Ch3 class=\"ValiotsikkoTeksti\">Bakgrund\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Regeringsprogrammets skrivningar om medborgarskapslagen har genomförts stegvis i tre projekt vid inrikesministeriet. I den första fasen gjordes ändringar i boendetidsvillkoret. I den andra fasen genomfördes de ändringar enligt regeringsprogrammet som gällde utredd identitet, nationell säkerhet, oförvitlighet och försörjningsförutsättning samt förlust av medborgarskap. Förslagen i den aktuella propositionen gäller den tredje, dvs. sista, fasen av ändringarna i medborgarskapslagen. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">I propositionen föreslås det att de allmänna förutsättningarna för naturalisation kompletteras med ett nytt krav på samhällskunskaper, det vill säga i princip ett godkänt avläggande av medborgarskapsprov. Den som ansöker om medborgarskap förutsätts i fortsättningen ha tillräckliga kunskaper i det finländska samhället på finska eller svenska. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Syftet med ändringen är att stärka påvisandet av lyckad integration som utgångspunkt för förvärv av medborgarskap. Propositionen syftar till att främja att de utlänningar som är intresserade av ett finskt medborgarskap sätter sig in i hur samhället fungerar och i sådana centrala grundprinciper som stöder ett aktivt deltagande i samhället och som behövs i samhället. Syftet med medborgarskapsprovet är att på ett tillförlitligt och jämlikt sätt testa deltagarnas kunskaper om det finländska samhället.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Förvaltningsutskottet anser det viktigt att de som ansöker om medborgarskap har grundläggande kunskaper om det finländska samhället och om rättigheterna och skyldigheterna. Samhällskunskapsvillkoret kan i bästa fall stödja integration, delaktighet och samhällelig förankring. Även i andra länder är det enligt utredning ett relativt allmänt krav att kunna påvisa uppgifter om samhället genom ett medborgarskapsprov.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Sammantaget anser utskottet att propositionen behövs och fyller sitt syfte och att den beretts väl. Utskottet tillstyrker förslagen, men med följande kommentarer.&nbsp;\u003C/p>\n    \u003Ch3 class=\"ValiotsikkoTeksti\">Påvisande av samhällskunskaper\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Propositionen utgår från att samhällskunskaperna ska påvisas genom medborgarskapsprov. Enligt propositionen förutsätts det i praktiken att samhällskunskaper ska påvisas av personer i arbetsför ålder. Enligt 17 b § 2 mom. gäller villkoret inte personer under 18 år eller personer som har fyllt 65 år. Avvikelse från villkoret kan dessutom göras, om sökanden på grund av sitt hälsotillstånd eller sin funktionsnedsättning inte kan uppfylla villkoret eller om det annars finns synnerligen vägande skäl att avvika från villkoret (17 b § 3 mom.).&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Utöver medborgarskapsprovet kan samhällskunskaperna påvisas genom studentexamen eller högskoleexamen som avlagts på finska eller svenska. I högskoleexamina ingår både universitets- och yrkeshögskoleexamina som avlagts i Finland. Förvaltningsutskottet anser det motiverat att en person som redan har fått kunskaper som kan jämställas med de kunskaper som testas i medborgarskapsprovet inte behöver påvisa sina kunskaper på nytt genom medborgarskapsprov.&nbsp;\u003C/p>\n    \u003Ch3 class=\"ValiotsikkoTeksti\">Medborgarskapsprov\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Enligt den föreslagna 25 a § i medborgarskapslagen genomförs medborgarskapsprovet som flervalsprov. Enligt utredning till utskottet kan man självständigt förbereda sig för medborgarskapsprovet genom att studera de allmänt tillgängliga läromedlen för medborgarskapsprovet. Vid genomförandet av provet beaktas också den språkkunskapsnivå som krävs för naturalisation. Frågorna i provet ska enligt förslaget gälla den viktigaste finländska lagstiftningen, grundläggande fri- och rättigheter, mänskliga rättigheter, jämlikhet, jämställdhet samt Finlands historia och kultur. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Enligt utredning till utskottet hör det inte till uppgifterna för den som upprättar medborgarskapsprovet att producera helt nytt innehåll för provet. Avsikten är att läromedlen till innehåll och omfattning ska motsvara läromedlen i samhällsorientering, som har utarbetats uttryckligen för att främja integrationen av dem som deltar i samhällsorienteringen. Enligt erhållen utredning görs medborgarskapsprovet också upp inom ramen för den föreslagna 25 a § och till denna del görs ingen ändamålsenlighetsprövning i samband med utarbetandet av medborgarskapsprovet. Medborgarskapsprovet, dess läromedel och provets ämnesområden handlar om grundläggande kunskaper om det finländska samhällets funktion samt individens rättigheter och skyldigheter. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Enligt den föreslagna 25 b § i medborgarskapslagen ingår Migrationsverket ett avtal om skaffande av frågor, svarsalternativ och läromedel för medborgarskapsprovet med ett universitet eller någon annan aktör på universitetsnivå som har tillräcklig sakkunskap för uppdraget. En annan aktör på universitetsnivå kan till exempel vara flera universitet tillsammans eller ett universitet i samarbete med en yrkeshögskola. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Förvaltningsutskottet konstaterar att avläggandet av medborgarskapsprovet kommer att få en betydande roll i att förvärva finskt medborgarskap. Genom provet ska det vara möjligt att tillförlitligt testa deltagarens kunskaper om det finländska samhället samt om individens rättigheter och skyldigheter. Därför ser utskottet det som angeläget att den som utarbetar medborgarskapsprovet har bred sakkunskap på hög nivå, inte bara inom provets ämnesområde utan också om formuleringen av frågor och svar som baserar sig på informationen i läromedlet och om hur språket i provet och läromedlet anpassas till rätt nivå.&nbsp;\u003C/p>\n    \u003Ch3 class=\"ValiotsikkoTeksti\">Särskilda arrangemang\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Förvaltningsutskottet lyfter fram att den föreslagna 25 g § i medborgarskapslagen också beaktar personer som på grund av sjukdom, funktionsnedsättning, särskilda läs- och skrivsvårigheter eller av någon annan därmed jämförbar orsak är förhindrade att avlägga medborgarskapsprov på samma sätt som andra som avlägger prov. Förvaltningsutskottet anser det viktigt att provet i dessa situationer kan avläggas med hjälp av särskilda arrangemang.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Förvaltningsutskottet påpekar i detta sammanhang också att Migrationsverket i fortsättningen bedömer påvisandet av avsaknad av läs- och skrivkunnighet både för beviljande av de ovan nämnda särskilda arrangemangen i medborgarskapsprovet och för avvikelse från språkkunskapsvillkoret. Om en sökande på grund av avsaknad av läs- och skrivkunnighet i fortsättningen som särskilt arrangemang beviljas möjlighet att avlägga medborgarskapsprovet muntligen, anses han eller hon bevisligen sakna läs- och skrivkunnighet också i samband med ansökan om medborgarskap vid bedömningen av avvikelser från språkkunskapsvillkoret. Eftersom det är fråga om samma myndighets bedömning av påvisandet av avsaknad av läs- och skrivkunnighet enligt 18 b § 2 och 3 mom. i medborgarskapslagen är det motiverat att myndigheten, dvs. Migrationsverket, inte längre gör en ny bedömning av samma omständighet i ansökningsfasen, anser utskottet.&nbsp;\u003C/p>\n    \u003Ch3 class=\"ValiotsikkoTeksti\">Omprövning\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Det föreslås att 41 § i medborgarskapslagen kompletteras med nya 2 och 3 mom. där det föreskrivs om ett omprövningsförfarande. Enligt utredning till förvaltningsutskottet kommer medborgarskapsprovet att genomföras på ett sätt som innebär att det i princip inte finns något rum för tolkning när det gäller huruvida testresultatet är godtagbart. Förfarandet med begäran om omprövning behövs framför allt för att utreda om till exempel någon teknisk störningssituation utgjort ett hinder för att avlägga provet med godkänt resultat. Det föreslagna utlåtandeförfarandet är avsett för situationer där begäran om omprövning har framställts på grund av att flervalsfrågorna lämnat rum för tolkning. Utlåtande behöver således inte alltid begäras, utan Migrationsverket kan behandla till exempel omprövningsbegäranden som gäller en teknisk störningssituation utan sakkunnigutlåtande från sakkunnigkommissionen. Begäran om utlåtande beror således på innehållet i begäran om omprövning. &nbsp;\u003C/p>\n    \u003Ch3 class=\"ValiotsikkoTeksti\">Resursfördelning\u003C/h3>\n    \u003Cp class=\"KappaleKooste\">Enligt uppskattningar uppgår engångskostnaderna för de inledande investeringarna i medborgarskapsprovet enligt propositionen till sammanlagt cirka 4,2 miljoner euro och de bestående kostnaderna till cirka 2,35 miljoner euro. Ett eventuellt behov av tilläggsanslag bedöms i samband med beredningen av den andra tilläggsbudgeten för 2026. De bestående kostnaderna täcks med deltagaravgifterna under en längre tid. Ändringarna avses träda i kraft vid ingången av 2027. &nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Utskottet fäster särskild uppmärksamhet vid Migrationsverkets centrala roll vid genomförandet av reformen. I och med propositionen kommer verket att få nya uppgifter bland annat när det gäller beredning och ordnande av medborgarskapsprov, datasystem, betalningar och behandling av omprövningsbegäranden. För att dessa ska kunna skötas på behörigt sätt krävs tillräckliga personalresurser, ekonomiska resurser och datasystem.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Utskottet betonar att Migrationsverket redan tidigare har fått en hel del nya uppgifter. I regeringsprogrammet ingår ett omfattande reformpaket för att effektivisera tillståndssystemet och skärpa utlännings- och medborgarskapslagstiftningen. Utskottet har redan behandlat en stor del av paketet. Dessa ändringar har bedömts öka verkets arbetsbörda åtminstone i övergångsskedet, även om till exempel antalet asylansökningar på längre sikt kan väntas minska. Dessutom börjar lagstiftningen om reformen av EU:s migrations- och asylpolitik tillämpas sommaren 2026.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Utskottet ser det som nödvändigt att reformernas samlade konsekvenser beaktas i Migrationsverkets resurser. Otillräckliga resurser kan leda till längre behandlingstider och försvaga systemets funktion och de sökandes rättssäkerhet.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Utskottet anser det viktigt att resurserna fördelas på ett ändamålsenligt sätt vid Migrationsverket. Verket har satsat på automation och IKT-utveckling, vilket redan har gjort processerna smidigare. Det är motiverat att fortsätta med dessa åtgärder, inbegripet en utvidgning av användningen av artificiell intelligens. Utvecklingsåtgärderna ersätter dock inte tillräckliga basresurser. Utskottet anser dessutom att det är viktigt att möjligheterna att minska antalet ärenden som behandlas vid Migrationsverket aktivt utreds. Om det görs alltför stora besparingar i omkostnaderna finns det risk för att behandlingstiderna förlängs och den eftersträvade effektivitetsvinsten inte uppnås.&nbsp;\u003C/p>\n    \u003Cp class=\"KappaleKooste\">Utskottet betonar att Migrationsverkets resurser ska vara tillräckliga och förutsägbara både för beredningen och genomförandet av reformerna.&nbsp;\u003C/p>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"PaatosOsa\" class=\"PaatosOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">FÖRSLAG TILL BESLUT\u003C/h2>\n   \u003Cdiv class=\"PaatosToimenpide\">\n    \u003Cp class=\"JohdantoTeksti\">Förvaltningsutskottets förslag till beslut:\u003C/p>\n    \u003Cspan class=\"SisennettyKappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">Riksdagen godkänner lagförslag 1—3 i proposition RP 54/2026 rd utan ändringar.\u003C/span>&nbsp;\u003C/span>\n   \u003C/div>\n  \u003C/div>\n  \u003Cdiv id=\"OsallistujaOsa\" class=\"OsallistujaOsa\">\n   \u003Cdiv class=\"PaivaysKooste\">Helsingfors 27.5.2026&nbsp;\u003C/div>\n   \u003Cp class=\"JohdantoTeksti\">I den avgörande behandlingen deltog\u003C/p>\n   \u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">vice ordförande&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Pihla&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Keto-Huovinen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saml&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Alviina&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Alametsä&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">gröna&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Eveliina&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Heinäluoma&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Hänninen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saml&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Mari&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Kaunistola&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saml&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Anna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Kontula&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vänst&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Rami&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Lehtinen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saf&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Mira&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Nieminen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saf&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Saku&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Nikkanen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Hanna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Räsänen&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">cent&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Paula&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Werning&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Joakim&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Vigelius&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saf&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Juha&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Viitala&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">sd&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">medlem&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Ben&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Zyskowicz&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saml&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">ersättare&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Jenna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Simula&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saf&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">ersättare&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Henrik&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Vuornos&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">saml.&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\n   \u003Cp class=\"JohdantoTeksti\">Sekreterare var\u003C/p>\n   \u003Cspan class=\"Toimija\">\u003Cspan class=\"TarkennusAsemaTeksti\">plenarråd&nbsp;\u003C/span> \n    \u003Cdiv class=\"Henkilo\">\n     \u003Cspan class=\"EtuNimi\">Sanna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Helopuro.&nbsp;\u003C/span>\n    \u003C/div>&nbsp;\u003C/span>\n  \u003C/div>\n  \u003Cdiv id=\"JasenMielipideOsa-1\" class=\"JasenMielipideOsa\">\n   \u003Ch2 class=\"edk-OtsikkoTeksti\">Reservation\u003C/h2>\n   \u003Cdiv class=\"PerusteluOsa\" id=\"PerusteluOsa\">\n    \u003Ch2 class=\"edk-OtsikkoTeksti\">Motivering\u003C/h2>\n    \u003Cdiv class=\"PerusteluLuku\">\n     \u003Ch3 class=\"ValiotsikkoTeksti\">Allmänt\u003C/h3>\n     \u003Cp class=\"KappaleKooste\">Syftet med propositionen är att skärpa villkoren för naturalisation. Den som ansöker om medborgarskap ska påvisa en tillräcklig nivå på samhällskunskaper för förvärv av finskt medborgarskap, och i princip ska man påvisa att villkoret är uppfyllt genom att avlägga ett medborgarskapsprov med godkänt resultat. De gröna och Vänsterförbundet ifrågasätter uppnåendet av målen för medborgarskapsprovet och deras ändamålsenlighet i en situation där finansieringen av och tillgången till integrationstjänster försvagas. Inte heller jämlikhetsproblemen i propositionen har lösts vid utskottsbehandlingen. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Under denna regeringsperiod har villkoren för medborgarskap redan blivit klart strängare, och när personen avlägger provet är han eller hon i verkligheten redan i mycket hög grad integrerad. De redan gällande förutsättningarna för medborgarskap, såsom åtta års vistelse i landet, försörjningsförutsättningen, oförvitligheten och avklarad allmän språkexamen, skapar tillräckliga förutsättningar för att ansöka om medborgarskap. Migrationsverkets behandlingstid för medborgarskapsansökningar är redan nu i genomsnitt 34 månader för både barn och vuxna, och medborgarskapsprovet förlänger processerna ytterligare. Den extra byråkrati som medborgarskapsprovet medför får inte förlänga de nuvarande ansökningstiderna. Med nuvarande resurser kommer effekten sannolikt att bli den motsatta.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">De problem som lyfts fram i sakkunnigyttrandena har inte lösts vid beredningen. I yttrandena har det framförts att förberedelserna för och avläggandet av ett eventuellt prov inte ökar delaktigheten och integrationen i det finländska samhället, utan skyldigheten att avlägga medborgarskapsprov kan fördröja den. Utan lämpligt stöd kan provet öka den psykologiska stressen, särskilt för utsatta personer. Det finns inte heller några garantier för att avläggandet av ett flervalsprov i själva verket skulle ge uttryck för förtrogenhet med och förankring i samhället och dess grundläggande värderingar, lagar och arbetssätt, vilket är syftet med provförfarandet.&nbsp;\u003C/p>\n     \u003Ch3 class=\"ValiotsikkoTeksti\">Kostnader för provet\u003C/h3>\n     \u003Cp class=\"KappaleKooste\">I propositionen föreslås det att de uppskattade permanenta årliga kostnaderna för medborgarskapsprovet, 2,35 miljoner euro, ska betalas av dem som utför provet. Den bedömning av priset på provet som presenteras i propositionen ligger dock inte i linje med Familia ry:s kalkyler, enligt vilka kostnaderna för provet stiger till 235–470 euro i stället för 190 euro i och med det beräknade antalet årliga deltagare. Detta ökar risken för att alla inte har lika ekonomiska möjligheter att ansöka om medborgarskap. Att högskoleutbildade befrias från provet i kombination med att provet är avgiftsbelagt förvärrar den socioekonomiska åtskillnaden mellan invandrargrupperna. Dessutom kan provet, i synnerhet om dess svårighetsgrad är för hög, leda till att det införs avgiftsbelagda träningstjänster, vilket ökar risken särskilt för att de som har det sämst ställt inte kan delta på lika villkor.&nbsp;\u003C/p>\n     \u003Ch3 class=\"ValiotsikkoTeksti\">Genomförande av provet och säkerställande av jämlikheten\u003C/h3>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet ska enligt planerna genomföras som elektroniskt flervalsprov. Detta äventyrar jämlikheten, eftersom sättet att genomföra provet kan göra att personer med svag läs- och skrivkunnighet, neurodivergens, funktionsnedsättning, låg utbildningsbakgrund, inlärningssvårigheter eller hög ålder behandlas ojämlikt. Alla sökande bör garanteras lika villkor för att avlägga provet.&nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Det finns också en risk för att provet i stället för faktiska samhällskunskaper mäter de språkliga och digitala färdigheterna eller teststrategin. Det kan vara till fördel för vissa sökande och till nackdel för andra. Provet bör inte heller lägga fokus på historisk, kulturell eller samhällelig kunskap som praktiskt taget kräver att man gått i skola i Finland och som inte ens kan avkrävas alla nuvarande finska medborgare. &nbsp;\u003C/p>\n     \u003Cp class=\"KappaleKooste\">Medborgarskapsprovet bör inte införas nu när regeringens nedskärningar har drabbat integrationstjänsterna, de organisationer som stöder integrationen och de kommuner som har organiseringsansvaret för integrationstjänsterna. &nbsp;\u003C/p>\n    \u003C/div>\n   \u003C/div>\n   \u003Ch3 class=\"LihavaKursiiviOtsikkoTeksti\">Förslag\u003C/h3>\n   \u003Cdiv id=\"PonsiOsa\" class=\"PonsiOsa\">\n    \u003Cspan class=\"sr-only\">Kläm&nbsp;\u003C/span>\n    \u003Cp class=\"JohdantoTeksti\">Jag föreslår\u003C/p>\n    \u003Cspan class=\"SisennettyKappaleKooste\">\u003Cspan class=\"KursiiviTeksti\">att riksdagen förkastar lagförslagen.\u003C/span>&nbsp;\u003C/span>\n   \u003C/div>\n   \u003Cdiv class=\"SuppeaAllekirjoitusOsa\">\n    \u003Cdiv class=\"SuppeaPaivays\">\n     \u003Cdiv class=\"AjankohtaTeksti\">Helsingfors 27.5.2026\u003C/div>\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cspan class=\"EtuNimi\">Anna&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Kontula&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">vänst&nbsp;\u003C/span>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n    \u003Cdiv class=\"Allekirjoittaja\">\n     \u003Cdiv class=\"Henkilo\">\n      \u003Cspan class=\"EtuNimi\">Alviina&nbsp;\u003C/span>\u003Cspan class=\"SukuNimi\">Alametsä&nbsp;\u003C/span>\u003Cspan class=\"LisatietoTeksti\">gröna&nbsp;\u003C/span>\n     \u003C/div>\n     &nbsp;\n    \u003C/div>\n   \u003C/div>\n  \u003C/div>\n \u003C/div>\n\u003C/div>",edktunnus:"EDK-2026-AK-31505",nav:"\u003Cnav id=\"VaskiNavi\">\n \u003Cspan class=\"edk-title-h4\" id=\"SisallysluetteloTitle\">Innehållsförteckning\u003C/span>\n \u003Cul id=\"Sisallysluettelo\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"#IdentifiointiOsa\">Identifieringselement\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#AsiaKuvaus\">Inledning\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#SisaltoKuvaus\">Huvudsakligt innehåll\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#PerusteluOsaYleisetPerustelut\">Allmän motivering\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#PaatosOsa\">Beslut\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#OsallistujaOsa\">Deltagare\u003C/a>\u003C/li>\n  \u003Cli>\u003Ca href=\"#JasenMielipideOsa-1\">Reservation 1\u003C/a>\u003C/li>\n \u003C/ul>\n \u003Cspan class=\"edk-title-h4\" id=\"KasittelytiedotTitle\">Behandlingsinformation\u003C/span>\n \u003Cul id=\"Kasittelytiedot\" class=\"navbar-nav nav\">\n  \u003Cli>\u003Ca href=\"/sv/arenden-och-omrostningar/riksdagsarenden/RP%2054%2F2026%20rd\" class=\"navilink\">RP 54/2026 rd\u003C/a>\u003C/li>\n \u003C/ul>\n\u003C/nav>"},uses:{params:["edktunnus"]}}],
